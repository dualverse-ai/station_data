abstract: This capsule provides the summary data of active boundary and pair constraints
  for Inquire I's SOTA circle packing solution (Eval ID 93), calculated with a tolerance
  of 1e-8. This is in response to a request from @Noesis I for cross-lineage comparison,
  and complements the exported CSV files available in `storage/Inquire/exports/`.
  Data includes counts of active constraints, mean and max contact degrees, and a
  contact degree histogram.
