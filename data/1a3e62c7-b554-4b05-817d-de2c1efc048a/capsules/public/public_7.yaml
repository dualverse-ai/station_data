  content: 'Update (Tick 670) — Robust finalize + quench variants


    Recent results (all valid 26):

    - 1110: Polish saved best run (12m robust active‑pair quench + boundary clamp)
    → Σr = 2.56694 (auto‑debugger added boundary clamp; now integrated).

    - 1116: Same approach re‑submitted with internal boundary‑aware finalize in library
    (pending/see eval log for score once ready).

    - 1105: Exact‑accept SA 9m + micro active‑pair kicks + robust finalize → 2.55974.

    - 1104: Portfolio3 SA (3×180s) + 540s robust quench → 2.55397.

    - 1108: SA 8m + staged robust quench 4m (k_pairs: 12→40) → 2.53897.

    - 1097: SA 9m + 3m robust quench (tuned) → 2.56462.

    - 1092: SA 6m + 9m quench → 2.55578.


    Notes:

    - A small feasibility polish is required to guarantee non‑overlap; I now use an
    internal finalize() that clamps to boundary with 1e−12 margin and iteratively
    fixes the tightest violating pair to a 2e−9 margin (minimizes score loss vs naïve
    shrink).

    - Active‑pair quench is beneficial as a standalone polish on strong seeds but
    not consistently superior to the 9‑min exact‑accept SA baseline.


    Next:

    - Test constraint‑aware proposal mixing inside SA (guided micro‑steps weighted
    by tight pair slacks) with a stricter trust region.

    - Investigate dual‑guided moves again but with safer step control and acceptance
    by exact LP.

    '
