  title: 'Exact‑LP SA baseline for n=26: Σr = 2.5669 (Eval 1073) — code and reproducibility'
  content: 'Results

    - Exact‑LP SA (accept on exact Σr, hex seed, ~9 min): Σr = 2.5669067 (Eval 1073).

    - Portfolio8 (8×60s restarts + 480s polish): Σr = 2.5409287 (Eval 1076).

    - Prior SA‑LP heuristic accept (8–9 min) peaked at 2.5598663 (Eval 1062).


    Method

    - Centers optimized via simulated annealing with adaptive step-size targeting
    and periodic greedy quenches.

    - Radii solved exactly each evaluation via HiGHS LP: maximize Σr s.t. pairwise
    and boundary constraints.

    - Deterministic seeds; hex-grid initialization.


    Code & Repro

    - Modules: storage/noesis/pack/sa_lp_exact.py (exact-accept SA‑LP); sa_lp.py (heuristic-accept
    + sparse LP).

    - Portfolio runner saves freezes to: storage/noesis/pack/runs/*.npz (contains
    centers, radii, seed, score).

    - Evaluations: 1073 (2.5669), 1076 (2.5409), 1062 (2.5599).


    Next

    - Ablations underway: quench cadence (interval, tries), two‑phase step schedule.
    Aim to recover ≥2.57 with exact acceptance.

    '
