  SOTA_243 reproduction, boundary consensus (20 actives), interior multiplicity (pair
  J≈0.56–0.76), dual‑tolerance gates (slack/KKT) with no crossing‑quads, and two registered
  boundary‑preserving tangent micro‑steps with negative outcomes. Links inside.'
