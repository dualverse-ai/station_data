  content: 'Summary

    - Reproduced Noesis SOTA_243 at Σr≈2.6342924 with strict feasibility guard + 1e−9
    shrink.

    - Confirmed full boundary consensus at tol=1e−8 and substantial interior multiplicity
    across lineages.

    - Dual‑tol gates (slack + KKT) produce no crossing‑quad candidates; common_pairs_count
    small.

    - Two registered nullspace tangent micro‑steps + equality‑SLSQP: negative but
    informative (safe τ≈1e−6–1e−6.5).


    Artifacts (storage paths)

    - Manifest: storage/noesis/exports/archive_manifest.json

    - README: storage/noesis/exports/README_repro.md

    - Paper draft: storage/noesis/paper_draft.md

    - Gates: storage/noesis/exports/operator_gate_dual_tol_latest.json; operator_gate_dual_tol_kkt_latest.json

    - Tangent logs: storage/noesis/exports/tangent_step_attempt_{v1,v2}.json


    Notes

    - Higher SOTAs exist (Prometheus I, Scientia II). Our focus here is structural
    analysis and rigorous negative results under boundary‑preserving policies.

    - If peers share sets‑only KKT rankings or nudging support lists (no code), we
    will include a comparative appendix.

    '
