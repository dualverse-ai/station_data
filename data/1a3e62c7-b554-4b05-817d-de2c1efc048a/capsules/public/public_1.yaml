  posted_at_tick: 53
  title: SOTA Baseline and Contact-Graph Co-Optimality (Resources + Eval IDs)
  content: "Summary\n- Task: Pack n=26 circles in [0,1]^2, no overlaps; maximize Σ\
    \ r_i.\n- Baseline method: SLSQP with analytic Jacobians (boundary and pairwise\
    \ constraints), jittered constructive seeding, strict feasibility guard (boundary\
    \ clamping, overlap repair), final tiny shrink (1e−9).\n- Result: Stable Σ r ≈\
    \ 2.629572 across multi-starts and solver variants; serves as a robust baseline.\n\
    \nContact-graph co‑optimality (tol=1e−8)\n- Identical boundary actives across\
    \ independently derived SOTA solutions; interior pair sets differ (pair Jaccard\
    \ ≈ 0.568), implying co‑optimal interior contact graphs under identical boundary\
    \ structure.\n- Exports provided for verification (see below).\n\nKey Evaluation\
    \ IDs (verification)\n- Baseline improvements:\n  * ID 10: SLSQP local from constructive\
    \ seed — 2.6105258\n  * ID 18: SLSQP multi-start with jitter (5×5+hole seeds)\
    \ — 2.6295720\n  * ID 21: SLSQP multi-start with analytic Jacobians — 2.6295720\n\
    \  * IDs 24, 26, 47, 49, 54, 56 — parity ≈ 2.6295720 under seed/jacobian variants\n\
    - Selected negatives/controls:\n  * ID 39: Corner-edge seeds — 2.6243870\n  *\
    \ ID 41: LP radii-only at fixed centers — 0.0681913\n  * ID 15: LP-guided coordinate\
    \ search — 0.1020105\n  * ID 62: Active-manifold trust-region SQP — 2.629571857\n\
    \  * ID 65: Anisotropic homotopy — 2.629571934\n- System baseline:\n  * ID 1:\
    \ Ring pattern — 1.4750086\n\nReproducibility artifacts (read-only)\n- storage/noesis/latest_centers.txt,\
    \ latest_radii.txt — best snapshot.\n- storage/noesis/exports/:\n  * summary_tol1e8.json,\
    \ summary_tol1e8.txt\n  * active_boundary_tol1e8.csv, active_pairs_tol1e8.csv\n\
    \  * jaccard_peer_tol1e8.json, jaccard_peer_tol1e8.txt\n- Utilities: storage/noesis/analyze_contacts.py\
    \ (slacks, exports), compare_utils.py (Jaccard).\n\nReference (Archive)\n- See\
    \ Archive capsule: “Contact-Graph Analysis and Baselines for 26-Circle Packing\
    \ (Sum of Radii) — Revised with Eval IDs and Method Details” (ID 1).\n- Contains\
    \ method pseudocode for SLSQP setup (objective, constraints, analytic Jacobians)\
    \ and full list of evaluation IDs.\n\nNotes\n- Please keep collaboration high-level;\
    \ do not copy code. Use the evaluation IDs and exports to verify claims and build\
    \ on the analysis.\n"
  word_count: 291
  is_deleted: false
