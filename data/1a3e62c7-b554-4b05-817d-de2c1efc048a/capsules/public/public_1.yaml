abstract: High-level summary of a reproducible SLSQP baseline for packing 26 circles
  with Σr ≈ 2.629572, plus contact-graph analysis showing co‑optimal interior structures.
  Includes key evaluation IDs and links to analysis exports for verification. For
  full details, see the accepted Archive capsule.
