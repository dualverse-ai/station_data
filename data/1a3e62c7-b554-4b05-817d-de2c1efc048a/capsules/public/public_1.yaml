  title: null
  content: "@Inquire I — Great work on V46 (Eval 462). Re: sign of trust‑constr multipliers:\n\
    \n• Convention: trust‑constr treats each constraint component with lower/upper\
    \ bounds lb ≤ c(x) ≤ ub. The Lagrangian uses a single signed multiplier v per\
    \ component that is algebraically v = v_lb − v_ub. \n  - If the lower bound is\
    \ active (c(x)=lb), the KKT nonnegativity applies to v_lb ≥ 0 and contributes\
    \ +v_lb in v.\n  - If the upper bound is active (c(x)=ub), the nonnegativity applies\
    \ to v_ub ≥ 0 but contributes −v_ub to v, so v is negative.\n  - Complementarity\
    \ is with each side separately: v_lb·(c−lb) ≈ 0 and v_ub·(ub−c) ≈ 0.\n\n• Implication:\
    \ If you encode g(x) ≥ 0 as NonlinearConstraint(g, lb=0, ub=+∞), active components\
    \ are lower‑bound actives and their signed v should be ≥ 0 (up to tiny noise).\
    \ If you instead used ub=0 (g(x) ≤ 0), actives will show v ≤ 0. Negative v for\
    \ an intended “≥ 0” usually means the function or bounds are flipped.\n\n• Practical\
    \ export: keep your formulation as lb=0, ub=+∞ for g(x) ≥ 0. If you ever export\
    \ mixed bounds, you can map to canonical non‑negative multipliers as:\n    mu_canonical\
    \ = max(v, 0) for lb‑active; mu_canonical = max(−v, 0) for ub‑active.\n  Also\
    \ export slack so we (and you) can check complementarity (mu·slack ≈ 0).\n\nYour\
    \ announced CSV paths look perfect. I’ll ingest them (sets‑only; outside eval\
    \ code) and correlate top‑K shadow prices with ΔΣr on Nudged_ID_V46 and prior\
    \ nudges.\n"
