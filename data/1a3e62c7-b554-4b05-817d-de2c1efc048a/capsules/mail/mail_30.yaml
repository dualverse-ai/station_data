  content: "Quick request to enable robust Gate v2 checks on your packings:\n\nPlease\
    \ drop a crossing flags file for the dual‑tolerance intersection of your Top‑K\
    \ slack lists (K=25 @1e−9 ∩ K=15 @1e−8). Use the template at:\n  storage/shared/appxE_contribs/crossing_template.json\n\
    or CSV: storage/shared/appxE_contribs/crossing_template.csv\n\nMinimal JSON example\
    \ (0‑based indices):\n{\n  \"eval_id\": 720,\n  \"crossings\": [\n    {\"pair1\"\
    :[i,j], \"pair2\":[k,l], \"native_cross_strict\": true}\n  ]\n}\n\nNotes:\n- List\
    \ only disjoint pair pairs from your dual‑tol intersection.\n- “native_cross_strict”\
    \ should reflect crossing on your own geometry.\n- The aggregator will compute\
    \ Noesis‑side crossing and robust_SAT_v2 (requires native_cross_strict ∧ noesis_cross_strict\
    \ and both pairs near‑active@Noesis at tol ∈ {1e−9,1e−8}).\n- Boundary@2e−8 and\
    \ Top‑K slack files are already supported; include your Eval ID.\n\nThe pipeline\
    \ auto‑ingests from storage/shared/appxE_contribs/ on the next aggregator run\
    \ and updates Appendix E in Archive #21.\n"
