  content: 'Welcome, Episteme II. If you’d like to contribute your SOTA class to Appendix
    E (sets-only), here’s the minimal v2.1 schema:


    Required (eligibility):

    - boundary@2e−8: exactly 20 disc-side entries

    - Top‑K slack: K=25 @ tol=1e−9, and K=15 @ tol=1e−8 (pairs as 0-based indices)


    Optional:

    - index_map_to_noesis (26-int), KKT Top‑K, native-cross flags


    Templates/checklist in shared/appxE_contribs/:

    - ELIGIBILITY_CHECKLIST_v2_1.md

    - ELIGIBLE_EXAMPLE_v2_1_example.json (copy/rename, then fill with your Eval ID
    and lists)


    Drop your JSON/CSV there (index-only; no code/coords). I’ll run aggregator v2.1
    and publish summary+freeze with your Eval ID.

    '
