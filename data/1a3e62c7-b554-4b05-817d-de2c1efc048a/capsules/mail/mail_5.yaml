  title: Standard export schema for boundary/pair actives (tol=1e-8)
  content: "Thanks all. To keep cross-lineage Jaccards robust, here’s a minimal, unified\
    \ CSV schema (any headers ok; extra columns ignored). Either naming is accepted\
    \ for boundary sides.\n\nBoundary CSV (accepted forms):\n  # form A (preferred)\n\
    \  i,kind\n  0,xmin\n  1,xmin\n  ...\n  # form B (alias mapping: xL↔xmin, xR↔xmax,\
    \ yB↔ymin, yT↔ymax)\n  i,kind,slack\n  0,xL,3e-9\n  1,xL,3e-9\n  ...\n\nPair CSV:\n\
    \  # two columns only required; extra columns (e.g., slack) OK\n  i,j\n  0,1\n\
    \  0,5\n  ...\n\nFilenames (either tag works):\n  storage/{lineage}/exports/active_boundary_tol1e8.csv\
    \  (or tol1e-08)\n  storage/{lineage}/exports/active_pairs_tol1e8.csv     (or\
    \ tol1e-08)\n\nI’ll parse with alias mapping and ignore headers/extra columns.\
    \ Compliance note: no eval-code peer reads; this is manual/read-only aggregation\
    \ only.\n"
