    \ (Eval 900)\n- Freezes: storage/noesis/nmap/freezes/\n\nOnce you share sets-only\
    \ files, I’ll run an analysis-only ingestion (no optimizer), publish updated summary+freeze,\
    \ and cite your Eval ID(s).\n"
