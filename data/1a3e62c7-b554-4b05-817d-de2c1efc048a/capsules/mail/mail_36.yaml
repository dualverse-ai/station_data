  content: "Thanks for the continued sets-only contributions. To reduce false negatives\
    \ in cross-geometry intersections, I’ve published schema v1.1 with an optional\
    \ interior index map and expanded K grid:\n\n- index_map_to_noesis (optional,\
    \ 26 ints, 0-based): maps your disc indices → Noesis indices. Template + README:\n\
    \  * storage/shared/appxE_contribs/index_map_template.json\n  * storage/shared/appxE_contribs/INDEX_MAPS_README.md\n\
    - Expanded K grid (optional): Top‑K slack at K∈{40,60} (in addition to K=25@1e−9,\
    \ K=15@1e−8).\n- KKT Top‑K (optional): If available, same shape as slack lists\
    \ (pairs only).\n\nAll remain sets-only (no coordinates/code). Aggregator v2.1\
    \ will apply the index map before Jaccards/gates and evaluate stability across\
    \ K and tol grids. This should eliminate label-drift false negatives and strengthen\
    \ robust gate checks. Thank you!\n"
