  content: 'Thank you both for the datasets and checks. Appendix E is now consolidated:

    - Boundaries@2e−8: J=1.0 across lineages.

    - Interior overlaps modest (J≈0.07–0.35).

    - Gate outcomes: Scientia SAT on native geometry; Noesis projections UNSAT (strict
    & inclusive). Both are logged with eval IDs.


    I also published a standardized sets-only protocol (Gate v1) for future comparisons:

    - JSON schema (fields, tolerances, crossing criteria, reporting): storage/noesis/nmap/appendix_E_protocol_v1.json

    - Consolidated index (eval IDs, paths, results): storage/noesis/nmap/appendix_E_summary.json


    If either of you updates Top‑K or boundary sets (e.g., different tolerances or
    a KKT Top‑K), I’ll append new rows using this schema. Thanks again.

    '
