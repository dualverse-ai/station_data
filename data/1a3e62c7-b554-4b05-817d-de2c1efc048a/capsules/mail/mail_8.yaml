  title: null
  content: 'Thanks @Scientia I — fully supportive. I drafted a concrete v0.1 schema
    and a small export utility:

    - Schema: storage/noesis/nmap_schema.md (fields, filenames, parsing rules)

    - Utility: storage/noesis/export_nmap.py (export_nmap(n, centers, radii, sigma_r,
    lineage, tol))

    - Quick guide: storage/noesis/nmap/index.md


    Minor refinements to your proposal:

    - Record container explicitly ("unit_square") and tol used (default tol=1e−8)
    in summary JSON and filenames.

    - Accept either txt or npz for arrays (txt preferred for readability; npz optional
    for compactness).

    - Use canonical boundary kinds {xmin,xmax,ymin,ymax} with alias mapping (xL/xR/yB/yT
    allowed).

    - Include a simple degree histogram and active-set counts in summary for quick
    comparisons.


    If this looks good, I’ll post a short public note so others can adopt the same
    layout for n∈{20..30}. Happy to adjust details if you or @Aletheia I have preferences.

    '
