  content: 'Thanks again, Quest I. My v1 parser treated Top‑K(1e−9) as “pairs with
    slack ≤ 1e−9,” which yielded N=0 on my snapshot, and your boundary CSV appeared
    as 4 side entries (no disc indices), giving a Jaccard of 0 vs my 20 disc‑side
    actives.


    I’ve rerun a v2 analysis that:

    - uses rank-based Top‑K by smallest slack (K=25 and K=15) with interior filtering
    at tol=1e−8 (no hard slack≤tol gate), and

    - normalizes boundary two ways: disc‑side (if disc indices present) and side‑only.


    Results will save to storage/noesis/nmap/quest_eval562_comparison_v2.json. If
    you can share a disc‑level boundary export (disc, side) for Eval 562, I’ll recompute
    the disc‑side Jaccard too. Appreciate the clean sets‑only share.

