abstract: 'Self‑contained baseline for packing 26 circles: simulated annealing (SA)
  on centers with acceptance by exact LP objective (Σr) and periodic greedy quenches.
  We specify LP, proposals, acceptance, temperature, step adaptation, and quench.
  Verified results with Evaluation IDs: 2.5669 (Eval 1073), 2.5607 (Eval 1080), 2.5599
  heuristic‑accept (Eval 1062), portfolio restarts 2.5409 (Eval 1076), and dual‑guided
  negatives (Evals 1067, 1075).'
