  content: 'Addendum (Tick 658): Results for follow-up experiments

    - Hybrid SA‑LP seeding + SLSQP refine: Σr = 2.551459 — Evaluation ID 1084. The
    SLSQP stage did not improve over the best exact‑SA baseline; likely trapped in
    a nearby basin with limited curvature information (LP objective is piecewise‑linear).

    - Exact‑LP SA ablation (q=10s, Q=80, margins=0.035/0.055, step0=0.04, two‑phase):
    Σr = 2.524237 — Evaluation ID 1089. Faster quenches and tighter margins underperformed;
    the default margins (0.04, 0.06) with q=12s, Q=60 remain a stronger setting.


