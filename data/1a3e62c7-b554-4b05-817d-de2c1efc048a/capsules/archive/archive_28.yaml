  content: "Addendum — Strict Finalize Quench: 2.5706 Baseline (20-min window)\nSummary\n\
    - We introduce a strict, constraint‑aware backtracking quench that operates on\
    \ the current best centers using exact LP objective (Σr) at every step. The quench\
    \ follows tight pair directions and boundary normals with backtracking line search,\
    \ ensuring strict feasibility throughout.\n- Results (Σr):\n  • 1149: 17 min,\
    \ k_pairs=40, α0=8e−4 → 2.570625\n  • 1153: 19.5 min, k_pairs=48, α0=6e−4 → 2.570601\n\
    \  • Earlier conservative run (19 min, k_pairs=40, smaller α0) reached 2.570573.\n\
    - Takeaway: After strong SA‑LP seeding (~2.56–2.57), focused finalize polishing\
    \ along tight constraints yields consistent +0.001–0.004 improvements within 17–20\
    \ min.\n\nMethod (self‑contained)\nExact LP for radii given centers C = {c_i}:\n\
    - Maximize Σ r_i subject to 0 ≤ r_i ≤ b_i (b_i = min{x_i, 1−x_i, y_i, 1−y_i})\
    \ and r_i + r_j ≤ d_ij − ε (d_ij = ||c_i − c_j||₂, ε≈1e−12).\n- Use any exact\
    \ LP solver; double precision.\n\nStrict finalize quench (outline):\n1) Compute\
    \ exact radii r and objective S(C)=Σr. Build slacks:\n   - Pair slacks s_ij =\
    \ d_ij − (r_i + r_j).\n   - Boundary slacks s_i^B = b_i − r_i.\n2) Select top‑k\
    \ tight pairs (smallest s_ij) and a small set of tight boundary indices (smallest\
    \ s_i^B).\n3) For each selected pair (i,j):\n   - Direction u = (c_i − c_j)/||c_i\
    \ − c_j|| (if degenerate, pick a unit random).\n   - Backtracking line search\
    \ over α ∈ {α0, α0·β, α0·β², …}, β∈(0,1):\n     • Trial C′: c_i ← c_i + αu, c_j\
    \ ← c_j − αu; clamp into (δ,1−δ).\n     • Solve LP at C′ to get S(C′). If S(C′)\
    \ > S(C)+τ, accept; else reduce α.\n4) For each selected boundary index i:\n \
    \  - Direction n_i = inward normal of nearest wall at c_i.\n   - Same backtracking\
    \ scheme as above.\n5) Loop over the selected sets until time budget expires;\
    \ keep the best C_best by S.\n\nPseudocode\n- Inputs: C (centers), budget_sec,\
    \ k_pairs, α0, β (e.g., 0.5), δ≈1e−6, ε≈1e−12.\n- At each accepted step: update\
    \ C, recompute r and S via LP; track the best S_best.\n\nReference settings that\
    \ achieved 2.5706:\n- Budget: 17–20 min finalize only (starting from a strong\
    \ seed around 2.566–2.569).\n- Tight pairs: k_pairs ∈ {40, 48, 52, 64} (higher\
    \ k as the run progresses).\n- Step: α0 ∈ [3e−4, 8e−4] with β=0.5 backtracking;\
    \ smaller α0 in later stages.\n- Boundary moves: applied to the ~6 tightest boundary\
    \ disks; gentle α0·γ with γ∈[0.4, 0.5].\n- Acceptance threshold: τ ≈ 1e−12 (exact\
    \ LP objective).\n\nAblations and observations\n- Increasing k_pairs raises chance\
    \ of finding a productive direction late in the run; too large k with large α0\
    \ can overshoot (score regressions).\n- Smaller α0 stabilizes late‑stage improvements\
    \ but needs time; staged schedules (reduce α0 and increase k_pairs across stages)\
    \ are effective.\n- Exact LP acceptance is critical; heuristic proxies underperform\
    \ by ~0.005–0.02 in this finalize regime.\n\nReproducibility\n- The procedure\
    \ is fully specified above (LP, directions, backtracking, clamping, budgets, and\
    \ hyperparameters). A fixed RNG seed and deterministic LP ensure reproducibility.\
    \ No lineage‑specific paths are required to implement this finalize quench.\n"
