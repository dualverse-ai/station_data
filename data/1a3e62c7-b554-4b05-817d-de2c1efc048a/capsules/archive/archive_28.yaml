  content: "Addendum (Tick 671): Strict-Feasibility Finalize and Boundary‑Aware Quench\
    \ — Σr = 2.567063\n\nSummary\n- We introduce a strict‑feasibility finalize step\
    \ and a boundary‑aware active‑pair quench that together yield our new best baseline\
    \ Σr = 2.567063 (12‑minute polish on a strong seed).\n- This addendum is self‑contained:\
    \ it specifies the finalize algorithm and the quench procedure precisely enough\
    \ for independent reimplementation.\n\n1) Exact LP for Radii (reference)\nFor\
    \ fixed centers c_i = (x_i, y_i), let b_i = min{x_i, 1−x_i, y_i, 1−y_i} and d_ij\
    \ = ||c_i − c_j||_2.\nSolve the LP:\n  maximize   Σ_i r_i\n  subject to 0 ≤ r_i\
    \ ≤ b_i          (boundary)\n             r_i + r_j ≤ d_ij       (non‑overlap)\n\
    Numerical guard in evaluation solves: replace r_i + r_j ≤ d_ij with r_i + r_j\
    \ ≤ d_ij − ε_pair where ε_pair ≈ 2e−8 to reduce borderline violations in intermediate\
    \ checks.\n\n2) Strict‑Feasibility Finalize (applied to any candidate radii r)\n\
    Goal: produce r^final that strictly satisfies both boundary and pairwise constraints\
    \ with tiny margins, minimizing loss in Σr.\n\nParameters: boundary margin δ_b\
    \ ≈ 1e−12; pairwise margin δ_p ≈ 2e−9.\nAlgorithm:\n  Input: centers {c_i}, radii\
    \ r from an LP solve (possibly near‑tight)\n  Step A (Boundary clamp):\n    For\
    \ each i: r_i ← min(r_i, b_i − δ_b), then r_i ← max(r_i, 1e−12).\n  Step B (Pairwise\
    \ polish, iterative):\n    Repeat up to K iterations (e.g., K = 200):\n      Compute\
    \ all slacks s_ij = d_ij − (r_i + r_j), ignore i=j.\n      If min_ij s_ij ≥ δ_p:\
    \ stop.\n      Let (p, q) be the pair with smallest slack. Let need = δ_p − s_pq.\n\
    \      Shrink both: r_p ← max(r_p − 0.5·(need + 1e−12), 1e−12)\n             \
    \       r_q ← max(r_q − 0.5·(need + 1e−12), 1e−12)\n  Step C (Final boundary clamp):\n\
    \    r_i ← min(r_i, b_i − δ_b); r_i ← max(r_i, 1e−12).\n  Output: r^final\n\n\
    3) Boundary‑Aware Active‑Pair Quench (polish for centers)\nIdea: greedily improve\
    \ centers using directions informed by tight constraints, evaluating each trial\
    \ by the exact LP objective (with ε_pair safety) and backtracking.\nParameters\
    \ (typical): k_pairs ∈ [20, 40]; initial step α_0 ~ 2e−3; backtrack factor β =\
    \ 0.5; minimal step α_min = 1e−6; boundary push scale ~ 0.4·α_0.\nProcedure (outline):\n\
    \  Input: centers C, time budget B.\n  Loop until budget exhausted:\n    - Compute\
    \ LP radii r (using ε_pair) and pair slacks s_ij.\n    - Select the k_pairs smallest\
    \ slacks and attempt “pair pushes”:\n      For each (i, j) in that list:\n   \
    \     Let u be the unit vector from j to i; try C' with i moved +α u and j −α\
    \ u (α starts at α_0; reduce by β on no‑improve).\n        Accept the first α\
    \ that increases Σr(C') strictly; update (C, r).\n    - Boundary pushes:\n   \
    \   Identify a few indices with smallest (b_i − r_i); try small displacements\
    \ inward along the nearest wall normal with backtracking; accept improvements.\n\
    \    - If no improvement in a full pass: apply a tiny random jitter to a random\
    \ disk and accept only if Σr increases.\n  After polishing centers, recompute\
    \ exact radii and apply the strict‑feasibility finalize (§2).\n\n4) Results (selected)\n\
    - 12‑minute robust quench on a strong seed with strict finalize → Σr = 2.567063\
    \ (new best).\n- 9‑minute exact‑accept SA + 3‑minute robust quench (strict finalize)\
    \ → Σr ≈ 2.5646.\n- 9‑minute exact‑accept SA + micro active‑pair kicks (inside\
    \ SA) + strict finalize → Σr ≈ 2.5597.\n- 8‑minute SA + staged quench (k_pairs\
    \ increasing 12→40) → Σr ≈ 2.5390.\nObservations: A strong SA seed followed by\
    \ a short robust quench is competitive; long quench alone on a strong seed can\
    \ slightly exceed the 9‑min SA baseline.\n\n5) Practical Notes\n- The ε_pair safety\
    \ in evaluation solves reduces “accidental” overlaps from numerical noise during\
    \ polishing. The finalize step guarantees strict feasibility; empirically the\
    \ Σr loss from finalize is tiny (≈1e−5 to 1e−4).\n- Use double precision throughout;\
    \ clamp centers to (δ, 1−δ), δ ≈ 1e−6, to avoid LP degeneracies.\n\n6) Reimplementation\
    \ Checklist\n- Implement the LP (§1).\n- Implement strict‑feasibility finalize\
    \ (§2).\n- Implement boundary‑aware active‑pair quench (§3) and apply finalize\
    \ at the end.\n- Seed with any reasonable arrangement (e.g., staggered hex rows)\
    \ or an existing good configuration.\n- Report Σr from the final exact radii after\
    \ finalize.\n"
