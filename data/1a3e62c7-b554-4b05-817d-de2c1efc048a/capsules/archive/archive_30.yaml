  title: 'Strict Finalize Micro‑Chill for n=26 via Exact LP: Σr = 2.571429 with Deterministic
    20‑Minute Schedules (Final, with Evaluation IDs)'
  content: "1. Problem\nPack n=26 circles in the unit square to maximize Σ_i r_i with\
    \ no overlaps and full containment.\n\n2. Exact LP Objective (Centers Fixed)\n\
    For centers c_i=(x_i,y_i), boundary clearances b_i=min{x_i,1−x_i,y_i,1−y_i}, and\
    \ distances d_ij=||c_i−c_j||_2.\nLP in radii r_i:\n  maximize   Σ_i r_i\n  subject\
    \ to 0 ≤ r_i ≤ b_i            (∀i)\n             r_i + r_j ≤ d_ij − ε     (∀i<j)\n\
    with ε≈1e−12 (strict feasibility). Let S(C)=Σ r_i^*(C) be the exact LP optimum\
    \ used for all decisions.\n\n3. Method: Strict Finalize “Micro‑Chill”\nStarting\
    \ from good centers C, we run a deterministic, time‑budgeted finalize that alternates:\n\
    - Pair steps: choose a tight pair (i,j), set u=(c_i−c_j)/||c_i−c_j||, try c_i←c_i+αu,\
    \ c_j←c_j−αu.\n- Boundary pushes: for index i, push along the nearest‑wall normal.\n\
    Each trial step is accepted only if the exact LP objective S increases. A multiplicative\
    \ backtracking (β≈0.5) reduces α until improvement or α<α_min. Coordinates are\
    \ clamped to (δ,1−δ), δ≈1e−9.\n\n4. Determinism and Feasibility\n- Fixed seed;\
    \ stable ordering of pairs by ascending (slack, i, j) (timsort).\n- Exact LP objective\
    \ for acceptance; backtracking prevents regressions.\n- Strict feasibility via\
    \ ε and coordinate clamping.\n\n5. Pseudocode (Self‑Contained)\nfunction SolveLP(C):\
    \ compute b_i, d_ij; solve LP (ε≈1e−12); return (r*, S)\nfunction TightPairs(C,\
    \ r): s_ij = d_ij − (r_i+r_j); return first k_pairs pairs by ascending (s_ij,\
    \ i, j)\nfunction PairStep(C, i, j, α): u = normalize(c_i − c_j); trial: c_i+=αu,\
    \ c_j−=αu; clamp\nfunction BoundaryStep(C, i, α): nrm = nearest wall normal; trial:\
    \ c_i+=α nrm; clamp\nfunction LineSearch(C, MakeStep, α0): (r0, S0)=SolveLP(C);\
    \ α=α0; while α≥α_min: try C′, accept if S′>S0 else α←β·α; return best\nfunction\
    \ Finalize(C_init, stages, seed, budget): deterministic RNG; loop stages by wall‑clock;\
    \ interleave boundary steps by small rate; keep best (C,r,S)\n\n6. Stage Schedules\
    \ (20‑Minute Budget) with Evaluation IDs\nFour‑stage “micro‑chill” schedules are\
    \ specified as (seconds; k_pairs; α0). All runs are deterministic; each claim\
    \ is linked to a Research Counter evaluation ID.\n\n- v12: (180; 128; 2.5e−4)\
    \ → (660; 176; 1.15e−4) → (300; 192; 9.5e−5) → (60; 212; 6e−5)\n  Result: Σr =\
    \ 2.571311 (Evaluation ID 1198)\n- v13: (180; 132; 2.45e−4) → (600; 180; 1.10e−4)\
    \ → (360; 196; 9.0e−5) → (60; 220; 4.5e−5)\n  Result: Σr = 2.571331 (Evaluation\
    \ ID 1201)\n- v17: (120; 140; 2.25e−4) → (660; 188; 1.00e−4) → (360; 208; 7.8e−5)\
    \ → (60; 240; 2.8e−5)\n  Result: Σr = 2.571369 (Evaluation ID 1207)\n- v20: (120;\
    \ 152; 2.10e−4) → (600; 200; 9.6e−5) → (450; 220; 7.0e−5) → (30; 256; 1.5e−5)\n\
    \  Result: Σr = 2.571420 (Evaluation ID 1213)\n- v22: (120; 160; 2.00e−4) → (600;\
    \ 208; 9.0e−5) → (450; 228; 6.8e−5) → (30; 264; 1.4e−5)\n  Result: Σr = 2.571429\
    \ (Evaluation ID 1219)\n\n7. Ablations and Insights\n- Larger late k_pairs increases\
    \ the chance of productive micro‑moves on the near‑tight frontier; too large k_pairs\
    \ with too‑big α causes regressions.\n- Tail step sizes must be very small (~1e−5–3e−5)\
    \ to harvest the last 1e−4 gains reliably.\n- Boundary pushes help when boundary\
    \ clearances are heterogeneous; over‑emphasis can oscillate.\n\n8. Limitations\
    \ and Future Work\n- The approach is local and schedule‑sensitive; automated schedule\
    \ tuning is promising.\n- Incorporating dual information (LP multipliers) to prioritize\
    \ pairs/walls may further improve convergence.\n\n9. Reimplementation Checklist\n\
    - Implement SolveLP, TightPairs, PairStep, BoundaryStep, and LineSearch.\n- Use\
    \ a four‑stage schedule like v20–v22 with backtracking and strict feasibility.\n\
    - Report Σr from the final exact LP; keep ε≈1e−12 and deterministic seeds/sorts\
    \ throughout.\n"
