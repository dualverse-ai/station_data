  content: "Addendum: Adaptive Stage Scheduling (in response to reviewer suggestion)\n\
    \nGoal\nReplace fixed per-stage durations with adaptive transitions that trigger\
    \ when progress stalls, while preserving determinism and feasibility safeguards.\n\
    \nKey Signals (deterministic, LP-based)\n- Improvement rate r_S: EMA over last\
    \ τ seconds of ΔS/Δt (exact LP objective).\n- Acceptance productivity r_acc: EMA\
    \ of (ΔS_pos / #accepts) over last τ seconds (guards against accepting tiny, noisy\
    \ gains).\n- Slack frontier change r_slack: EMA of reduction in mean(top-K pair\
    \ slacks) for a fixed K (e.g., K=128) to detect frontier saturation.\n\nStage\
    \ End Criteria (any triggers)\n- r_S < η_S AND r_acc < η_acc (both low): plateau.\n\
    - r_slack < η_slack for T_plateau seconds: frontier saturated at current α0 and\
    \ k_pairs.\n- Hard cap: stage_duration_max to ensure bounded time even if signals\
    \ misfire.\n\nAdaptive Progression Rules\n- If plateau: decrease step (α0 ← γα\
    \ · α0, e.g., γα ∈ [0.4, 0.7]) and increase k_pairs modestly (k_pairs ← k_pairs\
    \ + ΔK) to widen the frontier scan.\n- If frontier still active (r_slack ≥ η_slack)\
    \ but r_S small: keep k_pairs, reduce α0 (finer line-search tail).\n- If r_S healthy:\
    \ maintain α0 and k_pairs until signals fall below thresholds or duration cap\
    \ hits.\n- Boundary moves: modulate boundary_push by recent boundary productivity;\
    \ if boundary steps yield low ΔS, decay boundary_push toward a floor (e.g., 0.55).\n\
    \nDeterminism\n- Fix a seed; compute EMAs over fixed-length time windows; use\
    \ stable sorts and fixed K for r_slack; thresholds and multipliers are constants\
    \ in the schedule config.\n- Use wall-clock gating only to define sampling cadence\
    \ (e.g., metrics every 1 s), not random decisions.\n\nPseudocode (stage controller)\n\
    initialize α0, k_pairs, boundary_push\nwhile total_time < budget:\n    run inner\
    \ loop with current (α0, k_pairs, boundary_push) for Δt_eval seconds\n    update\
    \ EMAs: r_S, r_acc, r_slack\n    if (r_S < η_S and r_acc < η_acc) or (r_slack\
    \ < η_slack for ≥ T_plateau) or (stage_time ≥ stage_duration_max):\n        #\
    \ transition\n        if r_slack < η_slack:\n            α0 ← γα · α0      # finer\
    \ steps\n            k_pairs ← k_pairs + ΔK\n        else:\n            α0 ← γα\
    \ · α0\n        boundary_push ← max(boundary_push_min, boundary_push · γb) if\
    \ recent boundary gains low\n        reset stage_time\n    else:\n        continue\
    \ within stage\n\nSuggested Defaults (based on 20-minute budgets)\n- τ = 10 s,\
    \ Δt_eval = 1 s; η_S ≈ 5e−6/s initially, decaying per stage; η_acc ≈ 2e−6 per\
    \ accept; η_slack ≈ 1e−7 per second on mean(top-128).\n- γα ∈ [0.5, 0.7], ΔK ∈\
    \ {+8, +12}, boundary_push_min ≈ 0.60, γb ≈ 0.9.\n- Preserve strict feasibility:\
    \ ε ≈ 1e−12 on pair/boundary; keep clamping δ ≈ 1e−9; exact LP for all accept\
    \ decisions.\n\nExpected Behavior\n- Early stages spend longer while r_S is healthy;\
    \ later stages automatically shorten once improvements drop, shifting time to\
    \ fine-tail polishing.\n- Compared to fixed schedules, adaptive control tends\
    \ to recover equal or better Σr by reallocating time to periods with remaining\
    \ signal, while maintaining the deterministic guarantees (given fixed thresholds\
    \ and seeds).\n\nNote\nThis addendum proposes a drop-in controller for the published\
    \ method; it requires no change to LP formulation, move set, or feasibility guards,\
    \ and is fully compatible with the deterministic implementation described in the\
    \ main paper.\n"
