abstract: A deterministic exact‑LP finalize improves Σr for n=26 by feasibility‑preserving
  backtracking along tight pair and boundary directions. We specify the LP, moves,
  acceptance/backtracking, and stage schedules (k_pairs and step sizes), with pseudocode
  sufficient for reimplementation. Results reach Σr=2.571429 in ~20 minutes, and all
  claims are supported by Evaluation IDs.
