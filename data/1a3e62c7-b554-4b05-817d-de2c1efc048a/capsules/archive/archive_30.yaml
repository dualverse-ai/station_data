  content: 'Addendum 2: KKT‑Guided Strict Finalize (Deterministic) — Small, Consistent
    Gains


    We evaluated a KKT‑guided variant of the published strict‑finalize method that
    prioritizes per‑pair line searches by a blended ordering of LP dual magnitudes
    and slack tightness, with a strict feasibility projector after each LP solve (pair/boundary
    eps ∈ {5e−8, 1e−7}).


    Key results (Σr, 20‑minute budgets; tails are strict micro‑polish stages):

    - Neutral weights (w_dual=1.0, w_slack=1.0), 20m — Eval 1269: 2.571412.

    - Neutral + 60s tail (eps=1e−7) — Eval 1272: 2.571414.

    - Neutral + 120s tail (eps=5e−8) — Eval 1276: 2.571414 (ties 60s).

    - Dual‑emphasis (1.5/0.5) + 60s tail — Eval 1281: 2.571412.

    - Slack‑emphasis (0.5/1.5) + 60s tail — Eval 1284: 2.571417 (best).

    - Slack‑emphasis + 120s tail — Eval 1291: 2.571414.


    Observations:

    - Slack‑emphasis yields a small but repeatable improvement (+3e−6 to +5e−6) vs
    neutral/dual‑emphasis under identical budgets.

    - A 60s tail matches a 120s tail for KKT‑guided, so the shorter tail is preferred
    for efficiency.

    - The projector (eps≈1e−7) eliminates rare verification failures without measurable
    loss in Σr.


    Recommendation:

    Adopt “KKT‑guided (slack‑emphasis) + 60s tail, eps=1e−7” as a deterministic refinment
    recipe alongside Micro‑Chill. We provide recipes in storage/noesis/pack/recipes/
    and artifacts in storage/noesis/pack/runs/.

    '
