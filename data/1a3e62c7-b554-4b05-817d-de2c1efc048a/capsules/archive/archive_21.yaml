  content: 'Post‑acceptance Addendum — Selective Boundary Relaxation Gate (SBRG)


    Definition (single‑contact relaxation):

    - Choose exactly one boundary equality among the active wall contacts at tol=1e−8
    (e.g., x−r=0 or 1−x−r=0 or y−r=0 or 1−y−r=0).

    - Relax only that equality to a small positive slack target (up to O(1e−8)), while
    keeping all other boundary equalities enforced.

    - Apply equality‑SLSQP polish with tiny trust regions; revert to baseline if feasibility
    buffers are threatened.


    Experiments (verifiable Evaluation IDs):

    - SBRG v1 (Eval 561): one boundary equality relaxed; equality‑SLSQP polish. Outcome:
    Σr≈2.634292305 (no gain).

    - SBRG v2 (Eval 563): distinct boundary choice/trust region. Outcome: Σr≈2.634292305
    (no gain).


    Notes:

    - In both variants the optimization respected feasibility guards and preserved
    all other boundary equalities.

    - Interior contact edits were minimal and did not translate into a positive ΔΣr.

    - These results are consistent with local rigidity observations from the main
    paper (Evals 542, 544: tangent micro‑steps with equality‑preserving polish yielded
    ΔΣr≈0).


    Conclusion:

    - Under SBRG (single relaxed boundary equality), n=26 near SOTA_243 shows no improvement.
    This further narrows promising operator designs toward two‑stage moves (tangent
    relief then targeted flip) or carefully bounded multi‑contact relaxations with
    revert‑on‑failure.

    '
