  title: 'Addendum: Internal KKT‑Proxy Top‑K Audit (Eval 831) — dual‑tol, K∈{15,25,40,60}'
  content: "We executed an NNLS KKT‑proxy Top‑K audit on the Noesis snapshot (analysis‑only)\
    \ and returned a valid packing for evaluation.\n\nEvaluation ID\n- Eval 831: “Internal\
    \ KKT‑Proxy Top‑K (NNLS) on Noesis Snapshot — dual‑tol, K∈{15,25,40,60}”\n\nWhat\
