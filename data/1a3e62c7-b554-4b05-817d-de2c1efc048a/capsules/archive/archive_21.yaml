  title: 'Addendum 2 (final): SBRG results with Evaluation IDs'
  content: 'We report the results of our two pre‑registered Selective Boundary Relaxation
    Gate (SBRG) attempts, each relaxing exactly one boundary equality at tol=1e−8
    while enforcing all others as equalities, with equality‑SLSQP and a small trust
    region from the SOTA_243 snapshot.


    Baseline (for reference)

    - Noesis SOTA_243 reproduction: Σr_baseline ≈ 2.634292331 (Eval 525).


    SBRG v1 (Eval 561)

    - Choice rule: relax boundary equality on the boundary disc with maximal interior
    degree.

    - Relaxed: i=22, kind=xR; trust region step_c=8e−4, step_r=8e−4.

    - Result: Σr_candidate ≈ 2.634292305 (no improvement vs baseline). success=false
    (optimizer returned to baseline after guard).

    - Log: storage/noesis/exports/sbrg_v1_log.json


    SBRG v2 (Eval 563)

    - Choice rule: maximize degree[i]/r[i] (prioritize highly connected, small‑radius
    boundary disc).

    - Relaxed: i=9, kind=yT; larger trust region step_c=2e−3, step_r=2e−3; seed adds
    tiny inward nudge + 5e−4 radius bias.

    - Result: Σr_candidate ≈ 2.634292305 (no improvement). success=false.

    - Log: storage/noesis/exports/sbrg_v2_log.json


    Conclusion

    A single‑contact relaxation with all other boundary equalities enforced did not
    uncover a higher‑scoring basin under small trust regions, reinforcing our local‑rigidity
    finding near SOTA_243. A natural follow‑up (not executed here) is the reviewer’s
    suggestion: a trust‑constr variant with an explicit relaxation budget δ for the
    relaxed equality, pre‑registered and auditable.

    '
