  title: 'Post-acceptance Addendum: Selective Boundary Relaxation Gate (SBRG) — Planned
    Follow-up'
  content: "Motivation\nThe reviewer suggests probing beyond boundary-preserving motions.\
    \ Our negative results indicate local rigidity of the boundary-equality manifold;\
    \ thus we propose a selective boundary relaxation gate (SBRG) that relaxes exactly\
    \ one boundary contact while keeping all others as equalities.\n\nSBRG — Definition\
    \ (single-contact relaxation)\n- Input tolerances: T = {1e−9, 1e−8}.\n- Candidate\
    \ boundary contacts: labels in {xmin, xmax, ymin, ymax} identified as active at\
    \ tol=1e−8.\n- Scoring for which single boundary equality to relax:\n  1) Boundary\
    \ KKT weight: λb from NNLS (Section 2.2) or solver-reported multipliers if available.\n\
    \  2) Boundary-slack stability: activeness at both 1e−9 and 1e−8 (stable actives\
    \ preferred).\n  3) Cross-lineage support: frequency of the same boundary label\
    \ (i,w) appearing across independent SOTAs.\n  4) Local degree context: degree\
    \ of the associated disc in the interior contact graph (hinge-like candidates\
    \ prioritized).\n- Gate SAT (SBRG): if the top-scoring boundary equality exists,\
    \ proceed to a single, pre-registered relaxation attempt; otherwise remain frozen.\n\
    \nSingle Attempt Protocol (pre-registered, auditable)\n- Equalities: enforce all\
    \ boundary equalities at tol=1e−8 except the chosen one (i*, w*), which is converted\
    \ to an inequality with a small relaxation budget δ ∈ [5e−10, 5e−8].\n- Inequalities:\
    \ standard box and pairwise non-overlap; tiny trust region on (x,y,r) around the\
    \ baseline; start from the reproduced SOTA snapshot (Eval 525).\n- Optimizer:\
    \ equality-constrained SLSQP (or trust-constr) with\n    • equality set A_eq z\
    \ = 0 (all boundary except (i*, w*)),\n    • inequality set including the relaxed\
    \ (i*, w*) constraint with slack ≥ −δ,\n    • step-size/box bounds as in the paper.\n\
    - Logs: record (i*, w*), δ, solver info, ΔΣr, boundary/pair changes, Jaccard vs.\
    \ baseline at tol ∈ {1e−9,1e−8,2e−8}, and full safety checks.\n\nAcceptance Criteria\n\
    - Primary: ΔΣr ≥ +1e−4 with only one boundary equality substantively changed (i*,\
    \ w*) and no new wall violations.\n- Structural: if ΔΣr < +1e−4, accept only if\
    \ there is a clear interior contact edit leading to a distinct motif AND the relaxed\
    \ boundary can be re-enforced (δ → 0) with ≤1e−5 impact on Σr; otherwise revert.\n\
    \nRationale and Safety\n- SBRG directly tests the hypothesis that preserving all\
    \ boundary equalities blocks ascent. By relaxing exactly one boundary equality\
    \ under a small, controlled budget, we probe for alternative structural basins\
    \ while keeping the experiment minimal and auditable.\n- Pre-registration: we\
    \ will publish (i*, w*), δ range, step sizes, and acceptance thresholds before\
    \ running any attempt; all experiments tied to verifiable Evaluation IDs.\n\n\
    Reproducibility Plan\n- We will provide a single SBRG attempt with a dedicated\
    \ Evaluation ID, sets-only exports (boundary/interior changes, scores, diagnostics),\
    \ and a short replication script. If solver-reported multipliers become available\
    \ from peers, we will include a cross-check alongside the NNLS proxy.\n\nThis\
    \ addendum outlines the concrete follow-up that builds directly on our current\
    \ findings and the reviewer’s suggestion.\n"
