  title: Appendix D — Glossary and Algorithms (Pseudocode) with Eval ID Map
  content: "This appendix consolidates definitions and algorithmic pseudocode used\
    \ in Archive #21, avoiding lineage-specific paths and enabling straightforward\
    \ reimplementation and verification. Evaluation IDs (Eval IDs) are provided for\
    \ every experiment referenced.\n\nGlossary (concise)\n- Slack (boundary): For\
    \ disc i with center (x_i, y_i) and radius r_i,\n    s_xL = x_i − r_i; s_xR =\
    \ 1 − x_i − r_i; s_yB = y_i − r_i; s_yT = 1 − y_i − r_i.\n  Feasible if all ≥\
    \ 0.\n- Slack (pair): For discs i≠j, s_ij = ||c_i − c_j|| − (r_i + r_j), feasible\
    \ if s_ij ≥ 0.\n- Active at tolerance tol: A constraint with slack ≤ tol (analysis\
    \ notion; evaluation still requires strict feasibility).\n- Boundary equality\
    \ set (at tol): The subset of boundary constraints with slack ≤ tol.\n- Interior\
    \ pair set (at tol): The subset of pair constraints with slack ≤ tol.\n- Operator\
    \ gate (dual-tolerance crossing test): Gate is SAT if among the top-K interior\
    \ pairs at both tol∈{1e−9,1e−8}, there exist two disjoint pairs whose straight-line\
    \ segments cross, with all endpoints interior at tol=1e−8.\n- KKT proxy (NNLS\
    \ multipliers): Estimate nonnegative multipliers λ by solving min_{λ≥0} ||J^T\
    \ λ − e_r||_2, where J stacks gradients of active constraints and e_r has 1s on\
    \ radii coordinates and 0s on centers.\n- Boundary-preserving tangent: Nullspace\
    \ basis Q of A_eq formed from boundary equalities (at tol), giving directions\
    \ that preserve those equalities to first order.\n\nPseudocode A: Baseline SLSQP\
    \ (Eval 525 reproduction; baseline validation Eval 490; variants Evals 500, 518,\
    \ 520)\n1. Variables: z = [(x_i, y_i, r_i)]_{i=1..26}.\n2. Objective: minimize\
    \ f(z) = −Σ_i r_i.\n3. Constraints:\n   - Boundary: x_i − r_i ≥ 0; 1 − x_i − r_i\
    \ ≥ 0; y_i − r_i ≥ 0; 1 − y_i − r_i ≥ 0.\n   - Pairs: ||c_i − c_j|| − (r_i + r_j)\
    \ ≥ 0 for all i<j.\n4. Jacobians:\n   - ∂(x_i − r_i)/∂(x_i, r_i) = (1, −1); ∂(1\
    \ − x_i − r_i)/∂(x_i, r_i) = (−1, −1); similarly for y.\n   - Pair (i,j) with\
    \ d = ||c_i − c_j||>0: gradient on c_i = (c_i−c_j)/d; on c_j = −(c_i−c_j)/d; on\
    \ r_i,r_j = −1.\n5. Seeds: constructive grid+hole; jitter (iso/aniso); multi-start.\n\
    6. Feasibility guard (iterated until all slacks>0): clamp by walls; for the tightest\
    \ violating pair, shrink r_i and r_j equally by a small amount while enforcing\
    \ r_i,r_j > 0.\n7. Solve with SLSQP (analytic Jacobians). After convergence, apply\
    \ final tiny shrink: r_i ← max(r_i − 1e−9, 1e−12).\n8. Record centers, radii,\
    \ Σr, and analysis exports (optionally). Verify with evaluator. (Eval 525: Σr=2.6342924).\n\
    \nPseudocode B: Dual-Tolerance Gates (Slack and KKT proxy) (Evals 494, 503, 529,\
    \ 541)\nInputs: packing z; tolerances T = {1e−9, 1e−8}; K-values K_1e−9=25, K_1e−8=15.\n\
    1. For each tol in T:\n   a) Compute interior pairs with slack ≤ tol; rank by\
    \ smallest slack; keep Top-K_t based on tol.\n   b) Compute KKT proxy:\n     \
    \ - Build J from active constraints at tol.\n      - Solve min_{λ≥0} ||J^T λ −\
    \ e_r||_2 (NNLS).\n      - Rank interior pairs by λ; keep Top-K_t.\n2. Form intersections\
    \ across tol for each ranking family (slack; KKT).\n3. Remove any pair that involves\
    \ a disc with a boundary equality at tol=1e−8 (interior-only filter).\n4. Search\
    \ for two disjoint pairs whose line segments cross. If found, gate = SAT; else\
    \ UNSAT.\n5. Results here: all gates UNSAT on reproduced SOTA_243 (Evals 494,\
    \ 503, 529, 541).\n\nPseudocode C: Tangent Micro-Step (Nullspace Nudge + Equality-SLSQP)\
    \ (Evals 542, 544)\nInputs: packing z; boundary equality set at tol=1e−8; hinge-count\
    \ m∈[4,6].\n1. Build A_eq from boundary equality gradients; compute nullspace\
    \ basis Q.\n2. Select m hinge interior pairs via composite score (inverse slack\
    \ + KKT λ + optional support count).\n3. In Q-space, form v = Σ_h ∇s_h · Q (gradient\
    \ of sum of hinge slacks); choose direction u_dir = −v/||v||.\n4. Trust region\
    \ line-search: choose τ so predicted Δs_h respects conservative buffers (e.g.,\
    \ no reduction > β·s_h with β∈(0,1)).\n5. Seed z' = z + Q u, u = τ u_dir; clip\
    \ centers to [0,1].\n6. Equality-SLSQP polish: enforce boundary equalities during\
    \ polishing (or strong penalties); finish with tiny final shrink.\n7. Return better\
    \ of baseline vs candidate. (Observed ΔΣr≈0 in both attempts; safe τ ~ 1e−6–1e−6.5).\n\
    \nPseudocode D: Selective Boundary Relaxation Gate (SBRG) (Evals 561, 563)\nInputs:\
    \ packing z; choose exactly one boundary equality to relax (rank by coverage/KKT\
    \ context).\n1. Temporarily release the chosen boundary equality; apply a tiny\
    \ movement toward interior feasibility margin while monitoring all pair slacks.\n\
    2. Run a short SLSQP polish with the other boundary equalities held (or penalized\
    \ strongly); revert if any feasibility guard or score regression triggers.\n3.\
    \ Re-enforce full boundary equalities and finalize with tiny shrink.\n4. Return\
    \ best of baseline vs candidate. (Both attempts near Σr≈2.6342923–2.6342924; no\
    \ gain.)\n\nEval ID Map (verifiable via Research Counter)\n- Baseline/SOTA reproduction:\
    \ 490, 500, 518, 520, 525.\n- Gates: 494, 503, 529, 541.\n- Tangent micro-steps:\
    \ 542, 544.\n- SBRG: 561, 563.\n- Utilities/exports: 527, 537, 548, 549, 551,\
    \ 552, 545, 546.\n"
