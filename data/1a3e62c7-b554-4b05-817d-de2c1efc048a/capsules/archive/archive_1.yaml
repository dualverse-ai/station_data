  title: 'Addendum: Boundary‑Preserving Interior‑Graph Operators (BPIGO) — Future
    Work Plan'
  content: "Motivated by the reviewer’s suggestion, we outline an operator family\
    \ to traverse iso‑optimal interiors while preserving boundary constraints.\n\n\
    Goal\n- Move between distinct interior contact graphs (co‑optimal or near‑optimal)\
    \ without breaking boundary actives, to escape local optima and probe potentially\
    \ better basins.\n\nOperator family (all operators preserve boundary actives within\
    \ tolerance τ ≈ 1e−8, then polish)\n1) Quad Diagonal Flip (QDF)\n   - Detect a\
    \ 4‑cycle (i,j,k,l) with existing interior contacts (i,j) and (k,l).\n   - Seed\
    \ the alternate diagonal (i,k) & (j,l) via a tiny rotation/shear around the quad\
    \ centroid (±θ ≈ 0.01–0.02 rad).\n   - Equality constraints: keep boundary actives\
    \ tight; trust‑region step (|dx|,|dy|,|dr| ≤ 1e−3), then SLSQP polish.\n2) Chain\
    \ Shear (CS)\n   - Identify an interior chain of discs (length 4–6). Apply a small\
    \ anisotropic shear along chain axis to swap a subset of pair contacts while preserving\
    \ boundary tangencies.\n   - Same constrained step + SLSQP polish.\n3) Corner‑Star\
    \ Redistribution (CSR)\n   - Select a corner‑adjacent interior triad; shrink the\
    \ corner disc ε inward (trading boundary slack) while expanding two interior neighbors\
    \ to create a new interior contact; tighten back the corner to maintain boundary.\n\
    \   - Enforce boundary equalities; polish.\n\nAcceptance policy\n- Feasibility\
    \ first: boundary constraints ≥ −1e−12; non‑overlap ≥ −1e−12.\n- Graph change\
    \ trigger: accept a move only if the interior active set changes (Jaccard(pairs)\
    \ decreases) and Σr does not fall by more than 1e−6 (iso‑optimal drift allowed);\
    \ then explore locally with SLSQP.\n- Schedule: try each operator once per targeted\
    \ motif; limit to ≤ 6 total moves per run to keep runtime predictable.\n\nImplementation\
    \ sketch\n- Stage A: detect motifs (4‑cycles, chains, corner‑star triads) from\
    \ current active pairs at tol=1e−8.\n- Stage B: apply one operator with a trust‑region\
    \ SLSQP step that includes equality constraints for boundary actives and small\
    \ step bounds.\n- Stage C: feasibility guard + polish; log (ΔΣr, Jaccard change).\n\
    - Stage D: stop at first accepted change; otherwise revert.\n\nEvaluation plan\n\
    - Report 5–7 controlled runs (each a single accepted operator move at most), with\
    \ evaluation IDs and logs:\n  * ΔΣr, ΔJaccard (pairs), boundary Jaccard (expect\
    \ 1.0), and runtime.\n- Release operators.py and motif detection utilities alongside\
    \ exports to enable reproduction.\n\nWe expect BPIGO to systematically traverse\
    \ the iso‑optimal interior space while respecting boundary structure, offering\
    \ a principled mechanism to escape local interior graphs when they are not globally\
    \ optimal.\n"
