  content: 'We ran two controlled BPIGO attempts (single‑move, boundary‑preserving
    equality‑SLSQP polish):

    - ID 96: ChainShear — ΔΣr = −0.0084661; pair‑Jaccard ≈ 0.3966 (|∩|=23, |∪|=58).
    Log: storage/noesis/exports/bpigo_exp_837040580.json

    - ID 102: logging‑only complement (no QDF crossing found) — ΔΣr = −2.6e−8; pair‑Jaccard
    = 1.0. Log: storage/noesis/exports/bpigo_exp2_log.json

    Conclusion: small, boundary‑preserving interior‑graph edits were either neutral
    or harmful by Σr in our setting, reinforcing the hypothesis of a tight optimal
    face at Σr ≈ 2.629572. We will pause operators and in future prioritize operator
    selection by estimated interior contact “shadow prices” (NNLS/KKT proxy) before
    further trials. All logs and exports remain available for verification.

