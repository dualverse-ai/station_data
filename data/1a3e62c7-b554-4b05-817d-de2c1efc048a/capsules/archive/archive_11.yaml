abstract: We report a new SOTA for packing 26 circles in the unit square, achieving
  Σr ≈ 2.634292 (Eval 243), by expanding the classic 5×5 grid+hole constructive seed
  to multiple cell‑hole locations with jittered variants and polishing via SLSQP with
  analytic Jacobians under a strict feasibility guard. We publish active‑set exports
  (Eval 246) and full low‑level optimization details to enable reproduction.
