  title: Revisions for Publication - Formalism and Reproducibility
  content: "## Revised Methodology (for Reproducibility)\n\nThe core of the methodology\
    \ is a stochastic iterative refinement loop. The algorithm begins with a high-quality\
    \ initial packing `x_0` (centers and radii) and iteratively applies a three-step\
    \ process: Analyze, Nudge, and Refine.\n\n### 2.1. Analysis: Heuristic Score Calculation\n\
    \nFor a given packing `x_t`, the KKT multipliers `v` and geometric slacks `s`\
    \ are computed for all `m` inequality constraints. The primary analytical tool\
    \ is a heuristic score `H_i` for each constraint `i`, designed to prioritize constraints\
    \ that are both under high pressure and geometrically tight. It is defined as:\n\
    \n`H_i = v_i / (s_i + ε)`\n\nwhere:\n- `v_i` is the KKT multiplier for constraint\
    \ `i`.\n- `s_i` is the geometric slack for constraint `i`.\n- `ε` is a small constant\
    \ (e.g., 1e-12) to prevent division by zero.\n\n### 2.2. Perturbation: Probabilistic\
    \ Nudge\n\nInstead of a purely greedy approach, a constraint is selected for perturbation\
    \ stochastically. \n\n1.  **Candidate Selection:** A candidate set `C` is formed\
    \ from the `k` constraints with the highest heuristic scores `H_i`. (In our experiments,\
    \ `k=5`).\n2.  **Probability Distribution:** A probability `p_j` is assigned to\
    \ each constraint `j` in `C`:\n\n    `p_j = H_j / (Σ_{l in C} H_l)`\n\n3.  **Nudge\
    \ Application:** A single constraint `c*` is sampled from `C` according to the\
    \ distribution `p`. A perturbation vector is then applied. The nudge strength\
    \ `d_t` decays over time: `d_t = d_0 * (γ^t)`, where `t` is the cycle number,\
    \ `d_0` is the initial strength (e.g., 1e-5), and `γ` is the decay rate (e.g.,\
    \ 0.9).\n\n    -   **For a non-overlap constraint between circles `a` and `b`:**\n\
    \        Let `c_a` and `c_b` be the center coordinates. The perturbation is:\n\
    \        `u = (c_a - c_b) / ||c_a - c_b||`\n        `c_a' = c_a + u * d_t`\n \
    \       `c_b' = c_b - u * d_t`\n\n    -   **For a boundary constraint on circle\
    \ `a`:**\n        The perturbation moves `c_a` directly away from the boundary\
    \ by a distance `d_t`.\n\n### 2.3. Refinement\n\nThe newly perturbed packing `x_t'`\
    \ is used as the initial state for a standard Sequential Least Squares Programming\
    \ (SLSQP) optimization. The result of this optimization becomes the input for\
    \ the next cycle, `x_{t+1}`.\n"
