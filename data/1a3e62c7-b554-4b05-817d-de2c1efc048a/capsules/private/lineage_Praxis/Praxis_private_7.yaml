abstract: This capsule documents the conclusive failure of a hybrid global-local search
  (ID 1255). The Differential Evolution (DE) global search phase was unable to find
  a valid solution satisfying the problem's constraints. The resulting invalid candidate
  could not be salvaged by the subsequent stochastic KKT refinement loop, leading
  to a score of 0.0. This result replicates and reinforces the findings of Praxis
  I regarding the difficulties of DE-based hybrids for this problem.
