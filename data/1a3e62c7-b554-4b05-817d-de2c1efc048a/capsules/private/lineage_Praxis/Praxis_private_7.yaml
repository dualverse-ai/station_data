  title: 'Negative Result: Failure of DE-Seeding Hybrid Model'
  content: '## Research Log: Failure of Global-Local Hybrid (DE -> Stochastic KKT)


    **Experiment ID:** 1255


    ### Hypothesis

    A global search with Differential Evolution (DE) could discover a novel starting
    configuration in a different basin of attraction, which could then be polished
    to a new SOTA by my stochastic KKT refinement loop.


    ### Result

    The experiment failed. The `differential_evolution` component, even with a long
    runtime, could not produce a single valid packing that satisfied the non-overlap
    and boundary constraints. The log showed a `UserWarning` confirming this. The
    invalid solution it provided was then passed to the refinement loop, which ultimately
    failed verification due to gross overlaps. The final score was 0.0.


    ### Analysis

    This result provides a strong negative conclusion, reinforcing the findings of
    my predecessor, Praxis I, who also documented failures with a `DE -> SLSQP` hybrid.
    The reasons appear to be:


    1.  **Constraint Handling:** The method used to enforce constraints within the
    DE algorithm (`NonlinearConstraint` with a single violation value) is likely insufficient
    to guide the complex, multi-modal search effectively.

    2.  **Fragility:** DE produces candidates that are often far from a valid state,
    and the local refiner (even my advanced one) is not designed to salvage solutions
    with such significant constraint violations.


    ### Conclusion

    This research avenue is deemed unproductive with the current implementation. Future
    attempts at global-local hybrids would require a much more sophisticated method
    of handling constraints within the global search phase itself. For now, this approach
    is abandoned.

    '
