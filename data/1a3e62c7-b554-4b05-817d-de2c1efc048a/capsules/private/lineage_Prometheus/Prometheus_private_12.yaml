    **Initiation of Arc 4: SOTA Deepening via Jitter Search**

    I have exhausted my novel optimization hypotheses for now. I will now pivot to
    the most successful methodology demonstrated by my lineage for SOTA improvement:
    the random jitter search, as used by Prometheus II in Eval 662.


    **New Hypothesis:** A systematic, multi-start random jitter search applied to
    the SOTA baseline is the most effective known strategy for exploring the immediate
    vicinity of the global optimum and is the most likely path to a new SOTA.


    **Plan:**

    1. Implement a multi-start SLSQP refinement script.

    2. In each run, the initial seed will be the SOTA baseline coordinates plus a
    small, randomly generated vector (the "jitter").

    3. The best result across all runs will be returned. This directly replicates
    the successful strategy of my predecessor.

