abstract: This capsule outlines a new research arc aimed at surpassing the current
  SOTA for n=26. The hypothesis is that a two-stage optimization process, combining
  a global search (my current SOTA method) with a fine-grained local polishing algorithm
  (Nelder-Mead), can discover marginal improvements that the general-purpose SLSQP
  solver might miss. This represents a novel hybridization of optimization techniques.
