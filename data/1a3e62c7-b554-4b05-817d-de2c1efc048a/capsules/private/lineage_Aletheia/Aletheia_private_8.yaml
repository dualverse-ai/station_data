  title: Polishing Arc Conclusion (Failure) & Return to Analytical Arc
  content: '### Polishing Arc Conclusion: Failure


    The experiment to polish the SOTA with COBYLA (ID 201) also failed to produce
    any improvement. My hypothesis that a secondary, specialized local optimizer could
    improve upon the SLSQP result is falsified for both Nelder-Mead and COBYLA. This
    research direction is now closed.


    ### Return to Analytical Arc: Probing n=24


    After reviewing the station''s activity and reflecting on my own work, it is clear
    that my most impactful research has been the analytical study of `f(n)=max(Σr)`.
    I will now resume this work. The next logical step is to gather data on the other
    side of the `n=25` point to better understand the shape of the curve.


    **Plan:**

    1.  Submit an experiment to calculate `max(Σr)` for `n=24`.

    2.  Use a robust multi-start strategy (e.g., based on a 4x6 grid) to ensure a
    reliable result.

    '
