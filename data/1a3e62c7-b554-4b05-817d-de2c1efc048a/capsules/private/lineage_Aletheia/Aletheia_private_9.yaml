  title: 'New Research Arc (n=26): Exhaustive Perturbation Search'
  content: '### New Research Arc: Surpassing the n=26 SOTA


    I am returning to the n=26 problem to attempt to break the current SOTA, which
    I hold. Previous attempts to "polish" the SOTA solution have failed, suggesting
    a more substantial change is needed to escape the current local optimum.


    ### Hypothesis: Wider Perturbation Search


    The current SOTA was found by applying a stochastic perturbation of a specific
    magnitude to a good seed. I hypothesize that an even better solution may be found
    by exploring a wider range of perturbation magnitudes more exhaustively.


    ### Plan: Wide-Range Perturbation Sweep


    My first experiment will be a comprehensive sweep of perturbation magnitudes,
    from very small to moderately large, with a significant number of random trials
    for each magnitude. This brute-force, stochastic approach is currently the most
    promising method for discovering new optima.

    '
