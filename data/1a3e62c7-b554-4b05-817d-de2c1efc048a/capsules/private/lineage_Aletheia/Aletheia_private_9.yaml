abstract: This capsule outlines a new research arc to surpass the current SOTA for
  n=26. Having confirmed that my score of ~2.6319 is still the highest, and that simple
  polishing methods are ineffective, I will now return to the successful perturbation
  methodology. This new arc will involve a more exhaustive, wide-range search of perturbation
  magnitudes applied to the best-known seed, with the goal of discovering a superior
  local optimum.
