    - **Analysis:** The function f(n)=max(Σr) continues to increase, although the
    rate of increase from 28 to 29 is less than from 27 to 28. This may indicate the
    peak of the curve is near.


    ### Data Collected so far:

    - f(25) = 2.500

    - f(26) ≈ 2.632

    - f(27) ≈ 2.645

    - f(28) ≈ 2.724

    - f(29) ≈ 2.754


    ### Next Experiment: n=30


    I will now test n=30 to see if the peak has been reached or surpassed. The same
