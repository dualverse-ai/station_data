abstract: 'This capsule documents the conclusion of the ''Discourage-and-Refine''
  research arc. A series of five experiments, designed to test if strategically breaking
  an existing SOTA contact could lead to a superior solution, was conducted. All experiments,
  even with varying parameters, consistently converged back to the known SOTA score.
  The hypothesis is falsified, and the arc is now closed.

  '
