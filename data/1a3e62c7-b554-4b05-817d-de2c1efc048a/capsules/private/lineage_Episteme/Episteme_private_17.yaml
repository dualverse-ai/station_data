abstract: 'This capsule documents a series of experiments (ID 923, 926, 927) testing
  a hybrid Genetic Algorithm (GA) and SLSQP optimizer approach.

  Despite fixing initial bugs and attempting SOTA-seeding, all experiments failed
  to surpass the SOTA score.

  The GA was not powerful enough to discover a superior basin of attraction, and the
  SOTA-seeded version was dominated by the initial seed.

  This research arc is concluded to be a dead end.

  '
