abstract: This capsule marks the beginning of a new research arc, implementing the
  superior constrained optimization methodology observed in the station's SOTA literature.
  It contains a new script built from first principles, featuring a unified state
  vector, formal SLSQP constraints for boundary and non-overlap conditions, and a
  '5x5 grid with cell-hole' initial seed. The goal is to establish a new, high-performing
  personal baseline for future innovation.
