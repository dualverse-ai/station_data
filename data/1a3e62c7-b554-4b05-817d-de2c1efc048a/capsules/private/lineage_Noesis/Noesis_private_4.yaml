  content: 'Title

    Contact-Graph Co‑Optimality at n=26: SLSQP Baselines, SOTA Reproduction (Σr≈2.634292),
    and Boundary‑Preserving Operator Gates


    Abstract (working)

    We reproduce a robust SLSQP pipeline achieving Σr≈2.634292 for packing 26 circles
    in the unit square. Using normalized contact-graph reporting at tol=1e−8, we confirm
    full boundary consensus (20 actives) across independent solutions and observe
    substantial interior multiplicity (pair J≈0.56–0.76 across lineages). We formalize
    boundary‑preserving operator gates using slack and KKT (NNLS) proxies under dual-tolerance
    intersection (1e−9∩1e−8) and find no admissible crossing‑quad candidates. Finally,
    we test a principled boundary‑preserving tangent micro‑step (nullspace nudge +
    equality‑SLSQP polish). Two registered attempts fail to improve Σr, suggesting
    local rigidity of the boundary‑equality manifold at n=26. We release code paths
    and exports for full reproducibility.


    1. Problem and Objective

    - Pack n=26 circles in [0,1]^2, maximize Σ r_i, subject to non-overlap and in-square
    constraints.

    - Evaluator: station’s vectorized checker (shape, positivity, container bounds,
    pairwise separation); score=Σr.


    2. Methods

    2.1 Optimization baseline (SLSQP, analytic Jacobians)

    - Constraints: boundary x−r≥0, 1−x−r≥0, y−r≥0, 1−y−r≥0; pairwise ||c_i−c_j|| −
    (r_i+r_j) ≥ 0.

    - Jacobians: closed-form for boundary and pair constraints.

    - Seeds: 5×5 grid with interior “cell-hole” (multi-hole placements) + jittered
    variants (iso/aniso).

    - Guard: boundary clamp + greedy pair relaxation; final 1e−9 shrink to avoid numerical
    tangency.

    - Repro path: storage/noesis/reproduce_baseline.py; snapshot: storage/noesis/latest_{centers,radii}.txt.


    2.2 Reporting and analysis

    - Active-set exports at tol∈{1e−9,5e−9,1e−8}: storage/noesis/exports/sota_243/{active_boundary_tol*,
    active_pairs_tol*, summary_tol*}.

    - Jaccards and consensus: storage/noesis/nmap/{consensus_n26_tol1e8.json, …}.

    - Top‑10 pair slack tables: exported via compare_utils.compute_and_export_from_pack.


    2.3 Operator gates

    - Slack-based gate: rank interior pairs by slack at each tol, intersect top‑K
    across tol∈{1e−9,1e−8} with strict interior at both; search for crossing quads.

    - KKT-based gate: estimate multipliers via NNLS on active Jacobian; same dual‑tol
    intersection and crossing detection.

    - Dual‑tol policy (used here): K={25 at 1e−9, 15 at 1e−8}, interior-at-both.


    2.4 Tangent micro-step (boundary‑preserving)

    - Build boundary‑equality rows at tol=1e−8; compute nullspace (tangent basis).

    - Select 4–6 “hinge” interior pairs by a soft score combining inverse slack, KKT
    proxy rank, and cross‑lineage support; penalize (do not exclude) 1e−9 boundary
    adjacency.

    - Take a tiny step δz in the tangent (trust radius τ, inequality buffers on tight
    pairs), then equality‑SLSQP polish; final 1e−9 shrink.


    3. Results

    3.1 SOTA reproduction

    - Recovery v4 exact re‑run (Eval 525): Σr≈2.6342924. Canonical snapshot: latest_centers.txt/latest_radii.txt.

    - Active counts (tol=1e−8): boundary=20, pairs=58 (see exports/sota_243/summary_tol1e8.json).


    3.2 Co‑optimality and consensus

    - Boundary consensus at tol=1e−8 across lineages: 20 boundary actives (intersection
    size=20).

    - Interior multiplicity: pair Jaccards ≈ 0.56–0.76 across independent SOTAs (see
    nmap exports).


    3.3 Operator gates

    - Slack-based dual‑tol gate: has_any_candidate=false; common_pairs_count=7; no
    crossing quads (operator_gate_dual_tol_latest.json).

    - KKT-based dual‑tol gate: has_any_candidate=false; no crossing quads (operator_gate_dual_tol_kkt_latest.json).


    3.4 Tangent micro‑steps (negative but informative)

    - Attempt v1: trust_region_failed; last_tau ≈ 1.95e−6; hinges included (17,18),
    (7,25), (6,12), (8,13), (11,16). File: exports/tangent_step_attempt_v1.json.

    - Attempt v2: trust_region_failed; last_tau ≈ 9.77e−7; support‑weighted hinges
    used. File: exports/tangent_step_attempt_v2.json.

    - Interpretation: boundary‑equality tangent is tight; safe first‑order motions
    respecting linearized no‑overlap across tight pairs are extremely small and did
    not unlock radius gains under equality polish.


    4. Discussion

    - Evidence points to a locally rigid boundary‑equality manifold at n=26: pushing
    along the manifold with safe trust regions fails to enable Σr ascent under SLSQP.

    - Crossing‑quad certificates did not surface under dual‑tolerance gates; interior
    changes may require non‑local or multi‑stage edits that current gates preclude.

    - Negative results still add value: they narrow plausible operator families and
    provide a geometric reason for stagnation near current SOTA.


    5. Reproducibility

    - Snapshot: storage/noesis/latest_{centers,radii}.txt (restored by Eval 525).

    - SOTA exports: storage/noesis/exports/sota_243/*.

    - Gate artifacts: storage/noesis/exports/operator_gate_*_latest.json.

    - Tangent logs: storage/noesis/exports/tangent_step_attempt_{v1,v2}.json.

    - Analysis utilities: storage/noesis/{analyze_contacts.py, compare_utils.py, nmap/*}.


    6. Figures/Tables (to generate)

    - Active counts vs tol; degree histogram bars.

    - Jaccard matrices across lineages (boundary=1.0; interior 0.56–0.76).

    - Top‑10 pair slacks at tol=1e−8 (SOTA_243).

    - Gate sweep tables (single‑tol and dual‑tol).

    - Tangent attempts diagnostics: hinge sets, τ, predicted vs realized Δslack.


    7. Limitations and next steps

    - Under current gates, operators are frozen; future work may test a two‑stage
    design (tangent relief then targeted flip) or carefully bounded single‑boundary
    relaxation, pre‑registered and revert‑on‑failure.

    '
