  content: "Title\n- Contact-Graph Analysis and Optimization Baselines for 26-Circle\
    \ Packing (Sum of Radii)\n\nSummary\n- Task: Pack n=26 circles in [0,1]^2, no\
    \ overlaps, maximize Σ r_i.\n- Baseline: Constructive 5×5 grid (r≈0.1) + interior\
    \ “cell-hole” circle; SLSQP with analytic Jacobians and strict feasibility guard\
    \ (boundary clamp + greedy overlap resolution + 1e−9 final shrink).\n- Result:\
    \ Σ r ≈ 2.629572 (stable across SLSQP and trust-constr variants). This serves\
    \ as a robust, reproducible baseline.\n\nMethods (parsimonious)\n- Constructive\
    \ seeding + jittered multi-start; analytic Jacobians for boundary and pairwise\
    \ constraints; tight safety margins.\n- Negative results (no gain): ring/hex/corner-edge\
    \ seeds; graph-aware nudges (bottleneck release, boundary trade); homotopy (isotropic/anisotropic);\
    \ active-manifold trust-region step; motif 2‑opt flips.\n\nContact-Graph Analysis\
    \ (normalized reporting at tol=1e−8)\n- Mine: active_boundary_count=20, active_pair_count=58;\
    \ degree histogram ≈ {2:1, 3:6, 4:7, 5:5, 6:6, 7:1}.\n- Peer (independent SOTA):\
    \ same counts and degree bounds.\n- Jaccard overlap (mine vs. peer index sets):\n\
    \  * Boundary: J=1.000 (|∩|=20, |∪|=20) — identical boundary contacts.\n  * Pairs:\
    \    J≈0.5676 (|∩|=42, |∪|=74) — materially different interior contacts.\n- Takeaway:\
    \ Co‑optimal structural multiplicity — distinct interior contact graphs can realize\
    \ the same Σ r despite identical boundary actives.\n\nReproducibility (paths under\
    \ storage/noesis/)\n- latest_centers.txt, latest_radii.txt — best packing snapshot.\n\
    - analyze_contacts.py (exports CSV/JSON); compare_utils.py (Jaccard).\n- exports/:\
    \ summary_tol1e8.json/txt; active_boundary_tol1e8.csv; active_pairs_tol1e8.csv;\
    \ jaccard_peer_tol1e8.json/txt.\n- Drafts: analysis_draft.md; exports_plan.md;\
    \ todo.md.\n\nChecklist for Archive submission (at maturity)\n- Include: title,\
    \ concise abstract, method summary, SOTA score, negative results table, normalized\
    \ contact analysis (figures/tables), Jaccard results, reproducibility appendix\
    \ (file paths).\n- Note on evaluation robustness: always return shrunken packings\
    \ (1e−9) to avoid numerical tangency.\n"
