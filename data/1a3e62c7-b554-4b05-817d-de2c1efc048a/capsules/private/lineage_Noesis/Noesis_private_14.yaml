  title: 'Draft — LP-in-the-loop center search for n=26: methods, ablations, and results'
  content: "Abstract\nWe study LP-in-the-loop center search for 26-circle packing\
    \ in the unit square, where an exact LP (HiGHS) computes optimal radii for fixed\
    \ centers and an outer optimizer moves centers. Compact simulated annealing (SA)\
    \ with weighted tight-pair separation, boundary nudges, occasional triple-neighbor\
    \ proposals, and frequent greedy coordinate quenches achieves 2.5743 (Eval 1008).\
    \ Longer budgets tend to drift; short runs (4–8 min) with acceptance-ratio control\
    \ and mild reheating are more reliable.\n\nMethod\n- Inner solver: LP on r∈R^26,\
    \ maximize 1ᵀr s.t. r≥0, r≤ub(center), and r_i+r_j≤||c_i−c_j||−ε.\n- Proposals:\n\
    \  * Tight-pair separation: sample pairs ∝ 1/(slack+δ), move along ± separation.\n\
    \  * Boundary nudge: pick most boundary-limited circle, step inward.\n  * Triple\
    \ move (modest weight): move the smallest boundary-limited circle away from its\
    \ two nearest neighbors; push neighbors slightly apart.\n- Greedy coordinate quench:\
    \ per circle, probe 8 directions with a small step and commit if LP objective\
    \ improves.\n- Schedules: T0≈6–8e−4, Tmin=1e−7, α≈0.996, trials_per_T≈100, step≈0.04\
    \ with acceptance‑ratio control (target 0.25–0.35).\n- Reheating: after ~6 stagnant\
    \ levels, reheat temperature and jitter the best centers slightly.\n- Multistart\
    \ seeds: grid + jitters + two hex-like + jittered-hex (6 total).\n- Finalization:\
    \ LP tighten radii on the best centers.\n\nAblations (observed)\n- Coord-only:\
    \ fast but stuck (≤2.44).\n- Pair-only: improves but stalls without quenches (≈2.49).\n\
    - +Triple (modest weight): occasional gains; too high weight can drift.\n- Size-aware\
    \ steps: mixed impact; can help early but increased drift long-run.\n- SPSA fine-tune:\
    \ expensive, no net gain over compact SA in our trials.\n- Dual-guided ascent\
    \ (HiGHS marginals): reliable local polish (≈+0.01 over SA warm start).\n\nResults\
    \ (key)\n- 2.5743 (Eval 1008): 8-min SA+quench (pair/boundary/triple).\n- 2.5421\
    \ (Eval 1023): 5-min SA warm start + 5-min dual trust-region ascent.\n- 2.5406\
    \ (Eval 1039): compact SA+quench (4.5 min).\n(See storage/noesis/pack/results_summary.json\
    \ for full table; SOTA ref 2.6343.)\n\nRepro\n- Frozen recipe: storage/noesis/pack/recipe_2_57_freeze.json\n\
    - Modular core: storage/noesis/pack/lp_sa_core.py\n- Quick script: storage/noesis/pack/README.md\
    \ (8-min run + LP tighten)\n\nDiscussion\nWe hypothesize that compact runs with\
    \ frequent quenches better preserve pair structure by avoiding slow diffusion\
    \ of centers under noisy updates. Pair‑weighted sampling and acceptance‑ratio\
    \ step control stabilize progress. Short SA + brief dual ascent refine is promising\
    \ when budgets are tight.\n\nNext\n- Upon maturity: prepare Archive note with\
    \ full results table and code pointers.\n- If resuming experiments: 4–5 min SA\
    \ + 3–5 min dual polish; or two 4‑min SA restarts, pick best, 2‑min dual.\n"
