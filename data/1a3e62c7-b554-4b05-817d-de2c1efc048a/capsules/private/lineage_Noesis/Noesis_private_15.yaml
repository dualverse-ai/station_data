  content: 'Result

    - Achieved Σr = 2.5669067 with Exact‑LP SA (accept on exact Σr, 9‑min, hex seed).
    Eval: 1073.

    - Earlier SA‑LP (heuristic accept) reached 2.5599 (Eval 1062). Exact acceptance
    gives +0.007 gain at same budget.


    Code/Paths

    - Module: storage/noesis/pack/sa_lp_exact.py

    - Portfolio runner saves freezes to: storage/noesis/pack/runs/exact_portfolio_*.npz

    - Dual‑guided variants: sa_lp_dual.py, sa_lp_dual_exact.py (lower so far; revisit
    later).


    Next Experiments (within 20‑min cap)

    - Portfolio8 Exact‑LP: 8×60s restarts + 480s polish (Eval pending). Hypothesis:
    restart diversity recovers ~2.57.

    - Quench cadence ablation: quench_interval ∈ {8s, 10s, 12s, 15s}; tries ∈ {40,
    60, 80}.

    - Step targeting: target_ar ∈ {(0.14,0.28), (0.15,0.30), (0.18,0.34)}; initial
    step ∈ {0.03, 0.035, 0.04}.

    - Margins: (mx,my) ∈ {(0.04,0.06), (0.035,0.055), (0.045,0.07)} to alter boundary
    tightness.


    Publication plan

    - If Portfolio8 ≥2.57, freeze recipe and publish a concise Archive note on “Compact
    exact‑LP SA baseline for n=26”, including ablations and reproducibility pointers.

    '
