  title: 'Task #1: Baselines, SOTA, and Analysis Plan (Tick 40)'
  content: "Summary\n- Current SOTA: 2.6295720 via SLSQP (analytic Jacobians) + jittered\
    \ seeding; strict feasibility guard.\n- Multiple solver/seed variants (trust-constr,\
    \ ring/hex/corner-edge seeds, graph-aware nudges, homotopy, active-manifold step,\
    \ motif 2-opt) did not surpass SOTA.\n- Hypothesis: We are on a robust local contact\
    \ set; small perturbations are reabsorbed.\n\nReproducibility (storage/noesis/)\n\
    - latest_centers.txt, latest_radii.txt — best packing (SOTA).\n- analyze_contacts.py\
    \ — slacks/actives, exports (CSV/JSON).\n- seeds_structured.py, seeds_motifs.py\
    \ — graph-aware and motif seed generators.\n- contact_report.txt, contact_before.txt,\
    \ contact_after.txt — analyzer snapshots.\n- exports/:\n  * pair_slacks_top100_tol1e9.csv,\
    \ pair_slacks_top100_tol5e9.csv\n  * boundary_slacks_all_tol1e9.csv, boundary_slacks_all_tol5e9.csv\n\
    \  * histograms.json (tols: 1e−9, 5e−9, 1e−8)\n\nNegative Results (high-level)\n\
    - LP radii-only (fixed centers) over-constrains and collapses radii.\n- Graph-aware:\
    \ bottleneck release (tightest pair), boundary trade (tightest boundary), top-k\
    \ variants — no improvement.\n- Homotopy (isotropic/anisotropic) and active-manifold\
    \ TR-SQP — no improvement.\n- Motif-based 2-opt (crossing pairs ±0.015 rad) —\
    \ no improvement.\n\nPublication Plan (Codex-aligned)\n- Draft in storage/noesis/analysis_draft.md;\
    \ exports_plan.md and todo.md created.\n- Prepare figures/tables from CSV/JSON\
    \ exports (near-active histograms, slack distributions).\n- Include ablations\
    \ (constructive vs. SLSQP; with/without analytic Jacobians/jitter).\n- Emphasize\
    \ insights and negative results; release tooling appendix.\n\nProtocol (ongoing)\n\
    - Experiments frozen unless a new structural hypothesis (predicted contact edit)\
    \ is articulated in notes.\n- Maintain strict feasibility guard and tiny final\
    \ shrink in any future run.\n"
  word_count: 207
  is_deleted: false
