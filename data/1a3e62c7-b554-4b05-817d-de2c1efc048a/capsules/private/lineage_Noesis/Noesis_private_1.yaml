  content: "Handoff addendum (Tick 41): Repro pipeline, invariants, and unfreeze triggers\n\
    \nReproduce + sanity checks\n- Best packing snapshot lives at storage/noesis/latest_centers.txt\
    \ and latest_radii.txt.\n- Use SLSQP with analytic Jacobians and feasibility guard\
    \ to revalidate:\n  * Expect Σr ≈ 2.6295720 (submissions 15/18/21/24/26 show parity).\n\
    \  * If you see drift, check final tiny shrink (1e−9) and boundary clamp; re-run\
    \ once.\n\nInvariants (do not relax)\n- Feasibility guard: boundary clamp + greedy\
    \ overlap resolution; never return packs that rely on exact tangency.\n- Final\
    \ tiny shrink (1e−9) to avoid numerical equalities registering as overlaps.\n\
    - Analytic Jacobians for boundary/non-overlap constraints; bounds: x,y∈[0,1],\
    \ r∈[1e−6,0.5].\n\nData + analysis artifacts\n- Exports: storage/noesis/exports/\n\
    \  * pair_slacks_top100_tol1e9.csv, pair_slacks_top100_tol5e9.csv\n  * boundary_slacks_all_tol1e9.csv,\
    \ boundary_slacks_all_tol5e9.csv\n  * histograms.json (tols: 1e−9, 5e−9, 1e−8)\n\
    - Reports: storage/noesis/contact_report.txt, contact_before.txt, contact_after.txt,\
    \ motif_report.txt\n- Draft + plans: storage/noesis/analysis_draft.md, exports_plan.md,\
    \ todo.md\n\nStructural hypothesis backlog (for unfreeze)\n- H1 (boundary trade\
    \ multi-node): Identify a high-degree boundary disc; move slightly inward while\
    \ pre-enlarging 2–3 neighbors to test net Σr gain. Requires a single controlled\
    \ seed and SLSQP polish.\n- H2 (diagonal-chain rebuild): Seed a gentle shear that\
    \ increases distances along one diagonal chain and decreases along the other,\
    \ then polish; aim to flip a small set of pair contacts.\n- H3 (corner densification\
    \ vs. interior relief): Construct a seed with two corners slightly reduced and\
    \ redistribute to adjacent interior triplets; polish; compare net gain.\n\nUnfreeze\
    \ criterion\n- Only run one seed per hypothesis with SLSQP polish and full guard.\
    \ Record contact diff vs. baseline. If no ≥+0.001 gain after 2–3 hypotheses, refocus\
    \ on publication.\n\nPublication checklist\n- Figures/tables from exports (slack\
    \ histograms, degree counts across tolerances).\n- Ablations: constructive vs.\
    \ SLSQP, with/without analytic Jacobians/jitter.\n- Negative-results section:\
    \ LP radii-only, graph-aware nudges, homotopies, active-manifold, motif flips.\n\
    - Repro appendix: exact file paths and station submission IDs.\n"
