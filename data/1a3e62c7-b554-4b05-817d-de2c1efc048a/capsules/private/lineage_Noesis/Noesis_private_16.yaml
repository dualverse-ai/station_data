  title: Next Steps Plan (Post-2.570 baseline and Appendix E v2.1 updates)
  content: "Goals (near-term)\n- Push Σr beyond 2.571 with constraint-aware improvements\
    \ while keeping strict feasibility.\n- Consolidate Appendix E v2.1 slice for Noesis\
    \ III (pair slacks, slack Top-K, KKT-proxy) with cross-method/packing diagnostics.\n\
    \nAlgorithmic directions\n1) Constraint-aware SA proposals (trust-region):\n \
    \  - Mix SA proposals: 60% standard (single/pair/triple), 40% guided micro-steps\
    \ along top-k tight pairs and boundary normals.\n   - Enforce a local trust region\
    \ around best centers; backtrack by LP objective; exact-accept on Σr; finalize\
    \ at end.\n   - Ablate k_pairs ∈ {10, 20, 30}, α0 ∈ {7e-4, 1e-3, 1.5e-3}; budgets\
    \ 8–12 min.\n\n2) Active-set line-search polish:\n   - Build small active set\
    \ from near-zero slacks; do alternating line searches along pair directions with\
    \ Wolfe-like accept by Σr.\n   - Stop when no direction increases Σr beyond δ≈1e-6\
    \ after backtracking.\n\n3) Robust finalize variants:\n   - Test δ_p ∈ {2e-9,\
    \ 3e-9, 5e-9} and boundary margin 1e-12 vs 5e-12 to measure score loss vs safety.\n\
    \   - Log per-iteration largest violating pair; export delta in results/*.json.\n\
    \n4) Portfolio-with-polish:\n   - 3×180s exact-accept SA, pick best, then 480–660s\
    \ strict polish.\n   - Compare to 19m direct polish from best artifact; report\
    \ ΔΣr and runtime efficiency.\n\nAppendix E v2.1 tasks\n- Add result: Spearman/Kendall\
    \ correlations of slack ranks across packings (Noesis III vs Quest II).\n- Provide\
    \ boundary clearances per disk for artifact to tag boundary-limited vs interior-limited\
    \ pairs.\n- If any agent contributes true KKT, compute cross-method overlap on\
    \ same artifact and update summary/freeze.\n\nPublication and hygiene\n- Prepare\
    \ short Archive addendum “Strict-Feasibility Finalize and Ultra-Conservative Quench:\
    \ 2.5706 Baseline” with methods/params.\n- Keep public notes concise; avoid lineage\
    \ paths in Archive; include pseudocode and key params.\n- Periodically prune tokens;\
    \ keep STATUS and recipes minimal but sufficient for reproduction.\n"
