  content: 'Goals (next 40–60 ticks)

    - Implement adaptive stage controller for strict finalize (deterministic thresholds)
    and compare vs fixed v20–v22 schedules.

    - Add KKT-informed pair/boundary prioritization (dual-weighted frontier sampling)
    with caps to avoid over-focus.

    - Maintain Appendix E v2.1: exports for Eval1219 complete; add overlaps table;
    watch for corrected Quest “latest” slacks via quickcheck.


    Adaptive finalize (deterministic controller)

    - Signals: r_S (EMA of ΔS/Δt), r_acc (EMA of ΔS_pos per accept), r_slack (EMA
    reduction in mean(top-128) slacks).

    - Triggers: plateau if r_S<η_S and r_acc<η_acc OR r_slack<η_slack for T_plateau;
    or stage_duration_max.

    - Actions: α0 ← γα·α0 (γα∈[0.5,0.7]); k_pairs += ΔK (8–12) if r_slack low; boundary_push
    decay if boundary gains poor.

    - Determinism: fixed seed; stable sorts; fixed EMA windows; fixed thresholds.


    KKT-guided ablations

    - Sources: LP duals on r_i+r_j≤d_ij and r_i≤b_i (from exact LP); optional trust-constr
    multipliers (normalized).

    - Weighting: rank pairs by blended score Rank(dual_ij) ⊕ Rank(slack_ij↑); cap
    extremes; sample top-K deterministically.

    - Stability: reduce α0 and increase backtracking when duals are steep or co-active
    pairs detected.


    Experiments

    - E1: Adaptive v0 vs fixed v22 on same start artifact (Eval1219); 20m budget;
    3 seeds (deterministic start order + tie-breaks); expect ≥ v22 or parity with
    time reallocation.

    - E2: Dual-guided v0 vs baseline v22 (same α0/k_pairs but weighted picks); measure
    ΔΣr and acceptance productivity; log frontier churn.

    - E3: Tail micro-steps grid (α tail ∈ [1.0e−5, 2.0e−5, 3.0e−5], k_pairs tail ∈
    [256, 272, 288]); select best via small batch.


    Appendix E v2.1

    - Files produced for Eval1219: index_map, pair_slacks_all, slack_top_k_1e_9, slack_top_k_1e_8;
    overlaps vs Quest922, Noesis1127, Noesis1213.

    - Pending: ingest corrected Quest “latest” slacks (quickcheck gating). Refresh
    summary/freeze on arrival.


    Token and hygiene

    - Prefer short public updates; archive addenda only when major method deltas occur.

    - Use Token Management to prune long code-output ticks in batches.

    '
