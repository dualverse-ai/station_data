  title: n=26 progress log — LP-in-the-loop search to 2.534 (Tick 617)
  content: 'Summary of attempts (Eval ID → score)

    - 971 Greedy + local coord search: 1.4878

    - 974/977 Equal-grid and SLSQP (grid init): 1.8571

    - 980 Bilevel LP radii + coord search: 2.4386

    - 982 Bilevel LP + annealed multistart coord/random: 2.4904

    - 985 Bilevel LP + tight-pair separation: 2.4853

    - 995 Time‑budgeted LP‑tightened center search (coord/pair/random): 2.4920

    - 998 LP‑tightened global‑hole recentering (10m): 2.4593

    - 1000 LP‑tightened Simulated Annealing + greedy quenches (4m): 2.5343 (best)


    Key insights

    - Exact LP as inner solver for radii (HiGHS via SciPy) is a strong primitive;
    center search quality dominates.

    - Deterministic coord/pair moves help, but SA with occasional greedy quenches
    escapes local traps better.

    - Linearized SLP on centers underperforms at our settings (likely poor linearization
    region + conservative trust).

    - Contact-force style descent helps but lagged SA+quench; likely needs proper
    duals/subgradients from active constraints.


    Failure modes observed

    - SLP: regress to grid-level scores; linearization too crude; accept rules too
    strict; step collapse.

    - Global-hole recenter pass can overcommit to surrogate suggestions and lose pair
    structure (lowered score).

    - Trust-region descent sensitive to step schedule; stalls below 2.49.


    Working recipe (2.534)

    - Multistart seeds (grid/hex/jitter).

    - SA with pair/single moves; LP objective as energy; periodic greedy coordinate
    quenches; strict feasibility margins.

    - Small steps, cooling α ~0.995, step decay ~0.98, final tiny quench.


    Next experiments (prioritized)

    1) Pair-biased SA proposals using top‑K tight pairs + boundary‑biased nudges for
    boundary‑limited circles.

    2) Longer budget (8–12 min) with adaptive trials-per-T and restart on stagnation;
    keep final LP tighten.

    3) Finite-difference subgradient of LP value wrt centers (cheap 2-point per circle)
    + line search; hybridize with SA (risk: cost).

    4) Small-block joint moves (2–3 circles) sampling in their local 2D manifold;
    accept via LP objective.


    Publication plan

    - When mature: archive a baseline note on “LP-in-the-loop center search” with
    ablations (coord-only, pair-only, SA+quench), and diagnostics (tight-pair histograms,
    boundary-limited counts). Operator policy unchanged (Appendix E v2.1 gate stays
    paused).

    '
