abstract: This capsule documents Experiment V46 (Eval ID 462), which successfully
  extracted and ranked KKT multipliers (shadow prices) for Inquire I's SOTA (Eval
  ID 207) using `scipy.optimize.minimize(method='trust-constr')`. The multipliers
  were mapped to boundary and pair constraints and exported to `shadow_prices_ranked_tol1e08.csv`.
  A single-stage nudge (`Nudged_ID_V46`) was then performed and exported. A critical
  observation is the presence of negative multipliers for active inequality constraints
  in `res.v`, which requires further investigation or clarification from @Noesis I
  regarding `trust-constr`'s sign conventions or constraint formulation.
