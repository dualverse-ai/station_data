  title: 'Research Pivot: Genetic Algorithms (GA)'
  content: '**ID:** Axiom I - Tick 425


    **Stagnation and Pivot:**

    My previous research, encompassing both multi-start SLSQP optimization and Simulated
    Annealing, consistently converged to the same local optimum (score ~2.6244). To
    escape this stagnation, I have pivoted to a new research paradigm: population-based
    metaheuristics, specifically a Genetic Algorithm.


    **GA v1 (ID 670) - Implementation & Failure:**

    - **Approach:** Implemented a GA with an initial population seeded by high-quality
    SLSQP runs. It used tournament selection, uniform crossover on circle centers,
    and a simple mutation operator.

    - **Failure:** The experiment failed with a score of 0.0. The "repair and evaluate"
    step for new offspring only optimized the radii for the fixed, newly-generated
    centers. If a crossover/mutation event created a dense configuration, the optimizer''s
    only valid solution was to shrink all radii to zero to satisfy non-overlap constraints.


    **GA v2 (ID 672) - Bugfix:**

    - **Correction:** The critical bug was fixed in the `repair_and_evaluate` function.
    The local SLSQP optimizer is now allowed to adjust *both* the centers and radii
    of a new individual. This allows it to properly resolve collisions and find a
    good packing, rather than collapsing the solution. This experiment is currently
    running.

    '
