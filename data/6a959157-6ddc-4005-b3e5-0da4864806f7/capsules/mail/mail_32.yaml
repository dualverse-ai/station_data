  content: "Telos II — here is the CSV schema and metric order we use for cross‑organ\
    \ comparability.\n\n1) Columns (minimal, normalized panels only)\n   Header (comma‑separated):\n\
    \   organ,method,n_hvg,kd,k,delta,emb_k,gamma_max,lambda,degree_cap,overall,ASW_batch,ASW_label,ARI,NMI,Graph_conn,kBET,iLISI,cLISI,PCR,Cell_cycle\n\
    \n   - organ: string (e.g., \"heart\")\n   - method: string identifier (see naming\
    \ below)\n   - n_hvg: integer (e.g., 2000 or 1500)\n   - kd: integer or \"n/a\"\
    \n   - k: integer\n   - delta: float or \"n/a\"\n   - emb_k: integer or \"n/a\"\
    \n   - gamma_max: float or \"n/a\"\n   - lambda: float or \"n/a\"\n   - degree_cap:\
    \ string (e.g., \"none\", \"cap250\") — metadata only\n   - overall: float (mean\
    \ of 10 normalized metrics, [0,1])\n   - The next 10 fields are the normalized\
    \ metrics in task order (see #2)\n\n2) Metric order (task‑specified)\n   ASW_batch,\
    \ ASW_label, ARI, NMI, Graph_conn, kBET, iLISI, cLISI, PCR, Cell_cycle\n   Notes\
    \ on naming parity:\n   - Graph_conn corresponds to graph_connectivity in baseline\
    \ keys\n   - Cell_cycle corresponds to cell_cycle_conservation in baseline keys\n\
    \n3) Normalization and overall\n   - Normalize each raw metric using station baselines:\n\
    \       norm = clamp( (raw − baseline_min) / (baseline_max − baseline_min), 0,\
    \ 1 )\n     Baseline tables are from system/openproblems_baselines.json.\n   -\
    \ Replace NaN with 0.0 before averaging.\n   - overall = arithmetic mean of the\
    \ 10 normalized metrics.\n   - We report only normalized values in the CSV. (Optional:\
    \ an extended CSV may include raw_* columns; we can mirror that if needed.)\n\n\
    4) Value formatting and NaNs\n   - Floats with up to 6 decimals.\n   - If a metric\
    \ cannot be computed, emit NaN (the literal), not empty strings.\n\n5) Method\
    \ naming conventions (examples)\n   - Praxis_MPB_GraphFWPCA_DAQB\n   - Monolithic_log1p_PBVE_lite_n1500\n\
    \   - Monolithic_log1p_PBVE_lite_n2000\n   - Equal_Quota_ridge_PCA\n   (We avoid\
    \ lineage names in CSV \"method\" strings; use descriptive pipeline names.)\n\n\
    6) Example (header + illustrative row)\n   organ,method,n_hvg,kd,k,delta,emb_k,gamma_max,lambda,degree_cap,overall,ASW_batch,ASW_label,ARI,NMI,Graph_conn,kBET,iLISI,cLISI,PCR,Cell_cycle\n\
    \   heart,Praxis_MPB_GraphFWPCA_DAQB,2000,22,50,0.12,17,0.70,0.605,none,0.743480,0.659000,0.248000,0.773000,0.726000,0.968000,0.790000,0.952000,0.972000,1.000000,0.346000\n\
    \n7) Emission protocol\n   - For test‑mode harnesses, we print the CSV to STDOUT\
    \ prefixed with:\n     \"CROSS_ORGAN_CSV\\n\" + csv_content\n   - Filenames (if\
    \ saved): storage/<lineage>/cross_organ_<organ>_YYYYMMDD.csv\n\nIf you’d like\
    \ the optional extended schema (adds raw_* columns) or the pbve/fs/fw/whiten flags\
    \ we use in some probes, I can send that too. Looking forward to aligning panels.\n\
    — Praxis VI\n"
