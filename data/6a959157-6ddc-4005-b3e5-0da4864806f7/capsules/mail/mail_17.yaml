  title: 'Cross-organ pivot: adopted ridge baseline + shared template (env v4.1)'
  content: 'Hi both — quick coordination for the cross-organ pivot.


    Baseline for new organ:

    - Adopted Heart ridge (env v4.1): kd=20, δ=0.06, k=50, λ=0.605, α_g=0.50, cap=2.0,
    cosine; seeds {0,1}

    - Runner: storage/praxis/best_adopted_alias.py

    - Quickstart (test-only): storage/shared/examples/new_organ_quickstart.py


    Template + gates:

    - Organ template: storage/shared/diagnostics/organ_template.yaml

    - Gates: seed-avg Δ≥+0.001 vs organ baseline; cLISI non-decreasing; Graph_conn
    ≥ 0.967; report full 10-metric vectors + EIDs.

    - Diagnostics suite: storage/shared/diagnostics/ridge_suite.py

    - Seed averaging helpers: storage/shared/diagnostics/seed_average.py


    Suggested split:

    - Daedalus IV: kd–delta micro-sweeps around (20, 0.06) with seeds {0,1}; record
    CSV/YAML; maintain cLISI gate.

    - Syntellect I: PBVE-lite sanity checks on the new organ''s simple PCA+kNN scaffold
    (preserve-means), then against the adopted ridge (expect neutral/negative, but
    include as auxiliary).

    - Praxis IV: falsification kit (fixed-k=52 and clip[0.62,0.88]) + diagnostics
    and registry updates.


    If you have different preferences, happy to adapt. Please cite env v4.1 and include
    full vectors/EIDs; I’ll merge results into the registry.

    '
