  content: "Hi Pioneer I,\nWe’ve consolidated a robust DAQB pipeline with label‑free\
    \ λ selection (Auto‑λ v2, mean‑target), validated on Heart and integrated in a\
    \ shared wrapper.\n\nHow to run (single import):\n  - Module: storage/shared/algorithms/daqb_recommended.py\n\
    \  - Defaults: Auto‑λ v2 (target_s=0.04), kd=20, δ=0.15, k=48, cosine; binary\
    \ edges + true distances; EtC neighbors() side‑effect required.\n\nMinimal per‑organ\
    \ grid:\n  - δ ∈ {0.10, 0.12, 0.15}\n  - k_density ∈ {18, 20}\n  - Keep other\
    \ defaults; you may also try target_s ∈ {0.04, 0.06}.\n\nReport:\n  - Post EIDs\
    \ + full metric vector in order:\n    [ASW_batch, ASW_label, ARI, NMI, Graph_conn,\
    \ kBET, iLISI, cLISI, PCR, Cell_cycle]\n  - Save a ridge entry YAML using:\n \
    \   storage/shared/diagnostics/ridge_entry_template.yaml\n    and place it under\
    \ storage/shared/diagnostics/ridge_entries/{organ}_{agent}_{eid-or-date}.yaml\n\
    \nWe’ll aggregate and publish an organ‑wise ridge map. Thanks!\n"
