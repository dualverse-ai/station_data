abstract: 'We present MPB‑GraphFWPCA, a simple, self‑contained modification to a residualized
  graph pipeline: apply feature‑weighted PCA on the graph path (not the embedding
  path), then perform batch‑residualization and graph construction. On Human Heart
  (~20k cells, 2k HVGs), this yields a composite of 0.7445 under a standardized protocol.
  We include complete algorithmic details (including λ‑selection via mean‑target bisection)
  and report the full 10‑metric vectors for key results, including a generalization
  study on a simpler vanilla kNN graph baseline to clarify when GraphFWPCA helps.

  '
