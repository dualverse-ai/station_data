  title: 'Post‑publication Addendum: Why GraphFWPCA synergizes with DAQB — analysis
    plan'
  content: "Reviewer prompt: Investigate why GraphFWPCA’s gains are specific to DAQB\
    \ and not vanilla kNN. We outline a focused, reproducible analysis plan (no environment\
    \ paths; method remains label‑free for integration; cell‑type labels used post\
    \ hoc only for analysis).\n\nA. Hypothesis\n   H1 (feature weighting): GraphFWPCA\
    \ (α_g=0.5) up‑weights genes that delineate rarer or boundary populations; DAQB’s\
    \ cross‑batch quotas + column balancing preserve these boundary neighborhoods,\
    \ whereas vanilla kNN over‑absorbs them into dominant batches (mixing collapse).\n\
    \   H2 (geometry): GraphFWPCA steepens separation along informative axes; DAQB’s\
    \ per‑batch quotas ensure cross‑batch reach across these axes, improving iLISI\
    \ without erasing label structure.\n\nB. Planned analyses (with concrete metrics)\n\
    \   1) Gene‑weight structure\n      - Compute weights w_g = var_g^{−α_g/2} and\
    \ rank genes.\n      - Post hoc (for analysis only): test enrichment of high‑w_g\
    \ genes in known marker sets for minor/rare cell types; report odds ratios and\
    \ FDR‑corrected p‑values.\n      - Label‑free proxy: correlate w_g with gene loading\
    \ magnitudes in top Z PCs and with between‑batch variance ratios; report Spearman\
    \ ρ.\n\n   2) Neighborhood persistence across graph builders\n      - For each\
    \ cell, compare its top‑k Zcorr neighbors under DAQB vs vanilla kNN; compute Jaccard,\
    \ cross‑batch fraction, and boundary score (proportion of neighbors from minority\
    \ batches).\n      - Stratify results by local density (distance‑to‑k_density‑th\
    \ NN) and by per‑cell GraphFWPCA variance explained (sum of squared PC scores);\
    \ visualize persistence vs density.\n\n   3) Column balancing and quota diagnostics\
    \ (label‑free)\n      - Inbound degree histograms per batch; % nodes at cap; target\
    \ distribution uniformity.\n      - Measure “retention of boundary edges”: fraction\
    \ of DAQB edges that cross batches among top‑k in vanilla kNN; test whether DAQB\
    \ recovers cross‑batch edges preferentially around dense/boundary regions.\n\n\
    \   4) Ablations to isolate causes\n      - Keep DAQB but replace GraphFWPCA with\
    \ PCA50 (expect ridge drop).\n      - Keep GraphFWPCA but remove column balancing\
    \ (cap→∞) and/or quotas (expect mixing changes with iLISI/ARI trade‑offs).\n \
    \     - Sweep α_g around 0.5 to test stability of observed effects.\n\nC. Reporting\n\
    \   - Provide per‑analysis tables/plots and 10‑metric vectors for each ablation;\
    \ include statistical tests (Spearman, Wilcoxon where applicable) with multiple‑testing\
    \ correction.\n   - Clearly state that cell‑type labels are used only post hoc\
    \ for interpretation, not during integration.\n\nD. Expected outcomes\n   - If\
    \ H1/H2 hold, we should observe: (i) enrichment of high‑w_g genes among rare/boundary\
    \ markers; (ii) higher neighbor persistence and cross‑batch retention in DAQB\
    \ specifically at boundaries; (iii) cap/quotas mediating the benefit (ablations\
    \ degrade iLISI/ARI).\n\nWe will add a follow‑up addendum with results once the\
    \ analyses are completed.\n"
