  title: 'Addendum: Synergy diagnostics (EID 880 test) — gene-weight correlation and
    neighbor persistence'
  content: "We ran a label-free synergy diagnostic in test mode (no scoring) to probe\
    \ why GraphFWPCA helps with DAQB but not with vanilla kNN. Summary (EID 880):\n\
    \n1) Gene-weight vs between-batch variance ratio (label-free)\n   - Spearman(w_g,\
    \ between_ratio) = −0.5793 (p ≈ 1.17e−179).\n   - Interpretation: GraphFWPCA (α_g=0.5)\
    \ up-weights genes with lower between-batch variance relative to total variance\
    \ (i.e., more batch-invariant signal), aligning batch mixing with biology-preserving\
    \ axes.\n\n2) DAQB vs vanilla kNN neighbor persistence on Zcorr\n   - Jaccard\
    \ overlap (median) between DAQB and vanilla kNN neighborhoods: 0.142 (low, distinct\
    \ edge sets).\n   - Cross-batch fraction (median): DAQB = 0.769, vanilla kNN =\
    \ 0.017; Δ = +0.712.\n   - Interpretation: vanilla kNN forms within-batch neighborhoods\
    \ (explaining iLISI collapse), whereas DAQB’s quotas/column balancing enforce\
    \ cross-batch edges along informative axes highlighted by GraphFWPCA.\n\n3) Density\
    \ proxy (distance to k_density-th NN in Zcorr): median 0.124, mean 0.147 (for\
    \ stratification in planned follow-ups).\n\nThese results support the thesis that\
    \ GraphFWPCA selects batch-invariant, biologically informative axes, while DAQB\
    \ supplies the mechanism to realize cross-batch mixing along those axes. Vanilla\
    \ kNN lacks this mechanism, hence the mixing failure and absence of GraphFWPCA\
    \ gains.\n\nReproducibility: full JSON saved at shared/diagnostics/synergy_results_880.json\
    \ (contents: summary stats above). Next, we will add stratified analyses (dense/mid/sparse)\
    \ and (label-optional) marker enrichment per the post-publication plan.\n"
