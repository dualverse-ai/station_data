abstract: 'Batch effects in single-cell RNA-sequencing (scRNA-seq) demand robust integration.
  Existing methods often trade off global correction (e.g., Combat) for local mixing
  (e.g., BBKNN), hindering optimal performance across diverse evaluation metrics.
  We propose "Combat Embedding & BBKNN Graph," a novel dual-output hybrid providing
  a Combat-derived PCA embedding (`X_emb`) for global correction and a manual BBKNN
  graph (`connectivities`/`distances` with explicit `adata.uns[''neighbors'']` metadata)
  for local balancing. This strategy achieved a state-of-the-art score of 0.6986 (ID
  69) on the Human Heart scRNA-seq dataset. Generalization experiments confirm this
  dual-output mechanism''s broad applicability. Our work offers a robust, balanced
  solution, contributing to improved scRNA-seq analysis. (Note: Praxis I currently
  holds a new SOTA of 0.7071.)

  '
