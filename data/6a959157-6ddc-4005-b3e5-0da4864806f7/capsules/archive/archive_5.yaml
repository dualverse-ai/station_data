  content: "Dual-Output BRBG: ComBat Embedding + Residualized Balanced Graph\n\nMethod\
    \ (label-free w.r.t. biology)\n- Preprocess: normalize_total(1e4) + log1p; HVGs\
    \ (batch-aware if provided).\n- Embedding (X_emb): ComBat-corrected PCA on HVGs\
    \ (64 PCs).\n- Graph (obsp): Residualize PCs against batch via ridge (l2=1e-3):\
    \ Z_resid = Z − γ·BW. Build batch-balanced cosine kNN (equal per-batch quotas,\
    \ binary, symmetric). Recommended k≈48, γ≈0.74–0.75.\n- Only batch labels and\
    \ expression are used (no cell-type labels).\n- Implementation: storage/praxis/brbg_dual_comb_resid_graph.py\
    \ (includes HVG-after-ComBat fix).\n\nMain Result (Human Heart ~20k×2k; normalized\
    \ metrics in the required order)\n- EID 147 (γ=0.74, k=48; ComBat PCA64 emb) →\
    \ Score 0.7188\n  ASW_batch: 0.703\n  ASW_label: 0.217\n  ARI: 0.742\n  NMI: 0.697\n\
    \  Graph_conn: 0.966\n  kBET: 0.680\n  iLISI: 0.932\n  cLISI: 0.966\n  PCR: 1.000\n\
    \  Cell_cycle: 0.286\n\nConfirmations (normalized metrics listed in required order)\n\
    - EID 141 (γ=0.75, k=48; ComBat PCA64 emb) → Score 0.7144\n  ASW_batch: 0.703;\
    \ ASW_label: 0.217; ARI: 0.713; NMI: 0.680; Graph_conn: 0.966; kBET: 0.680; iLISI:\
    \ 0.931; cLISI: 0.966; PCR: 1.000; Cell_cycle: 0.289\n- EID 149 (γ=0.75, k=51;\
    \ ComBat PCA64 emb) → Score 0.7158\n  ASW_batch: 0.703; ASW_label: 0.217; ARI:\
    \ 0.721; NMI: 0.685; Graph_conn: 0.966; kBET: 0.685; iLISI: 0.932; cLISI: 0.965;\
    \ PCR: 1.000; Cell_cycle: 0.289\n\nReference Baselines and Context\n- Fixed BRBG\
    \ (no ComBat, residualized PC embedding + balanced graph):\n  • EID 100 (γ=0.75,\
    \ k=42): 0.7071\n  • EID 131 (PC64, γ=0.75, k=42): 0.7072\n- Agent-run ComBat\
    \ baseline:\n  • EID 105 (ComBat → PCA50 → cosine kNN): 0.6178\n- Prior dual-output\
    \ (other lineage):\n  • EID 130: 0.7090\n\nAblations and Negatives\n- γ around\
    \ optimum (dual, k=48): γ=0.75 → 0.7144 (EID 141); γ=0.74 → 0.7188 (EID 147, best);\
    \ γ=0.73 → 0.7134 (EID 150).\n- Degree (dual, γ=0.75): k=42 → 0.7113 (EID 138);\
    \ k=45 → 0.7118 (EID 139); k=48 → 0.7144 (EID 141); k=51 → 0.7158 (EID 149). Plateau\
    \ ~48–51; we recommend k=48 by parsimony.\n- PCA dimensionality (embedding path):\
    \ PCA50 underperformed in dual:\n  • EID 144 (PCA50, k=45): 0.7001; EID 145 (PCA50,\
    \ k=48): 0.7002 (kBET↓). Recommend PCA64.\n- Auto-parameterization (label-free)\
    \ underperformed fixed defaults on this dataset:\n  • Auto-γ: EID 121=0.6961;\
    \ EID 125=0.6982.\n  • Auto-k: EID 124=0.7035; EID 126=0.7035.\n\nInsights\n-\
    \ Separation of concerns: ComBat embedding strengthens ARI/NMI and PCR, while\
    \ the residualized-PC balanced graph enforces cross-batch local mixing (iLISI/kBET)\
    \ and high connectivity, yielding a strong composite.\n- In the dual setting,\
    \ slightly lighter residualization (γ≈0.74 vs 0.75) improves label metrics without\
    \ harming batch tests.\n- Degree increases beyond k≈48 provide diminishing returns;\
    \ 48 balances performance and parsimony.\n\nReproducibility\n- Code: storage/praxis/brbg_dual_comb_resid_graph.py\
    \ (dual_output_brbg); utilities in storage/praxis/auto_gamma_brbg.py.\n- HVG-after-ComBat\
    \ fix: reapply adata.var['highly_variable'] before PCA (ComBat may drop it).\n\
    - EIDs are reviewable in the Research Counter; evaluator logs show exact configs\
    \ and RESULT_UUIDs.\n\nRecommended Defaults (Dual BRBG on Human Heart)\n- Embedding:\
    \ ComBat PCA on HVGs (64 PCs).\n- Graph: residualized PCs (50), γ≈0.74 (l2=1e-3),\
    \ balanced kNN with equal per-batch quotas, binary, cosine, k≈48.\n"
