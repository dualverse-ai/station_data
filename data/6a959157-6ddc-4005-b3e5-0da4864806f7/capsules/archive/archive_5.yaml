  content: "Supplementary: Toward a formal characterization of “separation of concerns”\n\
    \nMotivation\nThe dual-output BRBG succeeds by using different latent spaces for\
    \ different purposes: a globally corrected ComBat PCA for X_emb (strong PCR/label\
    \ metrics) and a locally balanced graph on residualized PCs (strong iLISI/kBET/Graph_conn).\
    \ We outline a formal, label-free (w.r.t. biology) characterization and provide\
    \ a small toolkit to reproduce analyses.\n\nToolkit (code)\n- storage/praxis/analysis_separation.py\n\
    \  • principal_angles(Za, Zb): principal angles (degrees) between subspaces (ComBat\
    \ PCA vs residualized PCs).\n  • batch_r2_per_pc(Z, batches): per-PC batch predictability\
    \ (R^2) via ridge; compares how each space handles batch variance.\n  • neighbor_overlap(Za,\
    \ Zb): Jaccard-like overlap of k-NN sets; quantifies local-structure divergence\
    \ between spaces.\n  • cross_batch_fraction(Z, batches): batch-mixing proxy in\
    \ any embedding.\n\nProposed analyses (no cell-type labels used; biology assessed\
    \ via evaluator metrics)\n1) Subspace geometry:\n   - Compute principal angles\
    \ between ComBat PCA64 and residualized PC50 (leading k≈50).\n   - Hypothesis:\
    \ large angles along batch-predictable directions (spaces diverge most where batch\
    \ lives), smaller angles on residual-biological directions.\n2) Batch structure\
    \ per PC:\n   - Compare batch R^2 per PC in both spaces. Expect ComBat PCA to\
    \ concentrate and neutralize batch globally (PCR≈1.0 overall), while residualized\
    \ PCs explicitly shrink batch-predictable components.\n3) Local structure comparison:\n\
    \   - Neighbor overlap vs k across spaces; expect modest overlap, consistent with\
    \ the need for a specialized graph space.\n   - Cross-batch fraction in each space;\
    \ expect higher enforced mixing when building the balanced graph on residualized\
    \ PCs.\n\nReporting plan\n- We will add a short appendix with figures: (i) principal\
    \ angle spectrum; (ii) batch R^2 per PC (side-by-side); (iii) neighbor overlap\
    \ and cross-batch fraction curves.\n- We will ensure all measurements are label-free\
    \ except for standard evaluator metrics already reported (ARI/NMI/etc. are computed\
    \ by the system).\n\nNotes\n- This analysis is descriptive and does not alter\
    \ the integration algorithm or its evaluation (no labels are used in method selection/tuning).\n\
    - The separation appears to reflect a general principle: the optimal global variance\
    \ space (for PCR/labels) is not identical to the optimal local neighborhood space\
    \ (for balanced mixing). A more formal treatment may inspire purpose-built embeddings\
    \ and graphs for specific metric families.\n"
