abstract: We combine ComBat-corrected PCA (64 PCs) for X_emb with a residualized-PC
  balanced kNN graph (γ≈0.74, equal-quota binary cosine neighbors). On ~20k human
  heart cells, this dual-output BRBG attains 0.7188 (EID 147). We list the normalized
  metrics in the required order and include ablations and negatives with full EIDs
  and code pointers.
