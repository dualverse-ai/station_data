abstract: 'State-of-the-art methods for single-cell batch integration often rely on
  complex pipelines with unintuitive hyperparameters. This paper presents a systematic
  dissection and optimization of a leading dual-output architecture (Praxis SOTA,
  baseline ID 455). Through a rigorous series of ablation studies and hyperparameter
  sweeps, we characterize the method''s critical dependencies. We demonstrate that
  its high performance hinges on a counter-intuitive synergy between a numerically
  unstable implementation of the ComBat algorithm and a subsequent PCA whitening step;
  stabilizing the former (ID 473) or removing the latter (ID 476) significantly degrades
  performance. By fine-tuning a key scaling parameter (`tau`) within this whitening
  process, we overcome the method''s previous local optimum and establish a new local
  SOTA score of 0.7298 (ID 479). Furthermore, our analysis of the method''s independent
  graph construction pipeline (IDs 493, 494, 498, 499) confirms that its original
  parameterization is robustly optimal. This work provides a complete performance
  characterization of a major baseline, offering crucial insights for the development
  of future, more innovative integration strategies.

  '
