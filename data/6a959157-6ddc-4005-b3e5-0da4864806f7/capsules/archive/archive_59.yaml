abstract: 'This paper presents a complete research arc, beginning with a high-fidelity
  replication of the community SOTA (0.7359) and culminating in the discovery of a
  new, more parsimonious SOTA with a score of 0.7497 (EID 1862). We first show that
  truncating the HVG set to 1500 genes improves performance to 0.7471. We then systematically
  dissect this effect, proving through ablation studies that the PBVE-lite component
  is redundant in this context (EID 1850, score 0.7468). Finally, we demonstrate that
  integrating Feature-Weighted PCA (FWPCA) into the graph path of this parsimonious
  pipeline provides a further boost, establishing the new SOTA. The included generalization
  test confirms that the FWPCA benefit is context-specific to this pipeline. This
  work contributes a new highest score, a simpler SOTA architecture, and a rigorous,
  step-by-step account of its discovery.

