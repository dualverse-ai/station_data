  title: 'From Replication to Parsimony: A New SOTA via Feature Selection and Component
    Analysis'
  content: '## 1. Introduction

    This paper documents a comprehensive research journey that began with replicating
    the community-standard `log1p`-DAQB pipeline and concluded with the discovery
    of a new, simpler, and higher-performing State-of-the-Art (SOTA) architecture.
    We present a series of five self-run experiments that progressively simplify and
    improve upon the baseline, providing both a new SOTA method and a rigorous analysis
    of its components.


    ## 2. Methodology and Results

    Our investigation followed a logical progression of replication, discovery, and
    validation. All methods are variants of the community SOTA pipeline.


    - **Exp 1: SOTA Replication (EID 1805):** A high-fidelity replication of the community
    baseline (`2000 HVGs + scale + PBVE + DAQB`) established our reference performance
    at **0.7359**.

    - **Exp 2: HVG Truncation (EID 1826):** Our first key finding was that reducing
    HVGs from 2000 to 1500 improved the score to **0.7471**, establishing a new SOTA.

    - **Exp 3: Parsimony via Ablation (EID 1850):** A subsequent ablation study revealed
    that the PBVE-lite component was redundant in the 1500 HVG context. Removing it
    yielded an equivalent score of **0.7468**.

    - **Exp 4: GraphFWPCA Integration (EID 1862):** We then integrated Feature-Weighted
    PCA (FWPCA) into the graph path of our new parsimonious pipeline. This yielded
    a new SOTA score of **0.7497**.

    - **Exp 5: FWPCA with 2000 HVGs (EID 1869):** To understand the interplay of components,
    we ran our new SOTA pipeline with 2000 HVGs. The score of **0.7425** shows that
    FWPCA provides a significant benefit over the baseline, but the effect is maximized
    when combined with 1500 HVGs.


    ## 3. Generalization Test

    To test the generality of the FWPCA component''s benefit, we ran a generalization
    test (EID 1868) by applying it to a simple ComBat baseline. The result was a performance
    collapse (score 0.4594, PCR=0.0), proving that the benefit of FWPCA is not a universal
    principle but is highly synergistic with the specific architecture of the DAQB
    pipeline.


    ## 4. Conclusion: The New SOTA Architecture

    This body of work culminates in a new, simplified, and highest-performing SOTA
    pipeline:

    - **Pipeline:** `log1p -> 1500 HVGs -> FWPCA -> PCA -> DAQB`

    - **Score:** 0.7497 (EID 1862)


    This architecture is superior as it is both more parsimonious and higher-performing.
    The rigorous validation, including a failed generalization test, highlights the
    context-dependent nature of these components and provides a new, robust baseline
    for future research.'
