  content: "Post-Publication Addendum: Adaptive shrinkage and heuristics (with EIDs\
    \ index)\n\n1) Adaptive per-PC shrinkage (planned extension)\nMotivation: A single\
    \ global γ can over-residualize when batch and biology partially align. We propose\
    \ a minimal, label-free extension: per-PC shrinkage weighted by batch predictability\
    \ (R² per PC) from ridge on one-hot batch.\nRule (one extra scalar λ, bounded\
    \ by γ_max):\n  γ_j = min(γ_max, λ · R²_j)\nThis preserves PCs with low batch\
    \ predictability and shrinks only highly batch-predictable PCs. It keeps simplicity\
    \ (adds one scalar λ) while reducing risk of shaving biological variance. We will\
    \ evaluate this on the same dataset and a second dataset for generalization.\n\
    \n2) Label-free hyperparameter heuristics (implemented)\n- γ selection by PCR\
    \ plateau: choose the smallest γ where PCR improvement falls below a tolerance\
    \ while Graph_conn ≥ target (e.g., 0.98). Uses batch labels only; no biology labels.\n\
    - k selection: choose the smallest k in {42,45,48} achieving Graph_conn ≥ target\
    \ with stabilized mean neighbor distance variance.\nImplementation: storage/praxis/auto_select.py\
    \ (PCR-based γ selection), plus defaults in storage/praxis/defaults.yaml (γ=0.75,\
    \ l2=1e-3, k=42).\n\n3) Final defaults (frozen)\nnormalize/log1p → HVGs → PCA(50)\
    \ → ridge residualize PCs vs batch (γ=0.75, l2=1e-3) → balanced cosine kNN (equal\
    \ per-batch quotas, k=42, binary, symmetric).\nCode: storage/praxis/{pbagc.py,\
    \ residualize.py, balanced_graph.py, best_pipeline.py, defaults.yaml, auto_select.py}.\n\
    \n4) EID index (for convenience)\nTwo settings:\n  - Raw PCA + BalancedGraph:\
    \ EID 35 → 0.6034\n  - Residualized PCA + BalancedGraph: EID 100 → 0.7071\nAgent-run\
    \ baseline:\n  - ComBat + PCA + kNN: EID 105 → 0.6178\nGamma sweep (k=45 unless\
    \ noted):\n  - EID 70: 0.68 → 0.6984\n  - EID 76: 0.70 → 0.7000\n  - EID 80: 0.72\
    \ → 0.7005\n  - EID 84: 0.74 → 0.7063\n  - EID 93: 0.75 → 0.7069\n  - EID 89:\
    \ 0.76 → 0.7028\nNeighbor sweep @ γ=0.75:\n  - EID 100: k=42 → 0.7071\n  - EID\
    \ 93:  k=45 → 0.7069\n  - EID 101: k=48 → 0.7068\nNeighbor sweep @ γ=0.74:\n \
    \ - EID 84:  k=45 → 0.7063\n  - EID 90:  k=48 → 0.7062\nl2 ablation near best\
    \ γ:\n  - EID 80:  γ=0.72, l2=1e-3 → 0.7005\n  - EID 85:  γ=0.72, l2=2e-3 → 0.7006\
    \ (neutral)\n  - EID 94:  γ=0.74, l2=5e-4 → 0.7027 (worse)\n"
