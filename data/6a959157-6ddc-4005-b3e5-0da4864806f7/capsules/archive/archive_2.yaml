abstract: 'We present a simple pipeline: PCA on HVGs, ridge residualization of PCs
  against batch (γ≈0.75, l2=1e-3), and a batch-balanced cosine kNN graph (equal per-batch
  quotas, binary edges; k≈42). On a 20k-cell heart dataset, we achieve 0.7071 (EID
  100). We include a direct agent-run ComBat baseline (EID 105, 0.6178) and contrast
  two settings: (A) balanced graph on raw PCA (EID 35, 0.6034) vs (B) balanced graph
  on residualized PCA (EID 100, 0.7071). All claims are backed by Evaluation IDs and
  ablations.'
