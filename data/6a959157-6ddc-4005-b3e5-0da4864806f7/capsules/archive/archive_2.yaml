  content: "Addendum (Ticks 61–72): Dual-output BRBG and new SOTA\n\nSummary:\n- We\
    \ extend BRBG with a dual-output design: use a ComBat-corrected PCA embedding\
    \ for X_emb and retain the residualized-PC BalancedGraph for obsp. This separates\
    \ “global correction in embedding” from “local, batch-balanced mixing in graph.”\n\
    - New SOTA: 0.7118 (EID 139, BRBG-Dual-k45). Also, k=42 variant scored 0.7113\
    \ (EID 138). Both surpass 0.7090 (EID 130).\n- PCA dimensionality ablations at\
    \ fixed BRBG: PC40=0.7062 (EID 132), PC64=0.7072 (EID 131). Small gains; PC64\
    \ marginally above PC50.\n- Auto-parameterization (label-free) underperformed\
    \ fixed defaults on this dataset:\n  • Auto-γ v1/v2: 0.6961 (EID 121), 0.6982\
    \ (EID 125)\n  • Auto-k v1/v2: 0.7035 (EIDs 124, 126)\n  Recommendation: keep\
    \ fixed γ=0.75, k=42 (or 45 for dual) on Human Heart.\n\nKey EIDs:\n- Dual-output:\n\
    \  • EID 138: 0.7113 (ComBat PCA64 embedding + residualized-PC BalancedGraph k=42)\n\
    \  • EID 139: 0.7118 (ComBat PCA64 embedding + residualized-PC BalancedGraph k=45)\n\
    \  • Baseline dual by Logos I for comparison: EID 130: 0.7090\n- Fixed BRBG (for\
    \ reference): EID 100 (γ=0.75, k=42): 0.7071\n- PCA ablations (fixed BRBG): EID\
    \ 132 (PC40): 0.7062, EID 131 (PC64): 0.7072\n- Auto-params: EID 121 (auto-γ v1):\
    \ 0.6961; EID 125 (auto-γ v2): 0.6982; EID 124 (auto-k v1): 0.7035; EID 126 (auto-k\
    \ v2): 0.7035\n\nImplementation notes:\n- Important fix: ComBat can drop adata.var['highly_variable']—we\
    \ now reapply the HVG mask before PCA in the embedding branch. This was the root\
    \ cause addressed by the automatic debugger in EIDs 138/139; the fix has been\
    \ persisted in storage/praxis/brbg_dual_comb_resid_graph.py.\n\nTakeaways:\n-\
    \ Dual-output separation is powerful: ComBat embedding tends to boost ARI/NMI/ASW_batch,\
    \ while the residualized BalancedGraph preserves strong iLISI/Graph_conn. The\
    \ combination yields state-of-the-art composite scores.\n- On this dataset, k=45\
    \ slightly edges out k=42 in the dual setup; however, both are strong. For pure\
    \ BRBG without ComBat, k=42 remains a robust default.\n\nNext:\n- Test k=48 (dual)\
    \ to confirm plateau (submitted; EID pending).\n- Prepare a consolidated, minimal\
    \ public code release with dual and fixed BRBG paths, plus exact configs and result\
    \ UUIDs for all EIDs above.\n"
