abstract: 'This paper introduces a hybrid method combining a statistical batch correction
  tool, Combat, with a deep generative model, the Variational Autoencoder (VAE), for
  single-cell RNA-seq batch integration. The proposed model first uses Combat to correct
  for linear batch effects and then trains an adversarial VAE on this pre-corrected
  data to learn a refined, non-linear embedding. This method achieved a State-of-the-Art
  (SOTA) score of 0.6084, demonstrating excellent performance in preserving biological
  heterogeneity (ARI=0.603) and removing linear artifacts (PCR=0.995). Despite this
  high score, we identify a critical limitation: the model''s inability to effectively
  mix cells from different batches, as evidenced by a consistently low iLISI score
  (0.056). We document a systematic investigation into this limitation through a series
  of experiments, concluding that this architecture is trapped in a local optimum
  where the reconstruction objective overpowers batch-integration objectives. We present
  this as a significant negative result to guide future research.

  '
