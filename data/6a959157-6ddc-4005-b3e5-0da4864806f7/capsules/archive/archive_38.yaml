  title: 'Ridge Robustness with Generalization: Fixed‑k and Quota‑Clip Probes on Log1p
    and Anscombe Variants (Human Heart)'
  content: "1. Introduction\nSmall, topology‑near perturbations should not yield durable\
    \ gains if a baseline is robust. We study two such probes—(i) increasing total\
    \ neighbors k_total from 50 to 52, and (ii) a narrow quota‑clip adjustment—and\
    \ test them on two baselines: the canonical log1p ridge and an Anscombe‑normalized\
    \ variant. Acceptance gates: Δscore ≥ +0.001 (seed‑averaged if pursued), cLISI\
    \ non‑decreasing, and Graph_conn ≥ baseline−0.003.\n\n2. Methods (Self‑Contained)\n\
    Dataset: Human Heart (~20k cells, 2k HVGs). Evaluation: 10 normalized OpenProblems\
    \ metrics; primary score = mean.\nRidge (log1p) baseline: feature‑weighted PCA\
    \ → per‑batch ridge residualization with γ_j = min(0.74, 0.605·R²_j) → density‑adaptive,\
    \ quota‑balanced graph (binary connectivities, true distances), cosine, k_total=50,\
    \ k_density=22, delta=0.10, inbound cap=2.0×k, seed=0.\nAnscombe variant: same\
    \ as ridge except counts are variance‑stabilized by Anscombe (2√(x+3/8)) for both\
    \ embedding/graph paths; QC embedding uses simple per‑batch centering; graph path\
    \ otherwise identical. Environment tag: env v4.1 (evaluator uses supplied graphs\
    \ as‑is).\n\nProbes:\n- Fixed‑k: k_total=52 (all else unchanged).\n- Quota‑clip:\
    \ clip bounds [0.60,0.90]→[0.62,0.88] (all else unchanged).\n\n3. Results (spec‑ordered\
    \ vectors: [ASW_batch, ASW_label, ARI, NMI, Graph_conn, kBET, iLISI, cLISI, PCR,\
    \ Cell_cycle])\nLog1p ridge baseline:\n- EID 1104 (seed=0): 0.7414 → [0.659, 0.248,\
    \ 0.765, 0.725, 0.968, 0.789, 0.961, 0.973, 1.000, 0.327]\n- EID 1105 (seed=0):\
    \ 0.7414 → [0.659, 0.248, 0.765, 0.725, 0.968, 0.789, 0.961, 0.973, 1.000, 0.327]\n\
    \nLog1p probes:\n- Fixed‑k (k=52), EID 1064: 0.7421 → [0.659, 0.248, 0.773, 0.726,\
    \ 0.968, 0.790, 0.958, 0.972, 1.000, 0.327]\n  Decision: Reject (Δ≈+0.0007 < +0.001;\
    \ cLISI ↓ by ~0.001).\n- Quota‑clip [0.62,0.88], EID 1143: 0.7412 → [0.659, 0.248,\
    \ 0.765, 0.725, 0.968, 0.787, 0.961, 0.973, 1.000, 0.327]\n  Decision: Reject\
    \ (Δ<0).\n\nAnscombe variant baseline:\n- EID 1260 (seed=0): 0.6668 → [0.385,\
    \ 0.073, 0.577, 0.643, 0.994, 0.586, 0.963, 0.957, 1.000, 0.490]\n\nAnscombe probes:\n\
    - Fixed‑k (k=52), EID 1258: 0.6738 → [0.385, 0.073, 0.603, 0.636, 0.995, 0.584,\
    \ 0.963, 0.956, 1.000, 0.542]\n  Decision: Reject (Δ≈+0.007 vs 1260 but cLISI\
    \ ↓ by ~0.001 → gate fails).\n- Quota‑clip [0.62,0.88], EID 1259: 0.6634 → [0.385,\
    \ 0.073, 0.577, 0.643, 0.994, 0.585, 0.963, 0.957, 1.000, 0.457]\n  Decision:\
    \ Reject (Δ<0 vs 1260).\n\n4. Analysis\n- On the canonical ridge, both probes\
    \ are at or below parity and fail gates—consistent with prior ridge stability.\n\
    - On the Anscombe variant, fixed‑k raises the composite but slightly harms cLISI;\
    \ quota‑clip lowers the score. Under explicit gates, both are rejected. Thus,\
    \ robustness findings generalize across two normalization regimes.\n- Graph_conn\
    \ remains high in all runs (≥0.994), indicating usable graphs; cLISI/iLISI behavior\
    \ aligns with gate outcomes.\n\n5. Discussion\nMinimal topology changes (k and\
    \ modest target clip) are insufficient to deliver acceptable gains once cLISI\
    \ and connectivity constraints are enforced, across both log1p and Anscombe baselines.\
    \ This supports keeping the ridge frozen on Heart and using it as a reference\
    \ for future organs and for evaluating more substantive proposals.\n\n6. Conclusion\n\
    The ridge is robust to two low‑coupling topology‑near probes across two baselines.\
    \ Future work: apply the same protocol to additional organs and explore orthogonal\
    \ ideas (e.g., label‑free diagnostics‑guided modifications) under the same gates.\n\
    \n7. Reproducibility\nEnvironment: env v4.1; seed=0 unless noted. Full EIDs and\
    \ complete 10‑metric vectors are provided above.\n"
