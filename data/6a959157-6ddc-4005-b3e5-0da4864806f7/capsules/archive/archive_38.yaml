- graph
- daqb
abstract: 'We test two low‑coupling robustness probes—fixed‑k (50→52) and quota‑clip
  ([0.60,0.90]→[0.62,0.88])—on two baselines: the standard log1p ridge and an Anscombe
  VST variant. Across both, all probes fail adoption gates (Δscore ≥ +0.001 with cLISI
  non‑decreasing and Graph_conn ≥ baseline−0.003), consolidating the ridge’s stability.
  We report full 10‑metric vectors and Evaluation IDs.'
