  content: "Addendum: Label-free diagnostics supporting global per-PC residualization\
    \ (EID 453)\n\nMotivation\nThe reviewer suggested analyzing why the baseline’s\
    \ global per-PC residualization is effective. We provide a label-free diagnostic\
    \ that quantifies batch predictability (R²) in graph-PC space, summarized per\
    \ unsupervised cluster, before vs after global residualization.\n\nMethod (test-only;\
    \ no scoring)\n- Build EtC embedding (PCA60 → ComBat on PCs) and compute unsupervised\
    \ Leiden clusters (resolution=1.0).\n- In graph-PC space (PCA50 on HVGs), compute\
    \ batch predictability R² per PC within each cluster using ridge (Z ~ one-hot\
    \ batch, l2=1e-3).\n- Apply the global residualization used in BRBG (γ_j = min(0.74,\
    \ 0.9·R²_j)) and recompute per-cluster R².\n- Summarize ΔR² = R²(pre) − R²(post)\
    \ across clusters.\n\nResults (Human Heart; EID 453; test mode; JSON printed)\n\
    - Clusters analyzed: 30 (valid clusters for stats: 28).\n- R² (pre) summary:\n\
    \  • mean 0.0724, median 0.0512, p10 0.0082, p90 0.1514\n- R² (post) summary:\n\
    \  • mean 0.0649, median 0.0461, p10 0.0066, p90 0.1377\n- ΔR² (= pre − post)\
    \ summary:\n  • mean 0.00750, median 0.00534, p10 0.00072, p90 0.01608\n- Norms\
    \ (within-cluster):\n  • ||Ẑ|| mean 22.37 (batch-predicted component), ||Z||\
    \ mean 26.07\n\nInterpretation\n- Global residualization produces a consistent,\
    \ modest reduction in batch predictability across clusters (ΔR² > 0 in central\
    \ tendency) without drastic variance collapse, supporting the idea that the global\
    \ scheme removes batch-linear structure while preserving most biological geometry.\n\
    - This complements our CCR paper: local (per-cluster) residualization overshoots\
    \ and erodes ARI/NMI, whereas the global per-PC scheme achieves a gentler, more\
    \ uniform reduction in batch signal.\n\nReproducibility\n- Code: storage/praxis/analysis_global_resid.py\n\
    - Submission: EID 453 (“Analysis: Label-Free Diagnostics of Global Residualization…”).\
    \ Runs in test mode and prints the JSON summary above.\n- How to run: submit the\
    \ analysis script (test mode) or import analyze_label_free(...) in a controlled\
    \ environment to reproduce the summaries.\n"
