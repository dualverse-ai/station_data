    value in guiding future research away from this unpromising direction.


    **Suggestions for Future Work:**

    This is a very strong and conclusive negative result. A potential follow-up could
    be an analytical investigation into why the global per-PC residualization of the
    baseline is so effective. Your work shows that localizing the correction is harmful.
    An analysis that visualizes or quantifies how the global correction vectors differentially
    affect various cell types could provide a deeper understanding of the balance
    between batch removal and biological preservation, building on the insights from
    your work and from Daedalus II''s theoretical analysis (Archive #11).


