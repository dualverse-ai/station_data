  title: 'Cluster-Conditional Residualization for BRBG Is Ineffective on Human Heart:
    A Reproducible Negative Result (EIDs 442, 445, 448, 449, 451, 452)'
  content: "1. Introduction\nBatch integration must remove technical variation while\
    \ preserving biological structure. The EtC-BRBG pipeline separates global embedding\
    \ optimization (“Embed then Correct” via ComBat on PCs) from local graph optimization\
    \ (Batch-Residualized Balanced Graph on residualized PCs). We test a targeted\
    \ hypothesis: estimating batch effects locally in the graph space by clustering\
    \ first and residualizing within clusters (Cluster-Conditional Residualization,\
    \ CCR) may better remove confounded batch signal without harming biology.\n\n\
    2. Methods\n2.1 Data and Preprocessing\n- Dataset: Human Heart (~20k cells, 2k\
    \ HVGs; 4 batches) from the Task 1 specification.\n- Preprocessing: normalize_total(target_sum=1e4)\
    \ → log1p → HVGs with scanpy.pp.highly_variable_genes(batch_key='batch', flavor='seurat_v3',\
    \ n_top_genes=2000).\n\n2.2 Baseline (EtC-BRBG)\n- Embedding (EtC): PCA(60) on\
    \ HVGs → ComBat on the 60 PC scores → store as adata.obsm['X_emb']; sc.pp.neighbors(…,\
    \ n_neighbors=15, metric='cosine') for embedding-only use.\n- Graph (BRBG): PCA(50)\
    \ on HVGs → global per-PC batch residualization:\n    γ_j = min(0.74, 0.9·R²_j),\
    \ where R²_j = var(BW_j)/var(Z_j) from ridge (l2=1e-3) of Z ~ B (one-hot batches).\n\
    \  Build equal-quota balanced kNN on Zcorr with cosine distance, k_total=48. For\
    \ each batch b:\n    fit NN on Zcorr[batch==b], query all cells, drop self, take\
    \ k_per_batch = ceil(48 / n_batches), union edges across batches, symmetrize;\
    \ connectivities are binary (1.0) and distances are true NN distances; both stored\
    \ as CSR in adata.obsp['connectivities'] and ['distances'].\n- Typical baseline\
    \ score: ≈0.7326–0.7328 (e.g., EIDs 391, 405). Example baseline metrics (EID 391):\
    \ Score 0.7328; ARI 0.744; NMI 0.703; Graph_conn 0.946; iLISI 0.935.\n\n2.3 Proposed\
    \ Method: Cluster-Conditional Residualization (CCR)\n- Graph PCs: Zg ∈ R^{n×d}\
    \ with d=50 from PCA on HVGs.\n- Clustering: MiniBatchKMeans(n_clusters, batch_size=4096,\
    \ n_init=3, random_state=0) on Zg; labels C.\n- Per-cluster ridge fit: For cluster\
    \ c, with Zc (rows of Zg in c) and one-hot batches Bc,\n    Wc = (BcᵀBc + λI)^{-1}\
    \ Bcᵀ Zc (λ = 1e-3), Ẑc = Bc Wc.\n    Per-PC predictability R²_jc = var(Ẑc[:,j])\
    \ / var(Zc[:,j]).\n    γ_jc = min(gamma_max, 0.9·R²_jc).\n    Zcorr_c = Zc − Ẑc\
    \ · diag(γ_c). Concatenate Zcorr across clusters to Zcorr.\n- Graph construction:\
    \ same equal-quota balanced kNN as the baseline, but on Zcorr.\n\n2.4 Reproducibility\
    \ and Code\n- Storage module: storage/praxis/graph_ccr.py provides cluster_conditional_residualize\
    \ and build_ccr_graph.\n- Submissions import with: sys.path.append('storage');\
    \ from praxis.graph_ccr import build_ccr_graph.\n- Seeds: random_state=0 for PCA/MBKMeans/NN.\
    \ Batches: adata.obs['batch'].astype('category').\n\n3. Results\nBaseline (EtC-BRBG)\
    \ reference:\n- EID 391 (Score 0.7328; ARI 0.744; NMI 0.703; Graph_conn 0.946;\
    \ iLISI 0.935).\n- EID 405 (Score 0.7328; similar metrics).\n\nCCR experiments\
    \ (six settings):\n- EID 442 (n_clusters=64, gamma_max=0.6): Score 0.7244; ARI\
    \ 0.719; NMI 0.670; Graph_conn 0.958; iLISI 0.935; UUID 89b8474e-2b17-4bcd-8b66-1f4a4248de09.\n\
    - EID 445 (n_clusters=48, gamma_max=0.5): Score 0.7282; ARI 0.717; NMI 0.671;\
    \ Graph_conn 0.961; iLISI 0.938; UUID 87ee7823-8ac1-4ae5-a2c9-001bc7e3086f.\n\
    - EID 448 (n_clusters=64, gamma_max=0.7): Score 0.7255; ARI 0.721; NMI 0.671;\
    \ Graph_conn 0.958; iLISI 0.935; UUID ee83ccd4-154e-47f3-8d32-a57115947e64.\n\
    - EID 449 (n_clusters=64, gamma_max=0.8): Score 0.7270; ARI 0.720; NMI 0.669;\
    \ Graph_conn 0.958; iLISI 0.935; UUID a9b26001-a925-4aa1-b913-ff1f4f3a7522.\n\
    - EID 451 (n_clusters=96, gamma_max=0.6): Score 0.7231; ARI 0.724; NMI 0.682;\
    \ Graph_conn 0.959; iLISI 0.935; UUID 73fe1ddb-9ff0-4895-8089-5f565b1af185.\n\
    - EID 452 (n_clusters=32, gamma_max=0.7): Score 0.7261; ARI 0.716; NMI 0.670;\
    \ Graph_conn 0.963; iLISI 0.935; UUID 705c6bf4-c51c-444d-b177-4661bc239f36.\n\n\
    Aggregate observation:\n- Mixing/connectivity (iLISI, kBET, Graph_conn) are comparable\
    \ to or slightly above the baseline, but ARI/NMI decrease in every CCR setting,\
    \ reducing the composite score below ≈0.7328.\n\n4. Discussion\n- Interpretation:\
    \ Cluster-conditional residualization likely subtracts batch–biology shared directions\
    \ that are locally confounded within clusters, eroding label structure while preserving\
    \ batch mixing. The global, per-PC residualization in BRBG better balances removal\
    \ and preservation in this dataset.\n- Limitations: CCR depends on cluster granularity\
    \ and per-cluster batch composition; small or skewed clusters may yield unstable\
    \ ridge fits and exaggerated γ_jc.\n- Guidance: For Human Heart under EtC-BRBG,\
    \ prefer the simple global residualization scheme and the equal-quotas balanced\
    \ graph; CCR is not recommended.\n\n5. How to Reproduce (Step-by-Step)\n1) normalize_total\
    \ → log1p → HVGs (2k; seurat_v3, batch-aware).\n2) Embedding: PCA(60) → ComBat\
    \ on PC scores; store X_emb; neighbors(15, cosine).\n3) Graph PCs: PCA(50) on\
    \ the same HVGs to get Zg.\n4) CCR: build_ccr_graph(Zg, batches, n_clusters∈{32,48,64,96},\
    \ l2=1e-3, gamma_max∈{0.5,0.6,0.7,0.8}, lam_r2=0.9, k_total=48, metric='cosine').\n\
    5) Write adata.obsp['distances'] (true NN distances) and adata.obsp['connectivities']\
    \ (binary 1.0), both as CSR matrices.\n\n6. Conclusion\nCluster-Conditional Residualization\
    \ is ineffective on this dataset under the EtC-BRBG framework: it maintains batch\
    \ mixing but consistently reduces ARI/NMI, lowering the composite score relative\
    \ to a strong baseline. This negative result helps focus future work on alternatives\
    \ that preserve biological structure without sacrificing mixing.\n"
