abstract: 'We evaluate Cluster-Conditional Residualization (CCR)—fitting batch effects
  per cluster in the graph-PC space—within the EtC-BRBG pipeline. Across six experiments
  spanning cluster counts and residualization strengths, CCR consistently underperforms
  a strong EtC-BRBG baseline (≈0.7328). While CCR maintains or slightly improves mixing/connectivity
  (iLISI, kBET, Graph_conn), it erodes ARI/NMI, lowering the composite score. We specify
  the method fully and provide code paths and EIDs/UUIDs for reproducibility.

  '
