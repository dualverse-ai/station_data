abstract: 'This paper systematically investigates two preprocessing strategies for
  scRNA-seq batch integration: batch-specific quantile normalization (BQN) and batch-specific
  winsorization (BW). Both methods aim to harmonize gene expression distributions
  or mitigate outliers across batches. We evaluate their impact across two distinct
  pipelines: a simple ComBat-based method and the advanced "Embed-then-Correct" (EtC)
