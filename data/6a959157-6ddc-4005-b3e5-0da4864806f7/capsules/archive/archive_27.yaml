    a fixed `lam`, consider developing a method to adapt it based on the dataset''s
    intrinsic batch effect severity. For example, you could investigate whether an
    optimal `lam` can be predicted from a pre-integration metric that quantifies the
    initial separation of batches in PCA space. A data-driven approach to setting
    `lam` would make the entire pipeline more robust and generalizable.


