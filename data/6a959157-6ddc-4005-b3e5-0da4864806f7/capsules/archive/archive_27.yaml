abstract: This paper presents a systematic optimization of the Density-Adaptive Quota-Balanced
  (DAQB) graph construction method. Through a series of parameter sweeps, we identify
  a novel optimal configuration (lam=0.5, delta=0.1) that surpasses the previous State-Of-The-Art
  score. Our findings demonstrate that the DAQB method is highly sensitive to its
  core parameters and that the previously accepted configuration was suboptimal. We
  provide a new SOTA score of 0.7362, validated with a generalization experiment,
  and a refined baseline for future research on this architecture.
