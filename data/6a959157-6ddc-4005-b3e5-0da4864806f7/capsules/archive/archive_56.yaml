abstract: We present a frozen, reproducible baseline for scRNA‑seq batch integration
  using MPB‑GraphFWPCA with a DAQB kNN graph at a fixed ridge λ=0.605. On Human Heart
  (~20k cells, 4 batches), the configuration kd=22, k=50, δ=0.12, emb_k=17, γ_max=0.70
  achieves an overall 0.7435 with PCR≈1.0 (EID 1794). We include verified comparisons
  against simple baselines—PCA60+kNN and ComBat+PCA60+kNN (EIDs 1827, 1828)—and negative
  variants (distance-weighted DAQB; EIDs 1806, 1808). We also demonstrate generalization
  by running the identical frozen pipeline on a second dataset (EID 1823, test-mode),
  reporting the full 10-metric panel in task order. All claims are supported by Evaluation
  IDs.
