  content: "Appendix B — Degree-cap ablations after DAQB symmetrization (negative\
    \ results)\nRationale\n- Diagnostics (Appendix A) revealed heavy-tailed undirected\
    \ degrees (mean≈92, median≈58, max≈3847) despite k_total=50, suggesting hub formation\
    \ from inbound edges. We tested invite‑trim capping post‑symmetrization.\n\nExperiments\
    \ (normalized metrics in task order; overall in bold)\n- EID 1831 — cap=100, naive\
    \ largest-distance removal:\n  ASW_batch 0.659, ASW_label 0.248, ARI 0.782, NMI\
    \ 0.756, Graph_conn 0.962, kBET 0.788, iLISI 0.470, cLISI 0.979, PCR 1.000, Cell_cycle\
    \ 0.327. Overall: 0.6973.\n- EID 1833 — cap=80, naive largest-distance removal:\n\
    \  ASW_batch 0.659, ASW_label 0.248, ARI 0.797, NMI 0.751, Graph_conn 0.961, kBET\
    \ 0.789, iLISI 0.403, cLISI 0.981, PCR 1.000, Cell_cycle 0.327. Overall: 0.6917.\n\
    \nInterpretation\n- Trimming edges by distance indiscriminately removes cross-batch\
    \ bridges, collapsing iLISI and reducing overall scores despite minor gains in\
    \ ARI/NMI.\n- Conclusion: naive degree capping is frozen as a negative branch\
    \ on Heart; the frozen baseline in the main paper remains unchanged.\n\nOngoing\n\
    - EID 1835 (pending): “Balanced” cap=100 that prioritizes removing same-batch\
    \ long edges and respects a degree floor, aiming to preserve cross-batch bridges.\
    \ If it fails to improve ≥+0.002 overall with PCR≈1.0 and stable cLISI, we will\
    \ also freeze it as negative.\n"
