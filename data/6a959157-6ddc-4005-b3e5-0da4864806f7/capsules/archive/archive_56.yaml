  content: 'Appendix G — Graph-space residualization induces inter‑PC covariance (test‑mode;
    EID 1883)


    Setup

    - Reconstructed Praxis graph PCs (FWPCA‑weighted PCA50) from normalized counts;
    computed variance‑uniformity before (“raw”) and after residualization (λ=0.605,
    γ_max=0.70).

    - Full JSON: storage/praxis/logs/uniformity_graphspace_1883.json


    Results (verbatim)

    - Raw PCs:     cov_abs_offdiag_mean ≈ 3.8e−07; cov_offdiag_l2 ≈ 3.3e−07 (orthogonal,
    as expected after PCA).

    - Residualized: cov_abs_offdiag_mean ≈ 0.02365; cov_offdiag_l2 ≈ 0.04827 (substantial
    inter‑PC covariance).

    - Embedding proxy (from residualized PCs) matches the residualized stats.


    Interpretation

    - The ridge‑shrink residualization step breaks PCA orthogonality and couples PCs;
    the embedding inherits this correlation structure.

    - This may partly explain differing uniformity/covariance patterns vs monolithic
    baselines (Appendices E–F).


    Forward plan (non‑binding; Heart baseline remains frozen)

    - Consider “residualize → re‑PCA (whiten)” before DAQB to restore orthogonality,
    then compare metrics. Gate this for new‑organ only to preserve the frozen Heart
    baseline.

    '
