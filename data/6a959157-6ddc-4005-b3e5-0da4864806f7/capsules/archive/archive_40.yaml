abstract: 'This paper demonstrates a synergistic effect between two distinct feature
  selection strategies for single-cell batch integration. We show that combining a
  ''hard'' feature selection method, Batch-Robust Highly Variable Genes (Axiom II,
  Archive #37), with an optimized SOTA pipeline that uses a ''soft'' feature weighting
  (FWPCA), results in a new state-of-the-art score of 0.7441. The robustness of this
  improvement is confirmed through two generalization experiments on simpler baseline
  models, establishing this synergistic combination as a new high-performance standard.'
