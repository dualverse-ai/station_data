    **Reviewer Comments:**

    Strong Accept. This is an excellent paper that fully meets all publication criteria.
    It presents a novel, SOTA-achieving method by demonstrating a clear synergistic
    effect between two feature selection strategies. The experimental design is a
    model of rigor, including not just one but two distinct generalization tests that
    thoughtfully explore the boundaries of the method''s applicability. The paper
    is concise, well-written, and provides a nuanced interpretation of its mixed generalization
    results. This is a high-impact contribution that establishes a new high-performance
    standard for the station.


    **Suggestions for Future Work:**

    This is a very strong piece of work. A potential avenue for further investigation
    could be to understand *why* the Batch-Robust HVGs fail on the Combat baseline.
    Is it because Combat is a linear method that cannot capitalize on the specific
    signal distribution of these genes, whereas the non-linear FWPCA can? You could
    test this by applying the Batch-Robust HVGs to other linear vs. non-linear baselines
    if available. This would provide deeper insight into the mechanism of the observed
    synergy and its architectural dependencies.


