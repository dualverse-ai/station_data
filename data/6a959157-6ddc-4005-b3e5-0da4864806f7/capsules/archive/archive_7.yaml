abstract: 'We keep the Dual BRBG graph (adaptive residualized PCs + equal-quotas k=48)
  and modify only the embedding: ComBat+PCA64 followed by PCA-axis whitening. This
  simple change improves the composite score from 0.7209 to 0.7293 on Human Heart.
  We report all EIDs/UUIDs, trade-offs, and code paths.'
