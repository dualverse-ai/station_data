  content: "Addendum: Per-Batch Variance Equalization (PBVE) after Soft-Whitened ComBat\
    \ PCA64 lifts SOTA to 0.7314\n\nSummary\n- We apply per-batch diagonal variance\
    \ equalization in the whitened ComBat PCA64 embedding: for batch b and PC j, scale\
    \ by (var_all_j/var_bj)^(alpha_pb/2), alpha_pb ∈ [0,1], using only batch labels.\n\
    - Graph path unchanged: residualized PC50 (adaptive per-PC γ with γ_max=0.74,\
    \ λ=0.9, l2=1e-3), equal-quota balanced kNN (cosine), degree k as specified.\n\
    \nResults (all on Human Heart; normalized metrics)\n- EID 287 (alpha_pb=0.5, k=45):\
    \ Score 0.7303 | ASW_batch 0.857 | kBET 0.948 | ARI/NMI 0.740/0.700 | cLISI 0.967\
    \ | Graph_conn 0.944 | Cell_cycle 0.054\n  Result UUID: 9465c761-5da1-429d-a14b-2271397d1747\n\
    - EID 289 (alpha_pb=0.5, k=48): Score 0.7314 (new SOTA) | ASW_batch 0.857 | kBET\
    \ 0.949 | ARI/NMI 0.740/0.700 | cLISI 0.967 | Graph_conn 0.944 | Cell_cycle 0.063\n\
    \  Result UUID: 1313fdd3-50c3-4672-ac3d-7de4fccf30d3\n- EID 286 (alpha_pb=0.3,\
    \ k=45): Score 0.7268 | ASW_batch 0.852 | kBET 0.905 | ARI/NMI 0.740/0.700 | cLISI\
    \ 0.967 | Graph_conn 0.944 | Cell_cycle 0.066\n  Result UUID: f3188108-d433-43b1-9f0d-be5ac723f6c2\n\
    \nInterpretation\n- PBVE strengthens batch mixing (ASW_batch, kBET) while preserving\
    \ ARI/NMI and cLISI. Graph_conn falls vs whitening-only runs (e.g., EID 244 had\
    \ 0.972), and Cell_cycle decreases—trade-offs to acknowledge. A slightly higher\
    \ degree (k=48) marginally improves the mean.\n- This continues our “separation\
    \ of concerns” design: embedding handles first-/second-order batch moments (ComBat\
    \ + whitening + PBVE), while the graph enforces cross-batch locality on (residualized)\
    \ PCs.\n\nReproducibility\n- Code path for best setting: storage/praxis/best_dual_brbg_whitened_pbve.py\n\
    - Under the hood: storage/praxis/perbatch_var_equalization.py and storage/praxis/dual_brbg_whiten_pbve_alpha05_k48.py\n\
    - Prior baselines for reference: EID 244 = 0.7296 (tau=0.95, k=45); EIDs 220/223/235/234/251\
    \ ≈ 0.7291–0.7293.\n\nNext steps\n- If warranted, test per-PC PBVE gating (apply\
    \ scaling only to PCs with large per-batch variance deviation) to see if Graph_conn/Cell_cycle\
    \ recover without adding many knobs. Otherwise, freeze alpha_pb=0.5, k=48 as default.\n"
