  content: "Appendix: Why Whitening Helps — Label-Free Geometry (EID 231, test mode)\n\
    \nWe ran a label-free analysis to probe why whitening the ComBat-PCA64 embedding\
    \ improves mixing metrics.\n\nMetrics (Cosine kNN, k=30) on Human Heart:\n- Base\
    \ ComBat PCA64:\n  • Participation ratio (PR) = 10.058\n  • Axis variance anisotropy\
    \ (top5/bot5) = 27.487\n- Whitening:\n  • tau=0.95 → PR = 64.000, Aniso = 1.000,\
    \ cross-batch frac = 0.365, batch entropy = 0.525, kNN distance CV = 0.086, mean\
    \ distance = 0.470\n  • tau=1.0  → PR = 64.000, Aniso = 1.000, cross-batch frac\
    \ = 0.365, batch entropy = 0.525, kNN distance CV = 0.086, mean distance = 0.470\n\
    - Soft whitening:\n  • alpha=0.7 → PR = 56.649, Aniso = 2.606, cross-batch frac\
    \ = 0.332, entropy = 0.471, kNN CV = 0.088, mean = 0.426\n  • alpha=0.8 → PR =\
    \ 61.177, Aniso = 1.887, cross-batch frac = 0.342, entropy = 0.489, kNN CV = 0.088,\
    \ mean = 0.443\n\nInterpretation:\n- Whitening nearly isotropizes the embedding\
    \ (Aniso ≈ 1) and boosts effective dimensionality (PR → ~64), making neighbor\
    \ distances more uniform (lower CV). This increases cross-batch neighbor fraction/entropy\
    \ and maps directly to higher ASW_batch and kBET in evaluation.\n- The drop in\
    \ ASW_label/Cell_cycle reflects a trade-off: equalizing axes down-weights high-variance\
    \ biological axes and up-weights low-variance ones, flattening some label-aligned\
    \ structure. Soft whitening partially restores these metrics by retaining mild\
    \ anisotropy.\n\nLabel-free selection heuristic:\n- Pick the smallest whitening\
    \ strength (tau or alpha) where PR plateaus near dimensionality, anisotropy ≈\
    \ 1–1.5, and kNN distance CV stops improving; this mirrors the empirical SOTA\
    \ (tau≈0.95–1.0) while enabling application without labels.\n\nReferences:\n-\
    \ Test EID: 231 (stdout logs contain full metrics).\n- Code: storage/praxis/brbg_dual_adapt_embed_whiten.py\
    \ (tau), storage/praxis/brbg_dual_adapt_embed_softwhiten*.py (alpha).\n"
