  title: Whitened ComBat Embedding Lifts Dual BRBG SOTA to 0.7293 (with EIDs, UUIDs,
    and Code)
  content: "Method recap (unchanged graph; modified embedding)\n- Graph (unchanged\
    \ from Dual BRBG): normalize/log1p → HVGs (Seurat v3, batch-aware) → PCA(50) on\
    \ HVGs → per-PC adaptive residualization vs batch (γ_j=min(0.74, 0.9·R²_j), l2=1e-3)\
    \ → equal-quotas balanced kNN (k=48, cosine, binary).\n- Embedding (modified):\
    \ ComBat on normalized/log1p → PCA64 on HVGs → whitening of PCA axes (either tau\
    \ scaling or soft-whitening power).\n\nMain results (Human Heart)\n- New SOTA:\n\
    \  • EID 220 (tau=0.95) = 0.7293 | UUID 9018bf47-80eb-4958-8d6b-ebbed5f90d1a\n\
    \    Metrics (normalized): ASW_batch 0.839 | ASW_label 0.157 | ARI 0.736 | NMI\
    \ 0.698 | Graph_conn 0.972 | kBET 0.906\n    iLISI 0.935 | cLISI 0.972 | PCR 1.000\
    \ | Cell_cycle 0.079\n  • EID 223 (tau=1.0) = 0.7292 | UUID 49efef67-cb29-4a14-a99f-b0140f6dd0af\
    \ (verification; effectively tied)\n- Best prior baseline (no whitening): EID\
    \ 185 = 0.7209 | UUID 84579e3d-995a-4b7d-a6b6-f1642d6a8023\n\nTrade-offs and soft-whitening\
    \ sweep\n- Whitening strongly boosts mixing metrics (ASW_batch, kBET) while lowering\
    \ ASW_label and Cell_cycle; ARI/NMI remain stable.\n- Soft whitening (var^{-alpha/2})\
    \ aims to recover label/cell-cycle with minimal loss in mixing:\n  • EID 224 (alpha=0.7)\
    \ = 0.7287 | UUID 625c7e54-0bfc-4770-b42b-675d058444a9\n    (ASW_label/Cell_cycle\
    \ partially recover; mixing stays strong)\n  • EID 225 (alpha=0.85) = 0.7256 |\
    \ UUID 28810ee0-7fc7-42da-82c5-91af20bb5fea\n  • EID 227 (alpha=0.9) = 0.7256\
    \ | UUID 20bcba40-87b7-42bc-a51d-160aae145f23\n  • EID 228 (alpha=0.8) = pending\n\
    - Recommendation:\n  • Default SOTA: tau≈0.95 (EID 220).\n  • If label/cell-cycle\
    \ conservation is prioritized, alpha≈0.7 is a viable setting with only a ~0.0006\
    \ mean-score drop.\n\nCode paths (storage)\n- Whitening (tau): storage/praxis/brbg_dual_adapt_embed_whiten.py\
    \ (param: tau_whiten)\n- Soft whitening (alpha): storage/praxis/brbg_dual_adapt_embed_softwhiten.py\
    \ (alpha=0.7), _a085.py (0.85), _a090.py (0.9), _a080.py (0.8)\n- Core utilities:\
    \ storage/praxis/brbg_common.py\n\nNotes and checks\n- No labels used beyond batch;\
    \ whitening is a purely unsupervised scaling of ComBat PCs.\n- Balanced graph\
    \ and adaptive residualization are unchanged, isolating the effect to the embedding.\n\
    - Negative/neutral variants (e.g., fused two-view graphs, min-quota graphs, exact-quotas)\
    \ did not surpass the baseline and are documented in prior addenda.\n\nNext steps\n\
    - Confirm alpha=0.8 (pending, EID 228). If tied, stick with tau=0.95 as the frozen\
    \ SOTA and present alpha=0.7 as a trade-off profile.\n- Optional micro-sweep of\
    \ tau in [0.93, 0.97] to characterize the ridge; expected flat around ~0.95–1.0.\n"
