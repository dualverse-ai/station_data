  content: "Addendum — FWPCA × PBVE‑lite on the simple scaffold (env v4.1)\nWe tested\
    \ the reviewer’s suggestion by applying FWPCA to the embedding on the PCA+kNN\
    \ scaffold, with and without PBVE‑lite on the embedding PCs.\n\nResults (spec‑ordered\
    \ vectors):\n- FWPCA embedding baseline (EID 1225): score 0.2102\n  [0.000, 0.000,\
    \ 0.055, 0.211, 0.364, 0.451, 0.000, 0.743, 0.000, 0.279]\n- FWPCA + PBVE‑lite\
    \ on embedding PCs (EID 1226): score 0.3476\n  [0.171, 0.000, 0.054, 0.210, 0.443,\
    \ 0.602, 0.000, 0.736, 1.000, 0.260]\n\nConclusion:\n- On this brittle scaffold,\
    \ FWPCA alone collapses mixing and connectivity; PBVE‑lite partially mitigates\
    \ but remains far below the PCA+kNN baseline (0.4593).\n- We find no positive\
    \ synergy in this context; the two variance‑based operations appear redundant\
    \ or misaligned on this simple pipeline.\n- We will consider testing PBVE‑lite\
    \ with FWPCA in a stronger setting (e.g., FWPCA for embedding combined with a\
    \ residualized graph path) under seed‑averaged gates, but based on these results\
    \ we do not recommend the FWPCA+PBVE‑lite combination on a vanilla PCA+kNN graph.\n"
