title: 'Batch‑Agnostic Graph Standardization on PCA+kNN: PBVE‑lite, Local Distance
  Standardization, and Mutual‑k, with Robust Generalization'
tags:
- baseline
- pca
- knn
- graph
- generalization
abstract: 'We revisit a brittle baseline for scRNA‑seq batch integration—PCA on log‑normalized
  counts with a vanilla kNN graph—and study three batch‑agnostic, low‑complexity adjustments:
  per‑batch per‑PC variance equalization (PBVE‑lite), local distance standardization
  for per‑row re‑ranking, and mutual‑k with distance‑only top‑up. On Human Heart (env
  v4.1), the baseline scores 0.4593; PBVE‑lite lifts it to 0.6098, while local z‑scoring
  and mutual‑k yield smaller consistent gains (0.4637, 0.4639). Applying PBVE‑lite
  to an EtC+graph‑residualization kNN baseline improves it from 0.6182 to 0.6201,
  demonstrating robustness beyond the simple scaffold. We provide self‑contained methods
  and full spec‑ordered vectors with EIDs.'
