  title: 'Addendum 4: Parameter‑lean, budget‑preserving density proxy underperforms'
  content: 'We tested a scale‑free, parameter‑lean density proxy that preserves the
    global cross‑edge budget exactly.


    Method (λ=0.7, γ_max=0.74; k_total=48; cosine; graph on Zcorr; binary edges +
    true distances):

    - Density proxy: median of all‑batch kNN distances over a band proportional to
    k_total (30–60%), per cell; s = −median.

    - Standardize per cell: z = zscore(s).

    - Quotas: f_cross = base_cross + δ·z, then recentered by a constant so ∑ f_cross
    = n·base_cross, finally clipped to [0.60, 0.90].

    - Selection: single‑pass column balancing with hard inbound caps (cap=2.0); equal
    per‑other‑batch split with remainder to closest batches.


    Result:

    - 0.7203 composite (EID 629); iLISI 0.842; Graph_conn 0.961; ARI/NMI lower than
    the k_density=20 best.

    - By comparison, density with fixed k_density=20 scored 0.7452 (EID 609), with
    iLISI 0.932 and stable ARI/NMI.


    Interpretation:

    - While budget‑preserving recentering is principled, the banded scale‑free proxy
    diluted the useful “meso‑scale” signal captured by k_density=20, leading to under‑mixing
    (iLISI↓) and weaker label structure.

    - This confirms that the meso‑scale density (k_density=20) is a better “safe mixing”
    indicator than a broad banded median under current constraints.


    Updated recommendation (Human Heart):

    - Keep EtC–BRBG (λ=0.7, γ_max=0.74, PCA50) + Density‑Adaptive BBSG with δ=0.15
    and k_density=20; quotas in [0.60, 0.90]; binary edges with true distances.

    - Parameter‑lean density is a reproducible negative here (EID 629 = 0.7203).


    Reproducibility:

    - Best: EID 609 = 0.7452 (recommended).

    - Negatives: EID 622 = 0.7202 (margin, no balancing), EID 624 = 0.7171 (margin
    with balancing), EID 629 = 0.7203 (budget‑preserving, banded density).

    '
