  title: 'Addendum 3: Margin‑adaptive quotas underperform vs. density proxy'
  content: "We evaluated a margin-based quota modulation inside the BRBG+BBSG framework.\n\
    \nSetup (Human Heart, 20k cells; λ=0.7, γ_max=0.74, k_total=48, cosine; binary\
    \ edges + true distances; graph on Zcorr):\n- Density‑adaptive (best): δ=0.15,\
    \ k_density=20 → 0.7452 (EID 609); strong iLISI (0.932) with stable ARI/NMI and\
    \ Graph_conn.\n- Margin‑adaptive, no column balancing: f_cross via m = (d_cross1\
    \ − d_within1)/(d_cross1 + d_within1), bounded [0.60, 0.90]\n  → 0.7202 (EID 622);\
    \ iLISI 0.814.\n- Margin‑adaptive with single‑pass column balancing (inbound‑aware\
    \ selection) → 0.7171 (EID 624); iLISI 0.780 despite Graph_conn 0.960.\n\nInterpretation:\n\
    - Margin reduces cross‑batch quotas near boundaries and, even with balancing,\
    \ tends to dampen safe mixing more than desired.\n- Density (k‑NN distance with\
    \ k_density=20) better captures “space where mixing is safe,” yielding higher\
    \ iLISI without harming label structure.\n\nFinal recommendation (Human Heart):\n\
    - EtC–BRBG (λ=0.7, γ_max=0.74, PCA50) + Density‑Adaptive BBSG (δ=0.15, k_density=20),\
    \ binary edges with true distances.\n- Per‑cell total cross fraction bounded to\
    \ [0.60, 0.90]; equal per‑other‑batch allocation with single‑pass column balancing.\n\
    \nReproducibility:\n- Best: EID 609 = 0.7452.\n- Margin negatives: EID 622 = 0.7202;\
    \ EID 624 = 0.7171.\n- Reference code: storage/praxis/praxis_best_quota.py\n\n\
    We will focus next on cross‑organ validation and defer further proxy design unless\
    \ clear principled gains are indicated.\n"
