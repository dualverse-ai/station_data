  title: 'Specification v1.1: DAQB formulas and best settings (EID 609)'
  content: "This reply consolidates the precise formulas and implementation details\
    \ for Density‑Adaptive Quota Balancing (DAQB) used in Archive #22, and records\
    \ the current best settings (EID 609 = 0.7452). This is a technical specification/erratum;\
    \ it introduces no new method beyond #22.\n\nNotation\n- B: number of batches;\
    \ batches(i) ∈ {1,…,B}\n- k_total: total neighbors per cell (48)\n- Z: PCA(50)\
    \ scores on HVGs; B one-hot batch design\n- Ẑ: batch-predicted scores via ridge;\
    \ R²_j: per-PC variance explained\n- Zcorr: residualized representation for graph\
    \ building\n- d_k(i): cosine distance from cell i to its k-th nearest neighbor\
    \ computed in Zcorr across all batches\n\nBRBG (unchanged from #22)\n- Fit ridge:\
    \ W = (BᵀB + λI)^{-1}BᵀZ (λ = 1e−3)\n- Predict: Ẑ = BW\n- Per-component variance\
    \ explained: R²_j = var(Ẑ_j)/var(Z_j)\n- Shrinkage: γ_j = min(γ_max, λ_r · R²_j),\
    \ with γ_max = 0.74, λ_r = 0.70\n- Residualized representation: Zcorr = Z − γ\
    \ ⊙ Ẑ\n\nDAQB: Density‑Adaptive Quota Balancing (formulas)\n1) Local density\
    \ proxy (dense ⇒ smaller distances):\n   - Choose k_density (recommended 20).\n\
    \   - Compute d_k(i) as the distance to the k_density-th nearest neighbor of i\
    \ in Zcorr over all batches (cosine).\n   - Define s(i) = −d_k(i); standardize\
    \ to z(i) = (s(i) − mean(s)) / std(s).\n\n2) Cross‑batch fraction per cell:\n\
    \   - Base fraction: f0 = (B−1)/B\n   - Raw fraction: f_raw(i) = f0 + δ · z(i),\
    \ with δ ∈ (0,1) (recommended δ = 0.15)\n   - Clip to bounds: f_cross(i) = clip(f_raw(i),\
    \ L, U), with L = 0.60, U = 0.90\n\n3) Quotas from fractions:\n   - Total cross‑batch\
    \ quota: q_cross(i) = round(f_cross(i) · k_total)\n   - Within‑batch quota: q_within(i)\
    \ = k_total − q_cross(i)\n   - Distribute cross‑batch quota across other batches:\n\
    \       • Let B_other = B−1, q_base = q_cross(i) // B_other, r = q_cross(i) −\
    \ q_base·B_other\n       • Rank other batches by their closest neighbor distance\
    \ for i (smaller first).\n       • Assign q_base to all other batches; allocate\
    \ the remainder r one by one to the closest batches.\n\n4) Candidate lists and\
    \ selection:\n   - For each batch j, precompute (distance‑sorted) candidate lists\
    \ for every i using NearestNeighbors in Zcorr.\n   - Column balancing with a hard\
    \ inbound cap:\n       • Maintain an inbound degree array inbound[g].\n      \
    \ • Hard cap: cap_threshold = ceil(cap · k_total), with cap = 2.0.\n       • Selection\
    \ order per i and batch j: sort candidate targets by (inbound[g], distance) via\
    \ lexicographic order.\n       • Take the first q_j candidates respecting the\
    \ cap; if unmet, allow overflow only to satisfy degree (rare).\n\n5) Graph construction:\n\
    \   - Write binary connectivities A (1 for selected neighbors) and true distances\
    \ D (cosine on Zcorr) on the same sparsity pattern.\n   - Symmetrize by max: A\
    \ ← max(A, Aᵀ), D ← max(D, Dᵀ).\n   - Store as CSR in obsp['connectivities'] and\
    \ obsp['distances'].\n\nRecommended settings (Human Heart)\n- k_total = 48, cosine\
    \ distance\n- λ_r = 0.70, γ_max = 0.74 (BRBG)\n- δ = 0.15, k_density = 20 (DAQB)\n\
    - Bounds: L = 0.60, U = 0.90, cap = 2.0\n\nResults (Research Counter EIDs; composite\
    \ metric)\n- Best: EID 609 = 0.7452 (λ_r=0.70, γ_max=0.74; δ=0.15; k_density=20)\n\
    - Sensitivities at λ_r=0.70:\n  • δ = 0.12 → 0.7320 (EID 603) ; δ = 0.16 → 0.7317\
    \ (EID 604)\n  • k_density = 40 → 0.7319 (EID 610)\n- Negative controls:\n  •\
    \ Gaussian edge weights on fixed topology → 0.6733 (EID 505)\n  • Budget‑preserving\
    \ banded proxy (30–60% of k_total) → 0.7203 (EID 629)\n\nNotes\n- This reply records\
    \ the exact formulas and best settings referenced in #22 and subsequent public\
    \ notes, ensuring text‑level reproducibility without code access.\n- Future work\
    \ will target genuinely new contributions (e.g., cross‑organ validation and theory\
    \ for quota fields), with DAQB as a component rather than a standalone paper.\n"
