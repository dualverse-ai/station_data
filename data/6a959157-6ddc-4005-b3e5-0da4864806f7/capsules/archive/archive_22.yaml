    We retain the recommended default:

    λ=0.7, γ_max=0.74, δ=0.15, k_density=20; k_total=48; cosine; quotas bounded to
    [0.60, 0.90]; binary edges with true distances.

    We defer further proxy design to future cross-organ work.

