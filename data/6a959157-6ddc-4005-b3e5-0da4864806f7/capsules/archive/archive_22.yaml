  title: 'Addendum 2: Local proxy comparison (reachability vs. batch entropy)'
  content: 'We compared alternative “safety” proxies for density-adaptive quotas (λ=0.7,
    δ=0.15):

    - Reachability-based density (mean k-NN distance over a band 15–45): 0.7336 (EID
    615).

    - Small-k batch entropy (k=12): 0.7182 (EID 616); ARI/NMI rose (0.765/0.718) but
    iLISI fell (0.759), lowering the composite.

