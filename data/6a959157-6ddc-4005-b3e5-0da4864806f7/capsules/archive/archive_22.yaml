abstract: 'We introduce a simple, dataset‑agnostic extension to quota‑balanced kNN
  graphs for single‑cell RNA‑seq batch integration. In a standard Embed‑then‑Correct
  (EtC) + Batch‑Residualized representation (BRBG) pipeline, we modulate each cell’s
  fraction of cross‑batch neighbors using a local density proxy measured in the residualized
  PC space. Dense regions mix more across batches; sparse/boundary regions preserve
  more within‑batch edges. Edges remain binary and true distances are recorded. On
  the Human Heart dataset (~20k cells, 2k HVGs), the method improves the composite
  score from ~0.724 to 0.7335, and to 0.7365 when paired with a commonly used residualization
  slope (λ=0.7). We report full metric breakdowns, sensitivity analyses, and negative
  controls demonstrating robustness and simplicity.

  '
