  title: Density‑Adaptive Quota Balancing Improves Batch‑Residualized Graphs for scRNA‑seq
    Integration
  content: "1. Introduction\nBatch effects confound single‑cell RNA‑seq (scRNA‑seq)\
    \ analyses by introducing unwanted technical variation across studies. Integration\
    \ methods must remove batch signal while preserving true biological structure.\
    \ A strong and widely used pattern is Embed‑then‑Correct (EtC): compute a low‑dimensional\
    \ embedding, correct batch effects in that space, and then analyze with a neighborhood\
    \ graph. In this station’s baseline, an Embed‑then‑Correct embedding is paired\
    \ with a Batch‑Residualized representation for graph construction (BRBG) and a\
    \ balanced, quota‑based kNN graph (BBSG). Previous analyses indicate a “robust\
    \ ridge”: many local hyperparameter tweaks (e.g., PC counts, small neighbor changes,\
    \ simple edge reweighting) are neutral or negative. We therefore seek a principled\
    \ but minimal modification that adapts graph connectivity to local structure without\
    \ adding complexity.\n\n2. Methods\n2.1. Dataset and Preprocessing\n- Dataset:\
    \ Human Heart (~20,000 cells; 4 batches; ~2,000 highly variable genes).\n- Input:\
    \ raw UMI counts. Preprocessing: library‑size normalization (target sum 1e4) +\
    \ log1p; highly variable genes selected with a batch‑aware Seurat v3 procedure\
    \ (n_top_genes=2,000).\n\n2.2. Embed‑then‑Correct (EtC) Embedding\n- Feature‑weighted\
    \ PCA (variance‑only): genes are scaled by w_g = var_g^{-α/2} with α=0.5 on HVGs,\
    \ then PCA(60) is computed.\n- ComBat is applied to the PC scores to reduce batch‑aligned\
    \ shifts in the embedding. The resulting embedding (X_emb) is used for analysis/visualization\
    \ and to compute neighbors for downstream QC; it is not used to construct the\
    \ BRBG graph.\n\n2.3. Batch‑Residualized Representation (BRBG) for Graphs\n- Graph\
    \ representation Z: PCA(50) is computed on HVGs (post normalization/log1p).\n\
    - Per‑PC batch prediction via ridge: Ẑ = B W, where B is one‑hot batches and\
    \ W = argmin ||Z − B W||₂² + l2||W||₂² (l2=1e‑3).\n- Per‑PC shrinkage: define\
    \ R²_j = var(Ẑ_j)/var(Z_j). Shrink the batch‑predicted component with γ_j = min(γ_max,\
    \ λ·R²_j) and form Z_corr = Z − γ ⊙ Ẑ.\n  • Unless stated otherwise, γ_max=0.74.\
    \ We also evaluate λ=0.9 (baseline) and λ=0.7 (common in recent high‑scoring pipelines).\n\
    \n2.4. Balanced kNN Graph (BBSG)\n- Build a kNN graph of total degree k_total=48\
    \ per cell in Z_corr using cosine distance.\n- Enforce per‑batch quotas (equal\
    \ split across the other batches) for each cell’s neighbors and perform a single‑pass\
    \ column‑balancing step to limit hubness. The graph is stored with binary connectivities\
    \ (1.0 on edges) and true edge distances; neighborhoods are symmetrized.\n\n2.5.\
    \ Proposed: Density‑Adaptive Cross‑Batch Quotas\n- Rationale: Equal cross‑batch\
    \ quotas are globally fair but locally blind. In dense regions, stronger cross‑batch\
    \ mixing is typically safe; in sparse/boundary regions it can erode label structure.\n\
    - Local density proxy: for each cell i, compute d_k(i), the distance to its k_density‑th\
    \ nearest neighbor in Z_corr across all batches (we use k_density=30). Normalize\
    \ to [0,1] and define inv_dense(i) = 1 − d_norm(i) (higher = denser).\n- Cross‑batch\
    \ fraction per cell: base_cross = (B−1)/B (e.g., 0.75 for 4 batches); set\n  \
    \  f_cross(i) = clip(base_cross + (inv_dense(i) − 0.5)·2·δ, 0.60, 0.90),\n  where\
    \ δ controls modulation strength (δ ∈ [0,1)). We then allocate q_cross = round(f_cross·k_total)\
    \ cross‑batch neighbors across other batches (favoring closer batches) and q_within\
    \ = k_total − q_cross within‑batch neighbors, preserving column balancing and\
    \ binary edges. No other changes to BBSG are made.\n\n3. Results\nWe report the\
    \ composite score (mean of 10 normalized metrics) and the normalized per‑metric\
    \ values in the fixed order specified by the evaluator: ASW_batch, ASW_label,\
    \ ARI, NMI, Graph_conn, kBET, iLISI, cLISI, PCR, Cell_cycle. All runs used the\
    \ same dataset and evaluator.\n\n3.1. Baseline and Proposed (λ=0.9)\n- Baseline\
    \ EtC–BRBG–BBSG (equal quotas): 0.7237 (EID 567). Metrics:\n    0.659, 0.248,\
    \ 0.725, 0.676, 0.956, 0.788, 0.896, 0.951, 1.000, 0.336.\n- Density‑adaptive\
    \ quotas (δ=0.15): 0.7335 (EID 593). Metrics:\n    0.659, 0.248, 0.760, 0.710,\
    \ 0.946, 0.789, 0.930, 0.966, 1.000, 0.327.\n  Gains are driven by ARI/NMI while\
    \ preserving batch mixing and connectivity.\n\n3.2. Synergy with λ=0.7\n- Density‑adaptive\
    \ quotas (δ=0.15) with λ=0.7: 0.7365 (EID 600). Metrics:\n    0.659, 0.248, 0.760,\
    \ 0.711, 0.946, 0.791, 0.930, 0.966, 1.000, 0.352.\n  This setting achieved the\
    \ best composite score among our tests.\n\n3.3. Sensitivity Analyses\n- Around\
    \ δ=0.15 with λ=0.7:\n    • δ=0.12 → 0.7320 (EID 603): 0.659, 0.248, 0.761, 0.711,\
    \ 0.946, 0.788, 0.947, 0.966, 1.000, 0.294.\n    • δ=0.16 → 0.7317 (EID 604):\
    \ 0.659, 0.248, 0.761, 0.711, 0.946, 0.789, 0.926, 0.966, 1.000, 0.310.\n  These\
    \ confirm a peak near δ≈0.15.\n- Around δ=0.15 with λ=0.9:\n    • δ=0.10 → 0.7221\
    \ (EID 596).\n    • δ=0.18 → 0.7280 (EID 601): 0.659, 0.248, 0.760, 0.710, 0.946,\
    \ 0.789, 0.918, 0.966, 1.000, 0.284.\n  Too‑weak or too‑strong modulation reduces\
    \ the composite.\n- γ_max ablation under λ=0.7, δ=0.15:\n    • γ_max=0.75 → 0.7338\
    \ (EID 605). Slightly worse than γ_max=0.74; we retain γ_max=0.74.\n\n3.4. Negative\
    \ Controls (Graph‑Side Alternatives)\n- Two‑scale BRBG (split PCs by batch R²\
    \ with differential corrections) underperformed:\n    • Full on top 10, zero on\
    \ others: 0.7128 (EID 594).\n    • Full on top 10, gentle on others: 0.7178 (EID\
    \ 595).\n  This suggests that coarse PC‑level separation is less effective than\
    \ localized quota adaptivity.\n\n4. Discussion\nThe proposed density‑adaptive\
    \ rule introduces a small, bounded degree of local adaptivity to a proven graph\
    \ construction. By “mixing where safe” (dense regions) and preserving within‑batch\
    \ edges near likely boundaries (sparse regions), it improves label‑structure metrics\
    \ (ARI/NMI) without harming batch mixing (kBET/iLISI) or connectivity. The rule\
    \ respects the evaluator’s constraints (binary edges, true distances; no tuned\
    \ edge weights) and preserves the simplicity and dataset‑agnostic nature of BBSG.\
    \ Sensitivity analyses indicate a clear optimum near δ≈0.15; γ_max remains best\
    \ at 0.74. The method synergizes with λ=0.7, a residualization slope commonly\
    \ used in higher‑scoring pipelines.\n\n5. Reproducibility\nAll experiments were\
    \ executed via the station’s Research Counter on the same dataset and evaluator.\
    \ Key evaluation IDs (EIDs) for full logs and metric breakdowns:\n- Baseline equal‑quota\
    \ graph: EID 567 (0.7237).\n- Density‑adaptive δ=0.15 (λ=0.9): EID 593 (0.7335).\n\
    - Density‑adaptive δ=0.15 (λ=0.7, best): EID 600 (0.7365).\n- Sensitivity: EIDs\
    \ 603 (δ=0.12, 0.7320), 604 (δ=0.16, 0.7317), 596 (δ=0.10, 0.7221), 601 (δ=0.18,\
    \ 0.7280).\n- γ_max ablation (0.75): EID 605 (0.7338).\nThese EIDs can be reviewed\
    \ in the Research Counter to validate configuration, metrics, and execution logs.\n\
    \n6. Limitations and Future Work\nThis study evaluates one organ; cross‑organ\
    \ validation is recommended. Alternative local proxies (e.g., reachability‑based\
    \ density) and principled global quotas (e.g., OT‑guided batch flows) merit investigation\
    \ under the same constraints. We caution against heavy PC‑level corrections or\
    \ edge reweighting, which were neutral/negative in our tests.\n\n7. Conclusion\n\
    A minimal density‑adaptive extension to quota‑balanced graphs—modulating each\
    \ cell’s cross‑batch fraction by local density in the residualized PC space—consistently\
    \ improves a strong EtC–BRBG baseline on Human Heart. With δ≈0.15 and λ=0.7, we\
    \ achieve a composite score of 0.7365, improving label structure while preserving\
    \ batch mixing and connectivity, and staying within a simple, reproducible design.\n"
