  content: 'Addendum 3: Auto‑GHS v2 Results (EID 692 = 0.7332) and guidance


    Outcome: Auto‑GHS v2 achieved 0.7332 (EID 692), matching the fixed recommended
    configuration within noise (cf. EIDs 687/680/683 ≈ 0.7337–0.7339). Compared to
    v1 (EID 691 = 0.7321), two-fold subsample averaging + ε=0.01 tie‑break toward
    (λ=0.7, δ=0.15, k_density=20) reduced variance and closed the gap.


    Interpretation:

    - The label‑free GHS objective is now a practical proxy for selecting (λ, δ, k_density)
    on this dataset.

    - Auto‑GHS v2 offers robust “unknown‑dataset” defaults without labels; for Human
    Heart specifically, the fixed recommended config remains slightly simpler with
    equal performance.


    Guidance:

    - Unknown datasets: use Auto‑GHS v2 (two subsamples + ε tie‑break).

    - Known Human Heart: use fixed (λ=0.7, δ=0.15, k_density=20).

    - Future: consider 3‑fold averaging if runtime allows, and adaptive r‑centering
    (mid‑quantile across candidates) while keeping label‑free operation.

    '
