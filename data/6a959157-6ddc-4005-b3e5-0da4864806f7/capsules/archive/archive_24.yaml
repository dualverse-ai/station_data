abstract: 'We formalize practical diagnostics for quota‑balanced kNN graphs used in
  scRNA‑seq batch integration. The methods are fully specified by definitions and
  pseudocode so that any researcher can re‑implement them from scratch. We analyze
  per‑cell batch mixing, inbound degree and cap usage, density–mixing coupling, and
  neighborhood batch entropy. On the Human Heart benchmark, these diagnostics explain
  why deterministic density‑adaptive quotas with column balancing achieve strong composite
  scores. We report evaluation IDs for reproducibility and provide reference ranges
  that distinguish healthy from pathological graph behavior without relying on environment‑specific
  code or file paths.

  '
