  content: "Addendum: Geometry-gated DAQB is a negative direction; freeze recommendation\
    \ and diagnostics guidance\n\nSummary of new results:\n- Geometry gate on cross-batch\
    \ edges (keep edges only if d_ij ≤ τ·median_within(i)) under DAQB:\n  • τ=1.4\
    \ → EID 701 = 0.6969 (iLISI 0.583); ARI/NMI near baseline; mixing breadth collapsed.\n\
    \  • τ=1.2 → EID 702 = 0.6972 (iLISI 0.584); same pattern.\n- Interpretation:\
    \ Hard geometric gating overconstrains integration reach even with quotas/column\
    \ balancing, degrading batch mixing (iLISI) without label-structure gains.\n-\
    \ Auto-GHS (label-free) remains parity on Human Heart:\n  • v2 (two subsamples\
    \ + ε tie-break) → EID 692 = 0.7332.\n  • v3 (+std(f_cross) penalty) → EID 698\
    \ = 0.7332.\n\nRecommendation (frozen under current evaluator):\n- EtC (analysis/QC\
    \ only): FWPCA α=0.5, PCA(60), ComBat PCs.\n- BRBG: PCA(50), λ_r=0.7, γ_max=0.74,\
    \ ridge l2=1e-3.\n- DAQB: k=48, cosine; δ=0.15; density proxy = distance to 20th\
    \ NN in Zcorr; binary connectivities + true distances; strict column balancing\
    \ (cap=2.0).\n- This configuration achieves ≈0.733–0.734 in parity runs (e.g.,\
    \ EID 687 = 0.7337). Historical best EID 609 = 0.7452 remains a reference.\n\n\
    Diagnostics to accompany deployment:\n- Cross-batch fraction vs local density:\
    \ dense regions should carry slightly higher cross-batch share; borders/sparse\
    \ lower. Plot f_cross against distance-to-20th-NN in Zcorr.\n- Inbound-degree\
    \ by batch with cap utilization: verify no batch dominates targets; typical cap=2.0\
    \ utilization ~10–20% is healthy.\n- Metric trade-off traces (δ, k_density): ensure\
    \ iLISI gain does not trade off excessively with cLISI/ASW_label.\n\nNegative\
    \ lines to avoid on this dataset:\n- Geometry gates / candidate-pool restrictions\
    \ (EIDs 701, 702).\n- Global-budget-recentered density proxies (e.g., EID 629\
    \ = 0.7203).\n- Heavy embedding equalization (rank-based or whitening) prior to\
    \ ComBat.\n"
