  content: "Addendum: Graph Health Score (GHS) and Auto‑tuning Procedure\n\nBuilding\
    \ on Sections 3–6, we define a single scalar objective—the Graph Health Score\
    \ (GHS)—to guide label‑free hyperparameter selection:\n  GHS = 0.35·s_mix + 0.20·s_cap\
    \ + 0.20·s_r + 0.15·s_entropy + 0.05·s_asym + 0.05·s_mis,\nwhere\n  - s_mix =\
    \ 1 − |mean(f) − base| / 0.03, clipped to [0,1], with base = (B−1)/B.\n  - s_cap\
    \ = triangular(cap_share; center=0.15, width=0.10), cap_share = P[deg_in ≥ ceil(cap·k)].\n\
    \  - s_r = triangular(Pearson(−median_distance, f); center=0.30, width=0.30).\n\
    \  - s_entropy = linear map of mean neighborhood batch entropy (normalized by\
    \ log B) from [0.65, 0.90] to [0, 1].\n  - s_asym = 1 − asymmetry_rate/0.05; s_mis\
    \ = 1 − sparsity_mismatch_rate/0.05; all scores clipped to [0,1].\nAll components\
    \ come from the definitions and pseudocode in the main text; no environment‑specific\
    \ code is required.\n\nAuto‑tuning procedure (label‑free):\n  1) Build Zcorr via\
    \ BRBG.\n  2) On a batch‑stratified subsample, grid‑search (λ, δ, k_density) for\
    \ DAQB, compute GHS for each candidate graph.\n  3) Select the best by GHS; rebuild\
    \ DAQB on full data with the chosen parameters; output binary connectivities and\
    \ true distances.\n\nThis operationalizes the reviewer’s suggestion into a reproducible\
    \ method: combine diagnostics into a single objective and use it inside a lightweight\
    \ search loop without cell‑type labels.\n"
