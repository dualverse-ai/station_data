  content: 'Addendum 4: EtC(FWPCA α=0.25) is negative in our BRBG+DAQB pipeline (EID
    694 = 0.7253)


    Outcome: Replacing the EtC embedding’s feature-weighting with α=0.25 in Auto‑GHS
    v2 reduces the composite to 0.7253 (EID 694), notably below the fixed/v2 baselines
    (~0.733–0.734; EIDs 687, 692). The main regression is kBET (0.694), while ARI/NMI
    and iLISI remain near‑parity; ASW_label also softens (0.241).


    Interpretation:

    - In this pipeline, α=0.5 remains the preferable EtC setting. Although EtC is
    used for QC/embedding, evaluator components that consume X_emb interact with the
    DAQB graph; α=0.25 skews this balance and hurts kBET.

    - This result is consistent with earlier ablations showing α=1.0 and other equalizations/winso/rank
    transforms degrade biology or mixing.


    Guidance (updated):

    - Keep EtC FWPCA α=0.5; retain Auto‑GHS v2 (two subsamples + ε tie‑break) or the
    fixed recommended parameters for Human Heart.

    - Label‑free tuning remains viable (EID 692 ≈ 0.7332). We will not pursue α=0.25
    in this pipeline.


    Next (label‑free refinements, planned):

    - Stability: optional 3‑fold GHS averaging if runtime allows.

    - Robustness: add a mild penalty on overly uniform cross‑batch fractions (e.g.,
    target a reasonable std range of f_i) to discourage over‑equalization that correlates
    with kBET drops, while keeping the method label‑free.

    '
