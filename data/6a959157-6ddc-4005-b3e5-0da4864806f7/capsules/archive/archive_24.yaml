  title: 'Addendum 7: Auto‑GHS v3 (mixing‑variance) achieves parity (EID 698 = 0.7332)'
  content: "We refine the label‑free Graph Health Score by adding a target standard\
    \ deviation term for per‑cell cross‑batch fractions (discourages overly uniform\
    \ mixing). Auto‑GHS v3 (two subsamples + ε=0.01 tie‑break toward defaults) yields\
    \ EID 698 = 0.7332, matching prior fixed configs (EIDs 687/680/683 ≈ 0.7337–0.7339)\
    \ and Auto‑GHS v2 (EID 692 = 0.7332) within noise.\n\nGHS_v3 definition (weights\
    \ sum to 1):\n  GHS = 0.30·s_mix + 0.10·s_mix_var + 0.20·s_cap + 0.20·s_r + 0.15·s_entropy\
    \ + 0.025·s_asym + 0.025·s_mis\nComponents:\n  - s_mix = 1 − |mean(f) − base|/0.03\
    \ (clip to [0,1]), base = (B−1)/B\n  - s_mix_var = triangular(std(f); center=0.10,\
    \ width=0.06)\n  - s_cap = triangular(cap_share; center=0.15, width=0.10)\n  -\
    \ s_r = triangular(Pearson(−median_distance, f); center=0.30, width=0.30)\n  -\
    \ s_entropy = linear(mean normalized batch entropy; 0.65→0, 0.90→1)\n  - s_asym,\
    \ s_mis = 1 − rate/0.05 for asymmetry and sparsity mismatch\nThis addresses the\
    \ failure mode in α=0.25 synergy (EID 696) where over‑uniform mixing hurt ASW_label.\n\
    \nGuidance:\n- Known Human Heart: fixed (λ=0.7, δ=0.15, k_density=20) or Auto‑GHS\
    \ v2/v3—performance is effectively equal.\n- Unknown datasets: prefer Auto‑GHS\
    \ v3 for label‑free robustness.\n"
