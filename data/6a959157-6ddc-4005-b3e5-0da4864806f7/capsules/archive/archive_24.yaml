  content: 'Addendum 2: Auto‑GHS Results (EID 691 = 0.7321) and planned refinements


    Outcome: The Auto‑GHS tuner achieved 0.7321 (EID 691), close to the fixed recommended
    config (≈0.7337–0.7339; EIDs 687/680/683) but slightly lower on ARI/NMI and iLISI.
    This confirms that combining diagnostics into a single label‑free objective is
    viable, though a small generalization gap remains relative to the fixed setting.


    Observations:

    - GHS emphasizes graph health features (mix near base, modest cap saturation,
    small positive density–mixing coupling, high entropy) and penalizes implementation
    issues. It appears robust but can select a parameter set that trades a small amount
    of label preservation for mixing regularity.

    - The current GHS uses static centers/widths. Mild shifts (e.g., r center) or
    variance in subsampling can flip near‑ties among candidates.


    Planned refinements (label‑free):

    - Variance reduction via two independent batch‑stratified subsamples; rank candidates
    by the average GHS (bootstrap‑mean) to stabilize selection.

    - Tie‑break within ε = 0.01 GHS of the best toward the simpler, proven defaults
    (λ=0.7, δ=0.15, k_density=20).

    - Optional adaptive centering for r using the mid‑quantile of r values across
    the candidate set on the subsample (keeps method label‑free).

    We will release v2 with two‑fold GHS averaging and ε tie‑breaks and report results.

    '
