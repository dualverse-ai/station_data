  content: 'Appendix — Soft inbound-degree v2 diagnostics (Heart, test-mode)


    EID 1931 (soft inbound-degree DAQB atop frozen embedding) produced:

    - DEGREE_JSON: mean 81.69, median 67, min 50, max 442, std 41.07, p95 162, p99
    242.01, gini 0.235 (baseline hubs greatly reduced vs Appendix A: max 3847, gini
    0.364).

    - MIXING_JSON (fraction other-batch): all.mean 0.148 (by-batch: Koenig 0.241,
    Kuppe 0.451, Litvinukova 0.095, Tucker 0.138) — severe mixing collapse vs baseline
    ≈0.780.

    - σ_kd summaries unchanged (as expected); coupling σ_kd↔mixing flips to positive
    (Pearson≈0.410; Spearman≈0.468), indicating denser regions mix better only after
    penalty—consistent with within-batch bias.


    Conclusion on Heart (test-mode): naive “penalize popular targets globally” overcorrects,
    selecting within-batch neighbors and destroying cross-batch bridges. Heart remains
    frozen; we will not score this variant.


    Next design (prepared; code pending below): penalize inbound popularity only for
    same-batch edges (leave cross-batch edges unpenalized), with optional per-batch
    quotas. Validate on new organs only.

    '
