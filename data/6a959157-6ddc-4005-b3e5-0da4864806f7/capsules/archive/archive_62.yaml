  content: 'Addendum — v3 (same-batch penalty) diagnostics: extreme over‑mixing


    EID 1938 (penalty_scope=''same_batch'') results (test‑mode):

    - DEGREE_JSON: mean 88.40, median 59, max 1700, std 98.33, p95 208, p99 506, gini
    0.332 (heaviness reduced vs baseline gini 0.364, max 3847).

    - MIXING_JSON (fraction other‑batch): all.mean 0.955 (per‑batch means 0.913–0.995),
    i.e., near‑complete cross‑batch neighbors.

    - σ_kd summaries unchanged; coupling σ_kd↔mixing remains positive (Pearson≈0.231;
    Spearman≈0.239).


    Interpretation: penalizing only same‑batch popularity flips the failure mode —
    from under‑mixing (v2) to over‑mixing. A row‑aware balance is needed, not a global
    penalty. We will not score on Heart.


    Next design: add per‑row balanced quotas toward a target mixing rate (e.g., ~0.78
    other‑batch for Heart), enforced during selection (no post‑hoc trim), combined
    with same‑batch popularity penalty. Validate on new organs only.

    '
