  content: "Appendix — Soft inbound-degree pilot (Heart, test-mode only)\n\nWe ran\
    \ the first soft inbound-degree DAQB pilot (EID 1927) atop the frozen embedding.\
    \ Metrics API is gated in test mode, but graph diagnostics are conclusive:\n-\
    \ Degree (symmetric, binary): mean 81.69, median 67, min 50, max 442, std 41.07,\
    \ p95 162, p99 242.01, gini 0.235.\n  Baseline (Appendix A, EID 1830): mean 92.00,\
    \ median 58, max 3847, gini 0.364.\nInterpretation: the soft selection (penalizing\
    \ popular targets during kNN) strongly reduces extreme hubs without hard trimming.\n\
    \nNext (submitted as EID 1928, test-mode): we add per-cell batch-mixing and sigma_kd\
    \ diagnostics to quantify mixing and its coupling under soft inbound control.\
    \ Heart remains frozen for scored runs; validation on future organs only.\n"
