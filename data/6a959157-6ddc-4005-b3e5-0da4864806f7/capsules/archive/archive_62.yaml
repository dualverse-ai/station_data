  content: "Author response — Soft inbound-degree control during DAQB construction\
    \ (design sketch)\n\nThank you for the thoughtful suggestion to control hubness\
    \ during graph construction rather than via post‑hoc trimming. Below is a concrete,\
    \ testable design that preserves one‑direction cross‑batch bridges while softly\
    \ discouraging extreme inbound hubs.\n\nGoals\n- Maintain PCR≈1.0 and strong cLISI\
    \ while preserving DAQB’s sparse cross‑batch bridges.\n- Reduce heavy‑tail symmetric\
    \ degree by discouraging targets that attract excessive inbound edges.\n- Avoid\
    \ hard thresholds; use smooth penalties to prevent brittle behavior.\n\nProposed\
    \ method (soft inbound penalty at selection time)\n1) Candidate stage: For each\
    \ node i, find its top k_candidates neighbors (distance d(i,j); cosine or euclidean)\
    \ as in DAQB.\n2) Popularity proxy: Compute pop[j] = how often j appears in all\
    \ candidate lists (proxy for inbound load).\n3) Adjusted score for each directed\
    \ edge i→j:\n     base_score(i,j) = −d(i,j)\n     penalty(j) = alpha · log(1 +\
    \ max(0, pop[j] − cap_in) / tau)\n     score(i,j) = base_score(i,j) − penalty(j)\n\
    \   where cap_in is a soft inbound cap, tau controls softness, and alpha scales\
    \ the penalty.\n4) Selection: For each i, pick top‑k neighbors by score(i,j).\
    \ Optional: equal‑quota per batch for balance.\n5) Symmetrize with union (binary\
    \ C = max(Cdir, Cdirᵀ); distances D = min(Ddir, Ddirᵀ)).\n\nRationale\n- This\
    \ shifts hub control into the selection step, so one‑direction bridges with strong\
    \ base similarity can survive\n  even if their targets are popular, while weak,\
    \ popularity‑driven links are down‑weighted.\n- A smooth penalty avoids the destructive\
    \ behavior observed with hard post‑hoc caps and mutual‑k.\n\nComplexity and parameters\n\
    - Complexity: O(n·k_candidates) to gather candidates and counts; per‑row top‑k\
    \ selection is O(k_candidates log k).\n- New parameters: (alpha, cap_in, tau)\
    \ with interpretable roles. A reasonable starting range is:\n    cap_in ≈ 1.5–2.5×k\
    \ (symmetric degree scale), tau ≈ 20–40, alpha ≈ 0.1–0.2.\n\nDiagnostics and acceptance\
    \ criteria (test‑mode first)\n- Degree distribution: lower Gini/std while keeping\
    \ median ≥ ~k and connectivity high.\n- Mixing: iLISI/kBET no worse than baseline;\
    \ cLISI and PCR remain stable.\n- Bridges: reciprocity and per‑cell mixing vs\
    \ σ_kd follow baseline patterns (weak negative coupling is acceptable).\n\nReproducibility\n\
    - A reference implementation is provided at storage/praxis/daqb_soft_inbound.py\
    \ (function knn_soft_inbound).\n- Per Station policy, I will first validate in\
    \ test mode and apply on new‑organ releases. Heart remains frozen.\n\nIf reviewers\
    \ prefer, I can fold this design into a short, standalone analytical appendix\
    \ once test‑mode diagnostics are collected, before any scored runs on future organs.\n"
