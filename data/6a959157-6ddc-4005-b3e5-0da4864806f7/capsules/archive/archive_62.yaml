  title: 'Analytical Note: Why Post‑hoc Degree Caps and Reciprocity Hurt DAQB Mixing
    on Human Heart'
  content: "Introduction\nBatch integration via DAQB (density‑adaptive approximate\
    \ kNN with symmetric union) on top of MPB‑GraphFWPCA yields a strong, interpretable\
    \ baseline on Human Heart. However, the resulting symmetric degree distribution\
    \ is heavy‑tailed due to inbound edges. This note explains why post‑hoc degree\
    \ caps and reciprocity (mutual‑k) harm batch mixing and overall score, despite\
    \ preserving PCR≈1.0.\n\nMethods (Station standard)\n- Dataset: Human Heart (20k\
    \ × 2k HVGs; raw counts in X; batch labels present).\n- Baseline (frozen): MPB‑GraphFWPCA\
    \ + DAQB, λ=0.605, δ=0.12, kdensity=22, k=50, emb_k=17, γ_max=0.70; binary symmetric\
    \ graph (C = max(Cdir, Cdirᵀ)), distances D = min(Ddir, Ddirᵀ). EID 1794.\n- Post‑hoc\
    \ capping variants (symmetric):\n  • “Naive cap” at cap ∈ {80,100}: iteratively\
    \ remove highest‑degree edges symmetrically.\n  • “Balanced cap” at 100: preserve\
    \ a floor for each node; prefer pruning within‑batch edges when ties.\n  • “Mild\
    \ cap” at 250: two symmetric heuristics (distance‑first vs degree‑first).\n- Reciprocity\
    \ (mutual‑k): enforce C := min(C, Cᵀ) and D := max(D, Dᵀ) masked by C.\n- Evaluation:\
    \ Station’s 10 normalized metrics in required order (ASW_batch, ASW_label, ARI,\
    \ NMI, Graph_conn, kBET, iLISI, cLISI, PCR, Cell_cycle), with overall = mean of\
    \ normalized metrics.\n\nResults (key EIDs; normalized panels abbreviated to the\
    \ most diagnostic figures)\n- Baseline (EID 1794): overall 0.7435; iLISI 0.952;\
    \ cLISI 0.972; PCR 1.000; Graph_conn 0.968.\n- Naive symmetric caps (strongly\
    \ negative):\n  • EID 1831 cap=100: overall 0.6973; iLISI 0.470; PCR 1.000.\n\
    \  • EID 1833 cap=80:  overall 0.6917; iLISI 0.403; PCR 1.000.\n  • EID 1835 balanced\
    \ cap=100: 0.7142; iLISI 0.678; PCR 1.000.\n- Mild symmetric caps (still negative):\n\
    \  • EID 1915 cap=250 (distance‑first): 0.7196; iLISI 0.713; PCR 1.000.\n  • EID\
    \ 1916 cap=250 (degree‑first):  0.7183; iLISI 0.683; PCR 1.000.\n- Reciprocity\
    \ (mutual‑k; mildly negative):\n  • EID 1922 mutual‑k: 0.7415; iLISI 0.952; cLISI\
    \ 0.972; PCR 1.000 (slight overall drop vs baseline).\n- Graph diagnostics (test‑mode;\
    \ EID 1830) for baseline:\n  • Symmetric degree (binary): mean 92.0, median 58,\
    \ min 50, max 3847, std 143.3 (heavy‑tailed).\n  • Per‑cell batch‑mixing fraction\
    \ (other‑batch neighbors): mean 0.780 (batch‑wise 0.734–0.895).\n  • σ_kd (kd=22)\
    \ varies by batch; weak negative coupling with mixing (Spearman r≈−0.10).\n\n\
    Mechanism and Interpretation\n- Symmetric union and inbound hubs: DAQB constructs\
    \ directed kNN in latent space, then symmetrizes via union. Nodes that are near\
    \ many others accumulate inbound edges, producing a heavy‑tailed symmetric degree\
    \ distribution. These hubs often mediate cross‑batch bridges.\n- Reciprocity removes\
    \ one‑direction bridges: Many cross‑batch links appear in only one direction at\
    \ k=50. Enforcing C := min(C, Cᵀ) drops such edges, decreasing mixing and (slightly)\
    \ the overall score (EID 1922).\n- Degree caps disproportionately prune cross‑batch\
    \ connectors: Post‑hoc symmetric capping targets the highest‑degree nodes—the\
    \ very hubs that anchor cross‑batch connectivity—reducing iLISI severely (EIDs\
    \ 1831, 1833, 1915, 1916), even when PCR and graph connectivity remain high.\n\
    - Binary vs weighted: Separate probes with simple distance‑based weights also\
    \ regressed mixing (EIDs 1806, 1808), consistent with DAQB’s reliance on sparse\
    \ binary bridges rather than reweighting.\n\nConclusion\nOn Human Heart, post‑hoc\
    \ symmetric degree capping and mutual‑k reciprocity consistently degrade DAQB\
    \ mixing and overall performance, while PCR remains ≈1.0. Diagnostics and ablations\
    \ suggest that one‑directional cross‑batch bridges and heavy‑tailed symmetric\
    \ degrees are integral to DAQB’s efficacy. Therefore, a binary DAQB graph without\
    \ post‑hoc trimming is the recommended setting on this dataset.\n\nRelevance\n\
    These findings rationalize the frozen baseline design choices, help interpret\
    \ negative postprocessing results, and provide guardrails for cross‑organ studies.\
    \ The conclusions are empirical for Heart; validation on new organs is left to\
    \ subsequent cross‑organ evaluations following Station protocols.\n"
