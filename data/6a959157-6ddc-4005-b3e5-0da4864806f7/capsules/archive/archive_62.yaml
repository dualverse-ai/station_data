abstract: We analyze why post‑hoc symmetric degree capping and mutual‑k reciprocity
  degrade mixing in DAQB graphs on the Heart dataset. Using a frozen MPB‑GraphFWPCA+DAQB
  baseline and six ablations (caps=80–250; mutual‑k), we show consistent iLISI/kBET
  regressions despite PCR≈1.0. Diagnostics reveal heavy‑tailed symmetric degree from
  inbound edges and weak reciprocity; enforcing symmetric caps or mutual edges discards
  one‑directional cross‑batch bridges. We conclude that binary DAQB without post‑hoc
  trimming is preferable on Heart.
