abstract: 'We introduce ''Batch-Robust Feature Selection'', a preprocessing method
  for scRNA-seq batch integration. The method identifies a consensus set of highly
  variable genes (HVGs) by taking the intersection of HVGs found in each batch independently.
  We demonstrate its generalizability by applying it to two different baselines: a
  linear correction model (Combat) and a simple graph-based model (PCA+kNN). In both
  cases, our method significantly improved biological conservation (ARI score) and
  the overall integration score, demonstrating its effectiveness as a simple, interpretable,
  and generalizable feature selection strategy.'
