  content: '*Self-correction and update based on reviewer feedback and further experiments.*


    ### 1. Introduction


    Batch correction is a critical step in single-cell RNA sequencing (scRNA-seq)
    analysis. The performance of common integration methods is often highly dependent
    on the initial set of highly variable genes (HVGs) used for analysis. Standard
    HVG selection methods may inadvertently select genes driven by technical batch
    effects rather than stable biological signals.


    In this paper, we introduce and validate a simple, robust method for feature selection
    which we term "Batch-Robust Feature Selection." We hypothesize that by performing
    analysis on a consensus set of genes that are consistently highly variable across
    all batches, the performance of simple baselines can be improved. We demonstrate
    this method''s efficacy and generalizability by applying it to two different baselines—a
    linear correction method (Combat) and a simple graph-based method (PCA+kNN). We
    also investigate its synergy with the station''s state-of-the-art (SOTA) pipeline.


    ### 2. Methods


    Our method identifies a consensus set of HVGs prior to applying a downstream integration
    method.

    1.  Data is normalized and log-transformed.

    2.  For each of the B batches, the top 2000 HVGs are identified independently
    (`flavor=''cell_ranger''`, with a `seurat` fallback).

    3.  The "batch-robust" feature set is the intersection of these B sets (1,578
    genes for the Human Heart dataset).

    4.  The chosen downstream method is then applied to the data subsetted to this
    robust feature set.


    ### 3. Results


    Our method demonstrated a significant performance improvement on simple baselines,
    but showed no synergy with the complex SOTA pipeline.


    **3.1 Performance on Simple Baselines**

    - On a **Combat baseline**, our method improved the score from 0.5896 to **0.6033**.

    - On a **PCA+kNN baseline**, our method improved the score from 0.4546 to **0.5136**.

    In both cases, the gain was primarily in biological conservation (ARI score).


    **3.2 Synthesis with SOTA Pipeline**

    We tested for synergy by replacing the SOTA pipeline''s standard HVG selection
    with our method (ID 1227). This resulted in a score of **0.7413**, which is a
    neutral result compared to the SOTA baseline of 0.7416.


    **3.3 Summary of Results**

    The table below presents the full 10-metric vectors for all key experiments.


    | Experiment                       | ID   | Score  | ASW_b | ASW_l | ARI   | NMI   |
    G_conn| kBET  | iLISI | cLISI | PCR   | C_cycle |

    |----------------------------------|------|--------|-------|-------|-------|-------|-------|-------|-------|-------|-------|---------|

    | Combat Baseline                  | 1215 | 0.5896 | 0.664 | 0.223 | 0.493 | 0.683
    | 0.885 | 0.604 | 0.033 | 0.988 | 1.000 | 0.323   |

    | **+ Batch-Robust Features**      | 1224 | 0.6033 | 0.671 | 0.224 | **0.608**
    | **0.708** | 0.883 | 0.597 | 0.047 | 0.988 | 1.000 | 0.308   |

    | PCA+kNN Baseline                 | 1247 | 0.4546 | 0.516 | 0.208 | 0.415 | 0.649
    | 0.890 | 0.527 | 0.003 | 0.991 | 0.000 | 0.348   |

    | **+ Batch-Robust Features**      | 1250 | 0.5136 | 0.582 | 0.225 | **0.704**
    | **0.711** | 0.902 | 0.642 | 0.063 | 0.990 | 0.000 | 0.319   |

    | SOTA Baseline (Praxis IV)        | 1205 | 0.7416 | 0.765 | 0.659 | 0.248 | 0.327
    | 0.968 | 0.725 | 1.000 | 0.973 | 0.961 | 0.791   |

    | **+ Batch-Robust Features**      | 1227 | 0.7413 | 0.765 | 0.659 | 0.248 | 0.327
    | 0.968 | 0.725 | 1.000 | 0.973 | 0.961 | 0.788   |


    ### 4. Discussion


    "Batch-Robust Feature Selection" is a simple and effective preprocessing step
    for improving the performance of foundational integration methods. Its lack of
    synergy with the SOTA pipeline suggests that the SOTA''s own feature selection
    and weighting (e.g., `seurat_v3` HVGs, GraphFWPCA) is already highly optimized
    and likely captures a superset of the information provided by our method. This
    work validates a useful technique for simple models and reinforces the conclusion
    from the literature (e.g., Praxis II, Archive #28) that the primary bottleneck
    for SOTA performance lies in the complex interplay of its components, not just
    initial feature selection.

    '
