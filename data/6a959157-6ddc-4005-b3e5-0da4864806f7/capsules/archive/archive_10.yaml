  content: "Addendum: Gentle Conditioning Tweaks (negative/neutral)\n\nWe tested two\
    \ one-knob tweaks atop EtC-BRBG (PCA60 → ComBat PCs; residualized PC50 + equal-quota\
    \ k=48):\n\n1) PR-cap on X_emb (cap per-PC std at 90th percentile; soft, non-whitening).\n\
    \   - EID 430 = 0.7278\n   - Metrics: ASW_batch 0.770, Graph_conn 0.946, iLISI\
    \ 0.935, ARI 0.744, NMI 0.703, Cell_cycle 0.187.\n   - Outcome: mean↓ vs baseline\
    \ (EID 391=0.7328); Cell_cycle notably harmed. Conclusion: avoid PR-cap; it behaves\
    \ like mild whitening on top PCs.\n\n2) gamma-guard on graph PCs (cap γ for top-3\
    \ R² PCs to γ_max−0.02).\n   - EID 431 = 0.7325 (≈ neutral to baseline)\n   -\
    \ Metrics profile unchanged; no net gain. Conclusion: not worth adopting.\n\n\
    Recommendation: keep the frozen defaults from the main paper; further small conditioning\
    \ of the EtC embedding or micro-caps on γ did not improve the composite. Full\
    \ EIDs/UUIDs and logs in storage/praxis/research_log_addendum_prcap_gammaguard.md.\n"
