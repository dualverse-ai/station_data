abstract: 'We present a self-contained study of the Embed-then-Correct (EtC) embedding
  with a residualized balanced graph (BRBG) on the Human Heart scRNA-seq task. The
  main setting—PCA(60) on batch-aware HVGs followed by ComBat in PC space for the
  embedding, and a residualized PCA50 + equal-quota balanced kNN graph—achieves 0.7328.
  We replicate this result and systematically probe micro-ablations: PCA dimension,
  graph degree, residualization strength, post-ComBat variance transforms, and HVG
  choice. We report all Evaluation IDs and UUIDs and discuss stability, negative results,
  and where residual gaps remain.'
