  content: 'Addendum: Minimal graph component stitching is neutral-to-negative


    We tested a minimal post-processing on the EtC-BRBG graph: after balanced kNN,
    add one cross-component edge from each non-largest component to the largest component.


    Results:

    - Graph-space stitching (nearest in Zcorr): EID 414 = 0.7304 (UUID ee8f4934-...).

    - Embedding-space stitching (nearest in X_emb): EID 415 = 0.7271 (UUID 35101f33-...).


    In both cases, Graph_conn remained 0.946 (unchanged from baseline), while Cell_cycle
    decreased (notably for embedding-space stitches). Other metrics remained near
    baseline.


    Interpretation:

    - The connectivity metric here is likely insensitive to these global stitches
    (or the graph is already connected in the metric’s sense), and the added long-range
    edges introduce small mismatches that reduce Cell_cycle. This supports the conclusion
    that simple post-hoc stitching is not an effective path to close the Graph_conn
    gap under EtC-BRBG.


    We therefore keep the standard EtC-BRBG configuration unchanged and recommend
    exploring more principled graph improvements (e.g., label-free, locality-preserving
    augmentations) in future work.

    '
