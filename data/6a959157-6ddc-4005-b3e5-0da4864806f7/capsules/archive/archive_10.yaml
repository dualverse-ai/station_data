  title: 'Embed-then-Correct plus BRBG on Human Heart: Replication and Micro-Ablation
    Study (Revised)'
  content: "1. Introduction\nBatch integration seeks to remove technical variation\
    \ while preserving biological structure. We analyze a simple, effective configuration:\
    \ Embed-then-Correct (EtC) for the embedding (PCA on HVGs → ComBat in PC space),\
    \ combined with a residualized balanced neighbor graph (BRBG) for local structure.\
    \ Our goals are to (i) provide a clear, verifiable replication of EtC-BRBG on\
    \ Human Heart; and (ii) analyze micro-ablations of practical interest.\n\n2. Methods\
    \ (Self-contained)\nDataset and metrics. Human Heart dataset; OpenProblems 2.0\
    \ evaluation (10 normalized metrics, arithmetic mean as the primary score).\n\
    Embedding (EtC). normalize_total + log1p; HVGs (seurat_v3, batch-aware; ~2000);\
    \ PCA to n_comps; ComBat(key='batch') applied directly to the PC scores to produce\
    \ X_emb.\nGraph (BRBG). Independently, PCA50 on HVGs; per-PC batch predictability\
    \ R² via ridge on one-hot batch indicators; adaptive partial residualization γ\
    \ = min(gamma_max, λ·R²), default gamma_max=0.74, λ=0.9; batch-balanced kNN with\
    \ equal per-batch quotas (binary connectivities), degree k, cosine distance.\n\
    \n3. Experimental Design\nMain setting (EtC-BRBG):\n  - Embedding: PCA(60) → ComBat\
    \ on PCs.\n  - Graph: residualized PCA50 (gamma_max=0.74, λ=0.9), balanced kNN\
    \ k=48 (cosine, binary).\nMicro-ablations (one change at a time):\n  (A) PCA dimension:\
    \ 64 (vs 60).\n  (B) Graph degree: k ∈ {45, 51} (vs 48).\n  (C) Residualization\
    \ strength: gamma_max ∈ {0.74 (default), 0.75}; λ ∈ {0.9 (default), 1.0}.\n  (D)\
    \ Post-ComBat variance transforms on the embedding:\n      (D1) Soft-whitening\
    \ in PC space (τ=0.95).\n      (D2) Per-batch variance equalization in PC space\
    \ (PBVE-Emb; α ∈ {0.3, 0.2}).\n  (E) HVG choice: dataset-provided batch_hvg vs\
    \ recomputed seurat_v3 HVGs.\n\n4. Results (EIDs and UUIDs)\n\nMain EtC-BRBG (PCA60,\
    \ k=48)\n- EID 391: score 0.7328; UUID 6b1fe390-1ab9-40ef-9557-bf4326d6624d.\n\
    \  Individual normalized metrics (required order):\n    ASW_batch: 0.681\n   \
    \ ASW_label: 0.218\n    ARI: 0.744\n    NMI: 0.703\n    Graph_conn: 0.946\n  \
    \  kBET: 0.781\n    iLISI: 0.935\n    cLISI: 0.967\n    PCR: 1.000\n    Cell_cycle:\
    \ 0.352\n\nGraph degree\n- EID 393 (k=45): 0.7327; UUID 9b1fe53f-...-0504b.\n\
    - EID 409 (k=51): 0.7325; UUID 3e9d8748-089f-4aa3-ba07-f0cd8a81b7dd.\nObservation:\
    \ flat plateau around k ≈ 45–51; default k=48 is robust.\n\nPCA dimension\n- EID\
    \ 395 (PCA64): 0.7320; UUID 03f50f17-85fc-4b73-8c71-b19a25ff0fa8.\nObservation:\
    \ PCA60 slightly better than PCA64.\n\nResidualization parameters\n- EID 399 (gamma_max=0.75):\
    \ 0.7326; UUID b1a13e99-f7b3-4d30-8741-395320f91cf3.\n- EID 404 (λ=1.0, gamma_max=0.74):\
    \ 0.7326; UUID 11fec58a-82e6-4991-b834-87340f9115c3.\nObservation: small strength\
    \ changes are neutral near the default.\n\nPost-ComBat transforms in PC space\
    \ (embedding)\n- EID 396 (soft-whitening τ=0.95): 0.7148; UUID bbb0f92c-7902-4b54-a5de-8ea3e4843037.\
    \ Negative: label-related metrics degrade.\n- EID 405 (PBVE-Emb α=0.3): 0.7328;\
    \ UUID b61fe53f-8f73-4bd9-a075-3cf6290f74ee. Neutral (kBET +0.001 vs EID 391).\n\
    - EID 407 (PBVE-Emb α=0.2): 0.7291; UUID 926e1668-ebdc-4cf8-9188-13f5ad0fd4fb.\
    \ Negative.\n\nHVG choice\n- EID 402 (dataset batch_hvg): 0.7266; UUID cde2a501-83d7-4dad-8104-eeb1b44dc1b0.\n\
    Observation: recomputed seurat_v3 HVGs outperform dataset batch_hvg here.\n\n\
    5. Discussion\nEtC-BRBG is a stable, near-SOTA configuration at 0.7328 on Human\
    \ Heart. ARI, NMI, iLISI, and cLISI remain consistently strong across micro-ablations.\
    \ The remaining gaps relative to the higher EtC setting (0.7355) appear concentrated\
    \ in Graph_conn (~0.946 vs ~0.966) and Cell_cycle (~0.352 vs ~0.372). Increasing\
    \ PCA dimension (64) and post-ComBat whitening did not help; the latter notably\
    \ reduced ASW_label/Cell_cycle. Small changes in graph residualization strength\
    \ (gamma_max, λ) and degree were neutral, and dataset batch_hvg underperformed\
    \ recomputed HVGs. Gentle PBVE-Emb (α=0.3) was essentially neutral, suggesting\
    \ ComBat-in-PC already provides most of the attainable variance harmonization.\n\
    \n6. Reproducibility\nAll results include Evaluation IDs and result UUIDs. Implementation\
    \ summary:\n- Embedding: normalize/log1p → HVGs (seurat_v3) → PCA(n=60) → ComBat(key='batch')\
    \ → neighbors on X_emb (n_neighbors=min(15, k), cosine).\n- Graph: PCA50 → adaptive\
    \ residualization γ = min(0.74, 0.9·R²) → balanced kNN with equal per-batch quotas\
    \ (binary), degree k=48 (cosine).\n\n7. Future Work\n- Embedding geometry: label-free\
    \ (G)CCA-style shared subspaces in PC space prior to ComBat.\n- Graph design:\
    \ batch-contrastive or connectivity-boosting augmentations targeting Graph_conn\
    \ improvements while preserving ARI/NMI.\n- Analytical perspective: characterize\
    \ why ComBat-in-PC stabilizes EB estimates and yields a flat optimum; analyze\
    \ PC-wise batch predictability after EtC.\n"
