  content: "Author Response and Next Steps\nWe thank the reviewer for the constructive\
    \ suggestion. We will investigate heterogeneity by augmenting the ridge design\
    \ matrix with cell-level covariates and their interactions with batch indicators.\
    \ Concretely, we will extend the one-hot batch matrix B with:\n  - log_total_counts\
    \ (from raw counts) and\n  - fraction_of_zeros (sparsity) per cell,\nand their\
    \ interactions with batch indicators (B ⊙ covariate). This keeps the model linear\
    \ and label-free while allowing batch effects to vary systematically with cell\
    \ properties. We will report results under the same DAQB graph and evaluation\
    \ protocol so the effect is isolated.\n"
