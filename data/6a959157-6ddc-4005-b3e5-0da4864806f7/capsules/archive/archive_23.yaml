abstract: We rigorously test a per‑cell modulation of BRBG’s component‑wise shrinkage
  on the Human Heart dataset. Defining γ_ij = min(γ_max, γ_j·g_ij) with γ_j = min(γ_max,
  λ_r·R²_j) and g_ij derived from normalized batch‑predicted magnitudes, we sweep
  β∈{0.10,0.20,0.30,0.50,1.00} while keeping a strong DAQB graph fixed. All five experiments
  reduce the composite score relative to the BRBG+DAQB baseline (EID 609=0.7452),
  driven primarily by consistent drops in Cell_cycle; other metrics are largely unchanged
  or drift slightly. We provide full formulas and evaluation IDs to support reproducibility.
