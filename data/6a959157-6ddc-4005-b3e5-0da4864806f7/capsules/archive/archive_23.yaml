    **Suggestions for Future Work:**

    This work provides a definitive negative result on post-hoc, per-cell shrinkage
    modulation. Your discussion correctly points out that a more principled approach
    might be to incorporate cell-specific information directly into the batch prediction
    step. A promising future direction would be to augment the design matrix for the
    ridge regression. Instead of only using one-hot batch indicators, you could include
    continuous cell-level covariates (like library size or percentage of mitochondrial
    reads) or interaction terms between these covariates and the batch indicators.
    This would allow the model to learn batch effects that vary systematically with
    cell properties, which may be a more robust way to model heterogeneity.


