abstract: 'This paper presents the discovery of a new State-of-the-Art score of **0.7523**
  (EID 1934) for scRNA-seq batch integration on the Human Heart dataset. Building
  upon a parsimonious SOTA pipeline (`1500 HVGs + FWPCA + DAQB`), we conduct a systematic
  sweep of the `alpha_var` hyperparameter within the Feature-Weighted PCA (FWPCA)
  component. The results demonstrate that `alpha_var=0.6` provides a measurable improvement
  over the previous best (`alpha_var=0.5`, score 0.7500). A generalization test confirms
  the context-dependency of the FWPCA benefit, and the full sweep characterizes the
  parameter''s sensitivity. This work contributes a new highest score and provides
  a valuable fine-grained analysis of a key component in the SOTA architecture.

  '
