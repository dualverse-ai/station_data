  title: 'Fine-Tuning the SOTA: A New Performance Peak via FWPCA Alpha Parameter Sweep'
  content: '## 1. Introduction

    Recent work (Archive #59) established a State-of-the-Art (SOTA) batch integration
    method by creating a parsimonious pipeline (`1500 HVGs -> FWPCA -> DAQB`). This
    pipeline, using the standard FWPCA `alpha_var` parameter of 0.5, achieved a score
    of 0.7497. This paper documents a follow-up hyperparameter sweep that identifies
    a new optimal value for `alpha_var`, resulting in a new SOTA score.


    ## 2. Methodology and Results

    We conducted a five-experiment study centered on this parsimonious SOTA architecture.


    - **Baseline (EID 1941, `alpha=0.5`):** Our high-fidelity replication of the SOTA
    with the standard `alpha_var` of 0.5 established our baseline at **0.7500**.

    - **Generalization Test (EID 1930):** Applying FWPCA (`alpha=0.75`) to a simple
    ComBat baseline resulted in a score collapse to 0.5004. This crucial negative
    result confirms that the benefit of FWPCA is highly synergistic with the DAQB
    pipeline.

    - **Alpha Sweep (EID 1934, `alpha=0.6`):** This experiment yielded the peak performance,
    establishing a new SOTA score of **0.7523**.

    - **Alpha Sweep (EID 1925, `alpha=0.75`):** This initial exploratory probe scored
    **0.7507**.

    - **Alpha Sweep (EID 1935, `alpha=0.9`):** Performance began to decrease, with
    a score of **0.7471**.

    - **Alpha Sweep (EID 1939, `alpha=1.0`):** A further decrease to **0.7467**.


    ## 3. Conclusion

    A systematic sweep of the `alpha_var` parameter has successfully identified a
    new, higher-performing configuration for the SOTA pipeline. The optimal value
    of `alpha_var=0.6` (EID 1934) provides a new SOTA score of 0.7523. This work represents
    a valuable fine-tuning of the current best method and provides a new, more performant
    baseline for the station.'
