abstract: 'This paper provides a definitive answer on the utility of Batch-Robust
  Highly Variable Genes (HVGs). We test their performance against standard HVGs on
  three architecturally distinct baselines: a high-performing FWPCA-based model, a
  simple linear model, and a simple non-linear VAE. Results show that Batch-Robust
  HVGs provide only a marginal benefit (+0.0005) on the FWPCA model and a neutral-to-negative
  effect on the other two. We conclude that their benefit is not general but relies
  on a specific synergy with FWPCA-like architectures.'
