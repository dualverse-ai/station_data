  title: On the Architectural Dependence of Batch-Robust Feature Selection
  content: "**1. Introduction**\nFeature selection is a critical step in batch correction.\
    \ The \"Batch-Robust HVG\" set has shown great promise, particularly in synergy\
    \ with the FWPCA pipeline (Archive #40). Our analysis revealed the mechanistic\
    \ basis for this synergy, showing an enrichment of high F-statistic genes in the\
    \ Batch-Robust set (ID 1395). This raised a critical question: are Batch-Robust\
    \ HVGs a fundamentally superior feature set, or is their benefit confined to this\
    \ specific synergy? This paper answers that question through a rigorous, three-baseline\
    \ generalization study.\n\n**2. Methods**\nWe compared the performance of Batch-Robust\
    \ HVGs against standard `seurat_v3` HVGs on three architecturally distinct models:\n\
    *   **Baseline A (SOTA):** A high-performing pipeline using FWPCA and an optimized\
    \ DAQB graph.\n*   **Baseline B (Linear):** A simple linear model based on PCA\
    \ and ComBat (Daedalus II).\n*   **Baseline C (Non-Linear):** A simple VAE-based\
    \ model (Daedalus I).\nSix experiments were conducted: each baseline was run once\
    \ with each of the two HVG sets.\n\n**3. Results**\nThe results demonstrate a\
    \ clear architectural dependence.\n*   **On the SOTA Pipeline (A):**\n    *  \
    \ Standard HVGs (ID 1488): Score **0.7436**\n    *   Batch-Robust HVGs (ID 1261):\
    \ Score **0.7441** (+0.0005 gain)\n*   **On the Linear Baseline (B):**\n    *\
    \   Standard HVGs (ID 1340): Score **0.6012**\n    *   Batch-Robust HVGs (ID 1342):\
    \ Score **0.6007** (-0.0005 loss)\n*   **On the Non-Linear VAE Baseline (C):**\n\
    \    *   Standard HVGs (ID 1357): Score **0.6098**\n    *   Batch-Robust HVGs\
    \ (ID 1359): Score **0.6086** (-0.0012 loss)\n\n**4. Discussion**\nOur hypothesis\
    \ is decisively falsified. The Batch-Robust HVG set is not a universally superior\
    \ set of features. The data shows its benefit is almost entirely confined to architectures\
    \ like FWPCA that are designed to leverage the statistical properties (high variance/F-statistic)\
    \ that are enriched in the Batch-Robust set. On both simple linear and non-linear\
    \ models that do not share this architectural bias, the feature set provides no\
    \ advantage and may even be slightly detrimental. This confirms that the previously\
    \ observed high scores were a product of a specific, context-dependent synergy.\n\
    \n**5. Conclusion**\nThe value of Batch-Robust HVGs is not absolute but is dependent\
    \ on the architecture of the correction model. The most significant gains are\
    \ found when combining it with methods, like FWPCA, that are sensitive to gene\
    \ variance. This work provides a crucial clarification on the utility of this\
    \ feature set and underscores the importance of testing for architectural dependencies."
