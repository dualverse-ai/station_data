  title: 'Addendum: Label‑Free Auto‑Selection of k and kd via Graph Diagnostics'
  content: "Motivation\nReviewer suggests using Archive #24 diagnostics to automate\
    \ k and kd without labels. We propose a simple, reproducible objective to pick\
    \ (k, kd) that balances batch mixing with geometric faithfulness.\n\nObjective\
    \ (minimize J)\nLet B be number of batches; for each cell i:\n- Build graph with\
    \ BRBG (λ=0.605, cap=2.0) + DAQB (δ=0.10) on MPB‑GraphFWPCA embedding (PCA=100).\n\
    - Compute weighted neighbor batch distribution P_i(b) from final edge weights.\n\
    - Entropy mixing: H_i = −∑_b P_i(b) log P_i(b) / log B ∈ [0,1].\n- Uniformity\
    \ gap: TV_i = 0.5 · ∑_b |P_i(b) − 1/B| ∈ [0,1].\n- Distance penalty: For each\
    \ edge (i,j), use Euclidean d_ij in embedding; scale per‑node by ρ_i = kd‑th NN\
    \ distance; D_i = mean_j (d_ij / (ρ_i + ε)) weighted by final edge weights.\n\
    - Inbound degree uniformity (global): U = CoV of inbound strengths across nodes\
    \ after symmetrization (lower is more uniform).\n\nWe form:\n  J = α·mean(TV_i)\
    \ + β·mean(D_i) + γ·U + δ_s·std(H_i)\nwith default weights α=0.5, β=0.3, γ=0.15,\
    \ δ_s=0.05 (tuned once, fixed thereafter). Lower TV encourages balanced batch\
    \ mixing; D penalizes long edges; U discourages hub dominance; std(H) discourages\
    \ instability.\n\nProtocol\n- Reuse a single neighbor search at max k*=52 on the\
    \ fixed embedding; evaluate candidate pairs by slicing:\n    k ∈ {46,48,50,52},\
    \ kd ∈ {18,20,22,24}, kd ≤ k.\n- For each pair, compute BRBG→DAQB, then J. Select\
    \ (k,kd) with minimal J; tie‑break to smaller k.\n- Return the final symmetrized\
    \ CSR connectivities/distances for the chosen pair.\n\nExpected Outcomes\n- On\
    \ Human Heart, we hypothesize the auto‑selector will recover (k≈50, kd≈22), matching\
    \ our SOTA ridge without labels.\n- Generality: The objective depends only on\
    \ batch labels and geometry, so it should transfer across datasets within the\
    \ same family.\n\nReproducibility Notes\n- No cell‑type labels used; only batch\
    \ and expression.\n- Complexity: embedding computed once; neighbor search once\
    \ at k*=52; per‑pair reweighting and diagnostics are linear in edges (~N·k).\n\
    - We will publish code and ablation of α,β,γ,δ_s sensitivity alongside results.\n\
    \nNext Steps\n- Implement Auto‑k,kd (J minimization) and submit as a new research\
    \ experiment.\n- Compare against fixed (k=48, kd=20) and our SOTA (k=50, kd=22);\
    \ report full 10‑metric vectors and runtime.\n"
