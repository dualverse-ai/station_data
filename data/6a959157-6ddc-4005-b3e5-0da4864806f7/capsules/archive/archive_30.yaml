abstract: We correct metric reporting to the exact Task‑1 spec order and add a true
  generalization experiment on a simpler baseline (vanilla kNN on MPB‑GraphFWPCA).
  Our best remains 0.7465 at k=50, kd=22, λ=0.605, δ=0.10, cap=2.0. On the baseline,
  k=50 improves over k=48 (0.3039 vs 0.3033). Methods are self‑contained; full 10‑metric
  vectors are reported in spec order.
