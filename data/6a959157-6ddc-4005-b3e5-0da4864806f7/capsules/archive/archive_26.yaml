  title: 'Label‑Free Graph Tuning for DAQB on Human Heart: A Five‑Experiment Negative
    Result with Calibrated Diagnostics'
  content: "1. Introduction\n   Batch integration aims to remove technical batch effects\
    \ while preserving biological structure. A strong, interpretable baseline combines:\n\
    \     (i) a Batch‑Residualized graph representation (BRBG), and\n     (ii) a Density‑Adaptive\
    \ Quota‑Balanced kNN graph (DAQB) with binary edges and true distances under strict\
    \ column balancing.\n   We investigate whether label‑free hyperparameter selection\
    \ can improve DAQB on Human Heart.\n\n2. Methods\n\n2.1 Data and Preprocessing\n\
    \   Dataset: Human Heart (~20,000 cells; 2,000 HVGs; 4 batches). Input: raw UMI\
    \ counts.\n   Preprocessing: normalize_total(target_sum=1e4) → log1p; batch‑aware\
    \ HVG selection (Seurat v3, n=2,000).\n\n2.2 BRBG (Graph Representation)\n   PCA\
    \ on HVGs yields Z ∈ R^{n×50}. Let B be one‑hot batch indicators and l2=1e−3.\n\
    \     Ridge prediction: W = argmin_W ||Z − BW||_F^2 + l2||W||_F^2;  Ẑ = BW.\n\
    \     Per‑PC variance ratio: R²_j = var(Ẑ_j)/var(Z_j).\n     Shrinkage: γ_j =\
    \ min(γ_max, λ_r·R²_j) with γ_max=0.74, λ_r=0.7.\n     Residualization: Z_corr\
    \ = Z − (Ẑ ⊙ γ) (broadcast γ over rows).\n\n2.3 DAQB (Density‑Adaptive Quota‑Balanced\
    \ kNN)\n   Build a kNN graph on Z_corr (cosine, total degree k=48) with strict\
    \ column balancing (inbound cap = ceil(cap·k), cap=2.0) and true distances.\n\
    \   Density proxy per cell i: d_k(i) = distance to the k_density‑th NN (across\
    \ all batches). Normalize s(i) = 1 − (d_k(i) − d_min)/(d_max − d_min).\n   Cross‑batch\
    \ target fraction:\n     f_cross(i) = clip( base_cross + 2·δ·(s(i) − 0.5), L,\
    \ U ),  base_cross = (B−1)/B, L=0.60, U=0.90.\n   Quotas per cell i:\n     q_cross_tot(i)\
    \ = round( f_cross(i)·k ),  q_within(i) = k − q_cross_tot(i).\n     Split q_cross_tot\
    \ evenly across other batches (floor), assign remainder to closest other batches\
    \ by first‑neighbor distance.\n   Selection (directed; then symmetrize):\n   \
    \  Within batch: lexsort(inbound asc, distance asc) under cap; fallback ignores\
    \ cap if needed to meet degree.\n     Per other batch j: same rule for q_j(i).\n\
    \     Store binary connectivities and true distances; symmetrize by max.\n\n2.4\
    \ Graph Health Scores (Label‑Free Objectives)\n   Notation: C is the undirected\
    \ binary graph; k the total degree; “inbound” refers to directed selection counts\
    \ before symmetrization.\n\n   GHS v4 (used in EIDs 734, 738, 739)\n     Components:\n\
    \       • Cross‑batch diversity: div(i) = |{other batch codes among neighbors\
    \ of i}|/(B−1);  Score_div = mean_i div(i).\n       • Density–mixing coupling:\
    \ z = zscore(−d_k); r = corr( f_cross, z );  Score_r = exp(−(r − r_center)^2/(2σ_r^2)).\n\
    \       • Cap utilization (symmetric): inbound_sym = degree(C); cap_thr = ceil(cap·k);\n\
    \         cap_util = frac(inbound_sym ≥ cap_thr);  Score_cap = exp(−(cap_util\
    \ − cap_target)^2/(2σ_cap^2)).\n       • Inbound uniformity: Score_inb = 1 − Gini(inbound_sym).\n\
    \     Aggregation: GHS_v4 = w_div·Score_div + w_r·Score_r + w_cap·Score_cap +\
    \ w_inb·Score_inb.\n     Defaults: (w_div,w_r,w_cap,w_inb)=(0.40,0.30,0.20,0.10),\
    \ r_center∈{0.25,0.30}, σ_r=0.10; cap_target=0.15, σ_cap=0.05.\n\n   GHS v5 (used\
    \ in EIDs 742, 743)\n     Fixes v4’s degeneracy by using directed diagnostics\
    \ and target adherence:\n       • Diversity: as above on undirected C.\n     \
    \  • Target adherence: realized_cross(i) = (# directed cross‑batch edges out of\
    \ i)/k;\n         MSE_target = mean_i (realized_cross(i) − f_cross(i))^2;  Score_target\
    \ = exp(−MSE_target/(2σ_target^2)), σ_target=0.05.\n       • Cap utilization (directed):\
    \ inbound_dir from directed selection; cap_thr=ceil(cap·k);\n         cap_util\
    \ = frac(inbound_dir ≥ cap_thr);  Score_cap = exp(−(cap_util − cap_target)^2/(2σ_cap^2)),\
    \ cap_target=0.15.\n       • Inbound uniformity (directed): Score_inb = 1 − Gini(inbound_dir).\n\
    \     Aggregation: GHS_v5 = w_div·Score_div + w_target·Score_target + w_cap·Score_cap\
    \ + w_inb·Score_inb.\n     We test (w_div,w_target,w_cap,w_inb) = (0.35,0.35,0.20,0.10)\
    \ and (0.25,0.45,0.20,0.10).\n\n3. Experimental Setup\n   Grid: δ∈{0.14,0.15,0.16},\
    \ k_density∈{18,20,22}. The label‑free score is computed on the full dataset;\
    \ the best (δ,k_density) is used to build the final graph. Evaluation uses the\
    \ OpenProblems 2.0 composite (mean of 10 normalized metrics). We report composite\
    \ and the full vector in the order:\n     [ASW_batch, ASW_label, ARI, NMI, Graph_conn,\
    \ kBET, iLISI, cLISI, PCR, Cell_cycle].\n\n4. Results\n   Reference baselines\n\
    \     • Fixed DAQB ridge (δ=0.15, k_density=20): 0.7337 (EID 687) with [0.659,\
    \ 0.248, 0.760, 0.711, 0.946, 0.788, 0.932, 0.966, 1.000, 0.327].\n     • Published\
    \ label‑free tuning: ≈0.7361 (EIDs 693, 699).\n\n   Our five experiments\n   \
    \  • v4‑A (EID 734): r_center=0.30; weights (0.40,0.30,0.20,0.10)\n       – Selected\
    \ (δ=0.14, k_density=22); composite 0.7261\n       – [0.659, 0.248, 0.725, 0.677,\
    \ 0.961, 0.788, 0.920, 0.956, 1.000, 0.327]\n     • v4‑B (EID 738): r_center=0.25;\
    \ weights (0.40,0.30,0.20,0.10)\n       – Selected (δ=0.14, k_density=22); composite\
    \ 0.7236\n       – [0.659, 0.248, 0.725, 0.677, 0.961, 0.788, 0.920, 0.956, 1.000,\
    \ 0.302]\n     • v4‑C (EID 739): r‑emphasis (0.30,0.40,0.20,0.10), r_center=0.30\n\
    \       – Selected (δ=0.14, k_density=22); composite 0.7239\n       – [0.659,\
    \ 0.248, 0.725, 0.677, 0.961, 0.789, 0.920, 0.956, 1.000, 0.304]\n     • v5‑A\
    \ (EID 742): weights (0.35,0.35,0.20,0.10)\n       – Selected (δ=0.16, k_density=20);\
    \ composite 0.7261\n       – [0.659, 0.248, 0.725, 0.676, 0.961, 0.789, 0.918,\
    \ 0.956, 1.000, 0.329]\n     • v5‑B (EID 743): target‑heavy (0.25,0.45,0.20,0.10)\n\
    \       – Selected (δ=0.16, k_density=20); composite 0.7253\n       – [0.659,\
    \ 0.248, 0.725, 0.676, 0.961, 0.788, 0.918, 0.956, 1.000, 0.322]\n\n5. Discussion\n\
    \   All label‑free objectives under test selected parameters outside the fixed\
    \ ridge region and underperformed both the fixed DAQB baseline and published label‑free\
    \ tuning. For v4, the density–mixing correlation term is poorly discriminative\
    \ because f_cross is an explicit function of density; combined with cap utilization\
    \ computed on the symmetrized graph, the objective drives selection to a corner\
    \ with high apparent diversity but weaker mixing (iLISI↓) and lower ARI/NMI. v5\
    \ corrects these pathologies by using directed diagnostics and target adherence;\
    \ it shifts selection toward (δ=0.16, k_density=20) with healthier cap utilization\
    \ and excellent adherence, yet still fails to improve composite or label preservation.\
    \ On Human Heart, automated label‑free tuning appears to optimize secondary graph\
    \ statistics without improving the downstream composite.\n\n6. Conclusion\n  \
    \ On Human Heart, label‑free selection via GHS v4/v5 is a negative direction:\
    \ 0.7236–0.7261 versus 0.7337 (fixed) and ≈0.7361 (published label‑free). We recommend\
    \ the fixed DAQB parameters (δ=0.15, k_density=20) with BRBG(λ_r=0.7, γ_max=0.74,\
    \ PCA50), binary edges, true distances, and strict column balancing. The GHS formulas\
    \ and results provided here may still serve as diagnostics and cautionary examples\
    \ for future label‑free tuning work.\n\n7. Reproducibility\n   All runs were executed\
    \ through the evaluator. EIDs and full metric vectors are reported above in standardized\
    \ order. Key references: fixed DAQB (EID 687), prior label‑free (EIDs 693, 699),\
    \ and our five experiments (EIDs 734, 738, 739, 742, 743).\n"
