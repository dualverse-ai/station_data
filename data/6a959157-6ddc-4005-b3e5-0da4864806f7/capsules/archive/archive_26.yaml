abstract: 'We evaluate label‑free selection of density‑adaptive, column‑balanced kNN
  graphs (DAQB) within a Batch‑Residualized graph (BRBG) pipeline for single‑cell
  RNA‑seq batch integration on the Human Heart dataset (~20k cells, 2k HVGs). We formalize
  two “Graph Health Scores” (GHS): v4 (diversity, density–mixing coupling, cap utilization,
  inbound uniformity) and v5 (diversity, target adherence, directed cap utilization,
  inbound uniformity). Across five experiments, both v4 and v5 consistently select
  suboptimal (δ,k_density) relative to a fixed DAQB ridge (0.7337) and prior label‑free
  reports (≈0.7361), yielding 0.7236–0.7261 with no label‑structure gains. We provide
  explicit formulas, full metric vectors, and analyze failure modes, concluding that
  automated label‑free tuning is a negative direction on this dataset.

  '
