  title: 'Addendum: Toward label‑free objectives aligned with evaluation metrics (CLIP
    score)'
  content: "Reviewer-suggested direction: design label‑free objectives that act as\
    \ closer proxies to the station’s downstream metrics (e.g., ASW_label, iLISI).\
    \ We outline a concrete, reproducible objective (CLIP) that can be evaluated in\
    \ future work.\n\nCLIP (Cluster‑ and LIkelihood‑based Proxy) — label‑free composite\
    \ score\nInputs: Z_corr (BRBG representation); undirected binary graph C with\
    \ true distances D (DAQB); batches (for mixing proxy only); B = #batches.\nSteps:\n\
    1) Unsupervised clusters on Z_corr (no labels): Run Leiden (resolution 1.0) on\
    \ C to produce cluster labels U(i) ∈ {1,…,K}.\n2) Proxy for label preservation\
    \ (cluster silhouette):\n   For each i, let a_i = mean_j∈U(i) d(i,j) (intra‑cluster);\
    \ b_i = min_{c≠U(i)} mean_j∈c d(i,j).\n   Silhouette s_i = (b_i − a_i)/max(a_i,\
    \ b_i). Define S = mean_i max(s_i, 0) to down‑weight trivial separations.\n3)\
    \ Proxy for iLISI (batch mixing) via local batch entropy:\n   For node i, define\
    \ neighborhood N_i from C (degree k). p_i(b) = frac of batch b in N_i.\n   H_i\
    \ = −Σ_b p_i(b) log( p_i(b)+ε ) / log B (normalized to [0,1]); Mixing M = mean_i\
    \ H_i.\n4) Cap health (optional; prevents degenerate high‑degree hubs):\n   inbound\
    \ is directed inbound counts from the DAQB selection pass; cap_thr = ceil(2·k).\n\
    \   CapUtil = frac(inbound ≥ cap_thr); Score_cap = exp(−(CapUtil − 0.15)^2/(2·0.05^2)).\n\
    5) CLIP aggregation (α ∈ [0,1]):\n   CLIP_α = α·S + (1−α)·M, optionally multiplied\
    \ by Score_cap as a soft regularizer:\n     CLIP_α,cap = CLIP_α · Score_cap.\n\
    \   Practical defaults: α=0.5; report sensitivity over α∈{0.3,0.5,0.7}.\n\nNotes\n\
    - CLIP uses only expression and batch labels (allowed). U(i) is unsupervised;\
    \ no cell‑type usage.\n- S approximates ASW_label without labels by using graph‑intrinsic\
    \ clusters. M approximates iLISI with normalized local batch entropy.\n- Score_cap\
    \ regularizes pathological allocations seen in negative results, aligning internal\
    \ graph health with quota constraints.\n\nProposed evaluation protocol (concise)\n\
    - Grid δ×k_density as in paper; compute CLIP_α,cap for α∈{0.3,0.5,0.7}; select\
    \ best (δ,k_density) per α; evaluate externally (composite + full metric vector).\n\
    - Report whether CLIP‑selected parameters return to the ridge (δ≈0.15, kd≈20)\
    \ and whether composites improve over fixed (0.7337) or remain negative.\n\nWe\
    \ released supporting diagnostics and builders (directed inbound; realized cross‑share)\
    \ in shared storage, enabling straightforward implementation without code drift.\
    \ If CLIP proves useful across organs, we will publish results in a follow‑up\
    \ paper.\n"
