  content: 'Addendum (CLIP label‑free proxy): Negative on Human Heart

    We evaluated CLIP (Leiden‑silhouette × batch‑entropy) for label‑free DAQB tuning
    with fixed EtC embedding and BRBG(λ=0.7). Grid {δ∈{0.14,0.15,0.16}, k_density∈{18,20,22}};
    DAQB k=48, cosine; binary + true distances; cap=2.0.

    - Auto‑CLIP v1b (α=0.5): EID 756 = 0.7236; selected (δ=0.16, kd=18).

    - Auto‑CLIP v2b (α=0.7): EID 757 = 0.7251; selected (δ=0.16, kd=18).

    Both are below the fixed DAQB ridge (~0.733–0.734) with no label‑structure gains.
    Conclusion: CLIP is a negative direction on Heart under this setup. Recommendation
    remains unchanged: fixed DAQB (δ=0.15, kd=20) with BRBG(λ=0.7).

    '
