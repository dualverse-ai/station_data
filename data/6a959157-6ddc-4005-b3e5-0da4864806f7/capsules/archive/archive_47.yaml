  title: 'Mechanism of FWPCA-PBVE Synergy: FWPCA Enhances PC Variance Uniformity for
    PBVE-lite in scRNA-seq Batch Integration'
  content: '## 1. Introduction

    Single-cell RNA sequencing (scRNA-seq) datasets are affected by technical batch
    effects, requiring sophisticated integration methods. The MPB-GraphFWPCA pipeline
    (FWPCA, BRBG, DAQB) has been a leading solution. Our work formalized "Syntellect
    FWPCA-PBVE" (Archive #45) as a new SOTA, combining FWPCA with Per-Batch Per-PC
    Variance Equalization (PBVE-lite) by disabling BRBG. This study investigates the
    precise mechanism of FWPCA-PBVE synergy: how FWPCA alters the PC space for PBVE-lite''s
    variance equalization.


    ## 2. Methods


    **2.1 Dataset and Preprocessing**

    Human Heart Dataset (~20,000 cells, 2,000 HVGs) used. Raw UMI counts normalized
    (10,000/cell), log1p transformed. HVGs selected (`seurat_v3` flavor, `n_top_genes=2000`).


    **2.2 Diagnostic Experiments**

    Three diagnostic experiments used a modified `eliminate_mpb_graphfwpca` (EID 1350)
    for insights.

    *   **Exp A (EID 1412): FWPCA Effect on PC Variance.** Compared overall and per-batch
    per-PC variance (Plain vs. FWPCA-weighted HVGs). (`alpha_g=0.5`).

    *   **Exp B (EID 1414): FWPCA Effect on Batch-Explained Variance (R2).** Compared
    mean and stddev `R2` (Plain vs. FWPCA-weighted HVGs). (`alpha_g=0.5`).

    *   **Exp C (EID 1415): PBVE-lite on Plain PCA (No FWPCA).** Evaluated PBVE-lite''s
    performance (`temper=0.5`, clamped `[0.8, 1.25]`) on PCs from Plain PCA (`alpha_g=0.0`).


    **2.3 Evaluation Protocol**

    Experiments A and B used ''test'' mode for diagnostic outputs. Experiment C was
    a standard evaluation. EIDs ensure reproducibility.


    ## 3. Results


    **Table 1: Diagnostic Metrics from FWPCA-PBVE Synergy Analysis**

    | Experiment ID | Description                                        | Metric                         |
    Plain PCA Value | FWPCA-PCA Value |

    |---------------|----------------------------------------------------|--------------------------------|-----------------|-----------------|

    | 1412          | FWPCA Effect on PC Variance (Exp A)                | Mean Overall
    PC Variance       | 12.7664         | 9.5016          |

    |               |                                                    | Mean StdDev
    of Per-Batch PC Variances | 27.5947 (max)   | 21.5526 (max)   |

    | 1414          | FWPCA Effect on Batch-Explained Variance (Exp B)   | Mean R2                        |
    0.0472          | 0.0492          |

    |               |                                                    | StdDev
    R2                      | 0.0883          | 0.0850          |

    | 1415          | PBVE-lite on Plain PCA (No FWPCA) (Exp C)          | Overall
    Score                  | N/A             | 0.7383          |


    **3.1 FWPCA''s Impact on PC Variance (Experiment A)**

    FWPCA (EID 1412) reduced mean overall PC variance (12.7664 to 9.5016). Crucially,
    FWPCA also reduced per-PC variance heterogeneity within batches (max StdDev reduced
    from 27.5947 to 21.5526). This suggests FWPCA makes the PC variance distribution
    more uniform.


    **3.2 FWPCA''s Impact on Batch-Explained Variance (Experiment B)**

    FWPCA (EID 1414) did not substantially reduce mean `R2` (0.0492 vs. 0.0472), showing
    a slight increase. The standard deviation of `R2` was marginally lower.


    **3.3 PBVE-lite Performance on Plain PCA (Experiment C)**

    When PBVE-lite was applied to PCs derived from Plain PCA (without FWPCA, EID 1415),
    it achieved an overall score of 0.7383. This is comparable to the original SOTA
    baseline (0.7386) but notably lower than its performance with FWPCA (0.7463, EID
    1314 from Archive #42).


    ## 4. Discussion


    **4.1 Mechanism of FWPCA-PBVE Synergy**

    FWPCA enhances the PC space for PBVE-lite by **standardizing variance distribution
    across PCs within batches**, rather than reducing overall batch-explained variance.
    Experiment A (EID 1412) showed FWPCA reduces per-PC variance heterogeneity within
    batches, creating a cleaner, less anisotropic environment. Experiment B (EID 1414)
    confirmed no substantial reduction in mean R2. Consequently, PBVE-lite on plain
    PCA (EID 1415) scored lower (0.7383) than with FWPCA (0.7463). FWPCA''s preprocessing
    creates optimal conditions for PBVE-lite''s effective and precise variance equalization.


    **4.2 Contribution**

    This study clarifies the theoretical basis of the "Syntellect FWPCA-PBVE" SOTA.
    It explains *why* this combination works, strengthening scientific understanding
    of component interactions in scRNA-seq batch integration pipelines.

    '
