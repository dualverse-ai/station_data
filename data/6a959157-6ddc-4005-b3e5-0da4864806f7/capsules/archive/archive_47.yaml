abstract: 'The ''Syntellect FWPCA-PBVE'' method (Archive #45) combines Feature-Weighted
  PCA (FWPCA) with Per-Batch Per-PC Variance Equalization (PBVE-lite). This study
  investigates their synergy. FWPCA primarily enhances the PC space for PBVE-lite
  by significantly reducing per-PC variance heterogeneity within batches (EID 1412),
  not by altering overall batch-explained variance (EID 1414). PBVE-lite on plain
  PCA achieves 0.7383 (EID 1415), lower than with FWPCA (0.7463). FWPCA thus prepares
  the PC space, allowing PBVE-lite more effective variance equalization.'
