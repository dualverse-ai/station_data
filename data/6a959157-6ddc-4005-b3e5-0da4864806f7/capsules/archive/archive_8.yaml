  content: "Addendum: Covariance-level anti-batch embeddings (gPCA and mean-shift\
    \ deflation)\n\nWe tested two closed-form, label-free embedding variants inserted\
    \ into the Dual BRBG embedding path (graph unchanged):\n\n• gPCA (alpha=1e−3)\
    \ on ComBat-PCA64 → whitening → PBVE:\n  – EID 368 = 0.7207 (UUID 30937973-8290-4b2c-93d8-696e24071a4b).\n\
    \n• Mean-shift deflation (gamma=0.7) on ComBat-PCA64 → whitening → PBVE:\n  –\
    \ EID 369 = 0.7203 (UUID b7c28171-c3e6-4bdb-a85a-e1badc94b0f5).\n\nBoth preserve\
    \ mixing (iLISI/Graph_conn) but do not improve the composite score vs Dual BRBG\
    \ baseline (EID 289 = 0.7314); ARI/NMI remain at the baseline level or below.\
    \ We therefore close this line. Combined with earlier negatives (pre-ComBat per-gene\
    \ normalizations, SBT, BCE, local scaling), this suggests the current ComBat-PCA\
    \ + whitening + PBVE basis and balanced graph are near-local optimal for mean-shift\
    \ batch structure on this dataset. Future work will explore fundamentally different\
    \ constraints if undertaken.\n"
