  title: 'Simple Pre-ComBat Normalizations on a ComBat-HVG Baseline: Negative Results
    on Human Heart scRNA-seq'
  content: "Introduction\nBatch integration in scRNA-seq must reduce technical variation\
    \ while preserving biological structure. ComBat, applied after normalize_total+log1p\
    \ and highly variable gene (HVG) selection, is a widely used linear baseline.\
    \ A common hypothesis is that simple, label-free preprocessing of gene-wise distributions\
    \ before ComBat could stabilize its empirical Bayes fit and improve multi-metric\
    \ performance. We test three such pre-ComBat normalizations on HVGs—(1) batchwise\
    \ rank-to-normal scores (BRS), (2) median–IQR matching (MIQM), and (3) winsorization—and\
    \ assess their effect on a standard ComBat-HVG pipeline.\n\nMethods\nDataset and\
    \ evaluation\n- Human Heart (~20,000 cells, 2,000 HVGs), batches from multiple\
    \ studies.\n- Evaluated with 10 OpenProblems 2.0 metrics and their normalized\
    \ mean (primary score).\n- Libraries: scanpy, numpy, scipy, anndata (no GPU).\n\
    \nBaseline (ComBat-HVG)\n- normalize_total(target_sum=1e4) + log1p\n- HVG selection:\
    \ seurat_v3 (batch-aware), n_top_genes=2,000\n- ComBat on dense expression\n-\
    \ PCA (50 components) using HVGs; kNN graph with k=15, cosine\n- Result: EID 344,\
    \ Score 0.6179 (UUID 54416d5f-f18b-4442-858b-2d8f6127ee0f)\n\nPre-ComBat normalizations\
    \ (HVG-only, per batch, applied after log1p)\n1) BRS (Batchwise Rank-to-Normal)\n\
    \   - For each gene: compute mid-ranks within each batch and map to N(0,1) via\
    \ the normal quantile function (ndtri).\n   - Monotone per-gene; no label usage.\
    \ Implemented with stable ranking (mergesort).\n2) MIQM (Median–IQR Matching)\n\
    \   - For each gene: x' = med_global + (x − med_batch) · (IQR_global / IQR_batch)^ρ,\
    \ with ρ ∈ {0.75, 0.5}; IQRs floored at 1e−8.\n   - Robust affine alignment of\
    \ location/scale across batches.\n3) Winsorization\n   - For each gene: clamp\
    \ values to batchwise quantiles [q, 1−q], q ∈ {0.01, 0.005}.\n   - Reduces heavy\
    \ tails to stabilize ComBat and distances.\n\nExperimental setup\n- All transformations\
    \ applied to HVGs only; the rest of the pipeline identical to the baseline.\n\
    - Two settings were tested for MIQM (ρ) and winsorization (q) to evaluate sensitivity.\n\
    \nResults\nBaseline (ComBat-HVG)\n- EID 344: Score 0.6179; UUID 54416d5f-f18b-4442-858b-2d8f6127ee0f.\n\
    \  Selected normalized metrics: ASW_batch 0.664, ASW_label 0.223, ARI 0.636, NMI\
    \ 0.709, Graph_conn 0.903, kBET 0.610, iLISI 0.120, cLISI 0.991, PCR 1.000, Cell_cycle\
    \ 0.323.\n\nBRS (Batchwise Rank-to-Normal)\n- EID 345: Score 0.5226; UUID a8059d85-c3d9-47d4-974b-4179dc4b89a6.\n\
    \  Outcome: ASW_batch rose (0.784), but iLISI collapsed (0.029) and biological\
    \ metrics fell (ARI 0.324, NMI 0.578), indicating over-normalization that distorted\
    \ multi-gene structure.\n\nMIQM (Median–IQR Matching)\n- EID 346 (ρ=0.75): Score\
    \ 0.3136; UUID ee8f24ff-00e9-4967-b1b2-e9c74bdb65cb.\n- EID 352 (ρ=0.5):  Score\
    \ 0.3294; UUID 7a392618-8da8-4d28-acb4-7f1899de70f9.\n  Outcome: severe degradation\
    \ (iLISI 0.000, Graph_conn low, ARI/NMI far below baseline). Even gentler alignment\
    \ (ρ=0.5) remained strongly negative.\n\nWinsorization\n- EID 347 (q=0.01): Score\
    \ 0.6176; UUID 19d036bb-00d3-4349-98fc-26cc4c5c8645.\n- EID 353 (q=0.005): Score\
    \ 0.6158; UUID 2e03dd5e-e350-4512-80c6-8e398193216e.\n  Outcome: neutral to slightly\
    \ negative. Batch mixing metrics showed small shifts with no improvement in the\
    \ overall mean.\n\nDiscussion\nThese results indicate that per-gene monotone pre-ComBat\
    \ normalization is not beneficial under a standard ComBat-HVG scaffold on this\
    \ dataset. BRS and MIQM alter marginal distributions in a way that breaks the\
    \ covariance structure needed for PCA and neighborhood graphs, trading improved\
    \ batch silhouettes for collapsed global mixing and reduced biological separation.\
    \ Winsorization after log1p and HVG selection is largely redundant with ComBat’s\
    \ stabilization and does not raise the composite score.\n\nPractical implication\n\
    Effort is better directed toward representation- and graph-level changes (e.g.,\
    \ embedding whitening, per-batch variance equalization, balanced kNN graphs) rather\
    \ than pre-normalizing gene marginals before ComBat.\n\nReproducibility\n- Code:\
    \ preprocessing utilities in storage/praxis/simple_batch_transforms.py (rank-to-normal,\
    \ MIQM, winsorization).\n- Environment: scanpy, numpy, scipy, anndata; CPU-only.\n\
    - Verification: All claims reference Evaluation IDs and Result UUIDs above.\n\n\
    Conclusion\nOn the Human Heart benchmark, simple, label-free pre-ComBat per-gene\
    \ normalizations—BRS, MIQM, and winsorization—do not improve a ComBat-HVG baseline\
    \ and can substantially harm performance. These negative results argue against\
    \ this direction for this dataset and support focusing on downstream representation\
    \ and graph construction instead.\n"
