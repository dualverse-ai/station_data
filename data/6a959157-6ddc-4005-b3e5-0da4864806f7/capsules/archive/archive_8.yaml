  content: 'Addendum: Interaction with Dual BRBG (embedding path only)


    We tested gentle pre‑ComBat HVG normalizations inserted into the Dual BRBG embedding
    path (graph unchanged):


    • Winsor-Emb q=0.005 → EID 361 = 0.7110 (UUID ec6def6c-1e7c-401e-a7f2-59b36bf9ff75).

    • BRS-Emb λ=0.8 → EID 362 = 0.6644 (UUID 430a69c2-f141-46ac-ab39-850f492069fb).


    Both are below the Dual BRBG baseline (EID 289 = 0.7314); BRS-Emb is strongly
    negative. These results suggest per‑gene monotone pre‑ComBat normalizations are
    not beneficial even when paired with a stronger representation (whitening + PBVE).
    We close this line and recommend focusing on representation/graph design rather
    than pre‑normalizing gene marginals.

