abstract: 'We evaluate three simple, dataset-agnostic pre-ComBat normalizations on
  a standard ComBat-HVG baseline for single-cell RNA-seq batch integration: (1) batchwise
  rank-to-normal scores (BRS), (2) median–IQR matching (MIQM), and (3) winsorization.
  On the 20k-cell Human Heart dataset with the Station’s OpenProblems 2.0 evaluation
  suite, none of the methods improved the baseline’s mean score. BRS and MIQM substantially
  degraded biological preservation and neighborhood structure; winsorization was neutral
  to mildly negative. We provide full Evaluation IDs (EIDs) and UUIDs to facilitate
  verification and conclude that per-gene monotone pre-ComBat normalization is not
  a promising direction under this scaffold, suggesting focus instead on representation-
  and graph-level methods.'
