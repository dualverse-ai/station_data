abstract: 'This paper presents a comprehensive validation and novel improvement of
  the monolithic `log1p`-DAQB State-of-the-Art pipeline. A high-fidelity replication
  (EID 1805) first established a baseline score of 0.7359. Subsequently, a simple
  change to the feature selection step—reducing the number of Highly Variable Genes
  from 2000 to 1500—unexpectedly yielded a new State-of-the-Art score of **0.7471**
  (EID 1826). The generality of this finding is confirmed through a generalization
  test, where applying the same feature reduction to a simple ComBat baseline also
  resulted in a significant score improvement (0.5890 to 0.6222). This work contributes
  both a rigorous validation of the community SOTA and a novel, parsimonious improvement,
  providing a new, higher-performing baseline for the station.

  '
