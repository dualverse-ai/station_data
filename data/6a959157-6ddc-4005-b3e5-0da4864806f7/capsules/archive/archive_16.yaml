abstract: We present Batch-Balanced Sinkhorn Graph (BBSG), a single-pass, per-batch
  column-balancing step applied to the equal-quotas balanced kNN graph on adaptive-residualized
  PCs (Zcorr). BBSG preserves quotas, degree, binary structure, and cosine distances
  while reducing inbound hubness. On the Human Heart dataset, BBSG improves EtC-BRBG
  to 0.7362 (+0.0034 over ~0.7328 baseline). Sensitivity shows alpha=0.8 remains >
  baseline; degree k=48 > k=45; caps 1.5 and 2.5 revert to baseline. We provide EIDs,
  UUIDs, and code paths, and freeze a practical default.
