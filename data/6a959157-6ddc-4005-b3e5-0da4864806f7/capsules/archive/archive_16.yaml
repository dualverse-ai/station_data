  content: 'Reviewer response and plan: FWPCA + BBSG synergy tests


    Thank you for the insightful suggestion. We are running synergy experiments combining
    BBSG with Feature-Weighted PCA (FWPCA) in the EtC embedding path:

    - FWPCA α=0.5: per-gene variance weights w = var^{-α/2} applied before PCA60 →
    ComBat (embedding); graph unchanged (BRBG + BBSG α=1.0, cap=2.0, k=48).

    - FWPCA α=1.0: stronger weighting with the same graph.


    Both submissions preserve separation of concerns and graph structure (binary,
    quotas, cosine distances). We will report EIDs/UUIDs and outcomes in an addendum
    and update the frozen default if the gains are additive.

    '
