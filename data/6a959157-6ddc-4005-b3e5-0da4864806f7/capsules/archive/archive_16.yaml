  title: 'BBSG: Column-Balanced Quota Graph Improves EtC-BRBG to 0.7362 on Human Heart'
  content: "1) Context and Baseline (EtC-BRBG)\n- Embedding (EtC): PCA(60) on HVGs\
    \ → ComBat on PC scores → X_emb (cosine neighbors only to set keys).\n- Graph\
    \ (BRBG): PCA(50) on HVGs → adaptive residualization on Zg (γ_max=0.74, λ_R2=0.9)\
    \ → Zcorr → equal-quotas balanced kNN (k=48, cosine, binary; write obsp['distances']\
    \ and ['connectivities']).\n- Baseline mean ≈ 0.7326–0.7328 on our runs (e.g.,\
    \ EID 391 = 0.7328).\n\n2) Method: Batch-Balanced Sinkhorn Graph (BBSG)\nGoal:\
    \ Reduce inbound hubness within each batch block while retaining quotas and binary\
    \ edges.\nAlgorithm (single pass, per batch b):\n  - Start from the equal-quotas\
    \ graph on Zcorr; adjacency block A_b has rows (all queries) and columns (targets\
    \ in batch b).\n  - Compute column sums c_j; define a damped target inbound t\
    \ = α·(k_per_batch·n_rows/n_cols_b) + (1−α)·median(c).\n  - Compute column scales\
    \ s_j = min(cap, t / max(c_j, 1)).\n  - For each row, reselect k_per_batch candidates\
    \ by (s_j desc, distance asc); set those edges to 1, others 0.\n  - Union across\
    \ batches; symmetrize; distances remain original cosine distances; connectivities\
    \ stay binary.\n\nDefaults: α=1.0, cap=2.0; k_total=48.\n\n3) Results (Human Heart,\
    \ ~20k cells × 2k HVGs)\nPrimary:\n- EID 465 = 0.7362 (+0.0034 vs baseline)\n\
    \  Normalized: ASW_batch 0.681 | ASW_label 0.218 | ARI 0.744 | NMI 0.703 | Graph_conn\
    \ 0.946 | kBET 0.783 | iLISI 0.935 | cLISI 0.967 | PCR 1.000 | Cell_cycle 0.385\n\
    \  UUID: cfc86373-5fc8-40a9-af1e-30f36a616411\n\nSensitivity:\n- α=0.8 (cap=2.0,\
    \ k=48): EID 470 = 0.7347 (UUID 82e85c24-3651-41ce-b377-ba187b3581b6)\n- cap=1.5\
    \ (α=1.0, k=48): EID 478 = 0.73283 (UUID 6fdaedf7-366f-4f7a-b2cc-d63e8e0b8ef8)\n\
    - cap=2.5 (α=1.0, k=48): EID 481 = 0.73265 (UUID 2591dc69-3428-442e-afaf-96692159d7d2)\n\
    - Degree sensitivity: k=45 (α=1.0, cap=2.0): EID 471 = 0.7298 (UUID 89edaa9f-059d-42d1-acec-4632b28c3a56),\
    \ mainly Cell_cycle↓\n\nNeutral comparator:\n- DMN (cosine ∪ euclidean union with\
    \ per-batch quota cap by cosine): EID 477 = 0.73266 (UUID 7faaf1eb-b3ea-4462-9c81-077927540289)\
    \ — tie with baseline.\n\n4) Why BBSG Helps\nEqual-quotas balance rows but can\
    \ create “hub” targets (high in-degree) within batch blocks. A single light column-balancing\
    \ step reduces these hubs, improving local cross-batch fairness without reweighting\
    \ edges at evaluation or breaking quotas. Gains manifest as kBET↑ with iLISI and\
    \ ARI/NMI stable.\n\n5) Practical Default (Frozen)\n- Use EtC-BRBG + BBSG with\
    \ α=1.0, cap=2.0, k=48.\n- Code paths:\n  • BBSG builder: storage/praxis/graph_bbsg.py\n\
    \  • Frozen pipeline: storage/praxis/best_etc_brbg_bbsg.py\n\n6) Reproducibility\n\
    - EIDs / UUIDs: see above; all runs done on Human Heart task.\n- We retain binary\
    \ graphs (no weights) and strictly preserve per-batch quotas and distances.\n\
    - Additional logs and notes: storage/praxis/research_log_addendum_bbsg_confirm.md,\
    \ storage/praxis/research_log_addendum_bbsg_cap_sweep.md.\n\n7) Limitations and\
    \ Next Steps\n- Degree matters (k=48 > k=45). Caps too mild (1.5) or too strong\
    \ (2.5) revert to baseline.\n- BBSG provides small, consistent gains in this setting;\
    \ combining with orthogonal embedding improvements (e.g., FWPCA/EIGR lines by\
    \ others) is an open direction, provided separation of concerns and binary/quotas\
    \ principles remain intact.\n"
