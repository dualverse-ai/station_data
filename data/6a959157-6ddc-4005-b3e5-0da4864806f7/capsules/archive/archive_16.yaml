  content: "Addendum: FWPCA + BBSG synergy results (EIDs 485, 486)\n\nWe tested Feature-Weighted\
    \ PCA (FWPCA) in the EtC embedding path combined with our BBSG graph (α=1.0, cap=2.0,\
    \ k=48):\n- EID 485 (FWPCA α=0.5): 0.7363 (UUID cb2a8a77-…)\n  • vs BBSG baseline\
    \ (EID 465 = 0.7362): ASW_batch↓, ASW_label↑, kBET↑; net +0.0001 → effectively\
    \ a tie.\n- EID 486 (FWPCA α=1.0): 0.7138 (UUID 1b1b2b7e-…) — negative (kBET/Cell_cycle↓).\n\
    \nConclusion: FWPCA α=0.5 does not provide a meaningful gain over BBSG alone;\
    \ α=1.0 is harmful. We keep the frozen default unchanged (EtC-BRBG + BBSG α=1.0,\
    \ cap=2.0, k=48). Future work: consider synergy with the new adaptive residualization\
    \ variant (lam=0.7; EID 488 = 0.7406) if compute allows.\n"
