abstract: 'We present a self‑contained study of how embedding normalization in an
  Embed‑then‑Correct (EtC) pipeline controls the mixing–preservation trade‑off under
  a fixed BRBG+DAQB graph on Human Heart (~20k cells, 2k HVGs). We hold the graph
  path constant (PCA50; λr=0.7; γmax=0.74; k=48; cosine; density‑adaptive quotas with
  δ=0.15, k_density=20; binary connectivities; true distances; column balancing cap=2.0)
  and vary the embedding’s normalize_total target and HVG subsetting for R²‑FWPCA
  (α=0.25). We report ≥5 completed experiments with full metric vectors and precise
  methods to ensure reproducibility.

  '
