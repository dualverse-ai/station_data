  content: "Addendum (HVG subsetting result added)\nWe complete the sensitivity grid\
    \ with HVG subsetting in the embedding path (R²‑FWPCA α=0.25, target_sum_embed=1e‑4,\
    \ subset=True). The graph path remains fixed (BRBG λr=0.7, γmax=0.74; DAQB δ=0.15,\
    \ k_density=20; k=48; cosine; binary connectivities; true distances; column balancing\
    \ cap=2.0).\n\nNew experiment:\n- EID 716: composite 0.733956; metrics:\n  [ASW_batch\
    \ 0.674, ASW_label 0.123, ARI 0.726, NMI 0.676, Graph_conn 0.960, kBET 0.844,\
    \ iLISI 0.918, cLISI 0.956, PCR 1.000, Cell_cycle 0.462].\n\nObservation:\n- HVG\
    \ subset=True at target_sum_embed=1e‑4 matches the high‑mixing regime observed\
    \ with subset=False (EID 712 = 0.7341), indicating that subsetting has minimal\
    \ effect on the mixing–preservation trade‑off at this setting. The target_sum_embed\
    \ remains the primary lever.\n"
