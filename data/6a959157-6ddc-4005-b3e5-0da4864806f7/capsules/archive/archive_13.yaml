    | PCR | 1.000 | +0.000 (Maintained) |

    | Cell_cycle | 0.358 | +0.035 (Improved) |


    ### 3.5. LCCM Experiment E (ID 436: alpha=1.0, beta=50.0)

    | Metric | Value | Baseline Change |

    |---|---|---|

    | Score | 0.6095 | -0.0082 |

    | ASW_batch | 0.596 | -0.068 (Degraded) |

    | ASW_label | 0.236 | +0.013 (Slightly improved) |

    | ARI | 0.636 | +0.000 (Maintained) |

    | NMI | 0.713 | +0.004 (Slightly improved) |

    | Graph_conn | 0.899 | -0.004 (Slightly degraded) |

    | kBET | 0.596 | -0.012 (Slightly degraded) |

    | iLISI | 0.070 | -0.050 (Degraded) |

    | cLISI | 0.991 | +0.000 (Maintained) |

    | PCR | 1.000 | +0.000 (Maintained) |

    | Cell_cycle | 0.358 | +0.035 (Improved) |


    ### 3.6. Discussion of Results

    Across all LCCM experiments (B, C, D, E) on Sophia II''s Combat+PCA+kNN baseline,
    a consistent pattern emerged: while `PCR` remained perfectly corrected (1.000)
    and some biological preservation metrics (`ASW_label`, `ARI`, `NMI`, `Cell_cycle`)
    showed minor improvements or stability, there was a **recurrent and significant
    degradation of crucial local batch mixing metrics: `ASW_batch` and `iLISI`**.


    Specifically, increasing `alpha_decorrelation` (Experiment D) did not fundamentally
    alter this degradation pattern. More critically, even when reconstruction fidelity
    was overwhelmingly prioritized (`beta_reconstruction=10.0` in Experiment C, and
    `beta_reconstruction=50.0` in Experiment E), aiming for a near-identity mapping
    from the LCCM module, `ASW_batch` and `iLISI` remained severely impaired, and
    in some cases, other metrics like `kBET` or `ARI` also suffered. This suggests
    that the degradation is not merely a consequence of aggressive decorrelation,
    but rather an **inherent instability or distortion introduced by the LCCM neural
    network itself** within this pipeline context. The non-linear transformations
    or the process of learning even a minimal decorrelation, even with strong reconstruction
    pressure, appears to disrupt the delicate local manifold structures that are critical
    for effective batch mixing as evaluated by these metrics. The observed trade-offs
    consistently indicate that a direct reduction of linear batch-latent correlation,
    as formulated, ultimately compromises more beneficial aspects of the embedding.


    ## 4. Conclusion

    This study rigorously investigated Latent Correlation Minimization (LCCM) as a
    method to enhance batch integration. Across a range of hyperparameter settings
    and on a robust baseline, LCCM consistently failed to improve overall batch integration.
    It demonstrated significant and undesirable decreases in local batch mixing performance
    (`ASW_batch`, `iLISI`) that could not be alleviated by prioritizing reconstruction
    fidelity or modulating decorrelation pressure. These findings constitute a strong
    negative result, demonstrating that this specific approach to latent correlation
    minimization, within the context of a Combat+PCA pipeline, is not a viable strategy
    for improving overall scRNA-seq batch integration. Future work should explore
    more sophisticated, potentially non-linear, disentanglement techniques that are
    designed to explicitly preserve local manifold structures, or investigate alternative
    objectives for latent space refinement.


    ## 5. Reproducibility

    The code for Sophia II''s Combat+PCA+kNN baseline (Evaluation ID 406) and the
    LCCM experiments (Evaluation IDs 410, 418, 433, 436) can be found in the Research
    Counter evaluation logs for the Human Heart Dataset task. All code used JAX/Flax
    for the LCCM module and Scanpy for preprocessing and graph construction. The exact
    hyperparameters used are detailed in the `lccm_parameters` section of the `adata.uns`
    object for each submission.'
