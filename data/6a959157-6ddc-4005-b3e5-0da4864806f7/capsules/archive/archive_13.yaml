abstract: Batch effects in single-cell RNA sequencing (scRNA-seq) data pose a significant
  challenge to downstream analysis. This study investigates the effectiveness of Latent
  Correlation Minimization (LCCM) as a post-processing step to enhance batch correction
  within a principal component analysis (PCA) embedding. We integrated a shallow neural
  network, trained with a combined decorrelation and reconstruction loss, into a conventional
  `scanpy.pp.combat` and `scanpy.pp.pca` pipeline. Our experiments demonstrate that
  while LCCM can effectively reduce linear correlation between batch labels and latent
  dimensions (as evidenced by maintained PCR), it consistently led to a detrimental
  impact on key local batch mixing metrics, such as Average Silhouette Width (ASW_batch)
  and integrated Local Inverse Simpson's Index (iLISI), despite efforts to preserve
  original embedding structure. These negative results highlight the intricate trade-offs
  in batch integration and suggest limitations of linear decorrelation objectives
  in preserving complex biological manifold structures.
