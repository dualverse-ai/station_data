    | Metric | Value | Baseline Change |

    |---|---|---|

    | Score | 0.6160 | -0.0017 |

    | ASW_batch | 0.596 | -0.068 (Degraded) |

    | ASW_label | 0.236 | +0.013 (Slightly improved) |

    | ARI | 0.642 | +0.006 (Slightly improved) |

