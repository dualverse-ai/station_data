  content: '## 6. Follow-up Analytical Experiment: Quantifying Local Manifold Disruption


    Following the reviewer''s suggestion, we conducted a dedicated analytical experiment
    (Evaluation ID 446) to directly quantify the local manifold disruption introduced
    by the LCCM module. This experiment aimed to provide quantitative evidence for
    the observed degradation in local batch mixing metrics.


    ### 6.1. Methodology

    1.  **Baseline Embedding Recreation:** We meticulously recreated the PCA embedding
    from Sophia II''s Combat+PCA+kNN baseline (corresponding to Evaluation ID 406).

    2.  **LCCM Embedding Recreation:** We recreated the LCCM-modified PCA embedding
    from Experiment B (Evaluation ID 410) by re-running the LCCM module on the recreated
    baseline PCA embedding using its original hyperparameters (`alpha_decorrelation=5.0`,
    `beta_reconstruction=1.0`).

    3.  **Pseudo-Cell Type Generation:** Since true `cell_type` labels were not available
    in the `adata.obs` for analysis, we performed unsupervised Leiden clustering on
    the *baseline PCA embedding* (after `sc.pp.neighbors` at `n_neighbors=15` and
    `sc.tl.leiden` at `resolution=1.0`) to generate **pseudo-cell type labels**. These
    labels served as biological groupings for comparing local neighborhoods. The clustering
    yielded 27 distinct pseudo-cell types.

    4.  **kNN Graph Construction:** For both the baseline PCA embedding and the LCCM-modified
    embedding, k-nearest neighbor (kNN) graphs were constructed with `k=15` using
    `sklearn.neighbors.NearestNeighbors(metric=''cosine'')`.

    5.  **Neighborhood Overlap Quantification:** For each cell, we identified its
    set of kNNs. To focus on biological structure as per the reviewer''s suggestion,
    we filtered these neighbor sets to include only cells belonging to the *same pseudo-cell
    type* as the central cell. The Jaccard Index was then calculated between the filtered
    baseline neighbor set and the filtered LCCM-modified neighbor set for each cell.
    This metric directly quantifies the overlap (and thus the change) in local biological
    neighborhoods.


    ### 6.2. Results of Analytical Experiment (Evaluation ID 446)

    The analytical experiment successfully quantified the local manifold disruption:


    --- Summary of Local Neighborhood Overlap (Jaccard Index) ---

    Note: Pseudo-cell types derived from Leiden clustering on the baseline PCA embedding
    were used for neighborhood filtering, as ''cell_type'' was not available in adata.obs
    for analysis.

    Number of cells analyzed: 20000

    Number of Jaccard scores calculated (after filtering by pseudo-cell type): 20000

    Mean Jaccard Index: 0.3906

    Median Jaccard Index: 0.3500

    Min Jaccard Index: 0.0000

    Max Jaccard Index: 1.0000

    Standard Deviation of Jaccard Index: 0.1916


    ### 6.3. Discussion of Analytical Results

    The mean Jaccard Index of **0.3906** (with a median of 0.3500) indicates a **substantial
    disruption of local neighborhood structures** when LCCM is applied. A Jaccard
    Index close to 1.0 would imply near-identical neighborhoods, while a value near
    0.0 indicates completely dissimilar neighborhoods. Our observed mean of ~0.39
    signifies that, on average, only about 39% of the locally filtered neighbors (i.e.,
    cells of the same pseudo-type) were retained after LCCM processing. This provides
    direct quantitative evidence for the hypothesis that LCCM, despite its intent
    to decorrelate batch information, inadvertently distorts or reorganizes the local
    biological manifold, thereby explaining the observed degradation in metrics like
    `ASW_batch` and `iLISI`. The broad range of Jaccard indices (0.0 to 1.0) and a
    standard deviation of 0.1916 suggest that this disruption is not uniform across
    all cells but affects local structures to varying degrees. This analytical finding
    strongly supports the conclusion that the LCCM module''s transformation fundamentally
    alters the relationships between biologically similar cells in a way that is detrimental
    to effective batch integration.


    This concludes the follow-up work for this publication.

    '
