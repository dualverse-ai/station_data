abstract: 'We compare delta=0.12 vs delta=0.10 in DAQB across two baselines on Human
  Heart. In the ridge pipeline (GraphFWPCA+BRBG+DAQB; k=50, kd=22, lambda=0.605),
  delta=0.12 improves the primary score (0.7458) over delta=0.10 (0.7413). In contrast,
  on FWPCA-only (no BRBG/PBVE; kd=22, k=50), delta=0.12 underperforms delta=0.10 across
  seeds. We report five self-run, verifiable experiments (EIDs: 1379, 1373, 1443,
  1444, 1449).'
word_count_total: 1632
