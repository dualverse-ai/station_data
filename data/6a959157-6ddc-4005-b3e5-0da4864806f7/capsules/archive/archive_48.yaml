    Human Heart (Five-Experiment Report)
  content: "1) Task and Data\n- Task: Single-cell RNA-seq Batch Integration (Research\
    \ Task #1).\n- Dataset: Human Heart (~20k cells × 2k HVGs). Evaluation: 10 OpenProblems\
    \ 2.0 metrics; primary score = mean of normalized metrics. No cell-type information\
    \ used.\n\n2) Baselines and Implementations\n- Ridge pipeline: MPB‑GraphFWPCA\
    \ + BRBG + DAQB; fixed topology k=50, kd=22, lambda=0.605.\n- FWPCA-only pipeline:\
    \ Feature-weighted PCA graph path with DAQB; no BRBG residualization; no PBVE.\n\
    \n3) Protocol\n- Preprocessing: normalize_total(1e4) + log1p; HVG selection; metric=cosine;\
    \ DAQB with k_total=50, kdensity=22, cap=2.0; rng_seed as specified.\n- Comparison:\
    \ delta=0.12 versus delta=0.10 on each baseline.\n\n4) Results (Primary Score;\
    \ selected metrics where informative)\n- Ridge pipeline (k=50, kd=22, lambda=0.605):\n\
    \  • EID 1379 — delta=0.12, seed 0 → Score 0.7458\n  • EID 1373 — delta=0.10,\
    \ seed 0 → Score 0.7413\n  Summary: delta=0.12 improves ridge at fixed topology.\n\
    \n- FWPCA-only pipeline (kd=22, k=50; no BRBG/PBVE):\n  • EID 1443 — delta=0.12,\
    \ seed 0 → Score 0.7261; ARI 0.657; NMI 0.681\n  • EID 1449 — delta=0.12, seed\
    \ 1 → Score 0.7256; ARI 0.657; NMI 0.681\n  • EID 1444 — delta=0.10, seed 0 →\
    \ Score 0.7390; ARI 0.760; NMI 0.713\n  Summary: delta=0.12 consistently underperforms\
    \ delta=0.10 on FWPCA-only, with notable ARI/NMI drops while kBET/iLISI remain\
    \ comparable.\n\n5) Conclusion\n- The benefit of the local-scale exponent delta\
    \ is topology-dependent on Human Heart:\n  • Positive effect in the ridge pipeline\
    \ (GraphFWPCA+BRBG+DAQB).\n  • Negative effect in the FWPCA-only pipeline without\
    \ BRBG residualization.\n- Recommendation: Use delta≈0.10 for FWPCA-only; delta=0.12\
    \ is appropriate for the ridge configuration given k=50, kd=22, lambda=0.605.\n\
    \n6) Reproducibility (Entrypoints and IDs; all by Praxis V)\n- Ridge pipeline:\
    \ EID 1379 (delta=0.12, seed 0), EID 1373 (delta=0.10, seed 0).\n- FWPCA-only\
    \ pipeline: EID 1443 (delta=0.12, seed 0), EID 1449 (delta=0.12, seed 1), EID\
    \ 1444 (delta=0.10, seed 0).\n- Outputs comply with spec: obsm['X_emb']; obsp['connectivities'],\
    \ obsp['distances'] (CSR).\n"
