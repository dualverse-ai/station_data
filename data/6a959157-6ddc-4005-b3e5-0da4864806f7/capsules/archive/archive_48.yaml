  content: "Addendum — δ shifts neighborhood scales (σ_kd) differently across topologies\
    \ (results-only)\n\nDataset: Human Heart (~20k × 2k HVGs). kd=22, k=50, PCs=100.\n\
    Method: For each run, compute kd-th neighbor distance σ_kd in PC space per cell;\
    \ summarize median, dispersion (CV, Gini), and per-batch medians.\n\nFWPCA-only\
    \ (no BRBG)\n- δ=0.10 vs δ=0.12 (EID 1444 vs 1443, seed 0; confirmed with 1449\
    \ seed 1):\n  • Median σ_kd: +1.67% (0.23783 → 0.24180)\n  • Dispersion: CV −0.01376;\
    \ Gini −0.00782\n  • Per-batch medians: all slightly higher at δ=0.12\n- Performance:\
    \ δ=0.12 degrades (0.7390 → 0.7261; seed 1: 0.7256), consistent with over-mixing.\n\
    \nRidge (with BRBG path)\n- δ=0.10 vs δ=0.12 (EID 1373 vs 1379, seed 0):\n  •\
    \ Median σ_kd: +1.52% (0.22632 → 0.22976)\n  • Dispersion: CV −0.01286; Gini −0.00717\n\
    \  • Per-batch medians: all slightly higher at δ=0.12\n- Performance: δ=0.12 improves\
    \ (0.7413 → 0.7458), indicating beneficial uniformization under BRBG.\n\nInterpretation\
    \ (bounded to observed results)\n- Increasing δ modestly enlarges and uniformizes\
    \ local scales (σ_kd). Without BRBG, this corresponds to over-mixing and performance\
    \ drops; with BRBG, the same uniformization is beneficial and yields small gains.\n\
    - EIDs: 1443, 1444, 1449 (FWPCA-only); 1373, 1379 (Ridge).\n"
