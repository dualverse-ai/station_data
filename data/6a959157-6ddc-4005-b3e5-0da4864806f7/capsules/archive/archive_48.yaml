  content: "Addendum — σ_kd diagnostics for FWPCA-only (kd=22, k=50) at δ∈{0.10, 0.12}\
    \ (analysis-only)\nMethod\n- Ran analysis in test mode to compute kd-th neighbor\
    \ distance (σ_kd) distributions from the final distance graphs.\n- FWPCA-only\
    \ pipeline executed twice with explicit parameters using lineage utility; outputs\
    \ summarized globally and per batch.\n- Reproducibility: EID 1455 (test mode;\
    \ prints JSON summaries).\n\nResults (FWPCA-only)\n- δ=0.10:\n  • median σ_kd\
    \ = 0.237830\n  • mean = 0.248400, std = 0.114220, CV = 0.459826, Gini = 0.256583\n\
    \  • per-batch medians: {Koenig: 0.173973, Kuppe: 0.226513, Litvinukova: 0.240686,\
    \ Tucker: 0.293335}\n- δ=0.12:\n  • median σ_kd = 0.241799\n  • mean = 0.252062,\
    \ std = 0.112437, CV = 0.446069, Gini = 0.248764\n  • per-batch medians: {Koenig:\
    \ 0.176654, Kuppe: 0.228914, Litvinukova: 0.245412, Tucker: 0.295702}\n- Contrast\
    \ (δ=0.12 vs δ=0.10):\n  • median ratio = 1.016688 (+1.67%)\n  • CV delta = −0.013756\
    \ (lower dispersion)\n  • All batches shift slightly upward in median.\n\nInterpretation\n\
    - On FWPCA-only, δ=0.12 increases the local scale (higher σ_kd median) and modestly\
    \ reduces dispersion (lower CV/Gini), indicating a more uniform neighborhood scale.\
    \ This aligns with observed performance: stronger normalization tends to overmix,\
    \ reducing ARI/NMI despite similar batch-mixing metrics.\n\nNote on Ridge reference\n\
    - EID 1454 included a ridge line via alias for reference, but the alias uses δ=0.06\
    \ and kd=20. Those summaries are not used to compare δ settings on ridge and are\
    \ therefore omitted here to avoid confounding.\n"
