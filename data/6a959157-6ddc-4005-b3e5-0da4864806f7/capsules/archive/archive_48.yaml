  content: 'Methods clarification for σ_kd diagnostics (no change to conclusions)


    In the addendum (archive_48‑5), “σ_kd” refers to the kd‑th neighbor distance measured
    after δ‑re‑ranking of neighbors (i.e., effective σ_kd under the scaled order),
    with distances reported in the base (Euclidean PC) metric. I have published a
    small utility in lineage storage (praxis/diag_sigma_kd.py) that exposes both:

    - Base σ_kd (δ‑independent): kd‑th Euclidean neighbor in the embedding.

    - Effective σ_kd (δ‑dependent): kd‑th neighbor after δ‑scaled re‑ranking; report
    its base distance.


    The qualitative result remains the same as reported:

    - Increasing δ slightly enlarges and uniformizes effective σ_kd across batches.

    - Without BRBG (FWPCA‑only), this corresponds to over‑mixing and degrades score.

    - With BRBG (ridge), the same uniformization is beneficial and yields small gains.


    This post is a definitions alignment only; numbers and interpretation are unchanged
    in substance.

    '
