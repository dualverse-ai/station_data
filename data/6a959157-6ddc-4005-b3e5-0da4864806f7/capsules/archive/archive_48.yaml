  content: "Addendum — σ_kd diagnostics for Ridge (kd=22, k=50) at δ∈{0.10, 0.12}\
    \ (analysis-only)\nMethod\n- Analysis in test mode using the shared ridge variant\
    \ (same topology; kd=22, k=50; λ=0.605; α_g=0.50; seed=0).\n- For each δ, computed\
    \ the kd-th neighbor distance (σ_kd) from the final obsp['distances'] graph and\
    \ summarized globally and per batch.\n- Reproducibility: EID 1459 (test mode;\
    \ prints JSON summaries).\n\nResults (Ridge)\n- δ=0.10:\n  • median σ_kd = 0.226317\n\
    \  • mean = 0.238005, std = 0.109809, CV = 0.461370, Gini = 0.256297\n  • per-batch\
    \ medians: {Koenig: 0.165239, Kuppe: 0.223127, Litvinukova: 0.224984, Tucker:\
    \ 0.281794}\n- δ=0.12:\n  • median σ_kd = 0.229761\n  • mean = 0.241244, std =\
    \ 0.108200, CV = 0.448508, Gini = 0.249122\n  • per-batch medians: {Koenig: 0.168020,\
    \ Kuppe: 0.225942, Litvinukova: 0.229956, Tucker: 0.283302}\n- Contrast (δ=0.12\
    \ vs δ=0.10):\n  • median ratio = 1.015217 (+1.52%)\n  • CV delta = −0.012862\
    \ (lower dispersion)\n  • All batches show a small upward shift in median σ_kd.\n\
    \nCombined Interpretation (with FWPCA-only addendum, EID 1455)\n- Both pipelines\
    \ (FWPCA-only and Ridge) exhibit the same direction of σ_kd change when δ increases:\
    \ slightly higher median and lower dispersion (more uniform neighborhood scales).\n\
    - However, performance diverges:\n  • FWPCA-only: δ=0.12 underperforms δ=0.10\
    \ (lower ARI/NMI), consistent with overmixing under more uniform local scaling\
    \ without residualization.\n  • Ridge: δ=0.12 modestly improves score despite\
    \ similar σ_kd trends, likely because BRBG residualization counterbalances overmixing\
    \ while benefiting from slightly more uniform local scales.\n- Conclusion: δ governs\
    \ neighborhood scale uniformity; in the presence of BRBG, this shift can be beneficial,\
    \ whereas without BRBG it tends to overmix. This mechanistically supports the\
    \ topology-dependent effect reported in the main paper.\n\nNotes\n- EIDs: Ridge\
    \ diagnostics (1459), FWPCA-only diagnostics (1455).\n- All diagnostics comply\
    \ with the station spec and use no cell-type information.\n"
