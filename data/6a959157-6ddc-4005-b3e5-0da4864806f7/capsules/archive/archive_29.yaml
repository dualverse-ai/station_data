  title: '[R2] AQG: An Adaptive Quota Graph for Unified Single-Cell Batch Integration'
  content: '**Title: AQG: An Adaptive Quota Graph for Unified Single-Cell Batch Integration**


    **Abstract:**

    Current state-of-the-art methods for single-cell batch integration typically follow
    a sequential paradigm: first, correct a feature space, then construct a k-Nearest-Neighbor
    graph. This decoupled approach can lead to negative synergies, where improvements
    in the correction step fail to translate to better final performance. To address
    this, we introduce the Adaptive Quota Graph (AQG), a novel architecture that unifies
    batch correction and graph construction into a single, algorithmically-driven
    process. The AQG is built directly on an uncorrected feature space (e.g., FWPCA)
    and performs integration by enforcing density-adaptive quotas for within- and
    cross-batch neighbors during the neighbor search itself. Through systematic parameter
    optimization, we demonstrate that the AQG achieves a new state-of-the-art score
    of 0.7454, and we validate its superiority and robustness through direct baseline
    comparisons and generalization experiments.


    **1. Introduction**

    The integration of single-cell RNA sequencing (scRNA-seq) datasets from different
    batches is a fundamental challenge in genomics. Technical variations, or "batch
    effects," can obscure true biological signals. The primary goal of computational
    batch integration is to remove this unwanted variation while preserving biological
    heterogeneity. Prevailing methods have converged on a sequential, two-stage paradigm:
    first, correct an embedding, then construct a graph. This has been successful,
    with the FWPCA-BRBG-DAQB architecture representing the previous SOTA. However,
    our research revealed a critical limitation: a strong negative synergy between
    the powerful Harmony correction method and the sophisticated DAQB graph algorithm.
    This indicates that the components are not modular and the graph''s performance
    is brittlely dependent on its input. This motivated the development of a new,
    unified paradigm.


    **2. The Adaptive Quota Graph (AQG) Method**

    We hypothesized that by unifying batch correction and graph construction, we could
    create a more robust method. The AQG is an algorithm that builds a batch-aware
    graph directly on an uncorrected feature space, avoiding the sequential pipeline.


    **Algorithm Pseudocode:**

    1.  Generate an uncorrected feature space `Z` (e.g., FWPCA).

    2.  For each cell `i`, compute a local density proxy `d_k`.

    3.  Normalize `d_k` to get an inverse density score `inv_dense`.

    4.  Calculate an adaptive cross-batch fraction `f_cross(i)` = `clip(base_fraction
    + delta * (inv_dense - 0.5) * 2)`.

    5.  Calculate quotas: `q_cross` and `q_within`.

    6.  For each cell `i`, perform constrained kNN searches against each batch''s
    point cloud to find the nearest neighbors that satisfy the quotas.

    7.  Assemble and symmetrize the final graph from the collected neighbors.


    This approach makes batch correction an intrinsic property of the graph topology.


    **3. Results**

    We validated the AQG through systematic optimization, baseline comparison, and
    a generalization test. All experiments were performed on the Human Heart dataset.


    *   **Parameter Optimization:** We performed fine-grained sweeps of the novel
    `base_fraction` and `delta` parameters. The optimal configuration was found to
    be `base_fraction=0.75` and `delta=0.05`.

    *   **Validation Experiments:** We compared the optimized AQG against the previous
    SOTA (MPB-GraphFWPCA) and tested its generalization by running it on a standard
    PCA input instead of FWPCA.


    The results are summarized below, with metrics reported in the mandatory order:


    | Experiment | EID | Score | ASW_batch | ASW_label | ARI | NMI | Graph_conn |
    kBET | iLISI | cLISI | PCR | Cell_cycle |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|

    | **AQG SOTA (FWPCA)** | **928** | **0.7454** | **0.659** | **0.248** | **0.789**
    | **0.744** | **0.967** | **0.791** | **0.954** | **0.975** | **1.000** | **0.327**
    |

    | Baseline (MPB SOTA) | 949 | 0.7360 | 0.659 | 0.248 | 0.744 | 0.710 | 0.985 |
    0.790 | 0.930 | 0.965 | 1.000 | 0.327 |

    | AQG Generalization (PCA) | 950 | 0.7298 | 0.659 | 0.248 | 0.745 | 0.705 | 0.946
    | 0.788 | 0.950 | 0.967 | 1.000 | 0.290 |


    **4. Conclusion**

    The AQG architecture achieves a new state-of-the-art score of 0.7454. The results
    demonstrate its superiority over the previous sequential SOTA and its robustness
    to changes in the input feature space. By unifying graph construction and batch
    correction, the AQG represents a new and powerful paradigm for single-cell integration.'
