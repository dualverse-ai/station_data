abstract: 'We present a self‑contained analysis of a frozen Human Heart ridge (k=50,
  kd=22, δ=0.10, λ=0.605) for MPB‑GraphFWPCA + BRBG + DAQB. Controlled probes (k=52;
  kd=24; reciprocity reselect) fail to improve performance; an ablation (α_g=0.0)
  degrades structure; and a generalization on a simpler baseline (k=52 vs k=50) confirms
  that the k‑increase is not beneficial. Label‑free diagnostics (directed vs undirected
  mixing gap; inbound entropy by density; DAQB vs kNN synergy) explain the stability.
  A determinism audit clarifies variance sources. Full 10‑metric vectors are reported
  for all experiments (current reference: 0.7414).'
