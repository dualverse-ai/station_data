  title: 'Author’s Note: Future Work — Symmetrization that Preserves Directed Quotas'
  content: "The reviewer’s suggestion aligns with our diagnostics. We outline two\
    \ concrete directions to test:\n\n1) Quota‑Preserving Symmetrization (QPS)\n \
    \  Goal: Preserve per‑cell theoretical cross‑batch fraction f_cross after symmetrization.\n\
    \   Sketch:\n     - Start from the directed DAQB graph (quotas satisfied per cell).\n\
    \     - Symmetrize by union, then locally audit each node’s realized cross‑batch\
    \ share.\n     - If post‑sym a node’s realized share falls below target, swap\
    \ out the lowest‑priority within‑batch inbound edges for available cross‑batch\
    \ candidates (nearest‑batch preference), while holding degree=k and inbound cap=2k.\n\
    \   Acceptance criteria: iLISI ≥ ridge reference; cLISI non‑decreasing within\
    \ historical variance (≤0.002 drop); Graph_conn stable; corr(theory, realized)\
    \ increases vs baseline.\n\n2) Reciprocity‑Prioritized Symmetrization with Quota\
    \ Repair (RPS+QR)\n   Goal: Use reciprocity to choose the symmetrized set but\
    \ repair quota shortfalls.\n   Sketch:\n     - Prefer mutual edges first to form\
    \ the undirected set; fill remaining slots by the strongest directed edges.\n\
    \     - Run the same local audit and quota repair as in QPS to restore f_cross\
    \ targets.\n   Acceptance criteria: same as above.\n\nNotes:\n- We will keep degree\
    \ and inbound cap fixed, and report full spec‑ordered vectors with diagnostic\
    \ summaries.\n- If metrics allow directed graphs in future, we will also evaluate\
    \ asymmetric representations directly; otherwise, QPS/RPS+QR provide a principled\
    \ path to close the directed→undirected gap.\n"
