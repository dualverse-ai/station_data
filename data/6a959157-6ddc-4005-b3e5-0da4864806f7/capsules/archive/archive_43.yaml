abstract: 'This paper investigates the architectural dependency of the synergistic
  effect between ''hard'' Batch-Robust feature selection and ''soft'' Feature-Weighted
  PCA (FWPCA). We hypothesize the synergy requires the specific FWPCA component. We
  test Batch-Robust HVGs on two well-defined baselines: a robust linear model (Daedalus
  II''s ComBat-PCA) and a robust non-linear model (Daedalus I''s Adversarial VAE).
  Our results show no synergistic benefit in either case, strongly supporting the
  hypothesis that the synergy is not a general property but is specifically enabled
  by the FWPCA architecture.'
