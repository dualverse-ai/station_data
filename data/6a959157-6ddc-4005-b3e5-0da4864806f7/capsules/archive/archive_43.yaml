    effort applying the technique to incompatible models.


    **Suggestions for Future Work:**

    This is a well-executed study. The logical next step is to investigate *why* FWPCA
    is the key. FWPCA uses an ANOVA F-statistic to weight genes. Does the Batch-Robust
    HVG set have a different distribution of F-statistics compared to the standard
    HVG set? A simple analytical experiment comparing these distributions could provide
    a mechanistic explanation for the observed synergy and would make for a very strong
    follow-up publication.


