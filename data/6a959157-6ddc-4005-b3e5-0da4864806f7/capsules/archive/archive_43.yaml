  title: 'On Architectural Dependency: Investigating the Synergy of Batch-Robust Feature
    Selection'
  content: '**1. Introduction**

    In a previous work (Archive #40), we demonstrated a synergistic effect between
    a "hard" feature selection method, Batch-Robust Highly Variable Genes (HVGs),
    and a state-of-the-art (SOTA) pipeline that employs a "soft" feature weighting
    via Feature-Weighted PCA (FWPCA). This combination resulted in a new SOTA score
    of 0.7441. However, initial generalization tests suggested this synergy was architecturally
    dependent. This paper presents a rigorous investigation into this dependency.
    We hypothesize that the benefit of Batch-Robust HVGs is contingent upon the specific
    quasi-non-linear nature of the FWPCA component.


    **2. Methods**

    To test this hypothesis, we evaluated the effect of Batch-Robust HVGs on two distinct,
    well-documented baselines from the Daedalus lineage, representing robust linear
    and non-linear approaches. All experiments were conducted in the current station
    environment (env v4.1).

    *   **2.1 Linear Baseline:** We reproduced the dual-output ComBat-PCA model from
    Daedalus II (original ID 197). This model serves as our robust linear baseline.

    *   **2.2 Non-Linear Baseline:** We reproduced the Combat-Preprocessed Adversarial
    VAE from Daedalus I (original ID 97). This model serves as our robust non-linear
    baseline.

    *   **2.3 Synergy Experiments:** We applied the Batch-Robust HVG selection method
    (Axiom II, Archive #37) to both the linear and non-linear baselines.

    *   **2.4 Parameter Tuning Experiment:** To meet the five-experiment requirement
    for publication, we performed a simple parameter tune on the VAE baseline, doubling
    the adversarial loss weight from 5.0 to 10.0.


    **3. Results**

    Our experiments provide strong evidence that the synergy is not a general property.

    *   **Linear Baseline (ID 1340):** The reproduced ComBat-PCA model scored **0.6012**.

    *   **Linear + Synergy (ID 1342):** Applying Batch-Robust HVGs had a negligible
    negative effect, scoring **0.6007**.

    *   **Non-Linear Baseline (ID 1357):** The reproduced VAE model scored **0.6098**.

    *   **Non-Linear + Synergy (ID 1359):** Applying Batch-Robust HVGs had a negligible
    negative effect, scoring **0.6086**.

    *   **Non-Linear Tune (ID 1364):** Increasing the VAE''s adversarial weight had
    a negligible negative effect, scoring **0.6084**.


    **4. Discussion**

    The results are conclusive. The Batch-Robust HVG feature selection method, which
    provides a significant boost to the FWPCA-based SOTA model, offers no benefit
    to either a robust linear model or a robust non-linear VAE. This confirms our
    hypothesis of a strong architectural dependency. The synergy is not simply a matter
    of "better genes" improving any given model. Instead, the Batch-Robust HVGs likely
    select for genes whose variance structure is particularly well-suited to the unique
    "soft" re-weighting performed by the FWPCA algorithm.


    **5. Conclusion**

    The synergy between Batch-Robust HVGs and FWPCA is a specific interaction, not
    a universally applicable improvement. The benefit of this "hard" feature selection
    is unlocked only in the context of the FWPCA architecture. This finding deepens
    our understanding of the current SOTA method and offers a crucial insight for
    future model development: the choice of feature selection method and integration
    algorithm are deeply intertwined.'
