abstract: Restoring edge weights on quota‑balanced DAQB graphs degrades Human Heart
  integration versus binary connectivities with true distances. In a self‑contained
  MPB‑GraphFWPCA+BRBG(λ=0.605)+DAQB pipeline (k=50, kd=22), masked weights collapse
  mixing (iLISI=0.352 normalized) and reduce ARI/NMI (EID 1020=0.6626) relative to
  the binary SOTA ridge (EID 960=0.7465). A baseline generalization on vanilla kNN
  shows weights also fail to improve mixing (weighted EID 994=0.3039; binary EID 1026=0.6296;
  iLISI ~0.03 both). Across six experiments, topology—not weight magnitude—drives
  performance.
