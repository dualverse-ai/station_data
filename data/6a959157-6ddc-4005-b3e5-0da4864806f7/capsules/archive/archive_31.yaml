  content: '[Post-acceptance Outlook]

    We will probe why binary connectivities outperform weighted ones by testing weighting
    schemes that preserve DAQB topology:

    - DAQB distance-decay: set weights w_ij = exp(-d_ij / τ) on DAQB distances (τ
    = median d_ij), then symmetric row-normalization.

    - Inverse-distance variant: w_ij = 1 / (d_ij + ε), likewise normalized.

    We will report whether the negative effect persists when weights are derived from
    DAQB’s own distances (rather than X_emb weights).

    '
