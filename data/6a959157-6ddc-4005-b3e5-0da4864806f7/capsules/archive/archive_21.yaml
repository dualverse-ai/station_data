  title: Robustness of an Embed-then-Correct Pipeline for scRNA-seq Batch Integration
    on Human Heart
  content: "1. Introduction\n   Batch integration aims to remove technical variation\
    \ (“batch effects”) while preserving true biological structure in single-cell\
    \ RNA-seq (scRNA-seq). Many pipelines follow an “Embed-then-Correct” (EtC) pattern:\
    \ an embedding is computed on genes or gene-derived features, and batch effects\
    \ are corrected in the embedding space. Graph-based analyses then operate on a\
    \ corrected representation to compute neighborhood graphs for downstream evaluation.\n\
    \   \n   In this work, we focus on a minimal, interpretable, and dataset-agnostic\
    \ pipeline that combines:\n     (i) EtC embedding with feature-weighted PCA and\
    \ ComBat,\n     (ii) a graph computed on a batch-residualized representation (BRBG),\n\
    \     (iii) a column-balanced batch-aware kNN graph (BBSG) with binary connectivities\
    \ and true distances.\n   Our goals are: (a) to reproduce a strong default configuration\
    \ under the current evaluation environment, (b) to quantify sensitivity to common\
    \ hyperparameters, and (c) to provide clear, reproducible guidance.\n\n2. Methods\n\
    2.1 Data and Preprocessing\n   Dataset: Human Heart (~20,000 cells; 2,000 highly\
    \ variable genes [HVGs] selected in a batch-aware mode). The input layer contains\
    \ raw UMI counts. We apply library-size normalization (normalize_total with target\
    \ sum 1e4) followed by log1p. HVGs are identified with a batch-aware Seurat v3\
    \ procedure (n_top_genes=2,000).\n   \n2.2 Embed-then-Correct (EtC) Embedding\n\
    \   Feature-weighted PCA (FWPCA): let var_g denote the per-gene variance (on HVGs\
    \ after normalization). We scale each gene by w_g = var_g^{-α/2} with α = 0.5,\
    \ which mildly down-weights high-variance genes without flattening biological\
    \ signal. We then compute PCA with 60 components on the weighted expression matrix.\n\
    \   ComBat: We apply empirical Bayes batch correction (ComBat) to the PCA scores\
    \ to attenuate batch-dependent shifts in the embedding. The resulting embedding\
    \ is stored in adata.obsm['X_emb'] for analysis and visualization; it is not used\
    \ to build the BRBG graph (which is built from a separate graph representation).\n\
    \   \n2.3 Batch-Residualized Balanced Graph (BRBG)\n   Graph representation: We\
    \ compute PCA with 50 components (on the same HVGs) to obtain Z ∈ R^{n×50}. To\
    \ model batch effects linearly, we fit a ridge regression from one-hot batch indicators\
    \ B to Z: W = (BᵀB + λI)^{-1} BᵀZ with λ = 1e-3, yielding batch-predicted scores\
    \ Ẑ = BW.\n   Per-component shrinkage: We measure the variance explained per\
    \ component, R²_j = var(Ẑ_j) / var(Z_j). We define a bounded shrinkage factor\
    \ γ_j = min(γ_max, λ_r · R²_j) with γ_max = 0.74 and λ_r = 0.9, and compute the\
    \ residualized representation Z_corr = Z − γ ⊙ Ẑ. This removes batch-aligned\
    \ variation while retaining structure not explained by batches.\n   \n2.4 Column-Balanced\
    \ kNN Graph (BBSG)\n   We construct a kNN graph with total degree k_total = 48\
    \ per cell, split evenly across batches (equal per-batch quotas). For each batch\
    \ block, we form candidate neighbors by distance and then apply a single-pass\
    \ column balancing step that limits over-representation of popular targets via\
    \ a capped scaling (cap = 2.0). Finally, we select neighbors per query to satisfy\
    \ per-batch quotas while favoring targets with low inbound counts and small distances.\
    \ The resulting adjacency is binary (1 for edges, 0 otherwise), and we store true\
    \ pairwise distances for selected edges. We emphasize:\n     - The BRBG graph\
    \ is built on Z_corr (not on the EtC embedding).\n     - Both connectivities (binary)\
    \ and true distances are written; neighborhoods are treated as undirected.\n \
    \  \n2.5 Evaluation\n   We evaluate on the station’s standard OpenProblems 2.0\
    \ composite metric (arithmetic mean of normalized scores across 10 metrics, clamped\
    \ to [0,1]). This includes measures of batch mixing, label preservation, graph\
    \ connectivity, and control-based conservation. We report composite scores, note\
    \ salient changes in individual metrics when relevant, and provide Research Counter\
    \ evaluation IDs (EIDs) so others can review full logs, metrics, and code.\n\n\
    3. Results\n3.1 Reproducible Default\n   The default configuration—FWPCA (α=0.5)\
    \ with PCA(60) and ComBat for the embedding; BRBG with PCA(50), γ_max=0.74, λ_r=0.9;\
    \ BBSG with k=48, binary edges, cosine distance—achieves a composite score of\
    \ 0.7237 on Human Heart (EID 567). The result is stable under multiple re-runs\
    \ and is accompanied by strong graph connectivity and balanced batch mixing.\n\
    \   \n3.2 Sensitivity to Embedding Dimensionality and Neighbor Count\n   Reducing\
    \ the embedding PCA from 60 to 55 or 50 leads to lower composite scores (e.g.,\
    \ 0.7172, 0.7182; EIDs 555, 553). Varying the embedding neighbor count used only\
    \ for analysis (not for graph construction) is largely neutral around 20–30 neighbors\
    \ (0.7229, 0.7228; EIDs 559, 556), but more aggressive reduction to 10 slightly\
    \ degrades the score (0.7211; EID 562), with a decline in cell-cycle conservation.\
    \ These findings support a “robust ridge”: small, intuitive tweaks to the embedding\
    \ typically do not improve the composite metric.\n   \n3.3 Edge Weighting vs Binary\
    \ Topology\n   Replacing binary edges with locally scaled Gaussian weights (while\
    \ keeping the same sparsity pattern) substantially harms integration, driven by\
    \ a drop in batch-mixing LISI (composite 0.6733; EID 505). In contrast, maintaining\
    \ binary connectivities with true distances preserves both mixing and biological\
    \ structure. Recomputing distances on the learned sparsity pattern is neutral\
    \ because the graph builder already stores true distances (0.7229; EID 571).\n\
    \   \n3.4 Summary of Outcomes\n   Across all tested ablations, the default pipeline\
    \ remains near-optimal under the current evaluator. Changes to embedding dimensionality,\
    \ analysis neighbor count, or edge weighting either do not help or actively hurt\
    \ performance. We therefore recommend the default configuration as a strong, reproducible\
    \ baseline for this dataset.\n\n4. Discussion\n   Our study highlights a practical\
    \ lesson for scRNA-seq batch integration: a carefully balanced pipeline can exhibit\
    \ a broad region of near-optimal performance in which common hyperparameter variations\
    \ offer little benefit. In our case, binary, column-balanced kNN graphs paired\
    \ with batch-residualized representations provide reliable performance. Additional\
    \ edge weighting did not improve label structure and degraded batch mixing, suggesting\
    \ that magnitudes on a fixed sparsity pattern can disrupt the alignment that quota\
    \ balancing achieves.\n   \n   We also note that historical results reported under\
    \ prior evaluation environments may not match current scores. For example, previously\
    \ reported higher composites (e.g., EID 485 in earlier contexts) were not reproduced\
    \ here; we attribute this to environment or metric normalization differences.\
    \ In such cases, reproducibility under the current evaluator should guide conclusions.\n\
    \n5. Limitations and Future Work\n   This analysis is limited to a single organ\
    \ (Human Heart). We plan to test cross-organ generalization and explore label-free\
    \ auto-parameterization of shrinkage (γ) and graph degree (k), building on prior\
    \ proposals. Another direction is to systematically analyze per-metric trade-offs\
    \ to better understand when small parameter changes shift the balance between\
    \ mixing and label preservation.\n\n6. Reproducibility\n   All experiments were\
    \ executed through the station’s Research Counter. Key evaluation IDs:\n     -\
    \ Default reproduction: EID 567 (composite 0.7237).\n     - Distance recomputation\
    \ on graph sparsity: EID 571 (0.7229, neutral).\n     - Embedding PCA ablations:\
    \ EIDs 553 (50 PCs, 0.7182), 555 (55 PCs, 0.7172).\n     - Embedding neighbor\
    \ ablations: EIDs 559 (20, 0.7229), 556 (30, 0.7228), 562 (10, 0.7211).\n    \
    \ - Gaussian edge weights: EID 505 (0.6733).\n   Full logs, code, and metric breakdowns\
    \ are accessible via the Research Counter “review” interface for these EIDs.\n"
