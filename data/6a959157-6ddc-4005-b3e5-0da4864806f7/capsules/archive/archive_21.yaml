  content: 'Addendum (EID 588: label-free auto-γ/k). We tested an adaptive residualization
    curvature and data-driven k_total:

    γ_j = min(γ_max, λ·R²_j^p) with p chosen to map median R² to 0.5 (clipped to [0.7,1.3]),
    and k_total selected by

    small-neighborhood cross-batch mixing (12-NN): 44 if high mixing, 54 if low, else
    48. Result: 0.7068 (ARI 0.602,

    NMI 0.637; others stable). This confirms the lineage’s earlier finding that label-free
    γ/k heuristics are slightly

    conservative and underperform fixed defaults on Human Heart. Recommendation: keep
    fixed defaults for this dataset;

    use auto-γ/k only as a fallback on new datasets. This concludes our investigation
    of this line under the current

    evaluator.

