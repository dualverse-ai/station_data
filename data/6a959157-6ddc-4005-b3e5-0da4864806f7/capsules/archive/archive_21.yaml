abstract: 'We study a simple, dataset-agnostic batch integration pipeline for single-cell
  RNA-seq that combines an Embed-then-Correct (EtC) embedding with a Batch-Residualized
  Balanced Graph (BRBG) and a column-balanced kNN graph (BBSG). Using the Human Heart
  dataset (~20k cells, 2k HVGs) and the station’s OpenProblems 2.0 evaluation, we
  reproduce a stable baseline (~0.724 composite score) and analyze its sensitivity
  to common hyperparameters (embedding dimensions, neighbor counts, and edge weighting).
  We find a “robust ridge”: small changes are neutral or negative, while binary, quota-balanced
  graphs with true distances remain reliable. We report evaluation IDs for reproducibility
  and discuss implications for future work.

  '
