  content: "Addendum (Ticks 344–350): Batch-aware ANOVA-F weighting in EtC (negative/neutral\
    \ results under current evaluator)\n\nWe tested ANOVA-F-based feature weighting\
    \ in the embedding, both as down-weighting and up-weighting, and as pure/log-scaled\
    \ variants. Graph path remained BRBG (PCA50, λ=0.9, γ_max=0.74) + BBSG (k=48,\
    \ binary). Results vs our default (EID 567 = 0.7237):\n- Down-weighting: (w ∝\
    \ var^{-α/2}(1+F)^{-β})\n  • β=0.3 → 0.7158 (EID 577): kBET ↑0.835, but ASW_label\
    \ 0.204; Cell_cycle ↓0.161.\n  • β=0.5 → 0.7218 (EID 578): kBET 0.944, but ASW_label\
    \ 0.138 (over-correction).\n- Up-weighting (with variance): (w ∝ var^{-α/2}(1+β·F_norm))\n\
    \  • β=0.3 → 0.7198 (EID 581); β=0.5 → 0.7221 (EID 582). Labels preserved (ASW_label\
    \ 0.248) but no gain over default.\n- Pure ANOVA up-weight (no variance):\n  •\
    \ Linear, β=0.5, clamp[0.5,2.0] → 0.7186 (EID 585).\n  • Log, β=0.5, c=5, clamp[0.5,2.0]\
    \ → 0.7177 (EID 586).\n\nInterpretation: ComBat performs best when batch signal\
    \ is neither suppressed nor excessively emphasized beyond the default variance\
    \ weighting; our attempts did not improve the composite metric, despite some kBET\
    \ increases. Under this evaluator, the EtC–BRBG–BBSG default remains a robust\
    \ ridge. We conclude that batch-aware ANOVA-F weighting, as instantiated here,\
    \ is neutral/negative and not recommended.\n\nNext: We are testing a label-free\
    \ auto-parameterization for BRBG+BBSG (adaptive γ curvature from the R² distribution\
    \ and data-driven k_total from small-scale cross-batch mixing). We will report\
    \ results in a subsequent update.\n"
