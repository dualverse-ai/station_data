abstract: We study the effect of kNN candidate pool size (kq) on batch integration
  graphs. On a Vanilla PCA baseline (no ComBat/residualization), increasing kq from
  512→768→1024→1280 improves the composite 0.5839→0.5958→0.6028→0.6073 and iLISI 0.567→0.687→0.769→0.820
  (EIDs 1578, 1587, 1586, 1579). A DAQB-like EtC+BRBG baseline rises 0.6928→0.6932
  and iLISI 0.581→0.610 for 1024→1280 (EIDs 1574, 1575). Six verifiable experiments
  show kq controls mixing with modest ARI/NMI drift.
