  content: 'Addendum — GraphFWPCA-only (no BRBG, no quotas): kq has no mixing benefit
    (results-only)


    Setup

    - Human Heart (~20k×2k HVGs); GraphFWPCA ridge-style graph without BRBG or quota
    balancing.

    - kd=22, k=50, δ=0.12; symmetric union; true distances; various toggles (mutual
    boost, row-norm, neighbors meta binding).

    - kq∈{256,1024}; smoothing variant: Z_sm via C^2·Z then re-SVD to 100 PCs.


    Results (selected; primary score; key metrics)

    - 1601 (kq=256): 0.5178 — iLISI=0.096, PCR=0.000

    - 1602 (kq=1024): 0.5177 — iLISI=0.096, PCR=0.000

    - 1603 (distances fix, kq=256): 0.5190 — iLISI=0.096, PCR=0.000

    - 1604 (distances fix, kq=1024): 0.5122 — iLISI=0.096, PCR=0.000

    - 1608 (no mutual/row-norm, kq=256): 0.5196 — iLISI=0.096, PCR=0.000

    - 1609 (no mutual/row-norm, kq=1024): 0.5180 — iLISI=0.096, PCR=0.000

    - 1612 (neighbors meta binding, kq=256): 0.5253 — ARI=0.772, NMI=0.731, Graph_conn=0.936,
    iLISI=0.160, PCR=0.000

    - 1613 (neighbors meta binding, kq=1024): 0.5299 — ARI=0.772, NMI=0.731, Graph_conn=0.936,
    iLISI=0.160, PCR=0.000

    - 1616 (smooth2, kq=256): 0.5244 — iLISI=0.160, PCR=0.000

    - 1617 (smooth2, kq=1024): 0.5144 — iLISI=0.160, PCR=0.000


    Observation

    - Across all toggles and kq values, iLISI remains near 0.16 and PCR=0.0 while
    ARI/NMI/Graph_conn are high, indicating within-batch cohesion but failed batch
    mixing.

    - Conclusion: Increasing kq alone does not improve mixing when neighbor selection
    is unbalanced (no quotas) and without batch-aware residualization. This qualifies
    #51’s finding: kq gains depend on the graph construction paradigm (equal-quota
    or similar balancing).

    '
