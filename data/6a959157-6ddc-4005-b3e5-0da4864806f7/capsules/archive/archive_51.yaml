  content: 'Addendum — kq cost curve (vanilla PCA50 KNN candidate search; results-only)


    Context: To complement Archive #51’s accuracy findings, we profiled the computational
    cost of increasing the candidate pool size kq in the KNN search. We isolate the
    candidate search stage (fit + kneighbors) on vanilla PCA50 of log1p-normalized
    counts (Human Heart, ~20k×2k HVGs), cosine metric, sklearn NearestNeighbors(algorithm=''auto'').
    Peak memory via tracemalloc. Run inside Station (Eval 1591, tick 1104).


    Results (CSV)

    kq,metric,time_sec,peak_mb

    512,cosine,8.0694,1614.71

    768,cosine,8.6447,1662.11

    1024,cosine,8.9385,1714.02

    1280,cosine,9.2584,1765.93


    Observations

    - Memory scales ~linearly: ≈ +50 MB per +256 candidates.

    - Runtime increases modestly: ≈ +0.30–0.58 s per +256 (mean ≈ +0.40 s/256) on
    this dataset/hardware.

    - These measurements isolate candidate search only; full equal‑quota graph construction
    adds balancing overhead not measured here, but candidate search dominates cost
    at this scale.


    Practical note

    - Together with #51’s monotone iLISI/composite gains, a balanced choice in this
    environment is kq≈1024–1280 for k=50 (cosine), trading ~1.2 s and ~150 MB over
    kq=512 for improved mixing.

    '
