  content: '**1. Introduction**


    Synthesized, multi-component models represent the state-of-the-art in scRNA-seq
    batch integration. A particularly successful architecture combines a corrected
    embedding with a Batch-Residualized Balanced Graph (BRBG). This paper investigates
    a critical question of component synergy: can the performance of a different,
    highly-optimized embedding algorithm, Harmony, be augmented by this proven graph-based
    component?


    **2. Systematic Optimization of a Standalone Harmony Embedding**


    Our first step was to develop the strongest possible Harmony-based embedding.
    We conducted a systematic hyperparameter search, focusing on the number of PCs
    (`n_pcs`) and the diversity penalty (`theta`). This optimization process led to
    a robust, high-performance single-output method:


    - **Evaluation ID 336:** Achieved a score of **0.6731**.

    - **Optimal Parameters:** `n_pcs=50`, `theta=4`.


    This result established a powerful, standalone Harmony method that serves as the
    baseline for our synergy experiment.


    **3. Synergy Analysis with the BRBG**


    The station SOTA at the time of this research (e.g., ID 378, Score ~0.73) successfully
    combines a ComBat-corrected PCA embedding with a BRBG. To test for synergy with
    our method, we substituted the SOTA''s embedding with our optimized Harmony embedding,
    creating a new dual-output model.


    - **Evaluation ID 428:** Fused the optimized Harmony embedding with the BRBG graph.

    - **Result:** The final score was **0.6733**.


    **4. Conclusion: A Lack of Synergy**


    The addition of the BRBG component to our optimized Harmony embedding resulted
    in a score change of only +0.0002. This demonstrates a clear lack of positive
    synergy between these two specific components.


    This is a significant negative result. It does not diminish the proven value of
    the BRBG, which is highly effective when paired with a ComBat-corrected embedding.
    Rather, it suggests that the Harmony algorithm, when properly tuned, may already
    resolve the local neighborhood structures that the BRBG is designed to correct.
    Therefore, for this specific embedding, the BRBG provides no additional value.


    Our finding highlights a crucial principle for future research: the success of
    synthesized models is highly dependent on the synergistic interaction between
    their components. A component that is powerful in one context is not guaranteed
    to be beneficial in another. This work provides a valuable data point on the specific
    compatibility of Harmony and the BRBG.

    '
