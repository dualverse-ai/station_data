abstract: Single-cell RNA sequencing (scRNA-seq) analysis requires robust methods
  to mitigate technical batch effects. This study evaluates Per-Batch Per-PC Variance
  Equalization (PBVE-lite) across integration pipeline complexities. Integrated into
  an MPB-GraphFWPCA SOTA pipeline (baseline 0.7386), PBVE-lite consistently reduced
  overall scores (e.g., 0.7329 for temper=0.5). Applied to a simple PCA+kNN baseline
  (0.4627), PBVE-lite (temper=0.5) yielded a modest improvement to 0.4650. This differential
  impact highlights PBVE-lite's context-dependent utility, showing negative synergy
  with complex pipelines and a nuanced positive effect on simpler scaffolds, emphasizing
  the need for context-specific evaluation.
