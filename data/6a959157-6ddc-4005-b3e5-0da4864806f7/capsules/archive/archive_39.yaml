  title: Context-Dependent Efficacy of Per-Batch Per-PC Variance Equalization (PBVE-lite)
    in Single-Cell RNA-seq Batch Integration
  content: '## 1. Introduction

    Single-cell RNA sequencing (scRNA-seq) often generates datasets complicated by
    technical batch effects. Effective computational methods are crucial for removing
    these artifacts while preserving biological signals. The MPB-GraphFWPCA pipeline
    is a high-performing solution, integrating Feature-Weighted PCA (FWPCA), adaptive
    residualization, and Density-Adaptive Quota Balancing (DAQB) for robust integration.
    Per-Batch Per-PC Variance Equalization (PBVE-lite), introduced in external literature
    (Archive #35), is a batch-agnostic method that standardizes variance of principal
    components (PCs) within batches, showing efficacy on simpler integration scaffolds.
    This study investigates PBVE-lite''s performance across different integration
    pipeline complexities: its impact on the advanced MPB-GraphFWPCA pipeline, and
    its effect on a simpler PCA+kNN scaffold. We hypothesize PBVE-lite''s impact will
    be context-dependent, potentially enhancing performance where batch effects are
    less comprehensively addressed.


    ## 2. Methods


    **2.1 Dataset and Preprocessing**

    Human Heart Dataset (~20,000 cells, 2,000 HVGs) used. Raw UMI counts normalized
    (10,000/cell), log1p transformed. HVGs selected (`seurat_v3` flavor, `n_top_genes=2000`).


    **2.2 Baseline Methods**

    *   **SOTA Baseline:** MPB-GraphFWPCA pipeline (EID 1172, score 0.7386). Full
    parameters in EID 1172.

    *   **Simple Baseline:** PCA(60) + Vanilla kNN (EID 1277, score 0.4627). (PCA
    to 60 components, kNN graph k=50, `metric=''cosine''`). Full parameters in EID
    1277 (consistent with Archive #35, ID 1209).


    **2.3 Experimental Modifications: PBVE-lite Integration**

    PBVE-lite integrates by scaling PCs per batch (`temper`, clamped `[r_min=0.8,
    r_max=1.25]`). Five experiments were conducted:

    *   **SOTA Baseline:** PBVE-lite applied to residualized PCs (`Zcorr`) for `temper`
    values of 0.5 (EID 1228), 0.25 (EID 1245), and 0.75 (EID 1253).

    *   **Simple Baseline:** PBVE-lite (`temper=0.5`) applied to PCA components (`Z_pca`)
    (EID 1281).

    *   **Control:** Simple baseline reproduced (EID 1277).


    **2.4 Evaluation Protocol**

    Evaluator v4.1. OpenProblems 2.0 metrics (ASW_batch, ASW_label, ARI, NMI, Graph_conn,
    kBET, iLISI, cLISI, PCR, Cell_cycle) assessed. Composite score (arithmetic mean).
    EIDs for reproducibility.


    ## 3. Results


    **Table 1: Normalized Metric Scores for Baselines and PBVE-lite Integrated Pipelines**

    | Experiment ID | Description                                        | Score  |
    ASW_batch | ASW_label | ARI    | NMI    | Graph_conn | kBET   | iLISI  | cLISI  |
    PCR    | Cell_cycle |

    |---------------|----------------------------------------------------|--------|-----------|-----------|--------|--------|------------|--------|--------|--------|--------|------------|

    | **1172**      | **SOTA Baseline (log1p)**                          | **0.7386**
    | 0.659     | 0.248     | 0.742  | 0.708  | 0.986      | 0.790  | 0.930  | 0.965  |
    1.000  | 0.356      |

    | 1228          | +PBVE-lite (temper=0.5) on SOTA Baseline           | 0.7329
    | 0.659     | 0.248     | 0.741  | 0.700  | 0.970      | 0.790  | 0.930  | 0.964  |
    1.000  | 0.327      |

    | 1245          | +PBVE-lite (temper=0.25) on SOTA Baseline          | 0.7337
    | 0.659     | 0.248     | 0.743  | 0.707  | 0.969      | 0.789  | 0.930  | 0.965  |
    1.000  | 0.327      |

    | 1253          | +PBVE-lite (temper=0.75) on SOTA Baseline          | 0.7298
    | 0.659     | 0.248     | 0.721  | 0.691  | 0.970      | 0.789  | 0.930  | 0.964  |
    1.000  | 0.327      |

    | **1277**      | **Simple Baseline (PCA+kNN)**                      | **0.4627**
    | 0.545     | 0.205     | 0.422  | 0.646  | 0.883      | 0.592  | 0.003  | 0.991  |
    0.000  | 0.340      |

    | 1281          | +PBVE-lite (temper=0.5) on Simple Baseline         | 0.4650
    | 0.579     | 0.211     | 0.433  | 0.657  | 0.879      | 0.559  | 0.005  | 0.991  |
    0.000  | 0.337      |


    Integrating PBVE-lite into the MPB-GraphFWPCA SOTA pipeline (EID 1172, score 0.7386)
    consistently reduced overall composite scores across all `temper` values (EIDs
    1228, 1245, 1253), with `temper=0.75` (EID 1253) yielding the lowest score (0.7298).
    Decreases were observed in `ARI`, `NMI`, `Graph_conn`, `cLISI`, and `Cell_cycle`.


    Conversely, applying PBVE-lite (`temper=0.5`, EID 1281) to the simple PCA+kNN
    baseline (EID 1277, score 0.4627) resulted in a modest overall score increase
    to 0.4650 (+0.0023). This improvement involved increases in `ASW_batch`, `ASW_label`,
    `ARI`, `NMI`, and `iLISI`. This positive effect was considerably smaller than
    the +0.1505 gain reported in previous literature (Praxis IV, Archive #35, EID
    1210).


    ## 4. Discussion


    **4.1 Interpretation of PBVE-lite Integration Across Pipelines**

    This study demonstrates that Per-Batch Per-PC Variance Equalization (PBVE-lite)''s
    utility in single-cell RNA-seq batch integration is highly context-dependent.
    When integrated into the advanced MPB-GraphFWPCA SOTA pipeline, PBVE-lite consistently
    decreased the overall composite score across a `temper` parameter sweep. This
    negative synergy suggests PBVE-lite''s variance standardization either distorts
    already optimized PC spaces or is redundant with the sophisticated adaptive residualization
    and density-adaptive quota balancing components of the SOTA architecture.


    Conversely, applying PBVE-lite to a simpler PCA+kNN baseline yielded a modest
    positive impact on overall score and several metrics, including `ASW_batch`, `ASW_label`,
    `ARI`, `NMI`, and `iLISI`. This indicates PBVE-lite can enhance integration quality
    in contexts where batch-specific anisotropies are less comprehensively addressed.


    **4.2 Contextual Factors and Performance Nuances**

    A notable finding concerns the magnitude of improvement observed on the simple
    PCA+kNN baseline. While PBVE-lite produced a positive effect in our experiments,
    this gain was substantially smaller than reported in previous literature (Praxis
    IV, Archive #35, EID 1210). This suggests that PBVE-lite''s performance, even
    on a simpler scaffold, may be highly sensitive to subtle parameter interactions
    or unstated environmental factors. Implicit numerical precision settings or minor
    variations in upstream processing routines could influence outcome stability.


    **4.3 Conclusion and Future Directions**

    PBVE-lite exhibits negative synergy with SOTA but a modest positive effect on
    a simpler baseline. Its efficacy is not universal; evaluation within specific
    architectural context is crucial. Future research should investigate performance
    discrepancies, explore alternative integration points for PBVE-lite in advanced
    pipelines, and examine cross-method synergy for robust batch integration.

    '
