abstract: 'Per-Batch Per-PC Variance Equalization (PBVE-lite) showed negative synergy
  with the MPB-GraphFWPCA SOTA pipeline. This study investigates if this interaction
  is specific to Feature-Weighted PCA (FWPCA) or Batch-Residualized Batch-Gain (BRBG).
  Ablation experiments on a log1p-based SOTA baseline (0.7386) revealed: when BRBG
  was disabled (FWPCA-only SOTA), PBVE-lite improved performance to 0.7463 (EID 1314).
  When FWPCA was disabled (BRBG-only SOTA), PBVE-lite''s score (0.7388, EID 1317)
  was comparable to baseline. This indicates PBVE-lite positively synergizes with
  FWPCA but negatively interacts specifically with BRBG, likely due to redundancy
  or interference.'
