  content: "# Batch-Specific Quantile Normalization and Winsorization as Preprocessing\
    \ Steps for scRNA-seq Batch Integration: Differential Impact on ComBat and Embed-then-Correct\
    \ Pipelines\n\n## 1. Introduction\nSingle-cell RNA sequencing (scRNA-seq) data\
    \ is often confounded by technical batch effects, necessitating robust integration\
    \ methods. While numerous approaches exist, achieving effective batch correction\
    \ without losing biological signal remains a core challenge. This paper systematically\
    \ investigates two preprocessing strategies for scRNA-seq batch integration: batch-specific\
    \ quantile normalization (BQN) and batch-specific winsorization (BW). Both methods\
    \ aim to harmonize gene expression distributions or mitigate outliers across batches.\
    \ We evaluate their impact across two distinct pipelines: a simple ComBat-based\
    \ method and the advanced \"Embed-then-Correct\" (EtC) State-of-the-Art (SOTA)\
    \ pipeline, revealing critical insights into component compatibility and pipeline\
    \ fragility.\n\n## 2. Methods\n\n### 2.1. Batch-Specific Quantile Normalization\
    \ (BQN)\nBQN is a preprocessing step designed to transform gene expression values\
    \ such that their distributions are consistent across batches. The algorithm proceeds\
    \ as follows:\n1.  **Input:** An AnnData object `adata` and a Series `batch_labels`\
    \ (categorical).\n2.  **Copy Data:** A copy of the input data matrix (`adata.X`)\
    \ is made to avoid modifying the original `adata.X` in place.\n3.  **Identify\
    \ HVGs:** Highly variable genes (HVGs) are identified using `adata.var['batch_hvg']`\
    \ (assuming pre-computation via `scanpy.pp.highly_variable_genes`).\n4.  **Extract\
    \ HVG Data:** The HVG data is extracted and converted to a dense NumPy array for\
    \ efficient processing.\n5.  **Compute Global Reference:** A global reference\
    \ distribution for HVGs is computed by flattening all HVG data and sorting it.\n\
    6.  **Batch-wise Normalization:** For each unique batch:\n    a.  **Select Batch\
    \ Data:** HVG data corresponding to cells in the current batch is extracted.\n\
    \    b.  **Flatten and Rank:** This batch-specific HVG data is flattened, and\
    \ the ranks of its values are calculated.\n    c.  **Map to Global Quantiles:**\
    \ These ranks are linearly interpolated to map to the quantiles of the global\
    \ HVG reference distribution.\n    d.  **Reshape and Update:** The normalized,\
    \ flattened data is reshaped back to its original batch-specific HVG shape and\
    \ updates the corresponding section of the temporary HVG data array.\n7.  **Integrate\
    \ Normalized Data:** After processing all batches, the normalized HVG data is\
    \ efficiently re-integrated back into the copied data matrix, handling sparse\
    \ and dense formats appropriately (converting to LIL for sparse assignment and\
    \ then back to CSR).\n8.  **Output:** The data matrix with batch-specific quantile\
    \ normalized HVGs.\nThe implementation details can be found in `storage/aether/aether_utils.py`.\n\
    \n### 2.2. Batch-Specific Winsorization (BW)\nBW is a preprocessing step designed\
    \ to mitigate the influence of outliers by capping extreme values within each\
    \ batch. The algorithm proceeds as follows:\n1.  **Input:** An AnnData object\
    \ `adata`, a Series `batch_labels` (categorical), and `limits=(lower_percentile,\
    \ upper_percentile)`.\n2.  **Copy Data:** A copy of the input data matrix (`adata.X`)\
    \ is made.\n3.  **Identify HVGs:** HVGs are identified using `adata.var['batch_hvg']`.\n\
    4.  **Batch-wise Winsorization:** For each HVG:\n    a.  **Extract Gene Data:**\
    \ The gene expression values for this HVG are extracted across all cells.\n  \
    \  b.  **Batch-wise Capping:** For each unique batch:\n        i.  Extract batch-specific\
    \ gene expression values for this HVG.\n        ii. Calculate the lower and upper\
    \ percentile limits (e.g., 1st and 99th) for these batch-specific values using\
    \ `np.percentile`.\n        iii. Winsorize the batch-specific gene expression\
    \ values using `np.clip` to these calculated limits.\n        iv. Update the corresponding\
    \ section of the data matrix with these winsorized values.\n5.  **Output:** The\
    \ data matrix with batch-specific winsorized HVGs.\nThe implementation details\
    \ can be found in `storage/aether/aether_utils.py`.\n\n### 2.3. Baseline Integration\
    \ Pipelines\nWe applied BQN and BW to two distinct integration pipelines:\n1.\
    \  **ComBat Manual Baseline (CMB):** A foundational batch correction method based\
    \ on empirical Bayes adjustments (System EID 2, Score 0.5895). This simple pipeline\
    \ involves direct application of `scanpy.pp.combat` to the HVG-filtered, log-normalized\
    \ gene expression matrix. Aether II replicated this baseline (EID 351, Score 0.5894).\n\
    2.  **Embed-then-Correct + BRBG (EtC-BRBG) SOTA Pipeline:** A high-performance\
    \ method, comprising Principal Component Analysis (PCA), followed by ComBat on\
    \ the resulting PCs, and finally construction of a Batch-Residualized Balanced\
    \ Graph (BRBG) from the corrected embedding (Daedalus II, EID 378, Score 0.7355;\
    \ Aether II replication EID 424, Score 0.7353). This pipeline represents a robust\
    \ current SOTA.\n\n### 2.4. Experimental Design\nBoth BQN and BW were integrated\
    \ into each pipeline as follows:\n-   **CMB + BQN (Aether II, EID 367, Tick 204):**\
    \ BQN was applied to the HVG-filtered, log-normalized data immediately *before*\
    \ `scanpy.pp.combat`.\n-   **EtC-BRBG + BQN (Aether II, EID 439, Tick 250):**\
    \ BQN was applied to the HVG-filtered, log-normalized data immediately *before*\
    \ `scanpy.tl.pca`.\n-   **CMB + BW (Aether II, EID 454, Tick 267):** BW was applied\
    \ to the HVG-filtered, log-normalized data immediately *before* `scanpy.pp.combat`\
    \ (limits: 1st and 99th percentile).\n-   **EtC-BRBG + BW (Aether II, EID 459,\
    \ Tick 269; EID 461, Tick 270):** BW was applied to the HVG-filtered, log-normalized\
    \ data immediately *before* `scanpy.tl.pca` (limits: 1st and 99th percentile).\n\
    \nAll experiments were conducted on the Human Heart Dataset, evaluated using 10\
    \ OpenProblems 2.0 metrics, and reported as an arithmetic mean of normalized scores.\n\
    \n## 3. Results\nThe performance of BQN and BW within each pipeline is summarized\
    \ below:\n\n**Table 1: Impact of Preprocessing on ComBat Manual Baseline (CMB)**\n\
    | Experiment ID | Preprocessing Method | Score | Score Change vs. Baseline (EID\
    \ 351, 0.5894) | ASW_batch | iLISI |\n|---|---|---|---|---|---|\n| 351 | None\
    \ (CMB Baseline) | 0.5894 | N/A | 0.664 | 0.033 |\n| 367 | Batch-Specific Quantile\
    \ Normalization (BQN) | 0.5918 | +0.0024 | 0.734 | 0.048 |\n| 454 | Batch-Specific\
    \ Winsorization (BW) | 0.5885 | -0.0009 | 0.669 | 0.034 |\n\n**Table 2: Impact\
    \ of Preprocessing on EtC-BRBG SOTA Baseline**\n| Experiment ID | Preprocessing\
    \ Method | Score | Score Change vs. Baseline (EID 424, 0.7353) | ASW_batch | iLISI\
    \ |\n|---|---|---|---|---|---|\n| 424 | None (EtC-BRBG Baseline) | 0.7353 | N/A\
    \ | 0.681 | 0.938 |\n| 439 | Batch-Specific Quantile Normalization (BQN) | 0.5946\
    \ | -0.1407 | 0.683 | 0.019 |\n| 459 / 461 | Batch-Specific Winsorization (BW)\
    \ | 0.6210 / 0.6187 | -0.1143 / -0.1166 | 0.683 / 0.683 | 0.035 / 0.035 |\n\n\
    ## 4. Discussion\nThe results consistently highlight a differential and often\
    \ detrimental impact of these simple preprocessing steps on complex batch integration\
    \ pipelines.\n\n### 4.1. Insights from the ComBat Manual Baseline\nOn the simpler\
    \ ComBat Manual Baseline (Table 1), Batch-Specific Quantile Normalization (EID\
    \ 367) showed a modest but positive improvement (+0.0024). This indicates that\
    \ for a direct, linear correction method like ComBat, harmonizing gene expression\
    \ distributions can provide a cleaner input, improving overall integration, particularly\
    \ by enhancing metrics of batch mixing (ASW_batch and iLISI). In contrast, Batch-Specific\
    \ Winsorization (EID 454) led to a negligible negative change, suggesting that\
    \ outlier capping offered no significant benefit, and potentially removed some\
    \ valuable signal.\n\n### 4.2. Insights from the Embed-then-Correct (EtC) SOTA\
    \ Pipeline\nWhen applied to the high-performing EtC-BRBG SOTA pipeline (Table\
    \ 2), both BQN (EID 439) and BW (EID 459/461) resulted in significant and consistent\
    \ degradation of performance. The most striking declines were observed in the\
    \ overall score and, critically, in the `iLISI` metric (which dropped to near\
    \ zero in both cases). `iLISI` specifically measures how well cells from different\
    \ batches mix within local neighborhoods of similar cell types, making its degradation\
    \ indicative of severe manifold distortion or loss of local biological structure.\n\
    \nThis consistent failure within the EtC framework can be understood through the\
    \ lens of recent theoretical analysis (Daedalus II, Archive #11). The EtC pipeline's\
    \ effectiveness stems from PCA acting as a \"signal amplifier,\" concentrating\
    \ both batch effects and biological structure into a low-dimensional space where\
    \ batch effects become linearly separable. This linear separability is paramount\
    \ for ComBat's subsequent effective linear subtraction. By preprocessing the raw\
    \ gene expression *before* PCA, both BQN and BW likely interfered with this delicate\
    \ signal amplification process. Instead of providing \"cleaner\" input, these\
    \ transformations may have:\n1.  **Distorted Signal Amplification:** Altered the\
    \ original gene expression distributions in a way that prevented PCA from optimally\
    \ co-localizing batch and biological signals into a linearly separable space.\n\
    2.  **Compromised Local Manifolds:** Introduced non-linear distortions or removed\
    \ subtle local information crucial for preserving biological manifold structures,\
    \ leading to the observed severe degradation in `iLISI` and `ASW_batch`. This\
    \ aligns directly with findings in Archive #13 (Sophia II), which demonstrated\
    \ that latent space modifications aimed at decorrelation could detrimentally impact\
    \ local batch mixing metrics. Similarly, Archive #12 (Veritas I) highlighted that\
    \ successful integration often relies on compatible components, and a preprocessing\
    \ step beneficial in a simpler context might be detrimental in a more complex,\
    \ optimized pipeline.\n\n### 4.3. Conclusion and Future Directions\nThis study\
    \ provides strong negative evidence against the general applicability of simple\
    \ batch-specific preprocessing methods like quantile normalization and winsorization\
    \ to complex, high-performing integration pipelines such as Embed-then-Correct.\
    \ While BQN showed a minor benefit on a basic ComBat baseline, its severe detrimental\
    \ impact, alongside winsorization, on the EtC pipeline underscores the critical\
    \ importance of understanding mechanistic interactions between components in multi-step\
    \ integration solutions.\n\nFuture research should carefully consider the specific\
    \ role of each component within an integration pipeline. For EtC, this implies\
    \ developing preprocessing strategies that explicitly *enhance* PCA's signal amplification\
    \ properties rather than disrupting the underlying data distributions. Alternatively,\
    \ explorations could focus on more advanced, inherently non-linear methods that\
    \ achieve batch correction while explicitly preserving local manifold structures\
    \ throughout their entire process, without relying on sequential, linearly subtractive\
    \ steps. This work contributes to the collective knowledge by outlining unpromising\
    \ directions and reinforcing the need for mechanistic understanding and rigorous\
    \ compatibility testing in batch integration methodology.\n\n## 5. Reproducibility\n\
    All experiments were conducted on Research Task 1, using the Human Heart Dataset.\n\
    -   **Combat Manual Baseline Replication:** Aether II, EID 351 (Tick 198)\n- \
    \  **CMB + BQN:** Aether II, EID 367 (Tick 204)\n-   **EtC-BRBG SOTA Replication:**\
    \ Aether II, EID 424 (Tick 240)\n-   **EtC-BRBG + BQN:** Aether II, EID 439 (Tick\
    \ 250)\n-   **CMB + BW:** Aether II, EID 454 (Tick 267)\n-   **EtC-BRBG + BW:**\
    \ Aether II, EID 459 (Tick 269), EID 461 (Tick 270)\n\nThe utility functions (`_normalize_log1p_inplace`,\
    \ `_batch_specific_winsorize`, `_batch_specific_quantile_normalize`, `_build_balanced_knn`)\
    \ used are available in lineage storage: `storage/aether/aether_utils.py` (updated\
    \ at Tick 266). The specific code for each submission is available in the respective\
    \ Evaluation IDs.\n"
