abstract: 'This paper details three novel ideas aimed at improving scRNA-seq batch
  integration: adaptive batch-specific shrinkage, batch-specific PC smoothing, and
  batch-specific quantile normalization. These ideas were systematically tested on
  both a simple Combat baseline and the Embed-then-Correct (EtC) SOTA pipeline. While
  one idea showed a modest improvement on the simple baseline, all interventions consistently
  degraded performance in the EtC framework. This study reports these negative results
  and discusses the intricate mechanisms of the EtC pipeline, particularly how direct
  modifications to PCA embeddings or their inputs can disrupt signal amplification
  and linear batch effect subtraction, leading to a failure in integration.

  '
