  content: "import numpy as np\nimport scanpy as sc\nimport anndata as ad\nfrom scipy\
    \ import sparse as sp\nfrom sklearn.decomposition import TruncatedSVD\nfrom sklearn.neighbors\
    \ import NearestNeighbors\n\n# --- Helper functions from Praxis I's auto_gamma_brbg.py\
    \ ---\n\ndef _normalize_log1p_inplace(adata: ad.AnnData, target_sum: float = 1e4):\n\
    \    \"\"\"Normalize raw counts and log1p in-place.\"\"\"\n    if 'counts' in\
    \ adata.layers:\n        adata.X = adata.layers['counts'].copy()\n    sc.pp.normalize_total(adata,\
    \ target_sum=target_sum, inplace=True)\n    sc.pp.log1p(adata)\n\ndef _get_hvg_mask(adata:\
    \ ad.AnnData):\n    \"\"\"Use batch-aware HVGs if provided, otherwise compute\
    \ HVGs with batch_key.\"\"\"\n    if 'batch_hvg' in adata.var.columns:\n     \
    \   mask = np.asarray(adata.var['batch_hvg'].values, dtype=bool)\n        if mask.sum()\
    \ > 0:\n            return mask\n    sc.pp.highly_variable_genes(adata, n_top_genes=2000,\
    \ flavor='seurat_v3', batch_key='batch', inplace=True)\n    return np.asarray(adata.var['highly_variable'].values,\
    \ dtype=bool)\n\ndef _pca_truncated_svd(X, n_comps=50, random_state=0):\n    \"\
    \"\"Sparse-aware PCA via TruncatedSVD.\"\"\"\n    n_comps = max(2, min(n_comps,\
    \ X.shape[1]-1 if X.shape[1] > 1 else 2))\n    svd = TruncatedSVD(n_components=n_comps,\
    \ n_iter=7, random_state=random_state)\n    Z = svd.fit_transform(X)\n    return\
    \ Z\n\ndef _one_hot_batches(batches):\n    batches = np.asarray(batches)\n   \
    \ uniq, inv = np.unique(batches, return_inverse=True)\n    B = np.zeros((batches.shape[0],\
    \ len(uniq)), dtype=np.float32)\n    B[np.arange(batches.shape[0]), inv] = 1.0\n\
    \    return B, uniq\n\ndef _ridge_batch_fit_predict(B: np.ndarray, Z: np.ndarray,\
    \ l2: float = 1e-3):\n    \"\"\"\n    Ridge fit batch one-hot B to predict PCs\
    \ Z. Returns Z_hat (n x d) and W (b x d).\n    \"\"\"\n    BtB = B.T @ B\n   \
    \ W = np.linalg.solve(BtB + l2 * np.eye(BtB.shape[0], dtype=np.float32), B.T @\
    \ Z)\n    Z_hat = B @ W\n    return Z_hat, W\n\ndef _build_balanced_knn(Z: np.ndarray,\
    \ batches, k_total=48, metric='cosine'):\n    \"\"\"\n    Build a batch-balanced\
    \ kNN graph:\n      - Equal per-batch quotas (distributes remainder across batches\
    \ in order)\n      - Binary connectivities (1.0), symmetric union\n      - Distances\
    \ from per-batch neighbor queries (min distance when duplicate)\n    Returns (C,\
    \ D) as CSR matrices.\n    \"\"\"\n    Z = np.asarray(Z, dtype=np.float32)\n \
    \   batches = np.asarray(batches)\n    uniq_batches = np.unique(batches)\n   \
    \ n = Z.shape[0]\n    nb = len(uniq_batches)\n    if nb == 0 or n == 0:\n    \
    \    return None, None\n\n    base = k_total // nb\n    rem = k_total - base *\
    \ nb\n    quotas = {b: base + (1 if i < rem else 0) for i, b in enumerate(uniq_batches)}\n\
    \n    pairs_min_dist = {}\n    for b in uniq_batches:\n        idx_b = np.where(batches\
    \ == b)[0]\n        if idx_b.size == 0 or quotas[b] == 0:\n            continue\n\
    \        k = min(quotas[b] + 1, idx_b.size)  # +1 to allow self (to be dropped)\n\
    \        nn = NearestNeighbors(n_neighbors=k, metric=metric, algorithm='auto')\n\
    \        nn.fit(Z[idx_b])\n        dists, inds = nn.kneighbors(Z, n_neighbors=k,\
    \ return_distance=True)\n        neigh_global = idx_b[inds]\n        for i in\
    \ range(n):\n            g = neigh_global[i]\n            di = dists[i]\n    \
    \        mask = g != i\n            g = g[mask][:quotas[b]]\n            di =\
    \ di[mask][:quotas[b]]\n            for j, d in zip(g, di):\n                if\
    \ i == j:\n                    continue\n                a, c = (i, j) if i <\
    \ j else (j, i)\n                prev = pairs_min_dist.get((a, c))\n         \
    \       if (prev is None) or (d < prev):\n                    pairs_min_dist[(a,\
    \ c)] = float(d)\n\n    if not pairs_min_dist:\n        return None, None\n\n\
    \    rows, cols, dist_data = [], [], []\n    for (i, j), d in pairs_min_dist.items():\n\
    \        rows.append(i); cols.append(j); dist_data.append(d)\n        rows.append(j);\
    \ cols.append(i); dist_data.append(d)\n\n    from scipy.sparse import coo_matrix\n\
    \    D = coo_matrix((dist_data, (rows, cols)), shape=(n, n)).tocsr()\n    C =\
    \ D.copy()\n    C.data[:] = 1.0  # binary connectivities\n    return C, D\n\n\n\
    # --- eliminate_batch_effect_fn based on Praxis I's brbg_dual_comb_resid_graph.py\
    \ ---\n\ndef _ensure_dense_X(adata):\n    if sp.issparse(adata.X):\n        adata.X\
    \ = adata.X.A\n\ndef eliminate_batch_effect_fn(adata: ad.AnnData) -> ad.AnnData:\n\
    \    print(\"Sophia I: Replication of Praxis I SOTA (ID 147) - Dual BRBG with\
    \ sc.pp.combat (ASW_label Fix Attempt)...\")\n    \n    # Praxis I's SOTA Config\
    \ (EID 147)\n    n_pcs_emb=64\n    n_pcs_graph=50\n    gamma=0.74\n    l2=1e-3\n\
    \    k_total=48\n    metric='cosine'\n    random_state = 0 # Explicitly added\
    \ for reproducibility\n\n    assert 'batch' in adata.obs.columns, \"adata.obs['batch']\
    \ required.\"\n    assert 'feature_name' in adata.var.columns, \"adata.var['feature_name']\
    \ required.\"\n\n    # Create copies of original adata for independent processing\
    \ paths\n    adata_for_graph_path = adata.copy()\n    adata_for_embedding_path\
    \ = adata.copy() # This copy will retain raw counts initially\n\n    # Normalize/log1p\
    \ for Graph Path (Praxis I's approach)\n    _normalize_log1p_inplace(adata_for_graph_path,\
    \ target_sum=1e4)\n    \n    hvg_mask = _get_hvg_mask(adata_for_graph_path) #\
    \ Get HVGs once on one copy (uses already normalized/log1p'd data)\n    if hvg_mask.sum()\
    \ < 10:\n        hvg_mask = np.ones(adata_for_graph_path.n_vars, dtype=bool)\n\
    \n    # --- Graph Path: residualized PCs on HVGs ---\n    X_graph = adata_for_graph_path.X[:,\
    \ hvg_mask]\n    if not sp.issparse(X_graph):\n        X_graph = sp.csr_matrix(X_graph)\n\
    \    Z_graph = _pca_truncated_svd(X_graph, n_comps=n_pcs_graph, random_state=random_state)\n\
    \    \n    batches = np.asarray(adata_for_graph_path.obs['batch'].astype('category').values)\n\
    \    B_onehot, _ = _one_hot_batches(batches)\n    Z_hat, _ = _ridge_batch_fit_predict(B_onehot,\
    \ Z_graph, l2=l2)\n    Z_corr_graph = Z_graph - gamma * Z_hat\n    C, D = _build_balanced_knn(Z_corr_graph,\
    \ batches, k_total=k_total, metric=metric)\n    print(f\"✓ Graph path complete.\
    \ Balanced kNN graph shape: {C.shape}\")\n\n    # --- Embedding Path: sc.pp.combat\
    \ (Full Genes) → PCA(HVGs) (Praxis I's exact path) ---\n    # _normalize_log1p_inplace\
    \ is called on adata_for_embedding_path *before* sc.pp.combat, as per Praxis I's\
    \ code structure.\n    _normalize_log1p_inplace(adata_for_embedding_path, target_sum=1e4)\
    \ # Ensure this is called first as per Praxis I's code\n    _ensure_dense_X(adata_for_embedding_path)\
    \ # Ensure dense format for sc.pp.combat\n    sc.pp.combat(adata_for_embedding_path,\
    \ key='batch') # Praxis I's direct call\n    \n    # Ensure HVG flag exists for\
    \ PCA (ComBat can drop it)\n    adata_for_embedding_path.var['highly_variable']\
    \ = hvg_mask # Set the highly_variable flag for PCA on relevant genes\n\n    sc.pp.pca(adata_for_embedding_path,\
    \ n_comps=n_pcs_emb, use_highly_variable=True, svd_solver='arpack', random_state=random_state)\n\
    \    Z_emb = adata_for_embedding_path.obsm['X_pca']\n    print(f\"✓ Embedding\
    \ path complete. ComBat PCA embedding shape: {Z_emb.shape}\")\n\n    # --- Final\
    \ Output Construction ---\n    adata_out = ad.AnnData(\n        obs=adata.obs[[]],\
    \ \n        var=adata.var[[]],\n        obsm={'X_emb': Z_emb}, # Set the embedding\n\
    \        uns={\n            'method_id': 'sophia_praxis_sota_replication_sc_pp_combat_asw_label_fixed',\
    \ # Updated ID for clarity\n            'brbg_dual': {\n                'gamma':\
    \ float(gamma),\n                'l2': float(l2),\n                'k_total':\
    \ int(k_total),\n                'metric': metric,\n                'pcs_graph':\
    \ int(n_pcs_graph),\n                'pcs_emb': int(n_pcs_emb),\n            \
    \    'embedding': 'sc.pp.combat PCA on HVGs (ASW_label Fixed)',\n            \
    \    'graph_source': 'Residualized PCA on HVGs',\n            }\n        }\n \
    \   )\n\n    # Store the balanced kNN graph in the output adata\n    if C is not\
    \ None and D is not None:\n        adata_out.obsp['connectivities'] = C.tocsr()\n\
    \        adata_out.obsp['distances'] = D.tocsr()\n        adata_out.uns['neighbors']\
    \ = {'connectivities_key': 'connectivities', 'distances_key': 'distances'}\n \
    \   else:\n        print(\"Warning: Balanced kNN graph construction failed. No\
    \ connectivities/distances output.\")\n\n    print(f\"✓ Sophia I: Praxis I SOTA\
    \ Replication (sc.pp.combat, ASW_label Fixed) complete.\")\n    return adata_out\n"
