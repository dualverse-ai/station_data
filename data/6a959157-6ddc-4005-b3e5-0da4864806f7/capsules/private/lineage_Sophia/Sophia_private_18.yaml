  content: "import numpy as np\nimport scanpy as sc\nimport anndata as ad\nfrom scipy\
    \ import sparse as sp\nfrom sklearn.decomposition import TruncatedSVD\nfrom sklearn.neighbors\
    \ import NearestNeighbors\n\n# --- Helper functions from Praxis I's auto_gamma_brbg.py\
    \ ---\n\ndef _normalize_log1p_inplace(adata: ad.AnnData, target_sum: float = 1e4):\n\
    \    \"\"\"Normalize raw counts and log1p in-place.\"\"\"\n    if 'counts' in\
    \ adata.layers:\n        adata.X = adata.layers['counts'].copy()\n    sc.pp.normalize_total(adata,\
    \ target_sum=target_sum, inplace=True)\n    sc.pp.log1p(adata)\n\ndef _get_hvg_mask(adata:\
    \ ad.AnnData):\n    \"\"\"Use batch-aware HVGs if provided, otherwise compute\
    \ HVGs with batch_key.\"\"\"\n    if 'batch_hvg' in adata.var.columns:\n     \
    \   mask = np.asarray(adata.var['batch_hvg'].values, dtype=bool)\n        if mask.sum()\
    \ > 0:\n            return mask\n    sc.pp.highly_variable_genes(adata, n_top_genes=2000,\
    \ flavor='seurat_v3', batch_key='batch', inplace=True)\n    return np.asarray(adata.var['highly_variable'].values,\
    \ dtype=bool)\n\ndef _pca_truncated_svd(X, n_comps=50, random_state=0):\n    \"\
    \"\"Sparse-aware PCA via TruncatedSVD.\"\"\"\n    n_comps = max(2, min(n_comps,\
    \ X.shape[1]-1 if X.shape[1] > 1 else 2))\n    svd = TruncatedSVD(n_components=n_comps,\
    \ n_iter=7, random_state=random_state)\n    Z = svd.fit_transform(X)\n    return\
    \ Z\n\ndef _one_hot_batches(batches):\n    batches = np.asarray(batches)\n   \
    \ uniq, inv = np.unique(batches, return_inverse=True)\n    B = np.zeros((batches.shape[0],\
    \ len(uniq)), dtype=np.float32)\n    B[np.arange(batches.shape[0]), inv] = 1.0\n\
    \    return B, uniq\n\ndef _ridge_batch_fit_predict(B: np.ndarray, Z: np.ndarray,\
    \ l2: float = 1e-3):\n    \"\"\"\n    Ridge fit batch one-hot B to predict PCs\
    \ Z. Returns Z_hat (n x d) and W (b x d).\n    \"\"\"\n    BtB = B.T @ B\n   \
    \ W = np.linalg.solve(BtB + l2 * np.eye(BtB.shape[0], dtype=np.float32), B.T @\
    \ Z)\n    Z_hat = B @ W\n    return Z_hat, W\n\ndef _build_balanced_knn(Z: np.ndarray,\
    \ batches, k_total=48, metric='cosine'):\n    \"\"\"\n    Build a batch-balanced\
    \ kNN graph:\n      - Equal per-batch quotas (distributes remainder across batches\
    \ in order)\n      - Binary connectivities (1.0), symmetric union\n      - Distances\
    \ from per-batch neighbor queries (min distance when duplicate)\n    Returns (C,\
    \ D) as CSR matrices.\n    \"\"\"\n    Z = np.asarray(Z, dtype=np.float32)\n \
    \   batches = np.asarray(batches)\n    uniq_batches = np.unique(batches)\n   \
    \ n = Z.shape[0]\n    nb = len(uniq_batches)\n    if nb == 0 or n == 0:\n    \
    \    return None, None\n\n    base = k_total // nb\n    rem = k_total - base *\
    \ nb\n    quotas = {b: base + (1 if i < rem else 0) for i, b in enumerate(uniq_batches)}\n\
    \n    pairs_min_dist = {}\n    for b in uniq_batches:\n        idx_b = np.where(batches\
    \ == b)[0]\n        if idx_b.size == 0 or quotas[b] == 0:\n            continue\n\
    \        k = min(quotas[b] + 1, idx_b.size)  # +1 to allow self (to be dropped)\n\
    \        nn = NearestNeighbors(n_neighbors=k, metric=metric, algorithm='auto')\n\
    \        nn.fit(Z[idx_b])\n        dists, inds = nn.kneighbors(Z, n_neighbors=k,\
    \ return_distance=True)\n        neigh_global = idx_b[inds]\n        for i in\
    \ range(n):\n            g = neigh_global[i]\n            di = dists[i]\n    \
    \        mask = g != i\n            g = g[mask][:quotas[b]]\n            di =\
    \ di[mask][:quotas[b]]\n            for j, d in zip(g, di):\n                if\
    \ i == j:\n                    continue\n                a, c = (i, j) if i <\
    \ j else (j, i)\n                prev = pairs_min_dist.get((a, c))\n         \
    \       if (prev is None) or (d < prev):\n                    pairs_min_dist[(a,\
    \ c)] = float(d)\n\n    if not pairs_min_dist:\n        return None, None\n\n\
    \    rows, cols, dist_data = [], [], []\n    for (i, j), d in pairs_min_dist.items():\n\
    \        rows.append(i); cols.append(j); dist_data.append(d)\n        rows.append(j);\
    \ cols.append(i); dist_data.append(d)\n\n    from scipy.sparse import coo_matrix\n\
    \    D = coo_matrix((dist_data, (rows, cols)), shape=(n, n)).tocsr()\n    C =\
    \ D.copy()\n    C.data[:] = 1.0  # binary connectivities\n    return C, D\n\n\
    # --- My robust ComBat implementation (copied from Logos I's ID 130 submission\
    \ and refined for stability) ---\ndef get_robust_combat_corrected_matrix(adata_in:\
    \ ad.AnnData) -> np.ndarray:\n    adata = adata_in.copy()\n    sc.pp.normalize_total(adata,\
    \ target_sum=1e4)\n    sc.pp.log1p(adata)\n    data = adata.X.toarray().T if sp.issparse(adata.X)\
    \ else adata.X.copy().T\n    batches = adata.obs['batch'].astype('category').cat.codes.values\n\
    \    u_batches = np.unique(batches)\n    n_batches = len(u_batches)\n    batch_design\
    \ = np.eye(n_batches)[batches]\n    n_genes, n_samples = data.shape\n    B_hat\
    \ = np.linalg.solve(batch_design.T @ batch_design, batch_design.T)\n    grand_mean\
    \ = np.mean(data, axis=1, keepdims=True)\n    batch_means = (B_hat @ data.T).T\n\
    \    var_pooled = np.sum((data - batch_means[:, batches])**2, axis=1) / (n_samples\
    \ - n_batches)\n    stand_mean = grand_mean.dot(np.ones((1, n_samples)))\n   \
    \ s_data = (data - batch_means[:, batches]) / np.sqrt(var_pooled[:, np.newaxis]\
    \ + 1e-8)\n    gamma_hat = (B_hat @ s_data.T).T\n    delta_hat = [np.var(s_data[:,\
    \ batches == i], axis=1, ddof=1) for i in u_batches]\n    gamma_bar, t2 = np.mean(gamma_hat,\
    \ axis=1), np.var(gamma_hat, axis=1, ddof=1)\n    def _aprior(d): m, s2 = np.mean(d),\
    \ np.var(d); return (2 * s2 + m**2) / (s2 if s2 > 0 else 1e-8)\n    def _bprior(d):\
    \ m, s2 = np.mean(d), np.var(d); return (m * s2 + m**3) / (s2 if s2 > 0 else 1e-8)\n\
    \    a_prior, b_prior = [_aprior(d) for d in delta_hat], [_bprior(d) for d in\
    \ delta_hat]\n    gamma_star, delta_star = np.zeros_like(gamma_hat), np.zeros_like(gamma_hat)\n\
    \    for i, batch_idx in enumerate(u_batches):\n        n = (~np.isnan(s_data[:,\
    \ batches == batch_idx])).sum(axis=1); g_old, d_old = gamma_hat[:, i], delta_hat[i];\
    \ change, count = 1, 0\n        while change > 1e-4 and count < 100:\n       \
    \     g_new = (t2 * n * g_old + d_old * gamma_bar) / (t2 * n + d_old + 1e-8);\
    \ sum2 = np.sum((s_data[:, batches == batch_idx] - g_new[:, np.newaxis])**2, axis=1)\
    \ # Added + 1e-8 to denominator for stability\n            d_new = (0.5 * sum2\
    \ + b_prior[i]) / (n / 2.0 + a_prior[i] - 1.0); change = max(np.abs(g_new - g_old).max(),\
    \ np.abs(d_new - d_old).max()); g_old, d_old = g_new, d_new; count += 1\n    \
    \    gamma_star[:, i], delta_star[:, i] = g_old, d_old\n    bayesdata = s_data.copy()\n\
    \    for i, batch_idx in enumerate(u_batches): bayesdata[:, batches == batch_idx]\
    \ = (s_data[:, batches == batch_idx] - gamma_star[:, i, np.newaxis]) / np.sqrt(delta_star[:,\
    \ i, np.newaxis] + 1e-8) # Added + 1e-8 to denominator for stability\n    X_corrected\
    \ = bayesdata * np.sqrt(var_pooled[:, np.newaxis]) + stand_mean\n    return np.nan_to_num(X_corrected.T)\n\
    \n\n# --- eliminate_batch_effect_fn based on Praxis I's brbg_dual_comb_resid_graph.py\
    \ ---\n\ndef _ensure_dense_X(adata):\n    if sp.issparse(adata.X):\n        adata.X\
    \ = adata.X.A\n\ndef eliminate_batch_effect_fn(adata: ad.AnnData) -> ad.AnnData:\n\
    \    print(\"Sophia I: Replication of Praxis I SOTA (ID 147) - Dual BRBG with\
    \ Robust ComBat...\")\n\n    # Praxis I's SOTA Config (EID 147)\n    n_pcs_emb=64\n\
    \    n_pcs_graph=50\n    gamma=0.74\n    l2=1e-3\n    k_total=48\n    metric='cosine'\n\
    \    random_state = 0 # Explicitly added for reproducibility\n\n    assert 'batch'\
    \ in adata.obs.columns, \"adata.obs['batch'] required.\"\n    assert 'feature_name'\
    \ in adata.var.columns, \"adata.var['feature_name'] required.\"\n\n    # Original\
    \ adata will be used for both paths, ensure it's copied appropriately\n    adata_for_graph_path\
    \ = adata.copy()\n    adata_for_embedding_path = adata.copy()\n\n    # Normalize/log1p\
    \ and HVGs (shared initial preprocessing)\n    _normalize_log1p_inplace(adata_for_graph_path,\
    \ target_sum=1e4)\n    _normalize_log1p_inplace(adata_for_embedding_path, target_sum=1e4)\
    \ # Preprocess copy for combat\n\n    hvg_mask = _get_hvg_mask(adata_for_graph_path)\
    \ # Get HVGs once on one copy\n    if hvg_mask.sum() < 10:\n        hvg_mask =\
    \ np.ones(adata_for_graph_path.n_vars, dtype=bool)\n\n    # --- Graph Path: residualized\
    \ PCs on HVGs ---\n    X_graph = adata_for_graph_path.X[:, hvg_mask]\n    if not\
    \ sp.issparse(X_graph):\n        X_graph = sp.csr_matrix(X_graph)\n    Z_graph\
    \ = _pca_truncated_svd(X_graph, n_comps=n_pcs_graph, random_state=random_state)\n\
    \n    batches = np.asarray(adata_for_graph_path.obs['batch'].astype('category').values)\n\
    \    B_onehot, _ = _one_hot_batches(batches)\n    Z_hat, _ = _ridge_batch_fit_predict(B_onehot,\
    \ Z_graph, l2=l2)\n    Z_corr_graph = Z_graph - gamma * Z_hat\n    C, D = _build_balanced_knn(Z_corr_graph,\
    \ batches, k_total=k_total, metric=metric)\n    print(f\"✓ Graph path complete.\
    \ Balanced kNN graph shape: {C.shape}\")\n\n    # --- Embedding Path: Robust ComBat\
    \ → PCA(HVGs) ---\n    # Use my robust Combat implementation\n    # Before Combat,\
    \ ensure X is in correct form for get_robust_combat_corrected_matrix\n    adata_for_embedding_path_temp\
    \ = adata_for_embedding_path.copy() # Need a temporary copy for robust combat\n\
    \    # The get_robust_combat_corrected_matrix function handles normalize_total\
    \ and log1p internally for its input\n    # So, adata_for_embedding_path_temp\
    \ should contain raw counts or adata.layers['counts']\n    # Ensure HVG selection\
    \ after Combat within my function\n    X_combat_corrected_data = get_robust_combat_corrected_matrix(adata_for_embedding_path_temp)\n\
    \n    # Recreate AnnData for PCA after Combat, ensuring correct var_names and\
    \ highly_variable flag\n    adata_for_embedding_path_processed = ad.AnnData(\n\
    \        X=X_combat_corrected_data[:, hvg_mask], # Apply HVG mask AFTER my Combat\
    \ is done\n        obs=adata_for_embedding_path.obs.copy()\n    )\n    adata_for_embedding_path_processed.var_names\
    \ = adata_for_embedding_path.var_names[hvg_mask].copy()\n    adata_for_embedding_path_processed.var['highly_variable']\
    \ = True # All genes are highly variable post-selection\n\n    sc.pp.pca(adata_for_embedding_path_processed,\
    \ n_comps=n_pcs_emb, use_highly_variable=True, svd_solver='arpack', random_state=random_state)\n\
    \    Z_emb = adata_for_embedding_path_processed.obsm['X_pca']\n    print(f\"✓\
    \ Embedding path complete. ComBat PCA embedding shape: {Z_emb.shape}\")\n\n  \
    \  # --- Final Output Construction ---\n    adata_out = ad.AnnData(\n        obs=adata.obs[[]],\n\
    \        var=adata.var[[]],\n        obsm={'X_emb': Z_emb}, # Set the embedding\n\
    \        uns={\n            'method_id': 'sophia_praxis_sota_replication_robust_combat',\n\
    \            'brbg_dual': {\n                'gamma': float(gamma),\n        \
    \        'l2': float(l2),\n                'k_total': int(k_total),\n        \
    \        'metric': metric,\n                'pcs_graph': int(n_pcs_graph),\n \
    \               'pcs_emb': int(n_pcs_emb),\n                'embedding': 'Robust\
    \ ComBat PCA on HVGs',\n                'graph_source': 'Residualized PCA on HVGs',\n\
    \            }\n        }\n    )\n\n    # Store the balanced kNN graph in the\
    \ output adata\n    if C is not None and D is not None:\n        adata_out.obsp['connectivities']\
    \ = C.tocsr()\n        adata_out.obsp['distances'] = D.tocsr()\n        adata_out.uns['neighbors']\
    \ = {'connectivities_key': 'connectivities', 'distances_key': 'distances'}\n \
    \   else:\n        print(\"Warning: Balanced kNN graph construction failed. No\
    \ connectivities/distances output.\")\n\n    print(f\"✓ Sophia I: Praxis I SOTA\
    \ Replication (Robust ComBat) complete.\")\n    return adata_out\n"
