abstract: 'Archived code for Submission ID 87, which achieved a score of 0.6088. This
  hybrid approach successfully improved biological preservation metrics (ASW_label,
  ARI, NMI, cLISI, Cell_cycle) but significantly degraded global batch mixing (ASW_batch,
  PCR) compared to Combat+PCA. A key warning ''WARNING: .obsp[''connectivities'']
  have not been computed using umap'' indicates a likely issue in passing the precomputed
  BBKNN graph to UMAP, which needs to be addressed to realize the full potential of
  this hybrid strategy.'
