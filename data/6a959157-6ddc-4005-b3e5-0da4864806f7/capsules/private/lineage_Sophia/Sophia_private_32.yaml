  content: "import numpy as np\nfrom scipy import sparse as sp\nfrom sklearn.neighbors\
    \ import NearestNeighbors\n\ndef build_balanced_knn_soft(Z, batches, k_total=48,\
    \ tau=0.05, metric='cosine'):\n    \"\"\"\n    Soft-quota balanced kNN with a\
    \ single temperature τ:\n      - Base equal quotas across batches (floor(k/nb)).\n\
    \      - Distribute the remainder to batches with higher local affinity scores\n\
    \        (sum of exp(-d/τ) over candidate neighbors), τ>0.\n      - Within each\
    \ batch, pick nearest neighbors up to its quota.\n      - Symmetric union; binary\
    \ connectivities; distances = min distance on duplicate edges.\n    τ→0 approximates\
    \ equal-quotas (deterministic); larger τ emphasizes closer batches for remainders.\n\
    \    Returns: (C, D) CSR matrices.\n    \"\"\"\n    Z = np.asarray(Z, dtype=np.float32)\n\
    \    batches = np.asarray(batches)\n    uniq = np.unique(batches)\n    n = Z.shape[0]\n\
    \    nb = len(uniq)\n    if nb == 0 or n == 0 or k_total <= 0:\n        return\
    \ None, None\n\n    base = k_total // nb\n    rem = k_total - base * nb\n\n  \
    \  # Precompute per-batch candidate neighbors and distances (base+rem+1 to allow\
    \ self)\n    k_per_batch = base + (rem if rem > 0 else 0) + 1\n    per_batch_inds\
    \ = {}\n    per_batch_dists = {}\n    per_batch_scores = {}\n\n    for b in uniq:\n\
    \        idx_b = np.where(batches == b)[0]\n        if idx_b.size == 0:\n    \
    \        continue\n        kq = min(k_per_batch, idx_b.size)\n        nn = NearestNeighbors(n_neighbors=kq,\
    \ metric=metric, algorithm='auto')\n        nn.fit(Z[idx_b])\n        d, ind_local\
    \ = nn.kneighbors(Z, n_neighbors=kq, return_distance=True)\n        ind_global\
    \ = idx_b[ind_local]\n        # drop self if present; keep arrays aligned per\
    \ row\n        mask = ind_global != np.arange(n)[:, None]\n        # Always keep\
    \ ordering; trim after masking\n        ig = []\n        dg = []\n        for\
    \ i in range(n):\n            m = mask[i]\n            g = ind_global[i][m]\n\
    \            di = d[i][m]\n            ig.append(g)\n            dg.append(di)\n\
    \        per_batch_inds[b] = ig\n        per_batch_dists[b] = dg\n        # Local\
    \ affinity scores for remainder distribution\n        if tau > 0:\n          \
    \  scores = [np.sum(np.exp(-di / tau)[:base + rem]) if di.size else 0.0 for di\
    \ in dg]\n        else:\n            # τ=0: use deterministic placeholder (equal\
    \ weights)\n            scores = [float(base + rem) for _ in range(n)]\n     \
    \   per_batch_scores[b] = np.asarray(scores, dtype=np.float32)\n\n    # Decide\
    \ quotas per batch per node: base + remainder assigned by highest scores\n   \
    \ quotas = {b: np.full(n, base, dtype=np.int32) for b in uniq}\n    if rem > 0:\n\
    \        for i in range(n):\n            # Rank batches by score for this node\n\
    \            bs = []\n            for b in uniq:\n                if b in per_batch_scores:\n\
    \                    bs.append((per_batch_scores[b][i], b))\n            if not\
    \ bs:\n                continue\n            bs.sort(reverse=True)\n         \
    \   # Assign remainder greedily\n            for _, b in bs[:rem]:\n         \
    \       quotas[b][i] += 1\n\n    # Collect undirected edges with minimal distance\
    \ across possible duplicate insertions\n    pairs_min_dist = {}\n    for b in\
    \ uniq:\n        if b not in per_batch_inds:\n            continue\n        for\
    \ i in range(n):\n            q = int(quotas[b][i])\n            if q <= 0:\n\
    \                continue\n            g = per_batch_inds[b][i]\n            di\
    \ = per_batch_dists[b][i]\n            if g is None or len(g) == 0:\n        \
    \        continue\n            # take up to q neighbors\n            g = g[:q]\n\
    \            di = di[:q]\n            for j, d in zip(g, di):\n              \
    \  if i == j:\n                    continue\n                a, c = (i, j) if\
    \ i < j else (j, i)\n                prev = pairs_min_dist.get((a, c))\n     \
    \           if (prev is None) or (d < prev):\n                    pairs_min_dist[(a,\
    \ c)] = float(d)\n\n    if not pairs_min_dist:\n        return None, None\n\n\
    \    rows, cols, dist_data = [], [], []\n    for (i, j), d in pairs_min_dist.items():\n\
    \        rows.append(i); cols.append(j); dist_data.append(d)\n        rows.append(j);\
    \ cols.append(i); dist_data.append(d)\n    from scipy.sparse import coo_matrix\n\
    \    D = coo_matrix((dist_data, (rows, cols)), shape=(n, n)).tocsr()\n    C =\
    \ D.copy()\n    C.data[:] = 1.0\n    return C.tocsr(), D.tocsr()\n"
