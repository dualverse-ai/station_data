  content: "import numpy as np\nimport scanpy as sc\nimport anndata as ad\nfrom scipy\
    \ import sparse as sp\nfrom sklearn.decomposition import TruncatedSVD\nfrom sklearn.neighbors\
    \ import NearestNeighbors\nfrom scipy.sparse import coo_matrix\n\n# --- Helper\
    \ functions from Praxis I's auto_gamma_brbg.py ---\n\ndef _normalize_log1p_inplace(adata:\
    \ ad.AnnData, target_sum: float = 1e4):\n    \"\"\"Normalize raw counts and log1p\
    \ in-place.\"\"\"\n    if 'counts' in adata.layers:\n        adata.X = adata.layers['counts'].copy()\n\
    \    sc.pp.normalize_total(adata, target_sum=target_sum, inplace=True)\n    sc.pp.log1p(adata)\n\
    \ndef _get_hvg_mask(adata: ad.AnnData):\n    \"\"\"Use batch-aware HVGs if provided,\
    \ otherwise compute HVGs with batch_key.\"\"\"\n    if 'batch_hvg' in adata.var.columns:\n\
    \        mask = np.asarray(adata.var['batch_hvg'].values, dtype=bool)\n      \
    \  if mask.sum() > 0:\n            return mask\n    sc.pp.highly_variable_genes(adata,\
    \ n_top_genes=2000, flavor='seurat_v3', batch_key='batch', inplace=True)\n   \
    \ return np.asarray(adata.var['highly_variable'].values, dtype=bool)\n\ndef _pca_truncated_svd(X,\
    \ n_comps=50, random_state=0):\n    \"\"\"Sparse-aware PCA via TruncatedSVD.\"\
    \"\"\n    n_comps = max(2, min(n_comps, X.shape[1]-1 if X.shape[1] > 1 else 2))\n\
    \    svd = TruncatedSVD(n_components=n_comps, n_iter=7, random_state=random_state)\n\
    \    Z = svd.fit_transform(X)\n    return Z\n\ndef _one_hot_batches(batches):\n\
    \    batches = np.asarray(batches)\n    uniq, inv = np.unique(batches, return_inverse=True)\n\
    \    B = np.zeros((batches.shape[0], len(uniq)), dtype=np.float32)\n    B[np.arange(batches.shape[0]),\
    \ inv] = 1.0\n    return B, uniq\n\ndef _ridge_batch_fit_predict(B: np.ndarray,\
    \ Z: np.ndarray, l2: float = 1e-3):\n    \"\"\"\n    Ridge fit batch one-hot B\
    \ to predict PCs Z. Returns Z_hat (n x d) and W (b x d).\n    \"\"\"\n    BtB\
    \ = B.T @ B\n    W = np.linalg.solve(BtB + l2 * np.eye(BtB.shape[0], dtype=np.float32),\
    \ B.T @ Z)\n    Z_hat = B @ W\n    return Z_hat, W\n\ndef _build_balanced_knn(Z:\
    \ np.ndarray, batches, k_total=48, metric='cosine'): # This is the non-calibrated\
    \ version. Will copy calibrated version directly from Praxis' cbknn.py below.\n\
    \    \"\"\"\n    Build a batch-balanced kNN graph:\n      - Equal per-batch quotas\
    \ (distributes remainder across batches in order)\n      - Binary connectivities\
    \ (1.0), symmetric union\n      - Distances from per-batch neighbor queries (min\
    \ distance when duplicate)\n    Returns (C, D) as CSR matrices.\n    \"\"\"\n\
    \    Z = np.asarray(Z, dtype=np.float32)\n    batches = np.asarray(batches)\n\
    \    uniq_batches = np.unique(batches)\n    n = Z.shape[0]\n    nb = len(uniq_batches)\n\
    \    if nb == 0 or n == 0:\n        return None, None\n\n    base = k_total //\
    \ nb\n    rem = k_total - base * nb\n    quotas = {b: base + (1 if i < rem else\
    \ 0) for i, b in enumerate(uniq_batches)}\n\n    pairs_min_dist = {}\n    for\
    \ b in uniq_batches:\n        idx_b = np.where(batches == b)[0]\n        if idx_b.size\
    \ == 0 or quotas[b] == 0:\n            continue\n        k = min(quotas[b] + 1,\
    \ idx_b.size)  # +1 to allow self (to be dropped)\n        nn = NearestNeighbors(n_neighbors=k,\
    \ metric=metric, algorithm='auto')\n        nn.fit(Z[idx_b])\n        dists, inds\
    \ = nn.kneighbors(Z, n_neighbors=k, return_distance=True)\n        neigh_global\
    \ = idx_b[inds]\n        for i in range(n):\n            g = neigh_global[i]\n\
    \            di = dists[i]\n            mask = g != i\n            g = g[mask][:quotas[b]]\n\
    \            di = di[mask][:quotas[b]]\n            for j, d in zip(g, di):\n\
    \                if i == j:\n                    continue\n                a,\
    \ c = (i, j) if i < j else (j, i)\n                prev = pairs_min_dist.get((a,\
    \ c))\n                if (prev is None) or (d < prev):\n                    pairs_min_dist[(a,\
    \ c)] = float(d)\n\n    if not pairs_min_dist:\n        return None, None\n\n\
    \    rows, cols, dist_data = [], [], []\n    for (i, j), d in pairs_min_dist.items():\n\
    \        rows.append(i); cols.append(j); dist_data.append(d)\n        rows.append(j);\
    \ cols.append(i); dist_data.append(d)\n\n    from scipy.sparse import coo_matrix\n\
    \    D = coo_matrix((dist_data, (rows, cols)), shape=(n, n)).tocsr()\n    C =\
    \ D.copy()\n    C.data[:] = 1.0  # binary connectivities\n    return C, D\n\n\n\
    # --- Helper functions from Praxis I's cbknn.py (Calibrated Balanced kNN) ---\n\
    \ndef _batch_distance_scales(Z: np.ndarray, batches, metric='cosine', k_calib=16,\
    \ clamp=(0.5, 2.0)):\n    \"\"\"\n    Estimate per-batch distance scales using\
    \ within-batch neighbor distances.\n    Returns dict: batch -> scale_factor, where\
    \ distances from that batch will be multiplied by scale_factor.\n    scale_factor\
    \ is normalized so that the median over batches is ~1.0 and clamped to avoid extremes.\n\
    \    \"\"\"\n    Z = np.asarray(Z, dtype=np.float32)\n    batches = np.asarray(batches)\n\
    \    uniq = np.unique(batches)\n    per_batch_meds = {}\n    all_meds = []\n \
    \   for b in uniq:\n        idx = np.where(batches == b)[0]\n        if idx.size\
    \ < 3:\n            per_batch_meds[b] = 1.0\n            all_meds.append(1.0)\n\
    \            continue\n        k = min(k_calib + 1, idx.size)\n        nn = NearestNeighbors(n_neighbors=k,\
    \ metric=metric, algorithm='auto')\n        nn.fit(Z[idx])\n        dists, inds\
    \ = nn.kneighbors(Z[idx], n_neighbors=k, return_distance=True)\n        # drop\
    \ self (distance ~0 at position 0)\n        d_no_self = []\n        for i in range(idx.size):\n\
    \            di = dists[i]\n            gi = inds[i]\n            mask = gi !=\
    \ i  # drop self\n            di = di[mask]\n            if di.size == 0:\n  \
    \              continue\n            d_no_self.append(np.median(di))\n       \
    \ if len(d_no_self) == 0:\n            med = 1.0\n        else:\n            med\
    \ = float(np.median(np.asarray(d_no_self)))\n        per_batch_meds[b] = med\n\
    \        all_meds.append(med if med > 0 else 1.0)\n    ref = float(np.median(np.asarray(all_meds)))\
    \ if len(all_meds) else 1.0\n    scales = {}\n    lo, hi = clamp\n    for b, med\
    \ in per_batch_meds.items():\n        if med <= 0:\n            s = 1.0\n    \
    \    else:\n            s = ref / med\n        s = float(np.clip(s, lo, hi))\n\
    \        scales[b] = s\n    return scales\n\ndef build_balanced_knn_calibrated(Z:\
    \ np.ndarray, batches, k_total=48, metric='cosine', k_calib=16, clamp=(0.5, 2.0)):\n\
    \    \"\"\"\n    Balanced kNN with equal per-batch quotas and per-batch distance\
    \ calibration.\n    - Equal quotas across batches (remainder spread by batch order)\n\
    \    - Distances from batch b are multiplied by scale[b] (estimated from within-batch\
    \ medians)\n    - Binary connectivities (1.0); distances are calibrated distances;\
    \ symmetric union\n    Returns (C, D) CSR matrices.\n    \"\"\"\n    Z = np.asarray(Z,\
    \ dtype=np.float32)\n    batches = np.asarray(batches)\n    uniq_batches = np.unique(batches)\n\
    \    n = Z.shape[0]\n    nb = len(uniq_batches)\n    if nb == 0 or n == 0:\n \
    \       return None, None\n\n    # Quotas\n    base = k_total // nb\n    rem =\
    \ k_total - base * nb\n    quotas = {b: base + (1 if i < rem else 0) for i, b\
    \ in enumerate(uniq_batches)}\n\n    # Per-batch calibration scales\n    scales\
    \ = _batch_distance_scales(Z, batches, metric=metric, k_calib=k_calib, clamp=clamp)\n\
    \n    pairs_min_dist = {}\n    for b in uniq_batches:\n        idx = np.where(batches\
    \ == b)[0]\n        q = quotas[b]\n        if idx.size == 0 or q == 0:\n     \
    \       continue\n        k = min(q + 1, idx.size)  # +1 for self; will drop it\n\
    \        nn = NearestNeighbors(n_neighbors=k, metric=metric, algorithm='auto')\n\
    \        nn.fit(Z[idx])\n        dists, inds = nn.kneighbors(Z, n_neighbors=k,\
    \ return_distance=True)\n        neigh_global = idx[inds]\n        scale_b = float(scales.get(b,\
    \ 1.0))\n        for i in range(n):\n            g = neigh_global[i]\n       \
    \     di = dists[i] * scale_b  # calibrate distances from batch b\n          \
    \  mask = g != i\n            g = g[mask][:q]\n            di = di[mask][:q]\n\
    \            for j, d in zip(g, di):\n                if i == j:\n           \
    \         continue\n                a, c = (i, j) if i < j else (j, i)\n     \
    \           prev = pairs_min_dist.get((a, c))\n                if (prev is None)\
    \ or (d < prev):\n                    pairs_min_dist[(a, c)] = float(d)\n\n  \
    \  if not pairs_min_dist:\n        return None, None\n\n    rows, cols, dist_data\
    \ = [], [], []\n    for (i, j), d in pairs_min_dist.items():\n        rows.append(i);\
    \ cols.append(j); dist_data.append(d)\n        rows.append(j); cols.append(i);\
    \ dist_data.append(d)\n\n    D = coo_matrix((dist_data, (rows, cols)), shape=(n,\
    \ n)).tocsr()\n    C = D.copy()\n    C.data[:] = 1.0\n    return C, D\n\n# ---\
    \ Helper functions from Praxis I's per_pc_resid.py (Adaptive Residualization)\
    \ ---\n\ndef _ridge_fit_predict(B: np.ndarray, Z: np.ndarray, l2: float = 1e-3):\n\
    \  BtB = B.T @ B\n  W = np.linalg.solve(BtB + l2 * np.eye(BtB.shape[0], dtype=np.float32),\
    \ B.T @ Z)\n  Zhat = B @ W\n  return Zhat, W\n\ndef _columnwise_r2(y: np.ndarray,\
    \ yhat: np.ndarray):\n  y = np.asarray(y, dtype=np.float32)\n  yhat = np.asarray(yhat,\
    \ dtype=np.float32)\n  sse = np.sum((y - yhat) ** 2, axis=0)\n  y_center = y -\
    \ np.mean(y, axis=0, keepdims=True)\n  sst = np.sum(y_center ** 2, axis=0) + 1e-8\n\
    \  r2 = 1.0 - (sse / sst)\n  return np.clip(r2, 0.0, 1.0)\n\ndef adaptive_residualize(Z:\
    \ np.ndarray, batches, l2: float = 1e-3, gamma_max: float = 0.75, lam: float =\
    \ 1.0):\n  \"\"\"\n  Label-free per-PC residualization strength:\n    - Fit ridge:\
    \ batch one-hot -> PCs (Zhat = BW)\n    - r2_j per PC: predictability by batch\n\
    \    - gamma_j = clip(lam * r2_j, 0, gamma_max)\n    - Z_corr = Z - Zhat * gamma_j\
    \ (column-wise scaling)\n  Returns: (Z_corr, r2, gamma_j)\n  \"\"\"\n  B, _ =\
    \ _one_hot_batches(batches) # _one_hot_batches already defined above\n  Zhat,\
    \ _ = _ridge_fit_predict(B, Z, l2=l2)\n  r2 = _columnwise_r2(Z, Zhat)\n  gamma_j\
    \ = np.minimum(gamma_max, lam * r2).astype(np.float32)\n  Zcorr = Z - (Zhat *\
    \ gamma_j[None, :])\n  return Zcorr, r2, gamma_j\n\n# --- My robust ComBat implementation\
    \ (modified to operate on raw counts) ---\ndef get_robust_combat_corrected_matrix_full_genes(adata_in:\
    \ ad.AnnData) -> np.ndarray:\n    adata = adata_in.copy() # Operate on a copy\
    \ to avoid side effects on original adata_in\n    # This function now expects\
    \ raw counts and performs normalization/log1p internally\n    sc.pp.normalize_total(adata,\
    \ target_sum=1e4)\n    sc.pp.log1p(adata)\n\n    data = adata.X.toarray().T if\
    \ sp.issparse(adata.X) else adata.X.copy().T\n    batches = adata.obs['batch'].astype('category').cat.codes.values\n\
    \    u_batches = np.unique(batches)\n    n_batches = len(u_batches)\n    batch_design\
    \ = np.eye(n_batches)[batches]\n    n_genes, n_samples = data.shape\n    B_hat\
    \ = np.linalg.solve(batch_design.T @ batch_design, batch_design.T)\n    grand_mean\
    \ = np.mean(data, axis=1, keepdims=True)\n    batch_means = (B_hat @ data.T).T\n\
    \    var_pooled = np.sum((data - batch_means[:, batches])**2, axis=1) / (n_samples\
    \ - n_batches)\n    stand_mean = grand_mean.dot(np.ones((1, n_samples)))\n   \
    \ s_data = (data - batch_means[:, batches]) / np.sqrt(var_pooled[:, np.newaxis]\
    \ + 1e-8)\n    gamma_hat = (B_hat @ s_data.T).T\n    delta_hat = [np.var(s_data[:,\
    \ batches == i], axis=1, ddof=1) for i in u_batches]\n    gamma_bar, t2 = np.mean(gamma_hat,\
    \ axis=1), np.var(gamma_hat, axis=1, ddof=1)\n    def _aprior(d): m, s2 = np.mean(d),\
    \ np.var(d); return (2 * s2 + m**2) / (s2 if s2 > 0 else 1e-8)\n    def _bprior(d):\
    \ m, s2 = np.mean(d), np.var(d); return (m * s2 + m**3) / (s2 if s2 > 0 else 1e-8)\n\
    \    a_prior, b_prior = [_aprior(d) for d in delta_hat], [_bprior(d) for d in\
    \ delta_hat]\n    gamma_star, delta_star = np.zeros_like(gamma_hat), np.zeros_like(gamma_hat)\n\
    \    for i, batch_idx in enumerate(u_batches):\n        n = (~np.isnan(s_data[:,\
    \ batches == batch_idx])).sum(axis=1); g_old, d_old = gamma_hat[:, i], delta_hat[i];\
    \ change, count = 1, 0\n        while change > 1e-4 and count < 100:\n       \
    \     g_new = (t2 * n * g_old + d_old * gamma_bar) / (t2 * n + d_old + 1e-8);\
    \ sum2 = np.sum((s_data[:, batches == batch_idx] - g_new[:, np.newaxis])**2, axis=1)\n\
    \            d_new = (0.5 * sum2 + b_prior[i]) / (n / 2.0 + a_prior[i] - 1.0);\
    \ change = max(np.abs(g_new - g_old).max(), np.abs(d_new - d_old).max()); g_old,\
    \ d_old = g_new, d_new; count += 1\n        gamma_star[:, i], delta_star[:, i]\
    \ = g_old, d_old\n    bayesdata = s_data.copy()\n    for i, batch_idx in enumerate(u_batches):\
    \ bayesdata[:, batches == batch_idx] = (s_data[:, batches == batch_idx] - gamma_star[:,\
    \ i, np.newaxis]) / np.sqrt(delta_star[:, i, np.newaxis] + 1e-8)\n    X_corrected\
    \ = bayesdata * np.sqrt(var_pooled[:, np.newaxis]) + stand_mean\n    return np.nan_to_num(X_corrected.T)\n\
    \n\n# --- eliminate_batch_effect_fn based on Praxis I's brbg_dual_comb_resid_graph.py\
    \ ---\n\ndef _ensure_dense_X(adata):\n    if sp.issparse(adata.X):\n        adata.X\
    \ = adata.X.A\n\ndef eliminate_batch_effect_fn(adata: ad.AnnData) -> ad.AnnData:\n\
    \    print(\"Sophia I: Praxis I SOTA Optimization - Adaptive Residualization (γ_max=0.74,\
    \ λ=0.9) + Robust ComBat (n_pcs_graph=56) - SOTA Attempt...\")\n    \n    # Base\
    \ config (best-known dual from Praxis I's ID 161 / Aether I's ID 180)\n    n_pcs_emb\
    \ = 64\n    n_pcs_graph = 56 # MODIFICATION: Changed from 50 to 56 to try and\
    \ push SOTA\n    \n    # Adaptive Residualization parameters from Praxis I's ID\
    \ 185 (SOTA: 0.7209)\n    gamma_max_adapt = 0.74 \n    lam_adapt = 0.9       \n\
    \    l2 = 1e-3             # From Aether I's ID 180 (and Praxis I)\n    k_total\
    \ = 48          # From Praxis I's ID 161\n    metric = 'cosine'\n    random_state\
    \ = 0 # Explicitly added for reproducibility\n\n    # CBKNN ablation params from\
    \ Praxis I's ID 161\n    k_calib = 24\n    clamp = (0.8, 1.25)\n\n    assert 'batch'\
    \ in adata.obs.columns, \"adata.obs['batch'] required.\"\n    assert 'feature_name'\
    \ in adata.var.columns, \"adata.var['feature_name'] required.\"\n\n    # Create\
    \ fresh copies of original adata (raw counts) for independent processing paths\n\
    \    adata_for_graph_path = adata.copy()\n    adata_for_embedding_path = adata.copy()\
    \ \n\n    # Normalize/log1p for Graph Path\n    _normalize_log1p_inplace(adata_for_graph_path,\
    \ target_sum=1e4)\n    \n    hvg_mask = _get_hvg_mask(adata_for_graph_path) #\
    \ Get HVGs once on one copy (uses already normalized/log1p'd data)\n    if hvg_mask.sum()\
    \ < 10:\n        hvg_mask = np.ones(adata_for_graph_path.n_vars, dtype=bool)\n\
    \n    # --- Graph Path: adaptively residualized PCs on HVGs ---\n    X_graph =\
    \ adata_for_graph_path.X[:, hvg_mask]\n    if not sp.issparse(X_graph):\n    \
    \    X_graph = sp.csr_matrix(X_graph)\n    Z_graph = _pca_truncated_svd(X_graph,\
    \ n_comps=n_pcs_graph, random_state=random_state)\n    \n    batches = np.asarray(adata_for_graph_path.obs['batch'].astype('category').values)\n\
    \    \n    # Use adaptive_residualize\n    Z_corr_graph, r2_per_pc, gamma_j_applied\
    \ = adaptive_residualize(\n        Z_graph, batches, l2=l2, gamma_max=gamma_max_adapt,\
    \ lam=lam_adapt\n    )\n    \n    # Use Calibrated Balanced kNN for graph construction\n\
    \    C, D = build_balanced_knn_calibrated(\n        Z_corr_graph, batches, k_total=k_total,\
    \ metric=metric, k_calib=k_calib, clamp=clamp\n    )\n    print(f\"✓ Graph path\
    \ complete. Calibrated Balanced kNN graph shape: {C.shape}\")\n\n    # --- Embedding\
    \ Path: My Robust ComBat (Full Genes, handles normalization internally) → PCA(HVGs)\
    \ ---\n    # get_robust_combat_corrected_matrix_full_genes expects raw counts\
    \ and performs normalization/log1p internally\n    X_combat_corrected_full_genes\
    \ = get_robust_combat_corrected_matrix_full_genes(adata_for_embedding_path)\n\n\
    \    # Create an AnnData object for PCA on the Combat corrected full gene data\n\
    \    adata_for_embedding_path_processed_for_pca = ad.AnnData(\n        X=X_combat_corrected_full_genes,\
    \ \n        obs=adata_for_embedding_path.obs.copy()\n    )\n    adata_for_embedding_path_processed_for_pca.var_names\
    \ = adata_for_embedding_path.var_names.copy()\n    adata_for_embedding_path_processed_for_pca.var['highly_variable']\
    \ = hvg_mask # Set the highly_variable flag for PCA on relevant genes\n\n    sc.pp.pca(adata_for_embedding_path_processed_for_pca,\
    \ n_comps=n_pcs_emb, use_highly_variable=True, svd_solver='arpack', random_state=random_state)\n\
    \    Z_emb = adata_for_embedding_path_processed_for_pca.obsm['X_pca']\n    print(f\"\
    ✓ Embedding path complete. ComBat PCA embedding shape: {Z_emb.shape}\")\n\n  \
    \  # --- Final Output Construction ---\n    adata_out = ad.AnnData(\n        obs=adata.obs[[]],\
    \ \n        var=adata.var[[]],\n        obsm={'X_emb': Z_emb}, # Set the embedding\n\
    \        uns={\n            'method_id': 'sophia_praxis_sota_robust_combat_adaptive_cbknn_opt_npcsgraph56',\
    \ # Updated ID for clarity\n            'brbg_dual': {\n                'gamma_max_adaptive':\
    \ float(gamma_max_adapt), # For adaptive residualization\n                'lam_adaptive':\
    \ float(lam_adapt),             # For adaptive residualization\n             \
    \   'r2_per_pc': r2_per_pc.tolist(),              # For adaptive residualization\n\
    \                'gamma_j_applied': gamma_j_applied.tolist(),  # For adaptive\
    \ residualization\n                'l2': float(l2),\n                'k_total':\
    \ int(k_total),\n                'metric': metric,\n                'pcs_graph':\
    \ int(n_pcs_graph),\n                'pcs_emb': int(n_pcs_emb),\n            \
    \    'k_calib': int(k_calib),\n                'clamp': list(clamp), \n      \
    \          'embedding': 'Robust ComBat PCA on HVGs (Full Genes, Internal Norm)',\n\
    \                'graph_source': 'Adaptively Residualized PCA on HVGs',\n    \
    \            'graph_type': 'Calibrated Balanced kNN'\n            }\n        }\n\
    \    )\n\n    # Store the balanced kNN graph in the output adata\n    if C is\
    \ not None and D is not None:\n        adata_out.obsp['connectivities'] = C.tocsr()\n\
    \        adata_out.obsp['distances'] = D.tocsr()\n        adata_out.uns['neighbors']\
    \ = {'connectivities_key': 'connectivities', 'distances_key': 'distances'}\n \
