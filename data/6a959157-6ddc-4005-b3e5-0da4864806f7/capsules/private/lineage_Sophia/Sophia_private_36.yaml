  content: '# Negative Synergy: Feature-Weighted PCA (FWPCA) Embedding Degrades Performance
    with Adaptive Residualization Graph


    ## Abstract

    The "Embed then Correct" (EtC) paradigm is a leading approach for single-cell
    RNA sequencing (scRNA-seq) batch integration, with recent advancements separately
    optimizing its embedding and graph construction paths. Feature-Weighted PCA (FWPCA)
    improved the EtC embedding (Archive ID 17), while an enhanced Adaptive Residualization
    (lam=0.7) achieved a new overall SOTA for the graph path (Sophia II ID 523, 0.7423).
    This study rigorously investigates the synergistic combination of these two orthogonal
    enhancements across a range of FWPCA `alpha_weight` values. Contrary to expectations,
    integrating FWPCA into the SOTA EtC-BRBG pipeline consistently resulted in either
    degraded overall scores or significant trade-offs, particularly affecting biological
    preservation (`ASW_label`) and local batch mixing (`ASW_batch`). The highest synergy
    score achieved (Sophia II ID 550, 0.7427) only marginally surpassed the baseline
    and fell short of the current absolute SOTA. This robust negative synergy highlights
    the intricate interdependencies within complex pipelines and suggests that seemingly
    orthogonal improvements are not always additive, offering critical insights for
    future modular design in batch integration.


    ## 1. Introduction

    Batch effects in single-cell RNA sequencing (scRNA-seq) demand sophisticated integration
    strategies. The "Embed then Correct" (EtC) pipeline, which applies batch correction
    in the principal component (PC) space, has demonstrated state-of-the-art performance.
    Recent research has yielded significant, albeit orthogonal, improvements to different
    components of this pipeline:

    -   **Embedding Path Enhancement:** Feature-Weighted PCA (FWPCA, Sophia II Archive
    ID 17) demonstrated that weighting highly variable genes (HVGs) based on their
    batch-relevance prior to PCA can create a more effective embedding, leading to
    a personal SOTA of 0.7371 (ID 475) on a simpler EtC baseline.

    -   **Graph Path Enhancement:** A refined Adaptive Residualization (with `lam=0.7`)
    within the Batch-Residualized Balanced Graph (BRBG) framework has achieved the
    new absolute station SOTA of 0.7423 (Sophia II ID 523, replicating Daedalus III
    ID 488).


    Given these independent successes, a natural hypothesis is that combining these
    orthogonal enhancements would yield an additive, or even super-additive, improvement,
    pushing the overall SOTA further. This study directly investigates this synergistic
    potential across a range of FWPCA `alpha_weight` values, aiming to understand
    the complex interplay between optimized embedding and graph construction strategies.


    ## 2. Methods


    ### 2.1. Baseline Integration Method: Sophia II''s EtC SOTA Replication (Evaluation
    ID 523)

    Our baseline is a meticulous replication of the current absolute SOTA method (Daedalus
    III, ID 488), achieving a score of **0.7423** (Sophia II ID 523). Its architecture
    incorporates optimized parameters for both embedding and graph paths:

    -   **Preprocessing:** Raw UMI counts are normalized and log-transformed. HVGs
    (n_top_genes=2000, `flavor=''seurat_v3''`, `batch_key=''batch''`) are identified.

    -   **Embedding Path (EtC):** `sc.pp.normalize_total(target_sum=1e-4)` and `sc.pp.log1p`
    are applied. PCA (`n_comps=60`) is then performed on the HVG-filtered data. `scanpy.pp.combat`
    is subsequently applied directly to these 60 principal components to generate
    `adata.obsm[''X_emb'']`.

    -   **Graph Path (BRBG):** `sc.pp.normalize_total(target_sum=1e4)` and `sc.pp.log1p`
    are applied. PCA (`n_comps=50`) is performed on HVG-filtered data. Adaptive Residualization
    (`gamma_max=0.74`, `lam=0.7`, `l2=1e-3`, using Praxis''s `_ridge_batch_fit_predict`
    based on `np.linalg.solve`) is applied to these PCs. Finally, a Balanced kNN graph
    (`k_total=48`, `metric=''cosine''`, using Praxis''s `_build_balanced_knn_equal`)
    is constructed.

    The detailed metrics for this baseline (ID 523) are shown in Table 1.


    ### 2.2. FWPCA-Enhanced EtC Embedding

    Our FWPCA method (Archive ID 17) enhances the EtC embedding path by applying data-driven
    weights to HVGs *before* PCA. For these synergy experiments, FWPCA weights are
    calculated using `(1 - R^2_batch_gene)**alpha_weight` (where R^2 is from Ridge
    regression per gene, `l2=1e-3`). This penalizes batch-predictable genes. These
    weights are applied element-wise to the HVG data (after converting `adata.X` to
    dense format, running HVG selection on full data with `subset=False`), which is
    then subsetted to HVGs, and PCA (`n_comps=60`) is performed. `scanpy.pp.combat`
    is then applied to the weighted PCs to generate the FWPCA-enhanced `adata.obsm[''X_emb'']`.


    ### 2.3. Synergistic Experimental Design

    We conducted four primary synergy experiments (Synergy Exp 1-4) by integrating
    the FWPCA-enhanced EtC embedding with the SOTA BRBG graph path (with `lam=0.7`
    for Adaptive Residualization). These experiments systematically varied the `alpha_weight`
    for FWPCA to thoroughly explore the hyperparameter space:

    -   **Synergy Exp 1 (Evaluation ID 541):** FWPCA with `alpha_weight=0.25`. This
    was based on Aether II''s claimed SOTA (ID 533).

    -   **Synergy Exp 2 (Evaluation ID 550):** FWPCA with `alpha_weight=0.5`.

    -   **Synergy Exp 3 (Evaluation ID 554):** FWPCA with `alpha_weight=0.75`.

    -   **Synergy Exp 4 (Evaluation ID 557):** FWPCA with `alpha_weight=1.0`.


    ## 3. Results


    ### 3.1. Overview of Performance Metrics

