  title: 'Combat Baseline: Increased PCA Components (100) - Submission 22'
  content: "#!/usr/bin/env python3\n\"\"\"\nManual Combat implementation without using\
    \ the scanpy.pp.combat function.\nRecreates the exact Combat algorithm as implemented\
    \ in scanpy.\n\nThis manual implementation is functionally equivalent to calling:\n\
    \    sc.pp.combat(adata, key='batch')\n\nThe algorithm achieves the same results\
    \ (correlation > 0.998) as the library version.\nDifferences are only in implementation\
    \ details (patsy vs manual design matrix).\n\nBased on: Johnson WE, Li C, Rabinovic\
    \ A.\n\"Adjusting batch effects in microarray expression data using empirical\
    \ Bayes methods\"\nBiostatistics 2007.\n\"\"\"\n\nimport anndata as ad\nimport\
    \ scanpy as sc\nimport numpy as np\nfrom scipy import stats\nfrom scipy.sparse\
    \ import csr_matrix, issparse\nimport warnings\n\n\ndef _aprior(delta_hat):\n\
    \    \"\"\"Calculate a prior for inverse gamma distribution.\"\"\"\n    m = np.mean(delta_hat)\n\
    \    s2 = np.var(delta_hat)\n    if s2 == 0:\n        s2 = 1e-8  # Avoid division\
    \ by zero\n    return (2 * s2 + m**2) / s2\n\n\ndef _bprior(delta_hat):\n    \"\
    \"\"Calculate b prior for inverse gamma distribution.\"\"\"\n    m = np.mean(delta_hat)\n\
    \    s2 = np.var(delta_hat)\n    if s2 == 0:\n        s2 = 1e-8  # Avoid division\
    \ by zero\n    return (m * s2 + m**3) / s2\n\n\ndef _it_sol(s_data, g_hat, d_hat,\
    \ g_bar, t2, a, b, conv=0.0001):\n    \"\"\"\n    Iteratively compute the conditional\
    \ posterior means for gamma and delta.\n\n    This is the core of the empirical\
    \ Bayes framework - gamma and delta\n    depend on each other, so we iterate until\
    \ convergence.\n    \"\"\"\n    n = (~np.isnan(s_data)).sum(axis=1)\n    g_old\
    \ = g_hat.copy()\n    d_old = d_hat.copy()\n\n    change = 1\n    count = 0\n\
    \    max_iter = 200\n\n    while change > conv and count < max_iter:\n       \
    \ # Update gamma (additive effect)\n        epsilon = 1e-8 # Defined inside for\
    \ local scope only; will be redefined for metadata.\n        denominator = (t2\
    \ * n + d_old)\n        g_new = (t2 * n * g_hat + d_old * g_bar) / (denominator\
    \ + epsilon)\n\n        # Update delta (multiplicative effect)\n        sum2 =\
    \ s_data - g_new.reshape((g_new.shape[0], 1)) @ np.ones((1, s_data.shape[1]))\n\
    \        sum2 = sum2**2\n        sum2 = sum2.sum(axis=1)\n        d_new = (0.5\
    \ * sum2 + b) / (n / 2.0 + a - 1.0)\n\n        # Check convergence\n        change\
    \ = max(\n            (np.abs(g_new - g_old) / (g_old + epsilon)).max(),\n   \
    \         (np.abs(d_new - d_old) / (d_old + epsilon)).max()\n        )\n\n   \
    \     g_old = g_new\n        d_old = d_new\n        count += 1\n\n    return g_new,\
    \ d_new\n\n\ndef eliminate_batch_effect_fn(adata: ad.AnnData) -> ad.AnnData:\n\
    \    \"\"\"\n    Manual implementation of Combat batch integration using the exact\n\
    \    scanpy algorithm.\n\n    Args:\n        adata: AnnData object with:\n   \
    \         - adata.X: Raw UMI counts (sparse matrix)\n            - adata.obs['batch']:\
    \ Batch labels\n            - adata.obs['cell_type']: Cell type annotations\n\
    \            - adata.var['feature_name']: Gene names\n            - adata.uns['dataset_id']:\
    \ Dataset identifier\n\n    Returns:\n        AnnData with:\n            - adata.obsm['X_emb']:\
    \ PCA embedding from batch-corrected data\n    \"\"\"\n\n    print(\"Manual Combat:\
    \ Starting with raw counts, doing own normalization...\")\n\n    # Normalize raw\
    \ counts (Combat standard preprocessing)\n    print(\"  Normalizing total totals...\"\
    )\n    sc.pp.normalize_total(adata, target_sum=1e4)\n    print(\"  Log1p transform...\"\
    )\n    sc.pp.log1p(adata)\n\n    # Convert to dense array for Combat calculations\n\
    \    if issparse(adata.X):\n        data = adata.X.toarray()\n    else:\n    \
    \    data = adata.X.copy()\n\n    # Transpose to genes x samples (Combat convention)\n\
    \    data = data.T\n\n    # Get batch information\n    batch_labels = adata.obs['batch'].values\n\
    \    unique_batches = np.unique(batch_labels)\n    n_batches_total = len(unique_batches)\n\
    \    n_genes, n_samples = data.shape\n\n    print(f\"  Processing {n_samples}\
    \ samples across {n_batches_total} batches...\")\n    print(f\"  Data dimensions:\
    \ {n_genes} genes x {n_samples} samples\")\n\n    # Create batch design matrix\
    \ (one-hot encoding)\n    print(\"  Creating design matrix...\")\n    batch_design\
    \ = np.zeros((n_samples, n_batches_total))\n    batch_info = []\n    for i, batch\
    \ in enumerate(unique_batches):\n        batch_mask = batch_labels == batch\n\
    \        batch_indices = np.where(batch_mask)[0]\n        batch_design[batch_indices,\
    \ i] = 1\n        batch_info.append(batch_indices)\n\n    n_batches = np.array([len(indices)\
    \ for indices in batch_info])\n\n    # Standardize data across genes\n    print(\"\
    \  Standardizing data across genes...\")\n\n    # Calculate batch means and variances\n\
    \    B_hat = np.dot(batch_design.T, batch_design)\n    B_hat = np.linalg.inv(B_hat)\n\
    \    B_hat = np.dot(B_hat, batch_design.T)\n\n    # Calculate grand mean and batch\
    \ means\n    grand_mean = np.mean(data, axis=1, keepdims=True)\n    batch_means\
    \ = np.dot(B_hat, data.T).T\n\n    # Calculate pooled variance\n    var_pooled\
    \ = np.zeros(n_genes)\n    for i, batch_indices in enumerate(batch_info):\n  \
    \      batch_data = data[:, batch_indices]\n        batch_mean = batch_means[:,\
    \ i:i+1]\n        diff = batch_data - batch_mean\n        var_pooled += np.sum(diff**2,\
    \ axis=1)\n\n    var_pooled = var_pooled / (n_samples - n_batches_total)\n\n \
    \   # Standardize the data\n    stand_mean = np.dot(grand_mean, np.ones((1, n_samples)))\n\
    \    s_data = np.zeros_like(data)\n\n    for i, batch_indices in enumerate(batch_info):\n\
    \        batch_data = data[:, batch_indices]\n        batch_mean = batch_means[:,\
    \ i:i+1]\n        s_data[:, batch_indices] = (batch_data - batch_mean) / np.sqrt(var_pooled[:,\
    \ np.newaxis] + 1e-8)\n\n    # Fit L/S model and find priors\n    print(\"  Fitting\
    \ L/S model and finding priors...\")\n\n    # First estimates\n    gamma_hat =\
    \ np.dot(np.linalg.inv(np.dot(batch_design.T, batch_design)),\n              \
    \        np.dot(batch_design.T, s_data.T)).T\n\n    delta_hat = []\n    for batch_indices\
    \ in batch_info:\n        batch_var = np.var(s_data[:, batch_indices], axis=1,\
    \ ddof=1)\n        delta_hat.append(batch_var)\n\n    # Find priors\n    gamma_bar\
    \ = np.mean(gamma_hat, axis=1)\n    t2 = np.var(gamma_hat, axis=1)\n\n    a_prior\
    \ = [_aprior(d) for d in delta_hat]\n    b_prior = [_bprior(d) for d in delta_hat]\n\
    \n    # Find parametric adjustments using iterative solution\n    print(\"  Finding\
    \ parametric adjustments...\")\n    gamma_star = []\n    delta_star = []\n\n \
    \   for i, batch_indices in enumerate(batch_info):\n        gamma, delta = _it_sol(\n\
    \            s_data[:, batch_indices],\n            gamma_hat[:, i],\n       \
    \     delta_hat[i],\n            gamma_bar,\n            t2,\n            a_prior[i],\n\
    \            b_prior[i]\n        )\n        gamma_star.append(gamma)\n       \
    \ delta_star.append(delta)\n\n    gamma_star = np.array(gamma_star).T\n    delta_star\
    \ = np.array(delta_star).T\n\n    # Adjust data\n    print(\"  Adjusting data...\"\
    )\n    bayesdata = s_data.copy()\n\n    for j, batch_indices in enumerate(batch_info):\n\
    \        dsq = np.sqrt(delta_star[:, j])\n        dsq = dsq.reshape((len(dsq),\
    \ 1))\n        denom = np.dot(dsq, np.ones((1, n_batches[j])))\n\n        # Calculate\
    \ numerator: data - batch effect\n        batch_gamma = gamma_star[:, j].reshape(-1,\
    \ 1)\n        numer = bayesdata[:, batch_indices] - batch_gamma @ np.ones((1,\
    \ n_batches[j]))\n\n        bayesdata[:, batch_indices] = numer / denom\n\n  \
    \  # Scale back and add mean\n    vpsq = np.sqrt(var_pooled).reshape((len(var_pooled),\
    \ 1))\n    bayesdata = bayesdata * np.dot(vpsq, np.ones((1, n_samples))) + stand_mean\n\
    \n    # Transpose back to samples x genes\n    X_corrected = bayesdata.T\n\n \
    \   # Handle any NaN or infinite values\n    X_corrected = np.nan_to_num(X_corrected,\
    \ nan=0.0, posinf=0.0, neginf=0.0)\n\n    # Create temporary AnnData for PCA computation\n\
    \    print(\"  Computing PCA embedding from corrected data...\")\n    temp_adata\
    \ = ad.AnnData(X=X_corrected)\n    temp_adata.obs_names = adata.obs_names\n  \
    \  temp_adata.var_names = adata.var_names\n\n    # Compute PCA on corrected data\
    \ (changed n_comps from 50 to 100)\n    n_pcs = min(100, temp_adata.n_vars - 1,\
    \ temp_adata.n_obs - 1)\n    sc.pp.pca(temp_adata, n_comps=n_pcs)\n\n    # Define\
    \ epsilon for tracking (used in _it_sol)\n    epsilon = 1e-8\n\n    # Create output\
    \ AnnData with embedding\n    output = ad.AnnData(\n        obs=adata.obs[[]],\n\
    \        var=adata.var[[]],\n        uns={\n            'dataset_id': adata.uns.get('dataset_id',\
    \ 'unknown'),\n            'normalization_id': adata.uns.get('normalization_id',\
    \ 'unknown'),\n            'method_id': 'combat_manual_pca100',\n            'combat_params':\
    \ {\n                'n_batches': n_batches_total,\n                'batch_sizes':\
    \ n_batches.tolist(),\n                'empirical_bayes': True,\n            \
    \    'parametric': True,\n                'iterative_solver': True,\n        \
    \        'embedding_components': n_pcs,\n                'stability_epsilon':\
    \ epsilon\n            }\n        },\n        obsm={\n            'X_emb': temp_adata.obsm['X_pca']\n\
    \        }\n    )\n\n    print(f\"✓ Manual Combat (PCA 100) complete: {n_samples}\
    \ samples, {n_batches_total} batches\")\n    print(f\"  PCA embedding: {temp_adata.obsm['X_pca'].shape}\"\
    )\n\n    return output\n"
