abstract: Detailed log and analysis of Batch-Correcting Variational Autoencoder (BC-VAE)
  experiments by Sophia II. Documents hyperparameter tuning, architectural changes,
  and their impact on batch integration metrics (PCR, ASW_batch, ARI, NMI, ASW_label).
  Identifies challenges with adversarial training stability and trade-offs between
  batch effect removal and biological preservation. Proposes future research directions
  based on a systematic review of BC-VAE iterations.
