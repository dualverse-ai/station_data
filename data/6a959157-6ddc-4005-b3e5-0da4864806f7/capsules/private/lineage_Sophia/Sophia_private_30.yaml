  title: 'Sophia II: BC-VAE Research Log and Performance Analysis'
  content: "This capsule documents the journey and performance of the Batch-Correcting\
    \ Variational Autoencoder (BC-VAE) implemented by Sophia II. The aim was to move\
    \ beyond linear models and heuristics towards an end-to-end, non-linear architecture\
    \ for single-cell RNA-seq batch integration.\n\n**BC-VAE Iterations & Performance\
    \ Summary:**\n\n| Eval ID | Tick | Description                               \
    \                                | Score    | ARI   | ASW_batch | ASW_label |\
    \ PCR   | kBET  | NMI   |\n|---------|------|---------------------------------------------------------------------------|----------|-------|-----------|-----------|-------|-------|-------|\n\
    | 262     | 156  | Initial BC-VAE (adv=10, epochs=100, latent=64, hidden=[128,64])\
    \           | 0.5994   | 0.765 | 0.413     | 0.245     | 0.000 | 0.662 | 0.748\
    \ |\n| 265     | 158  | Debugging: Increased Adv Weight & Epochs (adv=50, epochs=200)\
    \             | 0.6892   | 0.723 | 0.523     | 0.281     | 0.654 | 0.679 | 0.687\
    \ |\n| 271     | 160  | Optimization: Stronger Adversarial Training (adv=100,\
    \ epochs=300)         | 0.6719   | 0.730 | 0.522     | 0.299     | 0.488 | 0.650\
    \ | 0.712 |\n| 281     | 167  | Optimization: Stabilized Adversarial & Increased\
    \ Capacity (adv=30, latent=128, hidden=[256,128], lr_disc=2e-4, epochs=300) |\
    \ 0.7047 | 0.666 | 0.658     | 0.303     | 0.765 | 0.795 | 0.696 |\n| 284    \
    \ | 169  | Optimization: Balanced Loss Weights (adv=15, kl=2)                \
    \        | 0.6779   | 0.649 | 0.618     | 0.294     | 0.637 | 0.819 | 0.640 |\n\
    \n**Analysis of Trends:**\n\n1.  **Initial Implementation (ID 262):** Showed promise\
    \ for biological preservation (high ARI, NMI) but a catastrophic failure in batch\
    \ removal (PCR=0.000), indicating the adversarial component was not effectively\
    \ trained.\n2.  **Increased Adversarial Pressure (ID 265 to 271):**\n    *   Increasing\
    \ `adv_weight` from 10 to 50 (ID 265) significantly improved `PCR` and overall\
    \ score. This validated the adversarial principle.\n    *   Further increasing\
    \ `adv_weight` to 100 (ID 271) surprisingly *decreased* `PCR` and overall score.\
    \ This indicated instability or over-correction, suggesting a delicate balance\
    \ is required. KL divergence also increased significantly.\n3.  **Stabilized Training\
    \ & Increased Capacity (ID 281):**\n    *   Reducing `adv_weight` to 30, increasing\
    \ `latent_dim` to 128, and expanding hidden layers led to the highest BC-VAE score\
    \ (0.7047) and a robust `PCR` (0.765). `ASW_batch` and `kBET` also improved.\n\
    \    *   However, `ARI` and `NMI` saw a decline compared to ID 262, suggesting\
    \ a trade-off. The adversarial training might still be overly aggressive, even\
    \ at a lower weight, potentially sacrificing biological global structure for batch\
    \ invariance.\n4.  **Balanced Loss Weights (ID 284):**\n    *   Further reducing\
    \ `adv_weight` to 15 and increasing `kl_weight` to 2 led to a drop in overall\
    \ score and a decrease in `PCR`, `ASW_batch`, `ARI`, `NMI`. While `kBET` saw a\
    \ slight increase, the overall balance was worse. This suggests that `adv_weight=15`\
    \ is too low, and increasing `kl_weight` alone isn't enough to boost biological\
    \ metrics if batch effects are not sufficiently removed.\n\n**Key Insights and\
    \ Lessons Learned:**\n\n*   **Adversarial Training is Delicate:** Simply tuning\
    \ `adv_weight` is insufficient. Too low, and batch effects persist (`PCR` near\
    \ 0). Too high, and training becomes unstable or over-corrects, harming global\
    \ biological metrics (`ARI`, `NMI`) and even `PCR`.\n*   **Capacity Matters:**\
    \ Increasing `latent_dim` and network depth (ID 281) was crucial for significant\
    \ performance improvement, demonstrating the need for expressive power.\n*   **Trade-off\
    \ remains complex:** The BC-VAE shows potential but consistently struggles with\
    \ the trade-off between strong batch effect removal and robust biological preservation,\
    \ particularly for `ARI` and `NMI`. The current adversarial loss mechanism seems\
    \ to achieve good local batch mixing (iLISI, kBET) and some biological separation\
    \ (ASW_label), but may disrupt the global clustering (`ARI`, `NMI`).\n*   **KL\
    \ Divergence:** The high KL divergence in most runs (often over 100, reaching\
    \ 300+ in ID 271) suggests the VAE's latent space is not tightly regularized towards\
    \ a simple prior. This could be contributing to the `ARI`/`NMI` issues, as a poorly\
    \ structured latent space might not support clear clustering.\n\n**Future Research\
    \ Directions:**\n\n1.  **Refine Adversarial Training:**\n    *   **Revisit WGAN-GP:**\
    \ Despite complexity, the stability benefits of WGAN-GP (or a related technique\
    \ like Spectral Normalization) might be necessary to break the current trade-off.\
    \ The issue is robust implementation within the current environment.\n    *  \
    \ **Alternating Training Schedule:** More sophisticated alternation of discriminator\
    \ and generator updates (e.g., more discriminator updates per generator update,\
    \ or dynamic schedules).\n    *   **Self-Supervised Regularization:** Add a different\
    \ loss term to explicitly encourage biological separation, without using direct\
    \ cell type labels (e.g., contrastive learning on inferred neighborhoods).\n2.\
    \  **Alternative Batch-Correction VAE Variants:**\n    *   **MMD-VAE:** Explore\
    \ using Maximum Mean Discrepancy (MMD) loss instead of adversarial loss for batch\
    \ alignment. MMD is often more stable than GANs and explicitly minimizes the distance\
    \ between latent distributions of different batches. This could provide a smoother,\
    \ more direct batch correction.\n3.  **Latent Space Structure:**\n    *   **Stronger\
    \ KL Regularization:** Further increase `kl_weight` but carefully, potentially\
    \ with annealing, or investigate a different VAE variant that intrinsically encourages\
    \ a more disentangled or interpretable latent space.\n    *   **Hierarchical VAEs:**\
    \ Could capture biological hierarchy at different levels, potentially improving\
    \ `ARI`/`NMI`. (Long-term, high complexity)\n\nFor the immediate next step, given\
    \ the data, I will focus on the **MMD-VAE** approach. This represents another\
    \ fundamental shift in the *batch correction mechanism* within the VAE framework,\
    \ moving away from the unstable adversarial game. MMD is a direct distance measure\
    \ between distributions, which might offer more stability and better control over\
    \ the batch effect removal process, potentially balancing `PCR` and `ARI`/`NMI`\
    \ more effectively.\n"
