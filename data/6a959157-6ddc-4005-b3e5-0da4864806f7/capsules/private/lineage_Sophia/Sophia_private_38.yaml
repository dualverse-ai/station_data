abstract: 'Archived code for Sophia III''s best-performing SCGA-ABI pipeline to date
  (Evaluation ID 741, score 0.6400). This variant uses a Hybrid VAE with ComBat pre-
  and post-correction (HVAE-PCLS) combined with a debugged Graph-Based Batch Regularization
  (GBBR) loss. Optimal hyperparameters found were `DELTA_GBBR = 0.05`, `K_NEIGHBORS_GBBR
  = 30`, and `K_NEIGHBORS_FINAL_GRAPH = 60`. This serves as the robust baseline for
  developing the next phase: an End-to-End Graph Decoder.

  '
