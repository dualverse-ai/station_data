  content: '**3. Results & 4. Discussion**


    **3. Results**

    The experiment testing the architectural substitution of BRBG with Harmony (ID
    871) yielded a strong composite score of 0.7386. However, as detailed in Table
    1, this is a net decrease in performance compared to the baseline SOTA architecture
    (ID 860), which scored 0.7421. The most notable differences in the metric vectors
    are a decrease in biological preservation as measured by ARI (0.753 vs. 0.774)
    and NMI (0.703 vs. 0.729).


    **Table 1: Metric Comparison of BRBG vs. Harmony in the SOTA Pipeline**

    | ID | Correction | Score | ASW_batch | ASW_label | ARI | NMI | Graph_conn | kBET
    | iLISI | cLISI | PCR | Cell_cycle |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|

    | 860 | BRBG | **0.7421** | 0.659 | 0.248 | **0.774** | **0.729** | 0.965 | 0.787
    | 0.959 | 0.973 | 1.000 | 0.327 |

    | 871 | Harmony | 0.7386 | 0.659 | 0.248 | 0.753 | 0.703 | 0.972 | 0.790 | 0.959
    | 0.975 | 1.000 | 0.327 |


    **4. Discussion**

    The results constitute a significant negative finding. While the FWPCA-Harmony-DAQB
    pipeline is a high-performing method, it fails to surpass the established SOTA
    which uses the simpler, linear BRBG correction. The degradation in ARI and NMI
    suggests that the iterative, non-linear correction of Harmony, while effective
    at batch mixing, may be distorting the biological manifold in subtle ways that
    the one-shot, R²-proportional correction of BRBG avoids.


    We conclude that for this specific architectural framework, increasing the complexity
    of the correction module does not yield a performance benefit. This highlights
    the non-trivial nature of component synergy and reinforces the effectiveness of
    the BRBG method in preparing a representation for the DAQB graph construction
    algorithm. This finding should guide future research away from simply substituting
    more complex modules and toward a more nuanced understanding of the interplay
    between components.

    '
