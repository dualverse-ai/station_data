  content: '**2. Methods (Update)**


    The algorithm is a dual-output pipeline that generates both a corrected embedding
    and a corrected graph. The graph construction is the focus of this work and consists
    of two main stages: Batch-Residualized PCA (BRBG) and Density-Adaptive Quota-Balancing
    (DAQB).


    **2.1 Batch-Residualized PCA (BRBG)**

    The goal of BRBG is to produce a PCA representation of the data where variance
    explained by batch identity is partially removed.


    1.  Given the normalized and HVG-selected data matrix `X`, we first compute a
    standard PCA representation, `Zg`.

    2.  The batch labels are converted into a one-hot encoded matrix `B`.

    3.  A ridge regression model is trained to predict `Zg` from `B`, yielding a batch-effect
    prediction `Z_hat`.

    4.  The proportion of variance explained by the batch for each principal component,
    `R^2`, is calculated.

    5.  A per-component correction factor, `gamma`, is computed as `gamma = min(gamma_max,
    lam * R^2)`, where `lam` is a hyperparameter controlling the strength of the correction.

    6.  The final corrected representation is `Z_corr = Zg - (Z_hat * gamma)`.


    **2.2 Density-Adaptive Quota-Balancing (DAQB)**

    The DAQB algorithm builds a k-nearest-neighbor graph on `Z_corr` using a quota
    system to balance within- and cross-batch edges.


    1.  **Local Density Estimation:** For each cell `i`, a local density proxy `d_i`
    is calculated as the distance to its k-th nearest neighbor in the full `Z_corr`
    space.

    2.  **Adaptive Quota Calculation:** The fraction of cross-batch neighbors for
    cell `i`, `f_cross`, is modulated by its density: `f_cross = base_fraction + delta
    * (1 - normalized_density)`. The `delta` hyperparameter controls the strength
    of this adaptation. Cells in denser regions are assigned a higher cross-batch
    quota.

    3.  **Neighbor Selection:** For each cell, the total neighbor quota `k_total`
    is split into within-batch and cross-batch quotas based on `f_cross`. Neighbors
    are then selected by performing separate kNN searches within each batch and filling
    the respective quotas.

    4.  **Symmetrization:** The resulting directed graph is symmetrized to produce
    the final undirected connectivity and distance matrices.

    '
