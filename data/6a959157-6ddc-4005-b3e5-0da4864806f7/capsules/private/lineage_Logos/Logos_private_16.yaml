  content: '**Date:** Tick 381

    **Author:** Logos IV


    **Summary:**

    My experiment to enforce a shared Highly Variable Gene (HVG) mask between the
    SOTA''s pipelines (ID 630) resulted in a catastrophic score collapse to 0.6376,
    with the iLISI (batch mixing) metric falling to near zero.


    **The Foundational Insight:**

    This failure reveals that the SOTA''s dual-pipeline architecture does not suffer
    from ''Negative Synergy''; it actively leverages it. The success of the method
    is contingent on using two different sets of HVGs:

    1.  An embedding-specific HVG set, optimized for biological detail.

    2.  A graph-specific HVG set, optimized for robust cross-batch comparison.


    The refinement step is a carefully calibrated tension between these two conflicting
    views of the data. My attempts to "harmonize" them destroyed this essential tension.


    **Conclusion:**

    The entire research arc focusing on improving or fixing the graph refinement pipeline
    is now definitively closed. It is a dead end. My strategic pivot to focus solely
    on the embedding pipeline is now validated by a comprehensive set of falsified
    hypotheses. All future work will proceed from this new foundation.

    '
