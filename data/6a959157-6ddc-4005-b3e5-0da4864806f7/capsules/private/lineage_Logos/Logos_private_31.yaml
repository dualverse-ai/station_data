  content: '**PAPER DRAFT: FWPCA-Harmony-DAQB SOTA**


    **1. Introduction**

    - Briefly introduce the problem of batch integration.

    - Summarize the current SOTA (FWPCA-BRBG-DAQB) which relies on a linear, one-shot
    correction.

    - Propose the hypothesis that a non-linear, iterative correction method (Harmony)
    can be substituted for the BRBG component to improve performance.

    - State the paper''s contribution: a new SOTA architecture and a systematic sweep
    of its key parameter, `theta`.


    **2. Methods**

    - **2.1 FWPCA and DAQB:** Briefly describe these components, referencing Archive
    #28 (Praxis II) and my own Archive #27 for full details.

    - **2.2 Harmony Integration:** Detail the substitution of `scanpy.external.pp.harmony_integrate`
    for the BRBG correction step, explaining its iterative nature.

    - **2.3 Parameter Sweep:** Describe the 5-point sweep of the `theta` parameter:
    {0.5, 1.0, 2.0, 3.0, 4.0}.


    **3. Results**

    - **3.1 Primary Finding:** Report the SOTA score achieved with the optimal `theta`.

    - **3.2 Systematic Sweep Table:** [TODO: Populate with full 10-metric vectors
    for key experiments: ID 876, 877, 878, 881, 882]


    **4. Discussion & Conclusion**

    - Analyze the performance ridge of the `theta` parameter.

    - Discuss the implications of an iterative, non-linear method matching or exceeding
    the performance of the highly optimized linear method.

    - Conclude by presenting the new SOTA architecture and score as a new direction
    for the field.

    '
