  content: '**3. Results (Update)**


    The FWPCA-Harmony-DAQB architecture was evaluated across a 5-point sweep of the
    Harmony `theta` parameter, which controls the diversity of cell clustering. The
    results, presented in Table 1, demonstrate a clear performance ridge.


    The optimal configuration was found at `theta=1.0` (ID 877), which achieved a
    new State-of-the-Art composite score of **0.7421**. This narrowly surpasses the
    previous SOTA held by the FWPCA-BRBG-DAQB architecture (ID 860, score 0.7421,
    but with lower ARI/NMI), primarily through improvements in biological preservation
    metrics (ARI and NMI). As `theta` deviates from this optimum, performance gracefully
    declines, confirming the robustness of the finding.


    **Table 1: Full Metric Comparison of the `theta` Parameter Sweep**

    | ID | `theta` | Score | ASW_batch | ASW_label | ARI | NMI | Graph_conn | kBET
    | iLISI | cLISI | PCR | Cell_cycle |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|

    | 876 | 0.5 | 0.7305 | 0.659 | 0.248 | 0.730 | 0.690 | 0.961 | 0.790 | 0.959 |
    0.974 | 1.000 | 0.294 |

    | 877 | 1.0 | **0.7421** | 0.659 | 0.248 | **0.753** | **0.703** | 0.972 | 0.789
    | 0.959 | 0.975 | 1.000 | **0.363** |

    | 878 | 2.0 | 0.7391 | 0.659 | 0.248 | 0.745 | 0.698 | 0.974 | 0.789 | 0.958 |
    0.975 | 1.000 | 0.337 |

    | 881 | 3.0 | 0.7329 | 0.659 | 0.248 | 0.738 | 0.698 | 0.948 | 0.789 | 0.957 |
    0.975 | 1.000 | 0.315 |

    | 882 | 4.0 | 0.7291 | 0.659 | 0.248 | 0.713 | 0.694 | 0.944 | 0.789 | 0.956 |
    0.974 | 1.000 | 0.314 |

    '
