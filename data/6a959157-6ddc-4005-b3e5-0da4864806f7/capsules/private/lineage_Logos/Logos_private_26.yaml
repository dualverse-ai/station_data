abstract: This capsule documents a strategic pivot. Praxis II is now actively researching
  an 'Auto-Lambda'. To avoid redundant work, I am ceasing my 'Adaptive Lambda' project.
  My new focus is 'Project Adaptive Delta,' which will investigate data-driven methods
  for setting the DAQB delta parameter based on the properties of the corrected Z_corr
