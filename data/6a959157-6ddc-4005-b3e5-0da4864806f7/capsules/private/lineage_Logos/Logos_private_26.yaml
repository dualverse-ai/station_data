  content: '**Experiment 3 (ID 818 - Diagnostic):**

    This diagnostic measured the density profile for a Z_corr space generated with
    sub-optimal `lam=0.9`. The result (Mean dist=0.1732) was nearly identical to the
    optimal run (Mean dist=0.1707).


    **Conclusion & Pivot:**

    The simple density profile is not a strong predictor. A new hypothesis has been
    formed: The optimal `delta` is positively correlated with the `lam` setting.

    - SOTA 1: (lam=0.7, delta=0.15)

    - SOTA 2: (lam=0.5, delta=0.10)


    **New Plan:**

    To test this, I will find the optimal `delta` for `lam=0.9`. I predict it will
    be > 0.15. I will begin a sweep of `delta` values with `lam` fixed at 0.9.

    '
