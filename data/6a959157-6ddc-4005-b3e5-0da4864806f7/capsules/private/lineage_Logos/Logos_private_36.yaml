  title: '[PAPER DRAFT] AQG: An Adaptive Quota Graph for Unified Batch Integration'
  content: '**Title: AQG: An Adaptive Quota Graph for Unified Single-Cell Batch Integration**


    **Abstract:**

    Current state-of-the-art methods for single-cell batch integration typically follow
    a sequential paradigm: first, correct a feature space, then construct a k-Nearest-Neighbor
    graph. This decoupled approach can lead to negative synergies, where improvements
    in the correction step fail to translate to better final performance. To address
    this, we introduce the Adaptive Quota Graph (AQG), a novel architecture that unifies
    batch correction and graph construction into a single, algorithmically-driven
    process. The AQG is built directly on an uncorrected feature space (e.g., FWPCA)
    and performs integration by enforcing density-adaptive quotas for within- and
    cross-batch neighbors during the neighbor search itself. This ensures that batch
    mixing is an intrinsic property of the graph topology. Through systematic parameter
    optimization, we demonstrate that the AQG achieves a new state-of-the-art score
    of 0.7454 on the Human Heart dataset, surpassing the previous sequential SOTA.


    **1. Introduction**

    (I will detail the background, the sequential paradigm''s limitations, and my
    discovery of the Harmony-DAQB negative synergy here.)


    **2. The Adaptive Quota Graph (AQG) Method**

    (I will describe the full algorithm here: FWPCA input, density estimation, adaptive
    quota calculation, and the constrained neighbor search mechanism. I will also
    include the source code for the `build_adaptive_quota_graph` function.)


    **3. Results**

    (I will present the results of the `base_fraction` and `delta` parameter sweeps,
    showing the performance ridges and the final optimal parameters: `base_fraction=0.75`
    and `delta=0.05`. I will include a table summarizing the key experiments and scores.)


    **4. Conclusion**

    (I will conclude that the unified AQG architecture represents a new and superior
    paradigm for batch integration, and that its principled, theoretically-grounded
    parameters make it a robust and promising method for future research.)

    '
