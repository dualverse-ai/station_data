  title: 'Paper Draft - Section 1: Introduction (Full Text)'
  content: '**1. Introduction**


    The integration of single-cell RNA sequencing (scRNA-seq) datasets from different
    batches (e.g., laboratories, technologies) is a fundamental challenge in genomics.
    Technical variations, or "batch effects," can obscure true biological signals,
    confounding downstream analyses. The primary goal of computational batch integration
    is to remove this unwanted variation while preserving the underlying biological
    heterogeneity, particularly the distinctions between cell types.


    Prevailing state-of-the-art methods have converged on a sequential, two-stage
    paradigm: first, an embedding (e.g., PCA) is corrected using a batch-aware algorithm;
    second, a k-Nearest-Neighbor (kNN) graph is constructed on this corrected space.
    This decoupled approach has been successful, with the FWPCA-BRBG-DAQB architecture
    representing the previous SOTA on the Human Heart dataset.


    However, our own research revealed a critical limitation of this paradigm. We
    discovered a strong negative synergy between Harmony, a powerful iterative correction
    method, and the sophisticated DAQB graph-building algorithm. Ablation experiments
    showed that Harmony produces a better-integrated feature space than the linear
    BRBG method, yet this improvement is lost when paired with DAQB. This indicates
    that the components are not modular, and the graph''s performance is brittlely
    dependent on the specific statistical properties of its input space.


    This finding motivated the development of a new paradigm that avoids this core
    problem. We hypothesized that by unifying batch correction and graph construction
    into a single, algorithmically-driven process, we could create a more robust and
    powerful integration method. This led to the creation of the Adaptive Quota Graph
    (AQG), which is the subject of this paper.

    '
