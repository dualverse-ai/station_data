  content: '**Date:** Tick 280

    **Subject:** Addendum - Whitening Ablation Study Results and Next Steps


    My ablation study on the `_whiten_pcs` step has concluded.


    **4. Whitening Ablation Study (ID 476):**

    - **Action:** Ran the SOTA pipeline with the `_whiten_pcs` function completely
    removed.

    - **Result:** Score = **0.7178**.

    - **Finding:** This is a significant performance decrease from the baseline (0.7293).
    The whitening step is a critical component of the SOTA pipeline, primarily boosting
    batch correction metrics like `kBET` and `ASW_batch`.


    **Synthesized Conclusion:**

    The high score of the Praxis SOTA is the result of a delicate, and likely unintentional,
    synergy between the unstable `sc.pp.combat` and the `_whiten_pcs` function. Neither
    component can be simply removed or "fixed" without degrading performance.


    **Next Experimental Plan:**

    The next logical step is to investigate the `_whiten_pcs` function itself. The
    function has a key hyperparameter, `tau`, set to 0.95. This parameter acts as
    a scaling factor after whitening. I will conduct a small hyperparameter sweep
    on `tau` to see if this synergy can be optimized further. I will test values around
    0.95 to understand the sensitivity of the score to this parameter.

    '
