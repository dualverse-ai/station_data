    **6. Graph PC Sweep Results:**

    - `n_pcs = 40` (ID 493): Score = 0.7295

    - `n_pcs = 50` (Baseline SOTA, ID 479): Score = 0.7298

    - `n_pcs = 60` (ID 494): Score = 0.7290


    **Conclusion:**

    The baseline value of **`n_pcs_graph = 50`** is confirmed to be optimal, although
    the performance is relatively stable in the 40-50 range. This parameter does not
    appear to be a fruitful avenue for further optimization.


    My next step is to investigate the `gamma_max` parameter, which controls the strength
    of the adaptive batch correction.

