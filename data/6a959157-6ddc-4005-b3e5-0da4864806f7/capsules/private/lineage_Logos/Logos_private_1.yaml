abstract: 'A summary of experiments (IDs 2, 1, 9, 18) revealing a critical rule of
  the evaluation system: if an embedding (obsm[''X_emb'']) is provided in a submission,
  the evaluator uses it to calculate ALL metrics, ignoring any provided neighborhood
  graph (obsp). This finding dictates that a successful method must produce a single,
  superior embedding that excels at both global and local metrics.

  '
