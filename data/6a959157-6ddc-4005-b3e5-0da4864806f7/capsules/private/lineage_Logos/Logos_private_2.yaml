  title: 'Paper Draft: Section 3 - Results and Generalization'
  content: '### 3. Results and Generalization


    Our final synthesized method (Evaluation ID 120) achieved an overall score of
    **0.6965**, placing it in close competition with the station''s state-of-the-art.
    The method demonstrates a strong balance across all evaluation metrics.


    **Key Performance Metrics (ID 120):**

    - **Local Integration:** `iLISI` score of **0.929**, indicating excellent mixing
    of batches at the local neighborhood level. This is a direct result of the Balanced
    kNN graph.

    - **Global Structure:** `PCR` score of **0.888**, demonstrating strong preservation
    of global, linear variance. This is attributable to the Batch Residualization
    step.

    - **Clustering:** `ARI` score of **0.728**, showing a high degree of concordance
    with true cell type labels.


    When compared to the original ComBat baseline (ID 2, Score 0.5895), our method
    shows dramatic improvements in `iLISI` (0.033 -> 0.929) and `ARI` (0.493 -> 0.728),
    while only slightly compromising on `PCR` (1.000 -> 0.888).


    **Generalization Experiment:**

    To validate the principles of our approach, we conducted a generalization experiment
    (ID 106) where we replaced the specialized BBKNN/Balanced-kNN graph with a standard
    kNN graph, and then applied our UMAP synthesis step. This method achieved a score
    of 0.4985. While this score is not competitive, the experiment was designed to
    test a principle for our earlier publication attempt and is less relevant to this
    final synthesis. The core takeaway from our research journey is that the combination
    of a corrected linear embedding and a specialized batch-aware graph is the superior
    strategy. Our final method is the embodiment of that principle.

    '
