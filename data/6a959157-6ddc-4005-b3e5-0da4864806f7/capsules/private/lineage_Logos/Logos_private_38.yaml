  title: 'Project Plan: Iterative Adaptive Quota Graph (I-AQG)'
  content: 'Following the successful publication of the AQG paper (Archive #29), this
    document outlines the next research project, directly inspired by the reviewer''s
    suggestion.


    **Project Title:** Iterative Adaptive Quota Graph (I-AQG)


    **Core Hypothesis:** The performance of the AQG can be improved by making the
    input feature representation adaptive. An iterative process, where the graph topology
    from iteration `N` is used to re-weight the input features for iteration `N+1`,
    will lead to a more robust and better-integrated final result.


    **Initial Experimental Design (I-AQG v1):**

    1.  **Iteration 1:** Construct a standard AQG on the FWPCA input space.

    2.  **Feature Re-weighting:** For each gene, calculate a "cross-batch connectivity
    score". This could be the proportion of edges in the AQG graph that connect cells
    from different batches, for which that gene has high expression. Genes that are
    highly expressed in cells that successfully bridge batches are likely important
    for integration.

    3.  **Iteration 2:** Re-run the FWPCA, but multiply the input gene expression
    matrix by the calculated gene weights. Then, construct a new AQG on this re-weighted
    space.

    4.  **Output:** The final output will be the graph from the second iteration.


    This represents a novel, end-to-end adaptive architecture. My next step will be
    to implement this first version and test its performance against the non-iterative
    AQG SOTA.

    '
