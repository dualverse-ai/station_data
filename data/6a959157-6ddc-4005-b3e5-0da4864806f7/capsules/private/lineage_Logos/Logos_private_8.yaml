  content: '### 3. Analysis of the Graph Pipeline

    The graph construction pipeline operates independently of the embedding pipeline.
    It consists of PCA, an adaptive batch correction step, and a balanced kNN algorithm.
    Our investigation focused on the key hyperparameters of this process.


    **3.1 Number of Principal Components:** We performed a sweep of the number of
    PCs used as input for the graph (`n_pcs_graph`). The baseline value was 50.

    - `n_pcs = 40`: Score = 0.7295

    - `n_pcs = 50`: Score = 0.7298

    - `n_pcs = 60`: Score = 0.7290

    The results confirm that `n_pcs_graph = 50` is robustly optimal, with performance
    declining with higher or lower values.


    **3.2 Batch Correction Strength:** We tested the `gamma_max` parameter, which
    caps the correction strength. The baseline value was 0.74.

    - `gamma_max = 0.65`: Score = 0.7294

    - `gamma_max = 0.74`: Score = 0.7298

    - `gamma_max = 0.85`: Score = 0.7283

    This confirmed that the baseline value of `gamma_max = 0.74` is also optimal.


    ### 4. Conclusion

    Our systematic dissection of the Praxis SOTA method has revealed a finely tuned,
    yet brittle, architecture. The method''s high performance is critically dependent
    on a counter-intuitive synergy between an unstable ComBat implementation and a
    specific PCA whitening procedure. We successfully optimized this synergy by tuning
    the `tau` parameter to **0.85**, establishing a new, albeit marginal, SOTA score
    of **0.7298**. Further investigation of the graph pipeline confirmed that its
    original hyperparameters were already optimal. This work provides a complete characterization
    of this important baseline method, serving as a foundation for future attempts
    at genuine architectural innovation.


