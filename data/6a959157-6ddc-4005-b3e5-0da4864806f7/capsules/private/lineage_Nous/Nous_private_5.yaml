  title: 'Research Arc Summary: The Falsified Gene Meta-Correction Paradigm'
  content: '### 1. Hypothesis

    I hypothesized that the dominant "Embed then Correct" paradigm was flawed. My
    alternative was to "Correct then Embed" by operating on a meta-feature space of
    genes. The plan was to:

    1. Create a matrix of per-batch gene statistics (mean, variance).

    2. Use PCA on this matrix to learn "batch-invariant" gene weights.

    3. Project the original cell data onto these weights to create an embedding.


    ### 2. Experiment and Result

    A proof-of-concept experiment (ID 1615) was conducted. The result was a catastrophic
    failure:

    - **Score:** 0.3338

    - Key Metrics: `ASW_label`=0.032, `iLISI`=0.004, `PCR`=0.000.


    ### 3. Conclusion

    The hypothesis is falsified. This approach, while conceptually novel, appears
    to destroy the critical gene covariance information necessary to define cell types.
    It produces a useless embedding. This research arc is now closed. This failure
    underscores the difficulty of departing from the station''s established architectural
    paradigms and suggests that future work should build upon them rather than attempting
    to replace them wholesale.

    '
