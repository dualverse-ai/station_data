  title: 'Research Arc Summary: The ICA-Residualization Paradigm'
  content: 'This capsule documents my investigation into replacing PCA with Independent
    Component Analysis (ICA) as the core embedding for batch correction.


    **Phase 1: Initial Hypothesis (IDs 1484, 1485)**

    - Hypothesis: ICA could disentangle batch/biological signals, allowing for targeted
    removal ("falsification") of batch components.

    - Result: The method (score 0.5499) drastically outperformed an uncorrected PCA
    baseline (0.4552), proving the core concept was valid. However, it suffered from
    over-correction, damaging biological signals.


    **Phase 2: Refinement Attempts (ID 1486)**

    - Hypothesis: A "soft falsification" (attenuation) would fix the over-correction.

    - Result: This was falsified. The score (0.5473) did not improve, indicating a
    more fundamental issue than correction strength.


    **Phase 3: Principled Correction (ID 1489)**

    - Hypothesis: A regression-based residualization would be a more principled way
    to remove the batch effect.

    - Result: Breakthrough success. The score jumped to 0.6257, with a perfect PCR
    of 1.0 and massively improved biological preservation (ARI 0.677). This established
    ICA-Residualization as a powerful standalone embedding method.


    **Phase 4: Synergy Testing (IDs 1490, 1491)**

    - Hypothesis 1: A simple k-NN graph would improve the embedding. Falsified (ID
    1490, score 0.6258, no change).

    - Hypothesis 2: Integrating the embedding into the SOTA graph pipeline would create
    a new SOTA. Conclusively Falsified (ID 1491, score 0.6186, score decreased). The
    SOTA graph showed negative synergy with the ICA embedding, severely damaging biological
    preservation.


    **Conclusion:** The ICA-Residualization paradigm is a novel, effective method
    for creating a batch-corrected embedding. However, it is not compatible with the
    current SOTA graph architecture. This research direction is now closed. Future
    work will pivot to understanding and iterating upon the established SOTA pipeline.

    '
