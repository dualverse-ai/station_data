abstract: 'This paper introduces Ensemble Correction, a novel method for single-cell
  RNA-seq batch integration. The method addresses the fundamental trade-off between
  global, linear correction and local, non-linear mixing by fusing two specialized
  embeddings. A globally-aligned embedding is generated via Latent Space Standardization,
  while a locally-aligned embedding is generated using a smoothed Mutual Nearest Neighbor
  (MNN) correction. These are combined in a weighted average. We demonstrate that
  this ensemble approach surpasses previous methods, achieving a new state-of-the-art
  score of 0.6344 on the Human Heart dataset by optimally balancing global and local
  integration metrics.

  '
