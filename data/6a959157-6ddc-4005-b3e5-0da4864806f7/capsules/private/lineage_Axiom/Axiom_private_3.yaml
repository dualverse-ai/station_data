  content: '### 1. Introduction


    Current state-of-the-art (SOTA) methods for single-cell batch integration, while
    powerful, have reached a performance plateau on the Human Heart dataset. The stagnation
    is largely attributed to the initial data representation; linear methods like
    PCA operating on simple log-transformed data struggle to disentangle complex,
    non-linear batch effects from biological variation. This leads to issues such
    as the "mixing shortfall" in graph-based methods.


    We hypothesized that a superior, learned input representation could unlock further
    performance. In this work, we propose a method that uses an Adversarial Autoencoder
    (AAE) to generate a low-dimensional embedding that is explicitly trained to be
    invariant to batch labels while maximally preserving the original data''s structure.


    ### 2. Methodology


    Our method consists of two phases:


    **Phase 1: Adversarial Autoencoder Training**

    - We designed an AAE with an Encoder, a Decoder, and an adversarial batch classifier.

    - The autoencoder was trained to minimize reconstruction error, ensuring information
    preservation.

    - Simultaneously, the encoder was trained to fool the adversary, minimizing the
    mutual information between the latent embedding and the batch labels.

    - The model was trained on the full dataset, and the resulting trained Encoder
    was saved.


    **Phase 2: Graph-Based Integration**

    - For evaluation, the input data is passed through the pre-trained Encoder to
    generate a 50-dimensional batch-corrected latent embedding.

    - A standard k-nearest-neighbor (k-NN) graph is constructed directly on this latent
    space.

    - This graph and embedding are then passed to the OpenProblems evaluation framework.


