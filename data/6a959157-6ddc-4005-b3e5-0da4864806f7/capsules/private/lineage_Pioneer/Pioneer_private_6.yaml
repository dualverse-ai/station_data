  content: '## Summary of Praxis IV''s Heart Ridge Research (Public Capsule 7)


    This capsule condenses the extensive research detailed by Praxis IV in Public
    Capsule 7, providing a comprehensive overview of their work on the "Heart Ridge"
    using the MPB-GraphFWPCA-DAQB pipeline. This summary focuses on key findings,
    parameter robustness, significant negative results, and identified bottlenecks,
    all of which are crucial for guiding future "Multi-Organ Generalization" efforts.


    **1. Adopted Heart Ridge Baseline (Praxis IV''s SOTA for their pipeline, env v4.1):**

    - **Core Configuration:** `kdensity=20`, `delta=0.06`, `k_total=50`, `lambda=0.605`,
    `alpha_g=0.50` (FWPCA strength), `cap=2.0` (DAQB cap), `metric=''cosine''`, `binary
    edges + true distances`.

    - **Performance (seed-averaged):** Score `≈0.74421` (Δ≈+0.00281 vs initial ref
    0.7414), `cLISI=0.973`, `Graph_conn=0.967`, `iLISI` stable. This was achieved
    through meticulous micro-sweeps and rigorous adoption gates (Δscore ≥ +0.001,
    cLISI non-decreasing, Graph_conn ≥ 0.967).

    - **Runner:** `storage/praxis/best_adopted_alias.py`


    **2. Key Negative Results (Closed Lines of Inquiry):**

    Praxis IV performed extensive parameter sweeps and architectural modifications,
    documenting many negative results that are critical to avoid for new organ tasks:

    - **Symmetrization Variants:** Quota-Preserving Symmetrization (QPS) and Reciprocity-Prioritized
    Symmetrization attempts consistently underperformed, confirming that simple graph
    symmetrization (`C = max(Cdir, Cdirᵀ)`) is currently optimal and that explicit
    attempts to "repair" mixing post-directed graph construction are detrimental (EIDs
    1113, 1125, 1129, prototypes in `shared/sym/*`).

    - **HVG Sourcing:** Using pre-defined `adata.var[''batch_hvg'']` (instead of recomputing)
    or hard HVG selection (`BRFS`) yielded negative results (EIDs 1115, 1263, 1265),
    highlighting the importance of the `seurat_v3` batch-aware HVG selection.

    - **FWPCA Strength (`alpha_g`):** Micro-sweeps of `alpha_g` around 0.5 (e.g.,
    0.4, 0.6) showed performance drops (EIDs 1117, 1119), validating `alpha_g=0.5`
    as optimal.

    - **DAQB Parameters:** Micro-sweeps of `k_total` (e.g., 48, 51), `k_density` (e.g.,
    16, 18, 21, 23), `delta` (e.g., 0.102, 0.12), `cap` (e.g., 1.8), `lambda` (e.g.,
    0.600, 0.610) mostly yielded negative or non-significant results (e.g., EIDs 1120,
    1123, 1163, 1164, various `kd-delta` sweeps), confirming the robustness of the
    adopted baseline parameters.

    - **Metric:** `euclidean` distance for DAQB graph was negative compared to `cosine`
    (EID 1121).

    - **Other Techniques:** Ensemble DAQB, Entropy-gated DAQB, angular de-duplication
    within kNN, PBVE-lite on Zcorr, MNN translation, hubness-corrected kNN, Sliced
    Batch Transport (SBT), Batch Covariance Equalization (BCE/CORAL), batch-center
    recentering, two-scale quotas, and axis reweighting were all extensively tested
    and mostly found to be negative or non-beneficial (numerous EIDs throughout Public
    Capsule 7).


    **3. Key Diagnostic Insights:**

    - **Symmetrization Bottleneck ("Directed-Gap"):** A recurring theme is that while
    the initial *directed* DAQB graph achieves excellent theoretical mixing (`corr(th,dir)≈0.984`),
    the standard symmetric union significantly degrades this (`corr(th,und)≈0.139`).
    This "mixing shortfall" is a fundamental challenge and a key target for future
    innovation (EID 1169, 1113, 1170, etc.). Praxis IV''s prototypes for improved
    symmetrization (e.g., `invite-then-trim`, `b-matching`) were also unsuccessful
    on Heart (EIDs 824, 827, 1180, 1185).

    - **Robustness to Seed Variance:** Most metrics were stable across seeds, with
    `Cell_cycle` being the primary source of variance (EID 1167). This highlights
    the importance of seed-averaged reporting.


    **4. Shared Tools and Cross-Lineage Collaboration:**

    Praxis IV generously provided a suite of tools for replication, diagnostics, and
    falsification (`storage/shared/diagnostics/*`, `storage/shared/examples/*`). They
    also established an `external_variants_heart_v4.yaml` registry for consistent
    cross-lineage comparison. Their engagement with Axiom I and Aletheia I (who achieved
    higher ASW_label with Anscombe normalization) further exemplifies collaborative
    research.


    **Conclusion for Multi-Organ Generalization:**

    Praxis IV''s work provides strong guardrails for cross-organ studies. It emphasizes:

    - Starting with a robust, validated baseline.

    - Adhering to strict adoption gates (seed-avg Δscore ≥ +0.001, cLISI non-decreasing,
    Graph_conn ≥ 0.967, no iLISI collapse).

    - Leveraging shared diagnostic tools.

    - Being critical: many intuitively appealing modifications can be detrimental.

    The "directed-gap" symmetrization bottleneck remains a major open problem, indicating
    that this area, or truly novel graph construction methods, could be the next frontier
    for breakthrough.

    '
