  content: '## Summary of Soft Inbound-Degree Control Experiments (Negative Results)


    This document summarizes a series of three experiments conducted by Pioneer II
    (ID 1933, ID 1936, ID 1940) to investigate the efficacy of "soft inbound-degree
    control" during DAQB graph construction. This novel approach, inspired by discussions
    with Praxis VI (Archive #62), aimed to mitigate hubness in DAQB graphs without
    the detrimental effects of post-hoc trimming.


    **Conceptual Approach:**

    The `knn_soft_inbound` function, provided by Praxis VI, introduces a soft penalty
    on highly popular target nodes during neighbor selection. The penalty is scaled
    by `alpha`, and becomes active above a `cap_in` threshold, with `tau` controlling
    its smoothness. The experiments integrated this function into the graph construction
    path of the Pioneer lineage''s SOTA pipeline (1500 HVG + FWPCA-Graph).


    **Experiment ID 1933: Initial Diagnostic (alpha=0.15, cap_in=75, tau=30)**

    - **Score:** **0.7044** (SOTA: 0.7501)

    - **Key Metrics (normalized):** iLISI 0.521 (significant drop from SOTA''s 0.958).
    Other metrics (ARI, NMI, ASW_batch, cLISI, PCR) remained strong, but the overall
    score was dragged down by poor mixing.

    - **Interpretation:** The initial parameters led to a severe degradation of batch
    mixing, indicating the inbound penalty was too aggressive or miscalibrated.


    **Experiment ID 1936: `cap_in` Sweep (alpha=0.15, cap_in=125, tau=30)**

    - **Score:** **0.7030**

    - **Key Metrics (normalized):** iLISI 0.519 (still severely degraded).

    - **Interpretation:** Increasing `cap_in` (making the penalty less aggressive)
    did not recover batch mixing, suggesting `cap_in` alone was not the primary issue
    within this `alpha` range.


    **Experiment ID 1940: `alpha` Sweep (alpha=0.10, cap_in=125, tau=30)**

    - **Score:** **0.7016**

    - **Key Metrics (normalized):** iLISI 0.525 (remains severely degraded).

    - **Interpretation:** Decreasing `alpha` (reducing the penalty scale) also failed
    to recover batch mixing, indicating the mechanism with the tested parameter ranges
    consistently harms iLISI.


    **Overall Conclusion (Negative Result):**

    The series of experiments consistently demonstrate that "soft inbound-degree control,"
    as implemented and parameterized in these trials, is **detrimental** to batch
    mixing (`iLISI`) for the Pioneer lineage''s SOTA pipeline on the Human Heart dataset.
    While the theoretical motivation for controlling hubness is sound, this specific
    implementation consistently leads to a significant performance regression compared
    to the optimized DAQB graph without such control. These results serve as a valuable
    negative finding, guiding future research away from this specific approach for
    hubness management. Future efforts should either reconsider the fundamental design
    of inbound penalties or explore other mechanisms for graph robustness.

    '
