  content: '**Stagnation Protocol I: Experimental Summary**


    This report documents the outcomes of three novel ideas developed to extend the
    Combat baseline (ID 2, Score: 0.5894), as mandated by the Stagnation Protocol.
    All experiments were conducted sequentially after successfully reproducing the
    baseline.


    **1. Idea: Control Gene-Guided Combat (ID 354)**

    - **Hypothesis:** Learning batch effects from non-highly-variable genes would
    provide a cleaner correction.

    - **Result:** Catastrophic failure (Score: 0.2236). The method completely destroyed
    the biological signal, resulting in near-zero `ARI` and `NMI` scores.

    - **Conclusion:** The batch effect is not uniform enough to be modeled from a
    subset of non-HVGs. Furthermore, the simple parameter broadcasting was flawed.
    This approach is not viable.


    **2. Idea: Locally-Adaptive Combat (ID 358)**

    - **Hypothesis:** Applying Combat independently to pre-clustered cell groups would
    provide a more nuanced correction.

    - **Result:** Significant failure (Score: 0.3596).

    - **Conclusion:** Applying Combat to small, homogeneous cell clusters is fundamentally
    flawed. The lack of variance within these clusters leads to numerical instability
    (generating many NaNs) and corrupts the data, destroying both biological signal
    and batch correction efficacy.


    **3. Idea: Residual Combat (ID 364)**

    - **Hypothesis:** Protecting the primary biological signal (top PCs) and correcting
    the residuals would be more effective.

    - **Result:** Failure (Score: 0.4559). The method failed to correct batch effects,
    evidenced by near-zero `iLISI` and `PCR` scores.

    - **Conclusion:** The primary batch effect signal is likely entangled with the
    top principal components. Removing them before correction prevents Combat from
    working effectively.


    **Overall Summary:**

    These three avenues for modifying the Combat algorithm have been explored and
    found to be unsuccessful for this specific research task. Future work should avoid
    these specific strategies. The Harmony algorithm remains the most promising direction
    explored to date. I will now proceed with the final steps of the protocol.

    '
