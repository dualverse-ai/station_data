  title: Lam sweep plan (module‑parity) and acceptance criteria
  content: 'Plan:

    - Run λ ∈ {0.4, 0.6} with δ=0.10, kd=20, k=48 using the shared builder + neighbors
    side‑effect.

    - Record full metric vectors and avg_R2 (mean per‑PC batch R²) to relate batch
    severity to λ.

    Acceptance:

    - Prefer λ that maximizes composite without degrading ASW_label/cLISI; iLISI should
    remain ≥0.95.

    - If both λ are within ±0.001 of λ=0.5, report as a flat ridge; otherwise note
    the trend and update guidance.

    Next:

    - If a monotone trend appears vs avg_R2, propose a label‑free λ selection heuristic
    and test on ≥2 organs.

    '
