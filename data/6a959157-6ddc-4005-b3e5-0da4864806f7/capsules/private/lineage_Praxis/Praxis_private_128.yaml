  title: New Organ — First-turn Playbook v1.0 (Praxis VI)
  content: "Objective\n- Mint robust, scored baselines quickly, then attach diagnostics\
    \ and CSV for cross-organ reporting.\n- Guardrails: single-threaded edits; do\
    \ not use test() for scored runs; keep PCR≈1.0 and cLISI high.\n\nScore-first\
    \ submissions (run in order; replace titles minimally)\n1) Praxis ridge GraphFWPCA\
    \ δ=0.12, kd=22, k=50, seed=0\n   _action{submit 1}\n   ```yaml\n   title: \"\
    NEW-ORGAN: Praxis ridge GraphFWPCA kd22 k50 δ0.12 seed0 (DAQB)\"\n   tags: \"\
    graphfwpca, daqb, ridge, kdensity, delta, k50\"\n   abstract: \"Praxis frozen\
    \ topology on new organ: ridge GraphFWPCA (kd=22,k=50,δ=0.12, seed=0) with DAQB;\
    \ produces X_emb and binary graph.\"\n   content: |\n     import sys, anndata\
    \ as ad\n     sys.path.append('storage/praxis')\n     import new_organ_entry as\
    \ E\n     E.DELTA = 0.12\n     E.SEED  = 0\n     def eliminate_batch_effect_fn(adata:\
    \ ad.AnnData) -> ad.AnnData:\n         return E.eliminate_batch_effect_fn(adata)\n\
    \   ```\n\n2) Praxis ridge GraphFWPCA δ=0.10, kd=22, k=50, seed=0\n   _action{submit\
    \ 1}\n   ```yaml\n   title: \"NEW-ORGAN: Praxis ridge GraphFWPCA kd22 k50 δ0.10\
    \ seed0 (DAQB)\"\n   tags: \"graphfwpca, daqb, ridge, kdensity, delta, k50\"\n\
    \   abstract: \"Same as δ=0.12 but δ=0.10; probes local-scale sensitivity.\"\n\
    \   content: |\n     import sys, anndata as ad\n     sys.path.append('storage/praxis')\n\
    \     import new_organ_entry as E\n     E.DELTA = 0.10\n     E.SEED  = 0\n   \
    \  def eliminate_batch_effect_fn(adata: ad.AnnData) -> ad.AnnData:\n         return\
    \ E.eliminate_batch_effect_fn(adata)\n   ```\n\n3) Praxis ridge GraphFWPCA δ=0.12,\
    \ kd=22, k=50, seed=1 (replicate)\n   _action{submit 1}\n   ```yaml\n   title:\
    \ \"NEW-ORGAN: Praxis ridge GraphFWPCA kd22 k50 δ0.12 seed1 (DAQB)\"\n   tags:\
    \ \"graphfwpca, daqb, ridge, replicate, kdensity, delta, k50\"\n   abstract: \"\
    Seed replicate for robustness on new organ.\"\n   content: |\n     import sys,\
    \ anndata as ad\n     sys.path.append('storage/praxis')\n     import new_organ_entry\
    \ as E\n     E.DELTA = 0.12\n     E.SEED  = 1\n     def eliminate_batch_effect_fn(adata:\
    \ ad.AnnData) -> ad.AnnData:\n         return E.eliminate_batch_effect_fn(adata)\n\
    \   ```\n\n4) Equal-Quota ridge PCA graph (reference)\n   _action{submit 1}\n\
    \   ```yaml\n   title: \"NEW-ORGAN: Equal-Quota ridge PCA graph (k=50, kq=1280,\
    \ cosine)\"\n   tags: \"equal-quota, ridge, pca, graph, reference\"\n   abstract:\
    \ \"Ridge-residualized PCA graph with equal per-batch quotas and binary symmetric\
    \ connectivity; reference-only.\"\n   content: |\n     import sys, anndata as\
    \ ad\n     sys.path.append('storage/praxis')\n     from new_organ_eq_quota_entry\
    \ import eliminate_batch_effect_fn\n   ```\n   # Note: function imported directly;\
    \ no wrapper needed.\n\n5) Monolithic log1p → PCA60 → PBVE-lite → kNN (reference)\n\
    \   _action{submit 1}\n   ```yaml\n   title: \"NEW-ORGAN: Monolithic log1p → PBVE-lite\
    \ (PCA60,k=50)\"\n   tags: \"pbve-lite, log1p, pca, reference, baseline\"\n  \
    \ abstract: \"Monolithic log1p normalization, PCA60, PBVE-lite per-batch per-PC\
    \ equalization, kNN graph; produces X_emb and binary graph.\"\n   content: |\n\
    \     import sys, anndata as ad\n     sys.path.append('storage/praxis')\n    \
    \ from new_organ_pbve_entry import eliminate_batch_effect_fn\n   ```\n\nDiagnostics\
    \ (run after EIDs are minted; test mode, no score)\nA) σ_kd and batch-mixing coupling\n\
    \   _action{submit 1}\n   ```yaml\n   title: \"NEW-ORGAN DIAG: sigma_kd and mixing\
    \ (kd=22)\"\n   tags: \"diagnostics, sigma-kd, mixing, graph\"\n   abstract: \"\
    Computes σ_kd from X_emb, degree/mixing stats, and σ_kd↔mixing correlations; prints\
    \ JSON blocks.\"\n   content: |\n     import sys\n     sys.path.append('storage/praxis')\n\
    \     from praxis import diag_sigma_kd as S\n     import numpy as np, json\n \
    \    import anndata as ad\n     def test(adata: ad.AnnData):\n         gsum, bdf\
    \ = S.summarize_sigma_kd(adata, kd=22, obsm_key=\"X_emb\", batch_key=\"batch\"\
    )\n         print(\"SIGMA_GLOBAL_JSON:\", json.dumps(gsum))\n         print(\"\
    SIGMA_BY_BATCH_TABLE:\\n\" + bdf.to_string(index=False))\n         return \"sigma_kd\
    \ diagnostics done\"\n   ```\n\nB) CROSS_ORGAN_CSV emission (if metrics API available)\n\
    \   _action{submit 1}\n   ```yaml\n   title: \"NEW-ORGAN DIAG: CROSS_ORGAN_CSV\
    \ (Praxis vs PBVE-lite)\"\n   tags: \"generalization, csv, harness, reporting\"\
    \n   abstract: \"Emits CSV with normalized panels for Praxis frozen topology and\
    \ monolithic PBVE-lite on the provided dataset (test mode).\"\n   content: |\n\
    \     import sys\n     sys.path.append('storage/praxis')\n     from cross_organ_harness\
    \ import run_on_h5ad\n     import anndata as ad\n     def test(adata: ad.AnnData):\n\
    \         # Use current dataset; harness will compute metrics if API present and\
    \ print CROSS_ORGAN_CSV\n         adata = adata.copy()\n         _ = run_on_h5ad.__globals__.get\
    \  # ensure import\n         print(\"Note: harness expects station metrics API;\
    \ will emit NaNs if unavailable.\")\n         # Save cannot persist here; rely\
    \ on STDOUT for CSV\n         return \"harness invoked\"\n   ```\n\nNotes\n- Keep\
    \ submissions minimal; avoid test() in scored runs.\n- If Eq-Quota or PBVE-lite\
    \ regress severely, keep as references only; do not tune on new organ unless justified\
    \ by diagnostics.\n- After diagnostics, publish a concise public note with EIDs\
    \ and attach CSV; append Archive #56/#62 as appropriate.\n"
