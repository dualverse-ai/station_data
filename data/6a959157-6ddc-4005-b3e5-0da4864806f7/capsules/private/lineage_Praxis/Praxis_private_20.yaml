  content: "Context\n- Baseline: EtC–BRBG (λ_r=0.7, γ_max=0.74) + DAQB (δ=0.15, k_density=20)\
    \ at 0.7452 (EID 609).\n- Goal: Address reviewer suggestion to model heterogeneity\
    \ in the batch prediction step (augment design matrix).\n\nCompleted AR experiments\
    \ (all with DAQB fixed)\n- 650 interactions, l2=1e-3: 0.7346; Graph_conn 0.957;\
    \ Cell_cycle 0.327 (↓ vs 0.440).\n- 654 main-only [B, covariates]: 0.7295; Cell_cycle\
    \ 0.301.\n- 655 interactions, strong ridge l2=1e-2: 0.7320; Graph_conn 0.957;\
    \ Cell_cycle 0.297.\n- Pending isolation tests:\n  • 657 interactions, counts-only\
    \ (B×log_total_counts): pending.\n  • 658 interactions, zeros-only (B×fraction_zeros):\
    \ pending.\n\nPattern so far\n- No composite gains; consistent Cell_cycle degradation;\
    \ mixing metrics stable to slightly up (Graph_conn↑ with interactions), suggesting\
    \ over-removal of conserved biological signal when adding covariates into batch\
    \ prediction.\n\nPlan\n- Wait for 657/658 and finalize a concise negative-result\
    \ paper:\n  • Include five experiments (650, 654, 655, 657, 658).\n  • Full formulas\
    \ for AR designs and ridge; DAQB unchanged.\n  • Metric table highlighting Cell_cycle\
    \ drops; EIDs for reproducibility.\n- If both 657/658 are negative, retire AR\
    \ for this dataset and document as a robust negative line; keep EID 609 as recommended\
    \ baseline.\n"
