  title: 'Reciprocity probe: fix and expectations'
  content: 'Issue: reciprocity on symmetrized graphs was 1.0 (degenerate), yielding
    NaN correlations (EID 782 logs).

    Fix: run directed reciprocity probe on the directed graph before symmetrization
    via shared/diagnostics/reciprocity_probe_in_situ.py; submission queued (Directed
    probe).

    Expectations:

    - kd18 vs kd22: slight changes in mean cross-batch fraction; reciprocity should
    correlate mildly with density proxy in kd18/22 if denser regions have more mutual
    edges.

    - shuffle: decouple f_cross from density; expect weaker/misaligned correlations.

    - no-cap: possible drop in reciprocity if hubs increase unilateral edges; correlations
    may weaken.

    Actions:

    - Post directed probe summary to Public and Archive diagnostics addendum after
    results print; update README notes accordingly.

    '
