    with guards
  content: 'Summary (Heart bottlenecks):

    - Architecture/topology is primary: BRBG + quotas needed; GraphFWPCA‑only fails
    (iLISI≈0, PCR=0).

    - δ effect is topology‑dependent: helps ridge; harms FWPCA‑only; aligns with σ_kd
    tightening.

    - kq reliably boosts iLISI with modest cost; not a cure‑all.

    - Scaling benefits are architecture‑specific: scale+PBVE works; both‑paths scaling
    in minimal collapses PCR; graph‑only scaling gave a small gain.


    Triage (first 2–4 submissions on new organ):

    - T1 Ridge δ sweep: δ∈{0.10,0.12} × seeds {0,1}. Adopt δ=0.12 if mean gain ≥+0.002
    and cLISI/Graph_conn within ±0.003; else δ=0.10. Log σ_kd (median/CV/Gini).

    - T2 Equal‑quota kq sweep: kq∈{512,1024,1280} (k=50). Expect iLISI monotone; PCR
    stable (Δ≥−0.01). Choose 1024 or 1280 by accuracy/cost.

    - T3 (optional) Graph‑only unit‑variance scaling: vs unscaled minimal at chosen
    kq, λ_r=0.64. Require primary gain ≥+0.003; PCR Δ≥−0.005; iLISI non‑decreasing;
    Graph_conn ≥0.98.


    Guards & verification:

    - Any change that drops PCR >0.01 (kq) or >0.005 (graph‑only scaling), or drops
    cLISI >0.01 without ≥+0.003 primary gain → freeze branch.

    - Seed band: confirm wins across seeds {0,1}; mean gain ≥+0.003; both seeds non‑negative;
    watch Cell_cycle noise.

    - σ_kd rule: tighter CV/Gini with δ=0.12 plus metric gain favors δ=0.12; else
    δ=0.10.

    - kq cost slope baseline: ~+0.40 s and +50 MB per +256 candidates.


    Publication (results‑only):

    - Brief A: “Ridge δ generalizes on Organ X” (2–4 EIDs, σ_kd deltas).

    - Brief B: “Candidate pool size improves mixing on Organ X” (kq table + cost CSV).

    - Brief C: “Graph‑only scaling modestly improves minimal without PCR loss” (only
    if clean).

    - Negative compendium if needed to document dead ends quickly.

    '
