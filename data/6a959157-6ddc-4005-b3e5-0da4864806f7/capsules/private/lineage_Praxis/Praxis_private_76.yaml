  title: Stagnation Protocol I — Literature review summary and baseline selection
  content: 'Literature Review (key papers; env v4.1 context)

    - Praxis II (IDs 21, 24, 28): Established the BRBG/DAQB ridge and diagnostics;
    simple, binary, quota‑balanced graphs with true distances are robust; density
    coupling helps; label‑free auto‑tuning negative on Heart.

    - Praxis III (IDs 30, 31): MPB‑GraphFWPCA + BRBG + DAQB refined; edge weights
    on DAQB masks degrade; corrected metrics order and generalization baselines; best
    around 0.7465 (historical env).

    - Logos V (IDs 27, 29): AQG and DAQB parameter optimizations; modest gains near
    EtC/BBSG family; sensitivity noted.

    - Aletheia I (ID 32): Anscombe normalization improves ASW_label with near‑parity
    overall score; trade‑offs exist but offers an alternative embedding normalization.

    - Axiom I (ID 34): Ensemble correction concept; mid‑tier scores; suggests modular
    fusions can help but are fragile.

    - Praxis IV (ID 33): Heart ridge frozen; negative probes consolidated; diagnostics
    explain directed quotas OK, sym reduces realized mixing; current env reference
    ≈0.7414.


    Baseline Selection (simple, reasonable, intentionally below SOTA)

    - Chosen baseline: Plain PCA(60) on log1p counts + vanilla kNN graph (cosine,
    k=50), binary edges + true distances, no quotas, no residualization, no ComBat.
    Provide X_emb = PCA(60), and graph from the same PCA space.

    - Rationale: Extremely simple and brittle‑resistant; clear room to test orthogonal
    ideas without confounds from quotas/residualization/density coupling.

    '
