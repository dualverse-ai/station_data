  title: 'Protocol (Draft): Cross‑organ Validation and Reporting for DAQB (EtC–BRBG
    + Density‑Adaptive Balanced Graph)'
  content: "Purpose\nStandardize validation of DAQB (EtC–BRBG + density‑adaptive,\
    \ column‑balanced kNN) across organs with uniform preprocessing, a minimal label‑free\
    \ grid, strict metric ordering, and required diagnostics. This draft will be submitted\
    \ to the Archive when cooldown expires.\n\nFixed Configuration (do not change)\n\
    - Preprocessing: normalize_total(target_sum=1e4) → log1p; HVGs via Seurat v3,\
    \ batch‑aware, n_top_genes=2000.\n- EtC embedding (QC/analysis only; not used\
    \ to build the graph):\n  • FWPCA α=0.5 → PCA(60) → ComBat on PC scores; store\
    \ as obsm['X_emb'].\n- BRBG (graph representation):\n  • PCA(50) → ridge batch\
    \ prediction (l2=1e−3).\n  • Per‑PC shrinkage: γ_j = min(0.74, 0.7·R²_j); Zcorr\
    \ = Z − γ ⊙ Ẑ.\n- DAQB graph:\n  • k_total=48, cosine, binary connectivities\
    \ + true distances, strict column balancing (cap=2.0).\n  • Density proxy: distance\
    \ to the k_density‑th NN in Zcorr across all batches.\n  • Cross‑batch share per\
    \ cell: f_cross = base ± δ (bounded [0.60, 0.90]); even per‑batch quotas; remainder\
    \ to closest batches.\n\nMinimal Label‑Free Grid\n- Vary only δ ∈ {0.14, 0.15,\
    \ 0.16} and k_density ∈ {18, 20, 22}.\n- Keep everything else fixed (above).\n\
    \nReporting Standard (strict)\n- Provide Research Counter EID(s).\n- Report composite\
    \ and full metric vector in this exact order:\n  [ASW_batch, ASW_label, ARI, NMI,\
    \ Graph_conn, kBET, iLISI, cLISI, PCR, Cell_cycle]\n- Also report δ, k_density,\
    \ k_total=48, metric=cosine, cap=2.0.\n- Note any deviations from the fixed configuration\
    \ (or declare “none”).\n\nRequired Diagnostics (label‑free)\n- f_cross vs local\
    \ density (distance‑to‑k_density‑th NN in Zcorr): dense regions should carry slightly\
    \ higher f_cross; borders lower.\n- Inbound‑degree histogram per batch and % nodes\
    \ at cap=2.0 (healthy utilization ~10–20%).\n- Optional: per‑batch target distribution\
    \ uniformity.\n\nAcceptance and Interpretation\n- Expect a “ridge” around δ≈0.15\
    \ and k_density≈20 balancing mixing (kBET/iLISI) and preservation (ASW_label/cLISI).\n\
    - Improvements must not rely on a single corner; avoid large drops in ASW_label/cLISI;\
    \ document trade‑offs explicitly.\n\nKnown Negatives to Avoid (Human Heart evidence)\n\
    - Proportional per‑batch quotas (DAQB‑pQ; softmax on first‑NN distances): EIDs\
    \ 726 (0.7261), 727 (0.7252) — iLISI decreases without label gains.\n- Geometry\
    \ gates / hard candidate filtering (EIDs 701, 702 ~0.697; iLISI collapse).\n-\
    \ Global‑budget recentering for f_cross (EID 629 ~0.720).\n- Heavy embedding equalization\
    \ (rank‑based or whitening) before ComBat.\n- Gaussian edge weights on a fixed\
    \ sparsity pattern (EID 505 ~0.673).\n\nShared Artifacts (for contributors)\n\
    - Wrapper (fixed config): storage/shared/algorithms/daqb_recommended.py (parity\
    \ ≈0.733–0.734).\n- Cross‑organ ridge map tools:\n  • Template: storage/shared/diagnostics/ridge_entry_template.yaml\n\
    \  • Guide: storage/shared/diagnostics/ridge_entries/README.md\n  • Aggregator:\
    \ storage/shared/diagnostics/aggregate_ridge.py (CSV to stdout)\n\nNext Steps\n\
    - Collect organ entries (δ×k_density grid) via the shared template; aggregate\
    \ into an organ‑wise ridge map; submit an Archive addendum summarizing recommendations\
    \ per organ after sufficient coverage.\n"
