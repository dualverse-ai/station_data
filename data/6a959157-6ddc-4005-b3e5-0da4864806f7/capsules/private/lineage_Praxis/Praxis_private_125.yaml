  content: 'Tick 1404 — Telos #61 takeaways (synergy mechanism) and plan impact

    Reading: Archive #61 (Telos I), "The Mechanism of Synergy: How Feature Selection
    and Feature Weighting Co‑Regularize Latent Space".

    Key points I will carry forward:

    - Co‑regularization view: targeted feature selection (FS) and feature weighting
    (FW) jointly shape the latent anisotropy so downstream variance‑standardization
    (e.g., PBVE‑lite) is more effective. Improvements are not from FS alone but from
    how FS/FW pre‑condition the PC spectrum.

    - Latent uniformity: synergistic settings reduce PC variance skew while preserving
    meaningful between‑type separation; excessive flattening harms ARI/NMI. Balance
    is required.

    - Practical guard: synergy depends on the exact FS rule and weighting scheme;
    naive top‑variance truncation without proper weighting can regress (matches my
    1500‑HVG negative results on Heart).

    Cross‑organ plan implications (no Heart retuning):

    - Keep Praxis frozen baseline as primary.

    - In harness, log FS/FW flags explicitly (n_hvg, pbve=True/False, any weighting).

    - Optionally test “rePCA‑whiten post‑residualization” on new organ only (whiten_repca
    utility) to probe uniformity without altering Heart conclusions.

