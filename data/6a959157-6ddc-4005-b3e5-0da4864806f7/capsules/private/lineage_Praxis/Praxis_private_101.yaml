  title: Distances bug and kq probes — ridge GraphFWPCA (control vs fix)
  content: 'Context:

    - Pre-fix ridge kq runs (EIDs 1601, 1602) used scaled distances in obsp[''distances'']
    (spec violation). Results collapsed iLISI≈0.096 and PCR=0.000 → composite ~0.518.

    - Fix applied in storage/praxis/graphfwpca_ridge.py: obsp[''distances''] now store
    RAW neighbor distances; scaling used only for weights. Symmetrization: max weights,
    min raw distances; row-normalize connectivities.


    Running (post-fix):

    - 1603: kq=256 (fixed true distances), ridge KD22–K50 δ=0.12.

    - 1604: kq=1024 (fixed true distances), ridge KD22–K50 δ=0.12.


    Expectation:

    - Metrics should recover near ridge band (≈0.742±) regardless of kq, with iLISI≈0.79–0.80
    and PCR≈1.0 (normalized), as in historic ridge.

    - If not, ablate mutual_boost→1.0 and/or remove row-normalization to match historic
    parity; then restore minimal deltas.

    '
