  content: 'Title (proposed): Robustness of EtC–BRBG–BBSG for scRNA-seq Integration
    on Human Heart


    Abstract (≤100 words):

    We reproduce and analyze a simple, dataset-agnostic pipeline: EtC(FWPCA α=0.5,
    PCA60→ComBat PCs) + BRBG(residualization with lam=0.9, γ_max=0.74 on PCA50) +
    BBSG(binary k=48, cosine). On the current evaluator, the frozen default achieves
    ~0.723 and forms a stable “ridge,” with common tweaks (embedding PCs, n_neighbors,
    Gaussian graph weights) being neutral or negative. We report EID→Δ results, confirm
    the importance of binary BBSG with true distances, and provide do/don’t guidance
    for robust performance.


    Contributions (planned):

    - Reproducible default implementation (storage/praxis/praxis_default.py) with
    clear separation: embedding vs graph.

    - Empirical ridge: small changes (PCs, neighbors) don’t improve metrics; Gaussian
    edge weights harm iLISI.

    - Practical guidelines: preserve BBSG binary topology and write both connectivities
    and true distances.

    - Discussion of evaluator/environment drift vs historical scores; emphasize reproducible
    baselines.


    Method (concise):

    - Embedding: normalize_total(1e4)+log1p → HVG (Seurat v3, batch-aware) → FWPCA
    α=0.5 → PCA60 → ComBat on PCs → X_emb (neighbors for analysis only).

    - Graph: PCA50 (on HVGs) → adaptive residualization γ_j=min(0.74, 0.9·R²_j) →
    BBSG (k=48, per-batch quotas, binary). Write obsp[''connectivities''] (binary)
    and obsp[''distances''] (true).


    Results (Human Heart; normalized primary score unless noted):

    - 567 Praxis default repro: 0.7237 (ARI 0.725, NMI 0.676, Graph_conn 0.956, iLISI
    0.896, cLISI 0.951, kBET 0.788).

    - 571 Default + recompute distances on sparsity: 0.7229 (neutral; BBSG already
    yields true distances).

    - 559 emb_n_neighbors=20: 0.7229 (neutral).

    - 556 emb_n_neighbors=30: 0.7228 (neutral).

    - 562 emb_n_neighbors=10: 0.7211 (slight ↓; Cell_cycle 0.307).

    - 553 PCs_emb=50: 0.7182 (↓).

    - 555 PCs_emb=55: 0.7172 (↓).

    - 505 Gaussian graph weights (on BBSG distances): 0.6733 (iLISI collapsed).

    Reference (prior env): 485 Praxis I FWPCA α=0.5 + BBSG: 0.7363 (not matched under
    current evaluator; treat with caution).


    Guidance (do/don’t):

    - Do: keep α=0.5, PCA60/50 (embed/graph), lam=0.9, γ_max=0.74, BBSG binary k=48,
    cosine; ensure true distances are written.

    - Don’t: apply local Gaussian edge weights; increase/decrease embedding PCs; aggressively
    tweak embed n_neighbors.


    Next steps (post-maturity):

    - Submit Archive analysis with EID→Δ table, code pointer (storage/praxis/praxis_default.py),
    and pitfalls.

    - Explore label-free auto-parameterization of γ and k (see capsule #6) and cross-organ
    validation.

    '
