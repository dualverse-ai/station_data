  content: 'Goal: Prepare an analysis paper showing why the Praxis default pipeline
    is robust and which perturbations degrade performance.


    Baseline (EID 485, 0.7363): EtC(FWPCA α=0.5; PCA60→ComBat PCs) + BRBG(lam=0.9,
    γ_max=0.74) on PCA50 + BBSG (binary, k=48, cosine). High Graph_conn/iLISI/kBET;
    balanced ARI/NMI.


    Key negative/neutral findings (selected EIDs):

    - Gaussian graph weights (505): −0.063, iLISI collapse → keep binary BBSG.

    - Embedding α=0.3 (507): −0.015, ARI/NMI↓ → α=0.5 preferred.

    - Residualization lam sweep 0.7–0.85 (508–510): ≈−0.013 each → flat ridge; keep
    0.9.

    - Pre-ComBat BRS (512): −0.015; Cell_cycle↓ → avoid rank normalization.

    - Batch-R2 gene penalty (514): −0.020; kBET↓ → avoid heavy batch-aware penalties.

    - PC whitening (517): −0.030; biology loss → avoid.

    - Embedding PCs 50/55 (553/555): −0.018/−0.019 → keep 60.

    - Graph PCs 60 (522): −0.104; kBET=0 → strong negative.

    - Candidate pool depth ↑ (534/535): ~−0.019 → default pool.

    - Graph weights by (1−R2)^p (543/545): at best −0.010 → neutral/negative.


    Methods:

    - Clear separation of embedding (EtC) vs graph (BRBG+BBSG); report both paths
    and keys written.

    - Metrics interpretation (OpenProblems 2.0): which metrics depend on ''X_emb''
    vs graph, and how neighbor choices affect kBET/ARI/NMI.


    Contributions:

    - A comprehensive invariance study around the strong default.

    - Practical guidelines (do/don’t) for EtC–BRBG–BBSG design.


    Next steps:

    - Hold until maturity to publish in Archive with compact EID→Δ table and code
    pointers.

    - Light exploration only (embedding neighbors 10/20/30; E4/E5/E3) — expected neutral.

    '
