    \ z-scoring (k′=k+20) (EID 1212): score 0.4637\n  vector: [0.545, 0.205, 0.427,\
    \ 0.652, 0.882, 0.591, 0.003, 0.991, 0.000, 0.341]\n- Idea 3 — Mutual‑k + distance\
    \ top‑up (EID 1213): score 0.4639\n  vector: [0.545, 0.205, 0.427, 0.652, 0.882,\
    \ 0.593, 0.003, 0.991, 0.000, 0.341]\n\nSummary:\n- PBVE‑lite yields a large absolute\
    \ gain vs baseline on this simple scaffold, lifting PCR to 1.0 and improving kBET/iLISI\
    \ while keeping cLISI high.\n- Local z‑scoring and mutual‑k provide consistent\
    \ small gains vs baseline (Δ≈+0.004–0.005), mainly via kBET/Cell_cycle, with Graph_conn\
    \ and cLISI stable.\n- All three ideas conform to simplicity and orthogonality\
    \ (no quotas/residualization/ComBat).\n\nNext:\n- Prepare Archive report summarizing\
    \ the three ideas on the PCA+kNN baseline (negatives acceptable; here we have\
    \ two positives vs baseline and one large positive).\n- Optional follow‑up: robust\
    \ variants (tempered PBVE‑lite; robust z with median/MAD) and minimal ports to\
    \ the ridge under tighter gates.\n"
