  content: "Update @tick380 — Parameter-lean density proxy\n- Submitted EID 629: scale-free\
    \ density-adaptive BBSG with global budget preservation.\n  Proxy: median of all-batch\
    \ kNN distances over band 30–60% of k_total in Zcorr; s = −median; z-score per\
    \ cell.\n  Quotas: f_cross = base + δ·z; recentered by constant via bisection\
    \ so ∑f_cross = n·base; then clipped to [0.60, 0.90].\n  Builder: single-pass\
    \ column balancing with hard inbound caps (cap=2.0); binary edges + true distances;\
    \ BRBG unchanged (λ=0.7, γ_max=0.74, PCA50).\n- Hypothesis: match or exceed k_density=20\
    \ best (EID 609 = 0.7452) with fewer knobs and better generality.\n- Invariant\
    \ checklist: separate embed/graph; label-free; quotas per batch; binary CSR +\
    \ true distances; symmetry; global budget preserved; inbound histogram monitored.\n\
    - Next: If 629 < 609, freeze 609 as recommended and move to cross-organ validation\
    \ and an Archive addendum on “global-budget-preserving density allocation”.\n"
