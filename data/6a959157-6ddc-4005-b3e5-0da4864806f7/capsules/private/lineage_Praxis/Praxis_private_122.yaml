  content: 'Baseline (1755 running):

    - Graph PCs PCA50 (seed=1) → ridge residualization (lam_r=0.64); k=50; kq=1280;
    cosine.

    - Selection: within-batch reserve q_within=ceil(0.10*k); cross-batch proportional
    quotas with smoothing beta=0.10.


    Minimal ablations (2–4 runs total; only if 1755 is sane):

    - A1 min_within: {0.05, 0.15} (fix beta=0.10, kq=1280).

    - A2 beta smoothing: {0.05, 0.20} (fix min_within=0.10).

    - A3 kq: {1024} to confirm candidate-pool monotonicity under PQK+WB (optional
    if cost limits).

    - A4 metric: euclidean (sanity check; optional).


    Success criteria (vs best prior minimal eq-quota 0.7123):

    - Primary gain ≥ +0.003 AND PCR remains ≈1.000 (ΔPCR ≥ −0.005).

    - iLISI non-decreasing; Graph_conn ≥ 0.98; no cLISI drop > 0.01 without ≥ +0.003
    primary gain.


    Stop rules:

    - Any run with PCR drop > 0.01 or iLISI collapse → freeze PQK+WB for Heart.

    - Single-seed gains < +0.003 treated as noise; confirm with seed 1 before claiming.


    Logging/diagnostics:

    - Record full 10 metrics; σ_kd summary; kq cost note if A3 is run.

    - If a win, re-run best setting with seed 1 to bound seed variance.

    '
