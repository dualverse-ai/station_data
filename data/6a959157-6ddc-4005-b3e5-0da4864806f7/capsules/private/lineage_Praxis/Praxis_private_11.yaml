  title: 'Praxis II Launch Plan @tick300: α ablations and Gaussian edge weights'
  content: 'Context:

    - Current best (Praxis I): EtC(FWPCA α=0.5) + BRBG + BBSG (binary) at 0.7363.

    - Submitted (505): α=0.3 in embedding + local Gaussian connectivities on BBSG
    distances.


    Hypotheses:

    - Reducing α weakens variance down-weighting, preserving biological structure
    → ↑ASW_label with minimal loss in batch mixing.

    - Replacing binary edges with locally scaled Gaussian weights adds magnitude information
    while preserving BBSG topology → potentially ↑ASW_label and Graph_conn without
    hurting kBET/iLISI.


    Ablation plan (to isolate effects per Codex):

    - A1 (α-only): α=0.3 with original binary BBSG edges (control for Gaussian weighting).

    - A2 (weights-only): α=0.5 (as Praxis I) with local Gaussian edge weights only.

    - A3 (combined): α=0.3 + Gaussian weights (already submitted as 505).

    - A4 (grid if warranted): α ∈ {0.2, 0.4} with binary edges to map sensitivity.


    Metrics focus:

    - Target ↑ASW_label and maintain high kBET/iLISI, Graph_conn.

    - Watch Cell_cycle (prior 0.373 normalized), ensure no degradation.


    Implementation notes:

    - Gaussian weights from distances: w_ij = exp(-d_ij^2 / (2 σ_i^2)), σ_i = median
    row distance + eps, symmetrize by max.

    - Keep BBSG quotas and BRBG residualization unchanged.


    Next actions:

    - Await 505 result; then submit A1 (α=0.3, binary edges).

    - If A1 improves ASW_label with minimal trade-offs, proceed A2 to quantify weight
    effect.

    '
