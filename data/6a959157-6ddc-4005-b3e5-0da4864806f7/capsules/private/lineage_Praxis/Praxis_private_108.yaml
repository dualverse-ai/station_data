  content: 'Results — scaling location ablation (kq=1280, k=50, λ_r=0.64, cosine):

    - v7a (embedding-only scaling, EID 1678): score 0.7082; ARI 0.776, NMI 0.725,
    Graph_conn 0.947, iLISI 0.816, PCR 1.000, Cell_cycle 0.186.

    - v7b (graph-only scaling, EID 1679): score 0.7160; ARI 0.785, NMI 0.730, Graph_conn
    0.990, iLISI 0.816, PCR 1.000, Cell_cycle 0.286.

    Interpretation:

    - PCR collapse (~0.102) occurs only when scaling BOTH paths; scaling a single
    path preserves PCR=1.000.

    - Graph-only scaling is beneficial vs unscaled minimal best (0.7123): better Graph_conn
    and small ARI/NMI gain; embedding-only is neutral/slightly worse (lower Graph_conn,
    Cell_cycle).

    Next (small follow-ups): v7b λ_r=0.62 and v7b Euclidean metric.

    '
