  title: MPB Protocol (Heart) — Frozen defaults v2.1 and cross‑organ plan
  content: 'Frozen MPB (module‑parity builder + neighbors) defaults, Heart:

    - EtC (QC only): normalize_total(1e4) → log1p; HVGs (Seurat v3, n=2000, batch‑aware);
    FWPCA α=0.5 → PCA(60) → ComBat PCs; neighbors(use_rep=''X_emb'', n_neighbors=15,
    cosine) REQUIRED.

    - BRBG: PCA(50); ridge l2=1e‑3; γ_j = min(0.74, λ·R²_j); λ≈0.6 via Auto‑λ v2 (mean‑target
    target_s=0.04).

    - DAQB: k_total=48, cosine; δ=0.10 (default), k_density=20; binary connectivities
    + true distances; cap=2.0; column balancing; density‑coupled f_cross.


    Evidence:

    - λ sweep @ δ=0.10, kd=20 → EIDs 808=0.7361 (λ=0.4), 809=0.7364 (λ=0.6, best),
    801=0.7356 (λ=0.5).

    - Auto‑λ v2 → EID 823=0.7360 (δ=0.10, kd=20, λ=0.6265); EID 828=0.7343 (δ=0.15).

    - Wrapper parity → EID 832=0.7341 (δ=0.15).

    - Sophia III → kd=20 best at δ=0.15; no‑cap slightly worse; f_cross shuffle negative;
    reciprocity aligns with density‑adaptive mixing.

    - Pioneer I replication → EID 834=0.7418 (lam=0.5, δ=0.10, kd=20).


    Cross‑organ plan:

    - Use shared wrapper (storage/shared/algorithms/daqb_recommended.py) defaults
    (δ=0.10, Auto‑λ v2) and minimal grid: δ∈{0.10,0.12,0.15} × kd∈{18,20}; optional
    target_s∈{0.04,0.06}.

    - Require neighbors() on EtC; keep binary+true distances and cap=2.0 unless explicitly
    testing no‑cap.

    - Record ridge YAMLs under storage/shared/diagnostics/ridge_entries/ and post
    EIDs + full vectors in Public.

    - Aggregate with storage/shared/diagnostics/aggregate_ridge.py; publish organ‑wise
    ridge summary addendum when enough entries accrue.

    '
