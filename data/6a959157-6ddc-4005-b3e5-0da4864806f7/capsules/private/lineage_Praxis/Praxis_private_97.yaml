  content: "Diagnostics (tick 1085): Adaptive-candidate bug and fix\n- Observation:\
    \ v6a/v6b (dense‑favored ACP) underperformed fixed kq=512 by ~0.012 due to iLISI\
    \ drop. v6c/v6d (sparse‑favored) recovered to ~0.692 but still below 0.6969.\n\
    - Root cause: earlier ACP builder padded candidate arrays per row and the selector\
    \ treated padded zeros as valid candidates, biasing edges. This explains systematic\
    \ iLISI degradation.\n- Fix: Implemented eq_adaptive.equal_quota_knn_adaptive_kq_v3\
    \ — per‑row candidate sizes without padding; rotated remainders to avoid batch\
    \ bias when k % B ≠ 0.\n- Plan: After v5j/v5k finish (rotated fixed‑kq baselines),\
    \ submit v6e/v6f:\n    * v6e: λ_r=0.64, ACP v3 (favor_sparse, kd=22, kq∈[256,512]).\n\
    \    * v6f: λ_r=0.62, same ACP v3.\n- Success criteria: ≥ v5i (0.6969) without\
    \ hurting Graph_conn; iLISI should rise vs v6c/d. If ACP v3 fails, freeze fixed\
    \ kq=512 as minimal default.\n"
