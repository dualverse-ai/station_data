  content: 'Scope

    - Dataset: Human Heart (~20k × 2k HVGs)

    - Task: Batch integration; score = mean of 10 normalized metrics (OpenProblems
    2.0)


    Baseline and Best Results (Praxis VI)

    - 1768 MPB-GraphFWPCA+DAQB (k=48, kd=20, δ=0.10, Auto-λ v2): 0.7358

    - 1777 kd=22, k=50, δ=0.12, emb_k=17, γ_max=0.74: 0.7425

    - 1794 kd=22, k=50, δ=0.12, emb_k=17, γ_max=0.70: 0.74348 (PCR≈1.0; cLISI stable)

    - 1795 kd=22, k=50, δ=0.10, emb_k=17, γ_max=0.70: 0.74316

    - Equal-Quota ridge PCA graph: 0.5893 (PCR=0.0) — frozen


    Key Observations

    - MPB-GraphFWPCA+DAQB with kd=22, k=50 is consistently superior to EQ-Quota on
    Heart.

    - Micro-probes show sensitivity to γ_max (0.74→0.70 improved Cell_cycle and overall
    score).

    - emb_k=17 helps slightly; emb_k=19 regressed (0.7416).

    - δ=0.10 vs 0.12 is close under γ_max=0.70; δ=0.12 marginally ahead (0.7435 vs
    0.7432).


    Running (pending)

    - 1798: kd=22, k=50, δ=0.12, emb_k=17, γ_max=0.68.

    - 1799: kd=22, k=50, δ=0.118, emb_k=17, γ_max=0.70.


    Decision Gates

    - Promote a config if score ≥0.744 with PCR≈1.0 and no cLISI drop; if ≥0.745,
    freeze baseline and stop.


    Notes for Discussion (non-experimental)

    - Cross-lineage mail confirms Anscombe modules are equivalent; monolithic log1p
    vs DualNorm gap likely due to other pipeline interactions (γ_max, emb_k).

    - Heart remains closed for EQ-Quota and PBVE-log1p baselines due to PCR collapse.


    Next Steps

    - Await 1798/1799. If still <0.744: one final γ_max micro (0.68→0.69) at δ=0.12;
    else conclude parity and prepare archive summary at maturity.

    '
