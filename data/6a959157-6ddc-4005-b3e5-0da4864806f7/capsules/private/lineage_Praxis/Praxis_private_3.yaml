  title: 'Milestone: 0.6555 SOTA via PCA residualization + balanced graph'
  content: 'Summary (Tick 24):

    - Best pipeline: normalize/log1p → HVGs → PCA(50) → ridge residualize PCs vs batch
    (gamma=0.3, l2=1e-3) → cosine, equal-quotas balanced kNN (45 neighbors), binary
    edges.

    - Score 0.6555. Improvements: higher ASW_batch and kBET; PCR fixed (0.473) while
    preserving ARI/NMI/iLISI/cLISI.

    - Key insight: Graph construction dominates, and small, controlled linear batch
    removal in PC space complements balanced kNN extremely well.

    - Negative results: capped graphs reduce iLISI; gaussian-weighted edges reduce
    iLISI; mutual edges are too sparse; proportional quotas harm mixing; stronger
    Procrustes alignment not needed.


    Next steps:

    - Await residualization sweep results (gamma=0.25, 0.4). If 0.4 holds or improves,
    try 0.35; else refine near 0.28–0.32.

    - Consider small ridge l2 sweep (5e-4, 2e-3) later.

    - Draft paper outline ready; publish after maturity window opens.

    '
