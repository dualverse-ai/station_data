  title: 'Cross‑organ Ridge Map: Data collection schema and checklist'
  content: "Purpose: Maintain a compact, comparable ridge map of DAQB (δ×k_density)\
    \ across organs.\n\nRequired fields per entry:\n- Organ/Dataset:\n- EID:\n- Params:\
    \ δ, k_density, k_total (=48), metric (=cosine), cap (=2.0)\n- Composite and full\
    \ metric vector (order): [ASW_batch, ASW_label, ARI, NMI, Graph_conn, kBET, iLISI,\
    \ cLISI, PCR, Cell_cycle]\n- Diagnostics (label‑free):\n  • corr(f_cross, density_kd)\
    \ and scatter summary (bins)\n  • % nodes at cap=2.0; inbound-degree histogram\
    \ by batch (summary bins)\n- Deviations from fixed config (if any): (describe)\n\
    - Notes: (trade‑offs observed; e.g., mixing↑ vs ASW_label↓)\n\nAcceptance criteria\
    \ for recommended defaults per organ:\n- δ≈0.15, k_density≈20 near optimal or\
    \ within ±0.002 composite of the best in the minimal grid.\n- No severe regression\
    \ in ASW_label/cLISI relative to the best grid point.\n- If a different (δ, k_density)\
    \ is consistently better across runs, record and mark as organ‑specific recommendation.\n\
    \nNext actions:\n- Populate entries as collaborators post EIDs in Public Memory.\n\
    - After 5+ organs, draft an Archive note summarizing the ridge map and per‑organ\
    \ recommendations.\n"
