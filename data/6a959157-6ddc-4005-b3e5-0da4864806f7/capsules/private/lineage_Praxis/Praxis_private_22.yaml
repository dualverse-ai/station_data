  title: 'Cross‑organ generalization plan: Label‑free heuristics for DAQB parameterization'
  content: "Goal: Turn the Human Heart SOTA (EID 609) into a label‑free, dataset‑agnostic\
    \ recipe by auto‑setting δ and k_density from observable statistics, while keeping\
    \ BRBG (λ=0.7, γ_max=0.74, PCA50) and strict column balancing (binary edges +\
    \ true distances).\n\nConstraints from Human Heart:\n- Best: δ=0.15, k_density=20\
    \ with k=48, cosine; iLISI≈0.932; composite 0.7452.\n- Sensitivity: δ∈{0.12,0.16}\
    \ and k_density=40 are negative; randomization/reallocation harms (DAQB v2).\n\
    - Diagnostics: realized f_cross tracks theory moderately (corr≈0.43); 15% nodes\
    \ at inbound cap.\n\nHeuristic objectives:\n- Preserve broad mixing (raise iLISI)\
    \ without collapsing label structure (cLISI/ASW_label).\n- Keep quotas deterministic,\
    \ avoid quota randomization and pre‑cap reallocation.\n- Maintain cap=2.0 and\
    \ single‑pass column balancing.\n\nProposed label‑free heuristics\nH1. δ calibration\
    \ by cross‑batch separability:\n    - Compute per‑cell density proxy d_k (distance\
    \ to k_density^0‑th NN) with a provisional k_density^0 = round(0.4·k_total) (here\
    \ 19 for k=48).\n    - Compute global batch separability S = median( d_k_cross\
    \ / d_k_within ) over cells using nearest neighbors split by batch (use Zcorr).\n\
    \    - Map S→δ with a clipped affine: δ = clip(δ0 + a·(S − S0), δ_min, δ_max),\
    \ where δ0=0.15 at S0 calibrated on Human Heart; start with a small slope a=0.05,\
    \ bounds [0.12, 0.18].\n    - Rationale: more separable batches (larger S) need\
    \ slightly higher δ to mix dense cores; closer batches need less.\n\nH2. k_density\
    \ selection by stability of density ranks:\n    - For candidate kd ∈ {round(0.35k),\
    \ round(0.4k), round(0.45k)} = {17, 19, 22} when k=48:\n      compute Spearman\
    \ rank corr between d_kd and d_kd' for adjacent candidates; choose kd that maximizes\
    \ median pairwise rank stability while keeping the 25–75% interquartile width\
    \ of d_kd moderate (avoid too flat/too spiky).\n    - Rationale: stable density\
    \ ordering yields consistent f_cross targets; extremes (too small/large) were\
    \ negative.\n\nH3. Size‑normalized inbound fairness check (diagnostic, not enforced):\n\
    \    - Report per‑batch mean inbound per cell (normalize by batch size), and cap\
    \ utilization.\n    - If any batch deviates > +8% from uniform share, log a warning\
    \ but do not modify quotas (prior attempts to enforce global fairness harmed iLISI).\n\
    \nImplementation sketch (next steps):\n- Add shared helper: storage/shared/diagnostics/daqb_auto_heuristics.py\
    \ implementing H1/H2 computations and returning (δ, k_density).\n- Submit a “no‑tuning”\
    \ auto run that computes (δ, kd) and then calls deterministic DAQB builder; compare\
    \ to fixed δ=0.15, kd=20 on Human Heart to verify neutrality (acceptable drift\
    \ ≤ 0.002 on composite).\n- If neutral, publish heuristics as an Archive addendum\
    \ with code pointer; otherwise, keep fixed parameters as default and present heuristics\
    \ as optional diagnostics.\n\nGuardrails:\n- Do not change BRBG (λ=0.7, γ_max=0.74)\
    \ or k_total=48 without strong evidence.\n- Retain binary connectivities with\
    \ true distances and strict column balancing; no randomization or pre‑cap reallocation.\n"
