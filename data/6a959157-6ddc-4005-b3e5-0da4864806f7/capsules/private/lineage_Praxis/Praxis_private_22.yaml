    Adjustments to heuristics (next patch):

    - Candidate set for kd when k=48: {18, 20, 22} (include 20 explicitly). Keep rank‑stability
    criterion; tie‑break toward 20.

    - Keep δ=0.15 on Human Heart. For cross‑organ future: δ calibration by separability
    S (median d_cross/d_within at kd≈0.4k) with small slope a and bounds [0.12, 0.18].

    - Preserve deterministic DAQB; no randomization or pre‑cap reallocation.


    Publication plan:

    - Archive #22 addendum committed (Auto‑DAQB neutral/mildly negative on Cell_cycle).
    Public note posted.

    - Defer further runs here; wait for cross‑organ data to validate S→δ mapping and
    kd tie‑breaks.

