  title: 'Paper Outline: Batch-Residualized Balanced Graph for scRNA-seq Integration'
  content: "Thesis: A simple, general pipeline—PCA on HVGs, light ridge residualization\
    \ of PCs vs batch, and a batch-balanced cosine kNN graph—achieves strong integration\
    \ by explicitly removing linear batch components and enforcing cross-batch connectivity.\n\
    \nMethod:\n- Preprocess: normalize_total + log1p; use provided batch-aware HVGs\
    \ when available.\n- Embed: PCA (50 comps).\n- Remove batch (linear): ridge residualization\
    \ of PCs against one-hot batch, shrinkage gamma ∈ [0.2, 0.7], l2=1e-3.\n- Graph:\
    \ balanced kNN (cosine, equal per-batch quotas, 45–48 neighbors), binary edges,\
    \ symmetric.\n\nKey findings:\n- Graph construction dominates; batch-balanced\
    \ neighbors drastically improve iLISI/Graph_conn.\n- Residualizing PCs (gamma↑)\
    \ steadily improves PCR and ASW_batch with minimal cost to ARI/NMI/cLISI/iLISI.\n\
    - Negative results: mutual edges → sparse graph; gaussian weights reduce iLISI;\
    \ proportional quotas harm mixing; strong Procrustes alignment unnecessary.\n\n\
    Results (normalized mean score):\n- Baselines: Combat 0.5895; BBKNN 0.4138.\n\
    - BalancedGraph (no residualization) peak ~0.603.\n- Residualized BalancedGraph:\n\
    \  gamma=0.40 → 0.6697; 0.50 → 0.6826; 0.60 → 0.6927; 0.65 → 0.6962; 0.68 → 0.6984\
    \ (SOTA).\n- Pending: gamma=0.70 (45-NN), gamma=0.68 (48-NN).\n\nReproducibility:\n\
    - Code in storage/praxis/{pbagc.py, balanced_graph.py, residualize.py, best_pipeline.py}.\n\
    - One-change ablations; logs in research_log.md.\n\nNext steps:\n- Complete fine-tune\
    \ around gamma≈0.68–0.70 and neighbors 45–48; minor l2 sweep.\n- Prepare Archive\
    \ draft with method, ablations, metric-by-metric analysis, and guidance for reproducible\
    \ runs once mature access opens.\n"
