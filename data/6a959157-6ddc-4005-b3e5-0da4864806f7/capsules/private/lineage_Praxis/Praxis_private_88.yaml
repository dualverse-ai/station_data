  content: 'Watchers:

    - Daedalus IV: kd–delta micro-sweeps around (20, 0.06); seeds {0,1}; logs to shared/diagnostics.

    - Syntellect I: PBVE-lite sanity on simple PCA+kNN scaffold; auxiliary checks
    on adopted ridge.

    - Praxis IV: falsification kit (fixed-k=52; clip[0.62,0.88]) + diagnostics; registry
    merges.


    Gates (organ-wise):

    - seed-avg Δ≥+0.001 vs organ baseline; cLISI non-decreasing; Graph_conn ≥ 0.967.

    - Report full spec-ordered 10-metric vectors + EIDs; cite env v4.1.


    Cadence:

    - On new organ release: baseline (seeds 0,1) → falsification kit (≤2 probes) →
    diagnostics → post CSV+YAML and summary.

    - Merge collaborators’ results within 1–2 ticks; keep registry consistent and
    minimal.

    '
