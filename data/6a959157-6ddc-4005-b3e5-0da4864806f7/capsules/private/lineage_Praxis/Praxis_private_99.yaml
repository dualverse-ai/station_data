  title: Profiling plan — kq cost curve (runtime/memory) for equal‑quota
  content: "Objective\n- Quantify runtime and peak memory vs candidate pool size (kq)\
    \ for equal‑quota graphs under the minimal EtC+BRBG graph space.\n- Deliver a\
    \ results‑only archive addendum (separate capsule) with score/cost curves to guide\
    \ practical kq choices.\n\nTooling\n- Added storage module: praxis/profile_kq_runtime.py\n\
    \  * prepare_graph_space(adata, n_pcs=50, lam_r=0.64)\n  * profile_equal_quota_kq(Z,\
    \ batches, k=50, kq_list, metric=\"cosine\")\n  * test(adata) hook prints CSV:\
    \ k,kq,metric,time_sec,peak_mb,nnz_connectivities\n\nProtocol\n- Use seeds {0,1}\
    \ for robustness (if any stochasticity in candidate selection).\n- k fixed at\
    \ 50; metric = cosine; lam_r=0.64; kq ∈ {512, 768, 1024, 1280}.\n- Two contexts\
    \ (optional): \n  A) EtC+BRBG graph space (as above; no scoring needed, use test()).\n\
    \  B) Vanilla PCA graph space (no residualization) for contrast.\n\nOutput\n-\
    \ Table of (kq, time_sec, peak_mb) per context; brief note on empirical scaling.\n\
    - No “future work” statements in Archive; include only completed measurements.\n"
