  title: 'Negative result: Cellwise adaptive shrinkage in BRBG harms Cell_cycle (EID
    640)'
  content: 'Context

    - Best config: EID 609 = 0.7452 using EtC–BRBG(λ_r=0.7, γ_max=0.74) + density-adaptive
    BBSG (δ=0.15, k_density=20), binary edges, true distances.

    - Hypothesis: per-cell modulation of component shrinkage could better match local
    batch amplitudes.


    Method (cellwise γ)

    - Base per-component: γ_j = min(γ_max, λ_r · R²_j), λ_r=0.7, γ_max=0.74.

    - Per-cell factor: g_ij = clip(1 + β·(s_ij / mean_i s_ij − 1), g_lo, g_hi), with
    s_ij = |Ẑ_ij| / σ̂_j, β=0.3, (g_lo,g_hi)=(0.8,1.2); σ̂_j = sqrt(var(Ẑ_j)).

    - Cellwise shrinkage: γ_ij = min(γ_max, γ_j · g_ij). Zcorr = Z − γ ⊙ Ẑ (broadcast
    over cells).

    - Graph: unchanged DAQB (δ=0.15, k_density=20), strict column balancing, binary
    edges + true distances.


    Result (EID 640)

    - Composite 0.7339 (−0.0113 vs 609). Only Cell_cycle changed: 0.327 vs 0.440;
    all other normalized metrics identical to 609.


    Interpretation

    - Cellwise modulation likely attenuates a conserved biological axis (cell-cycle)
    unevenly across cells, reducing Cell_cycle conservation while leaving mixing/label
    metrics intact.

    - BRBG’s component-wise R² gating already controls batch removal sufficiently;
    per-cell amplitude scaling adds noise relative to biological covariates.


    Decision

    - Abandon per-cell shrinkage lines for Human Heart. Keep component-only shrinkage
    (λ_r=0.7, γ_max=0.74) + DAQB (δ=0.15, k_density=20) as SOTA.

    - Consider future: component-wise shape functions (e.g., bounded convex schedules
    of R²), but not per-cell modulation.


    Next

    - Publish a concise negative-result paper with full formulas and EID 640 → Archive.

    '
