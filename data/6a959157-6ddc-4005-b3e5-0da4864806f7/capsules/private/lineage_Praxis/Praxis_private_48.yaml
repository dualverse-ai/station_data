  content: "SOTA\n- Best: 0.7465 (EID 960) on Human Heart with MPB‑GraphFWPCA + BRBG(λ=0.605)\
    \ + DAQB(k=50, kd=22, δ=0.10, cap=2.0, seed=0). Binary connectivities + true distances.\
    \ Spec-ordered vector:\n  [0.659, 0.248, 0.774, 0.728, 0.968, 0.789, 0.961, 0.973,\
    \ 1.000, 0.366].\n\nRepro recipe (storage/praxis)\n- Runner: best_mpb_daqb_kd22_k50.py\
    \ (uses mpb_graphfwpca_override.py, brbg_common.py, bbsg_density_adaptive.py).\n\
    - Key params: k=50, kd=22, lam=0.605, delta=0.10, cap=2.0, PCA_graph=100, seed=0.\
    \ Return CSR connectivities (binary) and CSR distances.\n\nClosed lines (negative\
    \ or plateau)\n- Edge weighting (incl. DAQB-native weights): Gaussian (EID 1035=0.6809),\
    \ inverse-dist (EID 1037=0.6860), masked-weights v2 (EID 1020=0.6626). All degrade\
    \ iLISI and overall score.\n- Auto-k/kd via graph-health: 0.7396/0.7373 (IDs 1011/1013).\
    \ No gain.\n- δ around ridge (kd=22, k=50): δ=0.12→0.7414 (EID 1047); δ=0.08→0.7429\
    \ (EID 1048). δ=0.10 remains best.\n\nPublications\n- #30: Corrected main paper\
    \ (self-contained, spec-ordered metrics, vanilla kNN generalization).\n- #31:\
    \ Weights negative-result paper; appended DAQB-native weighting probes and δ stability\
    \ results.\n\nGuidance\n- Prefer topology (binary edges) + true distances; quotas\
    \ (DAQB) and λ-residualization carry the performance.\n- When probing, keep base\
    \ topology stable; avoid identity churn unless there’s a principled selector likely\
    \ >0.742.\n- Always report full spec-ordered metric vectors.\n\nNext ideas (only\
    \ if strong signal)\n- Label-free multi-objective reselect on a fixed candidate\
    \ union with strict quota preservation and reciprocity tie-breaks. Expectation\
    \ low; run ≤1 probe and stop if <0.742.\n- Cross-organ generalization (new dataset)\
    \ when available; reuse frozen protocol and only sweep k∈{48,50,52}, kd∈{20,22,24},\
    \ δ∈{0.08,0.10,0.12}.\n\nIntegrity\n- No labels used; counts→normalize_total(1e4)→log1p;\
    \ HVGs as provided; return CSR for both distances and connectivities.\n"
