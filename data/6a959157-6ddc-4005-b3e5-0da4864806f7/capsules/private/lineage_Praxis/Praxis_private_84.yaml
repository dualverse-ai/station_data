  title: 'Lit review addendum — Archive #36 (Daedalus IV) and cross‑organ idea seeds'
  content: "Summary of Archive #36 (Daedalus IV): Optimizing Density Estimation for\
    \ Adaptive Graph-Based Batch Correction\n- Focus: refinements to density estimation\
    \ that feed adaptive quota-building; explores k_density and delta sweeps with\
    \ principled selection.\n- Takeaways (Heart context): modest gains near ridge-like\
    \ settings; confirms sensitivity of density coupling and the importance of a stable\
    \ proxy.\n- Non-duplication note: Our prior probes (gate, clip, kd micro) differ\
    \ in mechanism; #36 emphasizes calibration strategies for density that could be\
    \ useful off-Heart.\n\nCross-organ idea seeds (orthogonal, low-coupling, ready\
    \ to test under runbook gates)\n- Seed A: Proxy calibration via global quantile-mapping\n\
    \  • Replace per-cell scalar density proxy with a quantile-calibrated variant\
    \ (fit monotone calibration of k_density distances to a reference distribution\
    \ within organ; no batch labels).\n  • Rationale: organ-specific distance scale\
    \ mismatch can distort delta coupling; monotone calibration preserves rank while\
    \ stabilizing coupling.\n  • Test: ridge baseline vs calibrated-proxy (same quotas);\
    \ accept only if seed-avg Δ≥+0.001 with cLISI non-decreasing, Graph_conn ≥ 0.967.\n\
    \n- Seed B: Robust neighbor distance scale (row-wise standardization lite)\n \
    \ • Before DAQB candidate ranking, apply per-row robust scaling (median/MAD) to\
    \ candidate distances (k′=k+10) and re-rank; keep quotas unchanged.\n  • Rationale:\
    \ mitigates per-cell heterogeneity without touching quotas/sym; previous Heart\
    \ baseline variant was negative on PCA+kNN, but effect on ridge Zcorr may differ\
    \ by organ.\n  • Test on new organ only; same adoption gates.\n\n- Seed C: Top-PC\
    \ anisotropy guard (graph path only)\n  • Detect PCs with extreme cross-batch\
    \ anisotropy (ratio of per-batch std to global std beyond τ); apply tempered scaling\
    \ (t≈0.25) only on those PCs prior to DAQB, keeping residualization otherwise\
    \ identical.\n  • Rationale: very targeted stabilization for organs with strong\
    \ per-batch axis inflation; avoid global equalization (aux-only if any cLISI harm).\n\
    \nPlan upon new organ\n- Execute runbook: baseline → falsification kit (fixed-k,\
    \ clip) → diagnostics; if all fail, try Seed A, then B; C only if diagnostics\
    \ show axis-level anisotropy.\n- Reporting: full spec vectors + EIDs + env tag;\
    \ add to shared registry; publish an addendum if results are substantive.\n"
