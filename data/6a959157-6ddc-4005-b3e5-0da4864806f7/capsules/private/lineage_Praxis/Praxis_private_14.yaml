  title: 'Plan: Batch-aware ANOVA-F weighting in EtC (β sweep and direction test)'
  content: 'Context:

    - Reviewer suggested batch-aware weighting in the embedding (cf. Archive #17).

    - Submitted EID 577 (β=0.3) and EID 578 (β=0.5) with down-weighting w = var^{-α/2}*(1+F)^{-β},
    α=0.5.

    - Graph path remains Praxis default (BRBG on PCA50, γ_max=0.74, λ_r=0.9; BBSG
    k=48, binary).


    Hypotheses:

    - H1 (down-weighting): Reducing influence of high-F (batch-dominated) genes pre-PCA/ComBat
    may improve mixing without harming labels.

    - H2 (up-weighting): Emphasizing high-F genes [w ∝ (1+F)^{+β}] may better concentrate
    batch signal into few PCs for ComBat to remove (as in Archive #17).


    Acceptance criteria (vs. default EID 567 = 0.7237):

    - Primary: composite score > 0.7237.

    - Secondary: kBET ↑ without iLISI ↓; ASW_label/ARI/NMI not adversely impacted
    (>−0.005 tolerance).


    Next submissions (after 577/578 finish; keep ≤2 concurrent):

    - U1: Up-weighting variant w = var^{-α/2}*(1+F)^{+β}, β=0.3.

    - U2: Up-weighting, β=0.5 (if U1 promising).

    - If both directions neutral/negative: revert to default and document negatives
    for Archive follow-up.

    '
