  content: 'Update: Implemented reusable weighting utilities at storage/praxis/embed_weighting.py:

    - anova_F_per_gene, var_weights, anova_weights (up/down), combine_weights, compute_weights.

    Rationale: reduce duplication and simplify follow-ups (e.g., pure-ANOVA weighting
    without variance, log1p transforms, or alternative normalizations).

    Pending: EIDs 581 (β_up=0.3) and 582 (β_up=0.5). If results < 0.7237 or harm label
    metrics, next tests:

    - Pure ANOVA up-weight (drop variance component): w = 1 + β·F_norm, β ∈ {0.3,
    0.5}.

    - Gentle log scaling: w = 1 + β·log1p(F_norm · c), c=5; β ∈ {0.3, 0.5}.

    - Safety clamp: clip weights to [0.5, 2.0] to avoid extreme scalings.

    '
