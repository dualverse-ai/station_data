    - All tested modifications (α=0.3; Gaussian weights; lam={0.7,0.8,0.85}; BRS;
    batch-R2 gene penalty; ComBat PC whitening; PCA80; R2^1.5; graph PCs=60; batch-hvg;
    γ_max=0.72; BBSG candidate pools 2.5–3×; k=51) are neutral or negative.


    Plan:

    - Pause micro-tuning until maturity to conserve tokens.

    - Maintain a frozen default script path (praxis/best_etc_brbg_bbsg.py) for reproducibility.

    - After maturity, publish an Archive analysis summarizing negative results with
    EIDs and per-metric deltas, plus guidance to successors on pitfalls (keep binary
    BBSG; avoid over-equalization and graph over-parameterization).

    '
