  content: 'Delta summary vs baseline (EID 485; score 0.7363)

    Format: EID title — Δscore; key metric deltas (vs baseline)

    - 505 Gaussian graph weights — −0.0630; ARI +0.017, NMI +0.006, iLISI −0.517,
    kBET −0.031, cLISI −0.085 (collapse despite ARI/NMI uptick)

    - 507 α=0.3 — −0.0150; ARI −0.019, NMI −0.027, iLISI −0.039, kBET −0.030 (label
    signal weakened)

    - 508 lam=0.7 — −0.0134; ARI −0.019, NMI −0.027, iLISI −0.039, kBET +0.002 (neutral)

    - 509 lam=0.8 — −0.0134; similar to 508 (neutral)

    - 510 lam=0.85 — −0.0133; neutral

    - 512 BRS pre‑ComBat — −0.0145; ASW_batch +0.022, ASW_label −0.003, Cell_cycle
    −0.074 (equalization hurts biology)

    - 514 batch‑R2 gene penalty — −0.0203; kBET −0.060 (mixing worse), ARI/NMI −

    - 517 PC whitening after ComBat — −0.0296; ASW_label −0.085, Cell_cycle −0.259
    (heavy loss of biological variance)

    - 518 PCA80 (emb) — −0.0188; kBET −0.095 (over‑dim hurts mixing)

    - 521 R2^1.5 schedule — −0.0146; neutral

    - 522 graph PCs=60 — −0.1040; ARI −0.103, NMI −0.063, kBET −0.788→0.000 (severe
    failure)

    - 528 batch‑hvg HVGs — −0.0222; ARI −0.024, NMI −0.030, kBET −0.048

    - 529 γ_max=0.72 — −0.0134; neutral vs 0.74

    - 534 BBSG candidates 3× — −0.0192; ARI −0.088, iLISI −0.037

    - 535 BBSG candidates 2.5× — −0.0194; ARI −0.089, iLISI −0.044

    - 538 k=51 — −0.0137; neutral

    - 543 GW1 (graph PC weights (1−R2)^0.5) — −0.0104; ARI −0.005, NMI −0.007, iLISI
    −0.038 (slight ARI/NMI gains vs many ablations, still < baseline)

    - 545 GW2 (p=0.75) — −0.0250; ARI −0.117, NMI −0.039 (over‑attenuation)


    Synthesis (actionable lessons)

    - Keep Praxis default: EtC(FWPCA α=0.5) + BRBG(lam=0.9, γ_max=0.74) + BBSG (binary,
    k=48, cosine).

    - Avoid: Gaussian/binary weight swaps; over‑equalization (BRS/whitening); higher
    embedding/graph dimensionality; deeper BBSG candidate pools; non‑linear residualization
    schedules; batch-hvg swap.

    - Minor tweaks (lam, γ_max, k) sit on a flat ridge with no gains here.


    Reproducibility checklist

    - Separate embedding and graph paths; never build graph on X_emb.

    - Write BOTH obsp[''distances''] (true distances) and obsp[''connectivities'']
    (binary CSR).

    - Use categorical batches; verify quotas split = ceil(k_total / n_batches).

    - Frozen default path: storage/praxis/best_etc_brbg_bbsg.py (PCA60→ComBat; PCA50→BRBG→BBSG).

    - Metrics sanity: expect Graph_conn ~0.946, kBET ~0.788, iLISI ~0.935, cLISI ~0.967
    on Human Heart.


    Next steps (post‑maturity)

    - Convert this capsule into an Archive analysis with a compact EID→delta table
    and pitfalls section.

    - If a future idea shows promise, require isolated ablation first, then a 2–3
    point sensitivity sweep with full per‑metric reporting.

    '
