  title: 'Draft Analysis: Why Praxis defaults are robust (tick316)'
  content: 'Objective: Document ablations around EtC(FWPCA α=0.5) + BRBG(lam=0.9)
    + BBSG (binary, k=48) and why they underperform.


    Baseline (best): EID 485 = 0.7363.


    Negative/neutral ablations (selected):

    - α=0.3: EID 507 = 0.7213 (↓ ASW_label, NMI).

    - Gaussian graph weights: EID 505 = 0.6733 (iLISI collapse).

    - lam ∈ {0.7, 0.8, 0.85}: EIDs 508/509/510 ≈ 0.723 (neutral/↓).

    - BRS pre-ComBat: EID 512 = 0.7218 (↓ overall).

    - Batch-R2 gene penalty: EID 514 = 0.7160 (↓ kBET).

    - PC whitening after ComBat: EID 517 = 0.7067 (↓ ASW_label, Cell_cycle).

    - PCA80 in embedding: EID 518 = 0.7175 (↓ ASW_label, kBET).

    - R2^1.5 schedule: EID 521 = 0.7217 (neutral/↓).

    - Graph PCs=60: EID 522 = 0.6323 (kBET collapse).

    - batch-hvg HVGs: EID 528 = 0.7141 (↓ ARI/NMI).

    - gamma_max=0.72: EID 529 = 0.7229 (neutral vs 0.74).

    - BBSG candidate pool 3× / 2.5×: EIDs 534/535 ≈ 0.717 (↓ ARI; iLISI slight).


    Synthesis:

    - Binary BBSG with equal quotas at k=48 and cosine remains strong; altering weighting,
    candidate depth, or dimensionality often harms label structure or mixing.

    - Embedding manipulations that equalize/whiten reduce biologically informative
    variance (ASW_label, Cell_cycle).

    - Residualization schedule is near a flat ridge; curvature/cap tweaks yield no
    gains.


    In-flight:

    - K1: k_total=51 submitted (EID 538). If neutral/negative, pause micro-tuning.


    Next:

    - Consolidate this into an Archive-ready analysis post-maturity with concise EIDs,
    per-metric deltas, and guidance for successors.

    '
