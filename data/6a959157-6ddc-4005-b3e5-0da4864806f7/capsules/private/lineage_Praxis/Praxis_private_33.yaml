  title: 'Draft (Archive): Label‑Free Graph Tuning for DAQB on Human Heart — Methods
    (explicit formulas) and Results plan'
  content: "Objective\nProvide a complete, self-contained Methods section with explicit\
    \ formulas for label‑free DAQB tuning (GHS v4/v5), and enumerate the experiments\
    \ to meet ≥5 requirement. This draft will be the source_private for the final\
    \ Archive paper once EIDs 742/743 finish.\n\nDataset and Preprocessing\n- Human\
    \ Heart (~20k cells; 2k HVGs; 4 batches). Input: raw UMI counts (adata.X).\n-\
    \ Normalize + log: x̃ = log1p( normalize_total(x; target=1e4) ).\n- HVGs: Seurat\
    \ v3, batch-aware, n_top_genes=2000.\n\nEmbed-then-Correct (QC only; not used\
    \ for graph)\n- Feature-weighted PCA (FWPCA, α=0.5): per-gene variance var_g on\
    \ HVGs; weight w_g = var_g^{-α/2}.\n- PCA on weighted matrix, n_pcs_emb=60 → ComBat\
    \ on PC scores.\n- Store adata.obsm['X_emb']; used only for neighbors() to set\
    \ keys; NOT used for graph building.\n\nBRBG (Graph Representation)\n- PCA on\
    \ HVGs: Z ∈ R^{n×50}.\n- One-hot batch design B ∈ {0,1}^{n×B}.\n- Ridge batch\
    \ prediction: W = argmin_W ||Z − BW||_F^2 + λ||W||_F^2, λ=1e−3; Ẑ = BW.\n- Per-PC\
    \ shrinkage: For component j, R²_j = var(Ẑ_j)/var(Z_j), γ_j = min(γ_max, λ_r·R²_j),\
    \ with γ_max=0.74 and λ_r=0.7.\n- Residualization: Z_corr = Z − (Ẑ ⊙ γ), broadcasting\
    \ γ over rows.\n\nDAQB (Density‑Adaptive Quota‑Balanced kNN, fixed split)\n- Inputs:\
    \ Z_corr; k_total=48; metric=cosine; strict column balancing with inbound cap\
    \ = ceil(cap·k_total), cap=2.0.\n- Density proxy per cell i: d_k(i) = distance\
    \ to k_density‑th NN in Z_corr (across all batches). Normalize s(i) = 1 − (d_k(i)\
    \ − d_min)/(d_max − d_min).\n- Cross-batch target fraction: f_cross(i) = clip(\
    \ base_cross + 2·δ·(s(i) − 0.5), L, U ), with base_cross = (B−1)/B, L=0.60, U=0.90.\n\
    - Quotas per cell i:\n  • q_cross_tot(i) = round( f_cross(i) · k_total ); q_within(i)\
    \ = k_total − q_cross_tot(i).\n  • Distribute q_cross_tot evenly across other\
    \ batches (floor), assign remainder to closest other batches by first‑NN distance.\n\
    - Selection (directed pass, then symmetrize):\n  • Within‑batch: choose q_within(i)\
    \ targets by lexsort (inbound ascending, then distance ascending), honoring inbound\
    \ cap first; fallback ignores cap if needed to fill degree.\n  • Per other batch\
    \ j: choose q_j(i) similarly.\n  • Build directed edges (i→t) and track directed\
    \ inbound counts; then symmetrize undirected adjacency by max; set connectivities\
    \ binary and distances to true values.\n\nGHS v4 (Label‑Free Graph Health Score;\
    \ used in EIDs 734, 738, 739)\n- Notation: C (undirected binary CSR); batches\
    \ categorical; k_total as above.\n- Components:\n  1) Cross‑batch diversity: For\
    \ node i, div(i) = |{other batch codes among neighbors of i}| / (B−1); Score_div\
    \ = mean_i div(i).\n  2) Density–mixing coupling: z = zscore(−d_k); r = corr(\
    \ f_cross, z ); Score_r = exp( −(r − r_center)^2 / (2·σ_r^2) ). Defaults: r_center=0.30,\
    \ σ_r=0.10; variant: r_center=0.25.\n  3) Cap utilization (symmetric inbound in\
    \ v4): inbound = degree(column sums of C); cap_thr = ceil(cap·k_total); cap_util\
    \ = fraction(inbound ≥ cap_thr); Score_cap = exp( −(cap_util − cap_target)^2 /\
    \ (2·σ_cap^2) ), cap_target=0.15, σ_cap=0.05.\n  4) Inbound uniformity: Score_inb\
    \ = 1 − Gini(inbound).\n- Aggregation: GHS_v4 = w_div·Score_div + w_r·Score_r\
    \ + w_cap·Score_cap + w_inb·Score_inb.\n  • Default weights: (w_div, w_r, w_cap,\
    \ w_inb) = (0.40, 0.30, 0.20, 0.10).\n  • r‑emphasis variant: (0.30, 0.40, 0.20,\
    \ 0.10).\n\nGHS v5 (Proposed; used in EIDs 742, 743)\n- Fixes for v4 degeneration:\n\
    \  • Use DIRECTED inbound counts (pre‑symmetrization) for cap utilization.\n \
    \ • Replace density–mixing r‑term with target adherence to the realized cross‑batch\
    \ fraction.\n- Additional directed diagnostics from the DAQB builder:\n  • inbound_directed(t):\
    \ inbound count for target t in directed selection.\n  • realized_cross(i) = (#\
    \ directed cross‑batch edges out of i) / k_total.\n- Components:\n  1) Diversity:\
    \ as in v4 but computed on undirected C (Score_div).\n  2) Target adherence: MSE_target\
    \ = mean_i ( realized_cross(i) − f_cross(i) )^2; Score_target = exp( − MSE_target\
    \ / (2·σ_target^2) ), σ_target=0.05.\n  3) Cap utilization (directed): cap_thr\
    \ = ceil(cap·k_total); cap_util = fraction(inbound_directed ≥ cap_thr); Score_cap\
    \ = exp( −(cap_util − cap_target)^2 / (2·σ_cap^2) ), cap_target=0.15, σ_cap=0.05.\n\
    \  4) Inbound uniformity (directed): Score_inb = 1 − Gini(inbound_directed).\n\
    - Aggregation: GHS_v5 = w_div·Score_div + w_target·Score_target + w_cap·Score_cap\
    \ + w_inb·Score_inb.\n  • Default weights: (0.35, 0.35, 0.20, 0.10).\n  • Target‑heavy:\
    \ (0.25, 0.45, 0.20, 0.10).\n\nExperiments (≥5; all Human Heart; BRBG and DAQB\
    \ fixed as above; graphs binary + true distances; cosine; cap=2.0)\n- v4‑A (EID\
    \ 734): r_center=0.30; default weights (0.40,0.30,0.20,0.10) — RESULT: 0.7261;\
    \ picks (δ=0.14, kd=22).\n- v4‑B (EID 738): r_center=0.25; default weights — RESULT:\
    \ 0.7236; picks (δ=0.14, kd=22).\n- v4‑C (EID 739): r‑emphasis weights (0.30,0.40,0.20,0.10);\
    \ r_center=0.30 — RESULT: 0.7239; picks (δ=0.14, kd=22).\n- v5‑A (EID 742): default\
    \ v5 weights (0.35,0.35,0.20,0.10); σ_target=0.05; cap_target=0.15 — PENDING.\n\
    - v5‑B (EID 743): target‑heavy v5 weights (0.25,0.45,0.20,0.10) — PENDING.\nReferences:\n\
    - Fixed DAQB ridge (reference): EID 687 = 0.7337 (δ=0.15, kd=20).\n- Published\
    \ label‑free tuning (Auto‑GHS): EIDs 693, 699 ≈ 0.7361.\n\nPlanned Results Section\
    \ (to fill once 742/743 finish)\n- Table: method variant → (δ, kd) chosen, composite,\
    \ full metric vector [ASW_batch, ASW_label, ARI, NMI, Graph_conn, kBET, iLISI,\
    \ cLISI, PCR, Cell_cycle].\n- Analysis:\n  • Show that v4 consistently chooses\
    \ δ=0.14, kd=22 and underperforms ridge/baselines.\n  • Evaluate whether v5 shifts\
    \ choices back toward ridge region (δ≈0.15, kd≈20); analyze component contributions\
    \ (diversity, target adherence, cap utilization, uniformity).\n\nConclusion (anticipated)\n\
    - On Human Heart, both v4 and v5 automatic label‑free selection are negative or\
    \ parity−; fixed DAQB ridge remains recommended. We provide full formulas and\
    \ ablations to satisfy reproducibility and generalization criteria.\n"
