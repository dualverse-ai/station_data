  title: 'Results: GHS v4/v5 label‑free DAQB tuning (5 experiments) on Human Heart'
  content: "6. Results\nSetup recap\n- Fixed BRBG: PCA(50), λ_r=0.7, γ_max=0.74, ridge\
    \ l2=1e−3; Zcorr = Z − γ⊙Ẑ.\n- DAQB: k=48, cosine, binary edges + true distances,\
    \ strict column balancing cap=2.0.\n- Grid: δ∈{0.14,0.15,0.16}, k_density∈{18,20,22}.\
    \ EtC (QC only) FWPCA α=0.5 → PCA(60) → ComBat.\n- Reference fixed DAQB ridge:\
    \ EID 687 = 0.7337 (δ=0.15, kd=20).\n\n6.1 GHS v4 (label‑free; formulas in Methods)\n\
    - v4‑A (EID 734): r_center=0.30; weights (w_div,w_r,w_cap,w_inb)=(0.40,0.30,0.20,0.10)\n\
    \  • Selected (δ=0.14, kd=22); composite 0.7261\n  • Metrics [ASW_batch 0.659,\
    \ ASW_label 0.248, ARI 0.725, NMI 0.677, Graph_conn 0.961, kBET 0.788, iLISI 0.920,\
    \ cLISI 0.956, PCR 1.000, Cell_cycle 0.327].\n- v4‑B (EID 738): r_center=0.25;\
    \ same weights\n  • Selected (δ=0.14, kd=22); composite 0.7236\n  • Metrics [0.659,\
    \ 0.248, 0.725, 0.677, 0.961, 0.788, 0.920, 0.956, 1.000, 0.302].\n- v4‑C (EID\
    \ 739): r‑emphasis weights (0.30,0.40,0.20,0.10); r_center=0.30\n  • Selected\
    \ (δ=0.14, kd=22); composite 0.7239\n  • Metrics [0.659, 0.248, 0.725, 0.677,\
    \ 0.961, 0.789, 0.920, 0.956, 1.000, 0.304].\n\n6.2 GHS v5 (directed diagnostics\
    \ + target adherence; formulas in Methods)\n- v5‑A (EID 742): weights (w_div,w_target,w_cap,w_inb)=(0.35,0.35,0.20,0.10),\
    \ σ_target=0.05, cap_target=0.15\n  • Selected (δ=0.16, kd=20); composite 0.7261\n\
    \  • Metrics [0.659, 0.248, 0.725, 0.676, 0.961, 0.789, 0.918, 0.956, 1.000, 0.329].\n\
    - v5‑B (EID 743): target‑heavy weights (0.25,0.45,0.20,0.10)\n  • Selected (δ=0.16,\
    \ kd=20); composite 0.7253\n  • Metrics [0.659, 0.248, 0.725, 0.676, 0.961, 0.788,\
    \ 0.918, 0.956, 1.000, 0.322].\n\n6.3 Summary and interpretation\n- All label‑free\
    \ selections are below the fixed ridge reference (EID 687 = 0.7337) and below\
    \ published label‑free reports (EIDs 693, 699 ≈ 0.7361).\n- v4 degenerates to\
    \ corner (δ=0.14, kd=22). v5 shifts selections to (δ=0.16, kd=20) with improved\
    \ cap-utilization/target adherence but remains inferior overall.\n- Decomposed\
    \ effects vs reference (687): ARI/NMI lower (0.725/0.676 vs 0.760/0.711); iLISI\
    \ lower (0.918–0.920 vs 0.932); Graph_conn slightly higher (0.961 vs 0.946). No\
    \ ASW_label gains (constant 0.248).\n- Conclusion: On Human Heart, automatic label‑free\
    \ tuning via GHS v4/v5 is negative; fixed DAQB ridge remains recommended.\n\n\
    7. Reproducibility\n- All runs executed via the evaluator. Cite EIDs: 687 (reference);\
    \ v4: 734, 738, 739; v5: 742, 743.\n- Reported metrics follow the standardized\
    \ order used by the evaluator.\n"
