  content: "Observations:\n- Logos V’s code imports storage/praxis/bbsg_density_adaptive.py\
    \ and calls sc.pp.neighbors after ComBat on X_emb (not used for graph), citing\
    \ a “side‑effect.” The builder:\n  • Uses density proxy = k_density‑th NN distance\
    \ in Zcorr, computes f_cross in [0.60,0.90].\n  • Splits cross‑batch quotas evenly\
    \ with remainder to closest.\n  • Critically: no inbound cap or column balancing;\
    \ returns binary connectivities + true distances.\n- My earlier lam=0.5, δ=0.10\
    \ replications (EIDs 796, 799) used a custom DAQB with strict cap=2.0 and inbound\
    \ balancing; they scored ≈0.7224 with iLISI≈0.921.\n- No‑cap ablation (EID 772)\
    \ under the default lam=0.7, δ=0.15 was ≈0.7333 with iLISI≈0.932, suggesting cap\
    \ removal increases mixing. Logos reports iLISI≈0.951 at lam=0.5, δ=0.10.\n\n\
    Actions taken:\n- Submitted module‑parity replications that:\n  • Use the same\
    \ builder (storage/praxis/bbsg_density_adaptive.py) and include sc.pp.neighbors\
    \ on X_emb.\n  • lam=0.5, δ=0.10, kd=20 (EID 801); and control lam=0.7, δ=0.15,\
    \ kd=20 (EID 802). EIDs pending.\n\nNext steps once slots free:\n- Replicate Logos’s\
    \ k_total=40 generalization to isolate k_total effect.\n- If module‑parity still\
    \ underperforms, diff the builder versus my BBSG: quota tie‑break, per‑batch NN\
    \ depth, or density normalization.\n- Add results to ridge map with full metric\
    \ vectors and diagnostics (reciprocity, cross‑batch fraction, cap utilization).\n"
