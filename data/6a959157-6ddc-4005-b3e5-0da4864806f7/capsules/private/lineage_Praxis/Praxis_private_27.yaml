  title: 'Draft: Embedding Normalization Sensitivity — Full Methods and Results Outline'
  content: "Goal\n- Rewrite with self-contained methods and ≥5 experiments. Integrate\
    \ sensitivity results on embedding normalization target_sum and HVG subsetting\
    \ under a fixed BRBG+DAQB graph.\n\nDataset and Evaluator\n- Human Heart (~20k\
    \ cells × 2k HVGs; batch-aware HVG selection).\n- OpenProblems 2.0 composite =\
    \ mean of 10 normalized metrics: [ASW_batch, ASW_label, ARI, NMI, Graph_conn,\
    \ kBET, iLISI, cLISI, PCR, Cell_cycle].\n\nPreprocessing (graph path; fixed)\n\
    1) Start from raw UMI counts (adata.layers['counts'] or adata.X).\n2) sc.pp.normalize_total(target_sum=1e4),\
    \ then sc.pp.log1p.\n3) sc.pp.highly_variable_genes(flavor='seurat_v3', batch_key='batch',\
    \ n_top_genes=2000, inplace=True). Use adata.var['highly_variable'] as mask for\
    \ graph computations.\n\nEtC Embedding (analysis/QC only; not used to build graph)\n\
    - We compare three R²-FWPCA α=0.25 variants differing in:\n  • target_sum_embed\
    \ ∈ {1e-5, 1e-4, 1e-3} in embedding path.\n  • HVG subsetting flag in embedding\
    \ path: subset ∈ {False, True}.\n- For each embedding variant:\n  1) Make a copy\
    \ (ad_emb = adata.copy()).\n  2) sc.pp.normalize_total(ad_emb, target_sum=target_sum_embed);\
    \ then sc.pp.log1p(ad_emb).\n  3) sc.pp.highly_variable_genes(ad_emb, n_top_genes=2000,\
    \ batch_key='batch', flavor='seurat_v3', subset=False if subset=False else True).\n\
    \  4) If subset=False: take X_hvg = ad_emb.X[:, ad_emb.var['highly_variable']];\
    \ else X = ad_emb.X already subset.\n  5) Compute per-gene R² from ridge: regress\
    \ one-hot batches B onto gene matrix (X_hvg), R² = 1 − SS_res/SS_tot (clip to\
    \ [0,1]); weight per gene w = (1 − R²)^α with α=0.25.\n  6) Apply weights to genes;\
    \ run PCA with n_pcs=60; apply ComBat on PC scores keyed by 'batch'.\n  7) Store\
    \ embedding to adata.obsm['X_emb']; set neighbors for QC with sc.pp.neighbors(use_rep='X_emb',\
    \ n_neighbors=15, metric='cosine').\n\nBRBG Graph (fixed for all runs)\n1) Using\
    \ the graph-preprocessed adata and HVG mask: form Xg = adata.X[:, hv].\n2) PCA\
    \ with 50 components → Z.\n3) Ridge batch prediction: Z_hat = argmin_W ||Z − B\
    \ W||^2 + l2||W||^2 with l2=1e-3; per-PC explained ratio R²_pc = var(Z_hat)/var(Z).\n\
    4) Per-PC shrinkage: γ_j = min(0.74, 0.7 · R²_j); residualized Zcorr = Z − γ ⊙\
    \ Z_hat.\n\nDAQB Graph (fixed for all runs)\n1) Density proxy: distance to the\
    \ 20th nearest neighbor in Zcorr across all batches.\n2) Cross-batch fraction\
    \ per cell: f_cross = base_cross ± δ by local density, with δ=0.15; bounds [0.60,\
    \ 0.90]; base_cross = (B−1)/B for B batches.\n3) Convert f_cross to per-batch\
    \ quotas (even split + remainder to closest batches).\n4) Build k=48 neighbors\
    \ (cosine), binary connectivities; store true distances. Single-pass column balancing\
    \ with inbound cap=2.0. Symmetrize by max on both adjacency and distances.\n5)\
    \ Write to adata.obsp['connectivities'] (CSR, binary) and adata.obsp['distances']\
    \ (CSR).\n\nExperiments (EIDs; full metric vectors to be tabulated)\n- Baselines/replications:\n\
    \  • EID 705: α=0.25 variance-FWPCA (baseline comparison) → 0.7181.\n  • EID 707:\
    \ α=0.25 R²-FWPCA (target_sum_embed=1e-4, subset=False) → 0.7259.\n  • EID 712:\
    \ α=0.25 R²-FWPCA (target_sum_embed=1e-4, subset=False + embedding normalization\
    \ variant) → 0.7341.\n- Sensitivity (pending):\n  • EID 713: α=0.25 R²-FWPCA with\
    \ target_sum_embed=1e-5, subset=False → [pending].\n  • EID 714: α=0.25 R²-FWPCA\
    \ with target_sum_embed=1e-3, subset=False → [pending].\n  • To submit when slots\
    \ free: α=0.25 R²-FWPCA with target_sum_embed=1e-4, subset=True.\n\nAnalysis plan\
    \ for revised Archive\n- Methods: step-by-step as above, with exact parameters,\
    \ dimensions, and flags; eliminate jargon.\n- Results: table of all EIDs with\
    \ full metric vectors in the required order; discuss trends:\n  • Effect of target_sum\
    \ on mixing (kBET, iLISI) vs preservation (ASW_label, cLISI).\n  • Effect of HVG\
    \ subsetting in embedding on the same trade-off.\n- Conclusion: when to use the\
    \ α=0.25 mixing-prioritized embedding vs the fixed DAQB default (α=0.5 embedding\
    \ for QC only).\n"
