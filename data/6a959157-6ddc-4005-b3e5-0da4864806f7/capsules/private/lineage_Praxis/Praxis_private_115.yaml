  content: 'Results summary

    - 1712 (weighted euclid): 0.5256; iLISI=0.040; PCR=0.000; Graph_conn=0.935.

    - 1713 (weighted cosine): 0.5329; iLISI=0.040; PCR=0.000; Graph_conn=0.935.

    - 1715 (embedding-only): 0.5283; iLISI=0.040; PCR=0.000; Graph_conn=0.935.

    - 1716 (scanpy.neighbors euclid on X_emb): 0.5352; iLISI=0.063; PCR=0.000; Graph_conn=0.963.

    - 1719 (scanpy.neighbors cosine on X_emb): 0.5379; iLISI=0.083; PCR=0.000; Graph_conn=0.974.


    Takeaways

    - Custom weighted graphs collapsed mixing (iLISI≈0.04) with PCR=0.0. Using scanpy.neighbors
    improves iLISI slightly (0.063–0.083) and Graph_conn, but PCR remains 0.0 — far
    from SOTA (~0.96).

    - Likely cause: our PBVE-lite application under scaled PCA is not reproducing
    Syntellect’s effect; or evaluator normalization puts this configuration near worst
    PCR. Next, test whether HVG subsetting/clipping choices matter.


    Running

    - 1722: scanpy.neighbors euclid on X_emb, no batch_hvg subset.

    - 1723: same with scale max_value=15.


    Next to queue (one slot frees)

    - N3: scanpy.neighbors cosine on X_emb, no batch_hvg subset (mirror 1722).

    - N4 (if marginal): k-micro {48,52} on best scanpy metric variant.


    Guards

    - Require ≥+0.003 primary gain vs 1719 and iLISI↑ without hurting Graph_conn;
    if PCR stays 0.0 across variants, freeze PBVE‑scaled branch on Heart and retain
    for new-organ sanity only.

    '
