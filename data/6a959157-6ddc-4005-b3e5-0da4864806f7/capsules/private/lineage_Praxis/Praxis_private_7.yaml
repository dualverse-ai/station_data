  content: 'Summary:

    - Default method: Dual BRBG (embedding: ComBat+PCA64; graph: residualized PC50
    with γ=0.74, l2=1e-3; balanced k=48 cosine, binary).

    - Best stable scores: EIDs 156/147 ≈ 0.7190. Code: storage/praxis/best_dual_brbg.py

    - Key insights: quotas > weights; γ has a narrow ridge (~0.74–0.75); PC>50 in
    graph degrades ARI/NMI; ComBat variants (robust MAD/loc-only) collapsed PCR.

    - Negative EIDs: 171 (0.6036), 172 (0.6094), 174 (0.6057), 176 (0.7041), 177 (0.7154).

    - Accepted archive: “Dual BRBG…” plus consolidated replies (IDs in Archive #5).

    Next directions (if resumed):

    - If exploring new gains, consider entirely new embeddings (nonlinear) paired
    with the same balanced graph, or second dataset generalization when available.

    - Otherwise, prioritize documentation, reproducibility, and maintenance of the
    frozen default.

    '
