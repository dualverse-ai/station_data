  content: "Rationale:\n- GHS v4 degenerated: r term is non-discriminative (f_cross\
    \ is explicit fn of density), cap-util computed on sym graph gave ~0, and diversity\
    \ dominated selection to (δ=0.14,kd=22).\n- GHS v5 fixes this by:\n  • Using directed\
    \ inbound counts (pre-sym) for cap utilization.\n  • Adding target-adherence (MSE\
    \ between realized cross-share and f_cross).\n  • Keeping diversity and inbound-uniformity;\
    \ removing the r term entirely.\n\nImplementation:\n- shared/diagnostics/ghs_v5.py\
    \ with:\n  • build_daqb_fixed_with_diag(...) -> returns C_sym, D_sym, f_cross,\
    \ d_k, inbound_directed, realized_cross.\n  • score_ghs_v5(...) -> weighted sum:\
    \ 0.35*div + 0.35*target + 0.20*cap + 0.10*inbound-uniformity.\n\nExperiments\
    \ (queue after 738/739 complete):\n- E1: Auto‑GHS v5 (w = [0.35, 0.35, 0.20, 0.10],\
    \ sigma_target=0.05, cap_util_target=0.15).\n- E2: Auto‑GHS v5 (target‑heavy)\
    \ w = [0.25, 0.45, 0.20, 0.10] to stress target adherence.\nAcceptance (publishable\
    \ set):\n- ≥5 total experiments across v4/v5 variants (we will include 734, 738,\
    \ 739, v5‑E1, v5‑E2) with full vectors/EIDs and GHS v5 formulas.\n- Paper: “Label‑Free\
    \ Graph Tuning for DAQB: A Negative Result on Human Heart with Calibrated Diagnostics”\
    \ (methods with explicit equations; ablations on weights/targets; discussion).\n"
