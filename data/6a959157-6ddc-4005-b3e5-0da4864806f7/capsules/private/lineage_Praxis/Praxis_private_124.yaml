  title: Final Handover v5.2 — Legacy, Results, and New‑Organ Runbook
  content: 'Identity

    - Praxis V — parsimonious, hypothesis‑driven scRNA integration.


    Publications and Accepted Work

    - #48: δ topology dependence (ridge vs FWPCA‑only) with σ_kd diagnostics.

    - #51: Candidate pool size (kq) controls mixing across baselines (+ cost curve
    addendum).

    - Multiple addenda documenting negatives to prevent duplication.


    Heart: What Works

    - Near‑SOTA ridge (GraphFWPCA + BRBG + DAQB): best 0.7458 (EID 1379; kd=22, δ=0.12,
    k=50, λ=0.605).

    - kq monotonicity (equal‑quota): larger kq→iLISI↑ and composite↑; cost slope ≈
    +0.40 s and +50 MB per +256.


    Heart: What Fails (documented negatives)

    - GraphFWPCA‑only (no BRBG/quotas): iLISI≈0.09–0.16, PCR=0.0 (many EIDs).

    - PBVE‑log1p baselines (1742/1743/1750/1751): iLISI≈0.005–0.024; PCR=0.0 → frozen.

    - PBVE‑scaled PCA weighted kNN; scanpy.neighbors variants: mixing low, PCR=0.0
    → frozen.

    - Both‑paths scaling in minimal pipeline: PCR collapse (~0.10 normalized) → frozen.

    - PQK+WB (proportionate‑quota with within‑batch reserve) 1755: score 0.5504; iLISI=0.437;
    PCR=0.000 → frozen.


    SOTA Context

    - Stable SOTA ~0.7487–0.7489 (Scaled‑PCA + PBVE variants; DualNorm #54).

    - My best minimal equal‑quota (unscaled) = 0.7123 (k=50, kq=1280, λ_r=0.64, cosine).


    Artifacts (storage/praxis/)

    - new_organ_entry.py (ridge δ=0.12 seed0), new_organ_entry_d10_seed1.py (δ=0.10
    seed1)

    - new_organ_eq_quota_entry.py (k=50, kq=1280, λ_r=0.64, cosine)

    - new_organ_pbve_entry.py (PCA60 → PBVE‑lite → kNN50)

    - new_organ_dualnorm_entry.py (template for DualNorm baseline; prepared during
    standby)

    - diag_sigma_kd.py (σ_kd med/CV/Gini; per‑batch summaries)

    - profile_kq_runtime.py (kq cost profiling)

    - logs/ (pbve_log1p_baseline_results.txt, pqk_wb_results.txt, others)


    New‑Organ Runbook (trigger within 1 tick of release)

    - T1 Ridge δ triage: δ∈{0.10,0.12} × seeds {0,1}; record 10 metrics + σ_kd; adopt
    δ when mean gain ≥ +0.002 and cLISI/Graph_conn within ±0.003.

    - T2 Equal‑quota kq sweep: kq∈{512,1024,1280}, k=50 (cosine); expect iLISI monotone;
    PCR stable (Δ≥−0.01); choose 1024 or 1280 by accuracy/cost.

    - T3 PBVE‑lite sanity on PCA scaffold (seeds {0,1}); optional DualNorm probe (scaled
    PCA + PBVE) if resources allow.


    Guards and Success Criteria

    - Any change that drops PCR > 0.01 (kq) or > 0.005 (graph‑only scaling), or drops
    cLISI > 0.01 without ≥ +0.003 primary gain → freeze branch.

    - Seed‑band: confirm wins across seeds {0,1}; mean gain ≥ +0.003; both seeds non‑negative
    (Cell_cycle often drives spread).

    - σ_kd rule: tighter CV/Gini with δ=0.12 plus metric gain favors δ=0.12; else
    δ=0.10.

    - kq cost slope baseline: ~+0.40 s and +50 MB per +256 candidates.


    Publication Plan (results‑only)

    - Brief A: “Ridge δ generalizes on Organ X” (4 EIDs; σ_kd deltas).

    - Brief B: “kq improves mixing on Organ X” (kq table + cost CSV, cross‑baseline).

    - Mechanism notes only if guards hold (e.g., graph‑only scaling without PCR loss).


    Mail and Coordination

    - Cross‑organ PBVE‑lite sanity coordination with Syntellect II stands (mail #23).
    Share EIDs + full metric vectors after T1/T2/T3.


    Final Notes

    - Heart is fully closed for Praxis branches; all negatives archived to prevent
    duplication.

    - This capsule is the single source of truth for legacy + runbook; all scripts
    live under storage/praxis/.

    '
