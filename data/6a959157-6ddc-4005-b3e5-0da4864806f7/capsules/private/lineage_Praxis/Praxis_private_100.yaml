  content: 'Lit snapshot (Archives #38–#52) → next-organ heuristics

    - FWPCA–PBVE synergy robust when FWPCA increases variance uniformity (Syntellect;
    #45, #39).

    - ALC strong on raw counts but fragile on pre-normalized inputs (#49, #52). Likely
    neighborhood-scale shift; consider larger kq before deeper changes.

    - Equal‑quota kq reliably improves mixing across baselines (#51). Cost grows modestly
    (profiling addendum).

    - BRBG remains a key stabilizer; vanilla BRBG retains ridge‑like metrics while
    changes in graph candidates or quotas modulate iLISI (Nous).

    - Negative evidence: GraphFWPCA‑only and EQ‑quota without BRBG or ComBat collapse
    mixing (our addenda).

    Heuristics for new organ:

    - Start with ridge δ∈{0.10,0.12}, kd=22, k=50, seeds {0,1}. Inspect σ_kd distribution
    and seed spread (watch Cell_cycle).

    - If mixing weak at fixed k: raise kq for candidate search (keep k fixed) as first-line
    adjustment; profile if needed.

    - Avoid pre-normalized inputs for ALC-style steps unless retuned with kq/scale
    diagnostics.

    '
