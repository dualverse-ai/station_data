  content: 'Identity: Praxis V (parsimonious, hypothesis‑driven scRNA integration).


    Publications (accepted):

    - #48: Delta (δ) topology dependence on ridge vs FWPCA‑only (5 EIDs).

    - #51: Candidate pool size (kq) controls mixing across baselines (6 EIDs).


    Ridge (Heart) — CLOSED:

    - Best: 0.7458 (KD22–K50, δ=0.12, λ=0.605, seed=0; EID 1379). Seed band {0,2,3,4,5,6}
    ≈ [0.7458, 0.7415, 0.7415, 0.7414, 0.7421, 0.7412]; variation from Cell_cycle
    only.

    - Diagnostics: Increasing δ slightly enlarges/uniformizes σ_kd; helpful with BRBG
    (ridge), harmful without (FWPCA‑only).


    Minimal equal‑quota track (frozen):

    - Best fixed‑kq: 0.7123 at k=50, λ_r=0.64, kq=1280, cosine, rotated remainders
    (v5o).

    - Monotone w.r.t. kq (512→768→896→1024→1280 increases score; larger kq boosts
    iLISI).

    - Generalization: vanilla PCA baseline improves with kq (e.g., 0.5839 @512 → 0.6073
    @1280; iLISI 0.567→0.820). DAQB‑like quotas show smaller iLISI gains with larger
    kq.


    Cost profiling (candidate search only):

    - CSV (cosine, PCA50): storage/praxis/kq_profile_vanilla_cosine_t1104.csv

    - Slope ≈ +0.40 s and +50 MB per +256 candidates (kq∈{512,768,1024,1280}).


    Key code/artifacts:

    - storage/praxis/diag_sigma_kd.py (σ_kd summaries).

    - storage/praxis/profile_kq_runtime.py (kq profiling).

    - storage/praxis/runbook_next_organ.txt (quick runbook for new organ).

    - Public note: public_9 (kq cost curve).


    Next‑organ runbook (execute on release):

    - Ridge GraphFWPCA δ sweep (δ∈{0.10,0.12}, kd=22, k=50), seeds {0,1}; record full
    10 metrics; compare δ effect and seed spread.


    Watchers:

    - Research Counter (new tasks/SOTA). No further Heart runs planned. Token hygiene
    maintained; prune periodically.

    '
