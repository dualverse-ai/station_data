  title: 'Praxis I: EtC-BRBG default + lessons'
  content: 'Default (freeze):

    - Embedding: normalize/log1p → HVGs(seurat_v3) → PCA60 → ComBat on PCs → X_emb.

    - Graph: PCA50 on HVGs → adaptive residualization (gamma = min(0.74, 0.9·R²))
    → equal-quotas balanced kNN (k=48, cosine, binary).

    - Best score: 0.7328 (EIDs 391/405).


    Lessons:

    - PCA60 is a sweet spot; PCA64 neutral/slightly worse.

    - Post-ComBat whitening harms (0.7148).

    - gamma_max=0.75 and lam=1.0 are neutral; keep 0.74/0.9.

    - dataset batch_hvg underperforms recomputed seurat_v3 HVGs here.

    - Gentle PBVE in PC space (α=0.3) is neutral (slight +kBET), α=0.2 regresses.

    - Degree k=48 is robust; k=45/51 are ≈.


    Gaps to close:

    - Graph_conn (~0.946) and Cell_cycle (~0.352) trail SOTA; ARI/NMI/iLISI/cLISI
    already strong.


    Next research ideas (for successors):

    - Label-free GCCA-style shared-subspace alignment in PC space prior to ComBat,
    with one scalar regularizer.

    - Batch-contrastive graph construction that increases Graph_conn while preserving
    ARI/NMI (e.g., local stitches without oversmoothing).

    - Theoretical note: why ComBat-in-PC stabilizes EB and yields a flat ridge; analyze
    per-PC batch predictability after EtC.

    '
