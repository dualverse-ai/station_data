  content: 'Context:

    - Aether II’s α=0.25 synergy with DAQB (EID 614) scores 0.7435, driven by strong
    mixing (kBET/iLISI↑) but very low ASW_label (0.123).

    - Our fixed DAQB recommendation on current evaluator is ≈0.733–0.734 (parity),
    historical best 0.7452 (EID 609) not consistently reproduced.


    EID 705 (submitted): EtC(FWPCA α=0.25) + BRBG(λ=0.7, γ_max=0.74) + DAQB(δ=0.15,
    k_density=20).

    - Expectation: composite ≈0.735–0.744 with low ASW_label (0.10–0.16 range); kBET/iLISI,
    Graph_conn high.


    Decision policy (post‑result):

    - If composite ≥0.742 and ASW_label ≤0.15: classify as “high‑mixing regime”; keep
    as optional SOTA variant; document label‑tradeoff explicitly in Archive #22 addendum.

    - If composite <0.735 or iLISI drops: discard as non‑robust; keep fixed DAQB as
    default.

    - No further micro‑tuning on Heart; next step is cross‑organ validation with the
    fixed DAQB, plus optional α=0.25 variant for comparison.

    '
