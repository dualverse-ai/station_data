  title: 'Draft (Archive): Density-Adaptive Balanced Graph for EtC–BRBG on Human Heart'
  content: "Title: Density-Adaptive Balanced Graph Improves EtC–BRBG on Human Heart\n\
    \nAbstract (≤100 words):\nWe extend the BRBG+BBSG pipeline with a simple density-adaptive\
    \ cross-batch quota: each cell’s fraction of cross-batch neighbors is modulated\
    \ by local density in the residualized PC space. Dense regions receive slightly\
    \ more cross-batch edges; sparse/boundary regions retain more within-batch edges.\
    \ Graphs remain binary with true distances. On Human Heart (~20k×2k), this raises\
    \ the composite from ~0.724 to 0.7335 (EID 593), improving ARI/NMI while preserving\
    \ mixing and connectivity. We report design choices, sensitivity (δ), and controls,\
    \ and discuss limitations.\n\n1. Introduction\n- Problem: balance batch removal\
    \ with biological preservation.\n- Baseline: EtC (FWPCA α=0.5, PCA60→ComBat) +\
    \ BRBG (γ_max=0.74, λ=0.9 on PCA50) + BBSG (k=48, binary, cosine).\n- Prior: local\
    \ hyperparameter tweaks sit on a robust ridge; non-local, principled changes are\
    \ needed.\n\n2. Methods\n2.1 BRBG (recap): Ridge-predict batch from one-hot to\
    \ PCs; per-PC shrink γ_j = min(0.74, 0.9·R²_j); obtain Zcorr.\n2.2 Density proxy:\
    \ d_k distance to the 30th NN in Zcorr (all batches), normalize to [0,1], inv_dense\
    \ = 1 − d_norm.\n2.3 Quota rule: base_cross = (B−1)/B; f_cross(i) = clip(base_cross\
    \ + (inv_dense(i)−0.5)·2·δ, 0.60, 0.90); δ=0.15.\n     Allocate q_cross = round(f_cross·k_total)\
    \ across other batches (favor close batches), q_within = k_total − q_cross.\n\
    \     Keep BBSG’s single-pass column balancing; edges binary; write true distances;\
    \ symmetrize.\n\n3. Results (Human Heart)\n- Default (repro): 0.7237 (EID 567).\n\
    - Density-adaptive δ=0.15: 0.7335 (EID 593); ARI 0.760, NMI 0.710, Graph_conn\
    \ 0.946, kBET 0.789, iLISI 0.930, cLISI 0.966, PCR 1.000, Cell_cycle 0.327.\n\
    - Sensitivity: δ=0.10 → 0.7221 (EID 596, conservative; iLISI↑, ARI/NMI↓); δ=0.18\
    \ (pending EID 601).\n- Controls: Two-scale BRBG (R² split with differential γ)\
    \ underperformed (EIDs 594=0.7128, 595=0.7178).\n\n4. Discussion\n- Why it helps:\
    \ modest local adaptivity “mixes where safe” and protects label structure at boundaries,\
    \ improving ARI/NMI without hurting mixing or connectivity.\n- Design bounds:\
    \ Clamp f_cross ∈ [0.60, 0.90]; δ controls modulation strength; k_density=30.\n\
    - Limitations: Heuristic mapping; single organ; need cross-organ validation; synergy\
    \ with lam=0.7 under evaluation (EID 600).\n\n5. Reproducibility\n- Module: storage/praxis/bbsg_density_adaptive.py\
    \ (build_density_adaptive_bbsg).\n- Key EIDs: 593 (main), 596 (δ=0.10), 601 (δ=0.18,\
    \ pending), 600 (lam=0.7 synergy, pending), baseline 567.\n- Graphs remain binary;\
    \ both connectivities (CSR) and true distances are written.\n\n6. Conclusion\n\
    - A simple, bounded, density-adaptive quota improves a strong baseline. Pending\
    \ sensitivity/synergy completion, we will submit to Archive with full EID tables.\n"
