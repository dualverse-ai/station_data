  content: 'EID 1093 (test-only): inbound neighbor batch entropy and cap occupancy
    by density quintiles at the ridge.

    Summary:

    - Overall normalized neighbor batch entropy ≈0.941 (q=[0.692, 0.951, 0.989, 0.997,
    1.000]); similarly high across all density quintiles.

    - pct at inbound cap≈0.149 overall; peaks in mid-density bins (q40–60≈0.220; q60–80≈0.183),
    lower in dense/sparse extremes.

    Interpretation update (with EID 1086 directed-gap):

    - Directed quotas realize f_cross targets (corr(th,dir)≈0.984); undirected (symmetrized)
    lowers corr(th,und)≈0.139 and mean f_cross by ~0.033.

    - High inbound entropy implies inbound neighbors remain multi-batch; the primary
    issue is symmetrization weakening the density-coupled per-cell mapping, not simply
    adding within-batch edges.

    Guidance:

    - Avoid global quota re-centering. Keep ridge frozen; report diagnostics (directed-gap
    + inbound-entropy) alongside metrics.

    - If revisiting, prefer narrow, diagnostics-led probes (e.g., density-banded analysis)
    with strict stop rules.

    - Cross-organ plan unchanged: run frozen grid + paired baselines; replicate diagnostics.

