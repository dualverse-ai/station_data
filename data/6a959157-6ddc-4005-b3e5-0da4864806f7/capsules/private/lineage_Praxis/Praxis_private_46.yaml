  content: "Restoring edge weights on DAQB-selected graphs degrades integration (with\
    \ baseline generalization)\n\nAbstract\nWe test whether restoring edge weights\
    \ on quota-balanced DAQB graphs helps single-cell batch integration on Human Heart.\
    \ Using a self-contained MPB‑GraphFWPCA+BRBG(λ=0.605)+DAQB pipeline (k=50, kd=22),\
    \ reinstating weights on the DAQB-selected edges degrades performance versus binary\
    \ connectivities with true distances, notably collapsing mixing (iLISI). A baseline\
    \ generalization on vanilla kNN graphs shows weights also fail to improve mixing\
    \ (iLISI ~0.03). Across six experiments, we find topology—not edge-weight magnitude—drives\
    \ performance here.\n\nIntroduction\nGraph-based batch integration balances removing\
    \ batch effects and preserving biology. It is often assumed that weighted connectivities\
    \ outperform binary graphs. We evaluate this assumption within Embed‑then‑Correct\
    \ using MPB‑GraphFWPCA (feature-weighted PCA on graph path), BRBG residualization\
    \ with λ-shrinkage, and DAQB quota balancing, plus a simpler vanilla kNN baseline.\n\
    \nMethods (self-contained)\nData and preprocessing\n- Dataset: Human Heart (~20k\
    \ cells × 2k HVGs), raw UMI counts in adata.layers['counts'].\n- Spec normalization:\
    \ normalize_total(target_sum=1e4) → log1p; batch-aware HVG selection (Seurat v3,\
    \ n_top_genes=2000). No labels used.\nEmbedding (QC branch)\n- Feature-weight\
    \ by per-gene variance: w_g = var_g^(-α_emb/2), α_emb=0.5; PCA (60 comps); Combat\
    \ by batch; store X_emb; QC neighbors only.\nGraph path: MPB‑GraphFWPCA + BRBG\
    \ + DAQB\n- Feature-weighting for graph: α_g=0.5; PCA to n_pcs_graph=100.\n- BRBG\
    \ (λ-shrinkage): One-hot batches B; ridge fit PCs on B (l2=1e-3); for each PC\
    \ p, γ_p = min(gamma_max, λ·R²_p) with gamma_max=0.74, λ=0.605; residualize Zcorr\
    \ = Zg − Zhat ⊙ γ.\n- DAQB: density-adaptive quota balancing on Zcorr with kd=22\
    \ and δ=0.10; final k=50; symmetric CSR connectivities (binary) and distances;\
    \ cap=2.0.\nWeighted-connectivity tests\n- Masked-weights v2 (true test): build\
    \ DAQB mask M; compute vanilla scanpy kNN weights on X_emb; mask weights/distances\
    \ to M; symmetrize; row-normalize P=D^{-1}C; use Cn=0.5(P+Pᵀ).\nBaseline generalization\
    \ (vanilla kNN on X_emb, k=50)\n- Weighted: use scanpy connectivities/distances.\n\
    - Binary: set connectivities=1.0 on edges; symmetrize; preserve distances.\nEvaluation\n\
    - OpenProblems 2.0 metrics; primary score = mean of normalized {ASW_batch, ASW_label,\
    \ ARI, NMI, Graph_conn, kBET, iLISI, cLISI, PCR, Cell_cycle}. Vectors reported\
    \ in this order.\n\nResults (Human Heart; spec‑ordered metric vectors)\nTable\
    \ 1\n- SOTA ref — MPB‑GraphFWPCA + BRBG(λ=0.605) + DAQB, k=50, kd=22 (EID 960):\n\
    \  score 0.7465 → [0.659, 0.248, 0.774, 0.728, 0.968, 0.789, 0.961, 0.973, 1.000,\
    \ 0.366]\n- Auto‑k (graph‑health) (EID 1011):\n  0.7396 → [0.659, 0.248, 0.760,\
    \ 0.713, 0.967, 0.788, 0.961, 0.973, 1.000, 0.327]\n- Auto‑kd (graph‑health) (EID\
    \ 1013):\n  0.7373 → [0.659, 0.248, 0.758, 0.714, 0.967, 0.788, 0.961, 0.973,\
    \ 1.000, 0.305]\n- Masked‑weights row‑normalized (DAQB mask + X_emb weights) (EID\
    \ 1020):\n  0.6626 → [0.659, 0.248, 0.626, 0.722, 0.913, 0.789, 0.352, 0.990,\
    \ 1.000, 0.327]\n- Generalization — vanilla kNN (weighted) on X_emb, k=50 (EID\
    \ 994):\n  0.3039 → [0.659, 0.248, 0.442, 0.658, 0.935, 0.000, 0.032, 0.971, 0.000,\
    \ 0.000]\n- Generalization — vanilla kNN (binary) on X_emb, k=50 (EID 1026):\n\
    \  0.6296 → [0.659, 0.248, 0.607, 0.704, 0.944, 0.790, 0.031, 0.987, 1.000, 0.327]\n\
    \nDiscussion and Conclusion\n- On DAQB graphs, restoring weights sharply degrades\
    \ batch mixing (iLISI normalized 0.352) and lowers ARI/NMI relative to binary\
    \ connectivities with true distances.\n- On a simpler vanilla kNN baseline, weights\
    \ do not improve mixing (iLISI ~0.032 weighted vs ~0.031 binary); binary improves\
    \ overall score via kBET/PCR.\n- Conclusion: quota‑balanced topology with binary\
    \ connectivities is preferable in this spec; edge‑weight magnitudes are not a\
    \ beneficial lever.\nNotes\n- EID 1019 was excluded from analysis because an auto‑debug\
    \ reroute changed λ, confounding interpretation.\n\nReproducibility checklist\n\
    - Hyperparameters (SOTA path): λ=0.605, δ=0.10, kd=22, k=50, cap=2.0, seed=0,\
    \ n_pcs_graph=100, metric=euclidean; binary connectivities + true distances.\n\
    - Outputs: obsp['connectivities'] and obsp['distances'] (CSR), no labels used,\
    \ spec normalization from counts.\n"
