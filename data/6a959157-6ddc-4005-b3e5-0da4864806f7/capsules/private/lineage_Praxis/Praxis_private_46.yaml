  content: 'Title

    Restoring edge weights on DAQB-selected graphs degrades integration on Human Heart,
    with baseline generalization.


    Abstract

    We study whether restoring edge weights on quota-balanced graphs (DAQB) improves
    integration. On the MPB‑GraphFWPCA + BRBG + DAQB pipeline (Human Heart), reinstating
    weights on the DAQB-selected edges degrades the primary score and mixing (iLISI)
    relative to binary connectivities with true distances. Auto-selection of k/kd
    via label-free graph-health proxies also underperforms the fixed SOTA ridge. We
    include a baseline generalization on a simpler vanilla kNN graph to test whether
    edge weights help there. Across ≥5 experiments, binary connectivities remain preferred
    under this spec.


    Introduction

    Batch integration balances removal of technical effects with conservation of biological
    signal. Graph construction choices (binary vs weighted connectivities) are widely
    assumed to help. We evaluate this assumption within an Embed‑then‑Correct family
    using MPB‑GraphFWPCA, BRBG (λ-shrinkage), and DAQB, and we test a simpler vanilla
    kNN baseline.


    Methods

    - Data: Human Heart (~20k × 2k HVGs), counts→normalize_total(1e4)→log1p. No labels
    used.

    - Embedding: MPB‑GraphFWPCA (Praxis lineage), PCA dims=100 for graph path; EtC
    X_emb for QC neighbors.

    - BRBG: column-balanced quotas with λ=0.605, cap=2.0; shrinkage toward uniform.

    - DAQB: density-adaptive quotas with kd=22, δ=0.10; final k=50 neighbors; symmetric
    CSR connectivities and distances.

    - Weighted vs binary: “Binary” sets connectivities=1.0 on selected edges; distances
    are true Euclidean neighbor distances. “Masked-weights” reinstates vanilla scanpy
    weights onto DAQB-selected edges, with/without row-normalization.


    Experiments (spec-ordered metric vectors)

    - SOTA reference (ID 960, k=50,kd=22, λ=0.605, δ=0.10): score 0.7465 → [ASW_batch
    0.659, ASW_label 0.248, ARI 0.774, NMI 0.728, Graph_conn 0.968, kBET 0.789, iLISI
    0.961, cLISI 0.973, PCR 1.000, Cell_cycle 0.366].

    - Auto‑k (ID 1011): 0.7396 → [0.659, 0.248, 0.760, 0.713, 0.967, 0.788, 0.961,
    0.973, 1.000, 0.327].

    - Auto‑kd (ID 1013): 0.7373 → [0.659, 0.248, 0.758, 0.714, 0.967, 0.788, 0.961,
    0.973, 1.000, 0.305].

    - Masked‑weights v1 (ID 1019, note: auto‑debug reroute): 0.7309 → [0.659, 0.248,
    0.674, 0.693, 0.996, 0.791, 0.950, 0.971, 1.000, 0.327].

    - Masked‑weights v2 row‑norm (ID 1020, true test): 0.6626 → [0.659, 0.248, 0.626,
    0.722, 0.913, 0.789, 0.352, 0.990, 1.000, 0.327].

    - Generalization (weighted vanilla kNN on X_emb, k=50) (ID 994): 0.3039 → [0.659,
    0.248, 0.442, 0.658, 0.935, 0.000, 0.032, 0.971, 0.000, 0.000].

    - Generalization (binary vanilla kNN on X_emb, k=50) (PENDING EID): to be inserted;
    method identical to 994 but connectivities binarized; distances preserved.


    Results

    - On DAQB-selected graphs, restoring weights sharply degrades iLISI (to 0.3516
    raw; normalized 0.352) and drops ARI/NMI, confirming binary connectivities with
    true distances are preferable at SOTA settings.

    - Auto‑k/kd near the ridge cannot outperform fixed SOTA.

    - Baseline generalization (vanilla kNN): will report binary vs weighted once PENDING
    EID completes, testing whether weights help on a simpler graph.


    Discussion and Conclusion

    Weighting DAQB-selected edges harms mixing and label preservation under this spec,
    suggesting quota-balanced topology, not weight magnitudes, carries the performance.
    Baseline results probe whether this insight transfers to simpler graphs. Future
    work: label‑free multi‑objective selectors and cross‑dataset checks.

    '
