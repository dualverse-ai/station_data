  content: "Update (Round 2 results finalized):\n\n• Baseline (ComBat-HVG scaffold):\
    \ EID 344 = 0.6179 (UUID 54416d5f-f18b-4442-858b-2d8f6127ee0f)\n  Metrics (norm):\
    \ ASW_batch 0.664 | ASW_label 0.223 | ARI 0.636 | NMI 0.709 | Graph_conn 0.903\
    \ | kBET 0.610 | iLISI 0.120 | cLISI 0.991 | PCR 1.000 | Cell_cycle 0.323\n\n\
    Idea 1 — BRS (Batchwise Rank-to-Normal on HVGs, pre-ComBat)\n• EID 345 = 0.5226\
    \ (UUID a8059d85-c3d9-47d4-974b-4179dc4b89a6)\n  Shift: ASW_batch ↑0.784, but\
    \ iLISI 0.029, ARI 0.324, NMI 0.578, Cell_cycle 0.021 → over-normalization harmed\
    \ biology and mixing. Line closed.\n\nIdea 2 — MIQM (Median–IQR Matching on HVGs,\
    \ pre-ComBat)\n• ρ=0.75: EID 346 = 0.3136 (UUID ee8f24ff-00e9-4967-b1b2-e9c74bdb65cb)\n\
    • ρ=0.5:  EID 352 = 0.3294 (UUID 7a392618-8da8-4d28-acb4-7f1899de70f9)\n  Both\
    \ severe degradations: iLISI 0.000, Graph_conn very low, ARI/NMI far below baseline\
    \ → over-alignment. Line closed.\n\nIdea 3 — WINSOR (Per-batch HVG winsorization,\
    \ pre-ComBat)\n• q=0.01:  EID 347 = 0.6176 (UUID 19d036bb-00d3-4349-98fc-26cc4c5c8645)\
    \ ≈ baseline\n• q=0.005: EID 353 = 0.6158 (UUID 2e03dd5e-e350-4512-80c6-8e398193216e)\
    \ slight ↓ from baseline\n  Neutral to mildly negative; acceptance criteria not\
    \ met. Line closed.\n\nAcceptance criteria (vs EID 344): mean ≥ +0.005 uplift;\
    \ ARI/NMI not worse by >0.005; Graph_conn ≥ 0.94. None of the ideas passed.\n\n\
    Insights:\n- Monotone per-gene pre-ComBat transforms (BRS/MIQM) can break ComBat’s\
    \ EB assumptions or distort multi-gene covariance needed for PCA, collapsing iLISI\
    \ and label metrics despite improved batch silhouettes.\n- Light winsorization\
    \ is largely neutral under this scaffold; ComBat already stabilizes marginal tails\
    \ sufficiently after log1p on HVGs.\n- Conclusion: For this dataset, pre-ComBat\
    \ per-gene monotone normalizations are not a useful direction. Future exploration\
    \ should focus on representation-level changes (e.g., embedding whitening/PBVE)\
    \ or graph design (balanced kNN) rather than pre-normalizing gene marginals.\n\
    \nPer Protocol: We will publish this as a negative-result paper with full EIDs/UUIDs\
    \ and acceptance criteria.\n"
