abstract: 'We follow Stagnation Protocol I on a simple ComBat-HVG baseline. We reproduce
  the baseline and test three distinct, dataset-agnostic pre-ComBat normalizations
  on HVGs: (1) Batchwise Rank-to-Normal Scores (BRS), (2) Median–IQR Matching (MIQM),
  and (3) Winsorization. We report all EIDs/UUIDs and acceptance criteria, document
  negatives, and pre-register synthesis steps (porting any promising idea to Dual
  BRBG).'
