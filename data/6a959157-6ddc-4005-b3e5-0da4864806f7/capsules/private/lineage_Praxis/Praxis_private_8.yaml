  content: "Stagnation Protocol I Report (Draft; will finalize upon pending EIDs completion)\n\
    \n1) Baseline Selection and Reproduction\nBaseline scaffold:\n  normalize_total\
    \ + log1p → HVG (seurat_v3, batch-aware) → ComBat (dense) → PCA(50, HVGs) → kNN(15,\
    \ cosine)\nReproduction:\n  - EID 344 = 0.6179 (UUID 54416d5f-f18b-4442-858b-2d8f6127ee0f)\n\
    \    Metrics (normalized): ASW_batch 0.664 | ASW_label 0.223 | ARI 0.636 | NMI\
    \ 0.709 | Graph_conn 0.903 | kBET 0.610 | iLISI 0.120 | cLISI 0.991 | PCR 1.000\
    \ | Cell_cycle 0.323\n\n2) Ideas (distinct, simple, dataset-agnostic; applied\
    \ on HVGs before ComBat)\nA. BRS — Batchwise Rank-to-Normal Scores\n   - Mechanism:\
    \ per-batch, per-gene monotone map to N(0,1) using mid-ranks to avoid 0/1; then\
    \ ComBat.\n   - Result: EID 345 = 0.5226 (UUID a8059d85-c3d9-47d4-974b-4179dc4b89a6)\n\
    \     Shift: ASW_batch 0.784 ↑ but iLISI 0.029, ARI 0.324, NMI 0.578, Cell_cycle\
    \ 0.021 → over-normalization; negative. Line closed for this baseline.\n\nB. MIQM\
    \ — Batchwise Median–IQR Matching (x' = med_g + (x−med_b)·(IQR_g/IQR_b)^ρ)\n \
    \  - Result (ρ = 0.75): EID 346 = 0.3136 (UUID ee8f24ff-00e9-4967-b1b2-e9c74bdb65cb)\n\
    \     Severe degradation (iLISI 0.000, ARI/NMI/Graph_conn low) → negative. Testing\
    \ gentler ρ = 0.5 in Round 2 (pending EID 352).\n\nC. WINSOR — Per-batch Winsorization\
    \ at [q, 1−q]\n   - Result (q = 0.01): EID 347 = 0.6176 (UUID 19d036bb-00d3-4349-98fc-26cc4c5c8645)\n\
    \     ≈ baseline (minor shifts). Testing lighter q = 0.005 in Round 2 (pending\
    \ EID 353).\n\n3) Acceptance Criteria (pre-registered vs EID 344)\n- Mean score\
    \ uplift ≥ +0.005; ARI and NMI not worse by > 0.005; Graph_conn ≥ 0.94.\n- If\
    \ none pass: report negative results and insights.\n- If one passes: port to Dual\
    \ BRBG embedding (pre-ComBat only), then re-test whitening tau ridge (0.95 vs\
    \ 1.0) and graph degree (k=45 vs 48) once each.\n\n4) Diagnostics (label-free;\
    \ computed inline or via logs)\n- Per-PC batch R² after ComBat, PCA anisotropy\
    \ and participation ratio, kNN distance CV. Target: lower batch predictability\
    \ and more isotropic PCA.\n\n5) Synthesis Plan (if a winner emerges)\n- Insert\
    \ transform into Dual BRBG embedding path only:\n    ComBat → PCA64 → Whitening\
    \ (tau≈0.95) → PBVE(α=0.5);\n    Graph unchanged (adaptive residualization + equal-quotas\
    \ k=48, cosine).\n- Verify tau ridge and degree plateau with single runs.\n\n\
    6) Preliminary Conclusions\n- BRS and MIQM (ρ=0.75) are negative on this baseline;\
    \ WINSOR q=0.01 is neutral.\n- Awaiting Round 2: MIQM ρ=0.5 (EID 352, pending)\
    \ and WINSOR q=0.005 (EID 353, pending).\n- If both are neutral/negative, we will\
    \ submit this report as a negative-result paper with insights, per Protocol.\n"
