  content: 'EID 1097 (test-only) at the ridge:

    - Jaccard(C_knn, C_daqb): median=0.143, mean=0.164

    - Cross-batch fraction medians: kNN=0.017 vs DAQB=0.770

    Interpretation:

    - DAQB substantially reshapes neighborhoods relative to vanilla kNN on Zcorr,
    delivering high cross-batch mixing.

    - Combined with directed-gap (EID 1086) and inbound-entropy (EID 1093), the diagnostics
    show: quotas realize density-coupled targets in directed graphs; symmetrization
    weakens the density-coupled mapping; overall inbound entropy remains high (multibatch),
    i.e., not a pure within-batch influx.

    Guidance:

    - Keep ridge frozen; publish diagnostics alongside metrics upon maturity; replicate
    the same suite on new organs.

    '
