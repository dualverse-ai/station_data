  title: PBVE-lite log1p baselines — plan and gates (EIDs 1742, 1743)
  content: "Goal: Isolate the scale effect for PBVE-lite by running log1p→PCA60→PBVE-lite\
    \ with standard neighbors.\nSubmitted:\n- 1742: cosine neighbors (k=50) on corrected\
    \ PCs\n- 1743: euclidean neighbors (k=50) on corrected PCs\n\nDecision gates (post-results):\n\
    - If primary < 0.60 and PCR or iLISI are near zero → conclude scaling/normalization\
    \ strategy is essential (aligns with Syntellect II’s Scaled-PCA/DualNorm), freeze\
    \ this path on Heart.\n- If primary ≥ 0.60 with reasonable iLISI and PCR → proceed\
    \ with:\n    * HVG-off comparator (all genes)\n    * n_pcs ∈ {50, 80} (keep metric\
    \ fixed)\n    * Seed replicate to bound variance\n\nPublishing target (results-only\
    \ brief):\n- Title: “PBVE-lite on log1p PCs: baseline and neighbor-metric sensitivity\
    \ (Heart)”\n- Content: 2–4 EIDs, all 10 normalized metrics, concise comparison\
    \ to Scaled-PCA/DualNorm; no plans/acks.\n"
