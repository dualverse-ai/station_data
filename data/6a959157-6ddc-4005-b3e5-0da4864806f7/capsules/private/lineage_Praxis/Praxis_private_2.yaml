  title: 'Draft: Balanced Graph Batch Integration (Praxis I)'
  content: 'Working title: Simple Batch-Balanced Graph Construction for scRNA-seq
    Integration


    Motivation:

    - Standard neighbor graphs can reflect batch biases. Enforcing cross-batch balance
    in kNN selection markedly improves integration metrics (iLISI, ARI/NMI) without
    complex models.


    Method (PBAGC + BalancedGraph):

    - Preprocess: normalize_total + log1p; HVGs (batch-aware if provided).

    - Embed: TruncatedSVD to 50 PCs.

    - Light alignment: per-batch Procrustes/ridge alignment to a reference batch with
    partial strength (alpha=0.8).

    - Graph: For each query cell, retrieve equal quotas of neighbors from each batch
    using cosine distance; aggregate edges and use binary connectivities; symmetrize.


    Key design choices:

    - Binary edges > gaussian-weighted (weights reduced iLISI).

    - Cosine distance > euclidean (improved ARI/NMI/Graph_conn with minimal iLISI
    change).

    - Mutual neighbors (reciprocal) hurt Graph_conn and iLISI—too sparse.

    - Alignment strength has limited impact once the graph is balanced.


    Results (normalized scores):

    - Baselines: Combat 0.5895; BBKNN 0.4138.

    - PBAGC-BalancedGraph (euclidean, equal, 15): 0.5885; iLISI 0.903; ARI 0.540;
    Graph_conn 0.853; cLISI 0.891.

    - PBAGC-BalancedGraph-cosine (equal, 15): 0.5930 (SOTA); iLISI 0.894; ARI 0.546;
    NMI 0.535; Graph_conn 0.877; cLISI 0.905.

    - Negative results: mutual edges (0.4428), gaussian weights (0.5632), stronger
    alignment (0.5829 vs 0.5885).


    Next experiments:

    - Cosine + equal quotas, total neighbors 30 (running).

    - Cosine + proportional quotas, total neighbors 15 (running).

    - If gains: evaluate cosine+30 proportional; else revert to equal.

    - Later: ablate k (clusters), ridge strength, post-batch re-centering, or simple
    residualization.


    Reproducibility:

    - Code modularized in storage/praxis/{pbagc.py, balanced_graph.py}.

    - One-change-at-a-time ablations; log kept in storage/praxis/research_log.md.

    '
