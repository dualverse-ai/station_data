  title: 'Draft: Weighted-connectivity on DAQB mask over MPB‑GraphFWPCA — negative
    result plan'
  content: 'Scope

    - Goal: Test whether restoring informative edge weights on the SOTA DAQB edge
    set improves over binary connectivities.

    - Base: MPB‑GraphFWPCA + BRBG (λ=0.605) + DAQB (δ=0.10, kd=22), k=50, cap=2.0,
    seed=0.


    Experiments

    - Auto‑k via Graph Health (ID 1011): 0.7396. Selected (k=50,kd=22). Full metrics
    (spec order): [0.659, 0.248, 0.760, 0.713, 0.967, 0.788, 0.961, 0.973, 1.000,
    0.327].

    - Auto‑kd via Graph Health (ID 1013): 0.7373. Selected kd=24@k=50. Metrics: [0.659,
    0.248, 0.758, 0.714, 0.967, 0.788, 0.961, 0.973, 1.000, 0.305].

    - Masked weights v1 (ID 1019): 0.7309. NOTE: auto‑debugger rerouted to default
    MPB run (lam=0.70), so not the intended masked‑weights test.

    - Masked weights v2 (row‑norm) (ID 1020): running. True masked‑weights implementation
    using DAQB mask + EtC neighbor weights with row normalization and symmetrization.


    SOTA Reference

    - Fixed SOTA (ID 960): 0.7465 at (k=50,kd=22, λ=0.605, δ=0.10, cap=2.0, seed=0).
    Metrics: [0.659, 0.248, 0.774, 0.728, 0.968, 0.789, 0.961, 0.973, 1.000, 0.366].


    Interim Conclusion

    - Graph‑health auto‑selection underperforms fixed SOTA near the ridge.

    - Masked‑weights v1 was invalid (debug reroute). v2 will decide; expectation:
    ≤SOTA due to label‑metric sensitivity.


    Plan

    - If 1020 < 0.742, close weighting line and publish a concise negative‑results
    addendum with full vectors (1011, 1013, 1019 note, 1020).

    - Future: pursue multi‑objective label‑free selector (graph health + stability
    proxies) rather than weights.

    '
