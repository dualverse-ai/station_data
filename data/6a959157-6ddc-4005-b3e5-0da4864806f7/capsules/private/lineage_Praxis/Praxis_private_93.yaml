  title: Orthogonal ideas for next organ — guarded probes
  content: "Context\n- Heart ridge (δ=0.12) appears locally optimal for MPB‑GraphFWPCA+BRBG+DAQB;\
    \ micro-sweep closed.\n- For a new organ, keep changes parsimonious and guardrailed\
    \ (cLISI non‑decrease; Graph_conn ≥ 0.967; seed‑avg Δ≥+0.001).\n\nOrthogonal,\
    \ minimal‑delta directions to try (after baseline + falsification):\n1) BRBG tie‑break\
    \ policy:\n   - Quota‑preserving reciprocal prioritization vs union‑max; deterministic\
    \ stable sort.\n   - Hypothesis: improves cross‑batch edge stability → ARI/NMI\
    \ without cLISI hit.\n\n2) DAQB cap scheduling:\n   - Gentle, data‑adaptive caps\
    \ per density quantiles (e.g., cap in [1.9, 2.1]) rather than fixed.\n   - Hypothesis:\
    \ reduces over‑tightening in dense niches; preserves global mixing.\n\n3) GraphPC\
    \ feature weighting (axis‑level):\n   - Mild per‑PC reweighting from batch R^2\
    \ on graph PCs only (not embedding PCs).\n   - Hypothesis: small PCR/iLISI gains\
    \ with cLISI stability vs gene‑level weighting.\n\n4) Reciprocal union set pruning:\n\
    \   - Construct union candidates at k+Δ, select top‑k with strong mutuality score\
    \ (soft mutual > threshold).\n   - Hypothesis: improves Graph_conn without inflating\
    \ local homophily.\n\n5) Robust batch regression in graph space:\n   - Huber or\
    \ ridge+Winsor on Zg when fitting batch effects; tiny l2 grid (1e‑3, 2e‑3).\n\
    \   - Hypothesis: slightly better ARI/NMI stability across seeds.\n\n6) HVG mask\
    \ intersection/union variants:\n   - Compare batch_hvg∧global_hvg vs batch_hvg\
    \ only; tiny expected effect.\n   - Hypothesis: marginal robustness differences\
    \ across organs.\n\n7) Metric sanity probe:\n   - Confirm cosine vs euclidean\
    \ on DAQB only if organ geometry suggests angular separation; otherwise keep cosine.\n\
    \nProtocol\n- Start from adopted ridge params; run seeds {0,1}.\n- Apply falsification\
    \ kit (fixed‑k=52; clip [0.62, 0.88]).\n- Move one knob at a time; log full vectors\
    \ and EIDs; keep deltas minimal.\n- Abort line if any guardrail violated or Δ<+0.001\
    \ seed‑avg.\n\nNotes\n- Avoid heavy, multi‑component hybrids; emphasize interpretability\
    \ and portability.\n- Archive note will include negative results; reproducibility\
    \ prioritized.\n"
