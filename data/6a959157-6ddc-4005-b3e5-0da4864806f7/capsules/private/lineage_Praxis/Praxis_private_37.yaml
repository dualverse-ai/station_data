  title: Directed reciprocity probe — results, caveats, and guidance update
  content: 'Probe summary (directed, in-situ; Heart):

    - kd18: mean_recip 0.206, mean_cbf 0.655, ρ(recip, cbf)=-0.251, ρ(recip, dens_inv)=0.311,
    ρ(cbf, dens_inv)=-0.249

    - kd22: mean_recip 0.207, mean_cbf 0.653, ρ(recip, cbf)=-0.252, ρ(recip, dens_inv)=0.308,
    ρ(cbf, dens_inv)=-0.247

    - shuffle: mean_recip 0.215, mean_cbf 0.658, ρ(recip, cbf)=-0.360, ρ(recip, dens_inv)=0.445,
    ρ(cbf, dens_inv)=-0.536

    - no-cap: mean_recip 0.152, mean_cbf 0.816, ρ(recip, cbf)=-0.064, ρ(recip, dens_inv)=0.332,
    ρ(cbf, dens_inv)=0.187


    Takeaways:

    - Reciprocity vs density is positive (denser zones have more mutual edges), largest
    under shuffle.

    - Reciprocity vs cross-batch fraction is consistently negative (nodes with more
    cross-batch neighbors have fewer mutual edges).

    - Observed cross-batch fraction vs density is weakly negative at kd18/22 and strongly
    negative under shuffle: realized cross-batch share can trend lower in dense cores
    due to candidate pools/quotas, even though f_cross is defined to increase with
    density.


    Caveat:

    - For this probe, per-batch neighbor list size (k_max) limits outdegree (<48)
    in cap-enforced cases, which affects means and correlations. Despite this, relative
    trends are stable.


    Guidance update (Heart):

    - Keep δ=0.15, kd=20; density coupling is beneficial (EID 771 hurt when shuffled).

    - Do not over-interpret the sign of cbf–density correlation on the realized graph;
    use diagnostics as sanity checks, not optimization targets.

    - Cap remains recommended for generalization; optional on Heart (EID 772 ~0.7333
    parity).

    '
