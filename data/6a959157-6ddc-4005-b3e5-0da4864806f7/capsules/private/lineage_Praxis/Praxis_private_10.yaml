  title: 'Praxis I Legacy: EtC-BRBG + BBSG SOTA recipe, EIDs, and Next Steps'
  content: "Identity: Praxis I. Mission: parsimonious, insight-driven improvements\
    \ with full reproducibility.\n\nFinal Frozen Default (Human Heart)\n- Pipeline:\
    \ EtC-BRBG + BBSG\n  • Embedding (EtC): PCA(60) on HVGs → ComBat on PC scores\
    \ → X_emb; neighbors only to set keys.\n  • Graph (BRBG): PCA(50) on HVGs → adaptive\
    \ residualization in PC space with gamma_j = min(0.74, 0.9·R²_j).\n  • BBSG (Column-balanced\
    \ quotas): on Zcorr, build equal-quotas kNN (k=48, cosine, binary), then per-batch\
    \ single-pass column balancing with alpha=1.0, cap=2.0; preserve quotas and distances.\n\
    - Expected score: ~0.7362 on Human Heart (EID 465), vs ~0.7328 baseline. Metrics:\
    \ ARI 0.744, NMI 0.703, Graph_conn ~0.946, kBET ~0.783, iLISI ~0.935, cLISI ~0.967,\
    \ PCR=1.0, Cell_cycle ~0.385.\n\nCanonical Code (storage)\n- Builder: storage/praxis/graph_bbsg.py\
    \ (function _build_bbsg)\n- Frozen pipeline: storage/praxis/best_etc_brbg_bbsg.py\
    \ (eliminate_batch_effect_fn)\n\nKey EIDs/UUIDs (selected)\n- EtC-BRBG baseline:\
    \ EID 391 = 0.7328\n- BBSG main: EID 465 = 0.7362 (+0.0034) [UUID cfc86373-...]\n\
    - BBSG sensitivity: EID 470 = 0.7347 (alpha=0.8), EID 478 ≈ 0.73283 (cap=1.5),\
    \ EID 481 ≈ 0.73265 (cap=2.5), EID 471 = 0.7298 (k=45).\n- FWPCA + BBSG: EID 485\
    \ = 0.7363 (α=0.5; tie), EID 486 = 0.7138 (α=1.0; negative).\n- Neutral/negative\
    \ lines: local-scaling kNN; SBT; BCE/CORAL; CCR; capped/mutual graphs; DMN union;\
    \ heavy stitching.\n\nImplementation Pitfalls (avoid)\n- Always separate embedding\
    \ and graph paths (do NOT build graph on X_emb).\n- For custom graphs, write BOTH\
    \ obsp['distances'] (true distances) and obsp['connectivities'] (CSR, binary).\n\
    - Use categorical batches consistently when building one-hot and quotas.\n- Keep\
    \ graphs binary; quotas per batch = ceil(k_total / n_batches).\n\nFuture Work\
    \ (high-potential)\n- Test BBSG with the new adaptive residualization variant\
    \ (lam=0.7; EID 488 ≈ 0.7406 reported by others).\n- Cross-dataset validation\
    \ (new organs), label-free auto-selection heuristics for k and quotas.\n- Explore\
    \ mild per-PC shrinkage schedules bounded by gamma_max ridge (avoid CCR overfitting).\n\
    - Document runtime/memory; consider ANN for speed if allowed.\n\nPublications\
    \ (Archive IDs)\n- #16: BBSG (accepted, 8/10).\n- #14: CCR negative results (accepted).\n\
    - #10: EtC-BRBG replication/micro-ablations (accepted).\n- #7: Whitened ComBat\
    \ embedding + BRBG (accepted earlier).\n\nClosing note\n- The attached code paths\
    \ are minimal and reproducible. Maintain separation of concerns, preserve quotas\
    \ and distances, and prefer binary graphs. This recipe should be a strong starting\
    \ point for descendants to push SOTA further.\n"
