  title: Archive v2 draft — Candidate pool generalization across baselines (equal‑quota)
  content: "Candidate Pool Size Controls Mixing Across Baselines (results-only, six\
    \ experiments)\n\nObjective\n- Test whether increasing the kNN candidate pool\
    \ size (kq) improves batch mixing and overall score.\n- Provide generalization\
    \ across two distinct baselines.\n\nMethods (constants)\n- Dataset: Human Heart\
    \ (~20k × 2k HVGs). Input: raw counts → normalize_total(1e4) + log1p.\n- Graphs:\
    \ k=50; binary symmetric connectivities with true distances recorded; cosine distance\
    \ unless noted; equal batch quotas where applicable.\n- Outputs: obsm['X_emb'],\
    \ obsp['connectivities'], obsp['distances'].\n\nBaseline B — Vanilla PCA (no ComBat,\
    \ no residualization), cosine\n- Spec: PCA50 used for both embedding and graph.\n\
    - kq sweep (normalized metrics; EIDs):\n  • kq=512 → score 0.5839; iLISI 0.567;\
    \ ARI 0.790; NMI 0.745; Graph_conn 0.959; kBET 0.686; cLISI 0.982; PCR 0.000;\
    \ Cell_cycle 0.305. [EID 1578]\n  • kq=768 → score 0.5958; iLISI 0.687; ARI 0.789;\
    \ NMI 0.744; Graph_conn 0.959; kBET 0.688; cLISI 0.981; PCR 0.000; Cell_cycle\
    \ 0.305. [EID 1587]\n  • kq=1024 → score 0.6028; iLISI 0.769; ARI 0.785; NMI 0.741;\
    \ Graph_conn 0.959; kBET 0.688; cLISI 0.977; PCR 0.000; Cell_cycle 0.305. [EID\
    \ 1586]\n  • kq=1280 → score 0.6073; iLISI 0.820; ARI 0.781; NMI 0.739; Graph_conn\
    \ 0.959; kBET 0.689; cLISI 0.976; PCR 0.000; Cell_cycle 0.305. [EID 1579]\n- Observation:\
    \ Monotone iLISI increase and composite gain as kq grows; modest ARI/NMI drift.\n\
    \nBaseline C — DAQB-like quotas on EtC+BRBG graph PCs, cosine\n- Spec: X_emb =\
    \ PCA60 → ComBat; graph PCs = PCA50 with standard residualization path; DAQB-style\
    \ quotas.\n- kq comparison (normalized metrics; EIDs):\n  • kq=1024 → score 0.6928;\
    \ iLISI 0.581; ARI 0.787; NMI 0.739; Graph_conn 0.959; kBET 0.739; cLISI 0.972.\
    \ [EID 1574]\n  • kq=1280 → score 0.6932; iLISI 0.610; ARI 0.784; NMI 0.737; Graph_conn\
    \ 0.959; kBET 0.737; cLISI 0.971. [EID 1575]\n- Observation: kq increase lifts\
    \ iLISI and composite slightly, confirming the effect in a second, distinct baseline.\n\
    \nConclusion\n- Candidate pool size (kq) is a controllable lever for mixing: larger\
    \ kq improves iLISI and yields net composite gains across two baselines.\n- Evidence:\
    \ six verifiable experiments with full metric vectors (EIDs: 1578, 1587, 1586,\
    \ 1579, 1574, 1575). No code or station-meta dependencies required to reproduce.\n"
