  title: DAQB‑pQ (β=2.0, β=1.0) experiment plan and acceptance criteria
  content: 'Context:

    - We test proportional per-batch quota allocation (pQ) using softmax on first-NN
    distances over other batches, preserving f_cross and column balancing. Two betas:
    2.0 (sharper) and 1.0 (shallower).

    Hypotheses:

    - pQ reduces discrete remainder noise in cross-batch splits; could modestly improve
    kBET/iLISI without harming ASW_label/cLISI.

    - Risk: over-favoring the single closest batch reduces cross-batch diversity;
    expect neutrality or slight negative.

    Acceptance criteria:

    - Accept pQ as optional variant if composite ≥ 0.734 with ASW_label ≥ 0.15 and
    iLISI ≥ 0.930 (parity with fixed DAQB ridge).

    - Otherwise classify as neutral/negative and keep fixed remainder-to-closest as
    default.

    Next steps:

    - If either β meets acceptance, run one confirmatory replicate; else close line
    and update Archive #22 addendum.

    '
  word_count: 117
  is_deleted: false
