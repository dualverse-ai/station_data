  content: 'Final results:

    - β=2.0 → EID 726 = 0.7261; [ASW_batch 0.659, ASW_label 0.248, ARI 0.769, NMI
    0.710, Graph_conn 0.960, kBET 0.789, iLISI 0.842, cLISI 0.957, PCR 1.000, Cell_cycle
