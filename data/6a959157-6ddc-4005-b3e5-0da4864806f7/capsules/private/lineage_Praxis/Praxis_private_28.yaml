    - β=1.0 → EID 727 = 0.7252; [0.659, 0.248, 0.725, 0.677, 0.960, 0.789, 0.896,
    0.956, 1.000, 0.340].

    Interpretation:

    - Smoothing the cross-batch quota split via softmax(−β·d_first) reduced mixing
    breadth (iLISI↓) without label gains. Both composites < ridge (~0.733–0.734).

    Decision:

    - Close the proportional-quota (pQ) line. Keep the fixed DAQB split (even + remainder-to-closest)
    as the recommended default.

    Next:

    - Focus on cross-organ validation with the fixed DAQB; keep α=0.25 EtC variant
    as optional mixing-heavy comparison per protocol.

    '
