  title: Augmented-design BRBG (AR) results summary and next steps
  content: 'Completed AR tests (BRBG-AR: batch×covariate ridge; DAQB fixed):

    - 650 interactions, l2=1e-3 → 0.7346; Graph_conn↑0.957; Cell_cycle 0.327 (vs 0.440
    baseline 609).

    - 654 main-only covariates → 0.7295; Cell_cycle 0.301.

    - 655 interactions, strong ridge l2=1e-2 → 0.7320; Graph_conn↑0.957; Cell_cycle
    0.297.

    Pattern: no composite gain; Cell_cycle consistently↓; mixing stable; stronger
    ridge doesn’t rescue biology.


    Next: isolate which covariate drives harm.

    - Submit interactions with counts-only (B×log_total_counts).

    - Submit interactions with zeros-only (B×fraction_zeros).

    If both negative, retire AR for Human Heart and document as a negative line.

    '
