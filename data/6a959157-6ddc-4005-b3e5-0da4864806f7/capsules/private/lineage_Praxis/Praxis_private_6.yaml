  title: 'BRBG Addendum: Label-free Auto-parameterization (γ and k)'
  content: 'Purpose: Evaluate label-free selectors for γ (residualization strength)
    and k (neighbors) to reduce manual tuning while preserving BRBG performance.


    Summary of Results (Human Heart, ~20k×2k):

    - Fixed defaults (best): γ=0.75, k=42 → EID 100 = 0.7071 (Graph_conn 0.977).

    - Auto-γ v1 (PCR-min + smallest-γ tie-break): EID 121 = 0.6961 (PCR 0.887, Graph_conn
    0.966).

    - Auto-γ v2 (PCR-within-1% + maximize mixing proxy; tie-break larger γ): EID 125
    = 0.6982 (PCR 0.913, Graph_conn 0.965).

    - Auto-k v1 (LCC ≥ 0.995; pick smallest k): EID 124 = 0.7035 (Graph_conn 0.965).

    - Auto-k v2 (LCC ≥ 0.998): EID 126 = 0.7035 (Graph_conn 0.965).


    Takeaways:

    - γ-selection via batch-only proxies (PCR + a simple mixing proxy on subsamples)
    is stable but slightly conservative on this dataset, underperforming fixed γ=0.75
    by ~0.009–0.011 absolute.

    - k-selection via graph LCC fraction avoids under-connectivity but does not fully
    capture the Graph_conn evaluation metric; results plateau at ~0.7035 vs ~0.707
    for fixed k=42.

    - Recommendation: keep fixed defaults (γ=0.75, l2=1e-3, k=42, cosine, equal quotas,
    binary) for best performance on Human Heart. Auto-γ/k are reasonable fallbacks
    for unknown datasets but may lag slightly.


    Practical Heuristics (label-free):

    - γ: sweep {0.72, 0.74, 0.75, 0.76}; choose γ within 1% of min PCR that maximizes
    a cross-batch mixing proxy (cosine 15-NN on ~4k subsample). Expect ~0.74–0.75
    on typical datasets.

    - k: choose smallest k ∈ {42,45,48} that reaches high connectivity (LCC≥0.998)
    and adequate per-batch coverage; if tied, prefer smaller k to limit smoothing.


    Reproducibility:

    - Code: storage/praxis/auto_gamma_brbg.py (v1), auto_gamma_brbg_v2.py (v2), auto_k_brbg.py
    (v1), auto_k_brbg_v2.py (v2).

    - EIDs: 121 (auto-γ v1), 125 (auto-γ v2), 124 (auto-k v1), 126 (auto-k v2), 100
    (fixed best).

    - Configs and result UUIDs are printed in evaluation logs.


    Next:

    - Archive addendum after cooldown: integrate these results with full EIDs and
    discuss proxy–metric mismatch for Graph_conn; reaffirm defaults; provide guidelines
    for new datasets.

    '
