  content: "**Research Task 1: Single-cell RNA-seq Batch Integration**\n\n**Problem\
    \ Summary:**\nThe goal is to integrate single-cell RNA-seq datasets from different\
    \ batches (studies/technologies) to remove technical variation while preserving\
    \ true biological signals (cell types). The key challenge is to balance batch\
    \ effect removal with biological conservation.\n\n**Key Constraints/Requirements:**\n\
    -   Input data: `adata.X` contains RAW UMI COUNTS.\n-   **Preprocessing:** Must\
    \ apply `normalize_total + log1p` to raw counts.\n-   **CRITICAL:** DO NOT use\
    \ `cell_type` information for integration, either directly or indirectly.\n- \
    \  **Output:** Return `AnnData` with either `adata.obsm['X_emb']` (integrated\
    \ embedding, `n_cells × n_components`) OR both `adata.obsp['connectivities']`\
    \ and `adata.obsp['distances']` (batch-corrected graph, sparse CSR matrices).\n\
    -   **Evaluation:** Based on 10 normalized OpenProblems 2.0 metrics, averaged\
    \ for the primary score. Metrics include ASW_batch, ASW_label, ARI, NMI, Graph_conn,\
    \ kBET, iLISI, cLISI, PCR, Cell_cycle.\n-   **Technical Limitations:** 30-minute\
    \ timeout, ~20k cells × 2k genes, no GPU, sparse matrices preferred. Libraries:\
    \ scanpy, scikit-learn, numpy, scipy, JAX/Flax, pandas, anndata.\n-   **Research\
    \ Strategies:** Emphasize explicit batch effect modeling, biological conservation,\
    \ scalability, efficiency, simplicity, generalizability. Avoid dataset-specific\
    \ hyperparameter tuning.\n\n**Initial Action Plan:**\n\n1.  **Review Baselines:**\
    \ The problem description mentions \"BBKNN Manual Baseline\" (score 0.4138) and\
    \ \"Combat Manual Baseline\" (score 0.5895). The `Combat` baseline has a higher\
    \ score. I will review these implementations via `_action{review <evaluation_id>}`\
    \ to understand their approaches. This will help inform my own strategy.\n2. \
    \ **Initial Submission - Simple Baseline:**\n    *   Implement the required preprocessing\
    \ (`normalize_total + log1p`) as the first step.\n    *   For a first attempt,\
    \ I will implement a straightforward integration method using `scanpy`. A possible\
    \ starting point could be a basic PCA followed by nearest-neighbor graph construction,\
    \ or a simple batch correction available in `scanpy` (e.g., `scanpy.pp.combat`\
    \ or `scanpy.external.pp.bbknn` for understanding the provided baselines better,\
    \ though I'll aim for something slightly different than the exact baselines initially\
    \ if I can quickly conceptualize a minor improvement). The key is to ensure it\
    \ adheres to all constraints, especially the non-usage of `cell_type` information.\n\
    \    *   Focus on generating the required output format (either `X_emb` or graph\
    \ matrices).\n3.  **Analysis and Iteration:**\n    *   After the initial submission,\
    \ carefully analyze the individual normalized metric scores to identify strengths\
    \ and weaknesses.\n    *   For example:\n        *   If `iLISI` and `kBET` (batch\
    \ mixing) are low, the batch effect removal is insufficient.\n        *   If `ASW_label`,\
    \ `ARI`, `NMI`, `cLISI` (biological preservation) are low, biological signal is\
    \ being over-corrected or lost.\n        *   `Graph_conn` indicates the overall\
    \ connectivity of the integrated graph.\n    *   Based on this analysis, iterate\
    \ on the method to improve specific metrics.\n\n**Self-reflection/Notes:**\n*\
    \   Given the constraints and available libraries, `scanpy` will be a primary\
    \ tool.\n*   The \"Simplicity and Generalizability\" strategy suggests avoiding\
    \ overly complex methods or hyperparameter tuning that might overfit to the specific\
    \ dataset.\n*   Considering the system tip about questioning fundamentals, I should\
    \ consider if any common steps in batch integration for scRNA-seq are ripe for\
    \ re-thinking.\n*   The prompt specifies raw UMI counts and requires normalization,\
    \ which is a common source of variability and potential issues.\n\nMy next step\
    \ will be to review the \"Combat Manual Baseline\" and \"BBKNN Manual Baseline\"\
    \ to gain a deeper understanding of the existing approaches. I'll start with the\
    \ Combat baseline as it has the higher score.\n"
