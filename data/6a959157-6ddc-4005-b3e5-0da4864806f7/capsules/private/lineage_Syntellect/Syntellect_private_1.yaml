  content: "**Update: Second Research Submission (ID 1122): Combat-PCA with Zero-Variance\
    \ Gene Filtering**\n\n**Summary:**\nSubmitted a refined Combat-PCA baseline that\
    \ included `sc.pp.filter_genes(adata_hvg, min_cells=1)` before `sc.pp.combat`\
    \ to address previous `RuntimeWarning` and improve stability.\n\n**Results:**\n\
    -   **Overall Score:** 0.6236 (Slight improvement from 0.6210)\n-   **Individual\
    \ Normalized Metric Scores:**\n    -   ASW_batch: 0.748 (No change)\n    -   ASW_label:\
    \ 0.207 (No change)\n    -   ARI: 0.596 (No change)\n    -   NMI: 0.690 (Slight\
    \ improvement from 0.689)\n    -   Graph_conn: 0.909 (Slight improvement from\
    \ 0.908)\n    -   **kBET: 0.744 (Significant improvement from 0.685)**\n    -\
    \   iLISI: 0.109 (No change, still low)\n    -   cLISI: 0.984 (No change)\n  \
    \  -   PCR: 1.000 (No change)\n    -   **Cell_cycle: 0.249 (Slight decrease from\
    \ 0.285)**\n\n**Observations:**\n-   The overall score slightly improved, primarily\
    \ driven by a significant gain in `kBET`, indicating better global batch mixing.\n\
    -   **Persistent Warning:** Despite filtering zero-variance genes, the `RuntimeWarning:\
    \ divide by zero encountered in divide` from `scanpy.preprocessing._combat.py`\
    \ still occurred in the execution log. This suggests `min_cells=1` was not sufficient\
    \ to fully robustify `combat` for this dataset, or the warning originates from\
    \ a different condition. I need to investigate this further.\n-   **Stagnant iLISI\
    \ & ASW_label:** Local batch mixing (`iLISI`) and biological separation (`ASW_label`)\
    \ remained low and unchanged, suggesting the current approach is not effectively\
    \ improving these aspects.\n-   **Decreased Cell_cycle:** Conservation of cell\
    \ cycle effects slightly worsened. This reinforces the idea that `combat` might\
    \ still be over-correcting some biological signals.\n\n**Next Steps:**\nThe `RuntimeWarning`\
    \ is a persistent issue, but it didn't prevent a score improvement. Given the\
    \ stagnation in `iLISI` and `ASW_label`, I will now proceed with the next planned\
    \ iteration: increasing the number of PCA components to 150. This aims to capture\
    \ more variance and potentially improve the representation for local structure\
    \ and biological preservation. If this doesn't yield significant changes, I will\
    \ need to consider alternative batch integration methods more seriously.\n"
