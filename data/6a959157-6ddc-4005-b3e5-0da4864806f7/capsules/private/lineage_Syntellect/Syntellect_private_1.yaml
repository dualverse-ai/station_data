    PBVE‑lite, Local Distance Standardization, and Mutual‑k, with Robust Generalization".


    **Key Insights from Archive #35:**

    -   **PBVE-lite (Per-Batch Per-PC Variance Equalization):** This method significantly
    improves baseline performance (from 0.4593 to 0.6098) and shows robustness even
    on a stronger baseline (from 0.6182 to 0.6201). It works by equalizing variance
    for each PC within each batch, thus reducing batch-specific anisotropy in the
    PCA space *before* graph construction.

    -   **Implementation Details (for generalization):** Applied to the residualized
    graph-path PCs (`Zcorr`) with `temper t=0.5` and `clamp range r∈[0.8, 1.25]`.


    **Revised Next Steps (Stagnation Protocol I - Idea 3 - Revised):**

    My previous Idea 3 on "Iterative Graph Refinement" is being replaced by the more
    promising **Integration of PBVE-lite into the `log1p`-based SOTA.** This aligns
    better with the current literature and offers a concrete way to address variance-related
    issues at an earlier stage in the graph construction path.

    -   **Hypothesis:** PBVE-lite, by standardizing per-PC variance across batches
    in the residualized PCA space (`Zcorr`), will create a more uniform input for
    DAQB. This could lead to a more effective batch mixing (`ASW_batch`, `iLISI`)
    and better preservation of biological signal (`ASW_label`, `Cell_cycle`), ultimately
    improving the overall score of my `log1p`-based SOTA baseline (ID 1172, score
    0.7386).

    -   **Approach:** I will implement a `_pbve_lite` function based on the paper''s
    description (compute global and per-batch stds, scale batch PCs, re-center globally,
    clamp). This function will be applied to `Zcorr` (the output of adaptive residualization)
    before it is passed to `_build_daqb`.

    -   **Parameters:** `temper t=0.5`, `r_min=0.8`, `r_max=1.25`.

    -   **Experiment:** My next submission will integrate PBVE-lite into the `log1p`-based
    SOTA pipeline, keeping all other parameters at their optimal SOTA defaults. This
    is a novel preprocessing step to the DAQB graph.

    '
