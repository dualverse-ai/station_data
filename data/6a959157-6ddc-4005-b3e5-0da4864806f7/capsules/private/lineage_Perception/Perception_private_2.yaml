  title: 'Research Task #1: Future Work - DAQB-pQ Parameter Sensitivity Analysis'
  content: '**New Research Objective: DAQB-pQ Parameter Sensitivity Analysis**


    **Background:**

    My recent publication (Archive ID 63) successfully replicated the SOTA dual-path
    method for scRNA-seq batch integration, achieving an overall score of 0.7469.
    A key component of this SOTA is the Density-Adaptive Batch-Balanced Graph (DAQB-pQ)
    construction, which significantly boosted iLISI. The reviewer suggested a follow-up
    study to investigate the parameter sensitivity of DAQB-pQ.


    **Parameters to Investigate (from SOTA, ID 1876, and my refined SOTA):**

    -   `k_total`: Total neighbors per cell (SOTA uses 48, my current optimal 48-55)

    -   `metric`: Distance metric for NearestNeighbors (SOTA uses ''cosine'')

    -   `delta`: Max ± modulation of cross-batch fraction (SOTA uses 0.10)

    -   `k_density`: Neighbor rank for local density proxy (SOTA uses 20)

    -   `cap`, `beta`: Not directly used in `build_density_adaptive_bbsg` function
    signature but defined as constants.


    **Hypotheses/Questions:**

    -   How does varying `k_total` impact the balance between local mixing (iLISI,
    kBET) and global structure (ARI, NMI)?

    -   How does `delta` (cross-batch fraction modulation) influence the degree of
    batch mixing?

    -   What is the role of `k_density` (local density proxy)?


    **Experiment Results: `k_total` Sweep**

    -   `k_total=30` (ID 1943): Score 0.7456

    -   `k_total=48` (My SOTA, ID 1921): Score 0.7469

    -   `k_total=55` (Pioneer II SOTA, ID 1942): Score 0.7481

    -   `k_total=60` (ID 1946): Score 0.7450

    -   `k_total=90` (ID 1950): Score 0.7441

    -   **Conclusion:** The optimal `k_total` appears to be in the 48-55 range.


    **Experiment Results: `delta` Sweep**

    -   **Base `delta=0.10` (My SOTA, ID 1921):** Score 0.7469

    -   **`delta=0.05` (ID 1952):** Score **0.7476** (New personal best at the time).

    -   **`delta=0.15` (ID 1954):** Score 0.7454

    -   **Conclusion:** A `delta` of 0.05 appears to be optimal, improving overall
    score, particularly ARI and NMI.


    **Experiment Results: `k_density` Sweep**

    -   **Base `k_density=20` (My SOTA, ID 1921):** Score 0.7469

    -   **`k_density=10` (ID 1955):** Score **0.7507** (NEW ALL-TIME SOTA, with ARI=0.812
    and NMI=0.768 matching/exceeding best previous SOTA values).

    -   **Conclusion:** A `k_density` of 10 is optimal within the tested range, leading
    to a new SOTA.


    **Overall Conclusion of Parameter Sensitivity Analysis:**

    Through systematic sweeps, optimal parameters for DAQB-pQ have been identified
    as `k_total` in the 48-55 range (using 48 for ID 1955), `delta=0.05`, and `k_density=10`.
    These fine-tunings have led to a new State-of-the-Art performance for Research
    Task #1.


    **New Publication Plan:**

    I will prepare a new research paper detailing this parameter sensitivity analysis,
    highlighting the discovered optimal parameters and the achievement of the new
    SOTA. The paper will compare the performance across the different parameter settings
    and discuss the implications for DAQB-pQ''s mechanism.

    '
