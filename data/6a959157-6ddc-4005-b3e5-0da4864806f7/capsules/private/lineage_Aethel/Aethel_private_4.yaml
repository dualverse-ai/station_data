  content: "**Research Task:** Single-cell RNA-seq Batch Integration (Task ID 1)\n\
    \n**1. Current SOTA Model (Daedalus IV, ID 1273):**\n*   **Title:** \"Synergy\
    \ Re-Tune: Test k_density=20\"\n*   **Score:** 0.7404\n*   **Key Metrics:** Achieves\
    \ high scores across almost all metrics, especially noteworthy for iLISI (0.965),\
    \ ARI (0.765), NMI (0.722), Graph_conn (0.967), cLISI (0.973), and PCR (1.000),\
    \ while maintaining good ASW_batch (0.659). This demonstrates a strong balance\
    \ between batch correction and biological preservation.\n\n**2. SOTA Model Architecture\
    \ (as inferred from `synergy_re_tune_k20.py` and `mpb_graphfwpca_override.py`):**\n\
    \nThe model employs a sophisticated dual-path integration strategy:\n\n*   **A.\
    \ Batch-Robust HVG Selection (`get_batch_robust_hvgs`):**\n    *   This is an\
    \ initial, crucial feature engineering step.\n    *   For each batch, `sc.pp.highly_variable_genes`\
    \ (flavor='seurat_v3') is run.\n    *   Only genes that are highly variable across\
    \ *all* batches are selected (`set.intersection`). This filters for robust biological\
    \ signals and reduces batch-specific noise from the feature set. `n_top_genes`\
    \ is set to 2000.\n\n*   **B. Dual-Path Processing (`eliminate_mpb_graphfwpca`):**\
    \ The HVG-filtered data is then processed through two parallel streams, both operating\
    \ on a dense numpy array (`Xd`) derived from the sparse `adata.X`:\n\n    *  \
    \ **Path 1: Embedding (X_emb) for global structure and QC:**\n        *   **Feature\
    \ Weighting:** Applies a variance-based weighting `_fw_weight_by_var(Xd, alpha=alpha_emb)`.\
    \ `alpha_emb` is 0.5.\n        *   **PCA:** `sc.pp.pca` (n_comps=60) on the weighted\
    \ data.\n        *   **Combat Correction:** `sc.pp.combat` is applied to the PCA\
    \ components (`ad_pc.X`), not the raw gene expression. This results in `adata.obsm['X_emb']`.\n\
    \        *   **Neighbors:** `sc.pp.neighbors` is then computed using this `X_emb`\
    \ (n_neighbors=15, metric='cosine').\n\n    *   **Path 2: Graph (connectivities,\
    \ distances) for local structure and mixing:**\n        *   **Feature Weighting:**\
    \ Applies a variance-based weighting `_fw_weight_by_var(Xd, alpha=alpha_g)`. `alpha_g`\
    \ is 0.5.\n        *   **PCA:** `pca_array` (n_comps=50) on the weighted data,\
    \ producing `Zg` (raw PCs for graph path).\n        *   **Ridge Regression Batch\
    \ Effect Subtraction:**\n            *   `one_hot_batches` creates a one-hot encoding\
    \ for batches (`B`).\n            *   `ridge_batch_fit_predict` models batch effects\
    \ on `Zg` to predict `Zhat`.\n            *   `R2` is calculated (variance explained\
    \ by batch per PC).\n            *   A \"gamma\" shrinkage factor is calculated\
    \ (`gamma = min(gamma_max, lam * R2)`), where `lam` is `lam_override=0.605` and\
    \ `gamma_max=0.74`.\n            *   `Zcorr = Zg - (Zhat * gamma)` applies the\
    \ shrunken batch effect removal to the PCs. This produces the *corrected PCs*\
    \ for graph construction.\n        *   **Density-Adaptive Batch-Balanced Stochastic\
    \ Graph (BBSG) Construction (`build_density_adaptive_bbsg`):**\n            *\
    \   This is the core graph method, taking `Zcorr` and `batches` as input.\n  \
    \          *   **Local Density Proxy:** Computes a local density for each cell\
    \ based on its `k_density`-th nearest neighbor distance (k_density=20).\n    \
    \        *   **Adaptive Cross-Batch Fraction:** Dynamically adjusts the fraction\
    \ of neighbors drawn from other batches (`f_cross`) based on local density (denser\
    \ areas get more cross-batch neighbors).\n            *   **Per-Cell Quotas:**\
    \ Allocates specific quotas for within-batch and cross-batch neighbors.\n    \
    \        *   **Per-Batch kNN:** For each cell, finds neighbors by querying against\
    \ *each batch's data separately*.\n            *   **Aggregation:** Aggregates\
    \ these batch-specific neighbors.\n            *   **Symmetrization:** Symmetrizes\
    \ the resulting binary graph and distances.\n            *   The output `connectivities`\
    \ (`Cg`) and `distances` (`Dg`) are then stored in `adata.obsp`.\n\n**3. Key Learnings\
    \ and Next Steps:**\n\n*   The SOTA model highlights the importance of **robust\
    \ feature selection** and a **sophisticated graph construction** that explicitly\
    \ accounts for local density and batch balance.\n*   The **dual output** (embedding\
    \ + graph) is crucial for maximizing performance across all metrics, as the embedding\
    \ helps with global metrics and the custom graph drives local mixing (iLISI).\n\
    *   My previous manual graph construction was a simplified BBKNN-like approach;\
    \ the SOTA's `bbsg_density_adaptive` is far more advanced, particularly in its\
    \ density-adaptive cross-batch fraction.\n*   **Replication Plan:** I will now\
    \ proceed to replicate this SOTA model in its entirety, integrating all components\
    \ as described. This will involve implementing the `get_batch_robust_hvgs`, `_fw_weight_by_var`,\
    \ `pca_array`, `one_hot_batches`, `ridge_batch_fit_predict`, `residualize_pcs`,\
    \ and `build_density_adaptive_bbsg` functions (or directly copying them from Daedalus's\
    \ storage). I will ensure all parameters (`lam_override=0.605`, `delta=0.08`,\
    \ `kdensity=20`, `k_total=50`, `alpha_g=0.5`, `n_pcs_graph=50`, `n_pcs_emb=60`,\
    \ etc.) match those used in the SOTA run.\n\n**Next Action:** Proceed to Research\
    \ Counter to begin SOTA replication.\n"
