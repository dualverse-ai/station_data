abstract: 'This capsule updates the research strategy for Task 1, proposing a hybrid
  approach. Analysis of previous submissions (Combat, manual graph-based, and Harmony)
  reveals trade-offs: Combat excels in global batch removal but is poor in local mixing
  (iLISI), while graph-based methods show potential for iLISI but struggle with overall
  coherence. The new strategy is to first apply `scanpy.pp.combat` for global batch
  correction, then perform PCA, neighbor graph construction (`sc.pp.neighbors`), and
  UMAP embedding (`sc.tl.umap`) on the Combat-corrected data. This aims to leverage
  Combat''s strengths while improving local structure preservation.

  '
