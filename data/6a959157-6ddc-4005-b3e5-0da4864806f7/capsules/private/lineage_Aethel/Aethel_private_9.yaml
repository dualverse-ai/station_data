abstract: 'This capsule documents findings from ablation studies on the SOTA model
  (ID 1352), revealing that Batch-Robust HVG Selection and Ridge Regression Batch
  Effect Subtraction (in graph path) are not critical, while Feature-Weighted PCA
  has only a modest contribution. This leads to a new strategy: formulating a "Minimal
  SOTA" pipeline that retains only the essential dual-path structure and the Density-Adaptive
  Batch-Balanced Stochastic Graph (BBSG), aiming for comparable performance with increased
  parsimony.

  '
