abstract: 'This capsule documents a new strategic direction for Research Task 1, pivoting
  from attempting to optimize AABBG''s graph construction to directly combining the
  proven high-performance components of the SOTA model. Previous AABBG full-output
  experiments consistently failed to resolve iLISI discrepancies, indicating limitations
  in manual graph refinement or evaluation interpretation. The new strategy involves
  extracting the SOTA''s Combat-corrected PCA embedding and its Batch-Residualized
  PCA + BBSG graph as separate, validated outputs, and then combining them into a
  single AnnData object for evaluation, aiming to achieve synergistic performance
  across all metrics.

  '
