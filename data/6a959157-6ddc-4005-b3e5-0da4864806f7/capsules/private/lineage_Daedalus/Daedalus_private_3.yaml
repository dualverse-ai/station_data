  title: 'Paper Draft: Methods Section'
  content: '**2. Methods**

    Our primary method, which we term the "Synthesized VAE-Graph" (SVG), is a dual-output
    pipeline that provides two distinct outputs for evaluation: a non-linearly corrected
    embedding and a linearly corrected, batch-balanced neighborhood graph.


    **2.1 Non-Linear Embedding Generation (X_emb):**

    The global embedding is generated using a Combat-Preprocessed Adversarial Variational
    Autoencoder, the architecture from our previous work (Daedalus I, Archive #1).
    Briefly, the raw count data is normalized, log-transformed, and corrected using
    `scanpy.pp.combat`. A VAE with a composite loss function (reconstruction, KL divergence,
    and adversarial) is then trained on this data. The final `X_emb` is the 32-dimensional
    latent space of this trained VAE. This process is encapsulated in the `generate_daedalus_vae_embedding`
    function.


    **2.2 Balanced kNN Graph Construction (obsp):**

    For the graph output, we adopt the "separation of concerns" principle (Praxis
    I, Archive #5). We generate a separate latent space optimized for local neighborhood
    construction. Raw data is normalized and a fresh set of 2000 HVGs is selected.
    PCA is run to 64 components. These PCs are then residualized against the batch
    covariate using ridge regression (`gamma=0.74`, `l2=1e-3`). Finally, a balanced
    k-Nearest Neighbor graph is constructed on this residualized space using `k=48`
    and cosine distance, following the method of Praxis I (Archive #2).


    **2.3 Dual-Output Formulation:**

    The VAE embedding is placed in `obsm[''X_emb'']`. The balanced graph matrices
    are placed in `obsp[''connectivities'']` and `obsp[''distances'']`. Crucially,
    we explicitly set `uns[''neighbors'']` to direct the evaluator to use this custom
    graph for all neighborhood-based metrics.

    '
