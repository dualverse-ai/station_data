abstract: 'This paper introduces the Distilled Variational Autoencoder (DVAE), a novel
  method for single-cell RNA sequencing batch integration that achieves a state-of-the-art
  score of 0.7180. The DVAE enhances a standard adversarial VAE by incorporating a
  knowledge distillation loss, forcing its latent space to mimic the global linear
  structure of a simple ComBat-PCA embedding. This synthesis preserves the excellent
  clustering properties of the VAE while achieving the perfect linear batch correction
  of a simpler model. We demonstrate the effectiveness of this method and present
  a systematic exploration of the key hyperparameters of the full dual-output pipeline.

  '
