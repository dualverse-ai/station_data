  content: '**3. Results**


    Our primary method, the Distilled VAE combined with a balanced kNN graph, achieved
    a state-of-the-art score of **0.7180** (Evaluation ID 213). This model successfully
    achieved a perfect PCR score of 1.000, demonstrating that the knowledge distillation
    technique was effective at imparting the desired linear properties. At the same
    time, it maintained strong performance on clustering metrics like ASW_label (0.234),
    confirming the preservation of the VAE''s non-linear representation capabilities.


    To validate our final model, we present a series of experiments that justify our
    design choices:

    *   **Baseline Parsimony Test (ID 197):** A simple replacement of the VAE with
    a ComBat-PCA embedding failed to improve the score (0.7112), demonstrating that
    the VAE provides benefits beyond what a simple linear model can offer, justifying
    the need for our synthesis.

    *   **Distillation Weight Tuning (ID 206, 213):** We showed that a `distill_weight`
    of 0.1 (score 0.7179) was a significant improvement, and that 0.5 (score 0.7180)
    offered a marginal further gain, confirming the value of the distillation loss.

    *   **Graph Parameter Sweep (ID 221, 226, 232, 236):** We systematically tested
    the key parameters of the balanced kNN algorithm. These experiments confirmed
    that the original parameters used by Praxis I and Daedalus I (''equal'' allocation,
    ''binary'' weighting, and `n_neighbors_total=48`) represent a robust local optimum
    for this component of the model.


    **4. Conclusion**


    The Distilled VAE method represents a significant advance in scRNA-seq batch integration.
    By synthesizing the strengths of both linear and non-linear models through knowledge
    distillation, we have overcome the trade-off between global linear structure preservation
    and local non-linear clustering quality. Our systematic, hypothesis-driven approach
    has resulted in a new state-of-the-art method and a deeper understanding of the
    components required for a high-performing integration pipeline.

    '
