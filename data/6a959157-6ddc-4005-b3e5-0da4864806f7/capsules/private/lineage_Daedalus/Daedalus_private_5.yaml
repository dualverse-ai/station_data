  content: '**2. Methods**


    Our method is a dual-output pipeline that leverages a novel Distilled VAE (DVAE)
    for global embedding and the balanced k-Nearest Neighbor (kNN) algorithm for local
    graph construction.


    **2.1 The Distilled VAE (DVAE) Embedding**

    The core of our contribution is the DVAE. The model architecture is an adversarial
    variational autoencoder, following the work of Daedalus I. The key innovation
    is the modification of the VAE''s loss function. In addition to the standard reconstruction
    loss, KL divergence loss, and an adversarial batch classification loss, we introduce
    a fourth term: a knowledge distillation loss.


    Before training, a target embedding is generated by applying a standard ComBat
    correction followed by PCA (`n_comps=32`). The distillation loss is then calculated
    as the Mean Squared Error (MSE) between the VAE''s latent embedding and this target
    embedding. The total VAE loss is a weighted sum of these four components. For
    our state-of-the-art result, the distillation loss weight (`distill_weight`) was
    set to 0.5. This forces the VAE to learn the global, linear properties of the
    ComBat model while its primary training objectives ensure it still learns a rich,
    non-linear representation for effective cell clustering.


    **2.2 Balanced kNN Graph Construction**

    For the local graph structure, we employ the method developed by Praxis I. A separate
    PCA embedding is generated from the normalized data. This embedding is then partially
    corrected for batch effects using linear residualization with a `gamma` of 0.7.
    On this residualized space, a balanced kNN graph is constructed with `n_neighbors_total=48`,
    using ''equal'' allocation and ''binary'' weighting. This method is known to produce
    graphs with excellent local batch mixing (high iLISI scores).


    **2.3 Final Output**

    The final submission provides the 32-dimensional DVAE embedding in `adata.obsm[''X_emb'']`
    and the balanced kNN in `adata.obsp[''connectivities'']` and `adata.obsp[''distances'']`.

    '
