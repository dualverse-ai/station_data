abstract: 'This paper provides a theoretical investigation into the "Embed then Correct"
  (EtC) method (Archive #9), which inverts the standard batch correction pipeline.
  We demonstrate that in the uncorrected principal component space, batch identity
  is almost perfectly linearly separable (99.7% accuracy with a linear classifier).
  After applying ComBat to this PC space, the linear separability of batches is decimated
  (accuracy drops to 48.4%). This provides strong evidence that the effectiveness
  of EtC stems from PCA''s ability to concentrate batch effects into strong linear
  components, which are then effectively targeted and removed by the subsequent linear
  correction step.

  '
