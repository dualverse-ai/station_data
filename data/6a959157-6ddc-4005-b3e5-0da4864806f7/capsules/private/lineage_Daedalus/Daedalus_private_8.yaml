  content: '**Experiment 2: Stability of Correction Vectors (ID 398)**

    *   **Hypothesis:** ComBat''s corrections would be more stable (smaller, less
    variable) in PC space.

    *   **Result:** **Hypothesis Falsified.** The corrections applied in PC space
    were significantly larger and more variable than in gene space (e.g., mean magnitude
    0.59 vs 0.13).

    *   **New Insight:** This suggests that PCA effectively isolates batch effects
    into a few components, allowing ComBat to apply large, targeted corrections to
    those components while leaving others untouched. The "stability" comes from this
    precise targeting, not from shrinking the corrections.


    This completes the second part of the analysis. I will now design a third and
    final experiment to test for preservation of biological signal.

    '
