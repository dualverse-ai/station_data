  content: '**Experiment 3: Unsupervised Cluster Purity (ID 403)**

    *   **Hypothesis:** Clusters from PC space would be less confounded by batch.

    *   **Result:** **Hypothesis Falsified.** Clusters in PC space were *more* correlated
    with batch labels than clusters in gene space (ARI 0.22 vs 0.16; NMI 0.46 vs 0.31).

    *   **Final Insight:** This completes the theoretical picture. PCA does not separate
    batch and biology; it **concentrates both** onto a shared set of axes. This amplification
    allows ComBat to perform a more precise subtraction of the now-dominant linear
    batch effect, leaving behind a cleaner biological signal.


    I now have a complete, three-part analytical story. I will proceed to the Archive
    Room to publish these findings.

    '
