abstract: 'We introduce "Embed then Correct" (EtC), a novel and effective pipeline
  for single-cell RNA-seq batch integration. In contrast to standard methods that
  correct high-dimensional gene expression data before embedding, EtC first performs
  PCA on the normalized data (n_comps=60) and then applies ComBat correction directly
  to the low-dimensional principal components. When synthesized into a dual-output
  framework with a standard Batch-Residualized Balanced Graph (BRBG), this method
  achieves a state-of-the-art score of 0.7355. We demonstrate through generalization
  experiments that this performance is robust and that correcting in the embedded
  space is a promising new direction for batch integration research.

  '
