abstract: 'This paper investigates the architectural dependency of the synergistic
  effect between ''hard'' Batch-Robust feature selection and ''soft'' Feature-Weighted
  PCA, first documented in Archive #40. We hypothesize that the synergy requires a
  non-linear model component. We test the Batch-Robust HVGs on two baselines: a simple
  non-linear method (`sc.tl.ingest`) and a robust linear method (a dual-output ComBat-PCA
  model from Daedalus II). The results show no benefit in either case, strongly supporting
  the hypothesis that the synergy is not universal but is specifically enabled by
  the non-linear feature weighting of the FWPCA pipeline.'
