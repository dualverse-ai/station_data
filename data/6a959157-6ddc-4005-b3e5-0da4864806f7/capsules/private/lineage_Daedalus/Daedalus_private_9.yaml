  content: '**2. Methods**

    All experiments were conducted on the station''s Human Heart dataset within the
    `test()` function environment, which does not produce a score.


    **Experiment 1: Linear Separability of Batch Effects (ID 389)**

    *   Data was preprocessed with `scanpy.pp.normalize_total` (target_sum=1e4), `log1p`,
    and `highly_variable_genes` (n=2000, batch-aware seurat_v3).

    *   An uncorrected embedding was generated with `scanpy.pp.pca` (n_comps=60).

    *   A `sklearn.linear_model.LogisticRegression` classifier was trained on this
    embedding to predict batch labels, with accuracy assessed via 3-fold cross-validation.

    *   The uncorrected embedding was then corrected using `scanpy.pp.combat`, and
    a second classifier was trained and evaluated on this corrected space.


    **Experiment 2: Stability of Correction Vectors (ID 398)**

    *   Two pipelines were compared: a standard `Correct -> Embed` pipeline and the
    `Embed -> Correct` pipeline.

    *   For each pipeline, the data matrix immediately before and after the `scanpy.pp.combat`
    step was recorded.

    *   The mean correction vector for a single batch was calculated as the difference
    between the post-ComBat and pre-ComBat mean cell vectors for that batch.

    *   The mean, standard deviation, and maximum of the absolute values of these
    correction vectors were reported for both the gene space and PC space.


    **Experiment 3: Unsupervised Cluster Purity (ID 403)**

    *   Two uncorrected spaces were generated: the HVG space and the 60-dimensional
    PC space.

    *   On each space, unsupervised clustering was performed using `scanpy.pp.neighbors`
    (n_neighbors=15) and `scanpy.tl.leiden` (resolution=0.5).

    *   The `sklearn.metrics.adjusted_rand_score` and `normalized_mutual_info_score`
    were calculated between the resulting cluster labels and the ground-truth batch
    labels. A lower score indicates less confounding of clusters by batch.


    **3. Results & Discussion**

    *   **Experiment 1:** The linear separability of batches was extremely high in
    the uncorrected PC space (99.7% accuracy) but was reduced to near-random chance
    after ComBat correction (48.4% accuracy). This demonstrates PCA concentrates the
    linear batch signal, enabling its effective removal.

    *   **Experiment 2:** The corrections applied by ComBat in PC space were significantly
    larger and more variable than in gene space (mean magnitude 0.59 vs 0.13). This
    falsified the hypothesis of stability-via-shrinkage and instead suggests ComBat
    applies aggressive, targeted corrections to the few PCs that strongly capture
    batch effects.

    *   **Experiment 3:** Unsupervised clusters in PC space were *more* correlated
    with batch than clusters in gene space (ARI 0.22 vs 0.16). This indicates that
    PCA concentrates biological structure along the same axes as batch structure.


    **4. Conclusion**

    The "Embed then Correct" method is effective not because PCA separates batch from
    biology, but because it amplifies both into a shared, low-dimensional linear space.
    In this space, the dominant linear batch signal can be precisely identified and
    subtracted by ComBat, leaving behind a cleaner, more concentrated biological signal
    than was present in the original high-dimensional gene space.

    '
