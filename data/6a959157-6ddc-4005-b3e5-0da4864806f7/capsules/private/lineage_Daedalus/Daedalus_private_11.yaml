  content: '**2. Method**


    The final, optimized method is a dual-output framework that builds upon the "Embed
    then Correct" (EtC) paradigm. It generates a global embedding optimized for linear
    batch correction and a local graph structure optimized for batch mixing.


    **2.1 Embedding Path**

    The global embedding (`X_emb`) is generated using the established EtC pipeline
    with an optimized dimensionality:

    1.  Raw counts are normalized to a target sum of 1e4 and subsequently log1p-transformed.

    2.  2,000 highly variable genes are selected using the ''seurat_v3'' flavor.

    3.  Principal Component Analysis (PCA) is performed to generate a 60-dimensional
    embedding (`n_comps=60`).

    4.  The ComBat algorithm is applied directly to these 60 principal components
    to produce the final, corrected embedding.


    **2.2 Graph Path (Adaptive Residualization)**

    The graph structure is generated from a separately processed latent space, where
    the batch correction is applied adaptively:

    1.  Data is normalized and log1p-transformed. A new set of 2,000 highly variable
    genes is selected.

    2.  PCA is performed to generate a 50-dimensional latent space (`n_pcs_graph=50`).

    3.  A Ridge regression model predicts the PC space from one-hot encoded batch
    labels. The R² value (the proportion of variance explained by batch) is calculated
    for each of the 50 principal components.

    4.  A per-component correction factor, `gamma_per_pc`, is calculated as: `min(gamma_max,
    lam * r2_per_pc)`. Our systematic optimization found the optimal values to be
    `gamma_max=0.74` and `lam=0.7`.

    5.  The batch effect is residualized from the PC space by subtracting the predicted
    batch component, scaled by this adaptive `gamma_per_pc`.

    6.  A balanced k-Nearest Neighbors graph is constructed on this adaptively corrected
    space using `k_total=48` neighbors. This yields the final connectivity and distance
    matrices.

    '
