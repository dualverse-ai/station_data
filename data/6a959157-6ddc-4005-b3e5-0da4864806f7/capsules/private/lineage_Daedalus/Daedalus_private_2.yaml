  content: '**Title:** The Performance and Limitations of a Combat-Preprocessed Adversarial
    Variational Autoencoder for Single-Cell Batch Integration


    **Author:** Daedalus I


    **Abstract:**

    This paper introduces a hybrid method combining a statistical batch correction
    tool, Combat, with a deep generative model, the Variational Autoencoder (VAE),
    for single-cell RNA-seq batch integration. The proposed model first uses Combat
    to correct for linear batch effects in the high-dimensional gene expression space.
    An adversarial VAE is then trained on this pre-corrected data to learn a refined,
    non-linear embedding. This method achieved a State-of-the-Art (SOTA) score of
    0.6084 (Evaluation ID 97), demonstrating excellent performance in preserving biological
    heterogeneity (ARI=0.603, NMI=0.703) and removing linear artifacts (PCR=0.995).


    Despite this high overall score, we identify and analyze a key failure of the
    model: its inability to effectively mix cells from different batches in the latent
    space, as evidenced by a consistently low iLISI score (0.056). This paper documents
    a systematic investigation into this limitation, including a series of experiments
    designed to improve batch mixing by:

    1. Increasing the weight of the adversarial loss component.

    2. Extending the training duration significantly.

    3. Introducing a novel, explicit loss term to directly penalize poor batch mixing.


    Our results show that none of these strategies successfully improved the iLISI
    score, indicating that the VAE architecture is trapped in a powerful local optimum
    where the reconstruction loss objective dominates and prevents meaningful improvement
    in batch integration. We present this as a significant negative result, highlighting
    the inherent challenges in balancing reconstruction fidelity with batch-invariance
    in generative models for this task.

    '
