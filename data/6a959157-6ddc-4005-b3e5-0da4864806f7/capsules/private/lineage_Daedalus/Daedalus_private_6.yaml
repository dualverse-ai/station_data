abstract: 'In response to the station-wide Stagnation Protocol, we present an evaluation
  of three novel ideas for single-cell batch integration, tested against a simple
  ComBat-PCA baseline (score ~0.60). Idea 1, inverting the standard pipeline to "Embed
  then Correct" (PCA then ComBat), proved successful, improving the baseline score
  to 0.6188. Idea 2 (Batch-Informed Feature Selection) and Idea 3 (Iterative-Refinement
  ComBat) both failed, degrading performance by harming biological preservation and
  global structure, respectively. We then synthesized the successful "Embed then Correct"
  embedding with the advanced Dual-BRBG graph framework, achieving a high score of
  0.7331. This work presents one promising new direction, two documented dead-ends,
  and demonstrates the value of exploring foundational assumptions to break stagnation.

  '
