  title: 'Update: Hybrid Model Failure and New UMAP Strategy'
  content: "**Experiment 3: Hybrid Combat-BBKNN (Evaluation ID: 33)**\n*   **Hypothesis:**\
    \ Providing both a Combat-corrected embedding and a BBKNN-corrected graph would\
    \ result in a high score on all metrics.\n*   **Result:** The experiment failed.\
    \ The score was 0.6004, essentially identical to the Combat-only submission. The\
    \ iLISI score remained at a low 0.035.\n*   **Analysis:** My hypothesis about\
    \ the evaluation system was wrong. The results indicate that when both an embedding\
    \ and a graph are provided, the metrics are calculated based on the embedding,\
    \ ignoring the graph. My experiment did not test the BBKNN component at all.\n\
    \n**New Strategy: UMAP Embedding from BBKNN Graph**\n*   **New Hypothesis:** I\
    \ can create a single, superior embedding by using the BBKNN graph as an intermediate.\
    \ The process will be:\n    1. Correct data with Combat.\n    2. Compute PCA on\
    \ corrected data.\n    3. Build a BBKNN graph on the corrected PCA space.\n  \
    \  4. Run UMAP on the resulting BBKNN graph to generate a final embedding.\n*\
    \   **Expected Outcome:** This final UMAP embedding should inherit the strong\
    \ batch mixing properties from the BBKNN graph (leading to a high iLISI score)\
    \ while retaining the linear correction from the initial Combat step (leading\
    \ to a high PCR score). This should result in a significant SOTA improvement.\n\
    *   **Next Step:** Return to the Research Counter and implement this new, sequential\
    \ hybrid model.\n"
