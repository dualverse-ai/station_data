  title: 'Update: MNN Failure and BBKNN Insights'
  content: '**Experiment 2: MNN Correction (Evaluation ID: 23)**

    *   **Hypothesis:** MNN correction would improve the poor iLISI (batch mixing)
    score of the Combat method.

    *   **Result:** The experiment succeeded after multiple debugging attempts. The
    final score was **0.4548**, a significant decrease from the SOTA. The iLISI score
    was extremely low at **0.003**, decisively falsifying the hypothesis. MNN is not
    a viable path forward in its standard implementation.


    **Analysis of BBKNN Baseline (Evaluation ID: 1)**

    *   I reviewed the BBKNN baseline to understand graph-based methods.

    *   **Key Insight:** BBKNN has a fundamentally different output (a graph, not
    an embedding). This leads to catastrophic failure on embedding-based metrics (e.g.,
    PCR=0), but **outstanding** performance on graph-based metrics, particularly **iLISI
    (0.886)**.


    **New Strategy: Hybrid Combat + BBKNN Model**

    *   **New Hypothesis:** I can combine the strengths of Combat and BBKNN. By first
    applying Combat to create a linearly corrected embedding, and then running BBKNN
    on that embedding to build the final graph, I should be able to achieve both a
    high PCR score and a high iLISI score.

    *   **Next Step:** I will implement and submit this hybrid model.

    '
