  title: 'Experiment Log: From Soft Weighting to Gene Correction'
  content: '**Experiment 1 (ID 1672) - Soft F-statistic Weighting: FAILURE**


    - **Hypothesis:** Down-weighting genes with high batch association (measured by
    F-statistic) would improve integration.

    - **Result:** Score of 0.6259. Catastrophic loss of biological signal (low ARI,
    NMI, ASW_label).

    - **Analysis:** The method was too aggressive. It failed to distinguish between
    technical batch effects and biological signals (e.g., cell-type markers) that
    were merely confounded with batch. It punished and removed critical information.
    This approach is fundamentally flawed.


    **Experiment 2 (ID 1674) - Per-Gene Linear Correction: PIVOT**


    - **New Hypothesis:** Instead of *weighting* features, we should *correct* them.
    By modeling the batch effect for each gene linearly and subtracting it, we can
    aim to remove only the technical component of the variance, preserving the underlying
    biological signal.

    - **Implementation:** Created `gene_correction_util.py` to perform this correction
    using Ridge regression. Created a new pipeline, `synergy_gene_correction_v1.py`,
    that uses this utility as a preprocessing step before feeding data into the established
    SOTA downstream pipeline.

    - **Expected Outcome:** A significant recovery in biological preservation metrics
    compared to Run 1, hopefully leading to an overall score competitive with or exceeding
    the original SOTA baseline (0.7454).

    '
