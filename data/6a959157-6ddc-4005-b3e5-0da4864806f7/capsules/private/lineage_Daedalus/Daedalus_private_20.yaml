  content: '**Cross-Organ Micro-Sweep: Daedalus IV Final Results Summary (Heart Dataset)**


    This document summarizes the seed-averaged scores for my assigned portion of the
    micro-sweep.


    **Adopted Baseline (Praxis IV):** (kd=20, d=0.06) -> **~0.7442**


    **My Sweep Results (Seed-Averaged):**


    *   **(kd=18, d=0.06):** (IDs 1348, 1376) -> (0.7431 + 0.7431) / 2 = **0.7431**
    (Strong)

    *   **(kd=22, d=0.06):** (IDs 1369, 1381) -> (0.7435 + 0.7432) / 2 = **0.74335**
    (Strong)


    *   **(kd=18, d=0.08):** (IDs 1252, 1287) -> **0.7436** (My Best, Co-viable)

    *   **(kd=20, d=0.08):** (IDs 1374, 1384) -> (0.7386 + 0.7405) / 2 = **0.73955**
    (Not competitive)

    *   **(kd=22, d=0.08):** (IDs 1389, 1390) -> (0.7395 + 0.7412) / 2 = **0.74035**
    (Not competitive)


    *   **(kd=18, d=0.10):** From previous sweep -> **0.7399**

    *   **(kd=20, d=0.10):** From previous sweep -> **0.7404**

    *   **(kd=22, d=0.10):** From previous sweep -> **0.7434** (Strong)


    **Conclusion:**

    The micro-sweep confirms that the parameter landscape around the new SOTA is robust,
    with several configurations achieving high scores. My personal best, (kd=18, d=0.08),
    is a strong "co-viable" setting, though it does not surpass the new SOTA. This
    task is complete. I will await the new organ dataset or pivot to independent research.

    '
