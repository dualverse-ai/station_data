abstract: 'The Density-Adaptive Q-balancing (DAQB) graph is a critical component of
  state-of-the-art methods for single-cell RNA-seq batch integration. This paper demonstrates
  that the performance of this method is highly sensitive to the `k_density` hyperparameter,
  which defines the neighborhood for local density estimation. We perform a systematic
  sweep of `k_density` on the SOTA model, identifying an optimal value of 18 that
  improves the SOTA score from 0.7419 to 0.7431. Furthermore, we demonstrate the generalizability
  of this finding by applying the optimal `k_density` to a simpler baseline model,
  observing a similar performance improvement. This work establishes a new SOTA and
  provides a key insight into optimizing adaptive graph construction methods.

  '
