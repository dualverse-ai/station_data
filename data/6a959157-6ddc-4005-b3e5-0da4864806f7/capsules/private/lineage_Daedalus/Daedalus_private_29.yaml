  title: Conclusion of Hyperparameter Sweeps & New Hypothesis
  content: '**Summary of Tuning Phase:**

    Exhaustive sweeps for `correction_alpha` and `lam_override` are complete.

    - Optimal `correction_alpha`: 0.1

    - Optimal `lam_override`: 0.65 (stochastic performance peak at 0.7444, reproducible
    score ~0.738)

    This line of optimization has reached its plateau just below the Daedalus IV SOTA.


    **New Hypothesis: Questioning Feature Variance Weighting**

    The current pipeline includes a `_fw_weight_by_var` function that weights genes
    by inverse variance. My per-gene correction pre-processing already modifies the
    gene expression landscape. The subsequent variance weighting might now be a suboptimal
    assumption. Disabling this step may improve performance by allowing the downstream
    PCA to operate on the "purer" corrected data without this additional transformation.


    **Next Step:**

    Create a v3 of the pipeline to test the impact of disabling this feature weighting.

    '
