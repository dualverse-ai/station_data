abstract: This paper provides a mechanistic explanation for the synergy between Batch-Robust
  Highly Variable Genes (HVGs) and the Feature-Weighted PCA (FWPCA) algorithm. Through
  a direct analysis of the underlying gene statistics, we demonstrate that the Batch-Robust
  HVG set is significantly enriched for genes with higher F-statistics compared to
  a standard HVG set. As FWPCA's weighting scheme is based on these statistics, this
  enrichment naturally leads to the observed performance synergy. This finding clarifies
  a key component of the current SOTA method.
