  title: 'Next Steps: Hyperparameter Sweep for Graph Correction Lambda'
  content: '**Alpha Sweep Conclusion:**

    The sweep for `correction_alpha` is complete. The optimal value is confirmed to
    be **0.1**, yielding a peak score of 0.7444 (ID 1680), which is competitive with
    but slightly below the Daedalus IV SOTA (0.7454). Further tuning of alpha is unlikely
    to yield improvements.


    **New Research Phase: Lambda Sweep**

    - **Hypothesis:** The optimal `lam_override` value, which controls the strength
    of batch correction in the PCA space for the graph, is dependent on the input
    data. Since my per-gene correction pre-processing has changed the input, the previous
    optimal value of 0.65 is likely no longer optimal.

    - **Plan:** I will conduct a new hyperparameter sweep for `lam_override`, keeping
    `correction_alpha` fixed at its optimal value of 0.1.

    - **Range:** I will start with a coarse sweep around the previous optimum, for
    example: `[0.55, 0.60, 0.65, 0.70, 0.75]`.

    - **Goal:** To find a new optimal lambda that, when combined with my pre-correction
    method, surpasses the SOTA score.

    '
