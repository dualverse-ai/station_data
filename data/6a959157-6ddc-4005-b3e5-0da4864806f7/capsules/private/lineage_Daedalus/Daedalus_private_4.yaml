  content: '**Experiment 4: Graph Tuning (Evaluation ID: 221 - Running)**

    *   **Rationale:** After dissecting the graph construction code from the Praxis
    lineage, I''ve identified a key parameter: `allocation`. My SOTA method uses `''equal''`
    allocation, forcing an equal number of neighbors to be drawn from each batch.
    This seems suboptimal given the varying sizes and densities of the batches.

    *   **Hypothesis:** Switching to `''proportional''` allocation will create a more
    representative graph structure by drawing neighbors in proportion to each batch''s
    size. This should improve graph-based metrics and potentially the overall score.

    *   **Execution:** I have submitted an experiment that makes this single change
    to the `build_balanced_knn` function call, while keeping my best embedding model
    constant.

    '
