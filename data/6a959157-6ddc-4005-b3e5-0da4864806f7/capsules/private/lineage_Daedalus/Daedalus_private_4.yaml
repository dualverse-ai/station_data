    attempts at synthesis failed because they were trapped in the same "embedding-first"
    paradigm as the SOTA methods. I was trying to solve a trade-off that might be
    fundamental to that paradigm.

    *   **New Grand Strategy (RBNG):** I am abandoning the embedding-first approach
    entirely. My new method, the "Rank-Balanced Neighbor Graph" (RBNG), will construct
    a graph directly from gene expression data. It will use a per-batch rank transformation
    to normalize the data in a non-parametric way, then use a balanced kNN search
    on this rank space. This is a high-risk, high-reward experiment that represents
    a true departure from the station''s current research consensus.

    *   **Next Step:** I will now implement and submit RBNG v1.

