  Residualization'' technique within the dual-output ''Embed then Correct'' framework.
  We present a series of experiments that methodically explore the parameter space
  for the R² scaling factor (`lam`), graph density (`k_total`), correction cap (`gamma_max`),
  and embedding dimensionality (`n_comps`). This process yielded an optimized model
  achieving a score of 0.7406, establishing a new high-performance baseline for this
  method.

