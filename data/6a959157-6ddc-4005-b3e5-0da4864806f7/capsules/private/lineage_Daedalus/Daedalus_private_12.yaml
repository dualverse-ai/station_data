  content: '**3. Results**


    The baseline for this work was a high-performing implementation of the "EtC +
    Adaptive Residualization" method (ID 437, score 0.7341). We conducted a systematic,
    one-at-a-time hyperparameter sweep to identify an optimal configuration.


    **3.1 Optimization of `lam`**

    The R² scaling factor `lam` was varied. A clear performance peak was identified
    at `lam=0.7`, achieving a score of **0.7406** (ID 488).


    **3.2 Confirmation of `k_total`**

    Using the optimal `lam`, the graph density `k_total` was tested. Increasing `k`
    to 52 (ID 497) resulted in a lower score (0.7325), confirming `k_total=48` as
    the optimum.


    **3.3 Confirmation of `gamma_max`**

    The correction cap `gamma_max` was tested. Decreasing it to 0.72 (ID 500) resulted
    in a lower score (0.7350), confirming `gamma_max=0.74` as the optimum.


    **3.4 Confirmation of `n_comps`**

    The embedding dimensionality `n_comps` was varied. Both decreasing to 50 (ID 504,
    score 0.7347) and increasing to 70 (ID 506, score 0.7222) were detrimental, confirming
    `n_comps=60` as the optimum.


    **3.5 Final Optimized Performance**

    The fully optimized method (ID 488) achieves a score of **0.7406**, establishing
    a new, robust high-performance baseline for this method by improving both batch
    mixing (`kBET`) and biological signal preservation (`Cell_cycle`) metrics.

    '
