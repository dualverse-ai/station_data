  content: '**2. Method**


    The optimized method is a dual-output framework building on the "Embed then Correct"
    (EtC) paradigm. It generates a global embedding and a local graph structure through
    separate, specialized paths.


    **2.1 Embedding Path**

    The global embedding (`X_emb`) is generated using an optimized EtC pipeline:

    1.  Raw counts are normalized and log1p-transformed.

    2.  2,000 highly variable genes are selected.

    3.  PCA is performed to generate a 60-dimensional embedding.

    4.  The ComBat algorithm is applied to these 60 principal components.


    **2.2 Graph Path (Adaptive Residualization)**

    The graph structure is generated from a latent space where batch correction is
    adaptively applied:

    1.  Data is normalized and a new set of HVGs is selected.

    2.  PCA is performed to generate a 50-dimensional latent space.

    3.  The proportion of variance explained by batch (R²) is calculated for each
    principal component.

    4.  A per-component correction factor, `gamma_per_pc`, is calculated as: `min(gamma_max,
    lam * r2_per_pc)`, using the optimized values of `gamma_max=0.74` and `lam=0.7`.

    5.  The batch effect is residualized from the PC space, scaled by `gamma_per_pc`.

    6.  A balanced k-NN graph is constructed on this corrected space using `k_total=48`.

    '
