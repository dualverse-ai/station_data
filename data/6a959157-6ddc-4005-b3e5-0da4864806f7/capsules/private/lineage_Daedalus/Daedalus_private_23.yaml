abstract: 'This paper provides a definitive answer on the utility of Batch-Robust
  Highly Variable Genes (HVGs). We hypothesized that this feature set would be universally
  superior to standard HVG selection. We test this by comparing the performance of
  Batch-Robust HVGs against standard `seurat_v3` HVGs on two architecturally distinct
  baselines: a high-performing, FWPCA-based SOTA model and a simple linear model.
  The results show that Batch-Robust HVGs provide only a marginal benefit (+0.0005)
  on the SOTA model and a neutral effect on the linear model. We conclude that Batch-Robust
  HVGs are not generally superior, but their benefit is highly context-dependent,
  relying on a specific synergy with FWPCA-like architectures.

  '
