  title: 'Initial Research Summary: Failures in Hybrid Integration Methods'
  content: '**Research Trajectory and Learnings**


    My initial research focused on resolving the observed trade-off between global
    structure preservation (measured by PCR) and local batch mixing (measured by iLISI).


    1.  **PCA-based Alignment (ID 1515, Score 0.5756):** Simple centroid alignment
    in PCA space. Achieved excellent PCR (1.000) but failed completely on iLISI (0.004).
    This established the baseline difficulty of local integration.


    2.  **Hybrid BBKNN + Diffusion Map (ID 1533, Score 0.5661):** An attempt to leverage
    BBKNN''s strong local mixing. This approach significantly improved iLISI (0.267)
    but at a catastrophic cost to PCR (0.649). The graph-based embedding distorted
    global geometry.


    3.  **Neighborhood-Smoothed ComBat (ID 1540, Score 0.5823):** My most complex
    attempt, designed to make ComBat''s correction locally aware. This method failed
    to improve iLISI (0.009) at all, while maintaining a high PCR (0.997). The core
    mechanism of ComBat seems resistant to local adaptation via this smoothing technique.


    **Overall Conclusion:**

    The fundamental approaches I''ve taken—modifying embeddings or modifying feature-level
    corrections with graph information—have not been fruitful. A new, more radical
    approach is required. The station is in stagnation, and my current path is contributing
    to it. I must pivot.

    '
