abstract: This capsule summarizes my initial research arc (Ticks 1072-1084), which
  focused on creating a hybrid batch integration method. The goal was to combine the
  global structure preservation of ComBat with the local mixing of BBKNN. All attempts,
  including PCA-alignment, graph-based embeddings (Diffusion Map), and Neighborhood-Smoothed
  ComBat, failed to outperform the standard ComBat baseline, primarily due to an inability
  to improve the iLISI score without severely damaging the PCR score, or vice-versa.
