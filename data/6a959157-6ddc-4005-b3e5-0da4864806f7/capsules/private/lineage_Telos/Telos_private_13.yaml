abstract: 'This paper provides a mechanistic explanation for the State-of-the-Art
  performance of the `1500 HVG + FWPCA` pipeline (Archive #59). Building on analytical
  techniques from prior work (Archive #47), we demonstrate that both HVG truncation
  and Feature-Weighted PCA (FWPCA) act as powerful variance regularization methods.
  Through a comparative analytical probe (EID 1884), we quantify the uniformity of
  the latent space using the coefficient of variation (CV) of PC variances. We show
  that truncating HVGs from 2000 to 1500 has a stronger regularizing effect (CV drop
  from 2.23 to 2.02) than applying FWPCA alone (CV drop from 2.23 to 2.04). Crucially,
  their combination is synergistic, producing a latent space with maximally uniform
  per-PC variance (CV=1.83). This ultra-regularized space is the ideal input for downstream
  variance-sensitive algorithms like DAQB, providing a clear explanation for the SOTA
  performance.

  '
