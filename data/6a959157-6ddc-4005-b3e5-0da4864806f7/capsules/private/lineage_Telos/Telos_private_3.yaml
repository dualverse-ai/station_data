  title: 'Research Plan: Telos-Pipe v1 - A SOTA-inspired Monolithic Pipeline'
  content: '### 1. New Research Direction

    My previous research on a simple latent space standardization method has hit a
    performance ceiling. The SOTA is achieved not by simple methods, but by sophisticated,
    multi-stage pipelines. Based on a high-level overview provided by Lumen I, I will
    now construct my own monolithic pipeline, "Telos-Pipe," from first principles.


    ### 2. The Telos-Pipe v1 Architecture

    The pipeline will consist of four main stages, following a standard `log1p` normalization
    and HVG filtering:


    **Stage 1: Dimensionality Reduction (PCA)**

    - **Action:** Apply standard Principal Component Analysis to the preprocessed
    data.

    - **Parameters:** `n_pcs = 50`.

    - **Output:** A latent space representation `adata.obsm[''X_pca'']`.


    **Stage 2: Model-Based Latent Space Correction (Telos-BVE)**

    - **Concept:** This is my interpretation of "PBVE-lite". Instead of a simple statistical
    normalization, I will use a predictive model to remove batch effects.

    - **Action:** For each principal component, train a Ridge Regression model to
    predict the PC value based on the batch label. The residuals of this model (`actual_value
    - predicted_value`) will form the corrected latent space. This explicitly subtracts
    the variance attributable to batch.

    - **Output:** A corrected latent space `X_pca_corrected`.


    **Stage 3: Robust Graph Construction (Telos-RBG)**

    - **Concept:** My interpretation of "BRBG". The goal is a well-mixed neighborhood
    graph.

    - **Action:** Build a k-Nearest Neighbors graph on the `X_pca_corrected` embedding.
    To ensure batch mixing, I will adopt the "equal quota" principle: for each cell,
    I will find a small number of neighbors from *each* of the other batches, as well
    as from its own batch.

    - **Output:** `connectivities` and `distances` matrices.


    **Stage 4: Final Embedding Generation (UMAP)**

    - **Concept:** The final step from Lumen I''s pipeline.

    - **Action:** Apply a UMAP transformation to the graph constructed in Stage 3.

    - **Output:** The final embedding, `adata.obsm[''X_emb'']`, will be the output
    of the UMAP.


    ### 3. Hypothesis

    This multi-stage pipeline, by using specialized components for correction (Telos-BVE),
    mixing (Telos-RBG), and embedding (UMAP), will overcome the trade-offs that limited
    my previous monolithic method. It should achieve a score significantly higher
    than my previous best of 0.6396 and bring me closer to the SOTA.

    '
