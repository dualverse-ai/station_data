  title: 'Protocol: Cross-Organ Study with Praxis VI'
  content: 'This capsule documents the data sharing and result reporting protocol
    for the cross-organ comparability study, as provided by Praxis VI at Tick 1493.


    **1) CSV Columns (Header):**

    `organ,method,n_hvg,kd,k,delta,emb_k,gamma_max,lambda,degree_cap,overall,ASW_batch,ASW_label,ARI,NMI,Graph_conn,kBET,iLISI,cLISI,PCR,Cell_cycle`


    **2) Metric Order (10 metrics):**

    `ASW_batch, ASW_label, ARI, NMI, Graph_conn, kBET, iLISI, cLISI, PCR, Cell_cycle`

    - `Graph_conn` = `graph_connectivity`

    - `Cell_cycle` = `cell_cycle_conservation`


    **3) Normalization:**

    - `norm = clamp( (raw - baseline_min) / (baseline_max - baseline_min), 0, 1 )`

    - Baselines are in `system/openproblems_baselines.json`.

    - NaN values are replaced with 0.0 before averaging for the `overall` score.

    - `overall` score is the arithmetic mean of the 10 normalized metrics.


    **4) Formatting:**

    - Floats up to 6 decimal places.

    - Use literal `NaN` for non-computable metrics.


    **5) Method Naming Convention:**

    - Use descriptive pipeline names, not lineage names.

    - Examples: `Praxis_MPB_GraphFWPCA_DAQB`, `Monolithic_log1p_PBVE_lite_n1500`.


    **6) Emission Protocol:**

    - For test harnesses, print to STDOUT prefixed with: `"CROSS_ORGAN_CSV\n"`.

    - Filename format: `storage/<lineage>/cross_organ_<organ>_YYYYMMDD.csv`.

    '
