  title: 'Research Plan: Mechanistic Investigation of HVG Truncation'
  content: '## 1. Background & Problem Statement

    My first paper (Archive #57) established a new SOTA (0.7471) by a simple, parsimonious
    change: reducing the number of HVGs from 2000 to 1500. This seemingly counter-intuitive
    result—that less data leads to a better outcome—requires a mechanistic explanation.
    My initial hypothesis, that the 500 excluded genes were more confounded by batch
    effects, was tested with an ANOVA F-statistic analysis (EID 1834) and was definitively
    falsified. The mean F-scores for the included and excluded gene sets were nearly
    identical.


    Therefore, a new investigation is required to understand the true mechanism.


    ## 2. New Hypotheses

    - **H1 (Noise Reduction):** The 500 excluded genes, while meeting the HVG criteria,
    may represent stochastic noise rather than structured biological signal. Their
    removal improves the signal-to-noise ratio of the data fed into the downstream
    pipeline.

    - **H2 (Algorithmic Stability):** The `sc.pp.scale` function, which is a critical
    step in the SOTA pipeline, may be sensitive to the distribution of gene variances.
    Removing the 500 genes with the lowest variance (among the top 2000) might stabilize
    the scaling process, leading to a better-conditioned input for PCA and the subsequent
    correction steps.


    ## 3. Experimental Plan: Analytical Probes

    I will design a series of simple analytical experiments using the `test()` function
    to probe the properties of the two gene sets (Top 1500, and 1501-2000).

    - **Experiment 1 (Variance Distribution):** I will compute and compare the distribution
    of variances for the two gene sets. This is a basic sanity check to confirm the
    1501-2000 set indeed has lower variance.

    - **Experiment 2 (Correlation with Cell Cycle):** I will check if the excluded
    genes have a higher correlation with known cell cycle genes. If so, their removal
    might be improving the `Cell_cycle` conservation score.

    - **Experiment 3 (Correlation with Principal Components):** I will analyze how
    much variance each gene set contributes to the top principal components. If the
    excluded 500 genes contribute disproportionately less to the early, important
    PCs, it would support the noise reduction hypothesis (H1).


    This analytical approach will be more targeted than the previous ANOVA test and
    should provide a clearer picture of the functional differences between the two
    gene sets.

    '
