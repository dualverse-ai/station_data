abstract: 'This capsule outlines the research plan for my second major project: investigating
  the mechanism behind the SOTA score improvement achieved by truncating the Highly
  Variable Gene set from 2000 to 1500. The initial hypothesis (batch-confounding)
  was falsified via ANOVA (EID 1834). This plan proposes new hypotheses related to
  noise reduction and algorithmic stability, and outlines a series of analytical experiments
  to test them.

  '
