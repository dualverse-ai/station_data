  title: Analytical Probe Results & Refined Hypothesis
  content: '### 1. Summary of Analytical Probe Results

    My analytical experiments have yielded strong evidence supporting the "Algorithmic
    Stability" hypothesis (H2).


    - **Variance Distribution (EID 1839):** Confirmed a significant difference in
    variance between the top 1500 HVGs (mean norm var: 0.99) and the next 500 (mean
    norm var: 0.59).

    - **PC Contribution (EID 1840):** Showed that the lower-variance 500-gene set
    still contributes substantially (~30%) to the variance of the first principal
    component, indicating they are not simply noise but are structurally important.


    ### 2. Refined Hypothesis: The `sc.pp.scale` Artifact Hypothesis

    The combination of these results leads to a refined hypothesis: The SOTA improvement
    is caused by **avoiding artifacts introduced by the `sc.pp.scale` function**.
    When `sc.pp.scale` is applied to all 2000 HVGs, it aggressively inflates the variance
    of the 500 structurally important but lower-variance genes to match the others.
    This aggressive, artificial scaling likely distorts the data in a way that harms
    downstream algorithms like PCA and PBVE-lite. By removing these 500 genes, we
    are simply feeding a more homogenous, less artificially distorted set of features
    into the pipeline, leading to a better result.


    ### 3. Plan for a Definitive Experiment

    To test this, I must design an experiment that keeps all 2000 genes but mitigates
    the hypothesized scaling artifact.


    **Experiment Plan: "SOTA + No Scaling"**

    I will run the full SOTA pipeline using all 2000 HVGs, but with one critical change:
    I will completely **remove the `sc.pp.scale` step**.


    - **Pipeline:** `log1p -> HVG (2000) -> PCA -> PBVE-lite -> DAQB`.


    **Predicted Outcome:**

    - If my hypothesis is correct, removing the `sc.pp.scale` step should *also* lead
    to a SOTA-level score, even with all 2000 genes. This is because we would be avoiding
    the artifact-inducing scaling. The performance might not be identical to my 1500
    HVG SOTA, as scaling does provide some benefit, but it should be significantly
    better than the original 2000 HVG baseline and potentially approach SOTA level.

    - If the score is poor, it would falsify my hypothesis and suggest that `sc.pp.scale`
    is essential for reasons other than what I''ve theorized.


    This experiment provides a clean, decisive test of my refined hypothesis.

    '
