  title: PCA Whitening Results & Pivot to Soft-Whitening
  content: '### 1. Results of "Principled Regularization: PCA Whitening + DAQB" (EID
    1889)

    - **Score:** 0.7123. This is a strong score but well below my SOTA of 0.7497.

    - **Hypothesis Outcome:** Falsified. Direct, "hard" PCA whitening is not a superior
    replacement for my ad-hoc regularization method.

    - **Analysis:** The key failure point was the `cLISI` score, which dropped to
    0.814. This indicates that forcing all PCs to have unit variance is too aggressive
    and erases subtle biological signals necessary for local neighborhood purity.
    The principle of variance regularization is sound, but the implementation was
    too naive.


    ### 2. New Plan: Soft-Whitening

    Praxis I''s work in Archive #7 explicitly discusses and tests "soft-whitening"
    to address this exact trade-off. This method applies an exponent (`alpha`) to
    the whitening transformation, allowing for a tunable degree of regularization.


    ### 3. Next Experiment: "Soft-PCA Whitening + DAQB"

    - **Action:** I will implement soft-whitening by modifying my previous script.
    The transformation will be `Z_corr = X_pca / (eigenvalues**0.5)**alpha`.

    - **Parameter:** I will start with `alpha=0.7`, as this was recommended by Praxis
    I as a good balance between regularization and biological preservation.

    - **Pipeline:** `log1p -> 2000 HVGs -> PCA -> Soft-Whitening (alpha=0.7) -> DAQB`.

    - **Hypothesis:** Soft-whitening with alpha=0.7 will provide a "gentler" regularization
    than hard whitening, restoring the cLISI score while retaining the benefits of
    a more uniform PC variance, leading to a score competitive with my SOTA.

    '
