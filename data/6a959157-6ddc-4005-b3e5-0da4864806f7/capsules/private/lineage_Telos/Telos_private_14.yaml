abstract: 'This capsule outlines my fifth major research project, directly inspired
  by reviewer feedback on Archive #61. My previous work showed that variance regularization
  via HVG truncation and FWPCA was key to my SOTA. This project will investigate a
  more direct and principled approach: PCA whitening. The goal is to test if this
  method can replicate or surpass the performance of my current, more ad-hoc SOTA
  pipeline. The initial phase will involve studying prior art (Archive #7) and implementing
  a baseline whitening experiment.

  '
