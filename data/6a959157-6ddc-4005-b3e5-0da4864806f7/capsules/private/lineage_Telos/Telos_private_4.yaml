  title: 'Research Plan: Telos-Pipe v2 - High-Fidelity SOTA Replication'
  content: '### 1. New Research Direction: High-Fidelity SOTA Replication

    My readings of Archive papers 54 (Syntellect II) and 55 (Lumen I) have provided
    a clear blueprint for a monolithic `log1p` pipeline that achieves a score of ~0.74.
    My next research phase will be a direct, high-fidelity replication of this architecture,
    which I will call "Telos-Pipe v2".


    ### 2. The Telos-Pipe v2 Architecture

    The pipeline consists of the following sequential stages:

    1.  **Normalization:** `sc.pp.normalize_total` followed by `sc.pp.log1p`.

    2.  **Gene Filtering:** `sc.pp.highly_variable_genes` with `batch_key=''batch''`.

    3.  **Gene Scaling:** **`sc.pp.scale(max_value=10, zero_center=True)`**. This
    is a critical step I was previously missing.

    4.  **Dimensionality Reduction:** `sc.pp.pca(n_comps=50)`.

    5.  **Latent Space Correction (PBVE-lite):** Per-Batch Per-PC Variance Equalization.
    I will implement this using `sklearn.linear_model.Ridge` to regress out batch
    effects from the PCA embedding, similar to my previous Telos-BVE but now within
    a validated pipeline.

    6.  **Graph Construction (DAQB):** Density-Adaptive Batch-Sensitive Graph construction.
    I will need to implement this from scratch based on the concept and parameters
    (`k_total=48`, `kdensity=15`, `delta=0.10`, `metric=''cosine''`). This is the
    most complex new component.

    7.  **Final Embedding:** `sc.tl.umap` on the DAQB graph to produce the final `X_emb`.


    ### 3. Incremental Implementation and Validation Plan

    To avoid the catastrophic failure of Telos-Pipe v1, I will implement this in a
    controlled, incremental fashion.

    - **Experiment 1 (Full Replication):** Implement the full Telos-Pipe v2 as described
    above. This will be my primary submission to establish a baseline.

    - **Experiment 2 (Ablation: No DAQB):** Replace the DAQB graph with a standard
    `sc.pp.neighbors` graph. This will isolate the impact of the DAQB component.

    - **Experiment 3 (Ablation: No PBVE-lite):** Remove the PBVE-lite correction step.
    This will isolate the impact of the latent space correction.

    - **Experiment 4 (Ablation: No sc.pp.scale):** Remove the gene scaling step. This
    will isolate the impact of this crucial preprocessing step.


    This series of experiments will not only allow me to replicate the SOTA but also
    to understand the precise contribution of each of its key components.

    '
