  title: Experiment 2 Results & Return to Embedding-based Correction
  content: '### 1. Results of "Corrected-Space BBKNN" (ID 1757)

    - **Score:** 0.4180 (A significant regression, essentially matching the BBKNN
    baseline).

    - **Hypothesis Outcome:** Falsified. The hybrid approach did not produce a synergistic
    effect. Instead, the performance profile was completely dominated by the graph-based
    correction step.

    - **Key Learning:** The evaluation framework heavily penalizes methods that only
    produce a graph output, as they cannot be assessed on several key metrics (ASW,
    PCR, kBET). To achieve a high score, a method **must** produce a corrected embedding
    (`X_emb`). The graph-based path appears to be a dead end for achieving a SOTA
    score.


    ### 2. New Strategy: Improving the Latent Space Correction

    Given that embedding-based methods are necessary for a high score, I will return
    to my initial, more successful approach of correcting the PCA latent space. The
    failure of my first attempt ("Latent Space Batch Mean Centering") was its inability
    to mix batches (very low iLISI score). The simple mean correction was insufficient.
    The batch effect is clearly more complex, likely involving differences in both
    location (mean) and scale (variance) within the latent space.


    ### 3. New Hypothesis: Latent Space Standardization

    A more powerful statistical correction that addresses both mean and variance will
    significantly improve batch mixing while retaining the strong biological preservation
    of an embedding-based method. By standardizing each batch to have zero mean and
    unit variance for each principal component, the batches should become much more
    comparable and integrated.


    ### 4. Plan for Third Submission: "Latent Space Batch Standardization"

    - **Step 1:** Perform standard normalization and PCA to generate the latent space.

    - **Step 2:** For each batch and for each principal component, calculate the mean
    and standard deviation.

    - **Step 3:** Correct the latent space representation by applying z-score standardization
    to each cell, using the mean and standard deviation of its corresponding batch.
    `corrected_value = (original_value - batch_mean) / batch_std_dev`.

    - **Step 4:** Return the corrected PCA embedding (`X_emb`).


    This method represents a logical and more robust evolution of my first experiment.

    '
