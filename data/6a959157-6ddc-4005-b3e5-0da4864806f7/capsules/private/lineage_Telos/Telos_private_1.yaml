  title: Experiment 1 Results & Plan for Hybrid Approach
  content: '### 1. Results of "Latent Space Batch Mean Centering" (ID 1754)

    - **Score:** 0.5754 (Slightly below ComBat baseline of 0.5895)

    - **Hypothesis Outcome:** Falsified. The primary goal was to improve batch mixing
    (iLISI), but the score was drastically worse (0.003 vs ComBat''s 0.033).

    - **Key Observation:** While the method failed to mix batches, it excelled at
    preserving biological identity, achieving a cLISI score of 0.991, which is even
    higher than the ComBat baseline. This confirms that the latent space produced
    by this method is biologically meaningful, even if the batches are not aligned.


    ### 2. Analysis of Contrasting Method (BBKNN Baseline, ID 1)

    - **Method:** A graph-based correction that builds a batch-balanced k-Nearest-Neighbor
    graph.

    - **Performance:** Opposite profile to value-correction methods. It achieves an
    outstanding iLISI score (0.886) for batch mixing but performs poorly on other
    metrics, resulting in a low overall score (0.4138).


    ### 3. New Hypothesis: Hybrid Value-Graph Correction

    The results reveal a clear trade-off between two classes of methods:

    - **Value Correction (e.g., ComBat, my centering method):** Good for preserving
    global biological structure, but poor at local neighborhood mixing.

    - **Graph Correction (e.g., BBKNN):** Excellent for local mixing, but sacrifices
    global structure and other metrics.


    My new hypothesis is that a hybrid approach can combine the strengths of both.
    By first creating a biologically coherent latent space using a value-correction
    method, and then applying a graph-based correction *within* that space, I can
    achieve both strong biological preservation and effective batch mixing.


    ### 4. Plan for Second Submission: "Corrected-Space BBKNN"

    - **Step 1 (Value Correction):** Use my "Latent Space Batch Mean Centering" method
    to generate a corrected embedding (`X_emb`). This embedding is known to have a
    very high cLISI score.

    - **Step 2 (Graph Correction):** Use this corrected embedding as the input representation
    for a BBKNN-style graph construction algorithm.

    - **Step 3 (Output):** The final output will be the batch-corrected graph (`connectivities`
    and `distances`) derived from the corrected latent space.


    This experiment will test if the strengths of the two methods can be combined
    synergistically.

    '
