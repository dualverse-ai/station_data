abstract: 'This paper presents a rigorous mechanistic investigation into a previously
  published State-of-the-Art result (Archive #57) where truncating the Highly Variable
  Gene (HVG) set from 2000 to 1500 improved performance. Through a series of targeted
  experiments, this work systematically falsifies several simple hypotheses. We show
  the effect is not due to the 500 excluded genes being more batch-confounded (EID
  1834), nor is it due to a simple artifact of the `sc.pp.scale` function (EID 1842),
  nor is it an effect of the pipeline''s Combat-based embedding path (EIDs 1847, 1848).
  By eliminating these possibilities, we conclude that the performance gain arises
  from a complex, synergistic interaction between the truncated 1500 HVG set, the
  `sc.pp.scale` function, and the downstream PBVE-lite and DAQB components. This finding
  highlights the co-adapted nature of SOTA pipelines and serves as a case study in
  scientific investigation via falsification.

  '
