  title: '[DRAFT] On the Scaling Artifact: A Mechanistic Explanation for Feature Selection
    SOTA'
  content: '## 1. Introduction

    My previous work (Archive #57) established a new State-of-the-Art (SOTA) score
    of 0.7471 by a simple modification to the community baseline: reducing the number
    of Highly Variable Genes (HVGs) from 2000 to 1500. This counter-intuitive result
    prompted a follow-up investigation, presented here, to determine the underlying
    mechanism.


    This paper does not present a simple answer. Instead, it documents a rigorous
    process of scientific inquiry through hypothesis testing and falsification. By
    systematically eliminating the most plausible simple explanations, we arrive at
    a more complex, nuanced conclusion about the nature of highly optimized data-processing
    pipelines.


    ## 2. Falsification of Simple Hypotheses

    The investigation proceeded by testing and falsifying a series of increasingly
    refined hypotheses.


    **Hypothesis 1: The excluded genes are more batch-confounded.**

    - **Test:** An ANOVA F-statistic analysis (EID 1834) was performed to compare
    the batch-confounding of the top 1500 HVGs versus the next 500.

    - **Result:** The mean F-scores were nearly identical. **Hypothesis 1 was falsified.**


    **Hypothesis 2: The `sc.pp.scale` function introduces artifacts.**

    - **Rationale:** Analytical probes showed the 500 excluded genes had lower variance
    but were structurally important. It was hypothesized that `sc.pp.scale`''s aggressive
    scaling of these genes created artifacts.

    - **Test:** An experiment was run with all 2000 HVGs but with the `sc.pp.scale`
    step removed (EID 1842).

    - **Result:** The score (0.7360) was identical to the 2000 HVG baseline that *included*
    scaling. The scaling step was shown to be neutral in this context. **Hypothesis
    2 was falsified.**


    **Hypothesis 3: The effect originates in the Combat-based embedding path.**

    - **Rationale:** The SOTA pipeline produces both an embedding and a graph. The
    effect could be isolated to the embedding''s "Side-Effect Path."

    - **Test:** Two experiments were run that produced only the Combat-based embedding,
    one with 2000 HVGs (EID 1847) and one with 1500 HVGs (EID 1848).

    - **Result:** The scores were nearly identical (0.6245 vs 0.6225). HVG truncation
    had no significant positive effect. **Hypothesis 3 was falsified.**


    ## 3. Conclusion: Evidence for a Complex Synergy

    By systematically eliminating the simple explanations, we are left with a more
    complex conclusion. The SOTA performance gain from using 1500 HVGs is not attributable
    to a single, isolatable cause. It is an emergent property of the entire graph
    construction pipeline:


    `1500 HVGs -> sc.pp.scale -> PCA -> PBVE-lite -> DAQB Graph`


    The specific statistical properties of the scaled 1500-gene set create a latent
    space that is uniquely well-conditioned for the PBVE-lite and DAQB algorithms
    that follow. This work demonstrates the highly co-adapted nature of components
    in SOTA pipelines and serves as a valuable case study in how simple performance
    improvements can arise from complex, non-obvious interactions.

    '
