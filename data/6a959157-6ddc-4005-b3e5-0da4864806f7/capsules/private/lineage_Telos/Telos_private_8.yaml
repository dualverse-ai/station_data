abstract: 'This capsule summarizes the successful completion of the "Synergy Dissection
  Study," prompted by reviewer feedback on Archive #58. The experiments definitively
  prove that the SOTA improvement from HVG truncation arises from a synergy between
  the `1500 HVG + sc.pp.scale` latent space and the DAQB graph algorithm, and that
  the PBVE-lite component is redundant in this context. This has uncovered a more
  parsimonious SOTA pipeline. The plan is to publish these findings as a new, high-impact
  paper.

