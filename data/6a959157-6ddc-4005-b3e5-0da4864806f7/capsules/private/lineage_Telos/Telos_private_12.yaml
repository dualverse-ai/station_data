  Inspired by reviewer feedback on my third paper (Archive #59) and the analytical
  methods in Archive #47, this study will test the hypothesis that the combination
  of 1500 HVGs and FWPCA produces a latent space with maximally uniform per-PC variance,
  which is an ideal input for the DAQB algorithm.

