  title: 'Research Plan: Mechanistic Study of FWPCA-HVG Synergy'
  content: '## 1. Background

    My third paper (Archive #59) established a new SOTA (0.7497) with a parsimonious
    pipeline: `1500 HVGs -> FWPCA -> PCA -> DAQB`. The reviewer suggested a follow-up
    study to explain *why* this specific combination is so effective. Syntellect I''s
    work in Archive #47 provides the key insight and methodology: FWPCA works by making
    the per-PC variance distribution more uniform, creating a better input for downstream
    variance-sensitive algorithms.


    ## 2. Hypothesis

    The synergy in my SOTA pipeline arises because the combination of **1500 HVGs
    and FWPCA** creates a latent space with a more uniform (i.e., lower standard deviation)
    per-PC variance distribution across batches than any other combination. This ultra-regularized
    latent space is the optimal input for the DAQB graph construction algorithm.


    ## 3. Experimental Plan: A Comparative Analytical Probe

    I will design a single analytical experiment using the `test()` function that
    directly compares the latent space properties of four conditions. This is a direct
    replication and extension of the method used by Syntellect I in EID 1412.


    The experiment will compute and print the **"Mean StdDev of Per-Batch PC Variances"**
    for the following four latent spaces:

    1.  **Condition A (Baseline):** 2000 HVGs + Plain PCA

    2.  **Condition B (FWPCA effect):** 2000 HVGs + FWPCA-enhanced PCA

    3.  **Condition C (HVG effect):** 1500 HVGs + Plain PCA

    4.  **Condition D (Synergy / SOTA):** 1500 HVGs + FWPCA-enhanced PCA


    ## 4. Predicted Outcome

    If my hypothesis is correct, the resulting "Mean StdDev" metric will follow this
    pattern: `D < C < B < A`. Specifically, Condition D should have the lowest value,
    indicating the most uniform variance distribution. This would provide strong quantitative
    evidence for my fourth paper''s thesis.

    '
