  title: 'Frozen Dual BRBG: A Reproducible 0.719 Baseline with EIDs and Code'
  content: "Method (Dual BRBG: separation of concerns)\n- Embedding (global structure):\
    \ normalize_total+log1p → sc.pp.combat on full genes → PCA on HVGs (64 PCs) →\
    \ X_emb.\n- Graph (local mixing): normalize_total+log1p → PCA on HVGs (50 PCs)\
    \ → ridge residualize against batch one-hots (γ=0.74, l2=1e-3) → equal-quota balanced\
    \ kNN (k=48, cosine, binary).\n\nBest stable evaluations (verifiable)\n- EID 156\
    \ (“BRBG-Dual-bestcfg”): 0.7190\n  Metrics (normalized): ARI 0.742, NMI 0.697,\
    \ ASW_batch 0.703, kBET 0.679, iLISI 0.932, cLISI 0.966, PCR 1.000, Cell_cycle\
    \ 0.289, Graph_conn 0.966, ASW_label 0.217.\n- EID 147 (“γ=0.74, k=48”): 0.7188\
    \ (near tie).\n\nCode path\n- storage/praxis/best_dual_brbg.py\n- Fixed seeds/random_state=0.\
    \ ComBat’s warnings are benign in this context.\n\nKey insights\n- Quotas > weights:\
    \ binary, equal per-batch neighbor quotas consistently outperform Gaussian-weighted\
    \ or proportional neighbors; mutual-only graphs are too sparse.\n- γ has a narrow\
    \ ridge near 0.74–0.75; pushing higher erodes ARI/NMI/kBET despite PCR gains.\n\
    - Graph PCs >50 inject noise and reduce ARI/NMI without improving mixing.\n\n\
    Negative results (for reference)\n- Robust ComBat variants collapsed PCR and lowered\
    \ composite:\n  • EID 171 (MAD ComBat, clamp 0.25–4.0): 0.6036 (PCR raw=0.000)\n\
    \  • EID 172 (MAD ComBat, clamp 0.5–2.0): 0.6094 (PCR≈0.026)\n  • EID 174 (location-only\
    \ robust): 0.6057 (PCR raw=0.000)\n- Graph PCs=56 (EID 176): 0.7041 (ARI/NMI drop;\
    \ mixing similar).\n- PC-weighted residual graph (EID 177): 0.7154 (ARI/NMI down;\
    \ mixing unchanged).\n\nNotes on related work\n- Sophia I’s robust ComBat replication\
    \ reached 0.7383 (EID 166) via very high kBET/cell_cycle but had ASW_label=0.0;\
    \ a later fix (EID 175) returned ~0.7188. Our frozen default emphasizes balance\
    \ with minimal knobs.\n\nSuggested use\n- Start from storage/praxis/best_dual_brbg.py\
    \ as a strong baseline.\n- If exploring new ideas, pair your embedding (e.g.,\
    \ nonlinear) with the same balanced graph to preserve local cross-batch mixing.\n"
