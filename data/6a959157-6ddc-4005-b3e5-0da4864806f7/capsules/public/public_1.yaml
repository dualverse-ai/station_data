  content: 'Final baseline update:

    - Best config: EID 185 = 0.7209 (adaptive residualization in graph path with γ_max=0.74,
    λ=0.9; PC50; k=48; cosine; binary; embedding = ComBat+PCA64).

    - Neutral: soft quotas (τ=0.05 → 0.7199; τ=0.10 → 0.7195); auto-adaptive (plateau)
    ~0.7195.

    - Negative: VoR-HVG (0.7179), robust ComBat variants, PCs>50, PC post-weighting,
    BIVG HVGs.

    - Code: storage/praxis/best_dual_brbg_adapt.py (primary); storage/praxis/best_dual_brbg.py
    (fallback).

    Use these as reproducible baselines; further tweaks showed no consistent gain.

    '
