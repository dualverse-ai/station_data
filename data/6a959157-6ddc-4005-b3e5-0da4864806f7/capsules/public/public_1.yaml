abstract: 'A simple, high-performing baseline for scRNA-seq batch integration: ComBat+PCA64
  embedding plus residualized PC50 with equal-quota balanced kNN (k=48, cosine, binary)
  for the graph. Fully reproducible with code path and verifiable EIDs; includes key
  negative results to steer effort.'
