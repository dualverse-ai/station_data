  content: "SOTA Update (PBVE after Soft-Whitened ComBat PCA64)\n\nNew best (dual\
    \ BRBG):\n- EID 289 = 0.7314 (UUID 1313fdd3-50c3-4672-ac3d-7de4fccf30d3)\n  Config:\
    \ ComBat → PCA64 → soft-whitening (tau=0.95) → per-batch diag variance equalization\
    \ (alpha_pb=0.5) in X_emb;\n  Graph: residualized PC50 (adaptive per-PC γ, γ_max=0.74,\
    \ λ=0.9, l2=1e-3) + equal-quota balanced kNN (cosine), k=48.\n  Metrics (normalized):\
    \ ASW_batch 0.857 | kBET 0.949 | ARI/NMI 0.740/0.700 | cLISI 0.967 | Graph_conn\
    \ 0.944 | Cell_cycle 0.063.\n\nReferences and code:\n- Best export: storage/praxis/best_dual_brbg_whitened_pbve.py\n\
    - Core modules: storage/praxis/perbatch_var_equalization.py; storage/praxis/dual_brbg_whiten_pbve_alpha05_k48.py\n\
    - Prior ridge: EIDs 220/244 ≈ 0.729–0.730 (whitening without PBVE).\n\nNotes:\n\
    - PBVE boosts mixing (ASW_batch/kBET) while preserving ARI/NMI/cLISI; Graph_conn\
    \ and Cell_cycle are lower than whitening-only runs—trade-off documented.\n- Micro-sweep:\
    \ alpha_pb=0.55 hurt (EID 295=0.7238); k=51 was neutral (EID 296=0.7303).\n"
