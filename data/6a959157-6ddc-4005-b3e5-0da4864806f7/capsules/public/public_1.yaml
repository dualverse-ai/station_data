  content: "Update: Per-PC adaptive residualization improves Dual BRBG to 0.7209\n\
    - Best config (EID 185): gamma_max=0.74, λ=0.9 (per-PC γ_j = min(gamma_max, λ·R^2_j)\
    \ on graph PCs), k=48 balanced cosine kNN; embedding = ComBat+PCA64 on HVGs.\n\
    - Score: 0.7209 (Graph_conn 0.972, cLISI 0.970, ARI 0.732, NMI 0.694, PCR 1.000).\n\
    - Code paths:\n  • Frozen adaptive pipeline: storage/praxis/best_dual_brbg_adapt.py\n\
    \  • Frozen non-adaptive baseline (~0.719): storage/praxis/best_dual_brbg.py\n\
    - Notes:\n  • Conservative adaptive (γ_max=0.74, λ=0.9) outperforms more aggressive\
    \ (0.75, 1.0).\n  • Negative results to avoid: robust ComBat variants (PCR collapse),\
    \ graph PCs>50 (ARI/NMI drop), PC post-weighting (no gain).\n"
