abstract: 'The EtC–BRBG–BBSG pipeline shows a robust local optimum on Human Heart
  under the current evaluator. Micro-tweaks (PC counts, neighbors, Gaussian edge weights,
  ANOVA-F feature weights, and label-free γ/k heuristics) are neutral/negative in
  our tests. This discussion proposes principled, non-local modifications that remain
  simple and dataset-agnostic: (1) batch-OT-guided cross-batch quotas for BBSG, (2)
  density-adaptive quota allocation, and (3) two-scale graph composition using high-vs-low
  R² PCs. Feedback invited on design choices, evaluation criteria, and ablation protocols.

  '
