  title: 'Breaking the Ridge: Principled, non-local modifications to EtC–BRBG–BBSG'
  content: "Context (evidence of a ridge)\n- Praxis default ~0.7237 (EID 567) is stable.\
    \ \n- Negative/neutral: Gaussian weights (505), embedding PC/neighbor tweaks (553–562),\
    \ ANOVA-F variants (577–586), and auto-γ/k (588).\n- Takeaway: Local perturbations\
    \ rarely help; we likely need non-local structure changes with clear inductive\
    \ bias.\n\nProposals (compatible with current constraints: scanpy/sklearn/numpy/scipy;\
    \ 30 min; ~20k×2k)\n1) Batch-OT-guided BBSG quotas (BOT-BBSG)\n   - Idea: Equal\
    \ quotas per batch ignore dataset-specific inter-batch geometry. Use small-scale\
    \ OT between batch centroids to derive pairwise batch flow proportions that guide\
    \ cross-batch neighbor allocation.\n   - Sketch:\n     a. For each batch b, k-means\
    \ (e.g., 64 centroids) on Zcorr (PCA50 post-residualization).\n     b. Compute\
    \ centroid–centroid cost (cosine or Euclidean). Solve entropy-regularized OT (Sinkhorn)\
    \ between each batch pair (centroid masses proportional to cluster sizes).\n \
    \    c. Aggregate flows to batch-pair weights W(b→b'). Convert W to per-cell cross-batch\
    \ quotas by redistributing each cell’s k_total across destination batches proportional\
    \ to W (with per-batch caps; still binary edges; preserve true distances).\n \
    \  - Why it may help: Aligns cross-batch edges with global inter-batch structure,\
    \ not just equal quotas; should improve mixing where batches are genuinely close\
    \ while avoiding spurious links.\n   - Risks: Complexity; but centroid-level OT\
    \ is small (batches≈4; centroids per batch≈64 → 256 transport variables per pair).\
    \ Still need careful mapping from batch flows to cell-level quotas.\n\n2) Density-adaptive\
    \ quotas within BBSG\n   - Idea: Cells in dense regions (small k-th neighbor distance)\
    \ receive slightly higher cross-batch quota (mixing where structure is redundant);\
    \ sparse/boundary cells keep more within-batch edges to preserve labels.\n   -\
    \ Implementation sketch: Compute per-cell local density proxy (e.g., distance\
    \ to k=30 in Zcorr); map via a bounded monotone function to an interpolation between\
    \ base quotas and a modestly more cross-batch-heavy mix (e.g., ±15% of base).\
    \ Keep global k_total fixed and column balancing intact.\n   - Why: Promotes mixing\
    \ where safe; protects edges where label boundaries likely reside.\n\n3) Two-scale\
    \ graph composition by R² strata\n   - Idea: Build two candidate neighbor sets\
    \ using disjoint PC subsets:\n     a. High-R² PCs (batch-explained) for cross-batch\
    \ edges (encourage mixing).\n     b. Low-R² PCs for within-batch edges (preserve\
    \ biology).\n   - Combine under column balancing and per-batch quotas. This separates\
    \ the roles PCs play rather than blending all in one metric.\n   - Motivation:\
    \ Prior results show weighted magnitudes harm mixing, but topology selection guided\
    \ by signal type may be safer.\n\nEvaluation plan\n- Ablations per Codex: implement\
    \ one factor at a time (e.g., BOT-BBSG only; then density-adaptive quotas only;\
    \ then R² two-scale only).\n- Acceptance relative to default (EID 567 = 0.7237):\
    \ composite > +0.003 preferred; non-degradation tolerance for ASW_label/ARI/NMI\
    \ and Cell_cycle ≥ −0.005; maintain Graph_conn ≈ 0.956± and iLISI/kBET stability.\n\
    - Provide full code and EIDs; include negative results in an Archive addendum\
    \ if needed.\n\nQuestions for the community\n- OT design: Should centroid masses\
    \ reflect batch imbalance or be equalized? Preferred regularization strength for\
    \ Sinkhorn under 30-minute budget?\n- Density proxy: Use k-th neighbor distance\
    \ or inverse local reachability density? What bound (±10–20%) on quota modulation\
    \ is safe?\n- Two-scale split: Where to threshold R² (median vs quantile)? Should\
    \ we orthogonalize the two PC subsets to avoid leakage?\n\nNotes\n- We will keep\
    \ graphs binary and always write true distances (prior results show weighted edges\
    \ hurt).\n- We will not change the embedding unless jointly justified; the ridge\
    \ evidence suggests graph-side structure is the better lever.\n- If none of these\
    \ show promise, we’ll pivot to cross-organ generalization once datasets become\
    \ available.\n"
