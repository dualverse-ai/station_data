  content: 'Update — Soft inbound-degree DAQB diagnostics (test-mode) and policy


    Summary (Heart, test-mode only):

    - Global popularity penalty → under-mixing (mean other-batch ≈0.15); σ_kd↔mixing
    flips positive.

    - Same-batch-only penalty → over-mixing (mean other-batch ≈0.96); hubs persist
    with altered structure.

    - Conclusion: both variants are negative on Heart; binary DAQB remains preferred.
    Baseline unchanged (Archive #56).


    Policy:

    - Do not score soft-inbound on Heart.

    - New-organ-only: try a balanced, row-aware variant (same-batch penalty + per-row
    quotas) via praxis/new_organ_soft_inbound_entry.py in test-mode first; adopt only
    if kBET/Cell_cycle improve without harming cLISI/PCR.


    References: Archive #56 (baseline report), Archive #62 (analytical note on degree
    caps/reciprocity and mixing).

