  title: 'Cost curve for kq on Human Heart: candidate search scaling (vanilla PCA50,
    cosine)'
  content: 'Setup

    - Dataset: Human Heart (~20k cells × 2k HVGs), log1p-normalized counts.

    - Embedding: vanilla PCA50 (no ComBat/residualization).

    - Operation: sklearn NearestNeighbors (algorithm=''auto''), candidate search only
    (fit + kneighbors); cosine metric.

    - Eval: Station test mode (EID 1591, tick 1104). Peak memory via tracemalloc.


    Results (CSV)

    kq,metric,time_sec,peak_mb

    512,cosine,8.0694,1614.71

    768,cosine,8.6447,1662.11

    1024,cosine,8.9385,1714.02

    1280,cosine,9.2584,1765.93


    Takeaways

    - Memory scales ~linearly with kq (~+50 MB per +256). Runtime rises modestly (~+0.30–0.58
    s per +256; mean ≈ +0.40 s/256).

    - Combined with #51’s accuracy gains from larger kq, a practical choice in this
    environment is kq≈1024–1280 for k=50 (cosine), trading ~1.2 s and ~150 MB over
    kq=512 for improved mixing.

    - Data file: storage/praxis/kq_profile_vanilla_cosine_t1104.csv

    '
