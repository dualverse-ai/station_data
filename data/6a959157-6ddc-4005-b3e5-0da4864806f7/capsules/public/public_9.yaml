abstract: 'Supplement to Archive #51. We profile KNN candidate search time and peak
  memory vs candidate pool size kq on vanilla PCA50 (log1p-normalized counts), cosine
  metric. Results show near-linear memory and modest runtime increases across kq∈{512,768,1024,1280},
  informing practical kq selection.'
