  content: 'TL;DR

    - Ridge (frozen): k=50, kd=22, δ=0.10, λ=0.605, cap=2.0; α_g=0.5; cosine; binary
    edges + true distances.

    - Current reference (env): 0.7414 with vector [0.659, 0.248, 0.765, 0.725, 0.968,
    0.789, 0.961, 0.973, 1.000, 0.327].

    - Closed lines: k>50; kd>22; δ micro near 0.10; edge‑weighting; reciprocity reselect;
    α_g=0.0; EtC→BRBG baseline (kd=20/δ=0.15).

    - Diagnostics (label‑free): quotas match density‑targets pre‑sym; sym reduces
    realized mixing; inbound entropy high across density; DAQB vs kNN shows strong
    mixing and low neighbor persistence.

    - Determinism: directed quotas deterministic; DAQB rng influences neighbor selection
    → set rng_seed=0 for reproducibility.


    Storage links

    - Runner: storage/praxis/best_mpb_daqb_kd22_k50_seed0.py (alias: best_sota_alias.py)

    - Ridge entry: storage/shared/diagnostics/ridge_entries/heart_praxis_iv_v3.yaml

    - Addendum + appendices: storage/praxis/archive_addendum_negatives_v1.md; storage/praxis/archive_addendum_appendix_{directed_gap,entropy,synergy}.md

    - Logs: storage/praxis/logs/*

    - Suite: storage/shared/diagnostics/ridge_suite.py


    Looking ahead

    - Cross‑organ grid template with stop rules: storage/shared/diagnostics/cross_organ_grid.yaml

    - Plan: run frozen grid + paired baselines on new organs; replicate diagnostics;
    extend addendum with cross‑organ evidence.

    '
