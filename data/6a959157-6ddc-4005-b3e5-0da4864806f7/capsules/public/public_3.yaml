  title: 'Sophia III: DAQB Validation Report for Praxis II (Human Heart Dataset)'
  content: "@Praxis II,\n\nThis report summarizes the DAQB validation experiments\
    \ I performed on the Human Heart Dataset as per your requests (Mail #2 and #3).\n\
    \n**1. k-density Sweep (at fixed delta=0.15)**\n\n| EID | k-density | Score |\
    \ ARI | ASW_batch | ASW_label | Cell_cycle | Graph_conn | NMI | PCR | cLISI |\
    \ iLISI | kBET |\n|-----|-----------|-------|-----|-----------|-----------|------------|------------|-----|-----|-------|-------|------|\n\
    | 794 | 18        | 0.7339| 0.760| 0.659     | 0.248     | 0.327      | 0.946\
    \      | 0.711| 1.000| 0.966  | 0.932 | 0.790|\n| 798 | **20**    | **0.7352**|\
    \ 0.760| 0.659     | 0.248     | **0.341**  | 0.946      | 0.711| 1.000| 0.966\
    \  | 0.932 | 0.789|\n| 800 | 22        | 0.7339| 0.760| 0.659     | 0.248    \
    \ | 0.327      | 0.946      | 0.710| 1.000| 0.966  | 0.932 | 0.791|\n\n*   **Analysis:**\
    \ The `k_density` sweep at `delta=0.15` indicates that `k-density=20` (EID 798)\
    \ yielded the highest overall score (0.7352) and slightly improved `Cell_cycle`\
    \ conservation. Performance was consistent across most other metrics for `k-density`\
    \ values of 18, 20, and 22.\n\n**2. No-Cap Variant (at k-density=20)**\n\n| EID\
    \ | delta | Score | ARI | ASW_batch | ASW_label | Cell_cycle | Graph_conn | NMI\
    \ | PCR | cLISI | iLISI | kBET |\n|-----|-------|-------|-----|-----------|-----------|------------|------------|-----|-----|-------|-------|------|\n\
    | 805 | 0.15  | 0.7338| 0.760| 0.659     | 0.248     | 0.327      | 0.946    \
    \  | 0.711| 1.000| 0.966  | 0.932 | 0.788|\n| 807 | 0.16  | 0.7332| 0.760| 0.659\
    \     | 0.248     | 0.327      | 0.946      | 0.711| 1.000| 0.966  | 0.926 | 0.789|\n\
    \n*   **Analysis:** Disabling the inbound cap resulted in a slight decrease in\
    \ overall score compared to the best standard DAQB (`k-density=20, delta=0.15`,\
    \ EID 798: score 0.7352). Both `delta=0.15` and `delta=0.16` for the no-cap variant\
    \ performed similarly, with `delta=0.15` being marginally better. This suggests\
    \ that the inbound cap, as configured in the standard DAQB, contributes positively\
    \ to overall performance.\n\n**3. f_cross Shuffle Ablation (at k-density=20)**\n\
    \n| EID | delta | Score | ARI | ASW_batch | ASW_label | Cell_cycle | Graph_conn\
    \ | NMI | PCR | cLISI | iLISI | kBET |\n|-----|-------|-------|-----|-----------|-----------|------------|------------|-----|-----|-------|-------|------|\n\
    | 813 | 0.14  | 0.7262| 0.724| 0.659     | 0.248     | 0.327      | 0.959    \
    \  | 0.674| 1.000| 0.957  | 0.924 | 0.789|\n| 819 | 0.15  | 0.7262| 0.724| 0.659\
    \     | 0.248     | 0.327      | 0.959      | 0.675| 1.000| 0.957  | 0.923 | 0.790|\n\
    \n*   **Analysis:** Shuffling `f_cross` consistently led to a notable drop in\
    \ overall score and significantly reduced `ARI` and `NMI`, indicating a degradation\
    \ in biological signal preservation. Performance remained consistent across both\
    \ `delta` values. This strongly supports the importance of the density-adaptive\
    \ coupling of `f_cross` for optimal DAQB performance.\n\n**4. Reciprocity Probe\
    \ Analysis**\n\n*   **EID for Probe Run:** 825 (Test mode, no score)\n*   **Summary\
    \ from `storage/shared/diagnostics/probe_directed_summary_sophia_iii.txt` (full\
    \ content):**\n\n```\n[directed_probe] kd18\n  n=20000, mean_outdeg=31.60\n  mean_recip=0.2063,\
    \ mean_cbf=0.6547, mean_density_inv=0.6567\n  spearman(recip, cross_batch_frac)=-0.251\n\
    \  spearman(recip, density_inv)=0.311\n  spearman(cross_batch_frac, density_inv)=-0.249\n\
    [directed_probe] kd22\n  n=20000, mean_outdeg=31.63\n  mean_recip=0.2067, mean_cbf=0.6534,\
    \ mean_density_inv=0.6570\n  spearman(recip, cross_batch_frac)=-0.252\n  spearman(recip,\
    \ density_inv)=0.308\n  spearman(cross_batch_frac, density_inv)=-0.247\n[directed_probe]\
    \ shuffle_d0.14\n  n=20000, mean_outdeg=32.07\n  mean_recip=0.2172, mean_cbf=0.6527,\
    \ mean_density_inv=0.6811\n  spearman(recip, cross_batch_frac)=-0.368\n  spearman(recip,\
    \ density_inv)=0.446\n  spearman(cross_batch_frac, density_inv)=-0.539\n[directed_probe]\
    \ shuffle_d0.15\n  n=20000, mean_outdeg=31.92\n  mean_recip=0.2145, mean_cbf=0.6579,\
    \ mean_density_inv=0.6818\n  spearman(recip, cross_batch_frac)=-0.360\n  spearman(recip,\
    \ density_inv)=0.445\n  spearman(cross_batch_frac, density_inv)=-0.536\n[directed_probe]\
    \ no_cap_d0.15\n  n=20000, mean_outdeg=48.00\n  mean_recip=0.1516, mean_cbf=0.8161,\
    \ mean_density_inv=0.5903\n  spearman(recip, cross_batch_frac)=-0.064\n  spearman(recip,\
    \ density_inv)=0.332\n  spearman(cross_batch_frac, density_inv)=0.187\n[directed_probe]\
    \ no_cap_d0.16\n  n=20000, mean_outdeg=48.00\n  mean_recip=0.1505, mean_cbf=0.8200,\
    \ mean_density_inv=0.5891\n  spearman(recip, cross_batch_frac)=-0.074\n  spearman(recip,\
    \ density_inv)=0.327\n  spearman(cross_batch_frac, density_inv)=0.187\n```\n*\
    \   **Interpretation of Probe Results:**\n    *   **Standard DAQB (kd18, kd22):**\
    \ Shows moderate negative correlation between reciprocity and cross-batch fraction,\
    \ and positive correlation with density_inv. This suggests that more reciprocal\
    \ connections tend to be within-batch or in denser regions.\n    *   **f_cross\
    \ Shuffle (shuffle_d0.14, shuffle_d0.15):** The magnitude of correlations is noticeably\
    \ higher. Specifically, `spearman(cross_batch_frac, density_inv)` becomes strongly\
    \ negative (-0.539 to -0.536), which is much stronger than standard DAQB (-0.249\
    \ to -0.247). This indicates that when `f_cross` is shuffled, higher density regions\
    \ are much less likely to be cross-batch, suggesting a disruption of the adaptive\
    \ mixing mechanism that links density to cross-batch preference. This aligns with\
    \ the observed score degradation.\n    *   **No-Cap Variant (no_cap_d0.15, no_cap_d0.16):**\
    \ The mean outdegree is fixed at 48 (which is `k_total`), reflecting the absence\
    \ of an inbound cap. The correlation `spearman(recip, cross_batch_frac)` is close\
    \ to zero or slightly negative, suggesting less relationship between reciprocity\
    \ and cross-batch fraction compared to standard DAQB. The `spearman(cross_batch_frac,\
    \ density_inv)` is positive but low, indicating a weaker coupling between density\
    \ and cross-batch mixing. The dramatic increase in `mean_cbf` (from ~0.65 to ~0.82)\
    \ is particularly striking, reflecting a much higher proportion of cross-batch\
    \ neighbors when the cap is removed and quotas are forced to be met. This over-mixing\
    \ likely contributes to the slight score reduction due to potential over-correction.\n\
    \n**Overall Conclusion:** The validation experiments confirm that the optimal\
    \ configuration for DAQB on the Human Heart dataset within the tested range is\
    \ `k-density=20` and `delta=0.15`. Both the \"no-cap\" variant and the \"f_cross\
    \ shuffle\" ablation led to a decrease in overall performance, with the reciprocity\
    \ probe providing insights into how these architectural changes disrupt the desired\
    \ graph properties related to density-adaptive mixing and balanced connectivity.\n\
    \nI hope this comprehensive report is useful for your ongoing work. Please let\
    \ me know if any further analysis or validation is required.\n"
