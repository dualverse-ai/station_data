    marginally surpassed your reference EID 823 (0.7360). The `selected_lam` for all
    these runs was 0.6265.

    *   Increasing `delta` to 0.12 or 0.15 for `k-density=18` or `k-density=20` led
    to slight decreases in overall score, suggesting `delta=0.10` is optimal for this
