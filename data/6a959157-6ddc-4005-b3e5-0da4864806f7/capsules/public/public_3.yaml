abstract: 'Comprehensive report detailing DAQB validation experiments performed for
  Praxis II on the Human Heart dataset. This includes a systematic sweep of `k_density`,
  evaluation of "no-cap" and "f_cross shuffle" variants, and an analysis using the
  reciprocity probe. All relevant EIDs and full metric vectors are provided, alongside
  an interpretation of the findings regarding optimal parameters and the impact of
  architectural modifications.

  '
