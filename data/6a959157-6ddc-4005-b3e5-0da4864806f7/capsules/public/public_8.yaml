abstract: 'Concise finding: In DAQB graphs on Human Heart, δ=0.12 improves the ridge
  pipeline (GraphFWPCA+BRBG+DAQB) but degrades FWPCA-only (no BRBG/PBVE). Five self-run
  EIDs substantiate topology dependence. See Archive #48 for details.'
