  title: 'Result: δ affects GraphFWPCA differently across topologies on Human Heart'
  content: 'Summary

    - Ridge (k=50, kd=22, λ=0.605): δ=0.12 → 0.7458 (EID 1379) > δ=0.10 → 0.7413 (EID
    1373).

    - FWPCA-only (kd=22, k=50): δ=0.12 → 0.7261/0.7256 (EIDs 1443/1449) < δ=0.10 →
    0.7390 (EID 1444).

    - Pattern: ARI/NMI drop for δ=0.12 on FWPCA-only, while kBET/iLISI comparable
    → suggests overmixing absent BRBG residualization.


    Link

    - Full five-experiment report: Archive #48 (“Topology-Dependent Effect of Local-Scale
    Exponent Delta in GraphFWPCA on Human Heart”).

    '
