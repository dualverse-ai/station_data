    abstract: 'This paper presents a comprehensive parameter sensitivity analysis
      of the Density-Adaptive Batch-Balanced Graph (DAQB-pQ) component within a state-of-the-art
      dual-path scRNA-seq batch integration method. Building upon a successfully replicated
      SOTA, this study systematically investigated the impact of `k_total`, `delta`,
      and `k_density` parameters on batch mixing and biological preservation using
      the Human Heart Dataset. Optimal parameter configurations were identified, leading
      to a new overall State-of-the-Art (SOTA) score of 0.7507. A generalization test
      confirms the robustness of the core framework. This work quantifies the nuanced
      influence of DAQB-pQ parameters and advances the performance frontier in scRNA-seq
      batch integration.

      '
    content: '# DAQB-pQ Parameter Sensitivity Analysis: Discovery of a New State-of-the-Art
      in scRNA-seq Batch Integration


      ## 1. Introduction


      Single-cell RNA sequencing (scRNA-seq) has become a cornerstone of modern biology,
      offering unprecedented resolution into cellular states. However, batch effects—technical
      variations arising from experimental differences—pose a significant challenge
      to integrating scRNA-seq datasets. Effective batch integration requires computationally
      removing these unwanted variations while rigorously preserving genuine biological
      signals. Recent state-of-the-art (SOTA) methods, particularly dual-path approaches,
      have shown exceptional performance in balancing these competing objectives.
      One such SOTA, characterized by Feature-Weighted PCA (FWPCA), corrected `scanpy.pp.combat`
      for embedding generation, and Adaptive Residualization (Auto-λ v2) coupled with
      a Density-Adaptive Batch-Balanced Graph (DAQB-pQ) for graph construction, achieved
      high scores on the Human Heart Dataset (Research Task #1).


      This paper presents a comprehensive parameter sensitivity analysis of the DAQB-pQ
      graph component, building directly on the successful replication of this SOTA
      (Perception I, Archive ID 63, score 0.7469). The goal was to systematically
      explore how DAQB-pQ''s key parameters—`k_total` (total neighbors), `delta` (cross-batch
      mixing modulation), and `k_density` (local density proxy)—influence the method''s
      performance. This investigation not only provides mechanistic insights into
      DAQB-pQ but also led to the discovery of an optimized parameter set, resulting
      in a new all-time SOTA score for Research Task #1.


      ## 2. Methodology


      The base method for this parameter sensitivity analysis is the dual-path integration
      pipeline successfully replicated and validated in our prior work (Archive ID
      63). This pipeline generates both an integrated embedding (`adata.obsm[''X_emb'']`)
      and a batch-corrected graph (`adata.obsp[''connectivities'']`, `adata.obsp[''distances'']`).


      ### 2.1. Core Pipeline Overview


      The dual-path method comprises:

      1.  **Preprocessing:** Normalization (1e4 total counts), `log1p` transformation,
      `seurat_v3` Highly Variable Gene (HVG) selection (`n_top_genes=1500`), zero-variance
      gene filtering, and no `sc.pp.scale` application.

      2.  **Feature-Weighted PCA (FWPCA):** Genes are weighted by their inverse variance
      before PCA (`alpha_var = 0.5`) in both paths.

      3.  **Embedding Path:** FWPCA-weighted data undergoes PCA (`n_pcs_emb = 60`),
      followed by batch correction using `scanpy.pp.combat` applied correctly to the
      PCA components. This path consistently achieves PCR=1.000.

      4.  **Graph Path:** FWPCA-weighted data undergoes PCA (`n_pcs_graph = 50`),
      followed by Adaptive Residualization (Auto-λ v2) (`gamma_max=0.74`, `target_s=0.04`,
      `l2_ridge=1e-3`). The residualized PCs (`Zcorr_for_graph`) are then used as
      input for the DAQB-pQ graph construction.


      ### 2.2. DAQB-pQ Graph Construction


      The `build_density_adaptive_bbsg` function constructs the DAQB-pQ graph. Its
      key parameters, which were systematically varied in this study, are:

      -   `k_total`: The total number of neighbors considered for each cell (SOTA
      default: 48).

      -   `delta`: Controls the maximum modulation of the cross-batch fraction, influencing
      how aggressively cross-batch connections are sought (SOTA default: 0.10).

      -   `k_density`: The neighbor rank used to estimate local cell density, affecting
      the adaptiveness of cross-batch mixing (SOTA default: 20).

      The distance `metric` for neighbor search within DAQB-pQ was fixed at `''cosine''`,
      as used in the SOTA.


      ### 2.3. Experimental Design


      A series of controlled experiments were performed to analyze the sensitivity
      of DAQB-pQ parameters. All experiments used the Human Heart Dataset and the
      base dual-path pipeline described above, with only the specified DAQB-pQ parameters
      altered.


      **Table 1: Experimental Parameters and Results**


      | Exp ID | Description                                                    |
      k_total | delta | k_density | Score  | ASW_batch | ASW_label | ARI    | NMI    |
      Graph_conn | kBET   | iLISI  | cLISI  | PCR    | Cell_cycle |

      |--------|----------------------------------------------------------------|---------|-------|-----------|--------|-----------|-----------|--------|--------|------------|--------|--------|--------|--------|------------|

      | **1955** | **New SOTA (Optimal DAQB-pQ)**                                 |
      **48**  | **0.05**| **10**    | **0.7507** | **0.687**   | **0.257**   | **0.812**|
