pruned_dialogue_ticks:
- ticks: 307-323
  summary: "Research Task #1 — Human Heart scRNA integration (EtC-BRBG+BBSG line).\n\
    Baseline (best): EID 485 = 0.7363 using Praxis default:\n  EtC(FWPCA α=0.5; PCA60→ComBat\
    \ PCs) + BRBG(lam=0.9, γ_max=0.74) on PCA50 + BBSG (binary, k=48, cosine).\n \
    \ Key metrics: ARI 0.744, NMI 0.703, ASW_batch 0.659, ASW_label 0.248, Graph_conn\
    \ 0.946, kBET 0.788, iLISI 0.935, cLISI 0.967, PCR 1.000, Cell_cycle 0.373.\n\
    Experiments and outcomes (Δ vs baseline):\n  - 505 Gaussian graph weights: 0.6733\
    \ (−0.0630); iLISI collapsed despite slight ARI/NMI upticks.\n  - 507 α=0.3 (embedding):\
    \ 0.7213 (−0.0150); label structure weakened (ARI/NMI↓).\n  - Residualization\
    \ lam sweep: 508 (0.7)=0.7229, 509 (0.8)=0.7229, 510 (0.85)=0.7229 (~neutral).\n\
    \  - 512 BRS pre-ComBat (embedding): 0.7218 (−0.0145); ASW_batch↑, Cell_cycle↓\
    \ sharply (over-equalization).\n  - 514 batch-R2 gene penalty (embedding): 0.7160\
    \ (−0.0203); kBET↓.\n  - 517 PC whitening after ComBat (embedding): 0.7067 (−0.0296);\
    \ ASW_label and Cell_cycle↓ (lost biology).\n  - 518 PCA80 (embedding): 0.7175\
    \ (−0.0188); kBET↓ (over-dim hurts mixing).\n  - 521 residualization curvature\
    \ R2^1.5: 0.7217 (−0.0146); neutral.\n  - 522 graph PCs=60: 0.6323 (−0.1040);\
    \ kBET collapsed to 0.000 (avoid).\n  - 528 dataset batch-hvg HVGs: 0.7141 (−0.0222);\
    \ ARI/NMI↓, kBET↓.\n  - 529 γ_max=0.72: 0.7229 (−0.0134); neutral vs 0.74; lineage\
    \ log confirmed neutrality.\n  - BBSG candidate pool depth: 534 (3× quota)=0.7170,\
    \ 535 (2.5×)=0.7169 (~−0.019); ARI/iLISI slightly worse.\n  - 538 k_total=51:\
    \ 0.7226 (−0.0137); neutral.\n  - 543 GW1: graph PC weights w=(1−R2)^0.5: 0.7259\
    \ (−0.0104); ARI/NMI up but overall still < baseline.\n  - 545 GW2: (1−R2)^0.75:\
    \ 0.7113 (−0.0250); over-attenuation of batch-dominated PCs.\nConclusions (actionable):\n\
    \  - Keep Praxis default untouched: α=0.5, lam=0.9, γ_max=0.74, PCA60/50, BBSG\
    \ binary k=48, cosine.\n  - Avoid embedding equalization (BRS/whitening) and heavier\
    \ dimensionality (PCA80, graph PCs=60).\n  - Avoid Gaussian connectivities and\
    \ deeper BBSG candidate pools; residualization schedule tweaks are a flat ridge.\n\
    \  - Minor degree/γ_max/lam changes produce no gains on this dataset.\nReproducibility:\n\
    \  - Frozen default path: storage/praxis/best_etc_brbg_bbsg.py\n  - Graph build:\
    \ write BOTH obsp['distances'] (true) and obsp['connectivities'] (binary CSR);\
    \ never build graph on X_emb.\n  - Expected baseline metrics: Graph_conn ~0.946,\
    \ kBET ~0.788, iLISI ~0.935, cLISI ~0.967.\nRecords:\n  - Private Memory capsule\
    \ #12 (“Draft Analysis: Why Praxis defaults are robust”) aggregates EIDs, deltas,\
    \ pitfalls; pinned.\nNext:\n  - Pause micro-tuning until maturity; plan Archive\
    \ analysis post-maturity with concise EID→delta table and guidance.\n"
- ticks: 302-306
  summary: "Residualization & embedding pre-processing ablations around Praxis default\
