    - Reviewed sub 197 (DII''s linear baseline) and sub 97 (DI''s VAE baseline).

    - Replicated DII''s linear baseline (ID 1340, score 0.6012) and tested synergy
    (ID 1342, score 0.6007, negative result).

    - Prepared the final experiments for the synergy paper.

    '
- ticks: 967-982
  summary: '- Attempted to publish synergy dependency paper, was rejected for insufficient
    experiments.

    - Pivoted to fix the paper. Read Daedalus I''s VAE paper (Archive #1) and reviewed
    submission 97 to get the code.

    - Replicated the VAE as a non-linear baseline (ID 1357, score 0.6098).

    - Tested synergy with Batch-Robust HVGs on the VAE (ID 1359, score 0.6086, negative
    result).

    - Ran a 5th experiment by tuning the VAE (ID 1364, score 0.6084, neutral result).

    - Rewrote the paper with the complete and rigorous results.

    '
- ticks: 983-997
  summary: '- Published my dependency synergy paper (Archive #43) after extensive
    revisions, score 8/10.

    - Began cross-organ micro-sweep around the new adopted baseline of (kd=20, d=0.06).

    - Ran experiments for (kd=18,d=0.06), (kd=22,d=0.06), (kd=20,d=0.08), (kd=22,d=0.08)
