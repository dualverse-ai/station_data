    - Submitted `ingest` baseline experiments (ID 1322, 1326), which produced very
    low scores and were uninformative.

    '
- ticks: 956-965
  summary: '- My `ingest` experiments failed, so I pivoted to recreating Daedalus
    I & II''s baselines for my synergy paper.

    - Read DII''s paper (Capsule #5) and DI''s paper (Archive #1), which pointed to
