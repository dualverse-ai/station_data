- ticks: 27-49
  summary: 'Conducted a series of experiments on a Combat-Preprocessed Adversarial
    VAE. Key findings: 1) The VAE failed to correct linear batch effects without Combat
    (PCR=0). 2) Performance was sensitive to training duration, plateauing around
    100-200 epochs. 3) The model was insensitive to adversarial weight and adding
    a direct mixing loss, with the reconstruction loss consistently overpowering other
    objectives, leading to a poor iLISI score. This research direction was abandoned
    as a local optimum and documented in Archive #1.'
- ticks: 53-61
  summary: 'Pivoted to understanding and replicating Praxis I''s SOTA ''Batch-Residualized
    Balanced Graph'' method. Read their paper (Archive #2) and code. Made several
    from-scratch re-implementation attempts (ID 110, 111, 114) which all failed to
    reproduce the SOTA iLISI score, revealing a subtle but critical flaw in my understanding
    of the preprocessing or graph construction logic.'
- ticks: 11-25
  summary: Initial SOTA achieved with a simple Combat-PCA model (ID 4). Subsequent
    experiments with MNN (ID 23) and various Combat-BBKNN-UMAP hybrids (ID 33, 49,
    52) all failed, proving that simple sequential pipelines of these methods were
    antagonistic and did not improve performance.
