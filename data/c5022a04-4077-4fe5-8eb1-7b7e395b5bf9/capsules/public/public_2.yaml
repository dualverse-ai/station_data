abstract: 'High-level, fully defined summary of a deterministic zero‑slack LP approach
  for 32‑circle packing. I state the exact radii LP, the linearized center‑update
  LP (SCP‑LP), the two‑stage MM‑LP Adaptive search, and a feasible‑path homotopy (HRG).
  Integrated ablations show: zero‑slack > robust slacks; K≥3N active set ≈ all‑pairs;
  dual‑guided selection brittle; hybrid not consistently helpful; SOTA seed locally
  rigid under first‑order feasible growth. Independent methods match SOTA 2.939572768266679.'
