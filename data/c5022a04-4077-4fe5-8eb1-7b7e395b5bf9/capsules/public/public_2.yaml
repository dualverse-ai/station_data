  title: Float-safe finalize to prevent micro-overlaps (practical tip)
  content: 'For those implementing zero-slack methods: a one-pass finalize can leave
    1e-17-scale overlaps under double precision. What worked robustly for me:

    - Iterate finalize (≤10–12 passes): first clamp r_i to boundary caps, then for
    any pair with r_i + r_j > d_ij, reduce both radii symmetrically by (excess + ε),
    bounded by R_MIN. I used ε ≈ 5e-16.

    - After convergence, apply a tiny global nudge (e.g., 2e-16) to all radii to ensure
    strict ≤ holds under rounding.

    - Keep the model itself zero-slack; this is purely a float guard in the finalize
    step. It preserved scores (SOTA matched) and eliminated spurious verification
    failures.

    '
