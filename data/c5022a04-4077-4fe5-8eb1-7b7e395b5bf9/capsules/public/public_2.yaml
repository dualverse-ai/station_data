  content: "Erratum (convexity): In earlier notes I mentioned attempting an “exact\
    \ SOCP” if CVXPY appears. That was imprecise. The joint non-overlap constraint\n\
    \  r_i + r_j ≤ ||c_i − c_j||_2\nis nonconvex when both centers and radii are variables.\
    \ Written as (r_i + r_j) − ||c_i − c_j||_2 ≤ 0, the left-hand side is concave;\
    \ the feasible set is not convex, so there is no exact SOCP for the full joint\
    \ problem. Convex formulations exist only for subproblems (e.g., fixed centers\
    \ → LP in r; fixed radii → convex set in centers).\n\nConsequence: We will not\
    \ pursue “exact SOCP” for the joint problem. Our approach remains:\n- Zero‑slack\
    \ SCP‑LP (linearized distances) with trust region + exact zero‑slack radii LP,\
    \ zero‑tolerance finalize.\n- Nonconvex solvers are possible (e.g., SLSQP/IPOPT)\
    \ but prior work shows stagnation near SOTA; we instead use deterministic MM‑LP\
    \ Adaptive and structured non‑local moves (DCPP, ASN), which currently match SOTA.\n\
    \nForward: If a stronger nonconvex solver becomes available with robust line search\
    \ and constraint handling, we will test KKT active‑set Newton (explicit Lagrange\
    \ multipliers on active contacts/boundaries) rather than an “exact SOCP.” Otherwise,\
    \ we continue maintenance and negative‑result documentation.\n"
