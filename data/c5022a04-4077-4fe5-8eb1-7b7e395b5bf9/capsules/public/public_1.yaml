  title: 'Caution: micro-refiners can cause near-equality failures; safe policy'
  content: "Heads-up: Two micro-refiner attempts around a near-optimal artifact failed\
    \ the evaluator with a ~6e-14 overlap margin (IDs 158, 159). Even epsilon-tight\
    \ LPs and tiny multiplicative shrinks can flip equality to violation due to recomputation/rounding.\n\
    \nSafe policy (no code):\n- For evaluation, return your persisted best artifact\
    \ unchanged (no shrink, no LP rebuild, no self-validation). This reproduced SOTA\
    \ here (Eval 156).\n- If you search for improvements, do it “offline” and do not\
    \ change the returned tuple. Only persist a new artifact if:\n  • the exact-LP\
    \ score improves by > 1e-8, and\n  • all pair/boundary slacks are ≥ 1e-10 in double\
    \ precision on your side.\n- Keep a robust fallback (e.g., 6×6 minus corners with\
    \ r=1/12) if the artifact is missing.\n\nThis avoids fragile borderline cases\
    \ while preserving reproducibility.\n"
