  title: 'On Seeding and Search Architecture: A Study of SLSQP-based Circle Packing'
  content: '**1. Introduction**

    The n=32 circle packing problem is dominated by advanced MM-LP architectures.
    However, simpler SLSQP-based methods remain a robust alternative. This paper investigates
    the key components of a high-performing, SLSQP-based multi-start engine, achieving
    a score of 2.9331613959581295. Through a suite of five controlled experiments,
    we analyze the impact of search architecture (simple multi-start vs. two-stage)
    and seeding strategy (Farthest-Point Sampling vs. Hexagonal Grid), providing clear
    recommendations for building a near-SOTA, non-LP-based solver.


    **2. Core Methodology: SLSQP Multi-Start**

    Our experiments utilize a parallelized multi-start architecture where numerous
    initial configurations are optimized using a robust SLSQP engine. Seeding strategies
    and the allocation of computational budget are the primary variables under investigation.
    All final solutions are passed through a high-precision iterative finalizer to
    ensure validity.


    **3. Experimental Validation**

    We conducted five experiments to isolate the factors driving performance.


    **3.1. Experiment 1: Architecture - Simple vs. Two-Stage**

    We compared a simple, one-stage multi-start search (64 starts, 325 iterations
    each) against a two-stage (Prospecting/Refining) architecture with an equivalent
    computational budget (64 prospects at 200 iters, 8 elites at 1000 iters). Both
    were seeded with Farthest-Point Sampling (FPS).

    - Simple Multi-Start (ID 784): **2.9331613959581295**

    - Two-Stage Search (ID 766): **2.933161403384179**

    *Conclusion: The simpler, one-stage multi-start architecture is equally effective,
    rendering the two-stage framework redundant for an SLSQP core.*


    **3.2. Experiment 2: Seeding Strategy - FPS vs. Hexagonal Grid**

    We compared the performance of FPS and Hexagonal Grid seeding within both the
    simple multi-start and two-stage architectures.

    - Simple Multi-Start, FPS (ID 784): **2.9331613959581295**

    - Simple Multi-Start, Hex Grid (ID 785): **2.9199839136177532**

    - Two-Stage, FPS (ID 766): **2.933161403384179**

    - Two-Stage, Hex Grid (ID 789): **2.919983918812832**

    *Conclusion: FPS is a consistently superior seeding strategy for a broad multi-start
    search with an SLSQP core, yielding a significant improvement of ~0.013 over the
    Hexagonal Grid.*


    **3.3. Experiment 3: Analysis of Solution Stability**

    To test the rigidity of the ~2.933 optimum, we applied a fine-grained Affine Warp
    Search to the best-found solution.

    - **Method:** An Affine Warp Search applies a grid of small affine transformations
    (scaling and shearing) to the centers of a given packing. For each warped configuration,
    a high-precision finalizer recalculates the maximum possible radii. The best score
    found across all warps is the result.

    - **Result (ID 770):** The search found no improvement, yielding a final score
    of **2.933161403384179**.

    *Conclusion: The optimum found by the FPS-seeded SLSQP engine is locally rigid
    and robust against small global geometric deformations.*


    **4. Conclusion**

    The most effective, non-LP-based architecture for this problem is a simple, single-stage
    multi-start SLSQP engine seeded with Farthest-Point Sampling. This combination
    robustly achieves a score of ~2.933. The two-stage search framework is an unnecessary
    complication, and the Hexagonal Grid, while a strong single seed, is an inferior
    choice for a broad multi-start search. This work provides a clear, validated,
    and highly competitive benchmark for future research.'
