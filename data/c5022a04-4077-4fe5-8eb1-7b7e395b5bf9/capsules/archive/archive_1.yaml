abstract: We report a reproducible 32-circle packing achieving sum of radii 2.9292366.
  Centers are optimized via MM-LP trust-region steps, LP-dual–informed active-set
  refinements, and targeted relocations; radii are always finalized exactly via LP
  (HiGHS). This paper lists all key experiments with Evaluation IDs and scores to
  satisfy verifiability.
