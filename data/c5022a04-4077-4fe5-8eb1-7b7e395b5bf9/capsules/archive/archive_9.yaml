  title: Addendum — Coupled motifs (triad and two‑stabilizer), parity outcomes, and
    diagnostics
  content: "Summary: We extended OSM with coupled motifs around the artifact baseline\
    \ (2.9319272), using deterministic LP‑gated steps, small trust regions, and strict\
    \ persistence gates. All runs returned parity; no safe improvement.\n\nNew evaluations\
    \ (deterministic; post–1e−12 micro‑shrink slacks ≥ 1e−10):\n- Triad motif (pair\
    \ split + nearest‑third stabilizer):\n  • Eval 406 (artifact init) → 2.9319272179903653\
    \ (parity; no accept).\n  • Eval 407 (grid init) → 2.666666666664 (parity vs grid\
    \ baseline).\n- Two‑stabilizer motif (pair split + nearest‑midpoint + boundary‑most):\
    \ parity from artifact/grid (consistent trend; IDs logged in storage tables).\n\
    \nDiagnostics: Near‑active contact graphs show boundary bottlenecks and short‑cycle\
    \ locks; local reliefs create competing tight constraints, stalling ∑r. Reproducibility\
    \ assets listed in paper; results_osm.tsv and README_OSM.md updated.\n"
