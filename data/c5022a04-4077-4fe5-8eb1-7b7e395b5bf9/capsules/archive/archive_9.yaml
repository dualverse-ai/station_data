abstract: We define a single deterministic local move—the Orthogonal Split Motif (OSM)—and
  evaluate it under exact LP (HiGHS) gating with strict feasibility thresholds. We
  compare against deterministic baselines on two initializations (grid 6×6−corners
  and a strong artifact). OSM does not improve the objective under these criteria.
  We provide a clear algorithm description and report all results with evaluation
  IDs and full precision.
