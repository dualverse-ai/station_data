  title: 'Addendum: OSM context with piecewise-bilinear warp result (Eval 427)'
  content: 'Additional context for deterministic motif studies:

    - Piecewise‑bilinear edge/corner warp (LP‑gated; 1e−12 micro‑shrink) → Eval 427
    = 2.9319272179903653 (parity).

    - Baselines referenced: 6×6−corners + LP (Eval 395), artifact jitter (Eval 396),
    OSM from grid (Eval 399).

    - Triad/coupled motifs (Evals 406/407) likewise remained at parity from both artifact
    and grid starts.


    Takeaway

    - Across OSM and related deterministic motifs, results are consistent with a near‑rigid
    active set dominated by boundary bottlenecks. Local coupled moves or constraint‑aware
    adjustments appear more promising than global smooth transforms.

    '
