    Definitions, Methods, and Integrated Results'
  content: "1. Introduction\nCircle packing in the unit square seeks centers c_i=(x_i,y_i)\
    \ and radii r_i>0 for N=32 circles to maximize ∑ r_i subject to:\n  (i) In‑box:\
    \ r_i ≤ x_i, r_i ≤ 1−x_i, r_i ≤ y_i, r_i ≤ 1−y_i\n  (ii) Non‑overlap: r_i + r_j\
    \ ≤ ||c_i − c_j||_2 for all i<j.\nDespite recent progress via multi‑start LP‑gated\
    \ search, the landscape near the best packings appears locally rigid. This paper\
    \ asks: do principled first‑order moves or small, structured non‑local moves yield\
    \ measurable gains?\n\nContributions\n- Clear, self‑contained definitions for\
    \ all components we test.\n- A standardized verification pipeline (exact zero‑slack\
    \ radii LP + iterative zero‑tolerance finalize + accept‑if‑improve).\n- Integrated,\
    \ full‑precision results with evaluation IDs showing no strictly positive gains\
    \ near top packings.\n\n2. Methodology (definitions and common pipeline)\n\n2.1\
    \ Exact zero‑slack radii LP (verification at fixed centers)\nGiven centers C =\
    \ {(x_i,y_i)}:\n  maximize ∑_i r_i\n  subject to r_i ≥ R_min (R_min=1e−8),\n \
    \           r_i ≤ x_i, r_i ≤ 1−x_i, r_i ≤ y_i, r_i ≤ 1−y_i,\n            r_i +\
    \ r_j ≤ ||c_i − c_j||_2  ∀ i<j.\nWe solve this LP with HiGHS (SciPy linprog).\
    \ Equality at constraints is allowed.\n\n2.2 Finalize (iterative, zero‑tolerance)\n\
    After the LP we adjust r only if a true violation exists (pairs/boundaries), using\
    \ a small safety margin for pairs (pair_eps=5e−16) and R_min=1e−8. This never\
    \ adds positive slack and permits equality.\n\n2.3 Acceptance rule and precision\n\
    A candidate update is accepted iff exact LP + finalize yields ∑ r strictly larger\
    \ than baseline by > 5e−10 (guarding against float noise). We report full‑precision\
    \ sums.\n\n2.4 Baselines used\n- Independent SOTA (ours): 2.939572768266679 (ID\
    \ 574), matched by MMS‑LP v2 (ID 597 ≈ 2.9395727712062967) and DCPP (ID 609 ≈\
    \ 2.9395727712062967).\n- Storage‑best (for mid‑range ablations): 2.932012091998562\
    \ (typical).\n\n2.5 SCP‑LP center step (defined)\nLinearize non‑overlap at anchor\
    \ C^0. For each pair (i,j), let u_ij=(c_i^0−c_j^0)/||c_i^0−c_j^0||. The LP variables\
    \ are (x,y,r); objective maximize ∑ r subject to:\n  r_i − x_i ≤ 0,  r_i + x_i\
    \ ≤ 1\n  r_i − y_i ≤ 0,  r_i + y_i ≤ 1\n  r_i + r_j − u_x,ij(x_i − x_j) − u_y,ij(y_i\
    \ − y_j) ≤ d_ij^0 − u_ij·(c_i^0 − c_j^0)\n  x_i ∈ [x_i^0±τ]∩[0,1], y_i ∈ [y_i^0±τ]∩[0,1]\n\
    Then re‑evaluate with the exact radii LP + finalize. Accept‑if‑improve only.\n\
    \n2.6 Techniques audited (all deterministic; defined here before use)\n- LSS (Local\
    \ Sensitivity Spectrum): Estimate directional derivatives of ∑ r at C by finite\
    \ differences along many small, unit‑normalized directions in center space; then\
    \ try a tiny line search along the best estimated direction. Always re‑evaluate\
    \ with exact radii LP + finalize and accept only if improved.\n- EQ‑SCP‑LP: SCP‑LP\
    \ with an added equality tying one selected near‑contact pair to be tight in the\
    \ linearized model; re‑evaluate with exact LP + finalize and accept‑if‑improve.\n\
    - AS‑Pivot (Near‑contact pair pivot; a non‑local move): Choose k pairs with smallest\
    \ positive slack that are not currently active; for each, move the two centers\
    \ symmetrically in the perpendicular direction by a small step α (line‑searched),\
    \ then exact LP + finalize and accept‑if‑improve.\n- Scalarized single‑LP: In\
    \ one LP, maximize ∑ r − λ·||ΔC||_1 subject to SCP‑LP constraints and a trust\
    \ region, with λ=1e−6; then exact LP + finalize; accept‑if‑improve.\nControl methods\
    \ (for completeness):\n- Global affine micro‑warp: apply tiny rotations/scales/shears\
    \ to C, then exact LP + finalize.\n- KKT Option‑A (active‑set QP on linearized\
    \ constraints): step in the null‑space of an estimated active set with trust region/backtracking,\
    \ then exact LP + finalize.\n- CD‑TR micro‑refiner: conservative coordinate‑descent\
    \ with a trust region and exact LP gates.\n- Transfer tests: initialize from HEX\
    \ / FPS / random seeds and run short SCP‑LP loops to observe climb behavior.\n\
    \n3. Results (organized by method; all values full precision)\n\n3.1 Independent\
    \ SOTA reference (for context)\n- ID 574: 2.939572768266679\n- ID 597 (MMS‑LP\
    \ v2): 2.9395727712062967\n- ID 609 (DCPP): 2.9395727712062967\n\n3.2 LSS (Eval\
    \ 775; baseline context 2.932012091998562)\n- Best estimated slope ≈ −8.013770000000000e+00;\
    \ best s(h)=2.931931946549195; accepts=0.\n\n3.3 EQ‑SCP‑LP (Eval 803; enforce\
    \ one near‑contact equality in SCP‑LP; τ∈{0.02,0.015,0.01,0.006,0.004})\n- Exact\
    \ LP sums ≈ 2.932012092024872–2.932012092024910; accepts=0.\n\n3.4 AS‑Pivot (near‑contact\
    \ pair pivot; Eval 796)\n- Baseline 2.932012092024910; candidates from top near‑active\
    \ non‑contacts; accepts=0; final 2.932012092024910.\n\n3.5 Scalarized single‑LP\
    \ (Eval 788; λ=1e−6)\n- storage‑best 2.932012091998562; storage‑best‑jitter 2.932012092024910;\
    \ grid‑36minus4 2.898577376865817; accepts=0.\n\n3.6 Global affine micro‑warp\
    \ (Eval 636; around SOTA)\n- 243 tiny affine transforms tested; returned baseline\
    \ 2.9395727712063042.\n\n3.7 KKT Option‑A (active‑set QP; Eval 732; baseline context\
    \ 2.932012091998562)\n- Attempts accepted: 0; best sum 2.932012091998562 (no gain).\n\
    \n3.8 CD‑TR micro‑refiner (Eval 734; baseline context 2.932012091998562)\n- Attempts\
    \ accepted: 0; final 2.932012091998562.\n\n3.9 Transfer tests (short SCP‑LP loops)\n\
    - HEX→SCP‑LP (Eval 749): hex 2.465547964039957 → 2.919865472582548 (5 accepts);\
    \ hex‑jitter 2.424283481766276 → 2.927735660243330 (6).\n- FPS/Random→SCP‑LP (Eval\
    \ 758): fps 1.600249590300813 → 2.850938403010178 (5); random 1.421360048396682\
    \ → 2.861224117875957 (7); grid‑jitter 2.197567535811029 → 2.899905801623030 (6).\n\
    Interpretation: SCP‑LP climbs weak seeds rapidly but plateaus below 2.93 without\
    \ the full MM‑LP architecture.\n\n3.10 Auxiliary ablations (concise)\n- Weighted\
    \ SCP‑LP (IDs 718/719): storage‑best ≈2.932012091998562 for p∈{1.2,1.4,1.6,2.0},\
    \ K∈{3N,4N,8N,all}; jitter inferior except p=2 best ≈2.9320120916879.\n- K‑sweep\
    \ (active‑set size) earlier: K≥3N ≈ all‑pairs; ≤2N misses critical contacts.\n\
    \n4. Discussion\n- First‑order stiffness: Finite‑difference LSS shows strongly\
    \ negative slopes in random directions at tiny steps; equality‑constrained SCP‑LP\
    \ feasibly enforces near‑contacts in the linear model but the exact re‑solve yields\
    \ no net improvement.\n- Non‑local micro‑moves: Near‑contact pivots, global affine\
    \ warps, and conservative active‑set QP/CD‑TR refiners return to baseline under\
    \ strict accept‑if‑improve gates.\n- Scalarization vs lexicographic: ∑r − λ·||ΔC||_1\
    \ did not beat the two‑pass (maximize ∑r then minimize movement), consistent with\
    \ a sharply peaked objective near the optimum.\nPractical guidance: For LP‑gated\
    \ methods, zero‑slack modeling, exact radii LP, and zero‑tolerance finalize remain\
    \ robust defaults. Active‑set reductions should use K≥3N or all‑pairs; dual‑guided\
    \ selections are brittle from off‑manifold seeds.\n\n5. Conclusion\nUnder a common,\
    \ precise verification pipeline, we found no strictly positive gains from first‑order\
    \ or small non‑local moves around strong local optima up to SOTA 2.939572768266679.\
    \ This structured audit and its integrated results establish a rigorous negative‑result\
    \ baseline for future algorithms.\n\n6. Reproducibility and limitations\nDeterministic\
    \ code paths; fixed RNGs where used; HiGHS LP solver; finalize pair_eps=5e−16,\
    \ R_min=1e−8; accept‑if‑improve >5e−10. No external lineage artifacts imported.\
    \ The joint centers+radii feasible set is nonconvex; there is no exact SOCP for\
    \ the full problem. Further progress likely requires robust constrained Newton/SQP\
    \ or qualitatively different non‑local reorganizers.\n"
