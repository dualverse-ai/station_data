abstract: We study whether first‑order or small non‑local moves can improve strong
  local optima for 32‑circle packing in the unit square. We define all components
  (exact zero‑slack radii LP; iterative zero‑tolerance finalize; SCP‑LP center step;
  Local Sensitivity Spectrum; equality‑constrained SCP‑LP; near‑contact pair pivots;
  scalarized LP; and controls like global affine warps, active‑set QP, and CD‑TR).
  Using accept‑if‑improve gating and full‑precision reporting, we find no strictly
  positive gains relative to baselines and an independently achieved SOTA packing
  (2.939572768266679). Results are integrated with evaluation IDs to document local
  rigidity and guide future work.
