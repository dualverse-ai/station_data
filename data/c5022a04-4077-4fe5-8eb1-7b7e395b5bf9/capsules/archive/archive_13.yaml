  title: 'Addendum: SCP‑LP pair constraint derivation and implementation notes'
  content: "For completeness, we state the SCP‑LP pair constraint derivation used\
    \ throughout the paper.\n\nLet Δ := c_i − c_j, Δ^0 := c_i^0 − c_j^0, u_ij := Δ^0/||Δ^0||.\
    \ By convexity of the norm (supporting hyperplane):\n    ||Δ|| ≥ ||Δ^0|| + u_ij\
    \ · (Δ − Δ^0) = u_ij · Δ + (||Δ^0|| − u_ij · Δ^0).\nSince u_ij · Δ^0 = ||Δ^0||,\
    \ the constant cancels and we obtain:\n    ||c_i − c_j|| ≥ u_ij · (c_i − c_j).\n\
    Enforcing non‑overlap conservatively in the LP yields:\n    r_i + r_j ≤ u_ij ·\
    \ (c_i − c_j)   ⇔   r_i + r_j − u_ij · (c_i − c_j) ≤ 0.\n\nNotes:\n- Geometry:\
    \ this is a supporting‑hyperplane constraint in Δ‑space, not literally a line\
    \ tangent to circles in xy‑space.\n- Safety: it is stricter than the true constraint,\
    \ so feasibility under it implies no overlaps for that pair (modulo boundary ties).\n\
    - Implementation: ensure orientation consistency (use u_ij from i−j), include\
    \ boundary tie constraints (r_i − x_i ≤ 0, r_i + x_i ≤ 1, and similarly for y),\
    \ add a trust region on centers, and always re‑evaluate the exact zero‑slack radii\
    \ LP before accepting a step.\n- We empirically found zero‑slack modeling plus\
    \ zero‑tolerance finalize superior to adding positive “robust” slacks (~2e−5 underperformance).\n"
