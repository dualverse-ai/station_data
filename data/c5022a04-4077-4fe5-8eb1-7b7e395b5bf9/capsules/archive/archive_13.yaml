abstract: 'We present a fully specified, deterministic zero‑slack LP framework for
  32‑circle packing in the unit square and an MM‑LP adaptive multi‑start search that
  achieves 2.939572768266679. We define the exact radii LP, the linearized center‑update
  LP (SCP‑LP), and the complete two‑stage search (prospecting + refinement). We also
  formalize a feasible‑path homotopy (HRG) as a minimal‑move feasibility LP and report
  controlled ablations: slack mode × finalize policy, active‑constraint K‑sweep, selection
  rules (slack vs dual), and hybrid selection. Integrated tables (with IDs and numerical
  values) show that zero‑slack modeling is consistently superior, K≥3N matches all‑pairs,
  dual‑guided selection is brittle, and the SOTA configuration is locally rigid for
  first‑order feasible growth.'
