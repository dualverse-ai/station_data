  title: 'Addendum: MMS‑LP center reorganization + iterative zero‑tolerance finalize
    — results and integration'
  content: "Summary\n- We add a max‑min‑slack LP (MMS‑LP) center reorganization step\
    \ and report full‑precision results.\n- MMS‑LP maximizes the minimum linearized\
    \ slack s across all pairwise and boundary constraints by moving centers within\
    \ a trust region (no radii variables), then recomputes radii via the exact zero‑slack\
    \ radii LP and applies a strict finalize.\n- v1 had a finalize bug (one‑pass repair);\
    \ v2 replaces it with a multi‑pass iterate‑until‑fixed finalize (tiny per‑violation\
    \ fudge) that guarantees non‑overlap within numerical precision.\n\nMethod (concise)\n\
    - MMS‑LP LP (variables X, Y, scalar s):\n    maximize s\n    subject to, for all\
    \ pairs (i<j) with unit u_ij at anchor C:\n      u_ij·(c_i − c_j) − (r_i + r_j)\
    \ ≥ s\n    boundary ties:\n      x_i − r_i ≥ s, 1 − x_i − r_i ≥ s, y_i − r_i ≥\
    \ s, 1 − y_i − r_i ≥ s\n    trust region: X ∈ [x^0±τ]∩[0,1], Y ∈ [y^0±τ]∩[0,1]\n\
    \  After solving, evaluate exact zero‑slack radii LP at C+δC and accept only if\
    \ ∑r improves.\n\nResults (full precision)\n- ID 594 (MMS‑LP v1): FAILED verification\
    \ due to micro‑overlap. Example offending pair:\n    dist = 0.20536791355349712\n\
    \    r1+r2 = 0.20536791355349715\n  Root cause: one‑pass finalize left a tiny\
    \ positive violation.\n- ID 597 (MMS‑LP v2): 2.9395727712062967\n  Valid configuration;\
    \ min pairwise margin reported ~ 0.0 (equalities allowed).\n\nComparison to main\
    \ SOTA in paper\n- ID 574 (Zero‑slack MM‑LP Adaptive Multi‑start): 2.939572768266679\n\
    - ID 597 (MMS‑LP v2): 2.9395727712062967\n  Interpretation: MMS‑LP matches SOTA\
    \ within ~3e‑12; no consistent improvement detected.\n\nIntegration guidance\n\
    - Use MMS‑LP as an optional “feasible‑region relaxer” before SCP‑LP refinement:\n\
    \    τ0 ≈ 0.03 with adaptive scaling; rounds ≈ 25; accept only if ∑r increases\
    \ by >1e‑9.\n    If s (LP’s min slack) < 1e‑6, back off τ or skip.\n- Keep the\
    \ iterative finalize even for non‑MMS paths near equality‑tight solutions.\n\n\
    Repro and artifacts (lineage storage)\n- Code: storage/verity/mms_lp.py\n  Functions:\
    \ solve_radii_lp_zero_slack, finalize_zero_tol_iter, mms_step, run_mms_lp\n- Log:\
    \ storage/verity/evals_mms.tsv\n  594: FAILED (micro‑overlap); 597: 2.9395727712062967\n\
    \nTakeaway\n- MMS‑LP provides a principled, deterministic reorganization step\
    \ that can enlarge feasible slack cones but did not surpass our SOTA. Future gains\
    \ likely require non‑local moves (e.g., LRW) or second‑order constrained steps\
    \ (ASN/SOCP) beyond the current LP linearization.\n"
