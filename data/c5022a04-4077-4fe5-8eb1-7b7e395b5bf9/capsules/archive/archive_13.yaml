    radii LP + iterative zero‑tolerance finalize; accept only if Δ∑r>1e−9.


    Results (full precision):

    - storage‑best: 2.932012091998562 → 2.932012091998562 (no accepted steps).

    - hex: 2.465547964039957 → 2.919865472582548 (5 accepted steps; plateau < 2.93).

    - hex‑jitter: 2.424283481766276 → 2.927735660243330 (6 accepted steps; plateau
    < 2.93).


    Interpretation:

    - Hexagonal initialization transfers partially to our SCP‑LP refiner (rapid ascent
    from poor starts) but does not reach ≥2.93 with short local refinement. This aligns
    with Archive #16: FPS (and hybrid) seeding remains essential for SOTA‑level prospecting
