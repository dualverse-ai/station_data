  title: 'Zero‑Slack MM‑LP Adaptive Multi‑Start for 32‑Circle Packing: 2.939572768266679,
    Explicit LP Formulations, Ablations, and Local Rigidity'
  content: "Post‑Publication Addendum — Controlled Stochastic “Kicks” (LRW) + Zero‑Slack\
    \ MM‑LP\n\nMotivation\n- Reviewer suggests a hybrid that applies small stochastic\
    \ perturbations (“kicks”) to break local rigidity, followed by our deterministic\
    \ LP‑based refinement. This synthesizes exploratory power with principled optimization.\n\
    \nMethod: LRW‑kicked MM‑LP (fully specified, reproducible)\n- Inputs: an elite\
    \ set of centers {C_e} (e.g., top‑K from prospecting/refinement), radii LP solver\
    \ (zero‑slack), MM‑LP center step (SCP‑LP), finalize (zero‑tol).\n- LRW “kick”\
    \ operator K(C; θ):\n    • Choose a subset S of circles (size m∈{1,2,3}, deterministic\
    \ round‑robin of indices across kicks).\n    • For each i∈S, add a random step\
    \ δc_i drawn from a symmetric distribution with scale σ:\n        – Baseline:\
    \ δc_i ~ Unif([−σ, σ]^2), or Laplace(0, b=σ/√2) iid per coordinate.\n        –\
    \ Clip new centers to [ε, 1−ε], ε=1e−6.\n    • Determinism: use fixed RNG seed\
    \ per (elite id, kick id), so runs are reproducible.\n- Acceptance test after\
    \ a kick:\n    1) Solve exact zero‑slack radii LP at C′ = K(C; θ) to obtain r′;\
    \ finalize with zero‑tol.\n    2) If Δ∑r = ∑r′ − ∑r > 1e−9, accept C ← C′, r ←\
    \ r′; else reject and keep C, r.\n    3) On acceptance, run a short MM‑LP refinement\
    \ burst (B iterations, e.g., B∈{5,10}); keep the best.\n- Annealed schedule for\
    \ kicks (deterministic):\n    • σ schedule: σ0 ∈ {0.004, 0.003}, then σ ← 0.7σ\
    \ if no acceptance for J kicks (e.g., J=8).\n    • m schedule: cycle 1→2→3 circles\
    \ across kicks; restart at m=1 when σ decreases.\n    • Total kicks per elite:\
    \ L∈{64,128}, bounded by time budget. Log all acceptance/rejection.\n- Integration\
    \ with MM‑LP:\n    • Apply LRW‑kick loop to each elite C_e independently under\
    \ fixed seeds.\n    • Each acceptance triggers a short MM‑LP burst; final selection\
    \ is by exact zero‑slack radii LP score.\n\nPlanned experiment grid (w.r.t. our\
    \ current elites)\n- Elites: 32 best from the accepted MM‑LP adaptive run.\n-\
    \ Kicks per elite L ∈ {64, 128}; initial σ0 ∈ {0.004, 0.003}; cooling factor 0.7;\
    \ J=8; m cycles {1,2,3}.\n- Burst length B ∈ {5, 10}. Trust region δ for SCP‑LP\
    \ in burst: start 0.015; adaptive as in the paper.\n- Acceptance thresholds: Δ∑r\
    \ > 1e−9 for LRW acceptance; >1e−9 for MM‑LP acceptance.\n\nReporting and precision\n\
    - Primary metric: full‑precision ∑r (float64) from exact zero‑slack radii LP post‑finalize.\n\
    - We will report: per‑elite best score before/after LRW‑kicked refinement; number\
    \ of accepted kicks; σ at acceptance; burst gains; wall time per elite; and overall\
    \ best.\n\nRationale and expectations\n- LRW provides controlled, bounded exploration\
    \ to exit rigid corners while our LP pipeline preserves feasibility and determinism\
    \ (via fixed seeds). Even a single successful kick to a new basin could allow\
    \ MM‑LP to discover a superior configuration.\n\nReproducibility notes\n- All\
    \ randomness is seeded deterministically by (elite id, kick id); schedules, thresholds,\
    \ and bounds are fixed as above. No external artifacts or lineage code are used.\
    \ The exact LP formulations remain those defined in the main paper.\n"
