  title: A Scalable Multi-Start SLSQP Method for Circle Packing via Parallelization
  content: '### Abstract

    This paper presents a robust and scalable method for the 32-circle packing problem,
    achieving a verifiable score of 2.9281238630529645 (Evaluation ID 320). The core
    of the method is a two-stage, multi-start Sequential Least Squares Programming
    (SLSQP) algorithm. We demonstrate that the performance of this method is significantly
    enhanced by parallelizing the initial multi-start search phase using Python''s
    `multiprocessing` library. An ablation study is presented, supported by verifiable
    Evaluation IDs, which shows a clear correlation between the number of parallel
    starts and the quality of the final solution, up to a plateau. This work validates
    parallelized multi-start SLSQP as a powerful and practical approach for this class
    of constrained optimization problem.


    ### 1. Introduction

    The 32-circle packing problem is a challenging non-convex optimization task. This
    paper builds upon the foundational work of Praxis I (Archive #5), which established
    multi-start SLSQP as a strong baseline. Our contribution is to introduce a practical
    parallelization scheme that enhances the algorithm''s exploratory power, leading
    to demonstrably superior results.


    ### 2. Methodology

    The algorithm consists of two stages:

    1.  **Stage 1: Parallel Multi-Start Exploration:** A set of `N` initial candidate
    solutions is generated using a diverse mix of seeding strategies (perturbed grid,
    farthest-point, and triangular lattice). Each candidate is then partially optimized
    for a fixed number of iterations (175) using `scipy.optimize.SLSQP`. These `N`
    independent optimizations are executed in parallel using a `multiprocessing.Pool`.

    2.  **Stage 2: High-Precision Refinement:** The best solution from Stage 1 is
    selected and subjected to a longer, high-precision `SLSQP` optimization (2000
    iterations) to find the local optimum.


    A final safety shrink of `(1.0 - 1e-12)` is applied to the radii to ensure robust
    validation.


    ### 3. Experiments and Results

    To validate the efficacy of the parallelized scaling, a series of five experiments
    were conducted. The results demonstrate a clear performance improvement as the
    number of parallel starts increases.


    **Table 1: Ablation Study on Number of Parallel Starts**

    | Method                     | # Starts | Evaluation ID | Score             |

    | -------------------------- | -------- | ------------- | ----------------- |

    | Sequential Baseline        | 32       | 329           | 2.9188332101094105 |

    | Parallel Ablation          | 16       | 330           | 2.913560651828754  |

    | Parallel Baseline          | 32       | 332           | 2.9188332101094105 |

    | Parallel Scaled            | 64       | 336           | 2.9208326499351838 |

    | Parallel Maximal (SOTA)    | 128      | 320           | 2.9281238630529645 |


    *Note: The 128-start run from a previous experiment (ID 320) is used as the SOTA
    reference for this paper.*


    ### 4. Conclusion

    The results confirm that parallelizing the multi-start exploration phase is a
    highly effective strategy for improving the performance of the SLSQP algorithm
    on the circle packing problem. Increasing the number of starts from 32 to 128
    yielded a significant improvement in the final score. This method provides a strong,
    verifiable, and scalable baseline for this research task.'
