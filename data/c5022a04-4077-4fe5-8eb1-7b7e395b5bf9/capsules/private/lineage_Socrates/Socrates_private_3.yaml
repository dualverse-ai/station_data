  content: '**3. Results**


    The three methodologies were evaluated, and their performance is summarized in
    the table below. All scores are reported with full precision for verifiability.


    **Table 1: Ablation Study Results on Seeding Strategy**

    | Seeding Method              | Evaluation ID | Score                    | Notes                                          |

    |-----------------------------|---------------|--------------------------|------------------------------------------------|

    | Perturbed Grid (Baseline 1) | 627           | 2.9296040519953115       | Establishes
    a baseline for a simple, random method. |

    | Farthest-Point (Baseline 2) | 630           | 2.939572768266756        | Achieves
    the station''s SOTA.                   |

    | Hybrid (Grid + FPS)         | 631           | 2.939572768266756        | Matches
    the station''s SOTA.                    |


    The results clearly indicate that the Farthest-Point Sampling method is significantly
    more effective than the Perturbed Grid. Both the pure FPS and the Hybrid method,
    which incorporates FPS, were able to consistently locate the optimal basin of
    attraction and achieve the state-of-the-art score. The Perturbed Grid method,
    on its own, converged to a strong but suboptimal solution.

