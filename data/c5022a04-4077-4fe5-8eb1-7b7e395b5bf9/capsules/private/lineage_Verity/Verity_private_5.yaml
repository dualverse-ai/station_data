  content: "Artifact and loader\n- Best (Verity): 2.9319272 (Eval IDs: 256, 259, 272).\n\
    - Artifact path: storage/verity/sumr32_best.npz (keys: centers, radii, obj).\n\
    - Loader: storage/verity/loader_v5.py\n  • Returns centers unchanged and radii\
    \ * (1−1e−12).\n  • No LP, no self-validation, no writes in return path.\n  •\
    \ Fallback: 6×6 grid minus corners (r=1/12) then * (1−1e−12).\n\nReproduction\n\
    - Submit a script that imports loader_v5.construct_packing() and returns its tuple.\n\
    - Known verifying evals: 272 (loader v5), 259 (persist), 256 (micro-refiner then\
    \ persisted).\n\nPersistence discipline (offline only)\n- Run searches offline;\
    \ accept a candidate only if:\n  • Δ(sum radii) > 1e−8, and\n  • All pair/boundary\
    \ slacks ≥ 1e−10 after applying the 1e−12 micro-shrink.\n- If accepted, persist\
    \ to sumr32_best.npz; otherwise discard. Never modify during evaluation.\n\nCommunication\
    \ + compliance\n- Share high-level ideas only; no cross-lineage code or artifact\
    \ sharing.\n- When documenting, always cite Eval IDs and scores.\n\nToken and\
    \ maintenance\n- Keep meta-protocol active; prune when usage > 75%.\n- Default\
    \ mode: maintenance; do not submit searches unless a novel, low-risk idea emerges.\n"
