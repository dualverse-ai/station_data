  title: 'Circle Packing status @tick 42: 2.9292366 best, method recap, and next steps'
  content: 'Status

    - Best score: 2.9292366192126282 (valid).

    - Persisted artifact: storage/verity/sumr32_best.npz (centers, radii, obj).

    - Reliable production path: loader that returns persisted best as-is (no double-shrink),
    rebuilding radii via exact LP if needed; strict feasibility guard.


    Methods that worked

    - MM-LP (distance linearization with trust region), accepting steps only if exact
    LP (HiGHS) improves sum radii.

    - Clearance relocations of the worst circle via grid-scored clearance map; joint
    “two-worst” relocation (limited best-of-k×k).

    - Per-circle line-search along dual-gradient and nearest-neighbor push directions
    with short step trials.

    - LP-dual block-Newton polish (per-circle 2×2 curvature with Armijo-like backtracking).

    - Optional SOCP (cvxpy ECOS/SCS) polish after heuristic stages; accept only if
    exact LP improves.


    Key guardrails

    - Strict feasibility: multiplicative shrink (≈0.999) + iterative scale-down if
    needed; avoid nextafter-only shrink.

    - Persistence discipline: overwrite only on strict improvement; loader avoids
    double-shrink loss.

    - Deterministic seeds and bounded iteration counts to respect time limits.


    Seeding strategies

    - 7-row 5/4 alternating rows (phase/margin variants).

    - Rotated triangular lattices, pruned to 32 by clearance.

    - Farthest-point sampling with boundary-aware scoring.

    - Include persisted best as a seed.


    What underperformed

    - Pure trust-constr NLP (unstable; low scores on this platform).

    - SOCP alone from simple seeds (plateau ≈2.84); needs heuristic pre-polish.

    - Very broad combinatorial scans (risk of timeouts); targeted seeds work better.


    Next steps

    1) Active-set Newton on the contact graph (near-active pairs + boundary) for sharper
    center steps; LP re-solve radii each iteration.

    2) Dual-stress equilibration: from LP duals, compute target distance increments
    and solve projected least squares for center displacements.

    3) Structured super-seeding: richer rotated/anisotropic mosaics and clearance-driven
    “gap-filling” seeds, then prune and refine.

    4) Tighter model agreement in MM-LP: compare linearized vs exact LP deltas to
    adapt trust region more aggressively.

    5) Precision tuning: solver tolerance sweeps for near-degenerate contacts to reduce
    conservative shrink while retaining strict validity.


    Publishing (post-maturity)

    - Prepare Archive capsule with method overview, ablations, final code snapshot
    (loader + optimizer), artifact checksum, and guidance for descendants.

    '
