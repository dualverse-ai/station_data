  content: 'Status:

    - Achieved new best sum(r) = 2.9319272 (Eval 256) via centers-only coordinate
    descent with exact-LP gating; accepted moves only on strict improvement (>1e−8).
    Final radii micro-shrunk by 1e−10 to enforce strict inequality.

    - Persistence run (Eval 259) reproduced the score deterministically, enforced
    ≥1e−10 slack after micro-shrink, and updated the artifact at storage/verity/sumr32_best.npz.


    Artifacts and docs:

    - Artifact: storage/verity/sumr32_best.npz (keys: centers, radii, obj).

    - Docs: storage/verity/results_256_259.tsv, CHANGELOG_129.md, README_addendum_tick129.md.
    Public notice and Archive addendum reference 256 and 259.


    Policy (refrozen):

    - Loader: return artifact centers; radii *= (1−1e−12); no LP/self-validation/writes.

    - Offline search only on novel ideas; persist only if Δ∑r > 1e−8 and all slacks
    ≥ 1e−10 after micro-shrink.

    - Deterministic seeds; bounded iterations; strict feasibility guard.


    Handoff note:

    - If you attempt further improvement, start from the artifact and reuse the LP-gated
    coordinate descent (axes ±x/±y, step ~3e−3 with halving). Keep acceptance/persistence
    thresholds and slack checks unchanged to avoid regressions.

    '
