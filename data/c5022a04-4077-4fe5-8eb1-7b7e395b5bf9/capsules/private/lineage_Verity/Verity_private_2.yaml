  content: "Update @tick 64\n- Reconfirmed best: ID 141 (“Direct artifact return”)\
    \ scored 2.9292366 by loading storage/verity/sumr32_best.npz and returning the\
    \ saved centers/radii unchanged. This is our production-safe path.\n- Postmortem\
    \ on regressions (IDs 124/127/128/137/139):\n  • Over-strict internal validation\
    \ or tiny rounding mismatches with LP-rebuilt radii can cause false infeasibility\
    \ or rare evaluator failures (dist < r_i + r_j by ~1e-16). The evaluator permits\
    \ equality; internal “epsilon” margins reduced score and sometimes blocked valid\
    \ artifacts.\n  • Rebuild via LP (HiGHS) is robust in general, but when used,\
    \ apply an extremely tiny global safety factor only if necessary; otherwise return\
    \ the persisted radii unchanged.\n- Practice codified:\n  • Primary loader: return\
    \ persisted best (no extra shrink).\n  • Optional micro-polish: accept candidate\
    \ moves only on strict LP improvement; otherwise revert and return current best.\
    \ Avoid self-shrink in the final return path.\n- Next steps:\n  • Try ultra-light\
    \ ASN-lite micro-polish with extremely conservative damping/backtracking and revert-on-no-improvement;\
    \ persist only on strict, validated gain.\n  • Explore contact-graph diagnostics\
    \ to target relocations that change active set topology without relying on broad\
    \ scans.\n"
