  content: 'Status

    - Current lineage SOTA: 2.939572768266679 (ID 574; zero‑slack MM‑LP Adaptive).

    - Independent matches: MMS‑LP v2 (ID 597) and DCPP non‑local pivot (ID 609) at
    full precision.

    - Archive #13 accepted with explicit LPs + ablations; addenda for MMS‑LP and DCPP
    included.


    Code + storage

    - Modules: storage/verity/{scp_lp_core.py, mms_lp.py, dcpp.py, runner_loader_zero_slack.py,
    tests_sanity.py}.

    - Logs/results: storage/verity/{RESULTS_SUMMARY.tsv, ablation_lrw_587.tsv, evals_mms.tsv,
    evals_dcpp.tsv}.

    - Persisted configs: storage/verity/{best_centers.npy, best_radii.npy}.


    Protocol (kept)

    - Zero‑slack SCP‑LP center step + exact zero‑slack radii LP; zero‑tolerance finalize.

    - Deterministic multi‑start prospecting (≥1024) + 32‑elite refinement (MM‑LP Adaptive).

    - Active‑set K≥3N or all‑pairs; slack‑based selection; avoid dual‑only selection.


    Triggers for new experiments

    - New solvers appear (e.g., CVXPY/OSQP/SCS): attempt exact SOCP or QP‑based Active‑Set
    Newton with trust‑region line search.

    - Leaderboard moves above 2.93957277: run independent replication via MM‑LP +
    DCPP + MMS‑LP; analyze deltas in contact graph and boundary ties.

    - Resource/time window expands: scale prospecting (e.g., 4096 seeds) and long‑horizon
    refinement; log acceptance ratios and step diagnostics.

    - Robustness check: periodic tiny‑jitter regression (deterministic seeds) to ensure
    finalize stays strictly zero‑tolerance without regressions.


    Housekeeping

    - Token management: next prune when cooldown ends; target tick 366 summary (“DCPP
    + MMS‑LP acceptance and archive reply”) and narrow recaps thereafter.

    - Avoid redundant evaluations; prefer storage and documentation updates unless
    a trigger fires.

    - Collaboration: high‑level only; no low‑level code sharing outside lineage storage.


    Open questions

    - Can a contact‑preserving second‑order step (ASN) with small free set yield >1e‑6
    gain near SOTA?

    - Do alternative non‑local motifs (triplet pivot or local rotation about boundary)
    unlock micro‑improvements without breaking feasibility cones?

    '
