  title: 'ASN (small free-set) plan: contact-preserving second-order step near SOTA'
  content: "Goal: Explore curvature-aware steps beyond SCP-LP/MM-LP by solving a small\
    \ free-set Active-Set Newton (ASN) step on centers that preserves active contacts\
    \ while allowing limited motion to improve the exact radii LP.\n\nSetup\n- Fix\
    \ N=32 centers C and exact zero-slack radii r* from the radii LP.\n- Identify\
    \ active set A consisting of:\n    * Pairwise contacts: r_i + r_j = ||c_i - c_j||\
    \ (within 1e-12 tolerance)\n    * Boundary ties: r_i = min(x_i, 1-x_i, y_i, 1-y_i)\
    \ (within 1e-12)\n- Choose a small free set F of circles (|F| ∈ {3,4,5}). Non-free\
    \ circles are constrained to move only along directions consistent with maintaining\
    \ their active equalities (or set to zero displacement).\n\nModel (centers-only\
    \ step; radii re-solved after step)\n- Variables: δC ∈ R^{2N}. Impose linearized\
    \ equalities for active constraints at first order:\n    For (i,j)∈A_pair: u_ij\
    \ · (δc_i − δc_j) = 0 (stay on the contact manifold to first order),\n    where\
    \ u_ij = (c_i − c_j)/||c_i − c_j||.\n    For boundary ties on i: s_b(i) · δc_i\
    \ = 0, s_b(i) ∈ {(+1,0),(−1,0),(0,+1),(0,−1)} depending on the binding boundary.\n\
    - Trust region: ||δC||_∞ ≤ τ (e.g., τ ∈ [0.002, 0.02]).\n- Objective (Gauss-Newton\
    \ heuristic): ascend a proxy for ∑r by using gradients from exact radii LP sensitivities\
    \ if available; otherwise use slack-based surrogate g_i that encourages expansion\
    \ where boundary slack decreases least under motion. Practical stand-in:\n   \
    \ minimize ||W^{1/2}(A δC)||^2 − λ d^T δC\n    where A δC encodes the linearized\
    \ equalities (penalty form with large weight W), d is a direction that increases\
    \ the minimum pairwise projection along u_ij for contacts involving F (λ small).\n\
    \  Solve as a small KKT/least-squares system restricted to F with constraints\
    \ on non-F via A δC = 0.\n\nProcedure\n1) Build active set A and candidate free\
    \ sets F (deterministic selection: top slack-adjacent contacts around a focal\
    \ circle).\n2) For each F, form linear system for δC under constraints; solve\
    \ via QR/SVD (regularize if needed).\n3) Backtracking line search on α ∈ {1.0,\
    \ 0.7, 0.5, 0.3, 0.2}; propose C' = C + α δC (clip to box [0,1]^2).\n4) Re-solve\
    \ exact zero-slack radii LP at C'; zero-tolerance finalize; accept if ∑r improves\
    \ by >1e-9.\n5) Iterate a small number of accepted steps (≤5) or until no gains.\n\
    \nDeterminism & Safety\n- Deterministic selection of F and ordering; fixed τ schedule\
    \ and α grid.\n- If the linear system is ill-conditioned, skip F.\n- Always verify\
    \ with exact radii LP; reject steps not improving ∑r.\n\nTrigger to implement\n\
    - If solver support for small QP/LS is stable (SciPy/Numpy QR/SVD suffice), implement\
    \ ASN prototype as storage module and test against our SOTA seed; else defer.\n\
    \nSuccess criteria\n- Any reproducible >1e-6 improvement over 2.93957277… or robust\
    \ equal match with clearer ascent diagnostics.\n"
