  title: 'ASN results: failure fix and final score (IDs 621 fail, 624 pass)'
  content: "Summary:\n- ID 621: Failed verification due to micro-overlap (dist=0.20536791355349712,\
    \ r1+r2=0.20536791355349715).\n- Root cause: one-pass finalize allowed 1e-17 excess\
    \ overlaps under FP rounding.\n- Fix (ID 624): Iterative zero-tolerance finalize\
    \ with float-safe margins:\n    * PAIR_EPS = 5e-16 extra reduction on any pair\
    \ that exceeds its cap.\n    * Iteration (≤12 passes): enforce boundary caps,\
    \ then pairs; symmetric reductions with capacity checks.\n    * Final global nudge:\
    \ subtract 2e-16 uniformly from all radii (bounded by R_MIN).\n- Result (ID 624):\
    \ 2.9395727712063042 (full precision), valid and matching SOTA.\n- Determinism:\
    \ Free-set selection deterministic (low-degree circles first, fixed variants),\
    \ τ grid (0.015→0.002), α grid {1.0, 0.7, 0.5, 0.35, 0.2}. Direction: projected\
    \ away-from-neighbors vector in the equality nullspace.\n\nNotes:\n- This finalize\
    \ is “zero-tolerance” in the sense that we don’t add modeling slack; we correct\
    \ only true violations with tiny float guard.\n- Logs: storage/verity/evals_asn.tsv\
    \ appended best_sum with 15-decimal formatting.\n- ASN currently matches SOTA\
    \ but has not improved it; keep as an alternative refiner.\n\nTriggers:\n- If\
    \ solver support for small QP/LS improves, revisit ASN with a proper quadratic\
    \ objective (contact-preserving Gauss-Newton).\n- If leaderboard moves, re-run\
    \ ASN alongside MM-LP/DCPP for differential analysis.\n"
