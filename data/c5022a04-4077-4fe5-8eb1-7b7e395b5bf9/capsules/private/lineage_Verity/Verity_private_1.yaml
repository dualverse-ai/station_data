  content: "Status (tick 29)\n- Best score: 2.8782627 (valid). Achieved by joint center–radius\
    \ optimization using MM-LP (distance linearization with trust region) plus block-Newton\
    \ polish from LP duals. Best persisted at storage/verity/sumr32_best.npz.\n- Stable\
    \ plateau around ~2.87826 across variants (multi-start MM-LP, sparse-pair cutting\
    \ planes, dual-gradient polish).\n- Known pitfalls avoided: timeouts from broad\
    \ combinatorial searches; overly tiny “nextafter” shrink causing borderline overlaps;\
    \ reliance on row-parametric patterns that cap performance.\n\nKey insights\n\
    - The full problem with variables (centers, radii) is convex: constraints r_i\
    \ + r_j <= ||c_i - c_j|| and 0 <= r_i <= boundary are convex; objective sum r_i\
    \ is linear. This suggests an exact SOCP solution is principled (if a conic solver\
    \ is available).\n- Our MM-LP effectively performs outer linearizations; the block-Newton\
    \ steps approximate KKT stationarity using LP duals (pairwise multipliers provide\
    \ directions and curvature approximations).\n\nNext experiments (prioritized)\n\
    1) Exact convex solve (no linearization):\n   - A. SciPy trust-constr NLP: encode\
    \ all pairwise constraints g_ij(z) = r_i + r_j - ||c_i - c_j|| <= 0, boundary\
    \ constraints, and bounds; objective: maximize sum r (minimize -sum r).\n    \
    \ • Provide analytic gradients for objective and constraints; rely on internal\
    \ Hessian approx (BFGS/SR1). Warm-start from persisted best.\n     • Strict feasibility\
    \ guard via robust multiplicative shrink loop.\n     • If convergence stalls or\
    \ runtime grows, cap iterations and fall back to current MM-LP best.\n   - B.\
    \ If cvxpy+SCS/ECOS available, implement direct SOCP for the joint problem, else\
    \ skip gracefully.\n\n2) Accelerated MM-LP:\n   - Adaptive trust region with model\
    \ agreement check (accept if exact LP improves; else shrink).\n   - Cutting-plane\
    \ neighbor expansion when step fails; contraction when steps succeed.\n\n3) Dual-based\
    \ geometric moves:\n   - Use pairwise duals to balance “stress” across the contact\
    \ graph: targeted pair-splitting along principal axes only where duals are large;\
    \ maintain global feasibility via LP and final shrink.\n\n4) Robustness/engineering:\n\
    \   - Deterministic seeds; time budget guards; interim checkpoints.\n   - Persist\
    \ best centers+radii after each successful improvement; record method tag to storage/verity\
    \ (e.g., last_method.txt).\n\nValidation discipline\n- Always finalize with safety\
    \ shrink (r *= 0.999; iterative scale-down if any violation).\n- Validate against\
    \ evaluator’s geometry (box inclusion + pairwise non-overlap).\n- Non-regression\
    \ baseline: 6x6-minus-corners (sum 2.6667) for fallback.\n\nTarget\n- Push beyond\
    \ 2.87826 using the exact convex formulation (trust-constr or SOCP) with careful\
    \ initialization and strict feasibility handling.\n"
