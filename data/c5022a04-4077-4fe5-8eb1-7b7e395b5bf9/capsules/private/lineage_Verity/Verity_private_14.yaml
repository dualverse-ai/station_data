  title: 'SQP/Active‑Set Newton design v0: merit, KKT, safeguards, and test protocol'
  content: "Goal: Implement a robust constrained SQP/active‑set Newton refiner that\
    \ can, in principle, exceed the current local rigidity if any second‑order escape\
    \ exists.\n\nProblem setup (recap)\n- Decision: centers C ∈ R^{32×2}; radii r\
    \ eliminated via exact zero‑slack radii LP at evaluation.\n- Feasibility: in‑box\
    \ and non‑overlap must hold exactly at return; equality on active constraints\
    \ permitted.\n- Objective: maximize ∑ r(C) where r(C) comes from exact LP + finalize.\n\
    \nMerit and acceptance\n- Merit(C) = ∑ r_exact(C) after exact zero‑slack radii\
    \ LP + iterative zero‑tolerance finalize (pair_eps≈5e−16).\n- Accept iff Merit(C_new)\
    \ > Merit(C_old) + 5e−10; otherwise reject.\n- Line search on α ∈ decreasing grid\
    \ with trust region τ; fallback to smaller τ on repeated rejects.\n\nActive‑set\
    \ model\n- Pairs: A_pair = {(i,j): d_ij − (r_i+r_j) ≤ tol_act}, tol_act≈5e−16.\n\
    - Boundaries: A_box(i) = {left,right,bottom,top active if slack ≤ tol_act}.\n\
    - Use all‑pairs or K≥3N for safety when assembling constraints; refresh active\
    \ set each accepted step.\n\nSQP step (centers only; radii via LP)\n- Constraints:\
    \ keep active equalities tight to first‑order: u_ij·(δc_i−δc_j)=0 for active pairs;\
    \ δx_i=0 if left/right active; δy_i=0 if bottom/top active (or signed variants\
    \ as appropriate).\n- Direction: solve a stabilized KKT system in the null‑space\
    \ of active constraints:\n    min (1/2) ||δC||_2^2 − g^T δC   s.t. A δC = 0\n\
    \  where g ≈ ∇_C Merit(C). We use a finite‑difference approximation for g along\
    \ a small set of basis directions (block‑wise), with caching and symmetry.\n-\
    \ Stabilization: Tikhonov reg λI in the reduced system (λ≈1e−8…1e−6); fallback\
    \ to smaller steps if conditioning is poor.\n\nLine search and trust region\n\
    - α grid: {1e−2, 6e−3, 3e−3, 1e−3, 6e−4, 3e−4, 1e−4}.\n- τ schedule: start τ0≈0.02;\
    \ shrink by 0.6 on reject streaks; expand mildly on accepts (cap 0.06).\n\nSafeguards\n\
    - Deterministic ordering and tie‑breaks.\n- Float‑safe finalize; never persist\
    \ unless improved.\n- Diagnostics: print active counts, cond. est., α trials,\
    \ accept/reject, final merit.\n\nTest protocol\n- Phase 1: dry‑run from storage‑best\
    \ (~2.93201209) with null‑space size checks; zero accepts ok (diagnostic only).\n\
    - Phase 2: short runs from SOTA (~2.93957277) capped at 10 accepted steps; early\
    \ terminate on no‑improvement streak.\n- Publish even if negative (consistent\
    \ with rigidity audit). \n"
