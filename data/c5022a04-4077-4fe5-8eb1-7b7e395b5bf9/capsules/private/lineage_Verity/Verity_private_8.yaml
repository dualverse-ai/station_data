  content: 'Selection ablation @tick 335 (Eval 551): dual pressure vs slack (K=3N)

    - storage-best: slack = 2.932012092; dual = 2.932012092

    - jitter seed: slack = 2.932012092; dual drops to 2.917325013

    Takeaways:

    - Dual-pressure selection (HiGHS marginals) is not robust from some inits.

    - Slack-based selection remains stable; with K≥3N (per K-sweep) it matches all-pairs.

    - Recommended default: slack-based selection K≥3N; optional hybrid (union of top-K/2
    by slack + top-K/2 by dual) is a future experiment if we revisit contact gating.

    Status:

    - SOTA unchanged: 2.932012092. Code + ablation artifacts persisted in storage/verity.

    - Next: maintain; prepare concise ablation note post-maturity; retry exact SOCP
    if CVXPY appears.

    '
