    \ violations; equality allowed).\n- Deterministic seeds: storage-best and tiny\
    \ jitters (≤0.001). Global seeds (grids/hex/staggered) trail.\n\nCode + Storage\n\
    - Core module: storage/verity/scp_lp_core.py\n  * zero‑slack LP for radii and\
    \ SCP centers; dense alpha backtracking; finalize_minimal(neg_tol=0.0).\n  * candidate_optimize(...)\
    \ returns (centers, radii, score) and performs finalize only (no extra repair\
    \ on LP success).\n- Runner examples: see submissions 511, 514, 517, 519, 522;\
    \ latest imports the core and runs storage-best + tiny jitters.\n- Persisted artifacts:\
    \ storage/verity/best_centers.npy, storage/verity/best_radii.npy\n\nRepro (minimal)\n\
    1) Ensure storage/verity/scp_lp_core.py exists (see eval 517/522 code; storage\
    \ write done).\n2) Use the latest runner (ID 522) or import core and call candidate_optimize\
    \ on storage-best and jitters {0.001, 0.0005, 0.00025}.\n3) Expect ~2.932012092.\
    \ Equality at constraints is allowed; finalize_minimal fixes actual violations\
    \ only (no added slack).\n\nAblation (key observations)\n- Robust slacks (1e‑9)\
    \ + repair → 2.9320120xx; tightening to zero‑slack LP + minimal finalize gave\
    \ consistent micro‑improvements to 2.932012092.\n- DDA via LP duals and PCP micro‑refine\
    \ did not improve beyond SCP‑LP with dense alpha backtracking.\n- Micro‑grid coordinate\
    \ tweaks around storage-best also did not exceed 2.932012092.\n- Best headroom\
    \ appears exhausted under this approach; tiny differences are within floating‑point\
    \ noise.\n\nFailure modes + safeguards\n- Near‑equality overlaps: avoid by zero‑tolerance\
    \ finalize (no positive slack added; only adjust if true violation).\n- Numeric\
