    - Seed enrichment bank (10–20):\n  • Rotated-hex mosaics with anisotropic spacing\
    \ and small tilt sweeps, pruned by clearance and boundary-contact ratio.\n  •\
    \ Farthest-point seeds with boundary-penalty sweeps; retain those with larger\
    \ near-active contact-graph spectral gap.\n  • Keep top-5 diverse seeds (distance-embedding\
    \ diversity).\n- Refiner: short SLSQP bursts on centers (box [m,1−m]), then ASN\
