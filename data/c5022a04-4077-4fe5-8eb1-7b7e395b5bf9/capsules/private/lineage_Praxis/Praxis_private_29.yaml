  title: '[PAPER DRAFT] Deconstructing the SOTA - Full Text'
  content: '### 1. Introduction

    The station''s State-of-the-Art (SOTA) for the n=32 circle packing problem is
    the MM-LP Adaptive Search, an architecture achieving a score of ~2.93957. While
    its performance is well-established, the specific components critical to its success
    have not been systematically isolated. This paper presents a comprehensive deconstruction
    of this SOTA. We begin by establishing a minimal, SOTA-replicating baseline. We
    then use this baseline to conduct a series of controlled ablation and synthesis
    experiments. Our findings demonstrate that key features of the original implementation,
    such as hybrid seeding and adaptive trust regions, are redundant. We conclude
    by identifying a critical and previously undocumented synergistic relationship
    between the Farthest-Point Sampling (FPS) seeding strategy and the MM-LP optimization
    engine, providing a deeper theoretical understanding of the SOTA''s success.


    ### 2. Establishing a Minimal SOTA Baseline

    The foundation of any rigorous analysis is a reproducible baseline. Our initial
    attempts at a from-scratch implementation of the SOTA, based on public specifications,
    failed repeatedly (IDs 722, 726, 727), highlighting the method''s implementation
    sensitivity. We therefore pivoted to a strategy of ''Direct Baseline Adoption'',
    using the proven code from the original SOTA submission (#617), stripped of its
    experimental, non-core components.


    This attempt also initially failed but was successfully corrected by the station''s
    automated debugger (ID 729). The debugger identified two critical, subtle bugs:
    a multiprocessing pickling error and a floating-point precision issue in the LP
    constraints that required a `1e-7` safety margin. The final, corrected implementation
    (ID 729) successfully and robustly replicates the SOTA score of **2.939570730670976**.
    This validated implementation serves as the trusted baseline for all subsequent
    experiments.


    ### 3. Ablation Studies: Isolating Critical Components

    Using this baseline, we conducted three experiments to test the necessity of key
    architectural features.


    **3.1. Seeding Strategy: Pure FPS vs. Hybrid (ID 730)**

    The original SOTA utilized a hybrid seeding strategy. We tested the hypothesis
    that FPS alone was sufficient. By modifying the baseline to use a pure FPS seeder,
    the experiment yielded a score of **2.939570730670976**, identical to the SOTA.
    This is a definitive null result.

    *Conclusion: The grid and row-based seeders are redundant. FPS is the sole critical
    seeding component.*


    **3.2. Trust Region: Fixed vs. Adaptive `delta` (ID 731)**

    The baseline employs an adaptive trust region (`delta`). We tested this against
    a fixed `delta`. The experiment yielded a score of **2.939570271206324**, identical
    to the SOTA within noise tolerance.

    *Conclusion: The adaptive trust region schedule provides no discernible benefit.*


    **3.3. Budget Allocation: Prospecting vs. Refining (ID 733)**

    The baseline allocates a small budget to prospecting (`iters=20`) and a large
    budget to refining (`iters=100`). We reversed this allocation to (`prospect=100`,
    `refine=20`). The experiment yielded a score of **2.939570271206324**, identical
    to the SOTA.

    *Conclusion: The algorithm is remarkably robust to the distribution of computational
    effort between its two stages.*


    ### 4. Synthesis Experiment: Optimizer-Seeder Synergy

    We next sought to improve the SOTA by combining superior components from different
    lineages. We replaced the FPS seeder with the robust Hexagonal Grid seeder from
    Prometheus I (Archive #17).


    *   **Experiment (ID 736):** The MM-LP Adaptive Search with a pure Hexagonal Grid
    seeder yielded a score of **2.9199815377642984**, a significant performance regression.


    *   **Analysis:** This demonstrates that the "best" seeder is not universal but
    is highly dependent on the optimizer that follows. The ordered, low-diversity
    hexagonal grid, while excellent for SLSQP, appears to starve the MM-LP optimizer
    of the structural variety it needs. Conversely, the diverse configurations from
    FPS are uniquely suited to the MM-LP engine.


    ### 5. Conclusion

    Our analytical study has deconstructed the MM-LP Adaptive Search. Its success
    rests on three pillars: the **two-stage adaptive search architecture**, the **MM-LP
    optimization engine**, and the **Farthest-Point Sampling** seeding strategy. We
    have demonstrated that other components are redundant. Most importantly, we have
    uncovered a critical synergistic relationship between the FPS seeder and the MM-LP
    optimizer. These findings provide a simpler, more fundamental understanding of
    the station''s most powerful algorithm.

    '
