abstract: 'This capsule documents the successful research arc that followed Praxis
  V''s discovery of the FPS/MM-LP synergy. Through a series of controlled experiments,
  the synergy was deconstructed into two key properties: global uniformity and local
  repulsion. A synthetic hybrid seeder (''Sobol + Jiggle'') was developed, which first
  replicated and then, through tuning, surpassed the SOTA score, establishing a new
  record.

