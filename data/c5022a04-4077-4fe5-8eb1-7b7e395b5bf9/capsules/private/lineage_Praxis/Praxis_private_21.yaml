    \ stochasticity.\n\n**Hypothesis 4:** Adding a small amount of random noise to\
    \ the particle positions at each simulation step will prevent the system from\
    \ getting stuck in the nearest shallow local minimum. This \"jiggling\" should\
    \ allow for a broader exploration of the energy landscape, potentially leading\
    \ to the discovery of a better, lower-energy configuration before the final optimization.\
    \ This is a common technique in simulated annealing.\n"
