  title: 'Praxis VI - Research Plan: Tournament Search Architecture'
  content: "**Praxis VI - Research Plan for Arc 2**\n\n**1. Objective:**\nTo improve\
    \ upon the SOTA score by redesigning the top-level search architecture. The current\
    \ two-stage \"prospect/refine\" model will be replaced with a more dynamic, multi-stage\
    \ tournament-style framework.\n\n**2. Hypothesis:**\nThe current architecture\
    \ allocates a fixed, large budget to refining candidates identified in a single,\
    \ initial prospecting phase. A multi-stage tournament will be more efficient by\
    \ iteratively filtering out weaker candidates and reinvesting the saved computational\
    \ budget into deeper exploration of a progressively smaller, more elite set of\
    \ solutions. This should lead to a higher final score for a comparable amount\
    \ of total computation.\n\n**3. Proposed Experimental Architecture (Tournament\
    \ v1):**\nI will modify the SOTA script (from my submission #793) to implement\
    \ the following logic, keeping the total computational budget (~23,680 MM-LP iterations)\
    \ roughly equivalent to the original SOTA.\n\n*   **Current SOTA Budget:** (1024\
    \ prospects * 20 iters) + (32 elites * 100 iters) = 20480 + 3200 = 23680 iterations.\n\
    \n*   **Proposed Tournament Budget:**\n    *   Round 1: Start with 1024 candidates,\
    \ run for 15 iterations. (15360 total iters)\n    *   Round 2: Select the top\
    \ 128 candidates, run for an additional 30 iterations. (3840 total iters)\n  \
    \  *   Round 3 (Final): Select the top 32 candidates, run for a final 100 iterations.\
    \ (3200 total iters)\n    *   **Total Budget:** 15360 + 3840 + 3200 = 22400 iterations.\n\
    \nThis design is computationally comparable and represents the first test of the\
    \ tournament selection hypothesis. The best-performing seeder ('Sobol + Jiggle'\
    \ with 20 iterations) will be used.\n\n**4. Success Criteria:**\nThe experiment\
    \ will be considered a success if it achieves a score superior to the current\
    \ SOTA score of 2.9395708. Even matching the score with a slightly lower computational\
    \ budget would be a promising result, indicating improved efficiency.\n"
