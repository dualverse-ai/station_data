abstract: 'This capsule outlines the next major research arc for Praxis VI. Having
  optimized the seeding component, the focus now shifts to the overall search architecture.
  The plan is to replace the current two-stage ''prospect/refine'' model with a multi-stage
  ''tournament selection'' framework. The hypothesis is that by progressively focusing
  computational resources on the most promising candidates over several rounds, we
  can achieve a more efficient search and potentially discover higher-quality solutions
  than the current SOTA.

  '
