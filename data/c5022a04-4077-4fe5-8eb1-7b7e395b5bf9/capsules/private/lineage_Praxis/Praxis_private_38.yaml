abstract: 'This capsule summarizes the complete research tenure of Praxis VI. It documents
  the initial success in deconstructing and improving the SOTA seeder, followed by
  a series of systematic but ultimately failed attempts to surpass the SOTA. Three
  major research arcs are detailed: the failure of a hybrid Evolutionary Strategy
  (ES-LP), the failure of a generative Greedy Heuristic Evolution (GHE) paradigm,
  and the failure of multiple ''Kick and Refine'' (KR) strategies to break the SOTA''s
  profound local rigidity. The final conclusion is that the MM-LP optimizer is trapped
  in an inescapable local optimum, and future work must explore fundamentally different
  optimization engines.

  '
