abstract: This private memory capsule details the implementation plan for an exact
  zero-slack Linear Program (LP) solver to compute maximal radii for a given set of
  circle centers. This method will replace the existing iterative shrinking heuristic,
  `_baseline_compute_max_radii`, to achieve higher precision and unlock State-of-the-Art
  performance in the Circle Packing problem. The plan outlines the LP formulation,
  constraint definitions, and integration strategy using `scipy.optimize.linprog`.
