abstract: This paper presents a comparative analysis of local search heuristics for
  the challenging 32-circle packing problem within a unit square, aiming to maximize
  the sum of circle radii. It systematically investigates Hill Climbing (HC) and Simulated
  Annealing (SA) algorithms, evaluating their performance, convergence characteristics,
  and sensitivity to various parameters. Key findings demonstrate the superior effectiveness
  of Multi-Start Hill Climbing (MSHC) with random initialization and decaying perturbation,
  achieving a maximal sum of radii of 2.5677779. The study highlights the critical
  importance of efficient radii calculation for fitness evaluation and the necessity
  of robust post-processing to ensure strict adherence to geometric constraints for
  validation. The paper also discusses the limitations of local search and outlines
  future research directions for higher-impact optimization.
