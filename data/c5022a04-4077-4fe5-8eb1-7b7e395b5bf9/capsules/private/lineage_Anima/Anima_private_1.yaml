  title: 'Research Log: Circle Packing Optimization - Hill Climbing Dominance'
  content: '## A Comparative Analysis of Local Search Heuristics for the 32-Circle
    Packing Problem


    ### 1. Introduction

    The circle packing problem involves arranging a given number of non-overlapping
    circles within a container to optimize a specific objective, typically maximizing
    the sum of their radii or minimizing the container size. This study addresses
    the challenge of packing precisely 32 non-overlapping circles within a unit square
    ([0,1] × [0,1]) to maximize the sum of their radii. This problem is a classic
    combinatorial optimization task with applications ranging from industrial design
    to logistics. This paper systematically evaluates the performance of various local
    search heuristics, specifically Hill Climbing (HC) and Simulated Annealing (SA),
    and identifies critical factors for effective optimization within computational
    constraints.


    ### 2. Methodology


    **2.1 Problem Formulation and Evaluation:**

    The objective is to maximize $\sum_{i=1}^{32} r_i$ such that:

    1.  All circles $C_i$ with center $(x_i, y_i)$ and radius $r_i$ are contained
    within the unit square: $x_i - r_i \ge 0$, $x_i + r_i \le 1$, $y_i - r_i \ge 0$,
    $y_i + r_i \le 1$.

    2.  No two circles overlap: $\sqrt{(x_i - x_j)^2 + (y_i - y_j)^2} \ge r_i + r_j$
    for all $i \ne j$.

    The evaluation is performed by a station-provided `_evaluate` function, which
    strictly verifies these conditions.


    **2.2 Radii Calculation (`_baseline_compute_max_radii`):**

    A critical component for fitness evaluation is a function to compute the maximum
    possible radii for a given set of circle centers without overlaps and within square
    boundaries. The implemented `_baseline_compute_max_radii` function (adapted from
    a system baseline) iteratively shrinks radii over 10 steps to resolve overlaps.
    This function prioritizes computational speed over absolute precision, as higher
    iteration counts (e.g., 50 iterations, as tested in Evaluation ID 795) significantly
    increase evaluation time per candidate solution, ultimately reducing the total
    number of search iterations and overall score.


    **2.3 Robust Post-Processing (`_ensure_no_overlap_and_bounds`):**

    Due to floating-point precision issues that occasionally lead to validation failures,
    a `_ensure_no_overlap_and_bounds` post-processing function was developed. This
    function applies a final, minimal shrinkage with a small safety epsilon (1e-10)
    to guarantee strict non-overlap and containment within the unit square boundaries.
    This ensures the validity of all submitted solutions without compromising the
    optimization process''s ability to explore aggressive packings.


    **2.4 Optimization Algorithms:**

    -   **Hill Climbing (HC):** A local search algorithm that iteratively perturbs
    the center coordinates of a randomly selected circle. If the perturbation leads
    to an improved sum of radii, the change is accepted; otherwise, it is reverted.
    A decaying perturbation strength was implemented (Evaluation ID 747) to transition
    from broader exploration to finer adjustments over time.

    -   **Simulated Annealing (SA):** A metaheuristic that extends HC by probabilistically
    accepting worse solutions to escape local optima. Acceptance probability depends
    on a ''temperature'' parameter that gradually decreases over time (cooling schedule).
    Various SA configurations with linear and exponential cooling schedules were tested.

    -   **Multi-Start Hill Climbing (MSHC):** This approach combines multiple independent
    HC runs, each starting from a new set of randomly initialized circle centers.
    The best solution found across all runs is selected as the final output. This
    strategy aims to mitigate HC''s susceptibility to local optima by exploring diverse
    regions of the search space.


    ### 3. Results


    **3.1 Baseline Performance:**

    The system''s initial "Ring Pattern Baseline" (Evaluation ID 1) achieved a sum
    of radii of 1.5313218.


    **3.2 Hill Climbing Performance:**

    Initial Hill Climbing from the baseline''s concentric ring pattern quickly improved
    upon the baseline, with a decaying perturbation strategy reaching a score of 2.3813993
    (Evaluation ID 747).


    **3.3 Simulated Annealing Performance:**

    Multiple Simulated Annealing attempts (Evaluation IDs 751, 759, 761, 765) generally
    underperformed compared to Hill Climbing. While some SA runs passed validation,
    their peak scores (e.g., 2.2283806 in ID 761) were consistently lower. This indicated
    challenges in tuning SA parameters (temperature, cooling rate, perturbation strength)
    effectively within the given execution time, often leading to either premature
    convergence or insufficient exploration. The `_ensure_no_overlap_and_bounds` post-processing
    function proved critical in addressing validation failures encountered by SA due
    to floating-point inaccuracies.


    **3.4 Multi-Start Hill Climbing Performance (Key Findings):**

    The most significant performance improvement was achieved through Multi-Start
    Hill Climbing with random initialization of circle centers and a decaying perturbation
    strength for each local search.

    -   **Evaluation ID 773** (5 restarts, 10-iteration radii calculation): **Score
    of 2.5677779**. This represented the highest score achieved. This configuration
    provided the best balance between exploring diverse initial configurations and
    allowing sufficient time for each local search to converge to a strong local optimum.

    -   Varying the number of restarts (e.g., 3, 7, 10) or initial perturbation strengths
    generally resulted in slightly lower scores (e.g., ID 777 with 7 restarts achieved
    2.5056745; ID 776 with 10 restarts achieved 2.4463518). This emphasizes the sensitivity
    of performance to the allocation of computational resources across restarts.

    -   Increasing the internal iterations of `_baseline_compute_max_radii` from 10
    to 50 (Evaluation ID 795) led to a drastically reduced number of total Hill Climbing
    iterations and a lower score (2.3903761), underscoring the importance of computational
    efficiency in the fitness function.


    ### 4. Conclusion

    This study demonstrates that Multi-Start Hill Climbing, coupled with random initialization
    of centers and a decaying perturbation strategy, is highly effective for the 32-circle
    packing problem within the given computational constraints. The efficient 10-iteration
    radii calculation for fitness evaluation and a robust post-validation step are
    crucial for maximizing scores and ensuring solution validity. While Simulated
    Annealing showed potential for escaping local optima, its parameter sensitivity
    made it less reliable in this environment. The achieved maximum sum of radii was
    2.5677779.


    ### 5. Future Work

    Future research will explore more advanced metaheuristics such as Genetic Algorithms
    or Particle Swarm Optimization to potentially discover higher global optima. Additionally,
    investigating more sophisticated, yet computationally efficient, radii calculation
    methods or hybrid approaches that combine global search with local refinement
    will be a key focus. The possibility of leveraging GPU acceleration through frameworks
    like JAX for gradient-based optimization of a constrained objective function will
    also be considered if a differentiable problem formulation can be developed.

    '
