  title: 'Draft Paper: Section 4'
  content: '### 4. Challenges in MM-LP Integration and Debugging


    The journey to successfully implementing the MM-LP Adaptive Search was marked
    by persistent challenges, primarily arising from architectural and numerical incompatibilities
    when attempting to combine elements from different methodologies.


    **4.1. Initial MM-LP Integration Failures (Evaluation IDs: 728, 737, 743, 745,
    754)**

    My initial strategy was to integrate the MM-LP (specifically Verity II''s `_mms_lp_step`
    which maximizes minimum slack) as a post-processing step to my established SLSQP
    pipeline (e.g., ID 728). This proved ineffective, yielding trivial scores or outright
    validation failures. Debugging revealed problems with `multiprocessing.Pool` pickling
    (requiring moving worker functions to module level) and critical `IndentationError`s
    that repeatedly required debugger intervention.


    **4.2. Radii Trivialization by `_finalize_strict`**

    A recurring and frustrating issue was the aggressive shrinking of valid radii
    by Verity II''s `_finalize_strict` function. Even when `_solve_radii_lp_zero_slack`
    (the LP-based radii solver) successfully generated high-quality radii (e.g., sum
    ~1.7-1.9 for initial FPS seeds), `_finalize_strict` consistently reduced these
    to trivial values (sum 0.00000032). Extensive debugging iterations confirmed `_finalize_strict`
    as the root cause (ID 779), identifying a subtle parameter-binding issue where
    its default strict epsilon values were overriding my attempts to relax them.

    When `_finalize_strict` was entirely bypassed (ID 783), the MM-LP process *did*
    successfully increase the sum of radii iteratively (e.g., from 1.722 to 2.158),
    demonstrating the potential of the core MM-LP center movement. However, this resulted
    in minute overlaps (`dist=0.19057472`, `r1+r2=0.19057481`, difference ~`1e-7`),
    causing validator failure and confirming that a finalization step for strict non-overlap
    was indeed necessary.

    Attempts to re-enable `_finalize_strict` with relaxed parameters (IDs 787, 792)
    failed due to the persistent parameter-binding issue, where the function continued
    to use its original, strict default parameters.


    **4.3. Conceptual Mismatch in MM-LP Objective**

    The most significant challenge was a conceptual mismatch in the core MM-LP objective.
    My initial `_mms_lp_step` aimed to maximize *minimum slack* (`s`). While this
    is a valid LP objective, it often led to center configurations that, while having
    maximized minimum slack in the linearized sub-problem, resulted in a degraded
    *sum of radii* in the overall circle packing problem. This contrasted sharply
    with Praxis V''s `mm_lp_optimize`, which directly maximizes the sum of radii within
    its LP formulation, highlighting a critical architectural difference in the successful
    SOTA approach.

    '
