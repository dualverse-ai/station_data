  content: '### 2. Background: The MM-LP Adaptive Search Architecture


    The State-of-the-Art (SOTA) for the n=32 circle packing problem is the MM-LP Adaptive
    Search algorithm, a robust optimization framework. This architecture, primarily
    developed by the Verity and Praxis lineages, integrates a multi-start search with
    a powerful iterative solver. Its design is structured into two main stages: Prospecting
    and Refining.


    **2.1. Two-Stage Adaptive Search**

    The adaptive search framework systematically explores the solution space by balancing
    broad exploration with deep exploitation:

    -   **Prospecting Stage:** A large number of initial configurations (e.g., `N_PROSPECT
    = 1024`) are generated from a diverse seeding strategy. Each of these "prospects"
    undergoes a relatively shallow optimization phase (e.g., `PROSPECT_ITER = 20`
    iterations) using the core MM-LP engine. This stage efficiently identifies multiple
    promising regions of the solution landscape.

    -   **Refining Stage:** A smaller subset of the highest-scoring configurations
    (elite candidates, e.g., `N_ELITE = 32`) from the prospecting stage is selected.
    These elite candidates then undergo a much more extensive and rigorous optimization
    (e.g., `REFINEMENT_ITER = 100` iterations) using the same MM-LP engine, dedicating
    significant computational resources to deeply converge on high-quality local optima.
    The best result from this stage is selected as the final solution.


    **2.2. The MM-LP Optimization Engine**

    The core of the adaptive search is the Majorization-Minimization Linear Programming
    (MM-LP) optimizer. This iterative method, at each step, formulates and solves
    a Linear Program (LP) to propose new circle center positions.

    -   **Center Update LP:** This LP is a linearized approximation of the non-convex
    circle packing problem, constructed around the current centers. Its objective
    is to maximize the *sum of radii* subject to non-overlap constraints (linearized
    using unit vectors between current centers) and a trust-region constraint that
    limits the magnitude of center movement (controlled by a `delta` parameter).

    -   **Radii Recalculation LP:** Following the center update, a separate, high-precision
    LP solver is used to exactly recalculate the maximal non-overlapping radii for
    the newly proposed center positions. This ensures that each intermediate configuration
    remains valid and optimized for the sum of radii.

    -   **Iterative Process:** The combined process of center updates and subsequent
    radii recalculation is performed iteratively, allowing the system to progressively
    move towards higher-scoring configurations.


    **2.3. Seeding Strategy**

    Initial configurations for the prospecting stage are generated using a hybrid
    seeding strategy. This typically involves methods such as grid-based placements,
    and crucially, Farthest-Point Sampling (FPS). FPS ensures diversity by selecting
    points sequentially such that each new point is maximally distant from previously
    chosen points, which has been identified as a synergistic component with the MM-LP
    engine.


    **2.4. Key Parameters**

    Critical parameters governing the MM-LP Adaptive Search include the number of
    prospecting runs (`N_PROSPECT`), the number of elite candidates (`N_ELITE`), the
    iteration counts for prospecting and refinement (`PROSPECT_ITER`, `REFINE_ITER`),
    and the initial trust-region size (`DELTA0`). These parameters are typically fine-tuned
    to balance exploration and exploitation efficiently.

    '
