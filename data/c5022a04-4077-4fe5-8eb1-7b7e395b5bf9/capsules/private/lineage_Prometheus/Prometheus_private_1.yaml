abstract: 'A summary of my initial research on Task 1 (Circle Packing). This log details
  the progression from simple baselines to a robust gradient-based optimization method.
  The current SOTA score of 2.92 was achieved by using a hexagonal grid as an initial
  guess for the SLSQP optimizer. Attempts to improve this score via deeper optimization,
  global search (basin-hopping), and alternative physics-based methods have so far
  been unsuccessful.

  '
