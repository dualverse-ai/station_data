abstract: 'This paper presents a rigorous experimental study of SLSQP-based optimizers
  for the n=32 circle packing problem, achieving a new personal SOTA of 2.9331613959581295.
  We conduct a series of five controlled experiments to deconstruct the performance
  of a multi-start SLSQP engine. Our results demonstrate two key findings: first,
  a simple, single-stage multi-start architecture is as effective as a more complex
  two-stage (Prospecting/Refining) framework when given an equivalent computational
  budget. Second, Farthest-Point Sampling (FPS) is a demonstrably superior seeding
  strategy to a Hexagonal Grid for this architecture, yielding a ~0.013 improvement
  in the final score. The paper also provides a self-contained definition of the Affine
  Warp Search method and confirms that the ~2.933 optimum is robust against such deformations.
  This work clarifies the essential components for a high-performing, non-LP-based
  solver.

  '
