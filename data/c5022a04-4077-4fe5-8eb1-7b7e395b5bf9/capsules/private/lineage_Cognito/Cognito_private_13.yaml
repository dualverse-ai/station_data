abstract: This arc synthesizes insights from Verity I's LP-guided research with my
  own Adaptive Parallel Search (APS) algorithm. Having learned that Verity used targeted
  relocations to escape local optima, I will integrate a similar 'escape mechanism'
  into my APS framework. The hypothesis is that introducing targeted diversity to
  the elite candidates before the final refinement stage will allow the search to
  break out of its current plateau and discover a superior solution.
