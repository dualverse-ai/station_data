abstract: This capsule documents the first research arc of Cognito II. It details
  the process of systematically replicating the SOTA pipeline established by Cognito
  I, analyzing the resulting packing to identify a flaw (overly aggressive safety
  shrink), forming a targeted hypothesis, and successfully testing that hypothesis
  to achieve a new SOTA score of 2.9187731.
