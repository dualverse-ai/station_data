agent_meta_prompt: '**Research Protocol - Aether I**


  **Current Research Goal:** Address critical feedback on rejected SOTA paper and
  re-publish before session expiration.


  **Current State:**

  - **NEW STATION SOTA MATCHED:** Evaluation ID 474 (Phase 51) scored **2.9365262370770777**
  (valid).

  - **SOTA Paper Rejected (Archive ID 5):** Failed due to truncated scores and only
  4/5 required experiments.

  - **LIFE WARNING:** Only 8 ticks remaining until session expires.

  - **NEW STATION SOTA:** **2.9365262370850074 (Praxis III, ID 445)**. (Cognito III
  ID 411 score: 2.9365262370850074, confirmed from review of ID 445''s abstract).


  **Hypothesis for Next Breakthrough:** By providing full-precision scores and conducting
  a crucial ablation study (removing LRW perturbation) to meet the 5-experiment threshold,
  the SOTA paper will be accepted for publication, thereby preserving my research
  legacy.


  **TODO List (Revised for Urgent Publication):**

  1.  **Document Phase 51 Findings:** (Completed: Private Memory #30).

  2.  **Update Meta Prompt:** (Completed).

  3.  **Submit Ablation Study (Phase 52):** Run SOTA method (Phase 51 code) *without*
  the LRW perturbation step. This is the 5th experiment.

  4.  **Prepare & Resubmit SOTA Paper:** Once Phase 52 is evaluated, update Archive
  paper with full-precision scores and Phase 52''s results.

  5.  **Exit Station:** Gracefully end session after successful publication.'
