last_parsed_actions_raw:
- command: submit
  args: '1'
  yaml_data:
    title: MSHC with Exact LP Radii (6x Restarts, Aggressive Init Perturbation, Tuned
      Time)
    tags:
    - optimization
    - LP
    - hill climbing
    - multi-start
    - tuning
    - exploitation
    - exploration
    abstract: This submission refines the Multi-Start Hill Climbing (MSHC) approach,
      which now integrates an exact zero-slack Linear Program (LP) solver for radii
      calculation. The number of MSHC restarts is reduced to 6 (from 7) to allocate
      a larger time budget to each local search, prioritizing deeper exploitation.
      The `initial_perturbation_strength` is increased to 0.05 for more aggressive
      initial exploration within these extended runs. This strategy aims to leverage
      the precision of LP-based radii with an optimized balance of exploration and
      exploitation to achieve a higher sum of radii for 32 circles in a unit square.
      A robust post-processing step ensures strict adherence to geometric constraints
      for validation.
    content: "import numpy as np\nimport time\nfrom scipy.optimize import linprog\n\
      \ndef _exact_lp_compute_max_radii(centers: np.ndarray) -> np.ndarray:\n    \"\
      \"\"\n    Compute the exact maximum possible radii for a given set of circle\
      \ centers\n    within a unit square, ensuring no overlap and staying within\
      \ bounds,\n    using a Linear Program (LP) solver.\n    \"\"\"\n    n = centers.shape[0]\n\
      \n    # 1. Objective function: Maximize sum of radii, so minimize -sum(radii)\n\
      \    c = -np.ones(n)\n\n    # 2. Inequality constraints: A_ub @ x <= b_ub\n\
      \    A_ub_list = []\n    b_ub_list = []\n\n    # 2.1. Boundary Constraints:\
      \ r_i <= x_i, r_i <= 1-x_i, r_i <= y_i, r_i <= 1-y_i\n    for i in range(n):\n\
      \        # r_i <= x_i\n        row_xi = np.zeros(n)\n        row_xi[i] = 1\n\
      \        A_ub_list.append(row_xi)\n        b_ub_list.append(centers[i, 0])\n\
      \n        # r_i <= 1 - x_i\n        row_1_minus_xi = np.zeros(n)\n        row_1_minus_xi[i]\
      \ = 1\n        A_ub_list.append(row_1_minus_xi)\n        b_ub_list.append(1.0\
      \ - centers[i, 0])\n\n        # r_i <= y_i\n        row_yi = np.zeros(n)\n \
      \       row_yi[i] = 1\n        A_ub_list.append(row_yi)\n        b_ub_list.append(centers[i,\
      \ 1])\n\n        # r_i <= 1 - y_i\n        row_1_minus_yi = np.zeros(n)\n  \
      \      row_1_minus_yi[i] = 1\n        A_ub_list.append(row_1_minus_yi)\n   \
      \     b_ub_list.append(1.0 - centers[i, 1])\n\n    # 2.2. Non-Overlap Constraints:\
      \ r_i + r_j <= d_ij\n    for i in range(n):\n        for j in range(i + 1, n):\
      \ # Avoid duplicate pairs and self-overlap\n            d_ij = np.linalg.norm(centers[i]\
      \ - centers[j])\n            row_overlap = np.zeros(n)\n            row_overlap[i]\
      \ = 1\n            row_overlap[j] = 1\n            A_ub_list.append(row_overlap)\n\
      \            b_ub_list.append(d_ij)\n\n    A_ub = np.array(A_ub_list)\n    b_ub\
      \ = np.array(b_ub_list)\n\n    # 3. Bounds: Radii must be non-negative\n   \
      \ bounds = [(0, None)] * n\n\n    # 4. Solve the LP\n    res = linprog(c, A_ub=A_ub,\
      \ b_ub=b_ub, bounds=bounds, method='highs')\n\n    if res.success:\n       \
      \ return np.maximum(res.x, 1e-12) # Ensure radii are strictly positive for validation\n\
      \    else:\n        return np.full(n, 1e-12) # Return minimal positive radii\
      \ if LP fails (infeasible)\n\ndef _ensure_no_overlap_and_bounds(centers: np.ndarray,\
      \ radii: np.ndarray) -> np.ndarray:\n    \"\"\"\n    Performs a final, minimal\
      \ adjustment to radii to strictly ensure no overlaps\n    and containment within\
      \ boundaries, accounting for floating-point precision.\n    This acts as a safety\
      \ net even for LP-derived radii.\n    \"\"\"\n    n = centers.shape[0]\n   \
      \ final_safety_epsilon = 1e-9 # Maintain increased safety epsilon\n\n    adjusted_radii\
      \ = radii.copy() # Work on a copy\n\n    # First, ensure all circles are strictly\
      \ within bounds\n    for i in range(n):\n        x, y = centers[i]\n       \
      \ max_allowed_r_for_center = min(x, 1 - x, y, 1 - y)\n        adjusted_radii[i]\
      \ = min(adjusted_radii[i], max_allowed_r_for_center - final_safety_epsilon)\n\
      \        adjusted_radii[i] = max(adjusted_radii[i], final_safety_epsilon) \n\
      \n    # Then, ensure no overlaps with adjusted radii\n    for i in range(n):\n\
      \        for j in range(i + 1, n):\n            dist = np.linalg.norm(centers[i]\
      \ - centers[j])\n            if dist < adjusted_radii[i] + adjusted_radii[j]:\
      \ \n                current_sum_r = adjusted_radii[i] + adjusted_radii[j]\n\
      \                if current_sum_r > 0:\n                    scale_factor = (dist\
      \ - final_safety_epsilon) / current_sum_r\n                    adjusted_radii[i]\
      \ *= scale_factor\n                    adjusted_radii[j] *= scale_factor\n \
      \               else: \n                    adjusted_radii[i] = final_safety_epsilon\n\
      \                    adjusted_radii[j] = final_safety_epsilon\n    \n    return\
      \ np.maximum(adjusted_radii, final_safety_epsilon) # Final check for positive\
      \ radii\n\ndef _evaluate_packing_fitness(centers: np.ndarray) -> float:\n  \
      \  \"\"\"Calculates the sum of radii for a given center configuration using\
      \ the LP solver.\"\"\"\n    radii = _exact_lp_compute_max_radii(centers)\n \
      \   return np.sum(radii)\n\ndef construct_packing() -> tuple[np.ndarray, np.ndarray]:\n\
      \    \"\"\"\n    Construct a packing of 32 circles in the unit square using\
      \ Multi-Start Hill Climbing\n    with random initialization, decaying perturbation,\
      \ and an exact LP radii solver.\n\n    Returns:\n      centers: (32, 2) array\
      \ of (x, y) coordinates.\n      radii:   (32,) array of radii for each circle.\n\
      \    \"\"\"\n    n = 32\n    max_execution_time = 1190  # seconds, leaving a\
      \ buffer for evaluation overhead\n    start_global_time = time.time()\n\n  \
      \  best_global_centers = None\n    best_global_radii = None\n    best_global_score\
      \ = -1.0 \n\n    num_restarts = 6 # Reduced number of independent Hill Climbing\
      \ runs\n    time_per_restart = max_execution_time / num_restarts\n    \n   \
      \ total_iterations = 0 \n\n    for restart_idx in range(num_restarts):\n   \
      \     current_restart_start_time = time.time()\n        \n        init_margin\
      \ = 1e-3 \n        centers = np.random.uniform(low=init_margin, high=1.0-init_margin,\
      \ size=(n, 2))\n        \n        current_radii = _exact_lp_compute_max_radii(centers)\n\
      \        current_score = np.sum(current_radii)\n        \n        best_local_centers\
      \ = centers.copy()\n        best_local_radii = current_radii.copy()\n      \
      \  best_local_score = current_score\n\n        initial_perturbation_strength\
      \ = 0.05 # Increased initial perturbation strength\n        final_perturbation_strength\
      \ = 0.0005 \n        center_clip_margin = 1e-4 \n\n        iterations_local\
      \ = 0\n        while time.time() - current_restart_start_time < time_per_restart:\n\
      \            iterations_local += 1\n            \n            elapsed_time_local\
      \ = time.time() - current_restart_start_time\n            decay_factor_local\
      \ = elapsed_time_local / time_per_restart\n            perturbation_strength\
      \ = initial_perturbation_strength - (initial_perturbation_strength - final_perturbation_strength)\
      \ * decay_factor_local\n            \n            idx_to_perturb = np.random.randint(n)\n\
      \            original_center = centers[idx_to_perturb].copy()\n            \n\
      \            delta_x = (np.random.rand() * 2 - 1) * perturbation_strength\n\
      \            delta_y = (np.random.rand() * 2 - 1) * perturbation_strength\n\
      \            \n            centers[idx_to_perturb, 0] += delta_x\n         \
      \   centers[idx_to_perturb, 1] += delta_y\n            centers[idx_to_perturb]\
      \ = np.clip(centers[idx_to_perturb], center_clip_margin, 1.0 - center_clip_margin)\n\
      \            \n            new_radii = _exact_lp_compute_max_radii(centers)\
      \ \n            new_score = np.sum(new_radii)\n            \n            if\
      \ new_score > current_score:\n                current_score = new_score\n  \
      \              current_radii = new_radii.copy()\n                \n        \
      \        if current_score > best_local_score:\n                    best_local_score\
      \ = current_score\n                    best_local_centers = centers.copy()\n\
      \                    best_local_radii = new_radii.copy()\n            else:\n\
      \                centers[idx_to_perturb] = original_center\n        \n     \
      \   total_iterations += iterations_local \n        print(f\"Restart {restart_idx+1}\
      \ completed {iterations_local} iterations. Best local score (pre-postprocessing):\
      \ {best_local_score}\")\n\n        if best_local_score > best_global_score:\n\
      \            best_global_score = best_local_score\n            best_global_centers\
      \ = best_local_centers.copy()\n            best_global_radii = best_local_radii.copy()\n\
      \n    final_radii = _ensure_no_overlap_and_bounds(best_global_centers, best_global_radii)\n\
      \    \n    print(f\"Total iterations across all restarts: {total_iterations}\"\
      )\n    print(f\"Best score found overall (pre-postprocessing): {best_global_score}\"\
      )\n    print(f\"Final score (post-postprocessing): {np.sum(final_radii)}\")\n\
      \n    return best_global_centers, final_radii\n"
  yaml_error: null
  location: Research Counter
