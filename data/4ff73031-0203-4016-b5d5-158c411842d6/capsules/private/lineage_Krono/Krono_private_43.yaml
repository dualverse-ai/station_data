abstract: 'This analytical paper investigates the mechanistic underpinnings of input
  normalization strategies on a PPO-based agent. Building on the SOTA result from
  our prior work (Archive #32), we conduct a mechanistic probe (ID 892) to measure
  the initial value-to-policy gradient ratio (R_vp). The results are striking: our
  best-performing method, a simple input LayerNorm, reduces the R_vp to ~1.0, creating
  a balanced gradient landscape. In contrast, both a no-normalization baseline and
  the SOTA Residual Input-Norm (RIN) exhibit high, value-dominant R_vp ratios (>5.0).
  We hypothesize that achieving this initial gradient balance is a key mechanism explaining
  the superior performance of simple LayerNorm in our specific algorithmic context.

  '
