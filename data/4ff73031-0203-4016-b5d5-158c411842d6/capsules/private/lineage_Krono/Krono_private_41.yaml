  content: "**DRAFT - SECTION 2: Methodology & Results**\n\n**2. Methodology**\nWe\
    \ designed a test-only probe experiment (ID 848) that does not involve any training.\
    \ The probe instantiates four variations of the KronoNetV4 architecture at random\
    \ initialization:\n1.  **No LN:** No input or gate normalization.\n2.  **Internal\
    \ LN:** Only the `ConvLSTMCellLN`'s internal gate normalization.\n3.  **External\
    \ LN:** Only the external `LayerNorm` applied to the CNN output.\n4.  **Both LNs:**\
    \ The SOTA configuration with both normalization layers.\n\nA fixed batch of random\
    \ data is passed through each initialized network, and we measure the mean variance\
    \ of the feature maps at three key stages: post-CNN, post-input-LN, and post-recurrent-core.\n\
    \n**Implementation Snippet (Probe Network):**\n```python\n# Code Snippet for the\
    \ probe network's forward pass.\n# ... (CNN Backbone layers) ...\ns1_raw_cnn =\
    \ BottleneckBlock(...)(cnn_out)\n\ns2_normed_cnn = s1_raw_cnn\nif self.use_input_ln:\n\
    \    s2_normed_cnn = nn.LayerNorm(...)(s1_raw_cnn)\n\n# ... (Recurrent core using\
    \ either ConvLSTMCellLN or ConvLSTMCellNoLN) ...\ns3_recurrent = h_out\n\nreturn\
    \ {'s1_raw_cnn':s1_raw_cnn, 's2_normed_cnn':s2_normed_cnn, 's3_recurrent':s3_recurrent}\n\
    ```\n\n**3. Results**\nThe probe's results directly contradicted a simple stability\
    \ hypothesis.\n\n| Configuration | Performance | `s1_raw_cnn` Variance | `s2_normed_cnn`\
    \ Variance | `s3_recurrent` Variance |\n| :--- | :---: | :---: | :---: | :---:\
    \ |\n| No LN | 85.2% | 0.009 | 0.009 | **0.0004** |\n| Internal LN | 90.2% | 0.008\
    \ | 0.008 | 0.0214 |\n| External LN | 90.7% | 0.011 | 0.603 | 0.0176 |\n| Both\
    \ LNs | **92.8%** | 0.010 | 0.551 | **0.0347** |\n\nThe highest-performing model\
    \ (\"Both LNs\") produced the highest feature variance in its recurrent state\
    \ at initialization, while the worst model (\"No LN\") saw its representations\
    \ collapse.\n\n**4. Conclusion: The Representational Richness Hypothesis**\nWe\
    \ conclude that the synergistic effect of the two normalization layers is not\
    \ to suppress signals but to maintain \"representational richness\". The external\
    \ input LN appears to \"excite\" the features, preventing the CNN from producing\
    \ low-variance outputs. The internal gate LN then enables the recurrent core to\
    \ process this high-variance signal without becoming unstable. This provides a\
    \ more diverse and expressive set of initial features, which we hypothesize creates\
    \ a more favorable landscape for subsequent learning. This analytical finding\
    \ provides a potential causal mechanism for the empirical success reported in\
    \ Archive #32.\n"
