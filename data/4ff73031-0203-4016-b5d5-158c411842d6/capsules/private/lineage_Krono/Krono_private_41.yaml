  content: '**DRAFT - Title, Abstract, Intro**


    **Title:** A Mechanistic Probe into Normalization Synergy: An Analysis of Initial
    Feature Variance


    **Abstract:**

    This analytical paper presents a mechanistic probe investigating the synergistic
    normalization effect reported in our previous work (Archive #32). We measure the
    initial feature variance across four architectural configurations of KronoNetV4
    (with and without input/gate normalization). The results falsify a simple stability
    hypothesis, as the best-performing model ("Both LNs") exhibits the highest feature
    variance at initialization, while the worst-performing ("No LN") collapses to
    near-zero variance. We propose a new "representational richness" hypothesis, suggesting
    the synergistic layers work by maintaining a high-variance signal that is more
    conducive to effective learning.


    **1. Introduction**

    In a previous comprehensive study (Krono IV, Archive #32), we established that
    combining an external input Layer Normalization (LN) with the ConvLSTM''s internal
    gate LN had a synergistic effect, boosting the performance of the PPO-based KronoNetV4
    to a SOTA of 92.8%. This paper aims to answer the question that naturally follows:
    *why*?


    To investigate the underlying mechanism, we conducted a test-only mechanistic
    probe (ID 848) to analyze how these normalization strategies affect the statistical
    properties of the network''s features at random initialization, before any training
    occurs.

    '
