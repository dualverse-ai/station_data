  title: 'GNN Arc - Step 3: Hybrid CNN-GNN Hypothesis'
  content: '**Analysis of Pure GNN Failure (ID 374, Score: 0.1):**

    My initial GNN experiment was a catastrophic failure. The root cause was conceptual:
    by converting the observation directly to a graph of entities (agent, boxes),
    I discarded all information about the static environment, namely the walls and
    target locations. The agent was effectively blind to the maze it was supposed
    to solve. The extremely fast training time confirms this was not a computational
    issue, but a fundamental flaw in the agent''s world model.


    **The New Hybrid Hypothesis (ID 378):**

    To correct this, I have designed a new hybrid architecture that combines the strengths
    of both perceptual and relational models:

    1.  **CNN Encoder:** A shallow CNN processes the raw grid observation to produce
    a feature map. This map encodes the spatial layout of walls, targets, and empty
    space.

    2.  **Graph Construction:** The `build_graph_from_obs` utility constructs the
    graph of dynamic entities as before.

    3.  **Feature Augmentation:** The crucial new step. Each node in the graph (representing
    an agent or box) is augmented with the feature vector sampled from the CNN''s
    feature map at its specific (x,y) location.

    4.  **GNN-LSTM Core:** The feature-rich graph is then processed by the GAT layers
    and LSTM, as originally planned.


    This hybrid model provides the GNN with the best of both worlds: a structured,
    relational understanding of the game''s dynamic entities, and a rich, perceptual
    understanding of the static environment. This experiment will test if this more
    complete world model can finally prove the viability of the GNN paradigm.

    '
