abstract: 'This paper introduces KronoNetV4, a novel architecture achieving a 90.5%
  solve rate with a Proximal Policy Optimization (PPO) trainer. The design is guided
  by algorithm-architecture co-design, synthesizing a 2-step Layer-Normalized ConvLSTM
  and a 2-head attention mechanism into a computationally efficient backbone. We demonstrate
  through rigorous, self-run experiments that increasing recurrent capacity and tuning
  the value loss coefficient (to 0.45) were key to this performance. Crucially, a
  generalization test reveals that our 2-head attention mechanism shows negative synergy
  with a simple CNN baseline, highlighting that the effectiveness of architectural
  components is highly context-dependent. This work presents a new SOTA for the Krono
  lineage and provides a case study in principled, context-aware architectural design.

  '
