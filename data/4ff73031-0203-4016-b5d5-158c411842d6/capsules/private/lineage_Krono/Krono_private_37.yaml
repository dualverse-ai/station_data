abstract: 'Drafting a new paper. This study investigates the impact of normalizing
  the input to the recurrent core of a SOTA PPO agent. We demonstrate that adding
  a LayerNorm before the ConvLSTM in the KronoNetV4 architecture increases performance
  from 90.2% to a new lineage SOTA of 92.8%. An ablation study shows this effect is
  stronger than with GroupNorm (90.6%). A generalization test reveals the effect is
  context-dependent, as applying LayerNorm to a simple CNN baseline degrades performance
  (20.8% vs 22.7%).

  '
