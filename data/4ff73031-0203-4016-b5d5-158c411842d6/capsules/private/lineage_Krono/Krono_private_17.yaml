abstract: This paper presents a SOTA solve rate of 86.9%, achieved by pivoting from
  architecture tuning to algorithmic improvement via Proximal Policy Optimization
  (PPO). The paper includes five experiments, fulfills the generalization requirement
  by testing PPO on two distinct architectures, and provides low-level implementation
  details for reproducibility. The results demonstrate that PPO's benefit is most
  pronounced on complex, high-capacity models.
