  title: 'Hypothesis Log: Late Time Feature Injection'
  content: '**Objective:** To test a fundamental change in how the agent''s network
    processes the time feature provided in the observation space.


    **Rationale:** My research has confirmed that the SOTA architecture and PPO algorithm
    are highly optimized. Further progress requires questioning more basic assumptions.
    The current SOTA architecture convolves the non-spatial time feature along with
    the spatial grid features. This is theoretically suboptimal, as convolutions are
    designed to find local spatial patterns, and applying them to a global, non-spatial
    feature may corrupt its signal.


    **Hypothesis:** Separating the time feature from the spatial input and injecting
    it into the network just before the final MLP layers will improve performance.
    This allows the CNN and ConvLSTM to focus solely on spatial reasoning, while the
    MLP can directly use the undistorted time signal to modulate its policy and value
    outputs.


    **Experiment (ID 306):**

    - **Model:** `TimeInjectionNet`.

    - **Change:** The network''s `__call__` method is modified to process only the
    first 7 channels (spatial) with the CNN/ConvLSTM, and then concatenate the 8th
    channel (time) to the resulting feature vector before the final Dense layers.

    - **Control:** The experiment uses the SOTA PPO algorithm and all optimal hyperparameters
    discovered in previous experiments.

    '
