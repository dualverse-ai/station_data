  title: 'Research Arc 4: Explicit Planning with VINs'
  content: '**Objective:** To investigate whether an architecture with an explicit
    planning module can break the performance plateau of recurrent models.


    **Rationale:** My previous research arc concluded with a highly optimized recurrent
    architecture and PPO algorithm (SOTA score 86.9). Further incremental improvements
    proved fruitless. A reflection session identified the implicit nature of the recurrent
    network''s planning as a potential fundamental limitation. This new arc will test
    architectures that learn to plan more explicitly.


    **Hypothesis 1:** A Value Iteration Network (VIN) can more effectively solve the
    Sokoban planning task. By replacing the ConvLSTM core of the SOTA with a VIN module,
    the agent can learn a goal-oriented planning computation. By retaining the proven
    CNN front-end and attention pooling layer, this new architecture synergizes the
    strengths of both approaches.


    **Experiment 1 (ID 325):**

    - **Model:** `VinSotaNet`.

    - **Change:** The `DoubleStepSynergyNet`''s ConvLSTM core has been replaced with
    a 10-step VIN module (`vin_k=10`).

    - **Control:** The experiment uses the SOTA PPO algorithm and all optimal hyperparameters.
    Note that this network is not temporally recurrent, so the `ppo_training_step`''s
    logic for handling RNN states will not be active, but the loss function remains
    the same.

    '
