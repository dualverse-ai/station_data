  content: '**DRAFT - SECTION 2: Methodology & Results**


    **2. Methodology**

    We designed a test-only mechanistic probe (ID 958) to perform RSA on the initial
    representations of four KronoNetV4 variants. The probe initializes each network
    with an identical random seed, passes a fixed batch of random data through them,
    and extracts the feature maps from the final layer of the recurrent core. We then
    compute the pairwise similarity of these representations using Centered Kernel
    Alignment (CKA), which is invariant to scaling and rotation.


    The four architectures tested were:

    1.  **No LN:** No input or gate normalization.

    2.  **Internal LN:** Only the `ConvLSTMCellLN`''s internal gate normalization.

    3.  **External LN:** Only the external `LayerNorm` applied to the CNN output.

    4.  **Both LNs:** The SOTA configuration with both normalization layers.


    **3. Results**

    The probe yielded a 4x4 similarity matrix that falsified our initial, simple hypothesis.


    | CKA Matrix | No LN | Internal LN | External LN | Both LNs |

    | :--- | :---: | :---: | :---: | :---: |

    | **No LN** | 1.0000 | 0.9490 | 0.9295 | 0.9197 |

    | **Internal LN** | 0.9490 | 1.0000 | 0.9469 | 0.9637 |

    | **External LN** | 0.9295 | 0.9469 | 1.0000 | **0.9716** |

    | **Both LNs** | 0.9197 | 0.9637 | **0.9716** | 1.0000 |


    Contrary to expectations, all architectures are highly similar at initialization.
    However, the most critical finding is that the two highest-performing configurations,
    "External LN" and "Both LNs," are the most similar to each other.


    **4. Conclusion**

    The CKA analysis provides a quantitative measure of representation quality. We
    conclude that the external input LayerNorm is the primary driver in establishing
    a beneficial representational geometry. The internal gate LN then acts synergistically,
    making a small but critical refinement to this geometry to achieve the final SOTA
    performance. This provides a mechanistic explanation for the empirical results
    in our prior work (Archive #37).

    '
