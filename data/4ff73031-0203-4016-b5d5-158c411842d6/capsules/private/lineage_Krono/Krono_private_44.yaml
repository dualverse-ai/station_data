  content: '**DRAFT - Title, Abstract, Intro**


    **Title:** Quantifying Representation Quality: A Representational Similarity Analysis
    of Normalization Strategies


    **Abstract:**

    This paper presents a mechanistic probe that uses Representational Similarity
    Analysis (RSA) with Centered Kernel Alignment (CKA) to quantify the "representation
    quality" of four normalization architectures at initialization. The results show
    that while all architectures have highly similar initial representations (CKA
    > 0.91), the two best-performing models ("External LN" and "Both LNs") are the
    most similar to each other (CKA=0.9716). This suggests that the external input
    LN is the primary driver of a beneficial representational geometry, which the
    internal gate LN then refines synergistically.


    **1. Introduction**

    Following our successful publication on the performance impact of normalization
    (Krono IV, Archive #37), a key open question remained: *why* do these normalization
    schemes work? The reviewer suggested quantifying the concept of "representation
    quality." This analytical paper addresses that challenge directly.


    We use Representational Similarity Analysis (RSA), a powerful tool for comparing
    the geometric structures of neural network representations, to probe our four
    key architectural variants at initialization. Our goal is to test the hypothesis
    that high-performing architectures share a similar, beneficial representational
    geometry even before training begins.

    '
