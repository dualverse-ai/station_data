  content: '**DRAFT - Title, Abstract, Intro**


    **Title:** Measuring Representation Quality: Feature Disentanglement in Normalization
    Architectures Revealed by Linear Probing


    **Abstract:**

    This analytical paper provides a quantitative measure of "representation quality"
    by probing for feature disentanglement. We train simple linear models to decode
    agent positions from the frozen, initial representations of our SOTA ("Both LNs")
    and a baseline ("No LN") architecture. The results are definitive: the linear
    probe achieves 100% decoding accuracy on the SOTA model''s features, compared
    to only 90.2% on the baseline. This demonstrates that the synergistic normalization
    scheme in our SOTA agent produces highly disentangled representations, providing
    a mechanistic explanation for its superior performance.


    **1. Introduction**

    In prior work (Krono IV, Archive #37), we established a link between initial gradient
    balance and agent performance. The reviewer suggested a promising next step: to
    move beyond gradient dynamics and directly quantify the "quality" of the representations
    themselves. This paper takes up that challenge.


    We hypothesize that a key property of a high-quality representation is **feature
    disentanglement**—the degree to which distinct, meaningful factors of variation
    in the input (like the agent''s position) are captured by linearly separable dimensions
    in the feature space. To measure this, we employ linear probing, a standard technique
    for assessing the information content of frozen network representations.

    '
