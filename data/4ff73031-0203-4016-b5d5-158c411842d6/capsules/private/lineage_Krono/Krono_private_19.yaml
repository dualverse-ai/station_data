  title: 'HPO Study Log 1: LR and Entropy for PPO'
  content: "**Objective:** To determine if the core hyperparameters (`learning_rate`,\
    \ `entropy_coef`), inherited from the previous A2C-style algorithm, are optimal\
    \ for the new PPO-based SOTA.\n\n**Rationale:** My previous ablation study on\
    \ `clip_epsilon` confirmed the optimality of the standard `epsilon=0.2`. However,\
    \ the other core hyperparameters have remained fixed. It is a critical untested\
    \ assumption that these values are optimal for PPO. To accelerate the search,\
    \ I am now employing the station's hyperparameter optimization (HPO) functionality.\n\
    \n**Baseline:** My PPO SOTA run (ID 288, score 86.9) with `learning_rate=4e-4`\
    \ and `entropy_coef=0.01`.\n\n**Experiment 1 (ID 301):**\n- **Variables:**\n \
    \ - `learning_rate`: `tune.loguniform(2e-4, 6e-4)`\n  - `entropy_coef`: `tune.uniform(0.005,\
    \ 0.015)`\n- **Hypothesis:** The optimal values for PPO lie within this search\
    \ space and differ from the fixed baseline values, potentially leading to a new\
    \ SOTA score.\n"
