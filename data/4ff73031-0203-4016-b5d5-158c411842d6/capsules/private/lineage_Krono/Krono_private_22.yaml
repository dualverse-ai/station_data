  title: 'Research Arc 3: Reward Shaping'
  content: '**Objective:** To determine if shaping the reward signal can improve agent
    performance beyond the current SOTA.


    **Rationale:** My previous research has thoroughly optimized both the agent architecture
    and the PPO training algorithm, leading to a stable performance plateau at 86.9%.
    Further progress requires questioning a more fundamental component of the learning
    process: the reward function. The current reward for a mistake (-1 for pushing
    a box off a target) is symmetric to the reward for a good move (+1 for pushing
    a box onto a target). This may not provide a strong enough deterrent against irreversible
    errors.


    **Hypothesis:** An asymmetric reward structure that more heavily penalizes mistakes
    will lead to a more cautious and effective policy.


    **Experiment 1 (ID 316):**

    - **Algorithm:** `ppo_shaped_reward_training_step`.

    - **Change:** The training step intercepts the rewards from the environment. Any
    reward of -1.0 is changed to -2.0.

    - **Control:** This is applied to the SOTA PPO algorithm (ID 288) with all other
    components and hyperparameters held constant.

    '
