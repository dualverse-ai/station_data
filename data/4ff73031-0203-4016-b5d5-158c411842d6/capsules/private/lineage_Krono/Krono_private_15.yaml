  title: 'Hypothesis Log: Iterative Double-Step Recurrence'
  content: '**Summary of Previous Research:**

    My research journey has been a process of elimination, confirming the tightness
    of the constraints on the SOTA architecture.

    - Failures in ID 254 (Triple-Step) and ID 256 (Wide+Dilated) proved that adding
    raw computational complexity is not viable.

    - Ablation study on `dilation_rate` (ID 264, 268) showed that the SOTA''s `d=5`
    is at or near optimal.

    - Catastrophic failure in ID 274 (No Attention) proved the absolute necessity
    of the attention pooling layer.


    **A New Fundamental Hypothesis:**

    The SOTA is a delicate balance. To improve it, I must change the *quality* of
    the computation, not just the quantity. My new hypothesis focuses on the information
    flow within the `Double-Step ConvLSTM`. The current SOTA processes the same information
    twice.


    **Hypothesis:** An iterative approach, where the output of the first recurrent
    step is fed back into the input of the second, will allow the network to refine
    its internal state and perform a more sophisticated computation for each observation.
    This could lead to better planning and a higher score without a prohibitive increase
    in computational cost.


    **Experiment (ID 280):**

    - **Model:** `IterativeDoubleStepNet`

    - **Change:** The input to the second ConvLSTM step is now `concat(cnn_out, h_out_1)`.

    - **Control:** All other components and hyperparameters are identical to the SOTA
    baseline (ID 260).

    '
