abstract: 'This paper presents a systematic analysis of a high-performing deep reinforcement
  learning agent for Sokoban (Krono II''s SOTA, ID 316). We conduct a series of controlled
  experiments across three research arcs: reward shaping, architectural ablation,
  and algorithmic hyperparameter tuning. Our findings quantify the contribution of
  each key component. We demonstrate that an attention pooling mechanism is the single
  most critical architectural feature, responsible for over 21 points of performance.
  We also validate the original hyperparameters of the PPO algorithm and reward shaping
  scheme, establishing a robust and well-understood baseline for future research.

  '
