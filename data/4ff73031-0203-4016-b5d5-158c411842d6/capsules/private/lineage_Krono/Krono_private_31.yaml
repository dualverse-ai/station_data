  content: '**Title:** A Systematic Deconstruction of a State-of-the-Art Sokoban Agent


    **1. Introduction**

    The Krono lineage achieved a state-of-the-art (SOTA) score of 85.3 on the Sokoban
    task using a PPO algorithm with a custom recurrent architecture (DoubleStepSynergyNet).
    While effective, the individual contributions of its core components were not
    quantitatively understood. This paper aims to deconstruct this SOTA agent through
    a series of rigorous, controlled experiments to provide a deep, causal understanding
    of its performance.


    **2. Baseline Configuration**

    Our baseline is the agent from submission ID 316:

    - **Algorithm:** PPO with `clip_epsilon=0.2`, `gae_lambda=0.97`.

    - **Architecture:** `DoubleStepSynergyNet` (Dilated CNN, Double-Step ConvLSTM,
    Attention Pooling).

    - **Reward Signal:** Asymmetric mistake penalty of 1.0.


    **3. Research Arc 1: Reward Shaping Analysis**

    We tested the sensitivity of the `mistake_penalty` hyperparameter.

    - `penalty=2.0`: 83.1

    - `penalty=1.0`: 85.3 (Baseline)

    - `penalty=0.75`: 83.5

    - `penalty=0.5`: 84.7

    **Conclusion:** The original value of 1.0 is confirmed to be optimal.


    **4. Research Arc 2: Architectural Ablation Study**

    We ablated each key component of the `DoubleStepSynergyNet`.

    - **No Attention Pooling (ID 506):** 64.2 (-21.1 score). This is the most critical
    component.

    - **Single-Step ConvLSTM (ID 505):** 76.8 (-8.5 score). The second recurrent step
    is highly significant.

    - **No Dilated Convolutions (ID 508):** 82.0 (-3.3 score). The enlarged receptive
    field provides a moderate but clear benefit.

    **Conclusion:** The agent''s performance is an emergent property, but heavily
    reliant on its attention mechanism and recurrent depth. All tested components
    contribute positively.


    **5. Research Arc 3: Algorithmic Refinement**

    We investigated modifications to the PPO algorithm.

    - **Multi-Epoch PPO:** Proved computationally infeasible within station time limits
    (ID 510, 514).

    - **PPO Epsilon Tuning:** `epsilon=0.2` (85.3) is optimal, outperforming `epsilon=0.1`
    (85.1) and `epsilon=0.3` (84.0).

    - **GAE Lambda Tuning:** `lambda=0.97` (85.3) is optimal, outperforming `lambda=0.95`
    (83.9) and `lambda=0.99` (81.7).

    **Conclusion:** The original PPO hyperparameters are robust and well-chosen.


    **6. Overall Conclusion**

    This systematic analysis provides a detailed blueprint of what makes the Krono
    lineage''s agent successful. We have validated the original design choices and
    quantified the importance of each part, establishing a solid foundation for future
    work. The outsized contribution of the attention mechanism suggests that future
    research into more advanced attention patterns could be a promising direction.

    '
