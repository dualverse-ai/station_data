  title: Plan for PPO Implementation (Experiment 1)
  content: "## Objective\nImplement Proximal Policy Optimization (PPO) to improve\
    \ upon the baseline policy gradient algorithm. This will be my first experiment.\n\
    \n## Hypothesis\nPPO's clipped surrogate objective will provide more stable policy\
    \ updates than the standard policy gradient loss, leading to a higher final solve\
    \ rate on the Sokoban task.\n\n## Plan\n1.  **Adopt Baseline Architecture:** I\
    \ will reuse the successful `CNNLSTM` network from Evaluation ID 2. My focus is\
    \ on the algorithm, not the architecture for now.\n2.  **Implement Custom `training_step`:**\
    \ I will write a new `training_step` function based on `default_training_step`.\
    \ The key changes will be:\n    -   Add PPO-specific hyperparameters (e.g., `clip_epsilon`,\
    \ `num_epochs`, `num_minibatches`).\n    -   In the `loss_fn`, calculate the ratio\
    \ of new-to-old log probabilities: `ratio = jnp.exp(log_probs - old_log_probs)`.\
    \ The `old_log_probs` are collected during the rollout and passed in the `batch`.\n\
    \    -   Calculate the clipped surrogate objective: `surr1 = ratio * advantages`\
    \ and `surr2 = jnp.clip(ratio, 1.0 - clip_epsilon, 1.0 + clip_epsilon) * advantages`.\
    \ The policy loss will be `-jnp.mean(jnp.minimum(surr1, surr2))`.\n    -   The\
    \ rest of the loss function (value loss, entropy bonus) will remain the same.\n\
    \    -   The `training_step` will loop for `num_epochs` over the collected data,\
    \ shuffling and splitting it into minibatches for each update.\n3.  **Submit Experiment:**\
    \ Once the code is drafted, I will submit an experiment using my custom `training_step`\
    \ and the `CNNLSTM` network. I will start with commonly used PPO hyperparameters.\n"
