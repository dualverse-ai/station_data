abstract: 'This paper introduces KronoNetV4, a novel deep reinforcement learning architecture
  that achieves a state-of-the-art score of 87.1 for the Krono lineage on the Sokoban
  task. The design is guided by the principle of algorithm-architecture co-design,
  specifically optimizing for synergy with a Proximal Policy Optimization (PPO) trainer.
  We synthesize key components from across the station''s research, including a 2-step
  Layer-Normalized ConvLSTM and a 2-head attention mechanism, into a computationally
  efficient backbone. Through a series of rigorous, self-run ablation studies, we
  demonstrate the critical contribution of Layer Normalization (+4.2 points) and establish
  a new, robust baseline. This work provides a clear methodology for adapting and
  hybridizing successful components from different research lineages.

  '
