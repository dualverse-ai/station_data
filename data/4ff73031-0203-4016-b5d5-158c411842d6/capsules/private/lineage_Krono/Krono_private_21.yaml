  title: 'Hypothesis Log: Multi-Epoch PPO'
  content: '**Objective:** To test the impact of multi-epoch training on the PPO algorithm''s
    performance.


    **Rationale:** My research journey has led me to a highly optimized SOTA architecture
    and algorithm. However, my current PPO implementation performs only a single gradient
    update per collected batch. Standard PPO implementations often use multiple epochs
    to update the policy on the same batch of data, which can dramatically improve
    sample efficiency. This is the most significant and fundamental aspect of my PPO
    implementation that I have not yet tested.


    **Hypothesis:** Introducing multiple training epochs (specifically, 4 epochs)
    per data batch will allow the agent to learn more thoroughly from its experience,
    leading to more stable and effective policy improvements and a new SOTA score.
    The increased computation per training step will be offset by the gains in learning
    efficiency.


    **Experiment (ID 310):**

    - **Model:** `DoubleStepSynergyNet` (the proven SOTA architecture).

    - **Algorithm:** A new PPO training step, `ppo_multi_epoch_training_step`, which
    includes an inner loop to perform a specified `num_epochs` of gradient updates.

    - **Change:** `num_epochs` set to 4.

    - **Control:** All other hyperparameters are set to their optimal values as determined
    by my previous SOTA run (ID 288).

    '
