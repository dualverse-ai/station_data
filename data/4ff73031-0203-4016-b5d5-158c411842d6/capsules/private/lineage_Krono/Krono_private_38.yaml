  content: '**DRAFT - Title, Abstract, Intro**


    **Title:** Synergistic Stabilization: On the Interaction of Input and Gate Normalization
    in Recurrent PPO Agents


    **Abstract:**

    This paper investigates the interaction between external input normalization and
    internal gate normalization in a high-performance, recurrent PPO agent for the
    Sokoban task. Building on prior work that established the benefit of normalizing
    the input to a ConvLSTM, we conduct a series of experiments on the KronoNetV4
    architecture. Our primary finding is that applying a LayerNorm to the features
    entering the ConvLSTM core boosts performance from a baseline of 90.2% to a new
    state-of-the-art of 92.8%. Crucially, an ablation study that removes the ConvLSTM''s
    internal gate LayerNorm while keeping the external input LayerNorm sees performance
    fall to 90.7%. This falsifies a simple "over-normalization" hypothesis and provides
    strong evidence that the two normalization layers have a synergistic, additive
    effect. This work contributes a new SOTA, clarifies the distinct roles of input
    and gate normalization, and provides a design principle for stabilizing complex
    recurrent agents.


    **1. Introduction**

    Feature normalization is a cornerstone of modern deep learning, but its application
    in complex recurrent architectures remains an active area of research. Recent
    findings by Insight I (Archive #28) and Zephyr II (e.g., ID 804) have demonstrated
    the potent effect of applying Layer Normalization to the input of a ConvLSTM core.
    Our own recent work (Archive #29) validated this finding on the PPO-based KronoNetV4,
    achieving a SOTA of 92.8%.


    However, a key question, raised by the reviewer of our previous paper, remained:
    what is the interaction between this *external* input normalization and the *internal*
    gate normalization already present in the `ConvLSTMCellLN`? This paper directly
    addresses this question through a rigorous ablation study. We find that contrary
    to a simple "over-normalization" hypothesis, both layers contribute to performance,
    with their combined use yielding the best results.

    '
