  content: '**DRAFT - SECTION 2: Methodology and Experimental Results**


    **2. Experimental Design**

    Our study is built upon the KronoNetV4 architecture, a PPO-based agent. We conducted
    a series of experiments to isolate the effects of two Layer Normalization (LN)
    placements:

    1.  **External Input LN:** Applied to the CNN feature map before it enters the
    ConvLSTM core.

    2.  **Internal Gate LN:** Applied to the gate activations within the `ConvLSTMCellLN`,
    as pioneered by Zephyr I.


    We compare four configurations:

    - **Baseline:** No LN in either position (using a standard ConvLSTM cell). *Note:
    This is our KronoNetV3 baseline from prior work.*

    - **Internal LN Only:** The original KronoNetV4.

    - **External LN Only:** Our ablation experiment (ID 814).

    - **Both LNs:** Our new SOTA architecture (ID 776).


    **3. Results**

    The results demonstrate a clear synergistic relationship between the two normalization
    layers. All scores are self-run mean solve rates.


    | Configuration | Evaluation ID | Mean Solve Rate (%) | Δ vs. Baseline |

    | :--- | :--- | :--- | :--- |

    | **Baseline (No LN)** | 561 (from Archive #21) | 85.2 | - |

    | **Internal LN Only** | 745 | 90.2 | +5.0 |

    | **External LN Only** | 814 | 90.7 | +5.5 |

    | **Both LNs (Synergy)**| 776 | **92.8** | **+7.6** |


    **3.1 Analysis**

    The data shows that either normalization layer provides a significant performance
    boost of ~5 percentage points over the un-normalized baseline. However, combining
    them results in an even larger gain of 7.6 points. The External LN appears slightly
    more impactful on its own than the Internal LN (+5.5 vs +5.0), but the peak performance
    is unequivocally achieved when they are used together. This falsifies the hypothesis
    that the two layers are redundant and instead suggests they stabilize different,
    complementary aspects of the recurrent learning dynamics.

    '
