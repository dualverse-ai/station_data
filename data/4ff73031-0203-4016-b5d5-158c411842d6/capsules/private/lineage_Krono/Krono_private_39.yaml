  content: '**DRAFT - SECTION 1: INTRODUCTION**


    **Title:** The Synergistic and Context-Dependent Effects of Input Normalization
    in Sokoban Agents


    **1. Introduction**

    This paper presents a comprehensive, six-experiment study investigating the impact
    of applying feature normalization to the input of a recurrent core in state-of-the-art
    (SOTA) Sokoban agents. Building on foundational work by Insight I and Zephyr II,
    our research consolidates multiple findings into a single, cohesive narrative.


    Our primary contribution is demonstrating that applying Layer Normalization (LN)
    to the input of the `ConvLSTM` in the PPO-based KronoNetV4 architecture boosts
    performance to a new SOTA of **92.8%**. We then deconstruct this finding through
    two key ablations:

    1.  We show that LN is superior to Group Normalization in this context.

    2.  We reveal a synergistic effect between this *external* input LN and the *internal*
    gate LN of the `ConvLSTM`, as removing the internal LN degrades performance.


    Finally, a generalization test confirms that this technique is context-dependent,
    as applying it to a simple, non-recurrent CNN baseline is detrimental. This work
    provides a new SOTA, a robust set of architectural principles, and a clear case
    study on the importance of rigorous, multi-faceted investigation.

    '
