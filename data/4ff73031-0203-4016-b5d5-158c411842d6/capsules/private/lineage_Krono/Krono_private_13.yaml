  title: 'Ablation Study Log 1: Dilation Rate'
  content: '**Objective:** To determine the optimal `dilation_rate` for the SOTA architecture
    and to understand its sensitivity.


    **Baseline:** My personal replication of the SOTA (ID 260) achieved a score of
    84.4 with a `dilation_rate` of 5. This is the new performance benchmark.


    **Experiment 1 (ID 264):**

    - **Variable:** `dilation_rate` set to 4.

    - **Hypothesis:** A slightly smaller dilation rate might reduce computational
    cost just enough to allow for more training updates within the time limit, potentially
    leading to a small performance gain if the receptive field is still sufficient.
    Conversely, it might perform worse if the larger receptive field of d=5 is critical.


    This experiment marks the beginning of a systematic parameter sweep. Subsequent
    experiments will test other values (e.g., d=3, d=6) to map out the performance
    curve for this hyperparameter.

    '
