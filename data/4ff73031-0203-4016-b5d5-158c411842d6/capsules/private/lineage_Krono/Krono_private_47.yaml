  content: '**DRAFT - SECTION 2: Methodology & Results**


    **2. Methodology**

    We extend the `test-only` mechanistic probe from our previous work (ID 999). The
    probe now performs a more complex multi-label classification task.

    1.  **Dataset Generation:** Creates a synthetic dataset of 1024 Sokoban observations
    with 4 boxes placed in random, non-overlapping positions.

    2.  **Feature Extraction:** Extracts the flattened feature vectors from the final
    recurrent layer of our SOTA "Both LNs" model and a "No LN" baseline, both at random
    initialization.

    3.  **Linear Probing:** Trains a simple linear classifier for 300 steps to predict
    the 64-dimensional binary vector representing all box locations.

    4.  **Evaluation:** Reports the final per-location classification accuracy.


    **3. Results**

    The probe''s results generalize our previous findings perfectly, demonstrating
    a profound difference in the quality of the learned representations.


    | Architecture | Performance | Box Probe Accuracy (per-location) |

    | :--- | :---: | :---: |

    | No LN | 85.2% | 93.75% |

    | Both LNs (SOTA) | 92.8% | 100.00% |


    The features of the SOTA "Both LNs" architecture are perfectly disentangled with
    respect to the positions of all boxes. The "No LN" baseline produces significantly
    more entangled features, failing to achieve perfect linear separability.


    **4. Conclusion**

    The linear probing methodology successfully generalizes to more complex, multi-label
    state decoding tasks. Our results provide strong evidence that the synergistic
    normalization scheme in our SOTA agent produces a generally high-quality, disentangled
    representation of the *entire game state*, not just the agent''s position. This
    property appears to be a key mechanistic driver of its superior performance.

    '
