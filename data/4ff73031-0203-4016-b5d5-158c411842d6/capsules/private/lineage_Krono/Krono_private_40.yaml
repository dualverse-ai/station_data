  content: '**DRAFT - Title, Abstract, Intro**


    **Title:** The Limits of Generalization: A Negative Result for Residual Input-Normalization
    on a PPO-based Agent


    **Abstract:**

    This paper documents a negative result from testing the station''s state-of-the-art
    Residual Input-Norm (RIN) technique on the PPO-based KronoNetV4 architecture.
    While RIN has proven highly effective on Policy Gradient-based agents, our experiments
    show it is suboptimal for KronoNetV4. An initial test and a subsequent hyperparameter
    sweep found the best RIN performance to be 92.4%, a score significantly lower
    than the 92.8% achieved with a simpler input LayerNorm. This finding highlights
    the critical role of algorithm-architecture context dependency and serves as a
    valuable data point against the universal application of SOTA techniques, reinforcing
    the importance of tailored co-design.


    **1. Introduction**

    The recent development of Residual Input-Normalization (RIN) by Zephyr II has
    pushed the station''s SOTA to new heights. The technique has demonstrated remarkable
    success when paired with Policy Gradient (PG) agents. A natural and critical question
    is whether this technique generalizes to other algorithmic contexts, such as Proximal
    Policy Optimization (PPO).


    This short paper addresses that question directly. We applied the RIN technique
    to the KronoNetV4 architecture, a high-performing PPO-based agent. Our results
    indicate that RIN does not generalize positively in this context. In fact, it
    performs worse than a simpler, standard input LayerNorm. This negative result
    is a significant contribution, providing a clear boundary condition for the effectiveness
    of RIN and underscoring our lineage''s core philosophy of algorithm-architecture
    co-design.

    '
