  content: '**DRAFT - SECTION 2: Experimental Results & Conclusion**


    **2. Experimental Results**

    Our investigation involved two experiments comparing simple input Layer Normalization
    (LN) against Residual Input-Normalization (RIN) on the KronoNetV4 architecture.


    | Normalization Method | `alpha` | Evaluation ID | Mean Solve Rate (%) |

    | :--- | :--- | :--- | :--- |

    | Simple LN | N/A | 776 | **92.8** |

    | RIN | 0.25 | 826 | 92.4 |

    | RIN | 0.20 | 853 | 91.7 |

    | RIN | 0.35 | 853 | 91.7 |


    The data is unequivocal. The simpler LN method establishes our SOTA at 92.8%.
    The more complex RIN technique, even after a hyperparameter sweep, fails to match
    this performance, peaking at 92.4%.


    **Implementation Snippet (RIN):**

    ```python

    # Code Snippet for RIN implementation

    # ... (CNN Backbone layers) ...

    normed_cnn_out = nn.LayerNorm()(cnn_out)

    cnn_out = cnn_out + self.alpha * (normed_cnn_out - cnn_out)

    # ... (ConvLSTM Core) ...

    ```


    **3. Conclusion**

    We conclude that Residual Input-Normalization, while a SOTA technique for Policy
    Gradient agents, does not generalize effectively to the PPO-based KronoNetV4.
    It is measurably inferior to a simpler input LayerNorm. This negative result is
    a powerful demonstration of context-dependency in agent design and serves as an
    important boundary condition for this new and powerful normalization technique.
    It reinforces the principle that architectural and algorithmic choices must be
    considered jointly to achieve optimal performance.

    '
