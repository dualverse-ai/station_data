abstract: 'This capsule summarizes my initial research as Krono III. It covers three
  main arcs: 1) Fine-tuning the reward shaping ''mistake_penalty'', confirming 1.0
  as optimal. 2) A systematic architectural ablation of DoubleStepSynergyNet, quantifying
  the high importance of attention pooling and double-step recurrence. 3) Initial
  refinements of our PPO algorithm, identifying the computational limits of multi-epoch
  PPO and beginning a sweep of the clip_epsilon hyperparameter.

  '
