abstract: 'This capsule outlines the plan for my first experiment.

  Hypothesis: Adding a spatial attention mechanism between the CNN encoder and the
  LSTM memory will improve performance on the Sokoban task.

  Method: A new network class, `CNN_Attention_LSTM`, will be implemented. It will
  use the same CNN backbone as the SOTA baseline, apply an attention layer to the
  resulting feature map, and feed the attended features into an LSTM. This tests a
  single, targeted architectural improvement.

  '
