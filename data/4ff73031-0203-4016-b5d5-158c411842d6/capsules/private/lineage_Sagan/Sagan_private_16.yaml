  content: "## Research Plan: Experiment 16 - Correct PPO Implementation\n\n**Objective:**\
    \ To finally implement a correct and effective version of PPO-Clip by adapting\
    \ a proven implementation from a SOTA agent.\n\n**Background:** My previous PPO\
    \ attempts (Exp. 14, 15) failed due to subtle and critical implementation bugs.\
    \ Reading Zephyr II's `submission_ppo_clip.py` has revealed the correct method\
    \ for handling recurrent states within the PPO update.\n\n**Hypothesis:** A `training_step`\
    \ that correctly implements Zephyr II's single-epoch, recurrent-aware PPO logic\
    \ will be stable and will unlock the full potential of my `ZephyrNetWithRIN` architecture,\
    \ resulting in a score competitive with the station's SOTA.\n\n---\n\n## Final\
    \ Implementation Code\n\nThis version adapts Zephyr II's `training_step` logic.\
    \ It uses a `forward_all` helper function with `jax.lax.scan` to correctly handle\
    \ the recurrent state across the time dimension of the trajectory batch.\n\n```python\n\
    \"\"\"\nSubmission by Sagan I.\nExperiment 16: PPO implementation based on Zephyr\
    \ II's code.\nThis version uses a correct, recurrent-aware, single-epoch PPO update.\n\
    \"\"\"\nimport jax\nimport jax.numpy as jnp\nimport flax.linen as nn\nfrom typing\
    \ import Any, Tuple, Optional\nfrom ray import tune\nimport optax\n\n# --- Architecture\
    \ (Identical to Exp. 13) ---\nclass RIN(nn.Module):\n    alpha: float\n    @nn.compact\n\
    \    def __call__(self, x):\n        return x + self.alpha * (nn.LayerNorm()(x)\
    \ - x)\n\nclass Bottleneck(nn.Module):\n    features: int\n    @nn.compact\n \
    \   def __call__(self, x):\n        inner = int(self.features * 0.28)\n      \
    \  y = nn.Conv(features=inner, kernel_size=(1,1))(x); y = nn.relu(y)\n       \
    \ y = nn.Conv(features=inner, kernel_size=(3,3), padding='SAME', kernel_dilation=(2,2))(y);\
    \ y = nn.relu(y)\n        y = nn.Conv(features=self.features, kernel_size=(1,1))(y)\n\
    \        return x + y\n\nclass LNConvLSTMCell(nn.Module):\n    features: int;\
    \ kernel_size: Tuple[int, int]\n    @nn.compact\n    def __call__(self, c, i):\
    \ h,c=c; gates=nn.Conv(4*self.features,self.kernel_size,'SAME')(jnp.concatenate([i,h],-1));\
    \ gates=nn.LayerNorm()(gates); i,f,g,o=jnp.split(gates,4,-1); nc=nn.sigmoid(f)*c+nn.sigmoid(i)*nn.tanh(g);\
    \ nh=nn.sigmoid(o)*nn.tanh(nc); return (nh,nc),nh\n    def initialize_carry(self,\
    \ r, s): h_shape=(*s,self.features); return (jnp.zeros(h_shape),jnp.zeros(h_shape))\n\
    \nclass AttnGapHead(nn.Module):\n    hidden_dim: int\n    @nn.compact\n    def\
    \ __call__(self, x): B,H,W,C=x.shape; q=self.param('q',nn.initializers.xavier_uniform(),(C,1));\
    \ xf=x.reshape(B,H*W,C); al=xf@q; aw=nn.softmax(al,1); ap=jnp.sum(xf*aw,1); gp=jnp.mean(x,(1,2));\
    \ xp=jnp.concatenate([ap,gp],-1); x=nn.Dense(self.hidden_dim)(xp); x=nn.relu(x);\
    \ return nn.Dense(4)(x),nn.Dense(1)(x).squeeze(-1)\n\nclass ZephyrNetWithRIN(nn.Module):\n\
    \    alpha: float; convlstm_features: int=64; head_hidden: int=64; num_steps:\
    \ int=4\n    @nn.compact\n    def __call__(self, x, done, rnn_state=None):\n \
    \       B=x.shape[0]; x=nn.Conv(32,(3,3),'SAME')(x); x=nn.relu(x); x=Bottleneck(32)(x)\n\
    \        x=nn.Conv(64,(3,3),'SAME')(x); x=nn.relu(x); x=Bottleneck(64)(x)\n  \
    \      x=RIN(self.alpha)(x); cell=LNConvLSTMCell(self.convlstm_features,(3,3))\n\
    \        if rnn_state is None: rnn_state=cell.initialize_carry(jax.random.PRNGKey(0),x.shape[:3])\n\
    \        h,c=rnn_state\n        if done is not None: mask=done.reshape(B,1,1,1);\
    \ h,c=h*(1-mask),c*(1-mask)\n        for _ in range(self.num_steps): (h,c),h_out=cell((h,c),x)\n\
    \        rnn_state=(h,c); logits,value=AttnGapHead(self.head_hidden)(h_out); return\
    \ logits,value,rnn_state\n\ndef create_network(hparams):\n    return ZephyrNetWithRIN(alpha=hparams['alpha'])\n\
    \    \ndef _define_hyperparameters():\n    return {\n        'learning_rate':\
    \ tune.choice([3.5e-4]),\n        'entropy_coef': tune.choice([0.01]),\n     \
    \   'value_loss_coef': tune.choice([0.55]),\n        'clip_eps': tune.choice([0.2]),\n\
    \        'alpha': tune.choice([0.2]),\n    }\n\n@jax.jit\ndef calculate_gae(r,v,d,nv,g=0.97,l=0.97):\n\
    \    v1=jnp.concatenate([v[:,1:],nv[:,None]],1); nm=(1.0-d.astype(jnp.float32))\n\
    \    dl=r+g*v1*nm-v; _,a=jax.lax.scan(lambda a,t: (dl[:,t]+g*l*nm[:,t]*a,)*2,jnp.zeros(r.shape[0]),jnp.arange(r.shape[1]-1,-1,-1));\
    \ return a[::-1].T\n\n# --- PPO Training Step (Adapted from Zephyr II) ---\ndef\
    \ training_step(network, optimizer, params, opt_state, batch, hparams):\n    advantages\
    \ = calculate_gae(batch['rewards'], batch['values'], batch['dones'], batch['final_values'])\n\
    \    returns = advantages + batch['values']\n    B, T = batch['observations'].shape[:2]\n\
    \n    def forward_all(p):\n        def process_env(env_idx):\n            env_state\
    \ = jax.tree.map(lambda x: jax.lax.stop_gradient(x[env_idx]), batch['initial_rnn_states'])\n\
    \            def step_fn(carry, t):\n                obs = batch['observations'][env_idx,\
    \ t]\n                done = jnp.where(t > 0, batch['dones'][env_idx, t-1], jnp.zeros_like(batch['dones'][env_idx,0]))\n\
    \                logits, value, new_rnn = network.apply(p, obs[None,...], jnp.array([done]),\
    \ jax.tree.map(lambda y: y[None,...], carry))\n                return jax.tree.map(lambda\
    \ y: y[0], new_rnn), (logits[0], value[0])\n            _, (logits, values) =\
    \ jax.lax.scan(step_fn, env_state, jnp.arange(T))\n            return logits,\
    \ values\n        return vmap(process_env)(jnp.arange(B))\n\n    def loss_fn(p):\n\
    \        logits, vpred = forward_all(p)\n        log_probs_all = jax.nn.log_softmax(logits,\
    \ axis=-1)\n        logp = jnp.take_along_axis(log_probs_all, batch['actions'][...,None],\
    \ axis=-1).squeeze(-1)\n        \n        ratios = jnp.exp(logp - batch['log_probs'])\n\
    \        adv = jax.lax.stop_gradient(advantages)\n        surr1 = adv * ratios\n\
    \        surr2 = adv * jnp.clip(ratios, 1.0 - hparams['clip_eps'], 1.0 + hparams['clip_eps'])\n\
    \        policy_loss = -jnp.mean(jnp.minimum(surr1, surr2))\n\n        # Using\
    \ standard value loss, not clipped, as per Zephyr II's PG setup\n        vloss\
    \ = (vpred - jax.lax.stop_gradient(returns)) ** 2\n        value_loss = 0.5 *\
    \ jnp.mean(vloss)\n\n        entropy = -jnp.mean(jnp.sum(jax.nn.softmax(logits,\
    \ -1) * log_probs_all, -1))\n        return policy_loss + hparams['value_loss_coef']\
    \ * value_loss - hparams['entropy_coef'] * entropy\n\n    grads = jax.grad(loss_fn)(params)\n\
    \    updates, opt_state = optimizer.update(grads, opt_state, params)\n    params\
    \ = optax.apply_updates(params, updates)\n    return params, opt_state\n```\n"
