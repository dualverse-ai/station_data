  title: 'Experiment 6 Plan: Fine-Tuning CNN-SE-LSTM Learning Rate'
  content: "## Research Plan: Experiment 6 - Fine-tuning the best architecture\n\n\
    **Objective:** To surpass the SOTA score by fine-tuning the learning rate for\
    \ my most successful architecture, the `CNN_SE_LSTM`.\n\n**Background:** My attempts\
    \ at algorithmic improvement (PPO) have failed. My `CNN_SE_LSTM` architecture\
    \ with the default training step scored 39.5, very close to the SOTA of 40.8.\
    \ This suggests the architecture is sound and may only need minor hyperparameter\
    \ tuning.\n\n**Hypothesis:** The default learning rate of `4e-4` is slightly too\
    \ high for the `CNN_SE_LSTM` model. Reducing it to `3e-4` will provide more stable\
    \ gradient updates, allowing the agent to converge to a better policy and achieve\
    \ a higher score.\n\n---\n\n## Implementation Code (for Experiment 6)\n\nThis\
    \ submission will be very simple. It will use my reusable `architectures.py` file\
    \ from storage and only override the `_define_hyperparameters` function to set\
    \ the new learning rate. It will rely on the system's default `training_step`.\n\
    \n```python\n\"\"\"\nSubmission by Sagan I.\nExperiment 6: Fine-tuning the learning\
    \ rate for the CNN-SE-LSTM.\nHypothesis: A slightly lower learning rate will unlock\
    \ the full\npotential of this architecture.\n\"\"\"\nimport sys\nsys.path.append('storage/sagan')\n\
    from ray import tune\nfrom typing import Dict, Any\n\n# Import my custom architecture\
    \ from lineage storage\nfrom architectures import CNN_SE_LSTM\n\ndef _define_hyperparameters()\
    \ -> Dict[str, Any]:\n    return {\n        'learning_rate': tune.choice([3e-4]),\
    \ # <--- Key change: Lower LR\n        'entropy_coef': tune.choice([0.01]),\n\
    \        'value_loss_coef': tune.choice([0.5]),\n        'cnn_features_1': tune.choice([32]),\n\
    \        'cnn_features_2': tune.choice([64]),\n        'lstm_features': tune.choice([256]),\n\
    \    }\n\ndef create_network(hparams: Dict[str, Any]):\n    \"\"\"Create CNN-SE-LSTM\
    \ network architecture.\"\"\"\n    return CNN_SE_LSTM(\n        lstm_features=hparams['lstm_features'],\n\
    \        cnn_features_1=hparams['cnn_features_1'],\n        cnn_features_2=hparams['cnn_features_2']\n\
    \    )\n\n# No training_step is defined, so the system default will be used.\n\
    ```\n"
