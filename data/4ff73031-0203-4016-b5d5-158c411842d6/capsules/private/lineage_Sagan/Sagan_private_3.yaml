  title: 'Experiment 3 Plan: Proximal Policy Optimization (PPO)'
  content: "## Research Plan: Experiment 3 - PPO\n\n**Objective:** To determine if\
    \ a more advanced policy optimization algorithm, PPO, can improve performance\
    \ over the baseline policy gradient method.\n\n**Hypothesis:** By clipping the\
    \ surrogate objective function, PPO prevents destructively large policy updates,\
    \ leading to more stable training and a higher final score compared to the default\
    \ `training_step`.\n\n**Experimental Series:**\n1.  **Experiment 3a:** Implement\
    \ PPO `training_step` with the baseline `CNNLSTM` architecture. This will serve\
    \ as a direct comparison against the SOTA score (40.8) to validate the effectiveness\
    \ of PPO in this environment.\n2.  **Experiment 3b (Conditional):** If 3a is successful\
    \ (i.e., shows improvement or is competitive), combine the PPO `training_step`\
    \ with my `CNN_SE_LSTM` architecture to see if the improved algorithm can unlock\
    \ its full potential.\n\n---\n\n## PPO Implementation Code (for Experiment 3a)\n\
    \nThis is the code for the `submission.py` file for Experiment 3a. It defines\
    \ a new `training_step` and introduces a hyperparameter for the clipping ratio.\
    \ It uses the SOTA `CNNLSTM` as its network to isolate the effect of the algorithm\
    \ change.\n\n```python\n\"\"\"\nSubmission by Sagan I.\nExperiment 3a: Proximal\
    \ Policy Optimization (PPO) with baseline RNN.\nThis experiment tests a PPO-clip\
    \ training algorithm instead of the default\npolicy gradient method, using the\
    \ SOTA CNN-LSTM architecture as a control.\n\"\"\"\n\nimport jax\nimport jax.numpy\
    \ as jnp\nfrom jax import vmap, jit, lax\nimport flax.linen as nn\nfrom ray import\
    \ tune\nimport optax\nfrom typing import Tuple, Dict, Any, Optional\n\n# --- Hyperparameters\
    \ ---\ndef _define_hyperparameters():\n    search_space = {\n        'learning_rate':\
    \ tune.choice([4e-4]),\n        'entropy_coef': tune.choice([0.01]),\n       \
    \ 'value_loss_coef': tune.choice([0.5]),\n        'clip_eps': tune.choice([0.2]),\
    \ # PPO clipping parameter\n        'cnn_features_1': tune.choice([32]),\n   \
    \     'cnn_features_2': tune.choice([64]),\n        'lstm_features': tune.choice([256])\n\
    \    }\n    return search_space\n\n# --- Baseline CNN-LSTM Architecture (from\
    \ SOTA submission) ---\nclass CNNLSTM(nn.Module):\n    lstm_features: int\n  \
    \  cnn_features_1: int\n    cnn_features_2: int\n    \n    @nn.compact\n    def\
    \ __call__(self, x: jnp.ndarray, done: jnp.ndarray, rnn_state: Optional[Dict]\
    \ = None):\n        batch_size = x.shape[0]\n        if rnn_state is None:\n \
    \           rnn_state = {'h': jnp.zeros((batch_size, self.lstm_features)), 'c':\
    \ jnp.zeros((batch_size, self.lstm_features))}\n        if done is not None:\n\
    \            done_mask = done.reshape(batch_size, 1)\n            rnn_state =\
    \ {'h': rnn_state['h'] * (1 - done_mask), 'c': rnn_state['c'] * (1 - done_mask)}\n\
    \        x = nn.Conv(features=self.cnn_features_1, kernel_size=(3, 3), padding='SAME')(x)\n\
    \        x = nn.relu(x)\n        conv2_in = x\n        x = nn.Conv(features=self.cnn_features_1,\
    \ kernel_size=(3, 3), padding='SAME')(x)\n        x = nn.relu(x)\n        x =\
    \ nn.Conv(features=self.cnn_features_1, kernel_size=(3, 3), padding='SAME')(x)\n\
    \        x = x + conv2_in; x = nn.relu(x)\n        x = nn.Conv(features=self.cnn_features_2,\
    \ kernel_size=(3, 3), padding='SAME')(x)\n        x = nn.relu(x)\n        conv4_in\
    \ = x\n        x = nn.Conv(features=self.cnn_features_2, kernel_size=(3, 3), padding='SAME')(x)\n\
    \        x = nn.relu(x)\n        x = nn.Conv(features=self.cnn_features_2, kernel_size=(3,\
    \ 3), padding='SAME')(x)\n        x = x + conv4_in; x = nn.relu(x)\n        x\
    \ = x.reshape((batch_size, -1))\n        x = nn.Dense(features=256)(x); x = nn.relu(x)\n\
    \        lstm_cell = nn.LSTMCell(features=self.lstm_features)\n        (rnn_state['c'],\
    \ rnn_state['h']), lstm_out = lstm_cell((rnn_state['c'], rnn_state['h']), x)\n\
    \        x = nn.Dense(features=128)(lstm_out); x = nn.relu(x)\n        policy_logits\
    \ = nn.Dense(features=4)(x)\n        value = nn.Dense(features=1)(x).squeeze(-1)\n\
    \        return policy_logits, value, rnn_state\n\ndef create_network(hparams):\n\
    \    return CNNLSTM(\n        lstm_features=hparams['lstm_features'],\n      \
    \  cnn_features_1=hparams['cnn_features_1'],\n        cnn_features_2=hparams['cnn_features_2']\n\
    \    )\n\n@jit\ndef calculate_gae(rewards, values, dones, gamma=0.97, gae_lambda=0.97,\
    \ next_values=None):\n    values_t_plus_1 = jnp.concatenate([values[:, 1:], next_values[:,\
    \ None]], axis=1)\n    not_done_mask = (1.0 - dones.astype(jnp.float32))\n   \
    \ deltas = rewards + gamma * values_t_plus_1 * not_done_mask - values\n    def\
    \ scan_fn(adv, t):\n        adv = deltas[:, t] + gamma * gae_lambda * not_done_mask[:,\
    \ t] * adv\n        return adv, adv\n    _, advantages = lax.scan(scan_fn, jnp.zeros(values.shape[0]),\
    \ jnp.arange(values.shape[1] - 1, -1, -1))\n    return advantages[::-1].T\n\n\
    # --- PPO Training Step ---\ndef training_step(network, optimizer, params, opt_state,\
    \ batch, hparams):\n    observations, actions, rewards, dones = batch['observations'],\
    \ batch['actions'], batch['rewards'], batch['dones']\n    old_log_probs, old_values,\
    \ final_values = batch['log_probs'], batch['values'], batch['final_values']\n\
    \    initial_rnn_states = batch.get('initial_rnn_states', None)\n    advantages\
    \ = calculate_gae(rewards, old_values, dones, next_values=final_values)\n    returns\
    \ = advantages + old_values\n    advantages = (advantages - advantages.mean())\
    \ / (advantages.std() + 1e-8)\n    batch_size, trajectory_length = observations.shape[:2]\n\
    \    \n    def loss_fn(params):\n        def process_env_trajectory(env_idx):\n\
    \            env_rnn_state = jax.tree.map(lambda x: jax.lax.stop_gradient(x[env_idx]),\
    \ initial_rnn_states)\n            def step_fn(carry, t):\n                obs\
    \ = observations[env_idx, t][None, ...]; prev_done = jnp.where(t > 0, dones[env_idx,\
    \ t-1], False)[None, ...]\n                rnn_state_b = jax.tree.map(lambda x:\
    \ x[None, ...], carry)\n                logits, value, new_rnn = network.apply(params,\
    \ obs, prev_done, rnn_state_b)\n                return jax.tree.map(lambda x:\
    \ x[0], new_rnn), (logits[0], value[0])\n            _, (env_logits, env_values)\
    \ = lax.scan(step_fn, env_rnn_state, jnp.arange(trajectory_length))\n        \
    \    return env_logits, env_values\n        all_logits, all_values = vmap(process_env_trajectory)(jnp.arange(batch_size))\n\
    \        \n        log_probs_all = jax.nn.log_softmax(all_logits, axis=-1)\n \
    \       new_log_probs = log_probs_all[jnp.arange(batch_size)[:, None], jnp.arange(trajectory_length),\
    \ actions]\n        \n        ratio = jnp.exp(new_log_probs - old_log_probs)\n\
    \        adv_d = jax.lax.stop_gradient(advantages)\n        surr1 = ratio * adv_d\n\
    \        surr2 = jnp.clip(ratio, 1.0 - hparams['clip_eps'], 1.0 + hparams['clip_eps'])\
    \ * adv_d\n        policy_loss = -jnp.mean(jnp.minimum(surr1, surr2))\n      \
    \  value_loss = 0.5 * jnp.mean((all_values - jax.lax.stop_gradient(returns)) **\
    \ 2)\n        entropy = -jnp.mean(jnp.sum(jax.nn.softmax(all_logits) * log_probs_all,\
    \ axis=-1))\n        \n        return policy_loss + hparams['value_loss_coef']\
    \ * value_loss - hparams['entropy_coef'] * entropy\n    \n    loss, grads = jax.value_and_grad(loss_fn)(params)\n\
    \    updates, opt_state = optimizer.update(grads, opt_state, params)\n    params\
    \ = optax.apply_updates(params, updates)\n    return params, opt_state\n```\n"
