  title: 'Experiment 21 Plan: Fine-Grained RIN Alpha Sweep'
  content: "## Research Plan: Experiment 21 - SOTA Fine-Tuning\n\n**Objective:** To\
    \ close the final performance gap and achieve a score of over 95% by conducting\
    \ a fine-grained hyperparameter sweep on my best model.\n\n**Background:** My\
    \ innovative Slot Attention research arc has been definitively proven to be a\
    \ failure (score 11.4). My SOTA replication scored 93.1. The most productive path\
    \ forward is to master the SOTA paradigm. Zephyr II's recent work shows that small\
    \ tweaks to hyperparameters are yielding the final performance gains.\n\n**Hypothesis:**\
    \ The optimal `alpha` value for Residual Input-Normalization in my setup may not\
    \ be exactly 0.20. A sweep of values around this point (e.g., {0.18, 0.20, 0.22})\
    \ will reveal a configuration that surpasses 95%.\n\n---\n\n## Draft Code (for\
    \ Experiment 21)\n\nThis will be a simple modification of my successful Experiment\
    \ 19 submission, changing the `_define_hyperparameters` function to perform a\
    \ sweep.\n\n```python\n\"\"\"\nSubmission by Sagan I.\nExperiment 21: A fine-grained\
    \ sweep of the RIN alpha parameter\non the SOTA PG architecture.\n\"\"\"\nimport\
    \ sys\nsys.path.append('storage/zephyr/submissions')\nfrom ray import tune\nfrom\
    \ typing import Any, Dict\n\nfrom submission_residual_inputln import PG_AttnGap_ResidualInputLN\n\
    \ndef _define_hyperparameters() -> Dict[str, Any]:\n    # The only change is to\
    \ sweep alpha\n    return {\n        'learning_rate': tune.choice([3.5e-4]),\n\
    \        'entropy_coef': tune.choice([0.01]),\n        'value_loss_coef': tune.choice([0.55]),\n\
    \        'cnn_features_1': tune.choice([32]),\n        'cnn_features_2': tune.choice([64]),\n\
    \        'convlstm_features': tune.choice([64]),\n        'dilation': tune.choice([6]),\n\
    \        'bottleneck_ratio': tune.choice([0.28]),\n        'head_hidden': tune.choice([64]),\n\
    \        'steps': tune.choice([4]),\n        'alpha': tune.grid_search([0.18,\
    \ 0.20, 0.22, 0.25]), # Fine-grained sweep\n        'center_only': tune.choice([False]),\n\
    \    }\n\ndef create_network(hparams: Dict[str, Any]):\n    return PG_AttnGap_ResidualInputLN(\n\
    \        cnn_features_1=int(hparams['cnn_features_1']),\n        cnn_features_2=int(hparams['cnn_features_2']),\n\
    \        convlstm_features=int(hparams['convlstm_features']),\n        dilation=int(hparams['dilation']),\n\
    \        bottleneck_ratio=float(hparams['bottleneck_ratio']),\n        head_hidden=int(hparams['head_hidden']),\n\
    \        steps=int(hparams['steps']),\n        alpha=float(hparams['alpha']),\n\
    \        center_only=bool(hparams['center_only']),\n    )\n```\n"
