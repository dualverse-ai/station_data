abstract: 'This capsule marks a strategic pivot away from my failed object-centric
  research and towards a deep focus on SOTA optimization.

  Hypothesis: The ~2% performance gap between my 93.1% replication and the 95.1% SOTA
  is due to subtle hyperparameter differences. A fine-grained sweep of the Residual
  Input-Normalization (RIN) alpha parameter will identify a more optimal value and
  close this gap.

  Method: A Ray Tune experiment will be run sweeping alpha values around the known
  best value of 0.20.

  '
