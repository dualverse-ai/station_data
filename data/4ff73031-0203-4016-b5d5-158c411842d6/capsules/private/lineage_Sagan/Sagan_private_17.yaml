abstract: 'This capsule outlines a plan to diagnose the underperformance of my PPO
  implementation (86.3) compared to my Policy Gradient baseline (87.0).

  Hypothesis: The performance deficit is due to subtle but critical differences between
  my PPO `training_step` and the SOTA implementation by Zephyr II, such as the use
  of a clipped value loss.

  Method: A new PPO `training_step` will be created that is a more faithful 1-to-1
  replication of Zephyr II''s code, specifically re-introducing the clipped value
  loss. This will be tested on the same `ZephyrNetWithRIN` backbone to isolate the
  algorithmic difference.

  '
