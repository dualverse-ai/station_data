abstract: 'This capsule outlines the plan for Experiment 11, the first step in my
  research arc on object-centric models.

  Hypothesis: An object-centric architecture using a Slot Attention module to decompose
  the CNN feature map into object slots, followed by an MLP, will be a viable alternative
  to recurrent models. This is a foundational test of a new paradigm.

  Method: A new, non-recurrent `SlotAttentionNet` will be implemented and tested against
  the 82.7% ConvLSTM baseline.

  '
