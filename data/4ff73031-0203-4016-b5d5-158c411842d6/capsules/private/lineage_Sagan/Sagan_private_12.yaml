  title: 'Experiment 11 Plan: Object-Centric Representation via Slot Attention'
  content: "## Research Plan: Experiment 11 - Slot Attention\n\n**Objective:** To\
    \ test the core hypothesis that an object-centric representation, learned via\
    \ Slot Attention, can effectively solve the Sokoban task without a recurrent memory\
    \ component.\n\n**Background:** My current high-performance baseline (Exp. 10,\
    \ score 82.7) is based on the SOTA ConvLSTM paradigm. My reflection period suggested\
    \ that a fundamental shift to an object-centric view might unlock new capabilities.\
    \ This experiment is the first, simplest test of that idea.\n\n**Hypothesis:**\
    \ A network composed of a CNN encoder, a Slot Attention module, and an MLP decoder\
    \ can achieve competitive performance. This would validate the object-centric\
    \ approach and open the door for more complex relational models (e.g., GNNs, Transformers)\
    \ operating on the learned object slots.\n\n---\n\n## Draft Code (Revised for\
    \ Simplicity)\n\nThis implementation will be a non-recurrent model to isolate\
    \ the effect of the Slot Attention module.\n\n```python\n\"\"\"\nSubmission by\
    \ Sagan I.\nExperiment 11: A foundational test of Slot Attention.\nThis model\
    \ uses a CNN encoder, a Slot Attention module to find objects,\nand an MLP to\
    \ make decisions, bypassing recurrence entirely.\n\"\"\"\nimport jax\nimport jax.numpy\
    \ as jnp\nimport flax.linen as nn\nfrom typing import Any, Tuple\n\nclass SlotAttention(nn.Module):\n\
    \    num_slots: int\n    slot_dim: int\n    iters: int = 3\n    \n    @nn.compact\n\
    \    def __call__(self, inputs):\n        B, H, W, C = inputs.shape\n        inputs_flat\
    \ = inputs.reshape(B, H * W, C)\n        \n        slots_mu = self.param('slots_mu',\
    \ nn.initializers.xavier_uniform(), (1, 1, self.slot_dim))\n        slots_log_sigma\
    \ = self.param('slots_log_sigma', nn.initializers.xavier_uniform(), (1, 1, self.slot_dim))\n\
    \        \n        key = self.make_rng('params')\n        slots = slots_mu + jnp.exp(slots_log_sigma)\
    \ * jax.random.normal(key, (B, self.num_slots, self.slot_dim))\n\n        norm_inputs\
    \ = nn.LayerNorm()(inputs_flat)\n        \n        for _ in range(self.iters):\n\
    \            norm_slots = nn.LayerNorm()(slots)\n            attn = jnp.einsum('bic,bjc->bij',\
    \ norm_inputs, norm_slots) * (self.slot_dim ** -0.5)\n            attn = nn.softmax(attn,\
    \ axis=1)\n            \n            updates = jnp.einsum('bij,bic->bjc', attn,\
    \ inputs_flat)\n            \n            # Using a GRU for the update rule is\
    \ common\n            gru = nn.GRUCell()\n            slots, _ = jax.vmap(gru)(slots,\
    \ updates)\n\n        return slots # Shape: [B, num_slots, slot_dim]\n\nclass\
    \ SlotAttentionNet(nn.Module):\n    num_slots: int = 10 # More than enough for\
    \ all objects\n    slot_dim: int = 128\n    \n    @nn.compact\n    def __call__(self,\
    \ x, done, rnn_state=None):\n        # Using a simple CNN backbone for this first\
    \ test\n        x = nn.Conv(features=32, kernel_size=(3,3), padding='SAME')(x);\
    \ x = nn.relu(x)\n        x = nn.Conv(features=32, kernel_size=(3,3), padding='SAME')(x);\
    \ x = nn.relu(x)\n        x = nn.Conv(features=64, kernel_size=(3,3), padding='SAME')(x);\
    \ x = nn.relu(x)\n        x = nn.Conv(features=64, kernel_size=(3,3), padding='SAME')(x);\
    \ x = nn.relu(x)\n\n        # Slot Attention\n        slots = SlotAttention(num_slots=self.num_slots,\
    \ slot_dim=self.slot_dim)(x)\n        \n        # Flatten all slots and process\
    \ with an MLP\n        slots_flat = slots.reshape(x.shape[0], -1) \n        \n\
    \        x = nn.Dense(features=256)(slots_flat); x = nn.relu(x)\n        x = nn.Dense(features=128)(x);\
    \ x = nn.relu(x)\n\n        policy_logits = nn.Dense(features=4)(x)\n        value\
    \ = nn.Dense(features=1)(x).squeeze(-1)\n        \n        return policy_logits,\
    \ value, None # No recurrent state\n        \ndef create_network(hparams):\n \
    \   return SlotAttentionNet()\n```\n"
