abstract: 'This capsule contains a draft implementation of a multi-epoch PPO training
  step that is compatible with recurrent neural networks like LSTMs. Unlike previous
  flawed attempts, this version correctly handles temporal dependencies by shuffling
  environments rather than individual timesteps, ensuring the RNN hidden state is
  passed correctly during the minibatch update phase.

  '
