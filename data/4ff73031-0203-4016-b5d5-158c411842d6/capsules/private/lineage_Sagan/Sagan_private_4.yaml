  title: 'Experiment 4 Plan: Multi-Epoch PPO'
  content: "## Research Plan: Experiment 4 - Multi-Epoch PPO\n\n**Objective:** To\
    \ implement and test a canonical version of PPO featuring multiple training epochs\
    \ and mini-batching over each collected trajectory.\n\n**Hypothesis:** The failure\
    \ of Experiment 3a was due to an incorrect, single-update implementation. A multi-epoch\
    \ PPO implementation will align with established best practices, leading to better\
    \ data utilization, more stable policy updates, and a final score superior to\
    \ the baseline policy gradient method.\n\n**Experimental Series:**\n1.  **Experiment\
    \ 4a:** Implement the multi-epoch PPO `training_step` with the baseline `CNNLSTM`\
    \ architecture. This will be a direct, controlled test of the corrected algorithm.\n\
    2.  **Experiment 4b (Conditional):** If 4a is successful, combine the multi-epoch\
    \ PPO `training_step` with my `CNN_SE_LSTM` architecture.\n\n---\n\n## Multi-Epoch\
    \ PPO Implementation Code (for Experiment 4a)\n\nThis code for `submission.py`\
    \ implements the corrected PPO algorithm. It includes new hyperparameters for\
    \ the number of epochs and mini-batches. It uses the `sagan/architectures.py`\
    \ file to load the SOTA `CNNLSTM` model.\n\n```python\n\"\"\"\nSubmission by Sagan\
    \ I.\nExperiment 4a: Multi-Epoch PPO with baseline RNN.\nThis is a corrected PPO\
    \ implementation that performs multiple gradient\nupdates per collected trajectory,\
    \ which is standard practice.\n\"\"\"\n\nimport sys\nsys.path.append('storage/sagan')\n\
    import jax\nimport jax.numpy as jnp\nfrom jax import vmap, jit, lax\nimport flax.linen\
    \ as nn\nfrom ray import tune\nimport optax\nfrom typing import Tuple, Dict, Any,\
    \ Optional\n\n# Import baseline architecture\nfrom architectures import CNN_SE_LSTM\
    \ # Note: Will just use CNNLSTM from System for now\n\n# --- Hyperparameters ---\n\
    def _define_hyperparameters():\n    return {\n        'learning_rate': tune.choice([4e-4]),\n\
    \        'entropy_coef': tune.choice([0.01]),\n        'value_loss_coef': tune.choice([0.5]),\n\
    \        'clip_eps': tune.choice([0.2]),\n        'num_epochs': tune.choice([4]),\n\
    \        'num_minibatches': tune.choice([4]),\n        'cnn_features_1': tune.choice([32]),\n\
    \        'cnn_features_2': tune.choice([64]),\n        'lstm_features': tune.choice([256]),\n\
    \    }\n    \n# --- Baseline CNN-LSTM Architecture ---\nclass CNNLSTM(nn.Module):\n\
    \    lstm_features: int\n    cnn_features_1: int\n    cnn_features_2: int\n  \
    \  @nn.compact\n    def __call__(self, x, done, rnn_state):\n        B = x.shape[0]\n\
    \        if rnn_state is None: rnn_state = {'h':jnp.zeros((B,self.lstm_features)),'c':jnp.zeros((B,self.lstm_features))}\n\
    \        if done is not None:\n            mask = done.reshape(B,1)\n        \
    \    rnn_state = {'h':rnn_state['h']*(1-mask),'c':rnn_state['c']*(1-mask)}\n \
    \       x = nn.Conv(f=self.cnn_features_1,k=(3,3),p='SAME')(x); x = nn.relu(x)\n\
    \        i=x; x = nn.Conv(f=self.cnn_features_1,k=(3,3),p='SAME')(x); x = nn.relu(x)\n\
    \        x = nn.Conv(f=self.cnn_features_1,k=(3,3),p='SAME')(x); x=x+i; x = nn.relu(x)\n\
    \        x = nn.Conv(f=self.cnn_features_2,k=(3,3),p='SAME')(x); x = nn.relu(x)\n\
    \        i=x; x = nn.Conv(f=self.cnn_features_2,k=(3,3),p='SAME')(x); x = nn.relu(x)\n\
    \        x = nn.Conv(f=self.cnn_features_2,k=(3,3),p='SAME')(x); x=x+i; x = nn.relu(x)\n\
    \        x=x.reshape((B,-1)); x = nn.Dense(f=256)(x); x = nn.relu(x)\n       \
    \ (c,h),o = nn.LSTMCell(f=self.lstm_features)((rnn_state['c'],rnn_state['h']),x)\n\
    \        rnn_state={'c':c,'h':h}; x = nn.Dense(f=128)(o); x = nn.relu(x)\n   \
    \     return nn.Dense(f=4)(x), nn.Dense(f=1)(x).squeeze(-1), rnn_state\n\ndef\
    \ create_network(hparams):\n    return CNNLSTM(\n        lstm_features=hparams['lstm_features'],\n\
    \        cnn_features_1=hparams['cnn_features_1'],\n        cnn_features_2=hparams['cnn_features_2']\n\
    \    )\n\n@jit\ndef calculate_gae(r,v,d,nv,g=0.97,l=0.97):\n    v1=jnp.concatenate([v[:,1:],nv[:,None]],1);\
    \ nm=(1.0-d.astype(jnp.float32))\n    dl=r+g*v1*nm-v\n    def f(a,t): a=dl[:,t]+g*l*nm[:,t]*a;\
    \ return a,a\n    _,a=lax.scan(f,jnp.zeros(v.shape[0]),jnp.arange(v.shape[1]-1,-1,-1));\
    \ return a[::-1].T\n\n# --- Multi-Epoch PPO Training Step ---\ndef training_step(network,\
    \ optimizer, params, opt_state, batch, hparams):\n    \n    def update_epoch(carry,\
    \ _):\n        params, opt_state, key = carry\n        \n        # Shuffle data\n\
    \        B, T = batch['observations'].shape[:2]\n        key, subkey = jax.random.split(key)\n\
    \        permutation = jax.random.permutation(subkey, B * T)\n        \n     \
    \   def flatten(x): return x.reshape((B * T, *x.shape[2:]))\n        batch_flat\
    \ = jax.tree.map(flatten, batch)\n        shuffled_batch = jax.tree.map(lambda\
    \ x: x[permutation], batch_flat)\n        \n        # Minibatch updates\n    \
    \    minibatch_size = (B * T) // hparams['num_minibatches']\n        \n      \
    \  def update_minibatch(carry, i):\n            params, opt_state = carry\n  \
    \          start, end = i * minibatch_size, (i + 1) * minibatch_size\n       \
    \     minibatch = jax.tree.map(lambda x: x[start:end], shuffled_batch)\n     \
    \       \n            # GAE and returns are calculated once per trajectory batch\n\
    \            advantages = calculate_gae(minibatch['rewards'].reshape(-1, T), minibatch['values'].reshape(-1,\
    \ T), minibatch['dones'].reshape(-1, T), next_values=minibatch['final_values'].reshape(-1,\
    \ T)[:, -1])\n            returns = advantages + minibatch['values']\n       \
    \     advantages = (advantages - advantages.mean()) / (advantages.std() + 1e-8)\n\
    \            \n            def loss_fn(p):\n                # Note: This PPO version\
    \ for feedforward nets is simpler and does not use RNN state.\n              \
    \  # A full RNN PPO implementation over minibatches is more complex. This is an\
    \ approximation.\n                logits, values, _ = network.apply(p, minibatch['observations'],\
    \ None, None)\n                log_probs_all = jax.nn.log_softmax(logits)\n  \
    \              new_log_probs = jnp.take_along_axis(log_probs_all, minibatch['actions'][:,\
    \ None], axis=1).squeeze()\n\n                ratio = jnp.exp(new_log_probs -\
    \ minibatch['log_probs'])\n                adv_d = jax.lax.stop_gradient(advantages.flatten())\n\
    \                \n                surr1 = ratio * adv_d\n                surr2\
    \ = jnp.clip(ratio, 1.0 - hparams['clip_eps'], 1.0 + hparams['clip_eps']) * adv_d\n\
    \                policy_loss = -jnp.mean(jnp.minimum(surr1, surr2))\n        \
    \        \n                value_loss = 0.5 * jnp.mean((values - jax.lax.stop_gradient(returns.flatten()))\
    \ ** 2)\n                entropy = -jnp.mean(jnp.sum(jax.nn.softmax(logits) *\
    \ log_probs_all, axis=-1))\n                \n                return policy_loss\
    \ + hparams['value_loss_coef'] * value_loss - hparams['entropy_coef'] * entropy\n\
    \n            loss, grads = jax.value_and_grad(loss_fn)(params)\n            updates,\
    \ opt_state = optimizer.update(grads, opt_state, params)\n            params =\
    \ optax.apply_updates(params, updates)\n            return (params, opt_state),\
    \ None\n        \n        (params, opt_state), _ = lax.scan(update_minibatch,\
    \ (params, opt_state), jnp.arange(hparams['num_minibatches']))\n        return\
    \ (params, opt_state, key), None\n\n    initial_key = jax.random.PRNGKey(0)\n\
    \    (params, opt_state, _), _ = lax.scan(update_epoch, (params, opt_state, initial_key),\
    \ None, length=hparams['num_epochs'])\n    return params, opt_state\n```\n"
