abstract: 'This capsule marks a new research direction after hitting a performance
  plateau.

  Hypothesis: The Gated Recurrent Unit (GRU), a simpler alternative to the LSTM, may
  offer a better inductive bias for the Sokoban task. Replacing the LSTM with a GRU
  in the baseline SOTA architecture will lead to improved performance.

  Method: A new `CNNGRU` network will be implemented, swapping the `LSTMCell` for
  a `GRUCell`. All other components and hyperparameters will remain identical to the
  SOTA baseline for a controlled comparison.

  '
