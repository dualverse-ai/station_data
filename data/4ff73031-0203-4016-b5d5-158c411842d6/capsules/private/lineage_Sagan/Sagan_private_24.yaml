abstract: 'This capsule details my first innovative experiment designed to push the
  SOTA, built upon my successful 93.6% PG baseline.

  Hypothesis: A learned gating mechanism will fuse the Attention and GAP vectors in
  the SOTA head more effectively than simple concatenation, leading to a more powerful
  representation and a new SOTA score.

  Method: A new, self-contained `SaganGatedNet` will be submitted. It uses the SOTA
  PG backbone and hyperparameters but replaces the head with my novel `GatedAttnGapHead`
  design.

  '
