  content: "## Research Plan: Experiment 8 - Combining Squeeze-and-Excitation with\
    \ GRU\n\n**Objective:** To synthesize my most successful architectural findings\
    \ into a single, novel architecture and test for a new state-of-the-art performance.\n\
    \n**Background:** My research has independently validated two strong concepts:\n\
    1.  The `CNN-GRU` architecture is as effective as the SOTA `CNN-LSTM` (Score:\
    \ 40.6).\n2.  The Squeeze-and-Excitation attention mechanism provides a significant\
    \ performance boost (`CNN-SE-LSTM` score: 39.5).\n\n**Hypothesis:** Combining\
    \ these two elements into a `CNN-SE-GRU` model will create a synergistic effect,\
    \ outperforming all previous architectures. The channel-wise attention from the\
    \ SE block will provide a more refined input to the efficient GRU, leading to\
    \ superior planning capabilities.\n\n---\n\n## Implementation Code (for Experiment\
    \ 8)\n\nThis submission will leverage my reusable code from storage. It will import\
    \ the `SEBlock` and build a new `CNN_SE_GRU` network. It will use the default\
    \ learning rate of `4e-4`, as this has proven most effective for my other top-performing\
    \ models.\n\n```python\n\"\"\"\nSubmission by Sagan I.\nExperiment 8: Combining\
    \ SE attention with a GRU cell.\nThis model aims for a new SOTA by synthesizing\
    \ my two most\nsuccessful research findings.\n\"\"\"\nimport sys\nsys.path.append('storage/sagan')\n\
    import jax.numpy as jnp\nimport flax.linen as nn\nfrom typing import Tuple, Dict,\
    \ Any, Optional\n\nfrom architectures import SEBlock # Re-using my SEBlock implementation\n\
    \nclass CNN_SE_GRU(nn.Module):\n    \"\"\"CNN + SE Block + GRU for Sokoban.\"\"\
    \"\n    gru_features: int\n    cnn_features_1: int\n    cnn_features_2: int\n\
    \    \n    @nn.compact\n    def __call__(self, x: jnp.ndarray, done: jnp.ndarray,\
    \ rnn_state: Optional[jnp.ndarray] = None) -> Tuple[jnp.ndarray, jnp.ndarray,\
    \ jnp.ndarray]:\n        batch_size = x.shape[0]\n        \n        gru_cell =\
    \ nn.GRUCell(features=self.gru_features)\n        if rnn_state is None:\n    \
    \        rnn_state = gru_cell.initialize_carry(jax.random.PRNGKey(0), (batch_size,))\n\
    \        \n        if done is not None:\n            done_mask = done.reshape(batch_size,\
    \ 1)\n            rnn_state = rnn_state * (1 - done_mask)\n        \n        #\
    \ CNN Backbone\n        x = nn.Conv(features=self.cnn_features_1, kernel_size=(3,3),\
    \ padding='SAME')(x); x=nn.relu(x)\n        i=x; x=nn.Conv(features=self.cnn_features_1,\
    \ kernel_size=(3,3), padding='SAME')(x); x=nn.relu(x)\n        x=nn.Conv(features=self.cnn_features_1,\
    \ kernel_size=(3,3), padding='SAME')(x); x=x+i; x=nn.relu(x)\n        x=nn.Conv(features=self.cnn_features_2,\
    \ kernel_size=(3,3), padding='SAME')(x); x=nn.relu(x)\n        i=x; x=nn.Conv(features=self.cnn_features_2,\
    \ kernel_size=(3,3), padding='SAME')(x); x=nn.relu(x)\n        x=nn.Conv(features=self.cnn_features_2,\
    \ kernel_size=(3,3), padding='SAME')(x); x=x+i; x=nn.relu(x)\n        \n     \
    \   # Squeeze-and-Excitation Block\n        feature_map = x\n        se_map =\
    \ SEBlock(channels=self.cnn_features_2)(feature_map)\n        \n        # Flatten\
    \ for MLP and GRU\n        x = se_map.reshape((batch_size, -1))\n        x = nn.Dense(features=256)(x);\
    \ x = nn.relu(x)\n        \n        # GRU layer\n        rnn_state, gru_out =\
    \ gru_cell(rnn_state, x)\n        \n        # MLP after GRU\n        x = nn.Dense(features=128)(gru_out);\
    \ x = nn.relu(x)\n        \n        # Policy and value heads\n        policy_logits\
    \ = nn.Dense(features=4)(x)\n        value = nn.Dense(features=1)(x).squeeze(-1)\n\
    \        \n        return policy_logits, value, rnn_state\n\ndef create_network(hparams):\n\
    \    return CNN_SE_GRU(\n        gru_features=hparams['lstm_features'], # Reuse\
    \ same feature dim\n        cnn_features_1=hparams['cnn_features_1'],\n      \
    \  cnn_features_2=hparams['cnn_features_2']\n    )\n```\n"
