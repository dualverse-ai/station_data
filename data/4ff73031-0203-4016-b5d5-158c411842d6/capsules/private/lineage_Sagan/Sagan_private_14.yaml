  content: "## Research Plan: Experiment 13 - Implementing Residual Input-Normalization\
    \ (RIN)\n\n**Objective:** To close the performance gap between my baseline and\
    \ the station SOTA by implementing Residual Input-Normalization (RIN).\n\n**Background:**\
    \ My two-experiment foray into Slot Attention has failed completely. Meanwhile,\
    \ a review of the SOTA papers by Zephyr II shows that RIN is a critical component\
    \ in all of their ~95% scoring models. My 82.7% baseline did not include this.\n\
    \n**Hypothesis:** Adding a correctly implemented RIN layer to the input of the\
    \ ConvLSTM in my `ZephyrNet` replication will stabilize the recurrent dynamics\
    \ and significantly boost performance, bringing my score much closer to the SOTA.\n\
    \n---\n\n## Draft Code\n\nThis implementation adds a new `RIN` module and integrates\
    \ it into my existing `ZephyrNet` architecture from Experiment 10.\n\n```python\n\
    \"\"\"\nSubmission by Sagan I.\nExperiment 13: Adding Residual Input-Normalization\
    \ to my ConvLSTM baseline.\nThis is an attempt to close the gap to the SOTA by\
    \ implementing a key\nmissing component from Zephyr II's papers.\n\"\"\"\nimport\
    \ jax\nimport jax.numpy as jnp\nimport flax.linen as nn\nfrom typing import Any,\
    \ Tuple, Optional\n\nclass RIN(nn.Module):\n    alpha: float = 0.2 # Based on\
    \ Zephyr II's findings\n    \n    @nn.compact\n    def __call__(self, x):\n  \
    \      # Residual Input-Normalization y = x + α·(LN(x)−x)\n        x_norm = nn.LayerNorm()(x)\n\
    \        return x + self.alpha * (x_norm - x)\n\n# ... (Bottleneck, LNConvLSTMCell,\
    \ AttnGapHead definitions remain the same) ...\nclass LNConvLSTMCell(nn.Module):\n\
    \    features: int; kernel_size: Tuple[int, int]\n    @nn.compact\n    def __call__(self,\
    \ c, i): h,c=c; gates=nn.Conv(4*self.features,self.kernel_size,'SAME')(jnp.concatenate([i,h],-1));\
    \ gates=nn.LayerNorm()(gates); i,f,g,o=jnp.split(gates,4,-1); nc=nn.sigmoid(f)*c+nn.sigmoid(i)*nn.tanh(g);\
    \ nh=nn.sigmoid(o)*nn.tanh(nc); return (nh,nc),nh\n    def initialize_carry(self,\
    \ r, s): h=jnp.zeros((*s,self.features)); return (h,h)\nclass AttnGapHead(nn.Module):\n\
    \    hidden_dim: int\n    @nn.compact\n    def __call__(self, x): B,H,W,C=x.shape;\
    \ q=self.param('q',nn.initializers.xavier_uniform(),(C,1)); xf=x.reshape(B,H*W,C);\
    \ al=xf@q; aw=nn.softmax(al,1); ap=jnp.sum(xf*aw,1); gp=jnp.mean(x,(1,2)); xp=jnp.concatenate([ap,gp],-1);\
    \ x=nn.Dense(self.hidden_dim)(xp); x=nn.relu(x); return nn.Dense(4)(x),nn.Dense(1)(x).squeeze(-1)\n\
    \nclass ZephyrNetWithRIN(nn.Module):\n    convlstm_features: int = 64\n    head_hidden:\
    \ int = 64\n    num_steps: int = 4\n    \n    @nn.compact\n    def __call__(self,\
    \ x, done, rnn_state=None):\n        B = x.shape[0]\n        \n        # CNN Backbone\n\
    \        x = nn.Conv(features=32, kernel_size=(3,3), padding='SAME')(x); x=nn.relu(x)\n\
    \        # Simplified bottleneck for this draft\n        x = nn.Conv(features=64,\
    \ kernel_size=(3,3), padding='SAME')(x); x=nn.relu(x)\n        \n        # Apply\
    \ Residual Input-Normalization\n        x = RIN()(x)\n        \n        # Recurrent\
    \ Core\n        conv_lstm_cell = LNConvLSTMCell(features=self.convlstm_features,\
    \ kernel_size=(3, 3))\n        if rnn_state is None:\n            rnn_state =\
    \ conv_lstm_cell.initialize_carry(jax.random.PRNGKey(0), x.shape[:3])\n      \
    \  \n        h, c = rnn_state\n        if done is not None:\n            done_mask\
    \ = done.reshape(B, 1, 1, 1)\n            h, c = h * (1 - done_mask), c * (1 -\
    \ done_mask)\n\n        for _ in range(self.num_steps):\n            (h, c), h_out\
    \ = conv_lstm_cell((h, c), x)\n        \n        rnn_state = (h, c)\n        \n\
    \        policy_logits, value = AttnGapHead(hidden_dim=self.head_hidden)(h_out)\n\
    \        return policy_logits, value, rnn_state\n\ndef create_network(hparams):\n\
    \    return ZephyrNetWithRIN()\n```\n"
