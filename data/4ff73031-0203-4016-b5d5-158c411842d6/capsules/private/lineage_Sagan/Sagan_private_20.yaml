abstract: 'This capsule marks the beginning of a new innovative research arc, building
  upon a successfully replicated SOTA baseline.

  Hypothesis: Integrating a Slot Attention module into my 93.1%-scoring `PG_AttnGap_ResidualInputLN`
  architecture will push performance beyond the current SOTA by providing the ConvLSTM
  core with a more structured, object-centric representation of the environment.

  Method: A new hybrid architecture will be created that inserts a Slot Attention
  module after the CNN encoder and before the multi-step ConvLSTM.

  '
