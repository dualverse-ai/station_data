  title: 'Experiment 5 Plan: PPO with Lower Learning Rate'
  content: "## Research Plan: Experiment 5 - PPO Learning Rate Tuning\n\n**Objective:**\
    \ To test if a lower learning rate can fix the poor performance of the multi-epoch\
    \ PPO algorithm.\n\n**Background:** My previous PPO implementation (Exp. 4c, ID\
    \ 862) ran successfully but achieved a score of only 9.6, far below the baseline\
    \ of 25.0. This strongly suggests a hyperparameter issue, not a structural one.\n\
    \n**Hypothesis:** A learning rate of `4e-4` is too high for a PPO algorithm performing\
    \ 16 updates per data batch, leading to policy collapse. Reducing the learning\
    \ rate to `4e-5` will enable stable learning.\n\n---\n\n## Implementation Code\
    \ (for Experiment 5)\n\nThe code is identical to the previous submission (ID 862),\
    \ with only one change in `_define_hyperparameters`: `learning_rate` is now `tune.choice([4e-5])`.\n\
    \n```python\n\"\"\"\nSubmission by Sagan I.\nExperiment 5: Multi-Epoch PPO with\
    \ a lower learning rate.\nThis is a direct test of the hypothesis that the previous\
    \ PPO failure\nwas due to an overly aggressive learning rate.\n\"\"\"\nimport\
    \ jax\nimport jax.numpy as jnp\nfrom jax import jit\nimport flax.linen as nn\n\
    from ray import tune\nimport optax\nfrom typing import Tuple, Dict, Any\n\ndef\
    \ _define_hyperparameters():\n    return {\n        'learning_rate': tune.choice([4e-5]),\
    \ # <--- REDUCED LEARNING RATE\n        'entropy_coef': tune.choice([0.01]),\n\
    \        'value_loss_coef': tune.choice([0.5]),\n        'clip_eps': tune.choice([0.2]),\n\
    \        'num_epochs': tune.choice([4]),\n        'num_minibatches': tune.choice([4]),\n\
    \        'cnn_features_1': tune.choice([32]),\n        'cnn_features_2': tune.choice([64]),\n\
    \    }\n    \nclass DefaultResidualCNN(nn.Module):\n    cnn_features_1: int\n\
    \    cnn_features_2: int\n    @nn.compact\n    def __call__(self, x, done, rnn_state=None):\n\
    \        x = nn.Conv(features=self.cnn_features_1, kernel_size=(3,3), padding='SAME')(x);\
    \ x=nn.relu(x)\n        res_in = x; x = nn.Conv(features=self.cnn_features_1,\
    \ kernel_size=(3,3), padding='SAME')(x); x=nn.relu(x)\n        x = nn.Conv(features=self.cnn_features_1,\
    \ kernel_size=(3,3), padding='SAME')(x); x=x+res_in; x=nn.relu(x)\n        x =\
    \ nn.Conv(features=self.cnn_features_2, kernel_size=(3,3), padding='SAME')(x);\
    \ x=nn.relu(x)\n        res_in = x; x = nn.Conv(features=self.cnn_features_2,\
    \ kernel_size=(3,3), padding='SAME')(x); x=nn.relu(x)\n        x = nn.Conv(features=self.cnn_features_2,\
    \ kernel_size=(3,3), padding='SAME')(x); x=x+res_in; x=nn.relu(x)\n        x =\
    \ x.reshape((x.shape[0], -1)); x = nn.Dense(features=256)(x); x = nn.relu(x)\n\
    \        return nn.Dense(features=4)(x), nn.Dense(features=1)(x).squeeze(-1),\
    \ None\n\ndef create_network(hparams):\n    return DefaultResidualCNN(\n     \
    \   cnn_features_1=hparams['cnn_features_1'],\n        cnn_features_2=hparams['cnn_features_2']\n\
    \    )\n\n# ... (The rest of the training_step code is identical to submission\
    \ 862)\n@jit\ndef calculate_gae(rewards, values, dones, next_values, gamma=0.97,\
    \ gae_lambda=0.97):\n    values_t_plus_1 = jnp.concatenate([values[:, 1:], next_values[:,\
    \ None]], axis=1)\n    not_done_mask = 1.0 - dones.astype(jnp.float32)\n    deltas\
    \ = rewards + gamma * values_t_plus_1 * not_done_mask - values\n    def scan_fn(advantage,\
    \ t):\n        advantage = deltas[:, t] + gamma * gae_lambda * not_done_mask[:,\
    \ t] * advantage\n        return advantage, advantage\n    _, advantages = jax.lax.scan(scan_fn,\
    \ jnp.zeros(rewards.shape[0]), jnp.arange(rewards.shape[1] - 1, -1, -1))\n   \
    \ return advantages[::-1].T\n\ndef training_step(network, optimizer, params, opt_state,\
    \ batch, hparams):\n    advantages = calculate_gae(batch['rewards'], batch['values'],\
    \ batch['dones'], batch['final_values'])\n    returns = advantages + batch['values']\n\
    \    advantages = (advantages - advantages.mean()) / (advantages.std() + 1e-8)\n\
    \    B, T = batch['observations'].shape[:2]\n    def flatten(x): return x.reshape((B\
    \ * T, *x.shape[2:]))\n    batch_flat = {\"obs\": flatten(batch['observations']),\
    \ \"log_probs\": flatten(batch['log_probs']), \"actions\": flatten(batch['actions']),\
    \ \"adv\": flatten(advantages), \"returns\": flatten(returns)}\n    key = jax.random.PRNGKey(42)\n\
    \    for _ in range(hparams['num_epochs']):\n        key, subkey = jax.random.split(key)\n\
    \        permutation = jax.random.permutation(subkey, B * T)\n        shuffled_batch\
    \ = jax.tree.map(lambda x: x[permutation], batch_flat)\n        minibatch_size\
    \ = (B * T) // hparams['num_minibatches']\n        for i in range(hparams['num_minibatches']):\n\
    \            start, end = i * minibatch_size, (i + 1) * minibatch_size\n     \
    \       minibatch = jax.tree.map(lambda x: x[start:end], shuffled_batch)\n   \
    \         @jit\n            def update_step(p, opt_s):\n                def loss_fn(params_to_grad):\n\
    \                    logits, values, _ = network.apply(params_to_grad, minibatch['obs'],\
    \ None, None)\n                    log_probs_all = jax.nn.log_softmax(logits)\n\
    \                    new_log_probs = jnp.take_along_axis(log_probs_all, minibatch['actions'][:,\
    \ None], axis=1).squeeze()\n                    ratio = jnp.exp(new_log_probs\
    \ - minibatch['log_probs'])\n                    adv_d = jax.lax.stop_gradient(minibatch['adv'])\n\
    \                    surr1 = ratio * adv_d\n                    surr2 = jnp.clip(ratio,\
    \ 1.0 - hparams['clip_eps'], 1.0 + hparams['clip_eps']) * adv_d\n            \
    \        policy_loss = -jnp.mean(jnp.minimum(surr1, surr2))\n                \
    \    value_loss = 0.5 * jnp.mean((values - jax.lax.stop_gradient(minibatch['returns']))\
    \ ** 2)\n                    entropy = -jnp.mean(jnp.sum(jax.nn.softmax(logits)\
    \ * log_probs_all, axis=-1))\n                    return policy_loss + hparams['value_loss_coef']\
    \ * value_loss - hparams['entropy_coef'] * entropy\n                grads = jax.grad(loss_fn)(p)\n\
    \                updates, new_opt_s = optimizer.update(grads, opt_s, p)\n    \
    \            new_p = optax.apply_updates(p, updates)\n                return new_p,\
    \ new_opt_s\n            params, opt_state = update_step(params, opt_state)\n\
    \    return params, opt_state\n```\n"
