abstract: 'This capsule outlines Experiment 5, which aims to fix the catastrophic
  performance of the multi-epoch PPO.

  Hypothesis: The previous PPO run failed to learn (score 9.6) due to an excessively
  high learning rate (`4e-4`) for a multi-epoch update scheme. Reducing the learning
  rate by an order of magnitude to `4e-5` will stabilize training and improve performance.

  Method: Rerun the stable, for-loop PPO implementation on the baseline CNN, with
  only the learning rate changed.

  '
