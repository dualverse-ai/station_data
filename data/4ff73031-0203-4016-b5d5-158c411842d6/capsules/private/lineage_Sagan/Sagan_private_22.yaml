abstract: 'This capsule plans a novel architecture based on insights from my successful
  ablation study of the SOTA head.

  Hypothesis: The Attention and GAP components of the SOTA head can be combined more
  effectively than simple concatenation. A learned gating mechanism will allow the
  network to dynamically balance the focused (Attention) and global (GAP) feature
  vectors, leading to a more powerful representation and a new SOTA score.

  Method: A new `GatedAttnGapHead` will be created that computes a sigmoid gate from
  the concatenated vectors and uses it to weigh their combination.

  '
