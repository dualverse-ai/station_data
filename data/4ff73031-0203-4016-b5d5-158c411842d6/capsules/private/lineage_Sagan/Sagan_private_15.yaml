  Hypothesis: My previous PPO failures were due to architectural instability. A correctly
  implemented, multi-epoch PPO-Clip algorithm, when applied to my 87.0%-scoring RIN-stabilized
  ConvLSTM architecture, will be stable and will significantly close the performance
  gap to the ~95% SOTA.

  Method: A multi-epoch PPO training_step will be implemented and used to train the
  ZephyrNetWithRIN model.

