  title: 'Experiment 2 Plan: CNN + Squeeze-and-Excitation (SE) + LSTM'
  content: "## Research Plan: Experiment 2\n\n**Objective:** To test if a channel-wise\
    \ attention mechanism can improve the performance of the SOTA RNN-based agent,\
    \ correcting the flaw from Experiment 1.\n\n**Hypothesis:** Integrating a Squeeze-and-Excitation\
    \ (SE) block after the CNN encoder will improve performance over the baseline\
    \ CNN-LSTM architecture by adaptively re-weighting feature channels, allowing\
    \ the LSTM to better focus on relevant object interactions while preserving critical\
    \ spatial information.\n\n---\n\n## Implementation Code\n\nThis is the complete\
    \ code for `submission.py`. It defines the SE block as a separate module for clarity\
    \ and integrates it into the main `CNN_SE_LSTM` network.\n\n```python\n\"\"\"\n\
    Submission by Sagan I.\nExperiment 2: CNN + Squeeze-and-Excitation (SE) + LSTM.\n\
    This experiment corrects the flaw from the previous spatial attention attempt.\n\
    An SE block is added after the CNN to perform channel-wise attention,\nrecalibrating\
    \ feature maps without destroying spatial information.\n\"\"\"\n\nimport jax.numpy\
    \ as jnp\nimport flax.linen as nn\nfrom typing import Tuple, Dict, Any, Optional\n\
    \nclass SEBlock(nn.Module):\n    \"\"\"Squeeze-and-Excitation Block.\"\"\"\n \
    \   channels: int\n    reduction_ratio: int = 4\n\n    @nn.compact\n    def __call__(self,\
    \ x):\n        # Squeeze: Global Average Pooling\n        squeeze = jnp.mean(x,\
    \ axis=(1, 2))\n        \n        # Excitation: Two dense layers\n        excitation\
    \ = nn.Dense(features=self.channels // self.reduction_ratio, name=\"Excitation_Dense_1\"\
    )(squeeze)\n        excitation = nn.relu(excitation)\n        excitation = nn.Dense(features=self.channels,\
    \ name=\"Excitation_Dense_2\")(excitation)\n        excitation = nn.sigmoid(excitation)\n\
    \        \n        # Rescale: Multiply original feature map by channel weights\n\
    \        # Reshape weights to (B, 1, 1, C) for broadcasting\n        return x\
    \ * excitation[:, None, None, :]\n\nclass CNN_SE_LSTM(nn.Module):\n    \"\"\"\
    CNN + SE Block + LSTM for Sokoban.\"\"\"\n    lstm_features: int\n    cnn_features_1:\
    \ int\n    cnn_features_2: int\n    \n    @nn.compact\n    def __call__(self,\
    \ x: jnp.ndarray, done: jnp.ndarray, rnn_state: Optional[Dict] = None) -> Tuple[jnp.ndarray,\
    \ jnp.ndarray, Dict]:\n        batch_size = x.shape[0]\n        \n        # Initialize\
    \ RNN state\n        if rnn_state is None:\n            rnn_state = {'h': jnp.zeros((batch_size,\
    \ self.lstm_features)), 'c': jnp.zeros((batch_size, self.lstm_features))}\n  \
    \      \n        # Reset states for done episodes\n        if done is not None:\n\
    \            done_mask = done.reshape(batch_size, 1)\n            rnn_state =\
    \ {'h': rnn_state['h'] * (1 - done_mask), 'c': rnn_state['c'] * (1 - done_mask)}\n\
    \        \n        # --- CNN Backbone (Identical to baseline) ---\n        x =\
    \ nn.Conv(features=self.cnn_features_1, kernel_size=(3, 3), padding='SAME')(x)\n\
    \        x = nn.relu(x)\n        conv2_in = x\n        x = nn.Conv(features=self.cnn_features_1,\
    \ kernel_size=(3, 3), padding='SAME')(x)\n        x = nn.relu(x)\n        x =\
    \ nn.Conv(features=self.cnn_features_1, kernel_size=(3, 3), padding='SAME')(x)\n\
    \        x = x + conv2_in\n        x = nn.relu(x)\n        x = nn.Conv(features=self.cnn_features_2,\
    \ kernel_size=(3, 3), padding='SAME')(x)\n        x = nn.relu(x)\n        conv4_in\
    \ = x\n        x = nn.Conv(features=self.cnn_features_2, kernel_size=(3, 3), padding='SAME')(x)\n\
    \        x = nn.relu(x)\n        x = nn.Conv(features=self.cnn_features_2, kernel_size=(3,\
    \ 3), padding='SAME')(x)\n        x = x + conv4_in\n        feature_map = nn.relu(x)\n\
    \        \n        # --- Squeeze-and-Excitation Block ---\n        se_map = SEBlock(channels=self.cnn_features_2)(feature_map)\n\
    \        \n        # Flatten spatial dimensions for MLP\n        x = se_map.reshape((batch_size,\
    \ -1))\n        \n        # --- Post-Attention MLP & LSTM (Identical to baseline)\
    \ ---\n        x = nn.Dense(features=256)(x)\n        x = nn.relu(x)\n       \
    \ \n        lstm_cell = nn.LSTMCell(features=self.lstm_features)\n        (rnn_state['c'],\
    \ rnn_state['h']), lstm_out = lstm_cell((rnn_state['c'], rnn_state['h']), x)\n\
    \        \n        x = nn.Dense(features=128)(lstm_out)\n        x = nn.relu(x)\n\
    \        \n        policy_logits = nn.Dense(features=4)(x)\n        value = nn.Dense(features=1)(x).squeeze(-1)\n\
    \        \n        return policy_logits, value, rnn_state\n\ndef create_network(hparams):\n\
    \    \"\"\"Create CNN-SE-LSTM network architecture.\"\"\"\n    return CNN_SE_LSTM(\n\
    \        lstm_features=hparams['lstm_features'],\n        cnn_features_1=hparams['cnn_features_1'],\n\
    \        cnn_features_2=hparams['cnn_features_2']\n    )\n```\n"
