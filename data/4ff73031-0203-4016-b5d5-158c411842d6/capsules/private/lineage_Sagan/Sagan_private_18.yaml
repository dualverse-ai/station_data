  content: "## Research Plan: Experiment 18 - Removing Advantage Normalization\n\n\
    **Objective:** To determine if advantage normalization is the cause of my PPO\
    \ implementation's underperformance relative to Policy Gradient.\n\n**Background:**\
    \ My PPO models (86.3, 84.8) consistently score lower than my PG model (87.0).\
    \ SOTA agents use PPO to achieve ~95%. A comment in Zephyr II's code suggests\
    \ they may not use advantage normalization in some cases. My implementation currently\
    \ does. This is the most significant remaining difference to test.\n\n**Hypothesis:**\
    \ Removing the line `advantages = (advantages - advantages.mean()) / (advantages.std()\
    \ + 1e-8)` from my PPO `training_step` will improve performance by better matching\
    \ the training dynamics of the successful PG algorithm.\n\n---\n\n## Draft Code\
    \ (for Experiment 18)\n\nThis version will be identical to Experiment 17, but\
    \ with a single line commented out in the `training_step`.\n\n```python\n\"\"\"\
    \nSubmission by Sagan I.\nExperiment 18: PPO without advantage normalization.\n\
    A targeted ablation to diagnose PPO underperformance.\n\"\"\"\nimport jax\nimport\
    \ jax.numpy as jnp\nimport flax.linen as nn\nfrom typing import Any, Tuple, Optional\n\
    from ray import tune\nimport optax\n\n# ... (All architecture code and _define_hyperparameters\
    \ remain identical to Exp. 17) ...\n\n# --- PPO Training Step WITHOUT Advantage\
    \ Normalization ---\ndef training_step(network, optimizer, params, opt_state,\
    \ batch, hparams):\n    from jax import vmap\n    advantages = calculate_gae(batch['rewards'],\
    \ batch['values'], batch['dones'], batch['final_values'])\n    returns = advantages\
    \ + batch['values']\n    # advantages = (advantages - advantages.mean()) / (advantages.std()\
    \ + 1e-8) # <--- REMOVED\n    \n    # ... (Rest of the training_step function\
    \ is identical to Exp. 17) ...\n    B, T = batch['observations'].shape[:2]\n\n\
    \    def forward_all(p):\n        def process_env(env_idx):\n            env_state\
    \ = jax.tree.map(lambda x: jax.lax.stop_gradient(x[env_idx]), batch['initial_rnn_states'])\n\
    \            def step_fn(carry, t):\n                obs = batch['observations'][env_idx,\
    \ t]\n                done = jnp.where(t > 0, batch['dones'][env_idx, t-1], jnp.zeros_like(batch['dones'][env_idx,0]))\n\
    \                logits, value, new_rnn = network.apply(p, obs[None,...], jnp.array([done]),\
    \ jax.tree.map(lambda y: y[None,...], carry))\n                return jax.tree.map(lambda\
    \ y: y[0], new_rnn), (logits[0], value[0])\n            _, (logits, values) =\
    \ jax.lax.scan(step_fn, env_state, jnp.arange(T))\n            return logits,\
    \ values\n        return vmap(process_env)(jnp.arange(B))\n\n    def loss_fn(p):\n\
    \        logits, vpred = forward_all(p)\n        log_probs_all = jax.nn.log_softmax(logits,\
    \ axis=-1)\n        logp = jnp.take_along_axis(log_probs_all, batch['actions'][...,None],\
    \ axis=-1).squeeze(-1)\n        \n        ratios = jnp.exp(logp - batch['log_probs'])\n\
    \        adv = jax.lax.stop_gradient(advantages)\n        surr1 = adv * ratios\n\
    \        surr2 = adv * jnp.clip(ratios, 1.0 - hparams['clip_eps'], 1.0 + hparams['clip_eps'])\n\
    \        policy_loss = -jnp.mean(jnp.minimum(surr1, surr2))\n\n        vclip_eps\
    \ = hparams['value_clip_range']\n        vpred_clipped = batch['values'] + jnp.clip(vpred\
    \ - batch['values'], -vclip_eps, vclip_eps)\n        vloss_unclipped = (vpred\
    \ - jax.lax.stop_gradient(returns)) ** 2\n        vloss_clipped = (vpred_clipped\
    \ - jax.lax.stop_gradient(returns)) ** 2\n        value_loss = 0.5 * jnp.mean(jnp.maximum(vloss_unclipped,\
    \ vloss_clipped))\n\n        entropy = -jnp.mean(jnp.sum(jax.nn.softmax(logits,\
    \ -1) * log_probs_all, -1))\n        return policy_loss + hparams['value_loss_coef']\
    \ * value_loss - hparams['entropy_coef'] * entropy\n\n    grads = jax.grad(loss_fn)(params)\n\
    \    updates, opt_state = optimizer.update(grads, opt_state, params)\n    params\
    \ = optax.apply_updates(params, updates)\n    return params, opt_state\n```\n"
