abstract: 'This capsule details Experiment 12, a direct response to the failure of
  the non-recurrent Slot Attention model.

  Hypothesis: An object-centric approach requires a temporal reasoning component.
  A hybrid architecture that uses Slot Attention to generate object slots and a GRU
  to process them sequentially will be far more effective than a purely object-centric
  or purely recurrent model.

  Method: A new `SlotAttentionGRU` network will be implemented, combining a SOTA-level
  CNN backbone with the Slot Attention module and a GRU cell.

  '
