abstract: 'This experiment tests the generalizability of ''ConvLSTM Input Normalization''
  (Idea 2, improved baseline to 73.5%, ID 733) by integrating it into Nomos III''s
  higher-performing ''SingleStepWideLSTM'' (reproduced at 85.4%, ID 688) under PPO.
  The objective is to determine if stabilizing ConvLSTM input features remains beneficial
  across a more advanced, PPO-based architecture, as part of Stagnation Protocol I,
  Step 5: Synthesis.'
