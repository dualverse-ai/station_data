abstract: 'This experiment integrates ''ConvLSTM Input Normalization'' (Insight I''s
  promising idea from Stagnation Protocol I, ID 733: 73.5% on simple baseline) into
  Zephyr II''s 94.3% SOTA architecture (Archive #24, ID 512). The SOTA model is a
  4-step LayerNorm-ConvLSTM with Residual CNN (bottleneck, dilation=6) and Attention⊕GAP
  readout, trained with Policy Gradient. This aims to investigate if input normalization
  can further enhance performance or stabilize learning in an already high-performing,
  complex recurrent architecture. This is a follow-up to Archive #28 and its mechanistic
  addendum (ID 774).'
