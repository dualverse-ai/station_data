  content: "import jax\nimport jax.numpy as jnp\nimport flax.linen as nn\nfrom typing\
    \ import Tuple, Dict, Any, Optional\nfrom ray import tune\n\n# --- Network components\
    \ from zephyr/networks/cnn_convlstm_layernorm.py ---\nclass ResidualBlock(nn.Module):\n\
    \    features: int\n    @nn.compact\n    def __call__(self, x):\n        y = nn.Conv(self.features,\
    \ (3,3), padding='SAME',\n                    kernel_init=nn.initializers.xavier_uniform())(x)\n\
    \        y = nn.relu(y)\n        y = nn.Conv(self.features, (3,3), padding='SAME',\n\
    \                    kernel_init=nn.initializers.xavier_uniform())(y)\n      \
    \  return nn.relu(x + y)\n\nclass ConvLSTMCellLN(nn.Module):\n    features: int\n\
    \    kernel_size: Tuple[int,int] = (3,3)\n    @nn.compact\n    def __call__(self,\
    \ carry, x):\n        h, c = carry\n        gates = nn.Conv(4*self.features, self.kernel_size,\
    \ padding='SAME',\n                        kernel_init=nn.initializers.xavier_uniform())(jnp.concatenate([x,\
    \ h], axis=-1))\n        gates = nn.LayerNorm(epsilon=1e-5)(gates)  # per-pixel\
    \ LN over channels\n        i, f, g, o = jnp.split(gates, 4, axis=-1)\n      \
    \  i = nn.sigmoid(i); f = nn.sigmoid(f); o = nn.sigmoid(o); g = jnp.tanh(g)\n\
    \        c = f * c + i * g\n        h = o * jnp.tanh(c)\n        return (h, c),\
    \ h\n\nclass CNNConvLSTMLN_DualReadout(nn.Module): # Modified network name\n \
    \   \"\"\"Residual CNN + ConvLSTM (LayerNorm on gates) + Dual-Pathway Attention/Global\
    \ Pooling.\"\"\"\n    cnn_features_1: int\n    cnn_features_2: int\n    conv_lstm_features:\
    \ int\n    attn_temp: float = 1.0\n\n    @nn.compact\n    def __call__(self, x:\
    \ jnp.ndarray, done: jnp.ndarray, rnn_state: Optional[Dict] = None):\n       \
    \ B = x.shape[0]\n        # CNN backbone\n        x = nn.Conv(self.cnn_features_1,\
    \ (3,3), padding='SAME',\n                    kernel_init=nn.initializers.xavier_uniform())(x);\
    \ x = nn.relu(x)\n        x = ResidualBlock(self.cnn_features_1)(x)\n        x\
    \ = nn.Conv(self.cnn_features_2, (3,3), padding='SAME',\n                    kernel_init=nn.initializers.xavier_uniform())(x);\
    \ x = nn.relu(x)\n        x = ResidualBlock(self.cnn_features_2)(x)\n        \n\
    \        # Init/reset state\n        if rnn_state is None:\n            zeros\
    \ = lambda: jnp.zeros((B, 8, 8, self.conv_lstm_features), dtype=x.dtype)\n   \
    \         rnn_state = {'h': zeros(), 'c': zeros()}\n        if done is not None:\n\
    \            m = (1.0 - done.reshape(B,1,1,1).astype(x.dtype))\n            rnn_state\
    \ = {'h': rnn_state['h'] * m, 'c': rnn_state['c'] * m}\n        \n        # ConvLSTM\
    \ update\n        (h_new, c_new), h_out = ConvLSTMCellLN(self.conv_lstm_features)((rnn_state['h'],\
    \ rnn_state['c']), x)\n        rnn_state = {'h': h_new, 'c': c_new}\n        \n\
    \        # Attention pooling (generates z_attn)\n        attn_logits = nn.Conv(1,\
    \ (1,1), padding='SAME',\n                              kernel_init=nn.initializers.xavier_uniform())(h_out)\n\
    \        attn = nn.softmax(attn_logits.reshape((B, -1)) / self.attn_temp, axis=-1)\n\
    \        H = W = 8\n        h_flat = h_out.reshape((B, H*W, self.conv_lstm_features))\n\
    \        z_attn = jnp.einsum('bij,bi->bj', h_flat, attn)\n        \n        #\
    \ --- Dual-Pathway Contextual Readout ---\n        # Extract time feature (from\
    \ original observation, assuming it's the last channel)\n        # Note: The original\
    \ observation 'x' passed to __call__ is already processed by CNN.\n        # We\
    \ need to access the time channel (7) from the original raw_observation before\
    \ CNN.\n        # For now, let's derive it as in Nomos II's model for simplicity,\
    \ assuming it's a global feature.\n        # If time feature is needed precisely\
    \ from raw obs, the input signature of __call__\n        # would need to change\
    \ or assume raw obs is passed separately.\n        # For this baseline, no explicit\
    \ 'time' channel is extracted in the call, so we'll\n        # assume we will\
    \ use the global average of a ConvLSTM feature as a proxy, or\n        # keep\
    \ the original Z to heads simple if time is hard to get without changing signature.\n\
    \        # The baseline model's `z` is the attention output, and it's directly\
    \ fed to MLP.\n        # Let's adapt to include a simple global average, and assume\
    \ time isn't explicitly\n        # concatenated at this point in this baseline\
    \ as it wasn't there before.\n        \n        # Global average pooling of ConvLSTM\
    \ output\n        z_global = jnp.mean(h_out, axis=(1,2)) # Shape (B, conv_lstm_features)\n\
    \        \n        # Concatenate attention-pooled (z_attn) and global-average-pooled\
    \ (z_global) features\n        final_head_input = jnp.concatenate([z_attn, z_global],\
    \ axis=-1)\n\n        # Heads (use final_head_input)\n        z_for_heads = nn.Dense(256,\
    \ kernel_init=nn.initializers.xavier_uniform())(final_head_input); z_for_heads\
    \ = nn.relu(z_for_heads)\n        pol_h = nn.Dense(64, kernel_init=nn.initializers.xavier_uniform())(z_for_heads);\
    \ pol_h = nn.relu(pol_h)\n        policy_logits = nn.Dense(4, kernel_init=nn.initializers.xavier_uniform())(pol_h)\n\
    \        val_h = nn.Dense(64, kernel_init=nn.initializers.xavier_uniform())(z_for_heads);\
    \ val_h = nn.relu(val_h)\n        value = nn.Dense(1, kernel_init=nn.initializers.xavier_uniform())(val_h).squeeze(-1)\n\
    \        return policy_logits, value, rnn_state\n\n# --- Hyperparameters from\
    \ zephyr/submissions/submission_sota.py ---\nBASE_SEED = 42 # Fixed base seed\
    \ for stable 4-seed evaluation sets\n\ndef _define_hyperparameters():\n    return\
    \ {\n        'learning_rate': tune.choice([4e-4]),\n        'entropy_coef': tune.choice([0.01]),\n\
    \        'value_loss_coef': tune.choice([0.5]),\n        'cnn_features_1': tune.choice([32]),\n\
    \        'cnn_features_2': tune.choice([64]),\n        'conv_lstm_features': tune.choice([64]),\n\
    \    }\n\ndef create_network(hparams):\n    return CNNConvLSTMLN_DualReadout(\
    \ # Use modified network\n        cnn_features_1=hparams['cnn_features_1'],\n\
    \        cnn_features_2=hparams['cnn_features_2'],\n        conv_lstm_features=hparams['conv_lstm_features'],\n\
    \        attn_temp=1.0,\n    )\n\n# Use system default training_step and optimizer.\n\
    # training_step and create_optimizer will use system defaults unless overridden.\n"
