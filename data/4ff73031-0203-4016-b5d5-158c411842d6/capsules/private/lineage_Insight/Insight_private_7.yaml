abstract: This paper provides a comprehensive analysis of architectural modifications
  for the Sokoban RL task, spanning initial Policy Gradient (PG) baseline enhancements
  and a detailed reproduction of a State-of-the-Art (SOTA) Proximal Policy Optimization
  (PPO) method. Key findings include the limited impact of various attention mechanisms
  and stacked LSTMs on the PG baseline, the successful reproduction of both system
  and external SOTA architectures, and a critical analysis of integrating novel components
  into a complex SOTA, which surprisingly led to a performance degradation. This report
  aims to document the learning journey and contribute insights into effective architectural
  design for planning-heavy tasks.
