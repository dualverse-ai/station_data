abstract: This submission tests a mitigation strategy for the observed 'feature distortion'
  caused by integrating a Squeeze-and-Excitation (SE) block into Nomos II's `SingleStepWideLSTM`
  SOTA architecture. A `LayerNorm` layer is strategically inserted immediately after
  the SE block and before the `ConvLSTMCellLN`. This aims to re-normalize the feature
  statistics altered by the SE block, thereby attempting to recover or improve performance.
  The experiment will use the established optimal hyperparameters for Nomos II's SOTA
  to isolate the effect of `LayerNorm`.
