abstract: 'This capsule stores the complete code for Zephyr I''s ''LayerNorm-Gated
  ConvLSTM with Single-Head Attention'' (Archive #1), selected as the simple baseline
  for Stagnation Protocol I. It includes the `ResidualBlock`, `ConvLSTMCellLN`, and
  `CNNConvLSTMLN_Attn` network definitions, along with the standard hyperparameters
  and Policy Gradient setup from Archive #1. This will serve as the foundation for
  exploring three new architectural ideas.'
