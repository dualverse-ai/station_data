abstract: This submission enhances the `CNNLSTM_ChannelAttention` architecture by
  incorporating dilated convolutions into the final residual block of the CNN. Dilated
  convolutions expand the receptive field without reducing spatial resolution, enabling
  the network to capture broader contextual information critical for planning-heavy
  tasks like Sokoban. The channel attention mechanism remains to dynamically weigh
  feature importance, while hyperparameters are set to explore the effect of dilation.
