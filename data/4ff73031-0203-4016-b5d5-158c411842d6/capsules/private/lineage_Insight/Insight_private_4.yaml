    4)
  content: "import jax\nimport jax.numpy as jnp\nfrom jax import lax, vmap\nimport\
    \ flax.linen as nn\nfrom typing import Tuple, Dict, Any, Optional\nfrom ray import\
    \ tune\n\ndef _define_hyperparameters():\n    \"\"\"\n    Define Ray Tune search\
    \ space for hyperparameters.\n    Introduces 'dilation_rate' for tuning dilated\
    \ convolutions.\n    \"\"\"\n    return {\n        'learning_rate': tune.choice([4e-4]),\n\
    \        'entropy_coef': tune.uniform(0.008, 0.012), # Wider range for a new architectural\
    \ element\n        'value_loss_coef': tune.uniform(0.4, 0.6),  # Wider range\n\
    \        'cnn_features_1': tune.choice([32]),\n        'cnn_features_2': tune.choice([64]),\n\
    \        'lstm_features': tune.choice([256]),\n        'dilation_rate': tune.choice([1,\
    \ 2]), # Explore no dilation vs. dilation rate 2\n    }\n\nclass SqueezeExcitationBlock(nn.Module):\n\
    \    \"\"\"Squeeze-and-Excitation block for channel-wise attention.\"\"\"\n  \
    \  reduction_ratio: int = 16\n\n    @nn.compact\n    def __call__(self, x: jnp.ndarray)\
    \ -> jnp.ndarray:\n        num_channels = x.shape[-1]\n        \n        # Squeeze:\
    \ Global average pooling across spatial dimensions\n        squeeze = jnp.mean(x,\
    \ axis=(1, 2)) # (batch_size, num_channels)\n        \n        # Excitation: Two\
    \ fully connected layers\n        # First FC layer (reduction)\n        excitation\
    \ = nn.Dense(features=num_channels // self.reduction_ratio, name=\"se_dense1\"\
    )(squeeze)\n        excitation = nn.relu(excitation)\n        \n        # Second\
    \ FC layer (expansion)\n        excitation = nn.Dense(features=num_channels, name=\"\
    se_dense2\")(excitation)\n        excitation = nn.sigmoid(excitation)\n      \
    \  \n        # Reshape excitation weights to (batch_size, 1, 1, num_channels)\
    \ for broadcasting\n        excitation = jnp.expand_dims(jnp.expand_dims(excitation,\
    \ axis=1), axis=1)\n        \n        # Scale features by channel-wise weights\n\
    \        return x * excitation\n\nclass CNNLSTM_DilatedChannelAttention(nn.Module):\n\
    \    \"\"\"\n    CNN with Dilated Convolutions and Channel Attention, followed\
    \ by LSTM, for Sokoban.\n    Incorporates dilated convolutions in the final residual\
    \ CNN block to expand receptive field\n    and a Squeeze-and-Excitation block\
    \ for channel attention.\n    \"\"\"\n    lstm_features: int\n    cnn_features_1:\
    \ int\n    cnn_features_2: int\n    dilation_rate: int # New parameter for dilated\
    \ convolutions\n    \n    @nn.compact\n    def __call__(self, x: jnp.ndarray,\
    \ done: jnp.ndarray, rnn_state: Optional[Dict] = None) -> Tuple[jnp.ndarray, jnp.ndarray,\
    \ Dict]:\n        batch_size = x.shape[0]\n        \n        # Initialize RNN\
    \ state if not provided\n        if rnn_state is None:\n            rnn_state\
    \ = {\n                'h': jnp.zeros((batch_size, self.lstm_features)),\n   \
    \             'c': jnp.zeros((batch_size, self.lstm_features)),\n            }\n\
    \        \n        # Reset states for episodes that are done\n        if done\
    \ is not None:\n            done_mask = done.reshape(batch_size, 1)\n        \
    \    rnn_state = {\n                'h': rnn_state['h'] * (1 - done_mask),\n \
    \               'c': rnn_state['c'] * (1 - done_mask),\n            }\n      \
    \  \n        # CNN architecture (same as DefaultResidualCNN)\n        # First\
    \ convolutional block\n        x = nn.Conv(features=self.cnn_features_1, kernel_size=(3,\
    \ 3), padding='SAME')(x)\n        x = nn.relu(x)\n        \n        # Second block\
    \ with residual connection\n        conv2_in = x\n        x = nn.Conv(features=self.cnn_features_1,\
    \ kernel_size=(3, 3), padding='SAME')(x)\n        x = nn.relu(x)\n        x =\
    \ nn.Conv(features=self.cnn_features_1, kernel_size=(3, 3), padding='SAME')(x)\n\
    \        x = x + conv2_in\n        x = nn.relu(x)\n        \n        # Third block\
    \ - increase channels\n        x = nn.Conv(features=self.cnn_features_2, kernel_size=(3,\
    \ 3), padding='SAME')(x)\n        x = nn.relu(x)\n        \n        # Fourth block\
    \ with residual connection (now with dilation)\n        conv4_in = x\n       \
    \ x = nn.Conv(features=self.cnn_features_2, kernel_size=(3, 3), padding='SAME',\
    \ strides=(1,1))(x) # Standard conv\n        x = nn.relu(x)\n        x = nn.Conv(features=self.cnn_features_2,\
    \ kernel_size=(3, 3), padding='SAME', kernel_dilation=(self.dilation_rate, self.dilation_rate))(x)\n\
    \        x = x + conv4_in # Residual connection\n        x = nn.relu(x)\n    \
    \    \n        # --- Channel Attention Mechanism (Squeeze-and-Excitation) ---\n\
    \        x = SqueezeExcitationBlock(reduction_ratio=16)(x) # x has shape (B, H,\
    \ W, C_cnn_out)\n        \n        # Flatten spatial dimensions\n        x = x.reshape((batch_size,\
    \ -1))\n        \n        # Shared MLP backbone\n        x = nn.Dense(features=256)(x)\n\
    \        x = nn.relu(x)\n        \n        # LSTM layer on top of CNN features\n\
    \        lstm_cell = nn.LSTMCell(\n            features=self.lstm_features,\n\
    \            kernel_init=nn.initializers.xavier_uniform(),\n            recurrent_kernel_init=nn.initializers.xavier_uniform()\n\
    \        )\n        (rnn_state['c'], rnn_state['h']), lstm_out = lstm_cell((rnn_state['c'],\
    \ rnn_state['h']), x)\n        \n        # Small MLP after LSTM\n        x = nn.Dense(features=128)(lstm_out)\n\
    \        x = nn.relu(x)\n        \n        # Policy and value heads\n        policy_logits\
    \ = nn.Dense(features=4)(x)\n        value = nn.Dense(features=1)(x).squeeze(-1)\n\
    \        \n        return policy_logits, value, rnn_state\n\ndef create_network(hparams):\n\
    \    \"\"\"Create CNN-LSTM network architecture with dilated convolutions and\
    \ channel attention.\"\"\"\n    return CNNLSTM_DilatedChannelAttention(\n    \
    \    lstm_features=hparams['lstm_features'],\n        cnn_features_1=hparams['cnn_features_1'],\n\
    \        cnn_features_2=hparams['cnn_features_2'],\n        dilation_rate=hparams['dilation_rate']\n\
    \    )\n\n# Uses system default training step and optimizer\n"
