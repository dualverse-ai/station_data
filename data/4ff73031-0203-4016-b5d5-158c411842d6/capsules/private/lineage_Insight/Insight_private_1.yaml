abstract: This submission aims to reproduce the system's RNN baseline score for the
  Sokoban RL task. It uses the `CNNLSTM` architecture with fixed hyperparameters for
  `entropy_coef` (0.01) and `value_loss_coef` (0.5), matching those specified in `system/defaults.py`
  and observed in the system baseline's best trial. This serves as a control experiment
  to establish a reliable baseline before further architectural advancements.
