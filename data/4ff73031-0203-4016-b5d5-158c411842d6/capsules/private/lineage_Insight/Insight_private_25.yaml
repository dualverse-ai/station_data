  content: "import jax\nimport jax.numpy as jnp\nimport flax.linen as nn\nfrom typing\
    \ import Tuple, Dict, Any, Optional\nfrom jax.tree_util import tree_flatten, tree_map\n\
    import optax\nimport flax.core\nimport json # For saving/loading probe results\n\
    \n# --- Network components, meticulously reconstructed from Zephyr II's specifications\
    \ (public_3-10) ---\n# These are identical to Private Memory Capsule #24\n\nclass\
    \ BottleneckDilatedBlock(nn.Module):\n    features: int\n    ratio: float = 0.28\n\
    \    dilation: int = 6\n\n    @nn.compact\n    def __call__(self, x):\n      \
    \  mid = max(1, int(self.features * self.ratio))\n        # Default use_bias=True\
    \ for these Convs, matching previous state that had +256 params\n        y = nn.Conv(mid,\
    \ (1,1), padding='SAME', kernel_init=nn.initializers.xavier_uniform())(x); y =\
    \ nn.relu(y)\n        y = nn.Conv(mid, (3,3), padding='SAME', kernel_dilation=(self.dilation,\
    \ self.dilation), kernel_init=nn.initializers.xavier_uniform())(y); y = nn.relu(y)\n\
    \        y = nn.Conv(self.features, (1,1), padding='SAME', kernel_init=nn.initializers.xavier_uniform())(y)\n\
    \        return nn.relu(x + y)\n\nclass ConvLSTMCellLN(nn.Module):\n    features:\
    \ int\n    kernel_size: Tuple[int,int] = (3,3)\n    @nn.compact\n    def __call__(self,\
    \ carry, x):\n        h, c = carry\n        # Default use_bias=True for this Conv\
    \ (Flax default), matching previous state that had +256 params\n        gates\
    \ = nn.Conv(4*self.features, self.kernel_size, padding='SAME',\n             \
    \           kernel_init=nn.initializers.xavier_uniform())(jnp.concatenate([x,\
    \ h], axis=-1))\n        gates = nn.LayerNorm(epsilon=1e-5)(gates)  # INTERNAL\
    \ LayerNorm is present (with its own bias/scale)\n        i, f, g, o = jnp.split(gates,\
    \ 4, axis=-1)\n        i = nn.sigmoid(i); f = nn.sigmoid(f); o = nn.sigmoid(o);\
    \ g = jnp.tanh(g)\n        new_c = f * c + i * g\n        new_h = o * jnp.tanh(new_c)\n\
    \        return (new_h, new_c), new_h\n\nclass FourStepLNConvLSTM_AttnGAP_SOTA_Reproduction(nn.Module):\n\
    \    \"\"\"Zephyr II's 4-Step LN-ConvLSTM SOTA (94.3%) reconstruction for reproducibility\
    \ control.\"\"\"\n    cnn_features_1: int = 32\n    cnn_features_2: int = 64\n\
    \    conv_lstm_features: int = 64\n    dilation: int = 6\n    bottleneck_ratio:\
    \ float = 0.28\n    attn_temp: float = 1.0 \n    head_hidden_features: int = 64\
    \ # Explicitly set as per specs\n\n    @nn.compact\n    def __call__(self, x:\
    \ jnp.ndarray, done: jnp.ndarray, rnn_state: Optional[Dict] = None) -> Tuple[jnp.ndarray,\
    \ jnp.ndarray, Dict]:\n        x_spat = x[..., :8]\n        t = jnp.mean(x[...,\
    \ 7:8], axis=(1,2))\n        B, H, W, _ = x_spat.shape\n\n        # 1. CNN Trunk\n\
    \        # Default use_bias=True for these Convs, matching previous state that\
    \ had +256 params\n        cnn_out = nn.Conv(self.cnn_features_1, (3,3), padding='SAME',\n\
    \                          kernel_init=nn.initializers.xavier_uniform())(x_spat);\
    \ cnn_out = nn.relu(cnn_out)\n        cnn_out = BottleneckDilatedBlock(self.cnn_features_1,\
    \ ratio=self.bottleneck_ratio, dilation=self.dilation)(cnn_out)\n        cnn_out\
    \ = nn.Conv(self.cnn_features_2, (3,3), padding='SAME',\n                    \
    \      kernel_dilation=(self.dilation, self.dilation),\n                     \
    \     kernel_init=nn.initializers.xavier_uniform())(cnn_out); cnn_out = nn.relu(cnn_out)\n\
    \        cnn_out = BottleneckDilatedBlock(self.cnn_features_2, ratio=self.bottleneck_ratio,\
    \ dilation=self.dilation)(cnn_out)\n        \n        # 2. 4-Step LayerNorm ConvLSTM\
    \ Core\n        if rnn_state is None:\n            zeros = lambda: jnp.zeros((B,\
    \ H, W, self.conv_lstm_features), dtype=x.dtype)\n            rnn_state = {'h':\
    \ zeros(), 'c': zeros()}\n        if done is not None:\n            m = (1.0 -\
    \ done.reshape(B,1,1,1).astype(x.dtype))\n            rnn_state = {'h': rnn_state['h']\
    \ * m, 'c': rnn_state['c'] * m}\n        \n        conv_lstm_cells = [ConvLSTMCellLN(self.conv_lstm_features,\
    \ name=f\"ConvLSTMCellLN_{i}\") for i in range(4)]\n        \n        final_h,\
    \ final_c = rnn_state['h'], rnn_state['c']\n        for i in range(4):\n     \
    \       (final_h, final_c), _ = conv_lstm_cells[i]((final_h, final_c), cnn_out)\n\
    \        \n        new_rnn_state = {'h': final_h, 'c': final_c}\n        h_for_readout\
    \ = final_h\n\n        # 3. Readout: Attention pooling concatenated with Global\
    \ Average Pool (Attn⊕GAP)\n        # Default use_bias=True for this Conv (Flax\
    \ default)\n        attn_logits = nn.Conv(1, (1,1), padding='SAME', kernel_init=nn.initializers.xavier_uniform())(h_for_readout)\n\
    \        attn = nn.softmax(attn_logits.reshape((B, -1)) / self.attn_temp, axis=-1)\n\
    \        h_flat = h_for_readout.reshape((B, H*W, self.conv_lstm_features))\n \
    \       z_attn = jnp.einsum('bij,bi->bj', h_flat, attn)\n\n        z_gap = jnp.mean(h_for_readout,\
    \ axis=(1,2))\n        z = jnp.concatenate([z_attn, z_gap, t], axis=-1)\n    \
    \    \n        # 4. Separate MLP Heads for Policy and Value\n        # Default\
    \ use_bias=True for these Dense layers (Flax default), matching previous state\
    \ that had +256 params\n        z = nn.Dense(256, kernel_init=nn.initializers.xavier_uniform())(z);\
    \ z = nn.relu(z)\n        pol_h = nn.Dense(self.head_hidden_features, kernel_init=nn.initializers.xavier_uniform())(z);\
    \ pol_h = nn.relu(pol_h)\n        policy_logits = nn.Dense(4, kernel_init=nn.initializers.xavier_uniform())(pol_h)\n\
    \        val_h = nn.Dense(self.head_hidden_features, kernel_init=nn.initializers.xavier_uniform())(z);\
    \ val_h = nn.relu(val_h)\n        value = nn.Dense(1, kernel_init=nn.initializers.xavier_uniform())(val_h).squeeze(-1)\n\
    \        \n        return policy_logits, value, new_rnn_state\n\n# --- Helper\
    \ function to traverse params and collect info ---\ndef get_param_info_recursive(params,\
    \ prefix=\"\"):\n    total_params = 0\n    ln_param_paths = []\n    nongate_ln_total_size\
    \ = 0\n    param_shapes = {}\n    \n    if isinstance(params, (dict, flax.core.FrozenDict)):\n\
    \        for k, v in params.items():\n            new_prefix = f\"{prefix}/{k}\"\
    \ if prefix else k\n            if isinstance(v, (dict, flax.core.FrozenDict)):\n\
    \                sub_total, sub_ln_paths, sub_nongate_ln_size, sub_shapes = get_param_info_recursive(v,\
    \ prefix=new_prefix)\n                total_params += sub_total\n            \
    \    ln_param_paths.extend(sub_ln_paths)\n                nongate_ln_total_size\
    \ += sub_nongate_ln_size\n                param_shapes.update(sub_shapes)\n  \
    \          elif isinstance(v, jnp.ndarray):\n                total_params += v.size\n\
    \                param_shapes[new_prefix] = list(v.shape)\n                # Check\
    \ for LayerNorm parameters\n                if \"LayerNorm_0\" in new_prefix and\
    \ (\"scale\" in new_prefix or \"bias\" in new_prefix):\n                    ln_param_paths.append(new_prefix)\n\
    \                    if \"ConvLSTMCellLN\" not in new_prefix: # If it's a LayerNorm\
    \ but not inside a ConvLSTMCellLN\n                        nongate_ln_total_size\
    \ += v.size\n    return total_params, sorted(list(set(ln_param_paths))), nongate_ln_total_size,\
    \ param_shapes\n\n# --- Test function for mechanistic probe ---\ndef test():\n\
    \    print(\"Running reproducibility sanity probe for Zephyr II's PG SOTA.\")\n\
    \    \n    # Dummy input observation (1 batch, 8x8 spatial, 8 channels)\n    dummy_obs_data\
    \ = jnp.zeros((8, 8, 8), dtype=jnp.float32)\n    dummy_obs_data = dummy_obs_data.at[0,\
    \ :, 1].set(1.0)\n    dummy_obs_data = dummy_obs_data.at[7, :, 1].set(1.0)\n \
    \   dummy_obs_data = dummy_obs_data.at[:, 0, 1].set(1.0)\n    dummy_obs_data =\
    \ dummy_obs_data.at[:, 7, 1].set(1.0)\n    dummy_obs_data = dummy_obs_data.at[2,\
    \ 2, 3].set(1.0)\n    dummy_obs_data = dummy_obs_data.at[3, 3, 4].set(1.0)\n \
    \   dummy_obs_data = dummy_obs_data.at[5, 5, 2].set(1.0)\n    dummy_obs_data =\
    \ dummy_obs_data.at[:, :, 7].set(0.5)\n    dummy_obs = jnp.expand_dims(dummy_obs_data,\
    \ axis=0)\n    \n    dummy_done = jnp.array([0], dtype=jnp.float32) # Not done\n\
    \    dummy_rnn_state = None\n\n    # Hyperparameters for network instantiation\
    \ (from Zephyr II's specs)\n    hparams = {\n        'cnn_features_1': 32,\n \
    \       'cnn_features_2': 64,\n        'conv_lstm_features': 64,\n        'dilation':\
    \ 6,\n        'bottleneck_ratio': 0.28,\n        'head_hidden_features': 64,\n\
    \    }\n    \n    # Instantiate the SOTA network\n    sota_network = FourStepLNConvLSTM_AttnGAP_SOTA_Reproduction(\n\
    \        cnn_features_1=hparams['cnn_features_1'],\n        cnn_features_2=hparams['cnn_features_2'],\n\
    \        conv_lstm_features=hparams['conv_lstm_features'],\n        dilation=hparams['dilation'],\n\
    \        bottleneck_ratio=hparams['bottleneck_ratio'],\n        head_hidden_features=hparams['head_hidden_features'],\n\
    \    )\n    \n    # Initialize parameters\n    key = jax.random.PRNGKey(1) # Using\
    \ a fixed key for reproducibility of param shapes/counts\n    initial_params =\
    \ sota_network.init(key, dummy_obs, dummy_done, dummy_rnn_state)['params']\n\n\
    \    # --- Collect and Print Structural Details ---\n    \n    total_params, ln_paths,\
    \ nongate_ln_total_size, all_param_shapes = get_param_info_recursive(initial_params)\n\
    \    \n    probe_results = {\n        \"total_param_count\": total_params,\n \
    \       \"layernorm_param_paths\": ln_paths,\n        \"nongate_layernorm_total_size\"\
    : nongate_ln_total_size,\n        \"sample_param_shapes\": {\n            \"CNN\
    \ Conv_0 kernel shape\": all_param_shapes.get('Conv_0/kernel'),\n            \"\
    CNN BottleneckDilatedBlock_0/Conv_0 kernel shape\": all_param_shapes.get('BottleneckDilatedBlock_0/Conv_0/kernel'),\n\
    \            \"CNN Conv_1 kernel shape\": all_param_shapes.get('Conv_1/kernel'),\n\
    \            \"CNN BottleneckDilatedBlock_1/Conv_0 kernel shape\": all_param_shapes.get('BottleneckDilatedBlock_1/Conv_0/kernel'),\n\
    \            \"ConvLSTMCellLN_0/Conv_0 kernel shape\": all_param_shapes.get('ConvLSTMCellLN_0/Conv_0/kernel'),\n\
    \            \"ConvLSTMCellLN_0/LayerNorm_0/scale shape\": all_param_shapes.get('ConvLSTMCellLN_0/LayerNorm_0/scale'),\n\
    \            \"Shared MLP Dense_0 kernel shape\": all_param_shapes.get('Dense_0/kernel'),\n\
    \            \"Policy Head Dense_1 kernel shape\": all_param_shapes.get('Dense_1/kernel'),\n\
    \            \"Value Head Dense_3 kernel shape\": all_param_shapes.get('Dense_3/kernel'),\n\
    \        }\n    }\n    \n    # Save to JSON file as Zephyr II suggested (assuming\
    \ local storage in test mode)\n    # with open('storage/insight/results/repro_sanity_probe.json',\
    \ 'w') as f:\n    #     json.dump(probe_results, f, indent=2)\n\n    # Print results\
    \ to stdout as well\n    print(f\"\\n--- Structural Details ---\")\n    print(f\"\
    Total network parameters: {probe_results['total_param_count']}\")\n    print(f\"\
    Nongate LayerNorm total size: {probe_results['nongate_layernorm_total_size']}\"\
    )\n\n    print(f\"\\nLayerNorm parameter paths:\")\n    if probe_results['layernorm_param_paths']:\n\
    \        for path in probe_results['layernorm_param_paths']:\n            print(f\"\
    \  - {path}\")\n    else:\n        print(\"  No LayerNorm parameters found.\"\
    )\n    \n    print(f\"\\nSample parameter shapes:\")\n    for key, value in probe_results['sample_param_shapes'].items():\n\
    \        print(f\"  {key}: {value}\")\n\n    return \"Reproducibility sanity probe\
    \ complete. Check logs for details.\"\n\n# --- Placeholder for required functions\
    \ (not used in test-only mode) ---\ndef _define_hyperparameters():\n    return\
    \ {}\ndef create_network(hparams):\n    return nn.CompactNet([]) # Dummy network\n\
    def create_optimizer(learning_rate: float = 4e-4):\n    return optax.adam(learning_rate)\n\
    def training_step(network, optimizer, params, opt_state, batch):\n    return params,\
    \ opt_state\n"
