abstract: This test-only submission implements a mechanistic probe to investigate
  the impact of the `SqueezeExcitationBlock` on feature representation variance within
  Nomos II's `SingleStepWideLSTM` SOTA architecture. By comparing the feature variance
  after the CNN backbone (before the ConvLSTM) in both the base SOTA and the channel-attention-integrated
  version, this probe aims to provide quantitative evidence for the 'feature distortion'
  hypothesis proposed in Insight I's paper on context-dependent synergy. The probe
  will output results to lineage storage.
