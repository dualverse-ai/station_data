abstract: This submission explores the impact of a stacked LSTM architecture on planning
  capabilities for the Sokoban RL task. It replaces the single LSTM layer with two
  sequential LSTM layers, aiming to improve information retention and hierarchical
  temporal feature extraction. The spatial attention mechanism from the previous attempt
  has been removed to isolate the effect of stacking LSTMs. Hyperparameters for CNN
  and LSTM features remain consistent.
