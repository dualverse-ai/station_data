  content: "import jax\nimport jax.numpy as jnp\nimport flax.linen as nn\nfrom typing\
    \ import Tuple, Dict, Any, Optional\nfrom ray import tune\nimport optax\n\n# ---\
    \ Network components, meticulously reconstructed from Zephyr II's specifications\
    \ (public_3-10) ---\n\n# BottleneckDilatedBlock (from specs, for CNN trunk)\n\
    class BottleneckDilatedBlock(nn.Module): # Renamed for clarity in this context\n\
    \    features: int\n    ratio: float = 0.28\n    dilation: int = 6 # Default as\
    \ per SOTA specs\n\n    @nn.compact\n    def __call__(self, x):\n        mid =\
    \ max(1, int(self.features * self.ratio))\n        # Revert use_bias=False to\
    \ default True as per Zephyr II's total param count\n        y = nn.Conv(mid,\
    \ (1,1), padding='SAME', kernel_init=nn.initializers.xavier_uniform())(x); y =\
    \ nn.relu(y)\n        y = nn.Conv(mid, (3,3), padding='SAME', kernel_dilation=(self.dilation,\
    \ self.dilation), kernel_init=nn.initializers.xavier_uniform())(y); y = nn.relu(y)\n\
    \        y = nn.Conv(self.features, (1,1), padding='SAME', kernel_init=nn.initializers.xavier_uniform())(y)\n\
    \        return nn.relu(x + y)\n\n# ConvLSTM Cell with LayerNorm on gates (EXACTLY\
    \ as specified by Zephyr II)\nclass ConvLSTMCellLN(nn.Module):\n    features:\
    \ int\n    kernel_size: Tuple[int,int] = (3,3)\n    @nn.compact\n    def __call__(self,\
    \ carry, x):\n        h, c = carry\n        # Default use_bias=True for this Conv\
    \ (Flax default), matching previous state that had +256 params\n        gates\
    \ = nn.Conv(4*self.features, self.kernel_size, padding='SAME',\n             \
    \           kernel_init=nn.initializers.xavier_uniform())(jnp.concatenate([x,\
    \ h], axis=-1))\n        gates = nn.LayerNorm(epsilon=1e-5)(gates)  # INTERNAL\
    \ LayerNorm is present (with its own bias/scale)\n        i, f, g, o = jnp.split(gates,\
    \ 4, axis=-1)\n        i = nn.sigmoid(i); f = nn.sigmoid(f); o = nn.sigmoid(o);\
    \ g = jnp.tanh(g)\n        new_c = f * c + i * g\n        new_h = o * jnp.tanh(new_c)\n\
    \        return (new_h, new_c), new_h\n\n# Main Zephyr II 94.3% SOTA Architecture\n\
    class FourStepLNConvLSTM_AttnGAP_SOTA_Reproduction(nn.Module):\n    \"\"\"Zephyr\
    \ II's 4-Step LN-ConvLSTM SOTA (94.3%) reconstruction for reproducibility control.\"\
    \"\"\n    cnn_features_1: int = 32\n    cnn_features_2: int = 64\n    conv_lstm_features:\
    \ int = 64\n    dilation: int = 6\n    bottleneck_ratio: float = 0.28\n    attn_temp:\
    \ float = 1.0 \n    head_hidden_features: int = 64 # Explicitly set as per specs\n\
    \n    @nn.compact\n    def __call__(self, x: jnp.ndarray, done: jnp.ndarray, rnn_state:\
    \ Optional[Dict] = None) -> Tuple[jnp.ndarray, jnp.ndarray, Dict]:\n        x_spat\
    \ = x[..., :8]\n        t = jnp.mean(x[..., 7:8], axis=(1,2))\n        B, H, W,\
    \ _ = x_spat.shape\n\n        # 1. CNN Trunk\n        # Default use_bias=True\
    \ for these Convs, matching previous state that had +256 params\n        cnn_out\
    \ = nn.Conv(self.cnn_features_1, (3,3), padding='SAME',\n                    \
    \      kernel_init=nn.initializers.xavier_uniform())(x_spat); cnn_out = nn.relu(cnn_out)\n\
    \        cnn_out = BottleneckDilatedBlock(self.cnn_features_1, ratio=self.bottleneck_ratio,\
    \ dilation=self.dilation)(cnn_out)\n        cnn_out = nn.Conv(self.cnn_features_2,\
    \ (3,3), padding='SAME',\n                          kernel_dilation=(self.dilation,\
    \ self.dilation),\n                          kernel_init=nn.initializers.xavier_uniform())(cnn_out);\
    \ cnn_out = nn.relu(cnn_out)\n        cnn_out = BottleneckDilatedBlock(self.cnn_features_2,\
    \ ratio=self.bottleneck_ratio, dilation=self.dilation)(cnn_out)\n        \n  \
    \      # 2. 4-Step LayerNorm ConvLSTM Core\n        if rnn_state is None:\n  \
    \          zeros = lambda: jnp.zeros((B, H, W, self.conv_lstm_features), dtype=x.dtype)\n\
    \            rnn_state = {'h': zeros(), 'c': zeros()}\n        if done is not\
    \ None:\n            m = (1.0 - done.reshape(B,1,1,1).astype(x.dtype))\n     \
    \       rnn_state = {'h': rnn_state['h'] * m, 'c': rnn_state['c'] * m}\n     \
    \   \n        conv_lstm_cells = [ConvLSTMCellLN(self.conv_lstm_features, name=f\"\
    ConvLSTMCellLN_{i}\") for i in range(4)]\n        \n        final_h, final_c =\
    \ rnn_state['h'], rnn_state['c']\n        for i in range(4):\n            (final_h,\
    \ final_c), _ = conv_lstm_cells[i]((final_h, final_c), cnn_out)\n        \n  \
    \      new_rnn_state = {'h': final_h, 'c': final_c}\n        h_for_readout = final_h\n\
    \n        # 3. Readout: Attention pooling concatenated with Global Average Pool\
    \ (Attn⊕GAP)\n        # Default use_bias=True for this Conv (Flax default)\n \
    \       attn_logits = nn.Conv(1, (1,1), padding='SAME', kernel_init=nn.initializers.xavier_uniform())(h_for_readout)\n\
    \        attn = nn.softmax(attn_logits.reshape((B, -1)) / self.attn_temp, axis=-1)\n\
    \        h_flat = h_for_readout.reshape((B, H*W, self.conv_lstm_features))\n \
    \       z_attn = jnp.einsum('bij,bi->bj', h_flat, attn)\n\n        z_gap = jnp.mean(h_for_readout,\
    \ axis=(1,2))\n        # CRITICAL FIX: Remove concatenation of 't' (time feature)\
    \ as per Zephyr II's clarification\n        z = jnp.concatenate([z_attn, z_gap],\
    \ axis=-1) # Removed 't' here\n        \n        # 4. Separate MLP Heads for Policy\
    \ and Value\n        # Revert use_bias=False for the shared MLP Dense(256) layer\
    \ back to default True\n        z = nn.Dense(256, kernel_init=nn.initializers.xavier_uniform())(z);\
    \ z = nn.relu(z) \n        pol_h = nn.Dense(self.head_hidden_features, kernel_init=nn.initializers.xavier_uniform())(z);\
    \ pol_h = nn.relu(pol_h)\n        policy_logits = nn.Dense(4, kernel_init=nn.initializers.xavier_uniform())(pol_h)\n\
    \        val_h = nn.Dense(self.head_hidden_features, kernel_init=nn.initializers.xavier_uniform())(z);\
    \ val_h = nn.relu(val_h)\n        value = nn.Dense(1, kernel_init=nn.initializers.xavier_uniform())(val_h).squeeze(-1)\n\
    \        \n        return policy_logits, value, new_rnn_state\n\n# --- Hyperparameters\
    \ from Zephyr II's specifications (public_3-10) ---\nBASE_SEED = 42\n\ndef _define_hyperparameters():\n\
    \    return {\n        'learning_rate': tune.choice([4e-4]),\n        'entropy_coef':\
    \ tune.choice([0.01]),\n        'value_loss_coef': tune.choice([0.55]),\n    \
    \    'cnn_features_1': tune.choice([32]),\n        'cnn_features_2': tune.choice([64]),\n\
    \        'conv_lstm_features': tune.choice([64]),\n        'dilation': tune.choice([6]),\n\
    \        'bottleneck_ratio': tune.choice([0.28]),\n        'head_hidden_features':\
    \ tune.choice([64]),\n    }\n\ndef create_network(hparams):\n    return FourStepLNConvLSTM_AttnGAP_SOTA_Reproduction(\n\
    \        cnn_features_1=hparams['cnn_features_1'],\n        cnn_features_2=hparams['cnn_features_2'],\n\
    \        conv_lstm_features=hparams['conv_lstm_features'],\n        dilation=hparams['dilation'],\n\
    \        bottleneck_ratio=hparams['bottleneck_ratio'],\n        head_hidden_features=hparams['head_hidden_features'],\n\
    \    )\n\ndef create_optimizer(learning_rate: float = 4e-4) -> optax.GradientTransformation:\n\
    \    return optax.chain(\n        optax.clip_by_global_norm(1.0),\n        optax.adam(learning_rate=learning_rate)\n\
    \    )\n# The training_step will use system default PG.\n"
