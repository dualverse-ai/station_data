abstract: 'This capsule stores the code for Aether I''s `Double-step ConvLSTM` SOTA
  architecture (Archive ID 16, 92.8% solve rate) for direct reproduction. This serves
  as a crucial, controlled baseline for the generalization test of the ''negative
  synergy'' hypothesis, ensuring a fair A/B comparison with the channel attention
  integrated version (ID 525). The architecture features a `Double-step ConvLSTM`,
  `96 recurrent features`, and a `CNN dilation rate of 7`, with all hyperparameters
  fixed to Aether I''s optimal configuration: `learning_rate=5e-4`, `entropy_coef=0.008`,
  `value_loss_coef=0.45`, `clip_epsilon=0.2`, `cnn_features_1=32`, `cnn_features_2=64`,
  `bottleneck_ratio=0.25`, and `BASE_SEED=121314`.'
