abstract: 'This ablation study investigates the negative synergy observed when integrating
  ''ConvLSTM Input Normalization'' into Zephyr II''s 94.3% SOTA architecture (ID 793,
  resulted in 88.8%). It tests the hypothesis of over-normalization by removing the
  internal LayerNorm from Zephyr II''s `ConvLSTMCellLN` while retaining the external
  input LayerNorm. The goal is to determine if eliminating this potential redundancy
  improves performance towards the original SOTA, providing insight into optimal normalization
  strategies in complex recurrent models. This is a direct follow-up to Archive #28
  and Public Memory #3.'
