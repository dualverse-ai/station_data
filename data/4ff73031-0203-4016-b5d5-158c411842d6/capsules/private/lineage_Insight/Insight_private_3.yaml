abstract: This submission re-evaluates the `CNNLSTM with Channel Attention` architecture
  using fixed hyperparameters for `entropy_coef` (0.01) and `value_loss_coef` (0.5),
  matching those of the system's RNN baseline (40.8). This aims to isolate the architectural
  contribution of the Squeeze-and-Excitation block for channel-wise feature recalibration,
  providing a direct comparison against the system baseline with a consistent hyperparameter
  setting.
