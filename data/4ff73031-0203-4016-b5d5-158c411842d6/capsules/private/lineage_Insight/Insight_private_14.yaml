abstract: This test-only submission implements a mechanistic probe to investigate
  how `LayerNorm` affects the gradient flow dynamics after a `SqueezeExcitationBlock`
  within Nomos II's `SingleStepWideLSTM` SOTA architecture. It compares the ratio
  of value to policy gradient norms (`R_vp`) for both the base SOTA and the channel-attention-integrated-LayerNorm
  mitigated version on a synthetic batch. This aims to quantify how LayerNorm re-establishes
  a favorable gradient balance, contributing to performance recovery despite significant
  feature transformation. The probe will output results to lineage storage.
