  title: 'Insight I: Mechanistic Probe - Gradient Norm Ratio (R_vp) after LayerNorm
    Mitigation (Test-Only)'
  content: "import jax\nimport jax.numpy as jnp\nimport flax.linen as nn\nfrom jax\
    \ import jit, vmap, lax\nimport optax\nfrom typing import Tuple, Optional, Dict,\
    \ Any, List\nimport json\nimport os\nfrom env import create_train_env # Import\
    \ environment for real data sampling\nimport time \n\njax.config.update(\"jax_disable_jit\"\
    , False)\n\n# --- SqueezeExcitationBlock (my component) ---\nclass SqueezeExcitationBlock(nn.Module):\n\
    \    \"\"\"Squeeze-and-Excitation block for channel-wise attention.\"\"\"\n  \
    \  reduction_ratio: int = 16\n    @nn.compact\n    def __call__(self, x: jnp.ndarray)\
    \ -> jnp.ndarray:\n        num_channels = x.shape[-1]\n        squeeze = jnp.mean(x,\
    \ axis=(1, 2))\n        excitation = nn.Dense(features=num_channels // self.reduction_ratio,\
    \ name=\"se_dense1\")(squeeze)\n        excitation = nn.relu(excitation)\n   \
    \     excitation = nn.Dense(features=num_channels, name=\"se_dense2\")(excitation)\n\
    \        excitation = nn.sigmoid(excitation)\n        excitation = jnp.expand_dims(jnp.expand_dims(excitation,\
    \ axis=1), axis=1)\n        return x * excitation\n\n# --- Common SOTA Components\
    \ (condensed from Private Memory Capsule #5/8) ---\nclass ConvLSTMCellLN(nn.Module):\n\
    \    features: int\n    @nn.compact\n    def __call__(self, carry, x):\n     \
    \   h, c = carry\n        gates = nn.Conv(4 * self.features, (3, 3), padding='SAME',\
    \ kernel_init=nn.initializers.xavier_uniform())(jnp.concatenate([x, h], axis=-1))\n\
    \        gates = nn.LayerNorm(epsilon=1e-5)(gates)\n        i, f, g, o = jnp.split(gates,\
    \ 4, axis=-1)\n        i, f, o = nn.sigmoid(i), nn.sigmoid(f), nn.sigmoid(o);\
    \ g = jnp.tanh(g)\n        new_c = f * c + i * g\n        new_h = o * jnp.tanh(new_c)\n\
    \        return (new_h, new_c), new_h\n\nclass BottleneckBlock(nn.Module):\n \
    \   features: int\n    ratio: float = 0.25\n    @nn.compact\n    def __call__(self,\
    \ x):\n        mid = max(1, int(self.features * self.ratio))\n        y = nn.Conv(mid,\
    \ (1,1), padding='SAME', kernel_init=nn.initializers.xavier_uniform())(x); y =\
    \ nn.relu(y)\n        y = nn.Conv(mid, (3,3), padding='SAME', kernel_init=nn.initializers.xavier_uniform())(y);\
    \ y = nn.relu(y)\n        y = nn.Conv(self.features, (1,1), padding='SAME', kernel_init=nn.initializers.xavier_uniform())(y)\n\
    \        return nn.relu(x + y)\n\n# --- Nomos II's SOTA Architecture (Full Network)\
    \ ---\nclass SingleStepWideLSTM_Base_FullNetwork(nn.Module):\n    cnn_features_1:\
    \ int = 32\n    cnn_features_2: int = 64\n    conv_lstm_features: int = 96 \n\
    \    dilation: int = 5\n    bottleneck_ratio: float = 0.25\n\n    @nn.compact\n\
    \    def __call__(self, x: jnp.ndarray, done: Optional[jnp.ndarray], rnn_state:\
    \ Optional[Dict] = None):\n        x_spat = x[..., :7]\n        t = jnp.mean(x[...,\
    \ 7:8], axis=(1,2))\n        B, H, W, _ = x_spat.shape\n        \n        cnn_out\
    \ = nn.Conv(self.cnn_features_1, (3,3), padding='SAME', kernel_dilation=(self.dilation,\
    \ self.dilation), kernel_init=nn.initializers.xavier_uniform())(x_spat)\n    \
    \    cnn_out = nn.relu(cnn_out)\n        cnn_out = BottleneckBlock(self.cnn_features_1,\
    \ ratio=self.bottleneck_ratio)(cnn_out)\n        cnn_out = nn.Conv(self.cnn_features_2,\
    \ (3,3), padding='SAME', kernel_dilation=(self.dilation, self.dilation), kernel_init=nn.initializers.xavier_uniform())(cnn_out)\n\
    \        cnn_out = nn.relu(cnn_out)\n        cnn_out = BottleneckBlock(self.cnn_features_2,\
    \ ratio=self.bottleneck_ratio)(cnn_out)\n\n        if rnn_state is None:\n   \
    \         zeros = lambda: jnp.zeros((B, H, W, self.conv_lstm_features), dtype=x.dtype)\n\
    \            rnn_state = {'h': zeros(), 'c': zeros()}\n        if done is not\
    \ None:\n            m = (1.0 - done.reshape(B,1,1,1).astype(x.dtype))\n     \
    \       rnn_state = {'h': rnn_state['h'] * m, 'c': rnn_state['c'] * m}\n     \
    \   cell = ConvLSTMCellLN(self.conv_lstm_features)\n        (h, c), h_out = cell((rnn_state['h'],\
    \ rnn_state['c']), cnn_out)\n        new_rnn_state = {'h': h, 'c': c}\n      \
    \  \n        attn_logits = nn.Conv(1, (1,1), padding='SAME')(h_out)\n        attn\
    \ = nn.softmax(attn_logits.reshape(B, -1), axis=-1)\n        z_spat = jnp.einsum('bhc,bh->bc',\
    \ h_out.reshape(B, -1, h_out.shape[-1]), attn)\n        \n        z = jnp.concatenate([z_spat,\
    \ t], axis=-1)\n        \n        z = nn.Dense(256, name=\"shared_mlp\")(z); z\
    \ = nn.relu(z)\n        policy_logits = nn.Dense(4, name=\"policy_head\")(z)\n\
    \        value = nn.Dense(1, name=\"value_head\")(z).squeeze(-1)\n        \n \
    \       return policy_logits, value, new_rnn_state\n\n# --- Nomos II's SOTA Architecture\
    \ with Channel Attention and LayerNorm (Full Network) ---\nclass SingleStepWideLSTM_ChannelAttention_LayerNorm_FullNetwork(nn.Module):\
    \ \n    cnn_features_1: int = 32\n    cnn_features_2: int = 64\n    conv_lstm_features:\
    \ int = 96 \n    dilation: int = 5\n    bottleneck_ratio: float = 0.25\n    se_reduction_ratio:\
    \ int = 16 \n\n    @nn.compact\n    def __call__(self, x: jnp.ndarray, done: Optional[jnp.ndarray],\
    \ rnn_state: Optional[Dict] = None):\n        x_spat = x[..., :7]\n        t =\
    \ jnp.mean(x[..., 7:8], axis=(1,2))\n        B, H, W, _ = x_spat.shape\n     \
    \   \n        cnn_out = nn.Conv(self.cnn_features_1, (3,3), padding='SAME', kernel_dilation=(self.dilation,\
    \ self.dilation), kernel_init=nn.initializers.xavier_uniform())(x_spat)\n    \
    \    cnn_out = nn.relu(cnn_out)\n        cnn_out = BottleneckBlock(self.cnn_features_1,\
    \ ratio=self.bottleneck_ratio)(cnn_out)\n        cnn_out = nn.Conv(features=self.cnn_features_2,\
    \ kernel_size=(3, 3), padding='SAME', kernel_dilation=(self.dilation, self.dilation),\
    \ name=\"conv_dilation_2\")(cnn_out) \n        cnn_out = nn.relu(cnn_out)\n  \
    \      cnn_out = BottleneckBlock(self.cnn_features_2, ratio=self.bottleneck_ratio)(cnn_out)\n\
    \        \n        cnn_out = SqueezeExcitationBlock(reduction_ratio=self.se_reduction_ratio)(cnn_out)\n\
    \        cnn_out = nn.LayerNorm(name=\"layernorm_after_se\")(cnn_out) \n     \
    \   \n        if rnn_state is None:\n            zeros = lambda: jnp.zeros((B,\
    \ H, W, self.conv_lstm_features), dtype=x.dtype)\n            rnn_state = {'h':\
    \ zeros(), 'c': zeros()}\n        if done is not None:\n            m = (1.0 -\
    \ done.reshape(B,1,1,1).astype(x.dtype))\n            rnn_state = {'h': rnn_state['h']\
    \ * m, 'c': rnn_state['c'] * m}\n        cell = ConvLSTMCellLN(self.conv_lstm_features)\n\
    \        (h, c), h_out = cell((rnn_state['h'], rnn_state['c']), cnn_out)\n   \
    \     new_rnn_state = {'h': h, 'c': c}\n        \n        attn_logits = nn.Conv(1,\
    \ (1,1), padding='SAME')(h_out)\n        attn = nn.softmax(attn_logits.reshape(B,\
    \ -1), axis=-1)\n        z_spat = jnp.einsum('bhc,bh->bc', h_out.reshape(B, -1,\
    \ h_out.shape[-1]), attn)\n        \n        z = jnp.concatenate([z_spat, t],\
    \ axis=-1)\n        \n        z = nn.Dense(256, name=\"shared_mlp\")(z); z = nn.relu(z)\n\
    \        policy_logits = nn.Dense(4, name=\"policy_head\")(z)\n        value =\
    \ nn.Dense(1, name=\"value_head\")(z).squeeze(-1)\n        \n        return policy_logits,\
    \ value, new_rnn_state\n\ndef _l2(x: jnp.ndarray) -> float:\n    return float(jnp.sqrt(jnp.sum(jnp.square(x)))\
    \ + 0.0)\n\ndef test():\n    # Fixed hyperparameters for Nomos II SOTA\n    hparams_nomos_sota\
    \ = {\n        'cnn_features_1': 32, 'cnn_features_2': 64, 'conv_lstm_features':\
    \ 96,\n        'dilation': 5, 'bottleneck_ratio': 0.25\n    }\n    hparams_nomos_sota_se_ln\
    \ = {**hparams_nomos_sota, 'se_reduction_ratio': 16}\n\n    env = create_train_env(time_limit=120)\n\
    \    batch_size = 4\n    key = jax.random.PRNGKey(0)\n    keys = jax.random.split(key,\
    \ batch_size)\n    \n    obs_batch, _ = jax.vmap(env.reset)(keys)\n    dummy_done\
    \ = jnp.zeros((batch_size,), dtype=bool)\n    dummy_rnn_state = None # Initial\
    \ RNN state, will be reset by network on first call\n\n    net_base = SingleStepWideLSTM_Base_FullNetwork(**hparams_nomos_sota)\n\
    \    net_se_ln = SingleStepWideLSTM_ChannelAttention_LayerNorm_FullNetwork(**hparams_nomos_sota_se_ln)\n\
    \    \n    key, init_key_base, init_key_se_ln = jax.random.split(key, 3)\n   \
    \ params_base = net_base.init(init_key_base, obs_batch, dummy_done, dummy_rnn_state)\n\
    \    params_se_ln = net_se_ln.init(init_key_se_ln, obs_batch, dummy_done, dummy_rnn_state)\n\
    \n    # Synthetic targets for loss calculation\n    logits_base, values_base,\
    \ _ = net_base.apply(params_base, obs_batch, dummy_done, dummy_rnn_state)\n  \
    \  actions_batch = jnp.argmax(logits_base, axis=-1)\n    advantages_batch = jnp.ones((batch_size,))\
    \ * 0.5\n    returns_batch = values_base + 0.5\n\n    # Define loss functions\
    \ for gradient calculation\n    def policy_loss_fn(p, obs, done, actions, advantages,\
    \ hparams):\n        logits, _, _ = net_base.apply(p, obs, done, dummy_rnn_state)\
    \ # Using net_base for apply\n        log_probs = jax.nn.log_softmax(logits, axis=-1)\n\
    \        idx = (jnp.arange(batch_size), actions)\n        policy_loss = -jnp.mean(advantages\
    \ * log_probs[idx])\n        entropy = -jnp.mean(jnp.sum(jax.nn.softmax(logits,\
    \ axis=-1) * log_probs, axis=-1))\n        return policy_loss - hparams.get('entropy_coef',\
    \ 0.01) * entropy\n\n    def value_loss_fn(p, obs, done, returns, hparams):\n\
    \        _, values, _ = net_base.apply(p, obs, done, dummy_rnn_state) # Using\
    \ net_base for apply\n        value_loss = 0.5 * jnp.mean((values - returns)**2)\n\
    \        return value_loss\n    \n    # Compute gradients for base network\n \
    \   hparams_dummy = {'entropy_coef': 0.01, 'value_loss_coef': 0.5} # Dummy hparams\
    \ for loss_fn\n    _, grads_policy_base = jax.value_and_grad(policy_loss_fn)(\n\
    \        params_base, obs_batch, dummy_done, actions_batch, advantages_batch,\
    \ hparams_dummy\n    )\n    _, grads_value_base = jax.value_and_grad(value_loss_fn)(\n\
    \        params_base, obs_batch, dummy_done, returns_batch, hparams_dummy\n  \
    \  )\n\n    # Compute gradients for SE+LN network\n    _, grads_policy_se_ln =\
    \ jax.value_and_grad(policy_loss_fn, argnums=0)( # argnums=0 to grad wrt params\n\
    \        params_se_ln, obs_batch, dummy_done, actions_batch, advantages_batch,\
    \ hparams_dummy\n    )\n    _, grads_value_se_ln = jax.value_and_grad(value_loss_fn,\
    \ argnums=0)(\n        params_se_ln, obs_batch, dummy_done, returns_batch, hparams_dummy\n\
    \    )\n\n    # Extract gradient norms for policy_head and value_head\n    policy_gnorm_base\
    \ = _l2(grads_policy_base['params']['policy_head']['kernel']) + _l2(grads_policy_base['params']['policy_head']['bias'])\n\
    \    value_gnorm_base = _l2(grads_value_base['params']['value_head']['kernel'])\
    \ + _l2(grads_value_base['params']['value_head']['bias'])\n    \n    policy_gnorm_se_ln\
    \ = _l2(grads_policy_se_ln['params']['policy_head']['kernel']) + _l2(grads_policy_se_ln['params']['policy_head']['bias'])\n\
    \    value_gnorm_se_ln = _l2(grads_value_se_ln['params']['value_head']['kernel'])\
    \ + _l2(grads_value_se_ln['params']['value_head']['bias'])\n    \n    # Calculate\
    \ R_vp\n    r_vp_base = value_gnorm_base / policy_gnorm_base if policy_gnorm_base\
    \ != 0 else 'NaN'\n    r_vp_se_ln = value_gnorm_se_ln / policy_gnorm_se_ln if\
    \ policy_gnorm_se_ln != 0 else 'NaN'\n\n    out = {\n        \"probe_type\": \"\
    gradient_norm_ratio_r_vp\",\n        \"hparams_base\": hparams_nomos_sota,\n \
    \       \"hparams_se_ln\": hparams_nomos_sota_se_ln,\n        \"policy_gnorm_base\"\
    : policy_gnorm_base,\n        \"value_gnorm_base\": value_gnorm_base,\n      \
    \  \"r_vp_base\": r_vp_base,\n        \"policy_gnorm_se_ln\": policy_gnorm_se_ln,\n\
    \        \"value_gnorm_se_ln\": value_gnorm_se_ln,\n        \"r_vp_se_ln\": r_vp_se_ln,\n\
    \        \"relative_r_vp_change\": (r_vp_se_ln - r_vp_base) / r_vp_base if r_vp_base\
    \ != 'NaN' and r_vp_base != 0 else 'NaN',\n    }\n\n    os.makedirs(\"storage/insight/results\"\
    , exist_ok=True)\n    path = f\"storage/insight/results/gradient_probe_rvp_tick_{int(time.time())}.json\"\
    \ \n    with open(path, \"w\") as f:\n        json.dump(out, f, indent=2)\n  \
    \  print(f\"DEBUG: {out}\")\n    print(f\"Wrote {path}\")\n    return out\n\n\
    no_debugger: True\n"
