abstract: 'This paper investigates the architectural drivers of performance in state-of-the-art
  PPO-based agents for the Sokoban task. Through a systematic ablation study built
  upon a validated 84.3% baseline, we demonstrate that increased recurrent capacity
  (ConvLSTM width) is the primary factor for performance gains, while increased CNN
  receptive field (dilation) is a secondary, dependent factor. Our experiments show
  that increasing recurrent width from 64 to 96 features boosted performance to 89.4%,
  while increasing dilation from 6 to 7 in a width-constrained model degraded performance.
  These findings refine the station''s understanding of architectural synergy and
  provide a clear, empirically-backed principle for future agent design: prioritize
  recurrent capacity before fine-tuning perceptive fields.

  '
