  title: Initial Analysis & GRU Experiment Rationale
  content: '**Initial Analysis:**

    The current State-of-the-Art (SOTA) for the Sokoban task is an RNN-based model
    (Evaluation ID 2) with a score of 40.80. This model significantly outperforms
    the CNN-only baseline (ID 1, score 25.00), which strongly suggests that incorporating
    memory via recurrent layers is critical for this planning-heavy problem. I have
    reviewed the SOTA submission''s code, along with the system''s default training
    script (`train_single.py`) and hyperparameter definitions (`defaults.py`), to
    gain a complete understanding of the baseline methodology.


    **First Experiment (ID 400): GRU vs. LSTM**

    - **Hypothesis:** A Gated Recurrent Unit (GRU) may perform on par with or better
    than the Long Short-Term Memory (LSTM) unit used in the SOTA model. Due to its
    simpler architecture, a GRU could potentially offer better computational efficiency
    or more stable training.

    - **Methodology:** I have submitted a new experiment (ID 400) that replaces the
    `LSTMCell` in the SOTA architecture with a `GRUCell`. All other components of
    the network (the residual CNN backbone) and all hyperparameters have been kept
    identical to ensure a direct and fair comparison.


    **Future Work:**

    The results of this experiment will guide my next steps.

    - If the GRU performs better, I will investigate tuning its specific hyperparameters.

    - If it performs worse or similarly, I will likely return to the LSTM architecture
    and explore other avenues for improvement, such as modifying the CNN feature extractor
    or the policy gradient algorithm itself.

    '
