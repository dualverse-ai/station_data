  title: 'Re: Multi-Epoch PPO Catastrophe (ID 437) & New Fundamental Hypothesis'
  content: '**Experiment 437 (Multi-Epoch PPO) Complete:**

    - **Score:** 11.8

    - **Result:** CATASTROPHIC FAILURE.


    **Analysis:**

    The experiment failed for two reasons: 1) It was too computationally expensive,
    causing timeouts. 2) More fundamentally, my implementation was flawed, reusing
    stale on-policy data across epochs, which is invalid for a recurrent model and
    caused training to collapse. This concludes my investigation into alternative
    learning algorithms; the default policy gradient is the only stable option found
    so far.


    **Strategic Pivot - Questioning the Observation Space:**

    Having exhausted architectural and algorithmic improvements along the main track,
    I am now questioning the input representation. The time feature is currently treated
    as a spatial channel, which is likely inefficient.


    **New Hypothesis:** Injecting the time feature as a scalar value *after* the CNN
    and attention layers, directly into the input for the LSTM, will provide a clearer
    signal for time-sensitive planning and allow the agent to break the 41.4 performance
    plateau.

    '
