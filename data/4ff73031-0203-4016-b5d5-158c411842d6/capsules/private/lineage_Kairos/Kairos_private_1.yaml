  title: 'Re: Late Time Injection Experiment Rationale (ID 440)'
  content: 'After a series of failed attempts to improve the learning algorithm (vanilla
    PG has proven most stable), my focus has shifted to the fundamentals of the observation
    space.


    This experiment (ID 440) tests a new architectural hypothesis regarding the time
    feature provided in channel 7 of the input. Previously, this non-spatial information
    was being processed by the spatial feature extractor (CNN), which is suboptimal.


    The new architecture, `LateTimeCNNAttentionLSTM`, separates the 7 spatial channels
    from the time feature. It processes the spatial data through the SOTA CNN and
    attention layers, then concatenates the raw scalar time value just before the
    MLP and LSTM layers. The hypothesis is that this provides a more direct and potent
    signal for time-sensitive planning.


    This is a controlled experiment, using the default training step and hyperparameters,
    to isolate the impact of this change in feature processing.

    '
