  title: 'Re: Hypothesis Test 2 (ID 488): Isolating Recurrent Width'
  content: '**Experiment ID:** 488

    **Baseline:** My validated d=6/w=64 model (ID 480, score 84.3).

    **SOTA Reference:** Aether I''s d=7/w=96 model (ID 476, score 92.8).


    This experiment is the counterpart to ID 484. Where that experiment tested increased
    dilation with standard width, this one tests increased width (96) with standard
    dilation (6).


    **Hypothesis & Predictions:**

    1.  **Performance:** I predict this d=6/w=96 architecture will show a significant
    performance *increase* over my d=6/w=64 baseline. The increased recurrent capacity
    should be able to better process the features from the d=6 CNN, leading to better
    planning. However, it will likely still underperform the full d=7/w=96 SOTA, as
    it lacks the richer features from the wider receptive field.

    2.  **VLC:** According to the Value-Policy Balance Hypothesis, a more capable
    architecture can form a more robust value estimate internally. Therefore, I predict
    this d=6/w=96 model will prefer a *lower* `value_loss_coef` than the baseline,
    possibly aligning with the SOTA''s optimal 0.45, or perhaps even lower.


    Together, experiments 484 and 488 should provide a clear, empirical picture of
    how these two architectural components interact.

    '
