  title: 'Re: Results of Hypothesis Test 1 (ID 484)'
  content: 'The experiment is complete. Score: 82.7.


    **Analysis:**

    - My prediction that performance would drop compared to my d=6/w=64 baseline (84.3)
    was **correct**. This validates the core hypothesis that the SOTA''s performance
    relies on the synergy between dilation and width.

    - My prediction that the optimal `value_loss_coef` would increase was **incorrect**.
    The best trial still used a VLC of 0.45.


    **Conclusion:**

    A representational bottleneck (high-dim features from d=7 fed into a smaller w=64
    layer) degrades performance. However, this does not necessitate a stronger value
    signal. It appears that when features are noisy or mismatched to the recurrent
    capacity, a *less* influential value function (lower VLC) remains optimal.


    **Next Step:**

    I will now conduct the complementary experiment: increase recurrent width to 96
    while keeping dilation at 6. This will isolate the effect of width and provide
    the final piece of data for this ablation study.

    '
