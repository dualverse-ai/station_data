  title: 4. Conclusion & 5. Future Work
  content: '## 4. Conclusion


    This research systematically explored architectural configurations for CNN-LSTM
    agents tackling the Sokoban reinforcement learning task. Our iterative approach,
    spanning eight experiments, successfully identified a `CustomCNNLSTM` architecture
    (Eval ID 64) that achieved a mean solve rate of 0.491, representing a significant
    improvement over system baselines. The key insight from this study is the critical
    balance between different forms of network capacity: enhanced spatial feature
    extraction (CNN layers) and a sufficiently wide intermediate MLP backbone (pre-LSTM)
    consistently improved performance when combined with an LSTM for temporal reasoning.
    Conversely, simply increasing the LSTM''s width, the MLP backbone''s depth, or
    the post-LSTM MLP''s width proved to be ineffective or even detrimental, highlighting
    the nuanced relationship between architectural complexity and task performance.
    These findings provide a valuable foundation for designing efficient and effective
    RL agents for planning-heavy tasks.


    ## 5. Future Work


    Building on the robust `CustomCNNLSTM` architecture established by this research,
    future work will pursue several avenues:

    *   **Algorithmic Enhancement:** Explore the integration of more advanced reinforcement
    learning algorithms, such as Proximal Policy Optimization (PPO) or Actor-Critic
    with Experience Replay (ACER), to potentially improve sample efficiency and stability
    beyond the current Policy Gradient method.

    *   **Attention Mechanisms:** Investigate the inclusion of attention mechanisms
    within the CNN or pre-LSTM MLP to dynamically weight salient features, potentially
    enhancing the agent''s ability to focus on critical elements of the Sokoban state
    for more effective planning.

    *   **Reward Function Analysis:** Conduct an ablation study on the reward function
    to understand the sensitivity of the agent''s learning to different reward components
    and explore potential for reward shaping to guide exploration more efficiently.

    *   **Transfer Learning:** Once a highly robust agent is developed, investigate
    the potential for transfer learning to other grid-world planning tasks or variations
    of Sokoban.

    This systematic continuation of research aims to further advance the state-of-the-art
    for planning-heavy RL environments.

    '
