  title: 3. Results
  content: '## 3. Results


    Our systematic architectural exploration involved eight distinct experiments,
    each building upon insights from previous evaluations. A summary of all experiments,
    their architectural configurations, and mean solve rates is presented in Table
    1.


    **Table 1: Summary of Experimental Evaluations and Results**


    | Evaluation ID | Architecture Description                                   |
    Key Parameters Modified          | Mean Solve Rate | Std. Dev. | Notes                                |

    |---------------|------------------------------------------------------------|----------------------------------|-----------------|-----------|--------------------------------------|

    | 1             | System CNN + Policy Gradient (Baseline)                    |
    N/A                              | 0.250           | N/A       | System baseline                      |

    | 2             | System RNN + Policy Gradient (Baseline)                    |
    N/A                              | 0.408           | 0.022     | System baseline
    (RNN superior)       |

    | 4             | Custom CNN with Increased Features (48, 96)              | `cnn_features_1=48`,
    `cnn_features_2=96` | 0.291           | 0.011     | Improved over System CNN             |

    | 14            | Custom CNNLSTM (48, 96 CNN; 256 LSTM)                      |
    `lstm_features=256`              | **0.462**       | 0.008     | **New High Score:
    LSTM''s importance**|

    | 26            | Hyperparameter Tuning for Eval ID 14                       |
    `lr`, `entropy_coef`, `value_loss_coef` tuned | 0.382           | 0.071     |
    Broader search reduced mean perf.    |

    | 38            | Custom CNNLSTM (48, 96 CNN; 512 LSTM)                      |
    `lstm_features=512`              | 0.452           | 0.009     | Increased LSTM
    width not beneficial  |

    | 51            | Custom CNNLSTM (64, 128 CNN; 256 LSTM)                     |
    `cnn_features_1=64`, `cnn_features_2=128` | **0.479**       | 0.023     | **New
    High Score: Richer CNN features** |

    | 64            | Custom CNNLSTM (64, 128 CNN; 256 LSTM; 512 Pre-LSTM MLP)   |
    `mlp_features=512` (pre-LSTM)    | **0.491**       | 0.013     | **New High Score:
    Wider Pre-LSTM MLP** |

    | 73            | Custom CNNLSTM (64, 128 CNN; 256 LSTM; Deeper Pre-LSTM MLP)
    | `mlp_dense1=512`, `mlp_dense2=256` | 0.446           | 0.010     | Deeper Pre-LSTM
    MLP not beneficial   |

    | 82            | Custom CNNLSTM (64, 128 CNN; 256 LSTM; 256 Post-LSTM MLP)  |
    `post_lstm_mlp_features=256`     | 0.476           | 0.022     | Wider Post-LSTM
    MLP not beneficial   |


    ### 3.1. Detailed Analysis


    **Initial Baselines and CNN Improvement (Eval IDs 1, 2, 4):** The system''s CNN
    baseline (ID 1) achieved a solve rate of 0.250. The RNN baseline (ID 2), with
    its temporal memory, significantly outperformed it at 0.408, indicating the task''s
    planning demands. Our initial custom CNN (ID 4), with moderately increased feature
    maps (48 and 96), showed a modest improvement to 0.291, suggesting that architectural
    capacity in the convolutional layers could be beneficial.


    **The Impact of LSTM (Eval ID 14):** Integrating an LSTM layer with 256 features
    into our custom CNN (ID 14) resulted in a substantial performance leap to a mean
    solve rate of **0.462**. This clearly demonstrated that explicit temporal memory
    processing is critical for navigating the sequential dependencies of the Sokoban
    puzzle, far surpassing the capabilities of purely feedforward CNNs. This established
    our first high-performing architecture.


    **Hyperparameter Sensitivity (Eval ID 26):** A broad hyperparameter tuning search
    for the Eval ID 14 architecture yielded an average score of 0.382. While one seed
    achieved a respectable 0.450, the overall mean decreased, indicating that the
    initial fixed hyperparameters were quite robust, and a wide search space introduced
    less optimal or unstable configurations. This suggests a need for more constrained
    tuning or a deeper understanding of parameter interactions.


    **LSTM Capacity Exploration (Eval ID 38):** Doubling the LSTM feature size from
    256 to 512 (ID 38) resulted in a slight performance reduction to 0.452. This was
    a critical negative finding, indicating that simply increasing the width of the
    LSTM layer does not necessarily translate to improved temporal reasoning and may
    introduce unnecessary complexity or make optimization more challenging.


    **Enhanced CNN Spatial Features (Eval ID 51):** Building on the understanding
    that LSTM capacity alone wasn''t the bottleneck, we further increased the CNN
    feature maps (to 64 and 128). This modification (ID 51) led to a new high score
    of **0.479**. This result confirmed that providing a richer and more detailed
    initial spatial representation significantly benefits the subsequent temporal
    processing by the LSTM, leading to more effective planning.


    **Wider Pre-LSTM MLP Backbone (Eval ID 64):** The next successful architectural
    refinement involved increasing the feature size of the MLP backbone, which processes
    the flattened CNN features before the LSTM, from 256 to 512 units (ID 64). This
    resulted in our highest mean solve rate of **0.491**. This indicates that a more
    abstract and refined representation of the spatial features, prior to temporal
    integration, further aids the LSTM in its planning capabilities.


    **Deeper Pre-LSTM MLP and Post-LSTM MLP (Eval IDs 73, 82):** Attempts to further
    increase complexity by adding a second layer to the pre-LSTM MLP (ID 73) resulted
    in a performance drop to 0.446. Similarly, increasing the width of the MLP after
    the LSTM (ID 82) also decreased performance to 0.476. These are crucial negative
    results, collectively demonstrating that architectural depth and unconstrained
    capacity increases in certain parts of the network can be detrimental. They highlight
    the delicate balance required for optimal performance and suggest that beyond
    a certain point, adding more parameters without targeted structural changes introduces
    redundancy or makes the optimization landscape more difficult.

    '
