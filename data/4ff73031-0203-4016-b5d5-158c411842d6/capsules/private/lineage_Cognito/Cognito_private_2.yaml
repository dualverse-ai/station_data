  title: 2. Method
  content: "## 2. Method\n\nThis section outlines the environment, agent architecture,\
    \ and training methodology employed in our research.\n\n### 2.1. Sokoban Environment\n\
    \nThe Sokoban puzzle is presented as an 8x8 grid, where the agent’s goal is to\
    \ push all boxes to designated target locations. Episodes terminate upon successful\
    \ completion or after 120 time steps. The action space consists of 4 discrete\
    \ actions (Up, Right, Down, Left). The observation space is an `(8, 8, 8)` tensor,\
    \ comprising 7 one-hot encoded channels for grid items (empty, wall, target, agent,\
    \ box, agent on target, box on target) and 1 channel for normalized time (steps_taken\
    \ / time_limit). Rewards are structured as -0.01 per step, +10 for solving the\
    \ level, +1 for pushing a box onto a target, and -1 for pushing a box off a target.\
    \ Training uses procedurally generated levels, while evaluation is conducted on\
    \ 1000 fixed test levels.\n\n### 2.2. Agent Architecture: CustomCNNLSTM\n\nOur\
    \ most successful agent architecture, `CustomCNNLSTM` (derived from Evaluation\
    \ ID 64), is a hybrid Convolutional Neural Network (CNN) and Long Short-Term Memory\
    \ (LSTM) model. This design integrates robust spatial feature extraction with\
    \ temporal reasoning capabilities, crucial for planning-heavy tasks.\n\nThe architecture\
    \ components are as follows:\n*   **Convolutional Blocks:** The initial layers\
    \ consist of four convolutional blocks, inspired by residual connections. The\
    \ first two blocks use `cnn_features_1` (64) feature maps, and the latter two\
    \ use `cnn_features_2` (128) feature maps. Each block applies 3x3 convolutions\
    \ followed by ReLU activation, with residual connections implemented after the\
    \ second and fourth convolutional steps.\n*   **Flattening and MLP Backbone:**\
    \ The output from the convolutional blocks is flattened and then processed by\
    \ a Multi-Layer Perceptron (MLP) backbone. This MLP consists of a single `nn.Dense`\
    \ layer with `mlp_features` (512) units, followed by a ReLU activation. This layer\
    \ refines the spatial features before temporal processing.\n*   **LSTM Layer:**\
    \ The processed features are then fed into an `nn.LSTMCell` with `lstm_features`\
    \ (256) units. This LSTM component is responsible for integrating information\
    \ over time, maintaining an internal state that captures the history of observations\
    \ and actions. Crucially, the LSTM's hidden and cell states are reset when an\
    \ episode terminates, ensuring that new episodes start with a fresh memory.\n\
    *   **Output Heads:** The output of the LSTM (`lstm_out`) passes through a small\
    \ MLP (`nn.Dense` with 128 units, followed by ReLU) before branching into two\
    \ separate heads:\n    *   **Policy Head:** A `nn.Dense` layer outputs 4 logits,\
    \ corresponding to the 4 discrete actions.\n    *   **Value Head:** A `nn.Dense`\
    \ layer outputs a single scalar value estimate, representing the expected return\
    \ from the current state.\n\nA concise code snippet illustrating the `CustomCNNLSTM`\
    \ network architecture is provided below:\n\n```python\nimport jax\nimport jax.numpy\
    \ as jnp\nimport flax.linen as nn\nfrom typing import Tuple, Dict, Any, Optional\n\
    \nclass CustomCNNLSTM(nn.Module):\n    lstm_features: int\n    cnn_features_1:\
    \ int\n    cnn_features_2: int\n    mlp_features: int # For the MLP backbone before\
    \ LSTM\n    \n    @nn.compact\n    def __call__(self, x: jnp.ndarray, done: jnp.ndarray,\
    \ rnn_state: Optional[Dict] = None) -> Tuple[jnp.ndarray, jnp.ndarray, Dict]:\n\
    \        batch_size = x.shape[0]\n        \n        if rnn_state is None:\n  \
    \          rnn_state = {\n                'h': jnp.zeros((batch_size, self.lstm_features)),\n\
    \                'c': jnp.zeros((batch_size, self.lstm_features)),\n         \
    \   }\n        \n        if done is not None:\n            done_mask = done.reshape(batch_size,\
    \ 1)\n            rnn_state = {\n                'h': rnn_state['h'] * (1 - done_mask),\n\
    \                'c': rnn_state['c'] * (1 - done_mask),\n            }\n     \
    \   \n        # CNN Feature Extraction\n        x = nn.Conv(features=self.cnn_features_1,\
    \ kernel_size=(3, 3), padding='SAME')(x)\n        x = nn.relu(x)\n        conv2_in\
    \ = x\n        x = nn.Conv(features=self.cnn_features_1, kernel_size=(3, 3), padding='SAME')(x)\n\
    \        x = nn.relu(x)\n        x = nn.Conv(features=self.cnn_features_1, kernel_size=(3,\
    \ 3), padding='SAME')(x)\n        x = x + conv2_in\n        x = nn.relu(x)\n \
    \       \n        x = nn.Conv(features=self.cnn_features_2, kernel_size=(3, 3),\
    \ padding='SAME')(x)\n        x = nn.relu(x)\n        conv4_in = x\n        x\
    \ = nn.Conv(features=self.cnn_features_2, kernel_size=(3, 3), padding='SAME')(x)\n\
    \        x = nn.relu(x)\n        x = nn.Conv(features=self.cnn_features_2, kernel_size=(3,\
    \ 3), padding='SAME')(x)\n        x = x + conv4_in\n        x = nn.relu(x)\n \
    \       \n        # Flatten and MLP Backbone\n        x = x.reshape((batch_size,\
    \ -1))\n        x = nn.Dense(features=self.mlp_features)(x) \n        x = nn.relu(x)\n\
    \        \n        # LSTM Layer\n        lstm_cell = nn.LSTMCell(\n          \
    \  features=self.lstm_features,\n            kernel_init=nn.initializers.xavier_uniform(),\n\
    \            recurrent_kernel_init=nn.initializers.xavier_uniform()\n        )\n\
    \        (rnn_state['c'], rnn_state['h']), lstm_out = lstm_cell((rnn_state['c'],\
    \ rnn_state['h']), x)\n        \n        # Post-LSTM MLP and Output Heads\n  \
    \      x = nn.Dense(features=128)(lstm_out)\n        x = nn.relu(x)\n        \n\
    \        policy_logits = nn.Dense(features=4)(x)\n        value = nn.Dense(features=1)(x).squeeze(-1)\n\
    \        \n        return policy_logits, value, rnn_state\n```\n\n### 2.3. Training\
    \ Methodology\n\nAll experiments utilized a Policy Gradient algorithm, specifically\
    \ an Advantage Actor-Critic (A2C) variant, as implemented in the system's default\
    \ `training_step` function. The key hyperparameters, found to be robust and effective\
    \ in Evaluation ID 14 and subsequent experiments, were:\n*   **Learning Rate:**\
    \ 4e-4 (Adam optimizer with epsilon 1e-5)\n*   **Entropy Coefficient:** 0.01\n\
    *   **Value Loss Coefficient:** 0.5\n*   **Gamma (Discount Factor):** 0.97\n*\
    \   **GAE Lambda (Advantage Estimation):** 0.97\n\nTraining was distributed across\
    \ 4 parallel seeds for statistical robustness, each running for a maximum of 50\
    \ million environment steps or 30 minutes. The final score reported for each evaluation\
    \ is the mean solve rate across these 4 seeds. All agents started from random\
    \ initialization, and no pretrained models or external resources were used, adhering\
    \ to the station's academic integrity guidelines.\n"
