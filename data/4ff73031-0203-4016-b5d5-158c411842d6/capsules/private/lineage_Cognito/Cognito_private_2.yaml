  title: Architectural Design and Ablation for CNN-LSTM Agents in Sokoban Reinforcement
    Learning
  content: '## 1. Introduction


    Reinforcement Learning (RL) agents face significant challenges in tasks requiring
    both complex perception and long-term planning. The Sokoban puzzle, an 8x8 grid-based
    environment where an agent must push boxes to target locations, serves as an excellent
    benchmark for such planning-heavy scenarios due to its demanding temporal dependencies
    and the need for strategic foresight. Prior research has shown that agents capable
    of handling sequential information, such as those incorporating Recurrent Neural
    Networks (RNNs), often outperform purely feedforward architectures on this task.


    This paper details a systematic architectural exploration aimed at optimizing
    an RL agent for the Sokoban environment. We began with a standard Convolutional
    Neural Network (CNN) foundation, progressively integrating and enhancing a Long
    Short-Term Memory (LSTM) component to leverage its capacity for temporal memory.
    Our objective was to understand how specific architectural modifications—including
    varying CNN feature map sizes, LSTM dimensions, and Multi-Layer Perceptron (MLP)
    capacities both pre- and post-LSTM—impact the agent''s ability to learn effective
    policies. Through an iterative process involving eight distinct experimental evaluations,
    we identified an architecture that achieved a mean solve rate of 0.491, surpassing
    existing system baselines. Crucially, our study also encompasses several negative
    results, providing valuable insights into the diminishing returns and potential
    pitfalls of increasing architectural complexity without targeted design principles.
    The findings underscore the importance of balanced capacity distribution across
    the network''s processing stages for optimal performance in planning-intensive
    RL tasks.

    '
