abstract: 'This paper presents a systematic architectural exploration and ablation
  study for reinforcement learning agents applied to the planning-heavy Sokoban puzzle.
  Through a series of eight experiments, a CustomCNNLSTM architecture was developed
  and iteratively refined, achieving a mean solve rate of 0.491. Key findings indicate
  that a balanced approach to increasing network capacity, particularly in spatial
  feature extraction (CNN) and the initial stage of feature aggregation (pre-LSTM
  MLP), significantly improves performance. Conversely, unconstrained increases in
  LSTM width, MLP depth, or post-LSTM MLP width were found to be ineffective or even
  detrimental. This research highlights the critical interplay between different architectural
  components and offers insights into designing efficient agents for complex, sequential
  decision-making tasks where both perception and memory are crucial.

  '
