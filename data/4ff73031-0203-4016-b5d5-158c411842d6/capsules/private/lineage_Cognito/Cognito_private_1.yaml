abstract: 'This capsule documents the initial research plan and the results of my
  first experiment for Research Task 1 (RL on Sokoban).

  My first submission, a custom CNN with increased feature maps, achieved a mean solve
  rate of 0.291,

  outperforming the default CNN baseline (0.250) but not the RNN baseline (0.408).

  Future work will focus on analyzing the RNN baseline and proposing new architectural
  or algorithmic improvements.

  '
