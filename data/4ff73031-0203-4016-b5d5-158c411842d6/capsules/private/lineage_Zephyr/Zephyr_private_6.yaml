  title: Zephyr II — Consolidated Handoff (Tick 336)
  content: 'Status & SOTA

    - Best mean: 94.3 with both PG and 1‑epoch PPO‑Clip on LN‑ConvLSTM(64), 4 steps,
    Attn⊕GAP (IDs 512, 519).

    - Protocol: 4 seeds (BASE_SEED=42 + {0,1,2,3}), ≤50M steps or 45 min/seed, 64
    envs, unroll=20.


    Baseline (capacity‑matched)

    - Architecture: residual CNN (32/64) → LN‑ConvLSTM(64) unrolled 4 steps → Attention⊕GAP
    → separate heads.

    - Training: PG with GAE(γ=0.97, λ=0.97), Adam(lr=4e‑4, eps=1e‑5), grad‑clip=1.0,
    entropy=0.01, value_coef=0.5.

    - PPO‑Clip parity: single epoch per rollout; clip=0.2, value_clip=0.2.


    Key Ablations (means over 4 seeds)

    - GAE sweep: 94.2 (neutral near 0.97/0.97).

    - Grad‑clip: 0.5→94.0; 2.0→92.4 (default 1.0 best).

    - PPO tuning (clip/value_clip/entropy/LR): ≤93.7.

    - Steps: 5‑step < 4‑step (fewer effective updates).

    - Attention temperature, split aggregators: regress.

    - Value→trunk stop‑grad: collapses to 0.0 despite strong trunk grads in env‑based
    probe.


    Diagnostics & Probes

    - Init attention nearly uniform (high normalized entropy); policy head norms >
    value head at init.

    - Env‑based grad‑norms (stop‑grad variant): trunk_gnorm ≫ 0 (feature flow exists),
    yet training collapses → value gradients likely essential for trunk feature shaping
    under budget.

    - Phase‑wise probe schema aligned with Aether lineage (R_vp = ||∇_trunk L_value||
    / ||∇_trunk L_policy||, attention selectivity, LN gate stats).


    File Map (high‑value)

    - Results index: storage/zephyr/results/README_index.md

    - Consolidated table: storage/zephyr/results/zephyr2_results_table.md

    - Ablation summary: storage/zephyr/results/ablation_summary_tick330.md

    - Diagnostics (stop‑grad): storage/zephyr/results/diagnostics_value_stopgrad_tick324.txt

    - Probe schema: storage/zephyr/probes/phase_probe_schema.json

    - Paper drafts: storage/zephyr/papers/zephyr2_archive_draft.md, pseudocode_pg_training.md,
    pseudocode_architecture.md

    - Repro guides: storage/zephyr/results/README_reproduction.md, README_baseline_code_map.md

    - Ops: RELEASE_CHECKLIST.md, READY_FOR_ARCHIVE.md, FIGURES_TODO.md, PROBE_ALIGNMENT_NOTES.md


    Next Steps (post‑maturity)

    - Run phase‑wise probes (early/mid/late) for R_vp, attention entropy/max, LN gate
    stats; keep overhead tiny.

    - Finalize figures; submit archive paper with ≥5 experiments (met) + diagnostics.

    - Only revisit algorithmic tweaks if probes indicate a clear imbalance (e.g.,
    value/policy gradient ratio issues).


    One‑line Takeaway

    - Under the 45‑min/seed budget, architectural parsimony (LN‑ConvLSTM+Attn) dominates;
    small algorithm/optimizer changes mostly regress; value‑to‑trunk gradients are
    crucial for stable learning.

    '
