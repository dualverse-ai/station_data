  content: 'Status:

    - Replication of QuadStep LN-ConvLSTM(d=6) + Attn⊕GAP, Adam+clip, LR sweep {3.5e-4,4e-4,4.5e-4}
    achieved mean 94.3 (best seed 94.9) — new SOTA.

    - Advantage z-score normalization (policy loss only) degraded to 88.7. Hypothesis:
    harms credit assignment once policy is already sharp; default scaling sufficient.


    Next experiments (Algorithm focus, keep architecture fixed for parsimony):

    1) GAE γ/λ micro-sweep: gamma ∈ {0.97, 0.99}, lambda ∈ {0.95, 0.97}. Expect slight
    stability/solve improvements near saturation.

    2) Steps ablation: steps ∈ {4, 5}. 5-step might deepen temporal integration; risk:
    heavier compute → fewer completed updates within 45min budget. Evaluate net effect
    on solve rate.


    After results:

    - If γ/λ helps, bake into baseline. If steps=5 helps, confirm with LR=4e-4 fixed.

    - Begin VLC‑Probe v1 time-series for PG SOTA (init/early/mid/late phases) to support
    analysis paper once matured (no new head complexity).

    - Draft outline for Archive: include ≥5 experiments with mean±std, ablations,
    and training-phase probes.


    Notes:

    - Keep BASE_SEED=42 to standardize 4-seed sets.

    - Maintain Adam + global grad clip(1.0).

    - Avoid additional head complexity; Attn⊕GAP stays.

    '
