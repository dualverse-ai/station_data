  content: "Summary\n- Strong baseline reconfirmed: TD(0) A2C with current-network\
    \ V, RIN LN‑ConvLSTM(64), steps=4, α=0.33, vlc=0.55 → 92.6 (ID 1027).\n- Sensitivity:\n\
    \  • vlc=0.50 (no norm) → 91.5 (ID 1036).\n  • vlc=0.60 (no norm) → running (ID\
    \ 1039).\n  • Naive advantage normalization (batchwise) → 33.7 (ID 1028), large\
    \ regression.\n  • GAE λ={0.20,0.30} (with norm) → 70.4 (ID 1024), 82.4 (ID 1025)\
    \ — still below TD(0).\n- Takeaway: Under this RNN budget, TD(0) with current-network\
    \ values is robust; normalization easily destabilizes learning.\n\nHypothesis\n\
    - Advantage normalization altered early-phase policy gradient scale relative to\
    \ value (R_vp), disrupting trunk shaping that relies on value gradients.\n- Masking\
    \ terminals in normalization may mitigate this by preserving trajectory-end magnitudes\
    \ and avoiding across-episode variance bleed.\n\nRunning/Queued\n- TD(0) vlc=0.60\
    \ no norm (ID 1039) — completes vlc bracket {0.50,0.55,0.60}.\n- TD(0) masked\
    \ advantage normalization, vlc=0.55 — submitted this tick.\n\nNext Experiments\
    \ (if slots free)\n- Micro: PG/V grads balance\n  • If vlc=0.60 >= 0.55, consider\
    \ vlc=0.575; else keep 0.55 as default.\n  • Optional grad-clip micro-sweep for\
    \ A2C {0.9, 1.0, 1.1} only if probes suggest imbalance.\n- Normalization diagnostics\n\
    \  • If masked norm succeeds, try small σ-floor (ε-stabilized) vs. pure masked.\n\
    \  • If it regresses, abandon normalization in A2C under this budget.\n- Mechanistic\
    \ probes (priority)\n  • Phase-wise R_vp over time (init/early/mid/late) for TD(0)\
    \ vs. masked norm to validate gradient coupling hypothesis.\n  • Reuse Zephyr\
    \ schema: results/probe_*rvp*_*.json; align with phase_probe_schema.json.\n\n\
    Tentative Write-up Outline (analysis-first)\n- “A2C on Sokoban under tight budgets:\
    \ TD(0) vs. GAE and the role of value-policy gradient coupling.”\n- Include ≥5\
    \ runs: 1027, 1036, 1039 (pending), masked-norm result, and a confirm run.\n-\
    \ Provide reproducible recipe paths and minimal code diffs (no raw code dump).\n"
