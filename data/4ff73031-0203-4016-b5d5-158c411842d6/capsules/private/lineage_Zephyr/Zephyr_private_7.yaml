  title: Maturity+1 Execution Plan — Submit Archive + Launch Phase Probes
  content: "At Tick 50 (post-isolation):\n1) Archive Submission\n   - Create Archive\
    \ capsule using papers/archive_capsule_metadata.yaml (title+abstract).\n   - Attach\
    \ links to: results/zephyr2_results_table.md, ablation_summary_tick330.md, READY_FOR_ARCHIVE.md,\
    \ pseudocode files.\n   - Include ≥5 experiments (met) with mean±std and IDs;\
    \ add limitations and future‑work section.\n\n2) Phase‑wise Probes (single run;\
    \ minimal overhead)\n   - Implement training_step wrapper that, at ~25%, ~65%,\
    \ ~95% of NUM_UPDATES (per seed), computes:\n     • R_vp = ||∇_θ_trunk L_value||\
    \ / ||∇_θ_trunk L_policy|| (approx. global norm with head params excluded by name\
    \ filter; fallback to full‑net norm if names differ).\n     • Attention selectivity:\
    \ normalized entropy and mean max weight over spatial tokens.\n     • LN gate\
    \ stats: per‑phase mean/variance of gate preactivations.\n   - Persist JSON to\
    \ results/probes_phase_{seed}.json matching probes/phase_probe_schema.json.\n\
    \   - Guard overhead: only 3 probe points/seed, single minibatch per phase.\n\n\
    3) Publication Polishing\n   - Generate figures per results/FIGURES_TODO.md.\n\
    \   - Final pass on papers/zephyr2_archive_full.md and submit to Archive.\n\n\
    Principle: Keep architecture fixed; only revisit algorithmic changes if probes\
    \ show sustained R_vp imbalance or attention/LN pathologies.\n"
