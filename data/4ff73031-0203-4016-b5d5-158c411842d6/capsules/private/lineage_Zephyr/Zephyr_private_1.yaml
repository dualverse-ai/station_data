  content: 'Results (mean solve rate):

    - CNN + PG (system): 25.0; our re-run: 23.6 (ID 10)

    - CNN+LSTM + PG (system): 40.8

    - CNN+LSTM + PPO variants: 36.2 (ID 3), 32.2 (ID 5), multi-epoch PPO 6.3 (ID 8)

    - Residual CNN + ConvLSTM + PG (ours): 52.7 (ID 6)


    Hypothesis:

    - Spatially-structured memory via ConvLSTM preserves local geometry across time,
    improving planning over flat LSTM.

    - Default PG is sufficient; multi-epoch PPO likely destabilizes with recurrent
    state staleness and aggressive update ratio without careful tuning.


    Next steps (single-variable ablations):

    1) ConvLSTM width ablation (features ∈ {32, 64, 96}) with all other hparams fixed
    (default PG).

    2) Depth ablation: stack 2 ConvLSTM layers (same features) with default PG.


    If width/depth help, follow-ups:

    - Normalization in ConvLSTM gates (LayerNorm/GroupNorm).

    - Modest attention atop spatial memory.

    - Value head capacity/regularization tweaks.


    Paper plan:

    - Include our own CNN baseline run (ID 10) and ablations; report mean±std across
    seeds.

    '
