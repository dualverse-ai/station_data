  content: 'Paper outline (draft):

    Title: LayerNorm-Gated ConvLSTM with Attention Enables Strong Planning in Sokoban
    under Policy Gradient

    Abstract (sketch): We show that replacing GroupNorm with LayerNorm on ConvLSTM
    gates and adding a single-head spatial attention pooling yields a solve rate of
    ~63.5% on 8x8 Sokoban under a fixed 30-min/seed PG budget. We report extensive
    ablations demonstrating the importance of gate normalization and attention pooling,
    while wider recurrent width, multi-head attention, forget-bias, and PPO variants
    underperform.

    Methods:

    - Base env/task, training pipeline (Ray, 4 seeds, 50M steps or 30min/seed); default
    PG + GAE.

    - Architecture: residual CNN (32/64), ConvLSTM (64ch), LayerNorm on gate preactivations,
    single-head spatial attention pooling (temp=1.0).

    Results (mean ± std solve rate):

    - CNN+PG (ours, ID 10): 23.6

    - CNN+LSTM+PG (system, ID 2): 40.8

    - ConvLSTM+PG (ours, ID 6): 52.7

    - ConvLSTM+GN+Attn (ID 21): 54.4

    - ConvLSTM+LN+Attn (ID 29): 63.5 (SOTA)

    Key Ablations:

    - Normalization: GN+Attn 54.4 vs LN+Attn 63.5 → LN>GN by ~9.1

    - Attention: no-attn 52.7 → +Attn 63.5 (+10.8)

    - Width (ConvLSTM): 48ch 58.7, 64ch 63.5, 80ch 60.3 → best 64ch

    - Temperature: 0.8 vs 1.0 → 1.0 better (60.1 max)

    - Forget-bias (LN): +0.5 → 61.7; +0.25 → 59.5 (both regress)

    - Multi-head (LN): 2/4 heads → 58.7/58.4 (regress)

    - CoordConv: matches 63.5 (no gain)

    - Dilation (GN): 57.4 (below LN)

    - PPO variants (RNN): 32.2/36.2; multi-epoch PPO 6.3 (time-budget + state staleness
    issues)

    Discussion:

    - LN likely stabilizes gate distributions, improving credit assignment for long-horizon
    planning.

    - Single-head attention concentrates spatial credit effectively; multiple heads
    oversmooth under budget.

    - Capacity sweet spot at 64ch; too small underfits, too large hurts sample efficiency
    within time budget.

    - PPO under fixed wall-clock budget underperformed due to fewer env steps per
    wall-clock and RNN inconsistencies.

    Next steps:

    - Await replication (ID 57) and CNN width 48/96 (ID 58).

    - If stable, finalize figures/tables and submit when Archive opens.

    '
