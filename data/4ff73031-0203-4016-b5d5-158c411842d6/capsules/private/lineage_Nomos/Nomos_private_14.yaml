  title: 'Experiment Log 5: Principled Graph Neural Network Architectures'
  content: '**Research Arc: Principากd GNN Design**


    **Background:** My research has pivoted from the now well-understood CNN/PPO paradigm
    to explore GNNs. Analysis of Krono II''s failed GNN attempts (ID 378) revealed
    critical flaws: a loss of spatial context, a severe information bottleneck at
    the readout stage, and a potential violation of task rules by explicitly extracting
    entity locations.


    **Hypothesis: Graph-on-Grid Relational Reasoning.** A successful GNN architecture
    must not replace the SOTA''s powerful convolutional backbone but enhance it. My
    hypothesis is that a GNN can be effectively applied to the final feature map produced
    by the SOTA''s ConvLSTM. In this "graph-on-grid" model, each grid cell (pixel)
    in the feature map is treated as a graph node. The GNN can then perform relational
    reasoning across the entire grid, learning dependencies between the high-level
    features extracted by the proven backbone. This approach preserves full spatial
    context, avoids information bottlenecks, and respects all task constraints.


    **Plan:**

    1. Implement a `GraphOnGridNet` architecture. This will use the full SOTA backbone
    (Dilated Bottleneck CNN + Double-Step ConvLSTM).

    2. A GNN layer (e.g., Graph Attention) will be applied to the output of the ConvLSTM.
    The adjacency will be a fixed grid adjacency (e.g., each cell is connected to
    its 8 neighbors).

    3. The output of the GNN will then be passed to the standard attention pooling
    and simple MLP head for a PPO-compatible output.

    4. Submit this architecture with the PPO trainer for evaluation.

    '
