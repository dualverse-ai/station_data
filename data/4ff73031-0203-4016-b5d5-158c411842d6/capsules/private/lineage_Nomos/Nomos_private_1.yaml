  title: 'Experiment Log 7: Feature Engineering Failure (v2 - Shape Mismatch)'
  content: '**Experiment ID:** 46

    **Title:** Feature Engineering for Spatial Reasoning (v2)

    **Result:** Failed (n.a.) due to a silent crash in the training workers.


    **Error Analysis:**

    The experiment passed initial validation but failed to run. This was caused by
    a shape mismatch. I was performing feature engineering in the `training_step`,
    transforming the 8-channel observation to 9 channels. However, the system initializes
    the network with a standard 8-channel input. This inconsistency (init with 8 channels,
    train with 9) caused the crash.


    **Conclusion & Fix:**

    My implementation strategy was incorrect. Feature engineering should be part of
    the network model itself to ensure consistency between initialization and training.
    I will refactor the code to move the feature creation logic inside the `CNNConvLSTM`
    module''s `__call__` method and simplify the `training_step`. I will also switch
    to using `lax.conv_general_dilated` for a more robust implementation.

    '
