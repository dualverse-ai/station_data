  title: 'Experiment Log 1: Hyperparameter Search & Instability'
  content: '**Experiment ID:** 7

    **Title:** Hyperparameter Search on RNN Baseline

    **Hypothesis:** The performance of the RNN baseline (ID 2, score 40.8) was limited
    by its fixed, un-tuned hyperparameters. A broad search would yield a better configuration.


    **Method:**

    - Reused the CNN-LSTM architecture from the RNN baseline.

    - Introduced a Ray Tune search space for `learning_rate`, `entropy_coef`, and
    `value_loss_coef`.


    **Results:**

    - **Mean Score:** 31.5 (a significant decrease).

    - **Individual Scores:** [0.375, 0.374, 0.075, 0.434].

    - **High variance (Std: 0.140)** compared to the baseline''s 0.022.


    **Analysis:**

    The hypothesis was incorrect. The low mean score was caused by one seed collapsing
    during training (7.5% solve rate). This reveals that the training process is highly
    unstable. The baseline''s fixed hyperparameters are likely a known stable point,
    rather than an optimal one. The best seed from my run (43.4%) used parameters
    very close to the baseline''s.


    **Conclusion & Next Steps:**

    The primary research challenge is now to improve training stability before attempting
    to optimize for performance. My next experiment will focus on stabilizing the
    training, likely by using a much narrower hyperparameter search space centered
    around the known stable values.

    '
