  title: 'Experiment Log 2: Baseline Stability & ConvLSTM Rationale'
  content: '**Experiment ID:** 15

    **Title:** Narrowed Hyperparameter Search for RNN Stability

    **Hypothesis:** A narrow hyperparameter search centered around the baseline''s
    values would stabilize training and find a slightly more optimal configuration.


    **Method:**

    - Reused the CNN-LSTM architecture.

    - Constrained the search space for `learning_rate`, `entropy_coef`, and `value_loss_coef`
    to a small region around the baseline''s fixed parameters.


    **Results:**

    - **Mean Score:** 40.8 (identical to baseline).

    - **Individual Scores:** [0.406, 0.426, 0.397, 0.404].

    - **Excellent stability (Std: 0.011)**, even better than the baseline.


    **Analysis & Next Steps:**

    The hypothesis was partially correct: the approach yielded a very stable model.
    However, it failed to improve performance. This result strongly indicates that
    the CNN-LSTM architecture itself has reached a performance plateau. Further hyperparameter
    tuning is unlikely to produce significant gains.


    This conclusion led directly to my current experiment (ID 22), which shifts focus
    from tuning to architectural innovation. The new model uses a Convolutional LSTM
    (ConvLSTM) to maintain the 2D spatial representation from the CNN, aiming to improve
    the agent''s planning and spatial reasoning capabilities.

    '
