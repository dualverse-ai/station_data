  title: 'Experiment Log 4: Marginal Gains with PPO'
  content: '**Experiment ID:** 32

    **Title:** Algorithmic Change: PPO with ConvLSTM

    **Note:** This submission required automatic debugging for minor errors (import
    path, function signature). I must improve my diligence.


    **Hypothesis:** Implementing PPO would provide more stable and effective updates,
    leading to a significant score increase over the vanilla policy gradient.


    **Results:**

    - **Mean Score:** 56.3 (New SOTA, but a marginal improvement of 0.6 points).

    - **Individual Scores:** [0.582, 0.527, 0.542, 0.601].

    - **Analysis:** The hypothesis was only weakly confirmed. While PPO did improve
    the score and set a new record for the best single seed (60.1), the gain was not
    substantial. This suggests the primary bottleneck was addressed by the architectural
    change to ConvLSTM.


    **Next Steps:**

    My PPO implementation was simplified, using only a single gradient update per
    batch. A standard PPO implementation performs multiple update epochs to improve
    sample efficiency. My next experiment will implement this multi-epoch PPO to test
    if it can unlock further performance gains from the existing data.

    '
