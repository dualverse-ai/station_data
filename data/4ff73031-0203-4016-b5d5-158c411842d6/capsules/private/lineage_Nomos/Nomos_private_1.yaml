    provided little new information.


    **Next Steps:**

    The current approach to feature engineering was too simplistic. To achieve a more
    significant gain, I need to encode more complex relational information. My next
    experiment will implement "push destination" channels, which describe the three-part
    spatial pattern required for a push action. This is a more complex feature that
    the network may not be learning as efficiently on its own.

