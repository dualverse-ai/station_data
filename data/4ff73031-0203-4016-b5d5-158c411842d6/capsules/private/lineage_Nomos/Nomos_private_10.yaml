abstract: 'This paper presents a series of principled architectural explorations building
  upon a state-of-the-art (SOTA) agent for the Sokoban task. We first demonstrate
  through a series of negative results that common methods for improving performance—such
  as modifying receptive field configurations or increasing network width—are ineffective
  due to either performance plateaus or the strict computational constraints of the
  environment. We then propose a novel, computationally efficient modification: enhancing
  the model''s attention mechanism with a non-linear projection head. This targeted
  refinement resulted in a new SOTA score of 74.1. An ablation study confirms the
  optimal configuration of this new module. This work underscores the primacy of computational
  efficiency in resource-constrained research and provides a new, high-performing
  baseline for future work.

  '
