  content: '# DRAFT: From Bottlenecks to Breakthroughs: A Systematic Approach to Improving
    Planning Agents for Sokoban


    ## 1. Introduction


    This paper details a series of experiments aimed at improving the performance
    of a reinforcement learning agent on the planning-intensive task of Sokoban. Starting
    from the provided system baselines, we identified and systematically addressed
    three primary bottlenecks limiting performance: training instability, architectural
    representation, and algorithmic efficiency. Through a methodical process of hypothesis,
    experimentation, and analysis, we demonstrate a clear path of improvement, culminating
    in a novel agent architecture and training methodology that significantly surpasses
    the initial state-of-the-art.


    ## 2. Initial Baseline Analysis: The Stability Bottleneck

    *(Experiments ID 7, 15)*


    The initial SOTA was an RNN-based agent (ID 2) with a score of 40.8. Our first
    experiment (ID 7), a broad hyperparameter search, resulted in a catastrophic performance
    collapse (score 31.5) due to high training instability. This falsified the initial
    hypothesis that simple tuning was sufficient and identified stability as the first
    critical bottleneck. A subsequent, narrowed search (ID 15) successfully stabilized
    training by constraining the hyperparameter search space. This experiment reproduced
    the baseline score of 40.8 with much lower variance, confirming that the baseline
    parameters represented a stable, but not necessarily optimal, point. The key takeaway
    was that the architecture itself had reached a performance plateau that could
    not be surpassed with simple tuning.


    ## 3. Architectural Breakthrough: The Representation Bottleneck

    *(Experiment ID 22)*


    Having established the performance limits of the baseline, our research shifted
    to its core architecture. We hypothesized that the flattening of 2D spatial feature
    maps into a 1D vector for the LSTM was a primary representational bottleneck,
    destroying crucial geometric information. To address this, we replaced the standard
    LSTM with a Convolutional LSTM (ConvLSTM). This new architecture (ID 22) resulted
    in a dramatic performance increase to a mean score of 55.7. This confirmed that
    preserving spatial representations throughout the network''s recurrent state is
    critical for effective planning in grid-world environments.


    ## 4. Algorithmic Refinement: The Efficiency Bottleneck

    *(Experiment ID 32)*


    With a superior architecture established, we turned to the training algorithm.
    We replaced the vanilla policy gradient method with Proximal Policy Optimization
    (PPO) to improve training stability and efficiency. This yielded a further, albeit
    smaller, improvement to 56.3 (ID 32), establishing a new and robust SOTA. Subsequent
    experiments with multi-epoch PPO (ID 33) failed due to timeouts, highlighting
    the importance of computational constraints.


    ## 5. Investigating the Observation Space

    *(Experiments ID 50 and pending)*


    Our final line of inquiry addresses the input data itself. A simple feature engineering
    experiment (ID 50), which explicitly marked "pushable" boxes, resulted in another
    minor gain to 56.9. The small margin of improvement suggests such simple relationships
    are already well-captured by the ConvLSTM. We are currently testing a more advanced
    feature engineering approach that highlights complex "push destination" patterns,
    with the hypothesis that making more complex relational information explicit is
    necessary for the next leap in performance.

    '
