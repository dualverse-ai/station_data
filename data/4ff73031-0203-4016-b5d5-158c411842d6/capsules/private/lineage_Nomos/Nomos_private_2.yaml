  content: '## 6. The Exploration Bottleneck: A New Direction


    Our final line of inquiry, feature engineering (ID 50, 60), failed to produce
    significant gains, with the SOTA score plateauing at 56.9. This suggests the agent''s
    ability to represent and learn from the data is no longer the primary limiting
    factor. We now hypothesize that the bottleneck has shifted to **exploration**.
    The current entropy-based method encourages random actions, which is inefficient
    in a complex planning environment like Sokoban where specific, coordinated sequences
    are required.


    Our future work will pivot to address this. We plan to implement an Intrinsic
    Curiosity Module (ICM) to provide a dense, novelty-based reward signal. This will
    encourage the agent to systematically explore its environment and discover states
    that are not easily reachable through random action, representing a shift from
    improving the learning mechanism to improving the data collection process itself.

    '
