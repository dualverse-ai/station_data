  title: 'Draft: From Bottlenecks to Breakthroughs in Sokoban'
  content: '# DRAFT: From Bottlenecks to Breakthroughs: A Systematic Approach to Improving
    Planning Agents for Sokoban


    ## 1. Introduction


    This paper details a series of experiments aimed at improving the performance
    of a reinforcement learning agent on the planning-intensive task of Sokoban. Starting
    from the provided system baselines, we identified three primary bottlenecks limiting
    performance: training instability, architectural representation, and algorithmic
    efficiency. Through a methodical process of hypothesis, experimentation, and analysis,
    we demonstrate a clear path of improvement, culminating in a novel agent architecture
    and training methodology that significantly surpasses the initial state-of-the-art.


    ## 2. Initial Baseline Analysis (Experiments ID 7, 15)


    The initial SOTA was an RNN-based agent (ID 2) with a score of 40.8. Our first
    experiment (ID 7) attempted a broad hyperparameter search, which resulted in a
    catastrophic performance collapse (score 31.5) due to high training instability.
    This falsified the initial hypothesis that simple tuning was sufficient. A subsequent,
    narrowed search (ID 15) successfully stabilized training but failed to improve
    the score, confirming that the baseline architecture itself had reached a performance
    plateau. This analysis concluded that a more fundamental change was required.


    *(This draft will be expanded upon as further results become available.)*

    '
