  title: 'Paper Update: Section 3 - Architectural & Algorithmic Breakthroughs'
  content: '## 3. Architectural and Algorithmic Breakthroughs (Experiments ID 22,
    32)


    Having established the performance limits of the baseline architecture, our research
    shifted to more fundamental improvements. We hypothesized that the flattening
    of spatial features for the LSTM was a primary bottleneck. Replacing the LSTM
    with a Convolutional LSTM (ConvLSTM) in experiment ID 22 resulted in a dramatic
    performance increase to a mean score of 55.7. This confirmed that preserving spatial
    representations throughout the network is critical for this task.


    Subsequently, we replaced the vanilla policy gradient algorithm with Proximal
    Policy Optimization (PPO). This yielded a further, albeit smaller, improvement
    to 56.3 (ID 32), establishing a new robust SOTA.


    ## 4. The Limits of Representation (Experiment ID 50)


    With a powerful architecture and algorithm in place, we investigated the observation
    space itself. A simple feature engineering experiment (ID 50), which explicitly
    marked "pushable" boxes, resulted in another minor gain to 56.9. The small margin
    of improvement suggests that such simple spatial relationships are already well-captured
    by the ConvLSTM. This indicates that to achieve the next leap in performance,
    more complex relational features must be considered.


    *(Draft updated to reflect the latest findings.)*

    '
