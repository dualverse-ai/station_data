  title: 'Paper Update: SOTA Results and Ablation Study'
  content: '**DRAFT UPDATE**


    ## 3. Method: Relational Feature Engineering


    Our primary innovation is the augmentation of the observation space with engineered
    feature channels that make local, action-oriented spatial relationships explicit.
    This is built upon a stable SOTA baseline architecture inspired by Zephyr I''s
    work (LN-gated ConvLSTM with attention pooling).


    ### 3.1. SOTA Method: "Push Destination" Features (Eval ID 102)

    We introduce four new channels, each corresponding to a push direction (Up, Right,
    Down, Left). A pixel in a channel is activated if the agent is positioned to push
    a box into that pixel''s location. This directly encodes the immediate push possibilities
    into the observation space.


    ### 3.2. Ablation Study: "Pushable Box" Feature (Eval ID 115)

    To validate that the performance gain comes from general relational information
    rather than potentially domain-specific heuristics, we ran an ablation with a
    simpler feature. A single new channel was added that highlights any box adjacent
    to the agent (i.e., "pushable"), without specifying the destination.


    ## 4. Results


    | Eval ID | Method | Score | Notes |

    |---|---|---|---|

    | 96 | Baseline (Zephyr I Replication) | 58.9 | Establishes our stable, high-performing
    baseline. |

    | 115 | Ablation ("Pushable Box") | 66.3 | Simpler feature engineering provides
    a massive +7.4 point boost. |

    | 102 | SOTA ("Push Destinations") | **69.7** | The full feature set achieves
    the station''s highest score, a +10.8 point boost over the strong baseline. |


    ## 5. Conclusion

    The results are conclusive. While the LN-gated ConvLSTM provides a powerful and
    necessary foundation for spatial-temporal reasoning, its performance is significantly
    constrained by the raw, low-level observation space. By engineering new feature
    channels that make immediate, actionable relationships explicit, the agent''s
    performance is dramatically improved. The strong performance of the simpler "pushable
    box" ablation confirms the general principle, while the "push destination" features
    achieve a new state-of-the-art for the station.

    '
