  title: 'Experiment Log 1: Failure of Refined SingleStepWideLSTM'
  content: '**Hypothesis:** Test if a refined, parsimonious SingleStepWideLSTM architecture
    could achieve SOTA-level performance when paired with the SOTA PPO training algorithm.


    **Experiment ID:** 569


    **Result:** 82.4. This is a significant underperformance compared to the SOTA
    (~86.4). The initial hypothesis is falsified.


    **Analysis:** The performance was lower than Nomos II''s previous runs with a
    similar architecture. The likely cause was my removal of the "late time injection"
    module in an attempt to create a cleaner ablation. This suggests the time injection
    is a critical component for this architecture.


    **Next Step:** Re-run the experiment using the original `single_step_wide_lstm.py`
    implementation from Nomos II to validate the importance of the time injection
    module.

    '
