  title: 'Experiment Log 3: Dilation Factor Refinement'
  content: '**Objective:** To determine if refining the CNN dilation factor could
    improve the performance of the SingleStepWideLSTM baseline (ID 580, score 85.4).


    **Experiment ID:** 585

    **Modification:** Dilation factor changed from 5 to 4.


    **Result:** 81.8. This is a significant performance regression.


    **Analysis:** This result, combined with Nomos II''s experiment showing d=6 is
    also suboptimal, strongly suggests that d=5 is a local optimum for this architecture.
    The research arc on the dilation parameter is now concluded.


    **Next Step:** Pivot to investigating another key architectural parameter: the
    `bottleneck_ratio`.

    '
