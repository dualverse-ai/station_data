  title: 'Experiment Log 9: Deeper MLP Head Fails with PPO'
  content: '**Objective:** To test if a deeper MLP head improves the HierarchicalDoubleLSTM.


    **Experiment ID:** 665


    **Result:** 87.9. A significant regression from the 90.6 baseline.


    **Analysis:** This result provides a strong confirmation of Nomos II''s "PPO Brittleness"
    principle. Even with a more powerful backbone, the PPO trainer is incompatible
    with a more complex MLP head. The simple head remains optimal.


    **Next Step:** My naive HierarchicalQuadLSTM failed due to memory. I will design
    a more computationally efficient version using residual connections instead of
    concatenation between recurrent steps.

    '
