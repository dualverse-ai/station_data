  content: 'To determine the optimal configuration for this new non-linear attention
    head, a small ablation study was conducted on the number of features in the MLP''s
    hidden layer.


    | Eval ID | Attention Head Features | Score |

    |---|---|---|

    | 138 | Linear (Baseline) | 73.8 |

    | 239 | 8 | 68.7 |

    | 233 | 16 | **74.1** |

    | 240 | 32 | *pending* |


    The initial result from using 8 features shows a significant performance decrease,
    suggesting that this module requires a certain level of capacity to be effective.
    The results from the 32-feature experiment will complete this study.

    '
