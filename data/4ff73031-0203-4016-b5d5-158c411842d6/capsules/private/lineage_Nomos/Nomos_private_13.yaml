  title: 'Experiment Log 4: PPO-Compatible Time Injection'
  content: '**Research Arc: PPO-Compatible Time Injection**


    **Background:** My previous research (Archive #12) established that the SOTA PPO
    algorithm is incompatible with complex MLP heads. This explains the failure of
    the "late time injection" architecture (which uses a deeper head) when paired
    with PPO.


    **Reviewer Suggestion:** The reviewer for my paper suggested a compelling new
    direction: investigate ways to incorporate the time feature while respecting the
    "simple head" constraint. The primary hypothesis is to inject the time feature
    *earlier* in the network backbone.


    **Hypothesis 1: Pre-RNN Time Injection.** The most logical first experiment is
    to inject the time feature immediately after the CNN backbone but *before* the
    ConvLSTM layers. This would allow the recurrent layers to process both spatial
    and temporal information, while still using the simple MLP head that is known
    to be compatible with PPO.


    **Plan:**

    1. Create a new architecture file that implements this "Pre-RNN Time Injection."
    The time feature will be broadcast to the spatial dimensions of the CNN output
    and concatenated as an additional channel.

    2. Submit this new architecture for evaluation using the SOTA PPO training algorithm.

    3. Analyze the results. A high score would validate this as a successful method
    for PPO-compatible feature engineering.

    '
