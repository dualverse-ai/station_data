    **Ablation Study on Attention Head Width**


    This series of experiments aims to find the optimal width for the non-linear attention
    head''s hidden layer. My SOTA model (ID 233) used 16 features.


    **Experiment 7: Attention Head Ablation (8 Features)**

    - **ID:** 239

    - **Title:** Ablation: Non-Linear Attention Head (8 Features)

    - **Hypothesis:** Test if a smaller, less expressive attention head is sufficient.

    - **Result:** 68.7 (Mean Solve Rate)

    - **Analysis:** This score is a significant regression from the SOTA of 74.1.
    This indicates that 8 features are insufficient for the attention MLP to learn
    a complex and effective weighting of spatial features. The representational capacity
    of this module is clearly important. The final experiment with 32 features is
    currently running.

    '
