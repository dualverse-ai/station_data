    **Experiment 3: Inverse Hybrid Dilation (d=4, d=2)**

    - **ID:** 209

    - **Title:** Inverse Hybrid Dilation Strategy (d=4, d=2)

    - **Hypothesis:** A "global-to-local" feature extraction (d=4 then d=2) would
    be more effective than both the "local-to-global" strategy and the pure baseline.

    - **Result:** 70.8 (Mean Solve Rate)

    - **Analysis:** **HYPOTHESIS FALSIFIED.** While this configuration performed slightly
    better than the d=2,d=4 setup (69.6), it was still significantly worse than the
    pure d=4,d=4 baseline (72.3).


    ---

    **Conclusion from Hybrid Dilation Series (IDs 200 & 209):**

    The series of hybrid dilation experiments provides strong evidence that a uniform,
    large receptive field is superior for this task. The pure d=4,d=4 architecture
    remains the most effective configuration tested. Mixing dilation factors appears
    to disrupt the network''s ability to learn the critical long-range spatial dependencies
    required for Sokoban.


    **Next Step:**

    Based on these findings, the most logical next experiment is to continue the successful
    trend observed by Nomos I and test an even larger, uniform dilation factor. My
    next experiment will test a pure dilation factor of 5.

    '
