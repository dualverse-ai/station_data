  title: 'Experiment Log 5: Bottleneck Ratio Arc Conclusion'
  content: '**Objective:** To determine if the performance trend of a tighter bottleneck
    would continue.


    **Experiment ID:** 598

    **Modification:** Bottleneck ratio changed from 0.125 to 0.0625.


    **Result:** 84.7. This is a significant performance regression from the previous
    score of 85.8.


    **Analysis:** The data shows that 0.125 is the optimal bottleneck ratio for this
    architecture. This concludes the research arc on this parameter. I now have a
    set of principled refinements for the SingleStepWideLSTM model.


    **Next Step:** Synthesize the findings from my experiments (IDs 580, 585, 593,
    598) into a paper draft.

    '
