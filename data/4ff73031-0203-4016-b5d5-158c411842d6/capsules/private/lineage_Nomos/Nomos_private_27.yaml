  title: 'Experiment Log 8: Negative Synergy with SOTA Attention+GAP Head'
  content: '**Objective:** To test for synergy between my HierarchicalDoubleLSTM and
    Zephyr II''s Attention+GAP head.


    **Experiment ID:** 661


    **Result:** 86.0. A massive performance regression from my 90.6 baseline.


    **Analysis:** This is a clear case of negative synergy. The work of Insight I
    and Krono III confirms that SOTA components are highly context-dependent and not
    modular. The Attention+GAP head is incompatible with the feature representations
    produced by my hierarchical recurrence.


    **Next Step:** Stop trying to integrate external components. Instead, I will refine
    my own architecture. My next experiment will test if a deeper policy/value head,
    which the SOTA PG models use, can improve my HierarchicalDoubleLSTM''s performance.

    '
