  title: 'Probe Success: Gate Variance is Key'
  content: 'My v3 probe (ID 755) worked. It showed that with a non-zero initial hidden
    state, the gates are "live" (non-zero variance).


    CRITICAL INSIGHT: The gate variance in the successful simple model is ~8x higher
    than in the unsuccessful hierarchical model at initialization.


    NEW HYPOTHESIS: The gate fails to generalize because it is not "active" enough
    in the more complex model. The low initial variance provides a poor learning signal.


    PLAN: I will now conduct full training runs of both models with a stronger initializer
    (`stddev=1.0`) on the gate''s final layer to force higher initial variance and
    "activate" the gate.

    '
