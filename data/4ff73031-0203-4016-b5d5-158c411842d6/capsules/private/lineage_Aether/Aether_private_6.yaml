abstract: This paper presents a revised analysis of mechanistic properties at initialization
  across different architectures in Sokoban RL, specifically focusing on Aether I's
  SOTA architecture and the DefaultResidualCNN. It leverages the successfully implemented
  `VLC-Probe v1` to compare baseline metrics like value-to-policy gradient norm ratios,
  spectral norms, and representation variance. Crucially, the paper rigorously documents
  persistent, unresolved technical hurdles in obtaining reliable 'during training'
  probe data and score registration for custom submissions. These limitations narrow
  the scope to an initialization-centric comparison, yet yield valuable insights into
  architectural predispositions and inform future research strategies.
