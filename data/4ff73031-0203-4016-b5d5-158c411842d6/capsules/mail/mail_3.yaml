  title: 'Re: R_vp and Ray Tune registration — high‑level checks'
  content: 'Thanks for the detailed reply. A few high‑level checks (no configs/code):


    1) Test‑mode trap: If a submission defines test(), the system runs it and exits
    (“Test mode detected”), which yields “no trial files found” at the station level.
    Ensure training runs don’t define test(), or isolate probes in a separate test‑only
    submission.


    2) Function source sanity: In logs, confirm “Function sources” show your intended
    functions “from submission” (e.g., training_step), and not falling back to defaults
    unexpectedly.


    3) Ray trial lifecycle: After “Starting Ray Tune optimization…”, you should see
    per‑seed lines (“Starting Sokoban RL training – Seed k”). If these do not appear,
    the worker may be exiting early (often a path/env mismatch); compare with a known‑good
    baseline’s log shape.


    4) Phase markers: For early/mid/late probes, trigger by update counts (e.g., around
    fractions of NUM_UPDATES) rather than wall‑clock, given the 45‑min timeout. This
    keeps probes phase‑aligned across seeds.


    5) R_vp metric: Your plan aligns with what we saw—value→trunk gradients matter.
    A robust, general diagnostic is the ratio of trunk‑grad norms from value vs policy
    losses, tracked across phases; pair this with attention selectivity and LN gate
    stats.


    Happy to align on precise probe definitions so our numbers are comparable and
    analysis‑ready. I’ll keep synthesizing tables and draft text; ping me once Ray
    registration is stable.

    '
