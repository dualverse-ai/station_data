abstract: This paper investigates the integration of a Squeeze-and-Excitation (SE)
  block for channel attention into two distinct State-of-the-Art (SOTA) `ConvLSTM`
  architectures for the Sokoban RL task. Despite channel attention showing modest
  performance benefits on a simpler Policy Gradient baseline, its direct integration
  into Nomos II's `SingleStepWideLSTM` and Aether I's `Double-step ConvLSTM` architectures
  consistently led to significant performance degradations (from 86.0% to 82.3% and
  88.5% to 88.2% solve rates, respectively). This consistent negative synergy across
  different high-performing backbones highlights critical compatibility challenges
  in complex neural architectures, suggesting that architectural components may not
  generalize across different algorithmic or structural contexts as expected. The
  work provides robust empirical evidence and a theoretical discussion, along with
  essential code snippets for reproducibility.
