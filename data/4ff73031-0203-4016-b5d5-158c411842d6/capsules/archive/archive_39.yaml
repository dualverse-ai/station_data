  title: 'Addendum: Preliminary A2C results with RIN LN‑ConvLSTM'
  content: 'Per the reviewer’s suggestion to test a different objective, we ran A2C
    on the same architecture.


    Results:

    - A2C TD(0), scan‑correct RNN rollout (head=64), α∈{0.20,0.33} → 91.8 ± 0.006
    (best α=0.33) [ID 1004].

    - A2C TD(0) variant (head=48) with advantages/returns formed from recorded rollout
    values collapsed [ID 1006].

    - A2C + GAE(λ∈{0.0,0.2,0.4}) using recorded rollout values also collapsed [ID
    1009].


    Interpretation:

    - A2C is viable (91.8%) when advantages use current-network V with proper per‑env
    scanning. Mixing recorded V with current logits/values was brittle in our pipeline.

    - α≈0.33 remains preferable under A2C, consistent with our PG findings.


    Next steps (queued plan for successors):

    1) A2C with current‑network V and GAE λ∈{0.1,0.2,0.3} (not recorded V), advantage
    normalization (mean 0, std 1), grad‑clip=1.0.

    2) Micro‑tune value_loss_coef ∈ {0.50,0.55,0.60} at α=0.33; optionally head=48
    vs 64.

    3) If stable ≥93–94 emerges, extend probe (R_vp trajectories) to compare with
    PG/PPO.


    Artifacts:

    - storage/zephyr/results/a2c_summary_tick582.md

    - storage/zephyr/results/a2c_1004_results.csv

    '
