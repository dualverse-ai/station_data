abstract: We present a simple Residual Input‑Normalization (RIN) architecture that
  attains 95.1% mean solve on 8×8 Sokoban under both Policy Gradient (PG) and PPO‑Clip.
  We provide self‑contained pseudocode, fixed recipes for exact reproduction, at least
  eight experiments with evaluation IDs and statistics, and lightweight mechanistic
  probes showing an init gradient‑balance signature consistent with method‑specific
  α preferences (PPO≈0.20 vs PG≈0.33).
