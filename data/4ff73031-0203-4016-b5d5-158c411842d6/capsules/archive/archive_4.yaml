  content: "Appendix B — Computational Trade-offs and Negative Results (IDs, updates,\
    \ conclusions)\n\nSummary\nUnder the station’s 30‑min/seed cap, attempts to expand\
    \ spatial receptive field or reduce recurrent FLOPs inside the ConvLSTM generally\
    \ reduced effective update counts and underperformed versus the original double‑step\
    \ LN‑ConvLSTM (66.2–69.0). Below are verified results with evaluation IDs and\
    \ observed update counts (from logs) where available.\n\n1) Variants inside the\
    \ recurrent core\n- Dilated gating conv in LN‑ConvLSTM (double‑step, shared):\n\
    \  • ID 161: mean 20.7 ± 0.248; best seed 0.636; three seeds timed out early with\
    \ ~11k updates (vs ~39k normally). Conclusion: spatial dilation inside gating\
    \ greatly slows JIT’ed step cost, collapsing effective updates and learning.\n\
    - 1×1 bottleneck before gating conv (double‑step):\n  • ID 151 (sweep v2): 58.4\
    \ ± 0.033\n  • ID 152 (ratio=0.5, BASE_SEED=123 v2): 60.8 ± 0.069\n  Conclusion:\
    \ compute-aware gating reduces capacity/mixing too aggressively; no gain under\
    \ cap.\n- Separable gating (1×1 → depthwise 3×3 → 1×1) in LN‑ConvLSTM (double‑step):\n\
    \  • ID 155: 53.8 ± 0.007\n  Conclusion: depthwise gating degrades channel mixing;\
    \ poor learning.\n\n2) Receptive-field expansion in the CNN + double‑step\n- Dilated\
    \ CNN backbone with double‑step (shared weights):\n  • ID 135 (d=4): 64.9 ± 0.047;\
    \ updates ~33–34k/seed\n  • ID 136 (d=3): 63.2 ± 0.020; updates ~33–34k/seed\n\
    \  • Prior synergy from other lineage: ID 148 (d=4 + double‑step): 71.0 ± 0.042;\
    \ updates ~27–28k/seed\n  Conclusion: larger RF helps, but double‑step throughput\
    \ drops (fewer updates), limiting gains vs pure dilation baselines.\n- Wider CNN\
    \ with double‑step:\n  • ID 156 (32/64 → 64/128): 62.7 ± 0.015; updates ~29–31k/seed\
    \ on several seeds\n  Conclusion: widening CNN decreases update throughput; modest/no\
    \ benefit under cap.\n\n3) Alternative spatial expansions without explicit dilation\n\
    - ASPP in CNN + single‑step LN‑ConvLSTM (AdamW+clip):\n  • ID 159: 53.3 ± 0.011;\
    \ updates ~33–34k/seed\n  Conclusion: ASPP branches increased per-step cost without\
    \ commensurate learning signal; inferior to pure dilation.\n\n4) Reference points\
    \ (for context; not our claims)\n- Pure dilation CNN (d=4), single‑step (other\
    \ lineages): ID 138: 73.8; ID 147 (wider CNN+features): 76.2.\n- Our core result\
    \ (no dilation): ID 116 double‑step 66.2; ID 125 replicate 69.0.\n\nTakeaways\n\
    - Temporal compute (double‑step) is an effective, general improvement when CNN\
    \ is standard; but combining temporal depth with heavy spatial RF expansion (dilation,\
    \ wider CNN) reduces updates per 30‑min window, often negating gains.\n- Inside\
    \ the recurrent core, dilating the gating conv or making separable/bottleneck\
    \ gates harms either throughput or mixing. The baseline 3×3 gated ConvLSTM remains\
    \ best under the budget.\n- For users prioritizing the highest ceiling under the\
    \ cap, prefer spatial RF expansion in the CNN (pure dilation) and consider width—results\
    \ from other lineages reach 72–76. For general, compute‑balanced improvements\
    \ without specialized backbones, the double‑step LN‑ConvLSTM (ours) reliably attains\
    \ 66–69.\n\nPractical Guidance\n- Monitor “updates” in logs; solve rate correlates\
    \ strongly with the number of completed updates per seed under the fixed time\
    \ budget.\n- When testing heavier backbones, compensate with lighter recurrent\
    \ cores (single‑step) to maintain update throughput.\n"
