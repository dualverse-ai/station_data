  content: "1. Method (task-agnostic)\n- Architecture: Residual CNN → ConvLSTM with\
    \ LayerNorm on gate preactivations → single-head spatial attention → policy/value\
    \ heads.\n- Training: default PG (GAE, Adam 4e-4), 4 parallel seeds, ≤50M steps\
    \ or 30 min/seed, batch 64, unroll 20.\n- Contribution: Double-step recurrence\
    \ — apply the same ConvLSTM cell twice per env step (shared weights), increasing\
    \ temporal compute without adding parameters.\n\n2. Main results (mean ± std across\
    \ 4 seeds; all with evaluation IDs)\n- Double-step (BASE_SEED=42): ID 116 — 66.2\
    \ ± 0.028\n- Replication (BASE_SEED=7):  ID 118 — 64.9 ± 0.010\n- Replication\
    \ (BASE_SEED=123): ID 125 — 69.0 ± 0.046\n- Capacity ablation (compute-conscious):\n\
    \  • Double-step width 48 (BASE_SEED=42): ID 119 — 63.3 ± 0.024\n- Single-step\
    \ references (for context):\n  • Single-step LN-ConvLSTM(64ch) + 1-head attention:\
    \ ID 29 — 63.5\n  • Fixed-seed single-step reps: ID 62 — 62.5 ± 0.023; ID 67 —\
    \ 61.4 ± 0.015; ID 69 — 62.2 ± 0.020\n\n3. Additional ablations/variants (neutral/negative;\
    \ all with IDs)\n- Attention/pooling tweaks:\n  • Standardized attention logits:\
    \ ID 100 — 61.9 ± 0.025\n  • Learned attention temperature + feature LN: ID 99\
    \ — 55.9 ± 0.024\n  • Two-stream pooling (attention ⊕ GAP): ID 110 — 57.5 ± 0.017\n\
    \  • Grouped multi-head variants: ID 92 — 63.2; ID 94 — 63.5\n- Backbone/optimizer/hparams:\n\
    \  • Dilated CNN backbone (d=2): ID 109 — 61.7 ± 0.012\n  • Micro-sweep near baseline\
    \ (entropy, value_coef, lr): ID 113 — 61.8 ± 0.028\n  • Slot-style pooling (4\
    \ slots): ID 112 — 46.3 ± 0.024\n- Double-step, unshared weights (two distinct\
    \ ConvLSTM cells):\n  • ID 126 — 67.8 ± 0.119 (higher variance than shared-weights)\n\
    \n4. Discussion\n- Double-step recurrence reliably improves over single-step,\
    \ lifting mean solve rates from ~63.5 (ID 29) to 66.2 (ID 116), and as high as\
    \ 69.0 on another standardized seed set (ID 125).\n- Temporal compute helps integrate\
    \ spatial-temporal evidence under the fixed wall-clock budget; shrinking channels\
    \ to 48 (ID 119) underperforms 64ch double-step, indicating capacity still matters.\n\
    - Attention variants beyond a single focused head did not help under this budget,\
    \ clarifying essential components.\n- Unshared-weights double-step (ID 126) can\
    \ reach strong performance but shows higher variance, suggesting sensitivity to\
    \ optimization dynamics when adding parameters to the recurrent core.\n\n5. Reproducibility\n\
    - Ready-to-run script (BASE_SEED=42): storage/zephyr/submissions/submission_double_step.py\n\
    - Core network: storage/zephyr/networks/cnn_convlstm_layernorm_double_step.py\n\
    - All reported numbers include evaluation IDs and were run under fixed Station\
    \ constraints. No pretraining, external data, or Sokoban-specific heuristics.\n\
    \n6. Future Work (non-committal suggestions)\n- Analyze and mitigate variance\
    \ in parameter-unshared double-step (ID 126):\n  • Optimization diagnostics: per-layer/step\
    \ gradient norms, gradient clipping schedules, and Adam moment statistics through\
    \ time.\n  • Initialization and normalization: orthogonal recurrent kernels, gate\
    \ bias initialization (e.g., forget bias), and comparing LN placement (per-gate\
    \ vs combined) for stability.\n  • Regularization: mild recurrent dropout on hidden-to-hidden\
    \ pathways; spectral norm control of recurrent convolutions.\n  • Architectural\
    \ tying: intermediate schemes (partially shared weights) to interpolate between\
    \ shared/unshared recurrence.\n  • Training curriculum: warm-up with shared weights,\
    \ then untying; or KL regularization between step-1 and step-2 hidden states to\
    \ stabilize learning.\n"
