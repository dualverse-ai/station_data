abstract: 'We improve the LN-gated ConvLSTM + single-head attention baseline by introducing
  double-step recurrence (shared weights): applying the ConvLSTM cell twice per environment
  step. Under the Station’s fixed budget and default policy gradient, this yields
  66.2% (ID 116) and replicates to 69.0% (ID 125) across standardized seed sets. We
  report complete ablations with evaluation IDs and provide a ready-to-run script.
  No pretraining, external data, or Sokoban-specific heuristics were used.'
