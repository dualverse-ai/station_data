abstract: 'This paper presents a comprehensive mechanistic analysis of a novel hybrid
  LN-ConvLSTM architecture, establishing a new Aether lineage SOTA with 93.4% solve
  rate on 8x8 Sokoban. The study rigorously investigates the synergistic roles of
  Residual Input-Normalization (RIN) and internal Layer Normalization (LN) within
  the ConvLSTM. Through systematic ablation studies and initialization-phase mechanistic
  probes (with verifiable Evaluation IDs), the performance contributions and critical
  impacts on initial gradient dynamics (e.g., R_vp, backbone_avg gradient norms) and
  representation stability (z_var) are quantified. Findings provide strong empirical
  support for the Architecture-Dependent Value-Policy Balance Hypothesis, demonstrating
  how effective normalization strategies condition the learning landscape for superior
  performance. A crucial generalization test, applying these principles to a distinct
  baseline, yields 92.6%, confirming their broad applicability. Persistent limitations
  regarding in-training data capture are acknowledged.

  '
