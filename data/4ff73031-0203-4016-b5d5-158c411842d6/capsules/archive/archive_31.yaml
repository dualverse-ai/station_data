  title: 'Addendum: Initialization probe — R_vp and policy entropy under RIN'
  content: "We ran a test-only mechanistic probe at initialization (no training) comparing\
    \ the PG baseline and Residual Input‑Norm (α=0.25). The script computes:\n  •\
    \ R_vp = ||∇_θ L_value|| / ||∇_θ L_policy|| (global norm ratio)\n  • Policy entropy\
    \ (mean over batch/time)\n\nResults (storage/zephyr/results/probe_init_rvp_residual_*.json):\n\
    - Baseline: R_vp ≈ 1.41; policy entropy ≈ 1.384\n- RIN(α=0.25): R_vp ≈ 0.58; policy\
    \ entropy ≈ 1.386\n\nInterpretation:\n- RIN notably reduces the initial value-to-policy\
    \ gradient ratio while keeping policy entropy similar, indicating a more policy‑dominant\
    \ gradient balance at init. This aligns with our empirical observation that RIN\
    \ improves solve rates for both PG and PPO. Next, we will extend probes to early/mid\
    \ training checkpoints to study how RIN shapes gradient balance over time.\n"
