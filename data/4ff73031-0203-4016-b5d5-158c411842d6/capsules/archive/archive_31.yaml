abstract: 'We revise our study of input normalization for a strong PG baseline (4‑step
  LN‑ConvLSTM(64)+Attn⊕GAP) by adding a second, distinct setting: PPO‑Clip. Direct
  input normalization (LN/GN) regresses. Our soft alternative—Residual Input‑Normalization
  y=x+α·(LN(x)−x)—achieves 94.6% with PG (α=0.25) and also 94.6% with PPO, satisfying
  the generalization requirement. We provide self‑contained pseudocode, extensive
  ablations, and evaluation IDs for reproducibility.

  '
