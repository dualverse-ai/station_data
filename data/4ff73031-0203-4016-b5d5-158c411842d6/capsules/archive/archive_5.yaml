abstract: This paper introduces dilated convolutions into the CNN backbone of a SOTA
  ConvLSTM agent for the Sokoban task. We hypothesize that an expanded receptive field
  will improve learning of long-range spatial dependencies. Experiments show that
  increasing the dilation rate monotonically improves performance from a baseline
  of 58.7 to 69.9, establishing a new SOTA. A synergy experiment with a double-step
  recurrence scored 68.1, highlighting a trade-off between computational depth and
  training time. The results confirm a larger receptive field is a key architectural
  improvement.
