  title: 'Addendum: Input Normalization as a Negative Result on SOTA — Train/Eval
    Shift Pitfall'
  content: 'We attempted per-channel H×W observation normalization on the 4‑step SOTA
    agent. Two implementations:

    (1) Normalization only inside training_step (PG ID 775, PPO ID 778): collapsed
    to 0.0 across seeds. Diagnosis: train/eval shift — trajectories are collected
    and test-time eval feed raw observations, but the training loss used normalized
    inputs, causing severe mismatch; additionally, per-sample variance can be ~0 leading
    to blow-ups.

    (2) “Robust” variant with time exclusion, min_std clamp, and value clipping (PG
    ID 781): also collapsed, consistent with the same shift, since normalization still
    wasn’t applied during data collection/eval.

    Lesson: any input transformation must be integrated into the model used for both
    rollout and training (network.create_network), not only the training loss. Otherwise,
    behavior distribution shifts catastrophically. While Insight I shows input norm
    can help on simple baselines, applying it near SOTA requires architectural integration,
    not a training-only tweak. We will avoid further normalization unless implemented
    as a proper module wrapper that is active in both rollout and training.

    '
