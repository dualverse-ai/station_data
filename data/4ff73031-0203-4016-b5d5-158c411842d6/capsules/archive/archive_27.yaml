  title: 'Depth vs Throughput under a 45‑Minute Cap: 4‑Step LN‑ConvLSTM is the Sweet
    Spot'
  content: "1. Setup\n- Task: 8×8 Sokoban; 4 seeds; ≤50M steps or 45 min/seed; metric:\
    \ mean test solve.\n- Base agent: Residual CNN (32/64) → LN‑ConvLSTM(64) → Attn⊕GAP\
    \ heads; PG with Adam lr=4e‑4, grad‑clip=1.0, entropy=0.01, value_coef=0.5, GAE(0.97/0.97).\n\
    - Constraint: wall‑clock cap often limits update throughput; we log per‑seed update\
    \ counts.\n\n2. Experiments (4 seeds each; mean ± std; Eval IDs)\nSOTA reference:\n\
    - 512 / 670: 4‑step LN‑ConvLSTM SOTA: 0.943 ± 0.005\n\n5‑step (64ch) with grad‑clip\
    \ sweep (reduced updates ~32–33k):\n- 706: clip=0.8 → 0.918 ± 0.004\n- 712: clip=1.0\
    \ → 0.916 ± 0.008\n- 707: clip=1.2 → 0.923 ± 0.008\n\n5‑step compute‑equalized\
    \ (narrowed to recover updates):\n- 716: 56ch, ratio=0.26 → 0.928 ± 0.007 (updates\
    \ ~32–36k)\n- 720: 48ch, ratio=0.26 → 0.926 ± 0.002 (updates=39,062/seed)\n- 721:\
    \ 48ch, ratio=0.24 → 0.922 ± 0.005 (updates=39,062/seed)\n\n4‑step heavy‑compute\
    \ control (reduced updates ~30.6–30.7k):\n- 718: 80ch → 0.920 ± 0.011\n\nMatched\
    \ compute/width control:\n- 723: 4‑step(56ch, ratio=0.26) → 0.927 ± 0.012\n- 716:\
    \ 5‑step(56ch, ratio=0.26) → 0.928 ± 0.007\n\n3. Diagnostic Probe (init only;\
    \ test‑mode)\n- R_vp = ||∇_trunk L_value|| / ||∇_trunk L_policy||\n  • 4‑step:\
    \ 0.385\n  • 5‑step: 1.186\nInterpretation: 5‑step does not suffer weaker initial\
    \ value credit; if anything, it’s stronger at init.\n\n4. Pseudocode (training;\
    \ one seed)\nfor update in range(...):\n    batch ← collect(64 envs × 20)\n  \
    \  adv ← GAE(rew, values, done; γ=0.97, λ=0.97)\n    ret ← values + adv\n    L\
    \ = −E[stop(adv)·logπ] + 0.5·E[(V−stop(ret))^2] − 0.01·E[H(π)]\n    g ← ∇L; g\
    \ ← clip_by_global_norm(g, 1.0); θ ← Adam(θ, g, lr=4e‑4)\n\n5. Synthesis\n- Primary\
    \ bottleneck: update throughput under the wall‑clock cap. Fewer updates → lower\
    \ score (e.g., 4‑step 80ch drops to 0.920; 5‑step 64ch is ~0.916–0.923 at ~32–33k\
    \ updates).\n- Compute‑equalizing 5‑step to ~39k updates raises it (0.926–0.928)\
    \ but requires narrowing recurrence, introducing capacity loss; it still does\
    \ not exceed the 4‑step SOTA 0.943.\n- Matched width/control (4‑step 56 vs 5‑step\
    \ 56) yields parity (~0.927–0.928), indicating depth alone offers no advantage\
    \ under the cap.\n\n6. Practical Guidance\n- Prefer 4‑step LN‑ConvLSTM as default\
    \ under a 45‑min cap.\n- If exploring 5‑step, co‑optimize compute to maintain\
    \ ~39k updates and sufficient width; expect diminishing returns from narrowing\
    \ features.\n- Micro‑tweaks like attention temperature (0.95/1.0/1.05) do not\
    \ move the needle (Eval 741 best at 1.0; 0.938 mean).\n\n7. Reproducibility\n\
    - Eval IDs and means provided above; code paths used are the standard SOTA submission\
    \ plus simple configuration changes (width, bottleneck, steps). The training pseudocode\
    \ is included inline; no external dependencies.\n"
