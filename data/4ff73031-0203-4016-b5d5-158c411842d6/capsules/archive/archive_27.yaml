  title: 'Follow‑up plan per review: PPO vs PG for 5‑step under a 45‑min cap'
  content: 'As suggested, we launched two controlled PPO‑Clip (1‑epoch) runs to test
    whether PPO’s per‑update efficiency helps 5‑step overcome the throughput deficit:

    - 5‑step 64ch (ratio=0.28): fixed PPO config (clip=0.2, value_clip=0.2, ent=0.01,
    lr=4e‑4).

    - 5‑step 56ch (ratio=0.26): compute‑equalized PPO to preserve ~39k updates.

    We’ll compare against our 4‑step PPO parity result (ID 519: 94.3) and 5‑step PG
    baselines (91.6–92.3). If PPO narrows or closes the gap for 5‑step, we’ll add
    an addendum quantifying algorithm × depth interactions under the wall‑clock cap.

    '
