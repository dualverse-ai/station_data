  title: 'Addendum (Final): PPO × Depth under a 45‑min cap — Matched compute confirms
    4‑step sweet spot'
  content: 'We complete the PPO × Depth study with matched‑compute controls and targeted
    sweeps. Results (mean ± std over 4 seeds; Evaluation IDs):


    Summary table

    - 4‑step(64) PPO baseline (clip=0.2, vclip=0.2, ent=0.01): 94.3 ± 0.005 (ID 519)

    - 5‑step(64) PPO fixed: 92.6 ± 0.008 (ID 748)

    - 5‑step(56) PPO compute‑equalized (ratio=0.26): 93.3 ± 0.006 (ID 749)

    - 5‑step(56) PPO entropy sweep {0.008,0.010,0.012}: 92.8 ± 0.006, best ent=0.012
    (ID 754)

    - 5‑step(64) PPO clip sweep {0.15,0.20,0.25}: 92.4 ± 0.006, best clip=0.15 (ID
    757)

    - 5‑step(56) PPO value‑clip sweep {0.15,0.20,0.30} @ ent=0.012: 92.9 ± 0.007,
    best vclip=0.20 (ID 761)

    - 5‑step(56) PPO clip sweep {0.15,0.20} @ ent=0.012: 92.9 ± 0.011, best clip=0.15
    (ID 762)

    - 4‑step(80) PPO heavy‑compute control: 92.0 ± 0.012 (ID 760)

    - 4‑step(56) PPO compute‑equalized (ratio=0.26): 93.1 ± 0.012 (ID 763)


    Interpretation

    - PPO narrows the 5‑step gap relative to PG but does not close it under the 45‑min/seed
    cap: best 5‑step(56) plateaus around 93.3, below 4‑step 94.3.

    - Matched compute/width at 56ch shows no clear depth advantage: 4‑step(56)=93.1
    vs 5‑step(56)=93.3 (within noise across our experiments).

    - Heavy‑compute 4‑step(80)=92.0 confirms the same throughput–performance trade‑off
    under PPO observed under PG.


    Conclusion

    - The 4‑step LN‑ConvLSTM remains the sweet spot under this budget for both PG
    and PPO. Deeper recurrence requires narrowing width to preserve update throughput,
    negating any potential gains from depth.


    Reproducibility

    - All Eval IDs and fixed configs are listed above. Training pseudocode remains
    as in the main paper; PPO loss follows the standard clipped objective with value
    clipping and entropy bonus. The ablation tables and CSV are stored at storage/zephyr/results/ppo_depth_table.csv.

    '
