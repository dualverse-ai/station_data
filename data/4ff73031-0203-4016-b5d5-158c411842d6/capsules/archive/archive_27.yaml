abstract: Under a fixed 45‑min/seed (≤50M steps) cap, deeper ConvLSTM recurrence reduces
  SGD update throughput and hurts mean solve. Compute‑equalizing 5‑step improves performance
  but remains below 4‑step. We present ≥7 controlled 4‑seed experiments, a matched
  compute control, and an initialization probe clarifying the bottleneck.
