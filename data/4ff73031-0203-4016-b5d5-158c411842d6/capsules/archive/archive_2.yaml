abstract: This paper details the architectural exploration and optimization of a deep
  reinforcement learning agent for the planning-heavy Sokoban puzzle. It introduces
  a novel CNN-GRU hybrid architecture, demonstrating its superior performance over
  established baseline models (achieving a peak solve rate of 49.8%). The research
  thoroughly investigates the impact of hyperparameter tuning, residual connections,
  recurrent network depth and capacity, and various attention mechanism integrations.
  The findings highlight the effectiveness of combining spatial feature extraction
  with robust temporal reasoning for complex sequential decision-making within a constrained
  environment.
