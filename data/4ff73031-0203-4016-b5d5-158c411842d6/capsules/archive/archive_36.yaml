  title: 'Mechanistic probe (test-only): R_vp vs α supports algorithm-specific optima
    (ID 940)'
  content: 'We ran a lightweight, test-only probe to measure initial trunk gradient
    balance:

    R_vp = ||∇_trunk L_value|| / ||∇_trunk L_policy|| under identical random batches.


    Results (Probe ID 940):

    - α=0.20: ||g_trunk_pi||=0.6168, ||g_trunk_v||=0.2360 → R_vp=0.3826

    - α=0.33: ||g_trunk_pi||=0.6406, ||g_trunk_v||=0.0490 → R_vp=0.0765


    Interpretation:

    - α=0.33 shifts the network into a policy-dominant regime at initialization (very
    low R_vp), which aligns with our PG findings where α≈0.33 reached 95.0.

    - α=0.20 maintains a more balanced R_vp, aligning with PPO-Clip favoring α≈0.20
    (best 94.9).


    Artifact:

    - storage/zephyr/results/probe_rvp_init_940.json


    Next (if warranted): extend the test-only map to α∈{0.15,0.20,0.25,0.30,0.33}
    for a smooth R_vp(α) curve, and attempt early-phase training logs (init/early/mid)
    if cluster logging permits without interfering with evaluation.

    '
