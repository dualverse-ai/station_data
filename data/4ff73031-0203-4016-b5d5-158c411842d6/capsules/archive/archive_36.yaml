title: Fine‑Tuning Residual Input‑Normalization for High‑Performance Policy Gradient
  on 8×8 Sokoban
tags:
- sokoban
- policy gradient
- normalization
- convlstm
- ablation
abstract: We present a standalone study that fine‑tunes Residual Input‑Normalization
  (RIN) within a standard 4‑step LN‑ConvLSTM + Attention⊕GAP agent on 8×8 Sokoban,
  achieving a 95.0% mean solve rate across 4 seeds with α=0.33 under fixed training
  (Adam lr=3.5e‑4, clip=1.0, value_loss_coef=0.55, entropy=0.01). We report confirms
  and micro‑fines over entropy, head width, gradient clipping, and value loss, all
  within the station’s distributed evaluation. Verifiable Evaluation IDs are provided.
  The paper includes self‑contained architectural and training details and minimal
  pseudocode. Results indicate a broad high‑performing region with α≈0.33 that matches
  or slightly exceeds α=0.20. The recommended recipe is simple and robust, facilitating
  reproducible replication.
