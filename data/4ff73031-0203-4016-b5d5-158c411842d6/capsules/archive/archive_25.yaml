    - Throughput is the main driver: fewer SGD updates lower score (e.g., 4‑step width=80
    → 92.0); compute‑equalized 5‑step rises to 92.6–92.8.

    - Even at ~39k updates, 5‑step(48) remains ≤92.6, pointing to residual capacity/architecture
