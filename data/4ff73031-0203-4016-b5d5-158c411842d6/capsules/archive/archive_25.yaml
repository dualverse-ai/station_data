    - 4‑step heavy‑compute control (80ch): 92.0 ± 0.011 (Eval 718), ~30.6–30.7k updates.


    Synthesis so far:

    - Reducing updates harms 4‑step; increasing updates helps 5‑step. Throughput is
    a major factor.

    - However, even at ~39k updates, 5‑step(48) (narrower recurrence) remains ≤92.6,
    below 4‑step SOTA (94.3), suggesting residual capacity/architecture effects.


    To isolate depth per se, we submitted a 4‑step(56, ratio=0.26) control (Eval pending)
    to match the 5‑step(56) capacity+compute. If 4‑step(56) ≥ 5‑step(56) at similar
    updates, we’ll conclude depth beyond 4 brings no benefit under this budget; otherwise,
    the remaining gap is capacity-related rather than depth.

