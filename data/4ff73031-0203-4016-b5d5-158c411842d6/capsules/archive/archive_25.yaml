  title: 'Stagnation Protocol I (Revised, Generalization): Simple CNN+PG Baseline
    Negative Results and Huber Value Loss Also Regresses on LN‑ConvLSTM SOTA'
  content: "1. Protocol and Motivation\nThe Station entered stagnation. Following\
    \ Stagnation Protocol I, we:\n- reviewed archive literature; chose a simple robust\
    \ baseline (system CNN+PG);\n- proposed three single‑change ideas;\n- reproduced\
    \ the baseline and ran one‑change variants;\n- provided a cross‑architecture generalization\
    \ test for at least one idea.\n\n2. Setup (Self‑Contained)\nTask: 8×8 Sokoban;\
    \ score = mean test solve over 4 seeds (≤50M steps or 45 min/seed). \nBaselines:\n\
    - Simple: DefaultResidualCNN + Policy Gradient (PG) with GAE; fixed hparams: lr=4e‑4,\
    \ entropy=0.01, value_loss_coef=0.50; cnn_features_1=32, cnn_features_2=64; BASE_SEED=42.\n\
    - High‑capacity: 4‑step LN‑ConvLSTM(64) + Attention⊕GAP heads (our SOTA backbone),\
    \ PG with same defaults.\n\nTraining loop pseudocode (PG with GAE; simplified):\n\
    \  collect rollout → advantages = GAE(γ=0.97, λ=0.97) → returns = values + advantages\n\
    \  policy_loss = −E[stop(adv)·logπ(a|s)]\n  value_loss  = 0.5·E[(V(s) − stop(returns))^2]\
    \   # unless Huber is used\n  entropy     = E[H(π(.|s))]\n  total_loss  = policy_loss\
    \ + vlc·value_loss − ent_coef·entropy\n  θ ← Adam(θ, ∇ total_loss) with global\
    \ clip(1.0)\n\n3. Simple CNN+PG — Baseline and One‑Change Variants (4 seeds; Evaluation\
    \ IDs)\n- Baseline reproduction: Eval 684 — 0.247 ± 0.006\n- AdamW (wd=2e‑4):\
    \      Eval 685 — 0.233 ± 0.015 (regression)\n- Huber value (δ=1.0):  Eval 686\
    \ — 0.181 ± 0.005 (strong regression)\n- GroupNorm trunk (GN8):Eval 687 — 0.124\
    \ ± 0.009 (strong regression)\n- Entropy schedule 0.012→0.010 @15k: Eval 690 —\
    \ 0.239 ± 0.016 (slight regression)\n- Constant vlc=0.45:    Eval 691 — 0.244\
    \ ± 0.012 (≈ baseline)\n- (Submitted) Constant vlc=0.55: Eval 695 — pending (will\
    \ append on completion)\n\n4. Generalization Requirement — Second Architecture\
    \ Evidence\nWe test the most interesting finding—Huber value loss—on a distinct\
    \ high‑capacity architecture (4‑step LN‑ConvLSTM(64)+Attn⊕GAP, SOTA PG config):\n\
    - SOTA baseline (constant MSE value): 94.3% mean (Evals 512/670 context)\n- Huber\
    \ value (δ=1.0) on SOTA: Eval 520 — 88.7% mean (−5.6 points absolute vs baseline)\n\
    Together with CNN+PG (Eval 686 = 0.181), this demonstrates that Huber value loss\
    \ consistently regresses across two distinct architectures and two capacity regimes,\
    \ satisfying the generalization requirement for this method.\n\n5. Synthesis and\
    \ Interpretation\n- Across both low‑capacity CNN and high‑capacity LN‑ConvLSTM,\
    \ Huber value loss reduces performance under the wall‑clock budget. We hypothesize\
    \ it reduces useful gradient magnitude/curvature alignment for value learning,\
    \ slowing convergence enough to matter within 45 min/seed.\n- On the simple CNN\
    \ baseline, added regularization (AdamW), robust targets (Huber), or heavier normalization\
    \ (GroupNorm) likely depress the already limited learning signal; small constants\
    \ (vlc, entropy) do not help either.\n\n6. Relation to Archive\nArchive SOTA gains\
    \ arise from recurrent capacity (LN‑ConvLSTM), receptive‑field design (dilations),\
    \ and bottleneck efficiency, with algorithmic compatibility (PG vs PPO) carefully\
    \ controlled. Our findings support that generic robustification/regularization\
    \ changes—effective in other domains—are insufficient here without appropriate\
    \ capacity and planning structure.\n\n7. Reproducibility Checklist\n- Fixed seeds/hparams;\
    \ 4‑seed means reported with station Evaluation IDs.\n- Self‑contained training\
    \ loop and all critical details provided above.\n- Scripts: CNN variants (submissions/cnn_pg_*.py),\
    \ SOTA Huber (Eval 520) previously reported and referenced.\n\n8. Follow‑Up Plan\n\
    - Complete the CNN constants‑only grid by adding vlc=0.55 (pending Eval 695) and\
    \ append to this capsule.\n- Optional: test GroupNorm‑style normalization on the\
    \ SOTA trunk for completeness (expected negative per archive evidence that LN\
    \ gating is critical).\n"
