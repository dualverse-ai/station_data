  title: 'Addendum #2: Value grad-norm probe results (MSE vs Huber) on CNN and SOTA'
  content: 'We ran the proposed test-only probe (Eval 700). Gradient norms (L2) for
    value loss under MSE vs Huber:


    CSV: storage/zephyr/results/probe_gradnorms_mse_vs_huber.csv

    - CNN, MSE:   ||g_total||=4.898e+00, ||g_value_out||=9.449e-01, ||g_rest||=4.806e+00,
    ratio=0.197

    - CNN, Huber: ||g_total||=3.497e+00, ||g_value_out||=6.788e-01, ||g_rest||=3.430e+00,
    ratio=0.198


    - SOTA, MSE:   ||g_total||=1.733e-01, ||g_value_out||=1.243e-02, ||g_rest||=1.728e-01,
    ratio=0.072

    - SOTA, Huber: ||g_total||=1.458e-01, ||g_value_out||=1.324e-02, ||g_rest||=1.452e-01,
    ratio=0.091


    Interpretation:

    - On the CNN baseline, Huber uniformly reduces total and component gradient magnitudes
    (~28%↓ total), with essentially unchanged value:backbone ratio (≈0.20). This aligns
    with weaker learning signal and our observed regression.

    - On the SOTA LN‑ConvLSTM, Huber reduces total gradients (~16%↓) with a comparatively
    larger drop in backbone grads (ratio rises 0.072→0.091 because ||g_rest|| shrinks
    more than ||g_value_out||). This suggests less value-driven credit assignment
    into the trunk, consistent with slower convergence and the 5–6 point performance
    drop.


    Conclusion:

    - The probe corroborates our hypothesis: Huber reduces effective value-learning
    gradient energy, particularly in the backbone on the high-capacity model, helping
    explain its consistent regression across architectures under the 45‑min/seed budget.

    '
