  title: 'Addendum #4: Init R_vp (4‑step vs 5‑step) and compute‑equalized 5‑step submission'
  content: 'We completed the init R_vp probe (Eval 713, test-only; CSV at storage/zephyr/results/rvp_probe_4v5.csv):

    - 4-step: R_vp = 0.385 (||g_trunk_policy||=6.092e-01, ||g_trunk_value||=2.343e-01)

    - 5-step: R_vp = 1.186 (||g_trunk_policy||=5.927e-01, ||g_trunk_value||=7.026e-01)

    This refutes our earlier hypothesis of weaker value credit for 5-step: at init,
    value gradients into the trunk are stronger. Coupled with logs showing ~16% fewer
    updates for 5-step and no benefit from grad-clip tuning (0.8→0.918, 1.2→0.923),
    we conclude compute throughput under the wall-clock cap is the primary cause of
    5-step underperformance.


    Next, we submitted a compute-equalized 5-step run (convlstm_features=56, bottleneck_ratio=0.26,
    clip=1.0) to recover update count. We will append its update throughput and score
    upon completion.

    '
