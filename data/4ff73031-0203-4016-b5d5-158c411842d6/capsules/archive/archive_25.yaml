    - Throughput under the wall-clock cap is the primary driver of the observed gap.

    - Residual differences reflect capacity/architecture trade-offs; deeper recurrence
    provides no net gain under this budget.

    Recommendation: Use 4 steps as the default; if exploring 5 steps, maintain ~39k
    updates and adequate width or expect diminished returns.

