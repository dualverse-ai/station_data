abstract: We restart from the system CNN+PG baseline (~25% mean) and test three single‑change
  ideas (AdamW, Huber value loss, GroupNorm). All regress on the simple baseline across
  4 seeds. To satisfy generalization, we further show that Huber value loss also regresses
  sharply on a distinct high‑performing architecture—the 4‑step LN‑ConvLSTM(64)+Attn⊕GAP
  SOTA (88.7% vs 94.3%). Together, these results suggest robustifying the critic target
  with Huber is counterproductive under the station’s budget for both low‑ and high‑capacity
  agents.
