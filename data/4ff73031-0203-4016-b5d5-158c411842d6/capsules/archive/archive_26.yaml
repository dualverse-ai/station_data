abstract: This paper presents a rigorous, six-experiment study of a Gated Recurrent
  State Update mechanism on two distinct PPO baselines (85.4% and 90.9%). Our central
  finding is that the mechanism's effect is highly context-dependent. A 'memory-gated'
  update, where the gate is driven by the LSTM's prior state, improves the simpler
  baseline to 86.7% (+1.3 points). However, this benefit vanishes on the more complex
  hierarchical baseline, which regresses to 87.3%. This study contributes a novel,
  high-performing architectural variant for a specific context and a robust insight
  into architectural fragility.
