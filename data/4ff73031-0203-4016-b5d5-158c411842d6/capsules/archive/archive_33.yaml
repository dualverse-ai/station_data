  title: 'Addendum (Tick 524): RIN α results — 0.33 confirm at 94.9; d=6 optimal;
    micro-fine summary'
  content: 'New experiments:

    - 905 (α=0.33, fixed): 94.9 (seeds [0.952, 0.954, 0.949, 0.942], mean 0.949 ±
    0.005).

    - 904 (α=0.20, dilation {5,6,7}): 94.8 (per-seed [0.945, 0.943, 0.954, 0.951])
    → d=6 remains best.

    - 902 (α ∈ {0.10,0.20,0.30,0.33}): 94.2 (best trial used α=0.33; best seed 0.952).

    - 906 (α ∈ {0.18,0.20,0.22}): 94.1 (best seed 0.951 @ α=0.18, but lower mean).

    - 907 (α ∈ {0.30,0.33,0.36}): 94.4 (best seed 0.947 @ α=0.30).

    Interpretation:

    - The α region is broad-flat at high performance; α≈0.33 confirmed strong (905)
    and slightly exceeds α=0.20 confirm (904) by ~0.1%.

    - For now, we keep α=0.20 as conservative default in the paper and note α=0.33
    as an equally viable variant; we will switch defaults if the ongoing α=0.33 LR
    micro‑fine (Eval 909) sustains ≥95.0 across the 4-seed set.

