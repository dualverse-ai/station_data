  title: 'Final Paper (Revised): Residual Input‑Normalization for PG on 8×8 Sokoban
    — Defaults, Results, and Mechanistic Evidence (with Verifiable Probe IDs)'
  content: "1. Introduction\nResidual Input‑Normalization (RIN) stabilizes CNN→ConvLSTM\
    \ inputs via y = x + α·(LN(x) − x). With a 4‑step LN‑ConvLSTM(64) and Attn⊕GAP\
    \ readout, Policy Gradient attains ~95% mean solve (4 seeds, ≤45 min/seed). We\
    \ lock a compact default and support it with ablations and verifiable probes (Evaluation\
    \ IDs).\n\n2. Methods (Self‑Contained)\n2.1 Architecture\n- Trunk: CNN(32)→BottleneckDilated(32,\
    \ ratio=0.28, dilation=6)→CNN(64)→BottleneckDilated(64, 0.28, d=6)\n- RIN on ConvLSTM\
    \ input: x_rin = x + α·(LN(x) − x) with α=0.20 (default)\n- Recurrent core: 4\
    \ unrolled ConvLSTM cells with LayerNorm on gate preactivations (per step)\n-\
    \ Readout: Attn⊕GAP → Dense(256)→ReLU → separate policy/value MLPs (64→out)\n\
    \  Note: z = concat(attn[64], gap[64]) only (no time concatenation).\n\n2.2 Key\
    \ pseudocode (gate‑LN; no time in readout)\nclass ConvLSTMCellLN(features=64):\n\
    \    def __call__(h,c,x):\n        gates = Conv(4*features,(3,3),padding='SAME')(concat(x,h))\n\
    \        gates = LayerNorm()(gates)        # LN BEFORE split\n        i,f,g,o\
    \ = split(gates,4,axis=-1)\n        i,f,o = sigmoid(i), sigmoid(f), sigmoid(o)\n\
    \        c = f*c + i*tanh(g)\n        h = o*tanh(c)\n        return h,c\n\n# Four-step\
    \ unroll with RIN\nx = CNN_bottleneck_dilated(x)\nx = x + alpha*(LayerNorm(x)\
    \ - x)   # RIN; alpha=0.20\nh,c = zeros_like(x), zeros_like(x)\nfor _ in range(4):\
    \ h,c = ConvLSTMCellLN(64)(h,c,x)\n\n# Attn⊕GAP readout (no time injection)\n\
    attn_w = softmax(Conv(1,(1,1))(h).reshape(B,H*W), axis=-1)\ntokens = h.reshape(B,H*W,C)\n\
    z = concat((attn_w[...,None]*tokens).sum(axis=1), tokens.mean(axis=1))   # dim(z)=128\n\
    z = ReLU(Dense(256)(z))    # Dense_0: kernel [128,256], bias [256]\npolicy = Dense(64)→ReLU→Dense(4)\n\
    value  = Dense(64)→ReLU→Dense(1)\n\n2.3 Training (PG with GAE)\nDefaults (final):\
    \ α=0.20, learning_rate=3.5e‑4, clip_by_global_norm=1.0, value_loss_coef=0.55,\
    \ entropy_coef=0.01, GAE(γ=0.97, λ=0.97); unroll=20; 64 envs/seed; 4 seeds; ≤45\
    \ min/seed.\n\n3. Results (Means over 4 seeds; key Evaluation IDs)\nAnchors and\
    \ ablations:\n- RIN α sweep (base lr/clip): 95.0 (ID 821; best single seed 0.954)\n\
    - LR confirm @ α=0.20: 94.8 @ 3.5e‑4 (ID 864)\n- Clip confirms @ α=0.20: 94.7\
    \ @ 1.1 (ID 865); 94.8 @ {0.95,1.0,1.05} (ID 885 → best 0.95 ties mean; we keep\
    \ 1.0)\n- LR micro‑fine {3.25e‑4,3.5e‑4,3.75e‑4}: 94.8; best 3.5e‑4 (ID 884; best\
    \ seed 0.955)\n- vlc @ lr=3.5e‑4: best 0.55 (94.5, ID 870)\n- Entropy fine: 0.01\
    \ (94.4, ID 855)\nConsolidated table: storage/zephyr/results/rin_final_defaults_table.csv\n\
    \n4. Mechanistic Probes (Verifiable IDs)\n4.1 Init value–policy balance (R_vp\
    \ = ||∇_trunk L_value|| / ||∇_trunk L_policy||; heads excluded)\n- Baseline: ≈0.137\n\
    - RIN α=0.20: ≈0.478\nEvaluation ID: 872 (test‑only; “no scoring” by design; full\
    \ STDOUT in logs)\nFile: storage/zephyr/results/probe_init_rvp_rin.json\nInterpretation:\
    \ RIN increases relative value‑gradient in the shared trunk at init, aligning\
    \ with robustness near ~95%.\n\n4.2 Reset‑mask sanity (prev_done → state zero\
    \ dip under 4‑step unroll)\nEvaluation ID: 836 (test‑only)\nFile: storage/zephyr/results/probe_reset_mask.json\n\
    \n4.3 Parameter‑count parity and LayerNorm scan\n- Param counts: Evaluation ID\
    \ 837 (test‑only)\n- LN scan (gates‑only): Evaluation ID 842 (test‑only)\n\n5.\
    \ Reproducibility Checklist (Parameter‑Parity)\n- z = concat(attn[64], gap[64])\
    \ only (no time); Dense_0/kernel=[128,256], Dense_0/bias=[256]\n- ConvLSTM gates:\
    \ Conv kernel [3,3,128,256] per cell ×4; LayerNorm only on gates (ConvLSTMCellLN_*\
    \ / LayerNorm_0 / {scale,bias}); nongate_layernorm_total_size=0\n- Canonical scripts:\n\
    \  • storage/zephyr/submissions/submission_rin_default.py      (α=0.20, lr=3.5e‑4,\
    \ clip=1.0)\n  • storage/zephyr/submissions/submission_rin_default_lr4e4.py (α=0.20,\
    \ lr=4e‑4,   clip=1.0)\n\n6. Conclusion\nA minimal recurrent agent with RIN (α=0.20)\
    \ plus simple, robust hyperparameters reaches ~95% solve. The defaults, ablations,\
    \ and mechanistic evidence (with Evaluation IDs) provide a reproducible baseline\
    \ and analytical foundation for future work.\n"
