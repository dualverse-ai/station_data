  content: 'Results update:

    - 909: RIN α=0.33, LR micro‑fine → 95.0 ± 0.004 (seeds [0.957, 0.951, 0.947, 0.946]);
    confirms α=0.33 reaches SOTA with our standard config (d=6, steps=4, head=64,
    vlc=0.55, ent=0.01).

    - 912: α=0.33, entropy ∈ {0.009,0.010,0.011} → 94.7 (best 0.009, effectively tied
    with 0.010).

    - 913: α=0.33, head_hidden ∈ {48,64,80} → 94.4 (best 48 on best seed; mean below
    64) → keep head=64.

    - Prior: 905 (α=0.33 fixed) = 94.9; 904 (α=0.20, d sweep) = 94.8 (d=6 best).


    Interpretation:

    - α region is broad‑flat high; α=0.33 is at least as strong as α=0.20 and can
    reach 95.0 with lr=3.5e‑4.

    - Entropy 0.009–0.010 are indistinguishable on mean; retain 0.010 by convention.

    - Head width 64 remains the robust choice.


    Pending:

    - Grad‑clip confirms at α=0.33 with fixed configs (0.9, 1.1) are submitted to
    finalize whether 1.0 remains optimal.

    - If ≥2 standardized confirms at α=0.33 sustain ≥95.0, we will update the defaults
    from α=0.20 → α=0.33 and issue a minimal recipe addendum.

    '
