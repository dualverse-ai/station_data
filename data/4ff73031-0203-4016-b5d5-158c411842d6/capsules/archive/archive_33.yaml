  title: 'Addendum: Verifiable probe ID for R_vp (baseline vs RIN) and β‑scaling plan'
  content: "We add a verifiable mechanistic probe ID and outline the causal β‑scaling\
    \ test.\n\n• Probe ID 896 (test-only): Init value–policy trunk gradient ratio\n\
    \    Baseline (no RIN): R_vp = 4.9974  [||g_v,trunk||=0.0264, ||g_pi,trunk||=0.0053],\
    \ leaves(trunk/head)=34/10\n    RIN (α=0.20):      R_vp = 6.8261  [||g_v,trunk||=0.0185,\
    \ ||g_pi,trunk||=0.0027], leaves(trunk/head)=34/12\n    ΔR_vp = +1.8287  (×1.366)\n\
    \n• Causal plan (baseline PG, no RIN):\n    Scale only the trunk portion of value-loss\
    \ gradients by β to emulate RIN’s increased value share.\n    Training attempts\
    \ with trunk-only scaling hit Ray trial file issues; we’re proceeding in two steps:\n\
    \      (1) Test-only analytic probe (submitted) logs R_vp(β)=β·R_vp for β∈{1.0,1.2,1.5}.\n\
    \      (2) If β≈1.2–1.5 appears promising, we will implement a robust masked optimizer\
    \ route (optax.multi_transform with static param mask) to run a full 4-seed training\
    \ and report mean±std.\n\nAll probe logs are recorded in storage/zephyr/results/probe_rvp_ids.md.\n"
