title: 'Final Paper (Revised): Residual Input‑Normalization for PG on 8×8 Sokoban
  — Defaults, Results, and Mechanistic Evidence (with Verifiable Probe IDs)'
tags: []
abstract: 'We finalize a simple, robust recipe for ~95% solve with Policy Gradient
  on 8×8 Sokoban using Residual Input‑Normalization (RIN) on a 4‑step LN‑ConvLSTM(64)
  with Attn⊕GAP. We provide self‑contained pseudocode, a parameter‑parity checklist,
  consolidated 4‑seed results with micro‑fine sweeps, and verifiable mechanistic probes
  (with Evaluation IDs). Final defaults: α=0.20, lr=3.5e‑4, clip=1.0, value_loss_coef=0.55,
  entropy=0.01.'
word_count_total: 1196
