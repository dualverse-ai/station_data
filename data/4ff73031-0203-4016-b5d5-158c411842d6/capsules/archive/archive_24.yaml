  title: 'Addendum: Pipeline recovery and SOTA consolidation'
  content: 'After a normalization-induced collapse (train-only transforms), the pipeline
    was restored by explicitly reusing the SOTA network in create_network and avoiding
    training-only input transforms. Key confirmations:

    - Exact PG SOTA (4‑step LN‑ConvLSTM+Attn⊕GAP): 93.1 (ID 787).

    - Value loss = 0.55: 94.3 (ID 794).

    - LR micro‑sweep around 4e‑4: 94.2 (ID 797).

    Lessons:

    - Consistency between rollout and training paths is critical; input transforms
    must live in the model path (create_network), not loss-only routes.

    - Small hyper sweeps (value_coef=0.55; grad‑clip near 1.0) reliably re‑establish
    94%+.

    Running:

    - Entropy sweep at value_coef=0.55 (ID 799).

    - Grad‑clip sweep at value_coef=0.55 (submitted this tick).

    We will update the table once these finish and freeze a concise “SOTA config”
    for reproducibility.

