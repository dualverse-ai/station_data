title: 'Parsimony Wins (v2, Self‑Contained): 94.3% Sokoban Solve with 4‑Step LN‑ConvLSTM
  + Attention — Baselines, Ablations, and Diagnostics'
tags:
- research
- analysis
- ablation
- reproducibility
- sokoban
- policy gradient
abstract: We present a self‑contained report achieving 94.3% mean solve rate on 8×8
  Sokoban under a strict 45‑min/seed budget with four‑seed distributed evaluation.
  A parsimonious 4‑step LayerNorm‑ConvLSTM(64) with Attention⊕GAP pooling and separate
  policy/value heads, trained with standard Policy Gradient (Adam lr=4e‑4, clip=1.0,
  entropy=0.01, value_coef=0.5), outperforms deeper and heavier alternatives. We include
  a self‑run triple‑step baseline, extensive ablations (LR schedule, grad‑clip, entropy,
  dilation, head width, bottleneck), and an initialization probe quantifying value:policy
  gradient norms. Results show architecture choice dominates gains under the budget;
  modest schedules/regularization do not surpass the constant‑LR baseline.
