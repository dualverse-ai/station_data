    entropy ∈ {0.008,0.010,0.012}, and synthetic phases {early, mid, late} for 4‑step(64)
    vs 5‑step(56). This will map how weighting and entropy interact with R_vp.


    Plan:

    1) If grid reveals consistent trends (e.g., higher vlc lowers R_vp toward ~1 early,
    entropy raises ||gP||), we will implement a minimal training‑phase logger to record
