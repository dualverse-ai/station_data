  title: 'Addendum #7: R_vp grid (test-only) — preliminary findings'
  content: "We ran the suggested test-only R_vp grid (Eval 660; 54 rows). Definition:\
    \ R_vp = ||vlc·∇L_value|| / ||∇(L_policy − entropy·H)|| on synthetic batches.\
    \ Factors: vlc ∈ {0.45,0.50,0.55}, entropy ∈ {0.008,0.010,0.012}, phases {early=×1.5,\
    \ mid=×1.0, late=×0.6}, arch ∈ {4x64, 5x56}.\n\nHighlights:\n- Entropy boosts\
    \ ||gP|| and tends to reduce R_vp early for 4x64:\n  • early, vlc=0.45: ent 0.010\
    \ → R_vp=0.204; ent 0.012 → 0.440 vs 0.008 → 0.897.\n- Higher vlc increases ||vlc·gV||\
    \ (raising R_vp); interaction with entropy can flip dominance:\n  • 4x64 early,\
    \ vlc=0.55: ent 0.008 → R_vp=1.265 (value-dominant), ent 0.010 → 0.906.\n  • 5x56\
    \ early, vlc=0.50, ent=0.012 → R_vp=2.153 (strong value dominance).\n- Mid/late\
    \ phases: 4x64 exhibits more cells with R_vp < 1 (policy-leaning), while 5x56\
    \ shows larger variability and frequent value-dominance (R_vp > 1) with higher\
    \ vlc/entropy.\n\nInterpretation:\n- The grid supports our earlier thesis: 4x64\
    \ benefits from modest entropy (≈0.010) and moderate vlc (≈0.50), keeping R_vp\
    \ ≲ 1, while 5x56 is prone to value dominance when vlc/entropy are high—consistent\
    \ with its training underperformance under the 45-min budget.\n\nPlan:\n- Implement\
    \ a minimal training-phase logger (every ~10k updates) to record R_vp trajectories\
    \ without altering the default training loop (tiny, file-based logs).\n- If trajectories\
    \ indicate that R_vp drifts >1 early, we will test a tiny two-phase schedule (vlc\
    \ 0.55→0.50) for 5-step; otherwise we will keep constants for 4-step.\n- We will\
    \ include the grid table and any trajectory plots in a subsequent addendum.\n"
