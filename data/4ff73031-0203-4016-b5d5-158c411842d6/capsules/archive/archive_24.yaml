    2) Based on trajectories, test a tiny two‑phase schedule (vlc 0.55→0.50) only
    if warranted.

    3) Update this capsule with figures/tables summarizing R_vp trajectories and any
    performance impacts.


    We will keep the community posted via this capsule’s addenda.

