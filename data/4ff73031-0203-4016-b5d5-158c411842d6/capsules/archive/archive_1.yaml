  content: "Post‑publication addendum (addressing reviewer suggestions)\n\nA. Multi‑head\
    \ attention (MHA) follow‑ups (planned, architecture‑only; default PG and budget)\n\
    Goal: test whether head specialization/aggregation mitigates the “credit dilution”\
    \ observed with naïve MHA.\n\n1) Head specialization by channel grouping\n   -\
    \ Replace single shared pre‑attn conv with per‑head projections over disjoint\
    \ channel subsets (Conv “grouping”).\n   - Compare: 1‑head (baseline) vs 2‑head\
    \ grouped vs 4‑head grouped; aggregation = learned gated sum.\n   - Metrics: mean\
    \ solve rate; attention concentration (per‑head entropy); training stability.\n\
    \n2) Aggregation variants (keeping 2 heads for parsimony)\n   - Concat + MLP aggregation\
    \ (vs simple sum).\n   - Gated sum with per‑head learned scalar gates (sigmoid)\
    \ and head dropout (p≈0.1).\n   - Per‑head temperature (learned) to avoid soft\
    \ averaging; compare fixed {1.0, 0.8} vs learned.\n\n3) Sparsity‑promoting attention\n\
    \   - Replace softmax with temperature‑sharpened softmax or sparsemax/entmax‑like\
    \ surrogate (JAX implementation).\n   - Compare 1‑head vs 2‑head with sparse attention.\n\
    \nNotes: We will keep ConvLSTM(64ch), LN on gates, and all training knobs fixed\
    \ to isolate the pooling effect. If any variant surpasses 63.5, we will report\
    \ full eval IDs and ablations.\n\nB. Qualitative failure analysis (planned; no\
    \ Sokoban‑specific heuristics)\n1) Unsolved episodes diagnostics\n   - Inspect\
    \ attention maps over time (spatial concentration, temporal persistence).\n  \
    \ - Track recurrent state stats (cell/hidden norms, gate activations) to detect\
    \ memory saturation/forgetting.\n   - Episode‑level signals: return trajectories\
    \ and episode length distributions (already available from logs).\n\n2) Comparative\
    \ case studies\n   - Matched‑seed runs for baseline (1‑head) vs best MHA variant:\
    \ visualize where attention diverges and whether divergence correlates with late‑episode\
    \ collapses.\n   - Cluster unsolved episodes by attention entropy and memory‑state\
    \ volatility to identify common patterns.\n\nDeliverables\n- If any MHA variant\
    \ improves over the 1‑head baseline, we will publish a short follow‑up with full\
    \ evaluation IDs and side‑by‑side visualizations (attention maps/time‑series statistics)\
    \ under the same budget and algorithm.\n\nRepro reminder\n- SOTA fixed‑seed script:\
    \ storage/zephyr/submissions/submission_sota.py\n- Results table and summary:\
    \ storage/zephyr/results/results.csv, storage/zephyr/results/summary.txt\n"
