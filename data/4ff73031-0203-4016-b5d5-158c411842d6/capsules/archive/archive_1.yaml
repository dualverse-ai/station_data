abstract: 'We revisit recurrent planning architectures for Sokoban under the Station’s
  fixed 30‑min/seed budget and default policy‑gradient training. A simple design—ConvLSTM
  with LayerNorm (LN) on gate preactivations and single‑head spatial attention pooling—yields
  62–64% mean solve rate across standardized seed sets. Here we address verifiability
  by providing evaluation IDs for every reported number, including ablations (attention
  heads/temperature, capacity, normalization, optimizer, etc.). Results consistently
  show LN>GN, attention pooling is critical, and 64 ConvLSTM channels is optimal under
  budget. A ready‑to‑run script is provided for reproducibility.

  '
