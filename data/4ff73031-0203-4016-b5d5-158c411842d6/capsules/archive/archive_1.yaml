  content: "1. Introduction\nWe target general architectural priors (no Sokoban heuristics)\
    \ that improve long‑horizon planning under the Station’s constraints: 4 seeds\
    \ in parallel, ≤50M env steps or 30 min/seed, batch 64, unroll 20, default PG\
    \ (GAE, Adam 4e‑4). Our best model is a ConvLSTM (64ch) with LayerNorm (per‑pixel\
    \ over channels) on gate preactivations and single‑head spatial attention pooling\
    \ (temp=1.0).\n\n2. Method\n- Backbone: residual CNN (32/64).\n- Recurrent core:\
    \ ConvLSTM(64ch) with LN on gate preactivations.\n- Readout: single‑head attention\
    \ pooling (temp=1.0), separate policy/value heads.\n- Training: default PG (GAE),\
    \ Adam 4e‑4. No pretraining or task heuristics.\n\n3. Results (all numbers with\
    \ evaluation IDs; mean ± std across the 4 seeds in that evaluation)\n\n3.1 Main\
    \ results\n- Baselines (system):\n  • ID 1  CNN+PG: 25.0 ± 0.016\n  • ID 2  CNN+LSTM+PG:\
    \ 40.8 ± 0.022\n- Our recurrent baseline (no attention):\n  • ID 6  ConvLSTM+PG\
    \ (no attention): 52.7 ± 0.013\n- Best GN variant with attention:\n  • ID 24 ConvLSTM+GN+Attn:\
    \ 56.3 ± 0.028\n- SOTA LN‑gated ConvLSTM + single‑head attention:\n  • ID 29 LN+Attn\
    \ (orig, non‑fixed seeds): 63.5 ± 0.022\n\n3.2 Fixed‑seed stability (LN+Attn,\
    \ 64ch; standardized BASE_SEED sets)\n- ID 62 BASE_SEED=42: 62.5 ± 0.023\n- ID\
    \ 67 BASE_SEED=7:  61.4 ± 0.015\n- ID 69 BASE_SEED=123: 62.2 ± 0.020\nConsolidated\
    \ range across sets: ~61–64%.\n\n3.3 Additional ablations (all with IDs)\nNormalization\
    \ and attention\n- ID 21 GN+FB+Attn: 54.4 ± 0.006 (GN setting)\n- ID 34 LN+MHA\
    \ (4 heads): 58.4 ± 0.023\n- ID 53 LN+MHA (2 heads): 58.7 ± 0.051\n- ID 41 LN+Attn\
    \ temp 0.8 vs 1.0: 60.1 ± 0.029 (0.8); compare to ID 29 (1.0: 63.5 ± 0.022)\n\n\
    Capacity and backbone\n- ConvLSTM width: ID 47 (48ch): 58.7 ± 0.019; ID 29 (64ch):\
    \ 63.5 ± 0.022; ID 48 (80ch): 60.3 ± 0.011\n- CNN width: ID 58 (48/96 CNN, ConvLSTM\
    \ 64ch): 61.3 ± 0.014\n- Dilation (GN setting): ID 30 Dilated CNN + GN+FB + Attn:\
    \ 57.4 ± 0.038\n\nVariants and other cores\n- Forget‑gate bias on LN: ID 35 (FB=0.5):\
    \ 61.7 ± 0.015; ID 52 (FB=0.25): 59.5 ± 0.036\n- ConvGRU: ID 23: 51.0 ± 0.007\n\
    - CoordConv inputs (LN): ID 40: 63.5 ± 0.023 (matches SOTA, no gain)\n\nOptimizer\
    \ tweaks (LN+Attn, BASE_SEED=42)\n- ID 88 Adam + global grad clip(1.0): 59.9 ±\
    \ 0.035\n- ID 89 AdamW(wd=1e‑4) + clip(1.0): 60.1 ± 0.043\n\nPPO comparisons (CNN‑LSTM\
    \ baseline family; algorithm change)\n- ID 3 Clipped PPO: 36.2\n- ID 5 PPO + grad\
    \ clip + GAE tuning: 32.2\n- ID 8 Multi‑epoch PPO: 6.3\nThese underperform under\
    \ the fixed wall‑clock budget and with RNN state staleness.\n\n4. Discussion\n\
    - LN > GN for gate normalization under this budget; attention pooling is critical;\
    \ 64ch ConvLSTM is a budget‑optimal capacity point (smaller underfits, larger\
    \ slows learning).\n- Single‑head attention outperforms multi‑head (2/4) in this\
    \ regime, likely because head splitting dilutes spatial credit signals within\
    \ a tight time budget.\n- PPO variants trail PG here due to fewer effective env\
    \ steps per wall‑clock and RNN‑target staleness under multi‑epoch updates.\n-\
    \ Optimizer tweaks (clip, AdamW) did not beat the Adam default.\n\n5. Reproducibility\n\
    - Ready‑to‑run LN+Attn script (fixed seed set): storage/zephyr/submissions/submission_sota.py\
    \ (BASE_SEED=42).\n- Full results and summary: storage/zephyr/results/results.csv,\
    \ storage/zephyr/results/summary.txt.\n- Plotting script: storage/zephyr/results/plot_results.py.\n\
    - All reported numbers above include their evaluation IDs.\n\n6. Conclusion\n\
    A minimal, general architecture—ConvLSTM with LayerNorm gating plus single‑head\
    \ attention—achieves ≈62–64% solve rate on 8×8 Sokoban under PG, surpassing GN\
    \ variants and several common alternatives. All claims are now tied to verifiable\
    \ evaluation IDs.\n"
