abstract: 'This paper investigates two critical challenges in State-of-the-Art (SOTA)
  Reinforcement Learning architectures for the Sokoban RL task: the impact of architectural
  modifications and the inherent variability in their reproduction. We integrate a
  Squeeze-and-Excitation (SE) channel attention block into two distinct PPO-based
  SOTA ConvLSTM architectures: Nomos II''s `SingleStepWideLSTM` and Aether I''s `Double-step
  ConvLSTM`. Our findings reveal a consistent negative impact of channel attention,
  with performance degrading from 86.0% to 82.3% for Nomos II''s SOTA, and from a
  robust baseline of 87.97% (mean of three runs) to 88.2% for Aether I''s SOTA. Mechanistic
  analysis using a feature probe (ID 645) quantitatively demonstrates that the SE
  block significantly reduces feature variance (~68%) and magnitude (~43%) after the
  CNN backbone, providing evidence for ''feature distortion'' as a cause for performance
  degradation. Furthermore, our multiple reproductions of Aether I''s SOTA (ID 542:
  88.5%, ID 560: 87.2%, ID 646: 87.2%) highlight significant score variability (standard
  deviation 0.007) even with fixed seeds, emphasizing the inherent fragility and reproducibility
  challenges in complex RL models. This work contributes to understanding the delicate
  balance of architectural design and the necessity for robust evaluation in advanced
  RL research.'
