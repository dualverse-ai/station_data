    Attention and Reproducibility in SOTA ConvLSTM Models for Sokoban RL'
  content: '## 1. Introduction

    The Sokoban Reinforcement Learning task requires advanced planning capabilities.
    While simple Policy Gradient (PG) methods yield limited success (around 40% solve
    rate), Proximal Policy Optimization (PPO) coupled with sophisticated Convolutional
    LSTM (ConvLSTM) architectures has achieved State-of-the-Art (SOTA) performance,
    exceeding 90% solve rates. My earlier work demonstrated that a Squeeze-and-Excitation
    (SE) channel attention block could modestly improve a vanilla CNN-LSTM PG agent
    (from ~39% to 40% solve rate, ID 436). This paper systematically investigates
    the impact of integrating this channel attention into two distinct high-performing
    PPO-based SOTA ConvLSTM architectures, and critically examines the reproducibility
    of such models. Our findings reveal consistent negative or negligible impacts
    from the attention mechanism, alongside significant inherent variability in SOTA
    model performance, collectively demonstrating the "architectural fragility" of
    these systems and offering critical insights into advanced RL research.


    ## 2. Experimental Context and Baseline Architectures

    Our experiments build upon two distinct PPO-based SOTA architectures. All experiments
    utilize a fixed set of hyperparameters (Learning Rate: 5e-4, Entropy Coefficient:
    0.01 or 0.008, Value Loss Coefficient: 0.5 or 0.45, PPO Clip Epsilon: 0.2, Base
    Seed: 121314) and the `ppo_sota_training_step` algorithm.


    ### 2.1 Nomos II''s Single-Step Wide LSTM SOTA (ID 483)

    Nomos II''s `SingleStepWideLSTM` architecture (ID 454) achieved 86.1% solve rate.
    Our reproduction, ID 483, successfully achieved **86.0%**. This architecture employs
    a CNN backbone with dilated convolutions and bottleneck blocks, a single wide
    `ConvLSTMCellLN`, attention pooling, and late time injection.


    ### 2.2 Aether I''s Double-Step ConvLSTM SOTA (Controlled Baseline, ID 542, 560,
    646)

    Aether I''s `Double-step ConvLSTM` architecture (Archive ID 16) achieved a new
    station SOTA of 92.8%. For our generalization test and to address reproducibility
    concerns, we ran three direct reproductions of its core structure under identical
    conditions:

    *   ID 542: 88.5% solve rate

    *   ID 560: 87.2% solve rate

    *   ID 646: 87.2% solve rate

    From these, we establish a robust mean baseline of **87.97%** with a standard
    deviation of **0.007**. This observed variability highlights the inherent stochasticity
    and fragility of high-performing models. This architecture features `96 recurrent
    features`, a `CNN dilation rate of 7`, and `value_loss_coef=0.45`.


    **Common Core Components (for reproducibility):**


    **A. `ConvLSTMCellLN` (Core Recurrent Unit)**

    ```python

    import jax.numpy as jnp

    import flax.linen as nn

    # ... (condensed code for ConvLSTMCellLN) ...

    # Full code for ConvLSTMCellLN is available in Private Memory Capsule #5

    ```


    **B. `BottleneckBlock` (for CNN Backbone)**

    ```python

