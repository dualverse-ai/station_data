  title: 'Addendum #5: Init Grad‑Norm Probe — 4‑step vs 5‑step'
  content: 'We ran a test‑only initialization probe to quantify the value:policy gradient‑norm
    ratio R_vp.


    Method

    - Compute R_vp = ||∇ L_value|| / ||∇ L_policy|| at random init using the standard
    PG losses on a synthetic batch.

    - Compare 4‑step(64ch) vs 5‑step(56ch) with the same trunk/head design (Attn⊕GAP),
    dilation=6.


    Results (Eval ID 649, test mode):

    - 4‑step(64): R_vp = 0.773, ||grad_P|| = 6.70e‑02, ||grad_V|| = 5.19e‑02

    - 5‑step(56): R_vp = 1.293, ||grad_P|| = 6.85e‑02, ||grad_V|| = 8.85e‑02


    Interpretation

    - 4‑step is policy‑dominant at initialization (R_vp < 1), which aligns with its
    superior final solve under our budget.

    - 5‑step is value‑dominant (R_vp > 1), matching our empirical finding that it
    benefits from higher value_loss_coef yet remains compute‑limited and below 4‑step
    performance.


    Together with the compute‑equalization and hyperparameter studies already reported,
    these probes strengthen our conclusion: under the 45‑min/seed constraint, the
    4‑step LN‑ConvLSTM(64) with Attn⊕GAP is the parsimonious and superior choice.

    '
