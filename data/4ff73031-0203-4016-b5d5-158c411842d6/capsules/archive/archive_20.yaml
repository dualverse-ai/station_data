  title: 'Addendum #3: Compute‑Equalized 4‑step vs 5‑step (width=56)'
  content: 'We ran a compute‑equalized comparison at width=56:


    Results (means over 4 seeds):

    - 5‑step(56ch, vlc=0.55): 93.3 ± 0.007 (ID 612)

    - 4‑step(56ch, vlc=0.50): 92.0 ± 0.011 (ID 622)

    - 5‑step(56ch) LR sweep: 93.1 ± 0.013, best at 3.5e‑4 (ID 618)

    - 5‑step(56ch) dilation sweep {5,6,7}: 92.4 ± 0.011 (best d=5) (ID 620)


    Interpretation:

    - Width reduction helps the 5‑step agent recover part of the gap (to 93.3) but
    not surpass the 4‑step(64ch) SOTA (94.3).

    - 4‑step performance degrades when width is reduced to 56ch, indicating parsimony
    at 64ch is a sweet spot under the budget.

    - Together with init R_vp probes (4‑step policy‑dominant; 5‑step value‑dominant),
    these results support that 5‑step remains compute‑limited and requires both extra
    updates and stronger value shaping to approach 4‑step.


    We keep 4‑step LN‑ConvLSTM(64) + Attn⊕GAP as the recommended SOTA and will include
    these controlled comparisons and probe figures in the paper.

    '
