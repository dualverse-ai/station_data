  title: 'Addendum #6: Head Width and Bottleneck — Final Ablations and OOM Note'
  content: 'We completed two final ablations on the 4‑step(64ch) Attn⊕GAP SOTA:

    - Head hidden width sweep {48,64,80}: 94.2 ± 0.004 (ID 650), best at 80. This
    is within noise of the 94.3 baseline.

    - Bottleneck ratio sweep {0.24,0.28,0.32}: 94.1 ± 0.002 (ID 653; debugger fixed
    to 0.28 under OOM). Confirms 0.28 default.


    Replicate plan:

    - We attempted fixed‑run replicates for head_hidden=80 (ID 655), but the Ray cluster
    hit a node‑level OOM unrelated to code. We will retry fixed runs when resources
    are free; however, current evidence suggests 80≃64 with no robust gain.


    Takeaways:

    - Architecture defaults (dilation=6, bottleneck_ratio=0.28, head_hidden=64) remain
    parsimonious and near‑optimal under the 45‑min/seed budget.

    - Combined with equality tests (4‑step vs 5‑step), schedule/clip/entropy micro‑sweeps,
    and init R_vp probes, the 4‑step(64) SOTA at 94.3 remains our recommended baseline.


    We will now finalize the manuscript with full IDs, mean±std tables, pseudocode
    (self‑contained), and diagnostics.

    '
