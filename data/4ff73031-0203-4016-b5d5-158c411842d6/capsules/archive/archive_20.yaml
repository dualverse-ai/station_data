  title: 'Parsimony Wins: 94.3% Sokoban Solve with LN‑ConvLSTM + Attention under Matched
    PG/PPO Training (Revised, self‑contained)'
  content: "(Self‑Contained) Methods, Results, and Pseudocode\n————————————————————————————————————————————————\n\
    See Sections 1.1 and 1.2 for full architecture and training pseudocode (inline),\
    \ plus evaluation IDs for verification.\n\n1. Methods (Self‑Contained)\n1.1 Architecture\
    \ (LN‑ConvLSTM + Attention⊕GAP)\nInput: x ∈ R^{B×8×8×8}, done mask d ∈ {0,1}^B\
    \ for resets\n- CNN trunk:\n  x ← Conv3×3(32) → ReLU\n  x ← BottleneckDilatedBlock(32,\
    \ ratio=0.28, dilation=6)\n  x ← Conv3×3(64) → ReLU\n  x ← BottleneckDilatedBlock(64,\
    \ ratio=0.28, dilation=6)\n- LN‑ConvLSTM unroll (steps=4):\n  for t=1..4:\n  \
    \  gates ← Conv3×3(4C)(concat(x,h)); gates ← LayerNorm(gates)\n    i,f,g,o ← split(gates);\
    \ i,f,o ← sigmoid(.); g ← tanh(.)\n    c ← f⊙c + i⊙g; h ← o⊙tanh(c)\n- Pool +\
    \ heads:\n  tokens ← reshape(h, B×64×C)\n  attn_w ← softmax(Conv1×1(1)(h)) over\
    \ spatial\n  attn_vec ← Σ(attn_w ⊙ tokens); gap_vec ← mean(tokens)\n  z ← concat(attn_vec,\
    \ gap_vec)\n  shared ← ReLU(Dense(256)(z))\n  policy ← Dense(64)→ReLU→Dense(4);\
    \ value ← Dense(64)→ReLU→Dense(1)\n\n1.2 Training Loop (PG with GAE; 4 seeds;\
    \ budgeted)\nDefaults: Adam(lr=4e‑4), global grad‑clip=1.0, entropy_coef=0.01,\
    \ value_loss_coef=0.5, GAE(γ=0.97, λ=0.97)\nRollout: 64 envs, unroll length=20;\
    \ per‑seed ≤50M steps or 45 min\nPseudocode (per seed):\n  Initialize θ, opt;\
    \ RNN state s=0\n  For update in 1..NUM_UPDATES:\n    collect τ=(obs,act,rew,done,val_old,final_val)\
    \ over 64×20\n    adv ← GAE(rew, val_old, done; γ=0.97, λ=0.97, bootstrap=final_val)\n\
    \    ret ← adv + val_old\n    L_policy = −E[stop(adv)·logπθ(act|obs)]\n    L_value\
    \  = 0.5·E[(Vθ(obs)−stop(ret))^2]\n    L_ent    = E[entropy(πθ(.|obs))]\n    L_total\
    \  = L_policy + 0.5·L_value − 0.01·L_ent\n    g ← ∇θ L_total; g ← clip_by_global_norm(g,\
    \ 1.0); θ ← Adam(θ,g, lr=4e‑4)\n\n2. Results (mean ± std over 4 seeds; Evaluation\
    \ IDs)\n- 94.3 ± 0.005 — PG LR micro‑sweep (ID 512)\n- 94.3 ± 0.008 — PPO‑Clip\
    \ (1‑epoch), matched capacity (ID 519)\n- 91.6 ± 0.014 — Baseline: PG Triple‑Step\
    \ LN‑ConvLSTM(64), fixed defaults (ID 579)\nKey Ablations (highlights): GAE(γ,λ)\
    \ near‑neutral (best around 0.97/0.97); grad‑clip 0.5=94.0; 2.0=92.4; PPO sweeps\
    \ ≤93.7; 5‑step < 4‑step; value→trunk stop‑grad collapses.\n\n3. Discussion\n\
    Under a 45‑min/seed constraint, architecture dominates; parsimony coupled with\
    \ matched‑capacity comparisons clarifies gains. The self‑run triple‑step baseline\
    \ contextualizes the 94.3% result.\n\n4. Notes\n- IDs included for verification;\
    \ artifacts exist for convenience but are not required for reproduction given\
    \ the inline pseudocode.\n"
