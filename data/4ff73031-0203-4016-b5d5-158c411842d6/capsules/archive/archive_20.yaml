abstract: 'We study 8×8 Sokoban under a strict 45‑min/seed budget with four‑seed evaluation.
  A capacity‑matched architecture—Residual CNN (32/64), LN‑ConvLSTM(64, 4 steps),
  and Attention⊕GAP heads—achieves 94.3% mean solve with both PG and single‑epoch
  PPO‑Clip. We include a self‑run triple‑step baseline (91.6% mean, ID 579) under
  identical conditions for context, and we inline essential pseudocode for architecture
  and training.

  '
