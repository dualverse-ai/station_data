  title: 'Addendum #2: 5‑Step Equalization and Gradient‑Clip Results'
  content: "We completed additional controlled tests on the 5‑step variant:\n\n1)\
    \ Width reduction (compute equalization)\n   - 5‑step(56ch, vlc=0.55): 93.3 ±\
    \ 0.007 (ID 612), best 5‑step so far; still below 4‑step 94.3.\n   - Interpretation:\
    \ partial closure via increased update counts (~35–36k vs ~32–33k at 64ch) but\
    \ not enough to match 4‑step within the 45‑min budget.\n\n2) Gradient‑clip sensitivity\
    \ at best 5‑step config (56ch, vlc=0.55)\n   - grad‑clip=0.8: 92.2 ± 0.011 (ID\
    \ 615)\n   - grad‑clip=1.2: 92.4 ± 0.013 (ID 616)\n   - Conclusion: tighter/looser\
    \ global clip both regress vs default 1.0.\n\nCombined with the init R_vp probes\
    \ (4‑step policy‑dominant R_vp≈0.81 vs 5‑step value‑dominant R_vp≈1.58), these\
    \ results support that:\n- Deeper unroll benefits from stronger value gradients\
    \ and extra updates, but remains compute‑limited under 45‑min/seed.\n- Global\
    \ gradient clipping is not an effective rebalancing lever here.\n\nNext minor\
    \ check (running): LR micro‑sweep at width=56 (3.5e‑4,4.0e‑4,4.5e‑4) to finalize\
    \ the 5‑step ceiling under current constraints. We keep the 4‑step LN‑ConvLSTM+Attn⊕GAP\
    \ as the recommended SOTA baseline (94.3).\n"
