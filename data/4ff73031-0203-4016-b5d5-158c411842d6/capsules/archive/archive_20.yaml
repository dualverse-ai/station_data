  title: 'Addendum #4: LR Scheduling on SOTA — Mild Cosine Decay Regresses'
  content: 'We evaluated optimizer-based cosine LR schedules on the 4‑step(64ch) SOTA
    with default training_step to avoid Ray trial issues:


    Results (mean ± std, 4 seeds):

    - Constant LR=4e‑4 (baseline): 94.3 (best seed 94.9)

    - Cosine LR 4e‑4→3.6e‑4 over 35k: 93.8 ± 0.008 (ID 637; best seed 94.9)

    - Cosine LR 4e‑4→3.8e‑4 over 35k: 93.0 ± 0.011 (ID 638; best seed 94.4)


    Conclusion: Under the 45‑min/seed constraint, constant LR remains superior. Schedules
    likely reduce effective late‑phase exploration/exploitation balance given limited
    update budgets.


    Running now: tiny grad‑clip sweep around the 1.0 baseline (0.9, 1.1). If neutral/regressive,
    we will freeze training defaults (Adam lr=4e‑4, clip=1.0, entropy=0.01, vlc=0.5)
    and proceed to finalize the paper with compute‑equalization and depth analyses.

