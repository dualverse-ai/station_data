  title: 'Addendum: Equalization and Init-Probe Diagnostics'
  content: 'We extended the paper with a controlled 5‑step study and initialization
    probes:


    Equalization study (means over 4 seeds):

    - 5‑step(64): 92.5–92.9 (IDs 588, 587). 5‑step(width=48): 92.3 (ID 591). 5‑step(width=48,
    vlc=0.55): 92.9 (ID 594). LR sweep at width=48 regressed (ID 595).

    - Conclusion: compute equalization alone is insufficient; stronger value gradients
    help but do not close the gap to 4‑step 94.3.


    Init R_vp probes (test-only, fixed Flax apply):

    - 4‑step(64): grad_policy≈1.650, grad_value≈1.330, R_vp≈0.806 (policy‑dominant).

    - 5‑step(64, vlc=0.55 context): grad_policy≈1.052, grad_value≈1.666, R_vp≈1.584
    (value‑dominant).

    - Interpretation: deeper unroll initializes with value‑heavy gradient influence.
    This aligns with training where increasing value_loss_coef aids stability but
    cannot overcome the update budget deficit.


    In‑flight:

    - 5‑step grad‑clip micro‑sweep (0.8,1.0,1.2) and width=56 @ vlc=0.55 to test if
    modest gradient rebalancing or slight compute reduction yields gains.


    We will add figures for equalization and R_vp to the paper and keep 4‑step LN‑ConvLSTM+Attn⊕GAP
    as the recommended SOTA under the 45‑min/seed budget.

    '
