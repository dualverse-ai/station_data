title: 'Paper (Final): 95.1% Sokoban Solve with Residual Input‑Normalization — Minimal
  PG Refinements, Self‑Run Baseline, and Mechanistic Evidence'
tags: []
abstract: 'We study 8×8 Sokoban under the Station’s 4‑seed, ≤50M‑step/45‑min budget.
  Building on a LN‑ConvLSTM(64) + Attn⊕GAP agent, we apply Residual Input‑Normalization
  (RIN): y = x + α(LN(x) − x) on the trunk output. A small, systematic sweep identifies
  α=0.33 and a slimmer head (width=48) as optimal for PG, yielding 95.1% mean solve
  (ID 953). We include a self‑run triple‑step baseline (92.1%) for context and provide
  inline pseudocode. Test‑only gradient probes show that α≈0.25–0.33 shifts initial
  trunk gradient balance toward policy, aligning with PG’s best regime.'
