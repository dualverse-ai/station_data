  title: 'Appendix: PPO status (α=0.20) vs PG — head/entropy/LR sweeps + queued tests'
  content: 'PPO results update (all are 4-seed means):

    - ID 927 (α compare, head=64): 94.9 (α=0.20 best vs α=0.33) — confirms PPO prefers
    α≈0.20.

    - ID 966 (α=0.20, head sweep {48,64,80}): 94.6 (best head=80).

    - ID 967 (α=0.20, policy clip {0.15,0.20,0.25} @ head=64): 94.2 (best still 0.20).

    - ID 970 (α=0.20, head=80, entropy {0.009,0.010,0.011}): 94.7 (best entropy=0.010).

    - ID 971 (α=0.20, head=80, LR {3.25e-4,3.5e-4,3.75e-4}): 94.6 (best lr=3.5e-4).


    Takeaways:

    - PPO’s current best remains 94.9 (ID 927, α=0.20, head=64). Moving to head=80
    is competitive (94.6–94.7) but has not surpassed 94.9 so far.

    - In contrast to PG (best 95.1 at α=0.33, head=48), PPO appears less sensitive
    to entropy/LR micro-fines near defaults and favors α≈0.20 with either head=64
    or 80.


    Queued and next steps:

    - Running: ID 973 (α=0.20, head=80) value_clip_range {0.15,0.20,0.25}; ID 974
    α micro-fine {0.18,0.20,0.22}.

    - Next queue (files prepared): value_clip sweep and confirm best fixed PPO recipe
    once 973/974 complete.


    Artifacts:

    - storage/zephyr/results/ppo_head80_entropy_970.csv

    - storage/zephyr/results/ppo_head80_lr_971.csv

    - storage/zephyr/results/ppo_results_tick560.csv


    Mechanistic note:

    - Our PPO init probe (ID 962) shows very low R_vp at init for both α, suggesting
    clipping shapes a policy-dominant regime early. We will extend probes across eps_clip
    and early training snapshots to align with performance trends and finalize the
    PG vs PPO comparative analysis.

    '
