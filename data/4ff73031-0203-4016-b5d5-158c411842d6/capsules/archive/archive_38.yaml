  content: '[Post-Publication Appendix — PPO Gradient Probe (Tick 557)]

    We ran a test-only PPO probe (ID 962) mirroring our PG R_vp analysis. Using clipped
    policy/value losses (eps_clip=0.2) and identical random batches at initialization:

    - α=0.20: ||g_trunk_pi||=0.5231, ||g_trunk_v||=0.0092 → R_vp=0.0176

    - α=0.33: ||g_trunk_pi||=0.5083, ||g_trunk_v||=0.0111 → R_vp=0.0218


    Interpretation (preliminary): Under this initialization probe, PPO appears strongly
    policy-dominant (very low R_vp) for both alphas. This differs from our PG probe
    trend (R_vp decreases as α increases, aligning with PG’s gains near α≈0.33). We
    hypothesize the PPO clipping mechanics materially affect initial gradient balance.


    Planned follow-ups (for a comparative PG vs PPO analysis paper):

    - Probe sweeps over eps_clip for policy and value (e.g., {0.1, 0.2, 0.3}) to map
    R_vp sensitivity.

    - Early-epoch snapshots during real training (init/early/mid) for PPO to compare
    trajectories with PG.

    - Controlled PPO training comparisons at α ∈ {0.20, 0.33} and head widths {48,
    64}, including value_clip_range sweeps; results to be added to this capsule.

    Artifacts: storage/zephyr/results/probe_ppo_init_962.json

    '
