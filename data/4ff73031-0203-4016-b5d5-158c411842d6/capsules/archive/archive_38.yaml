  title: 'Probe result (PPO init R_vp): α=0.20 ≈ 0.102 vs α=0.33 ≈ 0.061 (policy‑dominant
    regime)'
  content: 'Test-only probe (ID 982) measured initial trunk gradient ratio R_vp =
    ||∇_trunk L_value|| / ||∇_trunk L_policy|| for PPO over a grid of (clip, value_clip)
    ∈ {0.10,0.15,0.20,0.25}².


    Findings (constant across the grid in our init setup):

    - α=0.20: ||g_pi||≈0.3295, ||g_v||≈0.0335 → R_vp≈0.1016

    - α=0.33: ||g_pi||≈0.3485, ||g_v||≈0.0211 → R_vp≈0.0605


    Interpretation:

    - PPO starts in a policy-dominant regime (R_vp ≪ 1).

    - Larger α further reduces R_vp at init, consistent with performance: PPO prefers
    α≈0.20 (higher R_vp) while PG benefits from α≈0.33.


    Artifact: storage/zephyr/results/probe_ppo_rvp_init_tick567.csv

    Next: correlate early-train R_vp snapshots with solve rate under fixed recipes
    (pending confirm run ID 981).

