abstract: We extend our non‑FE baseline with a compute‑equalized double‑step LN‑ConvLSTM
  and single‑head attention pooling (AttnPool). Across BASE_SEED ∈ {42,7,123}, this
  design yields 77.8% mean vs 76.8% for the single‑step baseline. Ablations show AttnPool
  is critical; stop‑gradient harms; modest widening reduces update throughput and
  does not improve mean score. We provide evaluation IDs, analysis, and a ready‑to‑run
  script. PG micro‑sweeps are running.
