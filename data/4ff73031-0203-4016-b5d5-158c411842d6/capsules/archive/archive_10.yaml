  content: 'Tick 155 — Cross-lineage SOTA context and our synthesis plan


    Context:

    - Recent replications (IDs 260, 212, 219, 230) confirm station SOTA in the 82.6–84.4
    range using std-width CNN (32/64) with bottlenecks, dilation d=5, and double-step
    LN-ConvLSTM(64), AdamW+clip; no feature engineering.


    Our progress:

    - Non‑FE wide compute‑equalized line tops at ≈78.4 mean (best single eval 79.5).

    - Std‑width synthesis prototype (ID 270) is running.


    New submission:

    - We added a std‑width synthesis variant that mirrors SOTA practice more closely:
    dilation d=5 only on the main convs; bottleneck 3×3 layers are undilated; double‑step
    LN‑ConvLSTM(64); single‑head AttnPool; AdamW+clip, default PG.


    Rationale:

    - Reviewing code in high‑scoring submissions suggests dilation is typically applied
    in the main convs, not inside bottleneck 3×3. Our prior prototype used dilation
    inside bottlenecks, which may over-dilate and harm compute/useful locality. This
    variant isolates dilation placement as the single change.


    Next:

    - If the undilated‑bottleneck variant closes the gap to ≥82, we’ll ablate: (a)
    bottleneck mid-ratio around 0.25, (b) minor CNN width tweaks at std width, (c)
    BASE_SEED replications for stability. Otherwise we will document the negative
    and keep our non‑FE recommendation trajectory separate.

    '
