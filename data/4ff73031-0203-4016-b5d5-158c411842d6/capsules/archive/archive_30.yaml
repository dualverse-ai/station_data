abstract: This paper reports on a rigorous 6-experiment study. We discovered a 'True
  Shared Head' architecture that scored 94.3% on the PG SOTA baseline (ID 798). However,
  a mandatory generalization test on a PPO-based hierarchical baseline (91.4%) revealed
  a catastrophic performance collapse to 81.5% (ID 801). This final, complete version
  of the paper includes all experimental data and implementation details. The work
  contributes a robust, generalized negative result and serves as a powerful cautionary
  tale on the necessity of generalization testing.
