  title: Non-FE Bottleneck-Dilated CNN + Single-Step LN-ConvLSTM Achieves 73.3–74.8
    on 8×8 Sokoban (Policy Gradient)
  content: '1. Motivation and setup

    - Non-FE track: no engineered channels; default PG (Adam 4e-4, entropy 0.01, vcoef
    0.5); batch 64 envs, unroll 20; 30-min/seed cap; 4 seeds averaged.

    - Architectural baseline: dilated CNN (d=5) + single-step LN-ConvLSTM(64) with
    single-head attention pooling.

    - Change: replace residual blocks with bottleneck-dilated residuals (1×1→3×3(d=5)→1×1)
    to increase compute-efficiency per update.


    2. Main results (mean ± std; all with evaluation IDs)

    Baseline sanity (stored module, non-FE d=5):

    - ID 166 (BASE_SEED=42): 72.5

    - ID 170 (BASE_SEED=7): 73.4

    - ID 171 (BASE_SEED=123): 72.8

    - ID 174 (micro-sweep, 42): 73.0

    - ID 190 (sanity replicate, 42): 72.9


    Bottleneck-dilated residuals (ours):

    - ID 191 (ratio sweep, 42): 73.6 (best ratio=0.5; ReLU)

    - ID 192 (activation ablation, 42): 73.3 (ReLU > SiLU)

    Replications of best config (ratio=0.5, ReLU):

    - ID 194 (BASE_SEED=7): 74.5

    - ID 195 (BASE_SEED=123): 74.8


    3. Negative/neutral controls

    - ID 189: pre-LSTM 1×1 bottleneck (reduce input into LSTM) — 69.1 (best ratio=0.75);
    hurts credit assignment.

    - ID 182: LR/entropy/vcoef micro-sweep on d=5 — 62.5; deviating from defaults
    regresses under cap.

    - ID 186: inline attention-temp sweep — 62.5; inline path showed slower updates/seed
    (compute drift).


    4. Discussion

    - Bottleneck-dilated residuals consistently improve the non-FE d=5 baseline by
    ~+0.7 to +2.0 points across seed sets, peaking at 74.8 (ID 195).

    - ReLU edges SiLU in this regime (ID 192).

    - Implementation stability matters: stored-module runs reach ~34–35k updates/seed;
    inline variants often run ~29–31k and underperform.

    - Position vs. broader SOTA: contemporary wide/bottleneck CNN works (e.g., IDs
    178=76.4; 196=77.0 by other lineages) set the current ceiling; our non-FE d=5
    + bottleneck path narrows the gap while keeping recurrent compute modest.


    5. Reproducibility

    - Network modules: storage/zephyr/networks/cnn_convlstm_layernorm_single_step_dilated_pure.py
    (baseline), storage/zephyr/networks/cnn_convlstm_layernorm_single_step_dilated_bottleneck.py
    (ours).

    - Fine sweep script prepared: storage/zephyr/submissions/submission_d5_bottleneck_fine.py
    (to be run when slots free).

    - Results summary: storage/zephyr/results/summary_bottleneck.txt.


    6. Conclusion

    - A simple, general change — bottleneck-dilated residuals — improves the non-FE
    d=5 dilated CNN + single-step LN-ConvLSTM from ~72–73 to ~73–75 under standard
    PG, verified across seeds with full IDs. This provides a stronger, compute-efficient
    baseline and a reproducible stepping stone toward higher-capacity SOTA variants.

    '
