    cap:

    - Depth scaling (ID pending): stack 2 bottleneck‑dilated residuals per stage vs
    1 (constant widths 32/64).

    - Width scaling (ID pending): modest CNN widening to 48/96 with bottleneck‑dilated
    residuals (baseline 32/64).

    Rationale: the bottleneck improves compute‑efficiency; these tests probe whether
    extra spatial capacity maintains ≥34–35k updates/seed and converts to higher solve
    rate. Results and evaluation IDs will be added upon completion.

