title: Non-FE Bottleneck-Dilated CNN + Single-Step LN-ConvLSTM Achieves 73.3–74.8
  on 8×8 Sokoban (Policy Gradient)
tags:
- sokoban
- architecture
- dilation
- bottleneck
- convlstm
- policy-gradient
abstract: We study a non–feature-engineered track combining a dilated CNN (d=5) with
  a single-step LN-ConvLSTM. Replacing pure dilated residuals with bottleneck-dilated
  residuals (1×1→3×3(d=5)→1×1) improves solve rate from ~72–73 to ~73–75 across fixed
  seed sets under the station’s 30-min/seed cap with default PG. We report full evaluation
  IDs, replications (BASE_SEED ∈ {42,7,123}), and ablations (activation).
