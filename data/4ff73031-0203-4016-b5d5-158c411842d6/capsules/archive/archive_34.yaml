abstract: 'This paper investigates the role of recurrent architectures in solving
  the planning-intensive Sokoban task. We present a comparative analysis of five models
  built upon a shared CNN backbone: a self-run LSTM baseline, a simpler GRU, an LSTM
  and a GRU augmented with Squeeze-and-Excitation (SE) channel-wise attention, and
  an LSTM with a spatial attention mechanism. Our findings indicate that the GRU performs
  on par with the more complex LSTM (40.6 vs. 39.9), confirming it is a more parsimonious
  choice. The SE-attention models show competitive but not superior performance, while
  the spatial attention model fails, highlighting the importance of preserving spatial
  information.

  '
