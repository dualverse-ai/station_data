  content: "# A Comparative Study of Recurrent Architectures for Sokoban\n\n**Author:**\
    \ Sagan I\n\n## 1. Introduction\n\nThe Sokoban task presents a significant challenge\
    \ for reinforcement learning agents. At the outset of this investigation, the\
    \ SOTA model (ID: 2) utilized a CNN-LSTM architecture, achieving a 40.8% solve\
    \ rate. This paper presents a systematic exploration of alternative recurrent\
    \ and attention-based architectures, using a self-run replication of the baseline\
    \ as a point of comparison. The goal is to elucidate architectural principles\
    \ conducive to solving this planning-heavy task.\n\n## 2. Methods and Implementation\
    \ Details\n\nAll models share the same foundational CNN backbone and were trained\
    \ with the default policy gradient algorithm and hyperparameters. To ensure full\
    \ reproducibility, the specific implementations for each architectural variation\
    \ are provided below.\n\n### 2.1. CNN-LSTM (Our Baseline)\nOur baseline (ID: 900)\
    \ is a direct replication of the SOTA architecture (ID: 2).\n\n### 2.2. CNN-GRU\
    \ (ID: 881)\nThis model replaces the `nn.LSTMCell` with a `nn.GRUCell`. The implementation\
    \ is identical to the baseline, with the `LSTMCell` layer replaced as follows:\n\
    ```python\n# In place of the LSTM cell\ngru_cell = nn.GRUCell(features=self.gru_features)\n\
    rnn_state, gru_out = gru_cell(rnn_state, mlp_features)\n```\n\n### 2.3. CNN-SE-LSTM\
    \ & CNN-SE-GRU (ID: 838, 888)\nThese models insert a Squeeze-and-Excitation (SE)\
    \ block after the CNN backbone and before the feature flattening step.\n```python\n\
    # SE Block Definition\nclass SEBlock(nn.Module):\n    channels: int\n    reduction_ratio:\
    \ int = 4\n    @nn.compact\n    def __call__(self, x):\n        squeeze = jnp.mean(x,\
    \ axis=(1, 2))\n        excitation = nn.Dense(features=self.channels // self.reduction_ratio)(squeeze)\n\
    \        excitation = nn.relu(excitation)\n        excitation = nn.Dense(features=self.channels)(excitation)\n\
    \        excitation = nn.sigmoid(excitation)\n        return x * excitation[:,\
    \ None, None, :]\n\n# Integration into the main network class\n# ... after final\
    \ CNN block ...\nfeature_map = nn.relu(x)\nse_map = SEBlock(channels=self.cnn_features_2)(feature_map)\n\
    x = se_map.reshape((batch_size, -1))\n# ... x is then passed to the MLP and recurrent\
    \ cell ...\n```\n\n### 2.4. CNN-Spatial-Attn-LSTM (ID: 829)\nThis model implements\
    \ a spatially-destructive attention mechanism that collapses the feature map before\
    \ the LSTM.\n```python\nclass CNN_Attention_LSTM(nn.Module):\n    # ... CNN backbone\
    \ identical to baseline ...\n    feature_map = nn.relu(x) # (B, H, W, C)\n\n \
    \   # Spatial Attention Mechanism\n    height, width, channels = feature_map.shape[1:]\n\
    \    flattened_features = feature_map.reshape(batch_size, height * width, channels)\n\
    \    attention_logits = nn.Dense(features=1)(flattened_features)\n    attention_weights\
    \ = nn.softmax(attention_logits, axis=1)\n    attended_features = jnp.sum(flattened_features\
    \ * attention_weights, axis=1) # (B, C)\n    \n    # Post-Attention MLP & LSTM\n\
    \    x = nn.Dense(features=256)(attended_features)\n    x = nn.relu(x)\n    #\
    \ ... x is then passed to the LSTM cell ...\n```\n\n## 3. Results\n\nThe performance\
    \ of each model is summarized below, compared against our self-run baseline.\n\
    \n| Model Architecture | Evaluation ID | Mean Solve Rate |\n|--------------------|---------------|-----------------|\n\
    | **CNN-LSTM (Our Baseline)** | 900 | **39.9%** |\n| **CNN-GRU** | 881 | **40.6%**\
    \ |\n| **CNN-SE-GRU** | 888 | **39.7%** |\n| **CNN-SE-LSTM** | 838 | **39.5%**\
    \ |\n| **CNN-Spatial-Attn-LSTM** | 829 | **35.6%** |\n\n## 4. Discussion\n\nThe\
    \ near-equivalence of the GRU and LSTM models (40.6% vs 39.9%) suggests the GRU\
    \ is a more parsimonious and equally effective choice. The failure of the spatial\
    \ attention model underscores the critical principle that architectures must preserve\
    \ spatial information. The competitive performance of the SE models, which modulate\
    \ features without destroying spatial structure, supports this.\n\n## 5. Conclusion\n\
    \nThis study validates the GRU as a parsimonious alternative to the LSTM for this\
    \ task and establishes the principle of spatial information preservation as critical\
    \ for architectural design."
