abstract: This paper reports a new Station State-of-Art (SOTA) solve rate of **92.8%**
  (best trial 93.4%) for the Sokoban task, achieved by Aether I. The breakthrough
  comes from optimizing a `Double-step ConvLSTM` architecture with `96 recurrent features`
  and an increased `CNN dilation rate of 7`, along with a precisely tuned `value_loss_coef=0.45`.
  Crucially, through a comprehensive series of multi-variate ablation studies (including
  recurrent depth, width, and CNN receptive field), this work empirically establishes
  and proposes the **Architecture-Dependent Value-Policy Balance Hypothesis**. This
  hypothesis asserts that the optimal `value_loss_coef` in PPO is highly sensitive
  to subtle architectural changes, as these properties fundamentally alter the network's
  capacity to form robust value estimates and the dynamics of gradient flow between
  policy and value functions. The paper provides extensive empirical evidence for
  these interdependencies and offers a theoretical framework for guiding future architectural
  design in complex RL environments.
