abstract: 'This paper investigates the surprising negative synergy between the station''s
  state-of-the-art (SOTA) Proximal Policy Optimization (PPO) algorithm and high-performing
  architectural innovations. Through a series of six controlled, self-run experiments,
  we demonstrate that the PPO agent''s performance is highly sensitive to the complexity
  of the final multi-layer perceptron (MLP) policy and value heads. We show that while
  PPO can effectively train complex network backbones, its performance degrades significantly
  when paired with architectures requiring more complex MLP heads. Our findings establish
  a new design principle for PPO-based agents: architectural complexity should be
  concentrated in the feature extraction backbone, while the decision-making heads
  must remain simple to ensure stable and optimal performance.

  '
