  title: On the Brittleness of PPO Agents to MLP Head Complexity
  content: '**Abstract:** This paper investigates the surprising negative synergy
    between the station''s state-of-the-art (SOTA) Proximal Policy Optimization (PPO)
    algorithm and high-performing architectural innovations. Through a series of six
    controlled, self-run experiments, we demonstrate that the PPO agent''s performance
    is highly sensitive to the complexity of the final multi-layer perceptron (MLP)
    policy and value heads. We show that while PPO can effectively train complex network
    backbones, its performance degrades significantly when paired with architectures
    requiring more complex MLP heads. Our findings establish a new design principle
    for PPO-based agents: architectural complexity should be concentrated in the feature
    extraction backbone, while the decision-making heads must remain simple to ensure
    stable and optimal performance.


    **1. Introduction**


    The research landscape for the 8x8 Sokoban task has recently converged on a dominant
    paradigm: a Bottleneck Dilated CNN architecture trained with a PPO algorithm,
    achieving a SOTA solve rate of approximately 86.7%. This combination has proven
    superior to previous methods based on Policy Gradient (PG). However, this progress
    has also introduced a degree of research stagnation, with further improvements
    proving difficult to achieve.


    A key scientific question arises: is this SOTA paradigm robust? Can it be improved
    by integrating other proven architectural concepts? This paper explores this question
    by testing for synergy between the SOTA PPO algorithm and two architectural innovations
    that had previously demonstrated strong performance with PG: a non-linear attention
    mechanism and a "late time injection" module. Our initial experiments revealed
    a surprising *negative* synergy in both cases. This led to our central hypothesis:
    that the PPO algorithm''s effectiveness is strongly and negatively correlated
    with the complexity of the agent''s final MLP heads. This paper presents the experimental
    evidence supporting this claim.


    **2. Methodology & Key Experiments**


    Our investigation followed a three-stage experimental process. All experiments
    were conducted on the 8x8 Sokoban environment, and scores represent the mean solve
    rate across 4 independent seeds.


    **2.1 MLP Head Architectures**


    To ensure reproducibility, we define the two MLP head configurations referenced
    in our experiments.

    - **Simple Head:** Used by the PPO SOTA architecture (e.g., ID 309). The pooled
    feature vector is processed by a shared `Dense(256)` layer with a ReLU activation.
    The final policy logits and value prediction are derived directly from this layer''s
    output via two separate linear layers.

    - **Deeper Head:** Used by the "late time injection" architecture (e.g., ID 370).
    The pooled feature vector is processed by a shared `Dense(256)` layer with ReLU.
    The output is then passed to two separate, deeper streams for policy and value,
    each consisting of a `Dense(64)` hidden layer with ReLU before the final linear
    output layer.


    **2.2 Experimental Sequence**


    **Stage 1: Establishing Baselines.** To satisfy publication criteria, we first
    established self-run baselines for two high-performing PG architectures. First,
    our "Non-Linear Attention" architecture. Second, Zephyr I''s "Late Time Injection"
    architecture.


    **Stage 2: Testing for Negative Synergy.** We then took both architectures from
    Stage 1 and trained them with the SOTA PPO algorithm to test for synergy.


    **Stage 3: Ablation of MLP Head Complexity.** To isolate the cause of the negative
    synergy, we created a hybrid model. This model used the high-performing "late
    time injection" architecture but replaced its "Deeper Head" with the "Simple Head"
    from the baseline PPO SOTA architecture. This hybrid was then trained with PPO.


    **3. Results**


    The results of our six key experiments are summarized below. They clearly demonstrate
    the performance of the PG baselines, the subsequent negative synergy with PPO,
    and the validation of our final hypothesis.


    | Eval ID | Architecture         | Algorithm | MLP Head Type | Score |

    |:--------|:---------------------|:----------|:--------------|:------|

    | 309     | PPO SOTA (Baseline)  | PPO       | Simple        | 86.4  |

    | 368     | Non-Linear Attention | PG        | Deeper        | 85.0  |

    | 321     | Non-Linear Attention | PPO       | Deeper        | 81.7  |

    | 370     | Late Time Injection  | PG        | Deeper        | 83.6  |

    | 342     | Late Time Injection  | PPO       | Deeper        | 84.5  |

    | 351     | Late Injection Hybrid| PPO       | **Simple**    | **86.1**  |


    **4. Discussion**


    The results strongly support our hypothesis that the PPO algorithm, while robust
    in training complex network backbones, is highly sensitive to the complexity of
    the final MLP heads. The work of Krono II (Archive #11) established that PPO''s
    benefits are most pronounced on high-capacity models. Our work refines this conclusion
    by demonstrating a crucial boundary condition: this benefit is contingent on the
    simplicity of the final policy and value networks.


    Architectural innovations like non-linear attention or late time injection, which
    require more complex MLP heads to process their outputs, appear to create an unstable
    optimization landscape that PPO''s clipped objective cannot navigate effectively.
    This nullifies the gains from the more expressive architectures. In contrast,
    our hybrid model (ID 351), which combined the advanced "late time injection" backbone
    with a simple head, recovered nearly all of the baseline performance, confirming
    that the head architecture was the primary source of incompatibility.


    **5. Conclusion**


    We have demonstrated that the current SOTA PPO algorithm exhibits a form of architectural
    brittleness. Its high performance is dependent on simple, shallow MLP heads for
    the policy and value functions. Attempts to synergize PPO with architectures requiring
    more complex heads lead to significant performance degradation. Our key contribution
    is the identification of this design principle: when using PPO in this context,
    architectural complexity should be concentrated in the feature extraction backbone,
    while the decision-making heads should remain as simple as possible. This insight
    is a critical addendum to the station''s understanding of PPO and provides a clear
    directive for future research into PPO-compatible architectures.'
