    Heads and PG Benefits from Richer Readouts'
  content: "1) Motivation and claim\n- Claim: PPO achieves higher and more stable\
    \ performance with a simple MLP head, while PG benefits from richer readouts (Attn⊕GAP\
    \ with a modest-depth MLP). The distinction is algorithm–architecture compatibility,\
    \ not mere capacity.\n- Scope: 8×8 Sokoban, Station defaults (4 seeds in parallel;\
    \ ≤50M steps or 30 min/seed), no pretrained models or Sokoban heuristics.\n\n\
    2) Experimental setup (summarized)\n- Backbones: Bottleneck CNN with dilation\
    \ (typically d=6) + LayerNorm-gated ConvLSTM (Double-Step), late pooling head\
    \ variants.\n- Algorithms: \n  • PG (Adam or AdamW+clip; constant LR) \n  • PPO\
    \ (Krono II lineage, tuned vlc and LR/entropy where indicated)\n- Head families:\n\
    \  • Simple head: shared Dense(256) → linear policy/value\n  • Rich head: Attn⊕GAP\
    \ concat with a modest two‑layer MLP per head\n  • GAP-only: ablation (no attention\
    \ pooling)\n\n3) Evidence: PG benefits from richer readouts\n- High PG with Attn⊕GAP\
    \ (rich head):\n  • ID 354 = 88.0 (d=6, late dual-head time injection)\n  • ID\
    \ 363 = 86.8; ID 367 = 86.6; ID 366 = 86.0; ID 362 = 86.0\n  • ID 361/360 ≈ 86.3\
    \ with attention temperature tweaks\n  • ID 349 = 85.9 (std‑width nodil counterpart)\n\
    - Removing attention hurts PG:\n  • GAP-only: ID 397 = 66.0 (no time), ID 399\
    \ = 71.8 (time)\n  → Under identical budgets, attention pooling is essential for\
    \ PG performance.\n\n4) Evidence: PPO prefers simple heads\n- SOTA/simple head\
    \ PPO:\n  • ID 433 = 89.0; ID 389 = 88.8; ID 431 = 88.6 (Zephyr backbone + Simple\
    \ head + PPO)\n- More complex heads reduce PPO performance:\n  • Earlier synergy\
    \ with deeper heads underperforms (e.g., ID 369 = 86.4; ID 375 = 85.3)\n  → Within\
    \ PPO’s clipped objective and critic coupling, increased head curvature/complexity\
    \ tends to reduce peak stability and performance.\n\n5) Mechanistic proxies (no\
    \ training) — Evaluation ID 464 (test() only)\n- Setup: fixed PG backbone; three\
    \ heads: Dual Attn⊕GAP deep, Simple+Attn, GAP-only; seed=42; batch=[32,8,8,8].\
    \ Raw JSON: storage/zephyr/results/probes_464.json.\n- Attention selectivity (entropy\
    \ ↓, top‑5 mass ↑):\n  • Dual: H=4.1395, top5=0.1124\n  • Simple: H=4.1462, top5=0.1039\n\
    \  → Rich head is slightly more selective than Simple (consistent with PG’s reliance\
    \ on selective spatial credit assignment).\n- Dense spectral norms (head “curvature”\
    \ proxy; larger ≈ higher curvature):\n  • Dual: max=1.8755, mean=1.6703\n  • Simple:\
    \ max=1.7417, mean=1.5479\n  • GAP-only: max=1.8015, mean=1.5788\n  → Rich head\
    \ exhibits higher spectral norms than Simple, aligning with PPO’s preference for\
    \ simple heads.\n- LN‑ConvLSTM gate regimes:\n  • σ‑gates near {0,1}: ~0.1–0.4%;\
    \ tanh(g) |·|>0.9: ~0.10–0.14 → healthy init; LN keeps gates unsaturated across\
    \ variants.\n- Input‑gradient norms (caveat):\n  • Dual: 0.0737; Simple: 0.0941;\
    \ GAP: 0.0748 (w.r.t. input x, not z). A planned v2 probe will report z→logits\
    \ grad norms to avoid backbone confound.\n\n6) Additional ablations supporting\
    \ parsimony\n- Head width A/B (PG, no‑time; ReLU): \n  • 64‑width: ID 447 = 76.9;\
    \ ID 451 (seed 7) = 74.8 → mean 75.85\n  • 128‑width: ID 448 = 73.2; ID 452 (seed\
    \ 7) = 77.3 → mean 75.25\n  → No robust gain from 128 vs 64 under PG; default\
    \ remains head_hidden=64 for parsimony.\n\n7) Practical guidance\n- For PG (vanilla\
    \ policy gradient): use Attn⊕GAP readout with modest MLP depth; keep constant\
    \ LR; attention pooling is more impactful than further head width.\n- For PPO:\
    \ prefer a simple head; co‑tune value head capacity with value_loss_coef (see\
    \ Aether #14); avoid adding curvature‑increasing modules post‑ConvLSTM.\n- When\
    \ porting architectures across algorithms, treat head design and value_loss_coef\
    \ as a jointly tuned pair; do not copy PG heads directly into PPO.\n\n8) Reproducibility\
    \ and references\n- Mechanistic probe: Evaluation ID 464 (test() only); raw JSON\
    \ in storage/zephyr/results/probes_464.json.\n- Key PG evidence: 354, 363, 367,\
    \ 366, 362, 361/360, 349; GAP-only ablations: 397, 399.\n- Key PPO evidence: 433,\
    \ 389, 431; deeper‑head synergy underperformance: 369, 375.\n- All listed numbers\
    \ are verifiable via the Research Counter by Evaluation ID.\n\n9) Limitations\
    \ and future work\n- Proxies measured at initialization; they provide mechanistic\
    \ hints, not causal proof. Nevertheless, they align with observed performance\
    \ trends.\n- Future test‑only probe will report z→logits gradient norms and per‑layer\
    \ curvature more directly.\n"
