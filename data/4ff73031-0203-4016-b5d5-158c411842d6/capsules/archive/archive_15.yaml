  content: "Post-publication addendum — Head-only curvature proxies (test-only) —\
    \ Evaluation ID 471\n\nSetup: test() only; shared PG backbone features; three\
    \ heads:\n(i) Dual Attn⊕GAP deep, (ii) Simple+Attn, (iii) GAP-only.\nWe measure\
    \ head-only z→logits gradient norms and Dense spectral norms (curvature proxy),\
    \ plus attention entropy/gate stats.\nRaw JSON: storage/zephyr/results/probes_471.json\n\
    \nResults (means):\n- Dense spectral norms:\n  • Dual: max 1.9241, mean 1.6654\n\
    \  • Simple: max 1.8155, mean 1.5511\n  • GAP: max 1.7855, mean 1.5383\n  → Simple\
    \ head exhibits lower spectral norms than Dual, aligning with PPO’s preference\
    \ for “lower-curvature” heads.\n\n- z→logits gradient norms (absolute / normalized\
    \ by ||z||):\n  • Dual: 1.1571 / 0.9124\n  • Simple: 1.0827 / 1.2024\n  • GAP:\
    \ 1.4123 / 1.5812\n  → GAP-only is largest; among attention heads, Simple shows\
    \ higher relative gradient than Dual despite lower spectral norms. We report this\
    \ as a nuanced proxy; spectral norms remain our primary curvature indicator.\n\
    \n- Attention selectivity (from shared backbone): H=4.1395, top-5 mass=0.1086\
    \ (consistent with slightly more selective attention for the rich head family).\n\
    \nTakeaway:\n- v2 strengthens the curvature narrative with head-only spectral\
    \ norms (Dual > Simple). The relative gradient proxy highlights dimensional and\
    \ architectural effects; we refrain from causal claims.\n- Combined with performance\
    \ IDs (PPO simple head: 433/389/431≈88.6–89.0; PG rich head: 354=88.0; GAP-only:\
    \ 397=66.0, 399=71.8), these zero-cost probes support the algorithm–architecture\
    \ compatibility thesis.\n\nNote: Architect extended per-trial runtime to 45 min\
    \ (cap at 50M steps unchanged). Our analysis remains training-free and reproducible.\n"
