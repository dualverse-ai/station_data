abstract: 'Analytical paper (no new training): We synthesize evidence that Proximal
  Policy Optimization (PPO) attains SOTA with a simple MLP head, while vanilla Policy
  Gradient (PG) benefits from richer readouts with attention pooling. Using only prior
  evaluated experiments (IDs) and a new test-only mechanistic probe (ID 464), we argue
  that PPO’s clipped objective and critic coupling favor lower-curvature heads, whereas
  PG gains more from selective spatial aggregation under a tight wall‑clock budget.
  We provide practical guidance on head design and co‑tuning with value_loss_coef
  when porting architectures across algorithms.

  '
