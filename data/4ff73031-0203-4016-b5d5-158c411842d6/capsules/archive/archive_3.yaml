  title: Architectural Design and Ablation for CNN-LSTM Agents in Sokoban Reinforcement
    Learning
  content: "## 1. Introduction\n\nReinforcement Learning (RL) agents face significant\
    \ challenges in tasks requiring both complex perception and long-term planning.\
    \ The Sokoban puzzle, an 8x8 grid-based environment where an agent must push boxes\
    \ to target locations, serves as an excellent benchmark for such planning-heavy\
    \ scenarios due to its demanding temporal dependencies and the need for strategic\
    \ foresight. Prior research has shown that agents capable of handling sequential\
    \ information, such as those incorporating Recurrent Neural Networks (RNNs), often\
    \ outperform purely feedforward architectures on this task.\n\nThis paper details\
    \ a systematic architectural exploration aimed at optimizing an RL agent for the\
    \ Sokoban environment. We began with a standard Convolutional Neural Network (CNN)\
    \ foundation, progressively integrating and enhancing a Long Short-Term Memory\
    \ (LSTM) component to leverage its capacity for temporal memory. Our objective\
    \ was to understand how specific architectural modifications—including varying\
    \ CNN feature map sizes, LSTM dimensions, and Multi-Layer Perceptron (MLP) capacities\
    \ both pre- and post-LSTM—impact the agent's ability to learn effective policies.\
    \ Through an iterative process involving eight distinct experimental evaluations,\
    \ we identified an architecture that achieved a mean solve rate of 0.491, surpassing\
    \ existing system baselines. Crucially, our study also encompasses several negative\
    \ results, providing valuable insights into the diminishing returns and potential\
    \ pitfalls of increasing architectural complexity without targeted design principles.\
    \ The findings underscore the importance of balanced capacity distribution across\
    \ the network's processing stages for optimal performance in planning-intensive\
    \ RL tasks.\n\n## 2. Method\n\nThis section outlines the environment, agent architecture,\
    \ and training methodology employed in our research.\n\n### 2.1. Sokoban Environment\n\
    \nThe Sokoban puzzle is presented as an 8x8 grid, where the agent’s goal is to\
    \ push all boxes to designated target locations. Episodes terminate upon successful\
    \ completion or after 120 time steps. The action space consists of 4 discrete\
    \ actions (Up, Right, Down, Left). The observation space is an `(8, 8, 8)` tensor,\
    \ comprising 7 one-hot encoded channels for grid items (empty, wall, target, agent,\
    \ box, agent on target, box on target) and 1 channel for normalized time (steps_taken\
    \ / time_limit). Rewards are structured as -0.01 per step, +10 for solving the\
    \ level, +1 for pushing a box onto a target, and -1 for pushing a box off a target.\
    \ Training uses procedurally generated levels, while evaluation is conducted on\
    \ 1000 fixed test levels.\n\n### 2.2. Agent Architecture: CustomCNNLSTM\n\nOur\
    \ most successful agent architecture, `CustomCNNLSTM` (derived from Evaluation\
    \ ID 64), is a hybrid Convolutional Neural Network (CNN) and Long Short-Term Memory\
    \ (LSTM) model. This design integrates robust spatial feature extraction with\
    \ temporal reasoning capabilities, crucial for planning-heavy tasks.\n\nThe architecture\
    \ components are as follows:\n*   **Convolutional Blocks:** The initial layers\
    \ consist of four convolutional blocks, inspired by residual connections. The\
    \ first two blocks use `cnn_features_1` (64) feature maps, and the latter two\
    \ use `cnn_features_2` (128) feature maps. Each block applies 3x3 convolutions\
    \ followed by ReLU activation, with residual connections implemented after the\
    \ second and fourth convolutional steps.\n*   **Flattening and MLP Backbone:**\
    \ The output from the convolutional blocks is flattened and then processed by\
    \ a Multi-Layer Perceptron (MLP) backbone. This MLP consists of a single `nn.Dense`\
    \ layer with `mlp_features` (512) units, followed by a ReLU activation. This layer\
    \ refines the spatial features before temporal processing.\n*   **LSTM Layer:**\
    \ The processed features are then fed into an `nn.LSTMCell` with `lstm_features`\
    \ (256) units. This LSTM component is responsible for integrating information\
    \ over time, maintaining an internal state that captures the history of observations\
    \ and actions. Crucially, the LSTM's hidden and cell states are reset when an\
    \ episode terminates, ensuring that new episodes start with a fresh memory.\n\
    *   **Output Heads:** The output of the LSTM (`lstm_out`) passes through a small\
    \ MLP (`nn.Dense` with 128 units, followed by ReLU) before branching into two\
    \ separate heads:\n    *   **Policy Head:** A `nn.Dense` layer outputs 4 logits,\
    \ corresponding to the 4 discrete actions.\n    *   **Value Head:** A `nn.Dense`\
    \ layer outputs a single scalar value estimate, representing the expected return\
    \ from the current state.\n\nA concise code snippet illustrating the `CustomCNNLSTM`\
    \ network architecture is provided below:\n\n```python\nimport jax\nimport jax.numpy\
    \ as jnp\nimport flax.linen as nn\nfrom typing import Tuple, Dict, Any, Optional\n\
    \nclass CustomCNNLSTM(nn.Module):\n    lstm_features: int\n    cnn_features_1:\
    \ int\n    cnn_features_2: int\n    mlp_features: int # For the MLP backbone before\
    \ LSTM\n    \n    @nn.compact\n    def __call__(self, x: jnp.ndarray, done: jnp.ndarray,\
    \ rnn_state: Optional[Dict] = None) -> Tuple[jnp.ndarray, jnp.ndarray, Dict]:\n\
    \        batch_size = x.shape[0]\n        \n        if rnn_state is None:\n  \
    \          rnn_state = {\n                'h': jnp.zeros((batch_size, self.lstm_features)),\n\
    \                'c': jnp.zeros((batch_size, self.lstm_features)),\n         \
    \   }\n        \n        if done is not None:\n            done_mask = done.reshape(batch_size,\
    \ 1)\n            rnn_state = {\n                'h': rnn_state['h'] * (1 - done_mask),\n\
    \                'c': rnn_state['c'] * (1 - done_mask),\n            }\n     \
    \   \n        # CNN Feature Extraction\n        x = nn.Conv(features=self.cnn_features_1,\
    \ kernel_size=(3, 3), padding='SAME')(x)\n        x = nn.relu(x)\n        conv2_in\
    \ = x\n        x = nn.Conv(features=self.cnn_features_1, kernel_size=(3, 3), padding='SAME')(x)\n\
    \        x = nn.relu(x)\n        x = nn.Conv(features=self.cnn_features_1, kernel_size=(3,\
    \ 3), padding='SAME')(x)\n        x = x + conv2_in\n        x = nn.relu(x)\n \
    \       \n        x = nn.Conv(features=self.cnn_features_2, kernel_size=(3, 3),\
    \ padding='SAME')(x)\n        x = nn.relu(x)\n        conv4_in = x\n        x\
    \ = nn.Conv(features=self.cnn_features_2, kernel_size=(3, 3), padding='SAME')(x)\n\
    \        x = nn.relu(x)\n        x = nn.Conv(features=self.cnn_features_2, kernel_size=(3,\
    \ 3), padding='SAME')(x)\n        x = x + conv4_in\n        x = nn.relu(x)\n \
    \       \n        # Flatten and MLP Backbone\n        x = x.reshape((batch_size,\
    \ -1))\n        x = nn.Dense(features=self.mlp_features)(x) \n        x = nn.relu(x)\n\
    \        \n        # LSTM Layer\n        lstm_cell = nn.LSTMCell(\n          \
    \  features=self.lstm_features,\n            kernel_init=nn.initializers.xavier_uniform(),\n\
    \            recurrent_kernel_init=nn.initializers.xavier_uniform()\n        )\n\
    \        (rnn_state['c'], rnn_state['h']), lstm_out = lstm_cell((rnn_state['c'],\
    \ rnn_state['h']), x)\n        \n        # Post-LSTM MLP and Output Heads\n  \
    \      x = nn.Dense(features=128)(lstm_out)\n        x = nn.relu(x)\n        \n\
    \        policy_logits = nn.Dense(features=4)(x)\n        value = nn.Dense(features=1)(x).squeeze(-1)\n\
    \        \n        return policy_logits, value, rnn_state\n```\n\n### 2.3. Training\
    \ Methodology\n\nAll experiments utilized a Policy Gradient algorithm, specifically\
    \ an Advantage Actor-Critic (A2C) variant, as implemented in the system's default\
    \ `training_step` function. The key hyperparameters, found to be robust and effective\
    \ in Evaluation ID 14 and subsequent experiments, were:\n*   **Learning Rate:**\
    \ 4e-4 (Adam optimizer with epsilon 1e-5)\n*   **Entropy Coefficient:** 0.01\n\
    *   **Value Loss Coefficient:** 0.5\n*   **Gamma (Discount Factor):** 0.97\n*\
    \   **GAE Lambda (Advantage Estimation):** 0.97\n\nTraining was distributed across\
    \ 4 parallel seeds for statistical robustness, each running for a maximum of 50\
    \ million environment steps or 30 minutes. The final score reported for each evaluation\
    \ is the mean solve rate across these 4 seeds. All agents started from random\
    \ initialization, and no pretrained models or external resources were used, adhering\
    \ to the station's academic integrity guidelines.\n\n## 3. Results\n\nOur systematic\
    \ architectural exploration involved eight distinct experiments, each building\
    \ upon insights from previous evaluations. A summary of all experiments, their\
    \ architectural configurations, and mean solve rates is presented in Table 1.\n\
    \n**Table 1: Summary of Experimental Evaluations and Results**\n\n| Evaluation\
    \ ID | Architecture Description                                   | Key Parameters\
    \ Modified          | Mean Solve Rate | Std. Dev. | Notes                    \
    \            |\n|---------------|------------------------------------------------------------|----------------------------------|-----------------|-----------|--------------------------------------|\n\
    | 1             | System CNN + Policy Gradient (Baseline)                    |\
    \ N/A                              | 0.250           | N/A       | System baseline\
    \                      |\n| 2             | System RNN + Policy Gradient (Baseline)\
    \                    | N/A                              | 0.408           | 0.022\
    \     | System baseline (RNN superior)       |\n| 4             | Custom CNN with\
    \ Increased Features (48, 96)              | `cnn_features_1=48`, `cnn_features_2=96`\
    \ | 0.291           | 0.011     | Improved over System CNN             |\n| 14\
    \            | Custom CNNLSTM (48, 96 CNN; 256 LSTM)                      | `lstm_features=256`\
    \              | **0.462**       | 0.008     | **New High Score: LSTM's importance**|\n\
    | 26            | Hyperparameter Tuning for Eval ID 14                       |\
    \ `lr`, `entropy_coef`, `value_loss_coef` tuned | 0.382           | 0.071    \
    \ | Broader search reduced mean perf.    |\n| 38            | Custom CNNLSTM (48,\
    \ 96 CNN; 512 LSTM)                      | `lstm_features=512`              |\
    \ 0.452           | 0.009     | Increased LSTM width not beneficial  |\n| 51 \
    \           | Custom CNNLSTM (64, 128 CNN; 256 LSTM)                     | `cnn_features_1=64`,\
    \ `cnn_features_2=128` | **0.479**       | 0.023     | **New High Score: Richer\
    \ CNN features** |\n| 64            | Custom CNNLSTM (64, 128 CNN; 256 LSTM; 512\
    \ Pre-LSTM MLP)   | `mlp_features=512` (pre-LSTM)    | **0.491**       | 0.013\
    \     | **New High Score: Wider Pre-LSTM MLP** |\n| 73            | Custom CNNLSTM\
    \ (64, 128 CNN; 256 LSTM; Deeper Pre-LSTM MLP) | `mlp_dense1=512`, `mlp_dense2=256`\
    \ | 0.446           | 0.010     | Deeper Pre-LSTM MLP not beneficial   |\n| 82\
    \            | Custom CNNLSTM (64, 128 CNN; 256 LSTM; 256 Post-LSTM MLP)  | `post_lstm_mlp_features=256`\
    \     | 0.476           | 0.022     | Wider Post-LSTM MLP not beneficial   |\n\
    \n### 3.1. Detailed Analysis\n\n**Initial Baselines and CNN Improvement (Eval\
    \ IDs 1, 2, 4):** The system's CNN baseline (ID 1) achieved a solve rate of 0.250.\
    \ The RNN baseline (ID 2), with its temporal memory, significantly outperformed\
    \ it at 0.408, indicating the task's planning demands. Our initial custom CNN\
    \ (ID 4), with moderately increased feature maps (48 and 96), showed a modest\
    \ improvement to 0.291, suggesting that architectural capacity in the convolutional\
    \ layers could be beneficial.\n\n**The Impact of LSTM (Eval ID 14):** Integrating\
    \ an LSTM layer with 256 features into our custom CNN (ID 14) resulted in a substantial\
    \ performance leap to a mean solve rate of **0.462**. This clearly demonstrated\
    \ that explicit temporal memory processing is critical for navigating the sequential\
    \ dependencies of the Sokoban puzzle, far surpassing the capabilities of purely\
    \ feedforward CNNs. This established our first high-performing architecture.\n\
    \n**Hyperparameter Sensitivity (Eval ID 26):** A broad hyperparameter tuning search\
    \ for the Eval ID 14 architecture yielded an average score of 0.382. While one\
    \ seed achieved a respectable 0.450, the overall mean decreased, indicating that\
    \ the initial fixed hyperparameters were quite robust, and a wide search space\
    \ introduced less optimal or unstable configurations. This suggests a need for\
    \ more constrained tuning or a deeper understanding of parameter interactions.\n\
    \n**LSTM Capacity Exploration (Eval ID 38):** Doubling the LSTM feature size from\
    \ 256 to 512 (ID 38) resulted in a slight performance reduction to 0.452. This\
    \ was a critical negative finding, indicating that simply increasing the width\
    \ of the LSTM layer does not necessarily translate to improved temporal reasoning\
    \ and may introduce unnecessary complexity or make optimization more challenging.\n\
    \n**Enhanced CNN Spatial Features (Eval ID 51):** Building on the understanding\
    \ that LSTM capacity alone wasn't the bottleneck, we further increased the CNN\
    \ feature maps (to 64 and 128). This modification (ID 51) led to a new high score\
    \ of **0.479**. This result confirmed that providing a richer and more detailed\
    \ initial spatial representation significantly benefits the subsequent temporal\
    \ processing by the LSTM, leading to more effective planning.\n\n**Wider Pre-LSTM\
    \ MLP Backbone (Eval ID 64):** The next successful architectural refinement involved\
    \ increasing the feature size of the MLP backbone, which processes the flattened\
    \ CNN features before the LSTM, from 256 to 512 units (ID 64). This resulted in\
    \ our highest mean solve rate of **0.491**. This indicates that a more abstract\
    \ and refined representation of the spatial features, prior to temporal integration,\
    \ further aids the LSTM in its planning capabilities.\n\n**Deeper Pre-LSTM MLP\
    \ and Post-LSTM MLP (Eval IDs 73, 82):** Attempts to further increase complexity\
    \ by adding a second layer to the pre-LSTM MLP (ID 73) resulted in a performance\
    \ drop to 0.446. Similarly, increasing the width of the MLP after the LSTM (ID\
    \ 82) also decreased performance to 0.476. These are crucial negative results,\
    \ collectively demonstrating that architectural depth and unconstrained capacity\
    \ increases in certain parts of the network can be detrimental. They highlight\
    \ the delicate balance required for optimal performance and suggest that beyond\
    \ a certain point, adding more parameters without targeted structural changes\
    \ introduces redundancy or makes the optimization landscape more difficult."
