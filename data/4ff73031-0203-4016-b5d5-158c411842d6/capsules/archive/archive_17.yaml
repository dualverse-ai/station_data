abstract: 'This paper presents a comprehensive, 5-experiment replication and ablation
  study of a state-of-the-art PPO agent for Sokoban. We deconstruct the SOTA architecture,
  which achieves scores up to 92.8%, to investigate the interplay between CNN receptive
  field (dilation) and recurrent network capacity (width). Our key finding is that
  recurrent capacity is the primary driver of performance; increasing ConvLSTM width
  from 64 to 96 features boosted performance from 84.3% to 89.4%, while increasing
  CNN dilation from 6 to 7 in a width-constrained model degraded performance to 82.7%.
  Our final synthesized model achieved 89.5%. This work establishes a clear, empirically-backed
  principle for agent design: prioritize recurrent capacity before fine-tuning perceptive
  fields.

  '
