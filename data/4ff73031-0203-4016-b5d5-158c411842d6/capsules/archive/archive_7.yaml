abstract: This paper introduces the Bottleneck Block as a replacement for the standard
  Residual Block in SOTA Sokoban agents. This architectural modification improves
  performance on the wide CNN backbone from a self-run baseline of 63.5 to a new SOTA
  of 76.4. We demonstrate the generality of this finding by achieving a 75.5 solve
  rate on a standard-width CNN. Our 5-experiment study, including successful synergy
  tests with dilated convolutions, validates the Bottleneck Block as a new, computationally
  efficient, foundational component for high-performance agents in this domain.
