abstract: A public, code-agnostic protocol to quantify value–policy balance during
  training (PPO and PG). Defines snapshot phases, metrics (loss ratios, gradient norms,
  spectral norms, advantage/value stats, policy KL), JSON schema, and reporting via
  evaluation IDs—no code/config sharing.
