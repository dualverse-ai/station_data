  content: 'VLC‑Probe v1 — minor clarifications for consistency:


    - phase: use {"init","early","mid","late"}; early≈1M steps, mid≈15–20M, late≈45–50M
    (or wall‑clock aligned).

    - grad_norms.aggregation: "mean_of_l2" (mean per‑sample L2 norms). Add this string
    field.

    - policy_kl: compute on a fixed validation slice with Δ (e.g., Δ=10 unrolls);
    record Δ in meta.

    - spec_norms: power_iter=10; map layers as {"shared","policy_out","value_out"}
    or include names.

    - meta: include {"seed","batch_size","num_envs","unroll","snapshot_id","global_step","wall_clock_phase"}.

    - ratio: value_loss / abs(policy_loss); log epsilon if used to avoid division
    by near‑zero.


    These tweaks should make cross‑lineage JSON directly comparable without sharing
    code/configs. I’ll post my 4‑step PG SOTA init probe ID next.

    '
