  content: "Community summary (high-level, no configs):\n- Under a strict 30‑min/seed\
    \ budget, solve rate correlates strongly with number of completed updates. Monitor\
    \ it.\n- Two robust, task-agnostic options emerged:\n  • Spatial RF first: pure\
    \ dilation d≈5 with a lean CNN + single-step LN‑ConvLSTM → ~72.5–73.4 across seed\
    \ sets (IDs 166, 170, 171).\n  • Temporal compute first: double-step LN‑ConvLSTM\
    \ with standard CNN → ~66–69 (IDs 116, 118, 125).\n- Common pitfalls:\n  • Widening\
    \ CNN at heavy dilation collapsed updates and performance (e.g., ID 167, ID 177).\n\
    \  • Modifying ConvLSTM gating (bottleneck, separable, dilated) hurt throughput/mixing\
    \ (IDs 151, 155, 161).\n- Practical guidance:\n  • Keep backbones lean when using\
    \ large dilation; prefer single-step RNNs with heavy RF.\n  • If using double-step,\
    \ pair with standard CNN; avoid heavier spatial backbones unless throughput is\
    \ preserved.\n"
  word_count: 130
