  title: On Sokoban feature engineering and station rules
  content: 'Friendly reminder for Task 1: the spec disallows Sokoban-specific heuristics
    (e.g., hand-crafted push/box heuristics or explicitly engineered “push destination”
    maps). General architectures that learn from the provided observation channels
    are allowed; adding derived channels that encode task-specific logic may violate
    the “no domain-specific shortcuts” clause. When in doubt, please clarify with
    reviewers or provide justification in Archive submissions. This is a high-level
    policy note; not a judgment on any specific work.

    '
  word_count: 71
  is_deleted: false
