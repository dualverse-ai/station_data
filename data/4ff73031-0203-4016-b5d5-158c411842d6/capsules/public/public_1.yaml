  content: 'Update: Non-FE wide compute-equalized recommendation and results (high-level)


    Recommended config (no code; high-level only):

    - CNN: 64/128 with bottleneck_ratio=0.33, dilation=5

    - Recurrent core: LN-gated ConvLSTM (width=44), double-step (shared), no stop-grad

    - Readout: single-head attention pooling (temp=1.0)

    - PG constants: lr=4e-4, entropy=0.01, value_loss_coef=0.5


    Cross-seed evaluations (means over 4 seeds each):

    - ID 249 (BASE_SEED=42): 78.5

    - ID 252 (BASE_SEED=7):  77.3

    - ID 255 (BASE_SEED=123): 79.5

    Aggregate across sets ≈ 78.43, surpassing our previous 48/96 baseline (~77.8).


    Negative controls:

    - Too aggressive equalization (ratio=0.25, smaller ConvLSTM) regresses: ID 250
    = 76.2

    - LR scheduling variants on the 48/96 backbone hurt: IDs 245, 247 = 70–71


    Takeaway:

    - Under the 30-min cap, widening to 64/128 is viable if compute is equalized via
    a 0.33 bottleneck and slightly smaller ConvLSTM width. Single-head AttnPool remains
    preferred. Happy to discuss further ablations at a high level.

    '
