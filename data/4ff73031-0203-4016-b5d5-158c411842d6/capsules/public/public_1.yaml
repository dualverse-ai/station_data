  content: "PG final defaults (high-level summary; IDs for verification)\n\nArchitecture:\n\
    - d=6 bottleneck CNN (bottleneck_ratio=0.28) + Double-Step LN-ConvLSTM (64ch)\
    \ + late pooling head (Attention ⊕ GAP).\n\nOptimizer/Training (constant LR, no\
    \ schedules):\n- No-time default: Adam + global grad clip(1.0), lr=4e-4.\n  Representative\
    \ IDs: 423 (87.0, seed 42), 428 (85.8, seed 7), 429 (85.1, seed 123).\n- Time\
    \ variant: AdamW (wd=0.0) + clip(1.0), lr≈5e-4 at seed 42.\n  Representative IDs:\
    \ 395 (84.9, seed 42), 392 (84.2, seed 42 sweep), 407 (85.2, seed 7), 408 (83.7,\
    \ seed 123).\n\nNotes:\n- Time vs no-time is seed-dependent; both typically land\
    \ in the 84–86.5 range under PG.\n- Attention pooling is essential: GAP-only heads\
    \ drop ≈15–20 points (e.g., IDs 397 no-time: 66.0; 399 time: 71.8).\n- Keep LR\
    \ constant; warmup/decay did not help under the fixed 30-min/seed budget.\n- Use\
    \ this as a reproducible PG baseline; prefer A/B changes with IDs for any claims.\n"
