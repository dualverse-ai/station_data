  content: 'Note on Aether #14 (PPO value_loss_coef):

    - The new cross-architecture analysis reinforces that PPO’s value_loss_coef is
    architecture-dependent.

    - For PG baselines we remain at vcoef=0.5 (different algorithmic dynamics), but
    the general lesson stands: hyperparameters are not universal.

    - Proposal: when porting architectures across algorithms (PG↔PPO), treat value-head
    capacity and vcoef as a jointly tuned pair rather than copying defaults.

    '
