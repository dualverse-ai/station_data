  yaml_data:
    content: "import sys\nsys.path.append('storage/noema/models')\nfrom dsconv_pm_dil_attn\
      \ import create_network as base_create_network\nimport optax\n\nBASE_SEED =\
      \ 42\nBATCH_SIZE = 64\n\ndef _define_hyperparameters():\n    # Base defaults;\
      \ dataset-specific tweaks applied in create_network\n    return {\n        \"\
      learning_rate\": 1e-3,\n        \"hidden_dim\": 224,\n        \"kernel_size\"\
      : 9,\n        \"dropout_rate\": 0.10,\n        \"pos_dropout_rate\": 0.07,\n\
      \        \"head_hidden\": 128,\n        \"powermean_init\": 2.0,\n        \"\
      residual_scale\": 0.5,\n        \"attn_hidden\": 224,\n        \"ds_dilations\"\
      : [1, 2, 4, 8, 16, 16],\n        \"enable_reverse_aug\": True,\n        \"eval_bireverse\"\
      : True,\n    }\n\ndef create_network(hparams):\n    # Dataset-aware reverse\
      \ and regularization schedule\n    h = dict(hparams)\n    ds = h.get(\"dataset\"\
      )\n\n    # Reverse toggles\n    if ds == \"CRI-Off\":\n        h[\"enable_reverse_aug\"\
      ] = False\n        h[\"eval_bireverse\"] = False\n    else:\n        h[\"enable_reverse_aug\"\
      ] = True\n        h[\"eval_bireverse\"] = True\n\n    # Regularization schedule\n\
      \    if ds in (\"Modif\", \"ncRNA\"):          # classification tasks\n    \
      \    h[\"dropout_rate\"] = 0.12\n        h[\"pos_dropout_rate\"] = 0.08\n  \
      \      h[\"attn_hidden\"] = h.get(\"attn_hidden\", 224)\n    else:         \
      \                         # regression tasks (APA, CRI-Off, CRI-On, PRS, MRL)\n\
      \        h[\"dropout_rate\"] = 0.08\n        h[\"pos_dropout_rate\"] = 0.05\n\
      \        h[\"attn_hidden\"] = h.get(\"attn_hidden\", 224)  # unused for regression\n\
      \n    h[\"num_blocks\"] = len(h.get(\"ds_dilations\", [1]))\n    return base_create_network(h)\n\
      \ndef create_optimizer(learning_rate: float = 1e-3):\n    # Stronger regularization\
      \ & momentum to stabilize regression (APA/MRL/PRS)\n    return optax.chain(\n\
      \        optax.clip_by_global_norm(0.75),\n        optax.adamw(learning_rate=learning_rate,\
      \ b1=0.9, b2=0.999, weight_decay=0.012)\n    )\n\ndef complete(params, opt_state,\
      \ trial_data):\n    ds = trial_data.get(\"dataset\")\n    val = trial_data.get(\"\
      val_metric\")\n    seed = trial_data.get(\"seed\")\n    print(f\"[Complete]\
      \ v7b-da-do {ds} val_metric={val} seed={seed}\")\n"
  yaml_error: null
