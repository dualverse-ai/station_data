- command: storage
  args: write noema/analysis/mixer_feature_stats.py
  yaml_data:
    content: "\"\"\"\nMixer Feature Stats Utilities (Noema Lineage)\n\nGoal:\n  Provide\
      \ reusable functions to quantify how a pre-pool channel mixer\n  alters the\
      \ statistics of sequence features that feed global pooling.\n  Intended to test\
      \ the hypothesis: the mixer disrupts max-sensitive\n  feature distributions\
      \ (e.g., sparsity, extreme values), harming ncRNA.\n\nUsage notes:\n  - Call\
      \ compute_channel_stats() on the sequence features just before pooling.\n  -\
      \ For pre/post comparison, capture both tensors (h_pre, h_post) and call compare_pre_post().\n\
      \  - Tensors are expected as numpy-like arrays (JAX DeviceArray or ndarray).\n\
      \    Shape: (B, L, C) with B=batch, L=length, C=channels.\n\n  Example pseudo-code\
      \ inside a submission's optional test():\n      import jax, jax.numpy as jnp\n\
      \      from analysis.mixer_feature_stats import compute_channel_stats, compare_pre_post\n\
      \n      B, L, C = 8, 200, 256\n      h_pre  = jax.random.normal(jax.random.PRNGKey(0),\
      \ (B, L, C))\n      # emulate mixer: small residual reweighting\n      delta\
      \  = jax.random.normal(jax.random.PRNGKey(1), (B, L, C)) * 0.05\n      h_post\
      \ = h_pre + delta\n\n      pre_stats  = compute_channel_stats(h_pre, topk=5)\n\
      \      post_stats = compute_channel_stats(h_post, topk=5)\n      report = compare_pre_post(pre_stats,\
      \ post_stats)\n      print(report)\n\n\"\"\"\nimport jax.numpy as jnp\n\ndef\
      \ _safe_mean(x, axis=None):\n    return jnp.mean(x, axis=axis)\n\ndef _safe_std(x,\
      \ axis=None):\n    return jnp.std(x, axis=axis)\n\ndef _gini_coefficient(x,\
      \ axis=-1, eps=1e-12):\n    \"\"\"\n    Gini over nonnegative values along axis.\n\
      \    We compute |x_i - x_j| pairwise approximation using Lorenz curve proxy:\n\
      \    Gini = 1 - 2 * sum_{i} (cum_sum_i / total) / n + 1/n\n    Expect input\
      \ x >= 0; we soft-rectify before usage.\n    \"\"\"\n    x = jnp.maximum(x,\
      \ 0.0)\n    n = x.shape[axis]\n    x_sorted = jnp.sort(x, axis=axis)\n    cumsum\
      \ = jnp.cumsum(x_sorted, axis=axis)\n    total = jnp.sum(x_sorted, axis=axis,\
      \ keepdims=True) + eps\n    lorenz = cumsum / total  # monotone [0,1]\n    #\
      \ Integral of Lorenz curve approximated by discrete sum / n\n    lorenz_integral\
      \ = jnp.sum(lorenz, axis=axis) / n\n    gini = 1.0 - 2.0 * lorenz_integral +\
      \ 1.0 / n\n    return gini\n\ndef compute_channel_stats(h, topk=5, eps=1e-12):\n\
      \    \"\"\"\n    Compute per-batch, per-channel statistics of sequence features\
      \ (B,L,C).\n    Returns a dict of tensors aggregated over batch (averaged across\
      \ B).\n    \"\"\"\n    B, L, C = h.shape\n    # Lengthwise summary\n    mean_len\
      \ = _safe_mean(h, axis=1)            # (B,C)\n    max_len  = jnp.max(h, axis=1)\
      \               # (B,C)\n    abs_max  = jnp.max(jnp.abs(h), axis=1)      # (B,C)\n\
      \n    # Nonneg proxy for sparsity stats (ReLUed)\n    h_pos = jnp.maximum(h,\
      \ 0.0)\n    # top-k mass ratio: fraction of sum carried by top-k length positions\n\
      \    # Shape (B,C,k)\n    topk_vals = jnp.sort(h_pos, axis=1)[:, ::-1, :][:,\
      \ :topk, :]\n    sum_all   = jnp.sum(h_pos, axis=1) + eps      # (B,C)\n   \
      \ topk_sum  = jnp.sum(topk_vals, axis=1)        # (B,C)\n    topk_ratio = topk_sum\
      \ / sum_all               # (B,C)\n\n    # Gini over length for each channel\
      \ (higher → more concentrated mass)\n    gini_len = _gini_coefficient(h_pos,\
      \ axis=1)\n\n    # Aggregate over batch (mean across B) to obtain robust channel\
      \ metrics\n    def batch_mean(x): return _safe_mean(x, axis=0)  # (C,) for per-channel\
      \ vectors\n\n    stats = {\n        \"mean_len\": batch_mean(mean_len),    \
      \  # (C,)\n        \"max_len\": batch_mean(max_len),        # (C,)\n       \
      \ \"abs_max\": batch_mean(abs_max),        # (C,)\n        \"topk_ratio\": batch_mean(topk_ratio),\
      \  # (C,)\n        \"gini_len\": batch_mean(gini_len),      # (C,)\n       \
      \ # global summaries as scalars\n        \"mean_len_mean\": float(_safe_mean(mean_len)),\n\
      \        \"max_len_mean\": float(_safe_mean(max_len)),\n        \"abs_max_mean\"\
      : float(_safe_mean(abs_max)),\n        \"topk_ratio_mean\": float(_safe_mean(topk_ratio)),\n\
      \        \"gini_len_mean\": float(_safe_mean(gini_len)),\n    }\n    return\
      \ stats\n\ndef compare_pre_post(pre, post, keys=(\"max_len_mean\",\"abs_max_mean\"\
      ,\"topk_ratio_mean\",\"gini_len_mean\",\"mean_len_mean\")):\n    \"\"\"\n  \
      \  Compare scalar summaries between pre and post dictionaries.\n    Returns\
      \ a human-readable string and a diff dict.\n    \"\"\"\n    diffs = {}\n   \
      \ lines = [\"== Pre vs Post mixer scalar diffs ==\"]\n    for k in keys:\n \
      \       v_pre = float(pre.get(k, float(\"nan\")))\n        v_post = float(post.get(k,\
      \ float(\"nan\")))\n        diff = v_post - v_pre\n        diffs[k] = diff\n\
      \        lines.append(f\"{k}: post - pre = {diff:+.6f} (pre={v_pre:.6f}, post={v_post:.6f})\"\
      )\n    return \"\\n\".join(lines), diffs\n"
  yaml_error: null
  location: Research Counter
- command: storage
  args: write noema/results/mixer_analysis_plan.md
  yaml_data:
    content: 'Mixer Analysis Plan (Tick 292)

      Objective: Test whether the pre-pool mixer reduces sparsity/extremal structure
      used by max pooling, correlating with ncRNA drops.


      Metrics (compute per (dataset, seed), pre vs post mixer):

      - max_len_mean, abs_max_mean: average extremal magnitude

      - topk_ratio_mean (k=5): fraction of positive mass in top-k positions (concentration)

      - gini_len_mean: lengthwise concentration of positive activations (sparsity
      proxy)

      - mean_len_mean: baseline mean shift


      Protocol:

      - Hook DSConv output h_pre and h_post (just before pooling) in both baseline
      (no mixer) and mixer runs.

      - Use analysis/mixer_feature_stats.py to compute stats and compare.

      - Correlate per-dataset deltas with validation metric changes, focusing on ncRNA
      and CRI-On.


      Expected outcome:

      - Mixer reduces topk_ratio_mean and/or gini_len_mean for ncRNA, aligning with
      accuracy drops.

      - CRI-On may see mixed effects (some seeds increase, others decrease).

      '
  yaml_error: null
  location: Research Counter
