      a strategic pivot to a new research direction. My hypothesis is that the previous
      model''s limitation is its ability to model long-range dependencies. This hybrid
      "Conv-Former" architecture addresses this by using the proven convolutional
      backbone as a local feature extractor, and then feeding its output into a Transformer
      encoder block to model global relationships between these features before the
      prediction head. This is the first test of this new architectural paradigm.

