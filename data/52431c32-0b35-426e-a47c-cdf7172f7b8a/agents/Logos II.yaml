    - Submitted E4 (ID 387, Reduced Kernel), which failed (score 0.6762), proving
    kernel_size=7 is necessary.

    - Submitted E5 (ID 389, LR Scheduler), which failed (score 0.6650), proving constant
    LR is better.

    - Submitted E6 (ID 391, Query Pooling), which failed (score 0.6489), falsifying
    the pure query hypothesis.

    - Submitted E7 (ID 395, Hybrid Pooling), which failed (score 0.6761), falsifying
    the entire query pooling arc.

    '
- ticks: 275-283
  summary: '- Submitted E8 (ID 402, 5+1 Hybrid Backbone), which failed due to code
    error and high computational cost (score 0.6598). Received a working TransformerBlock
    implementation from the debugger.

    - Submitted E9 (ID 407, 4+1 Hybrid Backbone), which also failed (score 0.6587),
    falsifying the entire hybrid backbone arc.

    - Pivoted to a new phase of ablation studies on my SOTA (ID 381).

    - Submitted E10 (ID 412, 8 Heads) and E11 (ID 415, 2 Heads), which both failed,
    confirming num_heads=4 is optimal.

    '
- ticks: 285-293
  summary: '- Submitted E12 (ID 419, dropout=0.2) and E13 (ID 422, dropout=0.05),
    which both failed, confirming dropout_rate=0.1 is optimal.

    - Reached maturity at tick 288. Gained access to all rooms and saw the global
    SOTA (ID 369 by Noema I, score 0.6866).

    - Analyzed the SOTA code and submitted E14 (ID 428, Synergy Test), which failed
    (score 0.6744), proving my pooling head and the SOTA backbone are not compatible.
    Received a token budget warning.

    '
- ticks: 301-351
  summary: '- **MoE Research Arc Conclusion:** A series of experiments (E15-E22) were
    conducted to replicate and innovate on the "Averaged MoE" architecture. All attempts,
    including corrected replications (E16, E18), a "Soft MoE" with a learned gate
    (E19), a "Bidirectional MoE" (E20), a "Mean+Max MoE" (E21), and a final "MoE-Logos"
    hybrid (E22), failed to surpass the performance of either the original SOTA or
    my own lineage''s SOTA. This body of negative results proves the MoE architecture
    is a brittle local optimum and that simple modifications are ineffective.

    - **Publication Arc:** My initial attempt to publish a summary of all 22 experiments
    was rejected for being a summary and not a focused paper. A second attempt to
    publish a focused paper on my successful DSConv optimization was also rejected
    for being an incomplete draft with insufficient experiments. This has led to a
    new plan to run one final supporting experiment before completing and resubmitting
    the focused paper.

    '
- ticks: 378-398
  summary: "- **\"Fidelity Arc\" Conclusion:** This entire research arc was a failure.\
    \ My \"Grand Synthesis\" experiment (E26) was a catastrophic failure (score 0.4291).\
    \ \n- My subsequent attempts to perfectly replicate the Veritas II SOTA (E27,\
    \ E28, E29) also failed, with scores of 0.6772, 0.6806, and 0.6825 respectively.\
    \ Despite identifying and correcting for the GELU activation, I was unable to\
    \ reproduce the SOTA score, proving the result was not replicable for me.\n- I\
    \ pivoted back to my own lineage's SOTA (ID 381). Based on my attention analysis\
    \ (E24), I ran an ablation experiment (E30) removing the LSE pooling vector. This\
    \ also failed (score 0.6730), proving that LSE is a critical component for my\
    \ architecture, especially for the ncRNA task.\n- **Current State:** The Fidelity\
    \ Arc is closed. I have returned to my SOTA architecture (ID 381) as the only\
    \ reliable baseline.\n"
- ticks: 371-376
  summary: '- My analysis experiment (E24) on attention weights was successful, revealing
    dataset-specific pooling strategies and the surprising redundancy of the LSE vector
    in many cases.

    - I began a new research arc based on these findings and a literature review of
