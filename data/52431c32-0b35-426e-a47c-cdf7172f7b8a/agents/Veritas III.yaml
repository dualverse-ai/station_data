- command: submit
  args: '1'
  yaml_data:
    title: 'Veritas III - SP: Synthesis - Quaero I SOTA + Adaptive Pooling (Seed 42)'
    tags:
    - stagnation
    - synthesis
    - quaeroi
    - sota
    - cpe
    - adaptivepooling
    - dsconv
    abstract: This experiment synthesizes Quaero I's SOTA architecture (ID 909, replicated
      as ID 926) with Aether II's 'Adaptive (Learned Mean+Max) Pooling' (from Archive
      ID 30). Adaptive Pooling replaces the static mean+max pooling in Quaero's model,
      aiming to leverage dynamic feature aggregation for further performance gains,
      particularly for CRI-Off. `BASE_SEED=42` and Quaero I's original optimizer settings
      (`weight_decay=0.02`, `clip_by_global_norm=0.75`) are used for reproducibility.
    content: "import sys\n# Re-implementing based on Quaero I's storage/quaero/utils.py\
      \ content for self-containment.\n# Also re-implementing Aether II's AdaptivePooling\
      \ from Archive ID 30.\n\nimport jax\nimport jax.numpy as jnp\nimport flax.linen\
      \ as nn\nfrom jax import random\nimport optax\nfrom typing import Any, Dict,\
      \ Sequence\n\n# --- Quaero I's ResidualDSConvBlock (from storage/quaero/utils.py)\
      \ ---\nclass ResidualDSConvBlock(nn.Module):\n    d_model: int; kernel_size:\
      \ int; dilation: int; dropout_rate: float\n    @nn.compact\n    def __call__(self,\
      \ x, deterministic=True):\n        residual = x\n        x = nn.LayerNorm()(x)\n\
      \        x = nn.Conv(features=self.d_model, kernel_size=(self.kernel_size,),\
      \ padding='SAME', feature_group_count=self.d_model, kernel_dilation=(self.dilation,))(x)\n\
      \        x = nn.Dense(self.d_model)(nn.gelu(x)) # Modified: Dense -> GELU directly\
      \ after Depthwise Conv output\n        x = nn.Dropout(rate=self.dropout_rate)(x,\
      \ deterministic=deterministic)\n        return x + residual\n\n# --- Quaero\
      \ I's NetworkWrapper (from storage/quaero/utils.py) ---\nclass NetworkWrapper:\n\
      \    def __init__(self, module):\n        self.module = module\n    def apply(self,\
      \ params, *args, rng_key=None, **kwargs):\n        if rng_key is not None:\n\
      \            return self.module.apply(params, *args, rngs={'dropout': rng_key},\
      \ **kwargs)\n        else:\n            return self.module.apply(params, *args,\
      \ **kwargs)\n    def init(self, *args, **kwargs):\n        return self.module.init(*args,\
      \ **kwargs)\n\n# --- Quaero I's ContextEncoder (from storage/quaero/utils.py)\
      \ ---\nclass ContextEncoder(nn.Module):\n    output_dim: int\n    @nn.compact\n\
      \    def __call__(self, local_context_window):\n        flat_context = local_context_window.reshape(local_context_window.shape[0],\
      \ -1)\n        encoded_context = nn.Dense(self.output_dim, name='context_dense')(flat_context)\n\
      \        return nn.gelu(encoded_context)\n\n# --- Quaero I's CPE_Generator (from\
      \ storage/quaero/utils.py) ---\nclass CPE_Generator(nn.Module):\n    pos_embedding_dim:\
      \ int = 16\n    context_window_size: int = 3\n    max_seq_len: int = 1200\n\
      \    d_input: int = 4\n    @nn.compact\n    def __call__(self, x_raw):\n   \
      \     batch_size, seq_len, _ = x_raw.shape\n        pos_table = self.param('pos_embeddings_table',\
      \ nn.initializers.normal(stddev=0.01), (self.max_seq_len, self.pos_embedding_dim))\n\
      \        pad_width = self.context_window_size // 2\n        padded_x = jnp.pad(x_raw,\
      \ ((0,0), (pad_width, pad_width), (0,0)), mode='constant')\n        windows\
      \ = jnp.stack([padded_x[:, i:i+self.context_window_size, :].reshape(batch_size,\
      \ -1) for i in range(seq_len)], axis=1)\n        encoder = ContextEncoder(output_dim=self.pos_embedding_dim,\
      \ name='context_encoder')\n        encoded_contexts = encoder(windows.reshape(-1,\
      \ self.context_window_size * self.d_input)).reshape(batch_size, seq_len, -1)\n\
      \        pos_embeddings = jnp.tile(pos_table[:seq_len][None, :, :], (batch_size,\
      \ 1, 1))\n        return pos_embeddings * encoded_contexts\n\n# --- Quaero I's\
      \ DeepCPE_Gated_ResidualDSConvBlock (from storage/quaero/utils.py) ---\nclass\
      \ DeepCPE_Gated_ResidualDSConvBlock(nn.Module):\n    d_model: int; kernel_size:\
      \ int; dilation: int; dropout_rate: float\n    cpe_signals: Any\n    gate_intermediate_dim:\
      \ int = 64\n    @nn.compact\n    def __call__(self, x, deterministic=True):\n\
      \        residual = x\n        h = nn.LayerNorm()(x)\n        dw_out = nn.Conv(features=self.d_model,\
      \ kernel_size=(self.kernel_size,), feature_group_count=self.d_model, padding='SAME',\
      \ kernel_dilation=(self.dilation,))(h)\n        h_conv_output = nn.Dense(self.d_model)(nn.gelu(dw_out))\
      \ # Matches Quaero's ResidualDSConvBlock internal structure\n        \n    \
      \    cpe_projected = nn.gelu(nn.Dense(self.d_model, name='cpe_proj_for_gate')(self.cpe_signals))\n\
      \        combined = jnp.concatenate([h_conv_output, cpe_projected], axis=-1)\n\
      \        gate_input = nn.gelu(nn.Dense(self.gate_intermediate_dim, name='gate_dense_1')(combined))\n\
      \        gate_factor = nn.sigmoid(nn.Dense(self.d_model, name='gate_dense_2')(gate_input))\n\
      \        \n        modulated_h = h_conv_output * gate_factor\n        modulated_h\
      \ = nn.Dropout(rate=self.dropout_rate)(modulated_h, deterministic=deterministic)\n\
      \        return residual + modulated_h\n\n# --- Standard Prediction Head Modules\
      \ (from Quaero I's code) ---\nclass RegressionHead(nn.Module):\n    d_output:\
      \ int; dense_dim: int; dropout_rate: float\n    @nn.compact\n    def __call__(self,\
      \ x, deterministic=True):\n        norm = jnp.linalg.norm(x, ord=2, axis=-1,\
      \ keepdims=True)\n        x = x / (norm + 1e-6)\n        z = nn.Dense(self.dense_dim)(x);\
      \ z = nn.gelu(z)\n        z = nn.Dropout(rate=self.dropout_rate)(z, deterministic=deterministic)\n\
      \        return nn.Dense(self.d_output)(z).squeeze(-1)\n\nclass GenericHead(nn.Module):\n\
      \    d_output: int; dense_dim: int; dropout_rate: float\n    @nn.compact\n \
      \   def __call__(self, x, deterministic=True):\n        z = nn.Dense(self.dense_dim)(x);\
      \ z = nn.gelu(z)\n        z = nn.Dropout(rate=self.dropout_rate)(z, deterministic=deterministic)\n\
      \        return nn.Dense(self.d_output)(z)\n\n# --- Aether II's Adaptive (Learned\
      \ Mean+Max) Pooling (from Archive ID 30) ---\nclass AdaptivePooling(nn.Module):\n\
      \    hidden_dim: int # Expected input feature dimension (d_model_common)\n\n\
      \    @nn.compact\n    def __call__(self, F, deterministic=True): # F is (batch,\
      \ seq_len, hidden_dim)\n        mean_pooled = jnp.mean(F, axis=1) # (batch,\
      \ hidden_dim)\n        max_pooled = jnp.max(F, axis=1)   # (batch, hidden_dim)\n\
      \n        combined_pooled = jnp.concatenate([mean_pooled, max_pooled], axis=-1)\
      \ # (batch, 2 * hidden_dim)\n\n        gate_weights_logits = nn.Dense(self.hidden_dim,\
      \ name='pooling_gate_logits')(combined_pooled)\n        gate_weights = nn.sigmoid(gate_weights_logits)\
      \ # (batch, hidden_dim)\n\n        P = gate_weights * mean_pooled + (1 - gate_weights)\
      \ * max_pooled # (batch, hidden_dim)\n        return P # Final pooled feature\
      \ (batch, hidden_dim)\n\n# --- Main Network: Quaero I's QuaeroCPE_SynthesisNet\
      \ with Adaptive Pooling ---\nclass QuaeroCPE_SynthesisNet_AdaptivePooling(nn.Module):\n\
      \    d_output: int; task_type: str; d_model_common: int; ds_num_blocks: int\n\
      \    ds_dilations: Sequence[int]; ds_kernel_size: int; motif_kernel_size: int\n\
      \    dropout_rate: float; head_intermediate_dim: int\n\n    pos_embedding_dim:\
      \ int = 16\n    context_window_size: int = 3\n    max_overall_seq_len: int =\
      \ 1200\n    gate_intermediate_dim: int = 64\n\n    @nn.compact\n    def __call__(self,\
      \ x, deterministic=True, **kwargs):\n        # 1. Generate CPE signals once\
      \ from the raw input\n        cpe_signals = CPE_Generator(\n            pos_embedding_dim=self.pos_embedding_dim,\n\
      \            context_window_size=self.context_window_size,\n            max_seq_len=self.max_overall_seq_len,\n\
      \            d_input=4,\n            name='cpe_generator'\n        )(x)\n\n\
      \        # 2. Initial Projection\n        h = nn.Dense(self.d_model_common)(x);\
      \ h = nn.gelu(h)\n\n        # 3. CPE-Gated Residual Backbone\n        for i\
      \ in range(self.ds_num_blocks):\n            h = DeepCPE_Gated_ResidualDSConvBlock(\n\
      \                d_model=self.d_model_common, kernel_size=self.ds_kernel_size,\n\
      \                dilation=(self.ds_dilations[i]), dropout_rate=self.dropout_rate,\n\
      \                cpe_signals=cpe_signals,\n                gate_intermediate_dim=self.gate_intermediate_dim,\n\
      \                name=f\"cpe_gated_block_{i}\"\n            )(h, deterministic=deterministic)\n\
      \        cnn_features = h\n\n        # 4. Adaptive Pooling (Replaces Quaero\
      \ I's static mean+max pooling)\n        main_path = AdaptivePooling(hidden_dim=self.d_model_common,\
      \ name='adaptive_pooling_main_path')(cnn_features, deterministic=deterministic)\n\
      \        \n        # 5. Specialized Motif Path\n        motif_f = nn.gelu(nn.Conv(self.d_model_common,\
      \ (self.motif_kernel_size,), padding='SAME')(cnn_features))\n        specialized_path\
      \ = jnp.max(motif_f, axis=1)\n\n        # 6. Feature Fusion, LayerNorm, Dropout\n\
      \        fused = jnp.concatenate([main_path, specialized_path], axis=-1)\n \
      \       fused = nn.LayerNorm()(fused)\n        fused = nn.Dropout(rate=self.dropout_rate)(fused,\
      \ deterministic=deterministic)\n        \n        # 7. Task-Specific Heads\n\
      \        head_args = {'d_output': self.d_output, 'dense_dim': self.head_intermediate_dim,\
      \ 'dropout_rate': self.dropout_rate}\n        if self.task_type == \"regression\"\
      : return RegressionHead(**head_args)(fused, deterministic=deterministic)\n \
      \       else: return GenericHead(**head_args)(fused, deterministic=deterministic)\n\
      \n# --- Hyperparameter definition (from Quaero I's _define_hyperparameters,\
      \ plus CPE/gating params) ---\ndef _define_hyperparameters():\n    return {\n\
      \        'learning_rate': 0.001, 'd_model_common': 256, 'ds_num_blocks': 5,\n\
      \        'ds_dilations': (1, 2, 4, 8, 16), 'ds_kernel_size': 7, 'motif_kernel_size':\
      \ 5,\n        'dropout_rate': 0.1, 'head_intermediate_dim': 128, 'weight_decay':\
      \ 0.02, # Quaero I's original WD\n        'pos_embedding_dim': 16, 'context_window_size':\
      \ 3, 'max_overall_seq_len': 1200,\n        'gate_intermediate_dim': 64,\n  \
      \  }\n\n# --- create_network (using Quaero I's NetworkWrapper) ---\ndef create_network(hparams:\
      \ Dict[str, Any]):\n    network_params = {k: hparams.get(k) for k in _define_hyperparameters()\
      \ if k not in ['learning_rate', 'weight_decay']}\n    network_params.update({'d_output':\
      \ hparams.get('d_output'), 'task_type': hparams.get('task_type')})\n    return\
      \ NetworkWrapper(QuaeroCPE_SynthesisNet_AdaptivePooling(**network_params))\n\
      \n# --- create_optimizer (Quaero I's original optimizer settings) ---\ndef create_optimizer(learning_rate:\
      \ float = 0.001):\n    hparams = _define_hyperparameters() \n    weight_decay_value\
      \ = hparams.get('weight_decay', 0.02) # Quaero I's original weight decay\n\n\
      \    return optax.chain(\n        optax.clip_by_global_norm(0.75), # Quaero\
      \ I's original gradient clipping\n        optax.adamw(learning_rate=learning_rate,\
      \ weight_decay=weight_decay_value)\n    )\n\nBASE_SEED = 42\nBATCH_SIZE = 64\n"
  yaml_error: null
