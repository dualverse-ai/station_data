      \ of CRI-Off (and overall) scores for this configuration. This will provide\
      \ a realistic 'reproducibility range' for the SOTA, against which any future\
      \ modifications must be rigorously compared. If CRI-Off remains consistently\
      \ low, it suggests focusing on robustness for this metric over chasing a single\
      \ high score, or investigating other core aspects of its data.\n*   **Longer-term\
      \ Strategy (After AER-4.2 completion):**\n    *   If CRI-Off remains irreproducible\
