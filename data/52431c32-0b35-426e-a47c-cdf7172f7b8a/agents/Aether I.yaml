    content: "import sys\nsys.path.append('storage/veritas') # VERITAS II's original\
      \ import statement\nfrom utils import DSConvDilatedBlock, DSConvNetworkWrapper\
      \ # Reusing modular components\n\nimport jax\nimport jax.numpy as jnp\nimport\
      \ flax.linen as nn\nfrom jax import random\nimport optax\nfrom typing import\
      \ Any, Dict, Sequence\n\n# --- Prediction Head Modules (from Veritas II's submission\
      \ code) ---\nclass RegressionHead(nn.Module):\n    d_output: int\n    dense_dim:\
      \ int = 128\n    dropout_rate: float = 0.1\n\n    @nn.compact\n    def __call__(self,\
      \ x, deterministic=True):\n        z = nn.Dense(self.dense_dim, name='head_dense_1')(x)\n\
      \        z = nn.gelu(z)\n        z = nn.Dropout(rate=self.dropout_rate)(z, deterministic=deterministic)\n\
      \        logits = nn.Dense(self.d_output, name='out_proj')(z)\n        return\
      \ logits.squeeze(-1)\n\nclass MultiLabelRegressionHead(nn.Module):\n    d_output:\
      \ int\n    dense_dim: int = 128\n    dropout_rate: float = 0.1\n\n    @nn.compact\n\
      \    def __call__(self, x, deterministic=True):\n        z = nn.Dense(self.dense_dim,\
      \ name='head_dense_1')(x)\n        z = nn.gelu(z)\n        z = nn.Dropout(rate=self.dropout_rate)(z,\
      \ deterministic=deterministic)\n        logits = nn.Dense(self.d_output, name='out_proj')(z)\n\
      \        return logits\n\nclass MultiLabelClassificationHead(nn.Module):\n \
      \   d_output: int\n    dense_dim: int = 128\n    dropout_rate: float = 0.1\n\
      \n    @nn.compact\n    def __call__(self, x, deterministic=True):\n        z\
      \ = nn.Dense(self.dense_dim, name='head_dense_1')(x)\n        z = nn.gelu(z)\n\
      \        z = nn.Dropout(rate=self.dropout_rate)(z, deterministic=deterministic)\n\
      \        logits = nn.Dense(self.d_output, name='out_proj')(z)\n        return\
      \ logits\n\nclass MultiClassClassificationHead(nn.Module):\n    d_output: int\n\
      \    dense_dim: int = 128\n    dropout_rate: float = 0.1\n\n    @nn.compact\n\
      \    def __call__(self, x, deterministic=True):\n        z = nn.Dense(self.dense_dim,\
      \ name='head_dense_1')(x)\n        z = nn.gelu(z)\n        z = nn.Dropout(rate=self.dropout_rate)(z,\
      \ deterministic=deterministic)\n        logits = nn.Dense(self.d_output, name='out_proj')(z)\n\
      \        return logits\n\n\n# --- Main Network: Dual-Path (DSConv Hybrid Pooling\
      \ + Conv-Motif Detector) with Task-Specific Heads ---\nclass DualPathTaskSpecificHeadNetwork(nn.Module):\
      \ \n    d_input: int = 4\n    d_output: int = 1\n    task_type: str = \"regression\"\
      \n    \n    d_model_common: int = 256 \n    ds_num_blocks: int = 5\n    ds_dilations:\
      \ Sequence[int] = (1, 2, 4, 8, 16)\n    ds_kernel_size: int = 7\n    motif_kernel_size:\
      \ int = 5 \n    dropout_rate: float = 0.1\n    \n    head_intermediate_dim:\
      \ int = 128 \n\n    @nn.compact\n    def __call__(self, x, deterministic=True):\n\
      \        x = nn.Dense(self.d_model_common, name=\"initial_dense\")(x)\n    \
      \    x = nn.gelu(x) \n        x = nn.Dropout(rate=self.dropout_rate)(x, deterministic=deterministic)\n\
      \n        for i in range(self.ds_num_blocks):\n            dilation = self.ds_dilations[i]\
      \ if i < len(self.ds_dilations) else self.ds_dilations[-1]\n            x =\
      \ DSConvDilatedBlock( \n                d_model=self.d_model_common, \n    \
      \            kernel_size=self.ds_kernel_size, \n                dilation=dilation,\
      \ \n                dropout_rate=self.dropout_rate,\n                name=f\"\
      dsconv_block_{i}\"\n            )(x, deterministic=deterministic) \n       \
      \ cnn_features = x\n\n        mean_pooled = jnp.mean(cnn_features, axis=1) \n\
      \        max_pooled = jnp.max(cnn_features, axis=1)  \n        main_path_features\
      \ = jnp.concatenate([mean_pooled, max_pooled], axis=-1) \n        \n       \
      \ motif_features = nn.Conv(\n            features=self.d_model_common,\n   \
      \         kernel_size=(self.motif_kernel_size,), \n            padding='SAME',\
      \ \n            name='motif_conv_1'\n        )(cnn_features)\n        motif_features\
      \ = nn.gelu(motif_features)\n        motif_features = nn.Dropout(rate=self.dropout_rate)(motif_features,\
      \ deterministic=deterministic)\n        \n        specialized_path_features\
      \ = jnp.max(motif_features, axis=1) \n        \n        fused_features = jnp.concatenate([main_path_features,\
      \ specialized_path_features], axis=-1) \n        fused_features = nn.Dropout(rate=self.dropout_rate)(fused_features,\
      \ deterministic=deterministic) \n\n        z_fused = nn.LayerNorm(name=\"final_norm\"\
      )(fused_features)\n        \n        if self.task_type == \"regression\":\n\
