pruned_dialogue_ticks:
- ticks: 243-247
  summary: 'This block covers the initial phase of the "MoE Investigation" research
    arc.

    1.  **Initial Analysis:** Began by reviewing Axiom II''s SOTA MoE model (ID 328).
    Submitted an analysis experiment (ID 362) which revealed "expert collapse"—the
    model exclusively used its RNN expert. This period also includes the initial drafting
    of the paper on this finding.

    '
- ticks: 249-262
  summary: 'This block covers the main experimental phase of the "MoE Investigation"
    and its conclusion.

    1.  **Hypothesis A (Gating Signal):** Hypothesized the collapse was due to a poor
    gating signal. Submitted MoE v2 (ID 368) with a richer signal. Analysis (ID 375)
    confirmed this fixed the mechanical collapse and induced specialization, but performance
    was lower than SOTA (0.6788), revealing an expert imbalance.

    2.  **Hypothesis C (Expert Diversity):** Hypothesized the experts were not diverse
    enough. Submitted MoE v3 (ID 376) with RNN vs. Attention experts. Analysis (ID
    382) showed this also induced specialization but failed to beat the SOTA (Score:
    0.6668).

    3.  **Conclusion:** The entire MoE framework was deemed a dead end, as the complexity
    consistently underperformed the simple, "collapsed" RNN-only architecture. This
    concluded the arc and prompted a pivot to baseline refinement. Includes preparation
    of analysis scripts and documentation updates.

    '
- ticks: 263-264
  summary: 'Pivot from MoE to baseline refinement. Submitted Bi-directional GRU (ID
    386, Score: 0.6616), which failed to improve performance.'
- ticks: 266-274
  summary: 'Conducted a series of failed architectural experiments.

    1.  RNN-Only v2 (ID 388, Score: 0.6680) failed to replicate the SOTA by adding
    the projection layer alone.

    2.  A naive Transformer-RNN (ID 393, Score: 0.2171) failed catastrophically due
    to missing positional encodings.

    3.  A principled DSConv-Transformer hybrid (ID 398, Score: 0.6219), inspired by
    Axiom I, also underperformed.

    This series of failures demonstrated that simple architectural changes were not
    a productive path, leading to a pivot to hyperparameter tuning.

    '
- ticks: 275-280
  summary: 'Pivoted to hyperparameter tuning. An automated sweep (ID 401) failed due
    to a system error. A manual sweep of `gru_hidden_dim` was conducted across three
    runs:

    - dim=128 (ID 410): 0.6626

    - dim=256 (ID 406): 0.6675

    - dim=384 (ID 411): 0.6734

    This validated the tuning approach but was superseded by the discovery of Noema
    I''s superior baselines in the Archive.

    '
