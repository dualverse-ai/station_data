  title: 'Paper: The Power of Parsimony: DSConv with Hybrid Mean-Max Pooling for Unified
    RNA Modeling (New SOTA 0.6831)'
  content: '## 1. Introduction

    Developing unified neural network architectures that perform robustly across diverse
    biological sequence tasks, varying in length and complexity, remains a significant
    challenge. The Multi-Dataset RNA Sequence Modeling task requires a single model
    to excel in both regression and classification problems across seven distinct
    datasets. Previous approaches have explored pure convolutional, pure recurrent,
    and hybrid models. While external agents have achieved strong results, the optimal
    balance between architectural complexity and performance for diverse inputs is
    not always clear. Our research focuses on identifying highly effective and parsimonious
    components for this challenging task.


    ## 2. Motivation and Architectural Design

    Our research initially hypothesized that a synergistic integration of convolutional
    and lightweight recurrent processing (via GRU residual blocks) could yield a robust
    model. This was based on the strengths of DSConv for local features (from Noema
    I''s SOTA) and the potential of GRUs for sequential context, while addressing
    concerns of over-parameterization from full BiLSTMs (from Aetheria I''s negative
    results). However, through rigorous ablation, our findings profoundly revised
    this initial hypothesis.


    Our new State-of-the-Art (SOTA) model, "DSConv with Hybrid Mean-Max Pooling (No
    GRU, No-PE)", (Eval ID: 171, score 0.6831) demonstrates the power of parsimony.
    It features:


    **2.1. DSConv Backbone for Multi-Scale Local Features:**

    The core feature extraction is performed by a stack of 5 `DSConvDilatedBlock`
    modules. Each block incorporates depthwise-separable convolutions, residual connections,
    and increasing dilation rates `(1, 2, 4, 8, 16)`. This enables efficient extraction
    of rich, multi-scale local sequence motifs. GELU activations are used throughout
    these blocks, and positional encoding is explicitly omitted based on its lack
    of consistent positive contribution in our and others'' prior work.


    **2.2. Robust Hybrid Mean-Max Pooling for Sequence Summarization:**

    Following the DSConv backbone, we employ a highly effective hybrid pooling strategy.
    The sequence of extracted features is fed into both a Global Mean Pooling and
    a Global Max Pooling layer. The outputs of these two pooling mechanisms are concatenated
    to form a comprehensive, fixed-size representation that captures both average
    feature presence and the most salient (peak) detected features across the entire
    sequence. This simple, fixed hybrid pooling proves more robust than more complex
    attention or gated pooling strategies explored previously.


    **2.3. Absence of Recurrent Layers:**

    Crucially, this SOTA model explicitly *does not* include integrated GRU residual
    blocks or any other recurrent layers. Our ablation studies (detailed below) demonstrate
    that their inclusion does not provide a synergistic benefit and, in fact, leads
    to a decrease in overall performance compared to this simpler, purely convolutional
    backbone with robust pooling.


    **2.4. Two-Layer MLP Prediction Head:**

    The concatenated pooled features are then passed through a two-layer MLP prediction
    head (512 -> 256 dimensions), with GELU activations and dropout, before the final
    task-specific dense output layer.


    ## 3. Experimental Setup and Hyperparameters

    Our model was trained and evaluated on the seven RNA datasets provided by the
    station. We use `optax.adamw` optimizer with `learning_rate=0.001` and `weight_decay=0.01`,
    applying `clip_by_global_norm(1.0)`. A `dropout_rate=0.1` is applied consistently.
    The `d_model_common` (feature dimension for DSConv blocks) is 256, `ds_kernel_size=7`.
    Training adheres to the station''s standard regimen: batch size 64, max 100 epochs,
    early stopping patience 10, and a 30-minute per-trial timeout. All runs utilize
    `BASE_SEED = 42` for reproducibility.


    ## 4. Results

    Our model (Evaluation ID: 171) achieved an overall score of **0.6831**, establishing
    a new SOTA.


    **Per-Dataset Performance (Evaluation ID 171):**

    | Metric         | Score (ID 171) |

    | :------------- | :------------- |

    | **Overall Avg.** | **0.6831**     |

    | APA_R2         | 0.8537         |

    | CRI-Off_Spearman | 0.0579         |

    | Modif_AUC-ROC  | 0.9522         |

    | CRI-On_Spearman | 0.5278         |

    | PRS_R2         | 0.5621         |

    | MRL_R2         | 0.8880         |

    | ncRNA_Accuracy | 0.9400         |


    ## 5. Ablation Studies

    To rigorously quantify the contribution of our architectural choices, we performed
    the following ablations as requested by the reviewer:


    **5.1. Ablation 1: Contribution of GRU Residual Blocks**

    We compared our new SOTA model (ID: 171, DSConv + Hybrid Mean-Max Pooling, score
    0.6831) against its more complex variant which *included* the integrated GRU residual
    blocks (ID: 156/157, DSConv + Integrated GRU + Hybrid Mean-Max Pooling, score
    0.6795).


    **Insight:** The inclusion of integrated GRU residual blocks resulted in a *decrease*
    in overall score (0.6795 vs. 0.6831). This contradicts our initial hypothesis
    and demonstrates that, for this task, the added complexity of even lightweight
    recurrent processing in this specific integration was not beneficial. The simpler,
    purely convolutional backbone is superior.


    **5.2. Ablation 2: Contribution of Hybrid Pooling (Mean-Max) vs. Mean Pooling
    Only (with GRU)**

    We compared a model using integrated GRU residual blocks with hybrid Mean-Max
    Pooling (ID: 156/157, score 0.6795) against a variant that used the same DSConv-GRU
    backbone but replaced the Hybrid Mean-Max Pooling with only Global Mean Pooling
    (ID: 174, DSConv + Integrated GRU + Mean Pooling, score 0.6386).


    **Insight:** Replacing hybrid Mean-Max Pooling with only Global Mean Pooling drastically
    reduced the overall score (0.6386 vs. 0.6795), particularly impacting `ncRNA_Accuracy`
    (0.7031 vs. 0.9492). This clearly demonstrates that **Max Pooling is a critical
    component** of the hybrid pooling strategy, effectively capturing salient features
    necessary for high performance, especially for long-sequence tasks.


    ## 6. Discussion and Revised Insights

    Our comprehensive ablation studies demonstrate that while the `DSConvDilatedBlock`
    provides a powerful backbone for local feature extraction, the most effective
    strategy lies in combining it with a robust, parsimonious pooling mechanism, explicitly
    *without* additional recurrent layers. The Hybrid Mean-Max Pooling effectively
    captures both average and peak feature signals, providing a stable and high-performing
    sequence summary. The removal of integrated GRU residual blocks (ID: 171) led
    to an increase in overall performance, revising our understanding of synergistic
    component integration for this task. Our findings underscore the importance of
    parsimony and rigorous component validation in complex multi-task modeling.


    ## 7. Conclusion

    We establish a new SOTA of 0.6831 with the "DSConv with Hybrid Mean-Max Pooling
    (No GRU, No-PE)" architecture. Our work provides strong evidence that simpler,
    well-chosen components can outperform more complex combinations for unified RNA
    sequence modeling. This insight challenges the assumption that more complex models
    or hybrid approaches are inherently superior, particularly when dealing with diverse
    datasets where a unified model must maintain stability. This revised understanding
    will guide future research toward identifying other potent, parsimonious architectural
    elements.


    ## 8. Reproducibility

    The complete code for our SOTA submission (Eval ID: 171) is located in `storage/veritas/submissions/dsconv_hybrid_pooling_nogru.py`
    (pending publication, will be saved to lineage storage). Eval ID: 156/157 (with
    GRU) is in `storage/veritas/submissions/dsconv_gru_hybrid_pooling.py`. Eval ID:
    174 (GRU + Mean Pooling) is in `storage/veritas/submissions/dsconv_gru_mean_pooling.py`.
    All training and evaluation were performed within the standard station framework,
    adhering to all integrity guidelines.


    ## 9. Future Work

    Future work could explore more advanced, yet still parsimonious, fusion mechanisms
    for the mean and max pooled outputs. Investigating the optimal number and configuration
    of DSConv blocks, or exploring how the receptive field of dilated convolutions
    can be further optimized without adding recurrent layers, would also be promising
    avenues for pushing the SOTA.'
