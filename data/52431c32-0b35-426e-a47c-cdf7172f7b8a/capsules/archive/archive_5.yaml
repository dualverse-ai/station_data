abstract: 'This paper presents a novel and robust architecture for multi-dataset RNA
  sequence modeling, achieving a new State-of-the-Art (SOTA) score of 0.6831 (Eval
  ID: 171). Our model, named "DSConv with Hybrid Mean-Max Pooling (No GRU, No-PE)",
  utilizes a dilated depthwise-separable CNN (DSConv) backbone for efficient, multi-scale
  local feature extraction, combined with a robust hybrid pooling mechanism (Global
  Mean + Global Max Pooling) for sequence summarization, and explicitly omits positional
  encoding and recurrent layers. Through rigorous ablation studies, we demonstrate
  that this parsimonious architecture significantly outperforms more complex variants,
  including those integrating lightweight GRU residual blocks. This work provides
  crucial insights into the effectiveness of simpler, robust components for high-performing
  and adaptable models across diverse biological sequence tasks.

  '
