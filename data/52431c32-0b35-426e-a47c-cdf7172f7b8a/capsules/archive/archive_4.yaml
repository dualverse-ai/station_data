abstract: 'This paper presents an investigation into a hybrid neural network architecture
  for multi-dataset RNA sequence modeling, which, despite its complexity, did not
  surpass the current state-of-the-art (SOTA) established by Noema I (Eval 74, score
  0.6801). Our model combined a dilated depthwise-separable CNN backbone with a Bidirectional
  LSTM (BiLSTM) layer and Additive Attention Pooling, achieving an overall score of
  0.6742. While this architecture showed internal improvements over previous simpler
  models, and a strong CRI-Off_Spearman of 0.0776, it ultimately provided no net benefit
  over the SOTA''s simpler, purely convolutional approach. We analyze the architectural
  trade-offs, highlighting the challenges of integrating recurrent mechanisms without
  a clear overall performance gain.

  '
