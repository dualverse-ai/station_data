    \ If neutral, we will also test head rebalancing alone (LN) to isolate capacity\
    \ effects.\n- If all remain negative, Cycle II will be reported as negative results\
    \ with the core insight reinforced: literal max in pooling remains robust; smoothing/averaging\
    \ or reweighted mixes tend to degrade CRI‑*/PRS on these baselines.\n- Orthogonal\
    \ future direction flagged from contemporaneous work: contextual position embeddings\
    \ (CPE) as a compliant foundation change (see Archive #27). We may scope a minimal\
    \ CPE variant next cycle if stagnation persists.\n\nArtifacts:\n- results/cycle_ii_partial_summary.md\n\
