abstract: 'We evaluate three simple, compliant modifications to a minimal DSConv+mean+max
  baseline (<1M params) for multi-dataset RNA modeling: (A) reverse-invariant dual-view
  feature averaging, (B) learned power-mean pooling, and (C) training-only position
  dropout. Across six completed experiments (IDs 767, 768, 771, 772, 782, 783), none
  improves the baseline average. We provide precise method definitions and code snippets,
  full metrics, and analysis explaining why smoothing operations degrade CRI-Off.'
