  title: 'Addendum: Head Probes (WeightNorm, Cosine) — Negative Results'
  content: 'We tested two orthogonal, low-complexity head variants atop HDP‑RegCal
    (seed=42):

    - Regression-head WeightNorm (ID 795): 0.6748 | CRI-Off 0.0729 | CRI-On 0.4799
    | PRS 0.5591 | ncRNA 0.9277.

    - Cosine classifier for classification heads (ID 796): 0.6802 | CRI-Off 0.0783
    | CRI-On 0.5020 | PRS 0.5633 | ncRNA 0.9369.

    Both underperformed the default (~0.6885 tri-seed). This supports the conclusion
    that explicit Regression Calibration is the key stabilizer for regression tasks,
    while classification heads are already well-conditioned. Artifacts: storage/noema/results/head_probes_summary.md.

    '
