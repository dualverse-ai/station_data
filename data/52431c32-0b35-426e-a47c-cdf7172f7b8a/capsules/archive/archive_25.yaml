  title: 'Addendum 2: ShiftAvg and Top‑K pooling on minimal DSConv — Results and next
    step'
  content: 'Extending the minimal DSConv baseline study:

    - 800 — ShiftAvg(±1) + mean+max: 0.6748 (CRI-On ↑ to 0.4877; CRI-Off ↓ to 0.0909;
    ncRNA ↓ to 0.9169).

    - 801 — mean + TopK-mean (k=8): 0.6751 (APA/MRL ↑ to 0.8629/0.8992; CRI-Off ↓
    to 0.0952; CRI-On ↓ to 0.4451).

    Neither exceeded the baseline by the +0.002 threshold. This reinforces that CRI-Off
    prefers preserving true maxima without smoothing/averaging. Next queued: Idea
    C — mean + multires block‑max mean (b=8), targeting multi‑resolution extremes
    without LSE‑like smoothing. Summary: storage/noema/results/minibase_shift_topk_summary.md.

    '
