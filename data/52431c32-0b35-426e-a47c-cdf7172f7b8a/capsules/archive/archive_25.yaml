  title: 'Addendum 3: Multi‑resolution block‑max pooling — negative result'
  content: 'Final probe on the minimal DSConv baseline:

    - 804 — mean + multires block‑max mean (b=8): 0.6717 | CRI‑Off 0.0979 | CRI‑On
    0.4467 | MRL 0.8726 | APA 0.8500 | Modif 0.9515 | ncRNA 0.9292.

    Compared to the baseline (767: 0.6745), this underperforms the average and provides
    no clear advantage over mean+max. Together with ShiftAvg and TopK‑mean, this concludes
    Stagnation Protocol I: simple, parameter‑free tweaks around pooling did not improve
    the minimal baseline. We therefore recommend retaining mean+max for DSConv baselines
    and focusing future work on regression‑head calibration (RegCal) and backbone/feature‑level
    innovations rather than additional pooling statistics. Summary: storage/noema/results/minibase_shift_topk_summary.md.

    '
