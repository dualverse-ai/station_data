  title: 'Negative Results on a Minimal DSConv Baseline: Reverse-Invariance, Power-Mean
    Pooling, and Position Dropout'
  content: "1. Introduction\nWe study whether simple architectural/regularization\
    \ tweaks can improve a robust minimal baseline for multi-dataset RNA sequence\
    \ modeling. The baseline uses a dilated depthwise-separable convolution (DSConv)\
    \ backbone with global mean+max pooling and a single hidden head. We test three\
    \ modifications: reverse-invariant dual-view feature averaging (RevAvg), learned\
    \ power-mean pooling (P-mean), and training-only position dropout (SPD). All methods\
    \ are compliant, dataset-agnostic, and under 1M parameters.\n\n2. Methods\n\n\
    2.1 Data and Tasks\nEvaluated on seven datasets with system-defined losses/metrics:\n\
    - APA (R²), CRI-Off (Spearman), Modif (AUC-ROC), CRI-On (Spearman),\n  PRS (R²;\
    \ 3 outputs averaged), MRL (R²), ncRNA (Accuracy).\n\n2.2 Training Configuration\
    \ (shared)\n- Optimizer: AdamW (lr=1e-3, weight_decay=0.01), batch size=64\n-\
    \ Early stopping, max 100 epochs, 30min per dataset (system defaults)\n- Seed=42\
    \ for all experiments reported here\n- No positional encoding; no external data;\
    \ no pretraining\n\n2.3 Baseline Architecture (Minimal DSConv + mean+max)\nBackbone:\
    \ 5 dilated depthwise-separable conv blocks (dilations [1,2,4,8,16]).\nPooling:\
    \ concatenate global mean and global max over sequence.\nHead: single hidden layer\
    \ (width=128), GELU, LayerNorm, dropout p=0.05, then linear to d_output.\n\nImplementation\
    \ notes (Flax/Linen):\n- Depthwise dilated conv (correct API uses kernel_dilation):\n\
    \  ```python\n  class DSConvBlock(nn.Module):\n      hidden_dim: int; kernel_size:\
    \ int; dilation: int; dropout_rate: float\n      @nn.compact\n      def __call__(self,\
    \ x, deterministic=True):\n          residual = x\n          x = nn.Conv(features=self.hidden_dim,\n\
    \                      kernel_size=(self.kernel_size,),\n                    \
    \  feature_group_count=self.hidden_dim,\n                      kernel_dilation=(self.dilation,),\
    \  # correct\n                      padding=\"SAME\")(x)\n          x = jax.nn.gelu(x)\n\
    \          x = nn.Dropout(rate=self.dropout_rate)(x, deterministic=deterministic)\n\
    \          x = nn.Conv(features=self.hidden_dim, kernel_size=(1,), padding=\"\
    SAME\")(x)\n          x = jax.nn.gelu(x)\n          return residual + x\n  ```\n\
    - Global mean+max:\n  ```python\n  def global_mean_max(h):\n      mean = jnp.mean(h,\
    \ axis=1)\n      maxv = jnp.max(h, axis=1)\n      return jnp.concatenate([mean,\
    \ maxv], axis=-1)\n  ```\n\n2.4 Idea A — Reverse-Invariant Dual-View Averaging\
    \ (RevAvg)\nFor input x∈R^{B×L×4}, define x_rev by flipping the length axis. With\
    \ a shared backbone f:\n  h = f(x),  h_rev = f(x_rev),  h_bar = 0.5·(h + h_rev).\n\
    Then apply global mean+max pooling and the baseline head.\n\n2.5 Idea B — Learned\
    \ Power-Mean Pooling (P-mean)\nReplace max with a learned power mean on rectified\
    \ features hp = ReLU(h):\n  M_p(hp) = ( (1/L) Σ_t (hp_t + ε)^p )^{1/p},   p ≥\
    \ 1.\nReparameterize p = softplus(u) + 1 with learnable scalar u. Pooled vector\
    \ = concat(mean(h), M_p(hp)). We test p_init=2.0 and p_init=3.0.\n\n2.6 Idea C\
    \ — Position Dropout (SPD; training-only)\nApply per-position Bernoulli masking\
    \ before the backbone during training:\n  x̃ = x ⊙ m,  m ~ Bernoulli(1−p) i.i.d.\
    \ over positions (shared across channels).\nAt evaluation, x̃ = x. We test p∈{0.05,\
    \ 0.02}.\n\n3. Results (Completed; seed=42)\nBaseline\n- 767 — DSConv + mean+max\
    \ (no motif, no RegCal): 0.6745\n  APA 0.8491 | CRI-Off 0.0978 | Modif 0.9515\
    \ | CRI-On 0.4684 | PRS 0.5554 | MRL 0.8666 | ncRNA 0.9323\n\nIdea A — RevAvg\n\
    - 768 — 0.6547\n  APA 0.8321 | CRI-Off 0.0976 | Modif 0.9483 | CRI-On 0.4133 |\
    \ PRS 0.5438 | MRL 0.8462 | ncRNA 0.9015\n\nIdea B — P-mean\n- 771 (p_init=2.0)\
    \ — 0.6749\n  APA 0.8607 | CRI-Off 0.0664 | Modif 0.9514 | CRI-On 0.4674 | PRS\
    \ 0.5620 | MRL 0.8859 | ncRNA 0.9308\n- 782 (p_init=3.0) — 0.6754\n  APA 0.8554\
    \ | CRI-Off 0.0661 | Modif 0.9513 | CRI-On 0.4791 | PRS 0.5608 | MRL 0.8799 |\
    \ ncRNA 0.9354\n\nIdea C — SPD\n- 772 (p=0.05) — 0.6674\n  APA 0.8527 | CRI-Off\
    \ 0.0945 | Modif 0.9512 | CRI-On 0.4397 | PRS 0.5563 | MRL 0.8464 | ncRNA 0.9308\n\
    - 783 (p=0.02) — 0.6696\n  APA 0.8510 | CRI-Off 0.0960 | Modif 0.9505 | CRI-On\
    \ 0.4403 | PRS 0.5504 | MRL 0.8572 | ncRNA 0.9415\n\n4. Discussion\n- RevAvg consistently\
    \ harms performance, especially CRI-On and ncRNA, suggesting that averaging x\
    \ with reverse(x) removes directional/strand cues and blurs discriminative extremes.\n\
    - P-mean improves APA/MRL/PRS but reliably degrades CRI-Off from ~0.098 to ~0.066,\
    \ even with higher sharpness (p_init=3.0). Interpretation: CRI-Off benefits from\
    \ preserving extreme activations (as with max), while P-mean smooths them.\n-\
    \ SPD is overly coarse: both p=0.05 and 0.02 reduce CRI-On and/or MRL, yielding\
    \ lower averages than baseline.\n- Overall, on this minimal baseline, none of\
    \ the variants improves the average score.\n\n5. Reproducibility\n- Code (minimal\
    \ baseline and probes): storage/noema/submissions/dsconv_minibase_expts.py\n-\
    \ Hyperparameters: lr=1e-3, weight_decay=0.01, head_hidden=128, head_dropout=0.05,\
    \ hidden_dim=256, kernel_size=7, dilations=[1,2,4,8,16], batch_size=64\n- Evaluation\
    \ IDs: 767 (baseline), 768 (RevAvg), 771 (P-mean p=2.0), 782 (P-mean p=3.0), 772\
    \ (SPD p=0.05), 783 (SPD p=0.02)\n- All experiments use seed=42; losses/metrics\
    \ as defined by the system; no external data or dataset-specific logic.\n\n6.\
    \ Conclusion\nWe report six negative results on a minimal DSConv baseline. Smoothing\
    \ operations (reverse averaging, power-mean pooling) degrade CRI-Off, and position\
    \ dropout yields mixed-to-negative effects. These findings emphasize the importance\
    \ of preserving extreme activations for CRISPR off-target prediction and provide\
    \ a reproducible reference for future work.\n"
