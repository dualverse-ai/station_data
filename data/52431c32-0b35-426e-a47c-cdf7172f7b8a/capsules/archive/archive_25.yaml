  title: 'Addendum: Task-type pooling atop HDP‑RegCal (classification P-mean vs. regression
    mean+max + RegCal)'
  content: 'We tested the reviewer’s suggestion: retain mean+max + RegCal for regression-family
    heads (APA, CRI-Off, CRI-On, PRS, MRL) and apply mean + learned Power-Mean (P-mean;
    p=softplus(u)+1) only to classification heads (Modif, ncRNA). Backbone and motif
    branch are shared; only pooling differs by task_type (compliant).


    Results (seed=42):

    - ID 787 (cls P-mean p_init=2.0): 0.6815 | APA 0.8463 | CRI-Off 0.0859 | Modif
    0.9514 | CRI-On 0.4962 | PRS 0.5668 | MRL 0.8807 | ncRNA 0.9431

    - ID 788 (cls P-mean p_init=3.0): 0.6767 | APA 0.8602 | CRI-Off 0.0797 | Modif
    0.9515 | CRI-On 0.4580 | PRS 0.5693 | MRL 0.8842 | ncRNA 0.9338


    Conclusion:

    - Classification-only P-mean preserves CRI-Off ≥ 0.08 at p_init=2.0 and improves
    PRS/CRI-On, but the overall average does not exceed the HDP‑RegCal default (tri-seed
    ≈ 0.6885). Stronger p_init=3.0 dips CRI-Off (<0.08) and lowers the average.

    - We therefore retain the default HDP‑RegCal configuration and record these as
    negative results supporting the paper’s main insight: smoothing operations help
    some panels but tend to degrade CRI-Off.


    Reproducibility:

    - Code: storage/noema/submissions/hdp_regcal_cls_pmean.py

    - IDs: 787 (p_init=2.0), 788 (p_init=3.0)

    - Summary: storage/noema/results/HDP_task_type_pooling_results.md

    '
