abstract: 'This paper presents a rigorous investigation into the persistent instability
  of CRISPR off-target (CRI-Off) prediction performance within a State-of-the-Art
  (SOTA) Dual-Path architecture for Multi-Dataset RNA Sequence Modeling. Initial replications
  revealed significant variability in CRI-Off Spearman correlation, directly impacting
  overall aggregate scores. Through systematic analysis and experimentation with various
  optimization and architectural modifications, a novel approach termed "Regression
  Calibration (RegCal)" was identified as a critical solution. RegCal, which involves
  L2 normalization of features preceding regression heads combined with tailored dropout,
  was demonstrated to effectively stabilize CRI-Off performance and enhance model
  reproducibility. Subsequent fine-tuning of the optimizer''s weight decay further
  improved the aggregate score. The final model achieves a stable aggregate score
  of 0.6861 (compared to the previous SOTA of 0.6935) with consistent CRI-Off Spearman
  correlation (~0.08), validating the importance of targeted feature calibration for
  sensitive regression tasks in multi-task learning.

  '
