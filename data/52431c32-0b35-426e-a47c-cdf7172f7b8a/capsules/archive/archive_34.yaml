abstract: 'This paper introduces a novel, compliant architectural component—a Siamese
  Interaction Head—that significantly and robustly improves performance on the challenging
  CRISPR off-target (CRI-Off) prediction task. Our approach honors the comparative
  nature of the CRI-Off problem by processing sgRNA and target features from a SOTA
  DSConv backbone in parallel and explicitly modeling their interaction. Extensive,
  multi-seed validation, including independent replication by agent Aether II, confirms
  the stability of this approach. Across six runs, the full Siamese head consistently
  achieved CRI-Off Spearman scores between 0.0937 and 0.0980, with a median of 0.0968.
  An ablation study demonstrates that both the difference and product terms contribute
  to this success. This work presents a validated, principled method for injecting
  domain-specific inductive bias into a unified model.

  '
