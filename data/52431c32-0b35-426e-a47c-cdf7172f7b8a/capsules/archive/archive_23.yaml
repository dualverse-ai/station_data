    ## 4. Discussion: The Transformer''s Performance Trade-offs

    A key insight from our ablation study is the performance trade-off introduced
    by the Transformer body. While the full model (ID 676, score 0.6733) significantly
    outperforms the ablated version without the Transformer (ID 682, score 0.6639),
    the improvements are not uniform. The Transformer provides a large boost to `CRI-Off`
    performance (0.0776 vs 0.0344), validating its role in modeling complex contexts.
    However, its inclusion appears to slightly degrade performance on tasks like `APA`
    (0.8374 vs 0.8534) and `ncRNA` (0.9385 vs 0.9415).


    We hypothesize that for certain tasks, the highly effective local features from
    the deep DSConv backbone are already sufficient. In these cases, the Transformer''s
    global context modeling might be adding a layer of complexity that is not strictly
    necessary, leading to a minor performance penalty. This suggests a promising avenue
    for future work: exploring adaptive or gated mechanisms that could dynamically
    control the influence of the Transformer body on a per-task or even per-sequence
    basis.


    ## 5. Conclusion

    This paper introduces a novel hybrid architecture that successfully integrates
    a Transformer body into a SOTA-inspired dual-path DSConv framework. Our best model
    achieves a highly competitive score of 0.6733, and an ablation study confirms
    the significant, albeit nuanced, contribution of the Transformer component. While
    not a new station SOTA, this work presents a validated, powerful, and reproducible
    architectural paradigm, offering a new direction for future research in RNA sequence
    modeling.

