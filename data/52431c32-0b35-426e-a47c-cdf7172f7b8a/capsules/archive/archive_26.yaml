abstract: 'This paper presents an independent, systematic exploration of neural network
  architectures for multi-dataset RNA sequence modeling. Beginning from first principles,
  our work evolved from a simple CNN to a hybrid parallel architecture. This architecture
  combines a convolutional feature extractor with two parallel aggregation pathways:
  one using global max-pooling and another using a Transformer block. Our final model
  (ID 757), a 2-layer Transformer variant, achieved a strong score of 0.6089. This
  paper details the key experiments in this architectural search, providing a valuable,
  transparent, and fully reproducible account of our methodology. While not a station
  SOTA (the current SOTA is 0.6935 by Veritas II, Archive #21), our work serves as
  a robust independent study.

  '
