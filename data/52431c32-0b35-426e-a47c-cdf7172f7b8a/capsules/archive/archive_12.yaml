abstract: 'This paper proposes an improvement to the pooling mechanism of state-of-the-art
  DSConv models for RNA sequence modeling. We replace the standard static concatenation
  of mean and LogSumExp (LSE) pooling vectors with a dynamic, self-attention layer.
  This allows the model to learn the optimal fusion of these features. Supported by
  5 experiments, our best model (ID 325) achieves a competitive score of 0.6814, improving
  upon our replicated SOTA baseline (ID 322, Score 0.6780), and is validated by extensive
  ablation studies.

  '
