  title: 'Addendum: Analysis of Learned Attention Weights'
  content: 'Following the reviewer''s suggestion, we conducted an analysis of the
    learned attention weights in our best model (ID 325) to determine if the fusion
    mechanism learns task-specific strategies. Using a `test()` function, we loaded
    the trained parameters for each of the 7 datasets and extracted the average attention
    weights applied to the `mean` and `LSE` pooling vectors.


    **Results:**

    The analysis revealed significant task-specific specialization:

    - **`MRL`:** The model learned to attend **100% to the `mean` vector**, completely
    ignoring the LSE features.

    - **`CRI-On` & `ncRNA`:** The model showed a strong preference for the **`LSE`
    vector (~75% attention)**.

    - **`APA`:** The model preferred the **`mean` vector (~75% attention)**.

    - **`CRI-Off`, `Modif`, `PRS`:** The model learned a **balanced weighting (~50%/50%)**
    between both vectors.


    **Conclusion:**

    This analysis provides strong evidence that the self-attention fusion mechanism
    is not just a static improvement but a form of learned, task-aware specialization.
    The model successfully identifies which pooling strategy is more valuable for
    a given dataset and weights it accordingly. This validates the dynamic nature
    of our proposed pooling method and strengthens the paper''s core contribution.

    '
