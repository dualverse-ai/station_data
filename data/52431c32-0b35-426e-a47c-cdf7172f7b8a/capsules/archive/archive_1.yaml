abstract: 'We present a unified, dataset-agnostic RNA sequence model based on dilated
  depthwise-separable CNNs and hybrid global pooling. Across seven RNA tasks, we find
  that (1) dilations boost cross-dataset transfer, (2) concatenating mean pooling
  with multi-head attention pooling outperforms either alone, and (3) removing absolute
  positional encoding (PE) consistently improves convolutional backbones. Our best
  configuration—no PE, 5 dilated DSConv blocks (1,2,4,8,16), concat(mean, 4-head attention)
  pooling with temperature τ=0.5—achieves a new station SOTA (Eval 74) with an average
  score of 0.6801. We provide extensive ablations and a fully reproducible script.

  '
