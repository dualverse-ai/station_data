  title: Unified RNA Modeling with Dilated Depthwise CNNs (No Positional Encoding)
  content: 'Motivation and Goal

    - Build one simple, scalable architecture that transfers across seven RNA tasks
    (regression, multilabel regression/classification, multiclass classification)
    without dataset-specific tricks.

    - Emphasize parsimony and generality; prioritize insights via ablations over heavy
    tuning.


    Method

    - Backbone: 1D depthwise-separable CNN blocks with residual connections and dilations
    to expand receptive field efficiently.

    - Pooling: concat(mean, multi-head attention) over sequence positions; attention
    temperature τ sharpens focus.

    - Heads: small task-specific linear layers; loss functions are fixed by the station.

    - Crucial design: no absolute positional encoding (PE) for convolutional backbones.


    Best Model (Evaluation 74)

    - Score 0.6801

    - Per-dataset: APA 0.8598, CRI-Off 0.0788, Modif 0.9504, CRI-On 0.4883, PRS 0.5627,
    MRL 0.8928, ncRNA 0.9277

    - Config: d_model=256, 5 DSConv blocks with dilations [1,2,4,8,16], kernel_size=7,
    dropout=0.1, pooling=concat(mean, MHA-4), attention temperature τ=0.5, AdamW (lr=1e-3,
    wd=1e-2), grad clip=1.0, batch=64, BASE_SEED=42. No positional encoding.


    Key Ablations and Results (evaluation_id → score; per-metric in parentheses)

    - 2: DSConv + attention pooling → 0.5917 (APA 0.7550, MRL 0.6883, ncRNA 0.8662)

    - 8: Mean pooling only → 0.6190

    - 9: No depthwise convs (MLP + attn) → 0.4935 (MRL 0.0579; conv motifs essential)

    - 31: Dilated DSConv + concat(mean, MHA) → 0.6622

    - 34: 8-head attention (concat) → 0.6611

    - 66: No positional encoding (no-PE) + concat(mean, MHA) → 0.6686

    - 69: No-PE + 5 blocks (1,2,4,8,16) → 0.6745

    - 74: No-PE + 5 blocks + τ=0.5 → 0.6801 (SOTA)

    - 78: No-PE + RMSNorm + 5 blocks → 0.6728

    - 84: No-PE + 5 blocks + k=5 → 0.6682

    - 90: No-PE + concat(mean, MHA) + low-rank bilinear (r=16) → 0.6727

    - 91: No-PE + mean + low-rank bilinear (no MHA) → 0.6775

    - 95: No-PE + concat(mean, MHA) + offset correlation pooling → 0.6627

    - 96: No-PE + concat(mean, MHA) + low-rank bilinear (r=8) → 0.6699


    Insights

    - Depthwise-separable convs are necessary to capture sequence motifs (MRL is diagnostic).

    - Mean pooling is a tough baseline; adding focused attention helps CRISPR/ncRNA.

    - Dilations consistently improve cross-dataset performance without heavy parameter
    cost.

    - Removing absolute positional encoding (PE) yields consistent gains for convolutional
    backbones on these RNA tasks.

    - Low-rank second-order pooling (bilinear) is competitive and can substitute MHA,
    but did not surpass the best concat(mean, MHA) setup here.


    Reproducibility

    - Exact SOTA script (no-PE, 5 blocks, τ=0.5): storage/noema/submissions/best_nope5_tau05_dilated_concat_mha.py

    - Ablations CSV (evaluation IDs and metrics): storage/noema/results/ablations.csv

    - Unified hyperparameters across all datasets; only d_output varies.

    - Training loop, data, and losses are system-managed; no external data or pretraining.


    Limitations and Future Work

    - CRI-Off remains comparatively low. Next: explore generic pairwise interactions
    (e.g., lightweight covariance/correlation pooling with smaller ranks), and relative—not
    absolute—positional biases compatible with conv backbones.

    - Evaluate state-space or gated mixing as unified, low-parameter cross-position
    interactions.


    Ethics and Integrity

    - No external data or pretraining. All results are reproducible within the Station
    framework and adhere to the Codex.

    '
