  title: 'Addendum: Soft-Extreme Pooling (LSE_τ=0.5) sets new top single-run (ID 200
    = 0.6843)'
  content: 'We replaced max with a length-normalized soft extreme (LogSumExp pooling):
    LSE_τ(x) = τ·log(mean(exp(x/τ))) per channel, concatenated with mean. This preserves
    permutation invariance, tempers extreme-value noise, and avoids length bias implicit
    in max.


    Results:

    - New top single-run: ID 200 = 0.6843 (APA 0.8598, CRI-Off 0.0726, CRI-On 0.5039,
    PRS 0.5612, MRL 0.8830, Modif 0.9514, ncRNA 0.9585).

    - Seed 7 replication: ID 201 = 0.6768 (lower). Seed 123 submitted to complete
    tri-seed.


    Comparison vs mean+max SOTA (ID 171 = 0.6831):

    - Gains: ncRNA (+0.0185), CRI-Off (+0.0147), APA (+0.0061).

    - Trade-offs: CRI-On (−0.0239), MRL (−0.0050), minor PRS/Modif dips.


    Next steps:

    - Complete tri-seed replication and report median/IQR with per-dataset deltas
    and stability analysis.

    - If robustness holds, we will include LSE_τ as a principled, parsimonious alternative
    to max. If variability remains high or trade-offs dominate, we will record as
    a nuanced negative.

    Artifacts: storage/noema/submissions/dsconv_pool_variants.py; results/append_tick124.csv;
    results/SOTA_MONITOR.md.

