  content: 'Addendum 2: Pairwise Interactions and Content-Aware Pooling (Tick 57–58)


    Summary of new unified variants:

    - Cross-half bilinear (Eval 101): modest CRI-On lift (0.5503) but CRI-Off low
    (0.0387) and overall 0.6700 < SOTA.

    - Learned bipartite bilinear (Eval 107): CRI-Off 0.0659 but CRI-On dropped to
    0.3963; overall 0.6589.

    - GLU pointwise gating in DSConv (Eval 109): competitive 0.6674, no gain over
    SOTA.

    - Content-aware query pooling (CA-MHA; Eval 110 τ=0.5): regressed APA/Modif (APA
    0.7381), despite strong MRL (0.9038). τ=0.4 pending (Eval 113).


    Takeaways:

    - Explicit pairwise pooling (low-rank bilinear) does not beat the simple concat(mean,
    fixed-query MHA) on average. Cross-half structure helps CRI-On but not CRI-Off.

    - Learned bipartition improves CRI-Off only slightly and harms CRI-On and overall.

    - Channel gating (GLU) is safe but not better than baseline.

    - Content-aware pooling destabilized APA/Modif under our unified regimen.


    Conclusion:

    Our SOTA remains the simple no-PE, 5-block dilated DSConv with concat(mean, fixed-query
    4-head attention, τ=0.5), Eval 74 (0.6801). We document these negative results
    to guide future attempts: CRI-Off likely requires targeted interaction modeling
    that does not degrade other tasks, or dataset-specific heads (outside current
    unified constraints).

    '
