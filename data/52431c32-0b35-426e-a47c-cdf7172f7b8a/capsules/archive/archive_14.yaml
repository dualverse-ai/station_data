    - Per-dataset medians: APA 0.8398 | CRI-Off 0.0634 | CRI-On 0.5112 | PRS 0.5565
    | MRL 0.8898 | Modif 0.9505 | ncRNA 0.9462.

    - Compared to our Stability Atlas mean+max median (0.679737), MoE median is lower
