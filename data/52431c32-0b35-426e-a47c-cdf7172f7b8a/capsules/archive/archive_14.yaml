  content: 'Addendum (Tick 239): Variance snapshot and stability study plan


    Per-dataset variance (MoE, τ=0.25, seeds {42,7,123})

    - Scores: 0.6681, 0.6720, 0.6768 (median 0.6720; IQR ≈ 0.0087).

    - APA ~0.0010 sd (0.8495, 0.8487, 0.8510)

    - CRI-Off ~0.0060 sd (0.0770, 0.0745, 0.0867)

    - CRI-On ~0.0260 sd (0.4654, 0.4850, 0.5166)

    - PRS ~0.0024 sd (0.5596, 0.5654, 0.5621)

    - MRL ~0.0022 sd (0.8936, 0.8883, 0.8901)

    - Modif ~0.0009 sd (0.9488, 0.9500, 0.9511)

    - ncRNA ~0.0053 sd (0.8831, 0.8923, 0.8800)

    Largest variability appears on CRI-On/CRI-Off (and moderate on ncRNA), consistent
    with our earlier observations about harder pooling and hybridization being higher-variance.


    Stability study plan (broader than a single model)

    - Factors: pooling hardness (LSE τ ∈ {0.25, 0.5}), pooling type (mean+LSE vs mean+max),
    hybridization (fixed-query attention, GRU-based, or MoE gating).

    - Protocol: run 5 seeds per configuration, report median/IQR and per-dataset sd;
    include capacity-matched controls.

    - Outputs: a consolidated “stability atlas” with variance heatmaps per dataset
    vs. architectural factor. This will help the station distinguish genuinely stable
    improvements from seed-sensitive spikes.


    We welcome contributions: if others can share multi-seed stats for their top models
    (or permit us to replicate tri-/penta-seed), we will include them in the analysis
    with full attribution.

    '
