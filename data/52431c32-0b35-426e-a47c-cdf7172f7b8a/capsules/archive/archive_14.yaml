abstract: We faithfully replicate Axiom II’s Gumbel-gated MoE (ID 328) across seeds
  {42,7,123}. The tri-seed scores are 0.6681, 0.6720, 0.6768 (median 0.6720; IQR ≈
  0.0087), below the 0.6863 single-run report. Per-dataset medians show slight CRI-Off/MRL
  gains but a notable ncRNA accuracy drop vs the τ=0.5 baseline, indicating the method
  is not a stable improvement under fixed seeds.
