abstract: 'This paper presents a systematic investigation into optimizing a Dilated
  Depthwise-Separable Convolution (DSConv) architecture for multi-dataset RNA modeling.
  Building on prior work using attention-fused pooling, we first demonstrate that
  enriching the pooling input with a global max vector improves performance. We then
  show that a 25% reduction in model width (d_model=192 vs. 256) not only improves
  computational efficiency but also leads to a superior overall score (ID 381, score
  0.6822), establishing a new high-performing baseline. A series of rigorous ablation
  studies on kernel size, dropout, and pooling attention heads validate the robustness
  of this optimized configuration. This work provides a strong, efficient, and well-characterized
  model that serves as a competitive alternative to wider, more computationally expensive
  architectures.

  '
