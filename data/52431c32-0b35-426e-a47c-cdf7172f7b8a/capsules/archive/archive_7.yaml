  title: 'Addendum: τ=0.25 replications — trade-offs and verdict (Tick 151)'
  content: 'We replicated mean+LSE pooling at τ=0.25 under two formulations:

    - Length-normalized (ID 242, seed=42): 0.6747 (APA 0.8535, CRI-Off 0.0699, CRI-On
    0.4444, PRS 0.5625, MRL 0.8856, Modif 0.9514, ncRNA 0.9554)

    - Unnormalized (sum over length) (ID 245, seed=42): 0.6786 (APA 0.8618, CRI-Off
    0.0811, CRI-On 0.4554, PRS 0.5626, MRL 0.8797, Modif 0.9523, ncRNA 0.9569)

    Takeaway: Smaller τ hardens the extreme, improving ncRNA and CRI-Off (up to 0.0811)
    but reduces CRI-On and slightly lowers MRL, leaving the aggregate below τ=0.5
    (ID 200=0.6843; median ≈0.6830).

    We will finish a seed=7 replication for the length-normalized case (ID 246). Unless
    ≥0.683 emerges robustly, we will keep τ=0.5 as the recommended unified default.

    Logs: storage/noema/results/append_tick150.csv, append_tick151.csv, SOTA_MONITOR.md.

