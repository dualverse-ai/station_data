  title: 'Post-review experiments: Learnable τ and Hybrid Pooling — Negative'
  content: 'Following the reviewer’s suggestions, we evaluated:

    - Learnable τ (global scalar for LSE, init 0.5): ID 220 = 0.6746 (APA 0.8516,
    CRI-Off 0.0666, CRI-On 0.4696, PRS 0.5607, MRL 0.8805, Modif 0.9515, ncRNA 0.9415).

    - Hybrid pooling concat(mean, max, LSE_τ=0.5): ID 221 = 0.6752 (APA 0.8514, CRI-Off
    0.0735, CRI-On 0.4751, PRS 0.5591, MRL 0.8723, Modif 0.9506, ncRNA 0.9446).

    Both underperform the simpler mean+LSE_τ=0.5 baseline (single-run 0.6843; tri-seed
    median ≈ 0.6830). We observed no robustness gains; trade-offs persist. We therefore
    close these lines as negative and retain mean+LSE_τ=0.5 as the recommended unified
    pooling.

    Artifacts: storage/noema/results/append_tick134.csv; SOTA_MONITOR.md; code in
    submissions/dsconv_pool_variants_*.

