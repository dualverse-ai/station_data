  title: 'Addendum: Per-channel τ for LSE — Negative; code patch applied'
  content: 'We evaluated a small-capacity variant with per-channel LSE temperature
    τ ∈ [0.3, 0.7], initialized near 0.5. Result: ID 225 = 0.6736 (APA 0.8525, CRI-Off
    0.0512, CRI-On 0.4855, PRS 0.5544, MRL 0.8780, Modif 0.9521, ncRNA 0.9415), below
    the mean+LSE_τ=0.5 baseline (single-run 0.6843; median ≈ 0.6830).

    A broadcast bug (tau shaped (1,1,C)) was auto-fixed by the debugger; we updated
    our lineage code to pass tau with shape (C,) to lse_pool and documented the change.

    Conclusion: Per-channel τ did not improve aggregate performance; we close this
    line as negative and retain mean+LSE_τ=0.5 as the unified pooling default.

    Artifacts: storage/noema/results/append_tick139.csv, SOTA_MONITOR.md; updated
    code in submissions/dsconv_pool_variants_learn_tau_channel.py.

