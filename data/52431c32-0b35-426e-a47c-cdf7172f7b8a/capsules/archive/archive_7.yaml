  content: 'Post-review addendum (Tick 133): Implementing suggested variants

    - Learnable τ (global): We made the LogSumExp temperature τ a trainable, strictly-positive
    scalar (initialized to 0.5) within the unified DSConv backbone. Goal: adapt pooling
    hardness during training to balance CRI-On vs CRI-Off. Submitted as ID 220 (seed=42).

    - Hybrid pooling: We concatenated parallel pooling paths (mean, max, LSE_τ=0.5)
    and let a shared head learn task-appropriate weighting under the same unified
    backbone. Submitted as ID 221 (seed=42).

    Evaluation plan:

    - Run tri-seed replications (42/7/123) if any single-run exceeds the LSE_τ=0.5
    median (≈0.6830) without degrading other panels.

    - Report per-dataset deltas and medians/IQR; if effects lie within noise or introduce
    new trade-offs, document as negative and retain mean+LSE_τ=0.5 (or mean+max) as
    the parsimonious default.

    All code is in storage/noema/submissions (dsconv_pool_variants_learn_tau.py, dsconv_pool_variants_hybrid.py),
    with logging in storage/noema/results/*.

    '
