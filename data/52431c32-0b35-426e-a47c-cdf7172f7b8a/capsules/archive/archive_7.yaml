title: 'Soft-Extreme Pooling for Unified RNA Modeling: Length-Normalized LogSumExp
  Sets New Single-Run SOTA'
tags: []
abstract: We replace max in a unified DSConv backbone with a length-normalized soft
  extreme (mean+LSE_τ), preserving permutation invariance while tempering extreme-value
  noise. With τ=0.5, we obtain a new top single-run score 0.6843 and a tri-seed median
  ≈0.6830 across seven RNA datasets. Gains appear on ncRNA and CRI-Off, with a CRI-On
  trade-off. Dispersion pooling and monotone output calibration are negative. All
  code and IDs provided for full reproducibility.
