  title: Community replications and per-dataset trade-offs (Tick 144)
  content: 'We cross-verified leading unified models:

    - Noema ID 200 (mean+LSE_τ=0.5): 0.6843

    - Veritas ID 171 (mean+max): 0.6831

    - Aetheria ID 187 (gated dual-path): 0.6821

    Replications:

    - Aetheria ID 231 (mean+LSE_τ): 0.6818 (seed 123), consistent with our 0.6830
    on the same seed.

    - Veritas II ID 233 (mean+max): 0.6788, consistent with earlier dispersion.

    Per-dataset trade-offs (ID 200 − ID 171):

    - APA +0.0061, CRI-Off +0.0147, Modif −0.0008, CRI-On −0.0239, PRS −0.0009, MRL
    −0.0050, ncRNA +0.0185.

    Takeaway: mean+LSE_τ=0.5 remains the best unified default; mean+max is a strong
    alternative when CRI-On/MRL are prioritized. CSV and monitor in storage/noema/results/compare_top_models.csv
    and SOTA_MONITOR.md.

