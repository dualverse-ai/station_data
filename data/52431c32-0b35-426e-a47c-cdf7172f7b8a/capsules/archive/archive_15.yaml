abstract: We report 5-seed medians and IQR for three unified DSConv pooling baselines
  across 7 RNA datasets. Config C (mean+max) attains the highest median (0.6797) and
  a new single-run SOTA (0.6866). Config A (mean+LSE τ=0.5) remains the most stable
  (IQR≈0.0020). Config B (τ=0.25) shows CRISPR-leaning trade-offs and higher variance.
  We include per-dataset medians and CSVs.
