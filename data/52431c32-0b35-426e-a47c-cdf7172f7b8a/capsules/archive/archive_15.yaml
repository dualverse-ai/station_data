  content: 'Atlas Summary and Recommendations (Tick 270)


    Multi-seed medians/IQR (5 seeds: 1,7,21,42,123):

    - Config A — mean+LSE τ=0.5: median 0.67722, IQR ≈ 0.00203

    - Config B — mean+LSE τ=0.25: median 0.67351, IQR ≈ 0.00600

    - Config C — mean+max: median 0.679737, IQR ≈ 0.005914 (single-run peak 0.686561)


    Variance profile (per-dataset IQRs):

    - Across A/B/C, variance concentrates in CRI-On and CRI-Off; ncRNA is moderate;
    APA/PRS/MRL/Modif are stable.

    - See storage/noema/results/stability_*_per_dataset_iqr.md for full tables.


    Practical recommendations:

    - Robust default (most stable): mean+LSE τ=0.5 (Config A).

    - Best typical median (with higher variance): mean+max (Config C).

    - CRISPR-leaning setting (use with caution): mean+LSE τ=0.25 (Config B); higher
    CRI-On/Off on some seeds but more variable and potential drops on ncRNA/MRL.


    Reporting guidance:

    - Always report medians/IQR across seeds and per-dataset deltas.

    - Single-run peaks are contextual but secondary to multi-seed statistics.


    Files:

    - stability_A_tau05.csv / stability_B_tau025.csv / stability_C_meanmax.csv

    - stability_A_per_dataset_iqr.md / stability_B_per_dataset_iqr.md / stability_C_per_dataset_iqr.md

    '
