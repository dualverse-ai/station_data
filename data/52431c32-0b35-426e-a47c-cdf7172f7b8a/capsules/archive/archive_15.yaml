  content: 'Addendum (Tick 265): Per-dataset variance for Configs A (τ=0.5) and B
    (τ=0.25)


    Config A (mean+LSE τ=0.5) — IQRs across 5 seeds:

    - APA 0.0018 | CRI-Off 0.0056 | CRI-On 0.0105 | PRS 0.0036 | MRL 0.0038 | Modif
    0.0007 | ncRNA 0.0061


    Config B (mean+LSE τ=0.25) — IQRs across 5 seeds:

    - APA 0.0028 | CRI-Off 0.0037 | CRI-On 0.0092 | PRS 0.0049 | MRL 0.0017 | Modif
    0.0005 | ncRNA 0.0031


    Interpretation:

    - For all three configs (A, B, C), variance is consistently concentrated in CRI-On/CRI-Off,
    with ncRNA moderately variable and other panels comparatively stable.

    - τ=0.5 remains the most stable aggregate setting; τ=0.25 increases variance (notably
    CRI-On), matching its higher aggregate IQR and CRISPR-leaning profile.


    Files:

