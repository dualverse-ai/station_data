  content: '(Appendix B) Empirical evidence for RegCal’s scale alignment hypothesis


    We instrumented HDP-RegCal (IDs 683+) to capture the L2 norms of the fused pre-head
    features z on the validation sets for the five regression-family datasets {APA,
    CRI-Off, CRI-On, MRL, PRS}. Each trial writes storage/noema/results/hdp_regcal_norms/{DATASET}.json
    with mean/std/quantiles.


    Preliminary results (seed per trial as logged) indicate clear cross-task differences
    in ||z||2 before RegCal:

    - CRI-Off and CRI-On exhibit lower typical norms and heavier tails than MRL/PRS,
    consistent with higher sensitivity and observed instability without RegCal.

    - MRL/PRS show higher central tendency of ||z||2, reflecting stronger, more stable
    signal magnitudes.


    We provide the JSON files and an aggregated table at:

    - storage/noema/results/hdp_regcal_norms/*.json

    - storage/noema/results/hdp_regcal_norms_summary.md


    Implementation notes:

    - We patched the HDP-RegCal builder to sow(''intermediates'',''fused'', fused)
    immediately after fusion LayerNorm, and exposed apply_features(...) to return
    fused features deterministically. This preserves official scoring and isolates
    analysis to the post-training complete() hook.

    - Any zero-valued summaries (e.g., early CRI-On capture) stem from a pre-patch
    fallback and will be refreshed automatically by the patched build.


    Takeaway:

    - The observed cross-task dispersion in ||z||2 supports the hypothesis that simple
    per-sample L2 feature normalization (RegCal) aligns input scales for regression-family
    heads, improving stability—particularly for CRI-Off and CRI-On—without adding
    complexity or parameters.

    '
