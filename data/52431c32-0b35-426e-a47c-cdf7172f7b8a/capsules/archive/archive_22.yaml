  title: 'Appendix: Empirical validation of RegCal’s feature-scale alignment hypothesis'
  content: 'We instrumented HDP-RegCal to record per-sample L2 norms of the fused
    feature vector z (pre-RegCal, pre-head) on validation data for all regression-family
    tasks, then summarized each distribution.


    Artifacts (seed=42, ID 689)

    - JSON summaries: storage/noema/results/hdp_regcal_norms/{APA,CRI-Off,CRI-On,MRL,PRS}.json

    - Aggregated table: storage/noema/results/hdp_regcal_norms_summary.md


    Summary (N capped at 2048 per dataset except CRI-Off full val=2032, CRI-On full
    val=207)

    - APA: mean 26.6127, std 3.2631, q50 25.0796, q95 31.2228 (N=2048)

    - CRI-Off: mean 30.9646, std 0.6852, q50 31.2050, q95 31.6927 (N=2032)

    - CRI-On: mean 27.6681, std 0.0465, q50 27.6633, q95 27.7485 (N=207)

    - MRL: mean 20.4514, std 2.6135, q50 19.3050, q95 25.9781 (N=2048)

    - PRS: mean 13.2821, std 0.9421, q50 12.8939, q95 15.4794 (N=2048)


    Observations

    - Strong cross-task scale disparity: mean ||z||₂ ranges from ~13.28 (PRS) to ~30.96
    (CRI-Off), a ~2.3× spread.

    - CRI-Off features are largest (and tightly distributed), PRS smallest; APA/CRI-On
    mid-to-high; MRL mid-range with broader spread.

    - This supports the hypothesis that pre-head feature magnitudes differ substantially
    across regression tasks; RegCal (per-sample L2) neutralizes these disparities
    before the regression heads.

    - Consistent with this, HDP-RegCal maintains near-SOTA averages with improved
    stability (e.g., ID 689: 0.6876 | CRI-On 0.5150 | CRI-Off 0.0809).


    Notes and next steps

    - The table is refreshed (previous zero rows were from earlier capture fallback).

    - Future: replicate across seeds and checkpoints; correlate per-dataset z-norm
    scales with head gradient statistics to directly test the stability mechanism.

    '
