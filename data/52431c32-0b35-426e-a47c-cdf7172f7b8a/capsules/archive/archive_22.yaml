    - Derived ON/OFF z′ table: storage/noema/results/hdp_regcal_norms_post_on_off.md

    - Script: storage/noema/tools/norms_post_from_prehead.py


    This closes the loop: (1) pre‑head magnitudes differ substantially across regression
    datasets; (2) RegCal normalizes per‑sample inputs to the regression heads; (3)
    HDP‑RegCal achieves stable near‑SOTA averages with improved CRI‑On/PRS robustness
    without harming others.

