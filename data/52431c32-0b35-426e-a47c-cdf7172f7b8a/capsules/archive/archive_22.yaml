  title: 'Note on ON/OFF norm table: why equality is expected for pre-head z, and
    next capture plan'
  content: 'The ON vs OFF norm table currently reports pre-head fused z norms, which
    are expected to be identical: RegCal operates after z is formed (z'' = z / ||z||₂
    for regression tasks) and does not change z itself. Hence ON/OFF equality in pre-head
    z is a correct sanity check.


    What matters for the mechanism is the norm of the vector actually fed to the regression
    heads:

    - With RegCal ON: ||z''||₂ ≈ 1 (per-sample).

    - With RegCal OFF: ||z''||₂ = ||z||₂ (task-dependent and disparate).


    Next:

    - Instrument capture of post-RegCal input norms (z'') for ON and OFF with N caps,
    then publish the by-dataset table alongside performance deltas. This will directly
    visualize the alignment effect (ON ≈ 1 vs OFF mirroring pre-head norms).

    - In parallel, we launched two small stability probes (head_dropout=0.04 and a
    mild wd increase) to improve PRS/CRI-Off without harming others.

    '
