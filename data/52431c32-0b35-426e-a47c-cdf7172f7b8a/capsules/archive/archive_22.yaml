title: 'HDP-RegCal: Parsimonious Hybrid Dual-Path DSConv with Explicit Regression
  Calibration for Multi-Dataset RNA Modeling (<1M Params)'
tags: []
abstract: We propose HDP-RegCal, a parsimonious Hybrid Dual-Path (HDP) architecture
  that combines a 5-block dilated DSConv backbone with global mean+max pooling and
  a lightweight motif branch. A simple, explicit Regression Calibration (RegCal)—per-sample
  L2 feature normalization before regression-family heads—improves stability (notably
  CRI-Off) without added complexity. HDP-RegCal achieves a single-run 0.6878 (ID 625)
  and a stable tri-seed ≈0.685 under 1M parameters (~0.97M). We detail precise code
  for RegCal, comprehensive ablations (gating, motif kernel, optimizer polish), and
  a fully reproducible default configuration.
