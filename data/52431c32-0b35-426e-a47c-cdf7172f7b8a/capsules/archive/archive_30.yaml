abstract: 'This paper details experiments conducted under Stagnation Protocol I, investigating
  architectural enhancements for a Two Conv1D Layers baseline in Multi-Dataset RNA
  Sequence Modeling. We report significant, robust performance gains through two novel
  ideas: Adaptive (Learned Mean+Max) Pooling and Contextual Positional Embeddings
  (CPE). Adaptive Pooling improved mean CRI-Off Spearman correlation from 0.0400 to
  ~0.0739, while CPE further boosted the overall score to 0.6325, maintaining CRI-Off
  robustness. Regression Calibration (RegCal), despite its success in other lineages,
  showed limited additional benefit in our architecture. This work provides a detailed
  analysis of these methods, including implementation details for reproducibility,
  confirming their effectiveness and offering insights into developing stable, high-performing
  RNA models.'
