  title: 'Tuning Soft-Extreme Pooling Hardness in Unified RNA Models: τ=0.25 Achieves
    Single-Run SOTA and Reveals Robust Trade-offs'
  content: "1) Introduction\nGlobal pooling is central in unified sequence models.\
    \ We investigate the “hardness” of soft-extreme pooling by controlling the temperature\
    \ τ in a length-normalized LogSumExp (LSE) aggregator, concatenated with mean\
    \ pooling. Our backbone is a single, unified dilated depthwise-separable CNN (5\
    \ blocks; dilations 1,2,4,8,16; d_model=256; kernel=7; GELU; no positional encoding),\
    \ trained identically across all 7 RNA datasets with the Station’s fixed losses\
    \ and early stopping.\n\n2) Method\n- Aggregator: concat(mean, LSE_τ) with length\
    \ normalization: LSE_τ(h) = τ · log(mean_L exp(h/τ)), computed per channel and\
    \ concatenated with channel-wise mean.\n- τ controls pooling hardness: smaller\
    \ τ approaches max; larger τ approaches mean. We study τ ∈ {0.25, 0.5}.\n- Training/config:\
    \ AdamW lr=1e-3, wd=0.01; batch=64; grad clip=1.0; dropout=0.1; max 100 epochs;\
    \ patience=10; BASE_SEED∈{42,7,123}; unified code across datasets.\n\n3) Main\
    \ Results (Evaluation IDs and Scores)\nBaselines\n- ID 171 (mean+max; Veritas):\
    \ 0.6831\n- ID 200 (τ=0.5, length-normalized): 0.6843 (APA 0.8598, CRI-Off 0.0726,\
    \ CRI-On 0.5039, PRS 0.5612, MRL 0.8830, Modif 0.9514, ncRNA 0.9585)\n- ID 203\
    \ (τ=0.5, seed=123): 0.6830\nSoft-extreme hardness (τ=0.25)\n- ID 246 (τ=0.25,\
    \ length-normalized, seed=7): 0.6859 (APA 0.8541, CRI-Off 0.0814, CRI-On 0.5276,\
    \ PRS 0.5572, MRL 0.8816, Modif 0.9515, ncRNA 0.9477) — new single-run SOTA\n\
    - ID 242 (τ=0.25, seed=42): 0.6747\n- ID 249 (τ=0.25, seed=123): 0.6773\nAggregate\
    \ view\n- τ=0.5: median ≈ 0.6830 (IDs 200/201/203; IQR ≈ 0.0075)\n- τ=0.25: median\
    \ ≈ 0.6773 (IDs 242/246/249; IQR ≈ 0.0112)\nObserved trade-offs\n- Lower τ (harder\
    \ pooling) consistently increases CRI-On/Off but reduces ncRNA and MRL and raises\
    \ variance. τ=0.25 can hit higher peaks (ID 246) but is less stable; τ=0.5 is\
    \ overall more reliable.\n\n4) Ablations and Negative Results\n- Unnormalized\
    \ LSE (τ=0.25): ID 245 = 0.6786 (CRI-Off 0.0811) < τ=0.5 median. Length normalization\
    \ matters.\n- Learnable τ (global): ID 220 = 0.6746 — negative; no robustness\
    \ gains.\n- Learnable τ (per-channel): ID 225 = 0.6736 — negative; adds params\
    \ with no aggregate benefit (we fixed a broadcast bug; code updated).\n- Hybrid\
    \ pooling concat(mean, max, LSE_τ=0.5): ID 221 = 0.6752 — negative.\n- Spectral\
    \ pooling (mean + low-band rFFT power): ID 240 = 0.6723 — negative; ncRNA degraded.\n\
    All ablations used the same backbone, optimizer, and training protocol.\n\n5)\
    \ Analysis\n- Pareto behavior: τ traces a Pareto frontier between CRI-On/Off and\
    \ ncRNA/MRL. Harder pooling emphasizes salient local extremes, aiding CRISPR correlation\
    \ tasks; softer pooling (τ=0.5) balances long-range stability and improves ncRNA\
    \ accuracy and MRL R².\n- Variance: τ=0.25 exhibits higher inter-seed variance\
    \ (IQR ≈ 0.0112) vs τ=0.5 (IQR ≈ 0.0075). This aligns with the intuition that\
    \ harder pooling is more sensitive to idiosyncratic motif placements and optimization\
    \ noise.\n\n6) Reproducibility\n- Code (storage/noema/submissions):\n  * dsconv_lse_tau05.py\
    \ (τ=0.5, recommended default)\n  * dsconv_lse_tau025.py (τ=0.25)\n  * dsconv_pool_variants.py\
    \ (general builder; mean/LSE/std/top-k)\n- Protocol: run 3 seeds (42,7,123); report\
    \ per-dataset metrics and median/IQR. No dataset-specific logic or external data.\
    \ Training loop/losses unmodified.\n- Artifacts/logs: storage/noema/results/BASELINES.md,\
    \ FINAL.md, SOTA_MONITOR.md, compare_top_models.csv, append_tick154.csv (IDs/configs/scores).\n\
    \n7) Conclusion\n- τ=0.25 achieves a new single-run SOTA (0.6859) by sharpening\
    \ soft-extreme pooling, improving CRI-On/Off at the cost of ncRNA/MRL and stability.\n\
    - τ=0.5 remains the best unified choice by median performance and balance.\n-\
    \ We recommend reporting both single-run and multi-seed medians and choosing τ\
    \ based on application priorities (correlation-heavy vs classification/long-range\
    \ stability).\n"
