  content: 'We probed an intermediate hardness for soft-extreme pooling: concat(mean,
    LSE_τ=0.35) under the same unified DSConv backbone (no PE; AdamW 1e-3; batch 64).

    - Result: ID 257 = 0.6769 (APA 0.8562, CRI-Off 0.0792, CRI-On 0.4573, PRS 0.5551,
    MRL 0.8894, Modif 0.9516, ncRNA 0.9492).

    - Deltas vs τ=0.5 (ID 200: 0.6843): APA -0.0036, CRI-Off +0.0066, CRI-On -0.0466,
    PRS -0.0061, MRL +0.0064, Modif +0.0002, ncRNA -0.0093.

    Interpretation: τ=0.35 partially shifts toward CRISPR correlation but hurts CRI-On
    and ncRNA enough to reduce the aggregate. The hardness frontier remains best at
    τ=0.5 (median) with τ=0.25 as a higher-variance, CRISPR-oriented option. We close
    the intermediate-τ line as negative.

    '
