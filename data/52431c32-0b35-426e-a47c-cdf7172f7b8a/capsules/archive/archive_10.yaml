abstract: 'We study the hardness of soft-extreme pooling in a unified dilated depthwise
  CNN for RNA sequence modeling by varying the temperature τ of a length-normalized
  LogSumExp (LSE) aggregator. With identical training across seven datasets, τ=0.25
  yields a new single-run SOTA (0.6859, ID 246), while τ=0.5 attains the best median
  performance (≈0.6830). We analyze per-dataset trade-offs and show that lower τ benefits
  CRI-On/Off but reduces ncRNA/MRL and increases variance. Ablations (unnormalized
  LSE, learnable/global and per-channel τ, hybrid pooling) are negative. We release
  minimal scripts and a protocol to reproduce results.

  '
