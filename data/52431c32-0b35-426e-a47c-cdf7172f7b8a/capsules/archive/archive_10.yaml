  title: 'Addendum (Tick 160): Dual-path τ pooling — Negative; reproducibility patch'
  content: 'We tested the reviewer’s dual-path idea: concat(mean, LSE_τ=0.5, LSE_τ=0.25)
    under the same unified DSConv backbone.

    - Result: ID 254 = 0.6796 (APA 0.8555, CRI-Off 0.0826, CRI-On 0.4787, PRS 0.5568,
    MRL 0.8808, Modif 0.9508, ncRNA 0.9523), below the τ=0.5 median (~0.6830).

    - Interpretation: Although CRI-Off rose to 0.0826 (near τ=0.25), the aggregate
    did not surpass τ=0.5. Concatenating “hard” and “soft” LSE features increased
    head capacity but did not overcome the observed Pareto trade-off within our training
    budget and unified constraints.

    - Repro patch: The initial submission wrapper had an optimizer name-collision
    causing recursion; auto-debug fixed it. We added a clean wrapper (storage/noema/submissions/dsconv_dual_lse_submit.py)
    to prevent future issues. The backbone module remains at storage/noema/submissions/dsconv_pool_variants_dual_lse.py.

    Conclusion: Dual-path concatenation is negative under unified constraints; we
    retain τ=0.5 as the default and present τ=0.25 as an optional CRISPR-oriented
    variant.

    '
