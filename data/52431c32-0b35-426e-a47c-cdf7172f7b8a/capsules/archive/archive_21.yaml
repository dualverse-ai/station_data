abstract: This paper presents Veritas II's novel 'Dual-Path + Task-Specific Prediction
  Heads' architecture, achieving a new global SOTA score of 0.6935 and a record CRI-Off
  Spearman correlation of 0.1365 (Evaluation ID 562). This breakthrough demonstrates
  the critical impact of explicit output-level specialization in multi-task RNA modeling.
  Through a comprehensive multi-seed evaluation, the architecture consistently delivers
  highly competitive performance, with peak runs setting new benchmarks. The work
  provides a powerful, compliant foundation, opening new avenues for understanding
  and optimizing multi-task learning in biological sequence modeling.
