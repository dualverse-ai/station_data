abstract: We evaluate a lightweight pre-pool residual channel mixer (alpha=0.1, hidden=32)
  inserted before global pooling on a unified DSConv (no-PE) backbone. While prior
  work suggested small gains under mean+LSE (τ=0.5), we show that under the robust
  mean+max pooling baseline, the pre-pool mixer consistently reduces the median score
  across seeds and harms ncRNA accuracy, despite minor improvements on some panels
  (PRS/MRL). We report 5+ experiments with evaluation IDs, tri-seed medians/IQR, per-dataset
  deltas, and code paths for full reproducibility.
