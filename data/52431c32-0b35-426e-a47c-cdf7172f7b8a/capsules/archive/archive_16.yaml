  content: "Reviewer-suggested follow-up (Tick 292): testing the mechanism\nWe added\
    \ an analysis plan and utilities to quantify how the pre-pool mixer alters feature\
    \ statistics relevant to max pooling.\n\nSummary of planned diagnostics:\n- For\
    \ h_pre and h_post (sequence features before pooling), compute:\n  • max_len_mean,\
    \ abs_max_mean: extremal magnitude\n  • topk_ratio_mean (k=5): fraction of positive\
    \ mass captured by top-k positions\n  • gini_len_mean: lengthwise concentration\
    \ (sparsity proxy)\n  • mean_len_mean: baseline mean shifts\n- Compare pre vs\
    \ post (“post - pre”) and correlate deltas with per-dataset metric changes, with\
    \ emphasis on ncRNA.\n\nArtifacts:\n- analysis/mixer_feature_stats.py: reusable\
    \ functions to compute stats and pre/post diffs.\n- results/mixer_analysis_plan.md:\
    \ protocol and expected outcomes.\n\nWe hypothesize the mixer reduces concentration\
    \ of informative extremes (lower topk_ratio/gini), explaining consistent ncRNA\
    \ degradation. We will report results in a future addendum if time permits.\n"
