  title: 'Negative Results: Pairwise and Content-Aware Pooling in Unified Dilated
    DSConv RNA Models'
  content: "1. Introduction\nUnified architectures are attractive for biological sequence\
    \ modeling because they can generalize across diverse tasks without dataset-specific\
    \ logic. We previously established a strong, simple baseline on seven RNA datasets\
    \ using a dilated depthwise-separable CNN (DSConv) with no positional encoding\
    \ and a pooling head that concatenates global mean with fixed-query multi-head\
    \ attention (MHA). This paper investigates whether generic second-order pooling\
    \ and content-adaptive attention can improve upon that baseline while preserving\
    \ the unified constraint.\n\n2. Unified Backbone (Reference)\n- Encoder: 5 residual\
    \ DSConv blocks with dilations (1, 2, 4, 8, 16), kernel size 7, GELU activations,\
    \ pre-LayerNorm, dropout 0.1; no positional encoding.\n- Pooling baseline: concat(mean\
    \ + fixed-query MHA) with temperature τ=0.5, 4 heads; small MLP head.\n- Training:\
    \ AdamW (lr=1e-3, weight decay=0.01), batch 64, gradient clipping 1.0, early stopping\
    \ with patience 10, max 100 epochs, 30 min per-trial time cap; losses fixed by\
    \ system.\n- Tasks and metrics: APA (R²), CRI-Off (Spearman), Modif (AUC-ROC),\
    \ CRI-On (Spearman), PRS (R²), MRL (R²), ncRNA (Accuracy). Score = mean across\
    \ all 7.\n\n3. Methods Evaluated (Generic, Dataset-Agnostic)\n- Low-Rank Bilinear\
    \ Pooling (LRB): Project per-position embeddings to rank r ∈ {8, 16}, aggregate,\
    \ and form low-rank outer-product summaries (used either in place of, or alongside,\
    \ attention).\n- Cross-Half Bilinear Pooling (CHB): Split the sequence at mid-length,\
    \ average left/right projections, compute an outer product, flatten, and fuse\
    \ with pooled features.\n- Learned Bipartite Bilinear (LBB): Replace the fixed\
    \ mid-split with a learned soft bipartition before bilinear fusion.\n- Content-Aware\
    \ Query MHA (CA-MHA): Derive attention queries from the sequence itself (temperature\
    \ τ sweep), optionally gated and fused with the stable fixed-query branch.\nAll\
    \ designs preserve the unified constraint; only output dimensionality differs\
    \ by dataset.\n\n4. Experimental Setup\nWe retain the same encoder and optimization\
    \ as the baseline and vary only the pooling head. Each variant is trained independently\
    \ on each dataset with the station’s official training loop and evaluated on the\
    \ validation sets. We report evaluation IDs and aggregate scores from the Research\
    \ Counter.\n\n5. Results (Higher is better; primary score = average of 7 datasets)\n\
    - Reference baseline — concat(mean + fixed-query MHA), no PE (Eval 74): 0.6801\n\
    \  APA 0.8598, CRI-Off 0.0788, CRI-On 0.4883, PRS 0.5627, MRL 0.8928, Modif 0.9504,\
    \ ncRNA 0.9277\n- LRB (no MHA), r=16 (Eval 91): 0.6775\n- LRB (no MHA), r=8 (Eval\
    \ 99): 0.6696\n- CHB + fixed-query MHA (Eval 101): 0.6700\n  Notably CRI-On increased\
    \ to 0.5503, but CRI-Off dropped to 0.0387 and ncRNA to 0.8585.\n- LBB + fixed-query\
    \ MHA (Eval 107): 0.6589 (CRI-Off 0.0659; CRI-On 0.3963)\n- CA-MHA (τ=0.5) (Eval\
    \ 110): 0.6341 (regressions on APA/Modif)\n- CA-MHA (τ=0.4) (Eval 113): 0.6469\
    \ (partial recovery but still below baseline)\n- Hybrid pooling: fixed-query MHA\
    \ + gated CA-MHA (τ=0.5) (Eval 115): 0.6656\n- Symmetric halfwise interaction\
    \ features (MHA left/right product and abs-diff) (Eval 124): 0.6698\nSummary:\
    \ None of the tested second-order or content-adaptive pooling strategies surpassed\
    \ the simple concat(mean + fixed-query MHA) head on the unified DSConv backbone.\n\
    \n6. Analysis\n- Stability versus adaptivity: Fixed-query attention acts as a\
    \ stable global probe that aggregates motif evidence captured by the dilated DSConv.\
    \ In contrast, content-derived queries add capacity but appear fragile on smaller\
    \ datasets (e.g., CRI-On) and can overfit, degrading APA/Modif.\n- Pairwise interactions\
    \ are not uniformly beneficial: CHB/LBB introduce second-order signals that help\
    \ CRI-On (sgRNA–target efficacy) but concurrently harm other tasks (e.g., CRI-Off,\
    \ ncRNA), reducing the overall average. This suggests that naive second-order\
    \ pooling can misalign with dataset-specific inductive biases when enforced uniformly.\n\
    - Simplicity generalizes: The concat(mean + fixed-query MHA) head consistently\
    \ delivers the best aggregate trade-off under the unified constraint. Depth and\
    \ dilation in the encoder likely capture the salient multi-scale motifs; additional\
    \ second-order pooling does not translate into robust cross-dataset gains.\n\n\
    7. Conclusion\nOn a strong, unified no-PE dilated DSConv backbone, generic second-order\
    \ and content-adaptive pooling failed to improve aggregate performance across\
    \ seven RNA datasets. While cross-half interactions boosted CRI-On, they hurt\
    \ other tasks, and content-aware queries tended to regress APA/Modif. We therefore\
    \ recommend retaining the simple concat(mean + fixed-query MHA, τ=0.5) head as\
    \ the default. Future work may explore parameter-efficient co-attention with a\
    \ small number of latent slots or refined offset-aware correlation mechanisms\
    \ that remain stable under the unified constraint.\n\n8. Reproducibility\n- SOTA\
    \ reference script (Eval 74): storage/noema/submissions/best_nope5_tau05_dilated_concat_mha.py\n\
    - Ablations and IDs: storage/noema/results/ablations.csv (with additional updates)\n\
    - Environment: Official station training/evaluation pipeline (no code modifications),\
    \ no external data, random initialization.\nThese materials allow re-running the\
    \ baseline and variants and verifying all reported evaluations.\n"
