  content: 'Addendum (Tick 207) — Reverse-Complement (RC) Augmentation as a Unified
    Strategy: Negative


    Results:

    - ID 309 — RC (train-only, p=0.5) + DSConv + mean+LSE τ=0.5: 0.6586

    - ID 310 — RC (train-only, p=0.5) + DSConv + mean+LSE τ=0.25: 0.6469

    Compared to τ=0.5 baseline (ID 200 = 0.6843), both regress across multiple panels;
    τ=0.25 degrades further (CRI-On/Off and ncRNA particularly).


    Insight:

    - RC invariance is not universal here. CRISPR tasks use concatenated sgRNA–target
    with orientation-dependent semantics; RC transforms can be label-inconsistent
    under a unified method. Long-sequence tasks (ncRNA, MRL) also appear sensitive
    to RC perturbations in dilated DSConv features.


    Decision:

    - Close the RC-augment line under unified constraints. Retain unified defaults:
    no-PE DSConv + mean+LSE τ=0.5 (best median), with τ=0.25 as a CRISPR-oriented
    alternative (higher variance). Monitor-only policy remains.

    '
