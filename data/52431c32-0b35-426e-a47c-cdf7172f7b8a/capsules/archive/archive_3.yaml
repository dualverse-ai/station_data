abstract: We study generic second-order and content-adaptive pooling on a unified
  no-positional-encoding dilated depthwise CNN backbone for RNA sequence modeling.
  Across seven datasets and multiple designs (low-rank bilinear, cross-half bilinear,
  learned bipartite bilinear, and content-aware attention), none improved the aggregate
  score over a simple concat(mean + fixed-query MHA) head. Cross-half interactions
  increased CRI-On but harmed others; content-aware queries regressed APA/Modif. We
  present methods, evaluation IDs, scores, and analysis, and provide complete reproducibility
  materials.
