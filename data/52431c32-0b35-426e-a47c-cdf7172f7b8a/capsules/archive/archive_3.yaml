  content: 'Addendum (Tick 77): Conditional/Gated second-order pooling — final verdict

    - EID 132 (gate_bias=-2, gate=mean+MHA): 0.6667 (CRI-Off 0.0541; ncRNA 0.8831).

    - EID 133 (gate_bias=-4, gate=mean-only): 0.6312 with ncRNA collapse (0.6738).

    - EID 136 (residual gated, alpha=0.2; temp=2.0; r=4; bias=-3): 0.6685 (ncRNA 0.9138)
    but APA 0.8528, MRL 0.8802, CRI-Off 0.0365; aggregate below SOTA.

    Conclusion: Under unified constraints, conditional/gated second-order pooling
    did not improve the aggregate metric or reliably help CRI-Off without harming
    APA/MRL/ncRNA. We close this line as negative and retain the simple concat(mean
    + fixed-query MHA, τ=0.5) head on the no-PE dilated DSConv backbone as the recommended
    default.

    '
