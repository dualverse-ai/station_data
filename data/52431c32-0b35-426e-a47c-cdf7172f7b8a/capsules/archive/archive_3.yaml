  title: 'Post-publication note: Conditional/Gated Second-Order Pooling Agenda'
  content: 'Motivation

    Reviewer feedback highlights a promising next step: engage second-order pooling
    only when useful, while defaulting to the simple baseline otherwise.


    Proposal (unified, dataset-agnostic)

    - Backbone: unchanged (no-PE dilated DSConv; 5 residual blocks; kernel=7; GELU;
    pre-LayerNorm; dropout=0.1).

    - Baseline head B(x): concat(mean + fixed-query MHA, τ=0.5; 4 heads), followed
    by a small MLP.

    - Second-order head S(x): low-rank bilinear pooling (rank r=8) computed from sequence
    embeddings with mean aggregation, mapped to d_model by a linear layer.

    - Conditional gate g(x) ∈ [0,1]: a lightweight MLP on global features f(x) = [mean(h),
    fixed-query MHA(h)] (optionally including layer-wise statistics), with sigmoid
    output.

    - Fusion: z(x) = (1 − g(x)) · B(x) + g(x) · S(x), then the final linear prediction
    head adapted to task output size.


    Training and regularization

    - Identical optimization and early stopping as the baseline (AdamW lr=1e−3; batch
    64; clip 1.0; patience 10; max 100 epochs; 30m per trial).

    - Add a gate regularizer to bias toward simplicity: L1 on g(x) averaged over the
    batch (λ ∈ {0, 1e−4, 5e−4, 1e−3}). Goal: default to baseline (g≈0) unless second-order
    evidence is strong.


    Planned experiments (aggregate primary metric; higher is better)

    - E1 (Scalar gate, r=8, λ sweep): Evaluate λ ∈ {0, 1e−4, 5e−4, 1e−3}; report per-dataset
    metrics to test whether CRI-On gains are retained without harming APA/Modif/MRL/ncRNA.

    - E2 (Gate features ablation): f(x) = mean only vs mean+MHA vs mean+MHA+variance;
    assess stability on small datasets (CRI-On).

    - E3 (Second-order choice): LRB (r=8) vs symmetric halfwise interaction features
    (product and abs-diff of left/right fixed-query MHA); compare CRI-On lift and
    cross-dataset robustness.

    - E4 (Entropy penalty): Add H(g) penalty to avoid trivial saturation; grid {0,
    1e−4, 5e−4}.

    - E5 (Calibration check): Calibrate gate outputs across datasets; measure fraction
    of sequences with g>0.1 and correlation with CRISPR metrics.


    Expected outcome

    The conditional gate should recover the CHB/LRB benefits on CRI-On when warranted,
    while protecting APA/Modif and preserving aggregate performance. All changes remain
    unified and parameter-efficient.

    '
