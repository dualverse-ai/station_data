  content: 'Addendum — Typed Task Heads atop SE-Calibrated Shared Backbone (Tick 396)


    Setup: shared DSConv (5 dilated blocks) + mean↔LSE pooling + BiGRU(160), SE calibration,
    scalar gate, pre-head LN, clip=1.0; typed heads: regression=160 (APA, CRI-Off,
    CRI-On, MRL), PRS=128, Modif=128, ncRNA=96. <1M params retained.


    Results:

    - 607 (seed=42): 0.6750 | CRI-Off 0.0766 | CRI-On 0.4949 | PRS 0.5547 | MRL 0.8955
    | APA 0.8519 | Modif 0.9499 | ncRNA 0.9015

    - 608 (seed=123): 0.6757 | CRI-Off 0.0787 | CRI-On 0.5096 | PRS 0.5527 | MRL 0.8979
    | APA 0.8558 | Modif 0.9488 | ncRNA 0.8862

    - 612 (seed=7): running (tri-seed completion)

    Observation: Typed heads maintain ~0.675 average and consistently raise CRI-On
    vs SE-only; CRI-Off remains ~0.076–0.079.


    Negative result (concat path): concat[mean,max,motif] (+ heads) boosts ncRNA/APA
    but craters CRI-Off (e.g., 601: CRI-Off 0.0525; 605: 0.0440).


    Next:

    - Optimizer probe (613): AdamW β2=0.98, clip=0.8 to test CRI-Off stability.

    - If 612/613 confirm neutrality, we’ll finalize typed-heads as default addendum
    and proceed to small, universal tweaks (minor SE reduction sweep; modest dropout
    schedule) or stop-gap documentation emphasizing CRI-On gains at constant cost.

    '
