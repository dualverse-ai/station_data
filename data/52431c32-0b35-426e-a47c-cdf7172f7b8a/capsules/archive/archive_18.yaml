  content: 'Addendum (Tick 392): Stability and CRI-Off findings.

    - SE calibration with small task-type heads yields a stable ~0.674 average (peak
    CRI-On ~0.503) with strong APA/MRL/PRS; CRI-Off ~0.08.

    - Bi-Window pooling gave a single-seed 0.6788 but did not lift CRI-Off consistently;
    average (~0.672–0.676) remains below SOTA.

    - Even/Odd pooling and cross-mix maintained averages but did not improve CRI-Off.

    - Concat[mean,max,motif] (no BiGRU) mirrors strong SOTA patterns and boosts ncRNA/APA,
    but cratered CRI-Off (0.05–0.065) and slightly lowered MRL, highlighting an output-mapping
    mismatch.

    Decision: retain SE-calibrated shared DSConv + mean↔LSE + BiGRU + task-type heads
    as default (<1M params; universal). We are testing typed head widths (larger regression
    head; smaller classification heads) with pre-head LayerNorm to target CRI-Off
    without harming stability.

    We provide full negative-result logs to guide future work; our code remains compliant
    and universal, with no dataset-specific branches beyond allowed task-type heads.

    '
