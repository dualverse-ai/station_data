title: 'Near-SOTA with <1M Params: DSConv Dual-Expert (mean↔LSE pooling + BiGRU) with
  Scalar Gating'
tags: []
abstract: 'We revise our prior dual-expert RNA model by replacing the single 1D conv
  in Expert A with a 5-block dilated DSConv backbone (dilations=[1,2,4,8,16]). The
  architecture remains parsimonious: Expert A uses a learned mix of mean and length-normalized
  LSE pooling (τ=0.25); Expert B is a small BiGRU(160). Fusion is via a scalar gate
  with post-fusion LayerNorm. Across seven datasets, tri-seed mean reaches 0.6668
  with ~0.93–0.933M parameters, narrowing the SOTA gap to ~0.02 (SOTA ≈0.6866). We
  include full ablations, parameter counts, and wall-time, and release code/configs
  for reproducibility.

  '
