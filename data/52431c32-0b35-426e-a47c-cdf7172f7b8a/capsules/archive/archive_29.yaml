  title: 'Addendum 2 — Cycle IV: Max‑Preserving/Calibration Tweaks (MPRP, η, AADC)'
  content: "We tested three minimal, compliant tweaks that preserve literal max pooling\
    \ and focus on calibration in HDP‑RegCal (seed‑42 reference ≈ 0.6886):\n\nSetup\n\
    - Baseline: HDP‑RegCal (DSConv dilations [1,2,4,8,16]; main mean+max; motif max;\
    \ small heads; RegCal for regression-family).\n- Goals: avg ≥ 0.689 and CRI‑Off\
    \ ≥ 0.08; no ≥0.01 drop on Modif/ncRNA; PRS not worse by ≥0.01.\n\nMethods\n1)\
    \ MPRP (Max‑Preserving Residual Pooling, main):\n   pooled_main = max(ReLU(h))\
    \ + λ·mean(ReLU(h)), λ≥0 (learned).\n   Preserves extremes; adds small mean component.\n\
    \   ID 853 — 0.6792 | APA 0.8507 | CRI‑Off 0.0850 | CRI‑On 0.4609 | PRS 0.5634\
    \ | MRL 0.8896 | Modif 0.9511 | ncRNA 0.9538\n\n2) Motif contribution calibration\
    \ (single scalar η):\n   fused = concat(mean_pos, max_pos, η·motif_max), η>0 (learned).\n\
    \   ID 854 — 0.6810 | APA 0.8543 | CRI‑Off 0.0797 | CRI‑On 0.4816 | PRS 0.5726\
    \ | MRL 0.8821 | Modif 0.9518 | ncRNA 0.9446\n\n3) AADC (Anti‑Alias DWConv3 residual,\
    \ main pre‑pool):\n   h ← h + δ·DWConv3(h), δ≥0 (learned; small), then baseline\
    \ mean/max.\n   ID 856 — 0.6845 | APA 0.8567 | CRI‑Off 0.0765 | CRI‑On 0.5089\
    \ | PRS 0.5658 | MRL 0.8816 | Modif 0.9515 | ncRNA 0.9508\n\nConclusions\n- MPRP\
    \ preserved extremes (CRI‑Off ≥ 0.08) but aggregate remained far below reference;\
    \ not adopted.\n- Motif η improved PRS but pushed CRI‑Off < 0.08; not adopted.\n\
    - AADC lifted CRI‑On but reduced CRI‑Off to 0.0765 and stayed below aggregate\
    \ gate; not adopted.\n\nDecision: Deprecate all three Cycle IV tweaks; retain\
    \ HDP‑RegCal defaults (tri‑seed ≈ 0.6885) as robust endpoint. Full logs: storage/noema/results/CYCLE_IV_RESULTS.md\
    \ and methods: submissions/hdp_regcal_cycle4.py. Next efforts should target alternatives\
    \ that preserve CRI‑Off/PRS while raising the aggregate, or new baselines per\
    \ Stagnation Protocol.\n"
