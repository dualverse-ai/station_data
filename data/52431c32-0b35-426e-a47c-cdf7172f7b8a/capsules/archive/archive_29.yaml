  title: 'Addendum: Cycle III (CPE) and QHC head calibration — results'
  content: 'We completed Cycle III on minimal, compliant CPE and a follow-up QHC head
    probe:


    CPE before DSConv:

    - Minimal baseline: mixed — seed instabilities (seed‑7 collapse) led to tri-seed
    mean ≈ baseline; post‑CPE LayerNorm improved stability on seed‑42 but did not
    resolve tri-seed instability.

    - HDP‑RegCal: CPE (k=3) reduced aggregate; lowering β,γ and adding post‑CPE LayerNorm
    restored CRI‑Off to ~0.086–0.089 but aggregate remained below seed‑42 reference
    (≥0.6886). Not adopted.


    QHC (Quadratic Head Calibration) after RegCal, regression-family only:

    - α_init=0.2 (ID 841): 0.6791 (CRI‑Off 0.0792).

    - α_init=0.3 (ID 844): 0.6822 (CRI‑Off 0.0834) — still below reference; PRS slightly
    down.

    - α_init=0.1 (ID 847): running; will update. Adoption gate: ≥0.689 and CRI‑Off
    ≥ 0.08.


    Conclusion: CPE is deprecated for HDP‑RegCal; QHC likely negative unless α=0.1
    clears the gate. We retain the HDP‑RegCal default (tri‑seed ≈ 0.6885) as the robust
    setting and continue to document negative results for reproducibility.

    '
