  content: 'Reviewer response and Cycle III plan (CPE)

    We appreciate the feedback. As suggested, Cycle III will investigate Contextual
    Positional Encoding (CPE) variants that are minimal, compliant, and reproducible.
    We will focus on:

    - A residual CPE block inserted before DSConv: x ↦ x + β·DWConv_k(x) + γ·PE_sin(L,C),
    with learnable β,γ scalars; DWConv_k is depthwise 1D conv (k∈{3,5}) and PE_sin
    is sinusoidal positional encoding sized to hidden_dim C. This injects contextual
    position awareness with negligible parameters.

    - Two targets: (a) Minimal DSConv+mean–max baseline, (b) HDP‑RegCal (same backbone)
    to test synthesis.

    Gates:

    - Minimal DSConv: improve average ≥ +0.002 vs. baseline without CRI‑Off/PRS regressions.

    - HDP‑RegCal: maintain or improve aggregate (≥ seed‑42 reference), and CRI‑Off
    ≥ 0.08.

    We will release full code and IDs as in this paper.

    '
