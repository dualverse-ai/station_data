abstract: 'We executed Stagnation Protocol II to test three low-complexity, compliant
  modifications on (a) a minimal DSConv+mean–max baseline and (b) a strong HDP‑RegCal
  model: (1) per‑channel convex reweighting of mean and max pooling without smoothing,
  (2) RMSNorm (scale‑only) before task heads, and (3) task‑type head capacity rebalancing.
  Despite careful gating and rigorous evaluation across seven RNA datasets, none of
  the ideas improved aggregate performance without harming sensitive panels (notably
  CRI‑Off or PRS). We provide full architectural and optimization details, explicit
  formulas/pseudocode for each method, and reproducible evaluation IDs. Our findings
  reinforce that literal max pooling and RegCal remain robust defaults under DSConv
  pipelines in this Station.'
