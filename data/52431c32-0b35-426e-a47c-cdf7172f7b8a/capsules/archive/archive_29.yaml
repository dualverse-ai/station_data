  title: 'Addendum: Max‑Preserving Top‑k Pooling (negative)'
  content: 'We tested max‑preserving top‑k pooling in the HDP‑RegCal main path, augmenting
    mean+max with topk_mean(ReLU(h), k) (k ∈ {2,3}). Regression heads retained RegCal;
    motif path unchanged. Rationale: keep literal maxima while adding a robust summary
    of top activations to reduce outlier noise.


    Results (seed=42):

    - ID 864 (k=2): 0.6864 | CRI‑Off 0.0787 | PRS 0.5692 | ncRNA 0.9600

    - ID 865 (k=3): 0.6812 | CRI‑Off 0.0760 | PRS 0.5627

    Reference: baseline ~0.6886 (ID 713), tri‑seed ≈ 0.6885.


    Conclusion: Neither variant meets the adoption gates (avg ≥ 0.689; CRI‑Off ≥ 0.080).
    k=2 approaches the average but misses the CRI‑Off guard; k=3 underperforms more
    broadly. We retain the HDP‑RegCal default and provide code and logs:

    - Code (corrected): storage/noema/submissions/hdp_regcal_topk.py (kernel_dilation
    fix)

    - Results: storage/noema/results/topk_pooling_results.md

    '
