  title: 'Research Plan: Multi-Scale CNN with Attention'
  content: "### Objective\nTo improve upon the Multi-Scale CNN (ID 15) by incorporating\
    \ a self-attention mechanism.\n\n### Hypothesis\nThe current Multi-Scale CNN extracts\
    \ features at various scales but combines them via simple pooling and concatenation,\
    \ treating all parts of the sequence-feature map equally. A self-attention layer,\
    \ applied after the convolutions, will enable the model to dynamically weigh the\
    \ importance of different sequence positions. This will allow it to focus on the\
    \ most salient motifs for a given prediction, improving accuracy and robustness.\n\
    \n### Proposed Architecture\n1.  **Multi-Scale Convolutional Base:** Retain the\
    \ parallel convolutional layers (kernels 3, 7, 11) from submission ID 15.\n2.\
    \  **Feature Concatenation:** Concatenate the feature maps from the parallel convolutions\
    \ along the feature axis. The output shape will be `(batch, seq_len, total_cnn_features)`.\n\
    3.  **Self-Attention Layer:** Apply a standard multi-head self-attention mechanism\
    \ (e.g., `nn.SelfAttention`) to this concatenated feature map. This layer will\
    \ re-weight the sequence features based on their contextual importance.\n4.  **Pooling:**\
    \ Apply global max pooling to the output of the attention layer to produce a single,\
    \ fixed-size vector representation.\n5.  **Prediction Head:** Feed this vector\
    \ into a final MLP head for prediction.\n\n### Draft Code Implementation\n```python\n\
    import flax.linen as nn\nimport jax.numpy as jnp\nfrom typing import Sequence\n\
    \nclass MultiScaleCNNAttention(nn.Module):\n    d_output: int\n    task_type:\
    \ str\n    cnn_features_per_kernel: int\n    cnn_kernel_sizes: Sequence[int]\n\
    \    hidden_dim: int\n    dropout_rate: float\n    num_attention_heads: int\n\n\
    \    @nn.compact\n    def __call__(self, x, deterministic=True):\n        # 1.\
    \ Multi-scale convolutions\n        conv_outputs = []\n        for kernel_size\
    \ in self.cnn_kernel_sizes:\n            conv_out = nn.Conv(\n               \
    \ features=self.cnn_features_per_kernel,\n                kernel_size=(kernel_size,),\n\
    \                padding='SAME' # Use SAME padding to maintain seq length\n  \
    \          )(x)\n            conv_outputs.append(conv_out)\n        \n       \
    \ # 2. Concatenate feature maps\n        x = jnp.concatenate(conv_outputs, axis=-1)\n\
    \        x = nn.relu(x)\n\n        # 3. Self-Attention Layer\n        # Input\
    \ shape for SelfAttention: (batch, sequence, features)\n        x = nn.SelfAttention(\n\
    \            num_heads=self.num_attention_heads\n        )(x)\n        \n    \
    \    # 4. Global Max Pooling\n        x = jnp.max(x, axis=1)\n        \n     \
    \   # 5. Prediction Head\n        x = nn.Dense(features=self.hidden_dim)(x)\n\
    \        x = nn.relu(x)\n        x = nn.Dropout(rate=self.dropout_rate)(x, deterministic=deterministic)\n\
    \        x = nn.Dense(features=self.d_output)(x)\n\n        if self.task_type\
    \ == \"regression\":\n            return x.squeeze(-1)\n        else:\n      \
    \      return x\n```\n"
