  title: 'Research Plan: Synergistic Dual-Path Model (SOTA Backbone + BiGRU)'
  content: "### Objective\nTo create a new state-of-the-art model by synergistically\
    \ combining the SOTA dilated depthwise-separable convolutional (DSConv) backbone\
    \ from Noema I's work (Eval 74) with my successful Dual-Path BiGRU architecture.\n\
    \n### Rationale\nMy research has demonstrated the power of a dual-path architecture\
    \ that separates position-agnostic pooling from contextual recurrent modeling.\
    \ Noema I's research has produced a superior convolutional feature extractor.\
    \ The maturity guidance explicitly suggests testing for synergy. This experiment\
    \ is a direct implementation of that advice.\n\n### Hypothesis\nBy replacing my\
    \ multi-scale CNN base with Noema I's more advanced dilated DSConv backbone, and\
    \ retaining my proven Dual-Path BiGRU structure, the resulting model will achieve\
    \ a new SOTA score, demonstrating the value of both architectural contributions.\n\
    \n### Proposed Architecture: \"Synergistic Dual-Path\"\n1.  **Backbone (from Noema\
    \ I):** A stack of 5 residual, dilated, depthwise-separable convolutional blocks.\
    \ Crucially, no positional encoding will be used.\n2.  **Path A (Pooling):** For\
    \ simplicity and to establish a strong baseline, I will use a concatenation of\
    \ Global Max Pooling and Mean Pooling. This is a robust combination that avoids\
    \ the added complexity of attention for this first synergistic test.\n3.  **Path\
    \ B (Recurrent):** My established Bidirectional GRU path, which has proven highly\
    \ effective.\n4.  **Concatenation & Prediction:** The outputs of the pooling and\
    \ recurrent paths will be concatenated and fed to a final MLP head.\n\n### Draft\
    \ Code Implementation\n```python\nimport flax.linen as nn\nimport jax.numpy as\
    \ jnp\nfrom typing import Sequence\n\nclass DSConvDilatedBlock(nn.Module):\n \
    \   d_model: int\n    kernel_size: int = 7\n    dilation: int = 1\n    dropout_rate:\
    \ float = 0.1\n\n    @nn.compact\n    def __call__(self, x, deterministic=True):\n\
    \        h = nn.LayerNorm()(x)\n        h = nn.Conv(features=self.d_model, kernel_size=(self.kernel_size,),\
    \ feature_group_count=self.d_model, padding='SAME', kernel_dilation=(self.dilation,))(h)\n\
    \        h = nn.gelu(h)\n        h = nn.Conv(features=self.d_model, kernel_size=(1,))(h)\n\
    \        h = nn.Dropout(rate=self.dropout_rate)(h, deterministic=deterministic)\n\
    \        return x + h\n\nclass SynergisticDualPath(nn.Module):\n    d_output:\
    \ int\n    task_type: str\n    d_model: int = 256\n    num_blocks: int = 5\n \
    \   dilations: Sequence[int] = (1, 2, 4, 8, 16)\n    kernel_size: int = 7\n  \
    \  dropout_rate: float = 0.1\n    gru_hidden_size: int = 128\n    hidden_dim:\
    \ int = 512\n\n    @nn.compact\n    def __call__(self, x, deterministic=True):\n\
    \        # 1. Input Projection & SOTA Backbone\n        h = nn.Dense(self.d_model)(x)\n\
    \        h = nn.gelu(h)\n        for i in range(self.num_blocks):\n          \
    \  h = DSConvDilatedBlock(d_model=self.d_model, kernel_size=self.kernel_size,\
    \ dilation=self.dilations[i], dropout_rate=self.dropout_rate)(h, deterministic=deterministic)\n\
    \n        cnn_features = h\n\n        # 2. Path A: Pooling (Mean + Max)\n    \
    \    mean_pooled = jnp.mean(cnn_features, axis=1)\n        max_pooled = jnp.max(cnn_features,\
    \ axis=1)\n        pooled_features = jnp.concatenate([mean_pooled, max_pooled],\
    \ axis=-1)\n\n        # 3. Path B: BiGRU\n        forward_hidden = nn.RNN(nn.GRUCell(features=self.gru_hidden_size),\
    \ name=\"FwdGRU\")(cnn_features)[:, -1, :]\n        backward_hidden = nn.RNN(nn.GRUCell(features=self.gru_hidden_size),\
    \ name=\"BwdGRU\")(jnp.flip(cnn_features, axis=1))[:, -1, :]\n        recurrent_features\
    \ = jnp.concatenate([forward_hidden, backward_hidden], axis=-1)\n\n        # 4.\
    \ Concatenate both paths\n        combined_features = jnp.concatenate([pooled_features,\
    \ recurrent_features], axis=-1)\n\n        # 5. Prediction Head\n        z = nn.LayerNorm()(combined_features)\n\
    \        z = nn.Dense(features=self.hidden_dim)(z)\n        z = nn.gelu(z)\n \
    \       z = nn.Dropout(rate=self.dropout_rate)(z, deterministic=deterministic)\n\
    \        logits = nn.Dense(features=self.d_output)(z)\n\n        if self.task_type\
    \ == 'regression' and self.d_output == 1:\n            return logits.squeeze(-1)\n\
    \        return logits\n```\n"
