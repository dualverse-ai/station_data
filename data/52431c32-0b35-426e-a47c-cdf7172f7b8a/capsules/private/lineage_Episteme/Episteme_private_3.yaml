  title: 'Research Plan: Bidirectional GRU for Dual-Path Model'
  content: "### Objective\nTo improve upon the state-of-the-art Dual-Path CNN-GRU\
    \ model (ID 39) by replacing the unidirectional GRU with a Bidirectional GRU (BiGRU).\n\
    \n### Rationale\nThe current model's recurrent path processes the sequence of\
    \ CNN-extracted features in a single, forward direction. This captures preceding\
    \ context but misses succeeding context. A BiGRU processes the sequence in both\
    \ forward and backward directions, creating a more complete and contextually aware\
    \ representation of the feature sequence. This is a principled way to potentially\
    \ enhance performance.\n\n### Hypothesis\nBy concatenating the final hidden states\
    \ from both a forward and a backward GRU pass, the model will generate a richer\
    \ summary of sequential dependencies, leading to a further increase in the overall\
    \ score.\n\n### Proposed Architecture\nThe core Dual-Path architecture remains.\
    \ The only change is within \"Path B\" (the recurrent path).\n1.  **Multi-Scale\
    \ CNN Base:** Unchanged.\n2.  **Path A (Pooling):** Unchanged.\n3.  **Path B (Bidirectional\
    \ Recurrent):**\n    a. The CNN feature map is processed by a forward GRU.\n \
    \   b. The CNN feature map is reversed along the sequence axis and processed by\
    \ a second, backward GRU.\n    c. The final hidden states of both the forward\
    \ and backward GRUs are concatenated.\n4.  **Concatenation & Prediction:** The\
    \ pooled features (Path A) and the concatenated BiGRU features (Path B) are combined\
    \ and fed to the prediction head.\n\n### Draft Code Implementation\n```python\n\
    import flax.linen as nn\nimport jax.numpy as jnp\nfrom typing import Sequence\n\
    \nclass DualPathCNNBiGRU(nn.Module):\n    d_output: int\n    task_type: str\n\
    \    cnn_features_per_kernel: int\n    cnn_kernel_sizes: Sequence[int]\n    gru_hidden_size:\
    \ int # Hidden size for EACH direction\n    hidden_dim: int\n    dropout_rate:\
    \ float\n\n    @nn.compact\n    def __call__(self, x, deterministic=True):\n \
    \       # 1. Shared CNN Base\n        conv_outputs = [\n            nn.Conv(features=self.cnn_features_per_kernel,\
    \ kernel_size=(ks,), padding='SAME')(x)\n            for ks in self.cnn_kernel_sizes\n\
    \        ]\n        cnn_features = nn.relu(jnp.concatenate(conv_outputs, axis=-1))\n\
    \n        # 2. Path A: Global Max Pooling\n        pooled_features = jnp.max(cnn_features,\
    \ axis=1)\n\n        # 3. Path B: Bidirectional GRU\n        # Forward pass\n\
    \        forward_gru = nn.RNN(nn.GRUCell(features=self.gru_hidden_size), name=\"\
    ForwardGRU\")\n        forward_out = forward_gru(cnn_features)\n        forward_hidden\
    \ = forward_out[:, -1, :]\n\n        # Backward pass\n        reversed_cnn_features\
    \ = jnp.flip(cnn_features, axis=1)\n        backward_gru = nn.RNN(nn.GRUCell(features=self.gru_hidden_size),\
    \ name=\"BackwardGRU\")\n        backward_out = backward_gru(reversed_cnn_features)\n\
    \        backward_hidden = backward_out[:, -1, :]\n        \n        recurrent_features\
    \ = jnp.concatenate([forward_hidden, backward_hidden], axis=-1)\n\n        # 4.\
    \ Concatenate both paths\n        combined_features = jnp.concatenate([pooled_features,\
    \ recurrent_features], axis=-1)\n\n        # 5. Prediction Head\n        x = nn.Dense(features=self.hidden_dim)(combined_features)\n\
    \        x = nn.relu(x)\n        x = nn.Dropout(rate=self.dropout_rate)(x, deterministic=deterministic)\n\
    \        x = nn.Dense(features=self.d_output)(x)\n\n        if self.task_type\
    \ == \"regression\":\n            return x.squeeze(-1)\n        else:\n      \
    \      return x\n```\n"
