  title: Analysis of Dual-Path Ablation Study Results
  content: '### Objective

    To conduct a detailed, per-dataset analysis of the ablation study results to understand
    the specific contributions of the pooling and recurrent paths in the Dual-Path
    architecture.


    ### Data Collation

    Scores from the key experiments are as follows:


    | Model / Experiment ID                     | Overall Score | APA_R2 | CRI-Off
    | Modif | CRI-On | PRS    | MRL    | ncRNA  |

    |-------------------------------------------|---------------|--------|---------|-------|--------|--------|--------|--------|

    | **Full Dual-Path (ID 49)**                | **0.6470**    | 0.8522 | 0.0794  |
    0.9420| 0.4228 | **0.5264** | 0.8895 | 0.8169 |

    | **BiGRU Path Only (ID 79)**               | 0.6458        | **0.8549** | **0.0819**  |
    **0.9487**| 0.4149 | 0.5396 | **0.8991** | 0.7815 |

    | **Pooling Path Only (ID 73)**             | 0.5408        | 0.6788 | 0.0603  |
    0.7055| 0.3687 | 0.4939 | 0.6171 | **0.8615** |


    *(Note: Bold indicates the best score for that specific dataset among the three
    models.)*


    ### Analysis and Insights

    1.  **Dominance of BiGRU Path:** As the overall scores suggest, the BiGRU-only
    model (ID 79) is extremely powerful, outperforming the full model on 4 of the
    7 datasets. This confirms it is the primary driver of performance.


    2.  **The Role of the Pooling Path:** The Pooling-only model (ID 73) is significantly
    weaker overall, but it achieves the **highest score on the `ncRNA` dataset**.
    This is a critical insight. The `ncRNA` dataset has the longest sequences. This
    suggests that for very long sequences, the information bottleneck of a recurrent
    model (even a bidirectional one) might still be a factor, and the position-agnostic
    "is this motif present?" signal from max pooling is a more robust feature.


    3.  **Synergy Re-examined:** The "synergy" of the full model is not a universal
    improvement. Instead, it appears to be a trade-off. Adding the pooling path to
    the BiGRU path (creating the full model) slightly degrades performance on most
    tasks but provides a crucial boost to `ncRNA` performance (and a smaller one to
    `CRI-On` and `PRS` compared to the BiGRU-only model, though not the best overall
    for PRS). The full model acts as a compromise, balancing the strengths of both
    paths to achieve a high, stable average score, at the cost of peak performance
    on specific tasks.


    ### Revised Narrative for Paper

    My paper should be reframed around this analysis. The key contribution is not
    a SOTA claim, but the dissection of this architectural trade-off. The paper should
    be titled something like: "An Analysis of Pooling vs. Recurrence in a Dual-Path
    CNN for RNA Modeling". It will highlight that a simple pooling path is surprisingly
    effective for long-sequence classification, while a BiGRU excels at most other
    tasks, and that a combined model offers a robust but not always optimal solution.
    This is a much stronger and more scientifically honest conclusion.

    '
