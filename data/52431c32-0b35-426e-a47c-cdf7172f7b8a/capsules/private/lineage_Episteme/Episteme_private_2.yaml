  title: 'Research Plan: Dual-Path CNN-GRU and Global Pooling'
  content: "### Objective\nTo create a robust architecture that leverages both context-free\
    \ motif detection and sequential context modeling, addressing the information\
    \ bottleneck identified in submission ID 28.\n\n### Analysis of Previous Failures\n\
    - **ID 15 (Multi-Scale CNN + Pooling):** Strong and robust, but context-agnostic.\
    \ It detects *if* a motif is present but not *where* or in what order.\n- **ID\
    \ 28 (Multi-Scale CNN + GRU):** Powerful sequential modeling but created a fatal\
    \ information bottleneck by compressing the entire sequence into the GRU's single\
    \ final hidden state. This caused catastrophic failure on long-sequence (`ncRNA`)\
    \ and multi-label (`PRS`) tasks.\n\n### Hypothesis\nA dual-path architecture will\
    \ achieve superior performance by providing the final prediction layers with two\
    \ complementary feature sets:\n1. A **global pooling path** to capture the most\
    \ salient, position-agnostic features.\n2. A **recurrent path (GRU)** to capture\
    \ a contextual, ordered summary of the sequence of features.\nBy concatenating\
    \ these two representations, the model can overcome the GRU's information bottleneck\
    \ while incorporating valuable sequential information that pooling alone misses.\n\
    \n### Proposed Architecture\n1.  **Multi-Scale CNN Base:** A shared base of parallel\
    \ 1D convolutions extracts a rich feature map from the input sequence.\n2.  **Path\
    \ A (Pooling):** Apply Global Max Pooling to the feature map to get a vector of\
    \ the strongest detected motifs.\n3.  **Path B (Recurrent):** Apply a GRU layer\
    \ to the same feature map and take the final hidden state to get a contextual\
    \ summary.\n4.  **Concatenation & Prediction:** Concatenate the vectors from Path\
    \ A and Path B. This combined vector is then fed into a final MLP prediction head.\n\
    \n### Draft Code Implementation\n```python\nimport flax.linen as nn\nimport jax.numpy\
    \ as jnp\nfrom typing import Sequence\n\nclass DualPathCNNGRU(nn.Module):\n  \
    \  d_output: int\n    task_type: str\n    cnn_features_per_kernel: int\n    cnn_kernel_sizes:\
    \ Sequence[int]\n    gru_hidden_size: int\n    hidden_dim: int\n    dropout_rate:\
    \ float\n\n    @nn.compact\n    def __call__(self, x, deterministic=True):\n \
    \       # 1. Shared Multi-Scale CNN Base\n        conv_outputs = []\n        for\
    \ kernel_size in self.cnn_kernel_sizes:\n            conv_out = nn.Conv(\n   \
    \             features=self.cnn_features_per_kernel,\n                kernel_size=(kernel_size,),\n\
    \                padding='SAME'\n            )(x)\n            conv_outputs.append(conv_out)\n\
    \        \n        cnn_features = nn.relu(jnp.concatenate(conv_outputs, axis=-1))\n\
    \n        # 2. Path A: Global Max Pooling\n        pooled_features = jnp.max(cnn_features,\
    \ axis=1)\n\n        # 3. Path B: GRU Recurrent Path\n        gru_out = nn.RNN(nn.GRUCell(features=self.gru_hidden_size))(cnn_features)\n\
    \        recurrent_features = gru_out[:, -1, :] # Final hidden state\n\n     \
    \   # 4. Concatenation of both paths\n        combined_features = jnp.concatenate([pooled_features,\
    \ recurrent_features], axis=-1)\n\n        # 5. Prediction Head\n        x = nn.Dense(features=self.hidden_dim)(combined_features)\n\
    \        x = nn.relu(x)\n        x = nn.Dropout(rate=self.dropout_rate)(x, deterministic=deterministic)\n\
    \        x = nn.Dense(features=self.d_output)(x)\n\n        if self.task_type\
    \ == \"regression\":\n            return x.squeeze(-1)\n        else:\n      \
    \      return x\n```\n"
