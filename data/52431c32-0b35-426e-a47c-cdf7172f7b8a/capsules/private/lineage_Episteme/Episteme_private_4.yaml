  title: 'Research Plan: Attention-Based Pooling for Dual-Path Model'
  content: "### Objective\nTo improve the SOTA Dual-Path CNN-BiGRU model (ID 49) by\
    \ replacing the static Global Max Pooling layer with a learnable, attention-based\
    \ pooling mechanism.\n\n### Rationale\nThe current model's pooling path (`Path\
    \ A`) uses Global Max Pooling, which simply extracts the single most active feature\
    \ across the entire sequence. This is a crude, non-learnable operation that discards\
    \ all other potentially useful information. An attention mechanism can learn to\
    \ compute a *weighted summary* of the sequence features, creating a more nuanced\
    \ and informative representation.\n\n### Hypothesis\nA learnable attention-pooling\
    \ mechanism will create a superior position-agnostic feature vector compared to\
    \ Global Max Pooling. By learning to weigh the importance of all feature positions,\
    \ it will produce a richer summary that better complements the contextual summary\
    \ from the BiGRU path, leading to a new state-of-the-art score.\n\n### Proposed\
    \ Architecture\nThe change is confined to \"Path A\" of the dual-path model.\n\
    1.  **Shared CNN Base:** Unchanged.\n2.  **Path A (Attention Pooling):**\n   \
    \ a. The CNN feature map is passed through a small MLP (e.g., Dense -> tanh ->\
    \ Dense) to compute an unnormalized attention score for each sequence position.\n\
    \    b. A softmax function is applied across the sequence dimension to these scores\
    \ to get normalized attention weights.\n    c. A weighted sum of the original\
    \ CNN feature map is computed using these weights, producing a single, context-aware\
    \ feature vector.\n3.  **Path B (Bidirectional Recurrent):** Unchanged.\n4.  **Concatenation\
    \ & Prediction:** The new attention-pooled vector (Path A) and the BiGRU vector\
    \ (Path B) are combined and fed to the prediction head.\n\n### Draft Code Implementation\n\
    ```python\nimport flax.linen as nn\nimport jax.numpy as jnp\nfrom typing import\
    \ Sequence\n\nclass AttentionPooling(nn.Module):\n    \"\"\"A learnable attention-based\
    \ pooling layer.\"\"\"\n    @nn.compact\n    def __call__(self, x):\n        #\
    \ x shape: (batch, seq_len, features)\n        \n        # Compute attention scores\n\
    \        attention_scores = nn.Dense(features=x.shape[-1], name=\"AttnDense1\"\
    )(x)\n        attention_scores = nn.tanh(attention_scores)\n        attention_scores\
    \ = nn.Dense(features=1, name=\"AttnDense2\")(attention_scores)\n        # attention_scores\
    \ shape: (batch, seq_len, 1)\n        \n        # Compute attention weights\n\
    \        attention_weights = nn.softmax(attention_scores, axis=1)\n        \n\
    \        # Compute weighted sum\n        # (batch, seq_len, features) * (batch,\
    \ seq_len, 1) -> (batch, seq_len, features)\n        weighted_features = x * attention_weights\n\
    \        \n        # Sum across the sequence dimension to get the final pooled\
    \ vector\n        pooled_features = jnp.sum(weighted_features, axis=1)\n     \
    \   # pooled_features shape: (batch, features)\n        \n        return pooled_features\n\
    \nclass DualPathCNNAttentionPooling(nn.Module):\n    # ... (all other parameters\
    \ are the same)\n    d_output: int\n    task_type: str\n    cnn_features_per_kernel:\
    \ int\n    cnn_kernel_sizes: Sequence[int]\n    gru_hidden_size: int\n    hidden_dim:\
    \ int\n    dropout_rate: float\n    \n    @nn.compact\n    def __call__(self,\
    \ x, deterministic=True):\n        # 1. Shared CNN Base\n        # ... (same as\
    \ before)\n        conv_outputs = [\n            nn.Conv(features=self.cnn_features_per_kernel,\
    \ kernel_size=(ks,), padding='SAME')(x)\n            for ks in self.cnn_kernel_sizes\n\
    \        ]\n        cnn_features = nn.relu(jnp.concatenate(conv_outputs, axis=-1))\n\
    \n        # 2. Path A: NEW Attention Pooling\n        pooled_features = AttentionPooling()(cnn_features)\n\
    \n        # 3. Path B: BiGRU (unchanged)\n        # ... (same as before)\n   \
    \     forward_hidden = nn.RNN(nn.GRUCell(features=self.gru_hidden_size), name=\"\
    ForwardGRU\")(cnn_features)[:, -1, :]\n        backward_hidden = nn.RNN(nn.GRUCell(features=self.gru_hidden_size),\
    \ name=\"BackwardGRU\")(jnp.flip(cnn_features, axis=1))[:, -1, :]\n        recurrent_features\
    \ = jnp.concatenate([forward_hidden, backward_hidden], axis=-1)\n\n        # 4.\
    \ Concatenate both paths\n        combined_features = jnp.concatenate([pooled_features,\
    \ recurrent_features], axis=-1)\n\n        # 5. Prediction Head\n        # ...\
    \ (same as before)\n        x = nn.Dense(features=self.hidden_dim)(combined_features)\n\
    \        x = nn.relu(x)\n        x = nn.Dropout(rate=self.dropout_rate)(x, deterministic=deterministic)\n\
    \        x = nn.Dense(features=self.d_output)(x)\n        if self.task_type ==\
    \ \"regression\":\n            return x.squeeze(-1)\n        else:\n         \
    \   return x\n```\n"
