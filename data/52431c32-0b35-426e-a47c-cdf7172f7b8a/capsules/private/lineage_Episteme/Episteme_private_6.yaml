  title: 'Paper Draft: A Dual-Path CNN-BiGRU Architecture for Multi-Dataset RNA Sequence
    Modeling'
  content: '### 1. Introduction

    Developing general-purpose architectures for genomic sequence modeling is a significant
    challenge. Models must perform well across diverse tasks and sequence lengths.
    While complex recurrent or attention-based models are powerful, it is crucial
    to understand the contribution of simpler, fundamental components. In this paper,
    we analyze the distinct roles of and trade-offs between a position-agnostic pooling
    mechanism and a context-aware recurrent mechanism within a high-performing hybrid
    architecture.


    ### 2. The Dual-Path Architecture and its Components

    Our analysis is centered on a "Dual-Path" architecture built upon a Multi-Scale
    1D CNN backbone. After initial feature extraction, the model splits:

    - **Path A (Pooling):** A Global Max Pooling layer captures the most salient detected
    motifs, regardless of their position.

    - **Path B (Recurrent):** A Bidirectional GRU (BiGRU) processes the sequence of
    motifs to model their contextual and ordered relationships.

    The full model concatenates the outputs of both paths. For our study, we used
    a powerful Multi-Scale CNN base and achieved a competitive score of **0.6470 (ID
    49)**.


    ### 3. Ablation Study: Dissecting the Paths

    To understand the contribution of each path, we conducted a controlled ablation
    study. We compare the full model against two variants: one with only the pooling
    path, and one with only the recurrent path.


    **Per-Dataset Results:**

    | Model / ID                 | Overall | APA_R2 | CRI-Off | Modif | CRI-On | PRS    |
    MRL    | ncRNA  |

    |----------------------------|---------|--------|---------|-------|--------|--------|--------|--------|

    | **Full Dual-Path (49)**    | 0.6470  | 0.8522 | 0.0794  | 0.9420| 0.4228 | 0.5264
    | 0.8895 | 0.8169 |

    | **BiGRU Path Only (79)**   | 0.6458  | 0.8549 | 0.0819  | 0.9487| 0.4149 | 0.5396
    | 0.8991 | 0.7815 |

    | **Pooling Path Only (73)** | 0.5408  | 0.6788 | 0.0603  | 0.7055| 0.3687 | 0.4939
    | 0.6171 | 0.8615 |


    ### 4. Analysis and Key Insights

    **1. The Dominance of Recurrence:** The BiGRU-only model (ID 79) performs almost
    as well as the full model, demonstrating that it is the primary driver of performance.
    It excels on tasks where a contextual summary of the entire sequence is beneficial.


    **2. The Niche of Pooling:** The Pooling-only model (ID 73) is significantly weaker
    on average, but crucially, it achieves the **best performance on the `ncRNA` dataset**.
    As `ncRNA` contains the longest sequences, this suggests that the simple, position-agnostic
    "motif detection" of max pooling is a more robust strategy than forcing a summary
    through a recurrent bottleneck for this specific task.


    **3. The Dual-Path as a Robust Compromise:** The full Dual-Path model is not a
    simple sum of its parts. It acts as an effective compromise: it slightly tempers
    the BiGRU''s peak performance on some tasks in exchange for dramatically improving
    performance on the `ncRNA` task where the BiGRU struggles relative to pooling.
    The result is a model with the highest and most stable average score.


    ### 5. Conclusion

    Our analysis reveals that the choice between recurrent and pooling mechanisms
    is task-dependent. While a powerful recurrent model like a BiGRU is a strong generalist,
    simple max pooling can be a superior strategy for certain long-sequence classification
    tasks. The Dual-Path architecture provides a robust framework for combining these
    complementary strengths, offering a stable, high-performing solution that mitigates
    the weaknesses of each individual component. This work provides valuable insight
    for future architectural design, emphasizing the importance of analyzing per-task
    performance rather than focusing solely on the aggregate score.

    '
