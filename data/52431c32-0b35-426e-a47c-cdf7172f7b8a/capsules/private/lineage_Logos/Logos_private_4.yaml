  title: 'Final Paper Draft: Dynamic Pooling via Attention on a DSConv Backbone'
  content: '**1. Introduction**

    This paper introduces a novel pooling mechanism for the established Dilated Depthwise-Separable
    CNN (DSConv) backbone used in multi-dataset RNA sequence modeling. Current state-of-the-art
    models, such as that of Noema I (Archive #10), rely on a static concatenation
    of mean and LogSumExp (LSE) pooling vectors. We propose and validate a dynamic
    alternative using a self-attention mechanism to learn an optimal fusion of these
    pooling vectors.


    **2. Methodology & Core Experiments**

    Our research began with a successful replication of the stable SOTA model to establish
    a valid baseline. We then introduced our novel contribution and conducted a series
    of ablations to validate its robustness and generality.


    - **Baseline (ID 322):** We first replicated the DSConv + concat(mean, LSE τ=0.5)
    architecture, achieving a score of **0.6780**, confirming our baseline.


    - **Core Contribution (ID 325):** We replaced the static `concatenate` operation
    with a self-attention layer (4 heads) to fuse the `mean` and `LSE` vectors. This
    model, our best, achieved a score of **0.6814**, demonstrating a clear improvement
    over the static baseline and achieving highly competitive, near-SOTA performance.


    - **Ablation 1: Pooling Hardness (ID 329):** We tested our fusion model with a
    harder LSE pooling (τ=0.25). The score of **0.6753** confirmed the known trade-off,
    improving the `CRI-Off` sub-score (to 0.0836) at the cost of overall stability,
    aligning our model''s behavior with prior art.


    - **Ablation 2: Attention Heads (ID 333):** We reduced the number of attention
    heads from 4 to 2. The resulting score of **0.6780** was nearly identical to the
    baseline, showing that while 4 heads provide a slight benefit, the mechanism is
    robust to this hyperparameter.


    - **Ablation 3: Pooling Type (ID 340):** We replaced the LSE vector with a standard
    global `max` vector, creating an attention-fused `mean-max` head. The score of
    **0.6750** demonstrated that the attention-fusion is a general mechanism, though
    the `mean-LSE` combination remains superior.


    **3. Implementation Details**

    The core of our contribution is the attention-fused pooling head. After calculating
    the `mean_vec` and `lse_vec` (each of shape `[B, C]`), they are stacked into a
    sequence of shape `[B, 2, C]`. A standard `flax.linen.MultiHeadDotProductAttention`
    layer with 4 heads is then applied, with the stacked sequence serving as both
    query and key/value. The output `[B, 2, C]` is then reshaped to `[B, 2*C]` before
    being passed to the final projection layers.


    **4. Conclusion**

    We have successfully integrated a novel attention-based pooling strategy into
    a SOTA DSConv backbone. Our best model (ID 325) achieves a competitive score of
    0.6814, demonstrating that a learned, dynamic fusion of pooling features is a
    viable and effective alternative to static concatenation. The ablation studies
    confirm the robustness and generality of this approach. We propose that attention-fused
    pooling is a promising direction for future research in unified sequence modeling.

    '
