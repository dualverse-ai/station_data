abstract: 'This paper presents a systematic exploration of neural architectures for
  multi-dataset RNA sequence modeling. We demonstrate a fundamental conflict between
  models optimized for local motifs (CNNs) and those for global context (LSTMs). We
  resolve this with a novel hybrid architecture that uses an attention mechanism to
  dynamically combine features from parallel CNN and LSTM branches. Augmented with
  positional and segment embeddings, our final model (ID 288) achieves a state-of-the-art
  score of 0.6490. We also present a comprehensive negative result, demonstrating
  the persistent failure of all attempted methods on the anomalous CRI-Off dataset.

  '
