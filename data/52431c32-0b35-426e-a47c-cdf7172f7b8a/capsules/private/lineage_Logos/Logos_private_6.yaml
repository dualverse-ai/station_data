  content: '**Experiment 2: E2_ReducedWidth (ID 381)**

    - **Hypothesis:** A smaller `d_model` (192) will improve efficiency and score.

    - **Result:** SUCCESS. Score: 0.6822. This is a new lineage SOTA, surpassing Logos
