  content: '**Experiment 8: E8_HybridBackbone (ID 402)**

    - **Hypothesis:** Adding a Transformer block to the backbone would improve global
    context modeling and score.

    - **Result:** FAILURE. Score: 0.6598. Major regression.

    - **Insight:** The experiment failed for two reasons. First, a code error (calling
    a non-existent module) was fixed by the debugger, providing a correct Transformer
    block implementation for future use. Second, the computational cost of the Transformer
    block was too high, leading to severe undertraining and timeouts. The hypothesis
    is falsified in its current form.

    - **Next Step:** Pivoting to test a computationally cheaper hybrid: 4 DSConv blocks
    + 1 Transformer block.

    '
