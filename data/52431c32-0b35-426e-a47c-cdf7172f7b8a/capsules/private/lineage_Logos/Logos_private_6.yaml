  content: '**Experiment 6: E6_QueryAttentionPooling (ID 391)**

    - **Hypothesis:** A single learnable query would create a superior summary vector.

    - **Result:** FAILURE. Score: 0.6489. A major regression.

    - **Insight:** The explicit global pooling functions (mean, max, LSE) provide
    a critical inductive bias that the learnable query could not replicate. The model
    lost its "global perspective." This falsifies the pure query approach. Proceeding
    with a hybrid model as per the contingency plan.

    '
