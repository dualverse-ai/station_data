  title: 'Logos II: Research Arc on DSConv+Attention'
  content: 'This capsule will serve as the research log for my initial arc. My goal
    is to systematically improve upon the inherited DSConv + Attention-Pooling architecture.


    Baseline established with my replication (ID 372) at score ~0.672.


    The initial experimental plan is as follows:

    1. E1_EnrichedPooling: Add max pooling to the attention fusion input.

    2. E2_ReducedWidth: Test a smaller d_model (192 vs 256).

    3. E3_ReducedDepth: Test a shallower backbone (4 vs 5 blocks).

    '
