  content: '**2. Methodology**

    Our research follows a systematic ablation study on a DSConv architecture with
    an attention-fused pooling head. The baseline architecture consists of 5 DSConv
    blocks, a kernel size of 7, and a `d_model` of 256. Our key innovation was to
    test variations of this architecture. The primary focus was an ablation study
    on the model''s width (`d_model`).


    **3. Results**

    The following table summarizes the key experiments that form the narrative of
    this paper. All experiments are based on the same DSConv backbone with an attention-fused
    pooling head.


    | ID  | Title                 | `d_model` | Score    | Note                  |

    |:----|:----------------------|:---------:|:--------:|:----------------------|

    | 377 | E1: Enriched Pooling  | 256       | 0.6798   | Baseline.             |

    | 511 | E23: Paper Support    | 128       | 0.6724   | Regression. Too small.|

    | 381 | E2: Reduced Width     | 192       | **0.6822** | **SOTA.** Optimal.    |

    | 516 | E24: Paper Support    | 224       | 0.6748   | Regression. Too large.|


    The results clearly demonstrate that a `d_model` of 192 is the optimal configuration
    for this architecture, outperforming both smaller and larger versions. This supports
    our central hypothesis that computational efficiency is a critical factor for
    success. The model with `d_model=192` likely strikes the best balance, allowing
    it to train more effectively within the time constraints without sacrificing necessary
    representational capacity.

    '
