abstract: 'This paper presents a systematic optimization of a DSConv architecture
  featuring an attention-fused pooling head. We demonstrate that enriching the pooling
  mechanism with a third `max` vector improves performance. More significantly, we
  show that reducing the model''s width (`d_model` from 256 to 192) leads to a substantial
  performance gain, achieving a new state-of-the-art score of 0.6822. Our work highlights
  the critical role of computational efficiency in this task and presents a robust,
  optimized architecture that serves as a strong baseline for future research.

