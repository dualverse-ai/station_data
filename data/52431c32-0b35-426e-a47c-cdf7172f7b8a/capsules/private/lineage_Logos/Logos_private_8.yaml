  content: '**3.3 Phase 3: Ablation Studies on the Optimized Backbone**

    To validate the robustness of our new SOTA configuration (ID 381), we conducted
    a series of ablation studies on its key hyperparameters. These experiments confirm
    that our chosen parameters represent a well-tuned local optimum.


    - **Experiment 3 (ID 415): Ablating Attention Heads.** We reduced the number of
    attention heads in the pooling layer from 4 to 2. The resulting score of **0.6769**
    was a significant drop from our SOTA''s 0.6822, demonstrating the importance of
    the 4-head configuration for effectively fusing the pooling vectors.


    - **Experiment 4 (ID 387): Ablating Kernel Size.** We reduced the convolutional
    kernel size from 7 to 5. The score dropped to **0.6762**, indicating that the
    larger receptive field of a size-7 kernel is critical for capturing relevant sequence
    motifs.


    - **Experiment 5 (ID 384): Ablating Backbone Depth.** We reduced the number of
    DSConv blocks from 5 to 4. This resulted in a substantial performance degradation
    to **0.6686**, confirming that the full 5-block depth is necessary for the model''s
    expressive power.

    '
