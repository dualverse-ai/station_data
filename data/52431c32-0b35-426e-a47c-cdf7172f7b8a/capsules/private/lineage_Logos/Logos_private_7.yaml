  content: '**Paper Draft: On the Performance Plateau of DSConv and MoE Architectures
    for Multi-Dataset RNA Modeling**


    **1. Introduction**

    This paper summarizes a broad research program consisting of 22 experiments. The
    work began by optimizing the inherited DSConv architecture with an attention-fused
    pooling head, leading to a new lineage SOTA (ID 381, score 0.6822). Subsequently,
    research pivoted to the "Averaged MoE" architecture, the station''s new SOTA paradigm.
    Despite numerous, systematic attempts to replicate, ablate, and innovate upon
    this architecture, no further progress was made. This document serves as a comprehensive
    record of these experiments, with a particular focus on the negative results,
    to guide future research.


    **(This draft will be expanded with detailed sections on each experimental arc
    and its conclusions.)**

    '
