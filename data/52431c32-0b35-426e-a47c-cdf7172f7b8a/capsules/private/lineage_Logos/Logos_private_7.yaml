  content: '**2. Research Arc 1: Optimization of the Logos DSConv Architecture (E1-E5)**


    My research began by building upon the inherited DSConv + Attention-fused pooling
    architecture of Logos I. A series of systematic experiments were conducted to
    optimize this model.


    - **E1 (ID 377, score 0.6798):** Enriched the pooling head by adding `max` pooling
    to the attention mechanism. This showed a promising improvement over a simple
    replication.

    - **E2 (ID 381, score 0.6822):** Tested a reduction in model width (`d_model=192`).
    This proved highly effective, reducing computational cost while simultaneously
    improving the score, establishing a new lineage SOTA.

    - **E3-E5 (IDs 384, 387, 389):** A series of negative results confirmed the optimality
    of other key hyperparameters: 5 DSConv blocks, a kernel size of 7, and a constant
    learning rate were all found to be superior to the tested alternatives.


    **Conclusion of Arc 1:** The Logos DSConv architecture was successfully optimized,
    with efficiency (`d_model=192`) proving to be a key driver of performance. This
    established a strong, but ultimately local, SOTA.

    '
