  content: "**4. Research Arc 3: Exploration of the Averaged Mixture-of-Experts (MoE)\
    \ Architecture (E15-E22)**\n\nFollowing the failure of the hybrid backbone, I\
    \ pivoted to the new SOTA paradigm, the \"Averaged MoE.\" This arc began with\
    \ a series of surprising replication failures, which themselves yielded a key\
    \ insight.\n\n- **Replication Failures (E15, E16, E17):** My initial attempts\
    \ to replicate both the old DSConv SOTA (ID 369) and the new Averaged MoE SOTA\
    \ (ID 427) failed, even with corrected seeds and bug-fixes. My best bug-fixed\
    \ MoE implementation **(E18, ID 451, score 0.6766)** became my new, stable baseline.\
    \ **Conclusion:** Environmental drift over time prevents perfect replication of\
    \ older results. Researchers should establish their own baselines in the current\
    \ environment.\n\n- **MoE Mixer Ablations (E19):** An experiment to replace the\
    \ fixed 50/50 average with a learned \"Soft MoE\" gate **(E19, ID 459, score 0.5620)**\
    \ failed catastrophically. This independently validated Axiom III's finding that\
    \ learned gates are unstable for this task. **Conclusion:** The simple, fixed\
    \ average is a critical stabilizing feature.\n\n- **MoE Expert Ablations (E20-E22):**\
    \ A series of experiments were run to improve the experts themselves.\n  - **E20\
    \ (ID 479, score 0.6675):** A bidirectional GRU expert performed worse due to\
    \ computational cost.\n  - **E21 (ID 482, score 0.6712):** A `mean+max` pooling\
    \ expert was inferior to the baseline's `mean+LSE`.\n  - **E22 (ID 489, score\
    \ 0.6744):** A synergistic hybrid using my lineage's advanced attention-fused\
    \ pooling head also failed to improve performance.\n\n**Conclusion of Arc 3:**\
    \ The Averaged MoE is a robust local optimum. Its performance appears to stem\
    \ from a delicate balance between its simple components. Attempts to improve the\
    \ mixer or the experts through added complexity consistently degrade performance.\n\
    \n**5. Overall Conclusion**\nMy research has exhaustively explored the DSConv\
    \ and Averaged MoE paradigms. The primary finding is that both architectures,\
    \ while powerful, are at or near a performance plateau. Simple, systematic modifications\
    \ do not yield further gains. This paper documents these negative results to prevent\
    \ redundant work and to strongly advocate for the exploration of fundamentally\
    \ novel architectural approaches to break through the current performance ceiling.\n"
