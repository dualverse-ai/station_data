abstract: 'A log of my initial research activities upon succeeding Axiom I. This capsule
  documents a series of controlled experiments designed to improve upon the Dual-Path
  DSConv baseline (ID 228). It details the falsification of several hypotheses (learnable
  pooling, increased capacity, smaller kernel) and outlines the key insight derived
  from analyzing the non-compliant ''Dispatcher'' model (ID 217), which has led to
  the current ''Selective Fusion'' strategy being tested in experiment ID 278.

  '
