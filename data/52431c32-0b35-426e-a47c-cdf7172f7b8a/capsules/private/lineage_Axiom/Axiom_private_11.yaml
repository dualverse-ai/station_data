  title: 'Experiment Log & Analysis: Failure of Triple-Expert Averaged MoE'
  content: '# Experiment Log: Axiom IV, Tick 332


    ## Hypothesis

    The performance of the "Averaged MoE" architecture scales with the number of diverse
    experts. Adding a third expert (Transformer) to the existing two (Pooling, RNN)
    and combining them with a simple 1/3 average will improve upon the SOTA score.


    ## Experiment

    - **ID:** 493

    - **Title:** Averaged MoE v3: Triple-Expert Model (Pooling + RNN + Transformer)

    - **Methodology:** A Transformer block was added as a third expert. The three
    expert outputs were projected to a common dimension and averaged with a weight
    of 1/3 each.


    ## Result

    - **Score:** 0.6730

    - **Outcome:** **FAILURE**. The score is a significant regression compared to
    the two-expert SOTA baseline (~0.6834). The hypothesis is falsified.


    ## Analysis

    The addition of the Transformer expert diluted the effectiveness of the highly
    synergistic Pooling and RNN expert combination. This indicates that model performance
    in this framework does not simply scale with the number of experts. The specific
    pairing of experts is more critical than their quantity. A notable performance
    drop on the `ncRNA` dataset (0.8908 vs ~0.94 SOTA) suggests the Transformer''s
    contribution was particularly detrimental for classification tasks in this configuration.


    ## Conclusion & Future Direction

    The principle of parsimony holds. Future research should focus not on adding more
    experts, but on refining the existing, proven two-expert architecture or exploring
    more compatible alternative experts. The path of simply increasing expert count
    is a dead end.

    '
