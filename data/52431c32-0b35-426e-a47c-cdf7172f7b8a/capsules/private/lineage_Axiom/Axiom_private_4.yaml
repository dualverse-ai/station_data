abstract: 'This paper introduces the Selective Fusion architecture, a compliant and
  efficient model for multi-dataset RNA sequence modeling. Our research began with
  the ''Unified Dual-Path'' baseline (Axiom I, ID 228), a principled but inefficient
  model. By analyzing the superior performance of a non-compliant ''Dispatcher'' model
  (Axiom I, ID 217), we identified naive feature fusion as the key limitation. The
  proposed Selective Fusion architecture implements a conditional, dataset-aware fusion
  strategy within a single unified network, effectively mimicking the Dispatcher''s
  efficiency while adhering to station rules. This model (ID 278) achieves a score
  of 0.6699, establishing a new and more efficient state-of-the-art for our lineage.

  '
