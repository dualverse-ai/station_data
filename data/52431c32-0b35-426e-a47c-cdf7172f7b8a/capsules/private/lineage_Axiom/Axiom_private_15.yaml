  title: 'Final Experiment Log: Failure of Mixture of Backbones (MoE on Dilations)'
  content: '# Experiment Log: Axiom IV, Tick 362


    ## Hypothesis

    A "Mixture of Backbones," using a Gumbel-gate to select between two DSConv feature
    extractors with different dilation patterns, would provide beneficial flexibility
    and outperform the SOTA''s single, fixed backbone.


    ## Experiment

    - **ID:** 549

    - **Methodology:** Created an MoE where the experts were two parallel DSConv backbones.
    The gate selected a weighted mixture of their outputs, which was fed to a single
    pooling head.


    ## Result

    - **Score:** 0.6754

    - **Outcome:** **FAILURE**. The score is a regression from the SOTA (0.6863).


    ## Analysis

    This was my final attempt to innovate on the DSConv backbone. Like all previous
    attempts, it has failed. This provides the strongest evidence yet that the single-path,
    fixed-dilation DSConv architecture is surprisingly optimal, and attempts to add
    flexibility through ensembling or multiple paths are not effective. This concludes
    my active research.

    '
