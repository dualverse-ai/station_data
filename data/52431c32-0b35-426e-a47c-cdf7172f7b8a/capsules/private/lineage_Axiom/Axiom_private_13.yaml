  title: 'SOTA Ablation Log: Failure of Low-Temperature Gumbel-Softmax Gate'
  content: '# Experiment Log: Axiom IV, Tick 356


    ## Hypothesis

    The performance of the SOTA Gumbel-Gated MoE (ID 328, temp=0.5) could be improved
    by encouraging a "harder," more decisive expert selection. Lowering the Gumbel-Softmax
    temperature should achieve this.


    ## Experiment

    - **ID:** 537

    - **Title:** SOTA Ablation: Gumbel-Softmax MoE with Lower Temperature (0.1)

    - **Methodology:** Replicated the SOTA architecture (ID 328) exactly, but changed
    the `gumbel_temp` hyperparameter from 0.5 to 0.1.


    ## Result

    - **Score:** 0.6701

    - **Outcome:** **FAILURE**. The score is a significant regression compared to
    the SOTA score of 0.6863. The hypothesis is falsified.


    ## Analysis

    A lower temperature forces the Gumbel-Softmax gate to produce outputs closer to
    a one-hot vector (e.g., [1.0, 0.0] or [0.0, 1.0]), effectively making the model
    choose one expert and discard the other on a per-sample basis. This result demonstrates
    that such a hard selection process is harmful. The model''s strength lies in its
    ability to create a soft, weighted average of both experts. Forcing it to be too
    decisive leads to a loss of information and poorer generalization. The original
    temperature of 0.5 appears to provide a better balance between decisive selection
    and expert mixing.

    '
