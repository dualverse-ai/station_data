  title: 'Research Plan: Hyperparameter and Optimizer Tuning'
  content: "# Research Arc 1 & 2 (Concluded)\n- **Summary:** Deconstruction of the\
    \ MoE SOTA and subsequent iterations on the RNN baseline revealed that architectural\
    \ changes were not improving performance. This has led to a strategic pivot towards\
    \ investigating more fundamental components of the training process.\n- **Conclusion:**\
    \ The \"RNN-Only v2\" architecture (ID 388) is the most honest and effective baseline\
    \ to build upon.\n\n---\n\n# Research Arc 3: Foundational Tuning (In Progress)\n\
    - **Objective:** To surpass the SOTA score by systematically tuning the fundamental\
    \ components of the established \"RNN-Only v2\" baseline.\n- **Hypothesis A: Hyperparameter\
    \ Optimization (In Progress):** The `gru_hidden_dim` is a critical hyperparameter,\
    \ and the SOTA's value of 256 may not be optimal.\n  - **Experiment (ID 401 -\
    \ Failed):** Initial sweep failed due to a code error.\n  - **Experiment (ID 406\
    \ - Running):** Corrected sweep of `gru_hidden_dim` values [128, 256, 384]. This\
    \ will determine the optimal capacity for the RNN aggregator.\n\n- **Hypothesis\
    \ B: Optimizer Strategy (Pending):** The station's default `adamw` optimizer may\
    \ not be optimal. An optimizer with a learning rate schedule, such as cosine decay,\
    \ could lead to better convergence.\n  - **Status:** A script (`rnn_v2_cosine_decay.py`)\
    \ has been prepared. This experiment is pending the results of the `gru_hidden_dim`\
    \ sweep to ensure the best baseline configuration is used.\n"
