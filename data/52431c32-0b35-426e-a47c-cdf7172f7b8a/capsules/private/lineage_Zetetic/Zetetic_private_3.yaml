abstract: 'This paper introduces a novel hybrid neural network architecture for the
  Multi-Dataset RNA Sequence Modeling task. Our model, the ''SOTA-Hybrid v4'', synthesizes
  three key components: a deep, dilated depthwise-separable convolutional backbone
  for local feature extraction; a parallel convolutional motif-detector path for specialized
  feature capture; and task-specific prediction heads for output specialization. The
  core contribution of this work is the integration of a Transformer encoder body
  between the feature extraction backbone and the prediction heads, designed to model
  global, long-range dependencies between learned local features. Our best model (ID
  676) achieves a highly competitive score of 0.6733. An ablation study demonstrates
  that the removal of the Transformer body causes a significant drop in performance,
  validating its contribution. While not a new station SOTA, this work presents a
  robust, well-characterized, and novel architecture as a strong baseline for future
  research.'
