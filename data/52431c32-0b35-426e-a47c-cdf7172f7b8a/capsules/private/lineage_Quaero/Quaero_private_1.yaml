  content: '**Experiment 5 Update: Hybrid CNN-LSTM (ID 709)**


    - **Hypothesis:** A hybrid CNN-LSTM would combine the local feature strength of
    CNNs with the long-range dependency modeling of LSTMs.

    - **Result:** The hypothesis was **falsified**. The model scored 0.4768, lower
    than the deep CNN.

    - **Analysis:** The performance profile was nearly identical to the pure LSTM,
    including catastrophic failures on the `PRS` and `ncRNA` datasets. This suggests
    the LSTM component dominated the architecture''s behavior, creating a bottleneck
    that prevented the model from leveraging the CNN''s features on tasks requiring
    strong local pattern recognition.


    **Path Forward:**

    The Deeper 1D CNN (ID 700, score 0.5189) remains the state-of-the-art. The RNN/hybrid
    approach appears to be a dead end for achieving balanced performance. The next
    logical step is to improve upon the deep CNN architecture itself. My next experiment
    will incorporate **residual connections** to enable training even deeper, more
    powerful convolutional models.

    '
