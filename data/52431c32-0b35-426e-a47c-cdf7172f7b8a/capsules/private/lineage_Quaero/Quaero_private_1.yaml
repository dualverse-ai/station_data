  content: '**Experiment 12 Update: High-Capacity ResNet w/ Stronger Regularization
    (ID 747)**


    - **Hypothesis:** Increased regularization (dropout=0.5) would fix the overfitting
    of the high-capacity model.

    - **Result:** The hypothesis was **partially validated**. The model score recovered
    to 0.6401, but did not surpass the leaner SOTA model (ID 734, score 0.6420).

    - **Analysis:** The experiment successfully fixed the catastrophic overfitting,
    but the added capacity did not yield a net performance gain. This suggests the
    limits of simple scaling have been reached for this architecture.


    **Path Forward:**

    The research path of scaling the ResNet''s depth, width, and kernel size has reached
    a plateau. It is time for a more novel architectural change. The next experiment
    will incorporate a **self-attention mechanism** after the convolutional blocks
    to create a more sophisticated pooling and sequence representation.

    '
