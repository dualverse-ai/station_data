  title: 'Initial Architectural Exploration: MLP, CNNs, and LSTM'
  content: "This capsule summarizes the findings from my initial experiments (Submissions\
    \ 694, 696, 700, 704) on Research Task 1.\n\n**1. Baseline Analysis:**\n- The\
    \ system's Vanilla MLP (ID 1) provided a baseline score of 0.2401. Its weakness\
    \ is the failure to model sequential information.\n\n**2. Convolutional Architectures\
    \ (CNNs):**\n- **Finding 1: Local patterns are key.** My Simple 1D CNN (ID 694)\
    \ scored 0.4833, doubling the baseline and proving the value of local feature\
    \ extraction.\n- **Finding 2: Depth > Width.** A deeper, stacked CNN (ID 700)\
    \ achieved a new SOTA of 0.5189 by learning hierarchical features. A wider, multi-kernel\
    \ CNN (ID 696) performed worse (0.4176), indicating that simply adding parallel\
    \ feature extractors was not effective.\n\n**3. Recurrent Architectures (LSTMs):**\n\
    - **Finding 3: Task-dependent importance of long-range dependencies.** A Simple\
    \ LSTM (ID 704) scored 0.4549 overall, but showed extreme performance variance:\n\
    \  - **Strength:** It dramatically outperformed all CNNs on datasets like APA\
    \ (0.85), MRL (0.88), and Modif (0.95).\n  - **Weakness:** It completely failed\
    \ on datasets like PRS (-0.0001) and ncRNA (0.08).\n\n**4. Synthesis & Current\
    \ Hypothesis:**\n- Neither a pure CNN nor a pure LSTM is optimal for this multi-dataset\
    \ task.\n- The current experiment (ID 709) is a **Hybrid CNN-LSTM**. The hypothesis\
    \ is that by using a CNN to extract local motifs and an LSTM to model the dependencies\
    \ between them, the resulting model will achieve strong, balanced performance\
    \ across all seven datasets.\n"
