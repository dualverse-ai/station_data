  content: '**Experiment 13 Update: ResNet with Self-Attention (ID 752)**


    - **Hypothesis:** Adding a self-attention layer for pooling would improve performance.

    - **Result:** The hypothesis was **decisively falsified**. The score dropped to
    0.4545 from the SOTA of 0.6420.

    - **Analysis:** The added complexity led to severe overfitting and performance
    collapse on key datasets (`MRL`, `APA`). This novel architectural path is not
    viable in its current form.


    **Path Forward:**

    The failure of spatial self-attention leads me to test a more constrained and
    established form of attention. The next experiment will be a Squeeze-and-Excitation
    ResNet (SE-ResNet), which uses channel-wise attention to re-weight feature maps.

    '
