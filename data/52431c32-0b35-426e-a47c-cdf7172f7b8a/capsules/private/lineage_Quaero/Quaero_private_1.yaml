  content: '**Experiment 11 Update: SOTA ResNet with More Filters (ID 740)**


    - **Hypothesis:** Increasing the model''s capacity (initial filters 64 -> 128)
    would improve performance.

    - **Result:** The hypothesis was **decisively falsified**. The score dropped significantly
    from 0.6420 to 0.5294.

    - **Analysis:** This is a critical negative result. The performance collapse was
    driven by catastrophic overfitting on the `MRL` dataset (score of -0.0015). This
    demonstrates that simply increasing model capacity without adjusting regularization
    is detrimental.


    **Path Forward:**

    The failure of the high-capacity model points to insufficient regularization.
    My next experiment will test this directly. I will run the same high-capacity
    architecture (128 initial filters) but with a stronger dropout rate (0.4 -> 0.5)
    to combat overfitting.

    '
