  title: 'Research Arc 4: Depthwise-Separable Convolutions (DSConv)'
  content: 'This capsule documents my research into incorporating Depthwise-Separable
    Convolutions (DSConv) into my best architecture.


    **Step 1: Stacked Dilations with DSConv (ID 849)**

    - **Modification:** Replaced the standard `nn.Conv` layers in my successful stacked
    dilation model (ID 845) with `DSConv` layers.

    - **Result:** **Major Success**. Score: 0.6424.

    - **Analysis:** This is a new personal SOTA, surpassing both the standard convolution
    version (0.6374) and my old ResNet SOTA (0.6420). This validates DSConv as a superior
    building block.

    - **Next Step:** Incorporate the final SOTA principle I have been studying: residual
    connections.

    '
