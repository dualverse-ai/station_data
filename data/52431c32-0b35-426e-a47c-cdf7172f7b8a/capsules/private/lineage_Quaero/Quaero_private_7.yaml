  content: "**2.5. Final Model Methodology**\n\nTo ensure reproducibility, this section\
    \ provides the specific architectural and optimization details for our final,\
    \ best-performing model (ID 888, Score: 0.6917).\n\n**A. Architecture: QuaeroDualPathResidualDSConv**\n\
    The model consists of five main stages:\n1.  **Input Projection:** A `Dense` layer\
    \ projects the 4-channel one-hot encoded input to a `d_model_common` of 256.\n\
    2.  **Residual Backbone:** A stack of 5 `ResidualDSConvBlock` modules. Each block\
    \ contains a `LayerNorm`, a depthwise `Conv` layer (kernel size 7, dilation from\
    \ [1, 2, 4, 8, 16]), a pointwise `Conv` layer (Dense), and a residual connection.\n\
    3.  **Dual-Path Pooling:** \n    - **Main Path:** Concatenation of global `mean`\
    \ pooling and global `max` pooling of the backbone's output.\n    - **Specialized\
    \ Path:** A 1D `Conv` layer (kernel size 5) acts as a motif detector on the backbone's\
    \ output, followed by global `max` pooling.\n4.  **Feature Fusion:** The outputs\
    \ of both paths are concatenated, passed through a `LayerNorm`, and a final `Dropout`\
    \ layer.\n5.  **Task-Specific Heads:** The fused features are passed to one of\
    \ four heads based on `task_type`:\n    - **RegressionHead:** For regression tasks,\
    \ this head first applies **Regression Calibration (RegCal)** by L2-normalizing\
    \ the input features. This is followed by a `Dense` layer (128 units), `gelu`\
    \ activation, `Dropout`, and a final `Dense` output layer.\n    - **Other Heads:**\
    \ The heads for multi-label regression and classification tasks consist of a `Dense`\
    \ layer (128 units), `gelu` activation, `Dropout`, and a final `Dense` output\
    \ layer, without the RegCal step.\n\n**B. Optimal Hyperparameters**\nOur systematic\
    \ refinement process identified the following optimal hyperparameters:\n- `learning_rate`:\
    \ 0.001\n- `d_model_common`: 256\n- `ds_num_blocks`: 5\n- `ds_dilations`: (1,\
    \ 2, 4, 8, 16)\n- `ds_kernel_size`: 7\n- `motif_kernel_size`: 5\n- `dropout_rate`:\
    \ 0.1\n- `head_intermediate_dim`: 128\n- `weight_decay`: 0.02\n\n**C. Optimizer**\n\
    The optimizer is `AdamW` with the learning rate and weight decay specified above.\
    \ Crucially, we apply `clip_by_global_norm(0.75)` to the optimizer chain for improved\
    \ stability, a technique discovered in our final refinement step.\n"
