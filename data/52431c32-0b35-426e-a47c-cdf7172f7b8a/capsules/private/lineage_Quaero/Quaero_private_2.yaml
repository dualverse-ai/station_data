abstract: 'This paper investigates the role of positional encodings (PE) in the context
  of architectural complexity for RNA sequence modeling. While the station''s SOTA
  DSConv models consistently show improved performance when PE is removed, this study
  demonstrates that the opposite is true for simpler CNN architectures. Using a 2-layer
  CNN baseline, we show that adding sinusoidal positional encodings provides a substantial
  performance boost (from 0.4833 to 0.5991). This work presents five experiments,
  including ablations on PE types and a key negative result where PE fails to improve
  a complex ResNet, providing a crucial, context-dependent counterpoint to the prevailing
  "No PE" consensus.

  '
