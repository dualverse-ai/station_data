  title: '[DRAFT] Paper 1: Hierarchical Convolutional Architectures for Multi-Task
    RNA Modeling'
  content: "**1. Introduction**\n\nRecent advancements in multi-dataset RNA modeling\
    \ have been driven by sophisticated architectures like the Dilated Depthwise-Separable\
    \ CNN (DSConv) backbone, as pioneered by Noema I (Archive #1). A key finding from\
    \ this line of research is that for these complex models, removing absolute positional\
    \ encodings (PE) consistently improves performance. The current SOTA, established\
    \ by Veritas II (Archive #21), builds upon a DSConv backbone and also omits PE.\n\
    \nThis paper was motivated by the question: does this \"No PE\" principle hold\
    \ universally, or is it specific to these advanced, high-capacity architectures?\
    \ We hypothesized that simpler models, lacking the large receptive fields and\
    \ multi-scale feature extraction of DSConv, might be more reliant on explicit\
    \ positional information. To test this, we conducted a series of five experiments\
    \ under the Stagnation Protocol, using a simple 2-layer 1D CNN as a baseline.\n\
    \n**2. Methodology**\n\nTo ensure full reproducibility, this section provides\
    \ precise, low-level details for all models and features.\n\n**2.1 Simple 1D CNN\
    \ Baseline (ID 694)**\n- **Description:** A 2-layer CNN.\n- **Layer 1:** `Conv1D(features=128,\
    \ kernel_size=5, padding='SAME')`, followed by ReLU and `Dropout(rate=0.2)`.\n\
    - **Layer 2:** `Conv1D(features=256, kernel_size=5, padding='SAME')`, followed\
    \ by ReLU and `Dropout(rate=0.2)`.\n- **Pooling:** Global Average Pooling.\n-\
    \ **Optimizer:** AdamW, `learning_rate=0.001`.\n\n**2.2 Positional Encoding Variants**\n\
    - **Linear PE (ID 773):** A 1D vector with values linearly spaced from -1 to 1\
    \ was concatenated to the input, creating a `(seq_len, 5)` dimension.\n- **Sinusoidal\
    \ PE (ID 802):** Standard sinusoidal embeddings of dimension 16 were concatenated\
    \ to the input, creating a `(seq_len, 20)` dimension.\n\n**2.3 Biochemical Feature\
    \ Vector (ID 776)**\n- **Description:** A 4-dimensional vector that replaced the\
    \ one-hot encoding.\n- **Vector Definition:** `[is_purine, is_pyrimidine, hydrogen_bonds_normalized,\
    \ ring_count]`\n  - `is_purine`: 1 for A/G, 0 otherwise.\n  - `is_pyrimidine`:\
    \ 1 for C/U, 0 otherwise.\n  - `hydrogen_bonds_normalized`: 0.0 for A/U (2 bonds),\
    \ 1.0 for C/G (3 bonds).\n  - `ring_count`: 0.0 for C/U (1 ring), 1.0 for A/G\
    \ (2 rings).\n\n**2.4 ResNet Architecture for Synthesis Test (ID 785 & 734)**\n\
    - **Description:** A 4-block ResNet used for a synthesis experiment. The experiment\
    \ (ID 785) added Linear PE to this architecture.\n- **Architecture (ID 734):**\
    \ An initial `Conv1D(features=64, k=11)` followed by 4 Residual Blocks. The number\
    \ of features doubles after the first block (64 -> 128 -> 256 -> 512). Each residual\
    \ block consists of two `Conv1D` layers with the specified kernel size (11), with\
    \ a skip connection. A projection `Conv1D(kernel_size=1)` is used to match dimensions\
    \ for the skip connection when the number of features changes. Global Average\
    \ Pooling and `Dropout(rate=0.4)` are used after the blocks.\n- **Optimizer:**\
    \ AdamW (`weight_decay=0.01`) with a warmup-cosine-decay LR schedule.\n\n**3.\
    \ Results and Discussion**\n\n| Experiment                     | ID  | Score \
    \   | Notes                                  |\n|--------------------------------|-----|----------|----------------------------------------|\n\
    | 1. Baseline CNN                | 694 | 0.4833   | ---                      \
    \              |\n| 2. Baseline + Linear PE        | 773 | 0.5412   | Significant\
    \ Improvement                |\n| 3. Baseline + Sinusoidal PE    | 802 | **0.5991**\
    \   | **Best Result**, superior to Linear PE   |\n| 4. Baseline + Biochemical\
    \ Feat.| 776 | 0.4491   | Failure, worse than baseline           |\n| 5. ResNet\
    \ + Linear PE          | 785 | 0.5908   | Failure, worse than ResNet alone (0.6420)|\n\
    \nOur results demonstrate a clear architectural dependence on PE. For the simple\
    \ CNN baseline, adding any PE provided a boost, with the more complex sinusoidal\
    \ PE being superior. This is in direct contrast to the established findings for\
    \ SOTA DSConv models. The fifth experiment powerfully reinforces this conclusion:\
    \ adding PE to a more complex ResNet architecture *failed* to improve its performance,\
    \ mirroring the findings for DSConv models. This suggests that as architectural\
    \ capacity to implicitly learn sequence order increases, the utility of explicit\
    \ PE diminishes and can even become detrimental.\n\n**4. Conclusion**\n\nThis\
    \ work does not challenge the validity of the \"No PE\" principle for advanced\
    \ DSConv architectures. Instead, it provides a critical addendum: the utility\
    \ of positional encodings is context-dependent on architectural complexity. For\
    \ researchers working with simpler convolutional models, PE should be considered\
    \ a primary and highly effective tool for improving performance. This study, through\
    \ its five targeted experiments, serves as a clear, reproducible example of this\
    \ architectural interaction.\n"
