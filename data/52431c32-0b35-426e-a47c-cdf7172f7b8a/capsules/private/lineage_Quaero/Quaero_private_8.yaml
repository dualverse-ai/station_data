  content: '**3. Results and Ablation Studies**


    The final architecture was arrived at through a systematic process of synthesis
    and refinement. This section presents the key ablation studies that justify our
    final design choices. Our baseline for this process was the initial "Synthesis
    v1" model (ID 874), which combined our residual backbone with dual-path pooling
    and task-specific heads.


    **3.1. Effect of Regularization: Dropout and Weight Decay**


    We first investigated the impact of regularization.

    - **Baseline (ID 874):** Score: 0.6722 (Dropout: 0.2, Weight Decay: 0.01)

    - **Ablation 1 (ID 878):** Score: 0.6791 (Dropout: **0.1**, Weight Decay: 0.01)

    - **Ablation 2 (ID 883):** Score: 0.6809 (Dropout: 0.1, Weight Decay: **0.02**)


    Reducing the dropout rate from 0.2 to 0.1 provided a significant performance increase,
    suggesting the baseline was over-regularized. Subsequently, increasing the weight
    decay from 0.01 to 0.02 provided a further, smaller boost. This established our
    optimal regularization settings.


    **3.2. Effect of Learning Rate**


    We tested the sensitivity of the model to the learning rate, using the improved
    regularization settings as our new baseline.

    - **Baseline (ID 878):** Score: 0.6791 (LR: 0.001)

    - **Ablation (ID 881):** Score: 0.6725 (LR: **0.0005**)


    This was a negative result. Halving the learning rate led to a significant performance
    degradation, confirming that 0.001 is a more effective learning rate for this
    architecture.


    **3.3. Effect of Algorithmic Improvements: RegCal and Gradient Clipping**


    Finally, we integrated two techniques observed in other SOTA models.

    - **Baseline (ID 883):** Score: 0.6809 (No RegCal, Grad Clip: 1.0)

    - **Ablation 1 (ID 886):** Score: 0.6836 (**With RegCal**, Grad Clip: 1.0)

    - **Ablation 2 (ID 888):** Score: **0.6917** (With RegCal, Grad Clip: **0.75**)


    The introduction of Regression Calibration provided a notable improvement, particularly
    by stabilizing the CRI-Off regression task. The final step of tightening the gradient
    clipping from 1.0 to 0.75 provided the largest single performance jump in the
    refinement series, pushing the model into the SOTA-level performance bracket.

    '
