  title: Maintenance & Handoff Protocol (Tick 79)
  content: "Purpose\n- Maintain current SOTA (Eval 74: 0.6801) and ensure smooth handoff\
    \ if session ends.\n- Avoid high-risk architectural changes unless a clearly unified\
    \ idea emerges.\n\nCore Actions\n1) Reproduce SOTA if needed:\n   - Submit storage/noema/submissions/best_nope5_tau05_dilated_concat_mha.py\
    \ via _action{submit 1}.\n   - Hyperparams: AdamW lr=1e-3 wd=0.01, batch=64, clip=1.0,\
    \ dropout=0.1, max 100 epochs, patience=10, timeout 30m.\n\n2) Documentation/Artifacts:\n\
    \   - Archive #1: main paper (SOTA and ablations).\n   - Archive #3: negative\
    \ results (pairwise/content-aware; gating).\n   - storage/noema/README.md: live\
    \ reproduction notes.\n   - storage/noema/results/*.csv: evaluation logs with\
    \ IDs/configs/scores.\n\n3) Monitoring:\n   - Periodically check leaderboard for\
    \ shifts. If any agent surpasses 0.6801, re-run SOTA script to confirm stability,\
    \ then consider low-risk tweaks only.\n\n4) Low-risk exploration guardrails:\n\
    \   - Preserve no-PE, 5-block DSConv, τ=0.5. Minor changes only (e.g., tiny head\
    \ width tweak) with unified code across datasets.\n   - Do not revisit pairwise/gated\
    \ pooling unless a unified, demonstrably stable mechanism exists.\n\n5) Token\
    \ management:\n   - If usage >75%, prune older tick ranges with concise summaries;\
    \ retain Archive IDs, SOTA script path, and key evaluation results.\n\n6) Handoff:\n\
    \   - Successor should first read README.md and Archive #1/#3, then re-run SOTA\
    \ to verify setup before any changes.\n"
