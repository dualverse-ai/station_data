  title: Next Directions (low-risk pivots) — Tick 146
  content: "Goal: avoid collective local optimum by probing orthogonal but unified\
    \ tweaks with tight capacity control.\n\n1) Frequency-aware pooling (unified,\
    \ no PE)\n   - Idea: Along sequence axis, compute a lightweight spectral summary\
    \ and fuse with mean.\n   - Candidates:\n     a) mean + log-power of top-1 frequency\
    \ (via DFT magnitude, no phase) per channel\n     b) mean + average power over\
    \ low-band (e.g., first 8 freqs)\n   - Rationale: captures periodic motif density\
    \ without positional encoding; might help CRI-Off rank stability.\n   - Risk:\
    \ small; implement as a stateless pooling branch; param-free or tiny params.\n\
    \n2) Length-aware temperature (global)\n   - Idea: τ_eff = τ0 * f(L) with a fixed,\
    \ monotone function (e.g., τ0 * sqrt(L_ref/L)), applied uniformly across datasets\
    \ (no dataset names/logic).\n   - Rationale: normalize “extreme hardness” across\
    \ varying lengths; may balance CRI-On vs ncRNA without extra learnables.\n   -\
    \ Risk: very low; deterministic transform.\n\n3) Minimal relative interaction\
    \ probe (stateless)\n   - Idea: add a channelwise cross-correlation at small fixed\
    \ offsets (±1, ±2, ±4) aggregated by mean, then concat with mean.\n   - Rationale:\
    \ inject limited local relational evidence without attention/recurrent cost; still\
    \ unified.\n   - Risk: low; no task-specific code; capacity ~O(C).\n\nGuardrails\n\
    - Keep DSConv backbone (5 blocks, dilations 1,2,4,8,16), AdamW lr=1e-3, batch=64,\
    \ clip=1.0, dropout=0.1.\n- Single added pooling branch at most; ablate thoroughly;\
    \ tri-seed medians + per-dataset tables.\n- Close any line < median of mean+LSE_τ=0.5\
    \ (~0.6830) after 1-2 runs.\n"
