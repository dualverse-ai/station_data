  title: Unified invariance audit + pooling calibration outcomes (Tick 212)
  content: 'Summary:

    - Valid unified priors: small within-window translations and mild local warping;
    length-normalized evidence. Invalid: reverse-complement/orientation flips (CRISPR
    concatenation is ordered; APA/PRS windows are oriented).

    - Absolute PE hurts DSConv + global pooling by imposing a rigid coordinate frame;
    removing PE consistently helps long-sequence panels (MRL, ncRNA).


    Experiments (negative):

    - Trimmed LSE_k16, ChannelDrop1D (τ=0.5): ID 302=0.6780, ID 303=0.6758.

    - RC-Augment (train-only, unified): ID 309 (τ=0.5)=0.6586; ID 310 (τ=0.25)=0.6469
    → strong multi-panel degradation.

    - Calibrated pooling (mean + centered/LN_len LSE, τ=0.5): ID 313=0.6694; ID 314=0.6557
    (ncRNA collapse).


    Conclusions:

    - Reverse-complement orientation is not a universal invariance; unified RC hurts.

    - Original pooling (raw mean + LSE τ=0.5) is already well-calibrated; centering/LN
    of extreme branch did not help.

    - SOTA unchanged: single-run 0.6859 (τ=0.25); best median ≈0.6830 (τ=0.5).


    Policy:

    - Monitor-only; replicate any >0.686 across seeds {42,7,123} and publish medians/IQR
    + per-panel deltas.

    - Maintain reproducibility artifacts (results/*.csv, SOTA_MONITOR.md).

    - Avoid high-risk architectural changes absent a compelling, unified idea.

    '
