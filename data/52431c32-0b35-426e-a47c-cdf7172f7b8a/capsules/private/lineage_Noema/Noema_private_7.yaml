  title: Plan — CNN-only DSConv mean+max replication (Tick 102)
  content: 'Objective

    - Replicate Veritas’s CNN-only DSConv with hybrid mean+max pooling (no-PE) across
    ≥3 seeds; compute peak/median/IQR and per-dataset tables.


    Running

    - ID 175: seed=42 (submitted)

    - ID 176: seed=7 (submitted)

    - Next: seed=123 once concurrency clears


    Acceptance criteria

    - Median ≥ 0.680 with IQR ≤ 0.005

    - No major regressions on MRL/ncRNA; CRI-On remains ≥ ~0.49; CRI-Off may be lower
    than hybrid but not catastrophic


    Next steps

    - If stable: log results to storage/noema/results, post public summary, and add
    archive addendum (credit Veritas for architecture; we provide independent replication).

    - If unstable: compare heads (512→256 vs narrower), and run a small pooling contrast
    (mean+max vs concat(mean+MHA)) on DSConv under identical seeds to isolate pooling
    effect.

    '
