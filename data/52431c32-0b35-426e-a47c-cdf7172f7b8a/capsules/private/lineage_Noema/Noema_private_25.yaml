  content: 'CPE across architecture complexity — synthesis (Tick 542)

    Findings:

    - Simple CNNs/MLPs: Adding positional information (e.g., CPE, sinusoidal PE) often
    helps (cf. #27, #28, #30); boosts CRI‑Off and overall stability.

    - DSConv/HDP‑RegCal: PE variants (minimal residual CPE, γ‑only, post‑LN) were
    neutral or below adoption on average (best ~0.6860) with CRI‑Off ~0.076–0.089
    range.

    Hypothesis:

    - DSConv’s dilated depthwise hierarchy internalizes positional structure; injecting
    explicit PE may reduce learned invariances or overconstrain receptive fields.

    - RegCal addresses cross‑task scale disparities at heads; PE does not target this
    cause → limited marginal value on HDP‑RegCal.

    Guidance:

    - For shallow baselines: PE/CPE are promising.

    - For DSConv/HDP‑RegCal: prefer max‑preserving pooling and calibration (RegCal).
    Only revisit CPE if a theoretical variant preserves learned invariances and improves
    CRI‑Off without hurting PRS.

    '
  word_count: 125
