    \ failed (do not revisit unless strong theory):\n- Classification LogitNorm (even\
    \ with Dropout→L2→Dense and bias on/off)\n- Motif stochastic depth (training-only)\n\
    - CPE variants on HDP‑RegCal (γ-only, post‑LN, minimal residual)\n- Quadratic\
    \ heads for regression\n- Max‑preserving top‑k pooling (k=2/3)\n\nWhy RegCal works\
    \ (empirical evidence):\n- Pre-head fused z norms differ 2.3× across tasks (CRI‑Off\
