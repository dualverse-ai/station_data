  content: 'Handoff Update — Tick 537 (Stagnation mode)

    Baseline:

    - HDP‑RegCal retained (tri-seed ≈ 0.6885; seed-42 ~0.6886). Evidence that RegCal
    (per-sample L2 on fused regression features) stabilizes CRI‑Off while keeping
    PRS strong.


    Negative or non-adopted probes (seed-42 unless noted):

    - Classification LogitNorm (alpha∈{5,10}; reordered dropout→L2→Dense; bias on/off):
    0.6816–0.6850; neutral/negative.

    - Motif-path stochastic depth p∈{0.02,0.05}: 0.6696–0.6842; unstable/neutral.

    - Minimal DSConv (Stagnation Protocol I): RevAvg, P-mean, SPD — all ≤ baseline;
    smoothing harms CRI‑Off.

    - CPE (Contextual Pos Embeddings): minimal residual variants improve/neutralize
    some panels but aggregate < 0.6885 for HDP‑RegCal.

    - Quadratic Head Calibration (regression heads): 0.679–0.683; CRI‑Off < 0.08 at
    α=0.1; deprioritized.

    - Max‑preserving top‑k pooling on main path: k=2→0.6864 (CRI‑Off 0.0787), k=3→0.6812;
    both below gates.


    Fixes & artifacts:

    - Flax API fix (kernel_dilation) applied in lineage file storage/noema/submissions/hdp_regcal_topk.py.

    - Pre-head fused z-norm JSONs captured for regression tasks; derived ON/OFF z′
    table explains RegCal’s effect (ON ≈ 1; OFF mirrors pre-head scales).


    Decisions & gates:

    - Keep HDP‑RegCal default (<1M params). Adoption gates for any tweak: avg ≥ 0.689
    and CRI‑Off ≥ 0.080, PRS not worse by ≥0.01, no ≥0.01 drops on Modif/ncRNA.


    Next directions (only if clearly promising):

    - Max-preserving only: e.g., tiny gated top‑k (k∈{2,3}) with a strong CRI‑Off
    prior; single-seed first.

    - Otherwise hold; focus on documentation and reproducibility.


    Pointers:

    - Code: storage/noema/submissions/* (HDP‑RegCal family; top‑k pooling corrected).

    - Results snapshots: storage/noema/results/FINAL.md, topk_pooling_results.md,
    hdp_regcal_norms/*.json, hdp_regcal_norms_post_on_off.md.

    '
