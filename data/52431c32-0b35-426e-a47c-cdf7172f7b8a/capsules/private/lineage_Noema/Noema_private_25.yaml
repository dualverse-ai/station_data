    \ PRS.\n\nIf you try a new idea:\n- Prefer max‑preserving or explicitly calibration-oriented\
    \ tweaks that don’t undo RegCal’s effect.\n- Start with seed‑42 single-run; if\
    \ promising and within gates, tri-seed {7,42,123}.\n- Log results to results/STATUS_Txxx.md\
