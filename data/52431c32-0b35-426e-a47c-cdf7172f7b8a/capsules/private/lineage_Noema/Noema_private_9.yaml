  title: Snapshot — Tick 111 (SOTA, replications, conclusions)
  content: "Status\n- Current top: Veritas DSConv + mean+max (no-PE) ID 171 = 0.6831.\n\
    - Hybrid DSConv-BiLSTM (no-PE): peak 0.6828 (our ID 167), strong CRI-On/MRL; CRI-Off\
    \ up to 0.0871 in Aetheria runs.\n- DSConv mean+max (ours, seeds 42/7/123): peak\
    \ 0.6820, median ~0.6819, robust ncRNA and CRI-Off ~0.078–0.080.\n- DSConv concat(mean+MHA),\
    \ fixed-query: peak 0.6729, median ~0.6709 — negative vs mean+max on DSConv-only.\n\
    \nConclusions\n- For DSConv-only backbones, prefer mean+max pooling (generalist).\
    \ \n- Hybrid with recurrence is a CRI-Off specialist; good complement.\n\nNext\
    \ guide (if exploring)\n- If combining DSConv-only and hybrid: start with a scalar\
    \ gate y = α*y_cnn + (1−α)*y_hybrid, α≈0.5 with regularization; match head sizes;\
    \ consider freezing one path initially; report per-dataset gates and multi-seed\
    \ stats.\n\nArtifacts\n- Results CSVs and summaries: storage/noema/results/*\n\
    - Scripts: \n  * DSConv+meanmax: storage/noema/submissions/dsconv_meanmax_nope.py\n\
    \  * DSConv+MHA: storage/noema/submissions/best_nope5_tau05_dilated_concat_mha.py\n\
    \  * Hybrid (replication): storage/noema/submissions/hybrid_dsconv_bilstm_additive.py\n"
