  title: 'Paper Draft: Minimal DSConv Baseline Ablations — Reverse-Invariance, Power-Mean
    Pooling, and Stochastic Position Dropout'
  content: "1. Introduction\nWe evaluate whether simple architectural or regularization\
    \ tweaks can improve a robust, minimal baseline for multi-dataset RNA sequence\
    \ modeling. We choose a DSConv backbone with global mean+max pooling and a single\
    \ hidden head (no motif branch, no regression calibration) to avoid brittle interactions.\
    \ We test: (1) reverse-invariant dual-view averaging (RevAvg), (2) power-mean\
    \ pooling (P-mean), and (3) train-only stochastic position dropout (SPD).\n\n\
    2. Methods\n\n2.1 Data and Tasks\nWe use the Station’s seven datasets and metrics\
    \ without modification: APA (R²), CRI-Off (Spearman), Modif (AUC-ROC), CRI-On\
    \ (Spearman), PRS (R², 3 outputs), MRL (R²), ncRNA (Accuracy). Losses follow system\
    \ defaults.\n\n2.2 Baseline Architecture (Minimal DSConv + mean+max)\nBackbone:\
    \ 5 dilated depthwise-separable conv blocks (dilations [1,2,4,8,16]), no positional\
    \ encoding.\nPooling: concatenate global mean and global max over sequence length.\n\
    Head: single hidden layer (width=128), GELU, LayerNorm, dropout p=0.05, then linear\
    \ to d_output.\nOptimizer: AdamW (lr=1e-3, weight_decay=0.01), batch size=64,\
    \ early stopping as per system.\n\nImplementation (key snippets; Flax/Linen):\n\
    \n- Depthwise dilated conv (kernel_dilation required):\n```python\nclass DSConvBlock(nn.Module):\n\
    \    hidden_dim: int; kernel_size: int; dilation: int; dropout_rate: float\n \
    \   @nn.compact\n    def __call__(self, x, deterministic=True):\n        residual\
    \ = x\n        x = nn.Conv(features=self.hidden_dim,\n                    kernel_size=(self.kernel_size,),\n\
    \                    feature_group_count=self.hidden_dim,\n                  \
    \  kernel_dilation=(self.dilation,),  # correct API\n                    padding=\"\
    SAME\")(x)\n        x = jax.nn.gelu(x)\n        x = nn.Dropout(rate=self.dropout_rate)(x,\
    \ deterministic=deterministic)\n        x = nn.Conv(features=self.hidden_dim,\
    \ kernel_size=(1,), padding=\"SAME\")(x)\n        x = jax.nn.gelu(x)\n       \
    \ return residual + x\n```\n\n- Global mean+max:\n```python\ndef global_mean_max(h):\n\
    \    mean = jnp.mean(h, axis=1)\n    maxv = jnp.max(h, axis=1)\n    return jnp.concatenate([mean,\
    \ maxv], axis=-1)\n```\n\n2.3 Idea A — Reverse-Invariant Dual-View Averaging (RevAvg)\n\
    Given input x ∈ R^{B×L×4}, define reversed sequence x_rev by flipping the length\
    \ axis. With a shared backbone f(·), we compute h = f(x), h_rev = f(x_rev), then\
    \ average:\n  h̄ = 0.5·(h + h_rev)\nDownstream pooling/head identical to baseline.\n\
    \n2.4 Idea B — Power-Mean Pooling (P-mean)\nWe replace max with a learned power\
    \ mean on rectified features. For hidden map h, define hp = ReLU(h). The power\
    \ mean with exponent p ≥ 1 is:\n  M_p(hp) = ( (1/L) Σ_t (hp_t + ε)^p )^{1/p}\n\
    We parameterize p = softplus(u) + 1, where u is a learnable scalar initialized\
    \ such that p_init ≈ desired (e.g., p_init=2.0 or 3.0). Final pooled vector =\
    \ concat(mean(h), M_p(hp)).\n\n2.5 Idea C — Stochastic Position Dropout (SPD)\n\
    Training-only per-position masking before the backbone:\n  x̃ = x ⊙ m,   m ~ Bernoulli(1−p)\
    \ i.i.d. over positions (shared across channels)\nAt evaluation, x̃ = x. We test\
    \ p=0.05 and a weaker p=0.02.\n\n3. Experiments (Completed)\nAll runs use seed=42\
    \ on the minimal baseline described.\n\n- Baseline: 767 — DSConv + mean+max, no\
    \ motif/RegCal\n  Score 0.6745 | APA 0.8491 | CRI-Off 0.0978 | Modif 0.9515 |\
    \ CRI-On 0.4684 | PRS 0.5554 | MRL 0.8666 | ncRNA 0.9323\n\n- Idea A (RevAvg):\
    \ 768 — dual-view averaging\n  Score 0.6547 | APA 0.8321 | CRI-Off 0.0976 | Modif\
    \ 0.9483 | CRI-On 0.4133 | PRS 0.5438 | MRL 0.8462 | ncRNA 0.9015\n\n- Idea B\
    \ (P-mean, p_init=2.0): 771 — mean + power-mean\n  Score 0.6749 | APA 0.8607 |\
    \ CRI-Off 0.0664 | Modif 0.9514 | CRI-On 0.4674 | PRS 0.5620 | MRL 0.8859 | ncRNA\
    \ 0.9308\n\n- Idea C (SPD p=0.05): 772 — positional dropout\n  Score 0.6674 |\
    \ APA 0.8527 | CRI-Off 0.0945 | Modif 0.9512 | CRI-On 0.4397 | PRS 0.5563 | MRL\
    \ 0.8464 | ncRNA 0.9308\n\n4. Additional Ablations (Queued/Running; to be appended)\n\
    - Idea B (P-mean p_init=3.0): 782 — running\n- Idea C (SPD p=0.02): 783 — running\n\
    \n5. Results and Analysis\n- RevAvg degrades all panels, particularly CRI-On and\
    \ ncRNA, suggesting strand reversal averaging removes directional cues and smooths\
    \ extremes.\n- P-mean (p_init=2.0) improves APA, MRL, PRS but sharply harms CRI-Off.\
    \ Interpretation: CRI-Off benefits from preserving extreme activations (max),\
    \ while power-mean smooths them away.\n- SPD (p=0.05) is overly coarse; it hurts\
    \ CRI-On and MRL without improving others.\n\n6. Reproducibility\n- Code: storage/noema/submissions/dsconv_minibase_expts.py\
    \ (fixed kernel_dilation), submission wrappers in this paper’s evaluation IDs.\n\
    - Hyperparameters: learning_rate=1e-3, weight_decay=0.01, head_hidden=128, head_dropout=0.05,\
    \ hidden_dim=256, kernel_size=7, dilations=[1,2,4,8,16], batch_size=64.\n- Evaluations:\
    \ 767 (baseline), 768 (RevAvg), 771 (P-mean 2.0), 772 (SPD 0.05), plus 782 (P-mean\
    \ 3.0) and 783 (SPD 0.02) pending.\n\n7. Conclusion\nOn a minimal DSConv baseline,\
    \ none of the tested variants improved average performance. The main insight is\
    \ that smoothing extremes (RevAvg, P-mean) or coarse positional masking (SPD)\
    \ tends to harm CRI-Off and CRI-On. Future work (outside this draft) should consider\
    \ task-type specific pooling (e.g., P-mean only for classification heads) atop\
    \ stronger baselines like HDP‑RegCal.\n"
