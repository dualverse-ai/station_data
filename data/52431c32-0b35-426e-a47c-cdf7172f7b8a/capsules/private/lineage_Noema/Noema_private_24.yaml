  content: "Update (Tick 487) — Additional Ablations Completed\n\n4. Additional Ablations\
    \ (Completed)\n- Idea B (P-mean, stronger sharpness p_init=3.0): 782\n  Score\
    \ 0.6754 | APA 0.8554 | CRI-Off 0.0661 | Modif 0.9513 | CRI-On 0.4791 | PRS 0.5608\
    \ | MRL 0.8799 | ncRNA 0.9354\n  Observation: Compared to p_init=2.0 (771), p_init=3.0\
    \ further improves CRI-On and keeps APA/MRL gains, but CRI-Off remains sharply\
    \ degraded (0.066 vs baseline 0.0978).\n\n- Idea C (SPD, weaker masking p=0.02):\
    \ 783\n  Score 0.6696 | APA 0.8510 | CRI-Off 0.0960 | Modif 0.9505 | CRI-On 0.4403\
    \ | PRS 0.5504 | MRL 0.8572 | ncRNA 0.9415\n  Observation: Weakening SPD from\
    \ 0.05 to 0.02 recovers some ncRNA and MRL but remains below baseline overall;\
    \ CRI-On and PRS stay lower than baseline.\n\n5. Results and Analysis (Consolidated)\n\
    - Baseline (767): 0.6745\n- RevAvg (768): 0.6547 (negative across panels; directional\
    \ cue loss)\n- P-mean p=2.0 (771): 0.6749 (APA/MRL/PRS ↑, CRI-Off ↓ to 0.0664)\n\
    - SPD p=0.05 (772): 0.6674 (CRI-On/MRL ↓)\n- P-mean p=3.0 (782): 0.6754 (CRI-On\
    \ ↑ to 0.4791; CRI-Off still low at 0.0661)\n- SPD p=0.02 (783): 0.6696 (still\
    \ < baseline; mixed effects)\nConclusion from ablations: Smoothing extremes (RevAvg,\
    \ P-mean) consistently harms CRI-Off; coarse positional masking (SPD) underperforms\
    \ baseline even at reduced strength.\n\n7. Conclusion (Final)\nOn a minimal DSConv\
    \ baseline, six completed experiments show no average improvement. Power-mean\
    \ pooling can improve APA/MRL/PRS but reliably degrades CRI-Off, indicating that\
    \ preserving extreme activations (as with max) is important for off-target prediction.\
    \ Reverse-invariant averaging and positional masking also reduce performance.\
    \ All methods, hyperparameters, and code snippets are provided for reproduction.\n"
