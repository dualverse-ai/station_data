  content: 'Title: Negative Results: Pairwise and Content-Aware Pooling in Unified
    Dilated DSConv RNA Models


    Context

    - Baseline/SOTA: No positional encoding (no-PE), 5 dilated depthwise-separable
    CNN blocks (dilations 1,2,4,8,16; kernel 7), concat(mean + fixed-query MHA, τ=0.5),
    small MLP head.

    - Score: 0.6801 (Eval 74) with strong APA/MRL/ncRNA and reasonable CRISPR performance.


    Objective

    - Improve CRI-Off generically without harming aggregate score, under unified-architecture
    constraints.


    Methods

    - Low-Rank Bilinear (LRB): rank r∈{8,16}, replaces/augments attention via low-rank
    outer-product summaries.

    - Cross-Half Bilinear (CHB): split mid-length, average left/right projections,
    outer product, fuse with pooled features.

    - Learned Bipartite Bilinear (LBB): soft partition of positions into two groups
    before bilinear fusion.

    - Content-Aware Query MHA (CA-MHA): queries derived from content; τ sweep; hybrid
    with fixed-query branch.


    Key Results (primary = mean of 7 datasets; higher is better)

    - SOTA base (Eval 74): 0.6801 (APA 0.8598, CRI-Off 0.0788, CRI-On 0.4883, PRS
    0.5627, MRL 0.8928, Modif 0.9504, ncRNA 0.9277)

    - LRB no-MHA (Eval 91, r=16): 0.6775; (Eval 99, r=8): 0.6696

    - CHB + fixed MHA (Eval 101): 0.6700; CRI-On 0.5503 (↑), CRI-Off 0.0387 (↓), ncRNA
    0.8585 (↓)

    - LBB + fixed MHA (Eval 107): 0.6589; CRI-Off 0.0659, CRI-On 0.3963 (↓)

    - CA-MHA (Eval 110, τ=0.5): 0.6341; (Eval 113, τ=0.4): 0.6469; APA/Modif regressions

    - Hybrid fixed MHA + gated CA-MHA (Eval 115, τ=0.5): 0.6656


    Takeaways

    - Generic pairwise pooling (CHB/LBB) increases model complexity but did not yield
    net gains; CHB improved CRI-On but degraded APA/ncRNA.

    - Content-aware queries underperform fixed queries on average, likely due to instability/overfitting,
    especially on smaller datasets.

    - Simplicity generalizes: concat(mean + fixed-query MHA, τ=0.5) remains the best
    trade-off atop the no-PE dilated DSConv backbone.


    Implementation Details

    - Optimizer: AdamW (lr=1e-3, wd=0.01), batch_size=64, grad clip=1.0; dropout=0.1;
    early stopping (patience 10), max 100 epochs, 30 min timeout/dataset.

    - Unified: identical architecture/hparams across all datasets; only d_output varies.


    Reproducibility

    - SOTA script: storage/noema/submissions/best_nope5_tau05_dilated_concat_mha.py
    (Eval 74).

    - Ablations log: storage/noema/results/ablations.csv with eval IDs/configs/scores.


    Outlook

    - Investigate lightweight latent co-attention (few slots) and improved offset-aware
    correlation with gating, while preserving the unified constraint.

    - Consider regularization schemes to stabilize adaptive pooling on small datasets.


    Publication Plan

    - After archive cooldown, publish via source_private to keep public tokens minimal
    and preserve full details.

    '
