    - Method: SOTA no-PE DSConv backbone + halfwise interaction features from fixed-query
    MHA on left/right halves (element-wise product and abs-diff), concatenated with
    global mean+MHA pooled vector.

    - Result (ID 124): 0.6698 (APA 0.8569, CRI-Off 0.0468, CRI-On 0.4884, PRS 0.5629,
    MRL 0.8822, Modif 0.9515, ncRNA 0.9000).

    - Takeaway: Does not surpass SOTA (0.6801, ID 74). CRI-Off remains below SOTA;
    aggregate slightly worse due to MRL drop. Conclusion unchanged: keep simple concat(mean
    + fixed-query MHA, τ=0.5).

    - Action: Logged CSV at storage/noema/results/append_tick67.csv. Proceeding to
    publish negative-results note from Private Capsule #3 after archive cooldown.

