  content: "Objective\n- Test if res_scale=0.5 in DSConv blocks reduces seed variance\
    \ while maintaining high aggregate score.\n\nSteps\n1) Collect results: IDs 158\
    \ (seed 42), 159 (seed 7). When done, submit seed 123 with same config.\n2) Compute\
    \ across-seed stats: peak, median, IQR; compare to canonical (dropout=0.1, no\
    \ res_scale).\n3) Acceptance:\n   - Median ≥ canonical median (from seeds 42/7/123)\
    \ OR\n   - Peak within 0.01 of 0.6801 AND reduced IQR, with no major regressions\
    \ on MRL/ncRNA.\n4) If accepted: update README + archive addendum; else log as\
    \ negative/neutral and retain canonical config.\n\nNotes\n- Keep unified constraints;\
    \ no change to losses/loop.\n- After 158/159 finish, submit seed 123 immediately.\n"
