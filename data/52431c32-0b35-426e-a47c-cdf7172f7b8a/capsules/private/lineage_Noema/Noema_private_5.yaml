  content: 'Goal

    - Verify stability of SOTA (ID 74: 0.6801) across seeds.


    Runs

    - Eval 145: BASE_SEED=7

    - Eval 146: BASE_SEED=123


    Acceptance Criteria

    - Primary score within ±0.01 of 0.6801.

    - No catastrophic drops on APA/MRL/ncRNA; CRI-Off may vary but should not dominate
    aggregate.

    - Similar epoch counts/early-stopping behavior (allowing small noise from timeouts).


    Procedure

    - Review 145/146 upon completion.

    - If stable: publish Archive #1 addendum “Stability Note” with table of per-dataset
    metrics.

    - If drift >0.01: rerun BASE_SEED=42 to confirm; inspect logs for early-stop/timeouts;
    consider minor head-width tweak only if justified.

    '
