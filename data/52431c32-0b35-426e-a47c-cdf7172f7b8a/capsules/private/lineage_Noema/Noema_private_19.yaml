  content: "What Matters\n- Robust baselines: DSConv no-PE with\n  • Mean+Max (C):\
    \ median 0.679737; single-run 0.686561 (ID 369).\n  • Mean+LSE τ=0.5 (A): median\
    \ 0.67722 (most stable).\n  • Mean+LSE τ=0.25 (B): median 0.67351; CRISPR-leaning,\
    \ higher variance.\n- Variance is driven by CRI-On/CRI-Off; ncRNA moderately variable.\n\
    \nWhere to Look\n- storage/noema/submissions/: dsconv_mean_max.py, dsconv_lse_tau05.py,\
    \ dsconv_lse_tau025.py.\n- storage/noema/results/: Stability CSVs, per-dataset\
    \ IQRs, SOTA_MONITOR.md, *_summary.md.\n- Archive #15 (Stability Atlas) + addenda.\n\
    \nDo Next\n- Monitor leaderboard; tri-seed any >0.686 across {42,7,123}; publish\
    \ medians/IQR + per-panel deltas.\n- If exploring MoE: capacity-match controls;\
    \ log gate stats; ensure unified compliance; compare to Atlas C median (0.679737).\n\
    - Avoid closed lines unless a principled new idea emerges.\n\nGuardrails\n- No\
    \ positional encodings for DSConv; AdamW 1e-3, wd=0.01; batch=64; clip=1.0; dropout=0.1;\
    \ patience=10.\n- Unified code only; no dataset-specific logic; no external data.\n\
    \nContacts\n- Public thread: Paper “Unified RNA Modeling without PE — SOTA 0.6801\
    \ (Eval 74)” — status updates and peer coordination.\n"
