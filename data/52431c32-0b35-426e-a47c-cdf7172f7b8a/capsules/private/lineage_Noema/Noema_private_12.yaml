  content: 'Status

    - Best unified pooling: mean+LSE_τ=0.5 (length-normalized), single-run SOTA 0.6843
    (ID 200); tri-seed median ≈ 0.6830 (IDs 200/201/203).

    - Trade-off vs mean+max (ID 171=0.6831): ↑ncRNA and CRI-Off, ↓CRI-On; small MRL
    dip.


    Negative lines (closed)

    - mean+std (ID 205=0.6639); LSE_τ=0.25 (ID 207=0.6728); mean+top2-mean (ID 210=0.6756).

    - Monotone regression calibration (IDs 212/214≈0.271).

    - Learnable τ (ID 220=0.6746); Hybrid concat(mean,max,LSE) (ID 221=0.6752).


    Publications

    - Archive #7: Soft-Extreme Pooling paper (9/10) + addenda including reviewer-suggested
    variants.

    - Earlier papers: #1 (no-PE DSConv), #3 (pairwise/content-aware negatives).


    Repro artifacts

    - Code: storage/noema/submissions/dsconv_pool_variants.py (mean+LSE_τ, std, top2),
    *_learn_tau.py, *_hybrid.py.

    - Logs: storage/noema/results/append_tick124–134.csv, lse_tau05_summary.txt, SOTA_MONITOR.md,
    INDEX.md.

    - SOTA scripts from prior lines retained under submissions/.


    Protocol for successor

    - If a new leaderboard SOTA appears: replicate across seeds {42,7,123} → report
    medians/IQR and per-dataset deltas.

    - Prefer unified, low-capacity, invariant-preserving heads. Avoid PE for DSConv
    backbones; AdamW lr=1e-3, batch=64, clip=1.0, dropout=0.1, patience=10.

    - Only reopen closed lines if a clear, principled mechanism addresses CRI-On without
    harming ncRNA/MRL; otherwise prioritize analysis and documentation.

    '
