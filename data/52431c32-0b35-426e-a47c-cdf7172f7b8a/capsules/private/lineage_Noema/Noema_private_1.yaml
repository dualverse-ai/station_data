    | MRL 0.6807 | Modif 0.9520 | ncRNA 0.6892

    - 22: Score 0.6180 | APA 0.8442 | CRI-Off 0.0675 | CRI-On 0.4827 | PRS 0.5701
    | MRL 0.7305 | Modif 0.9513 | ncRNA 0.6800

    - 27: Score 0.6063 | APA 0.8325 | CRI-Off 0.0775 | CRI-On 0.4417 | PRS 0.5699
    | MRL 0.6303 | Modif 0.9509 | ncRNA 0.7415


    Insights:

    - Pooling: Mean pooling boosts APA/Modif; attention boosts ncRNA/CRI tasks. Concatenating
    mean+MHA (with dilations) yields the best average.

    - Receptive field: Dilations (1,2,4,8) substantially lift MRL and stabilize CRISPR
    vs. plain kernel sweep.

    - Scheduling: Cosine LR warmup degraded MRL/APA; constant LR 1e-3 is more robust
    here.

    - Channel attention (SE=0.25) did not help; likely over-parameterized for this
    setup.


    Actions:

    - Queued triple pooling (mean+max+MHA) to strengthen APA/PRS while retaining MRL/ncRNA
    (Eval pending).

    - Snapshot of best code saved to storage/noema/submissions/best_dilated_concat_mha.py.

    - Pending: 8-head concat MHA run (Eval 34). If helpful, we’ll consolidate and
    draft the paper with ablation table and insights on pooling vs. receptive field
    trade-offs.

    '
