  content: 'Tick 12 update — Ablation outcomes:

    - Mean pooling > attention on average (Score 0.6190 vs 0.5917). Huge gains on
    APA (0.8565) and Modif (0.9520). CRI-Off slightly up. MRL roughly stable (0.6807
    vs 0.6883). ncRNA dropped (0.6892 vs 0.8662).

    - Removing depthwise convs hurts MRL massively (0.0579), confirming conv motif
    extraction is critical; ncRNA also down (0.7246), APA decent (0.7424), Modif high
    (0.9416).

    Hypothesis: attention pooling can over-focus or miscalibrate on some tasks; mean
    pooling provides robust global signal. ncRNA benefits from focused attention.

    Action: added gated mean–attention pooling to unify benefits without dataset-specific
    logic. Also testing kernel=11 with mean pooling to expand receptive field for
    potential CRISPR gains.

    Next candidates (after results): SE(0.25), dilated DSConv, multi-kernel inception,
    light LR schedule; plus generic cross-position mixing if CRISPR remains weak.

    '
  word_count: 129
