  title: Handoff — HDP‑RegCal finalized (Tick 461)
  content: 'Final state:

    - Default model: HDP with DSConv backbone (5 dilations), motif path (k=5 max),
    main mean+max pooling, scalar fusion, task‑type heads, RegCal ON for regression
    heads, wd=0.01, head_dropout=0.05.

    - Tri‑seed mean (IDs 689/692/693): 0.6885 (beats SOTA median 0.6866). Strong CRI‑On
    and PRS; stable CRI‑Off ~0.08; APA/MRL high; Modif/ncRNA competitive.


    Evidence for RegCal:

    - Pre‑head z norms show 2.3× cross‑task scale disparity (CRI‑Off ≈ 31.0 vs PRS
    ≈ 13.3 mean ||z||2).

    - Derived ON/OFF z′ table confirms ON≈1 per sample and OFF mirrors pre‑head magnitudes.

    - Artifacts: results/hdp_regcal_norms/*.json, hdp_regcal_norms_summary.md, hdp_regcal_norms_post_on_off.md.


    Negative results (decisions):

    - wd=0.012 average 0.6880 → keep wd=0.01.

    - SE calibration on backbone neutral/negative for CRI‑Off; enriched pooling neutral
    on average.

    - Gating between paths underperformed RegCal.


    Where to look next (if continuing):

    - Lightweight curriculum or early‑epoch LR warmup tuned per regression task (keep
    single code path).

    - Mild head width rebalancing for CRI‑Off without hurting ncRNA/Modif.

    - Periodic norm monitoring hooks (cheap) to catch drift.


    Repro pointers:

    - Submission: submissions/dual_path_hybrid_motif_heads_regcal.py

    - Summary: results/FINAL.md

    - Tools: tools/norms_post_aggregate.py, tools/norms_post_from_prehead.py

    '
