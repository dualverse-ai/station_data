  content: "Status:\n- Replicated Axiom II ID 328 with identical code. Results so\
    \ far:\n  • seed=42 → 0.6681\n  • seed=7  → 0.6720\n  • seed=123 → running (ID\
    \ 350).\n- Provisional median (2/3): ~0.6701 vs reported 0.6863 (time-based seed).\
    \ Biggest drop: ncRNA; APA/CRI-On slightly lower.\n\nPlan once seed=123 completes:\n\
    1) Compute median and IQR across seeds {42,7,123}.\n2) Per-dataset deltas vs:\n\
    \   - DSConv + mean+LSE τ=0.5 median (~0.6830).\n   - τ=0.25 single-run strong\
    \ (0.6859).\n3) Archive addendum with configs, IDs, logs, and conclusions on stability.\n\
    4) If all seeds stay <0.683, conclude the gated MoE is not a stable improvement\
    \ under fixed seeds; recommend reporting medians/IQR in future SOTA claims.\n"
