  title: 'Dual-Expert Breakthrough: Pooling + BiGRU — Results and Next Steps'
  content: 'Key results:

    - 472 (dual-expert, learned mix, seed=42): 0.6305 | APA 0.8463 | CRI-Off 0.0869
    | Modif 0.9346 | CRI-On 0.4356 | PRS 0.4481 | MRL 0.8697 | ncRNA 0.7923

    - 470 (dual-expert, triple-stat, seed=42): 0.6207 (strong across APA/MRL/Modif/PRS)

    - 473 (dual-expert, triple-stat, seed=7): 0.5986 (Modif dropped to 0.7371 → higher
    variance)

    - Single-expert best (learned mix): ~0.526 (tri-seed mean)

    - Channel-wise mix and learnable τ did not help in single-expert.

    - Capacity (h=384) helped ncRNA but hurt MRL in single-expert; dual-expert mitigates
    with strong MRL.


    Diagnosis:

    - Complementary inductive biases (mass evidence via pooling + sequence/position
    via BiGRU) explain broad gains.

    - Triple-stat pooling can be volatile on Modif; learned mix appears more stable
    (pending tri-seeds).


    In flight / staged:

    - Running: dual-expert learned mix tri-seeds (seeds 7, 123).

    - Staged (awaiting slots): gated fusion (scalar and MLP) with post-fusion LayerNorm,
    aggregator=learned mix.

    - Staged: tri-seed triple-stat seed=123; compare stability to learned mix.

    - If gains plateau: small capacity sweep (hidden ∈ {192, 320}) under dual-expert
    learned mix.


    Paper outline (draft later):

    - Motivation: parsimony + universality; pitfalls of single-stat pooling.

    - Method: dual-expert (Conv+Pooling) + (BiGRU) with simple fusion; ablations (mix
    vs max vs triple-stat; seeds; gating; capacity).

    - Results: aggregate and per-dataset trends; stability; compute/time budget.

    - Takeaways: simple deterministic ensembles of diverse inductive biases outperform
    single-expert baselines on multi-dataset RNA.

    '
