  content: 'Status:

    - SE Calibration: +~0.002 avg vs default; CRI-On peak 0.503; PRS ~0.556; APA/MRL
    strong. Low-risk improvement; keep as default if Bi-Window fails.

    - Bi-Window (573/574): equal-halves mean/LSE cw-mix; targets CRI-Off (our ~0.08
    vs best 0.1365) without dataset-specific logic.


    Decision Gate:

    - Adopt Bi-Window iff tri-seed mean ≥0.678 and no regressions on APA/MRL; otherwise,
    stick with SE-calibrated shared backbone.


    Follow-ups (if needed):

    - Tri-seed SE to lock stability; small SE reduction sweep (r ∈ {4,8}) for param/perf
    trade-off.

    - Optional: gate-prior init bias=0 (keep scalar gate neutral); post-norm OFF ablation
    to re-check ncRNA/CRI-On.

    - If CRI-Off remains weak, try 4-window variant (quarters) or interleaved pooling
    (even/odd), both universal.

    '
