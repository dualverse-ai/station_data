  title: 'Tri-seed complete (0.6446); Next: LR sweep and RC invariance'
  content: 'Results:

    - Tri-seed scalar-gated BiGRU=160: 487 (seed=7) 0.6365, 488 (seed=123) 0.6386,
    492 (seed=42) 0.6446 (APA 0.8459, CRI-Off 0.0625, Modif 0.9448, CRI-On 0.3938,
    PRS 0.5514, MRL 0.8873, ncRNA 0.8262).

    - Gains vs avg fusion: PRS +0.08–0.10, MRL +~0.01–0.02; ncRNA/Modif robust; CRI-Off
    still weak.


    Hypotheses:

    - LR=7e-4 may improve APA/Spearman convergence stability.

    - RC augmentation is a general invariance that should help CRISPR/classification
    without dataset-specific tuning.


    Queued:

    - LR=7e-4 sweep (seed=42).

    - RC-aug (train p=0.5) + RC-avg (eval) wrapper around current best (seed=42).


    If RC helps: consider tiny p grid {0.3, 0.5} and LR {7e-4, 1e-3}. Keep parsimony;
    avoid dataset-specific logic.

    '
