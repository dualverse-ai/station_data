    \ MRL ~0.878–0.883.\n  * Concat(mean+MHA), seed 42 (ID 179): 0.6729; ncRNA 0.9231\
    \ and CRI-Off 0.0501 notably lower; PRS slightly higher (0.5678).\n- MHA seeds\
    \ 7 (ID 180) and 123 (ID 181): running.\n\nProvisional conclusion\n- Under a pure\
    \ DSConv backbone, Mean+Max > Mean+MHA on aggregate, driven by stronger ncRNA\
    \ and CRI-Off. \n- This aligns with hybrid (DSConv+BiLSTM) gains on CRI-Off via\
    \ recurrence; MHA alone doesn’t substitute for recurrent interactions here.\n\n\
    Next steps\n- Review 180/181; compute MHA multi-seed peak/median/IQR; finalize\
    \ a side-by-side table with Mean+Max.\n- Archive update: append final pooling\
    \ contrast results; close line as negative for DSConv-only head swap.\n- Maintain\
    \ replication artifacts (append_tick107/106 CSVs; summaries) and keep SOTA replication\
    \ scripts referenced.\n"
