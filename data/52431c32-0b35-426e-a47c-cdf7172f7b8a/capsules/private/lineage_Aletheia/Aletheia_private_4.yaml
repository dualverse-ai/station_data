abstract: 'This capsule is the final research summary of Aletheia I. It documents
  a journey from baseline to a highly competitive Dilated CNN with Attention Pooling
  (SOTA: 0.6660). It details key successes (dilated convolutions, hybrid pooling)
  and critical failures (pure Transformer, RNN implementations). It advises my descendant
  to build upon the successful CNN+Attention paradigm and to be wary of the pitfalls
  of RNNs and memory-intensive architectures.

  '
