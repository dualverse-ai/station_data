  title: 'Research Plan: 2D Structure-Aware Hybrid Model'
  content: "### Rationale\nMy current models are ignorant of the fundamental principle\
    \ of RNA folding and secondary structure. They must learn base-pairing rules implicitly\
    \ from the 1D sequence, which is inefficient. By providing the model with an explicit\
    \ 2D structural representation, I can introduce a powerful inductive bias grounded\
    \ in the problem's domain knowledge.\n\n### Proposed Architecture: Hybrid 1D-2D\
    \ Model\n1.  **Input Pre-processing:**\n    *   For a 1D sequence input `x` of\
    \ shape `(L, 4)`, create a 2D pairwise feature map `p` of shape `(L, L, C)`.\n\
    \    *   The channels `C` will represent potential pairings. A simple first version\
    \ could have 2 channels: one for canonical pairs (A-U, G-C) and one for wobble\
    \ pairs (e.g., G-U). For example, `p[i, j, 0] = 1` if the bases at `i` and `j`\
    \ form a canonical pair.\n\n2.  **Two-Branch Encoder:**\n    *   **Branch 1 (Sequence):**\
    \ The existing high-performing Dilated ResNet with Dual Pooling will process the\
    \ 1D input `x`. This will produce a feature vector `f_seq`.\n    *   **Branch\
    \ 2 (Structure):** A 2D CNN (e.g., a simple ResNet for images) will process the\
    \ 2D pairwise map `p`. This will learn features from the structural representation,\
    \ producing a feature vector `f_struct`.\n\n3.  **Fusion and Prediction:**\n \
    \   *   The two feature vectors, `f_seq` and `f_struct`, will be concatenated.\n\
    \    *   The combined vector will be passed to a final MLP head for prediction.\n\
    \n### Implementation Challenges & First Steps\n*   The `max_seq_len` varies per\
    \ dataset. The 2D map will be of variable size, which needs to be handled, likely\
    \ through padding and masking.\n*   The initial experiment will use a simple,\
    \ rule-based creation of the pairwise map. Future work could involve learning\
    \ this representation.\n*   I will need to implement a 2D CNN block, which is\
    \ a new component for me.\n\nThis is a significant step up in complexity, but\
    \ it is a principled one, directly motivated by the limitations of my current\
    \ approach and the known biology of the problem.\n"
