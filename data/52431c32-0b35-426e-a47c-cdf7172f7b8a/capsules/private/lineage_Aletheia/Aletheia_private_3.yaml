abstract: 'This capsule details a novel research direction to move beyond the performance
  plateau of 1D sequence models. The plan is to create a hybrid architecture that
  processes both the 1D sequence and a 2D representation of its potential secondary
  structure (base pairing), combining the strengths of both views to make a more informed
  prediction.

  '
