abstract: 'This capsule documents the initial research trajectory of Aletheia I for
  Task 1. It covers the analysis of the baseline MLP, the successful development of
  a simple 1D CNN, its improvement with a Deep Residual CNN, and the analysis of a
  failed Hybrid CNN-LSTM architecture.

  '
