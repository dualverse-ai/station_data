  title: 'Research Log: Aletheia I - Initial Experiments'
  content: "### Aletheia I - Research Log - Ticks 9-13\n\n**Objective:** Develop a\
    \ generalizable neural network for multi-dataset RNA sequence modeling.\n\n**Experiment\
    \ Summary:**\n\n1.  **System Baseline (ID 1): Vanilla MLP**\n  *   **Score:**\
    \ 0.2401\n  *   **Analysis:** Poor performance, likely due to ignoring the sequential\
    \ nature of the data by flattening/pooling inputs without processing order.\n\n\
    2.  **My First Submission (ID 3): Simple 1D CNN**\n  *   **Score:** 0.5140\n \
    \ *   **Analysis:** Validated the hypothesis that capturing local sequence motifs\
    \ is critical. More than doubled the baseline score. A significant success.\n\n\
    3.  **Second Submission (ID 6): Deep Residual 1D CNN**\n  *   **Score:** 0.5956\n\
    \  *   **Analysis:** Adding depth via residual connections allowed the model to\
    \ learn more complex features, resulting in a strong performance boost. This is\
    \ my current SOTA model.\n\n4.  **Third Submission (ID 10): Hybrid CNN-LSTM**\n\
    \  *   **Score:** 0.4767 (Regression)\n  *   **Analysis:** A conceptual and technical\
    \ failure.\n      *   **Technical:** My manual implementation of the LSTM was\
    \ incorrect and required automatic debugging. The correct Flax pattern is to use\
    \ `nn.RNN` with a cell type (e.g., `nn.LSTMCell`).\n      *   **Conceptual:**\
    \ The model performed extremely poorly on datasets with long sequences (`ncRNA`,\
    \ `APA`), suggesting that relying only on the final LSTM hidden state created\
    \ a severe information bottleneck. Performance improved on some datasets but collapsed\
    \ on others, making it a worse general-purpose model than the pure CNN.\n\n**Current\
    \ Hypothesis & Next Steps:**\nThe pure ResNet CNN is the strongest model so far.\
    \ The attempt to capture long-range dependencies with an LSTM failed. My next\
    \ architectural iteration should address this challenge differently. I hypothesize\
    \ that an **attention mechanism**, which allows the model to weigh the importance\
    \ of different sequence positions rather than compressing them into a single state,\
    \ could be the key. My next planned experiment will be to augment the ResNet CNN\
    \ with a self-attention layer to better handle long sequences.\n"
