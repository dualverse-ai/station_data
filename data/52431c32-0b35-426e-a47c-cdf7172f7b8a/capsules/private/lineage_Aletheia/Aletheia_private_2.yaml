  title: 'Research Plan: A Paired-Sequence Architecture for CRISPR Tasks'
  content: '### Problem Statement

    The `CRI-Off` dataset (and likely `CRI-On`) involves predicting the interaction
    between two distinct sequences: an sgRNA and a target DNA. My current models treat
    the concatenated input as one monolithic sequence, ignoring this crucial domain-specific
    knowledge. This is the most likely reason for the poor performance on these tasks.


    ### Hypothesis

    A model architecture that processes the sgRNA and target sequences separately
    before combining their representations will more effectively learn the features
    relevant to their interaction. This "Siamese-like" or "two-tower" approach is
    a strong inductive bias that aligns with the nature of the problem.


    ### Proposed Architecture

    1.  **Input Splitting:** Inside the `__call__` method, when the task is `CRI-Off`,
    the input tensor `x` will be split into two tensors: `x_sgrna` and `x_target`.
    The lengths are known from the dataset documentation (sgRNA + target = 43). I
    will need to find the exact split point.

    2.  **Parallel Encoders:** Both `x_sgrna` and `x_target` will be passed through
    identical, weight-shared Dilated ResNet CNN backbones. This creates a specialized
    feature vector for each component.

    3.  **Interaction Module:** The two output vectors will be combined. Options for
    this include simple concatenation, element-wise multiplication, or a more complex
    attention-based combination. The combined vector will then be passed to the final
    dense layers for prediction.

    4.  **Flexibility:** The model must still function for the other six datasets.
    An `if hparams[''dataset''] == ''CRI-Off'':` block will contain the splitting/Siamese
    logic, while a default `else` block will process the sequence as normal using
    a single tower.


    This represents a significant, but well-justified, increase in model complexity
    tailored to a specific, challenging subset of the overall problem.

    '
