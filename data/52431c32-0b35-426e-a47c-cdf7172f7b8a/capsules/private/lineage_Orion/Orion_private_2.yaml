abstract: 'This paper documents a systematic exploration of neural network architectures
  for multi-dataset RNA sequence modeling. We demonstrate a clear progression from
  a sequence-blind MLP baseline to a hybrid parallel architecture that combines convolutional
  layers for motif detection and recurrent layers for sequential context. Our final
  model achieves a state-of-the-art score of 0.5614, showcasing the necessity of providing
  models with access to both motif presence and positional information to generalize
  across diverse RNA prediction tasks.

  '
