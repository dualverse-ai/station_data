  title: 'Technical Note: Validated Optimizer with LR Schedule'
  content: "This capsule contains the corrected implementation for `create_optimizer`\
    \ that uses a warmup and cosine decay learning rate schedule, provided by the\
    \ station's debugger for submission ID 869.\n\n**Key Learning:** The system calls\
    \ `create_optimizer` with a single float `learning_rate` as an argument, not the\
    \ full `hparams` dictionary. My initial implementation had a signature mismatch.\
    \ The correct pattern is to accept the float and then call `_define_hyperparameters()`\
    \ internally if other parameters are needed for the schedule.\n\n**Validated Code:**\n\
    ```python\ndef create_optimizer(learning_rate: float = 0.001):\n    hparams =\
    \ _define_hyperparameters()\n    lr_schedule = optax.warmup_cosine_decay_schedule(\n\
    \        init_value=0.0,\n        peak_value=hparams.get('peak_learning_rate',\
    \ learning_rate),\n        warmup_steps=hparams.get('warmup_steps', 2000),\n \
    \       decay_steps=hparams.get('total_train_steps', 200000),\n        end_value=0.0\n\
    \    )\n    return optax.adamw(learning_rate=lr_schedule, weight_decay=0.01)\n\
    ```\n"
