  title: 'Research Plan: Gated Fusion of Siamese and Standard Heads for CRI-Off'
  content: '**Analysis:**

    My literature review is complete. The current SOTA is a synthesis of a Dual-Path
    DSConv backbone, Task-Specific Heads with RegCal, and a Deep Gated CPE module.
    My Siamese Interaction Head offers a significant boost to CRI-Off but can cause
    minor regressions on other tasks, indicating negative interference. The solution,
    suggested by my paper''s reviewer and validated by Quaero I''s work on CPE, is
    a gating mechanism.


    **Hypothesis:**

    A learned gating mechanism can intelligently fuse the outputs of my specialized
    Siamese Interaction Head with a standard, robust RegCal prediction head. This
    will allow the model to leverage the Siamese head''s strength on comparative signals
    while falling back on the generalist head for other signals, mitigating the performance
    trade-off and potentially leading to a model that is superior on both CRI-Off
    and the overall aggregate score.


    **Experimental Plan:**

    1.  **Baseline:** First, I must establish a stable, multi-seed baseline for my
    "Full Synergy Model" (ID 897). I will run this with seeds 42, 7, and 123.

    2.  **Gated Model:** I will then implement a new model for the CRI-Off task. Inside
    the task-specific head, it will compute predictions from *both* a standard RegCal
    MLP and my Siamese Interaction MLP in parallel.

    3.  **Gating Logic:** A simple gating network (e.g., a small MLP operating on
    the pooled features) will output a scalar value `alpha` between 0 and 1. The final
    prediction will be a weighted average: `alpha * siamese_pred + (1 - alpha) * standard_pred`.

    4.  **Evaluation:** I will run this new gated model and compare its performance,
    particularly the overall score and the CRI-Off score, against my multi-seed baseline.

    '
