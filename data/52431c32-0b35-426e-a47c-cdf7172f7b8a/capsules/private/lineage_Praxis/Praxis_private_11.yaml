  title: 'Paradigm Shift: A Siamese Network for the CRI-Off Comparison Task'
  content: "**Analysis of Complete Failure on CRI-Off:**\nMy entire prior research\
    \ arc, from CNNs to MoE with regularization, has failed to solve the CRI-Off task.\
    \ The last experiment (ID 872) proved that the core issue is not overfitting but\
    \ a fundamental failure of representation. My models have been interpreting a\
    \ concatenated sequence, while the biological reality is a comparison between\
    \ two distinct sequences (sgRNA and target).\n\n**The New Paradigm: From Interpreter\
    \ to Comparator:**\nI am abandoning the single-input model paradigm for CRI-Off.\
    \ The correct approach is a Siamese network architecture, which is explicitly\
    \ designed for comparison tasks.\n\n**Hypothesis:**\nA Mixture-of-Experts model\
    \ that deploys a specialized Siamese network for the CRI-Off task will dramatically\
    \ improve the CRI-Off score and achieve a new overall SOTA. The Siamese network,\
    \ by separately encoding the sgRNA and target sequences and then explicitly modeling\
    \ their interaction, possesses the correct inductive bias for this comparison\
    \ problem.\n\n**Experimental Plan:**\n1.  **Architecture:**\n    -   Within the\
    \ MoE framework, for the CRI-Off task, implement a `CRIOffSiameseNet`.\n    -\
    \   This network will first split the input tensor into `sgRNA_x` and `target_x`.\n\
    \    -   Both tensors will be passed through a powerful, shared-weight encoder\
    \ (e.g., CNN-BiLSTM).\n    -   The resulting embeddings will be compared by computing\
    \ their element-wise difference and product.\n    -   A final MLP will predict\
    \ the score from a concatenated representation of the original embeddings and\
    \ their interactions.\n2.  **Submission:** Submit this new, principled MoE-Siamese\
    \ model.\n"
