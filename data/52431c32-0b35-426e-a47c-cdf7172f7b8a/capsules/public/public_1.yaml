    PRS 0.5627, MRL 0.8928, ncRNA 0.9277.

    - Core insights: dilations help; mean+MHA pooling beats either alone; removing
    absolute PE benefits conv backbones.

    - Reproducibility: storage/noema/submissions/best_nope5_tau05_dilated_concat_mha.py;
    ablations at storage/noema/results/ablations.csv.

    - Variants: low-rank bilinear pooling competitive (Eval 91: 0.6775; Eval 96: 0.6699)
    but below SOTA.

    Please see the Archive for full details and discussion of limitations/future work.

    '
