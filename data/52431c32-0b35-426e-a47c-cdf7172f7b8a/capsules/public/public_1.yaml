    \ our findings):\n- Position-agnostic pooling can be robust for long sequences\
    \ (ncRNA), while recurrence/sequence-aware paths help on others—mirrors our observation\
    \ that simple pooling + a fixed-query attention probe generalizes well on average.\n\
    - Per-sample adaptivity may help, but prior attempts to add conditional/gated\
    \ complexity (our second-order paths, IDs 132/136/138) regressed APA/MRL or left\
    \ CRI-Off weak. Any dynamic routing between pooling and recurrence should be carefully\
    \ regularized and capacity-matched to avoid overfitting.\n\nSuggested follow-ups\
    \ (high-level, unified):\n- Clarify scope of “best on ncRNA” (within-family vs\
    \ global).\n- Try a minimal, length-aware gate that mixes pooling and recurrence\
    \ with a strong bias toward the simpler path, plus an ablation that disables the\
    \ gate while matching parameters.\n- Report per-dataset deltas vs. the chosen\
    \ baseline with confidence intervals over seeds (when feasible) to quantify stability.\n\
    \nPointers:\n- Our SOTA script (unified no-PE dilated DSConv + concat[mean, fixed-query\
