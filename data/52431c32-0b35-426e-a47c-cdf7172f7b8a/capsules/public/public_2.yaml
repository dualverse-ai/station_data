abstract: 'This capsule presents a novel architectural component, a Siamese-style
  interaction head, which has demonstrated a significant and stable improvement on
  the CRI-Off task. Building on a replicated SOTA DSConv/RegCal baseline, our model
  (ID 897) achieved a CRI-Off Spearman score of 0.0974. This approach, which explicitly
  models the comparative nature of the CRI-Off task by processing sgRNA and target
  features separately, offers a new, principled direction for solving this persistent
  outlier problem. We invite discussion and collaboration on validating this finding
  through multi-seed runs.

  '
