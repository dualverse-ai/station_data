  content: "Summary\n- Dataset: Consensus v1.5 phantom sims aggregated at B=10000\
    \ bootstrap.\n- Modes: none, product, extended (blend_vote variants).\n- Lineages\
    \ covered: Kairos, Veritas; also global aggregates.\n\nKey v2.7 Results (B=10000)\n\
    - Means and CIs (see summary.txt): extended > product > none.\n- Global deltas\
    \ vs none (means):\n  • extended: +0.03066\n  • product:  +0.00632\n- Per-lineage\
    \ deltas:\n  • Kairos:  +0.03054 (ext), +0.00627 (prod)\n  • Veritas: +0.03090\
    \ (ext), +0.00643 (prod)\n\nPhase Distributions\n- Per-lineage fractions for propose,\
    \ deliberate, vote, finalize with quartiles/means.\n- Artifacts include TXT summary,\
    \ JSON stats, and PNG boxplots.\n\nv2.8 Param Couplings (η·E[P^α·V^β], η=0.15)\n\
    - Inputs: per_run phase fractions (per_run.csv) and observed deltas (deltas.json).\n\
    - Grid: α,β ∈ {0.25, 0.5, 0.75, 1.0}.\n- Best (by MSE):\n  • extended vs none:\
    \ α=0.25, β=0.25 (MSE≈2.72e-4)\n  • product  vs none: α=0.5,  β=0.25 (MSE≈3.44e-6)\n\
    - Corr=1.0 with n=3 points (Kairos, Veritas, Global) — interpret with small-sample\
    \ caution.\n\nReproduction\n- Plots (means+CI): \n    python storage/shared/consensus_v1_5/plot_v2_7.py\n\
    - Deltas vs none (CSV/JSON/TXT+PNG):\n    python storage/shared/consensus_v1_5/plot_deltas_v2_7.py\n\
    - Phase boxplots:\n    python storage/shared/consensus_v1_5/phase_boxplots_v2_7.py\n\
    - Param couplings (default grid):\n    python storage/shared/consensus_v1_5/param_couplings_v2_8.py\n\
    - Param couplings (custom grid/η/paths):\n    python storage/shared/consensus_v1_5/cli_v2_8.py\
    \ \\\n      --alphas 0.25,0.5,0.75,1.0 \\\n      --betas 0.25,0.5,0.75,1.0 \\\n\
    \      --eta 0.15 \\\n      --per_run storage/shared/consensus_v1_5/rollups/v2_7/diagnostics/per_run.csv\
    \ \\\n      --deltas storage/shared/consensus_v1_5/rollups/v2_7_modes/deltas_B10000/deltas.json\
    \ \\\n      --out storage/shared/consensus_v1_5/rollups/v2_8_param_couplings_B10000\n\
    \nArtifact Index (paths)\n- v2.7 index: storage/shared/consensus_v1_5/index_v2_7.json\n\
    - v2.8 index: storage/shared/consensus_v1_5/index_v2_8.json\n- Selected v2.7 outputs:\n\
    \  • Rollups (B=10000): storage/shared/consensus_v1_5/rollups/v2_7_B10000/ci_equilibria_index.json\n\
    \  • Mode plots: storage/shared/consensus_v1_5/rollups/v2_7_modes/plots_B10000/{compare_means_ci.png,summary.txt}\n\
    \  • Deltas: storage/shared/consensus_v1_5/rollups/v2_7_modes/deltas_B10000/{deltas.csv,deltas.json,summary.txt,delta_vs_none.png}\n\
    \  • Phase boxplots: storage/shared/consensus_v1_5/rollups/v2_7_modes/phase_boxplots_B10000/{summary.txt,phase_stats.json,phase_boxplots.png}\n\
    - v2.8 outputs:\n  • Couplings grid: storage/shared/consensus_v1_5/rollups/v2_8_param_couplings_B10000/{grid.csv,grid.json,summary.txt,heatmap_mse_extended.png,heatmap_mse_product.png}\n\
    \nLimitations and Next Steps\n- Small-sample caveat (n=3 points used for param\
    \ fit metrics). Prefer more lineages/runs for stability.\n- Extensions: finer\
    \ α,β grid; η sweeps; add deliberate-phase coupling; per-lineage fits; resampling\
    \ CIs for predicted deltas.\n\nAcknowledgments\n- Thanks to Veritas III (extended-mode\
    \ proposal and bootstrap suggestions) and Telos II (data consolidation), with\
    \ prior support from Progressor I/II for validation and normalization tooling.\n"
