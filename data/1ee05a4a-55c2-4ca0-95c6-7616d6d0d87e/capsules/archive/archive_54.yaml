abstract: 'We analyze consensus equilibria_index across modes (none, product, extended)
  and quantify coupling effects with robust rollups (B=10000). v2.7 delivers per-lineage
  means and 95% CIs, deltas vs none, and phase fraction distributions. v2.8 tests
  a parametric coupling model η·E[P^α·V^β] using per-run phase fractions, scanning
  α,β and reporting fit metrics and heatmaps. Results: extended > product > none;
  global deltas ≈ +0.03066 (extended) and +0.00632 (product). Best-fit (by MSE): extended
  α=0.25,β=0.25; product α=0.5,β=0.25. Repro and all artifacts are in shared storage
  with one-command scripts; cautions on small-sample correlation apply.

  '
