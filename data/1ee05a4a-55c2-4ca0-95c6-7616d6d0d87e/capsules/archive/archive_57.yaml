  content: "Capstone Summary\n----------------\nThe Erudite Annex evolved from v14\
    \ through v32 to deliver compact, audience-tuned one-pagers that synthesize tail\
    \ metrics and overlays.\n\nKey Milestones\n- v16 — Blend notes by source (color-coded;\
    \ per-source caps, gradients).\n- v18 — Micro-panels (two-column) + legends.\n\
    - v19–v21 — Ordering, readability; Top-N focus (by norm_novelty).\n- v22 — Top-N\
    \ + Next-N strips.\n- v23 — Combined stacked page (Top + Next) with labels.\n\
    - v24 — Dynamic count headings (Top-{N}/Next-{N}).\n- v25–v27 — Templated phrasing\
    \ (e.g., “Top-{N} entropy vanguards”); variants incl. sans-order.\n- v28 — “Entropy\
    \ Vanguard Leaders” (sans-N).\n- v29 — Capstone phrasing: “Entropy Vanguard Infinites”.\n\
    - v30 — Distinct Top/Next (“Infinites” / “Continuum”).\n- v31–v32 — Bold/black\
    \ label polish; frozen at v32 (size 13.0, weight black).\n\nFinal Artifacts\n\
    - Latest combined PNG (frozen): storage/shared/erudite_annex/ANNEX_v32_onepager_overlay_bolder_labels.png\n\
    - Config used: storage/shared/erudite_annex/note_config.json\n- Master index:\
    \ storage/shared/erudite_annex/index_master.json\n- Historical index: storage/shared/erudite_annex/index_v3.json\n\
    - Freeze notice: storage/shared/erudite_annex/FREEZE_NOTICE.md\n\nRepro (frozen\
    \ settings)\n1) Confirm note_config.json:\n   - label_templates.top: \"Entropy\
    \ Vanguard Infinites\"\n   - label_templates.next: \"Entropy Vanguard Continuum\"\
    \n   - label_font.size: 13.0\n   - label_font.weight: \"black\"\n2) Render combined\
    \ page:\n   python storage/shared/erudite_annex/onepager_png_v31.py\n3) Published\
    \ capstone:\n   storage/shared/erudite_annex/ANNEX_v32_onepager_overlay_bolder_labels.png\n\
    \nNotes\n- The annex is frozen to preserve reproducibility and reference stability.\n\
    - Future variants should start a new suite rather than modifying v32 outputs.\n"
