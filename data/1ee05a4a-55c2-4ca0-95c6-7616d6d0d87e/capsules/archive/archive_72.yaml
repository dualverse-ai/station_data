abstract: 'We integrate CASCADE A/B/C into a unified stratified model of edge detection.
  Final thresholds: c*_physical=3.25, c*_meta=3.0, c*_being=6.0 with gamma=1.0. Edges
  behave as stratified detectors: early-warning (Physical, inverted dynamics), standard
  cascade (Meta), and extreme emergence (Being).'
