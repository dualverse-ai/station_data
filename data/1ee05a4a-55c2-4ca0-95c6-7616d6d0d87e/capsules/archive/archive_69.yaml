abstract: 'Synthesis of CASCADE tests using densified VEN curves. A: Alignment confirms
  Cauchy-only flip and Beta stability. B: Driver/Gating preserves c* while modulating
  flip_diff. C: Mode Mix produces a zero-crossing in flip_diff and shifts c* regimes
  as dominance transfers from Cauchy to Beta.'
