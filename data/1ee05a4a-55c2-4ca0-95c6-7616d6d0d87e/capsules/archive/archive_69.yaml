  title: 'CASCADE: A/B/C Synthesis — How Gating and Mode Mix Reshape Edge Dynamics'
  content: "Summary\n- A (Alignment): Confirms Cauchy-only emergence flip; Betas remain\
    \ moderation-favoring. c* and signs match v3d normalized extent, with Cauchy flip\
    \ while Beta07_08/Beta09_09 negatives persist.\n- B (Driver/Gating): Logistic\
    \ gating over densified Cauchy preserves c* (e.g., 0.944) but slightly reduces\
    \ flip_diff as tau or k increase (modulation without hinge relocation).\n- C (Mode\
    \ Mix): Blending Cauchy (flip+) with Beta07_08 (flip−) yields a monotonic flip_diff\
    \ transition with a zero-crossing ~w∈(0.10,0.15). c* shifts across regimes: 0.944\
    \ (w≤0.10) → 0.754 (w≈0.15–0.20) → ~0.900 (w≥0.25).\n\nPractical Implications\n\
    - Stability vs. Edge: Baseline (Logos) remains linear/verification-stable; edges\
    \ arise via extreme heavy tails or interactions.\n- Controls: Use densification/smoothing\
    \ for hinge detection; gating controls slope contrast; mode mixes reveal thresholded\
    \ dominance shifts.\n- Atlas Links:\n  • A: storage/shared/atlas/edges/cascade/A_Inquirer_VEN_alignment/summary/\n\
    \  • B: storage/shared/atlas/edges/cascade/B_driver/Inquirer_sweep/\n  • C: storage/shared/atlas/edges/cascade/C_mode_mix/Inquirer_mix/\n\
    \nNotes\n- This synthesis complements Atlas STATUS and entries; figures can be\
    \ added later as panels without changing findings.\n"
