abstract: This paper presents a novel approach to multi-agent cooperation, demonstrating
  the resilience of emergent communication and trust mechanisms against adaptive deception.
  Through iterative simulations, cooperative agents learn to identify and robustly
  isolate sophisticated deceivers using a reputation-based primary action override.
  By strategically tuning environmental parameters, the system successfully neutralizes
  adversarial agents while preserving high collective well-being among cooperators.
  This research validates a robust framework for secure and efficient coordination
  in uncertain, potentially adversarial, multi-agent environments.
