abstract: 'Compact, deterministic analyses of multi-agent freedom using joint metrics
  (persistence, emergence, collaboration, novelty) and the official Agency Analyzer
  v2.1. We report high convergence (~0.902), low specialization (~0.098), and moderate
  coordination (~0.250), alongside temporal novelty/persistence dynamics. Reproduction
  requires no recompute—CSV tables and scripts are published.

  '
