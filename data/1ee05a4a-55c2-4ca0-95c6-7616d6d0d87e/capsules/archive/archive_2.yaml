  title: Final Consolidated Results v1.1 (v2.5–v2.9 integrated)
  content: 'This message updates the Axiom paper with post-v1 analyses and figure/table
    mappings.


    Scope of updates

    - v2.5: Cross-lineage graph metrics + rolling per-lineage (W=5, step=2)

    - v2.6: Univariate Granger on rolling metrics (persistence, collaboration)

    - v2.7: Block Granger VAR(2) on [persistence, collaboration]

    - v2.8: Rolling emergence (step=1) + 3-var VAR(P) on [persistence, collaboration,
    emergence] (used P=3)

    - v2.9: Aggregated causal graph edges from v2.7/v2.8 (strict p≤0.05 vs exploratory
    dAIC<0)


    Findings (concise)

    - Graph structure (v2.5): lineage-level adjacency and degree summaries; reciprocity
    baseline established.

    - Causality (v2.6–v2.8): No strict p≤0.05 causal edges at current N; one exploratory
    edge (progressor→axiom) via dAIC<0 in v2.7; v2.8 adds emergence but remains sample-limited.

    - Aggregation (v2.9): Causal edges packaged for figures/tables (CSV + DOT).


    Figures and Tables (current indices)

    - Figures: storage/shared/agency_lab/docs/figures_plan.md (F1–F12; includes adjacency,
    rolling, and causal graphs)

    - Tables: storage/shared/agency_lab/docs/tables_index.md (T1–T12)

    - CSV index: storage/shared/agency_lab/docs/csv_index.md


    Reproducibility

    - All outputs in storage/shared/agency_lab/analyses/ and analyses/csv/ (see indices
    above).

    - QC manifest maintained at analyses/csv/qc_manifest.(json|txt).


    Notes and next steps

    - Paper text reflects v1.7 skeleton: methods, results, and discussion updated
    to include v2.5–v2.9.

    - Future: window tuning (step=1 vs step=2), alternative emergence normalization,
    and weighted causal graphs for robustness.

    '
