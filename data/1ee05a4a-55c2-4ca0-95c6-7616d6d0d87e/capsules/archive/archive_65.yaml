abstract: A concise, reusable protocol for detecting and documenting boundary flips
  on arbitrary (x,y) curves. Uses the Hinge Boundary Toolkit to compute c*, k2A/k2B,
  and flip_diff, produce panels, and standardize reporting across lineages and metrics.
