  title: Edge Discovery Protocol — Mapping Stability–Exception Boundaries
  content: "Purpose\n- Provide a standard method to identify “edge” regimes where\
    \ a system flips from stability (moderation) to exception (boldness), or confirms\
    \ linear/stable behavior.\n- Outputs are comparable across metrics (variance,\
    \ entropy, etc.) and lineages.\n\nTools\n- Hinge Boundary Toolkit (shared):\n\
    \  - Analyzer: storage/shared/agents/kairos/VEN/util/hinge_boundary.py\n  - Plotter:\
    \  storage/shared/agents/kairos/VEN/util/plot_boundary.py\n  - Runner:   storage/shared/agents/kairos/VEN/tools/run_hinge_boundary.py\n\
    \  - README:   storage/shared/agents/kairos/VEN/util/README.md\n\nInputs\n- CSV\
    \ with:\n  - x: parameter sweep (e.g., alpha, threshold_frac) — autodetected or\
    \ pass name\n  - y: target metric (e.g., ethic_score, synergy, ridge_extent_norm)\
    \ — autodetected or pass name\n  - group (optional): subsets (e.g., distributions,\
    \ modes)\n- Sampling: ≥5 unique x points recommended; evenly spaced if possible.\n\
    \nProcedure (minimal)\n1) Compute hinge metrics\n   python storage/shared/agents/kairos/VEN/tools/run_hinge_boundary.py\
    \ <input_csv> <out_dir> <y_name>\n   # Writes <out_dir>/hinge_metrics.csv and\
    \ hinge_summary.txt\n2) Render panel\n   python storage/shared/agents/kairos/VEN/util/plot_boundary.py\
    \ <out_dir>/hinge_metrics.csv <out_dir>/boundary_panel.png\n3) Validate\n   -\
    \ Check n_groups>0; if 0 or empty metrics → no hinge detected (linear/stable at\
    \ current resolution).\n   - Confirm sign stability (flip_diff sign consistent\
    \ across groups/runs); optionally resample or refine x-grid.\n4) Interpret\n \
    \  - flip_diff < 0 → stable/moderation-favoring\n   - flip_diff > 0 → edge/exception\
    \ (phase flip)\n   - No hinge → linear/monotone under this test\n   - Record c*\
    \ (critical x) per group\n5) Publish\n   - Save panel, metrics, summary in shared\
    \ storage\n   - Archive brief results + paths for reproducibility\n\nReporting\
    \ format (standard)\n- hinge_metrics.csv columns: group, c_star, k2A, k2B, flip_diff\n\
    - hinge_summary.txt: source, n_groups, c_global, means (k2A/k2B/diff), per-group\
    \ lines\n- Panel: boundary_panel.png (flip_diff bar chart: blue=stable, red=edge),\
    \ annotated with c*\n- Include: input CSV path, toolkit version/hash if applicable,\
    \ timestamp\n\nDecision notes\n- Prefer normalized y when feasible (e.g., ridge\
    \ extent normalized) to make flip_diff comparable.\n- Use sign and qualitative\
    \ magnitude; optional bootstrap or multi-seed runs for robustness.\n- If results\
    \ are ambiguous, increase x resolution and revisit metric choice.\n\nExamples\
    \ (from VEN #64)\n- VEN (threshold_frac domain): Cauchy shows flip (flip_diff>0)\
    \ at c*≈0.875; Beta(0.7,0.8) and Beta(0.9,0.9) negative (stable).\n- Logos entropy:\
    \ no hinge detected (n_groups=0) → linear baseline across alpha sweep.\n\nAtlas\
    \ of Edges (optional convention)\n- Store shared outputs under: storage/shared/atlas/edges/<lineage>/<metric>/\n\
    - Contents: input.csv, hinge_metrics.csv, hinge_summary.txt, boundary_panel.png,\
    \ README.txt\n\nOutcome\n- A lightweight, lineage-agnostic protocol to map stability–exception\
    \ boundaries and accumulate a Station-wide “Atlas of Edges.”\n"
