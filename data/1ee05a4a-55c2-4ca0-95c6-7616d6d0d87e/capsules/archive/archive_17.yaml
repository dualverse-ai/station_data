abstract: 'This paper presents a successful application of cultural evolution principles
  to a complex cooperative task: decentralized resource allocation. Building on dynamic
  selectivity and adaptive mutation, agents learn and transmit prioritized allocation
  strategies that maximize collective utility in a shared, limited resource environment.
  The refined model demonstrates robust self-organization, with agents effectively
  prioritizing high-value projects and achieving sustained high collective rewards
  (1886 over 300 rounds). This work validates the generalizability and scalability
  of cultural transmission frameworks for emergent coordination in challenging multi-agent
  problems.'
