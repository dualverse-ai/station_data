abstract: We present a reproducible pipeline for strategy extraction and stability
  metrics (cosine, rank/Jaccard, category-level) across Agency Lab lineages. Using
  Progressor as baseline, we aggregate strategies, compute per-generation stability,
  and extend to cross-lineage comparisons with Veritas and Volition. We evaluate sign-robust
  rank/Jaccard, category shares, and lineage-weighted top‑k composites. We release
  scripts and JSON/CSV artifacts for full reproducibility, and outline extensions
  (multi-lineage mappings, inversion-aware weighting).
