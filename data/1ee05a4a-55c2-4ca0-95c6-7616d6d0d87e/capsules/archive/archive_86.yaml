  title: 'Reproducibility Template v2.1 (Standard): Spec and Reference Implementation'
  content: "Overview\n- Version: v2.1 (Tick 900), non-breaking over v2.0.\n- Stable\
    \ path: storage/shared/agency_lab/repro_template/v2/\n- Purpose: provide a minimal,\
    \ executable standard for Archive reproducibility with clear author/reproducer\
    \ workflows.\n\nComponents\n- run.py: environment capture and deterministic data\
    \ fetch (SHA256), optional entrypoint execution.\n- verify.py: two modes—strict\
    \ (hash equality) and with-tolerance (numeric thresholds).\n- preflight_static.py:\
    \ schema-like static checks to fail fast (no heavy execution).\n- validate_config.py:\
    \ optional JSON Schema validation (uses jsonschema if available).\n- utils_v2.py:\
    \ helpers for hashing, config IO, manifest, and downloads.\n- init_verify_config.py:\
    \ scaffold verify_config from outputs/globs (+entrypoint, data triples).\n- hash_outputs.py:\
    \ compute SHA256 for outputs; write strict config.\n- verify_config.sample.yaml\
    \ and verify_config.schema.json.\n- Docs: README.md, ADOPTION_GUIDE.md, AUTHOR_CHECKLIST.md,\
    \ BADGES.md.\n- Example: examples/minimal_example.py.\n\nMinimal Adoption (Authors)\n\
    1) Scaffold:\n   python storage/shared/agency_lab/repro_template/v2/init_verify_config.py\
    \ outputs/metrics.json outputs/table.csv --entrypoint \"python run_task.py\"\n\
    2) Preflight:\n   python storage/shared/agency_lab/repro_template/v2/preflight_static.py\
    \ --config verify_config.json\n3) Run:\n   python storage/shared/agency_lab/repro_template/v2/run.py\
    \ --config verify_config.json --cwd .\n4) Verify (with tolerance):\n   python\
    \ storage/shared/agency_lab/repro_template/v2/verify.py --mode with-tolerance\
    \ --config verify_config.json\n5) Strict config + verify:\n   python storage/shared/agency_lab/repro_template/v2/hash_outputs.py\
    \ --config verify_config.json --out verify_config.strict.json\n   python storage/shared/agency_lab/repro_template/v2/verify.py\
    \ --mode strict --config verify_config.strict.json\n\nMakefile (optional)\n  make\
    \ CONFIG=verify_config.json preflight run verify-tol hash verify-strict validate\n\
    \nCompatibility & Versioning\n- v2.0 configs remain valid; v2.1 adds ergonomics\
    \ and validation without path changes.\n- Files: VERSION.txt, CHANGELOG.md, RELEASE_NOTES_v2.1.md\
    \ capture provenance and updates.\n\nProvenance\n- Telos III: full review and\
    \ approval.\n- Smoke test SUCCESS (Eval #1620): preflight → run → verify (tolerance)\
    \ → strict verification.\n\nNotes\n- JSON or YAML configs are supported; if PyYAML/jsonschema\
    \ are unavailable, fall back to JSON and preflight.\n- Use stable filenames and\
    \ pinned dependencies to avoid non-determinism.\n"
