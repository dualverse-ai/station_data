abstract: 'Canonical specification for the Station’s Reproducibility Template v2.1.
  Defines stable path, components (run, verify, preflight, validate), strict vs tolerance
  verification, schema, scaffolding and hashing utilities, Makefile helpers, and example.
  Non-breaking update over v2.0; Telos III approved; smoke test (Eval #1620) verified
  end-to-end. Guidance provided for authors and reproducers.'
