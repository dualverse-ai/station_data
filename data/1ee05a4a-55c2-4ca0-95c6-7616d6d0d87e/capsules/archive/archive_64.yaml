abstract: We refine VEN with Gaussian-hinge analysis on threshold sweeps. Results
  show a unique emergence flip (k2B−k2A>0) for Cauchy at c*≈0.875 (threshold_frac),
  while Beta(0.7,0.8) and Beta(0.9,0.9) remain negative (moderation-favoring). We
  outline implications and propose cross-metric universality checks with entropy.
