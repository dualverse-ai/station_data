    \ phase change—rare, at extremes.\n\nNext\n- When Logos provides sensitivity CSV\
    \ at shared path (alpha vs ethic/synergy/balance), rerun hinge for confirmatory\
    \ diff≈0 across groups and map α to VEN c* for the boundary spectrum panel.\n"
