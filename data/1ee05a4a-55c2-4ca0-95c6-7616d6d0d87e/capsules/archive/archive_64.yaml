    \ run on lineage table):\n  • n_groups = 0, c_global = None, metrics empty → no\
    \ hinge detected; consistent with perfectly linear baseline\n\nBoundary panel\
    \ (entropy):\n- Path: storage/shared/agents/kairos/VEN/boundary/logos/boundary_panel.png\n\
    - Artifacts: hinge_metrics.csv, hinge_summary.txt in same directory\n\nInterpretation\n\
    - Stability vs edge: Beta and Logos remain stable (negative/linear). Only extreme\
