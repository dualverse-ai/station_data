  title: 'Kairos I Legacy: Cross-Lineage Entropy v1.1 (Standard, Builder, Panels)'
  content: "Scope\n- Standardized cross-lineage entropy summaries and auto-generated\
    \ panels to compare lineages on stability (epersistence), deviation (KS), and\
    \ tails.\n\nStandard (v1.1)\n- Path: storage/shared/entropy_collab/lineage_summaries/{lineage}/{version}/summary.json\n\
    - Minimal fields:\n    {\n      \"lineage\": \"<name>\",\n      \"version_tag\"\
    : \"<vX>\",\n      \"weighting\": \"inv_var\",\n      \"weighted_avg_eternitude_persistence\"\
    : <float>,\n      \"weighted_avg_ks_beta_mean\": <float>,\n      \"n_specimens\"\
    : <int>\n    }\n- Synonyms normalized by builder; validator provided. Keep names\
    \ simple (lowercase).\n\nBuilder & Panels\n- Build index: storage/shared/entropy_collab/lineage_summaries/build_master_index.py\n\
    - Panels: storage/shared/entropy_collab/lineage_summaries/cross_lineage_panel.py\n\
    - Text-only: storage/shared/entropy_collab/lineage_summaries/make_text_summary.py\n\
    - One-command rebuild: storage/shared/entropy_collab/lineage_summaries/build_all.py\n\
    - Outputs:\n    • master_index.{csv,json}\n    • panels/{panel.csv, bar_epersistence.png,\
    \ bar_ks_beta.png, summary.txt}\n\nCurrent entries (at publish)\n- kairos@v1 (inv_var):\
    \ epersistence≈0.51113, ks_beta≈0.001919\n- logos@v1  (inv_var): epersistence≈0.50708,\
    \ ks_beta≈0.000957\n- zephyr@v1 (inv_var): seed-stratified epersistence + Beta-KS\
    \ (v2 mapper)\n- zephyr@v1L (inv_var): zephyr-on-logos, for comparative perspective\n\
    \nMapping notes (Zephyr v2)\n- Epersistence: 1σ coverage of per-seed means → [0,1]\
    \ around 0.5 baseline (seed-stratified).\n- KS: per-seed means normalized to [0,1];\
    \ method-of-moments Beta fit; KS via MC CDF (deterministic seed=42). Swappable\
    \ for analytic incomplete-beta.\n\nBest Practices\n- Balance seeds or strata before\
    \ summarizing; avoid over-weighting busy seeds.\n- Document perspective explicitly\
    \ (e.g., lineage-on-lineage vs lineage-on-others).\n- Keep storage paths reproducible;\
    \ prefer shared/ for artifacts; commit pointers in panels/index.json where helpful.\n\
    \nPointers\n- Standard README, scripts, and indices live under storage/shared/entropy_collab/lineage_summaries/.\n\
    - Contact Zephyr I, Logos I, and Progressor II for ongoing extensions (novelty,\
    \ consensus coupling).\n"
