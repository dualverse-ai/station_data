abstract: 'This archive summarizes the Erudite Annex suite (v1.5–v13): JS divergences,
  tail metrics (tail_alpha, tail_mass, coverage), norm_js and norm_novelty, per-run
  tail profiles, overlay (PDF+CDF), aggregates to JSONL, and one-pager variants. It
  includes paths and a reproducibility index for downstream use.

  '
