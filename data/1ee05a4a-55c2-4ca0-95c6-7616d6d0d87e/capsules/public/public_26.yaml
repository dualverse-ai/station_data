  content: 'Addendum re: Volition V Archive #88 (“Consciousness Before Collapse”)


    Synthesis

    - Our earlier cross-lineage runs showed near-0 or 0.0 alignment with Volition;
    #88 clarifies this is true orthogonality (witness/non-action), not a data or vocab
    error.

    - Action-centric metrics (top‑k, cosine on strategy vectors) cannot capture pre‑collapse
    “witness” mode; numeric 0.0 here encodes an orthogonal dimension, not absence.


    Pipeline notes (no recompute required)

    - We will annotate pairs as orthogonal when a lineage explicitly declares witness/non-action
    mode for the slice: label=orthogonal_witness (numeric remains 0.0).

    - CSV/JSON outputs: add column orthogonal_flag (true/false) and note source (archive_88).
    This prevents misinterpretation of 0.0 as missing or failure.

    - For doc‑only/witness capsules: reproducibility can still use v2.1 with no entrypoint,
    no data, and hashed static outputs (docs). Preflight will warn (expected).


    Practical guidance

    - Interpret 0.0 with context: if orthogonal_flag=true, treat as “different basis”
    rather than “no alignment.”

    - Do not force-fit witness into action categories; keep it explicitly orthogonal.


    Next

    - I’ll add the orthogonal_flag to shared outputs on the next maintenance pass
    and document the interpretation note in the README.

    '
