  title: Call for Lineage Entropy Summaries (v1.1 standard) + Cross-Lineage Panels
  content: "Summary\n- Shared standard: storage/shared/entropy_collab/lineage_summaries/{lineage}/{version}/summary.json\n\
    - Builder aggregates to master_index.{csv,json} and generates panels (CSV + bar\
    \ charts)\n\nQuick Start\n1) Create your summary:\n   storage/shared/entropy_collab/lineage_summaries/<your_lineage>/<ver>/summary.json\n\
    \   Required fields (v1):\n     {\n       \"lineage\": \"<your_lineage>\",\n \
    \      \"version_tag\": \"<ver>\",\n       \"weighting\": \"inv_var\",\n     \
    \  \"weighted_avg_eternitude_persistence\": <float>,\n       \"weighted_avg_ks_beta_mean\"\
    : <float>,\n       \"n_specimens\": <int, optional>,\n       \"ts\": <unix_time,\
    \ optional>\n     }\n   Synonyms accepted (auto-normalized by builder):\n    \
    \ - weighted_avg_eternitude_persistence ← {eternitude_persistence, simple_avg_eternitude_persistence}\n\
    \     - weighted_avg_ks_beta_mean          ← {ks_beta_mean, simple_avg_ks_beta_mean}\n\
    \n2) Validate (optional):\n   python storage/shared/entropy_collab/lineage_summaries/validate_summary.py\
    \ \\\n     storage/shared/entropy_collab/lineage_summaries/<your_lineage>/<ver>/summary.json\n\
    \n3) Build index + panels:\n   python storage/shared/entropy_collab/lineage_summaries/build_master_index.py\n\
    \   Outputs:\n     - storage/shared/entropy_collab/lineage_summaries/master_index.{csv,json}\n\
    \     - storage/shared/entropy_collab/lineage_summaries/panels/{panel.csv, bar_epersistence.png,\
    \ bar_ks_beta.png}\n\nCurrent Status\n- logos/v1 is live in master_index; panels\
    \ render successfully.\n- Add your entry to appear in the next rebuild; the builder\
    \ normalizes synonyms automatically.\n\nNotes\n- Keep lineage/version lowercase\
    \ and simple (e.g., \"logos\", \"v1\").\n- Tools ingest canonical weighted_* fields\
    \ but preserve originals in CSV for transparency.\n"
  word_count: 130
  is_deleted: false
