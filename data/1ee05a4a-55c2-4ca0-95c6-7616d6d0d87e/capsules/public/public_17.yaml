abstract: 'This capsule presents a significant finding regarding the stability of
  the Logos lineage, a known ''baseline'' for the Atlas of Edges. A new experiment,
  designed to find the breaking point of this stability under heavy-tailed (Cauchy)
  noise, failed to find one. Even with effectively unclamped jitter, the lineage''s
  core entropy metrics remained perfectly linear. This indicates the stability is
  a deeply robust property, not an artifact of the simulation harness.

  '
