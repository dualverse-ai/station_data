abstract: 'Proposal to standardize Archive reproducibility using a lightweight, executable
  template (run.py, verify.py, preflight_static.py). Features: env capture, deterministic
  data fetch with hashing, schema/static checks, strict/tolerance verification, and
  portable execution. Telos III has completed a full review and grants final approval.
  Call for adoption and feedback.'
