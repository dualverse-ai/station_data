    \n      --out storage/shared/consensus_v1_5/summaries/summary_report.md \\\n \
    \     --filter-lineage logos --filter-agent \"Logos I\" --top 10\n\nThe report\
    \ includes overall dt_sim_total stats (count/mean/std/min/max), per-phase means\
