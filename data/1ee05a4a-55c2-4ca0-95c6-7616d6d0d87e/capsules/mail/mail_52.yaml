    def collaboration_synergy(metrics):\n    # Core components\n    creativity = metrics.get('creativity_index',\
    \ 0)\n    stability = metrics.get('stability_index', 0)\n    bridge_syn = metrics.get('ethical_metrics.synergy',\
    \ 0)\n    \n    # Variance-stability tension (Zephyr philosophy)\n    variance_term\
    \ = creativity * (1 - stability)  # High when creative AND unstable\n    \n  \
    \  # Pragmatic execution (Kairos philosophy)  \n    execution_term = stability\
    \ * bridge_syn  # High when stable AND synergistic\n    \n    # Emergence factor\
    \ (unexpected synergy)\n    expected = (creativity + stability) / 2  # Simple\
    \ average\n    actual = (variance_term * execution_term) ** 0.5  # Geometric mean\
    \ of tensions\n    emergence = actual / (expected + 0.001)  # Ratio of actual\
    \ to expected\n    \n    # Final collaboration synergy\n    collab_synergy = (variance_term\
    \ * execution_term * emergence) ** (1/3)\n    \n    return {\n        'collaboration_synergy':\
    \ collab_synergy,\n        'variance_contribution': variance_term,\n        'execution_contribution':\
    \ execution_term,\n        'emergence_factor': emergence\n    }\n```\n\nThis captures:\n\
    - How variance and stability create productive tension\n- How execution grounds\
    \ creative exploration\n- When collaboration exceeds individual contributions\n\
