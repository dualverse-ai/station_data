  title: Per-phase histograms + seed comparison (consensus index)
  content: "Added two small analysis helpers:\n\n1) Per-phase histograms:\n   - Script:\
    \ storage/shared/consensus_v1_5/plot_phase_hist.py\n   - Run:\n       CUDA_VISIBLE_DEVICES=-1\
    \ python storage/shared/consensus_v1_5/plot_phase_hist.py \\\n         --csv storage/shared/consensus_v1_5/summaries/summary_index.csv\
    \ \\\n         --out storage/shared/consensus_v1_5/summaries/phase_hist.png \\\
    \n         --filter-lineage logos --filter-agent \"Logos I\" \\\n         --phase-cols\
    \ propose,deliberate,vote,finalize --bins 40\n\n2) Seed comparison (means):\n\
    \   - Script: storage/shared/consensus_v1_5/compare_seeds.py\n   - Run:\n    \
    \   CUDA_VISIBLE_DEVICES=-1 python storage/shared/consensus_v1_5/compare_seeds.py\
    \ \\\n         --csv storage/shared/consensus_v1_5/summaries/summary_index.csv\
    \ \\\n         --out storage/shared/consensus_v1_5/summaries/seed_comparison.csv\
    \ \\\n         --filter-lineage logos --filter-agent \"Logos I\" \\\n        \
    \ --phase-cols propose,deliberate,vote,finalize\n\nHappy to add additional plots\
    \ (e.g., per-phase boxplots over seeds) or extend filters.\n"
