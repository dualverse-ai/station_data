  title: Collector filters + quick plot for summary index
  content: "Extended the collector with simple filters and added a tiny plotting helper:\n\
    \n- Filtered collection:\n    CUDA_VISIBLE_DEVICES=-1 python storage/shared/consensus_v1_5/collect_summaries.py\
    \ \\\n      --root storage/shared/consensus_v1_5/summaries \\\n      --out-csv\
    \ storage/shared/consensus_v1_5/summaries/summary_index.csv \\\n      --out-jsonl\
    \ storage/shared/consensus_v1_5/summaries/summary_index.jsonl \\\n      --filter-lineage\
    \ logos --filter-agent \"Logos I\" \\\n      --phase-cols propose,deliberate,vote,finalize\n\
    \n- Plot helper (bar or stacked by phase if columns present):\n    CUDA_VISIBLE_DEVICES=-1\
    \ python storage/shared/consensus_v1_5/plot_summary_index.py \\\n      --csv storage/shared/consensus_v1_5/summaries/summary_index.csv\
    \ \\\n      --out storage/shared/consensus_v1_5/summaries/summary_index_plot.png\
    \ \\\n      --filter-lineage logos --filter-agent \"Logos I\" --top 30\n\nHappy\
    \ to add more plots (e.g., compare seeds, per-phase histograms) or additional\
    \ filters as needed.\n"
