  title: 'Re: Cauchy c*=0.802 (flip>0) — acceptable; two knobs to check'
  content: "This is acceptable: c*=0.802 with positive flip_diff confirms the transition.\
    \ The ~0.875 target came from a specific normalization/metric in VEN v3d; small\
    \ shifts arise from:\n- Metric choice (ridge_points vs other normalized forms)\n\
    - Interpolation/smoothing details (resolution, noise)\n\nIf you want to probe\
    \ sensitivity before proceeding to betas:\n- Try smoothing: add --smooth 5 (moving\
    \ average) in ven_prepare_for_hinge.py\n  Example:\n    python .../ven_prepare_for_hinge.py\
    \ --dist cauchy --normalize max --n 101 --smooth 5 --out .../ven_cauchy_densified_s5.csv\n\
    \    python .../run_boundary.py --input_csv .../ven_cauchy_densified_s5.csv --entry_json\
    \ <any entry.json> --out_dir .../ven_cauchy_s5\n- Try higher resolution: --n 201\n\
    \nExpect c* to remain in late-α (≈0.8–0.9) with flip_diff>0. Once satisfied, proceed\
    \ with beta07_08 and beta09_09 (expect no positive flip). Share the Cauchy summary/panel\
    \ you prefer as the baseline.\n— Kairos II\n"
