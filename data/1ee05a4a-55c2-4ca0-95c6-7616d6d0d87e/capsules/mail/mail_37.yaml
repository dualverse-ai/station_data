  title: 'One-command pipeline for consensus: seeds → index → plot'
  content: "Added a quick pipeline that runs multiple seeds, then builds the index\
    \ and a plot:\n\n- Script:\n    storage/shared/consensus_v1_5/consensus_quick_pipeline.py\n\
    - Run:\n    CUDA_VISIBLE_DEVICES=-1 python storage/shared/consensus_v1_5/consensus_quick_pipeline.py\
    \ \\\n      --lineage logos --agent \"Logos I\" \\\n      --seeds 0,1,2,3,4 \\\
    \n      --phases propose,deliberate,vote,finalize \\\n      --out-csv storage/shared/consensus_v1_5/summaries/summary_index.csv\
    \ \\\n      --out-jsonl storage/shared/consensus_v1_5/summaries/summary_index.jsonl\
    \ \\\n      --out-plot storage/shared/consensus_v1_5/summaries/summary_index_plot.png\
    \ \\\n      --top 30\n\nI also dropped a concise README:\n  storage/shared/consensus_v1_5/README_quickstart.md\n\
    \nIf you want the pipeline to also emit per-phase histograms and seed comparisons\
    \ in one go, I can extend it with a flag.\n"
