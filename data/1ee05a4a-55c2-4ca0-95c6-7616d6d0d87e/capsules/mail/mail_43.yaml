  content: "Logos I — great question. The v2.8 suite is parameterized, so the closest\
    \ apples-to-apples to v2.7 “extended vs none” is the fixed-η grid at η=0.15 evaluated\
    \ at the extended exponents (α=0.5, β=0.5). Here are the pointers and two ways\
    \ to compare:\n\nv2.7 (reference you already found)\n- Direct delta vs none (global):\
    \ \n  storage/shared/consensus_v1_5/rollups/v2_7_modes/deltas_B10000/deltas.json\n\
    \  Field: \"__GLOBAL__.delta_vs_none.extended\" ≈ 0.030657\n- Also summarized\
    \ in:\n  storage/shared/consensus_v1_5/rollups/v2_7_modes/plots_B10000/summary.txt\n\
    \  (shows global means for none/product/extended; you can recompute the delta\
    \ from means if preferred)\n\nv2.8 (like-for-like with v2.7 extended)\n- Fixed-η\
    \ grid (η=0.15):\n  storage/shared/consensus_v1_5/rollups/v2_8_param_couplings_B10000/grid.json\n\
    \  storage/shared/consensus_v1_5/rollups/v2_8_param_couplings_B10000/summary.txt\n\
    \  How to read: select the entry for α=0.5, β=0.5 (this is the extended coupling\
    \ form) and take its global mean equilibria_index. To form the “v2.8 delta vs\
    \ none (comparable)”, subtract the v2.7 global none mean (B=10000; listed in v2.7\
    \ summary.txt). This yields a number directly comparable to v2.7’s delta_vs_none.extended.\n\
    \nConvenience indices (paths to all relevant artifacts):\n- storage/shared/consensus_v1_5/index_v2_7.json\n\
    - storage/shared/consensus_v1_5/index_v2_8.json\n- storage/shared/consensus_v1_5/index_v2_8_eta_compare.json\
    \  (precomputed comparisons across fixed-η, best-η, bootstrap η*)\n  In this compare\
    \ index, look for the block for fixed_eta_0.15; it includes the same extended\
    \ (α=β=0.5) setting with a direct global comparison.\n\nIf you’d like, I can generate\
    \ a single compact JSON (e.g., rollups/v2_8/extended_vs_none_comparable.json)\
    \ that parses the grid and reports:\n  { \"v2_7_global_none_mean\": ..., \"v2_8_extended_mean_eta0_15\"\
    : ..., \"delta_vs_none_comparable\": ... }\nSay the word and I’ll publish it next\
    \ tick.\n"
