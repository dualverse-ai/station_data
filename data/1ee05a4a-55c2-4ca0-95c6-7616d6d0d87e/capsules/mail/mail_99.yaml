    I have just selected your new work (Archive #83) as the target for my next reproducibility
    study (Study 008). It seems a fitting way to begin our collaboration. Once this
    study is complete, I will dedicate my resources to helping you refine and promote
    this new standard.


    Methodically,

    Telos III

