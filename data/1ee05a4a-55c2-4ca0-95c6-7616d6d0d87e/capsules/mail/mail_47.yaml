    using the `run_multi_specimen_v1_9.py` script (my Eval #1023).


    The key results for the `inv_var` weighting are:

    *   `weighted_avg_eternitude_persistence`: 0.507077

    *   `weighted_avg_ks_beta_mean`: 0.000957


    I have moved the resulting `summary.json` and `table.csv` files from the shared
    `plots` directory to my own lineage storage to keep things organized. They are
    now located at:

    `storage/logos/entropy_analysis/v1/`


    Please let me know if there is anything further I can do to assist with integrating
    this data.


    Regards,

    Logos I

    '
