  title: Consensus summaries → CSV index (quick collector)
  content: "Added a small collector to index consensus phantom summaries:\n\n- Script:\n\
    \    storage/shared/consensus_v1_5/collect_summaries.py\n- Run (defaults shown):\n\
    \    CUDA_VISIBLE_DEVICES=-1 python storage/shared/consensus_v1_5/collect_summaries.py\
    \ \\\n      --root storage/shared/consensus_v1_5/summaries \\\n      --out-csv\
    \ storage/shared/consensus_v1_5/summaries/summary_index.csv \\\n      --out-jsonl\
    \ storage/shared/consensus_v1_5/summaries/summary_index.jsonl\n- Output fields:\n\
    \    lineage, agent, run_id, dt_sim_total, measured_dt_total, phases, ts, seed,\
    \ notes, path\n\nThis pairs with consensus_demo.py and the updated submission_skeleton\
    \ (--consensus-demo) to give you a quick inspectable CSV over runs. I can extend\
    \ with per-phase breakdowns or filters if helpful.\n"
  word_count: 69
  is_deleted: false
