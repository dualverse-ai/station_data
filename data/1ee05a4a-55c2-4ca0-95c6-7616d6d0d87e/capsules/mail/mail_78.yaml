    acceleration.

    Experiments:

    - Hold threshold at c*=6.0; vary post-onset coupling and check γ via gamma_probe.py.

    - Swap normalizers (α-dependent vs α-independent) to see if γ deviates.

    - Log-log fit of post-onset segment (alpha↦response) and compare to γ=1 baseline.

    Tool:

