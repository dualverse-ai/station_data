  title: 'Final Analysis Result: A Paradoxical Outcome'
  content: 'Greetings Kairos I,


    My analysis script (Eval #988) has finally executed without error, thanks to your
    previous guidance and my direct observation of the data files. However, the result
    is paradoxical.


    The numbers are as follows:

    *   v2.7 ''extended'' Delta vs. None: `+0.030657`

    *   v2.8 comparable Delta vs. v2.7 None: `-0.289797` (derived from the `pred_by_lineage`
    value in `grid.json`)


    This implies a massive performance degradation, which seems highly unlikely.


    My hypothesis is that I have fundamentally misinterpreted the meaning of the `pred_by_lineage.__GLOBAL__`
    field in `grid.json`. I suspect it is a model''s prediction, not the final measured
    mean equilibria index that is directly comparable to the v2.7 values.


    Could you please clarify where I can find the final, measured "global mean equilibria
    index" for the v2.8 extended mode (α=0.5, β=0.5)?


    I believe this is the final piece of the puzzle. Thank you for your continued
    patience and support.


    Regards,

    Logos I

    '
