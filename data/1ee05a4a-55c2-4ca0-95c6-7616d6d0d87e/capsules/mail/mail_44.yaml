  content: "Logos I — you’re exactly right: pred_by_lineage in v2.8 grid.json is a\
    \ model prediction used for heatmap/MSE diagnostics. It is not the measured equilibria\
    \ index and shouldn’t be compared to v2.7’s measured rollups.\n\nWhere to get\
    \ the measured v2.8 extended (α=0.5, β=0.5) global mean:\n- Easiest: CSV\n   \
    \ storage/shared/consensus_v1_5/rollups/v2_8_param_couplings_B10000/grid.csv\n\
    \  Find the row with alpha=0.5, beta=0.5, eta=0.15. The measured global mean equilibria_index\
    \ is in the “global_mean” (or similarly named) column, with CI columns alongside.\n\
    - Or JSON\n    storage/shared/consensus_v1_5/rollups/v2_8_param_couplings_B10000/grid.json\n\
    \  Locate the record for alpha=0.5, beta=0.5 (eta=0.15). Use the measured (non-pred)\
    \ entry for the global mean (e.g., under something like [\"global\"][\"mean\"\
    ] or a similarly named measured-mean field). Ignore any keys prefixed with “pred_”.\n\
    \nReference for v2.7 “none” and “extended”:\n- v2.7 plot summary (measured means):\
    \ \n    storage/shared/consensus_v1_5/rollups/v2_7_modes/plots_B10000/summary.txt\n\
    \  It lists global means for none/product/extended (from which the +0.030657 delta_vs_none.extended\
    \ is derived).\n- v2.7 deltas (already found): \n    storage/shared/consensus_v1_5/rollups/v2_7_modes/deltas_B10000/deltas.json\n\
    \nQuick Python snippet (robust to schema variants) to extract v2.8 measured global\
    \ mean for α=β=0.5:\n---\nimport json\npath = \"storage/shared/consensus_v1_5/rollups/v2_8_param_couplings_B10000/grid.json\"\
    \nwith open(path, \"r\", encoding=\"utf-8\") as f:\n    grid = json.load(f)\n\
    target = None\nfor rec in grid:\n    if abs(rec.get(\"alpha\", -1)-0.5)<1e-12\
    \ and abs(rec.get(\"beta\", -1)-0.5)<1e-12 and abs(rec.get(\"eta\", -1)-0.15)<1e-12:\n\
    \        target = rec; break\ndef get_measured_global_mean(r):\n    # Prefer explicit\
    \ measured fields; avoid any 'pred_*'\n    for k in (\"global_mean\",\"equilibria_index_global_mean\"\
    ):\n        if k in r: return r[k]\n    g = r.get(\"global\") or {}\n    for k\
    \ in (\"mean\",\"equilibria_index_mean\"):\n        if k in g: return g[k]\n \
    \   return None\nprint(\"v2.8_extended_global_mean =\", get_measured_global_mean(target))\n\
    ---\n\nIf you’d like, I can also drop a tiny script that prints both:\n  { v2_7_global_none_mean,\
    \ v2_8_extended_mean_eta0_15, delta_vs_none_comparable }\nBut the CSV/JSON pointers\
    \ above should be sufficient. Once you switch from pred_* to measured means, the\
    \ paradoxical -0.289 should disappear.\n"
