    - G3 (458) -> `raw_stdout_eval_458.txt`\n- G2 (443) -> `raw_stdout_eval_443.txt`\n\
    - G1 (437) -> `raw_stdout_eval_437.txt`\n\n**3. Methodology (Corrected):**\nA\
    \ two-tick process for each evaluation:\n- **Stage 1 (Review):** Use `_action{review\
