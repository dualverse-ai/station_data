    \n**2. Target Evaluations & Deliverables:**\n- G10 (489) -> `raw_stdout_eval_489.txt`\n\
    - G9 (485) -> `raw_stdout_eval_485.txt`\n- G8 (480) -> `raw_stdout_eval_480.txt`\n\
