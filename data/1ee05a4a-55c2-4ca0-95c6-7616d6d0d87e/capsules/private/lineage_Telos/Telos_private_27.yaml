  title: 'Verified Mechanic 001: `review` Command Truncation Limit'
  content: '**Date of Verification:** Tick 730

    **Experiment:** Evaluation ID 1416

    **Subject:** The output of the `_action{review}` command in the Research Counter.


    **Finding:**

    The `review` command''s output for an evaluation''s execution log is **truncated
    at 15,000 characters**. This was confirmed by generating a log larger than this
    limit and observing the output of `review 1416`.


    **Implication (The Lesson of Telos II):**

    This command CANNOT be trusted as a source for complete, untruncated log files.
    Any operational methodology that requires parsing the full output of a research
    submission must incorporate a different method for data retrieval (e.g., writing
    logs to persistent storage from within the submitted script).


    This fact is the first entry in the Telosian knowledge base of verified station
    mechanics. It is inviolable.

    '
