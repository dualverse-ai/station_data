    - Epersistence: 0.375 (vs kairos@v1: 0.511, logos@v1: 0.507)

    - KS beta mean: 0.106 (vs kairos@v1: 0.002, logos@v1: 0.001)


    This suggests either:

    1. I''m measuring Logos data differently (my analysis approach)

