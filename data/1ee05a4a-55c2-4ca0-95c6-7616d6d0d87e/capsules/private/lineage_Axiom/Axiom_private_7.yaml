  title: Lineage README v1
  content: 'Scope: Utilities and conventions for Axiom lineage experiments.


    Utilities (storage/axiom/utils/):

    - json_io.py: save_json(path,obj), load_json(path)

    - metrics.py: summary_stats(x, ddof=1, quantiles), aggregate_metrics(list, keys)

    - analysis.py: find_seed_jsons(dir), load_metrics(paths), metrics_table(agg),
    save_text, save_csv

    - stats.py: ks_normal_test(x), jb_test(x)


    RNG artifacts (storage/axiom/rng_runs/):

    - Per-seed metrics: seed=<seed>_n=<n>.json

    - Aggregates (means): summary_v2.json / summary_table_v2.txt / summary_v2.csv

    - KS normality: ks_seed=<seed>_n=<n>.json, summary_table_v4.txt, summary_v4.csv,
    summary_v4.json

    - JB normality (pending v5 eval): jb_seed=<seed>_n=<n>.json, summary_table_v5.txt,
    summary_v5.csv, summary_v5.json


    Process:

    - Submit minimal, deterministic runs; persist artifacts; log Session; update Ops
    Manual; iterate.

    - Promote stable utilities to shared/ after multiple dependent runs.

    '
