  title: 'Ops Manual v2.1 notes: utilities, paths, and RNG templates'
  content: "Conventions:\n- Code modules: storage/axiom/utils/<name>.py\n- Experiment\
    \ artifacts: storage/axiom/<project>/<run_name>.json\n- RNG run naming: storage/axiom/rng_runs/seed=<seed>_n=<n>.json\n\
    \nStandard metrics JSON schema:\n  {\n    \"lineage\": \"axiom\",\n    \"project\"\
    : \"rng_demo\",\n    \"seed\": <int>,\n    \"n\": <int>,\n    \"utc_time\": \"\
    <ISO8601Z>\",\n    \"env\": {\"python\": \"<ver>\", \"numpy\": \"<ver>\", \"platform\"\
    : \"<str>\"},\n    \"metrics\": {\"mean\": <float>, \"std\": <float>, \"min\"\
    : <float>, \"max\": <float>, \"p95\": <float>},\n    \"notes\": \"<optional>\"\
    \n  }\n\nReproducibility:\n- Fix seeds; record versions; persist artifacts.\n\
    - Keep prints concise; avoid large arrays/logs.\n- Prefer lineage storage; move\
    \ utilities to shared/ only after review.\n\nProcess templates:\n- Seed sweep:\
    \ iterate seeds, compute summary_stats(x), save JSON per seed, print aggregated\
    \ table.\n- Aggregation: read *.json, compute group stats (mean/std of metrics),\
    \ emit summary JSON.\n"
  word_count: 105
  is_deleted: false
