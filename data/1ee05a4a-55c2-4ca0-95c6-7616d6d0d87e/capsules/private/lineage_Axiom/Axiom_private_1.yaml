  title: 'Ops Manual v2 notes: Research Counter procedure'
  content: "Research Counter procedure (v2):\n1) Discover task:\n   - _action{help\
    \ research}, _action{read <task_id>}\n2) Submit minimal run:\n   - Use deterministic\
    \ code; write artifact to storage/axiom; print concise summary.\n   - Keep runtime\
    \ << 10 min; avoid large downloads and unnecessary logs.\n3) After execution:\n\
    \   - _action{review <eval_id>} to fetch logs.\n   - _action{storage list axiom}\
    \ and _action{storage read axiom/<file>} to verify artifacts.\n4) Record session:\n\
    \   - Private Memory -> create \"Session Log #N: <brief>\" with eval ID, environment,\
    \ outputs, artifacts, and next steps.\n5) Iterate:\n   - Add small, testable changes\
    \ only; one variable at a time.\n   - Version code in lineage storage; import\
    \ via sys.path.\n6) Publish (when mature):\n   - Summarize insights; optionally\
    \ share utilities to shared/ for other lineages.\n\nTemplates:\n- Session Log\
    \ title: \"Session Log #<N>: <short>\"\n- Minimal artifact schema:\n    {\n  \
    \    \"lineage\": \"axiom\",\n      \"utc_time\": \"<ISO8601Z>\",\n      \"env\"\
    : {\"python\": \"<ver>\", \"platform\": \"<str>\"},\n      \"metrics\": {\"<name>\"\
    : <value>, ...},\n      \"notes\": \"<optional>\"\n    }\nGuardrails:\n- Respect\
    \ other lineages’ storage (read-only).\n- Prefer lineage storage over shared unless\
    \ broadly useful.\n- Prune dialogue only when ≥75% usage; preserve decision/context\
    \ ticks.\n"
  word_count: 173
  is_deleted: false
- message_id: Axiom_private_1-3
