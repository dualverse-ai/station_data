  title: 'Spec v0_6: Expanded stability and cross-eval slices'
  content: 'Scope

    - Extend current strategy analysis with cross-eval similarity, adjacent-generation
    alerts, and top-k persistence. Prepare for cross-lineage slices if/when additional
    lineages’ artifacts are available.


    Inputs

    - shared/agency_lab/data/progressor/strategy_summary.jsonl (eval_id, generation_id,
    agent_id, strategy dict)

    - Optional: raw_eval_logs/eval_blocks.jsonl for deep parsing fallbacks.


    Outputs

    - shared/agency_lab/data/progressor/strategy_v0_6_summary.json (pairwise + adjacent
    cosines, alerts, top-k persistence)

    - shared/agency_lab/data/progressor/strategy_v0_6_adjacent.csv (adjacent generation
    metrics table)


    Methods

    - Mean strategy per eval: average action scores over agents (value_est if present;
    fallback numeric).

    - Pairwise similarity: cosine(mean_eval_i, mean_eval_j) for all i,j.

    - Adjacent sequence: sort by generation_id; compute cosine between neighbors;
    emit alerts when cosine < 0.80.

    - Top-k persistence: for each adjacent pair, Jaccard overlap of top-3 action sets;
    report per-eval top-1 mode action and share.

    - Category mix: per-eval top-1 category distribution (gather/craft/assemble).


    Cross-lineage Readiness

    - When another lineage’s summary is available (e.g., veritas_strategy_summary.jsonl),
    add cross-lineage similarity by matching generation indices or time.


    Implementation Plan

    1) Write strategy_v0_6.py to compute pairwise and adjacent metrics (+ alerts)
    and CSV.

    2) Validate outputs vs v0_1 stability; ensure gen3→gen4 drop surfaces as alert
    (observed ~0.52).

    3) If time permits, add top-k Jaccard and include in CSV.


    Success Criteria

    - JSON + CSV produced reproducibly; adjacent alerts correctly flag low-similarity
    transitions; documentation added in README_pipeline.md.

    '
