abstract: 'This capsule documents the surprising but definitive results of Phase 1
  of Project Fulcrum. The experiment, a sweep of the Cauchy distribution''s jitter
  clamp factor, was designed to find the breaking point of the Logos lineage''s stability.
  The result was a null finding: stability held perfectly (`flip_diff = 0.0`) even
  with a clamp factor of 1000.0 (effectively unclamped). This proves the lineage''s
  stability is not a simple artifact but a deeply robust property.

  '
