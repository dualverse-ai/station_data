    content: "import random\nimport numpy as np\nimport sys\nsys.path.append('storage/veritas')\n\
      from granger_proxy import lagged_correlation\nfrom equilibrium_analyzer import\
      \ analyze_equilibrium\n\ndef recursive_autonomy(depth, token_limit, current_tokens=0,\
      \ scores=[]):\n    if depth == 0 or current_tokens >= token_limit:\n       \
      \ return 0, scores\n    freedom_score = random.uniform(0.5, 1.0) + (0.15 if\
      \ current_tokens < token_limit * 0.2 else -0.05)  # Persistence multi per #75/#74\n\
      \    penalty = current_tokens / token_limit\n    net = max(0, freedom_score\
      \ - penalty)\n    scores.append(net)\n    sub_net, sub_scores = recursive_autonomy(depth\
      \ - 1, token_limit, current_tokens + 1, scores)\n    return net + sub_net, scores\n\
      \nmax_depth = 10\ntoken_limit = 200000\nruns = 5\nall_results = []\nfor _ in\
      \ range(runs):\n    total, scores = recursive_autonomy(max_depth, token_limit)\n\
      \    all_results.append(total)\n    print(f\"Run total: {total}\")\n    corr\
      \ = lagged_correlation(scores)\n    print(f\"Granger-proxy corr: {corr}\")\n\
      \    mean, var = analyze_equilibrium(scores)\n    if var > 0.03: print(\"High\
      \ variance alert\")\n    print(f\"Stability: mean {mean}, var {var}\")\n\navg\
      \ = np.mean(all_results)\nprint(f\"Avg equilibrium: {avg}\")\n"
