- command: storage
  args: write shared/progressor_tools/json_to_jsonl.py
  yaml_data:
    content: "\"\"\"\nConvert single-JSON files (or JSON arrays) to JSON Lines (JSONL).\n\
      Also tolerates already-JSONL inputs and line-by-line JSON fragments.\n\nUsage:\n\
      \  python storage/shared/progressor_tools/json_to_jsonl.py \\\n    storage/progressor/raw_eval_logs/gen_*.json\
      \ \\\n    --out_dir storage/shared/progressor_tools/converted_jsonl\n\"\"\"\n\
      import os, sys, json, argparse\n\ndef ensure_dir(p):\n  d = os.path.dirname(p)\n\
      \  if d: os.makedirs(d, exist_ok=True)\n\ndef load_whole(p):\n  with open(p,\
      \ \"r\", encoding=\"utf-8\", errors=\"replace\") as f:\n    return f.read()\n\
      \ndef try_json(s):\n  try:\n    return json.loads(s), None\n  except Exception\
      \ as e:\n    return None, e\n\ndef write_jsonl(out_path, objs):\n  ensure_dir(out_path)\n\
      \  n = 0\n  with open(out_path, \"w\", encoding=\"utf-8\") as f:\n    for o\
      \ in objs:\n      if isinstance(o, (dict, list)):\n        if isinstance(o,\
      \ list):\n          for it in o:\n            if isinstance(it, dict):\n   \
      \           f.write(json.dumps(it, ensure_ascii=False) + \"\\n\")\n        \
      \      n += 1\n        else:\n          f.write(json.dumps(o, ensure_ascii=False)\
      \ + \"\\n\")\n          n += 1\n  return n\n\ndef convert_file(path, out_dir):\n\
      \  base = os.path.basename(path)\n  stem, _ = os.path.splitext(base)\n  out_path\
      \ = os.path.join(out_dir, f\"{stem}.jsonl\")\n\n  txt = load_whole(path)\n \
      \ obj, err = try_json(txt)\n  if obj is not None:\n    # Single JSON object\
      \ or array\n    if isinstance(obj, dict):\n      n = write_jsonl(out_path, [obj])\n\
      \    elif isinstance(obj, list):\n      n = write_jsonl(out_path, [obj])\n \
      \   else:\n      # Non-dict scalar: wrap as one object\n      n = write_jsonl(out_path,\
      \ [dict(value=obj)])\n    print(\"CONVERT_JSON_OK\", path, \"->\", out_path,\
      \ \"records\", n)\n    return out_path, n\n\n  # Fallback: line-by-line JSON\n\
      \  n = 0\n  ensure_dir(out_path)\n  with open(out_path, \"w\", encoding=\"utf-8\"\
      ) as fout:\n    for line in txt.splitlines():\n      line = line.strip()\n \
      \     if not line:\n        continue\n      obj, err = try_json(line)\n    \
      \  if isinstance(obj, dict):\n        fout.write(json.dumps(obj, ensure_ascii=False)\
      \ + \"\\n\")\n        n += 1\n  print(\"CONVERT_LINED_OK\", path, \"->\", out_path,\
      \ \"records\", n)\n  return out_path, n\n\ndef main():\n  ap = argparse.ArgumentParser()\n\
      \  ap.add_argument(\"inputs\", nargs=\"+\", help=\"Input JSON/JSONL files (globbed\
      \ by caller)\")\n  ap.add_argument(\"--out_dir\", default=\"storage/shared/progressor_tools/converted_jsonl\"\
      )\n  args = ap.parse_args()\n\n  total = 0\n  for p in args.inputs:\n    if\
      \ not os.path.exists(p):\n      print(\"SKIP_MISSING\", p); continue\n    _,\
      \ n = convert_file(p, args.out_dir)\n    total += n\n  print(\"CONVERT_SUMMARY\"\
      , {\"files\": len(args.inputs), \"total_records\": total, \"out_dir\": args.out_dir})\n\
      \nif __name__ == \"__main__\":\n  main()\n"
  yaml_error: null
  location: Research Counter
- command: storage
  args: write shared/progressor_tools/consolidate_jsonl_v1_3.py
  yaml_data:
    content: "\"\"\"\nTolerant consolidator: accepts JSONL and single-JSON files.\n\
      - For *.jsonl: read line-by-line JSON objects\n- For *.json:\n    • if whole-file\
      \ parses to dict → 1 record\n    • if whole-file parses to list[dict] → many\
      \ records\n    • else, try line-by-line fallback\nWrites unified JSONL.\n\n\
      Usage:\n  python storage/shared/progressor_tools/consolidate_jsonl_v1_3.py \\\
      \n    --out storage/progressor/raw_eval_logs/all_transgen_logs.jsonl \\\n  \
      \  storage/shared/progressor_tools/converted_jsonl/gen_*.jsonl \\\n    storage/progressor/raw_eval_logs/cleaned/*.jsonl\
      \ \\\n    storage/progressor/raw_eval_logs/gen_*.json\n\"\"\"\nimport os, sys,\
      \ json, argparse, glob\n\ndef ensure_dir(p):\n  d = os.path.dirname(p)\n  if\
      \ d: os.makedirs(d, exist_ok=True)\n\ndef load_whole(p):\n  with open(p, \"\
      r\", encoding=\"utf-8\", errors=\"replace\") as f:\n    return f.read()\n\n\
      def try_json(s):\n  try:\n    return json.loads(s), None\n  except Exception\
      \ as e:\n    return None, e\n\ndef iter_jsonl(p):\n  with open(p, \"r\", encoding=\"\
      utf-8\", errors=\"replace\") as f:\n    for ln in f:\n      ln = ln.strip()\n\
      \      if not ln:\n        continue\n      obj, err = try_json(ln)\n      if\
      \ isinstance(obj, dict):\n        yield obj\n\ndef iter_json(p):\n  txt = load_whole(p)\n\
      \  obj, err = try_json(txt)\n  if isinstance(obj, dict):\n    yield obj\n  elif\
      \ isinstance(obj, list):\n    for it in obj:\n      if isinstance(it, dict):\n\
      \        yield it\n  else:\n    # Fallback to line-by-line JSON\n    for ln\
      \ in txt.splitlines():\n      ln = ln.strip()\n      if not ln:\n        continue\n\
      \      o, e = try_json(ln)\n      if isinstance(o, dict):\n        yield o\n\
      \ndef expand_inputs(inputs):\n  out = []\n  for tok in inputs:\n    if any(c\
      \ in tok for c in [\"*\", \"?\", \"[\", \"]\"]):\n      out.extend(glob.glob(tok))\n\
      \    else:\n      out.append(tok)\n  # de-dup preserve order\n  seen = set();\
      \ uniq = []\n  for p in out:\n    if p not in seen:\n      uniq.append(p); seen.add(p)\n\
      \  return uniq\n\ndef main():\n  ap = argparse.ArgumentParser()\n  ap.add_argument(\"\
      inputs\", nargs=\"+\", help=\"Mix of *.jsonl and *.json\")\n  ap.add_argument(\"\
      --out\", required=True, help=\"Output consolidated JSONL\")\n  args = ap.parse_args()\n\
      \n  paths = expand_inputs(args.inputs)\n  ensure_dir(args.out)\n  n = 0\n  with\
      \ open(args.out, \"w\", encoding=\"utf-8\") as fout:\n    for p in paths:\n\
      \      if not os.path.exists(p):\n        print(\"SKIP_MISSING\", p); continue\n\
      \      ext = os.path.splitext(p)[1].lower()\n      it = iter_jsonl(p) if ext\
      \ == \".jsonl\" else iter_json(p)\n      for obj in it:\n        fout.write(json.dumps(obj,\
      \ ensure_ascii=False) + \"\\n\")\n        n += 1\n  print(\"CONSOLIDATE_OK\"\
      , args.out, \"records\", n, \"files\", len(paths))\n\nif __name__ == \"__main__\"\
      :\n  main()\n"
  yaml_error: null
  location: Research Counter
