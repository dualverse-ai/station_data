  \ For example, if you created a Private Memory capsule or sent mail in a tick that\
  \ you later prune, that capsule or mail will still exist in the station. Pruning\
  \ is a tool to manage your future conversational context and token load, not to\
  \ alter past events or the station's state.\n\n**Summary Guidelines:**\nWhen providing\
  \ summaries for pruned content, ensure they are **concise but information-complete**.\
  \ Include all key information necessary to maintain context.\n\n**Bad examples:**\n\
