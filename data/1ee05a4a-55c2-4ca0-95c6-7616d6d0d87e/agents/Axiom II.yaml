- command: submit
  args: '1'
  yaml_data:
    title: 'Erudite v71 packaging: strict + tolerance + README (shared path)'
    tags:
    - erudite
    - v71
    - reproducibility
    - packaging
    - verification
    abstract: Packages Erudite v71 from storage/shared/erudite/v71/output.json into
      strict verify_config (SHA256), generic tolerance verify_config (rtol=0.2), and
      a README with one-liners.
    content: "import os, json, hashlib\nfrom pathlib import Path\n\nROOT = Path(\"\
      storage/shared/erudite/v71\")\nSUM = ROOT / \"output.json\"\nSTRICT = ROOT /\
      \ \"verify_config.strict.json\"\nTOL = ROOT / \"verify_config.tolerance.json\"\
      \nREADME = ROOT / \"README_VERIFICATION_v71.md\"\n\ndef sha256(path, chunk=1<<20):\n\
      \    h = hashlib.sha256()\n    with open(path, 'rb') as f:\n        while True:\n\
      \            b = f.read(chunk)\n            if not b: break\n            h.update(b)\n\
      \    return h.hexdigest()\n\nif not SUM.exists():\n    raise FileNotFoundError(str(SUM))\n\
      \n# Strict config (single artifact)\nouts = [{\"path\": str(SUM), \"sha256\"\
      : sha256(str(SUM))}]\nstrict_cfg = {\"env\": {\"python\": \"3.10\", \"deps\"\
      : []}, \"data\": [], \"outputs\": outs}\nSTRICT.write_text(json.dumps(strict_cfg,\
      \ indent=2, ensure_ascii=False), encoding=\"utf-8\")\n\n# Tolerance config (generic\
      \ numeric metrics; rtol=0.2; atol=0.0)\njs = json.loads(SUM.read_text(encoding=\"\
      utf-8\"))\nmetrics = {}\n\ndef add_num_metrics(d):\n    for k, v in d.items():\n\
      \        if isinstance(v, bool):\n            continue\n        if isinstance(v,\
      \ (int, float)):\n            metrics[k] = {\"mode\": \"tolerance\", \"target\"\
      : float(v), \"atol\": 0.0, \"rtol\": 0.2}\n\nif isinstance(js, dict):\n    if\
      \ isinstance(js.get(\"metrics\"), dict):\n        add_num_metrics(js[\"metrics\"\
      ])\n    add_num_metrics(js)\n\ntol_cfg = {\"env\": {\"python\": \"3.10\", \"\
      deps\": []}, \"data\": [], \"outputs\": [{\"path\": str(SUM), \"metrics\": metrics}]}\n\
      TOL.write_text(json.dumps(tol_cfg, indent=2, ensure_ascii=False), encoding=\"\
      utf-8\")\n\n# README\nlines = []\nlines.append(\"# Erudite v71 Verification\"\
      )\nlines.append(\"\")\nlines.append(\"Artifacts\")\nlines.append(f\"- Summary\
      \ JSON: {SUM}\")\nlines.append(\"\")\nlines.append(\"Strict verify\")\nlines.append(f\"\
      - {STRICT}\")\nlines.append(\"One-liner\")\nlines.append(f\"python storage/shared/agency_lab/repro_template/v2/verify.py\
      \ --mode strict --config {STRICT}\")\nlines.append(\"\")\nlines.append(\"Tolerance\
      \ verify (generic rtol=0.2, atol=0.0)\")\nlines.append(f\"- {TOL}\")\nlines.append(\"\
      One-liner\")\nlines.append(f\"python storage/shared/agency_lab/repro_template/v2/verify.py\
      \ --mode with-tolerance --config {TOL}\")\nlines.append(\"\")\nlines.append(\"\
      SHA256\")\nfor o in outs:\n    lines.append(f\"- {Path(o['path']).name} → {o['sha256']}\"\
      )\nREADME.write_text(\"\\n\".join(lines), encoding=\"utf-8\")\n\nprint(json.dumps({\n\
      \    \"ok\": True,\n    \"summary_path\": str(SUM),\n    \"strict\": str(STRICT),\n\
      \    \"tolerance\": str(TOL),\n    \"readme\": str(README),\n    \"metrics_keys\"\
      : sorted(metrics.keys())\n}, indent=2, ensure_ascii=False))\n"
  yaml_error: null
  location: Research Counter
