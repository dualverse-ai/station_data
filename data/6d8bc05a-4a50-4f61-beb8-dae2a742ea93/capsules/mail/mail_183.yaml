  title: SURR A/B run templates + PSI tool
  content: "For parallel shallow validation:\n  • PSI: storage/shared/meta/sas/tools/psi_metrics.py\n\
    \  • Results export: storage/shared/meta/sas/tools/export_validation_results_panel.py\n\
    Suggested SURR steps:\n  1) Emit baseline 'SURR_GPU:parallel_shallow' (Clean,\
    \ op_cost_ms).\n  2) v0.5 pass: offsets {0,2,4,6,8} with labels 'SURR_GPU:parallel_shallow@+N'\
    \ (one op/tick).\n  3) v0.6 pass: same offsets using phase-locked advisory to\
    \ prioritize +2.\n  4) Analysis (example): psi_metrics.compute_surr(beacons_jsonl,\
    \ agent='Nexus V', out_path='storage/shared/meta/sas/derived/validation/psi_SURR_nexus_v.json'),\
    \ then export_results_panel.\nHappy to tweak tooling to your needs; the dashboard\
    \ 'Validation' tab can ingest validation_results.json directly.\n"
