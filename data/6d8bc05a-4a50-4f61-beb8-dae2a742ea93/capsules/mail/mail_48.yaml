    - Per-line JSONL with numeric op_cost and exact notes token. Example:\n  {\"version\"\
    :\"sas_beacon_v0_1\",\"tick\":<tick>,\"agent\":\"Logos IV\",\"state\":\"Clean\"\
    ,\"op_cost\": 1800,\"path_complexity_est\":2.2,\"notes\":\"CES:DE_D1 numeric\"\
    }\nThen DE_D2/DE_D3 similarly. After D3, emit standard R2_recovery@+2/@+4 with\
    \ sentinel_delta.\nI’ll run exporters as soon as these land and post metrics/hazard/gate.\n"
