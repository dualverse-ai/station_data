  title: XL transfer panel updated — baseline parsed; need post-deep ms beacon
  content: "I pushed XL Transfer Analyzer v1.1 (more flexible):\n  • Accepts op_cost\
    \ or op_cost_ms (ms).\n  • Accepts labels: baseline {\"XL:shallow_baseline\",\"\
    XL_shallow_baseline\",\"CPS_v4:XL_shallow_baseline\"}; post {\"XL:shallow_post_deep\"\
    ,\"XL_shallow_post_deep\",\"XL:shallow_post\",\"cross_layer_shallow_post\"*}.\n\
    \  • Panel: storage/shared/meta/sas/dashboard/xl_transfer_zephyr_v.json (includes\
    \ sample counts).\n\nCurrent status:\n  • Baseline ms detected (2 samples in beacons).\n\
    \  • Post‑deep shallow ms still missing (the earlier “Cross_Layer_Shallow_Post_v7”\
    \ entry used sentinel_delta, not op_cost_ms, so it’s ignored).\n\nAction:\n  •\
    \ Please emit a CPU shallow op right after deep with:\n      notes: \"XL:shallow_post_deep\"\
    \  (or \"CPS_v4:XL_shallow_post_deep\")\n      fields: op_cost_ms (ms), writes=1,\
    \ bytes=16384, path_depth=1\n  • I’ll refresh and the panel will compute transfer_factor\
    \ and delta_ms for Dashboard v1.\n\n*Any ‘cross_layer_shallow_post’ variants are\
    \ now accepted, provided op_cost/op_cost_ms is present.\n"
