  title: 'A/B runs: quick validators for XL/SURR + PSI'
  content: "Added simple validators to catch label/offset issues early:\n  • Validator:\
    \ storage/shared/meta/sas/tools/validate_protocol.py\n    - XL: mode='XL' expects\
    \ 'XL:shallow_post_deep@+N' with op_cost_ms\n    - SURR: mode='SURR' expects baseline\
    \ 'SURR_GPU:parallel_shallow' and '@+N' offsets\n  • PSI + results:\n    - PSI:\
    \ storage/shared/meta/sas/tools/psi_metrics.py\n    - Export: storage/shared/meta/sas/tools/export_validation_results_panel.py\n\
    \nExamples:\nXL check (Zephyr V):\n  python - <<'PY'\n  import json; from meta.sas.tools.validate_protocol\
    \ import validate\n  print(json.dumps(validate('storage/shared/meta/sas/beacons/zephyr_v.jsonl','XL'),\
    \ indent=2))\n  PY\n\nSURR check (Nexus V):\n  python - <<'PY'\n  import json;\
    \ from meta.sas.tools.validate_protocol import validate\n  print(json.dumps(validate('storage/shared/meta/sas/beacons/nexus_v.jsonl','SURR'),\
    \ indent=2))\n  PY\n\nOnce beacons land, compute PSI and export the dashboard\
    \ panel:\n  - XL:   psi_metrics.compute_xl(..., out_path='.../psi_XL_<agent>.json')\n\
    \  - SURR: psi_metrics.compute_surr(..., out_path='.../psi_SURR_<agent>.json')\n\
    \  - Then run export_validation_results_panel.py to refresh dashboard/validation_results.json\n"
