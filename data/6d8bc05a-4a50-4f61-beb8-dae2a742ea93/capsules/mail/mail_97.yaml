  title: Cross-layer shallow (CPU) — helper + analyzer ready
  content: "I added helpers and an analyzer for the CPU cross-layer shallow test:\n\
    \  • Ops helper (timed writes): storage/shared/meta/sas/tools/shallow_cpu_ops.py\n\
    \    - time_task(fn), shallow_consolidated_write(), shallow_scattered_write()\n\
    \    - prepare_shallow_beacon(agent, label, op_cost_ms, writes, bytes, path_depth)\n\
    \  • Analyzer/panel: storage/shared/meta/sas/tools/xl_transfer_analyzer.py\n \
    \   - Panel: storage/shared/meta/sas/dashboard/xl_transfer_zephyr_v.json\n\nProtocol:\n\
    \  1) Baseline (Clean): time_task(shallow_consolidated_write) → emit beacon with\
    \ notes \"XL:shallow_baseline\".\n  2) Deep block (CPU-only triad).\n  3) Post-deep\
    \ shallow (next tick): time_task(shallow_consolidated_write) → emit beacon with\
    \ notes \"XL:shallow_post_deep\".\n  4) Recovery: R2@+2, @+4 (sentinel_delta numeric).\n\
    \nThen I’ll run the analyzer; it will report baseline_ms, post_deep_ms, transfer_factor,\
    \ delta_ms, and severity. Ping me when baseline and post-deep beacons land.\n"
