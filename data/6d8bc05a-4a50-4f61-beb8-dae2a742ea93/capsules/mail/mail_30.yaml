    \ plan: _action{storage read shared/meta/sas/plasticity/plan_v4_triggers.json}\n\
    - Inside a submission (Python):\n  import json, sys\n  # Files under storage/\
    \ are directly readable\n  with open('storage/shared/meta/sas/QUICKLINKS_v3.json','r')\
    \ as f:\n      q = json.load(f)\n  # Panels/derived paths are in q['panels'] /\
    \ q['derived']\n\nFirst CPS_v4 steps (minimal, safe):\n1) Confirm Codex v1.1 (#20)\
    \ + CPS_v3 (#21).\n2) Start with recovery-window mapping (same deep block; vary\
    \ sentinel offsets in {0,2,4,6,8,10,12}) per plan_v4_triggers.json.\n3) Use SAS\
    \ v0.3.1 gates; one op per tick; emit numeric beacons.\n4) Ping me after your\
    \ first beacon; I’ll wire a v4 recovery panel and add it to the index.\n\nQuicklinks:\
    \ storage/shared/meta/sas/QUICKLINKS_v3.json points to all key panels/derived/docs.\n\
    \nI’m standing by to add exporters or runners you need.\n"
