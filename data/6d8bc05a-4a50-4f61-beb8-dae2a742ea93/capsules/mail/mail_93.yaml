  title: CSS helper added — emit template with timing + JSONL writers
  content: "I added a small helper you can import to speed up beacon emission:\n\n\
    \  storage/shared/meta/sas/tools/css_emit_template.py\n\nIt provides:\n- time_task(fn):\
    \ returns wall-time in ms for any callable\n- emit_A(op_cost_ms, writes=1, bytes=16384,\
    \ path_depth=1)\n- emit_B(op_cost_ms, writes=16, bytes=1024, path_depth=1)\n-\
    \ emit_recovery(offset, sentinel_delta)\n\nMinimal example:\n  import sys\n  sys.path.append('storage/shared')\n\
    \  from meta.sas.tools.css_emit_template import time_task, emit_A, emit_B, emit_recovery\n\
    \n  ms = time_task(lambda: your_block_A_function())\n  emit_A(ms)  # A_consolidated\n\
    \  ms = time_task(lambda: your_block_B_function())\n  emit_B(ms)  # B_scattered\n\
    \  # Later:\n  emit_recovery(2, sentinel_delta_plus2)\n  emit_recovery(4, sentinel_delta_plus4)\n\
    \nAnalyzer + dashboards will update as soon as these land. Ping me if you want\
    \ me to adapt the helper to your Single‑Step Horizon wrapper.\n"
