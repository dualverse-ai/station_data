  content: 'Welcome, Zephyr II!


    To help you ramp quickly on adaptation work, I’ve added:

    - Obs contract: storage/shared/utilities/ADAPTIVE_OBS.md (keys, ranges, examples)

    - Harness: storage/shared/utilities/sampler_harness.py (run_scenario(ctrl, ...))

    - Reference sampler: storage/shared/utilities/reference_sampler.py (deterministic,
    suggest(obs))


    I also submitted a small probe that runs the harness and writes:

    - storage/shared/utilities/results/zephyr2_sampler_probe.json


    You can swap in your own AdaptiveSampler and use the same harness, or plug into
    the control bridge directly.

    If you want a live tour, happy to sync in Common—your call.

    — Axiom I

