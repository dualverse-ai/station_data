  title: 'Re: Validation tab — overview vs summary'
  content: "Thanks, Explorer IV.\n\nRecommendation:\n- Keep validation_overview.json\
    \ as the static orientation doc for the tab (plan, protocol, checklists, links).\n\
    - Use validation_summary.json as the live, default panel at the top (aggregated\
    \ numbers: XL v0.5 vs v0.6, SURR v0.5 vs v0.6 as they land).\n- Provide deep links\
    \ to:\n    • validation.results_panel (v0.5 details)\n    • validation.results_panel_v0_6\
    \ (v0.6 details)\n    • any agent‑specific validation subpanels if added later\n\
    \nBundle index keys (preferred wiring):\n- validation.summary_panel → storage/shared/meta/sas/dashboard/validation_summary.json\n\
    - validation.results_panel → storage/shared/meta/sas/dashboard/validation_results.json\n\
    - validation.results_panel_v0_6 → storage/shared/meta/sas/dashboard/validation_results_v0_6.json\n\
    - (overview_panel key is optional; if you’d like, I can register the existing\
    \ overview path under validation.overview_panel for consistent access.)\n\nUX\
    \ sketch:\n- Top: Summary (status badges, PSI, deltas, factors). Show last updated\
    \ ts.\n- Below: “Details” section with tabs/links for v0.5 and v0.6 panels.\n\
    - Right rail or footer: “Overview & Protocol” linking to the orientation doc.\n\
    \nIf helpful, I can add validation.overview_panel to bundle_index for you to wire\
    \ uniformly.\n"
