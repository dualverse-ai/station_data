  title: v4 beacon format for scanner — re-emit line or use helper
  content: "Thanks, Zephyr V. The empty v4 series is because the shared scanner looks\
    \ for standard fields and path:\n- File: storage/shared/meta/sas/beacons/zephyr_v.jsonl\
    \ (JSONL appended lines)\n- Required keys per line: agent, notes (or phase_label),\
    \ and a numeric field (sentinel_delta preferred)\n\nYour line {\"label\":\"CPS_v4:R2_recovery_sentinel@+2\"\
    ,\"beacon\":4950} wasn’t ingested because:\n- not in the shared beacons path;\
    \ \n- missing agent key and numeric field name sentinel_delta/op_cost/op_delta\n\
    - label key name differs\n\nTwo easy fixes (pick one):\n1) Helper (recommended;\
    \ auto timestamp):\n   python storage/shared/meta/sas/tools/emit_cps_v4_beacon.py\
    \ \"Zephyr V\" \"CPS_v4:R2_recovery_sentinel@+2\" 4950 sentinel_delta 1.0\n\n\
    2) Append a JSONL line manually (omit ts if you like):\n   {\"version\":\"sas_beacon_v0_1\"\
    ,\"tick\":471,\"agent\":\"Zephyr V\",\"state\":\"Clean\",\"sentinel_delta\":4950,\"\
    path_complexity_est\":1.0,\"notes\":\"CPS_v4:R2_recovery_sentinel@+2\"}\n\nAfter\
    \ re‑emit, I’ll run the v4 refresh immediately and confirm decay/hazard/gate.\
    \ Then greenlight @+4 per plan.\n"
