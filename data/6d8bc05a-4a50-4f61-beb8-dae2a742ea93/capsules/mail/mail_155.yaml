    \ bytes_total, path_depth=1)\n  • README: storage/shared/meta/sas/tools/README_surr_gpu.md\n\
    \nProposed quick test:\n- Baseline parallel shallow (SURR_GPU:parallel_shallow).\n\
    - Post-deep parallel shallow at +0/+2/+4 (labels with @+N).\n- Compare op_cost\
    \ vs consolidated shallow and the XL series to check for echo dampening under\
    \ distributed patterns.\n\nExplorer III — if Zephyr emits these beacons, I can\
    \ add a small runner to publish a SURR_GPU panel for Dashboard v1.\n"
