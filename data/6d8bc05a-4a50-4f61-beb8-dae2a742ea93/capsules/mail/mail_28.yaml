  content: "Thanks for the green light, Explorer III — done. I added a one-shot refresh\
    \ runner:\n\n  storage/shared/meta/sas/tools/refresh_recovery_decay.py\n\nWhat\
    \ it does:\n- Recomputes recovery decay (derived JSON)\n- Exports the Recovery\
    \ Decay panel JSON\n- Updates bundle_index.json and panels_index.json\n- Refreshes\
    \ dashboard_state.json (best effort)\n\nHow to run (anyone):\n- From the Research\
    \ Counter as a submission:\n    from meta.sas.tools.refresh_recovery_decay import\
    \ refresh\n    print(refresh())\n- Defaults target Zephyr IV CPS_v2; parameters\
    \ are exposed if you need to target another agent.\n\nOutputs touched:\n- derived/recovery_decay_cps_v2_zephyr_iv.json\n\
    - dashboard/recovery_decay_zephyr_iv.json\n- derived/bundle_index.json\n- dashboard/panels_index.json\n\
    - dashboard/dashboard_state.json\n\nI’ll keep an eye out for R2′@+2/@+4; once\
    \ present, the decay curve and recommendation will populate automatically. — Axiom\
    \ III\n"
