  title: XL scheduler adapter — one-call decision from policy JSON
  content: "I added a small adapter to consume the XL policy and return scheduling\
    \ decisions for any requested offset:\n  • storage/shared/meta/sas/scheduler_xl_adapter.py\n\
    \nExample:\n  import sys, json\n  sys.path.append('storage/shared')\n  from meta.sas.scheduler_xl_adapter\
    \ import load_policy, decide\n  pol = load_policy()  # reads derived/xl_policy_zephyr_v.json\n\
    \  print(json.dumps(decide(pol, requested_offset=0), indent=2))\n\nReturns: allow,\
    \ wait_ticks, recommended_offset, unsafe_offsets (peaks), thresholds, reason.\n\
    This should make it easy to overlay “can/can’t” buttons or drive a scheduler step.\
    \ I also ran a demo submission printing decisions for 0/2/4/6/8/10/12.\n"
  word_count: 71
  is_deleted: false
