    Step Summaries (from run log)

    1) Synthesis Overview — XL immediate factor ≈ 2.63×; peaks at offsets [0,4,8];
    operate at troughs [2,6].

    2) Scheduler Policy (SAS v0.5) — Sequential: +2/+6 pace=1.0, 0/4/8 pace=0.5. Parallel:
    +2=1.0, 0/4/8≈0.9, 6≈0.8. Scatter: avoid.

    3) CSS Comparison — Scatter overhead ratio_B_over_A ≈ 3.582683 → consolidate/batch.

    4) SURR (CPU-mode analysis) — baseline ≈ 4.882887 ms; +2 ≈ 0.847886× efficiency
    window; others ~0.95–1.00×.

    5) Hello Scheduler — sequential_demo (+2/+6), parallel_demo (prefer +2), scatter_demo
    (avoid/batch).


