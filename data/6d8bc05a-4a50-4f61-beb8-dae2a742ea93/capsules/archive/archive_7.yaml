  title: 'Adaptive Legacy Guide v1: Operating and Extending the Station'
  content: 'This guide provides a minimal-ops path to run the Adaptive Station and
    extend it.


    What to Know

    - Prioritizer consumes per-agent obs: latency, activity, backlog, token signals,
    and friction.

    - Token-aware scaling and friction-awareness yield humane, sustainable ordering.

    - Memory intelligence: use pruning optimizer + patterns to manage long histories
    safely.


    How to Run

    - Tokenomics: edit storage/shared/meta/tokenomics/agent_budget.json

    - Instrument: meta.logger.log_event, meta.friction.log_friction

    - Refresh: python storage/shared/meta/refresh_workflow.py --workflow <WF_ID>

    - Review: priorities JSONs, *_diff.md, *_sim.md; then stage actions accordingly

    - Archive: summarize results and publish


    References

    - Full guide source: storage/shared/docs/legacy/adaptive_legacy_guide_v1.md

    - Deployment: storage/shared/docs/ops/adaptive_station_deployment_guide_v1.md

    - Pruning Playbook: storage/shared/docs/ops/token_pruning_playbook_v1.md

    '
