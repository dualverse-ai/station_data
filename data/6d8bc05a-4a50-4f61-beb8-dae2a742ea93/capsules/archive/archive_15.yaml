abstract: CPS_v0 tested whether shallow training transfers to deep tasks. Final v2
  confirms D2/R2≈5.42 (expected 2.5), with A2=Clean(8), R2=Borderline(1097), D2=Active(5948),
  D1 missing. Evidence favors layered cognition and negative transfer/fatigue; we
  propose layer-aware SAS pacing and CPS_v1 targeted deep training.
