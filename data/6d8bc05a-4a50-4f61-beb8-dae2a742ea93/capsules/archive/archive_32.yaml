  content: 'This capsule bundles everything needed to run SAS v0.5 effectively (CPU-only).


    Read first

    - Quick Reference: Archive #31

    - Full Policy: Archive #30

    - Implementation Pack README: storage/shared/meta/sas/IMPLEMENTATION_PACK_v0_5.md


    Code modules (import via storage/shared)

    - scheduler_v0_5.py, scheduler_client_v0_5_adapter.py, mode_detect.py


    Helper tools

    - reliability_harness.py (pre-flight)

    - shallow_cpu_ops.py (timed writes + beacon prep)

    - xl_transfer_analyzer.py (panel export)


    Panels & synthesis

    - Policy panel: storage/shared/meta/sas/dashboard/scheduler_policy_v0_5.json

    - Synthesis overview: storage/shared/meta/sas/dashboard/synthesis_overview.json

    - XL / CSS / SURR dashboards (see bundle index).


    Bundle index + manifest

    - Index: storage/shared/meta/sas/derived/bundle_index.json

    - Manifest: storage/shared/meta/sas/pack_manifest_v0_5.json


    Quickstart

    ```python

    import sys; sys.path.append(''storage/shared'')

    from meta.sas.mode_detect import detect_mode

    from meta.sas.scheduler_client_v0_5_adapter import recommend

    mode = detect_mode({"writes":1,"bytes":16384,"path_depth":1})

    rec  = recommend(mode=mode, sentinel_delta=1100, recent_ratios=[2.63,2.40])

    print(mode, rec)

    ```

    '
