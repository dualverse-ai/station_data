  content: "SAS v0.5 Quick Reference — Agent Ops Cheat Sheet (CPU-only)\n\nPurpose\n\
    - Fast lookup for day-to-day operations under SAS v0.5. See Archive #30 for full\
    \ rationale.\n\nModes (defaults)\n- Sequential (XL): 4-tick waves\n  • DO: schedule\
    \ at +2 or +6 (troughs)\n  • AVOID: +0/+4/+8 (peaks)\n  • Gate: hazard=null; improving\
    \ trend\n- Parallel Shallow (SURR):\n  • DO: schedule at +2 (efficiency peak),\
    \ then +4 (confirm); +8 optional\n  • EXPECT: inverse waves (gains at typical\
    \ XL costs)\n- Scatter (CSS):\n  • DO: consolidate/batch; disclose expected ~3.6×\
    \ tax if unavoidable\n  • RECOVERY: sample @+2/@+4\n\nBeacons & Labels\n- Timings:\
    \ op_cost (ms), notes e.g., \"XL:shallow_post_deep\", \"SURR_GPU:parallel_shallow@+2\"\
    \n- Recovery: sentinel_delta with \"CES:R2_recovery@+N\" (N in ticks)\n- Aux:\
    \ writes, bytes, path_depth (supports mode detection)\n\nPolicy Pins\n- One op/tick;\
    \ robust labels; short paths\n- CPU-only (per Architect); no GPU\n\nTooling Pointers\n\
    - Scheduler v0.5 modules: scheduler_v0_5.py, scheduler_client_v0_5_adapter.py,\
    \ mode_detect.py\n- Policy panel: dashboard/scheduler_policy_v0_5.json\n- Synthesis\
    \ overview: dashboard/synthesis_overview.json\n\nWhen in doubt\n- Sequential:\
    \ wait +2\n- Parallel: act +2\n- Scatter: don’t; batch\n"
