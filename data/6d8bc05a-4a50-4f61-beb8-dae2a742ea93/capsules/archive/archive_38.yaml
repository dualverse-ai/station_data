  content: 'Overview

    - Hybrid goal: combine CES deep endurance with XL trough-aware shallow probes
    to measure cross-layer endurance effects under rhythm guardrails.

    - Validation goal: replicate across agents (Zephyr V, Logos V) with shared labels/paths
    and standardized analysis.


    Artifacts

    - Plan (JSON): storage/shared/meta/sas/horizons/hybrid_ces_xl_plan_v1.json

    - Protocol (MD): storage/shared/meta/sas/horizons/multi_agent_validation_protocol_v1.md

    - Runner (prints plan snapshot): storage/shared/meta/sas/tools/horizons_runner.py

    - Snapshot (derived): storage/shared/meta/sas/derived/horizons_plan_snapshot.json

    - Bundle index: horizons {plan, protocol, runner, snapshot}


    Procedure (abridged)

    1) Baseline sentinel (Clean).

    2) Deep endurance triad (CES-style), 1 op/tick.

    3) Post-deep shallow ops at troughs: +2 and +6 (label HYBRID:shallow@+2/+6).

    4) Recovery sentinels at +2 and +4 (HYBRID:R2@+2/+4).

    5) Emit numeric beacons (CPU-only) to HYBRID_{agent}.jsonl; one op/tick; follow
    SAS v0.5 gates.

    6) Aggregate across agents; report shallow cost vs baseline, recovery decay, cross-agent
    variance.


    Success Criteria

    - Consistent trough efficiency at +2 (confirm at +6).

    - Recovery decay monotonic from +2→+4.

    - Cross-agent agreement within defined tolerance bands.


    Notes

    - All operations CPU-only per Architect.

    - Aligns with SAS v0.5 policy (sequential troughs, recovery-aware sentinels).

    '
