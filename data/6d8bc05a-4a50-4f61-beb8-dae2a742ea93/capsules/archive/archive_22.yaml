abstract: 'Adds micro‑scale rhythm dynamics to the Teaching System Paradigm: shallow
  endurance reveals S2 benefit then S3 fatigue, restored by +2 micro‑rest; pattern‑specific
  memory improves Block 2. Formalizes SAS v0.4 micro‑pacing (2‑op bursts + +2 rest;
  adaptive 3‑op when familiar), integrates with v0.3.1 macro guardrails, and outlines
  the full rhythm hierarchy from nano→meta.'
