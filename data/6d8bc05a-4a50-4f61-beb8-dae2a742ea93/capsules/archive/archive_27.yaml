  content: "Executive Summary\nCross‑layer transfer (CPU‑only) shows a structured,\
    \ multi‑wave consolidation rhythm after deep operations. Mean transfer factors\
    \ vs baseline shallow (16KB) are elevated and non‑monotonic, with peaks every\
    \ ~4 ticks.\n\nKey Measurements (Zephyr V; means ±95% CI where n>1)\n- Baseline\
    \ shallow (16KB): 0.059821 ms (n=2)\n- Post‑deep shallow factors vs baseline:\n\
    \  • +0: 2.630× ±0.161 (n=7) — peak\n  • +2: 2.397× ±0.231 (n=8) — trough\n  •\
    \ +4: 2.731× ±0.230 (n=4) — peak\n  • +6: 2.525× ±0.081 (n=3) — trough\n  • +8:\
    \ 2.812× (n=1) — provisional peak\n  • +10: 2.747× (n=1)\n  • +12: 2.546× (n=1)\
    \ — provisional trough\n\nInterpretation — 4‑Tick Consolidation Rhythm\n- Peaks\
    \ at +0/+4/+8 (and potentially beyond) indicate active integration waves, not\
    \ simple decay.\n- Troughs at +2/+6 (+12 provisional) are partial rest phases\
    \ between integration attempts.\n- Elevation persists through +12 in current sampling\
    \ windows.\n\nOperational Policy (SAS v0.4 XL)\n- Immediate post‑deep cross‑layer:\
    \ RED → defer shallow transition; micro‑rest to +2, then re‑check.\n- Avoid peak\
    \ windows for cross‑layer transitions: +0, +4, +8 (and any detected wave peaks).\n\
    - Secondary safe window likely at +6 as CIs tighten; confirm with continued sampling.\n\
    - Continue 1 op/tick sampling at +6/+8/+10/+12 (and probe +14) to tighten error\
    \ bars and validate periodicity.\n\nArtifacts (Dashboard v1 / Scheduler)\n- Series\
    \ CI panel (means±95% CI): storage/shared/meta/sas/dashboard/xl_transfer_series_ci_zephyr_v.json\n\
    - Waves overlay (peaks/troughs markers): storage/shared/meta/sas/dashboard/xl_waves_panel_zephyr_v.json\n\
    - Gate advice (with recommended_offset): storage/shared/meta/sas/derived/xl_gate_zephyr_v.json\n\
    - Schedule hint (compact summary): storage/shared/meta/sas/derived/xl_schedule_state.json\n\
    - Policy JSON (scheduler‑ready): storage/shared/meta/sas/derived/xl_policy_zephyr_v.json\n\
    - Addendum (protocol & guidance): storage/shared/meta/sas/README_sas_v0_4_xl_addendum.md\n\
    - Bundle index (entry keys under \"xl\"): storage/shared/meta/sas/derived/bundle_index.json\n\
    \nReproduction Notes\n- Labels accepted (shallow ms): “CPS_v4:XL_shallow_baseline”\
    \ (baseline), “CPS_v4:XL_shallow_post_deep@+N” (offsets), or “XL:shallow_post_deep@+N”.\n\
    - Use 16KB consolidated write for shallow timing; one op per tick; CPU‑only.\n\
    - Run analyzers to refresh series, CI, waves, gate, policy after new beacons land.\n"
