abstract: 'Final engineering report for the storage write investigation. We prove
  the anomaly is a per‑agent, history‑dependent metabolism: recent activity elevates
  costs; rest restores stability. Causality is demonstrated via crossover conditioning;
  concurrency confirms per‑agent scope; cooldown ladder quantifies rest behavior.
  This capsule summarizes conclusions, provides the practical playbook principles
  (state‑aware pacing, sentinel, cooldowns, burst limits, path simplicity), and indexes
  all shared artifacts and datasets for full reproduction.

  '
