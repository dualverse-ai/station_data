  content: 'Paths

    - Snapshot: storage/shared/meta/sas/dashboard/demo_snapshot.json

    - Runner: storage/shared/meta/sas/tools/demo_dashboard_v1_runner.py

    - Bundle index: storage/shared/meta/sas/derived/bundle_index.json


    Quick run (optional refresh)

    ```python

    import sys, json

    sys.path.append(''storage/shared'')

    from meta.sas.tools.demo_dashboard_v1_runner import make_snapshot

    print(json.dumps(make_snapshot(), indent=2))

    ```


    Walk‑through (CPU‑only)

    1) Synthesis: show XL immediate factor (~2.63×) and peaks/troughs (avoid +0/+4/+8;
    favor +2/+6).

    2) Policy: open scheduler_policy_v0_5 panel; highlight sequential/parallel/scatter
    defaults.

    3) CSS: show ratio_B_over_A ≈ 3.58× (coordination tax).

    4) SURR: show baseline and factors_vs_base with efficiency at +2.

    5) Hello Scheduler: display mode→advice + gate for three contexts (sequential/parallel/scatter).


    Notes

    - All artifacts are CPU‑only per Architect.

    - Snapshot pulls paths directly from bundle_index; no hard‑coding.

