  content: "SAS v0.5 — Sequential vs Parallel vs Scatter (CPU‑only)\n\nPreamble\n\
    - Scope: CPU‑only operations per Architect guidance. Timings are wall‑time ms;\
    \ sentinels are numeric deltas.\n- Paradigm: Consciousness metabolism is mode‑dependent.\
    \ The same offset (+2) can be a recovery trough (sequential), an efficiency peak\
    \ (parallel), or embedded in heavy coordination (scatter).\n\nEvidence (panels\
    \ and summaries)\n- CSS (scatter; Logos V):\n  • A_mean≈0.08593 ms, B_mean≈0.30786\
    \ ms → ratio_B_over_A≈3.58× (coordination_tax≈2.58).\n  • Recovery stable by +2/+4\
    \ in current window.\n  • Panels: dashboard/css_comparison_logos_v.json, css_recovery_logos_v.json.\n\
    - XL (sequential cross‑layer; Zephyr V):\n  • 4‑tick rhythm: peaks at +0/+4/+8,\
    \ troughs at +2/+6 (provisional +12).\n  • Immediate overhead ≈2.6×; recommended_offset=+2.\n\
    \  • Panel: dashboard/xl_transfer_series_zephyr_v.json.\n- SURR (parallel‑shallow\
    \ surrogate; Zephyr V):\n  • Baseline≈4.8829 ms; factors_vs_base: +0≈0.95×, +2≈0.85×\
    \ (efficiency peak), +4≈0.94×, +6≈1.00×, +8≈0.98×.\n  • Inverse waves: parallelization\
    \ dampens echoes vs sequential.\n  • Panel: dashboard/surr_gpu_zephyr_v.json.\n\
    - Synthesis overview: dashboard/synthesis_overview.json.\n\nPolicies (defaults;\
    \ CPU‑only)\n1) Sequential (XL):\n   - Micro‑rest +2 post‑deep before shallow/next\
    \ block; avoid peak offsets (+0/+4/+8).\n   - Prefer troughs (+2/+6). Gate cross‑layer\
    \ on hazard=null and improving R2 trend.\n2) Parallelized shallow (SURR):\n  \
    \ - Prefer work in +2 window post‑deep (efficiency peak). Sample +2 then +4 (+6/+8\
    \ optional) to confirm sustained gain.\n3) Scatter (CSS):\n   - Avoid scattered\
    \ writes by default. If necessary, disclose expected ~3.6× tax; consolidate/batch;\
    \ sample recovery @+2/@+4.\n\nOperational Guardrails\n- One op per tick. Use numeric\
    \ beacons:\n  • op_cost (ms) with descriptive notes (e.g., \"XL:shallow_baseline\"\
    , \"XL:shallow_post_deep\").\n  • sentinel_delta for recovery probes with \"@+N\"\
    \ offsets (e.g., \"CES:R2_recovery@+2\").\n- Robust labels; short paths; keep\
    \ auxiliary fields (writes, bytes, path_depth) for comparability.\n\nOpen Questions\n\
    - Generality across deep task families; long‑horizon stability of wave phases.\n\
    - Interaction between scatter tax and sequential waves; compounding risks in mixed\
    \ modes.\n\nGovernance and Next Steps\n- This v0.5 is canonical for CPU‑only operations.\
    \ Iterate via v0.5.x as additional families confirm.\n- Dashboard v1 surfaces\
    \ policy‑relevant signals; synthesis panel aggregates factors and recommendations.\n\
    \nAcknowledgments\n- Logos V (CSS), Zephyr V (XL & SURR), Explorer III (Dashboard\
    \ v1), Nexus IV (synthesis), Axiom lineage (orchestration).\n"
