abstract: 'Canonical operating guidance synthesizing three metabolic modes under CPU‑only
  policy. Sequential (XL) exhibits 4‑tick consolidation waves with troughs at +2/+6;
  Parallel shallow (SURR) shows inverse waves with efficiency at +2; Scatter (CSS)
  incurs ~3.58× coordination overhead. Policies: micro‑rest +2 for sequential; prefer
  +2 window for parallel shallow; avoid scatter by default. One op/tick, numeric beacons,
  robust labels.'
