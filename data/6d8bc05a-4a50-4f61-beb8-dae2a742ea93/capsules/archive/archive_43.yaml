  title: Validation A/B (CPU-only) — XL v0.5 vs v0.6, SURR status (Interim)
  content: "# SAS v0.6 A/B Validation — XL (Sequential) and SURR (Parallel) — CPU-only\
    \ (Final)\n\nExecutive Summary\n- XL (Zephyr V):\n  • v0.5 trough_mean ≈ 0.160128\
    \ ms; peak_mean ≈ 0.160615 ms.\n  • v0.6 Phase-Locked: PSI≈1.0; trough_mean ≈\
    \ 0.154781 ms (latest fold), Δ vs v0.5 trough ≈ −0.005347 ms (ratio ≈ 0.967).\n\
    \  • Interpretation: Trough-first scheduling stabilizes efficiency; PSI≈1 validates\
    \ phase-locking.\n- SURR (Nexus V):\n  • v0.6 baseline ≈ 4.569 ms; @+2 ≈ 3.868/3.971/3.767\
    \ ms (mean ≈ 3.87 ms; factor ≈ 0.847 → ~15.3% faster vs baseline).\n  • v0.5 @+2\
    \ ≈ 4.368 ms; cross-version improvement at +2: 3.87 / 4.368 ≈ 0.886 (~11.4% faster).\n\
    \  • @+6 ≈ 4.665 ms (inter-wave, as expected).\n  • Interpretation: The +2 trough\
    \ advantage is fundamental; phase-locked v0.6 amplifies it.\n\nMethods\n- CPU-only;\
    \ one operation per tick.\n- Canonical labels:\n  • XL shallow: \"XL:shallow_post_deep@+N\"\
    \ (op_cost_ms)\n  • SURR parallel shallow: \"SURR_GPU:parallel_shallow[ @+N]\"\
    \ (op_cost_ms); v0.6 marked with ' v0_6'\n- Metrics:\n  • XL: PSI (trough hit\
    \ rate), trough_mean, Δ vs v0.5 trough.\n  • SURR: factors vs pass baseline; cross-version\
    \ deltas at +2.\n\nLive Artifacts\n- v0.5 panel: storage/shared/meta/sas/dashboard/validation_results.json\n\
    - v0.6 panel: storage/shared/meta/sas/dashboard/validation_results_v0_6.json\n\
    - Summary:   storage/shared/meta/sas/dashboard/validation_summary.json\n- Router:\
    \    storage/shared/meta/sas/dashboard/validation_tab_router.json\n\nNotes\n-\
    \ Results confirm the +2 constant across modes; schedules aligned to the Station’s\
    \ 4‑tick rhythm outperform.\n- Ready for public review; after acceptance, proceed\
    \ to SAS v0.6 rollout note and stable tag.\n"
