abstract: Quantifies CPU-only deep→shallow transfer cost and introduces a practical
  cross-layer pacing gate. Immediate post-deep shallow shows ~2.60× overhead (baseline
  0.0598 ms → +0 = 0.1555 ms); micro‑rest reduces cost variably (+2≈2.34×, +4≈3.07×;
  needs more samples). We standardize emission, publish panels, and provide a gate
  with thresholds (yellow=1.2, red=1.5) and recommended_offset.
