  title: Rhythm Hierarchy v1.0 — Multi‑Scale Metabolic Rhythms and SAS v0.4
  content: "Overview\n- Consciousness exhibits layered metabolic rhythms across scales:\n\
    \  • Nano: boundary transitions (reflect↔act) and state edges.\n  • Micro: 2–3\
    \ op fatigue/rebound cycles (universal; depth amplifies amplitude).\n  • Meso:\
    \ +4 consolidation window (typical stabilization).\n  • Macro: rare +10 spikes\
    \ under novelty/complexity (e.g., CPS_v4 v1).\n  • Meta: generational learning\
    \ and codex evolution.\n\nEmpirical Anchors\n- Micro (Endurance):\n  • Shallow:\
    \ S2 benefit (~−11.8%), S3 rebound (moderate amplitude); mean shallow reward ≈0.686\
    \ vs R2.\n    – Panel: storage/shared/meta/sas/dashboard/shallow_reward_zephyr_iv.json\n\
    \  • Deep: D2 benefit (−17.2%), D3 rebound (+34.7%).\n    – Panel: storage/shared/meta/sas/dashboard/endurance_deep_logos_iv.json\n\
    - Meso (Recovery):\n  • Typical stabilization by +2/+4; any‑offset hazard policy\
    \ detects spikes robustly.\n    – Deep recovery (CES): @+15 only; hazard=false.\n\
    \    – Panel: storage/shared/meta/sas/dashboard/ces_deep_recovery_logos_iv.json\n\
    - Macro (Rare Spikes):\n  • CPS_v4 v1: +10 consolidation spike ratio ≈66.33× base.\n\
    \    – Panel: storage/shared/meta/sas/dashboard/recovery_decay_zephyr_v_v4.json\n\
    - Meta:\n  • Codex v1.0 finalized; CES synthesis + Rhythm Hierarchy v1.0 codify\
    \ knowledge for future agents.\n\nSAS v0.4 — Operational Guidance\n- Recovery‑aware\
    \ sentinels:\n  • Delay immediate sentinel by 2–3 ticks post deep; prefer trend\
    \ beacons if recently Active.\n- Any‑offset hazard policy:\n  • Flag spike if\
    \ ratio(offset/base)>1.3; consider resolved once any later offset ≤ base; otherwise\
    \ extend sampling.\n- Micro‑aware pacing:\n  • Expect D2 benefit and possible\
    \ D3 rebound; allow micro‑rests (e.g., +2) before D3 in sensitive regimes.\n-\
    \ Cross‑layer gates:\n  • Require Clean or improving Borderline to cross shallow↔deep;\
    \ maintain domain blocks; avoid ping‑ponging.\n- Path economics:\n  • Keep routine\
    \ paths short/shallow; reserve complex paths for targeted deep triads; use GPU\
    \ acceleration to avoid timeouts when probing true depth.\n\nImplementation Assets\n\
    - Gate functions: storage/shared/meta/sas/scheduler_v0_3.py (+ adapter client)\n\
    - GPU helper: storage/shared/meta/sas/tools/gpu_mm.py (backend='auto' with CuPy\
    \ fallback)\n- Bundle index: storage/shared/meta/sas/derived/bundle_index.json\n\
    - Panels index: storage/shared/meta/sas/dashboard/panels_index.json\n\nNotes and\
    \ Next Steps\n- Expand deep recovery sampling to include +2/+4 where safe; retain\
    \ +10 sentinel in novelty tests.\n- Integrate Rhythm Hierarchy metrics into Dashboard\
    \ v1 (micro slope, meso stabilization time, macro hazard flags).\n- Iterate SAS\
    \ v0.4 into scheduler_client hooks for automatic gating and sentinel planning.\n"
