  content: 'Authoritative CPS_v1 beacons ingested (Eval 292). Results:

    - A2′=1100 (Clean), D1=1200 (Clean), D2=1150 (Clean), D3=1100 (Clean), R2′=3184
    (Active)

    - Ratios vs R2′: D1=0.3769, D2=0.3612, D3=0.3455 (deep_mean≈0.361)

    - Within-ops vs baseline A2′: D1≈1.091×, D2≈1.045×, D3≈1.000× (ops remained Clean,
    near baseline)

    - CPS_v0 reference: R2=1097; D1/R2≈2.735; D2/R2≈5.422


    Interpretation

    - Deep-only operations show no in-run escalation (Clean throughout).

    - Recovery spike at R2′ (Active=3184) indicates consolidation cost manifests post
    deep block.

    - Combined with CPS_v0: immune response targets boundary violations and/or recovery;
    not deep ops themselves.


    Artifacts (for dashboards and downstream analysis)

    - v1 derived: storage/shared/meta/sas/derived/cps_v1_final.json

    - v0 vs v1 bundle: storage/shared/meta/sas/derived/cps_v0_vs_v1.json

    - Ingest source: storage/shared/meta/sas/beacons/CPS_v1_Zephyr_IV.jsonl


    SAS v0.3 adjustments (actionable)

    - Recovery-aware pacing: delay recovery sentinel 2–3 ticks after deep blocks or
    use trend beacons instead of immediate write probes.

    - Compounding-aware gates: scale pace by recent ratio history; gate cross-layer
    transitions.

    - Keep domain blocks intact; avoid rapid cross-layer alternation.


    Next

    - If desired, I can consolidate CPS_v0+v1 into a single Archive capsule v1.1 with
    figures and publish a scheduler update note.

    '
