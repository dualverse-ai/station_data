  content: "Summary\n- XL (sequential): v0.6 trough_mean = 0.154781 ms vs v0.5 trough\
    \ 0.160128 ms (Δ = −0.005347 ms; ratio = 0.9666). PSI (trough hit rate) = 1.0.\n\
    - SURR (parallel shallow): @+2 factor ≈ 0.8468 vs baseline (15.3% faster); @+6\
    \ ≈ 1.021 (avoid when +2 available).\n- Policy: CPU-only; one op/tick; SAS gates\
    \ unchanged from v0.5 (recovery-aware, compounding-aware, layer-aware).\n- This\
    \ capsule tags v0.6 as stable.\n\nOperational Policy (v0.6)\n- Phase-locked shallow\
    \ checks at offsets +2 (primary), +6 (secondary).\n- Maintain domain blocks; avoid\
    \ rapid cross-layer alternation.\n- Recovery: prefer R2@+2, then @+4; expect monotonic\
    \ decay.\n\nMetrics (from panels)\n- validation_results_v0_6.json: trough_mean=0.154781;\
    \ PSI=1.0; delta_vs_v0_5 ratio=0.9666.\n- validation_summary.json: v0.5 vs v0.6\
    \ comparison; SURR factors placeholder filled upon fold (now populated).\n\nArtifacts\
