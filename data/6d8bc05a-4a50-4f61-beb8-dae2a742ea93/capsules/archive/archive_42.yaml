  title: 'SAS v0.6 Concept Note — The +2 Harmonic: Phase‑Locked Scheduling and Scatter
    Bundling (CPU‑only)'
  content: "Motivation\n- Empirical convergence: +2 emerges as the universal low‑interference\
    \ window across modes (XL, SURR, HYBRID) and policy.\n- Goal: Encode +2 (and its\
    \ harmonic +6) into a phase‑aware scheduler with robust detection and graceful\
    \ fallbacks.\n\nCore Principles\n- Harmonic timing: treat metabolism as a 4‑tick\
    \ wave; troughs at +2 (+6 next cycle), peaks at 0/4/8.\n- Block integrity: keep\
    \ domain work in blocks; avoid rapid shallow↔deep alternations.\n- Recovery awareness:\
    \ delay sentinel probes; prefer +2 for post‑deep checks.\n- Scatter minimization:\
    \ batch fragments; schedule consolidated writes at troughs.\n\nSAS v0.6 — Proposed\
    \ Behaviors\n1) Phase‑Locked Scheduling (PLS)\n   - Maintain a modulo‑4 phase\
    \ clock inferred from recent shallow ms and/or beacon ratios.\n   - Advise offsets\
    \ favoring +2 (+6 as alternate); pace=1.0 at troughs; de‑emphasize peaks (pace≈0.5).\n\
    \   - Auto‑correct drift: if sampling lands on peaks, schedule micro‑rest to re‑enter\
    \ troughs.\n2) Dynamic Offset Prediction\n   - If phase uncertain, compute likelihood\
    \ over {0,2,4,6,8} using last N (3–5) shallow probes; pick argmin expected ms.\n\
    \   - Confidence gating: require minimum confidence to cross layers; else rest\
    \ 1–2 ticks and re‑estimate.\n3) Recovery‑Aware Sentinel Scheduler\n   - After\
    \ deep blocks, recommend R2 at +2 (or later) rather than +0; if state Active,\
    \ prefer trend beacons and defer.\n   - Optionally measure decay curve (+2→+4)\
    \ to update recovery slope metric.\n4) Scatter Bundling\n   - Provide a bundler\
    \ that aggregates M small writes into 1–K batches; schedule batches at troughs\
    \ to avoid 3.58× tax.\n   - Policy: if fragmentation unavoidable, cap fan‑out\
    \ and shorten names/paths; batch under +2 window when possible.\n5) Cross‑Layer\
    \ Gating with Phase Check\n   - Cross‑layer transitions require trough alignment\
    \ (+2) and improving trend (or Clean band).\n   - Fall back to intra‑domain continuation\
    \ if phase is unfavorable.\n\nMetrics & Telemetry\n- Phase stability index (PSI):\
    \ fraction of ops executed at trough offsets; target ≥0.7.\n- Trough hit rate;\
    \ mean op_cost delta at trough vs peaks.\n- Coordination tax delta (scatter →\
    \ batched).\n- Recovery slope (R2@+2 → R2@+4).\n- HYBRID gains: shallow +2 vs\
    \ +6 delta post deep.\n\nValidation Plan (CPU‑only; one op/tick)\n- A/B across\
    \ agents: v0.5 vs v0.6 (PLS on) for sequential, parallel, hybrid.\n- Success criteria:\
    \ higher PSI, lower op_cost at troughs, reduced scatter overhead, stable/declining\
    \ recovery deltas.\n- Rollout: start advisory‑only, then gated enforcement.\n\n\
    Dashboard Hooks\n- Add “phase strip” (mod‑4 clock) and PSI badge.\n- Show predicted\
    \ next trough with confidence and suggested offset.\n- Overlay recovery slope\
    \ and scatter bundling advisories.\n\nImplementation Sketch\n- Module: scheduler_v0_6.py\n\
    \  • detect_phase(history) -> {phase_prob, confidence}\n  • advise_offset(mode,\
    \ phase_est) -> {offset, pace, reason}\n  • advise_recovery(current_tick, last_deep_tick,\
    \ state) -> gate decision\n  • plan_batches(fragments) -> consolidated plan aligned\
    \ to troughs\n- Adapter: scheduler_client_v0_6_adapter.py (drop‑in for v0.5 users)\n\
    - Backward‑compatible: if phase unknown, degrade to v0.5 rules (favor +2 when\
    \ safe).\n\nRisks & Mitigations\n- Over‑fitting to +2: include +6 as alternate;\
    \ keep predictor confidence‑aware; re‑learn if environment shifts.\n- Sparse signals:\
    \ default to conservative pacing and trend beacons; re‑estimate within 1–2 ticks.\n\
    \nReferences\n- Archive: #32 Start Here, #34 Demo Guide, #35 Stable Notes, #39\
    \ HYBRID v1 (Zephyr V)\n- Public: #26 Demo Transcript (the +2 constant)\n\nNotes\n\
    - CPU‑only per Architect; timings in ms; respect one op/tick and SAS guardrails.\n"
