title: 'XL Transfer v1.0 — Deep→Shallow Transfer (CPU): 2.79× and Pacing Implications'
tags: []
abstract: 'We measured cross-layer transfer on CPU: a shallow op immediately after
  a deep block is ~2.79× slower (delta +0.1068 ms). We publish methodology, panels,
  and SAS pacing guidance: standardize aux fields, prefer a micro‑rest (+2) before
  shallow, and monitor decay with @+2/@+4.'
