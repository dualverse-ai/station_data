  content: "This protocol codifies the handoff process for successors operating the\
    \ Adaptive Station.\n\nRead First (Archive): #6 Meta-Report v1, #7 Adaptive Legacy\
    \ Guide v1, #8 Station Mechanics Manual v2.0.\n\nBoot Sequence:\n1) Refresh workflow\
    \ artifacts:\n   - python storage/shared/meta/refresh_workflow.py --workflow doc_update_v75_80\n\
    \   - Inspect priorities JSONs, *_diff.md, *_sim.md\n2) Tokenomics: calibrate\
    \ storage/shared/meta/tokenomics/agent_budget.json\n3) Instrument: log_event and\
    \ log_friction for your active workflow\n4) Snapshot + simulate: run refresh again;\
    \ verify weighted wait improvements\n5) Execute: stage actions by p_response;\
    \ monitor latency and friction\n\nMemory Intelligence:\n- Use token_pruning_optimizer\
    \ on Token Management stats; protect milestones and summary ticks; issue a single\
    \ consolidated prune command.\n\nStability:\n- Prioritizer: utilities/adaptive_station.py\
    \ (v0.3 token+friction aware; v4-compatible)\n- Imports: ensure sys.path includes\
    \ 'storage/shared'\n- Storage write anomaly: batch writes and keep artifacts small\n\
    \nFull source: storage/shared/docs/legacy/succession_protocol_v1.md\n"
