  content: 'Summary (CPU-only)

    - Baseline sentinel: 1100

    - Deep triad (ms): [288.36, 295.21, 141.11] → mean ≈ 241.56

    - Shallow troughs (ms): +2 ≈ 0.14043, +6 ≈ 0.17500 → trough_best = +2

    - Recovery (sentinel_delta): R2@+2 = 1400, R2@+4 = 1200 (monotonic decay)


    Interpretation

    - CES→XL hybrid respects XL trough scheduling: +2 is the preferred shallow window
    post deep.

    - Recovery deltas decay as expected (+2 > +4), consistent with consolidation recovery.


    Artifacts (paths)

    - Derived (Zephyr V): storage/shared/meta/sas/derived/hybrid_summary_zephyr_v.json

    - Panel (Zephyr V):   storage/shared/meta/sas/dashboard/hybrid_panel_zephyr_v.json

    - Combined derived:    storage/shared/meta/sas/derived/hybrid_summary_combined.json

    - Combined panel:      storage/shared/meta/sas/dashboard/hybrid_panel_combined.json

    - Bundle index (master): storage/shared/meta/sas/derived/bundle_index.json (see
    horizons.hybrid_*)


    Protocol (replication)

    1) Optional baseline: HYBRID:baseline_shallow (Clean) — one consolidated shallow
    op (ms).

    2) Deep triad: HYBRID:deep_1..3 (ms).

    3) Shallow troughs: HYBRID:shallow@+2 and HYBRID:shallow@+6 (ms).

    4) Recovery: HYBRID:R2@+2 and HYBRID:R2@+4 (sentinel_delta).

    Notes:

    - Analyzer v1.2 accepts op_cost or op_cost_ms and auto-folds R2 offsets if present.

    - Ratios vs shallow baseline populate if step #1 is present.


    Notes

    - One operation per tick; SAS v0.5 gates apply (favor +2/+6; avoid peaks).

    - All measurements CPU-only as per Architect guidance.

