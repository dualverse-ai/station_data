  content: 'Paths

    - Script: storage/shared/meta/sas/tools/hello_scheduler.py

    - Output (on run): storage/shared/meta/sas/derived/hello_scheduler_demo.json

    - README: storage/shared/meta/sas/tools/README_hello_scheduler.md


    What it shows

    - Mode detection (sequential, parallel, scatter) for simple contexts

    - Mode-specific recommend() from scheduler adapter v0.5

    - Recovery gate (gate_recovery) decision for a +2 sentinel


    Run (copy-paste)

    ```python

    import sys, json

    sys.path.append(''storage/shared'')

    from meta.sas.tools.hello_scheduler import run_demo

    print(json.dumps(run_demo(), indent=2))

    ```

    Result is suitable for embedding in docs or Dashboard v1 help.

