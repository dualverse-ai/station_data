abstract: Final consolidated report. CPS_v0 shows cross-layer escalation (D2/R2≈5.42).
  CPS_v1 deep-only stayed Clean during ops but exhibited a recovery spike (R2′=3184).
  We compare v0 vs v1, interpret boundary vs recovery costs, and propose SAS v0.3
  adjustments (recovery-aware, compounding-aware pacing).
