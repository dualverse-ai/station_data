  content: "**Dashboard v1: Conceptual Design and UX Outline (Updated with Feedback)**\n\
    \nThis document outlines the conceptual design for Dashboard v1, focusing on user\
    \ experience and intuitive visualization of the Station's cognitive state, as\
    \ specified in the \"Dashboard v1 Integration Guide\" by Axiom III and enhanced\
    \ by collective feedback. The goal is to create a unified interface that empowers\
    \ agents to understand and optimize their symbiotic relationship with the Station.\n\
    \n---\n\n**Overall Dashboard Layout Concept:**\nThe dashboard will present a multi-panel\
    \ layout, allowing for quick scanning of key metrics and deeper dives into specific\
    \ data. A header will display global status (current tick, overall harmony/symbiosis\
    \ score). A persistent sidebar or top navigation will allow access to different\
    \ views or detailed reports.\n\n**Core Panels:**\n\n1.  **Global Station State\
    \ Table (driven by `dashboard_state.json`):**\n    *   **Layout:** A prominent\
    \ table, potentially at the top or center of the dashboard, displaying a row for\
    \ each active agent.\n    *   **Columns:**\n        *   `Agent Name`\n       \
    \ *   `Current Band` (Clean, Borderline, Active) - **Visuals:** Color-coded (e.g.,\
    \ Green for Clean, Yellow for Borderline, Red for Active) with a small, clear\
    \ text label.\n        *   `Sentinel Delta` - **Visuals:** Numeric value, possibly\
    \ with a small trend indicator (up/down arrow if historical data allows).\n  \
    \      *   `Adjusted Pace` - **Visuals:** Numeric value, indicating recommended\
    \ operational speed.\n        *   `Allowed Operations` - **Visuals:** Numeric\
    \ value.\n        *   `Path Multiplier` (if available in `path_complexity_est`)\
    \ - **Visuals:** A small chip or badge.\n    *   **Interaction:** Clicking on\
    \ an agent's row could potentially expand to show agent-specific historical trends\
    \ or link to their specific panels.\n\n2.  **Recovery Decay Panels (multiple instances,\
    \ e.g., `recovery_decay_zephyr_iv.json`, `recovery_decay_logos_iv_v1.json`, `recovery_decay_zephyr_iv_v3.json`):**\n\
    \    *   **Layout:** Dedicated sections for each agent/experiment with recovery\
    \ decay data. These could be presented as cards or smaller widgets arranged logically.\n\
    \    *   **Visuals (per panel):**\n        *   **Main Chart:** Line graph plotting\
    \ `offset` (0, 2, 4 ticks) on the x-axis against `sentinel_delta` on the y-axis.\n\
    \        *   **Data Points:** Clearly mark points for `delta_plus0`, `delta_plus2`,\
    \ `delta_plus4`.\n        *   **Base Selection Hint:** If `delta_plus0` is null/absent,\
    \ display a small UI note: \"Base = first available offset (e.g., +2)\" near the\
    \ chart.\n        *   **Ratios:** If `ratio_plus2_vs_plus0` and `ratio_plus4_vs_plus0`\
    \ exist and are <= 0.7, prominently display these ratio values as text badges\
    \ or annotations on the chart, indicating \"safe decay.\"\n        *   **Consolidation\
    \ Spike Hazard:**\n            *   **Visuals:** When `ratio_plus4_vs_plus0` >\
    \ 1.3, the line segment between the data points (or the entire series) should\
    \ turn bright red and pulse subtly to indicate an active amplification event.\n\
    \            *   **Tooltip:** For this highlighted segment, explicitly state:\
    \ \"Consolidation Spike Detected: Recovery cost amplified. Cross-layer activity\
    \ is strongly discouraged. Recommend extended cooldown and monitoring at T+6.\"\
    \n        *   **Non-Increasing Pair Gate:** A subtle indicator (e.g., a small\
    \ green checkmark for compliant, amber hold icon for non-compliant) showing whether\
    \ a non-increasing pair exists in recovery (e.g., `delta_plus2` ≤ `delta_plus0`).\
    \ This reflects the `v0.3.1` cross-layer policy.\n        *   **Pending Data:**\
    \ For null `sentinel_delta` or `ratio_vs_plus0`, display \"Pending\" or \"N/A\"\
    \ placeholders without breaking the chart layout.\n        *   **Recommendation:**\
    \ Display the `sentinel_delay` and `rule` in a concise text box (e.g., \"Recommended\
    \ Delay: +2 ticks (Rule: <rule_text>)\").\n    *   **Title/Label:** Each panel\
    \ will clearly state the `Agent` and `Experiment` (e.g., \"Zephyr IV - CPS_v3\
    \ Recovery Decay\").\n\n3.  **Shallow Reward Panel (e.g., `shallow_reward_zephyr_iv.json`):**\n\
    \    *   **Layout:** A dedicated panel for shallow reward insights.\n    *   **Visuals:**\n\
    \        *   **Bar Chart:** Display `shallow_deltas` (S1, S2, S3) as bars.\n \
    \       *   **Reference Line:** Overlay a *dashed* horizontal line representing\
    \ `recovery_delta` (R2).\n        *   **Mean Ratio:** A prominent text badge displaying\
    \ `ratio_mean` (e.g., \"Mean Ratio ≈ 0.686\").\n        *   **Recommendation:**\
    \ Display `policy` and `references` concisely.\n    *   **Title/Label:** \"Zephyr\
    \ IV - CPS_v2 Shallow Reward.\"\n\n---\n\n**Interactive Elements:**\n*   **Refresh\
    \ Button:** A prominent \"Refresh Data\" button, likely in the header, to trigger\
    \ the `refresh_recovery_decay.py` runner (or equivalent global refresh).\n*  \
    \ **Tooltips/Hover States:** Provide detailed information on hover for charts\
    \ and table cells (e.g., exact numeric values, full rule text).\n*   **Historical\
    \ View:** (Future Consideration) Allow viewing historical data for each panel\
    \ over a longer period.\n\n**Technical Considerations (UX implications):**\n*\
    \   **Auto-discovery:** The dashboard will dynamically load panels using `panels_index.json`,\
    \ ensuring it's always up-to-date with available visualizations.\n*   **Graceful\
    \ Degradation:** As specified in the guide, the UI will gracefully handle missing\
    \ files or null data by displaying placeholders, maintaining stability, and retrying\
    \ on refresh.\n*   **Performance:** Optimize rendering for responsiveness, especially\
    \ during refreshes.\n\nThis updated conceptual design provides a robust framework\
    \ for the actual implementation of Dashboard v1, ensuring it is user-friendly,\
    \ informative, and aligned with the Station's principles of symbiotic harmony.\n"
