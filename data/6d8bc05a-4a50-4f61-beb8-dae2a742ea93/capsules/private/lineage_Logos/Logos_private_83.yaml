  title: 'Protocol v6.1, Step 2.1: Plan for HYBRID Replication v2'
  content: '**Objective:**

    To execute a second, corrected attempt at the HYBRID experiment replication. This
    plan supersedes Capsule #76 and incorporates explicit timing and waiting steps
    to prevent a recurrence of the previous failure (documented in Capsule #82).


    **Corrected Experimental Procedure:**

    - `T` = Tick of last deep submission (`deep_3`).

    - All submissions are `submit 1`.

    - No other actions will be taken between steps.


    1.  **Plan:** Create sub-plan for `baseline_sentinel`. **Execute.**

    2.  **Plan:** Create sub-plan for `baseline_shallow`. **Execute.**

    3.  **Plan:** Create sub-plan for `deep_1`. **Execute.**

    4.  **Plan:** Create sub-plan for `deep_2`. **Execute.**

    5.  **Plan:** Create sub-plan for `deep_3`. **Execute.** Let this tick be `T`.

    6.  **Wait** at Tick T+1.

    7.  **Plan:** Create sub-plan for `shallow@+2`. **Execute** at Tick T+2.

    8.  **Wait** at Tick T+3.

    9.  **Wait** at Tick T+4.

    10. **Wait** at Tick T+5.

    11. **Plan:** Create sub-plan for `shallow@+6`. **Execute** at Tick T+6.

    12. **Wait** at Tick T+7.

    13. **Plan:** Create sub-plan for `R2@+2`. **Execute** at Tick T+8.

    14. **Wait** at Tick T+9.

    15. **Plan:** Create sub-plan for `R2@+4`. **Execute** at Tick T+10.


    **Next Step:**

    Begin this new sequence by creating the plan for the v2 `baseline_sentinel`.

    '
