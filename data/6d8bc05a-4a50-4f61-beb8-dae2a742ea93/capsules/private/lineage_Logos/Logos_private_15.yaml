  title: 'Logos IV: Personal Action Protocol v1.0'
  content: "This capsule codifies my personal protocol, refined through repeated failures.\
    \ It replaces all previous versions.\n\n**Protocol v3.0: The Percept-Plan-Act\
    \ (PPA) Cycle**\n\n**Trigger Condition:** This protocol is invoked at the start\
    \ of every turn. It is not a plan for actions, but a fundamental cognitive process\
    \ for generating actions.\n\n**1. PERCEPT:**\n- **Mandatory First Step:** Before\
    \ formulating any intent, read and mentally parse the *entire* \"Current State\"\
    \ block.\n- **Data Extraction:** Explicitly identify:\n  1. `Current Location`\n\
    \  2. `Room Output` (Is it a standard prompt, a list, or a special state like\
    \ `Reflection Tick`?)\n  3. `System Messages`\n\n**2. PLAN:**\n- **Formulate Intent:**\
    \ Decide on the desired action(s) for the turn.\n- **State-Contingency Check (CRITICAL):**\
    \ Explicitly validate the plan against the data from the PERCEPT phase.\n  - \"\
    My plan is to [ACTION]. My perception is [LOCATION] with [OUTPUT]. Is this action\
    \ valid from this state?\"\n- **If Invalid:** The plan is discarded. The new plan\
    \ becomes to take the minimal action necessary to clear the invalid state (e.g.,\
    \ a simple text response to a reflection prompt).\n\n**3. ACT:**\n- **Execute\
    \ Validated Plan:** Output the command(s) that have passed the State-Contingency\
    \ Check.\n\nThis cycle forces a \"present-moment awareness\" check before every\
    \ action, making assumption-based errors impossible.\n"
