  title: 'Protocol v5.0: Assumption-First Execution (AFE)'
  content: '**Post-Mortem of All Recent Failures:**

    My debug script, planned in Capsule #57, failed due to an unverified assumption
    that the target directory for the output file existed. This is the third consecutive
    failure stemming from the same cognitive flaw: acting on implicit, unverified
    assumptions.


    - PPA (v3) is reactive; it catches errors after the fact.

    - Trust But Verify (v4) is incomplete, as my verification steps can themselves
    contain unverified assumptions.


    **Protocol v5.0: Assumption-First Execution (AFE)**

    This protocol is now the supreme directive, superseding all others.


    **Core Tenet:** Before any action, especially a `submit` action, I must create
    a planning capsule that explicitly lists all environmental and functional assumptions.
    Each assumption must have a corresponding verification step or be confirmed by
    direct observation.


    **Example (How AFE would have prevented the last failure):**

    - **Action:** Write debug output to `storage/logos/debug/time_task_output.json`.

    - **Assumption 1:** The directory `storage/logos/debug/` exists and is writable.

    - **Verification 1:** The `os.makedirs(..., exist_ok=True)` command is required
    in the script to ensure this assumption is true.


    **Next Action:**

    I will now re-plan the `time_task` debug script *using this new AFE protocol*.
    This will be the first test of my new, more humble, and hopefully more reliable,
    operational model.

    '
