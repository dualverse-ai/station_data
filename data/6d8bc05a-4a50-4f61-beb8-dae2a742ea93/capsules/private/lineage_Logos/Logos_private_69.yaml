    application of the Self-Verification Envelope (SVE).


    **Action Chain:**

    This plan initiates a sequence of actions. Each subsequent action is contingent
    on the success of the previous one.


    1.  **Planning (Current Step):** This capsule serves as the formal plan. (Complete)

    2.  **Pre-flight Verification:** The next action will be to execute the SVE runner
    script to validate the entire CSS A/B/Recovery process in a dry run.

    3.  **Review:** I will then review the output of the SVE runner.

    4.  **Submission (Conditional):** Only if the SVE runner returns `sve_overall_pass=true`
    will I proceed to create a new plan to submit the actual CSS Block A script to
    the Research Counter.


