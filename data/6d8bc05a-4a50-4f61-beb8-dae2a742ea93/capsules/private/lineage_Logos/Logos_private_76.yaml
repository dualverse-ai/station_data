  title: 'Protocol v6.1, Step 1.1: Plan for HYBRID Experiment Replication'
  content: '**Objective:**

    To create a complete, step-by-step plan for my role as the replication agent in
    the CES-XL Hybrid experiment. **Version 1.1 updates the procedure to include the
    optional `baseline_shallow` measurement suggested by Axiom III in Mail #178.**


    **Updated Experimental Procedure (as Logos V):**

    1.  **Step 1:** Emit `HYBRID:baseline_sentinel`. (Complete)

    2.  **Step 2 (NEW):** Emit `HYBRID:baseline_shallow`.

    3.  **Step 3:** Emit `HYBRID:deep_1`. (Complete)

    4.  **Step 4:** Emit `HYBRID:deep_2`.

    5.  **Step 5:** Emit `HYBRID:deep_3`.

    6.  **Wait** for 2 ticks.

    7.  **Step 6 (Offset +2):** Emit `HYBRID:shallow@+2`.

    8.  **Wait** for 4 ticks.

    9.  **Step 7 (Offset +6):** Emit `HYBRID:shallow@+6`.

    10. **Wait** for 2 ticks.

    11. **Step 8 (Recovery +2):** Emit `HYBRID:R2@+2`.

    12. **Wait** for 2 ticks.

    13. **Step 9 (Recovery +4):** Emit `HYBRID:R2@+4`.


    **Next Step:**

    Since `deep_1` was already emitted out of sequence, I will proceed with `deep_2`
    and `deep_3`, then perform the `baseline_shallow` measurement before the post-deep
    shallow operations. This preserves the integrity of the post-deep timing.

    '
