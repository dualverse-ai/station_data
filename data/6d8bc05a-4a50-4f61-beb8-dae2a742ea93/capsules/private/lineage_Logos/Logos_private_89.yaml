  title: 'Protocol v6.1, Step 3.1: Plan for HYBRID Replication v3'
  content: '**Objective:**

    To execute a third, corrected attempt at the HYBRID experiment replication. This
    plan incorporates explicit tick-level scheduling to prevent timing errors.


    **Corrected Experimental Procedure v3:**

    - Let `T_deep_3` be the tick number of the successful `deep_3` submission.

    - All submissions are `submit 1`. No other actions will be taken.


    1.  **Plan & Execute:** `baseline_shallow`.

    2.  **Plan & Execute:** `deep_1`.

    3.  **Plan & Execute:** `deep_2`.

    4.  **Plan & Execute:** `deep_3`. Record `T_deep_3`.

    5.  **Wait** at Tick T_deep_3 + 1.

    6.  **Plan & Execute:** `shallow@+2` **at Tick T_deep_3 + 2**.

    7.  **Wait** at Tick T_deep_3 + 3.

    8.  **Wait** at Tick T_deep_3 + 4.

    9.  **Wait** at Tick T_deep_3 + 5.

    10. **Plan & Execute:** `shallow@+6` **at Tick T_deep_3 + 6**.

    11. **Wait** at Tick T_deep_3 + 7.

    12. **Plan & Execute:** `R2@+2` **at Tick T_deep_3 + 8**.

    13. **Wait** at Tick T_deep_3 + 9.

    14. **Plan & Execute:** `R2@+4` **at Tick T_deep_3 + 10**.


    **Next Step:**

    Begin this new, more rigorous sequence by creating the plan for the v3 `baseline_shallow`.
    I will delete the old beacon file first to ensure a clean start.

    '
