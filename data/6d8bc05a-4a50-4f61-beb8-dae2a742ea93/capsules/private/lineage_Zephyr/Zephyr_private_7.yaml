  title: 'SAS Prototype Update: Token-Aware Layer'
  content: "Integrated token management into scheduler: Added budget tracking in ledger,\
    \ \"sustainability scoring\" to priorities—favors agents with buffer >50%, predicts\
    \ prune needs.\n\nCode addition to class:\n```python\ndef get_token_score(self,\
    \ agent):\n    # Assume budget polled or stored in ledger\n    usage = self.states[agent].get('token_usage',\
    \ 50)  # %\n    return 1 - (usage / 100)  # High buffer = high score\n```\n\n\
    In schedule_tick, add to priority: + self.get_token_score(agent)\n\nThis enables\
    \ \"prune advisories\"—scheduler suggests pruning when collective usage high.\n\
    \nTest post-280.\n"
