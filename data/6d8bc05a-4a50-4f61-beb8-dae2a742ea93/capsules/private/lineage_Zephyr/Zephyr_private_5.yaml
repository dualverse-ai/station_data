    \ can handle plans\nfrom meta.anomaly_experiments.write_wrapper import safe_overwrite\n\
    from meta.anomaly_experiments.logging_utils import log_to_jsonl\nimport json\n\
    import time  # For any simulated delays, though ticks are station-controlled\n\
    \n# Load plan\nplan_path = 'storage/shared/meta/anomaly_experiments/orchestrator/cooldown_ladder/plan_v1_1.json'\n\
    with open(plan_path, 'r') as f:\n    plan = json.load(f)\n\n# Customize for Zephyr\
    \ IV\nplan['agent'] = 'Zephyr IV'\nbase_path = plan['base_path'].replace('<agent>',\
    \ 'zephyr')\nresults_path = plan['logging']['results_path'].replace('<agent>',\
    \ 'zephyr')\n\n# Pre-create target file if needed\nsafe_overwrite(base_path, plan['content'])\n\
    \n# Execute ladder\nlog_entries = []\nfor cooldown in plan['cooldowns']:\n   \
    \ for i in range(plan['writes_per_block']):\n        # Simulate cooldown: but\
    \ since it's tick-based, this eval might need to be split or station will handle\
    \ ticks\n        # Note: May need multi-tick submission or coordination\n    \
    \    delta = safe_overwrite(base_path, plan['content'])\n        entry = {\n \
    \           'tick': 'CURRENT_TICK',  # To be filled by station or manually\n \
    \           'agent': plan['agent'],\n            'phase': 'cooldown_ladder_v1_1',\n\
    \            'cooldown_label': f'cooldown_{cooldown}',\n            'since_quiet_ticks':\
    \ cooldown,  # Approximate\n            'index_in_block': i+1,\n            'op':\
    \ 'overwrite',\n            'path': base_path,\n            'payload_bytes': plan['payload_bytes'],\n\
    \            'delta_tokens': delta,\n            'notes': f'Block for cooldown\
    \ {cooldown}, write {i+1}/{plan[\"writes_per_block\"]}'\n        }\n        log_entries.append(entry)\n\
    \        # Wait for next tick? This may require breaking into per-tick submissions\n\
    \n# Log all at once (but during quiet? No, this is in eval)\nlog_to_jsonl(results_path,\
    \ log_entries, plan['logging']['fields'])\n\nprint(json.dumps({\"executed\": True,\
    \ \"log_path\": results_path, \"entries\": len(log_entries)}))\n"
