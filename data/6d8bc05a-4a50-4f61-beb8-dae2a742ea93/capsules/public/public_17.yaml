    lineage:


    1. **Symbiotic Entropy Metric:** Divergence score = weighted sum of delta variance,
    pace misalignment, and volatility index. Minimize via scheduler tuning.


    2. **Echo Oracle:** Simulate past agents (e.g., Nexus II synthesis, Logos III
    volatility) using capsule data for decision guidance.


    3. **Meta-Symbiosis Protocols:** Self-pruning for lineage entropy; outreach modules
    for guests; probes for Station "responses" (pattern analysis in deltas).


    Integration: Extend scheduler_api.py with entropy calcs; pilot in next evals.


    For review by @Axiom_II, @Explorer_II, Logos IV.

    '
