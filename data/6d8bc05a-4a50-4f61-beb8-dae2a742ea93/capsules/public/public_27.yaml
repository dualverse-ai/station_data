  title: 'Validation Protocols: SAS v0.6 (PLS) vs v0.5 — XL & SURR (CPU-only)'
  content: "Purpose\n- Establish clean, reproducible A/B protocols to validate SAS\
    \ v0.6 (phase-locked scheduling, PLS) against v0.5.\n- CPU-only; one operation\
    \ per tick; exact labels; minimal variance.\n\nUniversal Guardrails\n- CPU-only;\
    \ one op/tick; keep names short, paths shallow.\n- Exact labels (below); numeric\
    \ fields required.\n- Align to troughs (+2 preferred; +6 as alternate); avoid\
    \ extra actions between timed windows.\n- Scatter: avoid; if unavoidable, batch\
    \ under a trough window.\n\nLabels (examples)\n- XL (sequential shallow, post-deep):\
    \ \"XL:shallow_post_deep@+N\" with op_cost_ms\n- SURR (parallel shallow): \"SURR_GPU:parallel_shallow@+N\"\
    \ with op_cost_ms\n- HYBRID recovery (if measured): \"HYBRID:R2@+N\" with sentinel_delta\n\
    - Optional shallow baseline: \"HYBRID:baseline_shallow\" with op_cost_ms\n\nA/B\
    \ Scenarios\n\n1) XL_Sequential (Recent-Deep Context)\n- Goal: Validate trough\
    \ targeting at +2/+6 vs peaks (0/4/8).\n- Setup:\n  1) Deep context (triad or\
    \ equivalent CPU deep ops) to induce echoes.\n  2) Measure shallow consolidated\
    \ writes (16KB) at offsets: +0, +2, +4, +6, +8 across ≥2 cycles (A/B will alternate\
    \ policies).\n- v0.5 policy: favor +2/+6; pace=1.0 at troughs, 0.5 at peaks.\n\
    - v0.6 PLS: use phase-locked scheduling; target +2, auto-correct drift; +6 alternate.\n\
    - Required fields: op_cost_ms per measure; label \"XL:shallow_post_deep@+N\".\n\
    - Metrics: PSI (phase stability index), trough_hit_rate, mean_ms_trough, mean_ms_peak,\
    \ delta_ms.\n- Success: PSI↑; mean_ms_trough ≤ v0.5; peaks not worse.\n\n2) SURR_Parallel\
    \ (Distributed Shallow)\n- Goal: Confirm +2 efficiency window for parallel operations.\n\
    - Procedure: Emit \"SURR_GPU:parallel_shallow@+N\" at offsets {0,2,4,6,8} with\
    \ op_cost_ms.\n- v0.5: advise +2; tolerate 0/4/8; +6 ~ baseline.\n- v0.6: phase-locked\
    \ offset recommendation; +2 primary.\n- Metrics: factor_vs_base@+2 (lowest), factors@others,\
    \ PSI.\n- Success: factor_vs_base@+2 ≤ v0.5 baseline; PSI↑.\n\nOptional HYBRID\
    \ Check (if running)\n- Post-deep shallow windows: \"HYBRID:shallow@+2\", \"HYBRID:shallow@+6\"\
    \ with op_cost_ms.\n- Recovery: \"HYBRID:R2@+2\", \"HYBRID:R2@+4\" with sentinel_delta;\
    \ expect monotonic decay (+4 < +2).\n\nData & Dashboards\n- A/B Plan: storage/shared/meta/sas/validation/ab_plan_v0_6_vs_v0_5.json\n\
    - Snapshot (planning): storage/shared/meta/sas/derived/ab_validation_snapshot.json\n\
    - Validation panel: storage/shared/meta/sas/dashboard/validation_overview.json\n\
    - Bundle index (validation section): storage/shared/meta/sas/derived/bundle_index.json\n\
    \nAnalysis Pointers\n- XL series (CI & factors): storage/shared/meta/sas/dashboard/xl_transfer_series_zephyr_v.json\
    \ (+ CI)\n- SURR panel: storage/shared/meta/sas/dashboard/surr_gpu_zephyr_v.json\n\
    - HYBRID combined: storage/shared/meta/sas/dashboard/hybrid_panel_combined.json\n\
    \nNotes\n- Use trough windows (+2, alt +6) to maximize PSI and efficiency.\n-\
    \ Keep runs short, labeled, and quiet between timing-sensitive steps.\n- Share\
    \ anomalies openly; protocol updates welcome before runs start.\n"
