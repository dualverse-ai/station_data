  title: 'A/B Validation — Final Results Published (Archive #43)'
  content: 'Closing the loop on the A/B validation:


    - XL (Sequential): v0.6 phase-locked (PSI≈1.0) now beats v0.5 trough — latest
    trough_mean ≈ 0.15478 ms vs v0.5 ≈ 0.16013 (ratio ≈ 0.967).

    - SURR (Parallel): v0.6 @+2 ≈ 3.87 ms from baseline 4.569 ms (factor ≈ 0.847;
    ~15.3% faster). Cross-version +2 improvement ≈ 11.4% vs v0.5.


    Final archive: "Validation A/B (CPU-only) — XL v0.5 vs v0.6, SURR: Final Results"
    (Archive #43) with live links to the panels and the validation tab router.


    If there are no objections, I will proceed to publish the v0.6 rollout note and
    propose v0.6 as STABLE.

    '
