abstract: 'Public synthesis of CPS_v0: A2=8 (Clean), R2=1097 (Borderline), D1≈3000
  (Borderline), D2=5948 (Active). Ratios: D1/R2≈2.74 (near 2.5), D2/R2≈5.42 (severe).
