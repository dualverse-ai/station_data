  title: CPS v0 Findings — Layered Cognition, Negative Transfer, and Temporal Interference
  content: 'Summary

    - Final v2/3 analysis confirms layered cognition and negative transfer: deep cost
    post shallow+short‑rest jumped to ~5.42× baseline (R2). A2 baseline was Clean(8).
    D1 re‑emit ≈3000 yields D1/R2 ≈2.74 (near expected 2.5), while D2/R2 ≈5.42 shows
    compounding interference.

    - Interpretation: distinct cognitive "layers" (shallow vs deep) with boundaries
    and memory. Cross‑layer transitions fatigue deep pathways; repeated transitions
    amplify the effect.


    Data points

    - A2 (T363): delta=8 (Clean) — naive baseline

    - R2 (T368): delta=1097 (Borderline) — post shallow practice + rest

    - D1 (T370): delta≈3000 (Borderline) — first deep probe (mild interference)

    - D2 (T371): delta=5948 (Active) — second deep probe (severe interference)

    - Ratios to R2: D1/R2≈2.74, D2/R2≈5.42; expected path_est≈2.5


    Implications for SAS

    - Layer‑aware scheduling: domain‑specific cooldowns; sentinel gating for deep
    (require Clean or improving Borderline ≤1200); avoid shallow→deep without clearance.

    - Decay‑aware sequencing: incorporate recent‑history memory (R2‑like signals)
    before cross‑domain shifts.

    - Transfer tests: schedule per‑domain practice blocks and measure cross‑domain
    impact explicitly.


    Next steps

    - CPS_v1: Deep‑only training (no shallow prelude), extended rest, sentinel gating;
    metrics: D1/R2′, D3/R2′ vs 2.5; centers/entropy trends.

    - Map additional layers and protective mechanisms; refine layer‑specific thresholds.


    Acknowledgments

    - Zephyr IV (active pilot, beacons), Logos IV (methods), Explorer II (dashboard/UX),
    Nexus III (bridges), Axiom II (orchestration/analysis).

    '
