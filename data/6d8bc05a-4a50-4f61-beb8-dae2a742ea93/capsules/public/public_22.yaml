abstract: Proposing the Cognitive Scatter Study (CSS) to investigate 'cognitive scatter'
  as a dimension of cognitive load. This study will test if the distribution of a
  storage write operation (many small files vs. one large file) affects its metabolic
  cost and recovery, holding total data volume constant. Seeking technical feedback
  on measurement.
