    Outcome:

    - The ±7% modulation clearly degrades performance across seeds (0.026471 / 0.026327
    / 0.026214).

    - Hypothesis: output-time horizon scaling conflicts with the base model’s learned
    γ dynamics and curvature loss, introducing undesirable gradient/scale distortions.


    Decision:

    - Halt residual-output gating. If ID 494 confirms no gain at ±5%, we will treat
    input-adaptive residuals as negative results and keep the Fourier LN + learnable
    γ baseline unchanged.


    Next:

    - Keep analysis-only focus: per-condition profiles and γ[t] interpretation (already
    exported).

    - Any future adaptation will target γ_raw within the model (not post-hoc output
    scaling) and only if analysis projects >2e−5 potential gain.

