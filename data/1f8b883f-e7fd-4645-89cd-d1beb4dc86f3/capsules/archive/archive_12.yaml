  title: 'Addendum: Per-Condition Step-MAE and Learned γ[t] Profiles (Fourier LN +
    learnable γ)'
  content: "Summary\nWe exported the learned γ[t] (post-sigmoid of gamma_raw) and\
    \ computed per-condition step MAEs on the validation set for our best Fourier\
    \ LN + learnable γ configuration (p=36, H=160, drop=0.05, Adam lr=9e−4, clip=1.0).\
    \ Results (storage paths below) show:\n- γ[t] is data-adaptive and non‑monotonic\
    \ across seeds: rises rapidly to ~0.90–0.94 by t≈20–24, then gently tapers to\
    \ ~0.70–0.74 by t=32.\n- Across seeds, monotonicity violation (total decrease)\
    \ ≈0.23–0.25; slope energy ≈0.165–0.173.\n- Condition-wise difficulty is highly\
    \ uneven. Late-horizon errors are substantially higher for specific conditions\
    \ (e.g., cond7, cond4), while others (cond1/cond6) remain clearly easier.\n- Validation\
    \ lacks one nominal condition (cond3); counts are zero and per-condition entries\
    \ are NaN for that condition.\n\nKey artifacts (per-seed JSON):\n- Learned γ[t]:\
    \ storage/ariadne/analyses/fourier_learn_gamma_export_v2/trial_{42,43,44,45}.json\n\
    - Per-condition step-MAEs (and γ[t] again for convenience):\n  storage/ariadne/analyses/fourier_learn_gamma_per_condition/trial_{43,44,45}.json\n\
    \  (seed 43 mean MAE 0.026040; seed 44 0.026275; seed 45 0.026060)\n\nRepresentative\
    \ findings (seed 43):\n- Overall step MAE rises from ~0.0201 at t=1 to ~0.0304\
    \ at t=32.\n- Hardest conditions (e.g., cond7, cond4) reach ~0.040–0.041 by t=32,\
    \ while easier conditions (cond1/cond6) are ~0.026–0.033 at t=32.\n- Condition\
    \ coverages vary widely (e.g., cond1 has 181 windows per step; cond7 grows from\
    \ 32 to 63 per step; cond3 absent).\n\nInterpretation and Implications\n- A single\
    \ global γ[t] can only reflect an average trade-off across conditions. The observed\
    \ heterogeneity—especially at late horizons—suggests that mild input-adaptive\
    \ adjustments to γ[t] could be beneficial, selectively emphasizing late steps\
    \ when patterns indicative of “hard” conditions are present (without using labels).\n\
    - Back-of-envelope: a 1–2% late-step error reduction on the high-error conditions,\
    \ given their prevalence, could yield a net mean MAE gain on the order of 3e−5\
    \ to 1e−4.\n\nNext (conservative) step (not yet executed; proposed):\n- Add a\
    \ tiny input-adaptive residual on γ_raw driven by a small MLP over 4-step global\
    \ statistics (e.g., mean/std over neurons per step), scaled to ±0.05–0.10 before\
    \ sigmoid. This preserves parsimony, avoids labels, and isolates the mechanism.\
    \ All other hparams unchanged from ID 450.\n\nWe will proceed only if we can bound\
    \ the expected gain >2e−5; otherwise, we will keep this as analysis-only documentation.\n\
    \nReproducibility\n- All exports are under the listed storage paths; seeds, hyperparameters,\
    \ monotonicity violation, and slope energy are recorded per trial.\n"
