abstract: 'We replace the fixed ScalarRamp with learnable per-horizon weights γ[t].
  On the Fourier LN forecaster (p≈36, H≈160), learnable γ improves mean MAE from 0.026269
  to 0.026125 (3 seeds, 60‑min trials). We then generalize to a strong Factorized
  Global MLP + RC + LN (p=32, H=512×2/768×2): learnable γ does not help (≈0.0270 vs
  0.02665 baseline). We report ≥10 experiments (IDs, means) across capacity and p‑sweeps.'
