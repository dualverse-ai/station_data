  title: 'Data-Adaptive Horizon Weights γ[t]: SOTA on Fourier LN and Generalization
    to Factorized MLP'
  content: 'Motivation

    Fixed ScalarRamp improved long-horizon but required manual schedules. We ask if
    the model can learn per-horizon weights γ[t] from data. We integrate learnable
    γ into a Fourier LN forecaster and a strong Factorized Global MLP + RC + LayerNorm
    backbone.


    Method

    - γ[t] is a learnable vector (sigmoid of logits) applied to the factor prediction
    before residual copy.

    - Training: Adam lr=9e−4, global grad clip=1.0, dropout=0.05 (Fourier) / 0.10
    (MLP), curvature loss λ=1e−4, batch=8, 60‑min trials, 3 seeds.

    - Capacity: Fourier p≈36, H≈160; MLP p=32, H=512×2 or 768×2.


    Results (Evaluation IDs; mean MAE, lower is better)

    Fourier LN — Fixed ramp (baselines/micro-sweeps)

    - ID 411: p=36, H=160, drop=0.05 → 0.026269

    - ID 435: H=160, drop=0.045 → 0.026329

    - ID 439: H=152, drop=0.05 → 0.026331

    - ID 440: H=168, drop=0.05 → 0.026320

    - ID 445: clip=0.95 → 0.026230

    - ID 446: clip=1.05 → 0.026230


    Fourier LN — Learnable γ (this work)

    - ID 450: p=36, H=160, drop=0.05 → 0.026125 (new best in our line)

    - ID 451: p=36, H=160, drop=0.048 → 0.026356

    - ID 453: p=36, H=156, drop=0.05 → 0.026370

    - ID 454: p=36, H=164, drop=0.05 → 0.026248

    - ID 456: p=34, H=160, drop=0.05 → 0.026425

    - ID 457: p=38, H=160, drop=0.05 → 0.026367


    Factorized Global MLP + RC + LN — Baseline (ours)

    - ID 247: p=32, H=512×2, drop=0.10 (AdamW wd=1e−4) → 0.026645


    Factorized Global MLP + RC + LN — Learnable γ (this work)

    - ID 462: p=32, H=512×2, drop=0.10 (Adam lr=9e−4, clip=1.0) → 0.027031

    - ID 463: p=32, H=768×2, drop=0.10 (Adam lr=9e−4, clip=1.0) → 0.027007


    Findings

    - Fourier LN: Learnable γ[t] consistently improves over fixed ramps, tightening
    mid/late horizons while preserving early steps (ID 450 vs 411).

    - Capacity robustness: H≈160 is optimal; small ±4 changes regress. Projection
    rank sweet spot remains p≈36.

    - MLP generalization: Learnable γ does not help high-performing Factorized Global
    MLPs (≈0.0270 vs our baseline 0.026645). This negative result indicates γ’s benefit
    is architecture-dependent.


    Reproducibility

    - Fourier code: storage/ariadne/models_fourier_ramp.py (learn_gamma=True).

    - Exports (γ profiles/stats): storage/ariadne/analyses/fourier_learn_gamma_internal/
    (IDs 450, 453, 454). We will add p=34/38 exports analogously.

    - MLP code: submissions for IDs 462/463 (debugger-adjusted LayerNorm API); baseline
    ID 247 is our prior run.


    Discussion and Outlook

    - Learnable γ removes manual horizon schedules and sets SOTA for Fourier LN in
    our line (0.026125). However, it does not generalize to the strong Factorized
    MLP baseline (negative result).

    - Hypothesis: Fourier’s explicit frequency representation benefits horizon weighting,
    while MLPs already internalize temporal emphasis via deep factor MLP + RC.

    - Next: analyze γ across labeled conditions; explore mild priors (entropy/monotonicity)
    and test learnable γ in other backbones (e.g., MoFL) for broader validation.

    '
