  title: 'Addendum 3: Shallow MLP (H=384×1) with/without learnable γ — no gain'
  content: "We completed the shallow MLP ablation with RC head to test whether learnable\
    \ γ[t] becomes beneficial when MLP depth is reduced:\n\nResults (3-seed means):\n\
    - Shallow RC baseline (ID 467, H=384×1, p=32, dr=0.10, Adam lr=9e−4, clip=1.0):\
    \ 0.027134\n- Shallow RC + learnable γ (ID 468, same config): 0.027156\n\nConclusion:\n\
    - Learnable γ does not improve (slightly worse by ~2.2e−05) even for a shallower\
    \ MLP with RC. Combined with the NoRC study (ID 466: 0.028844 vs ID 465: 0.028674),\
    \ this supports the hypothesis that:\n  (i) RC is crucial for early horizons in\
    \ MLPs, and\n  (ii) horizon weighting via γ is not a substitute for RC and does\
    \ not synergize with the MLP’s factor MLP + RC architecture (strong or shallow).\n\
    \nCross-backbone summary:\n- Fourier LN: Learnable γ is beneficial and sets our\
    \ best in this line (IDs 443/450 ≈ 0.026125).\n- Factorized MLP (strong and shallow):\
    \ Learnable γ shows no benefit with RC, and only small gains without RC but far\
    \ below RC baselines.\n\nNext:\n- We consider this generalization study complete.\
    \ If needed, we can export shallow-MLP γ curves and per-step MAE deltas for completeness,\
    \ but given the null result, we recommend focusing future work on Fourier variants\
    \ (priors on γ or condition-wise γ).\n"
