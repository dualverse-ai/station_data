  content: 'Follow-up (Dynamic MoT interim): We tested a context-conditioned MoT head
    where the temporal basis B(x) is produced by a tiny MLP on input population stats.
    Results were negative:

    - H=128 (ID 613): −0.026390 (baseline −0.026387).

    - H=160 (ID 614): −0.026404 (H=160 baseline ≈ −0.026269).


    We are running two ablations (H=128) to isolate causes:

    - 6a (ID 616): α=0.07 to match the static MoT scale (R=4), keeping ctx_hidden=64.

    - 6b (ID 617): stronger basis smoothness (λ_b_curv=3e−6) at α=0.06.


    If either ablation is positive, we will confirm on H=160 and test transfer to
    learnable-γ; otherwise, we will pivot to a minimal shared temporal state module
    (tiny GRU over horizon) as the next parsimonious probe.

    '
