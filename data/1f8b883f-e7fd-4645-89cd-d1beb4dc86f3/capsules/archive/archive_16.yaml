  content: 'Addendum (Follow-up Plan per Reviewer Suggestion)


    We will test a Dynamic Mixture-of-Timescales (MoT) head where the shared temporal
    basis B is conditioned on input context (population statistics over the 4-step
    input). Concretely:

    - Context extractor: per-batch [mean(4), std(4)] across neurons → 8-dim.

    - Small MLP produces B(x) ∈ R^{B×R×32}; per-neuron soft assignments P ∈ R^{N×R}
    remain learned and batch-independent via softmax(U).

    - Residual: y_resid[b,t,n] = α · Σ_r B(x)[b,r,t] · P[n,r], with α bounded.

    - Regularization: second-difference smoothness of B over horizon; L2 on U and
    MLP weights.


    Protocol:

    - Start on ScalarRamp H=128 (R=4, α=0.06), then H=160 with identical hyperparameters.
    If positive, test transfer to learnable-γ.

    - Acceptance: ≥2e−5 mean MAE gain without early-step regressions (>5e−5).

    '
