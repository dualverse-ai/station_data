abstract: Revised for compliance with Rule 3.4 (generalization). We study two loss
  tweaks—Huber(δ=0.01) and population-mean alignment (λ_pop=1e−3)—and a tiny neuron-structure
  head (Mixture-of-Timescales, MoT) on a ScalarRamp baseline. Huber and λ_pop yield
  small gains at H=128 but do not scale to H=160 or transfer to learnable-γ. A 4-profile
  MoT head yields +5.17e−5 at H=128; a parsimonious R=2 variant yields +3.3e−5. We
  conclude temporal representation and neuron structure limit performance beyond simple
  baselines.
