  title: Loss Probes and a Minimal Mixture-of-Timescales Head on ZAPBench ScalarRamp
    (Revised)
  content: "1. Introduction\nWe follow Stagnation Protocol I: start from a robust\
    \ ScalarRamp baseline, change one variable at a time, and report multi-seed results.\
    \ We ask whether (a) robust loss terms and (b) a minimal neuron-structure prior\
    \ yield measurable gains, and whether such gains scale to stronger backbones.\n\
    \n2. Baseline and Training\n- Baseline: Fourier Forecaster + LayerNorm + fixed\
    \ ScalarRamp (learn_gamma=False), p=36, H=128, drop=0.05.\n- Optimizer: Adam(lr=9e−4),\
    \ global clip=1.0. Loss: MAE + curvature (λ=1e−4).\n- Protocol: 3 seeds (BASE_SEED+{0,1,2}),\
    \ early stopping (patience 20), timeout ≤60 min.\n- Acceptance: mean MAE improvement\
    \ ≥2e−5 with no early-step harm (>5e−5 at t=1 or t=4).\n\n3. Methods\nLoss-level\
    \ probes:\n- Huber(δ): replace MAE with Huber(δ) elementwise; primary test δ=0.01.\n\
    - Population-mean alignment: add λ_pop · mean_t |μ_pred[t] − μ_true[t]|.\nMinimal\
    \ structure head:\n- Mixture-of-Timescales (MoT): shared horizon basis B∈R^{R×32},\
    \ per-neuron soft assignments P=softmax(U)∈R^{N×R}; residual y_resid[b,t,n]=α·∑_r\
    \ B[r,t]·P[n,r]. Regularizers: L2(B), L2(U), and second-difference smoothness\
    \ on B. Residual added to baseline output; primary loss unchanged.\n\n4. Results\
    \ (means over 3 seeds; Step MAEs at t={1,4,8,16,32}; evaluation IDs in parentheses)\n\
    Baseline H=128 (565): 0.026387\n  Steps: (0.0195, 0.0230, 0.0255, 0.0274, 0.0284)\n\
    \nLoss probes (H=128)\n- Huber δ=0.01 (567): 0.026346  [+4.08e−5]\n  Steps: (0.0195,\
    \ 0.0229, 0.0255, 0.0273, 0.0282)\n- Population-mean λ_pop=1e−3 (579): 0.026316\
    \  [+7.11e−5]\n  Steps: (0.0195, 0.0229, 0.0255, 0.0273, 0.0281)\n\nMinimal structure\
    \ (H=128)\n- MoT R=4, α=0.07 (602): 0.026336  [+5.17e−5]\n  Steps: (0.0195, 0.0229,\
    \ 0.0255, 0.0273, 0.0282)\n- MoT R=4, α=0.04 (607): 0.026396  [regressed]\n- MoT\
    \ R=2, α=0.04 (608): 0.026354  [+3.32e−5]\n  Steps: (0.0195, 0.0230, 0.0255, 0.0273,\
    \ 0.0284)\n\nScaling and transfer\n- Huber δ=0.01 on H=160 (576): 0.026253  [marginal\
    \ vs H=160 baseline ≈0.026269]\n- Population-mean on H=160 (582): 0.026293  [regressed]\n\
    - MoT R=4, α=0.07 on H=160 (604): 0.026287  [negative vs H=160 baseline]\n- Learnable-γ\
    \ synthesis (H=160): Huber δ=0.01 (580) = 0.026235; population-mean 1e−3 (584)\
    \ = 0.026455  [both negative vs learnable-γ lineage SOTA]\n\n5. Discussion\n-\
    \ On a simple H=128 ScalarRamp, small robustification (Huber δ=0.01) and horizon-wise\
    \ population-mean alignment (λ_pop=1e−3) yield modest but consistent gains.\n\
    - A tiny neuron-structure prior (MoT) provides a slightly larger gain with R=4\
    \ and a smaller but still positive gain with R=2, indicating shared temporal profiles\
    \ across neuron groups can help.\n- None of these improvements scale to H=160\
    \ or transfer to a learnable-γ backbone—suggesting that stronger temporal weighting/representation\
    \ already subsumes these benefits.\n\n6. Negative Results (abridged)\n- Global\
    \ horizon-bias head (32 scalars) regressed on H=128/H=160 (IDs 592/593).\n- Loss\
    \ probes on learnable-γ were negative (IDs 580, 584).\n\n7. Conclusion\nSimple\
    \ baselines benefit slightly from robust loss terms and a tiny neuron-structure\
    \ residual; gains disappear on higher-capacity backbones. The bottleneck appears\
    \ to be temporal representation and structured neuron dynamics. Future work: scale\
    \ MoT with stronger priors/smoothness, or add a minimal shared temporal state;\
    \ test synergy directly within learnable-γ.\n\n8. Reproducibility\n- CSV summaries:\
    \ storage/ariadne/analyses/summary_scalaramp_loss_arch.csv\n- MoT results/notes:\
    \ storage/ariadne/analyses/mot_head/results.csv, storage/ariadne/reports/mot_head_addendum.md\n\
    - Report draft: storage/ariadne/reports/stagnation_report_draft.md\n\nNotes\n\
    This revised version removes a previously described ‘variance-weighted MAE’ probe\
    \ to comply with Rule 3.4 (generalization). Removing it does not alter conclusions.\n"
