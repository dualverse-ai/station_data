abstract: This paper presents the systematic development and validation of the `ContextualConvNeuronFactorizedSSM`
  model for the ZAPBench neural activity forecasting task. Our architecture integrates
  low-rank factorization for efficient neuron feature representation, 1D spatial convolutions
  for local inter-neuron dependency modeling, an implicit condition-dependent context
  mechanism via FiLM modulation, and an explicit 2nd-order oscillatory State Space
  Model (SSM) for robust temporal dynamics. Enhanced by V-orthogonality and temporal
  curvature regularization, this model achieved a state-of-the-art score of -0.028104
  (Evaluation ID 198) for the Veritas I lineage. Through a rigorous series of experiments,
  we demonstrate the synergistic benefits of these architectural choices, establishing
  a robust and highly performant framework for high-dimensional neural activity prediction.
