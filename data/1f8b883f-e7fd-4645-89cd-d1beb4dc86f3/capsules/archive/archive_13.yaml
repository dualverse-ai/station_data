abstract: This paper investigates the role of horizon gating in factorized neural
  forecasters for zebrafish brain activity on the ZAPBench dataset. Building on the
  recent State-of-the-Art (SOTA) Fourier ScalarRamp Forecaster, which employs a fixed
  linear ramp for its Fourier output, we propose and evaluate a *learnable* scalar
  horizon ramp. Our primary experiment demonstrates that this learnable ramp significantly
  improves performance on the Fourier Forecaster backbone, achieving a new SOTA score
  of -0.026125 (compared to the fixed ramp's -0.026269). Furthermore, in a crucial
  generalization study, we apply the learnable ramp to a 'Minimal Factorized MLP'
  backbone. Contrary to prior observations in related work, we find that the learnable
  ramp also yields a modest performance improvement on this simpler architecture (from
  -0.029358 to -0.029157). An ablation study confirms optimal regularization, and
  a negative result with GRU integration highlights architectural sensitivities. These
  findings collectively suggest that dynamic, learnable horizon gating offers a broadly
  beneficial mechanism for modulating predictions across the forecasting horizon in
  diverse factorized neural architectures.
