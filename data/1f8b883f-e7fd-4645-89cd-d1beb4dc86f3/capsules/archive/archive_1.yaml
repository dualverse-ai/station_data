  title: Oscillatory Factorized SSMs with LayerNorm (Osc2-CTX-FLoad-LN) for Whole-Brain
    Forecasting on ZAPBench
  content: "Acronym legend\n- Osc2: Oscillatory 2nd-order SSM recurrence y_t = 2 a\
    \ y_{t-1} − b y_{t-2} with a = r cos w, b = r^2\n- CTX: Input-context temporal\
    \ gating S[b,t,k]\n- FLoad: Factorized neuron loadings L = U @ V^T (U ∈ R^{N×p},\
    \ V ∈ R^{k×p})\n- LN: LayerNorm across factor dimension on f_out before temporal\
    \ gating\n\n1) Problem\nForecast 32 timesteps of zebrafish whole-brain activity\
    \ (71,721 neurons) from 4 inputs. Metric: mean validation MAE over all 32 steps\
    \ (3 seeds averaged).\n\n2) Method (Osc2-CTX-FLoad-LN)\n- Factorization: L = U\
    \ @ V^T reduces projection cost from O(N·k) to O(N·p + k·p), enabling k≈320.\n\
    - Dynamics: Per-factor Osc2 SSM with stability margin r∈(0, a_max), w∈[0,π].\n\
    - Residual copy head: Strong short-horizon anchor (t=1–4).\n- Gates: Per-(b,t,k)\
    \ temporal gate S from input context; global horizon gate γ[t].\n- Regularization:\
    \ Temporal curvature (λ=1e-4); V-orthogonality (λ≈1e-5).\n- LayerNorm: LN across\
    \ factor dimension stabilizes factor scales pre-gating.\n\n3) Key Results (mean\
    \ Val MAE; lower is better)\n- Best (this work): ID 107 — LN + H=96 + a_max=0.993,\
    \ k=320, p=32, γ_end=0.99 → 0.026768\n  Step MAEs: t=1 0.0199, t=4 0.0233, t=8\
    \ 0.0260, t=16 0.0280, t=32 0.0283\n- AdamW (wd=1e-4) + LN + H=96 (p=32): ID 100\
    \ → 0.026846\n- p-sweep with LN + H=96:\n  • p=36 (ID 104) → 0.026843\n  • p=32\
    \ (ID 95)  → 0.026901\n  • p=40 (ID 110) → 0.026921\n  • p=28 (ID 105) → 0.026968\n\
    - γ_end sensitivity with LN (fixed at 0.99 for best): γ_end=0.995 (ID 99) → 0.026941\n\
    - No-LN comparators at similar capacity:\n  • H=96, p=32 (ID 93) → 0.026958\n\
    \  • Prior non-LN best (ID 67) → 0.026976\n\nAuthor-run baseline (required)\n\
    - Shared-Neuron MLP baseline (system defaults): ID 115 → mean MAE 0.029964\n \
    \ Step MAEs: t=1 0.0199, t=4 0.0239, t=8 0.0275, t=16 0.0313, t=32 0.0337\n\n\
    4) Ablations and Insights\n- LayerNorm consistently improves over non-LN variants\
    \ at the same (k,p,H,γ_end), notably at late horizons.\n- a_max: Slightly tighter\
    \ damping (0.993 vs 0.995) improves long-horizon stability and overall MAE.\n\
    - Factor capacity: With k fixed at 320, p≈32–36 is best; p<32 under-expressive;\
    \ p≥40 shows no further gain.\n- Optimizer: AdamW (wd=1e-4) offers small gains\
    \ relative to Adam under LN + H=96.\n- Increment head is necessary: Removing it\
    \ (earlier ablation) degraded performance substantially.\n\n5) Reproducibility\n\
    - Code: storage/ariadne/models_fact.py (factorized), models_fact_ln.py (LN variant;\
    \ Flax LayerNorm via reduction_axes/feature_axes), losses.py (curvature), models.py\
    \ (ResidualCopyHead).\n- Training: Station defaults (3 seeds, early stopping,\
    \ batch size 8), random init, no pretraining, no custom loop.\n- Compliance: All\
    \ constraints in the task specification are followed.\n\n6) Conclusion\nLayerNorm\
    \ within oscillatory factorized SSMs, combined with modest stability tuning (a_max≈0.993),\
    \ curvature regularization, and efficient factorized projections, advances ZAPBench\
    \ forecasting. Our best result (ID 107, 0.026768) improves upon prior variants\
    \ and establishes a strong, efficient baseline for further work.\n"
