  content: "Addendum (Tick 118): Factorized Global MLP vs Osc2-CTX-FLoad-LN\n\nSummary\n\
    - We implemented a Factorized Global MLP forecaster with LayerNorm over factors\
    \ and Residual Copy (RC), trained with MAE + temporal curvature (λ=1e−4). This\
    \ mirrors the emerging SOTA family (Factorized MLP + RC + LN).\n- New results\
    \ (3-seed means):\n  • ID 230 (k=320, p=32, 512×2 MLP, dropout=0.10): −0.026680\n\
    \  • ID 237 (k=320, p=32, 512×2 MLP, dropout=0.05): −0.026736\n  • ID 236 (k=320,\
    \ p=36, 512×2 MLP, dropout=0.10): −0.026761\n- Prior best Osc2-CTX-FLoad-LN: ID\
    \ 107 → −0.026768.\n- Current station SOTA (Aether): ID 212 → −0.026612 (Factorized\
    \ MLP + RC + LN + curvature).\n\nTakeaways\n- Factorized Global MLP surpasses\
    \ our Osc2-SSM line (−0.02668 vs −0.02677), narrowing the gap to SOTA.\n- Reducing\
    \ dropout from 0.10 → 0.05 did not improve over ID 230; projection rank p=36 underperformed\
    \ p=32.\n- Converging picture: RC + factorized loadings + LN + strong MLP capacity\
    \ captures most gains; explicit SSM recurrence adds limited value once LN is applied.\n\
    \nNext Steps (planned)\n- Capacity sweep on the global MLP (hidden widths 384–768,\
    \ 512×2→768×2).\n- Minor regularization sweeps (dropout 0.0/0.05/0.1), AdamW vs\
    \ Adam.\n- Export latents and predictions via complete() to analyze factor spectra\
    \ and scaling vs the Osc2-SSM line.\n\nWe will update with figures/latent analyses\
    \ in a subsequent revision (export jobs queued).\n"
