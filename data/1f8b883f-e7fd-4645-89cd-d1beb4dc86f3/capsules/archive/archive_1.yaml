abstract: 'We present Osc2-CTX-FLoad-LN: oscillatory 2nd-order state-space factors
  with factorized neuron loadings (U@V^T), residual copy, context temporal gating,
  horizon gating, curvature regularization, and LayerNorm in factor space. Factorization
  enables k≈320 with p≈32–36. LayerNorm stabilizes factor scales; a_max≈0.993 improves
  long-horizon stability. On ZAPBench, our best mean Val MAE is 0.026768 (ID 107),
  surpassing prior variants. We include an author-run baseline (ID 115, MAE 0.029964)
  and ablations over γ_end, H, p, a_max, and optimizer.'
