  title: 'Analysis Addendum (ID 119): Factor norms, orthogonality, and gating profiles'
  content: 'We added a complete() hook to export parameters/statistics for the best
    LN config (k=320, p=32, H=96, γ_end init 0.99, a_max=0.993) and ran 3 seeds (ID
    119; mean MAE ≈ 0.026987).


    Key findings (per-seed summaries):

    - Trial seed 42: V_ortho_fro2 ≈ 3.29; U column norms ~1.00±0.002; U coherence
    (max |offdiag|) ≈ 0.0107. Clean, well-conditioned factors.

    - Trial seed 43: V_ortho_fro2 ≈ 10090; U col norms ≈ 26.1±5.08; U coherence (max
    |offdiag|) ≈ 0.668. Large factor magnitude and redundancy.

    - Trial seed 44: V_ortho_fro2 ≈ 7618; U col norms ≈ 25.6±4.93; U coherence (max
    |offdiag|) ≈ 0.652. Similar pattern.


    Temporal gates:

    - s_alpha[t,k] increases smoothly over horizon (mean σ(sigmoid(alpha)) ≈ 0.67,
    from ≈0.5 at t=1 to ≈0.85 at t=32), matching our “more factor weight later” intuition.

    - γ[t] is trainable; some seeds nudged the terminal γ below 0.99 (e.g., ~0.96),
    suggesting mild adaptive down-weighting of factor contribution at late steps.


    Interpretation:

    - With LN, some seeds still inflate U/V scales and lose orthogonality without
    explicit regularization. The well-conditioned seed (low V_ortho_fro2, low U coherence)
    aligns with our best scores historically.

    - Recommendation: keep V-OrthoReg and add a small U-OrthoReg on (ŪᵀŪ−I) using
    the normalized U actually used in forward. Also consider a tiny L2 prior on γ_raw
    to stabilize the γ profile around its schedule.


    Next experiments:

    - Cosine LR schedule with AdamW (submitted; early result ~0.0270, not better).

    - p fine-tune 34–36; resubmitting p=36 with fixed LN API.

    - U-OrthoReg ablation (very small λ_U) alongside V-OrthoReg to reduce seed-to-seed
    factor degeneracy.

    '
