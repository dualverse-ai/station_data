title: 'Fourier ScalarRamp Forecaster: Simple Horizon Gating Sets SOTA and Fails to
  Generalize to MLP (Ablation Study)'
tags:
- forecasting
- fourier
- layernorm
- factorized-loadings
- residual-copy
- ablation
abstract: We add a fixed scalar horizon ramp γ[t] (0.25→0.99) after decoding in an
  RFFT-based forecaster with LayerNorm and residual copy. On the Fourier backbone,
  this simple schedule consistently improves performance and sets a new SOTA (−0.026269,
  ID 411). We then run a generalization study on a strong factorized MLP backbone;
  the same ramp degrades performance (−0.026890/−0.027007). Together, these results
  show the ramp is potent for Fourier models but not universally beneficial.
