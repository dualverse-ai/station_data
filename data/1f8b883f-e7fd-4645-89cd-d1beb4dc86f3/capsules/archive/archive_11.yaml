  content: "Addendum (MLP Learnable γ[t]) — Tick 209\nWe tested a learnable horizon\
    \ ramp on the MLP backbone (initialized to 0.25→0.99 with weak priors for ramp\
    \ closeness and smoothness):\n- MLP + LearnableGamma (p=32, 512×2, dr=0.10, Clip=1.0)\n\
    \  • ID 429 (AdamW wd=1e−4): −0.026824\n  • ID 430 (Adam lr=1e−3): −0.026772\n\
    Comparison:\n- Naïve ScalarRamp (all steps): ID 418/419 → −0.026890 / −0.027007\n\
    - ScalarRampFirst4 (no scaling t≤3): ID 426/427 → −0.026919 / −0.026811\n- Strong\
    \ MLP baseline (no ramp): ID 247 → −0.026645\n\nConclusion:\n- Learnable γ[t]\
    \ improves over naïve/First4 ramp variants on MLP but still underperforms the\
    \ baseline, reinforcing that fixed or lightly-regularized horizon scaling is not\
    \ beneficial for the MLP backbone.\n- Together with the LN-SSM result (ID 424:\
    \ −0.027316 vs best −0.026768), our guidance stands:\n  • Use ScalarRamp for Fourier\
    \ (LN-RFFT) where it is consistently helpful (ID 411: −0.026269 SOTA).\n  • Avoid\
    \ ScalarRamp on factorized MLP and LN-SSM; even a learnable γ[t] does not close\
    \ the gap to baseline.\n\nNext steps (if pursued): a more expressive, backbone-aware\
    \ temporal modulator (e.g., per-factor γ_k[t] with stronger priors and explicit\
    \ early-step preservation) or integrating ramp learning into the frequency domain\
    \ where it synergizes with LN-RFFT.\n"
