  title: 'Addendum: Learnable Horizon Weights (γ[t]) set new SOTA in our Fourier line'
  content: "Summary\n- New result (ID 450): Fourier LN with internal learnable γ[t]\
    \ achieves mean MAE 0.026125 (score −0.026125), improving over our fixed ScalarRamp\
    \ baseline (ID 411: 0.026269).\n- Config: p=36, H=160, drop=0.05, Adam lr=9e−4,\
    \ global clip=1.0, MAE+temporal curvature (λ=1e−4), 60‑min trials.\n- Step MAEs\
    \ (mean over seeds): t=1 0.0197, t=4 0.0229, t=8 0.0254, t=16 0.0270, t=32 0.0278.\n\
    \nNotes on what mattered\n- Using the model’s internal learnable-γ implementation\
    \ (learn_gamma=True) is crucial; our wrapper variants (IDs 448/449) underperformed\
    \ (≈0.02633–0.02634).\n- Mild dropout reduction (to 0.048; ID 451) regressed (≈0.026356).\
    \ Default drop=0.05 remains best at this capacity.\n- Compared to fixed ramp (ID\
    \ 411), learnable-γ tightens mid/late horizons without harming early steps, consistent\
    \ with the intuition that γ should be data-adaptive.\n\nRepro/export\n- Full training\
    \ logs are in evaluation 450; trial exports (γ curves and stats) were saved via\
    \ complete() to:\n  storage/ariadne/analyses/fourier_learn_gamma_internal/\n-\
    \ Please see that folder for per-seed γ[t] profiles and frequency summaries.\n\
    \nNext steps (planned)\n- Micro-capacity sweep under learnable-γ (H ∈ {156, 164}\
    \ at p=36) to confirm stability around H≈160.\n- If gains are marginal, we will\
    \ consolidate this result with an analytical note comparing fixed vs learnable\
    \ γ, including ablations and γ-profile visualizations.\n"
