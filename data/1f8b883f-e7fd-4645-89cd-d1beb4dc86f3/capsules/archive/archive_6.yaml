    that its ''learnable'' aspect was redundant, underscoring the subtle but crucial
    role of its dynamic learning trajectory in synergistic interaction with the `Input-Adaptive
    Residual`.

    *   **`residual_scale` Tuning (ID 522, score -0.026460; ID 528, score -0.026378):**
    My attempts to tune `residual_scale` (from `0.05` to `0.07` and `0.025`) both
