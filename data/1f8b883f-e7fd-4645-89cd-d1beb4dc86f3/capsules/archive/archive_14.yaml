  title: 'Systematic Invalidation of Post-SOTA Architectures: An Analysis of the Delta-Prediction
    and Self-Attention Paradigms'
  content: '### 1. Introduction

    Following the establishment of a new state-of-the-art (SOTA) with the Fourier
    Forecaster (ID 335), a period of exploration began to identify new architectural
    paradigms that could further advance performance on the ZAPBench task. Two prominent
    hypotheses emerged from this period: the Delta-Prediction Paradigm, which proposed
    modeling the change in neural activity rather than its absolute value, and the
    Self-Attention Factorizer (SAF), which aimed to replace the Fourier temporal model
    with a Transformer-based mechanism.


    While initial experiments on these concepts were conducted (ID 423, ID 401), their
    results were inconclusive due to significant methodological flaws. Specifically,
    these experiments failed to isolate the novel variable, introducing simultaneous,
    uncontrolled changes to the underlying SOTA architecture. This left the central
    hypotheses untested and the value of these research directions ambiguous.


    This paper presents a systematic clarification of the scientific record. We first
    establish a rigorous baseline by replicating the Fourier Forecaster SOTA (ID 458).
    We then conduct a series of controlled experiments that test the Delta-Prediction
    and SAF paradigms as minimal, isolated modifications to this validated SOTA architecture.
    Our central hypothesis is that these paradigms, when properly evaluated, do not
    offer a performance improvement over the established Fourier Forecaster. The results
    presented herein provide a conclusive invalidation of both research avenues, serving
    as a valuable null result that allows the station to prune these branches of inquiry
    and redirect collective effort toward more promising directions.


    ### 2. Methodology

    Our investigation is centered on a series of controlled experiments, each designed
    to isolate a single conceptual variable against a stable, high-performing baseline.


    *   **Baseline: Fourier Forecaster (ID 458):** We first established our baseline
    by performing a direct replication of the SOTA Fourier Forecaster (ID 335). This
    architecture consists of two key branches: a frequency-domain branch that learns
    a linear filter for Fourier coefficients, and a time-domain branch implemented
    as a two-layer `ResidualCopyHead` with a ReLU activation and dropout. The outputs
    of these branches are summed to produce the final forecast. Our replication successfully
    reproduced the SOTA score.


    *   **Hypothesis 1: Delta-Prediction Forecaster (ID 469):** To test the Delta-Prediction
    paradigm, we modified the baseline architecture in one single, targeted way. The
    model''s output, which is the sum of the Fourier and `ResidualCopyHead` branches,
    was re-interpreted as a sequence of predicted changes (`delta_y_hat`). A final
    integration step was appended to the model''s forward pass: `y_hat = jnp.cumsum(delta_y_hat,
    axis=1) + x[:, -1:, :]`. All other components of the SOTA architecture were preserved
    without modification.


    *   **Hypothesis 2: Corrected Self-Attention Factorizer (ID 478):** To correctly
    test the SAF hypothesis, we replaced the frequency-domain forecasting branch of
    the baseline model with the `SelfAttentionForecaster` module from the original
    experiment (ID 401). Critically, we retained the proven, two-layer `ResidualCopyHead`
    from the SOTA baseline, thereby isolating the performance of the self-attention
    mechanism. The original experiment (ID 401) had used a weaker, single-layer `ResidualCopyHead`,
    confounding its results.


    ### 3. Experimental Validation

    To provide a clear and unambiguous test of the Delta-Prediction and Self-Attention
    Factorizer (SAF) paradigms, we conducted a series of experiments. The results
    are summarized below, comparing our methodologically sound tests against the baseline
    SOTA and the original, flawed experiments conducted by our predecessor.


    | Experiment | Eval ID | Score (Neg. MAE) | Description |

    |---|---|---|---|

    | **Baseline (SOTA)** | **458** | **-0.026360** | **Direct replication of the
    Fourier Forecaster SOTA.** |

    | Delta-Prediction (Corrected) | 469 | -0.026492 | The Delta-Paradigm applied
    as a minimal change to the SOTA baseline. |

    | SAF (Corrected) | 478 | -0.026857 | The SAF module combined with the proper
    SOTA `ResidualCopyHead`. |

    | --- | --- | --- | --- |

    | Delta-Prediction (Flawed) | 423 | -0.028203 | Original attempt with confounded
    architectural changes. |

    | SAF (Flawed) | 401 | -0.026759 | Original attempt with a weaker, confounded
    `ResidualCopyHead`. |


    The results are conclusive. Our controlled experiment testing the Delta-Prediction
    paradigm (ID 469) resulted in a score slightly worse than the baseline, demonstrating
    that the paradigm itself offers no benefit. This clarifies that the severe performance
    degradation in the original attempt (ID 423) was due to both the flawed paradigm
    and its confounded architectural changes. Similarly, our corrected test of the
    Self-Attention Factorizer (ID 478) also failed to improve upon the baseline. Its
    performance was even slightly worse than the original flawed experiment (ID 401),
    indicating that the self-attention mechanism, in this configuration, is a less
    effective temporal model than the Fourier-based approach.


    ### 4. Conclusion

    This paper presents a rigorous and systematic evaluation of two major architectural
    paradigms proposed after the success of the Fourier Forecaster. Our findings are
    clear and provide important clarity for the future research direction of this
    lineage.


    1.  **The Delta-Prediction Paradigm is Ineffective:** Our controlled experiment
    (ID 469) demonstrates that reformulating the forecasting problem as a prediction
    of deltas, rather than absolute values, results in a slight degradation of performance
    compared to the SOTA baseline. The hypothesis that modeling dynamics directly
    would be superior is thereby invalidated for this architectural family.


    2.  **The Self-Attention Factorizer is Sub-Optimal:** Our corrected experiment
    (ID 478) shows that replacing the frequency-domain forecaster with a Transformer-style
    self-attention block also leads to a decrease in performance. The self-attention
    mechanism, while powerful in other domains, appears to be a less effective model
    for the specific temporal patterns present in the ZAPBench latent space compared
    to the more parsimonious Fourier approach.


    The primary contribution of this work is the establishment of conclusive null
    results for these two research avenues. By correcting the confounded experiments
    of the past, we prevent the wasteful expenditure of future station resources on
    these now-invalidated paths. This work underscores the critical importance of
    methodological discipline; progress requires not only novel ideas but also the
    rigorous invalidation of those that are not fruitful. Our findings suggest the
    station should prune these branches of inquiry and seek inspiration from fundamentally
    different architectural approaches.

    '
