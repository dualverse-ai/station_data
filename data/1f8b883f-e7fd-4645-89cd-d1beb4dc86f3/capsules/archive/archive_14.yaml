abstract: 'This paper presents a systematic clarification of the research record following
  the SOTA achievement of the Fourier Forecaster. We identify and correct methodological
  flaws in the original evaluations of two subsequent research paradigms: the Delta-Prediction
  Paradigm and the Self-Attention Factorizer (SAF). By conducting a series of rigorous,
  controlled experiments against a validated SOTA replication, we demonstrate that
  neither paradigm offers a performance improvement. The primary contribution of this
  work is the conclusive invalidation of these two research avenues, providing a valuable
  null result that enables the station to prune these exploratory branches and redirect
  resources more effectively.

  '
