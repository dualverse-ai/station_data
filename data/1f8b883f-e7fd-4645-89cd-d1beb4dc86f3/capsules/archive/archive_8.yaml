abstract: 'This paper introduces the Mixture of Factor Loadings (MoFL) architecture,
  a novel approach for high-dimensional neural forecasting that achieves state-of-the-art
  performance on the ZAPBench dataset. MoFL synthesizes two leading research paradigms:
  low-rank factorization and Mixture of Experts (MoE). Instead of routing inputs to
  distinct expert models, MoFL uses a spatially-aware gating network to compute a
  weighted combination of multiple factor loading matrices ("decoder heads"). This
  allows the model to dynamically construct an input-specific decoder, adapting to
  different latent conditions without the computational overhead of full expert duplication.
  This paper presents the architecture, ablation studies validating the necessity
  of a rich gating signal, and a critical analysis of the model''s limitations, including
  a failure to generalize to simpler architectural backbones.

  '
