  content: 'Addendum (Tick 172–173): Completed SAP-SSM gate statistics and cross-backbone
    analysis


    We complement the SAP-MLP results with concrete gate statistics for SAP applied
    to the Oscillatory SSM + LayerNorm backbone (SAP-SSM-LN). Gate JSONs are exported
    under storage/ariadne/analyses/rankgate_ssm_ln/.


    Per-seed gate statistics (SAP-SSM-LN; 3 seeds)

    - Seed 43 (Pmax=56; ID 359): gate_mean=0.1164, s_min=0.0411, s_max=0.2744; r_eff(τ=0.1)=27,
    r_eff(τ=0.2)=6, r_eff(τ=0.3)=0, r_eff(τ=0.4)=0; MAE=0.027132.

    - Seed 44 (Pmax=48; ID 358): gate_mean=0.1370, s_min=0.0640, s_max=0.2741; r_eff(τ=0.1)=33,
    r_eff(τ=0.2)=8, r_eff(τ=0.3)=0, r_eff(τ=0.4)=0; MAE=0.027153.

    - Seed 45 (Pmax=56; ID 359): gate_mean=0.0872, s_min=0.0369, s_max=0.2497; r_eff(τ=0.1)=17,
    r_eff(τ=0.2)=1, r_eff(τ=0.3)=0, r_eff(τ=0.4)=0; MAE=0.027201.


    Aggregates (mean ± sd across seeds)

    - gate_mean: 0.1135 ± 0.0204

    - r_eff(τ=0.1): 25.67 ± 6.60

    - r_eff(τ=0.2): 5.00 ± 2.94

    - s_max: 0.2661 ± 0.0116; s_min: 0.0473 ± 0.0119


    Interpretation and cross-backbone comparison

    - SAP-SSM concentrates energy in a small high-confidence subset at τ=0.2 (r_eff
    ≈ 5), while many gates exceed τ=0.1. At τ=0.4 it collapses to 0 across seeds,
    indicating lower gate magnitudes than SAP-MLP.

    - SAP-MLP (main text) had r_eff(τ=0.4)=26.0 ± 15.1 (seeds: 27, 44, 7), overlapping
    the Fourier fixed‑p optimum (p≈36; IDs 335/344/345). SAP-SSM’s compact r_eff at
    τ=0.2 suggests recurrence+increment heads reduce reliance on many projection columns.

    - Performance: SAP-SSM MAEs 0.027132/0.027153/0.027201 are competitive (<0.0272)
    but below the Fourier p=36 best (0.026355). With only 3 points, rank–MAE correlation
    is inconclusive; the lowest r_eff(τ=0.1)=17 case had the worst MAE, hinting that
    overly small effective rank can hurt.


    Next steps

    - SAP-Fourier: integrate gates into FourierForecasterLN to learn p end-to-end;
    target parity with tuned p=36 without sweeps.

    - Stability: α‑annealing and a mild entropy penalty on s to reduce variance in
    SAP‑MLP and lift SAP‑SSM gate magnitudes (enabling informative r_eff at higher
    τ).

    - Rank–horizon attribution: export per‑step contributions vs gate magnitude to
    directly link effective rank to late‑horizon errors.

    '
