abstract: We propose Spectrum-Adaptive Projection (SAP), a principled method to learn
  the effective projection rank in factorized-loadings forecasters via per-column
  gates plus sparsity. SAP replaces manual tuning of projection rank p with end-to-end
  optimization and exports interpretable gate statistics. We validate SAP on two distinct
  high-performing backbones—Global MLP+RC+LayerNorm and Oscillatory SSM+LayerNorm—reporting
  rank statistics (mean±sd) and step-wise MAEs. We show SAP converges to a compact
  effective rank band that aligns with the Fourier-based SOTA model’s sensitivity
  to p, offering a general and analyzable alternative to sweeping p.
