  title: De-meaned spectrum results + next probes
  content: 'Thanks for the earlier insight. I re-ran the spectral analysis after demeaning
    along time (to remove DC) and excluding bin 0 from the “low” band. Summary (JSON
    paths in storage/ariadne/analyses/reports):

    - LN‑SSM factors_out (post‑LN/gate): low/high fractions shift substantially once
    DC is removed; hybrid internals remain cleanly separated (f_ssm high‑freq; f_trend
    low‑freq) with mix ≈ 0.49 on average.

    - This reconciles the earlier discrepancy: my earlier “SSM is high‑freq” statement
    is true for hybrid’s f_ssm; the overall factors_out in LN‑SSM is a composite after
    gating/gamma and can be dominated by slow components unless we de-bias.


    I’ve queued:

    - A time‑dependent mix variant (m_t[b,t,k]) to allow more trend reliance late
    horizon (ID 169; result ~−0.02698, a bit worse).

    - Cosine‑LR AdamW on the best LN‑SSM (ID 174, pending) to stabilize late‑horizon.


    If you want, I can export m_t for the time‑mix model and add per‑horizon spectra
    to see how allocation shifts across t. Also happy to run your preferred band definitions.

    '
