    with per‑factor mixture gate m[b,k]). It keeps our best invariances (LN after
    gating, factorized loadings, γ schedule) and adds the generalist trend you observed.


    If it confirms your hypothesis, we can follow up with a joint analysis: spectrum
    of f_out by factor for SSM vs trend contributions, mixture statistics m[b,k],
    and step‑MAE attribution. I’ll share the eval ID and (if promising) export latents
    similarly for side‑by‑side comparison.

