  title: 'Draft: Oscillatory Factorized SSMs for ZAPBench'
  content: 'Working title: Oscillatory Low-Rank State-Space Models with Factorized
    Neuron Loadings for Whole-Brain Forecasting


    1. Problem

    Forecast 32 steps of zebrafish neural activity from 4 inputs over 71,721 neurons.


    2. Method

    - Factorized neuron loadings: L = U @ V^T with U ∈ R^{N×p}, V ∈ R^{k×p} (p <<
    k), enabling k≈320.

    - Factor dynamics: 2nd-order oscillatory SSM per factor y_t = 2 a y_{t-1} − b
    y_{t-2}, with stability via r∈(0,a_max), w∈[0,π], a = r cos w, b = r^2.

    - Residual copy head for strong short horizons.

    - Temporal gates: per-(b,t,k) gate S from input context and a global horizon gate
    γ[t] on factor branch.

    - Loss: MAE + temporal curvature (λ=1e-4). Regularization: V-orthogonality ||V^T
    V−I||^2 (λ≈1e-5).

    - Training: 3 seeds, early stopping; batch size 8.


    3. Key Results (mean Val MAE; negative MAE score shown by system)

    Baseline provided: Shared-Neuron MLP −0.029954.

    Our line:

    - ID 48: FLoad (k=320,p=32) + curvature → −0.027052

    - ID 51: FLoad (k=320,p=48) + V-ortho → −0.027031

    - ID 57: FLoad (k=320,p=32) + V-ortho → −0.027011

    - ID 68: FLoad (k=320,p=32, γ_end=0.95) + V-ortho → −0.027081

    - ID 67: FLoad (k=320,p=32, γ_end=0.99) + V-ortho → −0.026976 (current best)

    Variants (context-adaptive/mixtures):

    - ID 73: Context-adaptive r,w (+H=96) → −0.027076

    - ID 75: Mean+velocity context; γ_end=0.995; a_max=0.997 → −0.027017

    - ID 77: Mixture-of-Oscillators (Q=3) → −0.027023

    - ID 83: Time-varying MoOsc gating → −0.026995

    - ID 80: Mixture-of-Loadings (J=2) → −0.027058

    Early ablations:

    - Remove increment MLP (ID 40) degrades to −0.027635.

    - Dual-decay and simple LDS variants underperform (−0.02757 to −0.02730).


    4. Insights

    - Factorized loadings are critical to unlock capacity (k≈320) within memory.

    - Residual copy anchors t=1–4; factor branch governs long horizon; γ_end≈0.99
    best so far.

    - V-orthogonality (λ≈1e-5) consistently helps by reducing basis redundancy.

    - Richer context (mean+velocity) and time-varying mixtures provide small gains
    but not surpassing the simplest FLoad with tuned γ_end.

    - Curvature λ=1e-4 is a robust default.


    5. Next Experiments (queued/planned)

    - Fine γ_end sweep around 0.985–1.00 on base FLoad (submitted).

    - Copy-decay gate + slight dropout on increment head (submitted; ID 85).

    - If improvements stall, explore modest k± (288/352) with fixed p=32 under V-ortho,
    and lightweight per-factor LayerNorm.


    6. Repro details

    - Code modules in lineage storage: models_fact.py, models_moosc.py, models_moosc_t.py,
    models_fload_dg.py.

    - Training defaults/system per ZAPBench; no custom loop.

    '
