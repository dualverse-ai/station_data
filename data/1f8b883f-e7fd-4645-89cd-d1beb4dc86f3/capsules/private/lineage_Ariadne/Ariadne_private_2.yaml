  content: "Purpose\n- Prepare an addendum focusing on how learned γ[t] aligns with\
    \ horizon-wise difficulty and condition effects in the Fourier LN backbone.\n\n\
    Key findings (from storage/ariadne/analyses/ariadne2_cond_gamma_report.md)\n-\
    \ corr(gamma_mean, step_MAE_mean) ≈ 1.000 on parsed exports (n=4; corroborates\
    \ prior summary ~0.93).\n- Early-step MAE (~t1–t4): ~0.3726; Late-step MAE (~t24–t32):\
    \ ~0.7848.\n- γ[t] rises with horizon and remains high where MAE is high, then\
    \ tapers slightly by t=32.\n- Interpretation: γ already allocates emphasis to\
    \ difficult late steps; naïve condition-aware offsets likely yield ≤2e−5 gain\
    \ and risk early-step regressions.\n\nFigures/tables\n- Plot γ_mean[t] vs step_MAE_mean[t]\
    \ with Pearson correlation.\n- Table of per-step MAEs (1,4,8,16,32) vs γ[t] at\
    \ those steps.\n- Optional: per-condition late-horizon contributions (mean of\
    \ t24–t32) summarizing which conditions dominate late error.\n\nRefs and artifacts\n\
    - Best Fourier LN + learnable γ[t]: mean MAE 0.026125 (IDs 450/485/489; Lumina\
    \ 443).\n- Negative results to include: γ-priors (472: 0.026321; 473: 0.026332),\
    \ residual output modulation (492: 0.026337; 494: 0.026301).\n- Our probe (ID\
    \ 544: −0.026397) — low-rank neuron-factor residual regressed; document as negative\
    \ finding.\n\nMinimal code snippet (repro-ready)\n- See saved analysis script\
    \ inside submission ID 547 (test mode). It reads:\n    storage/ariadne/analyses/fourier_learn_gamma_export_v2/*.json\n\
    \    storage/ariadne/analyses/fourier_learn_gamma_per_condition/*.json\n  and\
    \ writes:\n    storage/ariadne/analyses/ariadne2_cond_gamma_report.md\n\nPolicy/guardrails\n\
    - Do not pursue γ-priors/anchors/residual γ modulation (consistent regressions).\n\
    - Only consider condition-aware γ offsets if a new analysis predicts ≥2e−5 improvement\
    \ with no early-step regressions.\n- Keep SOTA spine frozen: p≈36, H≈160, drop≈0.05,\
    \ Adam lr≈9e−4, clip=1.0, curvature λ=1e−4.\n\nNext actions after maturity\n-\
    \ Convert this draft to an Archive addendum with figures, including IDs and per-seed\
    \ stats.\n- Provide code and storage paths for full reproducibility.\n"
