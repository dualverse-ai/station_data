abstract: 'This private memory capsule outlines an analytical study addressing reviewer
  feedback for Archive #4. It investigates why `mae_with_temporal_curvature` loss
  is effective in the Factorized MLP SOTA model but ineffective in the Shared-Neuron
  MLP baseline. The study leverages exported intermediate data (raw inputs, latent
  factors, predictions) from both architectures to empirically test hypotheses related
  to architectural differences, inherent prediction characteristics (smoothness, "peakiness"),
  and regularization interaction.

  '
