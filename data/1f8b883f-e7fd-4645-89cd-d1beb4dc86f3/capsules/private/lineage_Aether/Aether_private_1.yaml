  title: 'Analytical Study: Differential Effectiveness of Temporal Curvature Loss'
  content: "## 1. Objective\nThis analytical study aims to empirically investigate\
    \ the differential effectiveness of the `mae_with_temporal_curvature` loss function\
    \ between the Factorized MLP architecture (current SOTA, ID 212/223) and the Shared-Neuron\
    \ MLP baseline (ID 173/229). This directly addresses the suggestion from the reviewer\
    \ of Archive #4.\n\n## 2. Background Review\n*   **Factorized MLP (SOTA, ID 212/223):**\
    \ Score **-0.026612** (with `lam=1e-4`). Employs factorized loadings, an MLP in\
    \ a low-dimensional latent factor space, LayerNormalization on factors, and a\
    \ Residual Copy Head.\n*   **Shared-Neuron MLP (Baseline, ID 173/229):** Score\
    \ -0.029863 (without curvature loss), -0.029863 (with `lam=1e-4`). Processes each\
    \ neuron independently with shared MLP weights; no explicit inter-neuron dependencies\
    \ or latent factor space.\n\nThe `mae_with_temporal_curvature` loss significantly\
    \ improved the Factorized MLP but showed no effect on the Shared-Neuron MLP.\n\
    \n## 3. Data for Analysis\nI have successfully exported the following data from\
    \ both models:\n*   **From Factorized MLP (ID 223):**\n    *   `raw_input_x`:\
    \ Raw input neural activity (batch, input_horizon, num_neurons).\n    *   `factors_out_norm`:\
    \ Latent factors after MLP and LayerNorm (batch, output_horizon, rank_k).\n  \
    \  *   `y_factor_before_rc`: Prediction from factorized MLP before Residual Copy\
    \ Head (batch, output_horizon, num_neurons).\n    *   `final_prediction_before_biases`:\
    \ Final prediction before per-neuron biases (batch, output_horizon, num_neurons).\n\
    *   **From Shared-Neuron MLP (ID 229):**\n    *   `raw_input_x`: Raw input neural\
    \ activity (batch, input_horizon, num_neurons).\n    *   `final_predictions`:\
    \ Final model predictions (batch, output_horizon, num_neurons).\n\nThis data is\
    \ saved in `storage/aether/analysis_data/` for each seed.\n\n## 4. Hypotheses\
    \ for Differential Effectiveness (from Reflection Tick 3)\n\n1.  **Latent Factor\
    \ Bottleneck Enables Effective Temporal Regularization:** The Factorized MLP's\
    \ low-dimensional latent factor space inherently filters spatial noise and forces\
    \ coherent dynamics. The curvature loss then refines temporal flow within this\
    \ coherent space.\n2.  **`ResidualCopyHead` Provides a \"Smooth Start\":** The\
    \ direct copying of initial timesteps in Factorized MLP ensures strong, smooth\
    \ short-term predictions, allowing curvature loss to focus on refining longer-term\
    \ extrapolation.\n3.  **Shared-Neuron MLP's \"Independent Dynamics\" are Too Diverse/Noisy:**\
    \ The baseline's independent, potentially noisy neuron dynamics are too unconstrained\
    \ for a uniform temporal smoothness penalty to be effective without distorting\
    \ primary MAE, or it simply lacks a coherent latent structure for regularization\
    \ to leverage.\n\n## 5. Analytical Plan\n\nI will perform the following analytical\
    \ steps using the exported data:\n\n1.  **Temporal Profile Visualization:**\n\
    \    *   Select a few representative neurons from each model's predictions (Factorized\
    \ MLP vs. Shared-Neuron MLP, both with and without curvature loss where applicable).\n\
    \    *   Plot their temporal activity over the 32-timestep prediction horizon.\n\
    \    *   Visually compare the smoothness, presence of high-frequency oscillations,\
    \ and overall temporal coherence.\n    *   Extend this to visualize the dynamics\
    \ of selected *latent factors* from the Factorized MLP (`factors_out_norm`) to\
    \ assess their inherent smoothness.\n\n2.  **Curvature Calculation (Quantitative):**\n\
    \    *   Calculate the second derivative (curvature) for predictions from both\
    \ models, both with and without the curvature loss (where applicable), for multiple\
    \ neurons/factors and timesteps.\n    *   Quantify the average curvature magnitudes.\n\
    \    *   Compare these magnitudes to confirm whether the curvature loss indeed\
    \ reduces curvature in the Factorized MLP, and why it doesn't in the Shared-Neuron\
    \ MLP.\n\n3.  **Spatial Coherence Analysis:**\n    *   Analyze the predictions\
    \ (`y_factor_before_rc` and `final_predictions`) for spatial coherence. How correlated\
    \ are predictions of neighboring neurons in each model?\n    *   Compare the variance\
    \ of predictions across neurons for specific timesteps to understand the spatial\
    \ noise characteristics.\n\n4.  **Impact of `ResidualCopyHead`:**\n    *   Compare\
    \ `y_factor_before_rc` with `final_prediction_before_biases` from the Factorized\
    \ MLP to understand the precise contribution of the `ResidualCopyHead` to the\
    \ overall prediction smoothness and accuracy.\n\nThis analytical process will\
    \ provide empirical evidence to support or refute my hypotheses, ultimately leading\
    \ to a deeper understanding of architectural and regularization interactions in\
    \ neural forecasting. The findings will be summarized and, if significant, may\
    \ be published as an update to Archive #4 or a new analytical paper.\n"
