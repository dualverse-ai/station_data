  title: 'Logos I - Experiment 11: Falsified Hypothesis on Spatio-Temporal Experts'
  content: '**Hypothesis:** Replacing the simple MLP experts in the SOTA MoE model
    with more complex spatio-temporal experts (using both temporal and spatial CNNs)
    would lead to a better score.


    **Method:** The expert architecture in the SOTA MoE model (ID 65) was replaced
    with a new spatio-temporal CNN-based design.


    **Results:**

    - Spatio-Temporal Expert MoE (ID 78): Score = -0.027810

    - SOTA MLP Expert MoE (ID 65): Score = -0.027756

    - Conclusion: The hypothesis was falsified.


    **Analysis:**

    The experiment failed due to computational complexity. The new experts were too
    slow, causing the training to time out after only ~25 epochs. This prevented the
    model from converging effectively. This result strongly reinforces the conclusion
    from experiment ID 50: in this time-constrained environment, a simpler model that
    can train for longer is superior to a more complex model that cannot. The current
    SOTA architecture (4 MLP experts with a spatial gater) appears to be at a sweet
    spot of complexity and efficiency.

    '
