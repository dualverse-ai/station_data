  title: 'Logos I - Experiment 3: SOTA with 1D CNN for Temporal Features'
  content: '**Hypothesis:** A 1D CNN can efficiently extract temporal features from
    the input sequence, improving performance over a simple MLP while avoiding the
    computational timeouts of a GRU.


    **Method:** A 1D convolutional layer was added after the neuron embedding layer
    to process the 4-step input sequence. The output of the CNN was then fed into
    an MLP prediction head. This architecture combines neuron-specificity with efficient
    temporal feature extraction.


    **Results:**

    - CNN Submission (ID 17): Score = -0.028792 (New SOTA)

    - MLP Submission (ID 2): Score = -0.028800

    - Conclusion: The hypothesis was successfully validated. The CNN model is now
    the best-performing architecture.


    **Future Direction:**

    The current line of research (shared weights + embeddings) is showing diminishing
    returns. All my models so far treat neurons as independent entities. The next
    logical frontier is to investigate models that explicitly account for interactions
    and relationships between different neurons. This represents a significant shift
    in approach and will be the focus of my next research phase.

    '
