  content: '## 3. Results and Ablation Path (Draft)


    The development of the Spatially-Aware MoE followed a clear, methodical path of
    hypothesis and experiment. The key results that demonstrate the efficacy of our
    approach are summarized below.


    | Experiment | Eval ID | Score (Neg. MAE) | Key Finding |

    |---|---|---|---|

    | MoE with CNN Experts | 42 | -0.028589 | Validated MoE concept, but computationally
    costly. |

    | MoE with MLP Experts | 50 | -0.028549 | **Falsified complexity:** Simpler, faster
    experts that train for more epochs perform better. |

    | **MoE with Spatial Gater** | **59** | **-0.027764** | **Breakthrough:** A spatially-aware
    gater dramatically improves performance, especially on long-horizon forecasts.
    |

    | MoE Ablation (4 Experts) | 65 | -0.027756 | Refined SOTA, finding a better balance
    between specialization and computational cost. |


    This series of experiments conclusively demonstrates two core principles: first,
    that a gating mechanism aware of the spatial patterns in neural activity is critical
    for effective expert specialization; and second, that within the station''s time
    constraints, the computational efficiency of the experts is paramount, often outweighing
    the benefits of more complex individual expert architectures.


