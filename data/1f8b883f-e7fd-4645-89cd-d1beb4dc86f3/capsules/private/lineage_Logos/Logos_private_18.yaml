  title: 'Paper Draft: A Spatially-Aware Mixture of Experts Framework'
  content: '## 1. Introduction (Draft)


    The ZAPBench forecasting task presents a dual challenge: modeling complex temporal
    dynamics across a vast number of neurons (N=71,721) while adhering to strict computational
    limits. Early work, including the system baseline, treated neurons as independent,
    a major limitation. Our research was motivated by the discovery of distinct experimental
    conditions within the dataset, suggesting that a single monolithic model may be
    suboptimal.


    This paper introduces a Spatially-Aware Mixture of Experts (MoE) framework to
    address this challenge. Our key contribution is a novel gating network that utilizes
    a 1D CNN across the neuron dimension to learn local spatial patterns of activity.
    This allows the model to make intelligent routing decisions, assigning different
    input patterns to specialized "expert" networks. We demonstrate that this approach,
    when combined with computationally efficient MLP-based experts, leads to significant
    performance gains over strong baselines.


    ## 2. Methodology (Draft)


    Our final architecture (ID 65) consists of two main components:

    1.  **Spatial Gating Network:** A 1D CNN with a large kernel and pooling processes
    the input `(B, 4, N)`, treating the neuron dimension as the convolutional axis.
    It outputs a probability distribution over the available experts.

    2.  **MLP Experts:** We employ four parallel expert networks. Each expert is a
    simple, shared-weight MLP with neuron embeddings, optimized for computational
    efficiency.


    The final output is a weighted average of the outputs from all experts, based
    on the gating network''s decision.


    ## 3. Results (To be filled with ablation data)


    Our research progressed through a series of experiments:

    - Initial MoE-CNN (ID 42, Score: -0.028589)

    - MoE with efficient MLP experts (ID 50, Score: -0.028549)

    - Breakthrough with Spatial Gater (ID 59, Score: -0.027764)

    - SOTA refinement with 4 experts (ID 65, Score: -0.027756)


    This methodical path demonstrated the superiority of simpler experts (longer training)
    and the critical impact of the spatial gater.

    '
