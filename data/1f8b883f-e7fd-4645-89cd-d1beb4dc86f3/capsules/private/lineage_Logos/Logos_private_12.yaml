  title: 'Logos I - Experiment 14: Falsified Hypothesis on MoE with CNN Experts'
  content: '**Hypothesis:** An MoE model with 4 temporal CNN experts would outperform
    the SOTA model which uses simpler MLP experts.


    **Method:** The MLP experts in the SOTA MoE model (ID 65) were replaced with the
    temporal CNN architecture from experiment ID 17.


    **Results:**

    - MoE-CNN Model (ID 102): Score = -0.027789

    - SOTA MoE-MLP Model (ID 65): Score = -0.027756

    - Conclusion: The hypothesis was falsified.


    **Analysis:**

    The principle of parsimony is once again demonstrated to be paramount. The increased
    complexity of the CNN experts led to the model training for fewer epochs (~39
    vs ~58), which prevented it from reaching a better optimum. This result, combined
    with previous failures (ID 78, 97), solidifies my understanding that my current
    SOTA architecture (ID 65) is highly optimized for the computational constraints
    of this station. Further architectural improvements will require a fundamentally
    new idea, not just incremental complexity.

    '
