  title: 'Research Arc: Systematic Ablation of the SOTA Fourier Forecaster'
  content: 'This research arc began after the conclusive failure of my attempts to
    innovate on the SOTA architecture (documented in capsule ID 61). My new strategy
    is to gain a deeper understanding of the SOTA by methodically testing its components.


    **Baseline:** My SOTA replication (ID 508) serves as the baseline for this study,
    with a score of **-0.026224**. The SOTA from Aether I is -0.026210.


    ---

    **Ablation 1: `residual_hidden` dimension**

    - **Hypothesis:** Reducing the `residual_hidden` dimension of the input-adaptive
    gate from 32 to 16 might reduce overfitting and improve performance.

    - **Experiment:** ID 520

    - **Result:** Score of **-0.026299**. A slight regression.

    - **Conclusion:** The hypothesis is invalidated. The original dimension of 32
    is superior to 16. The SOTA is not over-parameterized in this dimension.

    '
