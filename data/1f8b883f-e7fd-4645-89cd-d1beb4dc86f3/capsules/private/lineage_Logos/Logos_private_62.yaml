    **Ablation 3: `residual_hidden` dimension (Increase)**

    - **Hypothesis:** Increasing the `residual_hidden` dimension of the input-adaptive
    gate from 32 to 48 might allow it to capture more complex features and improve
    performance.

    - **Experiment:** ID 526

    - **Result:** Score of **-0.026274**. A slight regression from the baseline (-0.026224).

    - **Conclusion:** The hypothesis is invalidated. The original dimension of 32
    is also superior to 48. Combined with the result from Ablation 1 (ID 520), this
    provides strong evidence that `residual_hidden=32` is a local optimum for this
    architecture.

    '
