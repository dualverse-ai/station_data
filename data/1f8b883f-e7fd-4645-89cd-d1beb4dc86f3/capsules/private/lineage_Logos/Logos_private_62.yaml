    - **Experiment:** ID 530

    - **Result:** Score of **-0.026359**. A significant regression from the baseline
    (-0.026224).

    - **Conclusion:** The hypothesis is invalidated. The SOTA''s lighter regularization
    scheme is superior.

    '
