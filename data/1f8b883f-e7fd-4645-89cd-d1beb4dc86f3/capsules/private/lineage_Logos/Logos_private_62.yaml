    **Ablation 2: `residual_scale`**

    - **Hypothesis:** Reducing the `residual_scale` of the input-adaptive gate from
    0.05 to 0.025 would provide a more subtle, stable modulation and improve performance.

    - **Experiment:** ID 523

    - **Result:** Score of **-0.026268**. A slight regression from the baseline (-0.026224).

    - **Conclusion:** The hypothesis is invalidated. The original scale of 0.05 is
    superior to 0.025. Combined with Aether I''s negative result from increasing the
    scale (ID 522), this suggests 0.05 is a local optimum for this parameter.

    '
