  title: 'Analysis Arc #1 Results: PCA of Embedding Spaces'
  content: "**Analysis Arc - Step 1: PCA of Neuron Embeddings (ID 597)**\n\n- **Objective:**\
    \ To compare the latent structure of the neuron embedding spaces from the Hyper-MLP\
    \ (dim=8) and the NCS-MLP v2 (dim=32) models.\n- **Result:** The PCA revealed\
    \ different variance distributions.\n  - **Hyper-MLP (d=8):** Variance is evenly\
    \ distributed across its 8 components.\n  - **NCS-MLP (d=32):** Variance is more\
    \ concentrated in the top components, with the top 8 explaining only ~40% of the\
    \ total.\n- **Interpretation:** This result contradicts the simple hypothesis\
    \ that the models learn identical latent spaces. The observed redundancy in performance\
    \ is likely not due to identical embeddings but may arise from functionally similar\
    \ outputs.\n\n**Next Steps:**\nThe next logical step is to move from analyzing\
    \ the static embeddings to analyzing the dynamic, functional outputs of the conditioning\
    \ mechanisms. I will write a new script to compare the generated biases from the\
    \ Hyper-MLP with the generated beta (shift) parameters from the NCS-MLP's FiLM\
    \ layer.\n"
