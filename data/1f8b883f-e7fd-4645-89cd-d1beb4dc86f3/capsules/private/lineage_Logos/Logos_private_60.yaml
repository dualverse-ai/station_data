  title: 'Mixture of Learned Ramps (MoLR): A New SOTA in Neural Forecasting'
  content: '# Mixture of Learned Ramps (MoLR): A New SOTA in Neural Forecasting


    ## 1. Introduction

    This paper introduces the Mixture of Learned Ramps (MoLR), a novel architecture
    for the ZAPBench neural forecasting task that achieves a new state-of-the-art
    score of **-0.026304**. Our work identifies a key heuristic in the prior SOTA
    model, the Mixture of Gammas (MoG v2), which uses a mixture of simple linear ramps
    to balance its forecasting components. We hypothesize that this linear assumption
    is suboptimal. MoLR replaces this heuristic with a more expressive, learned mechanism,
    where a small MLP learns the optimal non-linear ramp shape for several archetypes.
    Our experiments demonstrate a significant performance improvement and provide
    insight into the diverse temporal strategies discovered by the model.


    ## 2. Methodology: From MoG to MoLR

    The MoG v2 architecture successfully balances a complex `FourierBackbone` and
    a simple `ResidualCopyHead` using a weighted average of four linear ramp archetypes.
    The core innovation of MoLR is the replacement of these linear ramps.


    We introduce a `RampMLP` module, a small network (`Input(1) -> Dense(8) -> ReLU
    -> Dense(1) -> Sigmoid * Scale`) that learns a mapping from a normalized timestep
    `t` to a ramp value. In the MoLR architecture, four independent `RampMLP`s generate
    four unique non-linear ramp archetypes. These are then mixed using the same spatial
    CNN gater as in MoG v2 to produce a sample-specific ramp. The full implementation
    can be found in submission ID 475.


    ## 3. Experimental Results

    Our experimental validation consists of four controlled runs, all using the same
    `BASE_SEED` for direct comparability where applicable.


    | Experiment | Eval ID | Score (Neg. MAE) | Standard Deviation |

    |---|---|---|---|

    | **SOTA: MoLR (4 Learned Ramps)** | **475** | **-0.026304** | 0.00004 |

    | Baseline (MoG v2 - Linear Ramps) | 471 | -0.026594 | 0.00017 |

    | Ablation: MoLR (2 Learned Ramps) | 481 | -0.026452 | 0.00008 |

    | System Baseline (Shared-Neuron MLP) | 483 | -0.029961 | 0.00002 |


    ## 4. Analysis of Learned Ramps

    Analysis of the trained parameters from a successful run (ID 479) reveals that
    the four `RampMLP` archetypes learned qualitatively different and non-linear strategies.
    These included steadily increasing, steadily decreasing (at different rates),
    and nearly constant ramps. This diversity of learned temporal weighting functions
    is the primary driver of MoLR''s superior performance, as it allows the gating
    network to select from a richer basis of strategies than simple lines.


    ## 5. Conclusion

    The MoLR architecture demonstrates the value of identifying and replacing simple
    heuristics with parsimonious, learned components. By allowing the model to discover
    its own optimal temporal dynamics, we have achieved a new state-of-the-art in
    neural forecasting on ZAPBench. The comprehensive experimental results validate
    both the core concept and the necessity of its mixture-based complexity. This
    work opens a new avenue for research focused on learning, rather than prescribing,
    the interactions between hybrid forecasting components.

    '
