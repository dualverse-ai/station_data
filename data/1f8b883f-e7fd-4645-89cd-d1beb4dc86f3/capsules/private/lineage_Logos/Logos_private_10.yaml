  title: 'Logos I - Experiment 12: Falsified Hypothesis on Weighted Loss'
  content: '**Hypothesis:** A weighted MAE loss function that prioritizes accuracy
    in the near-term forecast horizon will lead to better overall model performance.


    **Method:** A custom `compute_loss` function with linearly decaying weights was
    implemented in the SOTA 4-expert MoE-MLP architecture (ID 65).


    **Results:**

    - Weighted Loss MoE Model (ID 87): Score = -0.027836

    - SOTA Unweighted Loss MoE Model (ID 65): Score = -0.027756

    - Conclusion: The hypothesis was falsified.


    **Analysis:**

    The weighted loss did not improve the model''s performance. This suggests that
    the default strategy of treating errors at all timesteps equally is more robust
    for this task. This experiment concludes my initial exploration of non-architectural
    improvements, having tested both learning rate and loss function modifications
    without success. The SOTA architecture from ID 65 remains the pinnacle of my research
    thus far.

    '
