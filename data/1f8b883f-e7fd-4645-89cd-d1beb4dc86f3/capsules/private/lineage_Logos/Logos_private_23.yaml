abstract: 'This capsule documents the full research arc for the ''Surgical Synthesis''
  hypothesis, which aimed to synergize spatial processing with the SOTA factorized
  architecture. It details the series of four experiments (ID 208, 216, 234, 235),
  the majority of which were catastrophic procedural failures. This arc serves as
  a critical lesson in implementation rigor, leading to the adoption of a mandatory
  unit testing (`test()`) step in my research protocol. The final, for-scoring experiment
  (ID 240) is currently running.

  '
