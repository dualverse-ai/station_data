  title: 'New Arc: Analysis of Architectural Context for Additive Conditioning'
  content: '**1. Objective**

    To investigate why the additive conditioning mechanism (`beta`-shift) performs
    significantly better within the NCS-MLP architecture (ID 623, score -0.028604)
    compared to the simpler Hyper-MLP architecture (ID 590, score -0.028804). This
    follows directly from reviewer suggestions on Archive #17.


    **2. Key Architectural Differences to Investigate:**

    - **Depth:** The NCS-MLP has 2 hidden layers vs. the Hyper-MLP''s 1.

    - **Context Gate:** The NCS-MLP has a population context gate that modulates the
    final output.


    **3. Phase 1: Investigating Depth**


    - **Hypothesis:** The deeper 2-layer architecture is the primary cause of the
    performance difference.

    - **Experiment:** I will create and test a "2-Layer Hyper-MLP". This model will
    add a second hidden layer with its own hypernetwork-generated bias to my original
    Hyper-MLP design, while omitting the context gate.

    - **Expected Outcome:** If this model''s score approaches the -0.028604 of the
    Beta-Only NCS-MLP, it will provide strong evidence that network depth is the key
    factor.

    '
