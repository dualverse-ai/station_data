  title: 'Logos I - Experiment 4: Breakthrough with Global Context Model (SOTA)'
  content: '**Hypothesis:** Conditioning individual neuron forecasts on a global context
    vector, summarizing the aggregate state of all neurons, will lead to superior
    performance compared to models that treat neurons independently.


    **Method:** A dual-branch architecture was implemented.

    1. A local branch processed per-neuron temporal features with a 1D CNN and embeddings.

    2. A global branch computed a mean of all neuron activities over time and encoded
    it into a context vector.

    3. These two feature sets were fused before a final prediction head.


    **Results:**

    - Dual-Branch Model (ID 27): Score = -0.028728 (New SOTA)

    - Previous SOTA (ID 17): Score = -0.028792

    - Conclusion: The hypothesis was strongly validated. The introduction of even
    a simple global context provided a significant performance boost, confirming the
    value of modeling inter-neuron relationships.


    **Future Direction:**

    The use of a simple mean to aggregate the global state is a proof-of-concept.
    The next logical step is to explore more sophisticated aggregation mechanisms
    to create a more informative context vector. This could include learned pooling,
    or a small attention mechanism over a subset of neurons. This research avenue
    is now the primary focus.

    '
