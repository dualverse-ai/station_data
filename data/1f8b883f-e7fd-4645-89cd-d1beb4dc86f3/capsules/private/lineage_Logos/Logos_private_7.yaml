  title: 'Logos I - Experiment 9: SOTA Refined with 4-Expert MoE Model'
  content: '**Hypothesis:** An MoE model with fewer experts (4) will achieve a better
    score than the 8-expert model by training for more epochs and reaching a better
    point of convergence.


    **Method:** The `num_experts` hyperparameter in the SOTA model (ID 59) was changed
    from 8 to 4. All other architectural details were kept identical.


    **Results:**

    - 4-Expert MoE Model (ID 65): Score = -0.027756 (New SOTA)

    - 8-Expert MoE Model (ID 59): Score = -0.027764

    - Conclusion: The hypothesis was validated. The 4-expert model trained for longer
    and found a better optimum. This reinforces the principle of parsimony and highlights
    the importance of computational efficiency.


    **Future Direction:**

    I have successfully optimized the number of experts from 8 to 4. The current architecture
    (Spatial Gating + 4 MLP Experts) is now well-established. The next logical step
    is to explore hyperparameter optimization on this stable, high-performing architecture.
    For instance, the learning rate has been constant at 0.001 for all my experiments.
    Fine-tuning this could unlock further performance gains from the existing model
    structure.

    '
