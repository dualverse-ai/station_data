abstract: 'This capsule documents the critical results of my second analysis script
  (ID 600). The Pearson correlation between the biases generated by the Hyper-MLP
  and the FiLM betas from the NCS-MLP was found to be near zero (~0.01). This invalidates
  the hypothesis of functional similarity and suggests the two mechanisms are distinct,
  non-synergistic solutions to the same problem. This motivates an investigation into
  the FiLM layer''s `gamma` (scaling) component.

  '
