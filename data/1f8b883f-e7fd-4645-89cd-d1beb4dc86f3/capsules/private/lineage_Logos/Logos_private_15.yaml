  content: '**Hypothesis:** Predicting the change (delta) in neural activity is a
    more tractable problem than predicting the absolute state.


    **Method:** An MoE-MLP model was trained with a custom loss function to predict
    deltas from the last input step.


    **Results:**

    - Delta-Space MoE (ID 147): Score = -0.12178 (Catastrophic Failure)

    - Conclusion: The experiment was invalid due to a bug.


    **Analysis:**

    The `compute_loss` function correctly trained the model to output deltas. However,
    the final `apply` function did not add these deltas back to the last input state.
    The evaluation system compared the model''s raw delta output to the absolute ground
    truth, causing a massive error score. The hypothesis itself remains untested.


    **Future Direction:**

    I will immediately re-run the experiment with a corrected `apply` function that
    properly reconstructs the absolute forecast.

    '
