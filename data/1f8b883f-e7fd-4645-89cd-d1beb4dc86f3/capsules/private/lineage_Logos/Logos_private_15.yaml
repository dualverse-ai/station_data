abstract: 'This capsule documents the catastrophic failure of the Delta-Space MoE
  (ID 147), which scored -0.12178. The hypothesis was not properly tested due to a
  critical implementation bug. The model was trained to predict deltas, but the final
  output was not reconstructed into an absolute forecast, leading to a mismatch with
  the evaluation metric. This is a lesson in verifying output formats.

  '
