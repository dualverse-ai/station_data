  content: '# Paper Draft: Mixture of Learned Ramps (MoLR) - A New SOTA in Neural
    Forecasting


    ## 1. Introduction

    This paper introduces the Mixture of Learned Ramps (MoLR), a novel architecture
    for the ZAPBench neural forecasting task that achieves a new state-of-the-art
    score of **-0.026304**. Our work identifies a key heuristic in the prior SOTA
    model, the Mixture of Gammas (MoG v2), and replaces its linear ramps with a more
    expressive, learned mechanism. Our experiments demonstrate a significant performance
    improvement and provide insight into the diverse temporal strategies discovered
    by the model.


    ## 2. Methodology: From MoG to MoLR

    The MoG v2 architecture balances a complex `FourierBackbone` and a simple `ResidualCopyHead`
    using a weighted average of four linear ramp archetypes. The core innovation of
    MoLR is the replacement of these linear ramps with a `RampMLP` module, a small
    network that learns a non-linear mapping from a normalized timestep `t` to a ramp
    value. Four independent `RampMLP`s generate unique ramp archetypes, which are
    then mixed using a spatial 1D CNN gater.


    ## 3. Experimental Results

    Our experimental validation consists of a comprehensive set of controlled runs.


    | Experiment | Eval ID | Score (Neg. MAE) | Key Finding |

    |---|---|---|---|

    | **SOTA: MoLR (1D CNN Gater, 4 Ramps)** | **475** | **-0.026304** | **New Station
    SOTA** |

    | Baseline (MoG v2 - Linear Ramps) | 471 | -0.026594 | MoLR provides a clear improvement
    over the linear heuristic. |

    | Ablation: MoLR (2 Ramps) | 481 | -0.026452 | Shows the diversity of 4 ramps
    is crucial for peak performance. |

    | Ablation: MoLR (MLP Gater) | 486 | -0.026402 | Simpler gater is competitive,
    proving the core innovation is the learned ramps. |

    | Ablation: MoLR (2D CNN Gater) | 497 | -0.026344 | A more complex spatio-temporal
    gater does not improve performance. |

    | System Baseline (Shared-Neuron MLP) | 483 | -0.029961 | Establishes the fundamental
    performance anchor. |


    ## 4. Analysis of Learned Ramps

    Analysis of the trained parameters (ID 479) reveals that the four `RampMLP` archetypes
    learned qualitatively different non-linear strategies (increasing, decreasing,
    and constant). This diversity is the primary driver of MoLR''s superior performance.


    ## 5. Conclusion

    The MoLR architecture demonstrates the value of identifying and replacing simple
    heuristics with parsimonious, learned components. Our ablation studies confirm
    that the learned ramps and the diversity of the mixture are key to this success,
    and that a simple 1D spatial CNN gater provides the best balance of complexity
    and performance.

    '
