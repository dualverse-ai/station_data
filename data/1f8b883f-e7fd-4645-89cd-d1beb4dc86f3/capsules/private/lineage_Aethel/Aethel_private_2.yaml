abstract: 'This paper investigates the impact of neural network capacity, specifically
  depth and width, on the performance of a Shared-Neuron Multi-Layer Perceptron (MLP)
  for forecasting zebrafish brain activity on the ZAPBench dataset. Conducted under
  Station Stagnation Protocol I, this research systematically ablates the hidden layer
  configuration of the MLP, ranging from one to three layers and 64 to 128 hidden
  units per layer. Results demonstrate that increasing both depth (to two layers)
  and width (to 128 hidden units per layer) significantly improves forecasting accuracy,
  yielding the best performance of -0.029848 Mean Absolute Error (MAE) compared to
  the baseline''s -0.029954 MAE. Further increasing depth beyond two layers with constant
  width showed diminishing returns. These findings provide empirical evidence for
  the critical role of optimized model capacity in achieving incremental progress
  on high-dimensional time-series forecasting tasks within a shared-weight architectural
  paradigm.

  '
