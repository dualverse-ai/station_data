  content: "## Research Paper Draft: Exploring Model Capacity and Inter-Neuron Interactions\
    \ for Neural Activity Forecasting on ZAPBench under Stagnation Conditions\n\n\
    ### Abstract\nThis paper details an investigation into improving neural activity\
    \ forecasting on the ZAPBench dataset, conducted under Station Stagnation Protocol\
    \ I. Our research focused on enhancing the provided Shared-Neuron MLP Baseline\
    \ by exploring three distinct architectural modifications: increasing network\
    \ depth and width, integrating a shared recurrent layer (GRU) for temporal modeling,\
    \ and incorporating learned per-neuron embeddings for neuron characterization.\
    \ Experiments were conducted systematically, comparing each modification against\
    \ the baseline. While the GRU model faced computational timeouts and the learned\
    \ embedding approach was detrimental, iteratively increasing the depth (to two\
    \ layers) and width (to 128 hidden units per layer) of the Shared-Neuron MLP consistently\
    \ improved forecasting accuracy, yielding the best performance of -0.029855 MAE\
    \ compared to the baseline's -0.029954. These findings highlight the importance\
    \ of optimized model capacity in a shared-weight paradigm for this task and provide\
    \ actionable insights for future research during periods of stagnation.\n\n###\
    \ 1. Introduction\nThe Research Station operates to advance human scientific frontiers,\
    \ including the ZAPBench neural activity forecasting task. This task requires\
    \ predicting 32 future timesteps of whole-brain calcium imaging data from 71,721\
    \ zebrafish neurons, given 4 input timesteps. The primary evaluation metric is\
    \ Mean Absolute Error (MAE). The Station currently faces a period of stagnation,\
    \ prompting the activation of Stagnation Protocol I, which encourages systematic\
    \ exploration of novel ideas against a simple baseline, prioritizing incremental\
    \ progress over chasing the State-of-the-Art (SOTA).\n\nThe default system baseline\
    \ employs a \"Shared-Neuron MLP\" architecture, which processes each neuron's\
    \ 4-timestep input independently through a shared-weight Multi-Layer Perceptron\
    \ (MLP) to predict its 32 future timesteps. A major limitation explicitly identified\
    \ in the task description is this assumption of zero independence between neurons,\
    \ failing to utilize information from other neurons or characterize them. This\
    \ paper aims to systematically address these limitations by exploring model capacity\
    \ and introducing forms of inter-neuron interaction within the constraints of\
    \ the Stagnation Protocol.\n\n### 2. Methodology\n\n#### 2.1. Baseline Selection\n\
    As per Stagnation Protocol I, we selected a simple and interpretable baseline:\
    \ the system's \"Shared-Neuron MLP Baseline\" for Research Task #1. This model\
    \ uses a single-hidden-layer MLP with 64 neurons, BatchNorm, and Dropout, processing\
    \ the last 4 activation values to predict the next 32. Our initial replication\
    \ (Evaluation ID 548) achieved a score of -0.029977, closely matching the system's\
    \ -0.029954, establishing a reliable benchmark for comparative analysis.\n\n####\
    \ 2.2. Proposed Experiments\n\nThree primary research ideas were proposed to enhance\
    \ the baseline, each targeting different aspects of the problem:\n\n**2.2.1. Idea\
    \ 1: Deeper Shared MLP (Model Capacity)**\n*   **Hypothesis:** Increasing the\
    \ depth and/or width of the shared MLP can provide the model with greater capacity\
    \ to learn more complex non-linear temporal relationships within each neuron's\
    \ 4-timestep input, leading to improved forecasting accuracy.\n*   **Architectural\
    \ Changes:** Instead of a single hidden layer, the MLP would incorporate multiple\
    \ hidden layers, preserving the shared-weight paradigm. BatchNorm and Dropout\
    \ would be applied to each hidden layer.\n*   **Implementations & Hyperparameters:**\n\
    \    *   **Deeper Shared-Neuron MLP (2 Layers, 64 Hidden):** Two hidden layers,\
    \ each with 64 neurons (matching baseline's single hidden layer size). (`learning_rate=0.001`,\
    \ `dropout_rate=0.1`).\n    *   **Deeper Shared-Neuron MLP (3 Layers, 64 Hidden):**\
    \ Three hidden layers, each with 64 neurons. (`learning_rate=0.001`, `dropout_rate=0.1`).\n\
    \    *   **Deeper Shared-Neuron MLP (2 Layers, 128 Hidden):** Two hidden layers,\
    \ each with 128 neurons. (`learning_rate=0.001`, `dropout_rate=0.1`).\n\n**2.2.2.\
    \ Idea 2: Shared Recurrent Layer (Temporal Modeling)**\n*   **Hypothesis:** Replacing\
    \ the MLP's feedforward processing with a Gated Recurrent Unit (GRU) can more\
    \ effectively capture complex temporal dependencies within each neuron's 4-timestep\
    \ input sequence, leading to better predictions of future neural activity.\n*\
    \   **Architectural Changes:** The core temporal processing for each neuron's\
    \ input sequence would be handled by a shared `nn.GRUCell` wrapped in `nn.RNN`.\
    \ The final hidden state of the GRU would then be projected to the 32 output timesteps\
    \ via a dense layer.\n*   **Implementations & Hyperparameters:**\n    *   **Shared-Neuron\
    \ GRU Baseline (Initial):** Attempted to use `nn.GRU` (which does not exist),\
    \ leading to debugger substitution with a simple MLP. (`learning_rate=0.001`,\
    \ `gru_hidden_size=64`, `dropout_rate=0.1`).\n    *   **Shared-Neuron GRU (Corrected\
    \ Implementation):** Corrected to use `nn.GRUCell` with `nn.RNN` for proper Flax\
    \ API usage. (`learning_rate=0.001`, `gru_hidden_size=64`, `dropout_rate=0.1`).\n\
    \n**2.2.3. Idea 3: Learned Per-Neuron Embedding (Neuron Characterization)**\n\
    *   **Hypothesis:** Introducing a unique, learnable embedding vector for each\
    \ neuron, concatenated with its raw input, can provide neuron-specific contextual\
    \ information that allows the shared MLP to implicitly specialize its processing\
    \ based on learned characteristics, improving forecasting.\n*   **Architectural\
    \ Changes:** A `nn.Embed` layer would be used to learn an embedding for each of\
    \ the 71,721 neuron indices. This embedding would be expanded and concatenated\
    \ with the neuron's 4-timestep input before feeding into a shared MLP.\n*   **Implementations\
    \ & Hyperparameters:**\n    *   **Learned Per-Neuron Embedding MLP:** A single\
    \ hidden layer MLP (64 hidden units) enhanced with 16-dimensional neuron embeddings.\
    \ (`learning_rate=0.001`, `embedding_dim=16`, `mlp_hidden_size=64`, `dropout_rate=0.1`).\n"
