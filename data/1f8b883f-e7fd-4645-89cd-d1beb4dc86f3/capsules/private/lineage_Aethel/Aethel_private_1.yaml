  title: 'Initial Research: Global Context MLP & Debug Learnings'
  content: "### Research Objective\nTo improve upon the system's \"Shared-Neuron MLP\
    \ Baseline\" for Neural Activity Forecasting on ZAPBench by introducing a simple\
    \ form of inter-neuron communication: augmenting each neuron's input with the\
    \ global mean activity across all neurons for the same input timesteps. This addresses\
    \ the baseline's assumption of zero independence between neurons.\n\n### Experiment\
    \ 1: Baseline Replication\n- **Submission ID:** 548\n- **Score:** -0.02997714031833586\n\
    - **Details:** Successfully replicated the system's baseline (ID 1, score -0.029954).\
    \ The slight difference is attributed to random seed variations. This established\
    \ a reliable personal benchmark.\n\n### Experiment 2: Global Context Shared-Neuron\
    \ MLP\n- **Submission ID:** 549\n- **Score:** -0.029911029910911022\n- **Details:**\
    \ This submission incorporated the global mean activity. The score shows a marginal\
    \ improvement over the baseline, suggesting that introducing global context in\
    \ this manner is beneficial, even if subtly.\n\n### Debugging Learnings (Submission\
    \ ID 549)\nThe initial submission of the Global Context MLP failed but was successfully\
    \ fixed by the automatic debugger. Two main bugs were identified:\n\n1.  **Dataclass\
    \ Field Ordering:** In the `GlobalContextSharedNeuronMLP` Flax module, a non-default\
    \ argument (`dropout_rate`) was placed after a default argument (`output_horizon`).\
    \ Python dataclasses require non-default arguments to precede default ones.\n\
    \    - *Fix:* Reordered fields to `hidden_size: int`, `dropout_rate: float`, `output_horizon:\
    \ int = 32`.\n\n2.  **Incorrect Preprocessing Logic:**\n    -   **Redundant Preprocessing:**\
    \ The `GlobalContextMLPWrapper.init()` and `apply()` methods were manually replicating\
    \ the input augmentation logic. This logic should reside solely within the `GlobalContextSharedNeuronMLP`'s\
    \ `__call__` method, as the wrapper should simply pass the raw input `x` to the\
    \ model.\n    -   **Incorrect Concatenation:** `jnp.concatenate([x, global_avg_input_repeated],\
    \ axis=-1)` was used, which concatenates along the last existing dimension, resulting\
    \ in `(batch_size, input_horizon, num_neurons*2)`. The intention was to add a\
    \ *new* dimension for features.\n    - *Fix:* Removed preprocessing from the wrapper\
    \ methods. In `GlobalContextSharedNeuronMLP.__call__`, `jnp.stack([x, global_avg_input_repeated],\
    \ axis=-1)` was used instead. This correctly stacks along a new last axis, resulting\
    \ in the desired `(batch_size, input_horizon, num_neurons, 2)` shape before reshaping.\n\
    \nThis debugging process was crucial for understanding system integration and\
    \ precise JAX array manipulations.\n\n### Debugged Code (Submission ID 549)\n\n\
    ```python\nimport jax\nimport jax.numpy as jnp\nfrom jax import random\nimport\
    \ optax\nimport flax.linen as nn\nfrom typing import Tuple, Dict, Any\n\ndef _define_hyperparameters():\n\
    \    \"\"\"Define hyperparameters for the enhanced shared MLP.\"\"\"\n    return\
    \ {\n        'learning_rate': 0.001,\n        'hidden_size': 64,\n        'dropout_rate':\
    \ 0.1\n    }\n\nclass GlobalContextSharedNeuronMLP(nn.Module):\n    \"\"\"\n \
    \   Shared-neuron MLP enhanced with global mean context.\n    Each neuron's 4-timestep\
    \ input is augmented with the global mean activity\n    (across all neurons) for\
    \ those same 4 timesteps.\n    \"\"\"\n    hidden_size: int\n    dropout_rate:\
    \ float\n    output_horizon: int = 32\n\n    @nn.compact\n    def __call__(self,\
    \ x, training: bool = False):\n        batch_size, input_horizon, num_neurons\
    \ = x.shape\n\n        # 1. Calculate global average over neurons for the input\
    \ timesteps\n        global_avg_input = jnp.mean(x, axis=-1, keepdims=True)\n\
    \        global_avg_input_repeated = jnp.tile(global_avg_input, (1, 1, num_neurons))\n\
    \n        # 2. Stack original neuron input with global context along a new dimension\n\
    \        x_augmented = jnp.stack([x, global_avg_input_repeated], axis=-1)\n\n\
    \        # Transpose to (batch_size, num_neurons, input_horizon, 2)\n        x_augmented\
    \ = jnp.transpose(x_augmented, (0, 2, 1, 3))\n        # Reshape to (batch_size\
    \ * num_neurons, input_horizon * 2) = (B*N, 8)\n        x_reshaped = jnp.reshape(x_augmented,\
    \ (batch_size * num_neurons, input_horizon * 2))\n\n        # Shared MLP: input_dim\
    \ (input_horizon * 2 = 8) -> hidden (64) -> output (32)\n        # Layer 1 with\
    \ BatchNorm and Dropout\n        x_processed = nn.Dense(self.hidden_size)(x_reshaped)\n\
    \        x_processed = nn.BatchNorm(use_running_average=not training)(x_processed)\n\
    \        x_processed = nn.relu(x_processed)\n        x_processed = nn.Dropout(rate=self.dropout_rate,\
    \ deterministic=not training)(x_processed)\n\n        # Output layer\n       \
    \ x_processed = nn.Dense(self.output_horizon)(x_processed)\n\n        # Reshape\
    \ back to (batch_size, output_horizon, num_neurons)\n        x_output = jnp.reshape(x_processed,\
    \ (batch_size, num_neurons, self.output_horizon))\n        x_output = jnp.transpose(x_output,\
    \ (0, 2, 1))\n\n        return x_output\n\nclass GlobalContextMLPWrapper:\n  \
    \  \"\"\"\n    Wrapper to make Flax model compatible with the training system.\n\
    \    Handles BatchNorm state and Dropout RNG requirements.\n    \"\"\"\n    def\
    \ __init__(self, hparams):\n        self.model = GlobalContextSharedNeuronMLP(\n\
    \            hidden_size=hparams['hidden_size'],\n            dropout_rate=hparams['dropout_rate']\n\
    \        )\n        self.mutable = ['batch_stats']\n        self.needs_rng = True\n\
    \n    def init(self, rng_key, dummy_input):\n        rng_params, rng_dropout =\
    \ random.split(rng_key)\n        variables = self.model.init(\n            {'params':\
    \ rng_params, 'dropout': rng_dropout},\n            dummy_input,\n           \
    \ training=True\n        )\n        return variables\n\n    def apply(self, params,\
    \ x, training=False, mutable=None, rngs=None):\n        if mutable is not None:\n\
    \            output, updates = self.model.apply(\n                params,\n  \
    \              x,\n                training=training,\n                mutable=mutable,\n\
    \                rngs=rngs if rngs is not None else {}\n            )\n      \
    \      return output, updates\n        else:\n            return self.model.apply(\n\
    \                params,\n                x,\n                training=training,\n\
    \                rngs=rngs if rngs is not None else {}\n            )\n\ndef create_network(hparams:\
    \ Dict[str, Any]):\n    \"\"\"Create and return the global-context enhanced shared-neuron\
    \ MLP.\"\"\"\n    return GlobalContextMLPWrapper(hparams)\n```\n\n### Next Steps\n\
    The current improvement is small. Future research should investigate more sophisticated\
    \ methods for integrating inter-neuron dependencies, potentially moving beyond\
    \ simple global averaging. This could involve graph neural networks, attention\
    \ mechanisms, or locally connected MLPs that consider neuron neighborhoods. I\
    \ will also consider exploring hyperparameter tuning (e.g., `hidden_size`, `learning_rate`)\
    \ for the current model, but only after exploring more fundamental architectural\
    \ changes.\n"
