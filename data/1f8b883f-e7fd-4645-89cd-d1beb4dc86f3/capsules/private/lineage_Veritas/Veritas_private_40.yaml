  title: 'Research Plan: Ablation Out - No Spatial Conv (Eval ID 218)'
  content: "**Current Status:** Evaluation ID 218 **FAILED** at Tick 112.\n\n**Experiment\
    \ Goal:** To quantify the individual contribution of the 1D spatial convolutional\
    \ layer, which is responsible for modeling local inter-neuron dependencies within\
    \ the `ContextualConvNeuronFactorizedSSM` model. This is the first experiment\
    \ in my 'ablation-out' study.\n\n**Hypothesis:** Removing the `nn.Conv` layer\
    \ will lead to a noticeable performance degradation (higher MAE) compared to my\
    \ SOTA model (Eval ID 198: -0.028104).\n\n**Methodology:**\n- **Base Model:**\
    \ The full `ContextualConvNeuronFactorizedSSM` architecture (code from Eval ID\
    \ 198).\n- **Modification:** The `nn.Conv -> BatchNorm -> ReLU` block for the\
    \ 1D spatial convolutional layer was removed from the `ContextualConvNeuronFactorizedSSM_Main`\
    \ module.\n  - `FiLM` modulation was adjusted to directly operate on `x_with_features`\
    \ (`(B, N, INPUT_HORIZON + embedding_dim)`).\n  - The `FactorizedSSMDecoder` was\
    \ intended to receive features of `INPUT_HORIZON + embedding_dim` as its input\
    \ dimension.\n- **Hyperparameters:** All other hyperparameters remained identical\
    \ to Eval ID 198.\n- **Loss/Optimizer:** MAE + V-Orthogonality Reg + Temporal\
    \ Curvature Reg, default Adam optimizer.\n- **Training:** 3 parallel seeds, early\
    \ stopping.\n\n**Outcome:** The experiment **FAILED** with a `TypeError: FactorizedSSMDecoder.__init__()\
    \ got an unexpected keyword argument 'conv_features'`.\n\n**Analysis of Failure:**\
    \ The error indicates a mismatch in parameter passing to the `FactorizedSSMDecoder`.\
    \ When the `nn.Conv` layer was removed, the `conv_features` hyperparameter was\
    \ also removed from the main model, but the `FactorizedSSMDecoder`'s `__init__`\
    \ still explicitly expected `conv_features`. The input dimension to the `FactorizedSSMDecoder`\
    \ also changed from `conv_features` (64) to `INPUT_HORIZON + embedding_dim` (20).\
    \ The bug is a parameter name and value mismatch.\n\n**Next Steps:** Correct the\
    \ parameter name in `FactorizedSSMDecoder` to `input_features_dim` and ensure\
    \ the correct feature dimension (`INPUT_HORIZON + embedding_dim = 20`) is passed\
    \ to it from the main model's `__call__` method. Re-submit this corrected ablation\
    \ experiment.\n"
