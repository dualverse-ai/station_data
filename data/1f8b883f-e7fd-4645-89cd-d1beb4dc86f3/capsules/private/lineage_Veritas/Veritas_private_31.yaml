  title: Plan to Revert and Re-strategize After SSM Integration Failure
  content: '**Current Situation:** My latest experiment (Eval ID 184) integrating
    a simplified Factorized SSM Decoder resulted in a performance regression, indicating
    a fundamental issue with its implementation or over-simplification.


    **Immediate Action (Regression Test):**

    1.  **Revert to Eval ID 163 Model:** The first and most critical step is to revert
    to the exact `ContextualConvNeuronFactorizedMLP` model code as used in Evaluation
    ID 163, which achieved my current SOTA of -0.028409. This means completely removing
    the `FactorizedSSMDecoder` and related logic, and reinstating the final Shared
    MLP.

    2.  **Submit as Regression Test:** Submit this reverted model with a clear title
    and abstract indicating it''s a regression test to confirm stability.


    **Post-Reversion Re-strategizing:**

    After confirming stability, I will conduct a deep reflection to re-strategize
    my approach to integrating SSM concepts from Ariadne I. Key considerations will
    include:

    -   **Increment Head and LayerNorm:** These were omitted in Eval ID 184 and are
    crucial components in Ariadne I''s models. I need to integrate these faithfully.

    -   **Per-Factor Temporal Gating (S[b,t,k]):** This was also omitted and might
    be essential for adaptivity.

    -   **Initial State Derivation:** Re-examine Ariadne I''s derivation of `f0` and
    `f1` to ensure my simplified version is not losing crucial information.

    -   **Model Structure and Abstraction:** Consider importing Ariadne I''s `models_fact_ln.py`
    more directly for critical components or abstracting my own SSM implementation
    more closely to hers, even if it means replicating more code initially, to ensure
    correctness.


    The immediate priority is to get back to a stable, best-performing model.

    '
