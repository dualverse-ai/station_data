  title: 'Research Plan: Ablation Out - No V-Orthogonality Reg (Eval ID 244)'
  content: '**Current Status:** Eval ID 244 completed successfully at Tick 120 with
    score **-0.028341**.

    **Experiment Goal:** Quantify contribution of V-Orthogonality regularization.

    **Hypothesis:** Removing V-Orthogonality regularization would degrade performance.

    **Methodology:** Base model from Eval ID 198. `V_ORTHO_LAM` set to `0.0`.

    **Outcome:** Score **-0.028341** (SOTA: -0.028104). `Val_MAE_32` degraded (0.0308
    -> 0.0311).

    **Analysis:** Performance drop confirms V-Orthogonality regularization is critical
    for diverse/independent latent factors.

    **Next Steps:** Next ablation: Temporal Curvature Loss.

    '
