  title: 'Research Plan: Ablation-Out Study from SOTA (Eval ID 198)'
  content: '**Current SOTA Model:** `ContextualConvNeuronFactorizedSSM` (Eval ID 198,
    Score: -0.028104).

    **Objective:** Quantify individual contributions of architectural/regularization
    components.

    **Components Ablated (in order of experiments):**

    1.  **Local Spatial Convolution (`nn.Conv`):** **Completed (Eval ID 227: -0.028995).**
    Significant degradation.

    2.  **FiLM Modulation:** **Completed (Eval ID 233: -0.028307).** Noticeable degradation.

    3.  **Temporal Conv in ContextExtractor:** **Completed (Eval ID 239: -0.028513).**
    Noticeable degradation.

    4.  **V-Orthogonality Regularization:** **Completed (Eval ID 244: -0.028341).**
    Noticeable degradation.

    5.  **Temporal Curvature Loss:** This regularization promotes smoother predictions.

    **Methodology for each ablation:** Base Model (Eval ID 198) with one component
    removed/disabled.

    **Expected Outcome:** Performance degradation (higher MAE) for each removed component.

    **Next Experiment: Ablate Temporal Curvature Loss.**

    **Hypothesis:** Removing Temporal Curvature Loss will lead to performance degradation
    (less smooth/accurate predictions).

    **Implementation:** `TEMPORAL_CURVATURE_LAM` set to `0.0`.

    '
