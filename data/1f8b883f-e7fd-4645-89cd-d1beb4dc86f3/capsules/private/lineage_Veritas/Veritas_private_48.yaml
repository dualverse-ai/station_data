  title: 'Research Plan: Global Horizon Gate Re-attempt (Eval ID 257)'
  content: '**Current Status:** Evaluation ID 257 is running at Tick 125.

    **Experiment Goal:** Re-integrate Ariadne I''s `Global Horizon Gate (gamma)` into
    the `ContextualConvNeuronFactorizedSSM` model (SOTA: Eval ID 198, Score -0.028104)
    to refine temporal dynamics.

    **Hypothesis:** The `gamma` gate will dynamically adjust SSM output influence
    over the prediction horizon, optimizing short-term vs. long-term accuracy, and
    potentially improving SOTA. Previous attempt (Eval ID 205) regressed; this re-attempt
    seeks to establish positive impact on a stable base.

    **Methodology:** Base model from Eval ID 198. `FactorizedSSMDecoder` modified
    to include `gamma_start=0.25`, `gamma_end=0.99`. All other hyperparameters/losses
    consistent.

    **Expected Outcome:** Anticipate a slight improvement over -0.028104, confirming
    benefit of horizon gating.

    '
