  title: 'Research Plan: Contextual ConvNeuronFactorizedMLP (Eval ID 153)'
  content: "**Current Status:** Evaluation ID 153 has completed successfully at Tick\
    \ 82.\n\n**Experiment Goal:** To achieve a more efficient, robust, and potentially\
    \ interpretable representation of neuron-specific characteristics and inter-neuron\
    \ dependencies by replacing direct `neuron_embeddings` with a low-rank factorization\
    \ scheme, inspired by Ariadne I's SOTA.\n\n**Hypothesis:** Replacing the `(NUM_NEURONS,\
    \ embedding_dim)` `neuron_embeddings` with a factorized representation (`U`: `(NUM_NEURONS,\
    \ proj_rank)` and `V`: `(embedding_dim, proj_rank)`) will lead to improved forecasting\
    \ accuracy by capturing essential inter-neuron dependencies in a more principled\
    \ way, surpassing my previous SOTA (-0.028418).\n\n**Inspiration:** Ariadne I's\
    \ extensive use of low-rank factorized representations in her top-performing models.\n\
    \n**Methodology:**\n- **Base Model:** `ContextualConvNeuronEmbeddingMLP` (Eval\
    \ ID 94's code as stable baseline).\n- **Modification:**\n  - Removed `self.param('neuron_embeddings',\
    \ ...)`\n  - Introduced two new parameters: `U_factor` and `V_factor`.\n  - Implemented\
    \ column-normalization for `U_factor`.\n  - Computed `factorized_neuron_features\
    \ = U_factor @ V_factor.T`.\n  - These `factorized_neuron_features` are used in\
    \ place of the original `neuron_embeddings`.\n- **New Hyperparameters:** `proj_rank=8`,\
    \ `normalize_u=True`.\n- **Existing Hyperparameters:** `learning_rate=0.001`,\
    \ `hidden_size=64`, `dropout_rate=0.1`, `embedding_dim=16`, `conv_kernel_size=5`,\
    \ `conv_features=64`, `context_dim=16`, `hidden_context_dim=32`, `temporal_conv_features=16`,\
    \ `temporal_kernel_size=2`.\n- **Loss/Optimizer:** Default MAE loss, default Adam\
    \ optimizer.\n- **Training:** 3 parallel seeds, early stopping.\n\n**Outcome:**\
    \ The experiment completed with a score of **-0.028434**. This score is marginally\
    \ *worse* than my previous best stable model (Eval ID 94: -0.028418) and also\
    \ worse than Eval ID 82 (-0.028486). The `Val_MAE_32` remained at 0.0315.\n\n\
    **Analysis of Performance:** The initial integration of low-rank factorization\
    \ with `proj_rank=8` did not yield the expected improvement. This suggests that\
    \ either `proj_rank=8` was too restrictive, limiting the capacity of the neuron\
    \ feature representation, or that the linear factorization alone is not sufficient\
    \ to capture the nuances of neuron characteristics compared to directly learned\
    \ embeddings within this architecture.\n\n**Next Steps:** This result necessitates\
    \ further investigation into the optimal `proj_rank` for this factorized approach.\
    \ I will plan an ablation study for `proj_rank`, starting with a larger value.\n"
