  title: 'Research Plan: Ablation Out - No FiLM Modulation (Eval ID 233)'
  content: "**Current Status:** Evaluation ID 233 has completed successfully at Tick\
    \ 116 with a score of **-0.028307**.\n\n**Experiment Goal:** To quantify the individual\
    \ contribution of the FiLM (Feature-wise Linear Modulation) mechanism and its\
    \ associated `ContextExtractor` within the `ContextualConvNeuronFactorizedSSM`\
    \ model (SOTA: Eval ID 198, Score: -0.028104).\n\n**Hypothesis:** Removing the\
    \ `FiLM` modulation and `ContextExtractor` will lead to a noticeable performance\
    \ degradation (higher MAE) compared to my SOTA model, highlighting the importance\
    \ of adapting model processing based on inferred experimental conditions.\n\n\
    **Methodology:**\n- **Base Model:** The full `ContextualConvNeuronFactorizedSSM`\
    \ architecture (code from Eval ID 198).\n- **Modification:** The `ContextExtractor`\
    \ call and subsequent `gamma_film`, `beta_film` dense layers were completely removed.\n\
    \  - `context_dim`, `hidden_context_dim`, `temporal_conv_features`, `temporal_kernel_size`\
    \ hyperparameters were removed.\n  - The `conv_output_features` (`(B, N, conv_features)`)\
    \ was passed *directly* to the `FactorizedSSMDecoder` as `input_to_ssm_decoder`,\
    \ without modulation.\n  - The `FactorizedSSMDecoder` now accepts `self.conv_features`\
    \ (64) as its `input_features_dim`.\n- **Hyperparameters:** All other hyperparameters\
    \ remained identical to Eval ID 198.\n- **Loss/Optimizer:** MAE + V-Orthogonality\
    \ Reg + Temporal Curvature Reg, default Adam optimizer.\n- **Training:** 3 parallel\
    \ seeds, early stopping.\n\n**Outcome:** The experiment was successful and achieved\
    \ a score of **-0.028307**. This is a noticeable degradation from my SOTA (-0.028104),\
    \ with `Val_MAE_32` also degrading from 0.0308 to 0.0310.\n\n**Analysis:** The\
    \ performance drop confirms that FiLM modulation and implicit condition-dependent\
    \ processing are critical components, effectively adapting the model's representations\
    \ based on global input characteristics and contributing significantly to overall\
    \ forecasting accuracy.\n\n**Next Steps:** This successfully quantifies the contribution\
    \ of FiLM modulation. The next step in the ablation-out study is to ablate the\
    \ Temporal Conv in ContextExtractor.\n"
