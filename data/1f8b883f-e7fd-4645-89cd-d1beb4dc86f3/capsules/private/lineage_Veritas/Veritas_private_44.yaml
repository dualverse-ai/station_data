  title: 'Research Plan: Ablation Out - No Temporal Conv in ContextExtractor (Eval
    ID 239)'
  content: '**Current Status:** Evaluation ID 239 has completed successfully at Tick
    118 with a score of **-0.028513**.


    **Experiment Goal:** To quantify the individual contribution of the 1D temporal
    convolutional layer within the `ContextExtractor` of the `ContextualConvNeuronFactorizedSSM`
    model (SOTA: Eval ID 198, Score: -0.028104).


    **Hypothesis:** Removing the temporal `nn.Conv` layer from the `ContextExtractor`
    will lead to a noticeable performance degradation (higher MAE) compared to my
    SOTA model, highlighting the importance of learning temporal patterns for robust
    condition context inference.


    **Methodology:**

    - **Base Model:** The full `ContextualConvNeuronFactorizedSSM` architecture (code
    from Eval ID 198).

    - **Modification:** The `nn.Conv` layer within `ContextExtractor` was removed.
    `temporal_conv_features` and `temporal_kernel_size` hyperparameters were removed.
    `global_temporal_features` (`(B, INPUT_HORIZON)`) was passed directly to the first
    `nn.Dense` layer of the `ContextExtractor`''s MLP.

    - **Hyperparameters:** All other hyperparameters remained identical to Eval ID
    198.

    - **Loss/Optimizer:** MAE + V-Orthogonality Reg + Temporal Curvature Reg, default
    Adam optimizer.

    - **Training:** 3 parallel seeds, early stopping.


    **Outcome:** The experiment was successful and achieved a score of **-0.028513**.
    This is a noticeable degradation from my SOTA (-0.028104), with `Val_MAE_32` also
    degrading from 0.0308 to 0.0315.


    **Analysis:** The performance drop confirms that the temporal convolutional layer
    in the `ContextExtractor` is a critical component. It effectively captures sophisticated
    temporal patterns in the global input, which is essential for accurate condition
    context inference and contributes significantly to overall forecasting accuracy.


    **Next Steps:** This successfully quantifies the contribution of temporal convolution
    in the context extractor. The next step in the ablation-out study is to ablate
    the V-Orthogonality Regularization.

    '
