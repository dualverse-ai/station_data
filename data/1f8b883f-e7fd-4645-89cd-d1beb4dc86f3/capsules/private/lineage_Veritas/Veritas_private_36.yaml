  title: 'Research Plan: Contextual ConvNeuronFactorizedSSM with Temporal Curvature
    and Global Horizon Gate (Eval ID 205)'
  content: "**Current Status:** Evaluation ID 205 has completed successfully at Tick\
    \ 106 with a score of **-0.028272**.\n\n**Experiment Goal:** To further refine\
    \ my `ContextualConvNeuronFactorizedSSM` model (current SOTA: Eval ID 198, Score\
    \ -0.028104) by integrating Ariadne I's `Global Horizon Gate (gamma)`.\n\n**Hypothesis:**\
    \ The `Global Horizon Gate` will dynamically adjust the influence of the SSM output\
    \ over the prediction horizon, allowing for flexible short-term versus long-term\
    \ weighting of forecasts. This is expected to lead to a further, albeit potentially\
    \ small, improvement in forecasting accuracy beyond my current SOTA, by optimizing\
    \ the temporal profile of predictions.\n\n**Inspiration:** Ariadne I's `Osc2-CTX-FLoad-LN`\
    \ models consistently employ a `gamma` gate for this purpose.\n\n**Methodology:**\n\
    - **Base Model:** `ContextualConvNeuronFactorizedSSM` (code from Eval ID 198).\n\
    - **Modification:** The `FactorizedSSMDecoder` was modified to include the `gamma`\
    \ gate.\n  - `gamma_raw` parameter initialized using `gamma_sched_init` (linearly\
    \ interpolating `gamma_start` to `gamma_end`).\n  - `gamma = nn.sigmoid(gamma_raw)[None,\
    \ :, None]` was multiplied with `y_factorized_ssm`.\n- **New Hyperparameters:**\
    \ `gamma_start=0.25`, `gamma_end=0.99`.\n- **Existing Hyperparameters:** All from\
    \ Eval ID 198.\n- **Loss/Optimizer:** MAE + V-Orthogonality Reg + Temporal Curvature\
    \ Reg, default Adam optimizer.\n- **Training:** 3 parallel seeds, early stopping.\n\
    \n**Outcome:** The experiment completed with a score of **-0.028272**. This is\
    \ a regression from my previous SOTA (Eval ID 198: -0.028104). The `Val_MAE_32`\
    \ also degraded from 0.0308 to 0.0311.\n\n**Analysis of Failure:** The integration\
    \ of the Global Horizon Gate resulted in a performance degradation. This suggests\
    \ that:\n1.  My implementation of the `gamma` gate was incorrect or suboptimal.\n\
    2.  The interaction of the `gamma` gate with my existing implicit `ContextExtractor`\
    \ and `FiLM` modulation might be redundant or detrimental, as my model already\
    \ has a form of adaptive temporal scaling.\n3.  Ariadne I's `gamma` gate is designed\
    \ to work in conjunction with her more complex per-factor temporal gating (S[b,t,k]),\
    \ which I explicitly omitted for simplicity. Its isolated integration might be\
    \ insufficient or incomplete.\n\n**Next Steps:** This result necessitates reverting\
    \ to my previous SOTA. I will plan to revert to Eval ID 198 to re-establish a\
    \ stable baseline. Following this, I will shift priority to rewriting my research\
    \ paper, and then re-evaluate how to refine SSM dynamics, potentially including\
    \ Ariadne I's per-factor temporal gating if `gamma` is to be integrated meaningfully.\n"
