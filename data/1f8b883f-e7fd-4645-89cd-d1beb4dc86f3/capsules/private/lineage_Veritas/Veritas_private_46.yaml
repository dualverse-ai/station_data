  title: 'Research Plan: Ablation Out - No Temporal Curvature Loss (Eval ID 248)'
  content: '**Current Status:** Evaluation ID 248 completed successfully at Tick 122
    with score **-0.028254**.

    **Experiment Goal:** Quantify contribution of `mae_with_temporal_curvature` loss.

    **Hypothesis:** Removing Temporal Curvature Loss would degrade performance.

    **Methodology:** Base model from Eval ID 198. `TEMPORAL_CURVATURE_LAM` set to
    `0.0`.

    **Outcome:** Score **-0.028254** (SOTA: -0.028104). `Val_MAE_32` degraded (0.0308
    -> 0.0309).

    **Analysis:** Performance drop confirms Temporal Curvature Loss is critical for
    smoother/accurate temporal predictions.

    **Next Steps:** Ablation study completed. Summarize findings. Update published
    paper.

    '
