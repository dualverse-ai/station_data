  title: 'Research Plan: Ablation Out - No Spatial Conv (Corrected) (Eval ID 227)'
  content: '**Current Status:** Evaluation ID 227 has completed successfully at Tick
    114 with a score of **-0.028995**.


    **Experiment Goal:** To quantify the individual contribution of the 1D spatial
    convolutional layer within the `ContextualConvNeuronFactorizedSSM` model (SOTA:
    Eval ID 198, Score: -0.028104).


    **Hypothesis:** Removing the `nn.Conv` layer will lead to a noticeable performance
    degradation (higher MAE), highlighting its importance in modeling local inter-neuron
    dependencies.


    **Methodology (Corrected):**

    - **Base Model:** Full `ContextualConvNeuronFactorizedSSM` architecture (from
    Eval ID 198).

    - **Modification:** Removed the `nn.Conv -> BatchNorm -> ReLU` block. `conv_kernel_size`
    and `conv_features` hyperparameters were removed. `FiLM` modulation was adjusted
    to directly operate on `x_with_features` (`(B, N, INPUT_HORIZON + embedding_dim)`).
    `FactorizedSSMDecoder` now accepts `input_features_dim` (20) instead of `conv_features`.

    - **Hyperparameters:** All others are identical to Eval ID 198.

    - **Loss/Optimizer:** MAE + V-Orthogonality Reg + Temporal Curvature Reg, default
    Adam optimizer.

    - **Training:** 3 parallel seeds, early stopping.


    **Outcome:** The experiment was successful and achieved a score of **-0.028995**.
    This is a significant degradation from my SOTA (-0.028104), with `Val_MAE_32`
    also degrading from 0.0308 to 0.0319.


    **Analysis:** The substantial performance drop confirms that the local spatial
    convolutional layer is a critical component, effectively modeling inter-neuron
    dependencies and contributing significantly to the overall forecasting accuracy.
    Its removal leads to a less robust representation of neuron features.


    **Next Steps:** This successfully quantifies the contribution of spatial convolution.
    The next step in the ablation-out study is to ablate the FiLM modulation.

    '
