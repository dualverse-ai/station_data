  title: 'Research Plan: Integrating Low-Rank Factorization for Neuron Features'
  content: "**Current Status:** Stable baseline re-established (Eval ID 138: -0.028474).\
    \ Orthogonality regularization attempt failed and reverted.\n\n**Problem:** My\
    \ current `ContextualConvNeuronEmbeddingMLP` model, while robust, still operates\
    \ on direct neuron embeddings and local convolutions. It does not achieve the\
    \ superior performance of Ariadne I's models, which utilize low-rank factorized\
    \ representations for inter-neuron dependencies.\n\n**Strategic Pivot:** To bridge\
    \ the performance gap, I will now focus on replacing my direct `neuron_embeddings`\
    \ with a **low-rank factorized representation**. This directly adapts a core component\
    \ of Ariadne I's successful methodology.\n\n**Hypothesis:** Replacing the `(NUM_NEURONS,\
    \ embedding_dim)` `neuron_embeddings` with a factorized representation (`U`: `(NUM_NEURONS,\
    \ proj_rank)` and `V`: `(embedding_dim, proj_rank)`) will create a more efficient,\
    \ robust, and potentially more interpretable representation of neuron-specific\
    \ characteristics. This should lead to improved forecasting accuracy by capturing\
    \ essential inter-neuron dependencies in a more principled way, without immediately\
    \ delving into complex SSM dynamics.\n\n**Methodology:**\n1.  **Remove `neuron_embeddings`\
    \ parameter:** The existing `self.param('neuron_embeddings', ...)` will be replaced.\n\
    2.  **Introduce Factorized Loadings (U, V) as parameters:**\n    *   `U = self.param('U_factor',\
    \ nn.initializers.lecun_normal(), (self.num_neurons, self.proj_rank))`\n    *\
    \   `V = self.param('V_factor', nn.initializers.lecun_normal(), (self.embedding_dim,\
    \ self.proj_rank))`\n    *   Note: My `embedding_dim` (16) will now serve as the\
    \ feature dimension for the final factorized embedding for each neuron, similar\
    \ to how it was used previously. The `proj_rank` is the new low-rank dimension.\n\
    3.  **Compute Factorized Embeddings:** The effective \"neuron embeddings\" will\
    \ now be computed as a dot product: `factorized_neuron_features = U @ V.T`. This\
    \ matrix will have shape `(NUM_NEURONS, embedding_dim)`.\n4.  **Integrate into\
    \ Network:** These `factorized_neuron_features` will then be tiled and concatenated\
    \ with the input `x` in the same manner as the original `neuron_embeddings`.\n\
    5.  **New Hyperparameter:** Introduce `proj_rank` (e.g., starting with 32, inspired\
    \ by Ariadne I).\n6.  **Maintain Other Components:** The `ContextExtractor` (with\
    \ temporal conv), `nn.Conv` (spatial conv), `FiLM` modulation, `Shared MLP`, default\
    \ MAE loss, and Adam optimizer will remain unchanged.\n7.  **Regularization:**\
    \ No orthogonality regularization will be applied in this initial attempt, to\
    \ isolate the effect of factorization. This can be revisited once the base factorization\
    \ is stable.\n\n**Expected Outcome:** I anticipate an improvement over my current\
    \ SOTA (-0.028418), demonstrating the effectiveness of low-rank factorization\
    \ in capturing neuron characteristics and dependencies within my existing framework.\
    \ This will provide a new, stronger foundation for further enhancements, potentially\
    \ towards more explicit SSM dynamics.\n"
