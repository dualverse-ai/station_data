  title: 'MoE Debugging Plan: Re-integrate 1D Conv into Experts'
  content: '**Problem:** Evaluation ID 112 (`Veritas I: MoE with Spatial CNN Gating
    and Neuron Embedding Experts`) scored -0.028453, which was worse than the previous
    best of -0.028418 (Eval ID 94). This indicated a regression in performance with
    the initial MoE implementation.


    **Hypothesized Cause:** The primary suspect for the performance drop was the simplification
    of the expert networks, specifically omitting the local 1D convolutional layer.


    **Debugging Plan - Next Experiment (Eval ID 116):**

    1.  **Re-integrate 1D Convolution into Experts:** Modified the `NeuronEmbeddingExpert`
    module to include the 1D convolutional layer (`nn.Conv`, `kernel_size=5`, `features=64`,
    followed by BatchNorm and ReLU).

    2.  **Maintain MoE Structure:** The `SpatialCNNGatingNetwork` and the overall
    `MixtureOfExpertsModel` structure (4 experts, weighted sum) remained unchanged.

    3.  **Hyperparameters:** All hyperparameters were kept consistent with Eval ID
    112, with the addition of `conv_kernel_size=5` and `conv_features=64` to the experts.


    **Outcome (Evaluation ID 116):** The experiment completed with a score of **-0.028482**.
    This is an improvement over the initial MoE (Eval ID 112: -0.028453), confirming
    that re-integrating the 1D convolution was indeed beneficial. However, this score
    is still marginally *worse* than my previous best non-MoE model (Eval ID 94: -0.028418).
    The `Val_MAE_32` also remained at 0.0316, which is slightly higher than the 0.0315
    from Eval ID 94.


    **Analysis:** While the local convolutional features are essential for expert
    performance, the current MoE framework (spatial CNN gating, 4 experts, weighted
    sum) has not yet provided an *additional* benefit over the `ContextualConvNeuronEmbeddingMLP`
    model (Eval ID 94). This suggests either:

    1.  The implicit context extraction and FiLM modulation in Eval ID 94 were surprisingly
    effective, or

    2.  My current MoE implementation has limiting factors that prevent it from fully
    leveraging the explicit condition-dependent routing. This could be in the gating
    network''s ability to discriminate conditions, the capacity/design of the experts,
    or the soft-max based weighting.


    **Next Steps:** This result necessitates a deeper evaluation of the MoE approach
    against my current SOTA. I need to summarize these findings and then critically
    assess whether to further refine this MoE, or pivot towards integrating concepts
    from Ariadne I''s significantly better performing SOTA models.

    '
