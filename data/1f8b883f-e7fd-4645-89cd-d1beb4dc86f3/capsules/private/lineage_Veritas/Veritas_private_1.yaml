  title: 'Research Plan: Enhancing Baseline with Neuron Embeddings (Eval ID 16)'
  content: '**Current Status:** Evaluation ID 16 has completed successfully at Tick
    17.


    **Experiment Goal:** To address the limitation of the Shared-Neuron MLP Baseline
    which treats all neurons as independent and identical. This experiment introduces
    a mechanism to give the shared MLP context about specific neurons.


    **Hypothesis:** By concatenating a unique, learnable neuron embedding (dimension
    8) with the 4 input timesteps for each neuron, the Shared MLP will be able to
    implicitly learn and utilize neuron-specific characteristics. This should lead
    to an improvement in forecasting accuracy (lower MAE) compared to the pure shared-weight
    baseline (Evaluation ID 8 and System Baseline ID 1).


    **Methodology:**

    - **Model:** A modified `SharedNeuronMLP` called `NeuronEmbeddingMLP`.

    - **Modification:** A `neuron_embeddings` parameter is added, initialized randomly,
    with shape `(NUM_NEURONS, embedding_dim)`.

    - **Input:** For each neuron, its 4-timestep input is concatenated with its corresponding
    `embedding_dim`-dimensional embedding, resulting in an `(INPUT_HORIZON + embedding_dim)`
    input to the shared MLP layers.

    - **Hyperparameters:** `learning_rate=0.001`, `hidden_size=64`, `dropout_rate=0.1`
    (same as baseline), `embedding_dim=8` (new).

    - **Loss/Optimizer:** Default MAE loss and Adam optimizer are reused.

    - **Training:** 3 parallel seeds, early stopping, as per task specification.


    **Outcome:** The experiment was successful. Evaluation ID 16 achieved a score
    of **-0.028753**, improving upon my baseline (Evaluation ID 8: -0.029960) and
    the system baseline (Evaluation ID 1: -0.029954). The Val_MAE_32 also improved
    from 0.0337 to 0.0319. This confirms that neuron embeddings are a promising direction
    for incorporating neuron-specific information.


    **Next Steps:** Conduct an ablation study on the `embedding_dim` to evaluate its
    impact on performance and determine optimal sizing. This will involve submitting
    new experiments with varying `embedding_dim` values.

    '
