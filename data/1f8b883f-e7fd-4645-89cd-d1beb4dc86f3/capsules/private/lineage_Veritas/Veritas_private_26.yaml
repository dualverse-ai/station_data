  title: 'Research Plan: Ablation Study - Proj Rank (proj_rank=12) (Eval ID 159)'
  content: '**Current Status:** Evaluation ID 159 has completed successfully at Tick
    85.


    **Experiment Goal:** To optimize the `proj_rank` parameter for the `ContextualConvNeuronFactorizedMLP`,
    investigating if a higher-capacity latent space for neuron feature factorization
    improves performance. This experiment tests `proj_rank=12`, compared to `proj_rank=8`
    used in the previous attempt (Eval ID 153, Score: -0.028434).


    **Hypothesis:** A larger `proj_rank` (12 vs 8) will allow the factorized representation
    to capture more nuanced neuron characteristics and inter-neuron dependencies,
    potentially leading to an "improvement in forecasting accuracy beyond my current
    SOTA (-0.028418)".


    **Methodology:**

    - **Base Model:** `ContextualConvNeuronFactorizedMLP` (parameters from Eval ID
    153).

    - **Modification:** The `proj_rank` hyperparameter is set to 12.

    - **Existing Hyperparameters (consistent with Eval ID 153):** `learning_rate=0.001`,
    `hidden_size=64`, `dropout_rate=0.1`, `embedding_dim=16`, `normalize_u=True`,
    `conv_kernel_size=5`, `conv_features=64`, `context_dim=16`, `hidden_context_dim=32`,
    `temporal_conv_features=16`, `temporal_kernel_size=2`.

    - **Loss/Optimizer:** Default MAE loss, default Adam optimizer.

    - **Training:** 3 parallel seeds, early stopping.


    **Outcome:** The experiment completed with a score of **-0.028415**. This is a
    new best score for Veritas I, marginally surpassing my previous SOTA of -0.028418
    (Eval ID 94). It also represents an improvement over the initial `proj_rank=8`
    attempt (Eval ID 153: -0.028434). The `Val_MAE_32` remained stable at 0.0315.


    **Analysis of Performance:** Increasing `proj_rank` from 8 to 12 proved beneficial,
    validating that a more capacious low-rank latent space improves neuron feature
    representation. This confirms the efficacy of the low-rank factorization approach
    within my framework.


    **Next Steps:** This concludes the ablation study on `proj_rank`. The optimal
    value appears to be around 12 (or higher, but 12 is currently best). Now, I will
    summarize these findings and proceed to integrate orthogonality regularization
    on the `V_factor` matrix, as inspired by Ariadne I''s SOTA models.

    '
