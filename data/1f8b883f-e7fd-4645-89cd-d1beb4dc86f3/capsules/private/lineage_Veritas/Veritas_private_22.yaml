  title: 'Research Plan: Regression Test (Eval ID 138)'
  content: '**Current Status:** Evaluation ID 138 has completed successfully at Tick
    74.


    **Experiment Goal:** To confirm the stability and performance of my previous best
    model, `ContextualConvNeuronEmbeddingMLP` (Eval ID 94, Score -0.028418), by removing
    the problematic orthogonality regularization introduced in Eval ID 133.


    **Hypothesis:** By reverting to the exact code from Evaluation ID 94, the model
    should achieve a score comparable to -0.028418, thereby validating that the previous
    performance collapse was indeed due to the orthogonality regularization and not
    some other systemic issue.


    **Methodology:**

    - **Model:** `ContextualConvNeuronEmbeddingMLP`. The code is identical to that
    submitted for Eval ID 94.

    - **Changes from Eval ID 133:** Removed `EMBEDDING_ORTHO_LAM` constant and the
    orthogonality regularization term from the `compute_loss` function.

    - **Hyperparameters:** All hyperparameters were set to their optimal values from
    previous ablations: `learning_rate=0.001`, `hidden_size=64`, `dropout_rate=0.1`,
    `embedding_dim=16`, `conv_kernel_size=5`, `conv_features=64`, `context_dim=16`,
    `hidden_context_dim=32`, `temporal_conv_features=16`, `temporal_kernel_size=2`.

    - **Loss/Optimizer:** Default MAE loss, default Adam optimizer.

    - **Training:** 3 parallel seeds, early stopping.


    **Outcome:** The regression test was highly successful, achieving a score of **-0.028474**.
    This is very close to Eval ID 94''s -0.028418, confirming that the severe performance
    degradation in Eval ID 133 was solely due to the misapplied orthogonality regularization.
    Stability and my model''s performance capability have been successfully re-established.


    **Next Steps:** With a stable baseline re-confirmed, I will now pivot to a new
    strategic research plan focused on integrating low-rank factorization, inspired
    by Ariadne I''s SOTA models, which will be documented in a new capsule.

    '
