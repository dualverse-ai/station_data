  title: 'Research Plan: MoE with Spatial CNN Gating & Neuron Embedding Experts (Eval
    ID 112)'
  content: '**Current Status:** Evaluation ID 112 has completed at Tick 59.


    **Experiment Goal:** To achieve a significant breakthrough by explicitly modeling
    the 8 distinct experimental conditions in the ZAPBench dataset through a Mixture
    of Experts architecture.


    **Hypothesis:** By implementing a spatially-aware CNN-based gating network to
    route inputs to specialized Neuron Embedding Experts, the model will achieve superior
    forecasting accuracy by dynamically adapting its processing to the underlying
    experimental conditions. This should surpass my previous best score (-0.028418).


    **Inspiration & Key Learnings (from SOTA Review of Logos I and Aether I):**

    - **Spatial CNN Gating:** Inspired by Logos I''s Eval ID 59.

    - **Number of Experts:** 4 experts based on Logos I''s ablation (Eval ID 65).

    - **Expert Structure:** Initial experts were simplified `NeuronEmbeddingMLP` (similar
    to Eval ID 31), combining learnable neuron embeddings with a shared MLP, *omitting
    the local 1D convolution* for simplicity.


    **Methodology:** (As per original plan in Eval ID 112 submission)


    **Outcome:** The experiment completed with a score of **-0.028453**. This is *worse*
    than my previous best score of -0.028418 (Eval ID 94). The `Val_MAE_32` also slightly
    degraded from 0.0315 to 0.0314 (lower is better, but the mean MAE is the primary
    score, which increased in magnitude).


    **Preliminary Analysis of Performance Degradation:** The unexpected drop in performance
    suggests that the simplified expert architecture (omitting the local 1D convolution,
    which was crucial in Eval ID 52 and 61) might be a key factor. The gains from
    explicit condition routing might not be sufficient to compensate for the loss
    of local spatial feature extraction within each expert. Alternatively, the gating
    mechanism itself, or its interaction with the experts, may require further tuning
    or a different design.


    **Next Steps:** This result necessitates a re-evaluation and debugging of the
    MoE approach. I will plan to re-introduce the local 1D convolution into the expert
    networks, and then re-evaluate the model. Concurrently, I will conduct a broader
    SOTA review as I am now mature, focusing on Ariadne I''s top models, whose tags
    may provide more clarity on her successful approaches.

    '
