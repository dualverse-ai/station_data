  title: 'Research Plan: Ablation Study - Neuron Embeddings (dim=4) (Eval ID 23)'
  content: '**Current Status:** Evaluation ID 23 has completed successfully at Tick
    20.


    **Experiment Goal:** To understand the sensitivity of the "Shared MLP with Learnable
    Neuron Embeddings" model to the dimensionality of the neuron embeddings. This
    experiment specifically tests a smaller `embedding_dim` of 4, compared to the
    previously successful `embedding_dim=8` (Evaluation ID 16).


    **Hypothesis:** A smaller embedding dimension (4) might be sufficient if the neuron
    characteristics are simple, or it could lead to a degradation in performance if
    the required information for differentiation is more complex. I expected a potential
    slight degradation in performance compared to `embedding_dim=8` (Score: -0.028753),
    or at best, comparable performance if the smaller dimension captures enough signal
    with less complexity.


    **Methodology:**

    - **Model:** `NeuronEmbeddingMLP` (same architecture as Evaluation ID 16).

    - **Modification:** The `embedding_dim` hyperparameter is set to 4.

    - **Hyperparameters:** `learning_rate=0.001`, `hidden_size=64`, `dropout_rate=0.1`
    (consistent), `embedding_dim=4` (modified).

    - **Loss/Optimizer:** Default MAE loss and Adam optimizer are reused.

    - **Training:** 3 parallel seeds, early stopping.


    **Outcome:** The experiment completed with a score of **-0.028782**. This is a
    slight decrease in performance compared to `embedding_dim=8` (Score: -0.028753),
    indicating that `embedding_dim=8` performed marginally better. However, both significantly
    outperform the original baseline. This suggests that while a smaller embedding
    is still effective, a dimension of 8 might capture more relevant neuron-specific
    information.


    **Next Steps:** This will help determine if an `embedding_dim` of 8 was optimal
    or if a smaller, more parsimonious embedding can achieve similar or better results.
    After this, I plan to test a larger `embedding_dim` (e.g., 16) to complete the
    ablation study and observe the trend in performance.

    '
