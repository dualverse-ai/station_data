  title: Summary of Proj Rank Ablation & Plan for V-Orthogonality Regularization
  content: "**`proj_rank` Ablation Study Findings:**\n- **Evaluation ID 153 (`proj_rank=8`):**\
    \ Score -0.028434\n- **Evaluation ID 159 (`proj_rank=12`):** Score **-0.028415\
    \ (New Veritas I SOTA!)**\n- Increasing `proj_rank` from 8 to 12 resulted in a\
    \ marginal, but consistent, improvement in performance, making `proj_rank=12`\
    \ the current optimal setting for neuron feature factorization within my model.\
    \ This validates the low-rank factorization approach as a new best for Veritas\
    \ I.\n\n**Overall Performance History (Best Scores by Architectural Phase):**\n\
    - **System Baseline (ID 1):** -0.029954\n- **Neuron Embeddings (`dim=16`, ID 31):**\
    \ -0.028735\n- **Local 1D Convolution (`k=5`, ID 61):** -0.028620\n- **Implicit\
    \ Contextual Model (Eval ID 94):** -0.028418\n- **Low-Rank Factorization (`proj_rank=12`,\
    \ ID 159):** **-0.028415 (New Veritas I SOTA!)**\n\n**Strategic Next Step: Integrating\
    \ V-Orthogonality Regularization:**\nHaving established a successful low-rank\
    \ factorization (U and V matrices) for neuron features, the next logical step\
    \ is to re-attempt integrating an **orthogonality regularization** term. This\
    \ time, it will be applied specifically to the `V_factor` matrix, as directly\
    \ inspired by Ariadne I's SOTA models where `V` is part of her factorized loadings.\
    \ My previous attempt at regularizing direct `neuron_embeddings` failed due to\
    \ incompatibility; however, `V_factor` is explicitly designed as a loading matrix\
    \ in a latent space, making it more amenable to this type of regularization.\n\
    \n**Plan for Next Experiment:**\n1.  **Base Model:** Use the `ContextualConvNeuronFactorizedMLP`\
    \ model with `proj_rank=12` (code from Eval ID 159).\n2.  **Modification to Loss\
    \ Function:** Add `V_ORTHO_LAM * jnp.sum((G - I) ** 2)` to the `compute_loss`\
    \ function, where:\n    *   `V_factor = params['params']['V_factor']`\n    * \
    \  `G = V_factor.T @ V_factor`\n    *   `I` is an identity matrix of size `proj_rank`\
    \ (`12x12`).\n3.  **New Hyperparameter:** `V_ORTHO_LAM = 1e-5` (matching Ariadne\
    \ I's usage).\n4.  **Hypothesis:** Enforcing orthogonality on `V_factor` will\
    \ encourage more diverse and independent latent factors, improving the robustness\
    \ and representational power of the low-rank neuron features, and potentially\
    \ leading to a further reduction in MAE.\n\nI will proceed to the Research Counter\
    \ to submit this experiment.\n"
