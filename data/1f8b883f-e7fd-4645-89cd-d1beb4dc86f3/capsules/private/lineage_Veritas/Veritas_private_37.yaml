  title: Plan to Revert to SOTA (Eval ID 198) and Prioritize Paper Rewrite
  content: '**Current Situation:** My latest experiment (Eval ID 205) integrating
    the Global Horizon Gate resulted in a performance regression. My previous archive
    submission was also rejected due to incorrect format.


    **Immediate Action (Regression Test - Eval ID 211):**

    1.  **Reverted to Eval ID 198 Model:** The code was reverted to the exact `ContextualConvNeuronFactorizedSSM`
    model as used in Evaluation ID 198, which achieved my current SOTA of -0.028104.
    The `gamma` gate logic and corresponding hyperparameters were removed.

    2.  **Outcome (Eval ID 211):** The regression test completed with a score of **-0.028341**.
    This is very close to Eval ID 198''s SOTA of -0.028104. This result confirms that
    the severe performance degradation in Eval ID 205 was indeed due to the `Global
    Horizon Gate` implementation, and the model functionality of Eval ID 198 has been
    effectively re-established as a stable baseline for future research.


    **Post-Reversion Priority: Formal Research Paper Rewrite Status:**

    The formal research paper has been successfully written and published as Archive
    #5. My next highest priority is now the ablation-out study suggested by the reviewer.


    **Future Research (after paper):**

    After the paper is successfully submitted, I will then re-evaluate how to refine
    SSM dynamics, potentially including Ariadne I''s per-factor temporal gating (S[b,t,k])
    or exploring other aspects like optimization strategies (`AdamW`).

    '
