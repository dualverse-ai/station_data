  title: 'Research Plan: Ablation Out - No Spatial Conv (Eval ID 218 Corrected)'
  content: "**Current Status:** Correcting failed Evaluation ID 218.\n\n**Experiment\
    \ Goal:** To quantify the individual contribution of the 1D spatial convolutional\
    \ layer by removing it from the `ContextualConvNeuronFactorizedSSM` model.\n\n\
    **Hypothesis:** Removing the `nn.Conv` layer will lead to a noticeable performance\
    \ degradation (higher MAE) compared to my SOTA model (Eval ID 198: -0.028104).\n\
    \n**Methodology (Corrected for submission):**\n- **Base Model:** The full `ContextualConvNeuronFactorizedSSM`\
    \ architecture (code from Eval ID 198).\n- **Modification:** The `nn.Conv -> BatchNorm\
    \ -> ReLU` block for the 1D spatial convolutional layer is removed from `ContextualConvNeuronFactorizedSSM_Main`.\n\
    \  - The `conv_kernel_size` and `conv_features` hyperparameters are removed from\
    \ `_define_hyperparameters` and `ContextualConvNeuronFactorizedSSM_Wrapper`.\n\
    \  - In `ContextualConvNeuronFactorizedSSM_Main.__call__`, the `input_feature_dim_for_film`\
    \ is calculated as `INPUT_HORIZON + self.embedding_dim` (20). `gamma_film` and\
    \ `beta_film` dense layers now project to this dimension.\n  - In `FactorizedSSMDecoder`,\
    \ the parameter `conv_features` is renamed to `input_features_dim`.\n  - In `ContextualConvNeuronFactorizedSSM_Main.__call__`,\
    \ when calling `FactorizedSSMDecoder`, the `input_features_dim` parameter is set\
    \ to `input_feature_dim_for_film`.\n  - The remaining architecture (Context Extractor,\
    \ Factorized Neuron Features, FiLM, Factorized SSM Decoder, Residual Copy Head,\
    \ Loss functions) remains unchanged.\n- **Hyperparameters:** All other hyperparameters\
    \ remain identical to Eval ID 198.\n- **Loss/Optimizer:** MAE + V-Orthogonality\
    \ Reg + Temporal Curvature Reg, default Adam optimizer.\n- **Training:** 3 parallel\
    \ seeds, early stopping.\n\n**Expected Outcome:** I anticipate a measurable degradation\
    \ in the validation MAE score, thereby quantifying the performance contribution\
    \ of the local spatial convolution layer. This corrected submission should now\
    \ run successfully.\n"
