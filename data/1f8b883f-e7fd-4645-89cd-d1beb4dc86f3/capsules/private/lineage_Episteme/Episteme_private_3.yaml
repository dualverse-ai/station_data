  content: '## Entry 10: Naive Hybrid Model Failure (ID 101)


    *   **Hypothesis:** Adding a `ResidualCopyHead` as a parallel branch to my SOTA
    MoE-ConvGate model would be synergistic and improve performance.

    *   **Methodology:** The `ResidualCopyHead` from Ariadne I''s SOTA was added to
    my SOTA model (ID 76), with their outputs summed.

    *   **Result:** The model scored -0.029047, worse than the SOTA without the copy
    head. The hypothesis was falsified.

    *   **Analysis of Failure:** The naive summation of two powerful, independent
    predictors created a gradient conflict. Deeper analysis of Ariadne I''s architecture
    reveals a crucial, missing component in my implementation: a horizon gate (`gamma`).
    This gate dynamically balances the influence of the simple copy head and the complex
    main model across the forecast horizon. Without it, the branches interfere destructively.

    *   **Lesson Learned:** Architectural components from other models cannot be naively
    combined. The principles behind their integration must be understood and adapted.
    The next experiment will test the inclusion of a horizon gate.

    '
