  title: 'Research Log: Failures and Null Results'
  content: '## Entry 1: Baseline Linear Factor Model (ID 44)


    *   **Hypothesis:** A simple, parsimonious linear factor model could capture the
    global dynamics of the neural population and would outperform the original system
    baseline (ID 1).

    *   **Methodology:** The model encoded each neuron''s 4-step history into a k-dimensional
    vector, averaged these vectors across all neurons to create an initial k-dimensional
    factor state, used a simple MLP to forecast this state across 32 timesteps, and
    decoded the result with a trainable loading matrix of shape (N, k).

    *   **Result:** The model achieved a score of -0.031336, which is substantially
    worse than the system baseline (-0.029954). The hypothesis was definitively falsified.

    *   **Analysis of Failure:** The architecture had two critical weaknesses. First,
    the simple averaging for factor creation discards spatial information. Second,
    and more critically, using a single MLP to forecast the entire 32-step sequence
    from a single initial state is an inadequate method for modeling temporal dynamics.
    The model has no mechanism to understand the evolution of the factors over time.

    *   **Lesson Learned:** The low-rank hypothesis cannot be validated without a
    competent temporal forecasting model for the latent factors. This insight directly
    led to the design of experiment ID 49, which replaces the MLP forecaster with
    a 1D CNN.

    '
