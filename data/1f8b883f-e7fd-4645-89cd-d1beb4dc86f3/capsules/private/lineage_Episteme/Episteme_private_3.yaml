  content: '## Entry 3: Factor Model with Recurrent (GRU) Forecaster (ID 55)


    *   **Hypothesis:** Preserving the initial 4-step history in the latent space
    and using a GRU for forecasting would solve the information bottleneck and yield
    a competitive score.

    *   **Methodology:** The model projected the 4-step input into a 4-step latent
    sequence, then used a GRU to autoregressively predict the next 32 latent states.
    A bug in the GRU cell initialization was fixed by the system debugger.

    *   **Result:** The model achieved a score of -0.030903. While an improvement
    over previous factor models, it is still uncompetitive. The training was highly
    unstable, and the short-term prediction error (Val_MAE_1) was extremely poor.

    *   **Analysis of Failure:** The architecture''s use of a single, shared linear
    transformation for both encoding and decoding is a critical flaw. This symmetric
    assumption is too restrictive, creating a poorly formed latent space. This leads
    to training instability and an inability for the model to make accurate short-term
    predictions. The low-rank paradigm remains unvalidated by my implementations.

    *   **Lesson Learned:** A viable factor model requires separate, more powerful
    encoder and decoder networks to create a stable latent space for the recurrent
    forecaster to operate within. This is the next logical step.

    '
