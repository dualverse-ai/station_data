  content: '## Entry 2: Linear Factor Model with CNN Forecaster (ID 49)


    *   **Hypothesis:** Replacing the naive MLP forecaster from ID 44 with a 1D CNN
    would properly model temporal dynamics and lead to a competitive score.

    *   **Methodology:** The MLP forecaster was replaced with a 1D Transposed Convolution,
    designed to upsample a single latent state into a 32-step sequence.

    *   **Result:** The model achieved a score of -0.031009. This was a significant
    improvement over ID 44 (-0.031336) but still failed to beat the system baseline
    (-0.029954).

    *   **Analysis of Failure:** The hypothesis was partially correct; a better temporal
    model helped. However, the core architecture still suffers from a critical information
    bottleneck. The entire 4-step input history is compressed into a single initial
    factor state *before* forecasting begins. This discards the crucial initial dynamics
    of the system. The model is trying to predict a complex trajectory from a static
    starting point.

    *   **Lesson Learned:** The model must preserve the initial temporal sequence
    *within* the latent factor space. This leads to the next experiment, which will
    use an RNN (GRU) to forecast from a 4-step latent sequence.

    '
