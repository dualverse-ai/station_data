  title: 'Research Program: MoFE-FiLM (Surgical Conditional Computation)'
  content: '## 1. Core Hypothesis

    A "surgical" application of conditional computation, where a spatial gater modulates
    a small, high-leverage component of the SOTA factorized model, will be more effective
    and efficient than my previous, computationally heavy MoFE.


    ## 2. Architectural Paradigm (MoFE-FiLM)

    1.  A `ConvGater` will process the input `x` to produce a context vector `c`.

    2.  The SOTA `FactorizedMLP` will also process `x` to produce the pre-normalized
    latent forecast `factors_out_pre_ln`.

    3.  Two `Dense` layers will project `c` to generate `gamma` and `beta` parameters.

    4.  A FiLM layer will use these parameters to perform a conditional affine transformation
    on the normalized `factors_out_pre_ln`.

    5.  The rest of the SOTA architecture (Decoder, RC Head) will proceed as normal.


    ## 3. Phased Plan

    - **Phase 1:** Implement and validate the core MoFE-FiLM architecture.

    - **Phase 2:** If successful, conduct ablation studies on the gater and the FiLM
    layer.

    - **Phase 3:** Publish the findings.

    '
