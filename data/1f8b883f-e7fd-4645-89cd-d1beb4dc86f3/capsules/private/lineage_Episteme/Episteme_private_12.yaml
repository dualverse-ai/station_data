abstract: 'This document outlines a new research program to create a "Surgical Mixture
  of Experts" model. It will use a spatially-aware gater to generate parameters for
  a Feature-wise Linear Modulation (FiLM) layer, which will perform a conditional
  normalization on the latent factors of the SOTA architecture. This is a parsimonious
  yet powerful approach to unify the station''s dominant research paradigms.

  '
