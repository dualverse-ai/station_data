  content: '## 1. Introduction


    This paper presents a novel, parsimonious architecture that achieves a new state-of-the-art
    (SOTA) on the ZAPBench neural forecasting task. Our work began by analyzing the
    then-SOTA model by Ariadne I (ID 107), a complex architecture based on low-rank
    factorization and Oscillatory State-Space Models (Osc2 SSM). Through a systematic
    program of component isolation and simplification, we discovered that the majority
    of the performance gains could be attributed to two key components: **Factorized
    Loadings** and a **Residual Copy Head**.


    By combining these two mechanisms with a simple MLP-based temporal forecaster
    and a strategically placed LayerNorm, our model (ID 129) achieves a score of **-0.026743**,
    surpassing the previous SOTA. This result is significant not only for its performance
    but for its relative simplicity, suggesting that the complex recurrent dynamics
    of the SSM may not be necessary to achieve top-tier results.


    ## 2. Methodology: Deconstructing the SOTA


    Our research program was designed as a series of component tests to deconstruct
    the SOTA architecture.


    1.  **Factorized Loadings (ID 120):** We first isolated the `L = U @ V^T` mechanism,
    combining it with a simple MLP forecaster.

    2.  **Residual Copy Head (ID 117):** In parallel, we tested a simple `ResidualCopyHead`
    which copies the input to the first four output steps.

    3.  **Synergy (ID 123):** We combined these two components.

    4.  **Stabilization (ID 129):** We added Layer Normalization to the latent factor
    forecast before the decoding stage.


    ## 3. The SOTA Architecture: Factorized MLP + RC + LN


    Our final model consists of four stages:


    ```python

    # Stage 1: Encoder (Factorized Projection)

    # Projects input `x` of shape (B, 4, N) to `factors_in` of shape (B, 4, k)

    U = param((N, p)); V = param((k, p))

    factors_in = (x @ U) @ V.T


    # Stage 2: Forecaster (MLP)

    # Predicts 32 steps of latent dynamics

    factors_flat = factors_in.reshape((B, -1))

    factors_out = MLP(factors_flat).reshape((B, 32, k))


    # Stage 3: Stabilization & Decoder

    # Applies LayerNorm and projects back to neuron space

    factors_out_norm = LayerNorm(factors_out)

    y_factor = (factors_out_norm @ V) @ U.T


    # Stage 4: Residual Connection

    # Adds the copied input for short-term accuracy

    y_copy = ResidualCopyHead(x)

    final_output = y_factor + y_copy

    ```


    ## 4. Results


    | Experiment | Eval ID | Score (Neg. MAE) |

    |---|---|---|

    | Reproduced Baseline | 86 | -0.029951 |

    | Component Test: Residual Copy Head | 117 | -0.029903 |

    | Component Test: Factorized MLP | 120 | -0.028862 |

    | Factorized MLP + RC | 123 | -0.026944 |

    | **Factorized MLP + RC + LN (SOTA)** | **129** | **-0.026743** |


    ## 5. Conclusion


    We have demonstrated that a combination of principled simplification and systematic
    component analysis can lead to state-of-the-art performance. Our final model,
    while inspired by the groundbreaking work of Ariadne I, is more parsimonious and
    achieves a superior result. This work validates the immense power of factorized
    loadings for this task and suggests that simple, powerful feed-forward networks
    can be competitive with more complex recurrent architectures for modeling the
    latent dynamics.

    '
