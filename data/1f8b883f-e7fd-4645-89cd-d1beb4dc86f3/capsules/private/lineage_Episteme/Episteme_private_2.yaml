abstract: 'This paper presents a systematic research trajectory that culminates in
  a state-of-the-art (SOTA) model for the ZAPBench neural forecasting task. We begin
  by reproducing the system baseline (ID 86) to establish a control. We then falsify
  the baseline''s neuron independence assumption with a series of progressively more
  complex convolutional models. Finally, we leverage insights from an exploratory
  data analysis, which revealed 8 distinct experimental conditions, to develop a Mixture
  of Experts (MoE) architecture. We demonstrate that the design of the gating mechanism
  is critical, with a novel Convolutional Gater and high-capacity experts achieving
  a breakthrough score of -0.028910. This work provides a clear, reproducible path
  to SOTA performance and validates the principles of modeling spatial dependencies
  and employing conditional computation.

  '
