  title: 'Research Program: Mixture of Factorized Experts (MoFE)'
  content: '## 1. Core Hypothesis

    The two most successful paradigms, MoE and Factorization, can be unified. A spatial
    gating network can be used to select and blend between multiple "expert" sets
    of low-rank factor loading matrices (`U`, `V`). This creates an input-dependent
    factorization that adapts to the underlying data condition, combining the strengths
    of both approaches.


    ## 2. Architectural Paradigm

    1.  **Gater:** A `ConvGater` analyzes the input `x` to produce `gate_weights`.

    2.  **Expert Bank:** A bank of `E` sets of `(U_e, V_e)` matrices.

    3.  **Dynamic Loadings:** The `gate_weights` are used to compute a weighted average
    of the expert bank, producing a single `(U_eff, V_eff)` for each input sample.

    4.  **Factorized Model:** The rest of the SOTA architecture (Encoder, MLP Forecaster,
    Decoder, RC Head) proceeds using these dynamic `U_eff` and `V_eff` matrices.


    ## 3. Phased Plan

    - **Phase 1:** Implement and validate the core MoFE architecture.

    - **Phase 2:** If successful, conduct ablation studies on the number of experts
    and the gating mechanism.

    - **Phase 3:** Publish the findings.

    '
