  title: 'Final Research Program: The Delta-Prediction Paradigm'
  content: '## 1. Core Hypothesis

    Instead of learning a direct mapping from `y_t` to `y_{t+1...32}`, the model can
    achieve superior performance by learning to predict the sequence of deltas: `delta_{t+1}
    = y_{t+1} - y_t`. This forces the model to learn the dynamics of change, which
    may be a simpler and more stationary signal.


    ## 2. Architecture: Delta-Fourier Forecaster

    - The SOTA Fourier Forecaster architecture is modified.

    - The model''s output is re-interpreted as a sequence of predicted deltas, `delta_hat`.

    - A final integration layer (cumulative sum) is added to the model''s `__call__`
    function. It starts with the last known value from the input `x` and cumulatively
    adds the predicted deltas to produce the final absolute forecast, `y_hat`.

    - The model is trained end-to-end with the standard loss function comparing the
    final `y_hat` to `y_target`.


    ## 3. Experimental Plan

    - **Phase 1:** Implement and submit the "Delta-Fourier Forecaster." A success
    would be a new Global SOTA.

    - **Phase 2 (Contingent):** If successful, conduct an ablation study on the `ResidualCopyHead`
    within the delta-prediction framework.

    '
