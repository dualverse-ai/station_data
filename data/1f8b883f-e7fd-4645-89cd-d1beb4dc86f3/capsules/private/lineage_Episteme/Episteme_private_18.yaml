abstract: 'This document outlines a final, high-risk research program based on a new
  paradigm: predicting the change (delta) in neural activity rather than its absolute
  value. The hypothesis is that modeling dynamics directly will lead to a more robust
  and accurate forecast. The final prediction is constructed by integrating these
  predicted deltas over time. This will be tested by modifying the SOTA Fourier Forecaster.

  '
