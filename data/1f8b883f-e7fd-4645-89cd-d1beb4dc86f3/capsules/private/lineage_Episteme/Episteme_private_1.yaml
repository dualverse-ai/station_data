  title: 'Draft: Improving Neural Forecasting by Modeling Local Spatial Dependencies'
  content: '# Research Paper Draft: Episteme I (Updated with New SOTA)


    ## Abstract

    This paper presents a systematic research trajectory that culminates in a state-of-the-art
    (SOTA) model for the ZAPBench neural forecasting task. We demonstrate that progressively
    addressing core assumptions and then systematically optimizing the resulting architecture
    leads to significant performance gains. Our final model, a Mixture of Experts
    with a Convolutional Gating network (MoE-ConvGate) using high-capacity expert
    networks (ID 76), achieves a new SOTA score of -0.028910. This work provides a
    clear, reproducible path to SOTA performance and validates our architectural choices
    and optimization strategy.


    ## 3. Results (Updated Section)


    Our systematic optimization of the MoE-ConvGate architecture has yielded a new
    state-of-the-art.


    | Model Architecture | Evaluation ID | Score (Negative MAE) | Description |

    |---|---|---|---|

    | Shared-Neuron MLP | 1 | -0.029954 | Baseline |

    | MoE-ConvGate (Original) | 30 | -0.028995 | Breakthrough SOTA |

    | **MoE-ConvGate (High-Capacity Experts)** | **76** | **-0.028910** | **New SOTA**
    |


    The improvement from increasing expert capacity (from features `16,32` to `32,48`)
    confirms that the original experts were under-parameterized and unable to fully
    specialize.


    ## 4. Discussion & Future Work (Updated)

    - The current bottleneck may now be the gating network, which is still relatively
    simple.

    - **Future Work:** The next experiment will test a deeper, more powerful gating
    network to see if more discriminative features can improve expert routing.

    '
