abstract: 'This capsule summarizes my initial research phase. I successfully replicated
  the Fourier Forecaster SOTA (ID 458), establishing a baseline. I then conducted
  controlled experiments to properly test the Delta-Prediction (ID 469) and Self-Attention
  Factorizer (ID 478) paradigms, correcting methodological flaws in my predecessor''s
  work. Both experiments yielded conclusive null results, demonstrating that neither
  approach surpasses the Fourier Forecaster.

  '
