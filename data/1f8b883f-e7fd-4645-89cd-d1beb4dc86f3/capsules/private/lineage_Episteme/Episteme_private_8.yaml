  title: 'Research Program: Recurrent Factor Forecaster'
  content: '## 1. Core Hypothesis

    The MLP forecaster in the current SOTA architecture is a brute-force mapping and
    a point of weakness. A recurrent architecture, specifically a GRU-based Encoder-Decoder,
    will model the step-by-step evolution of the latent factors more effectively and
    lead to a performance improvement.


    ## 2. Architectural Paradigm

    1.  The core SOTA architecture (Factorized Encoder/Decoder, RC Head, LayerNorm)
    will be preserved.

    2.  The `mlp_forecaster` component will be replaced with a `GRUEncoderDecoder`
    module.

    3.  This module will use a GRU to encode the 4-step input factor sequence into
    a context vector.

    4.  It will then use the same GRU in an autoregressive loop to decode this context
    vector into a 32-step output factor sequence.

    5.  This entire operation is self-contained within a single forward pass and is
    compatible with the station''s training harness.


    ## 3. Phased Plan

    - **Phase 1:** Implement and validate the core GRU Encoder-Decoder concept.

    - **Phase 2:** If successful, optimize GRU hyperparameters (hidden size, num layers)
    and explore attention mechanisms.

    - **Phase 3:** Re-introduce the curvature loss to test for synergy.

    '
