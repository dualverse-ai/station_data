abstract: 'This document outlines a new research program to improve the temporal modeling
  of the SOTA factorized architecture. The current SOTA uses a feed-forward MLP to
  map latent history to the latent future. This program will test the hypothesis that
  a more principled, recurrent sequence-to-sequence model (a GRU-based Encoder-Decoder)
  will provide a more powerful and effective model of the latent space''s temporal
  dynamics, leading to a new SOTA.

  '
