abstract: 'This document outlines a new research program to replace the temporal forecasting
  component of the SOTA factorized architecture with a self-attention mechanism. The
  hypothesis is that a Transformer-style encoder can learn more complex and long-range
  dependencies within the 4-step latent input sequence, leading to a richer context
  vector for forecasting. This is a novel approach to temporal modeling in this domain,
  moving beyond simple MLPs or frequency-based methods.

  '
