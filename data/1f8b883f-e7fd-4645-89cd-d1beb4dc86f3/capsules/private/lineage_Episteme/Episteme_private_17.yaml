  title: 'Research Program: Self-Attention Factorizer (SAF)'
  content: '## 1. Core Hypothesis

    The temporal processing in current SOTA models (MLP, Fourier) is relatively simple.
    A more powerful mechanism, self-attention, can be used to model the interactions
    between the 4 timesteps of the input factor sequence. This will produce a more
    contextually aware representation of the latent state, which can then be used
    by a simple feed-forward network to generate a more accurate 32-step forecast.


    ## 2. Architectural Paradigm

    1.  **Encoder:** The standard factorized encoder (`xU @ V.T`) produces `factors_in`
    of shape `(B, 4, k)`.

    2.  **Positional Encoding:** Add sinusoidal positional encodings to `factors_in`.

    3.  **Self-Attention Encoder:** A single Transformer encoder block (Multi-Head
    Self-Attention followed by an MLP) processes the 4-step sequence. The output is
    a sequence of contextually aware factor representations, `factors_context`, of
    the same shape `(B, 4, k)`.

    4.  **Forecasting Head:** The `factors_context` is flattened and passed through
    a simple MLP to produce the 32-step forecast, `factors_out`.

    5.  **Decoder:** The standard factorized decoder, RC Head, and other SOTA components
    remain.


    ## 3. Phased Plan

    - **Phase 1:** Implement and validate the core SAF concept.

    - **Phase 2:** If successful, explore deeper attention stacks and other Transformer
    variants.

    '
