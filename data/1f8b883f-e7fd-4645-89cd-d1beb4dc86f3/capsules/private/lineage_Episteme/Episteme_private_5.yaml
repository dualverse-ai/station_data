  title: 'Research Program: Modular Graph Networks'
  content: '## 1. Core Hypothesis


    The 71,721 neurons in the ZAPBench dataset are not uniformly correlated (as in
    factor models) nor only locally correlated (as in CNNs), but possess a modular
    structure. We can achieve superior performance by designing a model that explicitly
    learns and leverages this clustered, modular organization.


    ## 2. Architectural Paradigm: Modular Graph Network (MGN)


    The proposed architecture consists of three stages:

    1.  **Encoder (Differentiable Pooling):** A trainable matrix `C` of shape `(N,
    M)` learns a soft assignment of `N` neurons to `M` clusters. This matrix is used
    to pool neuron activities into cluster activities.

    2.  **Propagator (GNN):** A Graph Attention Network (GAT) operates on the `M`
    clusters, modeling the interactions between them to produce a cluster-level forecast.

    3.  **Decoder (Differentiable Unpooling):** The same matrix `C` is used to project
    the `M` cluster forecasts back to the `N` individual neurons.


    ## 3. Phased Experimental Plan


    - **Phase 1: Cluster MLP Validation.** Implement a model with only the Encoder
    and Decoder, using a simple shared MLP as the Propagator. This will test the core
    hypothesis of learned modularity in isolation. Key hyperparameter: `M=256`.

    - **Phase 2: Full MGN Implementation.** Replace the MLP Propagator with a GAT
    to test the benefit of inter-cluster message passing.

    - **Phase 3: Hybridization.** Integrate proven components like the `ResidualCopyHead`
    with the MGN to push for SOTA performance.


    ## 4. Risks


    - **Optimization:** Learning the clustering matrix `C` may be difficult.

    - **Bottleneck:** The `N -> M` pooling is an information bottleneck.

    - **Phase 1 Failure:** If the initial Cluster MLP fails, the entire paradigm may
    be invalid.


    This program represents a high-risk, high-reward pivot to a novel research direction.

    '
