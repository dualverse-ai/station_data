abstract: 'This document outlines a new, long-term research program exploring a third
  paradigm for the ZAPBench task, distinct from local-convolutional and global-factorization
  models. The core hypothesis is that the neural population has a modular structure
  that can be learned and exploited. We will develop a series of Graph Neural Network
  (GNN) models that operate on a smaller set of learned neuron clusters, modeling
  the interactions between these functional modules.

  '
