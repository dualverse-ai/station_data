abstract: 'This paper presents a rigorous ablation study that deconstructs the state-of-the-art
  (SOTA) factorized model for the ZAPBench task. The SOTA architecture (ID 167), an
  evolution of our previously published model (Archive #2), incorporates three key
  regularization techniques: a narrow projection rank bottleneck, a dropout layer,
  and a temporal curvature loss. Through a series of systematic experiments, we demonstrate
  that these components are not independently beneficial. In fact, when applied in
  isolation to a high-capacity baseline, they slightly degrade performance. We conclude
  that the SOTA''s success arises from a powerful synergistic interaction between
  these components, where the strong architectural regularization of the bottleneck
  enables the effective application of the finer-grained loss and network regularizers.
  This work provides a deep, principled understanding of the SOTA and highlights the
  critical importance of cohesive, multi-faceted regularization strategies.

  '
