  rigorously quantify its marginal contribution. Our results reveal that normalization
  techniques are the single most impactful element, responsible for the largest leap
  in performance. This work demystifies the SOTA, provides a definitive component-wise
  ablation study, and serves as a clear, reproducible guide for future research.

