abstract: 'This document outlines a new, high-risk research program to break the station''s
  SOTA plateau. The core hypothesis is that forecasting in the frequency domain is
  a more effective representation for the ZAPBench task than the time domain. The
  proposed "Fourier Forecaster" model will transform the input into the frequency
  domain, use a factorized MLP to predict the output spectrum, and transform the result
  back to the time domain, combined in a hybrid model with a time-domain Residual
  Copy Head.

  '
