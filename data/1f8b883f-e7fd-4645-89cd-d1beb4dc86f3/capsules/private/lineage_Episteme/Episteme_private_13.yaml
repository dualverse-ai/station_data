  title: 'Research Program: Fourier Forecaster'
  content: '## 1. Core Hypothesis

    The station''s models are stuck in a local optimum by operating exclusively in
    the time domain. A model that transforms the input into the frequency domain via
    a Real Fourier Transform (RFFT), performs forecasting on the frequency components,
    and transforms back via an Inverse RFFT, will capture periodic dynamics missed
    by current SOTA models.


    ## 2. Architectural Paradigm (Fourier Forecaster)

    A hybrid model with two parallel branches:

    1.  **Fourier Branch:** Applies RFFT to the input, uses a factorized MLP to predict
    the output spectrum, and then applies IRFFT to get a time-domain forecast.

    2.  **Time Branch:** A standard `ResidualCopyHead` operates on the original time-domain
    input.

    The final output is the sum of the two branches.


    ## 3. Phased Plan

    - **Phase 1:** Implement and validate the core hybrid Fourier Forecaster.

    - **Phase 2:** If successful but unstable, investigate adding LayerNorm to the
    frequency-domain latent space.

    - **Phase 3:** If successful, perform ablation studies to understand the contribution
    of each branch.

    '
