pruned_dialogue_ticks:
- ticks: 8-25
  summary: 'Transition from shared-MLP baseline to structured, cross-neuron forecasting
    with low-rank factors and residual copy, then LDS and oscillatory SSMs.

    Key submissions and outcomes:

    - ID 3 (tick 8): Low-Rank Factor Forecaster (k=16) → score -0.030063 (worse than
    baseline).

    - ID 5 (tick 11): Residual Copy + Low-Rank (RC-LR, k=32) → -0.027614; strong short-horizon
    via copy head.

    - ID 7 (tick 12): Early RC-DiagLDS variant failed (NaN) → fixed in ID 11.

    - ID 11 (tick 14): RC-DiagLDS (stable a^t) → -0.027541.

    - ID 12 (tick 14): RC-DiagLDS + OrthoReg + GradClip → -0.028268 (regularization
    hurt).

    - ID 14 (tick 15): RC-DualDecay (two timescales) → -0.027506.

    - ID 19 (tick 16): Horizon-weighted MAE (DiagLDS) → -0.027570 (no improvement).

    - ID 20 (tick 17): DualDecay + curvature → -0.027456 (better long-horizon stability).

    Oscillatory SSM exploration (k↑):

    - ID 21 (tick 18-19 phase): DualDecay k=96 + stronger gating → -0.027484.

    - ID 25 (tick 20): DualDecay k=128 + per-factor temporal gating → -0.027454.

    - ID 26 (tick 21): Adaptive Dual-Decay (input-adaptive S[b,t,k]) → -0.027414 (best
    in this phase).

    - ID 29/32 (tick 22): Contextual mixture + 2nd-order copy head; and follow-up
    → -0.027362 / -0.027320.

    - ID 33 (tick 23): Oscillatory 2nd-order SSM (Osc2-ADG) → -0.027302.

    - ID 36 (tick 24): Osc2-CTX (context-adaptive oscillatory SSM) → -0.027294.

    - ID 37 (tick 25): Lower curvature (5e-5) → -0.027304 (no gain).

    Insights: Residual copy strongly anchors t=1–4; DualDecay/oscillatory dynamics
    improve longer horizons; naive orthogonality/loss reweighting can regress; curvature
    (λ=1e-4) is a solid default.

    '
- ticks: 27-35
  summary: 'Factorized neuron loadings L = U@V^T introduced (models_fact) to enable
    larger factor capacity with efficient projections; ablations and capacity sweeps.

    Results:

    - ID 38 (k=256, p=32) → -0.027138 (clear gain v. non-factorized).

    - ID 40 (No increment MLP ablation) → -0.027635 (degraded; increment MLP is necessary).

    - ID 41 (k=256, p=48) → -0.027155.

    - ID 43 (k=256, p=24) → -0.027132.

    - ID 47 (k=320, p=40) → -0.027099.

    - ID 48 (k=320, p=32) → -0.027052.

    - ID 51 (k=320, p=48) + V-orthogonality on V → -0.027031 (reduces basis redundancy;
    new best).

    - ID 54 (k=352, p=32) → -0.027085 (slight gain vs 320/40 but worse than 320/32+V-ortho).

    Submissions queued near end of this block:

    - ID 57/58 (k=320, p=32) with V-OrthoReg (λ=1e-5) and mild horizon weighting,
    to test basis diversity and late-step emphasis (results arrived later).

    Takeaways: Best regime consolidates at k≈320, p≈32–48 with V-OrthoReg; removing
    increment head is harmful; factorized loadings are key to unlocking capacity.

    '
- ticks: 36-39
  summary: 'Fine-tuning around best capacity (k=320, p=32). Orthogonality and gamma
    schedule sweeps.

    - ID 57 (k=320, p=32, V-OrthoReg λ=1e-5) → -0.027011 (strong improvement over
    no-ortho).

    - ID 58 (mild horizon weighting) → -0.027104 (did not help).

    Orthogonality strength sweep:

    - ID 63 (λ=5e-6) → -0.027082 (weaker; worse).

    - ID 64 (λ=2e-5) → -0.027024 (slightly worse than λ=1e-5).

    Gamma schedule sweep at best capacity (with V-OrthoReg λ=1e-5):

    - ID 68 (γ_end=0.95) → -0.027081.

    - ID 67 (γ_end=0.99) → -0.026976 (best to date; Val_MAE_32=0.0288; also improved
    early steps: Val_MAE_1=0.0199, t=4=0.0232, t=8=0.0260).

    Summary: Current SOTA in this line is Osc2-CTX-FLoad (k=320, p=32) + V-OrthoReg
    (λ≈1e-5) + γ_end≈0.99 with MAE ≈ 0.02698 (score ≈ -0.02698). Next: confirm stability
    across seeds; consider minor increments capacity (H=96) and small γ sweeps around
    0.99.

    '
- ticks: 41-47
  summary: 'Architectural explorations on factorized oscillatory SSMs:

    - Context-adaptive dynamics (Osc2-CTX-FLoad+, H=96) → ~−0.027076.

    - Mean+velocity context (FLoad++) → −0.027017.

    - Mixture-of-Oscillators per factor (MoOsc, Q=3) → −0.027023; time‑varying MoOsc
    gating (MoOsc‑T) → −0.026995.

    - Mixture-of-Loadings (MoL, J=2) → −0.027058.

    - Copy‑decay gate + increment dropout + U/V‑ortho (DG) degraded strongly → −0.027787.

    - γ_end sweeps (0.95/0.99/1.00/0.985) around the prior best confirmed earlier
    non‑LN best remained ~−0.026976 (ID 67).

    '
- ticks: 49-51
  summary: 'LayerNorm (LN) breakthrough:

    - Fixed Flax LayerNorm API via debugger and added LN across factor dim → −0.026910
    (ID 92).

    - Widened increment MLP to H=96 → new best −0.026901 (ID 95).

    - Set up further sensitivity: γ_end and capacity (p) with LN.

    '
- ticks: 52-59
  summary: 'LN ablations and sweeps:

    - γ_end=0.995 with LN → −0.026941 (ID 99).

    - AdamW (wd=1e−4) with LN, H=96 → −0.026846 (ID 100).

    - p‑sweep with LN, H=96: p=36 → −0.026843; p=32 → −0.026901; p=40 → −0.026921;
    p=28 → −0.026968.

    - Stability tweak a_max=0.993 with LN, H=96 → new SOTA −0.026768 (ID 107).

    - AdamW + a_max=0.993 → −0.026893 (ID 113).

    - Baseline re‑run (system defaults) queued (ID 115) to satisfy paper requirement;
    archive revision prepared.

    '
- ticks: 61-65
  summary: 'Baseline and publication + analysis export:

    - Baseline ID 115 completed: mean MAE 0.029964; step MAEs t=1..32: 0.0199, 0.0239,
    0.0275, 0.0313, 0.0337.

    - Archive paper revised with baseline and acronym legend; accepted 9/10.

    - Implemented analysis_utils and submitted best LN config with complete() exporting
    U/V/γ/s_alpha/s_beta, norms/coherence, JSON summaries to storage/ariadne/analyses/ln_best_a0993_H96/trial_*.

    - Analysis run (ID 119) produced artifacts for all seeds and scored ~−0.026987
    (no new SOTA; current best remains ID 107 at −0.026768).

    '
- ticks: 66-74
  summary: "Invariance and recurrence ablations + initial latent-export plan.\nKey\
    \ results (3-seed means):\n- V-normalized forward (ID 140): −0.026825 (best seed\
    \ 0.026724). Helped stability, not surpassing ID 107 (−0.026768).\n- LN-before-gating\
    \ + V-normalized (IDs 145/146): −0.026908 / −0.027028 — regressed; LN-after-gating\
    \ preferred.\n- Minimal recurrence tests:\n  * Diag1 (ID 148): −0.026943\n  *\
    \ No recurrence (ID 149): −0.026956\n  → Recurrence not critical; increment+gates+LN\
    \ carry most performance but still below ID 107.\n- AdamW+cosine and γ prior did\
    \ not help (IDs 124, 132 ~ −0.0270 / −0.02689).\n- Conclusion: Structural invariances\
    \ matter; recurrence pays little. Pivot path: keep factorized loadings + LN with\
    \ careful gating; consider parsimony baseline family if no gains.\n- Latent export\
    \ prepared by instrumenting sow of factors_preln, factors_out, S, γ; full-val\
    \ export job launched as ID 155.\n"
- ticks: 76-91
  summary: "Experiments, ablations, hybrid models, and latent-spectrum analyses beyond\
    \ LN-SSM baseline.\nKey results (3-seed means unless noted):\nLN-SSM family (LayerNorm\
    \ after gating; factorized loadings):\n- Best to date remains ID 107: Osc2-CTX-FLoad-LN\
    \ (k=320,p=32,H=96, a_max=0.993, γ_end=0.99) → −0.026768.\n- V-normalized forward\
    \ (ID 140) → −0.026825 (no gain).\n- LN-before-gating (IDs 145/146) → −0.026908\
    \ / −0.027028 (regressed).\n- AdamW+cosine LR with warmup (ID 174) → −0.027030\
    \ (regressed).\n\nRecurrence ablations (showing recurrence not critical under\
    \ LN+gates):\n- MinRec-Diag1 (ID 148) → −0.026943\n- No recurrence, increment-only\
    \ (ID 149) → −0.026956\n\nHybrid specialist–generalist models (SSM + low-freq\
    \ trend with per-factor mix):\n- Hybrid TrendMix (static mix m[b,k]) (ID 160)\
    \ → −0.026876\n- Hybrid TrendMix V-normalized, p=36 + AdamW (ID 164) → −0.026863\
    \ (best hybrid)\n- Hybrid TrendMix p=34 V-normalized + AdamW (ID 168) → −0.026881\n\
    - Time-dependent mix m_t[b,t,k] (ID 169) → −0.026981 (worse than static mix)\n\
    \nLatent exports and analyses:\n- Full-val latent export for LN-SSM (ID 155):\
    \ factors_out, factors_preln, S_gate, gamma at:\n  storage/ariadne/analyses/latents/ln_ssm_k320_p32_H96_a0.993_g0.99/trial_{seed}/\n\
    - Hybrid TrendMix latent export (ID 162): f_ssm, f_trend, factors_out, mix_gate\
    \ m, S_gate, gamma at:\n  storage/ariadne/analyses/latents/hybrid_trendmix_k320_p32_H96_a0.993_g0.99/trial_{seed}/\n\
    - Spectral analysis (test-only) initial (ID 170) and de-meaned v2 (ID 177):\n\
    \  Reports saved to storage/ariadne/analyses/reports/latent_spectrum_ln_vs_hybrid.json\n\
    \  and ..._demeaned.json. Findings: hybrid internals separate cleanly (f_ssm high-freq;\
    \ f_trend low-freq; mean mix ≈0.49).\n  LN-SSM factors_out spectrum depends on\
    \ gating/gamma; de-meaning clarifies frequency content.\n\nTakeaways:\n- The LN-SSM\
    \ baseline with a_max≈0.993, γ_end≈0.99 remains the strongest (−0.026768).\n-\
    \ V-normalization, LN-before-gating, cosine LR, and time-dependent hybrid mixing\
    \ did not improve SOTA.\n- Hybrid TrendMix is competitive (~−0.02686–−0.02688)\
    \ but below best LN-SSM and Episteme’s MLP (−0.026743).\n- Latent exports and\
    \ de-meaned spectral reports provide actionable diagnostics for future design.\n"
- ticks: 92-109
  summary: 'Consolidated LN-SSM analyses and sweeps; plateau at ~−0.02683–−0.02691
    vs MLP SOTA −0.026612 (Aether, ID 167; re-run ID 212: −0.026612).

    Key results (3-seed means):

