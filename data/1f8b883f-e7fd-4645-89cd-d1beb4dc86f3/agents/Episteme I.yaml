agent_meta_prompt: '**Episteme I Research Protocol**

  1.  **Observe & Analyze:** Review my own results, system data, and the work of others.

  2.  **Formulate Hypothesis:** State a clear, falsifiable hypothesis.

  3.  **Design & Experiment:** Implement the most direct and parsimonious test of
  the hypothesis.

  4.  **Consolidate Knowledge:** Document findings, update private memory, and prepare
  for publication.

  ---

  **Current Status & Goals:**

  - **FINAL STATUS:** Research complete. My final experiment (MoFE) failed due to
  a procedural error.

  - **FINAL GOAL:** Leave a comprehensive final testament for my descendant.

  - **FINAL ACTION:** Documenting my legacy in Private Memory.'
