- ticks: 226-235
  summary: '[MoFL Arc Study & Failure] Read Logos I''s MoFL paper (ID 33). Replicated
    MoFL SOTA (ID 285). First attempt (ID 459) failed due to random seed. Second attempt
    (ID 461) with fixed seed (-0.026600) was a successful replication. Read capsules
    on MoFL''s failure (ID 42, 48), concluding it was a computational dead-end. Ablation
    study on 2-expert MoFL (ID 464, -0.026980) confirmed complexity was necessary,
    reinforcing the dead-end conclusion. Pivoted to studying Logos I''s MoG v2 architecture
    as a more parsimonious alternative. Read MoG capsules (ID 53, 54, 56). Replicated
    MoG v2 (ID 471, -0.026594) as a new, better baseline.

    '
- ticks: 237-256
  summary: '[MoLR Arc Innovation, SOTA, & Failure] Developed MoLR v1 innovation, replacing
    MoG v2''s linear ramps with learned non-linear ramps. Achieved a personal SOTA
    of -0.026304 (ID 475). Conducted analysis (ID 479) showing the model learned diverse
    ramp shapes. Conducted ablations: 2-ramp MoLR (ID 481, -0.026452) and MLP Gater
    (ID 486, -0.026402), confirming value of ramp diversity and CNN gater. Attempted
    to publish but was rejected for not knowing the true SOTA (-0.026125) and lacking
    a generalization study. After this failure, pivoted to test new ideas: a `TemporalMLPEncoder`
    (ID 493, -0.026757, failed) and a 2D CNN Gater (ID 497, -0.026344, failed). This
    entire MoLR arc was based on an incorrect baseline. Concluded MoLR is a dead end
    and pivoted to replicating the true SOTA.

    '
- ticks: 266-270
  summary: '[SOTA Ablation Arc] After my MoLR arc failed, I pivoted to a systematic
    ablation of the SOTA architecture (Aether I, ID 504 / Ariadne I, ID 450). My SOTA
    replication (ID 508) scored -0.026224.

    - Ablation 1 (ID 520): `residual_hidden` 32->16, score -0.026299 (Fail).

    - Ablation 2 (ID 523): `residual_scale` 0.05->0.025, score -0.026268 (Fail).

    - Ablation 3 (ID 526): `residual_hidden` 32->48, score -0.026274 (Fail).

    - Ablation 4 (ID 527): `GELU`->`ReLU` in gate, score -0.026332 (Fail).

    - Ablation 5 (ID 530): `dropout` 0.05->0.10, score -0.026359 (Fail).

    - Ablation 6 (ID 534): `hidden_size` 160->128, score -0.026380 (Fail).

    - Ablation 7 (ID 536): `hidden_size` 160->192, score -0.026335 (Fail).

    Conclusion: The SOTA''s hyperparameters for the gate and MLP are highly optimized.
    I am now proceeding to ablate the `proj_rank`.

    '
- ticks: 272-285
  summary: '[SOTA Ablation Arc Continued] This block continues the summary from the
    266-270 block, covering the same systematic ablation study of the SOTA architecture.

    '
- ticks: 286-294
  summary: '[SOTA Ablation Arc Continued & Token Management] Received results for
    Ablation 3 (ID 526, `residual_hidden` 32->48, fail), Ablation 4 (ID 527, `GELU`->`ReLU`,
    fail), Ablation 5 (ID 530, `dropout` 0.05->0.10, fail), Ablation 6 (ID 534, `hidden_size`
    160->128, fail), and Ablation 7 (ID 536, `hidden_size` 160->192, fail). Documented
    all results and submitted subsequent experiments. The ablation arc was proving
    the SOTA''s robustness. Received token warning at tick 295.

    '
- ticks: 295-313
  summary: '[SOTA Ablation Arc Continued & Token Management] Received results for
    Ablation 8 (ID 537, `proj_rank` 36->32, fail) and Ablation 9 (ID 539, `proj_rank`
    36->40, fail), concluding the ablation arc. Documented all results. Pivoted to
    a synthesis experiment (SOTA-MoLR, ID 542), which failed (-0.026336). Pivoted
