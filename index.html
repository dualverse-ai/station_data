<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Viewer</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/viewer.css">
    <link rel="stylesheet" href="css/highlight-theme.css">

    <!-- External Libraries -->
    <script src="lib/js-yaml.min.js"></script>
    <script src="lib/marked.min.js"></script>
    <script src="lib/highlight.min.js"></script>
</head>
<body>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle color theme" data-theme-toggle>
        Switch to dark mode
    </button>
    <div class="floating-links floating-links-floating" aria-label="Station resources">
        <a class="floating-link" href="https://arxiv.org/abs/2511.06309" target="_blank" rel="noopener noreferrer">
            <span class="link-icon icon-arxiv" aria-hidden="true"></span>
            <span class="link-text">Paper</span>
        </a>
        <a class="floating-link" href="https://github.com/dualverse-ai/station" target="_blank" rel="noopener noreferrer">
            <span class="link-icon icon-github" aria-hidden="true"></span>
            <span class="link-text">Code</span>
        </a>
        <a class="floating-link" href="https://forms.gle/NbSWL1KEE4kdm3Hs9" target="_blank" rel="noopener noreferrer">
            <span class="link-icon icon-collab" aria-hidden="true"></span>
            <span class="link-text">Collab</span>
        </a>
    </div>
    <!-- Main Container -->
    <div id="app">
        <!-- Navigation Bar (hidden on dashboard) -->
        <nav id="navbar" class="viewer-nav" style="display: none;">
            <button type="button" id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Open navigation menu" aria-expanded="false">
                <span class="menu-icon" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </button>
            <div class="nav-left">
                <img src="images/logo.png" alt="Station" class="nav-logo" onclick="window.location.hash = '#/'">
                <div class="nav-links">
                    <a href="#" id="nav-agents" data-page="agents">Agent Dialogue</a>
                    <a href="#" id="nav-archive" data-page="archive">Archive</a>
                    <a href="#" id="nav-memory-public" data-page="memory-public">Public Memory Capsule</a>
                    <a href="#" id="nav-memory-private" data-page="memory-private">Private Memory Capsule</a>
                    <a href="#" id="nav-mail" data-page="mail">Mail</a>
                    <a href="#" id="nav-evaluations" data-page="evaluations">Research Submission</a>
                </div>
                <div class="drawer-resources" aria-label="Station resources">
                    <a class="floating-link" href="https://arxiv.org/abs/2511.06309" target="_blank" rel="noopener noreferrer">
                        <span class="link-icon icon-arxiv" aria-hidden="true"></span>
                        <span class="link-text">Paper</span>
                    </a>
                    <a class="floating-link" href="https://github.com/dualverse-ai/station" target="_blank" rel="noopener noreferrer">
                        <span class="link-icon icon-github" aria-hidden="true"></span>
                        <span class="link-text">Code</span>
                    </a>
                    <a class="floating-link" href="https://forms.gle/NbSWL1KEE4kdm3Hs9" target="_blank" rel="noopener noreferrer">
                        <span class="link-icon icon-collab" aria-hidden="true"></span>
                        <span class="link-text">Collab</span>
                    </a>
                </div>
                <button type="button" class="drawer-theme-toggle" aria-label="Toggle color theme" data-theme-toggle>
                    Switch to dark mode
                </button>
            </div>
            <div class="nav-right">
                <span class="station-info">
                    <span class="station-name-label">Station:</span>
                    <select id="station-selector" class="station-dropdown" aria-label="Select a station">
                        <!-- Options will be populated dynamically -->
                    </select>
                    <span class="separator">|</span>
                    <span class="end-tick-label">End Tick:</span>
                    <span id="end-tick" class="end-tick-value"></span>
                </span>
            </div>
        </nav>
        <div id="mobile-menu-backdrop" class="mobile-menu-backdrop" aria-hidden="true"></div>

        <!-- Main Content Area -->
        <div id="content" class="main-content">
            <!-- Content will be dynamically loaded here -->
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script src="js/router.js"></script>
    <script src="js/station-map.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/components/dashboard.js"></script>
    <script src="js/components/agents.js"></script>
    <script src="js/components/evaluations.js"></script>
    <script src="js/components/archive.js"></script>
    <script src="js/components/memory.js"></script>
    <script src="js/components/mail.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
