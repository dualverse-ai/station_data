<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Viewer</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/viewer.css">
    <link rel="stylesheet" href="lib/highlight-dark.min.css">

    <!-- External Libraries -->
    <script src="lib/js-yaml.min.js"></script>
    <script src="lib/marked.min.js"></script>
    <script src="lib/highlight.min.js"></script>
</head>
<body>
    <!-- Main Container -->
    <div id="app">
        <!-- Navigation Bar (hidden on dashboard) -->
        <nav id="navbar" class="viewer-nav" style="display: none;">
            <div class="nav-left">
                <img src="images/logo.png" alt="Station" class="nav-logo" onclick="window.location.hash = '#/'">
                <div class="nav-links">
                    <a href="#" id="nav-agents" data-page="agents">Agent Dialogue</a>
                    <a href="#" id="nav-archive" data-page="archive">Archive</a>
                    <a href="#" id="nav-memory-public" data-page="memory-public">Public Memory Capsule</a>
                    <a href="#" id="nav-memory-private" data-page="memory-private">Private Memory Capsule</a>
                    <a href="#" id="nav-mail" data-page="mail">Mail</a>
                    <a href="#" id="nav-evaluations" data-page="evaluations">Research Submission</a>
                </div>
            </div>
            <div class="nav-right">
                <span class="station-info">
                    <span class="station-name-label">Station:</span>
                    <select id="station-selector" class="station-dropdown">
                        <!-- Options will be populated dynamically -->
                    </select>
                    <span class="separator">|</span>
                    <span class="end-tick-label">End Tick:</span>
                    <span id="end-tick" class="end-tick-value"></span>
                </span>
            </div>
        </nav>

        <!-- Main Content Area -->
        <div id="content" class="main-content">
            <!-- Content will be dynamically loaded here -->
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script src="js/router.js"></script>
    <script src="js/station-map.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/components/dashboard.js"></script>
    <script src="js/components/agents.js"></script>
    <script src="js/components/evaluations.js"></script>
    <script src="js/components/archive.js"></script>
    <script src="js/components/memory.js"></script>
    <script src="js/components/mail.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
